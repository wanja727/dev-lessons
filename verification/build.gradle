plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.10'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'lab.devlessons'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

// Docker Engine 29 이상과 호환되는 Testcontainers 버전
ext['testcontainers.version'] = '1.21.4'

configurations {
    h2Isolated
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-batch'
    runtimeOnly 'org.postgresql:postgresql'

    // OSIV 레슨 (MockMvc로 요청 범위 확인)
    implementation 'org.springframework.boot:spring-boot-starter-web'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // 테스트와 운영 과정(T3, T4): 안쪽 테스트 클래스를 테스트 안에서 돌려 결과를 센다 (버전은 스프링 부트가 관리)
    testImplementation 'org.junit.platform:junit-platform-testkit'
    // 통합 테스트와 Testcontainers 레슨(T4): H2와 PostgreSQL의 차이를 보인다.
    // 테스트 클래스패스에 두면 스프링 부트가 내장 DB로 자동 설정해 다른 레슨(S4)의 결과가 바뀐다.
    // 그래서 따로 받아 두고 그 테스트만 자기 클래스 로더로 읽는다 (아래 test 태스크의 h2.jar)
    h2Isolated 'com.h2database:h2'

    // AOP와 감사 로그 레슨 (@Aspect)
    implementation 'org.springframework.boot:spring-boot-starter-aop'

    // 실무 레슨 16~25: Redis, Kafka, 회복성 라이브러리
    // 스프링 자동 설정을 켜지 않으려고 스타터 대신 클라이언트 라이브러리만 쓴다 (다른 레슨 테스트에 영향 없음)
    testImplementation 'io.lettuce:lettuce-core'
    testImplementation 'org.apache.kafka:kafka-clients'
    testImplementation 'org.testcontainers:kafka'
    testImplementation 'io.github.resilience4j:resilience4j-circuitbreaker:2.2.0'
    testImplementation 'io.github.resilience4j:resilience4j-retry:2.2.0'

    // 가비지 컬렉션 레슨: 크기가 정해진 캐시 (버전은 스프링 부트가 관리)
    testImplementation 'com.github.ben-manes.caffeine:caffeine'

    // 동적 쿼리 레슨: Querydsl로 쿼리를 자바 코드로 쓴다. Q 클래스는 코드 생성 대신 테스트에 손으로 둔다
    testImplementation 'com.querydsl:querydsl-jpa:5.1.0:jakarta'

    // 스프링 과정 S5, S8: @Validated와 검증 어노테이션(@NotBlank 등)
    testImplementation 'org.springframework.boot:spring-boot-starter-validation'
}

tasks.named('test') {
    useJUnitPlatform()
    def h2 = configurations.h2Isolated
    inputs.files(h2)
    doFirst {
        systemProperty 'h2.jar', h2.singleFile.absolutePath
    }
    testLogging {
        events 'passed', 'failed', 'skipped'
        exceptionFormat 'full'
    }
}
