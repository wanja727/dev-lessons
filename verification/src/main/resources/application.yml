spring:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        # 테스트에서 실제로 나간 SQL을 세기 위해 모든 SQL을 기록한다
        session_factory.statement_inspector: lab.devlessons.support.SqlCapture
        format_sql: false
logging:
  level:
    org.hibernate.SQL: debug
