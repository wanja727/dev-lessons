name: Check questions

# 문제 파일(content/questions)의 형식을 학습 앱 Retrievo의 검사기로 확인한다.
# 검사 규칙은 Retrievo 저장소(wanja727/retrievo)에 하나만 두고 여기서는 내려받아 실행한다.
on:
  push:
    branches: [main]
    paths: ['content/**', '.github/workflows/questions.yml']
  pull_request:
    paths: ['content/**', '.github/workflows/questions.yml']
  workflow_dispatch:
    inputs:
      retrievo_ref:
        description: 검사기를 가져올 Retrievo 저장소의 브랜치
        default: main

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: wanja727/retrievo
          ref: ${{ inputs.retrievo_ref || 'main' }}
          path: retrievo
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: 문제 파일 검사
        run: gradle -p retrievo/backend checkContent --no-daemon -PcontentDir=$GITHUB_WORKSPACE/content/questions

  # main에 들어간 문제 파일을 운영 앱(Retrievo)에 반영한다.
  # Retrievo의 Backend 워크플로가 content-updated 신호를 받아 다시 배포한다 (문제를 이미지에 넣어 시작할 때 가져온다)
  # 토큰 만드는 법: wanja727/retrievo의 docs/deploy.md "문제 파일 자동 배포"
  notify-retrievo:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.RETRIEVO_DISPATCH_TOKEN }}
    steps:
      - name: Retrievo 다시 배포 요청
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::RETRIEVO_DISPATCH_TOKEN이 없어서 건너뛴다. Retrievo에서 Backend 워크플로를 손으로 실행해야 반영된다."
            exit 0
          fi
          gh api repos/wanja727/retrievo/dispatches \
            -f event_type=content-updated \
            -F "client_payload[sha]=$GITHUB_SHA"
          echo "Retrievo에 content-updated를 보냈다 ($GITHUB_SHA)"
