name: Deploy site

on:
  push:
    branches: [main]
    paths: ['site/**', 'verification/**', '.github/workflows/pages.yml']
  pull_request:
    paths: ['site/**', 'verification/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # 검증 테스트를 돌려 실제 출력(CiOutput)을 만들고, 사이트의 /ci/에 넣는다
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.14.3'
      - name: Run verification tests
        working-directory: verification
        run: gradle test --no-daemon
      - name: Copy CI outputs into the site
        run: |
          mkdir -p site/public/ci
          cp verification/build/ci-output/*.json site/public/ci/
          ls site/public/ci
      - uses: withastro/action@v6
        with:
          path: site
  deploy:
    # PR에서는 빌드만 확인하고, 배포는 main에서만
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
