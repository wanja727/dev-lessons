name: Verify lessons

# 레슨의 주장을 테스트로 검증한다 (verification/)
# 검증 코드가 바뀔 때만 돈다. 문서, 문제 파일, 사이트만 고친 변경에서는 건너뛴다
on:
  push:
    branches: [main]
    paths: ["verification/**", ".github/workflows/verify.yml"]
  pull_request:
    paths: ["verification/**", ".github/workflows/verify.yml"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: verification
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.14.3'
      - run: gradle test --no-daemon
