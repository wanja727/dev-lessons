# 스프링 배치 문제
# 형식: https://github.com/wanja727/retrievo/blob/main/docs/content-format.md
#
# 모든 문제는 coreQuestions의 질문 하나에 묶이고(coreQuestion), 답의 근거가 레슨 본문에 있다
# (site/src/content/lesson-pages/spring-batch.yaml의 says).
# 동작에 관한 정답은 verification의 batch/SpringBatchTest와 SpringBatchLessonTest로 확인했다 (스프링 배치 5.2).
# 질문마다 첫 문제는 본문의 예시로 묻고, 둘째 문제는 다른 상황으로 옮겨 묻는다.
# 2026-11-26에 핵심 질문 구조로 다시 썼다. 예전 문제는 지웠다.
subject:
  key: dev
  name: 개발자 면접
lesson:
  key: spring-batch
  title: 스프링 배치
  unit: 스프링
  order: 715
concepts:
  - key: core
    name: 스프링 배치
coreQuestions:
  - key: q1
    text: "스프링 배치는 대량 데이터를 어떤 단위로 처리하나요?"
  - key: q2
    text: "중간에 실패하면 어디부터 다시 하나요?"
  - key: q3
    text: "잘못된 데이터와 이미 끝난 Job은 어떻게 다루나요?"
questions:
  # ── 질문 1 ──
  - key: batch-commits
    concept: core
    coreQuestion: q1
    type: multiple_choice
    status: reviewed
    difficulty: 1
    body: 청크 크기 10인 Step이 25건을 처리해요. writer는 몇 번 불리고 커밋은 몇 번일까요?
    choices:
      - writer 25번, 커밋 25번
      - writer 3번(10, 10, 5건), 커밋 3번
      - writer 1번, 커밋 1번
      - writer 3번, 커밋 1번
    answer: "2"
    explanation: |-
      **writer 3번, 커밋 3번이에요.** 청크 크기만큼 읽고 처리해 모은 뒤 한 번에 쓰고 커밋해요. 청크 하나가 트랜잭션 하나예요.
    source: https://docs.spring.io/spring-batch/reference/step/chunk-oriented-processing.html
  - key: batch-last-chunk
    concept: core
    coreQuestion: q1
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: 청크 크기 100으로 1,050건을 처리해요. writer는 몇 번 불리고, 마지막에는 몇 건을 받을까요?
    choices:
      - 10번, 마지막 150건
      - 11번, 마지막 50건
      - 1,050번, 1건씩
      - 11번, 마지막 100건
    answer: "2"
    explanation: |-
      **11번이고 마지막은 50건이에요.** 100건씩 10번, 남은 50건으로 한 번 더 써요. 커밋도 11번이에요.
    source: https://docs.spring.io/spring-batch/reference/step/chunk-oriented-processing.html
  # ── 질문 2 ──
  - key: batch-fail-rows
    concept: core
    coreQuestion: q2
    type: multiple_choice
    status: reviewed
    difficulty: 1
    body: 청크 크기 10으로 25건을 처리하다 17번째 항목을 처리할 때 예외가 나 Step이 실패했어요. 테이블에 남는 행은 몇 개일까요?
    choices:
      - 0개. 전부 롤백된다
      - 10개. 첫 청크만 커밋되어 남는다
      - 16개. 실패 직전까지 남는다
      - 20개
    answer: "2"
    explanation: |-
      **10개예요.** 1~10 청크는 이미 커밋됐고, 17번이 든 11~20 청크는 통째로 롤백돼요.
    source: https://docs.spring.io/spring-batch/reference/step/chunk-oriented-processing.html
  - key: batch-restart-from
    concept: core
    coreQuestion: q2
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: 청크 크기 100으로 돌다 3,250번째에서 실패했어요. 원인을 고치고 같은 Job 파라미터로 다시 실행하면 몇 번째 항목부터 읽을까요? 리더는 재시작을 지원해요.
    choices:
      - 1번째
      - 3,201번째
      - 3,250번째
      - 3,251번째
    answer: "2"
    explanation: |-
      **3,201번째예요.** 마지막으로 커밋한 청크는 3,101~3,200이고, 리더가 그때 남긴 읽은 개수(3,200)가 메타데이터에 있어요. 같은 파라미터면 같은 JobInstance를 이어 가며 그 다음부터 읽어요.
    source: https://docs.spring.io/spring-batch/reference/step/chunk-oriented-processing/restart.html
  - key: batch-new-params
    concept: core
    coreQuestion: q2
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: 실패한 가져오기 Job을 "그냥 다시" 돌리려고 Job 파라미터의 run 값을 새로 바꿔 실행했어요. 어떻게 될까요?
    choices:
      - 실패한 곳부터 이어 간다
      - 새 JobInstance라 처음부터 다시 읽어, 이미 커밋된 청크가 또 들어간다
      - 실행되지 않는다
      - 실패한 청크만 다시 한다
    answer: "2"
    explanation: |-
      **처음부터 다시 읽어요.** 파라미터가 다르면 새 JobInstance예요. 앞서 커밋된 행이 다시 들어가 중복이 생기거나 기본 키에 걸려요.

      - 이어 가려면 원인을 고치고 같은 파라미터로 다시 실행해요
    source: https://docs.spring.io/spring-batch/reference/step/chunk-oriented-processing/restart.html
  # ── 질문 3 ──
  - key: batch-skip
    concept: core
    coreQuestion: q3
    type: code_predict
    status: reviewed
    difficulty: 1
    body: 아래 Step이 25건을 처리하는데, 그 가운데 3건에서 processor가 IllegalArgumentException을 던져요. 결과는 어떻게 될까요?
    code: |-
      new StepBuilder("skipStep", repo)
          .<Integer, Integer>chunk(10, tx)
          .reader(reader)
          .processor(item -> check(item))
          .writer(chunk -> save(chunk))
          .faultTolerant()
          .skip(IllegalArgumentException.class)
          .skipLimit(5)
          .build();
    choices:
      - 22건 저장, Job 성공
      - 0건 저장, Job 실패
      - 20건 저장, Job 실패
      - 25건 저장, Job 성공
    answer: "1"
    explanation: |-
      **22건이 저장되고 Job은 성공해요.** 3건은 skipLimit 5 안이라 건너뛰고 나머지를 저장해요. 건너뛴 수는 메타데이터에 남아요.
    source: https://docs.spring.io/spring-batch/reference/step/chunk-oriented-processing/configuring-skip.html
  - key: batch-completed
    concept: core
    coreQuestion: q3
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: 어제 성공한 정산 Job을 실수로 같은 날짜 파라미터(date=2026-11-25)로 다시 실행했어요. 어떻게 될까요?
    choices:
      - 처음부터 다시 정산해 금액이 두 배가 된다
      - 실행되지 않는다. 이미 완료된 JobInstance라 JobInstanceAlreadyCompleteException
      - 실패한 부분만 다시 한다
      - 어제 결과를 덮어쓴다
    answer: "2"
    explanation: |-
      **실행되지 않아요.** 같은 Job, 같은 파라미터의 JobInstance가 이미 완료됐으면 다시 실행할 수 없어요. 이중 정산을 막아 줘요.

      - 그래서 매일 도는 Job은 날짜를 파라미터로 넣어 날마다 새 Instance를 만들어요
    source: https://docs.spring.io/spring-batch/reference/step/chunk-oriented-processing/restart.html
  # ── 전체 ──
  - key: batch-interview
    concept: core
    coreQuestion: all
    type: descriptive
    status: reviewed
    difficulty: 2
    body: 면접에서 "스프링 배치의 청크 처리와 재시작을 설명해 주세요"라는 질문을 받았어요. 1분 안에 답해 보세요.
    explanation: |-
      **청크마다 커밋하고, 메타데이터에 남긴 지점부터 다시 시작해요.**

      - **청크:** reader로 읽고 processor로 처리해 청크 크기만큼 모아 writer로 쓰고 커밋한다. 청크 하나가 트랜잭션 하나
      - **실패:** 실패한 청크만 롤백되고 앞의 청크는 남는다
      - **재시작:** JobRepository의 메타데이터에 커밋까지 읽은 개수가 남아, 같은 파라미터로 다시 실행하면 그 다음부터 읽는다
      - **그 밖:** 잘못된 데이터는 skip, 일시적 오류는 retry, 완료된 JobInstance는 같은 파라미터로 다시 돌지 않는다
    checklist:
      - 청크 크기만큼 모아 쓰고 청크마다 커밋한다고 말했다
      - 실패하면 실패한 청크만 롤백된다고 말했다
      - 메타데이터(JobRepository)로 같은 파라미터의 재시작이 이어 간다고 말했다
      - skip이나 완료된 JobInstance의 재실행 제한을 말했다
    source: https://docs.spring.io/spring-batch/reference/step/chunk-oriented-processing.html
