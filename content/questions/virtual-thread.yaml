# 가상 스레드 문제
# 형식: https://github.com/wanja727/retrievo/blob/main/docs/content-format.md
#
# 모든 문제는 coreQuestions의 질문 하나에 묶이고(coreQuestion), 답의 근거가 레슨 본문에 있다
# (site/src/content/lesson-pages/virtual-thread.yaml의 says).
# 동작에 관한 정답은 verification의 virtualthread/VirtualThreadTest로 확인했다 (자바 21).
# 스프링 부트 설정은 스프링 부트 문서가 근거다.
# 질문마다 첫 문제는 본문의 예시로 묻고, 둘째 문제는 다른 상황으로 옮겨 묻는다.
# 2026-11-25에 검수해 reviewed로 바꿨다.
subject:
  key: dev
  name: 개발자 면접
lesson:
  key: virtual-thread
  title: 가상 스레드
  unit: 운영체제와 동시성
  order: 412
concepts:
  - key: core
    name: 가상 스레드
coreQuestions:
  - key: q1
    text: "가상 스레드는 플랫폼 스레드와 무엇이 다른가요?"
  - key: q2
    text: "가상 스레드가 블로킹 호출을 만나면 무슨 일이 생기나요?"
  - key: q3
    text: "가상 스레드에 맞는 일과 맞지 않는 일은 무엇인가요?"
questions:
  # ── 질문 1 ──
  - key: vt-is-virtual
    concept: core
    coreQuestion: q1
    type: code_predict
    status: reviewed
    difficulty: 1
    body: 아래 코드가 출력하는 값은?
    code: |-
      Thread.ofVirtual().start(() ->
        System.out.println(
          Thread.currentThread().isVirtual()));
    choices:
      - "true"
      - "false"
      - 컴파일 오류
      - 아무것도 출력하지 않는다
    answer: "1"
    explanation: |-
      **true예요.** Thread.ofVirtual()로 만든 스레드는 가상 스레드라 isVirtual()이 true예요.

      - 출력하면 VirtualThread[#N]/runnable@ForkJoinPool-1-worker-N처럼 올라탄 캐리어가 보여요
      - 검증: VirtualThreadTest.manyVirtualThreads
    source: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/lang/Thread.html
  - key: vt-os-threads
    concept: core
    coreQuestion: q1
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: 코어 8개 기계에서 가상 스레드 1만 개가 계산 없이 응답을 기다리고 있어요. 운영체제가 보는 이 JVM의 스레드는 가상 스레드 때문에 대략 몇 개 늘었을까요?
    choices:
      - 1만 개
      - 캐리어 수 정도(코어 수만큼)
      - 0개. 가상 스레드는 스레드가 아니다
      - 5000개
    answer: "2"
    explanation: |-
      **캐리어 수 정도예요.** 가상 스레드는 JVM 안의 객체이고, 운영체제는 캐리어인 플랫폼 스레드(코어 수만큼의 ForkJoinPool)만 봐요.
    source: https://openjdk.org/jeps/444
  # ── 질문 2 ──
  - key: vt-2000-tasks
    concept: core
    coreQuestion: q2
    type: multiple_choice
    status: reviewed
    difficulty: 1
    body: 100ms 기다리는 작업 2000개를 플랫폼 스레드 100개 풀과, newVirtualThreadPerTaskExecutor로 각각 돌려요. 걸리는 시간으로 맞는 것은?
    choices:
      - 둘 다 2초쯤
      - 풀은 2초쯤, 가상 스레드는 0.2초 안팎
      - 둘 다 0.2초쯤
      - 가상 스레드가 더 느리다
    answer: "2"
    explanation: |-
      **풀은 2초쯤, 가상 스레드는 0.2초 안팎이에요.** 풀은 100개씩 스무 번 기다리고, 가상 스레드는 기다리는 동안 캐리어를 내려놓아 2000개가 함께 기다려요.

      - 검증: VirtualThreadTest.blockingTasksOnVirtualThreads
    source: https://openjdk.org/jeps/444
  - key: vt-carrier-free
    concept: core
    coreQuestion: q2
    type: ox
    status: reviewed
    difficulty: 2
    body: "\"가상 스레드가 소켓에서 응답을 기다리는 동안에도 그 가상 스레드를 실행하던 캐리어는 함께 기다려야 한다\""
    answer: X
    explanation: |-
      **틀렸어요.** 블로킹 호출을 만나면 가상 스레드는 캐리어에서 내려오고, 캐리어는 다른 가상 스레드를 실행해요. 답이 오면 아무 캐리어에나 다시 올라타요.

      - 자바 21에서 synchronized 안에서 기다릴 때는 예외로 캐리어에 고정돼요
    source: https://openjdk.org/jeps/444
  # ── 질문 3 ──
  - key: vt-pinning
    concept: core
    coreQuestion: q3
    type: code_predict
    status: reviewed
    difficulty: 1
    body: 자바 21에서 캐리어를 하나로 줄인 JVM이에요. 가상 스레드 둘이 각자 다른 락으로 아래 코드를 동시에 실행해요. 둘 다 끝나는 데 대략 얼마나 걸릴까요?
    code: |-
      synchronized (myLock) {
        Thread.sleep(200);
      }
    choices:
      - 200ms쯤
      - 400ms쯤
      - 바로
      - 끝나지 않는다
    answer: "2"
    explanation: |-
      **400ms쯤이에요.** 자바 21에서 synchronized 안에서 블로킹하면 가상 스레드가 캐리어에 고정돼 내려오지 못해요. 캐리어가 하나라 둘이 하나씩 실행돼요.

      - ReentrantLock이면 내려와서 200ms 남짓이에요. 자바 24부터는 synchronized도 내려와요
      - 검증: VirtualThreadTest.synchronizedPinsTheCarrier
    source: https://docs.oracle.com/en/java/javase/21/core/virtual-threads.html
  - key: vt-cpu-bound
    concept: core
    coreQuestion: q3
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: 코어 8개 기계에서 이미지 크기를 바꾸는 계산 작업 100개를, 플랫폼 스레드 8개 풀에서 가상 스레드로 바꿨어요. 결과로 맞는 것은?
    choices:
      - 12배쯤 빨라진다
      - 빨라지지 않는다. 계산은 코어 수만큼만 동시에 한다
      - 느려져서 쓸 수 없다
      - 8배쯤 빨라진다
    answer: "2"
    explanation: |-
      **빨라지지 않아요.** 가상 스레드는 기다림을 덜어 줄 뿐이고, 계산은 여전히 코어 수만큼만 동시에 실행돼요.

      - 가상 스레드가 맞는 일은 입출력을 기다리는 시간이 긴 일이에요
    source: https://openjdk.org/jeps/444
  - key: vt-db-pool
    concept: core
    coreQuestion: q3
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: 스프링 부트에서 spring.threads.virtual.enabled=true로 바꾼 뒤 동시 요청이 2000개까지 들어와요. 요청마다 DB를 쓰는데 HikariCP 커넥션 풀은 10개예요. 요청들은 주로 어디서 기다릴까요?
    choices:
      - 톰캣 스레드 200개가 모자라 톰캣에서 기다린다
      - 커넥션 풀에서 커넥션을 기다린다
      - 기다리지 않는다
      - 가상 스레드를 만드는 데서 기다린다
    answer: "2"
    explanation: |-
      **커넥션 풀에서 기다려요.** 가상 스레드로 요청 스레드의 한계는 사라지지만 커넥션 풀은 그대로라 병목이 옮겨 가요.

      - 풀 크기와 DB가 감당할 수를 함께 정해요
    source: https://docs.spring.io/spring-boot/reference/features/spring-application.html#features.spring-application.virtual-threads
  # ── 세 질문을 하나로 ──
  - key: vt-interview
    concept: core
    coreQuestion: all
    type: descriptive
    status: reviewed
    difficulty: 2
    body: 면접에서 "가상 스레드가 무엇이고 언제 쓰는지 설명해 주세요"라는 질문을 받았어요. 1분 안에 답해 보세요.
    explanation: |-
      **JVM이 관리하는 가벼운 스레드로, 블로킹할 때 캐리어를 내려놓아 기다리는 일이 많은 서버에 맞아요.**

      - **차이:** 플랫폼 스레드는 운영체제 스레드에 하나씩, 가상 스레드는 캐리어 위에 번갈아 올라탄다. 수십만 개도 된다
      - **블로킹:** 기다리면 캐리어에서 내려오고 캐리어는 다른 일을 한다. 코드는 동기 그대로
      - **맞지 않는 일:** 계산 중심. 자바 21의 synchronized 안 블로킹은 고정된다(ReentrantLock으로)
      - **실무:** 풀에 모으지 않고 세마포어로 제한. 스프링 부트 설정 한 줄, 병목은 커넥션 풀로
    checklist:
      - 캐리어 위에 올라타는 가벼운 스레드라고 말했다
      - 블로킹할 때 캐리어를 내려놓는다고 말했다
      - 입출력 중심에 맞고 계산 중심에는 효과가 없다고 말했다
      - synchronized 고정(pinning)이나 풀에 모으지 않는 것을 말했다
      - 스프링 부트 설정이나 커넥션 풀 병목을 말했다
    source: https://openjdk.org/jeps/444
