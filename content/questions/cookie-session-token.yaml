questions:
  # ── 질문 1. 쿠키는 무엇이고 왜 필요한가요? ──
  - key: cst-cookie-roundtrip
    concept: core
    coreQuestion: q1
    type: code_predict
    status: reviewed
    difficulty: 1
    body: 브라우저가 아래 응답을 받았어요. 같은 사이트로 보내는 다음 요청에 브라우저가 넣는 헤더는 무엇일까요?
    code: |-
      HTTP/1.1 200 OK
      Set-Cookie: theme=dark
    choices:
      - "Set-Cookie: theme=dark"
      - "Cookie: theme=dark"
      - "Authorization: theme=dark"
      - 아무 헤더도 넣지 않는다
    answer: "2"
    explanation: |-
      **`Cookie: theme=dark`예요.** 브라우저가 받은 값을 Cookie 헤더에 넣어 돌려보내요.

      - 서버가 Set-Cookie로 준 값을 브라우저가 저장해요
      - 그 사이트로 가는 요청마다 브라우저가 자동으로 Cookie 헤더에 넣어요
      - Set-Cookie는 서버가 응답에 넣는 헤더예요
    source: https://www.rfc-editor.org/rfc/rfc6265.html
  - key: cst-cookie-edited
    concept: core
    coreQuestion: q1
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: "어떤 영상 사이트의 서버는 로그인한 사용자에게 Set-Cookie: grade=BASIC을 줘요. 그 뒤로는 요청의 Cookie 헤더에 든 grade 값만 보고, 값이 PREMIUM이면 유료 영상을 보여 줘요. 서버가 따로 저장하거나 확인하는 것은 없어요. 사용자가 개발자 도구로 쿠키를 grade=PREMIUM으로 고친 뒤 유료 영상을 요청하면 어떻게 될까요?"
    choices:
      - 거부된다. 브라우저는 서버가 준 값과 다른 쿠키를 보내지 않는다
      - 거부된다. 서버는 자기가 BASIC을 줬다는 것을 기억한다
      - 유료 영상이 보인다. 서버는 받은 값이 고친 것인지 구별하지 못한다
      - 쿠키가 지워져서 로그인하지 않은 요청이 된다
    answer: "3"
    explanation: |-
      **유료 영상이 보여요.** 서버는 받은 값이 자기가 준 그대로인지 고친 것인지 구별하지 못해요.

      - 쿠키는 브라우저에 저장돼서 사용자가 값을 보고 고칠 수 있어요
      - 브라우저는 고친 값을 그대로 Cookie 헤더에 넣어 보내요
      - 이 서버는 쿠키의 값만 보니 PREMIUM으로 처리해요. 그래서 서버가 믿어야 하는 값을 쿠키에 그대로 담으면 안 돼요
    source: https://www.rfc-editor.org/rfc/rfc6265.html
  # ── 질문 2. 세션 방식은 어떻게 로그인 상태를 유지하나요? ──
  - key: cst-session-logout
    concept: core
    coreQuestion: q2
    type: code_predict
    status: reviewed
    difficulty: 1
    body: "세션 방식의 서버예요. 세션 저장소에 abc123 → kim이 들어 있었는데, kim이 로그아웃해서 서버가 이 세션을 지웠어요. 브라우저에는 쿠키가 지워지지 않고 남아 있어서 아래 요청이 갔어요. 서버는 어떻게 처리할까요?"
    code: |-
      GET /me HTTP/1.1
      Cookie: JSESSIONID=abc123
    choices:
      - kim의 요청으로 처리한다. 쿠키가 남아 있다
      - 로그인하지 않은 요청으로 처리한다
      - 세션을 새로 만들어 kim의 요청으로 처리한다
      - 쿠키에서 사용자 이름을 읽어 kim의 요청으로 처리한다
    answer: "2"
    explanation: |-
      **로그인하지 않은 요청으로 처리해요.** 저장소에 abc123으로 찾을 정보가 없기 때문이에요.

      - 쿠키에는 세션 ID만 있어요. 누구인지는 서버의 저장소에 있어요
      - 서버는 요청마다 세션 ID로 저장소를 찾아봐요. 세션을 지웠으니 찾지 못해요
      - 번호만으로는 누구의 세션이었는지 알 수 없어서 새로 만들어 줄 수도 없어요
    source: https://jakarta.ee/specifications/servlet/6.0/jakarta-servlet-spec-6.0
  - key: cst-session-restart
    concept: core
    coreQuestion: q2
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: 사내 게시판은 서버 한 대로 돌아가고, 세션을 서버의 메모리에만 둬요. 파일이나 다른 저장소에는 남기지 않아요. lee가 로그인해서 글을 쓰는 동안, 새 버전을 배포하느라 서버를 껐다 켰어요. lee의 브라우저에는 세션 ID 쿠키가 그대로 있어요. lee의 다음 요청은 어떻게 될까요?
    choices:
      - 로그인하지 않은 요청으로 처리된다
      - lee의 요청으로 처리된다. 쿠키에 로그인 정보가 들어 있다
      - lee의 요청으로 처리된다. 서버가 쿠키의 세션 ID를 보고 세션을 되살린다
      - 요청이 가지 않는다. 브라우저가 서버가 다시 켜진 것을 알고 쿠키를 지운다
    answer: "1"
    explanation: |-
      **로그인하지 않은 요청으로 처리돼요.** 메모리에 있던 세션이 서버를 끌 때 사라졌기 때문이에요.

      - 로그인 정보는 쿠키가 아니라 서버의 저장소에 있어요. 그 저장소가 메모리였어요
      - 다시 켠 서버의 메모리에는 lee의 세션 ID가 없어요
      - 세션을 모든 서버가 함께 쓰는 저장소에 두면 서버를 다시 켜도, 요청이 다른 서버로 가도 찾을 수 있어요
    source: https://jakarta.ee/specifications/servlet/6.0/jakarta-servlet-spec-6.0
  - key: cst-spring-session-param
    concept: core
    coreQuestion: q2
    type: code_predict
    status: reviewed
    difficulty: 2
    body: "스프링 MVC 컨트롤러에 아래 메서드가 있어요. 세션은 톰캣의 기본 설정 그대로예요. 로그인한 적이 없는 방문자가 쿠키 없이 GET /notice/count를 처음 불렀어요. 응답은 어떻게 될까요?"
    code: |-
      @GetMapping("/notice/count")
      String count(HttpSession session) {
        Object user = session.getAttribute("user");
        return user == null ? "0" : "5";
      }
    choices:
      - 0을 돌려주고, 세션은 만들어지지 않는다. 세션에 값을 넣지 않았다
      - 0을 돌려주고, 새 세션이 만들어져 응답에 JSESSIONID 쿠키가 붙는다
      - 401을 돌려준다. 세션이 없는 요청이다
      - 예외가 난다. session에 null이 들어온다
    answer: "2"
    explanation: |-
      **0을 돌려주고, 새 세션이 만들어져 JSESSIONID 쿠키가 붙어요.** 스프링은 HttpSession 파라미터에 넣을 세션이 없으면 새로 만들어서 주기 때문이에요.

      - 그래서 session에 null이 오는 일이 없고, 값을 넣지 않아도 서버에 빈 세션이 생겨요
      - 로그인하지 않은 방문자가 올 때마다 세션이 쌓여요
      - 읽기만 할 때는 @SessionAttribute(required = false)나 request.getSession(false)로 받아요. 세션이 없으면 만들지 않아요
    source: https://docs.spring.io/spring-framework/reference/web/webmvc/mvc-controller/ann-methods/arguments.html
  # ── 질문 3. 토큰(JWT) 방식은 어떻게 다른가요? ──
  - key: cst-jwt-tamper
    concept: core
    coreQuestion: q3
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: 사용자가 받은 JWT의 페이로드에서 role을 USER에서 ADMIN으로 바꾸고, 서명 부분은 그대로 둔 채 서버에 보냈어요. 서버는 받은 토큰의 서명과 만료 시간을 확인해요. 만료 시간은 지나지 않았어요. 서버는 어떻게 처리할까요?
    choices:
      - ADMIN 권한으로 처리한다
      - 서명이 내용과 맞지 않아 거부한다
      - 저장소에서 원래 role을 찾아 USER로 처리한다
      - 페이로드를 읽을 수 없어 거부한다
    answer: "2"
    explanation: |-
      **서명이 맞지 않아 거부해요.**

      - 서명은 서버만 아는 키로 헤더와 페이로드를 계산해 만든 값이에요
      - 서버는 받은 헤더와 페이로드로 서명을 다시 계산해요. 페이로드가 바뀌었으니 토큰에 붙어 온 서명과 달라요
      - 사용자는 키를 몰라서 맞는 서명을 새로 만들 수 없어요
    source: https://www.rfc-editor.org/rfc/rfc7519.html
  - key: cst-jwt-readable
    concept: core
    coreQuestion: q3
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: 어떤 배달 앱이 서명만 한 JWT의 페이로드에 사용자의 전화번호를 넣었어요. 서명 키를 모르는 사람이 이 토큰을 손에 넣었어요. 이 사람이 전화번호에 대해 할 수 있는 일은 무엇일까요? 서버는 요청마다 서명을 확인해요.
    choices:
      - 읽을 수도 없고, 다른 번호로 바꿔서 서버를 통과할 수도 없다
      - 읽을 수 없지만, 다른 번호로 바꿔서 서버를 통과할 수 있다
      - 읽을 수 있고, 다른 번호로 바꿔서 서버를 통과할 수도 있다
      - 읽을 수 있지만, 다른 번호로 바꿔서 서버를 통과할 수는 없다
    answer: "4"
    explanation: |-
      **읽을 수 있지만 바꿔서 통과할 수는 없어요.** 페이로드는 암호화한 것이 아니라 인코딩한 것이에요.

      - 인코딩은 누구나 되돌릴 수 있어요. 키가 없어도 페이로드를 읽어요
      - 서명은 내용을 숨기지 않아요. 내용이 바뀌지 않았는지 확인할 뿐이에요. 번호를 바꾸면 서명이 맞지 않아 거부돼요
      - 그래서 토큰에는 비밀번호나 개인 정보를 넣지 않아요
    source: https://www.rfc-editor.org/rfc/rfc7519.html
  # ── 질문 4. 두 방식은 각각 무엇을 얻고 무엇을 잃나요? ──
  - key: cst-cmp-two-servers
    concept: core
    coreQuestion: q4
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: 서버 A와 B가 같은 서명 키를 가지고 있고, 두 서버가 함께 쓰는 저장소는 없어요. 서버는 서명과 만료 시간만 확인해요. A에서 로그인해 받은 만료 전의 JWT로 B에 요청하면 어떻게 될까요?
    choices:
      - B는 그 토큰을 준 적이 없어서 거부한다
      - B가 A에게 토큰이 맞는지 물어본 뒤 통과시킨다
      - B가 서명을 확인해서 로그인된 요청으로 처리한다
      - B에서 로그인해 토큰을 다시 받아야 한다
    answer: "3"
    explanation: |-
      **B가 서명을 확인해서 통과시켜요.**

      - 토큰이 맞는지는 서명 키만 있으면 확인할 수 있어요. 누가 준 토큰인지 저장해 둘 필요가 없어요
      - 세션 방식이었다면 A의 메모리에만 세션이 있어서 B는 찾지 못해요
    source: https://www.rfc-editor.org/rfc/rfc7519.html
  - key: cst-cmp-disabled
    concept: core
    coreQuestion: q4
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: 사내 도구가 JWT를 써요. 토큰은 받은 때부터 8시간 뒤에 만료돼요. 서버는 서명과 만료 시간만 확인하고, 막을 토큰을 따로 저장해 두지 않아요. 한 직원이 오전 10시에 로그인해 토큰을 받았고, 오전 11시에 인사팀이 DB에서 이 직원의 계정을 비활성화했어요. 오후 2시에 이 토큰으로 온 요청은 어떻게 될까요?
    choices:
      - 거부된다. 계정이 비활성화되어 있다
      - 통과한다. 서명이 맞고 만료 전이다
      - 거부된다. 계정 상태가 바뀌어서 서명이 맞지 않는다
      - 거부된다. 계정을 비활성화할 때 토큰도 지워졌다
    answer: "2"
    explanation: |-
      **통과해요.** 서명이 맞고, 만료 시간인 오후 6시가 되지 않았기 때문이에요.

      - 이 서버는 서명과 만료 시간만 봐요. DB의 계정 상태는 보지 않아요
      - 토큰은 직원의 손에 있어서 서버가 지울 수 없어요. DB를 바꿔도 토큰의 내용과 서명은 그대로예요
      - 그래서 JWT는 만료 시간을 짧게 잡아요. 만료 전에 막으려면 막을 토큰을 서버에 저장해 두고 요청마다 확인해야 해요
    source: https://www.rfc-editor.org/rfc/rfc7519.html
  # ── 네 질문을 하나로 ──
  - key: cst-interview
    concept: core
    coreQuestion: all
    type: descriptive
    status: reviewed
    difficulty: 2
    body: 면접에서 "쿠키, 세션, 토큰(JWT)의 차이를 설명해 주세요"라는 질문을 받았어요. 1분 안에 답해 보세요.
    explanation: |-
      **쿠키는 값을 실어 보내는 수단이고, 세션과 JWT는 그 값으로 로그인 상태를 유지하는 두 가지 방식이에요.**

      - **쿠키:** 서버가 Set-Cookie로 준 값을 브라우저가 저장했다가 요청마다 자동으로 보낸다
      - **세션:** 로그인 정보는 서버가 저장하고, 브라우저에는 그 정보를 찾는 세션 ID만 준다
      - **JWT:** 로그인 정보를 서명한 토큰에 담아 클라이언트에 주고, 서버는 서명과 만료 시간만 확인한다
      - **차이:** 세션은 서버가 바로 끊을 수 있지만 서버들이 저장소를 함께 써야 한다. JWT는 저장소가 필요 없지만 만료 전에는 막기 어렵다
    checklist:
      - 쿠키는 서버가 준 값을 브라우저가 요청마다 자동으로 보내는 것이라고 말했다
      - 세션 방식은 로그인 정보를 서버가 저장하고 브라우저에는 세션 ID만 준다고 말했다
      - JWT 방식은 로그인 정보를 서명한 토큰에 담아 클라이언트에 준다고 말했다
      - 세션은 바로 끊을 수 있지만 서버들이 저장소를 함께 써야 한다고 말했다
      - JWT는 저장소가 필요 없지만 만료 전에는 막기 어렵다고 말했다
    source: https://www.rfc-editor.org/rfc/rfc7519.html
