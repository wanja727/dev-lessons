# 서블릿과 톰캣 문제
# 형식: https://github.com/wanja727/retrievo/blob/main/docs/content-format.md
#
# 모든 문제는 coreQuestions의 질문 하나에 묶이고(coreQuestion), 답의 근거가 레슨 본문에 있다
# (site/src/content/lesson-pages/servlet-tomcat.yaml의 says).
# 동작에 관한 정답은 verification의 ServletTomcatTest로 확인했다 (자바 21, 스프링 부트 3.5).
# 질문마다 첫 문제는 본문의 예시로 묻고, 둘째 문제는 다른 상황으로 옮겨 묻는다.
subject:
  key: dev
  name: 개발자 면접
lesson:
  key: servlet-tomcat
  title: 서블릿과 톰캣
  unit: 스프링
  order: 701
concepts:
  - key: core
    name: 서블릿과 톰캣
coreQuestions:
  - key: q1
    text: "서블릿 컨테이너는 무슨 일을 하나요?"
  - key: q2
    text: "요청 하나는 어느 스레드에서 처리되나요?"
  - key: q3
    text: "스레드가 모두 바쁘면 새 요청은 어떻게 되나요?"
  - key: q4
    text: "서블릿 객체는 요청마다 새로 만들어지나요?"
questions:
  # ── 질문 1 ──
  - key: st-dispatcher
    concept: core
    coreQuestion: q1
    type: multiple_choice
    status: draft
    difficulty: 1
    body: 스프링 부트 웹 앱에 컨트롤러가 세 개 있어요. GET /orders/7과 POST /members 요청은 각각 어느 서블릿이 받을까요?
    choices:
      - 컨트롤러마다 서블릿이 하나씩 있어서 서로 다른 서블릿이 받는다
      - 둘 다 DispatcherServlet이 받는다
      - 톰캣이 서블릿 없이 컨트롤러를 바로 부른다
      - GET은 DispatcherServlet, POST는 톰캣의 기본 서블릿이 받는다
    answer: "2"
    explanation: |-
      **둘 다 DispatcherServlet이 받아요.** 스프링 MVC는 서블릿을 하나만 모든 경로(/)에 등록하고, 그 서블릿이 컨트롤러 메서드를 골라 불러요.

      - 컨트롤러는 서블릿이 아니라 DispatcherServlet이 부르는 보통 객체예요
    source: https://docs.spring.io/spring-framework/reference/web/webmvc/mvc-servlet.html
  - key: st-container-role
    concept: core
    coreQuestion: q1
    type: multiple_choice
    status: draft
    difficulty: 2
    body: 다음 가운데 서블릿 컨테이너(톰캣)가 하는 일이 아닌 것은 무엇일까요?
    choices:
      - 포트를 열고 연결을 받는다
      - 들어온 바이트를 HTTP 요청으로 해석한다
      - HttpServletRequest 객체를 만든다
      - 요청 경로에 맞는 @GetMapping 메서드를 고른다
    answer: "4"
    explanation: |-
      **@GetMapping 메서드를 고르는 것은 스프링의 DispatcherServlet이에요.** 톰캣은 연결을 받고 HTTP를 읽어 요청 객체를 만든 뒤, 등록된 서블릿에 넘길 뿐이에요.

      - 컨테이너는 모든 웹 앱이 똑같이 해야 하는 일을 맡아요
      - 개발자는 요청을 처리하는 코드만 써요
    source: https://jakarta.ee/specifications/servlet/6.0/jakarta-servlet-spec-6.0
  # ── 질문 2 ──
  - key: st-concurrent-threads
    concept: core
    coreQuestion: q2
    type: multiple_choice
    status: draft
    difficulty: 1
    body: 사용자 둘이 같은 순간에 GET /orders/1과 GET /orders/2를 보냈어요. 스프링 부트의 내장 톰캣에서 두 요청의 컨트롤러는 어떻게 실행될까요?
    choices:
      - 한 스레드가 하나를 끝낸 뒤 다른 하나를 처리한다
      - 서로 다른 스레드에서 함께 처리된다
      - 요청마다 새 프로세스가 떠서 처리한다
      - 두 번째 요청은 거절된다
    answer: "2"
    explanation: |-
      **서로 다른 스레드에서 함께 처리돼요.** 톰캣은 요청마다 스레드 풀의 스레드 하나를 내줘요.

      - 스레드 이름은 http-nio-포트-exec-번호 꼴이에요
      - 스레드는 요청마다 만들지 않고 풀에서 빌려 쓰고 돌려줘요
    source: https://docs.spring.io/spring-boot/appendix/application-properties/index.html
  - key: st-threadlocal
    concept: core
    coreQuestion: q2
    type: multiple_choice
    status: draft
    difficulty: 2
    body: 필터에서 ThreadLocal에 요청 id를 넣었어요. 같은 요청의 서비스 메서드가 이 값을 읽으면 어떻게 될까요? 그 서비스가 일을 new Thread(...)로 만든 새 스레드에 맡기고, 새 스레드에서 읽으면 어떻게 될까요?
    choices:
      - 서비스에서는 읽히고, 새 스레드에서는 읽히지 않는다
      - 둘 다 읽힌다
      - 둘 다 읽히지 않는다
      - 서비스에서는 읽히지 않고, 새 스레드에서는 읽힌다
    answer: "1"
    explanation: |-
      **서비스에서는 읽히고 새 스레드에서는 읽히지 않아요.** 요청 하나는 필터부터 서비스까지 같은 스레드에서 돌고, ThreadLocal은 스레드마다 따로 값을 가져요.

      - 그래서 스프링은 트랜잭션과 로그인 정보를 ThreadLocal에 둬요
      - 다른 스레드로 넘기면 이 값은 따라가지 않아요
    source: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/lang/ThreadLocal.html
  # ── 질문 3 ──
  - key: st-pool-four
    concept: core
    coreQuestion: q3
    type: multiple_choice
    status: draft
    difficulty: 1
    body: server.tomcat.threads.max=2인 앱에 1초 걸리는 요청 4개를 동시에 보냈어요. 네 번째 요청은 약 몇 초에 응답할까요?
    choices:
      - 약 1초
      - 약 2초
      - 약 4초
      - 응답하지 않고 에러가 난다
    answer: "2"
    explanation: |-
      **약 2초예요.** 스레드 두 개가 앞의 두 요청을 1초 동안 처리하고, 나머지 두 요청은 기다렸다가 풀린 스레드에서 다음 1초 동안 처리돼요.

      - 기다리는 요청은 에러가 나지 않아요. 연결은 이미 받아 둔 상태예요
    source: https://docs.spring.io/spring-boot/appendix/application-properties/index.html
  - key: st-slow-api
    concept: core
    coreQuestion: q3
    type: multiple_choice
    status: draft
    difficulty: 3
    body: 스레드 200개(기본값)인 서버에서 외부 API가 갑자기 30초씩 걸리기 시작했어요. 그 API를 부르는 요청이 초당 10개씩 들어와요. 외부 API를 부르지 않는 다른 요청은 언제쯤부터 기다리게 될까요?
    choices:
      - 기다리지 않는다. CPU가 한가하다
      - 약 3초 뒤
      - 약 20초 뒤
      - 약 30초 뒤
    answer: "3"
    explanation: |-
      **약 20초 뒤예요.** 외부 API를 부른 요청은 응답을 기다리는 30초 동안 스레드를 잡고 있어요. 초당 10개씩 잡히니 20초면 200개가 모두 잡혀요.

      - 기다리기만 해도 스레드는 쓰이고 있는 거예요
      - 그 뒤로 들어온 요청은 빨리 끝날 일이어도 줄을 서요
    source: https://docs.spring.io/spring-boot/appendix/application-properties/index.html
  - key: st-read-timeout
    concept: core
    coreQuestion: q3
    type: multiple_choice
    status: draft
    difficulty: 2
    body: 외부 결제 API를 부르는 RestClient에 읽기 타임아웃 2초를 줬어요(JdkClientHttpRequestFactory.setReadTimeout). 결제 서버가 멈춰 응답을 주지 않으면, 이 호출을 한 톰캣 스레드는 얼마 동안 묶일까요?
    choices:
      - 결제 서버가 응답할 때까지 끝없이
      - 약 2초. 그 뒤 예외가 나고 스레드가 풀린다
      - 20초. 톰캣의 connection-timeout을 따른다
      - 묶이지 않는다. RestClient는 다른 스레드에서 돈다
    answer: "2"
    explanation: |-
      **약 2초예요.** 읽기 타임아웃이 지나면 ResourceAccessException이 나고, 요청을 처리하던 톰캣 스레드는 그 예외를 처리하고 풀려요.

      - 타임아웃이 없으면 상대가 멈춘 동안 스레드도 함께 멈춰요
      - connection-timeout은 클라이언트가 톰캣에 연결한 뒤 요청을 보내기까지 기다리는 시간이라 상관없어요
    source: https://docs.spring.io/spring-framework/reference/integration/rest-clients.html
  # ── 질문 4 ──
  - key: st-servlet-count
    concept: core
    coreQuestion: q4
    type: multiple_choice
    status: draft
    difficulty: 1
    body: 톰캣에 등록한 서블릿 하나에 요청 100개가 왔어요. init과 service는 각각 몇 번 불렸을까요?
    choices:
      - init 100번, service 100번
      - init 1번, service 100번
      - init 1번, service 1번
      - init 0번, service 100번
    answer: "2"
    explanation: |-
      **init 1번, service 100번이에요.** 서블릿 객체는 하나만 만들어져서 init은 처음 한 번 불리고, service는 요청마다 불려요.

      - destroy는 앱이 끝날 때 한 번 불려요
    source: https://jakarta.ee/specifications/servlet/6.0/jakarta-servlet-spec-6.0
  - key: st-servlet-field
    concept: core
    coreQuestion: q4
    type: code_predict
    status: draft
    difficulty: 2
    body: 아래 서블릿에 kim과 lee가 거의 동시에 요청했어요. 무슨 일이 생길 수 있을까요?
    code: |-
      public class GreetingServlet
          extends HttpServlet {
        private String currentUser;

        protected void doGet(
            HttpServletRequest req,
            HttpServletResponse res)
            throws IOException {
          currentUser = req.getParameter("user");
          audit();
          res.getWriter().write(
              "안녕하세요 " + currentUser);
        }
      }
    choices:
      - 아무 문제 없다. 요청마다 서블릿 객체가 새로 만들어진다
      - kim이 "안녕하세요 lee"를 받을 수 있다
      - 두 번째 요청은 첫 요청이 끝날 때까지 doGet에 들어가지 못한다
      - 컴파일 오류가 난다
    answer: "2"
    explanation: |-
      **kim이 "안녕하세요 lee"를 받을 수 있어요.** 서블릿 객체는 하나이고 두 요청 스레드가 같은 객체의 doGet을 동시에 불러요. currentUser 필드도 하나라서 lee의 요청이 덮어쓸 수 있어요.

      - currentUser를 doGet 안의 지역 변수로 바꾸면 스레드마다 따로라 안전해요
      - 스프링의 컨트롤러와 서비스도 기본으로 하나라서 같은 문제가 생겨요
    source: https://jakarta.ee/specifications/servlet/6.0/jakarta-servlet-spec-6.0
  # ── 전체 ──
  - key: st-interview
    concept: core
    coreQuestion: all
    type: descriptive
    status: draft
    difficulty: 2
    body: 면접에서 "스프링 부트 앱에서 요청 하나가 처리되는 동안 톰캣은 무엇을 하나요?"라는 질문을 받았어요. 1분 안에 답해 보세요.
    explanation: |-
      **톰캣이 연결을 받고 요청을 스레드 하나에 맡겨 DispatcherServlet을 부르고, 스레드가 모자라면 요청은 기다려요.**

      - **컨테이너:** 연결을 받고 HTTP를 읽어 요청 객체와 응답 객체를 만들고 서블릿을 부른다. 스프링 MVC는 DispatcherServlet 하나를 모든 경로에 등록한다
      - **스레드:** 요청 하나를 스레드 풀의 스레드 하나가 응답까지 맡는다. 그래서 스프링은 요청 정보를 ThreadLocal에 둔다
      - **바쁠 때:** 스레드(기본 200)가 모두 바쁘면 새 요청은 기다린다. 느린 외부 호출에는 타임아웃을 둔다
      - **객체 하나:** 서블릿과 스프링 빈은 하나라서 필드에 요청마다 다른 값을 두면 섞인다
    checklist:
      - 톰캣이 연결을 받아 HTTP를 읽고 요청 객체를 만들어 DispatcherServlet을 부른다고 말했다
      - 요청 하나를 스레드 풀의 스레드 하나가 응답까지 맡는다고 말했다
      - 스레드가 모두 바쁘면 새 요청이 기다린다고 말했다
      - 서블릿이나 빈은 하나라서 필드에 요청의 값을 두면 섞인다고 말했다
    source: https://jakarta.ee/specifications/servlet/6.0/jakarta-servlet-spec-6.0
