# 스레드에 안전한 객체 문제
# 형식: https://github.com/wanja727/retrievo/blob/main/docs/content-format.md
#
# 모든 문제는 coreQuestions의 질문 하나에 묶이고(coreQuestion), 답의 근거가 레슨 본문에 있다
# (site/src/content/lesson-pages/thread-safe-objects.yaml의 says).
# 동작에 관한 정답은 verification의 threadsafe/ThreadSafeObjectsTest로 확인했다 (자바 21).
# 질문마다 첫 문제는 본문의 예시로 묻고, 둘째 문제는 다른 상황으로 옮겨 묻는다.
# 2026-11-25에 검수해 reviewed로 바꿨다.
subject:
  key: dev
  name: 개발자 면접
lesson:
  key: thread-safe-objects
  title: 스레드에 안전한 객체
  unit: 운영체제와 동시성
  order: 406
concepts:
  - key: core
    name: 스레드에 안전한 객체
coreQuestions:
  - key: q1
    text: "불변 객체는 왜 여러 스레드가 함께 써도 안전한가요?"
  - key: q2
    text: "스레드에 가둔다는 것과 ThreadLocal은 무엇인가요?"
  - key: q3
    text: "스레드 풀에서 ThreadLocal을 지우지 않으면 무슨 일이 생기나요?"
  - key: q4
    text: "여러 스레드가 함께 쓰는 맵은 무엇을 써야 하나요?"
questions:
  # ── 질문 1 ──
  - key: ts-torn-price
    concept: core
    coreQuestion: q1
    type: code_predict
    status: reviewed
    difficulty: 1
    body: 처음 값은 (10000, KRW)예요. 한 스레드가 set(12000, "USD")의 첫 줄만 실행한 순간 다른 스레드가 두 필드를 읽었어요. 읽은 값으로 나올 수 있는 것은?
    code: |-
      class MutablePrice {
        long amount;
        String currency;

        void set(long a, String c) {
          amount = a;
          currency = c;
        }
      }
    choices:
      - (10000, KRW)만
      - (12000, USD)만
      - (12000, KRW)
      - 예외가 난다
    answer: "3"
    explanation: |-
      **(12000, KRW)를 볼 수 있어요.** 필드 둘을 차례로 고치는 사이에 끼어들면 금액만 바뀐 섞인 값을 봐요.

      - 불변 객체로 바꾸고 새 객체를 만들어 참조 하나만 바꾸면 섞인 값이 생기지 않아요
      - 검증: ThreadSafeObjectsTest.mutableObjectShowsTornState (래치로 두 줄 사이에 세움)
    source: https://docs.oracle.com/javase/specs/jls/se21/html/jls-17.html
  - key: ts-range-swap
    concept: core
    coreQuestion: q1
    type: ox
    status: reviewed
    difficulty: 2
    body: "\"record Range(int lo, int hi)를 volatile Range range로 두고 바꿀 때마다 새 Range를 만들면, 읽는 스레드가 lo는 새 값, hi는 옛 값을 볼 수 있다\""
    answer: X
    explanation: |-
      **틀렸어요.** 불변 객체는 만든 뒤 바뀌지 않고, 참조 하나를 바꾸니 읽는 쪽은 옛 객체나 새 객체 가운데 하나를 통째로 봐요.

      - volatile은 새 참조를 다른 스레드가 보게 해요
      - 검증: ThreadSafeObjectsTest.immutableSwapIsNeverTorn (100만 번 바꾸는 동안 섞인 값 0번)
    source: https://docs.oracle.com/javase/specs/jls/se21/html/jls-17.html#jls-17.5
  # ── 질문 2 ──
  - key: ts-threadlocal-own
    concept: core
    coreQuestion: q2
    type: multiple_choice
    status: reviewed
    difficulty: 1
    body: static ThreadLocal<String> user가 있어요. 스레드 A가 user.set("kim"), 스레드 B가 user.set("lee")를 한 뒤 스레드 A가 user.get()을 불렀어요. 결과는?
    choices:
      - kim
      - lee
      - 나중에 set한 쪽의 값
      - "null"
    answer: "1"
    explanation: |-
      **kim이에요.** ThreadLocal은 같은 변수인데 스레드마다 따로 값을 가져요.

      - 요청 하나를 스레드 하나가 처리하니, 요청마다 다른 정보(로그인 사용자)를 두는 데 써요
    source: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/lang/ThreadLocal.html
  - key: ts-escape
    concept: core
    coreQuestion: q2
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: 메서드 안에서 new ArrayList<>()로 리스트를 만들어 값을 넣고, 돌려주기 전에 싱글톤 빈의 필드 lastResult에도 넣었어요. 이 리스트에 대해 맞는 설명은?
    choices:
      - 지역에서 만들었으니 여전히 한 스레드만 본다
      - 필드에 넣은 순간부터 다른 스레드가 볼 수 있어 함께 쓰는 것이 됐다
      - ArrayList는 원래 스레드에 안전하다
      - 메서드가 끝나면 리스트는 사라진다
    answer: "2"
    explanation: |-
      **필드에 넣는 순간 갇힌 것이 아니에요.** 싱글톤 빈의 필드는 모든 요청 스레드가 함께 봐요.

      - 지역에서 만들어 밖으로 내보내지 않은 객체만 스레드에 갇혀 있어요
    source: https://docs.oracle.com/javase/specs/jls/se21/html/jls-17.html
  # ── 질문 3 ──
  - key: ts-pool-leak
    concept: core
    coreQuestion: q3
    type: code_predict
    status: reviewed
    difficulty: 1
    body: 스레드 하나짜리 풀에서 아래 두 작업을 차례로 실행해요. 둘째 작업이 출력하는 값은?
    code: |-
      static ThreadLocal<String> user =
          new ThreadLocal<>();

      var pool = Executors
          .newSingleThreadExecutor();
      pool.submit(() -> user.set("kim"));
      pool.submit(() -> System.out.println(
          user.get()));
    choices:
      - "null"
      - kim
      - IllegalStateException
      - 실행할 때마다 다르다
    answer: "2"
    explanation: |-
      **kim이에요.** 풀은 같은 스레드를 다시 쓰고, 첫 작업이 값을 지우지 않았어요.

      - 넣은 곳의 finally에서 remove()하면 null이에요
      - 검증: ThreadSafeObjectsTest.threadLocalLeaksInPool
    source: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/lang/ThreadLocal.html
  - key: ts-async-null
    concept: core
    coreQuestion: q3
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: 요청 스레드에서 user.set("kim")을 한 뒤 CompletableFuture.runAsync(() -> log(user.get()))로 공용 풀에서 실행했어요. 공용 풀의 스레드는 user를 넣은 적이 없어요. 찍히는 값은?
    choices:
      - kim. 같은 요청이다
      - "null. 다른 스레드라 값이 따라가지 않는다"
      - 예외가 난다
      - 공용 풀의 아무 스레드나 가진 값
    answer: "2"
    explanation: |-
      **null이에요.** ThreadLocal은 스레드마다 따로라서, 다른 스레드로 넘어가면 그 스레드의 칸을 봐요.

      - 그래서 @Async나 직접 만든 풀에서는 스프링이 요청 스레드에 넣어 둔 값(SecurityContextHolder 등)도 없어요
      - 검증: ThreadSafeObjectsTest.threadLocalDoesNotFollow
    source: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/lang/ThreadLocal.html
  - key: ts-interceptor
    concept: core
    coreQuestion: q3
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: 인터셉터의 preHandle에서 직접 만든 ThreadLocal CURRENT에 로그인 사용자를 넣고, 어디에서도 지우지 않아요. 톰캣의 요청 처리 스레드는 풀이에요. 생길 수 있는 일과 고치는 곳으로 맞는 것은?
    choices:
      - 문제없다. 요청이 끝나면 톰캣이 ThreadLocal을 비운다
      - 같은 스레드가 다음에 처리하는 다른 요청이 이 사용자로 보일 수 있다. afterCompletion에서 remove()한다
      - 다음 요청에서 예외가 난다. preHandle에서 매번 new ThreadLocal을 만든다
      - 메모리만 늘고 값은 섞이지 않는다
    answer: "2"
    explanation: |-
      **다른 요청에 사용자가 섞일 수 있어요.** 톰캣은 스레드를 다시 쓰고, 직접 만든 ThreadLocal은 지워 주지 않아요.

      - afterCompletion은 컨트롤러에서 예외가 나도 불려서 지우는 자리로 맞아요
    source: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/lang/ThreadLocal.html
  # ── 질문 4 ──
  - key: ts-get-put
    concept: core
    coreQuestion: q4
    type: multiple_choice
    status: reviewed
    difficulty: 1
    body: 스레드 8개가 ConcurrentHashMap에서 같은 키의 값을 get 하고 1을 더해 put 하기를 1만 번씩 했어요. 끝난 뒤 값은?
    choices:
      - 정확히 80000
      - 80000 이하. 두 호출 사이에 끼어든다
      - ConcurrentModificationException
      - 10000
    answer: "2"
    explanation: |-
      **80000 이하예요.** 맵의 메서드 하나하나는 안전해도 get과 put 두 호출을 묶어 주지는 않아요. 읽고-고치고-쓰기예요.

      - merge(key, 1, Integer::sum)처럼 한 번의 호출로 해요
      - 검증: ThreadSafeObjectsTest.getThenPutLosesButMergeIsExact
    source: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/concurrent/ConcurrentHashMap.html
  - key: ts-compute-if-absent
    concept: core
    coreQuestion: q4
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: 상품 id별로 재입고 알림을 받을 사용자 목록을 ConcurrentHashMap에 모아요. 여러 요청이 같은 상품에 처음으로 동시에 등록할 때 목록이 하나만 만들어지게 하려면?
    choices:
      - if (!map.containsKey(id)) map.put(id, new CopyOnWriteArrayList<>());
      - map.computeIfAbsent(id, k -> new CopyOnWriteArrayList<>());
      - map.put(id, new CopyOnWriteArrayList<>());
      - synchronizedMap으로 바꾸고 containsKey 뒤 put
    answer: "2"
    explanation: |-
      **computeIfAbsent예요.** 키가 없을 때만 한 번 만들어 넣어요.

      - containsKey 뒤 put은 확인하고-행동하기라 여러 스레드가 각자 만들어 덮어쓸 수 있어요
      - synchronizedMap도 두 호출 사이를 묶어 주지 않아요
      - 검증: ThreadSafeObjectsTest.computeIfAbsentCreatesOnce (32개 스레드에서 한 번만 만듦)
    source: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/concurrent/ConcurrentHashMap.html
  # ── 네 질문을 하나로 ──
  - key: ts-interview
    concept: core
    coreQuestion: all
    type: descriptive
    status: reviewed
    difficulty: 2
    body: 면접에서 "스레드에 안전한 객체를 만드는 방법을 설명해 주세요"라는 질문을 받았어요. 1분 안에 답해 보세요.
    explanation: |-
      **바꾸지 않기, 함께 쓰지 않기, 안전한 도구에 맡기기의 세 가지예요.**

      - **불변:** 바뀌지 않으니 경쟁 상태가 없다. 바꿀 때는 새 객체로 참조만 바꾼다. final 필드는 생성 뒤 보인다
      - **가두기:** 지역 변수, ThreadLocal. 풀에서는 finally에서 remove하고, 다른 스레드로 따라가지 않는다
      - **도구:** ConcurrentHashMap. 읽고 고치는 일은 merge, computeIfAbsent로 한 번에
      - **스프링:** 상태 없는 싱글톤 빈, 요청 정보는 매개변수나 ThreadLocal
    checklist:
      - 불변 객체가 안전한 이유를 말했다
      - 지역 변수나 ThreadLocal로 함께 쓰지 않는 방법을 말했다
      - 스레드 풀에서 ThreadLocal을 지우지 않을 때의 문제를 말했다
      - ConcurrentHashMap과 HashMap의 차이를 말했다
      - get 뒤 put 대신 merge나 computeIfAbsent를 쓰는 이유를 말했다
    source: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/concurrent/ConcurrentHashMap.html
