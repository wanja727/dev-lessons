# ORM과 JPA 문제
# 형식: https://github.com/wanja727/retrievo/blob/main/docs/content-format.md
#
# 모든 문제는 coreQuestions의 질문 하나에 묶이고(coreQuestion), 답의 근거가 레슨 본문에 있다
# (site/src/content/lesson-pages/jpa-basics.yaml의 says).
# 동작에 관한 정답은 verification의 JpaBasicsTest로 확인했다 (Hibernate 6.6, PostgreSQL 16).
# 질문마다 첫 문제는 본문의 예시로 묻고, 둘째 문제는 다른 상황으로 옮겨 묻는다.
# 2026-11-25에 핵심 질문 구조로 다시 썼다. 예전 문제 가운데 면접 질문(q-4ac3dd19)만 키를 이어 쓴다.
# 같은 날 검수해 reviewed로 바꿨다.
subject:
  key: dev
  name: 개발자 면접
lesson:
  key: jpa-basics
  title: ORM과 JPA
  unit: JPA
  order: 4
concepts:
  - key: core
    name: ORM과 JPA
coreQuestions:
  - key: q1
    text: "ORM은 무엇을 대신해 주고, JPA와 Hibernate는 무엇이 다른가요?"
  - key: q2
    text: "엔티티 클래스는 어떻게 테이블이 되나요?"
  - key: q3
    text: "리포지토리는 인터페이스만 썼는데 어떻게 동작하나요?"
  - key: q4
    text: "JPQL은 SQL과 무엇이 다른가요?"
questions:
  # ── 질문 1 ──
  - key: jpab-impl-class
    concept: core
    coreQuestion: q1
    type: multiple_choice
    status: reviewed
    difficulty: 1
    body: 스프링 부트 앱에서 JPA의 EntityManagerFactory를 주입받아 스프링이 감싼 것을 벗기고 실제 구현 클래스의 이름을 찍었어요. 어느 패키지의 클래스가 나올까요?
    choices:
      - jakarta.persistence
      - org.hibernate
      - org.springframework.data.jpa
      - java.sql
    answer: "2"
    explanation: |-
      **org.hibernate예요.** JPA는 인터페이스와 어노테이션을 정한 표준이고, 실제로 일하는 구현은 Hibernate예요.

      - jakarta.persistence는 JPA 명세의 패키지라 인터페이스만 있어요
      - 스프링 부트의 기본 JPA 구현이 Hibernate예요
    source: https://jakarta.ee/specifications/persistence/3.1/
  - key: jpab-swap-impl
    concept: core
    coreQuestion: q1
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: 팀이 JPA 구현을 Hibernate에서 EclipseLink로 바꾸려 해요. 서비스 A는 @Entity와 EntityManager만 쓰고, 서비스 B는 org.hibernate.Session을 직접 꺼내 써요. 고칠 곳이 생기는 쪽은 어디일까요?
    choices:
      - A만
      - B만
      - 둘 다
      - 둘 다 고치지 않는다
    answer: "2"
    explanation: |-
      **B만 고쳐요.** A는 JPA 표준만 써서 구현이 바뀌어도 그대로예요.

      - JPA는 명세이고 구현이 여럿이에요
      - org.hibernate.Session은 Hibernate만의 클래스라 다른 구현에는 없어요
    source: https://jakarta.ee/specifications/persistence/3.1/
  # ── 질문 2 ──
  - key: jpab-column-name
    concept: core
    coreQuestion: q2
    type: multiple_choice
    status: reviewed
    difficulty: 1
    body: 아래 엔티티로 테이블을 만들면 name 필드와 price 필드는 각각 어떤 컬럼이 될까요?
    code: |-
      @Entity
      @Table(name = "cafe_menu")
      public class CafeMenu {
        @Id @GeneratedValue
        private Long id;
        @Column(name = "menu_name")
        private String name;
        private int price;
      }
    choices:
      - name과 price
      - menu_name과 price
      - menu_name과 menu_price
      - "price는 @Column이 없어서 컬럼이 되지 않는다"
    answer: "2"
    explanation: |-
      **menu_name과 price예요.** @Column에 이름을 적으면 그 이름을, 적지 않으면 필드 이름을 컬럼 이름으로 써요.

      - @Column이 없어도 필드는 컬럼이 돼요
    source: https://jakarta.ee/specifications/persistence/3.1/
  - key: jpab-snake-case
    concept: core
    coreQuestion: q2
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: 스프링 부트의 기본 설정에서 @Entity class Order에 @Column 없이 LocalDateTime orderedAt 필드를 뒀어요. 만들어지는 컬럼 이름은 무엇일까요?
    choices:
      - orderedAt
      - ordered_at
      - orderedat
      - order_ordered_at
    answer: "2"
    explanation: |-
      **ordered_at이에요.** 스프링 부트의 기본 이름 규칙이 카멜 케이스 필드를 스네이크 케이스 컬럼으로 바꿔요.

      - 대문자 앞에 밑줄을 넣고 소문자로 바꿔요
      - 레슨의 soldOut 필드가 sold_out 컬럼이 된 것과 같아요
    source: https://docs.spring.io/spring-boot/how-to/data-access.html
  # ── 질문 3 ──
  - key: jpab-derived-where
    concept: core
    coreQuestion: q3
    type: multiple_choice
    status: reviewed
    difficulty: 1
    body: CafeMenu의 price 필드는 price 컬럼이에요. 리포지토리 인터페이스의 findByPriceLessThan(5000)을 부르면 나가는 SELECT의 WHERE 절은 무엇일까요?
    choices:
      - where price=?
      - where price<?
      - where price<=?
      - WHERE 절 없이 모두 가져와 자바에서 거른다
    answer: "2"
    explanation: |-
      **where price<?예요.** 메서드 이름의 Price는 필드, LessThan은 작다는 조건이라 그대로 WHERE 절이 돼요.

      - 이것을 메서드 이름 쿼리라고 해요
      - 이하(<=)는 LessThanEqual이에요
    source: https://docs.spring.io/spring-data/jpa/reference/jpa/query-methods.html
  - key: jpab-no-impl
    concept: core
    coreQuestion: q3
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: interface OrderRepository extends JpaRepository<Order, Long>에 List<Order> findByStatus(String status)만 더하고 구현 클래스는 쓰지 않았어요. 서비스가 생성자로 OrderRepository를 받아 findByStatus("PAID")를 부르면 어떻게 될까요?
    choices:
      - 구현 클래스가 없어서 앱이 뜨지 않는다
      - 주입되는 값이 null이라 NullPointerException이 난다
      - status 조건의 SELECT가 나가 결과를 받는다
      - findAll과 같이 모든 주문을 받는다
    answer: "3"
    explanation: |-
      **status 조건의 SELECT가 나가요.** 스프링 데이터가 앱을 띄울 때 인터페이스를 구현한 프록시를 만들어 빈으로 넣어요.

      - 메서드 이름의 Status를 필드 status의 조건으로 바꿔요
      - JpaRepository<Order, Long>의 두 타입은 엔티티와 id의 타입이에요
    source: https://docs.spring.io/spring-data/jpa/reference/jpa/query-methods.html
  - key: jpab-typo-startup
    concept: core
    coreQuestion: q3
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: CafeMenu의 필드는 id, name, price이고, name은 menu_name 컬럼이에요. 리포지토리에 List<CafeMenu> findByMenuName(String menuName)을 더했어요. 어떻게 될까요?
    choices:
      - menu_name 조건으로 잘 조회된다
      - 앱이 뜰 때 menuName이라는 속성이 없다는 오류로 실패한다
      - 앱은 뜨고, 이 메서드를 처음 부를 때 SQL 오류가 난다
      - 조건 없이 모든 메뉴를 돌려준다
    answer: "2"
    explanation: |-
      **앱이 뜰 때 실패해요.** 메서드 이름 쿼리는 컬럼이 아니라 필드 이름을 쓰고, 이름은 앱이 뜰 때 읽어 검사해요.

      - CafeMenu에는 menuName 필드가 없어요
      - 고치면 findByName이에요
    source: https://docs.spring.io/spring-data/jpa/reference/jpa/query-methods.html
  # ── 질문 4 ──
  - key: jpab-jpql-column
    concept: core
    coreQuestion: q4
    type: multiple_choice
    status: reviewed
    difficulty: 1
    body: CafeMenu의 name 필드는 @Column(name = "menu_name")이에요. JPQL select m from CafeMenu m where m.name = :name이 SQL로 바뀌면 WHERE 절의 컬럼은 무엇일까요?
    choices:
      - name
      - menu_name
      - CafeMenu.name
      - 바뀌지 않고 m.name 그대로 간다
    answer: "2"
    explanation: |-
      **menu_name이에요.** JPQL은 필드를 쓰고, Hibernate가 매핑을 보고 컬럼 이름으로 바꿔요.

      - 엔티티 이름 CafeMenu도 테이블 이름 cafe_menu로 바뀌어요
    source: https://jakarta.ee/specifications/persistence/3.1/
  - key: jpab-jpql-table-name
    concept: core
    coreQuestion: q4
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: 엔티티 Order는 @Table(name = "orders")예요. 리포지토리에 @Query("select o from orders o")를 적었어요. 어떻게 될까요?
    choices:
      - orders 테이블을 조회해 잘 동작한다
      - 앱이 뜰 때 orders라는 엔티티를 찾지 못해 실패한다
      - 메서드를 부를 때 DB가 테이블이 없다고 오류를 낸다
      - Order 엔티티로 알아서 바꿔 동작한다
    answer: "2"
    explanation: |-
      **앱이 뜰 때 실패해요.** JPQL은 테이블 이름이 아니라 엔티티 이름을 쓰고, @Query의 JPQL은 앱이 뜰 때 검사해요.

      - 고치면 select o from Order o예요
      - 테이블 이름으로 쓰려면 nativeQuery = true인 네이티브 쿼리로 적어요
    source: https://docs.spring.io/spring-data/jpa/reference/jpa/query-methods.html
  # ── 네 질문을 하나로 ──
  - key: q-4ac3dd19
    concept: core
    coreQuestion: all
    type: descriptive
    status: reviewed
    difficulty: 2
    body: 면접에서 "JPA, Hibernate, Spring Data JPA는 각각 무엇이고 어떻게 다른가요?"라는 질문을 받았어요. 1분 안에 답해 보세요.
    explanation: |-
      **JPA는 ORM의 자바 표준 명세, Hibernate는 그 구현, Spring Data JPA는 그 위에서 리포지토리 구현을 만들어 주는 스프링 프로젝트예요.**

      - ORM: 객체와 테이블의 차이를 메워 SQL과 변환 코드를 대신 만든다
      - 엔티티에 어노테이션으로 테이블과 컬럼의 대응을 적는다
      - 리포지토리는 인터페이스만 쓰면 스프링이 프록시 구현을 만든다. 메서드 이름 규칙이나 JPQL로 조회를 만든다
      - JPQL은 엔티티와 필드로 쓰고 Hibernate가 SQL로 바꾼다
      - SQL을 몰라도 되는 것은 아니라 나간 SQL을 로그로 확인한다
    checklist:
      - JPA는 표준 명세라고 말했다
      - Hibernate는 구현이라고 말했다
      - Spring Data JPA가 리포지토리 구현을 만든다고 말했다
      - JPQL이 엔티티와 필드를 대상으로 쓴다고 말했다
      - 나간 SQL을 확인해야 한다고 말했다
    source: https://jakarta.ee/specifications/persistence/3.1/
