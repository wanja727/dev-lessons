# 숫자는 verification의 NPlusOneTest로 확인한 동작에서 나온다.
# 키 q-xxxxxxxx는 노션에서 옮긴 문제(2026-11-17), n1-xxx는 2026-11-21에 레슨을 새로 쓰며 더한 문제다.
subject:
