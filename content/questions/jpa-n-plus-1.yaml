concepts:
  - key: core
    name: JPA N+1 문제
coreQuestions:
  - key: q1
    text: "N+1 문제는 무엇이고 왜 생기나요?"
  - key: q2
    text: "EAGER로 바꾸면 왜 해결되지 않나요?"
