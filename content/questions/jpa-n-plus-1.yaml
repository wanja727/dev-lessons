# JPA N+1 문제 문제
# 형식: https://github.com/wanja727/retrievo/blob/main/docs/content-format.md
#
# 레슨은 핵심 질문 네 개를 뼈대로 한다. 모든 문제는 그중 하나에 연결되고, 답의 근거가 레슨 본문에 있다.
#   질문 1. N+1 문제는 무엇이고 왜 생기나요?
#   질문 2. EAGER로 바꾸면 왜 해결되지 않나요?
#   질문 3. 어떻게 해결하나요?
#   질문 4. 페이징이 필요하면 어떤 방법을 써야 하나요?
# 숫자는 verification의 NPlusOneTest로 확인한 동작에서 나온다.
# 키 q-xxxxxxxx는 노션에서 옮긴 문제(2026-11-17), n1-xxx는 2026-11-21에 레슨을 새로 쓰며 더한 문제다.
subject:
  key: dev
  name: 개발자 면접
lesson:
  key: jpa-n-plus-1
  title: JPA N+1 문제
  unit: JPA
  order: 12
concepts:
  - key: core
    name: JPA N+1 문제
questions:
  # ── 질문 1. N+1 문제는 무엇이고 왜 생기나요? ──
  - key: n1-lazy-count
    concept: core
    type: code_predict
    status: reviewed
    difficulty: 1
    body: Team의 members는 지연 로딩(LAZY)이에요. 팀이 7개 있을 때, 이 코드가 실행되는 동안 SQL은 모두 몇 번 나갈까요?
    code: |-
      List<Team> teams = teamRepository.findAll();
      for (Team team : teams) {
          int count = team.getMembers().size();
          System.out.println(count);
      }
    choices:
      - 1번
      - 7번
      - 8번
      - 14번
    answer: "3"
    explanation: |-
      **8번이에요.** 팀 목록 1번 + 팀마다 멤버 1번씩 7번이에요.

      - 지연 로딩은 멤버를 처음 쓸 때 그 팀의 멤버만 조회해요. 반복문이 팀 7개의 멤버를 차례로 쓰니 7번이 더 나가요
      - 7번을 골랐다면 처음 팀 목록 조회 1번을 빠뜨린 거예요
    source: https://docs.jboss.org/hibernate/orm/6.6/userguide/html_single/Hibernate_User_Guide.html#fetching
  - key: n1-lazy-no-access
    concept: core
    type: ox
    status: reviewed
    difficulty: 1
    body: Team의 members가 지연 로딩(LAZY)일 때, findAll()로 팀 10개를 조회하고 members를 한 번도 쓰지 않으면 쿼리는 1번만 나간다.
    answer: O
    explanation: |-
      **O. 1번만 나가요.**

      - 지연 로딩은 멤버를 처음 쓰는 순간에 조회해요. 쓰지 않으면 멤버 쿼리는 나가지 않아요
      - N+1은 조회한 목록의 연관 데이터를 하나씩 쓸 때 드러나요
    source: https://docs.jboss.org/hibernate/orm/6.6/userguide/html_single/Hibernate_User_Guide.html#fetching

  # ── 질문 2. EAGER로 바꾸면 왜 해결되지 않나요? ──
  - key: q-1935250f
    concept: core
    type: ox
    status: reviewed
    difficulty: 1
    body: 연관관계를 즉시 로딩(EAGER)으로 바꾸면 N+1 문제가 해결된다.
    answer: X
    explanation: |-
      **X. 쿼리 수는 그대로예요.**

      - JPQL은 적힌 대로 팀만 조회하고, 그 뒤에 팀마다 멤버를 조회해요. EAGER는 그 시점을 앞당길 뿐이에요
      - 멤버가 필요 없는 화면에서도 쿼리가 나가서 오히려 손해예요. 그래서 연관관계는 모두 LAZY로 두고, 필요한 조회에서만 함께 가져와요
    source: https://docs.jboss.org/hibernate/orm/6.6/userguide/html_single/Hibernate_User_Guide.html#fetching
  - key: q-19b3c76f
    concept: core
    type: code_predict
    status: reviewed
    difficulty: 2
    body: 팀이 10개 있어요. Team의 members가 LAZY일 때와 EAGER일 때, 이 코드에서 나가는 쿼리는 각각 몇 번일까요?
    code: |-
      List<Team> teams = teamRepository.findAll();
      for (Team team : teams) {
          int count = team.getMembers().size();
          System.out.println(count);
      }
    choices:
      - LAZY 1번, EAGER 11번
      - LAZY 11번, EAGER 1번
      - LAZY 11번, EAGER 11번
      - LAZY 2번, EAGER 2번
    answer: "3"
    explanation: |-
      **둘 다 11번이에요.**

      - LAZY: 팀 조회 1번 + 반복문에서 팀마다 멤버를 쓸 때 1번씩 10번
      - EAGER: 팀 조회 1번 + 조회 직후 팀마다 1번씩 10번. 반복문에서는 더 나가지 않아요
      - 차이는 멤버 쿼리 10번이 나가는 시점뿐이에요
    source: https://docs.jboss.org/hibernate/orm/6.6/userguide/html_single/Hibernate_User_Guide.html#fetching
  - key: n1-eager-timing
    concept: core
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: Team의 members를 EAGER로 바꾸고 findAll()로 팀 10개를 조회했어요. 그 뒤 코드에서 members는 한 번도 쓰지 않았어요. 쿼리는 어떻게 나갈까요?
    choices:
      - 1번. 멤버를 쓰지 않았으니 팀만 조회한다
      - 1번. 팀과 멤버를 join해서 한 번에 가져온다
      - 11번. 팀 조회 1번 뒤에 곧바로 팀마다 멤버 조회가 10번 나간다
      - 11번. 팀 조회 1번이 나가고, 나머지 10번은 트랜잭션이 끝날 때 나간다
    answer: "3"
    explanation: |-
      **11번이고, 모두 findAll()을 실행하는 동안 나가요.**

      - EAGER는 멤버를 쓰든 안 쓰든 조회 직후에 채워요. 그래서 쓰지 않아도 10번이 나가요
      - JPQL은 적힌 대로 팀만 조회하는 SQL이 돼요. EAGER라고 해서 join으로 바뀌지 않아요
      - 1번(팀만 조회)은 LAZY일 때의 동작이에요
    source: https://docs.jboss.org/hibernate/orm/6.6/userguide/html_single/Hibernate_User_Guide.html#fetching
  - key: n1-why-eager-fails
    concept: core
    type: descriptive
    status: reviewed
    difficulty: 2
    body: EAGER로 바꿔도 N+1 문제가 해결되지 않는 이유를 설명해 보세요.
    explanation: |-
      **EAGER는 멤버를 가져오는 시점만 앞당기고, 팀마다 따로 조회하는 방식은 바꾸지 않기 때문이에요.**

      - findAll()은 JPQL `select t from Team t`를 실행하고, JPQL은 적힌 그대로 팀만 조회하는 SQL이 돼요 (1번)
      - 팀을 받은 뒤에야 EAGER 설정을 보고 팀마다 멤버를 조회해요 (N번)
      - 멤버가 필요 없는 조회에서도 N번이 나가서 LAZY보다 손해예요
      - 그래서 모두 LAZY로 두고, 필요한 조회에서만 fetch join이나 배치 페치로 함께 가져와요
    checklist:
      - EAGER로 바꿔도 쿼리 수는 1 + N으로 같다고 말했다
      - JPQL은 적힌 대로 팀만 조회하는 SQL이 된다고 말했다
      - 멤버 조회는 그 뒤에 팀마다 따로 나간다고 말했다
      - 멤버가 필요 없을 때도 쿼리가 나가 오히려 손해라고 말했다
      - 연관관계는 LAZY로 두고 필요한 조회에서만 함께 가져온다고 말했다
    source: https://docs.jboss.org/hibernate/orm/6.6/userguide/html_single/Hibernate_User_Guide.html#fetching

  # ── 질문 3. 어떻게 해결하나요? ──
  - key: n1-fetch-join-how
    concept: core
    type: multiple_choice
    status: reviewed
    difficulty: 1
    body: fetch join은 어떤 방식으로 N+1 문제를 없앨까요?
    choices:
      - 팀과 멤버를 join한 SQL 한 번으로 함께 가져온다
      - 여러 팀의 멤버를 IN 절로 묶어서 가져온다
      - 멤버 조회를 팀 조회 직후로 앞당긴다
      - 멤버를 쓰기 전까지 조회를 미룬다
    answer: "1"
    explanation: |-
      **팀과 멤버를 join한 SQL 한 번으로 가져와요. 쿼리는 1번이에요.**

      - IN 절로 묶는 것은 배치 페치예요
      - 조회 직후로 앞당기는 것은 EAGER, 쓰기 전까지 미루는 것은 LAZY예요. 둘 다 쿼리 수를 줄이지 못해요
    source: https://docs.jboss.org/hibernate/orm/6.6/userguide/html_single/Hibernate_User_Guide.html#fetching
  - key: q-a42bb6e5
    concept: core
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: members는 LAZY이고 배치 크기(default_batch_fetch_size)는 100이에요. 팀 250개를 조회한 뒤 모든 팀의 멤버를 썼어요. 쿼리는 모두 몇 번일까요?
    choices:
      - 1번
      - 3번
      - 4번
      - 251번
    answer: "3"
    explanation: |-
      **4번이에요.** 팀 목록 1번 + 멤버 3번이에요.

      - 배치 페치는 멤버를 100팀씩 IN 절로 묶어 가져와요. 250팀이면 100, 100, 50으로 3번이에요
      - 3번을 골랐다면 처음 팀 목록 조회를 빠뜨린 거예요. 251번은 배치 페치가 없을 때(1 + N)예요
    source: https://docs.jboss.org/hibernate/orm/6.6/userguide/html_single/Hibernate_User_Guide.html#fetching
  - key: q-9d00afca
    concept: core
    type: descriptive
    status: reviewed
    difficulty: 2
    body: N+1 문제의 해결책인 fetch join과 배치 페치를 비교해 보세요. 각각 어떻게 동작하고, 쿼리는 몇 번 나가나요?
    explanation: |-
      **둘 다 멤버를 팀마다 따로 가져오지 않고 묶어서 가져와요. 묶는 방식이 달라요.**

      | | 하는 일 | 쿼리 수 |
      | --- | --- | --- |
      | fetch join | 팀과 멤버를 join한 SQL 한 번으로 가져온다 | 1 |
      | 배치 페치 | LAZY는 그대로 두고, 여러 팀의 멤버를 IN 절로 묶어 가져온다 | 1 + (N ÷ 배치 크기, 올림) |

      - 쿼리 수는 fetch join이 적어요
      - 팀 목록에 멤버를 붙여 페이징할 때는 배치 페치를 써요. 컬렉션 fetch join은 DB에서 페이지를 자르지 못해요
    checklist:
      - fetch join은 팀과 멤버를 join해서 쿼리 1번에 가져온다고 말했다
      - 배치 페치는 LAZY를 그대로 두고 IN 절로 묶어 가져온다고 말했다
      - 배치 페치의 쿼리 수가 1 + (N ÷ 배치 크기, 올림)이라고 말했다
      - 컬렉션을 페이징해야 하면 배치 페치를 쓴다고 말했다
    source: https://docs.jboss.org/hibernate/orm/6.6/userguide/html_single/Hibernate_User_Guide.html#fetching

  # ── 질문 4. 페이징이 필요하면 어떤 방법을 써야 하나요? ──
  - key: n1-collection-paging
    concept: core
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: |-
      "select t from Team t join fetch t.members"에 페이징(한 페이지에 팀 20개)을 걸었어요. Hibernate는 어떻게 동작할까요?
    choices:
      - SQL에 LIMIT 20을 붙여 DB에서 팀 20개를 잘라 온다
      - 예외를 던지고 쿼리를 실행하지 않는다
      - SQL에는 페이징을 넣지 않고, 전체 행을 가져온 뒤 메모리에서 팀 20개를 자른다
      - fetch join을 무시하고 팀만 페이징해서 조회한다
    answer: "3"
    explanation: |-
      **전체 행을 메모리로 가져온 뒤에 잘라요. 경고(HHH90003004)를 남겨요.**

      - 팀과 멤버를 join한 결과는 멤버 단위 행이에요. DB의 LIMIT은 행을 기준으로 잘라서 "팀 20개"를 정확히 자를 수 없어요
      - 결과는 맞게 나오지만, 데이터가 많으면 전부 메모리에 올리다가 장애가 날 수 있어요
    source: https://docs.jboss.org/hibernate/orm/6.6/userguide/html_single/Hibernate_User_Guide.html#fetching
  - key: q-ece217e3
    concept: core
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: 팀 목록을 20개씩 페이징하면서 각 팀의 멤버도 함께 보여 줘야 해요. 가장 적절한 방법은 무엇일까요?
    choices:
      - 팀과 멤버를 fetch join하고 페이징을 건다
      - 페이징 없이 전체를 fetch join으로 가져온 뒤, 애플리케이션에서 20개만 쓴다
      - 팀만 페이징해서 조회하고, 멤버는 배치 페치로 가져온다
      - members를 EAGER로 바꾸고 팀을 페이징해서 조회한다
    answer: "3"
    explanation: |-
      **팀만 페이징하고 멤버는 배치 페치로 가져와요. 쿼리 2번으로 끝나요.**

      - 팀 페이지 조회 1번(LIMIT이 정상으로 붙음) + 그 20팀의 멤버를 IN으로 묶어 1번
      - 1번: 컬렉션 fetch join에 페이징을 걸면 전체를 메모리로 가져와 잘라요
      - 2번: 1번과 같은 일을 직접 하는 거예요. 전체 데이터를 메모리에 올려요
      - 4번: EAGER는 쿼리 수를 줄이지 못해요. 1 + 20번이 나가요
    source: https://docs.jboss.org/hibernate/orm/6.6/userguide/html_single/Hibernate_User_Guide.html#fetching
  - key: q-0dd7b6b4
    concept: core
    type: multiple_choice
    status: reviewed
    difficulty: 3
    body: Member의 team은 @ManyToOne(LAZY)이에요. 멤버 목록을 20명씩 페이징하면서 각 멤버의 팀 이름도 보여 줘야 해요. DB에서 페이징하면서 쿼리 1번으로 끝내는 방법은 무엇일까요?
    choices:
      - Member를 조회하면서 team을 fetch join하고 페이징을 건다
      - Team을 조회하면서 members를 fetch join하고 페이징을 건다
      - team을 EAGER로 바꾼다
      - 아무것도 하지 않아도 쿼리 1번이다
    answer: "1"
    explanation: |-
      **Member에서 team을 fetch join하고 페이징해요.**

      - 멤버 한 명에 팀은 하나라서 join해도 행이 늘어나지 않아요. LIMIT이 그대로 붙고 쿼리 1번으로 끝나요
      - 2번: 팀 → 멤버들은 컬렉션이라 행이 늘어나요. 페이징하면 메모리에서 잘라요
      - 3번: EAGER는 쿼리 수를 줄이지 못해요
      - 4번: 팀 이름을 쓸 때 추가 쿼리가 나가요
      - 정리: fetch join과 페이징은 ToOne(멤버 → 팀)에서는 같이 써도 되고, 컬렉션(팀 → 멤버들)에서는 안 돼요
    source: https://docs.jboss.org/hibernate/orm/6.6/userguide/html_single/Hibernate_User_Guide.html#fetching
  - key: q-73be0dc3
    concept: core
    type: descriptive
    status: reviewed
    difficulty: 3
    body: |-
      팀 목록 화면에 페이징(20개씩)을 넣으면서 각 팀의 멤버도 함께 보여 줘야 해요. "select t from Team t join fetch t.members"에 페이징을 걸면 어떤 일이 생기고, 어떻게 고칠 건가요?
    explanation: |-
      **DB에서 자르지 못하고 전체를 메모리로 가져와 잘라요. fetch join을 빼고 배치 페치로 고쳐요.**

      - **무슨 일이 생기나:** join 결과는 멤버 단위 행이라, DB가 행 기준으로 자르면 팀 20개가 되지 않아요. 그래서 Hibernate는 SQL에 페이징을 넣지 않고 전체 행을 가져와 메모리에서 잘라요. 경고(HHH90003004)가 남고, 데이터가 많으면 메모리 부족으로 장애가 날 수 있어요
      - **고치는 법:** 팀만 페이징해서 조회하고, 멤버는 배치 페치로 IN 쿼리 1번에 가져와요. 쿼리는 2번이에요
    checklist:
      - join 결과가 멤버 단위 행이라 DB에서 팀 기준으로 자를 수 없다고 말했다
      - Hibernate가 전체를 가져와 메모리에서 자른다고 말했다
      - 데이터가 많으면 메모리 부족 위험이 있다고 말했다
      - 팀만 페이징해서 조회하고 멤버는 배치 페치로 가져온다고 말했다
      - 고친 뒤의 쿼리 수(2번)를 말했다
    source: https://docs.jboss.org/hibernate/orm/6.6/userguide/html_single/Hibernate_User_Guide.html#fetching

  # ── 네 질문을 하나로 ──
  - key: q-59546d76
    concept: core
    type: descriptive
    status: reviewed
    difficulty: 2
    body: 면접에서 "JPA N+1 문제를 설명해 주세요"라는 질문을 받았어요. 1분 안에 답해 보세요.
    explanation: |-
      **정의 → 원인 → 해결 순서로 말해요.**

      - **정의:** 연관관계가 있는 엔티티 목록을 조회할 때, 목록 쿼리 1번 뒤에 조회한 개수 N만큼 연관 데이터를 가져오는 쿼리가 더 나가는 문제
      - **원인:** JPA는 JPQL에 적힌 대상만 조회하고, 연관 데이터는 엔티티마다 따로 가져온다. EAGER로 바꿔도 시점만 앞당겨지고 쿼리 수는 같다
      - **해결:** 모두 LAZY로 두고, 필요한 조회에서 fetch join으로 한 번에 가져온다. 컬렉션을 페이징해야 하면 배치 페치로 IN 쿼리에 묶는다
    checklist:
      - 연관 데이터를 가져오느라 목록 조회 1번 뒤에 결과 수(N)만큼 쿼리가 더 나간다고 정의했다
      - 원인으로 연관 데이터를 엔티티마다 따로 조회한다고 말했다
      - EAGER로 바꿔도 해결되지 않는다고 말했다
      - 해결책으로 fetch join과 배치 페치를 말했다
      - 컬렉션 페이징에는 배치 페치를 쓴다고 말했다
    source: https://docs.jboss.org/hibernate/orm/6.6/userguide/html_single/Hibernate_User_Guide.html#fetching
