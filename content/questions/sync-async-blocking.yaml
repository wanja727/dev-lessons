# 동기와 비동기, 블로킹과 논블로킹 문제
# 형식: https://github.com/wanja727/retrievo/blob/main/docs/content-format.md
#
# 모든 문제는 coreQuestions의 질문 하나에 묶이고(coreQuestion), 답의 근거가 레슨 본문에 있다
# (site/src/content/lesson-pages/sync-async-blocking.yaml의 says).
# 동작에 관한 정답은 verification의 syncasync/SyncAsyncBlockingTest로 확인했다 (자바 21).
# 웹플럭스에 관한 정답은 스프링 문서가 근거다.
# 질문마다 첫 문제는 본문의 예시로 묻고, 둘째 문제는 다른 상황으로 옮겨 묻는다.
subject:
  key: dev
  name: 개발자 면접
lesson:
  key: sync-async-blocking
  title: 동기와 비동기, 블로킹과 논블로킹
  unit: 운영체제와 동시성
  order: 409
concepts:
  - key: core
    name: 동기와 비동기, 블로킹과 논블로킹
coreQuestions:
  - key: q1
    text: "동기와 비동기는 무엇이 다른가요?"
  - key: q2
    text: "블로킹과 논블로킹은 무엇이 다른가요?"
  - key: q3
    text: "동기, 비동기와 블로킹, 논블로킹은 어떻게 조합되나요?"
  - key: q4
    text: "서버는 많은 요청을 어떤 방식으로 기다리나요?"
questions:
  # ── 질문 1 ──
  - key: sa-callback-order
    concept: core
    coreQuestion: q1
    type: code_predict
    status: draft
    difficulty: 1
    body: deliveryApiAsync()는 200ms 뒤에 "배송 중"으로 완료되는 CompletableFuture를 바로 돌려줘요. 아래 코드에서 먼저 찍히는 것은?
    code: |-
      deliveryApiAsync()
          .thenAccept(d -> System.out.println(d));
      System.out.println("다음 줄");
    choices:
      - 배송 중
      - 다음 줄
      - 실행할 때마다 다르다
      - 둘 다 찍히지 않는다
    answer: "2"
    explanation: |-
      **"다음 줄"이 먼저예요.** 비동기는 맡기고 바로 다음 줄로 가고, 결과는 200ms 뒤에 콜백이 처리해요.

      - 결과와 끝나는 때를 부른 쪽이 챙기지 않는 것이 비동기예요
      - 검증: SyncAsyncBlockingTest.callbackRunsLater
    source: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/concurrent/CompletableFuture.html
  - key: sa-mail-queue
    concept: core
    coreQuestion: q1
    type: multiple_choice
    status: draft
    difficulty: 2
    body: 회원 가입 뒤 환영 메일 요청을 메시지 큐에 넣고 바로 "가입 완료"로 응답해요. 메일은 다른 서버가 나중에 보내요. 응답하는 쪽에서 보면 메일 발송은?
    choices:
      - 동기. 같은 요청 안에서 시작했다
      - 비동기. 끝나는 때를 응답하는 쪽이 챙기지 않는다
      - 블로킹. 큐에 넣었다
      - 판단할 수 없다
    answer: "2"
    explanation: |-
      **비동기예요.** 메일이 언제 끝나는지 응답하는 쪽은 챙기지 않고 맡긴 뒤 다음으로 가요.

      - 동기와 비동기는 결과와 끝나는 때를 누가 챙기나의 구분이에요
    source: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/concurrent/CompletableFuture.html
  # ── 질문 2 ──
  - key: sa-take-poll
    concept: core
    coreQuestion: q2
    type: multiple_choice
    status: draft
    difficulty: 1
    body: 빈 LinkedBlockingQueue에 한 스레드는 poll()을, 다른 스레드는 take()를 불렀어요. 각 스레드는 어떻게 될까요?
    choices:
      - 둘 다 바로 null을 받는다
      - poll은 바로 null을 받고, take는 값이 올 때까지 WAITING으로 멈춘다
      - 둘 다 값이 올 때까지 멈춘다
      - take는 예외를 던진다
    answer: "2"
    explanation: |-
      **poll은 논블로킹이라 바로 null, take는 블로킹이라 값이 올 때까지 멈춰요.**

      - 블로킹된 스레드는 CPU를 쓰지 않지만 다른 일도 하지 못해요
      - 검증: SyncAsyncBlockingTest.pollVersusTake
    source: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/concurrent/BlockingQueue.html
  - key: sa-trylock-nonblocking
    concept: core
    coreQuestion: q2
    type: ox
    status: draft
    difficulty: 2
    body: "\"lock.tryLock()은 락이 잡혀 있으면 풀릴 때까지 기다리므로 블로킹 호출이다\""
    answer: X
    explanation: |-
      **틀렸어요.** tryLock()은 락이 잡혀 있으면 기다리지 않고 바로 false를 돌려줘요. 논블로킹이에요.

      - 기다리는 것은 lock()이에요
    source: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/concurrent/locks/Lock.html
  # ── 질문 3 ──
  - key: sa-async-join
    concept: core
    coreQuestion: q3
    type: code_predict
    status: draft
    difficulty: 1
    body: deliveryApiAsync()는 200ms 뒤에 완료되는 CompletableFuture를 돌려줘요. 아래 코드는 네 조합 가운데 무엇이고, 대략 얼마나 걸릴까요?
    code: |-
      for (int i = 0; i < 3; i++)
        deliveryApiAsync().join();
    choices:
      - 비동기 논블로킹, 0.2초쯤
      - 비동기 블로킹, 0.6초쯤
      - 동기 논블로킹, 0.2초쯤
      - 동기 블로킹, 0.2초쯤
    answer: "2"
    explanation: |-
      **비동기 블로킹이고 0.6초쯤이에요.** 비동기 API로 맡겼지만 바로 join()으로 기다려서 하나씩 차례로 끝나요.

      - 셋을 다 맡긴 뒤 allOf로 모으면 0.2초쯤이에요
      - 검증: SyncAsyncBlockingTest.asyncThenJoinImmediatelyIsSerial
    source: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/concurrent/CompletableFuture.html
  - key: sa-progress-bar
    concept: core
    coreQuestion: q3
    type: multiple_choice
    status: draft
    difficulty: 2
    body: 파일 변환을 풀에 맡긴 뒤 1초마다 isDone()을 확인하며 진행 막대를 그리고, 끝나면 결과를 보여 줘요. 네 조합 가운데 무엇일까요?
    choices:
      - 동기 블로킹
      - 동기 논블로킹
      - 비동기 블로킹
      - 비동기 논블로킹
    answer: "2"
    explanation: |-
      **동기 논블로킹이에요.** isDone()은 바로 돌아와서 멈추지 않지만, 끝나는 때는 부른 쪽이 계속 확인하며 챙겨요.

      - 끝나면 콜백이 처리하게 붙였다면 비동기 논블로킹이에요
    source: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/concurrent/Future.html
  # ── 질문 4 ──
  - key: sa-ten-threads
    concept: core
    coreQuestion: q4
    type: multiple_choice
    status: draft
    difficulty: 1
    body: 200ms 기다리는 배송 API 호출 100건을 스레드 10개짜리 풀에서 블로킹으로 처리해요. 100건이 모두 끝나는 데 대략 얼마나 걸릴까요?
    choices:
      - 0.2초쯤
      - 2초쯤
      - 20초쯤
      - 1초쯤
    answer: "2"
    explanation: |-
      **2초쯤이에요.** 스레드 10개가 기다리는 동안 묶여서 한 번에 10건씩 열 번 기다려요.

      - 스레드 하나의 타이머에 "200ms 뒤에 알려 달라"로 맡기면 100건이 함께 기다려 0.2초쯤이에요
      - 검증: SyncAsyncBlockingTest.blockingThreadsVersusCallbacks
    source: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/lang/Thread.State.html
  - key: sa-event-loop-jdbc
    concept: core
    coreQuestion: q4
    type: multiple_choice
    status: draft
    difficulty: 2
    body: 이벤트 루프 스레드 4개로 도는 서버의 핸들러에서 500ms 걸리는 JDBC 쿼리를 바로 불러요. 요청 8개가 동시에 들어오면 어떻게 될까요?
    choices:
      - 8개가 함께 0.5초 만에 끝난다
      - 이벤트 루프 스레드 4개가 모두 막혀 나머지 요청과 연결이 기다린다
      - JDBC가 자동으로 논블로킹으로 바뀐다
      - 서버가 스레드를 8개로 늘린다
    answer: "2"
    explanation: |-
      **이벤트 루프가 모두 막혀요.** 이벤트 루프는 적은 스레드가 여러 연결을 돌보는 방식이라, 그 스레드에서 블로킹 코드를 부르면 다른 모든 연결이 멈춰요.

      - 논블로킹 드라이버를 쓰거나 블로킹 코드를 다른 스레드로 옮겨요
      - 검증: SyncAsyncBlockingTest.blockingTheEventLoopDelaysOthers (같은 원리, 스레드 하나)
    source: https://docs.spring.io/spring-framework/reference/web/webflux/new-framework.html
  - key: sa-tomcat-300
    concept: core
    coreQuestion: q4
    type: code_predict
    status: draft
    difficulty: 2
    body: 아래 스프링 MVC 컨트롤러의 서비스가 DB를 1초 기다려요. 톰캣의 요청 처리 스레드가 200개일 때 동시에 들어온 요청 300개 가운데 처음 1초 안에 처리가 시작되는 요청은 몇 개일까요?
    code: |-
      @GetMapping("/orders/{id}")
      OrderView order(@PathVariable long id) {
        // 톰캣 스레드가 DB 답을 기다린다
        return service.find(id);
      }
    choices:
      - 300개
      - 200개
      - 100개
      - 1개
    answer: "2"
    explanation: |-
      **200개예요.** 스프링 MVC는 요청마다 스레드 하나가 블로킹으로 기다려서, 스레드 수만큼만 동시에 처리해요. 나머지 100개는 스레드가 빌 때까지 기다려요.
    source: https://docs.spring.io/spring-boot/appendix/application-properties/index.html
  # ── 네 질문을 하나로 ──
  - key: sa-interview
    concept: core
    coreQuestion: all
    type: descriptive
    status: draft
    difficulty: 2
    body: 면접에서 "동기와 비동기, 블로킹과 논블로킹의 차이를 설명해 주세요"라는 질문을 받았어요. 1분 안에 답해 보세요.
    explanation: |-
      **동기와 비동기는 결과를 누가 챙기나, 블로킹과 논블로킹은 부른 스레드가 멈추나예요. 둘은 다른 질문이라 네 가지로 조합돼요.**

      - **동기와 비동기:** 부른 쪽이 끝나는 때를 챙기면 동기, 맡기고 콜백이나 나중에 받으면 비동기
      - **블로킹과 논블로킹:** 준비될 때까지 멈추면 블로킹, 바로 돌아오면 논블로킹
      - **조합:** 비동기로 맡기고 바로 join하면 빨라지지 않는다. 스레드를 아끼는 것은 비동기 논블로킹
      - **서버:** MVC는 요청마다 스레드가 블로킹으로 기다리고, 웹플럭스는 이벤트 루프가 논블로킹으로 다룬다. 이벤트 루프에서 블로킹 코드는 금지
    checklist:
      - 동기와 비동기를 결과를 챙기는 쪽으로 구분했다
      - 블로킹과 논블로킹을 스레드가 멈추는지로 구분했다
      - 두 구분이 다른 질문이라 조합된다고 말했다
      - 스레드 퍼 리퀘스트와 이벤트 루프의 차이를 말했다
      - 이벤트 루프에서 블로킹 코드를 부르면 생기는 문제나 비동기로 감싸고 바로 join하는 실수를 말했다
    source: https://docs.spring.io/spring-framework/reference/web/webflux/new-framework.html
