# 제네릭 문제
# 형식: https://github.com/wanja727/retrievo/blob/main/docs/content-format.md
#
# 모든 문제는 coreQuestions의 질문 하나에 묶이고(coreQuestion), 답의 근거가 레슨 본문에 있다
# (site/src/content/lesson-pages/generics.yaml의 says).
# 동작과 컴파일 결과는 verification의 GenericsTest로 확인했다 (자바 21의 javac).
# 질문마다 첫 문제는 본문의 예시로 묻고, 둘째 문제는 다른 상황으로 옮겨 묻는다.
# 2026-11-25에 만들고 같은 날 검수해 reviewed로 바꿨다.
subject:
  key: dev
  name: 개발자 면접
lesson:
  key: generics
  title: 제네릭
  unit: 자바 언어
  order: 47
concepts:
  - key: core
    name: 제네릭
coreQuestions:
  - key: q1
    text: "제네릭은 어떤 문제를 해결하나요?"
  - key: q2
    text: "꺾쇠 안의 타입은 실행 중에 어떻게 되나요?"
  - key: q3
    text: "List<Integer>는 왜 List<Number>에 넣을 수 없나요?"
  - key: q4
    text: "와일드카드 ? extends와 ? super는 언제 쓰나요?"
questions:
  # ── 질문 1 ──
  - key: gen-raw-vs-typed
    concept: core
    coreQuestion: q1
    type: multiple_choice
    status: reviewed
    difficulty: 1
    body: 문자열 목록에 실수로 Long 값 10L을 넣는 코드를 두 가지로 썼어요. List list(제네릭 없음)와 List<String> list. 각각 이 실수는 언제 드러날까요?
    choices:
      - 둘 다 넣는 줄의 컴파일 오류
      - 제네릭 없음은 꺼내서 형변환하는 줄에서 ClassCastException, List<String>은 넣는 줄의 컴파일 오류
      - 제네릭 없음은 넣는 줄에서 예외, List<String>은 꺼내는 줄에서 예외
      - 둘 다 드러나지 않는다
    answer: "2"
    explanation: |-
      **제네릭이 없으면 꺼내는 줄의 실행 중 예외, 있으면 넣는 줄의 컴파일 오류예요.**

      - 제네릭 없는 리스트는 Object로 담아서 무엇이든 넣을 수 있어요
      - List<String>이라고 적으면 컴파일러가 넣는 곳을 검사해요
      - 실수가 실행 전으로 당겨지는 것이 제네릭이 하는 일이에요
    source: https://docs.oracle.com/javase/specs/jls/se21/html/jls-4.html#jls-4.8
  - key: gen-bounded
    concept: core
    coreQuestion: q1
    type: code_predict
    status: reviewed
    difficulty: 2
    body: 아래 max에 List<String>과 List<Object>를 각각 넘기면 컴파일 결과는 어떻게 될까요?
    code: |-
      static <T extends Comparable<T>> T max(
          List<T> list) { ... }
    choices:
      - 둘 다 컴파일된다
      - List<String>은 되고 List<Object>는 컴파일 오류
      - List<Object>는 되고 List<String>은 컴파일 오류
      - 둘 다 컴파일 오류
    answer: "2"
    explanation: |-
      **List<String>만 돼요.** T의 범위를 Comparable<T>로 제한했고, String은 Comparable이지만 Object는 아니에요.

      - 그래서 메서드 안에서 compareTo를 부를 수 있어요
    source: https://docs.oracle.com/javase/specs/jls/se21/html/jls-8.html#jls-8.1.2
  # ── 질문 2 ──
  - key: gen-pollution
    concept: core
    coreQuestion: q2
    type: code_predict
    status: reviewed
    difficulty: 1
    body: 아래 코드를 실행하면 ClassCastException이 나는 줄은 어디일까요?
    code: |-
      List<String> names = new ArrayList<>();
      List raw = names;
      raw.add(10L);
      String first = names.get(0);
    choices:
      - List raw = names;
      - raw.add(10L);
      - String first = names.get(0);
      - 예외가 나지 않는다
    answer: "3"
    explanation: |-
      **String first = names.get(0); 줄이에요.** 로 타입으로 넣으면 검사 없이 지나가고, 꺼내는 줄에 컴파일러가 넣은 (String) 형변환에서 터져요.

      - 실행 중의 리스트는 자기가 String용인지 몰라서 넣을 때 막지 못해요
      - 형변환이 보이지 않는 줄에서 ClassCastException이 나면 이것을 의심해요
    source: https://docs.oracle.com/javase/specs/jls/se21/html/jls-4.html#jls-4.6
  - key: gen-erasure-overload
    concept: core
    coreQuestion: q2
    type: code_predict
    status: reviewed
    difficulty: 2
    body: 아래 클래스를 컴파일하면 어떻게 될까요?
    code: |-
      class Repo {
        void save(List<String> names) {}
        void save(List<Long> ids) {}
      }
    choices:
      - 컴파일된다. 매개변수의 타입이 다르다
      - 컴파일 오류. 타입 인자를 지우면 두 메서드가 같아진다
      - 컴파일되지만 둘째 메서드만 불린다
      - 컴파일되지만 실행할 때 예외가 난다
    answer: "2"
    explanation: |-
      **컴파일 오류예요.** 타입 인자를 지우면 둘 다 save(List)가 돼요.

      - 실행 중에는 List<String>과 List<Long>이 구별되지 않아요
      - 이름을 다르게 지어야 해요
    source: https://docs.oracle.com/javase/specs/jls/se21/html/jls-8.html#jls-8.4.2
  - key: gen-jackson-list
    concept: core
    coreQuestion: q2
    type: code_predict
    status: reviewed
    difficulty: 2
    body: json은 주문 객체 둘의 배열이에요. 아래 코드가 경고와 함께 컴파일됐어요. 실행하면 어떻게 될까요?
    code: |-
      List<OrderDto> orders =
          objectMapper.readValue(json, List.class);
      OrderDto first = orders.get(0);
    choices:
      - 정상으로 첫 주문을 꺼낸다
      - readValue 줄에서 예외가 난다
      - orders.get(0) 줄에서 ClassCastException. 원소가 LinkedHashMap이다
      - first가 null이 된다
    answer: "3"
    explanation: |-
      **orders.get(0) 줄에서 ClassCastException이 나요.** List.class에는 원소의 타입이 없어서 Jackson이 원소를 LinkedHashMap으로 만들어요.

      - 대입은 경고만 내고 지나가고, 꺼내는 줄의 숨은 형변환에서 터져요
      - new TypeReference<List<OrderDto>>() {}로 원소 타입까지 넘겨요
    source: https://docs.oracle.com/javase/specs/jls/se21/html/jls-4.html#jls-4.6
  # ── 질문 3 ──
  - key: gen-invariant
    concept: core
    coreQuestion: q3
    type: code_predict
    status: reviewed
    difficulty: 1
    body: 아래 네 줄 가운데 컴파일 오류가 나는 줄은 어디일까요?
    code: |-
      List<Integer> ints = new ArrayList<>();
      List<Number> nums = ints;
      nums.add(3.14);
      Integer n = ints.get(0);
    choices:
      - List<Number> nums = ints;
      - nums.add(3.14);
      - Integer n = ints.get(0);
      - 오류가 없고 실행 중에 예외가 난다
    answer: "1"
    explanation: |-
      **List<Number> nums = ints; 줄이에요.** 허용되면 nums로 같은 리스트에 Double을 넣어 List<Integer>가 깨지기 때문이에요.

      - 실행 중에는 타입이 지워져 막을 수 없어서 컴파일러가 대입을 막아요
      - Integer가 Number의 자식이어도 List<Integer>는 List<Number>의 자식이 아니에요
    source: https://docs.oracle.com/javase/specs/jls/se21/html/jls-4.html#jls-4.10.2
  - key: gen-array-store
    concept: core
    coreQuestion: q3
    type: code_predict
    status: reviewed
    difficulty: 2
    body: 아래 코드는 어떻게 될까요?
    code: |-
      Object[] arr = new String[1];
      arr[0] = 10;
    choices:
      - 첫 줄에서 컴파일 오류
      - 컴파일되고 실행 중에 ArrayStoreException
      - 정상으로 실행된다
      - 둘째 줄에서 컴파일 오류
    answer: "2"
    explanation: |-
      **컴파일되고 실행 중에 ArrayStoreException이 나요.** 배열은 String[]을 Object[] 자리에 허용하고, 실행 중에 원소 타입을 확인해서 막아요.

      - 같은 문제를 배열은 실행 중에, 제네릭은 컴파일할 때 막아요
    source: https://docs.oracle.com/javase/specs/jls/se21/html/jls-10.html#jls-10.5
  # ── 질문 4 ──
  - key: gen-extends
    concept: core
    coreQuestion: q4
    type: code_predict
    status: reviewed
    difficulty: 1
    body: 아래 메서드 안의 두 줄은 각각 컴파일될까요?
    code: |-
      double sum(List<? extends Number> list) {
        Number n = list.get(0);
        list.add(1);
        ...
      }
    choices:
      - 둘 다 된다
      - 첫째는 되고 둘째는 컴파일 오류
      - 첫째는 컴파일 오류, 둘째는 된다
      - 둘 다 컴파일 오류
    answer: "2"
    explanation: |-
      **꺼내는 첫째 줄만 돼요.** ? extends Number는 Number의 자식인 어떤 타입의 리스트라 Number로 꺼낼 수 있어요.

      - 실제로는 List<Double>일 수도 있어서 아무것도 넣을 수 없어요
      - 꺼내기만 하는 매개변수에 extends를 써요
    source: https://docs.oracle.com/javase/specs/jls/se21/html/jls-4.html#jls-4.5.1
  - key: gen-super
    concept: core
    coreQuestion: q4
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: 'void addDefaults(List<? super Long> ids) { ids.add(0L); }에 List<Number>와 List<Integer>를 각각 넘기면 어떻게 될까요?'
    choices:
      - 둘 다 된다
      - List<Number>는 되고 List<Integer>는 컴파일 오류
      - List<Integer>는 되고 List<Number>는 컴파일 오류
      - 둘 다 컴파일 오류
    answer: "2"
    explanation: |-
      **List<Number>만 돼요.** ? super Long은 Long의 부모 타입의 리스트이고, Integer는 Long의 부모가 아니에요.

      - Long의 부모 타입 리스트에는 Long을 넣는 것이 언제나 안전해요
      - 넣기만 하는 매개변수에 super를 써요
    source: https://docs.oracle.com/javase/specs/jls/se21/html/jls-4.html#jls-4.5.1
  # ── 네 질문을 하나로 ──
  - key: gen-interview
    concept: core
    coreQuestion: all
    type: descriptive
    status: reviewed
    difficulty: 2
    body: 면접에서 "제네릭의 타입 소거를 설명해 주세요"라는 질문을 받았어요. 1분 안에 답해 보세요.
    explanation: |-
      **컴파일러가 꺾쇠 안의 타입으로 검사를 마친 뒤 그 정보를 지우고 꺼내는 자리에 형변환을 넣는 것이에요.**

      - **목적:** 잘못된 타입을 넣는 실수를 컴파일 오류로 잡는다
      - **소거:** 실행 중에 List<String>과 List<Long>은 같은 클래스다. new T(), instanceof List<String>, 타입 인자만 다른 오버로딩은 안 된다
      - **무공변과 와일드카드:** List<Integer>는 List<Number>가 아니다. 꺼낼 때 extends, 넣을 때 super
      - **주의:** 로 타입으로 검사를 비켜 가면 꺼내는 줄에서 ClassCastException. JSON은 TypeReference로 원소 타입까지 넘긴다
    checklist:
      - 제네릭은 잘못된 타입을 컴파일 오류로 잡아 준다고 말했다
      - 컴파일러가 타입 인자를 지우고 형변환을 넣는다(타입 소거)고 말했다
      - 그래서 실행 중에 타입 인자가 필요한 일은 할 수 없다는 예를 들었다
      - List<Integer>는 List<Number>가 아니고 와일드카드로 해결한다고 말했다
      - 로 타입이나 List.class로 읽으면 꺼내는 곳에서 ClassCastException이 난다고 말했다
    source: https://docs.oracle.com/javase/specs/jls/se21/html/jls-4.html#jls-4.6
