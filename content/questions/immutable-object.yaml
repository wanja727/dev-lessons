    text: "record는 무엇을 대신 만들어 주고, 무엇은 해 주지 않나요?"
questions:
  # ── 질문 1 ──
  - key: imm-local-date
    concept: core
    coreQuestion: q1
    type: code_predict
    status: reviewed
    difficulty: 1
    body: 아래 코드는 무엇을 출력할까요?
    code: |-
      LocalDate d = LocalDate.of(2026, 1, 31);
      d.plusDays(1);
      System.out.println(d);
    choices:
      - 2026-02-01
      - 2026-01-31
      - 2026-01-32
      - 컴파일 오류
    answer: "2"
    explanation: |-
      **2026-01-31이에요.** LocalDate는 불변이라 plusDays는 새 날짜를 돌려줄 뿐 d를 바꾸지 않아요.

      - 결과를 받지 않았으니 새 날짜는 버려졌어요
      - d = d.plusDays(1)처럼 받아야 해요
    source: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/time/LocalDate.html
  - key: imm-money-plus
    concept: core
    coreQuestion: q1
    type: code_predict
    status: reviewed
    difficulty: 2
    body: Money는 불변이고 plus는 합계를 가진 새 Money를 돌려줘요. 아래 코드를 실행한 뒤 a의 금액은 얼마일까요?
    code: |-
      Money a = new Money(1000, "KRW");
      Money b = a;
      b = b.plus(500);
    choices:
      - "1000"
      - "1500"
      - "500"
      - 컴파일 오류
    answer: "1"
    explanation: |-
      **1000이에요.** plus는 a가 가리키는 객체를 고치지 않고 새 객체를 만들어요.

      - b = a로 같은 객체를 가리켰지만, b = b.plus(500)은 b가 새 객체를 가리키게 할 뿐이에요
      - 불변 객체는 함께 가리켜도 한쪽이 바꿀 수 없어서 안전해요
    source: https://docs.oracle.com/javase/specs/jls/se21/html/jls-8.html#jls-8.10
  # ── 질문 2 ──
  - key: imm-final-list
    concept: core
    coreQuestion: q2
    type: code_predict
    status: reviewed
    difficulty: 1
    body: 아래 Order는 클래스도 필드도 final이고 setter가 없어요. 마지막 줄은 무엇을 출력할까요?
    code: |-
      final class Order {
        private final List<String> items;
        Order(List<String> items) { this.items = items; }
        List<String> getItems() { return items; }
      }

      List<String> cart = new ArrayList<>();
      cart.add("키보드");
      Order order = new Order(cart);
      cart.add("마우스");
      System.out.println(order.getItems().size());
    choices:
      - "1"
      - "2"
      - UnsupportedOperationException
      - 컴파일 오류
    answer: "2"
    explanation: |-
      **2예요.** this.items = items는 리스트를 복사하지 않고 참조만 복사해서, 필드와 cart가 같은 리스트를 가리켜요.

      - final은 필드에 다시 대입하는 것만 막고, 가리키는 리스트의 내용은 막지 않아요
      - 생성자에서 List.copyOf(items)로 받으면 1이 돼요
    source: https://docs.oracle.com/javase/specs/jls/se21/html/jls-4.html#jls-4.12.4
  - key: imm-final-array
    concept: core
    coreQuestion: q2
    type: code_predict
    status: reviewed
    difficulty: 2
    body: 아래 코드를 실행한 뒤 scores[0]은 얼마일까요?
    code: |-
      final int[] scores = {1, 2, 3};
      scores[0] = 9;
    choices:
      - "1"
      - "9"
      - 컴파일 오류. final 배열은 바꿀 수 없다
      - 실행할 때 예외
    answer: "2"
    explanation: |-
      **9예요.** final은 scores에 다른 배열을 대입하는 것만 막아요.

      - 배열의 칸을 바꾸는 것은 막지 않아요
      - scores = new int[3]처럼 다시 대입하면 그때 컴파일 오류예요
    source: https://docs.oracle.com/javase/specs/jls/se21/html/jls-4.html#jls-4.12.4
  # ── 질문 3 ──
  - key: imm-copy-of
    concept: core
    coreQuestion: q3
    type: code_predict
    status: reviewed
    difficulty: 1
    body: 아래 Order는 생성자에서 받은 리스트를 List.copyOf로 복사해 필드에 담아요. 마지막 줄은 무엇을 출력할까요?
    code: |-
      final class Order {
        private final List<String> items;
        Order(List<String> items) {
          this.items = List.copyOf(items);
        }
        List<String> getItems() { return items; }
      }

      List<String> cart = new ArrayList<>();
      cart.add("키보드");
      Order order = new Order(cart);
      cart.add("마우스");
      System.out.println(order.getItems().size());
    choices:
      - "1"
      - "2"
      - UnsupportedOperationException
      - 컴파일 오류
    answer: "1"
    explanation: |-
      **1이에요.** 받을 때 복사해서 필드와 바깥의 cart가 다른 리스트가 됐어요.

      - cart에 더한 "마우스"는 주문의 리스트에 보이지 않아요
      - List.copyOf의 결과는 고칠 수 없는 리스트라 getter로 그대로 내줘도 안전해요
    source: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/List.html#copyOf(java.util.Collection)
  - key: imm-view-vs-copy
    concept: core
    coreQuestion: q3
    type: code_predict
    status: reviewed
    difficulty: 2
    body: 아래 코드를 실행한 뒤 view.size()와 copy.size()는 각각 얼마일까요?
    code: |-
      List<String> src = new ArrayList<>(List.of("A"));
      List<String> view = Collections.unmodifiableList(src);
      List<String> copy = List.copyOf(src);
      src.add("B");
    choices:
      - 1과 1
      - 2와 1
      - 1과 2
      - 2와 2
    answer: "2"
    explanation: |-
      **2와 1이에요.** unmodifiableList는 원본을 비추는 창이고, List.copyOf는 만들 때 복사한 다른 리스트예요.

      - 창으로는 고칠 수 없지만 원본이 바뀌면 창에 보여요
      - 그래서 넘겨받은 리스트를 지키려면 받을 때 List.copyOf를 써요
    source: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/Collections.html#unmodifiableList(java.util.List)
  - key: imm-response-shared
    concept: core
    coreQuestion: q3
    type: code_predict
    status: reviewed
    difficulty: 2
    body: 응답 record에 간결한 생성자가 없어요. 서비스가 엔티티의 ArrayList를 그대로 넘겨 응답을 만든 뒤, 다른 곳에서 response.items().add("모니터")를 실행했어요. 어떻게 될까요?
    code: |-
      record OrderResponse(long id, List<String> items) {}

      OrderResponse response = new OrderResponse(
          order.getId(), order.getItemNames());
      response.items().add("모니터");
    choices:
      - UnsupportedOperationException. record는 불변이다
      - 응답에만 추가되고 엔티티의 리스트는 그대로다
      - 추가되고, 같은 리스트라 엔티티의 리스트도 함께 바뀐다
      - 컴파일 오류
    answer: "3"
    explanation: |-
      **엔티티의 리스트도 함께 바뀌어요.** record는 넘겨받은 리스트를 그대로 가리켜요.

      - record의 필드는 final일 뿐, 가리키는 리스트의 내용은 막지 않아요
      - 간결한 생성자에서 items = List.copyOf(items)로 복사하면 막혀요
    source: https://docs.oracle.com/javase/specs/jls/se21/html/jls-8.html#jls-8.10
  # ── 질문 4 ──
  - key: imm-record-equals
    concept: core
    coreQuestion: q4
    type: code_predict
    status: reviewed
    difficulty: 1
    body: 아래 두 줄은 각각 무엇을 출력할까요?
    code: |-
      record Money(long amount, String currency) {}

      Money a = new Money(1000, "KRW");
      Money b = new Money(1000, "KRW");
      System.out.println(a == b);
      System.out.println(a.equals(b));
    choices:
      - true, true
      - false, true
      - false, false
      - true, false
    answer: "2"
    explanation: |-
      **false, true예요.** record는 구성 요소 전체를 비교하는 equals를 만들어 줘요.

      - 객체는 둘이라 ==는 false예요
      - hashCode도 equals에 맞게 만들어져서 HashSet과 HashMap에서 같은 키로 다뤄져요
    source: https://docs.oracle.com/javase/specs/jls/se21/html/jls-8.html#jls-8.10
  - key: imm-record-accessor
    concept: core
    coreQuestion: q4
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: 'record Point(int x, int y) {}의 객체 p에 대해 아래 셋 가운데 컴파일되는 것은 무엇일까요? p.x = 5; / p.getX() / p.x()'
    choices:
      - p.x = 5;
      - p.getX()
      - p.x()
      - 셋 다 된다
    answer: "3"
    explanation: |-
      **p.x()만 돼요.** record의 필드는 final이고, 접근자 이름은 구성 요소 이름 그대로예요.

      - get이 붙은 접근자는 만들어지지 않아요
      - 값을 바꾸려면 새 record를 만들어요
    source: https://docs.oracle.com/javase/specs/jls/se21/html/jls-8.html#jls-8.10.3
  # ── 네 질문을 하나로 ──
  - key: imm-interview
    concept: core
    coreQuestion: all
    type: descriptive
    status: reviewed
    difficulty: 2
    body: 면접에서 "불변 객체를 어떻게 만들고 왜 쓰나요?"라는 질문을 받았어요. 1분 안에 답해 보세요.
    explanation: |-
      **만든 뒤 바뀌지 않게 private final 필드와 setter 없음에 더해 가변 객체를 복사해서 가지고, 그래서 어디에 넘겨도 안전해요.**

      - **이유:** 넘겨도, 캐시나 맵의 키로 써도, 여러 스레드가 읽어도 안전하다. 바꾸려면 새 객체를 만든다
      - **final의 한계:** 재대입만 막는다. 가리키는 리스트의 내용은 바뀐다
      - **방어적 복사:** 받을 때 List.copyOf, 내줄 때 고칠 수 없는 것으로. unmodifiableList는 원본을 비추는 뷰다
      - **record:** final 필드, 생성자, 접근자, equals와 hashCode를 만들어 주지만 가변 구성 요소의 복사는 간결한 생성자에서 직접 한다
    checklist:
      - 불변 객체는 만든 뒤 상태가 바뀌지 않고 바꾸려면 새 객체를 만든다고 말했다
      - 넘겨도, 맵의 키로 써도, 여러 스레드가 읽어도 안전하다는 이유를 말했다
      - final은 재대입만 막고 가리키는 객체의 내용은 막지 않는다고 말했다
      - 가변 필드는 받을 때 복사한다(List.copyOf)고 말했다
      - record가 만들어 주는 것과 가변 구성 요소는 직접 복사해야 한다는 것을 말했다
    source: https://docs.oracle.com/javase/specs/jls/se21/html/jls-8.html#jls-8.10
