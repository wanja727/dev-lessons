concepts:
  - key: core
    name: 불변 객체
coreQuestions:
  - key: q1
    text: "불변 객체는 무엇이고 왜 쓰나요?"
  - key: q2
    text: "final을 붙이면 불변이 되나요?"
  - key: q3
    text: "필드가 리스트 같은 가변 객체를 가리킬 때는 어떻게 지키나요?"
