# DB 데드락 문제
# 형식: https://github.com/wanja727/retrievo/blob/main/docs/content-format.md
#
# 모든 문제는 coreQuestions의 질문 하나에 묶이고(coreQuestion), 답의 근거가 레슨 본문에 있다
# (site/src/content/lesson-pages/db-deadlock.yaml의 says).
# 동작에 관한 정답은 verification의 DbDeadlockTest로 확인했다 (PostgreSQL 16).
# 질문마다 첫 문제는 본문의 예시로 묻고, 둘째 문제는 다른 상황으로 옮겨 묻는다.
subject:
  key: dev
  name: 개발자 면접
lesson:
  key: db-deadlock
  title: DB 데드락
  unit: DB
  order: 611
concepts:
  - key: core
    name: DB 데드락
coreQuestions:
  - key: q1
    text: "DB 데드락은 어떻게 생기나요?"
  - key: q2
    text: "DB는 데드락을 어떻게 푸나요?"
  - key: q3
    text: "데드락을 줄이려면 어떻게 하나요?"
  - key: q4
    text: "데드락이 나면 앱은 어떻게 하나요?"
questions:
  # ── 질문 1 ──
  - key: dl-third-statement
    concept: core
    coreQuestion: q1
    type: multiple_choice
    status: draft
    difficulty: 1
    body: "이체 A는 kim(1번 행)에서 빼고 lee(2번 행)에 더하고, 이체 B는 lee에서 빼고 kim에 더해요. A와 B가 각자 첫 UPDATE를 끝낸 뒤, A가 lee에 더하는 UPDATE를 보냈어요. B는 아직 둘째 문장을 보내지 않았어요. 지금 A는 어떤 상태인가요?"
    choices:
      - 바로 성공한다
      - B가 2번 행을 쥐고 있어 기다린다. 아직 데드락은 아니다
      - 데드락으로 바로 실패한다
      - B의 첫 UPDATE가 롤백된다
    answer: "2"
    explanation: |-
      **기다려요. 아직 데드락은 아니에요.** B가 커밋하면 풀리는 평범한 락 대기예요.

      - B도 1번 행을 기다리는 순간 서로 기다리는 고리가 생겨 데드락이 돼요
      - UPDATE는 고친 행을 커밋까지 잠가요
    source: https://www.postgresql.org/docs/16/explicit-locking.html#LOCKING-DEADLOCKS
  - key: dl-stock-order
    concept: core
    coreQuestion: q1
    type: multiple_choice
    status: draft
    difficulty: 1
    body: "주문 A는 상품 7, 상품 3 순서로, 주문 B는 상품 3, 상품 7 순서로 재고를 `update`로 빼요. 둘이 거의 동시에 첫 UPDATE를 끝냈어요. 다음에 무슨 일이 생기나요?"
    choices:
      - 둘 다 바로 성공한다
      - 서로 상대가 잠근 행을 기다려 데드락이 생긴다
      - 한쪽이 잠깐 기다린 뒤 둘 다 성공한다
      - FOR UPDATE를 쓰지 않았으니 락이 없다
    answer: "2"
    explanation: |-
      **데드락이 생겨요.** A는 상품 7을, B는 상품 3을 쥔 채 서로의 행을 기다려요.

      - UPDATE도 행을 잠가서 FOR UPDATE 없이도 생겨요
      - 같은 순서로 잠그면 생기지 않아요
    source: https://www.postgresql.org/docs/16/explicit-locking.html#LOCKING-DEADLOCKS
  # ── 질문 2 ──
  - key: dl-rollback-all
    concept: core
    coreQuestion: q2
    type: ox
    status: draft
    difficulty: 1
    body: "데드락으로 40P01 오류를 받은 트랜잭션에서, 오류 전에 성공한 UPDATE는 반영된 채로 남는다."
    answer: X
    explanation: |-
      **X. 모두 롤백돼요.** 데드락으로 끝난 트랜잭션은 앞에서 성공한 문장까지 전부 되돌려요.

      - 그래서 이체가 반만 되어 돈이 사라지는 일은 없어요
      - 앱은 트랜잭션을 처음부터 다시 실행해요
    source: https://www.postgresql.org/docs/16/explicit-locking.html#LOCKING-DEADLOCKS
  - key: dl-timeout-wait
    concept: core
    coreQuestion: q2
    type: multiple_choice
    status: draft
    difficulty: 2
    body: "`deadlock_timeout`이 기본값(1초)인 PostgreSQL에서 데드락이 생겼어요. 데드락에 걸린 요청은 오류를 받기까지 대략 얼마나 기다리나요?"
    choices:
      - 기다리지 않고 바로
      - 1초쯤
      - 30초쯤
      - 영원히
    answer: "2"
    explanation: |-
      **1초쯤이에요.** 기다림이 `deadlock_timeout`을 넘으면 그때 고리를 검사해요.

      - 고리를 찾는 일이 비싸서 기다림마다 바로 하지 않아요
      - 고리가 있으면 한 트랜잭션을 40P01로 끝내요
    source: https://www.postgresql.org/docs/16/runtime-config-locks.html
  # ── 질문 3 ──
  - key: dl-ordered-transfer
    concept: core
    coreQuestion: q3
    type: multiple_choice
    status: draft
    difficulty: 1
    body: "kim(id 1)과 lee(id 2)가 서로에게 동시에 이체해요. 두 이체 모두 보내는 쪽, 받는 쪽과 상관없이 id가 작은 계좌부터 잠그도록 고쳤어요. 동시에 실행되면 어떻게 되나요?"
    choices:
      - 여전히 데드락이 생긴다
      - 한쪽이 잠깐 기다린 뒤 차례로 둘 다 성공한다
      - 둘 다 바로 실패한다
      - 한쪽 이체는 무시된다
    answer: "2"
    explanation: |-
      **차례로 둘 다 성공해요.** 둘 다 1번 다음 2번을 잠그니 서로 엇갈리는 고리가 생기지 않아요.

      - 나중 쪽은 1번 행에서 기다렸다가 앞 이체가 끝나면 진행해요
      - 테스트에서 20번 돌려 데드락이 0번이었어요
    source: https://www.postgresql.org/docs/16/explicit-locking.html#LOCKING-DEADLOCKS
  - key: dl-cart-order
    concept: core
    coreQuestion: q3
    type: multiple_choice
    status: draft
    difficulty: 2
    body: "장바구니 주문이 담긴 상품들의 재고를 장바구니에 담은 순서대로 하나씩 빼요. 가끔 `deadlock detected`가 나요. 가장 알맞은 고침은?"
    choices:
      - 상품 id 순으로 정렬해 빼거나 `order by id for update`로 한꺼번에 잠근다
      - 격리 수준을 SERIALIZABLE로 올린다
      - deadlock_timeout을 10초로 늘린다
      - 재고 테이블의 인덱스를 지운다
    answer: "1"
    explanation: |-
      **모든 주문이 같은 순서로 잠그게 해요.** 담은 순서는 주문마다 달라서 엇갈려요.

      - 순서가 같으면 서로 기다리는 고리가 생기지 않아요
      - deadlock_timeout을 늘리면 데드락이 더 오래 기다릴 뿐이에요
    source: https://www.postgresql.org/docs/16/explicit-locking.html#LOCKING-DEADLOCKS
  # ── 질문 4 ──
  - key: dl-retry-whole
    concept: core
    coreQuestion: q4
    type: multiple_choice
    status: draft
    difficulty: 2
    body: "이체 트랜잭션이 둘째 UPDATE에서 데드락으로 실패했어요. 다시 시도할 때 무엇을 다시 실행해야 하나요?"
    choices:
      - 실패한 둘째 UPDATE만
      - 트랜잭션 전체를 처음부터
      - 아무것도. DB가 알아서 다시 한다
      - 첫 UPDATE만
    answer: "2"
    explanation: |-
      **트랜잭션 전체를 처음부터 다시 실행해요.** 실패한 트랜잭션은 첫 UPDATE까지 롤백됐어요.

      - 둘째 문장만 보내면 받는 쪽에만 돈이 더해져요
      - 다시 하면 대개 상대가 끝난 뒤라 바로 성공해요
    source: https://www.postgresql.org/docs/16/explicit-locking.html#LOCKING-DEADLOCKS
  - key: dl-many-logs
    concept: core
    coreQuestion: q4
    type: multiple_choice
    status: draft
    difficulty: 2
    body: "데드락 다시 시도를 넣었더니 사용자 오류는 사라졌지만, 로그에 데드락이 하루 수천 번 찍혀요. 다음에 할 일은?"
    choices:
      - 다시 시도 횟수를 10번으로 늘린다
      - 데드락 로그에서 두 문장을 찾아 잠그는 순서를 맞춘다
      - deadlock_timeout을 늘린다
      - 로그 수준을 낮춰 안 보이게 한다
    answer: "2"
    explanation: |-
      **잠그는 순서를 맞춰요.** 자주 나는 데드락은 순서가 엇갈린다는 신호예요.

      - 다시 시도는 드문 데드락을 받는 장치예요
      - 순서를 맞추면 애초에 생기지 않아요
    source: https://www.postgresql.org/docs/16/explicit-locking.html#LOCKING-DEADLOCKS
  - key: dl-swallow
    concept: core
    coreQuestion: q4
    type: multiple_choice
    status: draft
    difficulty: 2
    body: "이체 컨트롤러가 서비스의 데드락 예외(`PessimisticLockingFailureException`)를 잡아 로그만 남기고 \"이체 완료\"로 응답해요. 데드락이 나면 실제로는 어떻게 되나요?"
    choices:
      - 이체가 반영된다
      - 이체는 롤백되어 일어나지 않았는데 사용자는 완료로 안다
      - 보내는 쪽에서만 돈이 빠진다
      - DB가 나중에 자동으로 다시 실행한다
    answer: "2"
    explanation: |-
      **이체는 일어나지 않았는데 완료로 응답해요.** 데드락으로 끝난 트랜잭션은 전부 롤백됐어요.

      - 다시 시도하거나 실패를 그대로 돌려줘요
      - 로그만 남기고 삼키면 돈이 오가지 않은 채 사용자만 속아요
    source: https://docs.spring.io/spring-framework/reference/data-access/dao.html
  # ── 면접 질문 ──
  - key: dl-interview
    concept: core
    coreQuestion: all
    type: descriptive
    status: draft
    difficulty: 2
    body: 면접에서 "DB 데드락이 무엇이고 어떻게 막나요?"라는 질문을 받았어요. 1분 안에 답해 보세요.
    explanation: |-
      **서로 상대가 잠근 행을 기다리는 상태이고, DB가 한쪽을 끊어 주지만 같은 순서로 잠가 줄이고 다시 시도로 받아요.**

      - **생기는 법:** 두 트랜잭션이 행을 반대 순서로 잠근다. UPDATE도 행을 잠근다
      - **DB가 푸는 법:** deadlock_timeout 뒤 고리를 찾아 한쪽을 40P01로 끝내고 전부 롤백
      - **줄이는 법:** id 순으로 잠그기, 트랜잭션을 짧게
      - **앱:** 트랜잭션 전체를 바깥에서 다시 시도. 자주 나면 순서를 고친다
    checklist:
      - 두 트랜잭션이 서로 상대가 잠근 행을 기다리는 상태라고 말했다
      - DB가 고리를 찾아 한 트랜잭션을 실패시키고 롤백한다고 말했다
      - 같은 순서로 잠그면 고리가 생기지 않는다고 말했다
      - 트랜잭션을 짧게 해 겹칠 시간을 줄인다고 말했다
      - 실패한 트랜잭션은 전체를 다시 시도한다고 말했다
    source: https://www.postgresql.org/docs/16/explicit-locking.html#LOCKING-DEADLOCKS
