# 브라우저에 주소를 입력하면 문제
# 형식: https://github.com/wanja727/retrievo/blob/main/docs/content-format.md
#
# 모든 문제는 coreQuestions의 질문 하나에 묶이고(coreQuestion), 답의 근거가 레슨 본문에 있다
# (site/src/content/lesson-pages/url-to-response.yaml의 says).
# 동작에 관한 정답은 verification의 UrlToResponseTest로 확인했다 (자바 21, 톰캣 10.1).
# 질문마다 첫 문제는 본문의 예시로 묻고, 둘째 문제는 다른 상황으로 옮겨 묻는다.
subject:
  key: dev
  name: 개발자 면접
lesson:
  key: url-to-response
  title: 브라우저에 주소를 입력하면
  unit: 네트워크와 웹
  order: 55
concepts:
  - key: core
    name: 브라우저에 주소를 입력하면
coreQuestions:
  - key: q1
    text: "주소(URL)는 무엇을 알려 주나요?"
  - key: q2
    text: "호스트 이름으로 어떻게 서버를 찾나요?"
  - key: q3
    text: "서버를 찾은 뒤 요청은 어떻게 가나요?"
  - key: q4
    text: "응답을 받은 브라우저는 무엇을 더 하나요?"
questions:
  # ── 질문 1 ──
  - key: utr-default-port
    concept: core
    coreQuestion: q1
    type: multiple_choice
    status: draft
    difficulty: 1
    body: "브라우저에 `https://shop.example.com/products/7`을 입력했어요. 주소에 포트를 적지 않았어요. 브라우저는 서버의 몇 번 포트로 연결할까요?"
    choices:
      - "80"
      - "443"
      - "8080"
      - 포트 없이 연결한다
    answer: "2"
    explanation: |-
      **443번이에요.** 포트를 적지 않으면 스킴이 정해요.

      - https의 기본 포트는 443, http는 80이에요
      - 8080처럼 다른 번호를 쓰려면 주소에 직접 적어요
    source: https://www.rfc-editor.org/rfc/rfc9110.html
  - key: utr-fragment
    concept: core
    coreQuestion: q1
    type: multiple_choice
    status: draft
    difficulty: 2
    body: "`http://localhost:8080/orders?page=2#top`을 열었어요. 스프링 서버의 컨트롤러가 요청에서 읽을 수 있는 것을 모두 고른 것은 무엇일까요?"
    choices:
      - 경로 /orders만
      - 경로 /orders와 쿼리 page=2
      - 경로 /orders, 쿼리 page=2, 프래그먼트 top
      - 프래그먼트 top만
    answer: "2"
    explanation: |-
      **경로와 쿼리예요.** # 뒤의 프래그먼트는 서버로 보내지 않아요.

      - 경로와 쿼리는 요청 글에 실려 서버가 해석해요
      - 프래그먼트는 브라우저가 페이지 안의 위치를 찾는 데만 써요
    source: https://www.rfc-editor.org/rfc/rfc3986.html
  # ── 질문 2 ──
  - key: utr-numeric-address
    concept: core
    coreQuestion: q2
    type: ox
    status: draft
    difficulty: 1
    body: "\"`InetAddress.getByName(\"127.0.0.1\")`은 DNS 서버에 물어서 주소를 얻는다\""
    answer: X
    explanation: |-
      **아니에요.** 숫자 주소는 이미 주소라서 DNS에 묻지 않고 그대로 써요.

      - DNS는 이름을 IP 주소로 바꿀 때만 필요해요
      - localhost도 묻지 않고 컴퓨터가 알아서 127.0.0.1로 답해요
    source: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/net/InetAddress.html
  - key: utr-dns-ttl
    concept: core
    coreQuestion: q2
    type: multiple_choice
    status: draft
    difficulty: 2
    body: "서비스의 서버를 새 IP 주소로 옮기고 DNS 기록을 바꿨어요. 그런데 몇 분 동안 일부 사용자가 옛 서버로 접속했어요. 가장 알맞은 이유는 무엇일까요?"
    choices:
      - DNS 기록을 바꾸면 하루가 지나야 적용되는 규칙이 있어서
      - 옛 주소가 TTL 동안 브라우저, OS, 리졸버에 기억되어 있어서
      - 사용자의 브라우저가 서버의 IP를 북마크해 둬서
      - 옛 서버가 새 서버로 요청을 넘겨서
    answer: "2"
    explanation: |-
      **옛 답이 TTL 동안 기억되어 있어서예요.** DNS의 답에는 유효 시간(TTL)이 붙어 와요.

      - 브라우저, OS, 리졸버가 TTL 동안 답을 기억하고 다시 묻지 않아요
      - 그래서 서버를 옮기기 전에 TTL을 미리 짧게 줄여 두기도 해요
    source: https://www.rfc-editor.org/rfc/rfc1034.html
  # ── 질문 3 ──
  - key: utr-host-header
    concept: core
    coreQuestion: q3
    type: multiple_choice
    status: draft
    difficulty: 1
    body: "자바 소켓으로 서버에 연결해 아래 요청 글을 그대로 써서 보냈어요. 서버가 이 요청이 어느 사이트로 온 것인지 알기 위해 보는 줄은 무엇일까요?"
    code: |-
      GET /products/7 HTTP/1.1
      Host: shop.example.com
      Connection: close
    choices:
      - "첫 줄의 GET"
      - "첫 줄의 /products/7"
      - "Host: shop.example.com"
      - "Connection: close"
    answer: "3"
    explanation: |-
      **Host 헤더예요.** IP 주소 하나에 사이트가 여럿 있을 수 있어서, 서버는 Host 헤더로 어느 사이트인지 구별해요.

      - 연결은 IP 주소로 맺었으니 연결만으로는 이름을 몰라요
      - 브라우저는 URL의 호스트를 Host 헤더에 적어 보내요
    source: https://www.rfc-editor.org/rfc/rfc9110.html#section-7.2
  - key: utr-https-extra-step
    concept: core
    coreQuestion: q3
    type: multiple_choice
    status: draft
    difficulty: 2
    body: "같은 서버를 처음으로 `http://`와 `https://` 두 가지로 열었어요. HTTP 요청을 보내기 전까지 https 쪽에만 있는 단계는 무엇일까요?"
    choices:
      - DNS로 IP 주소 찾기
      - TCP 연결 맺기
      - TLS 연결 맺기
      - Host 헤더 적기
    answer: "3"
    explanation: |-
      **TLS 연결이에요.** https는 TCP 연결 위에 TLS 연결을 한 번 더 맺어요.

      - DNS, TCP 연결, Host 헤더는 둘 다 해요
      - TLS 연결에서 서버의 인증서를 확인하고 암호화할 키를 정해요. 그만큼 왕복이 한 번 더 들어요
    source: https://www.rfc-editor.org/rfc/rfc9110.html#section-4.2.2
  - key: utr-read-timeout
    concept: core
    coreQuestion: q3
    type: code_predict
    status: draft
    difficulty: 2
    body: "결제 API는 요청을 받고 3초 뒤에 답해요. 아래처럼 만든 RestClient로 이 API를 부르면 어떻게 될까요? (스프링 부트 3.5)"
    code: |-
      var factory =
          new JdkClientHttpRequestFactory();
      factory.setReadTimeout(ofSeconds(1));
      RestClient client = RestClient.builder()
          .requestFactory(factory).build();
      client.get().uri(payUrl)
          .retrieve().body(String.class);
    choices:
      - 3초 뒤에 응답을 받는다
      - 1초쯤 뒤에 시간 초과 예외(ResourceAccessException)가 난다
      - 바로 ConnectException이 난다
      - 응답이 올 때까지 계속 기다린다
    answer: "2"
    explanation: |-
      **1초쯤 뒤에 시간 초과 예외가 나요.** 읽기 시간 제한은 요청을 보낸 뒤 응답을 기다리는 시간이에요.

      - 연결은 맺어졌으니 ConnectException은 아니에요
      - 시간 제한이 없으면 응답이 올 때까지 스레드가 묶여요. 외부 API를 부를 때는 시간 제한을 꼭 정해요
    source: https://docs.spring.io/spring-framework/reference/integration/rest-clients.html
  # ── 질문 4 ──
  - key: utr-subresources
    concept: core
    coreQuestion: q4
    type: multiple_choice
    status: draft
    difficulty: 1
    body: "브라우저가 받은 HTML에 `<link rel=\"stylesheet\" href=\"/app.css\">`와 `<script src=\"/app.js\"></script>`만 있어요. 이 페이지를 그리기 위해 브라우저가 보내는 요청은 최소 몇 개일까요?"
    choices:
      - 1개
      - 2개
      - 3개
      - 4개
    answer: "3"
    explanation: |-
      **3개예요.** HTML을 받는 요청 하나와, 그 안에 적힌 CSS와 JS를 받는 요청 둘이에요.

      - 브라우저는 HTML을 읽다 다른 파일의 주소를 만나면 요청을 더 보내요
      - 그래서 페이지 하나에 요청이 수십 개 나가기도 해요
    source: https://html.spec.whatwg.org/multipage/
  - key: utr-second-visit
    concept: core
    coreQuestion: q4
    type: multiple_choice
    status: draft
    difficulty: 2
    body: "같은 페이지를 연달아 두 번 열었더니 두 번째가 더 빨랐어요. 서버의 코드와 장비는 그대로예요. 이유로 맞지 않는 것은 무엇일까요?"
    choices:
      - DNS의 답을 기억해서 다시 묻지 않았다
      - 맺어 둔 TCP 연결을 다시 썼다
      - 두 번째에는 TLS 연결을 새로 맺지 않았다
      - 두 번째 요청에서는 서버의 CPU가 더 빨라졌다
    answer: "4"
    explanation: |-
      **서버의 CPU가 빨라진 것은 이유가 아니에요.** 처음 요청이 DNS, TCP, TLS를 모두 처음 해서 느린 거예요.

      - 두 번째에는 DNS 답을 기억하고 연결을 다시 써요
      - 연결을 다시 쓰면 TCP와 TLS 연결을 새로 맺지 않아요
    source: https://www.rfc-editor.org/rfc/rfc9112.html#section-9.3
  # ── 전체 ──
  - key: utr-interview
    concept: core
    coreQuestion: all
    type: descriptive
    status: draft
    difficulty: 2
    body: 면접에서 "브라우저 주소창에 URL을 입력하면 어떤 일이 일어나나요?"라는 질문을 받았어요. 1분 안에 순서대로 답해 보세요.
    explanation: |-
      **DNS로 주소를 찾고, TCP와 TLS로 연결한 뒤 HTTP 요청을 보내고, 받은 HTML로 추가 요청을 보내며 화면을 그려요.**

      - **URL:** 스킴, 호스트, 포트, 경로를 읽는다. 포트를 적지 않으면 https는 443
      - **DNS:** 호스트 이름을 IP 주소로 바꾼다. 답은 TTL 동안 캐시된다
      - **연결:** TCP 연결을 맺고, https면 TLS로 인증서를 확인하고 암호화할 키를 정한다
      - **HTTP:** Host 헤더를 넣은 GET 요청을 보내고 응답을 받는다
      - **화면:** HTML을 읽으며 CSS, JS, 이미지를 받으러 요청을 더 보낸다. 연결은 다시 쓴다
    checklist:
      - DNS로 호스트 이름을 IP 주소로 바꾼다고 말했다
      - TCP 연결을 맺고 https면 TLS 연결을 맺는다고 말했다
      - 연결 위로 HTTP 요청을 보내고 응답을 받는다고 말했다
      - HTML을 읽으며 CSS, JS, 이미지를 위해 요청을 더 보낸다고 말했다
      - DNS 캐시나 연결 재사용으로 두 번째 요청이 빨라진다고 말했다
    source: https://www.rfc-editor.org/rfc/rfc9110.html
