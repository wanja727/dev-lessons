# 자바 17과 21에서 달라진 것 문제
# 형식: https://github.com/wanja727/retrievo/blob/main/docs/content-format.md
#
# 모든 문제는 coreQuestions의 질문 하나에 묶이고(coreQuestion), 답의 근거가 레슨 본문에 있다
# (site/src/content/lesson-pages/modern-java.yaml의 says).
# 동작에 관한 정답은 verification의 ModernJavaTest로 확인했다 (자바 21, 미리 보기 기능 없음).
# 질문마다 첫 문제는 본문의 예시로 묻고, 둘째 문제는 다른 상황으로 옮겨 묻는다.
# 2026-11-25에 만든 문제다. 검수 전이라 draft다.
subject:
  key: dev
  name: 개발자 면접
lesson:
  key: modern-java
  title: 자바 17과 21에서 달라진 것
  unit: 자바 언어
  order: 54
concepts:
  - key: core
    name: sealed, record, switch 패턴 매칭
coreQuestions:
  - key: q1
    text: "sealed는 무엇을 정하나요?"
  - key: q2
    text: "switch 패턴 매칭은 instanceof 사슬과 무엇이 다른가요?"
  - key: q3
    text: "record 패턴으로 무엇을 할 수 있나요?"
  - key: q4
    text: "세 가지를 함께 쓰면 무엇이 달라지나요?"
questions:
  # ── 질문 1 ──
  - key: modern-sealed-permits
    concept: core
    coreQuestion: q1
    type: code_predict
    status: draft
    difficulty: 1
    body: 아래 PaymentResult가 있는 프로젝트에서 record Refunded(long amount) implements PaymentResult {}를 새로 선언하고 permits는 고치지 않았어요. 컴파일하면 어떻게 될까요?
    code: |-
      sealed interface PaymentResult
          permits Approved, Declined, Failed {}
    choices:
      - 컴파일된다. record는 언제나 final이다
      - 컴파일 오류. Refunded는 허용된 자식이 아니다
      - 컴파일되지만 실행 중에 예외가 난다
      - 경고만 나고 컴파일된다
    answer: "2"
    explanation: |-
      **컴파일 오류예요.** sealed 타입은 permits에 적은 타입만 구현할 수 있어요.

      - 새 종류를 더하려면 permits에도 적어야 해요
    source: https://openjdk.org/jeps/409
  - key: modern-sealed-child
    concept: core
    coreQuestion: q1
    type: code_predict
    status: draft
    difficulty: 2
    body: 아래 코드를 컴파일하면 어떻게 될까요?
    code: |-
      sealed class Shape
          permits Circle, Square {}

      class Circle extends Shape {}
      final class Square extends Shape {}
    choices:
      - 컴파일된다
      - Circle에서 컴파일 오류. final, sealed, non-sealed 가운데 하나를 밝혀야 한다
      - Square에서 컴파일 오류
      - Shape에서 컴파일 오류
    answer: "2"
    explanation: |-
      **Circle에서 컴파일 오류예요.** sealed의 자식 클래스는 자기 아래로 어디까지 열려 있는지 밝혀야 해요.

      - final은 더 상속하지 못하고, sealed는 다시 정해 둔 자식만, non-sealed는 누구나 상속해요
      - record는 언제나 final이라 적지 않아도 돼요
    source: https://docs.oracle.com/javase/specs/jls/se21/html/jls-8.html#jls-8.1.1.2
  # ── 질문 2 ──
  - key: modern-chain-pending
    concept: core
    coreQuestion: q2
    type: code_predict
    status: draft
    difficulty: 1
    body: PaymentResult의 permits에 Pending을 추가했어요. 아래 message는 고치지 않았어요. message(new Pending("T1"))은 어떻게 될까요?
    code: |-
      String message(PaymentResult r) {
        if (r instanceof Approved a) {
          return "승인 " + a.txId();
        } else if (r instanceof Declined d) {
          return "거절 " + d.reason();
        } else {
          return "오류";
        }
      }
    choices:
      - 컴파일 오류라 부를 수 없다
      - '"오류"를 돌려준다'
      - MatchException이 난다
      - "null을 돌려준다"
    answer: "2"
    explanation: |-
      **"오류"를 돌려줘요.** else는 나머지 전부를 받아서 컴파일러가 빠뜨린 것을 알려 주지 못해요.

      - 같은 일을 default 없는 switch로 쓰면 Pending을 다루지 않았다는 컴파일 오류가 나요
    source: https://openjdk.org/jeps/441
  - key: modern-dominated
    concept: core
    coreQuestion: q2
    type: code_predict
    status: draft
    difficulty: 2
    body: Object o에 대해 아래 switch를 쓰면 어떻게 될까요?
    code: |-
      return switch (o) {
        case Object x -> "객체";
        case String s -> "문자열";
      };
    choices:
      - 컴파일되고, 문자열이면 "문자열"을 돌려준다
      - 컴파일되고, 늘 "객체"를 돌려준다
      - 컴파일 오류. 앞의 case가 모두 받아 뒤의 case에 닿을 수 없다
      - 실행 중에 MatchException
    answer: "3"
    explanation: |-
      **컴파일 오류예요.** 넓은 타입의 case를 좁은 타입보다 먼저 쓰면 뒤의 case에 닿을 수 없어요.

      - catch의 순서와 같은 이유예요
      - 좁은 타입(String)을 먼저 써요
    source: https://docs.oracle.com/javase/specs/jls/se21/html/jls-14.html#jls-14.11
  # ── 질문 3 ──
  - key: modern-record-guard
    concept: core
    coreQuestion: q3
    type: code_predict
    status: draft
    difficulty: 1
    body: 아래 message에 new Approved("T1", 2_000_000)을 넘기면 무엇을 돌려줄까요?
    code: |-
      return switch (r) {
        case Approved(String txId, long amount)
            when amount >= 1_000_000 ->
            "고액 승인 " + txId;
        case Approved(String txId, long amount)
            -> "승인 " + txId;
        case Declined(String reason) ->
            "거절 " + reason;
        case Failed(Exception cause) -> "오류";
      };
    choices:
      - 고액 승인 T1
      - 승인 T1
      - 컴파일 오류. Approved의 case가 둘이다
      - 고액 승인 T1과 승인 T1 둘 다
    answer: "1"
    explanation: |-
      **고액 승인 T1이에요.** record 패턴이 txId와 amount를 꺼내고, 가드의 조건이 맞는 첫 case가 실행돼요.

      - 조건이 있는 case를 먼저 둬요
    source: https://openjdk.org/jeps/440
  - key: modern-point-pattern
    concept: core
    coreQuestion: q3
    type: code_predict
    status: draft
    difficulty: 2
    body: 아래 코드를 실행하면 무엇이 출력될까요?
    code: |-
      record Point(int x, int y) {}

      Object o = new Point(3, 4);
      if (o instanceof Point(int x, int y)) {
        print(x + y);
      }
    choices:
      - "7"
      - "34"
      - 컴파일 오류
      - 아무것도 출력하지 않는다
    answer: "1"
    explanation: |-
      **7이에요.** record 패턴은 instanceof에도 쓰고, Point인지 확인하면서 x와 y를 꺼내요.

      - 구성 요소가 record면 안쪽까지 중첩해서 꺼낼 수 있어요
    source: https://openjdk.org/jeps/440
  # ── 질문 4 ──
  - key: modern-default-pending
    concept: core
    coreQuestion: q4
    type: code_predict
    status: draft
    difficulty: 1
    body: 아래 switch가 있는 상태에서 PaymentResult의 permits에 Pending을 추가했어요. 컴파일은 될까요? message(new Pending("T1"))은 무엇을 돌려줄까요?
    code: |-
      return switch (r) {
        case Approved a -> "승인 " + a.txId();
        case Declined d -> "거절 " + d.reason();
        default -> "오류";
      };
    choices:
      - 컴파일 오류. Pending을 다루지 않았다
      - 컴파일되고 "오류"를 돌려준다
      - 컴파일되고 MatchException이 난다
      - 컴파일되고 null을 돌려준다
    answer: "2"
    explanation: |-
      **컴파일되고 "오류"를 돌려줘요.** default가 새 종류를 조용히 받아서 완전성 검사가 꺼져요.

      - sealed 타입의 switch에는 default를 쓰지 않고 종류를 모두 적어요
    source: https://openjdk.org/jeps/441
  - key: modern-five-switches
    concept: core
    coreQuestion: q4
    type: multiple_choice
    status: draft
    difficulty: 2
    body: sealed interface Shape permits Circle, Square를 default 없이 다루는 switch 식이 다섯 군데 있어요. Triangle을 permits에 추가하고 switch는 고치지 않았어요. 컴파일 오류가 나는 switch는 몇 군데일까요?
    choices:
      - 0군데
      - 1군데
      - 5군데 모두
      - Triangle을 처음 쓰는 곳 한 군데
    answer: "3"
    explanation: |-
      **다섯 군데 모두예요.** 다섯 switch 모두 Triangle을 다루지 않아서 컴파일러가 모두 짚어 줘요.

      - sealed, record, switch를 함께 쓰는 이유예요
      - instanceof와 else였다면 아무 데서도 오류가 나지 않아요
    source: https://openjdk.org/jeps/441
  - key: modern-controller-default
    concept: core
    coreQuestion: q4
    type: code_predict
    status: draft
    difficulty: 2
    body: 컨트롤러가 아래처럼 응답을 만들어요. 서비스가 새 종류 Pending을 돌려주기 시작하면 클라이언트가 받는 상태 코드는 무엇일까요?
    code: |-
      return switch (result) {
        case Approved a ->
            ResponseEntity.ok(a);
        case Declined d ->
            ResponseEntity.status(402).body(d);
        default ->
            ResponseEntity.status(500).build();
      };
    choices:
      - "200"
      - "402"
      - "500"
      - 컴파일 오류라 배포되지 않는다
    answer: "3"
    explanation: |-
      **500이에요.** default가 Pending을 받아요. 컴파일 오류도 나지 않아서 배포된 뒤에야 알게 돼요.

      - default를 지우고 종류를 모두 적으면 Pending을 추가할 때 컴파일 오류가 고칠 곳을 알려 줘요
    source: https://openjdk.org/jeps/441
  # ── 면접 ──
  - key: modern-interview
    concept: core
    coreQuestion: all
    type: descriptive
    status: draft
    difficulty: 2
    body: 면접에서 "sealed, record, switch 패턴 매칭을 함께 쓰면 무엇이 좋은지 설명해 주세요"라는 질문을 받았어요. 1분 안에 답해 보세요.
    explanation: |-
      **종류를 추가했을 때 다루지 않은 곳을 컴파일러가 모두 짚어 줘요.**

      - **sealed:** permits로 구현할 수 있는 타입을 한정한다. 컴파일러가 자식의 목록을 안다
      - **record와 패턴:** 종류마다 다른 데이터를 담고, case에서 구성 요소를 바로 꺼낸다
      - **완전성:** default 없는 switch는 모든 자식을 다뤄야 컴파일된다. instanceof와 else는 새 종류를 조용히 받는다
      - **주의:** default를 넣으면 검사가 꺼진다. 종류 자신의 일은 오버라이딩, 바깥의 일은 switch
    checklist:
      - sealed가 permits로 자식을 한정한다고 말했다
      - default 없는 switch가 모든 자식을 다뤘는지 검사한다고 말했다
      - 종류를 추가하면 다루지 않은 switch가 컴파일 오류가 된다고 말했다
      - default를 넣으면 이 검사가 꺼진다고 말했다
      - 오버라이딩과 switch 가운데 고르는 기준이나 record 패턴을 들었다
    source: https://openjdk.org/jeps/441
