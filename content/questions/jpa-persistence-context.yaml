  key: jpa-persistence-context
  title: 영속성 컨텍스트
  unit: JPA
  order: 802
concepts:
  - key: core
    name: 영속성 컨텍스트
coreQuestions:
  - key: q1
    text: "영속성 컨텍스트는 무엇이고 언제 생기나요?"
  - key: q2
    text: "같은 id를 두 번 조회하면 왜 SELECT가 한 번인가요?"
  - key: q3
    text: "persist한 엔티티의 INSERT는 언제, 어떤 순서로 나가나요?"
  - key: q4
    text: "save()를 부르지 않았는데 왜 UPDATE가 나가나요?"
  - key: q5
    text: "트랜잭션 밖에서 바꾼 값은 왜 저장되지 않나요?"
questions:
  # ── 질문 1 ──
  - key: pc-state-managed
    concept: core
    coreQuestion: q1
    type: multiple_choice
    status: reviewed
    difficulty: 1
    body: "@Transactional 메서드 안에서 bookRepository.findById(1L)로 받은 Book은 엔티티의 네 상태 가운데 무엇일까요?"
    choices:
      - 비영속
      - 영속
      - 준영속
      - 삭제
    answer: "2"
    explanation: |-
      **영속이에요.** 조회한 엔티티는 영속성 컨텍스트에 담기고, 트랜잭션이 끝날 때까지 JPA가 지켜봐요.

      - 스프링에서는 트랜잭션이 시작될 때 영속성 컨텍스트가 생겨요
      - 트랜잭션이 끝나면 이 Book은 준영속이 돼요
    source: https://jakarta.ee/specifications/persistence/3.1/jakarta-persistence-spec-3.1.html
  - key: pc-state-new
    concept: core
    coreQuestion: q1
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: "@Transactional 메서드 안에서 Member m = new Member(\"kim\")만 하고 save는 부르지 않았어요. 이어서 m.changeGrade(\"VIP\")를 불렀어요. 메서드가 끝난 뒤 DB에는 무엇이 남을까요?"
    choices:
      - 등급이 VIP인 kim 회원
      - 등급이 기본값인 kim 회원
      - 아무것도 남지 않는다
      - 커밋할 때 예외가 난다
    answer: "3"
    explanation: |-
      **아무것도 남지 않아요.** new만 한 객체는 비영속이라 영속성 컨텍스트에 들어간 적이 없어요.

      - JPA가 모르는 객체라 INSERT도 UPDATE도 만들지 않아요
      - 트랜잭션 안에 있다는 것만으로는 영속이 되지 않아요
    source: https://jakarta.ee/specifications/persistence/3.1/jakarta-persistence-spec-3.1.html
  # ── 질문 2 ──
  - key: pc-clear-find
    concept: core
    coreQuestion: q2
    type: code_predict
    status: reviewed
    difficulty: 1
    body: 한 트랜잭션 안에서 아래 코드를 실행했어요. book 테이블의 SELECT는 몇 번 나갈까요?
    code: |-
      Book a = em.find(Book.class, 1L);
      Book b = em.find(Book.class, 1L);
      em.clear();
      Book c = em.find(Book.class, 1L);
    choices:
      - 1번
      - 2번
      - 3번
      - 0번
    answer: "2"
    explanation: |-
      **2번이에요.** 둘째 find는 1차 캐시에서 꺼내고, clear로 비운 뒤의 셋째 find는 다시 SELECT해요.

      - a와 b는 같은 객체예요
      - clear는 영속성 컨텍스트를 비워요
    source: https://jakarta.ee/specifications/persistence/3.1/jakarta-persistence-spec-3.1.html
  - key: pc-jpql-same-object
    concept: core
    coreQuestion: q2
    type: code_predict
    status: reviewed
    difficulty: 2
    body: 한 트랜잭션 안에서 아래 코드를 실행했어요. member 테이블의 SELECT 수와 마지막 줄의 출력은 무엇일까요?
    code: |-
      Member a = memberRepository
          .findById(7L).orElseThrow();
      Member b = em.createQuery(
          "select m from Member m where m.id = 7",
          Member.class).getSingleResult();
      System.out.println(a == b);
    choices:
      - SELECT 1번, true
      - SELECT 2번, true
      - SELECT 2번, false
      - SELECT 1번, false
    answer: "2"
    explanation: |-
      **SELECT 2번, true예요.** JPQL은 1차 캐시를 보지 않고 늘 SQL을 보내지만, 결과의 id가 이미 있으면 그 객체를 돌려줘요.

      - 같은 트랜잭션에서 같은 id의 엔티티는 늘 같은 객체예요
    source: https://jakarta.ee/specifications/persistence/3.1/jakarta-persistence-spec-3.1.html
  # ── 질문 3 ──
  - key: pc-auto-flush
    concept: core
    coreQuestion: q3
    type: multiple_choice
    status: reviewed
    difficulty: 1
    body: 한 트랜잭션에서 SEQUENCE 전략인 Book을 em.persist로 저장하고, 이어서 JPQL select b from Book b를 실행했어요. INSERT와 SELECT는 어떤 순서로 나갈까요?
    choices:
      - SELECT 다음 INSERT (INSERT는 커밋 때)
      - INSERT 다음 SELECT
      - SELECT만 나가고 INSERT는 롤백된다
      - 둘이 동시에 나간다
    answer: "2"
    explanation: |-
      **INSERT 다음 SELECT예요.** JPQL을 실행하기 직전에 자동으로 flush해서, 모아 둔 INSERT를 먼저 보내요.

      - 그래야 JPQL이 방금 저장한 행도 볼 수 있어요
      - flush는 커밋 직전, JPQL 직전, flush()를 부를 때 일어나요
    source: https://jakarta.ee/specifications/persistence/3.1/jakarta-persistence-spec-3.1.html
  - key: pc-flush-rollback
    concept: core
    coreQuestion: q3
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: 트랜잭션 안에서 SEQUENCE 전략인 주문 3개를 persist하고 em.flush()를 불렀어요. 그 뒤 재고 검사에서 예외가 나서 트랜잭션이 롤백됐어요. DB에 주문은 몇 개 남을까요?
    choices:
      - 3개. flush로 이미 INSERT했다
      - 0개. flush는 커밋이 아니다
      - 1개
      - flush한 트랜잭션은 롤백할 수 없어 예외가 난다
    answer: "2"
    explanation: |-
      **0개예요.** flush는 SQL을 DB에 보냈을 뿐이고 트랜잭션은 아직 열려 있었어요.

      - 롤백하면 보낸 INSERT도 없던 일이 돼요
    source: https://jakarta.ee/specifications/persistence/3.1/jakarta-persistence-spec-3.1.html
  - key: pc-flush-order-unique
    concept: core
    coreQuestion: q3
    type: multiple_choice
    status: draft
    difficulty: 3
    body: "카테고리 테이블의 `code` 열에 UNIQUE가 있어요. 카테고리를 고치는 서비스 메서드(`@Transactional`)를 \"옛 카테고리를 `em.remove`하고, 같은 code로 새 카테고리를 `em.persist`\"로 만들었어요. 그 사이에 flush는 없어요. 메서드가 끝나 커밋할 때 어떻게 되나요? (SEQUENCE 전략, Hibernate 6.6, PostgreSQL 16)"
    choices:
      - DELETE 다음 INSERT가 나가고 커밋된다
      - INSERT가 먼저 나가 옛 행과 code가 겹쳐 23505로 실패한다
      - Hibernate가 같은 code를 알아보고 UPDATE 하나로 바꿔 보낸다
      - remove한 엔티티는 커밋 때 지워지지 않고 남는다
    answer: "2"
    explanation: |-
      **INSERT가 먼저 나가서 유니크 위반(23505)으로 실패해요.** flush는 코드의 순서가 아니라 INSERT, UPDATE, DELETE 순서로 SQL을 보내요.

      - INSERT 때는 옛 행이 아직 지워지지 않아서 code가 겹쳐요
      - Hibernate는 유니크 제약을 보고 순서를 바꾸거나 UPDATE로 합치지 않아요
      - remove 뒤에 `em.flush()`를 부르면 DELETE가 먼저 나가요. 같은 카테고리를 고치는 것이면 지우고 넣지 말고 있는 행의 값을 바꿔요
      - 검증: FlushOrderTest.deleteThenInsertSameUniqueValue
    source: https://github.com/wanja727/dev-lessons/blob/main/verification/src/test/java/lab/devlessons/persistencecontext/FlushOrderTest.java
  # ── 질문 4 ──
  - key: pc-revert-no-update
    concept: core
    coreQuestion: q4
    type: code_predict
    status: reviewed
    difficulty: 1
    body: 책의 처음 제목은 "JPA 입문"이에요. 아래 메서드가 끝날 때 UPDATE는 몇 번 나갈까요?
    code: |-
      @Transactional
      public void edit(Long id) {
        Book book = repository
            .findById(id).orElseThrow();
        book.changeTitle("A");
        book.changeTitle("JPA 입문");
      }
    choices:
      - 0번
      - 1번
      - 2번
      - save()를 부르지 않아 늘 0번이다
    answer: "1"
    explanation: |-
      **0번이에요.** 변경 감지는 flush 때의 값과 조회할 때 찍은 스냅샷을 비교해요. 둘 다 "JPA 입문"이에요.

      - 바꾼 횟수는 상관없어요
      - 값이 달랐다면 save() 없이도 UPDATE가 1번 나가요
    source: https://jakarta.ee/specifications/persistence/3.1/jakarta-persistence-spec-3.1.html
  - key: pc-update-all-columns
    concept: core
    coreQuestion: q4
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: 회원 엔티티에 이름, 이메일, 등급 필드가 있고 @DynamicUpdate는 붙이지 않았어요. 트랜잭션 안에서 회원을 조회해 등급만 바꿨어요. 커밋 때 나가는 UPDATE의 SET 절에는 어떤 컬럼이 들어갈까요?
    choices:
      - 등급만
      - 이름, 이메일, 등급 모두
      - UPDATE가 나가지 않는다
      - 이메일과 등급
    answer: "2"
    explanation: |-
      **모두 들어가요.** Hibernate의 기본 UPDATE는 엔티티마다 문장이 정해져 있어 모든 컬럼을 써요.

      - 바뀐 컬럼만 쓰려면 @DynamicUpdate를 붙여요
      - 레슨의 책도 제목만 바꿨는데 set author=?,title=?였어요
    source: https://docs.hibernate.org/orm/6.6/userguide/html_single/
  # ── 질문 5 ──
  - key: pc-readonly-change
    concept: core
    coreQuestion: q5
    type: multiple_choice
    status: reviewed
    difficulty: 1
    body: "@Transactional(readOnly = true)인 서비스 메서드 안에서 책을 조회해 제목을 바꿨어요. 메서드가 끝난 뒤 DB의 제목은 어떻게 될까요?"
    choices:
      - 바뀐 제목으로 저장된다
      - 처음 제목 그대로다
      - 커밋할 때 예외가 난다
    answer: "2"
    explanation: |-
      **그대로예요.** 읽기 전용 트랜잭션에서는 스냅샷을 찍지 않고 flush도 하지 않아요.

      - 그래서 변경 감지가 일어나지 않아요
      - 조회만 하는 메서드에 붙여 메모리를 아껴요
    source: https://docs.spring.io/spring-framework/reference/data-access/transaction/declarative/annotations.html
  - key: pc-detached-scheduler
    concept: core
    coreQuestion: q5
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: 스케줄러 메서드에는 트랜잭션이 없어요. memberService.findAll()(readOnly 트랜잭션)로 받은 회원들의 등급을 하나씩 바꾸고 메서드가 끝났어요. 등급은 저장될까요?
    choices:
      - 저장된다. 회원은 영속 상태다
      - 저장되지 않는다. findAll이 끝나며 회원들은 준영속이 됐다
      - 마지막 회원만 저장된다
      - LazyInitializationException이 난다
    answer: "2"
    explanation: |-
      **저장되지 않아요.** findAll의 트랜잭션이 끝나며 영속성 컨텍스트가 닫혀, 받은 회원들은 준영속이에요.

      - 준영속 엔티티는 바꿔도 지켜보는 쪽이 없어요
      - 고치려면 바꾸는 일을 쓰기 트랜잭션 안으로 옮겨요
    source: https://jakarta.ee/specifications/persistence/3.1/jakarta-persistence-spec-3.1.html
  - key: pc-controller-change
    concept: core
    coreQuestion: q5
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: 아래 컨트롤러는 트랜잭션이 없고, bookService.find는 @Transactional(readOnly = true)예요. 이 요청을 보내면 어떻게 될까요?
    code: |-
      @PatchMapping("/books/{id}")
      void rename(@PathVariable Long id,
          @RequestParam String title) {
        Book book = bookService.find(id);
        book.changeTitle(title);
      }
    choices:
      - 제목이 저장된다
      - 제목은 저장되지 않고 예외도 없다
      - TransactionRequiredException이 난다
      - LazyInitializationException이 난다
    answer: "2"
    explanation: |-
      **저장되지 않고 예외도 없어요.** find가 끝나며 book은 준영속이 됐어요.

      - 필드를 바꾸는 것은 평범한 자바 코드라 예외가 나지 않아요
      - 고친 코드: 조회하고 바꾸는 일을 서비스의 @Transactional 메서드로 옮겨요
    source: https://jakarta.ee/specifications/persistence/3.1/jakarta-persistence-spec-3.1.html
  # ── 다섯 질문을 하나로 ──
  - key: q-7b01da4d
    concept: core
    coreQuestion: all
    type: descriptive
    status: reviewed
    difficulty: 2
    body: 면접에서 "영속성 컨텍스트가 무엇이고, 어떤 이점이 있나요?"라는 질문을 받았어요. 1분 안에 답해 보세요.
    explanation: |-
      **엔티티를 id로 담아 관리하는 트랜잭션 범위의 작업 공간이고, 1차 캐시, 쓰기 지연, 변경 감지를 해 줘요.**

      - 같은 id를 다시 조회하면 1차 캐시에서 같은 객체를 돌려준다
      - persist한 INSERT를 모아 flush 때 보낸다
      - 스냅샷과 비교해 save 없이 UPDATE를 만든다
      - 트랜잭션이 끝난 준영속 엔티티와 readOnly 트랜잭션에서는 변경이 반영되지 않는다
    checklist:
      - 트랜잭션 범위의 작업 공간이라고 말했다
      - 1차 캐시와 같은 객체를 말했다
      - 쓰기 지연과 flush 시점을 말했다
      - 변경 감지와 스냅샷을 말했다
      - 준영속이나 readOnly에서 반영되지 않는다고 말했다
    source: https://jakarta.ee/specifications/persistence/3.1/jakarta-persistence-spec-3.1.html
