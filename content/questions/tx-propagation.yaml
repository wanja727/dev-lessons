# 트랜잭션 전파와 롤백 규칙 문제
# 형식: https://github.com/wanja727/retrievo/blob/main/docs/content-format.md
#
# 모든 문제는 coreQuestions의 질문 하나에 묶이고(coreQuestion), 답의 근거가 레슨 본문에 있다
# (site/src/content/lesson-pages/tx-propagation.yaml의 says).
# 동작에 관한 정답은 verification의 TxPropagationLessonTest와 propagation/PropagationTest로 확인했다.
# 질문마다 첫 문제는 본문의 예시로 묻고, 둘째 문제는 다른 상황으로 옮겨 묻는다.
# 2026-11-25에 핵심 질문 구조로 다시 썼다. 예전 문제는 지웠다.
subject:
  key: dev
  name: 개발자 면접
lesson:
  key: tx-propagation
  title: 트랜잭션 전파와 롤백 규칙
  unit: 스프링
  order: 711
concepts:
  - key: core
    name: 트랜잭션 전파와 롤백 규칙
coreQuestions:
  - key: q1
    text: "@Transactional 메서드가 다른 @Transactional 메서드를 부르면 트랜잭션은 몇 개인가요?"
  - key: q2
    text: "안쪽만 따로 커밋하거나 롤백하려면 어떻게 하나요?"
  - key: q3
    text: "어떤 예외가 나면 롤백되나요?"
  - key: q4
    text: "@Transactional 메서드 안에서 예외를 잡으면 어떻게 되나요?"
questions:
  # ── 질문 1 ──
  - key: tprop-unexpected
    concept: core
    coreQuestion: q1
    type: code_predict
    status: draft
    difficulty: 1
    body: 두 메서드 모두 기본 설정의 @Transactional이고 서로 다른 빈이에요. place가 끝나면 어떻게 될까요?
    code: |-
      @Transactional
      public void place(Order o) {
        orders.save(o);
        try {
          pointService.add(o.userId(), 100);
        } catch (RuntimeException e) {
          log.warn("적립 실패", e);
        }
      }

      // PointService
      @Transactional
      public void add(long userId, int n) {
        throw new IllegalStateException();
      }
    choices:
      - 주문이 커밋된다
      - 주문이 롤백되고 예외 없음
      - 주문이 롤백되고 UnexpectedRollbackException이 난다
      - 적립만 롤백되고 주문은 커밋된다
    answer: "3"
    explanation: |-
      **주문이 롤백되고 UnexpectedRollbackException이 나요.** add는 place의 트랜잭션에 합류했고, 예외가 add의 프록시를 지나가며 트랜잭션 전체를 rollback-only로 표시했어요. place가 잡아도 커밋할 수 없어요.
    source: https://docs.spring.io/spring-framework/reference/data-access/transaction/declarative/tx-propagation.html
  - key: tprop-joined-rollback
    concept: core
    coreQuestion: q1
    type: multiple_choice
    status: draft
    difficulty: 2
    body: '@Transactional OrderService.place가 다른 빈의 @Transactional CouponService.use를 부르고, use는 예외 없이 끝났어요. 그 뒤 place에서 런타임 예외가 났어요. use가 저장한 쿠폰 사용 기록은 남을까요?'
    choices:
      - 남는다. use는 끝날 때 커밋했다
      - 남지 않는다. use는 place의 트랜잭션에 합류해서 함께 롤백된다
      - 남는다. 다른 빈이라 다른 트랜잭션이다
      - use의 실행 시간에 따라 다르다
    answer: "2"
    explanation: |-
      **남지 않아요.** 기본 전파 REQUIRED에서 use는 열린 트랜잭션에 합류해요. 커밋은 가장 바깥인 place가 끝날 때 한 번이라, place가 롤백되면 함께 사라져요.
    source: https://docs.spring.io/spring-framework/reference/data-access/transaction/declarative/tx-propagation.html
  # ── 질문 2 ──
  - key: tprop-audit-survives
    concept: core
    coreQuestion: q2
    type: multiple_choice
    status: draft
    difficulty: 1
    body: 'place가 주문을 저장하고, propagation = REQUIRES_NEW인 AuditService.record로 감사 기록을 남긴 뒤, place에서 런타임 예외가 났어요. 주문과 감사 기록은 각각 남을까요?'
    choices:
      - 둘 다 남는다
      - 둘 다 남지 않는다
      - 주문은 롤백되고 감사 기록은 남는다
      - 주문은 남고 감사 기록은 롤백된다
    answer: "3"
    explanation: |-
      **주문은 롤백되고 기록은 남아요.** REQUIRES_NEW는 바깥을 멈추고 새 커넥션으로 따로 트랜잭션을 열어, record가 끝날 때 먼저 커밋해요. 바깥의 롤백은 이미 커밋된 기록을 되돌리지 못해요.
    source: https://docs.spring.io/spring-framework/reference/data-access/transaction/declarative/tx-propagation.html
  - key: tprop-invisible
    concept: core
    coreQuestion: q2
    type: multiple_choice
    status: draft
    difficulty: 2
    body: 바깥 트랜잭션이 회원을 저장(아직 커밋 전)한 뒤 propagation = REQUIRES_NEW인 메서드가 그 회원을 id로 조회해요. 찾을 수 있을까요?
    choices:
      - 찾는다. 같은 요청이다
      - 찾지 못한다. 다른 커넥션의 다른 트랜잭션이라 커밋 전 행이 보이지 않는다
      - 예외가 난다
      - 찾지만 값이 비어 있다
    answer: "2"
    explanation: |-
      **찾지 못해요.** REQUIRES_NEW는 다른 커넥션으로 따로 연 트랜잭션이에요. 바깥이 커밋하기 전의 행은 보이지 않아요.
    source: https://docs.spring.io/spring-framework/reference/data-access/transaction/declarative/tx-propagation.html
  # ── 질문 3 ──
  - key: tprop-checked
    concept: core
    coreQuestion: q3
    type: multiple_choice
    status: draft
    difficulty: 1
    body: '@Transactional 메서드가 행을 저장한 뒤 내가 만든 class SoldOutException extends Exception을 던졌어요. rollbackFor는 적지 않았어요. 행은 남을까요?'
    choices:
      - 남는다. 체크 예외는 기본으로 커밋한다
      - 남지 않는다. 예외가 나면 늘 롤백한다
      - 예외가 호출한 쪽에 가지 않는다
      - 절반만 남는다
    answer: "1"
    explanation: |-
      **남아요.** 기본 규칙은 RuntimeException과 Error에만 롤백하고, 체크 예외에는 커밋해요.

      - 롤백하려면 rollbackFor = Exception.class를 적거나 런타임 예외로 감싸 던져요
    source: https://docs.spring.io/spring-framework/reference/data-access/transaction/declarative/rolling-back.html
  - key: tprop-runtime
    concept: core
    coreQuestion: q3
    type: multiple_choice
    status: draft
    difficulty: 2
    body: 같은 메서드가 이번에는 class SoldOutException extends RuntimeException을 던져요. 행은 남을까요?
    choices:
      - 남는다
      - 남지 않는다. 런타임 예외라 롤백한다
      - noRollbackFor를 적지 않아 커밋한다
      - 체크 예외와 똑같이 커밋한다
    answer: "2"
    explanation: |-
      **남지 않아요.** RuntimeException의 하위 예외는 기본으로 롤백해요. 상속한 예외 클래스 하나로 결과가 정반대가 돼요.
    source: https://docs.spring.io/spring-framework/reference/data-access/transaction/declarative/rolling-back.html
  # ── 질문 4 ──
  - key: tprop-swallow
    concept: core
    coreQuestion: q4
    type: code_predict
    status: draft
    difficulty: 1
    body: 아래에서 deposit이 런타임 예외를 던졌어요(SQL을 보내기 전, 자바에서 실패). transfer가 끝나면 출금은 DB에 남을까요?
    code: |-
      @Transactional
      public void transfer(long from,
          long to, int n) {
        accounts.withdraw(from, n);
        try {
          accounts.deposit(to, n);
        } catch (Exception e) {
          log.error("이체 실패", e);
        }
      }
    choices:
      - 남는다. 예외를 삼켜 프록시가 정상 종료로 보고 커밋한다
      - 남지 않는다. 예외가 났으니 롤백한다
      - UnexpectedRollbackException이 난다
      - deposit만 커밋된다
    answer: "1"
    explanation: |-
      **출금이 남아요.** 프록시는 메서드 밖으로 나온 예외만 보고 롤백을 정해요. 안에서 삼키면 실패를 몰라 커밋해요.

      - 다시 던지거나 setRollbackOnly()로 표시하면 롤백돼요
      - accounts가 같은 클래스의 메서드가 아니라 합류한 다른 빈의 @Transactional이라면 결과가 달라요(UnexpectedRollbackException)
    source: https://docs.spring.io/spring-framework/reference/data-access/transaction/declarative/rolling-back.html
  - key: tprop-repo-duplicate
    concept: core
    coreQuestion: q4
    type: multiple_choice
    status: draft
    difficulty: 3
    body: '@Transactional 메서드에서 try { coupons.save(c); } catch (DataIntegrityViolationException e) { }로 중복 쿠폰이면 넘어가려 해요. coupons는 Spring Data 리포지토리예요. 실제로 중복이 나면 메서드가 끝날 때 어떻게 될까요?'
    choices:
      - 정상 커밋된다. 예외를 잡았다
      - UnexpectedRollbackException이 나고 모두 롤백된다
      - 쿠폰만 롤백되고 나머지는 커밋된다
      - 중복 쿠폰이 저장된다
    answer: "2"
    explanation: |-
      **UnexpectedRollbackException이 나요.** Spring Data 리포지토리의 save도 @Transactional이라 바깥에 합류하고, 예외가 그 프록시를 지나가며 rollback-only를 표시했어요.

      - 중복을 미리 확인하거나, 그 저장만 REQUIRES_NEW로 떼어 내요
    source: https://docs.spring.io/spring-framework/reference/data-access/transaction/declarative/tx-propagation.html
  - key: tprop-audit-required
    concept: core
    coreQuestion: q2
    type: multiple_choice
    status: draft
    difficulty: 2
    body: 실패한 결제 시도를 남기는 AuditService.record를 REQUIRES_NEW가 아니라 기본 전파(@Transactional)로 두었어요. 결제가 런타임 예외로 롤백될 때 감사 기록은 남을까요?
    choices:
      - 남는다. 감사 기록은 다른 빈이다
      - 남지 않는다. 결제 트랜잭션에 합류해 함께 롤백된다
      - 결제 예외의 종류에 따라 다르다
      - 기록이 두 번 남는다
    answer: "2"
    explanation: |-
      **남지 않아요.** 기본 전파에서는 다른 빈이어도 열린 트랜잭션에 합류해요. 본 작업과 운명이 달라야 하는 기록은 REQUIRES_NEW로 따로 열어요.
    source: https://docs.spring.io/spring-framework/reference/data-access/transaction/declarative/tx-propagation.html
  # ── 전체 ──
  - key: tprop-interview
    concept: core
    coreQuestion: all
    type: descriptive
    status: draft
    difficulty: 2
    body: 면접에서 "트랜잭션 전파와 롤백 규칙을 설명해 주세요"라는 질문을 받았어요. 1분 안에 답해 보세요.
    explanation: |-
      **기본은 합류이고, 따로 떼려면 REQUIRES_NEW, 롤백은 런타임 예외와 Error에만 해요.**

      - **REQUIRED:** 합류해서 커넥션과 트랜잭션이 하나. 안쪽 프록시를 지난 예외는 rollback-only를 남겨 바깥이 잡아도 UnexpectedRollbackException
      - **REQUIRES_NEW:** 새 커넥션으로 따로. 실패 기록에 쓰고, 커넥션을 하나 더 쓴다
      - **롤백 규칙:** 런타임 예외와 Error는 롤백, 체크 예외는 커밋. rollbackFor, noRollbackFor
      - **예외를 잡으면:** 같은 메서드에서 삼키면 커밋. 다시 던지거나 setRollbackOnly
    checklist:
      - 기본 전파 REQUIRED는 바깥 트랜잭션에 합류한다고 말했다
      - 합류한 안쪽의 예외가 rollback-only를 남겨 바깥이 잡아도 롤백된다고 말했다
      - REQUIRES_NEW로 안쪽을 따로 커밋하거나 롤백한다고 말했다
      - 체크 예외는 기본으로 커밋하고, 예외를 삼키면 커밋된다고 말했다
    source: https://docs.spring.io/spring-framework/reference/data-access/transaction/declarative/tx-propagation.html
