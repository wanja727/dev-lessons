questions:
  - key: q-019d9d9c
    concept: core
    type: descriptive
    status: draft
    difficulty: 1
    body: 트랜잭션 전파 속성이 무엇인지, REQUIRED와 REQUIRES_NEW의 차이를 1분 안에 설명해 보세요
    explanation: |-
      - 전파: 이미 트랜잭션이 있을 때 합류할지 새로 열지
      - REQUIRED(기본): 같은 물리 트랜잭션에 합류. 안쪽 예외는 rollback-only 표시
      - REQUIRES_NEW: 바깥을 멈추고 새 물리 트랜잭션(커넥션 하나 더). 독립 커밋/롤백
      - REQUIRES_NEW는 커넥션 비용 때문에 감사 로그 같은 곳에만
    checklist:
      - 전파의 정의를 말했다
      - REQUIRED는 합류라고 말했다
      - REQUIRES_NEW는 별도 물리 트랜잭션이라고 말했다
      - rollback-only를 말했다
      - REQUIRES_NEW의 커넥션 비용을 말했다
    source: https://docs.spring.io/spring-framework/reference/data-access/transaction/declarative/tx-propagation.html
  - key: q-a51df2d6
    concept: core
    type: descriptive
    status: draft
    difficulty: 2
    body: REQUIRED로 합류한 안쪽 실패와 REQUIRES_NEW 안쪽 실패를, 바깥이 예외를 잡았을 때의 결과로 비교해 보세요
    explanation: |-
      - REQUIRED: 안쪽이 공유 트랜잭션에 rollback-only 표시 → 바깥이 잡아도 커밋 시 롤백 + UnexpectedRollbackException, 아무것도 안 남음
      - REQUIRES_NEW: 안쪽 트랜잭션만 롤백, 바깥은 정상 커밋
      - 이유: 합류한 쪽은 물리 트랜잭션을 직접 끝낼 수 없고, 시작한 쪽만 결정
    checklist:
      - REQUIRED는 전부 롤백된다고 말했다
      - UnexpectedRollbackException을 말했다
      - REQUIRES_NEW는 바깥이 커밋된다고 말했다
      - rollback-only 표시를 말했다
      - 시작한 쪽만 커밋/롤백을 결정한다고 말했다
    source: https://docs.spring.io/spring-framework/reference/data-access/transaction/declarative/tx-propagation.html
  - key: q-480d7655
    concept: core
    type: descriptive
    status: draft
    difficulty: 3
    body: "운영 로그에 UnexpectedRollbackException: Transaction silently rolled back because it has been marked as rollback-only가 찍혔다. 어떻게 원인을 찾고 고칠지 말해 보세요"
    explanation: |-
      - 원인: 트랜잭션 안에서 부른 다른 빈의 REQUIRED 메서드가 런타임 예외를 던졌고, 바깥이 try-catch로 삼킴
      - 찾기: 스택에서 바깥 트랜잭션 메서드를 찾고, 그 안의 catch 블록과 호출한 빈을 봄. 트랜잭션 로그 레벨을 올려 참여/표시 로그 확인
      - 고치기: 함께 롤백이 맞으면 잡지 말고 던짐. 독립이면 안쪽이 예외 대신 결과를 값으로 돌려주거나 REQUIRES_NEW
    checklist:
      - 합류한 안쪽의 런타임 예외를 원인으로 말했다
      - 바깥의 catch를 말했다
      - 찾는 방법(스택, 트랜잭션 로그)을 말했다
      - 업무 요구에 따라 해결이 다르다고 말했다
      - REQUIRES_NEW나 값 반환을 말했다
    source: https://docs.spring.io/spring-framework/reference/data-access/transaction/declarative/tx-propagation.html
  - key: q-2253e2cf
    concept: core
    type: ox
    status: draft
    difficulty: 1
    body: "\"@Transactional 메서드에서 체크 예외가 던져지면 기본적으로 롤백된다\""
    answer: X
    explanation: |-
      - 기본 롤백 대상은 RuntimeException과 Error뿐. 체크 예외는 호출자에게 전달되지만 트랜잭션은 커밋. rollbackFor로 바꿈
      - 검증: PropagationTest (checkedExceptionCommitsByDefault, rollbackForMakesCheckedRollback)
    source: https://docs.spring.io/spring-framework/reference/data-access/transaction/declarative/rolling-back.html
  - key: q-212fd92f
    concept: core
    type: code_predict
    status: draft
    difficulty: 2
    body: 바깥 @Transactional이 다른 빈의 REQUIRES_NEW 메서드를 불러 커밋된 뒤, 바깥에서 런타임 예외가 나면 남는 데이터는?
    code: |-
      @Transactional
      public void outer() {
          inner.saveNew("inner");              // REQUIRES_NEW
          repository.save(new Record("outer"));
          throw new IllegalStateException();
      }
    choices:
      - 없음
      - inner만
      - outer만
      - inner, outer 모두
    answer: "2"
    explanation: |-
      - REQUIRES_NEW는 별도 물리 트랜잭션이라 메서드가 끝날 때 이미 커밋됐다. 바깥만 롤백된다
      - 검증: PropagationTest (requiresNewCommitSurvivesOuterRollback)
    source: https://docs.spring.io/spring-framework/reference/data-access/transaction/declarative/tx-propagation.html
  - key: q-2f56e2f6
    concept: core
    type: multiple_choice
    status: draft
    difficulty: 2
    body: 바깥 트랜잭션이 저장하고 flush한(커밋 전) 행을, 다른 빈의 REQUIRES_NEW 메서드가 조회하면?
    choices:
      - flush했으니 보인다
      - 같은 요청이니 보인다
      - 다른 트랜잭션이라 보이지 않는다
      - 예외가 난다
    answer: "3"
    explanation: |-
      - REQUIRES_NEW는 다른 커넥션의 다른 트랜잭션이다. READ COMMITTED에서는 커밋되지 않은 행을 볼 수 없다. 필요한 값은 인자로 넘긴다
      - 검증: PropagationTest (requiresNewIsSeparateTransaction)
    source: https://docs.spring.io/spring-framework/reference/data-access/transaction/declarative/tx-propagation.html
  - key: q-44f50afd
    concept: core
    type: line_pick
    status: draft
    difficulty: 3
    body: "[코드 15-A] 쿠폰이 실패해도 주문은 남기려 했는데, 쿠폰 실패 시 주문도 없고 UnexpectedRollbackException이 난다. 원인이 되는 줄은? (CouponService는 다른 빈)"
    code: |-
      // CouponService
      @Transactional
      public void use(Long couponId) {
          Coupon c = couponRepository.findById(couponId).orElseThrow();
          c.use();                 // 만료면 CouponException (RuntimeException)
      }

      // OrderService
      @Transactional
      public void placeOrder(Order order) {
          orderRepository.save(order);
          try { couponService.use(order.getCouponId()); }
          catch (CouponException e) { log.warn("쿠폰 실패"); }
      }
    answer: "2"
    explanation: |-
      - use()가 기본 REQUIRED라 placeOrder 트랜잭션에 합류하고, 예외가 프록시를 지날 때 rollback-only 표시를 남긴다. 13번 줄에서 잡아도 커밋 시 롤백된다
      - 고치기: use()를 REQUIRES_NEW로(쿠폰만 독립 롤백), 또는 예외 대신 결과를 값으로 돌려주는 tryUse()
      - 검증: PropagationTest (requiredFailureMarksRollbackOnly, requiresNewFailureRollsBackOnlyInner)
    source: https://docs.spring.io/spring-framework/reference/data-access/transaction/declarative/tx-propagation.html
