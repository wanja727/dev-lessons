questions:
  # ── 질문 1 ──
  - key: dp-won-1280
    concept: core
    coreQuestion: q1
    type: multiple_choice
    status: reviewed
    difficulty: 1
    body: 동전 단위가 500, 100, 50, 10원이에요. 1,280원을 큰 동전부터 될 수 있는 만큼 쓰는 그리디로 거슬러 주면 동전은 모두 몇 개일까요?
    choices:
      - 6개
      - 8개
      - 11개
      - 128개
    answer: "2"
    explanation: |-
      **8개예요.** 500원 2개, 100원 2개, 50원 1개, 10원 3개예요.

      - 큰 단위가 작은 단위의 배수라 큰 동전을 될 수 있는 만큼 쓰는 것이 손해가 아니에요
      - 그래서 이 단위에서는 그리디가 가장 적은 개수를 줘요
    source: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/Arrays.html
  - key: dp-meetings
    concept: core
    coreQuestion: q1
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: 회의 (1~4시), (3~5시), (0~6시), (5~7시), (8~9시), (5~9시)를 회의실 하나에 겹치지 않게 넣어요. 끝나는 시각이 이른 회의부터 고르면 몇 개가 들어갈까요? 끝나는 시각과 다음 회의의 시작 시각이 같으면 넣을 수 있어요.
    choices:
      - 2개
      - 3개
      - 4개
      - 6개
    answer: "2"
    explanation: |-
      **3개예요.** 1~4시, 5~7시, 8~9시를 골라요.

      - 1~4시를 고르면 3~5시, 0~6시는 겹쳐서 건너뛰어요
      - 일찍 끝나는 회의를 고를수록 남은 시간이 가장 넓게 남아요
    source: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/Comparator.html
  # ── 질문 2 ──
  - key: dp-greedy-eight
    concept: core
    coreQuestion: q2
    type: multiple_choice
    status: reviewed
    difficulty: 1
    body: 단위가 1, 3, 4일 때 큰 단위부터 고르는 그리디로 8을 만들면 몇 개이고, 그것이 가장 적은 개수와 같을까요?
    choices:
      - 2개. 가장 적은 개수와 같다
      - 3개. 가장 적은 개수는 2개다
      - 4개. 가장 적은 개수는 2개다
      - 2개. 가장 적은 개수는 1개다
    answer: "1"
    explanation: |-
      **2개(4, 4)이고 가장 적은 개수와 같아요.** 이 단위에서 그리디가 처음 틀리는 금액은 6이에요.

      - 6은 그리디가 4, 1, 1로 3개지만 3, 3이면 2개예요
      - 맞는 금액이 있다고 그리디가 맞는 방법인 것은 아니에요. 반례 하나면 틀린 방법이에요
    source: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/Arrays.html
  - key: dp-greedy-156
    concept: core
    coreQuestion: q2
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: 동전 단위가 1, 5, 6원인 나라에서 10원을 큰 동전부터 고르는 그리디로 거슬러 줘요. 그리디가 고르는 개수와 가장 적은 개수는 각각 얼마일까요?
    choices:
      - 그리디 2개, 가장 적은 개수 2개
      - 그리디 5개, 가장 적은 개수 2개
      - 그리디 5개, 가장 적은 개수 5개
      - 그리디 10개, 가장 적은 개수 2개
    answer: "2"
    explanation: |-
      **그리디는 5개(6, 1, 1, 1, 1), 가장 적은 개수는 2개(5, 5)예요.** 6을 고른 순간 5를 두 번 쓰는 길이 막혀요.

      - 6이 5의 배수가 아니라 그리디가 맞을 근거가 없어요
      - 지금 좋아 보이는 선택이 남은 문제를 더 나쁘게 만들었어요
    source: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/Arrays.html
  # ── 질문 3 ──
  - key: dp-table-seven
    concept: core
    coreQuestion: q3
    type: code_predict
    status: reviewed
    difficulty: 1
    body: 아래 minCoins를 단위 {1, 3, 4}와 금액 7로 불러요. dp[7]은 얼마일까요? 0~6칸은 0, 1, 2, 1, 1, 2, 2예요.
    code: |-
      int[] dp = new int[amount + 1];
      Arrays.fill(dp, NONE);
      dp[0] = 0;
      for (int m = 1; m <= amount; m++) {
        for (int u : units) {
          if (u <= m && dp[m - u] != NONE) {
            dp[m] = Math.min(dp[m],
                dp[m - u] + 1);
          }
        }
      }
    choices:
      - "1"
      - "2"
      - "3"
      - "4"
    answer: "2"
    explanation: |-
      **2예요.** 후보는 dp[6] + 1 = 3, dp[4] + 1 = 2, dp[3] + 1 = 2이고 가장 작은 2예요.

      - 3과 4 하나씩이에요
      - 칸 m을 채울 때 필요한 dp[m - u]는 이미 채워져 있어서 재귀 없이 표를 채워요
    source: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/Arrays.html
  - key: dp-stairs
    concept: core
    coreQuestion: q3
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: 계단을 한 번에 1칸이나 2칸 올라요. n칸을 오르는 방법의 수 ways(n)을 더 작은 문제의 답으로 나타낸 식으로 맞는 것은 무엇일까요?
    choices:
      - ways(n) = ways(n - 1) + 1
      - ways(n) = ways(n - 1) + ways(n - 2)
      - ways(n) = 2 × ways(n - 1)
      - ways(n) = ways(n - 2) + 2
    answer: "2"
    explanation: |-
      **ways(n) = ways(n - 1) + ways(n - 2)예요.** 마지막 걸음이 1칸이면 앞에서 n - 1칸을, 2칸이면 n - 2칸을 오른 방법이에요.

      - 두 경우는 겹치지 않으니 더해요
      - ways(0) = 1, ways(1) = 1부터 아래에서 위로 채우면 ways(4)는 5, ways(10)은 89예요
    source: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/Arrays.html
  # ── 질문 4 ──
  - key: dp-why-not-greedy
    concept: core
    coreQuestion: q4
    type: multiple_choice
    status: reviewed
    difficulty: 1
    body: 동전 단위 1, 3, 4로 금액을 가장 적은 개수로 만드는 문제에 그리디가 아니라 동적 계획법을 써야 하는 이유는 무엇일까요?
    choices:
      - 동적 계획법이 언제나 그리디보다 빠르기 때문이다
      - 가장 좋은 답이 가장 큰 단위를 고르는 선택을 늘 포함하지는 않기 때문이다
      - 단위가 세 개 이상이면 그리디를 쓸 수 없기 때문이다
      - 부분 문제가 겹치지 않기 때문이다
    answer: "2"
    explanation: |-
      **가장 좋은 답이 가장 큰 단위를 고르는 선택을 늘 포함하지는 않기 때문이에요.** 6에서 4를 고르면 틀려요.

      - 그리디는 가장 좋은 답이 지금의 가장 좋은 선택을 늘 포함할 때만 맞아요
      - 같은 금액이 여러 갈래에서 다시 나오고(겹치는 부분 문제) 점화식을 세울 수 있어서 동적 계획법으로 풀어요
    source: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/Arrays.html
  - key: dp-merge-sort
    concept: core
    coreQuestion: q4
    type: ox
    status: reviewed
    difficulty: 2
    body: "\"정수 배열을 병합 정렬할 때, 나눈 두 절반의 정렬 결과를 표에 저장해 두면 동적 계획법이 되어 빨라진다\""
    answer: X
    explanation: |-
      **틀린 말이에요.** 병합 정렬의 두 절반은 겹치지 않아서 같은 부분 문제가 다시 나오지 않아요.

      - 동적 계획법은 같은 부분 문제가 여러 번 나와야 저장한 답을 다시 써요
      - 병합 정렬은 나눠서 푸는 것이지 동적 계획법이 아니에요
    source: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/Arrays.html
  - key: dp-compute-if-absent
    concept: core
    coreQuestion: q4
    type: code_predict
    status: reviewed
    difficulty: 2
    body: 메모이제이션을 짧게 쓰려고 computeIfAbsent에 재귀를 넣었어요. 자바 21에서 fib(30)을 부르면 어떻게 될까요?
    code: |-
      Map<Integer, Long> memo = new HashMap<>();

      long fib(int n) {
        if (n < 2) return n;
        return memo.computeIfAbsent(n,
            k -> fib(k - 1) + fib(k - 2));
      }
    choices:
      - 832040을 빠르게 돌려준다
      - ConcurrentModificationException이 난다
      - StackOverflowError가 난다
      - 끝나지 않는다
    answer: "2"
    explanation: |-
      **ConcurrentModificationException이 나요.** computeIfAbsent의 함수 안에서 fib(k - 1)이 같은 맵에 값을 넣어요.

      - HashMap은 함수 안의 수정을 알아채면 이 예외를 던져요. fib(2)는 지나가고 fib(3)부터 터져요
      - get으로 보고, 계산하고, put하거나 아래에서 위로 표를 채워요
    source: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/HashMap.html
  # ── 네 질문을 하나로 ──
  - key: dp-interview
    concept: core
    coreQuestion: all
    type: descriptive
    status: reviewed
    difficulty: 2
    body: 면접에서 "그리디와 동적 계획법은 어떻게 다르고, 각각 언제 쓰나요?"라는 질문을 받았어요. 1분 안에 답해 보세요.
    explanation: |-
      **그리디는 지금 가장 좋은 것을 고르고 돌아보지 않고, 동적 계획법은 작은 문제의 답을 한 번씩 계산해 저장해 큰 문제를 풀어요.**

      - **그리디:** 빠르다. 가장 좋은 답이 지금의 선택을 늘 포함할 때만 맞다(우리 동전, 회의실)
      - **반례:** 단위 1, 3, 4로 6을 만들면 그리디 3개, 답 2개
      - **동적 계획법:** 점화식을 세우고 겹치는 부분 문제를 저장한다. 거스름돈은 O(금액 × 단위 수)
      - **조건:** 겹치는 부분 문제와 최적 부분 구조. 병합 정렬은 겹치지 않아 해당하지 않는다
    checklist:
      - 그리디는 단계마다 지금 가장 좋은 것을 고르고 돌아보지 않는다고 말했다
      - 그리디가 틀리는 반례(단위 1, 3, 4로 6 같은 것)나 맞으려면 근거가 필요하다고 말했다
      - 동적 계획법은 점화식을 세우고 작은 문제의 답을 저장해 다시 쓴다고 말했다
      - 겹치는 부분 문제와 최적 부분 구조를 말했다
      - 위에서 아래로(메모이제이션)와 아래에서 위로(표 채우기)를 말했다
    source: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/HashMap.html
