# 테이블 관계 설계 문제
# 형식: https://github.com/wanja727/retrievo/blob/main/docs/content-format.md
#
# 모든 문제는 coreQuestions의 질문 하나에 묶이고(coreQuestion), 답의 근거가 레슨 본문에 있다
# (site/src/content/lesson-pages/table-relationships.yaml의 says).
# 동작에 관한 정답은 verification의 TableRelationshipsTest로 확인했다 (PostgreSQL 16, 하이버네이트 6.6).
# 2026-11-27에 만들고, 같은 날 레슨 본문과 검증 테스트에 대조해 검수했다(reviewed).
# 질문마다 첫 문제는 본문의 예시로 묻고, 둘째 문제는 다른 상황으로 옮겨 묻는다. 실무 구역의 문제는 관련된 질문의 셋째 문제다.
subject:
  key: dev
  name: 개발자 면접
lesson:
  key: table-relationships
  title: 테이블 관계 설계
  unit: DB
  order: 617
concepts:
  - key: core
    name: 테이블 관계 설계
coreQuestions:
  - key: q1
    text: "요구사항에서 테이블과 관계를 어떻게 찾나요?"
  - key: q2
    text: "ERD의 선 끝 기호는 무엇을 뜻하나요?"
  - key: q3
    text: "1:N은 외래 키를 어느 쪽에 두나요?"
  - key: q4
    text: "1:1은 어떻게 테이블로 옮기나요?"
  - key: q5
    text: "N:M은 왜 외래 키 하나로 담을 수 없나요?"
questions:
  # ── 질문 1 ──
  - key: tr-cardinality-both-ways
    concept: core
    coreQuestion: q1
    type: multiple_choice
    status: reviewed
    difficulty: 1
    body: "요구사항의 \"회원은 여러 스터디에 들어간다\" 한 줄만 보고 회원과 스터디를 1:N으로 정하려고 해요. 관계의 종류를 정하기 전에 무엇을 더 물어야 하나요?"
    choices:
      - 회원 하나가 들어갈 수 있는 스터디는 최대 몇 개인지
      - 스터디 하나에 회원은 최대 몇 명인지
      - 스터디에 이름 말고 어떤 열이 있는지
      - 회원이 스터디에 들어간 날짜를 저장하는지
    answer: "2"
    explanation: |-
      **반대 방향, 곧 "스터디 하나에 회원은 최대 몇 명?"을 물어야 해요.**

      - 관계의 종류는 "A 하나에 B는 몇 개?"를 양쪽 방향으로 물어 정해요
      - 문장은 회원 쪽 방향만 말해요. 스터디 하나에도 회원이 여럿이면 N:M이에요
      - 한쪽만 물으면 N:M을 1:N으로 잘못 봐요
    source: https://mermaid.js.org/syntax/entityRelationshipDiagram.html
  - key: tr-cardinality-order-product
    concept: core
    coreQuestion: q1
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: "쇼핑몰 요구사항이에요. \"주문 하나에는 상품이 여러 개 담긴다. 상품 하나는 여러 주문에 담길 수 있다.\" 주문과 상품의 관계는 무엇인가요?"
    choices:
      - "1:1"
      - "1:N (주문 하나에 상품 여럿)"
      - "1:N (상품 하나에 주문 여럿)"
      - "N:M"
    answer: "4"
    explanation: |-
      **N:M이에요.** 주문 하나에 상품이 여럿이고, 상품 하나에도 주문이 여럿이에요.

      - 첫 문장만 보면 1:N 같지만 둘째 문장이 반대 방향도 여럿이라고 말해요
      - 양쪽 다 여럿이면 N:M이고, 주문 항목이라는 매핑 테이블로 풀어요
    source: https://mermaid.js.org/syntax/entityRelationshipDiagram.html
  # ── 질문 2 ──
  - key: tr-erd-read-profile
    concept: core
    coreQuestion: q2
    type: multiple_choice
    status: reviewed
    difficulty: 1
    body: "Mermaid로 그린 ERD에 `MEMBER ||--o| PROFILE : has`가 있어요. 이 줄을 바르게 읽은 것은?"
    choices:
      - 회원 하나에 프로필은 정확히 하나, 프로필 하나에 회원은 없거나 하나
      - 회원 하나에 프로필은 없거나 하나, 프로필 하나에 회원은 정확히 하나
      - 회원 하나에 프로필은 여럿, 프로필 하나에 회원은 정확히 하나
      - 회원 하나에 프로필은 하나 이상, 프로필 하나에 회원은 하나 이상
    answer: "2"
    explanation: |-
      **회원 하나에 프로필은 없거나 하나, 프로필 하나에 회원은 정확히 하나예요.**

      - 기호는 그 기호가 붙은 쪽 엔티티의 개수예요
      - PROFILE 옆의 `o|`는 최소 0, 최대 1이에요. 회원 하나에 프로필 수를 말해요
      - MEMBER 옆의 `||`는 정확히 하나예요. 프로필 하나에 회원 수를 말해요
    source: https://mermaid.js.org/syntax/entityRelationshipDiagram.html
  - key: tr-erd-one-or-more
    concept: core
    coreQuestion: q2
    type: ox
    status: reviewed
    difficulty: 2
    body: "\"ERD에 `DEPARTMENT ||--|{ EMPLOYEE`가 있으면, 직원이 한 명도 없는 부서가 있을 수 있다\""
    answer: X
    explanation: |-
      **틀렸어요.** 부서 하나에 직원 수는 EMPLOYEE 옆의 `|{`가 말하고, 이 기호는 최소 1, 최대 여럿이에요.

      - 바깥쪽의 까마귀 발은 최대가 여럿, 안쪽의 막대는 최소가 1이라는 뜻이에요
      - 직원 없는 부서를 허용하려면 `o{`(없거나 여럿)로 그려요
    source: https://mermaid.js.org/syntax/entityRelationshipDiagram.html
  # ── 질문 3 ──
  - key: tr-fk-on-one-side
    concept: core
    coreQuestion: q3
    type: multiple_choice
    status: reviewed
    difficulty: 1
    body: "회원과 글은 1:N이에요. 외래 키를 글이 아니라 회원 테이블에 `member(id, name, post_id)`로 두었어요. kim이 글 셋을 쓰면 어떻게 되나요?"
    choices:
      - kim 행 하나의 `post_id`에 세 글의 id가 함께 저장된다
      - 글 셋을 담으려고 kim이 id가 다른 세 행이 되고, 이름을 한 행만 고치면 값이 어긋난다
      - 외래 키 위반으로 둘째 글부터 저장되지 않는다
      - 회원 테이블과 글 테이블 모두에 문제가 없다
    answer: "2"
    explanation: |-
      **kim 행이 글 수만큼 반복돼요.** 칸 하나에는 글 id가 하나만 들어가요.

      - 같은 사람이 세 행이라 이름을 한 행만 고치면 이름이 두 가지가 돼요(갱신 이상)
      - 그래서 1:N의 외래 키는 칸 하나로 충분한 N 쪽, 곧 글의 `member_id`에 둬요
      - 검증: TableRelationshipsTest.fkOnOneSideDuplicatesParent
    source: https://github.com/wanja727/dev-lessons/blob/main/verification/src/test/java/lab/devlessons/relationship/TableRelationshipsTest.java
  - key: tr-fk-side-payment
    concept: core
    coreQuestion: q3
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: "주문 하나를 여러 번 나눠 결제할 수 있고, 결제 하나는 주문 하나에만 속해요. 두 테이블을 잇는 외래 키는 어디에 두나요?"
    choices:
      - "주문 테이블에 `payment_id`"
      - "결제 테이블에 `order_id`"
      - "두 테이블 모두에 서로의 id"
      - "외래 키 없이 매핑 테이블을 따로 둔다"
    answer: "2"
    explanation: |-
      **결제 테이블에 `order_id`를 둬요.** 주문과 결제는 1:N이고 결제가 N 쪽이에요.

      - 결제 하나에 주문은 하나라 결제 행의 칸 하나로 충분해요
      - 주문 쪽에 두면 결제 여럿을 담을 칸이 없어 주문 행이 반복돼요
      - 매핑 테이블은 양쪽 다 여럿인 N:M에 써요
    source: https://www.postgresql.org/docs/16/ddl-constraints.html
  # ── 질문 4 ──
  - key: tr-one-to-one-fk-only
    concept: core
    coreQuestion: q4
    type: code_predict
    status: reviewed
    difficulty: 1
    body: "회원 하나에 프로필 하나를 두려고 아래 테이블을 만들었어요. 회원 1이 있을 때 두 insert를 차례로 실행하면 어떻게 되나요? (PostgreSQL 16)"
    code: |-
      create table profile (
        id bigint primary key,
        member_id bigint not null
          references member(id),
        bio text
      );
      insert into profile values (1, 1, 'a');
      insert into profile values (2, 1, 'b');
    choices:
      - 둘째 insert가 외래 키 위반(23503)으로 실패한다
      - 둘째 insert가 중복(23505)으로 실패한다
      - 둘 다 들어가서 회원 1의 프로필이 둘이 된다
    answer: "3"
    explanation: |-
      **둘 다 들어가요.** 외래 키는 가리키는 회원이 있는지만 보고, 몇 개인지는 보지 않아요.

      - 외래 키만 있으면 1:N의 모양이에요
      - 1:1로 만들려면 `member_id`에 UNIQUE를 걸거나 `member_id`를 기본 키로 써요
      - 검증: TableRelationshipsTest.oneToOneNeedsUnique
    source: https://github.com/wanja727/dev-lessons/blob/main/verification/src/test/java/lab/devlessons/relationship/TableRelationshipsTest.java
  - key: tr-one-to-one-business
    concept: core
    coreQuestion: q4
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: "회원은 사업자 정보를 하나 등록할 수 있고, 등록하지 않는 회원도 많아요. 사업자 정보 테이블을 따로 둘 때 알맞은 설계는?"
    choices:
      - "`member`에 `business_id` 외래 키를 두고, 사업자 정보가 없는 회원은 NULL로 둔다"
      - "`business`에 `member_id` 외래 키만 둔다"
      - "`business`에 `member_id` 외래 키를 두고 UNIQUE를 건다"
      - "두 테이블에 서로를 가리키는 외래 키를 하나씩 둔다"
    answer: "3"
    explanation: |-
      **나중에 생기거나 없을 수 있는 쪽(사업자 정보)에 외래 키를 두고 UNIQUE를 걸어요.**

      - UNIQUE가 없으면 한 회원의 사업자 정보가 여럿 들어가는 1:N이 돼요
      - 회원 쪽에 두면 등록하지 않은 회원의 칸이 NULL이고, 등록할 때마다 회원 행을 고쳐야 해요
      - `member_id`를 기본 키로 쓰는 공유 기본 키도 같은 일을 해요
    source: https://www.postgresql.org/docs/16/ddl-constraints.html
  - key: tr-one-to-one-jpa-migration
    concept: core
    coreQuestion: q4
    type: multiple_choice
    status: reviewed
    difficulty: 3
    body: "`Profile` 엔티티에 `@OneToOne @JoinColumn(name = \"member_id\")`를 달았어요. 운영 DB는 손으로 쓴 마이그레이션으로 만드는데, `profile.member_id`에 외래 키만 있고 UNIQUE가 빠졌어요. 같은 회원의 프로필을 JPA로 두 번 저장하면 어떻게 되나요? (하이버네이트 6.6, `Member`에는 `@OneToOne(mappedBy = \"member\")`가 있어요)"
    choices:
      - 둘째 저장에서 하이버네이트가 개수를 세어 예외를 던진다
      - 둘째 저장에서 DB가 23505 오류를 낸다
      - 둘 다 저장되고, 나중에 그 회원을 읽을 때 `Duplicate row was found` 예외가 난다
      - 둘 다 저장되고, 회원을 읽으면 먼저 저장한 프로필이 나온다
    answer: "3"
    explanation: |-
      **둘 다 저장되고, 회원을 읽을 때 예외가 나요.**

      - JPA는 `@OneToOne`이라고 저장 전에 개수를 세지 않아요. 막는 것은 테이블의 UNIQUE예요
      - 회원을 읽을 때 하이버네이트가 프로필을 함께 찾는데 하나여야 할 행이 둘이라 실패해요
      - 고치는 곳은 마이그레이션이에요. `member_id`에 `unique`를 적어요
      - 검증: TableRelationshipsTest.oneToOneWithoutUniqueInMigration
    source: https://github.com/wanja727/dev-lessons/blob/main/verification/src/test/java/lab/devlessons/relationship/TableRelationshipsTest.java
  # ── 질문 5 ──
  - key: tr-mn-fk-on-study
    concept: core
    coreQuestion: q5
    type: multiple_choice
    status: reviewed
    difficulty: 1
    body: "회원과 스터디는 N:M인데, 스터디 테이블에 `member_id` 외래 키 하나를 두었어요. kim과 lee가 함께 있는 자바 스터디를 담으면 어떻게 되나요?"
    choices:
      - 자바 스터디 행 하나의 `member_id`에 두 회원이 함께 들어간다
      - 자바 스터디가 두 행이 되어 같은 스터디의 id가 둘이고 제목이 반복된다
      - 외래 키 위반으로 lee는 넣을 수 없다
      - 아무 문제가 없다
    answer: "2"
    explanation: |-
      **자바 스터디가 두 행이 돼요.** 칸 하나에는 회원 하나만 들어가요.

      - 같은 스터디인데 id가 둘이고 제목이 반복돼요
      - 회원 쪽에 `study_id`를 두면 이번에는 회원 행이 반복돼요. 어느 쪽에 두어도 같은 문제예요
      - 그래서 두 외래 키를 가진 매핑 테이블을 따로 둬요
      - 검증: TableRelationshipsTest.manyToManyNeedsMappingTable
    source: https://github.com/wanja727/dev-lessons/blob/main/verification/src/test/java/lab/devlessons/relationship/TableRelationshipsTest.java
  - key: tr-mn-student-course
    concept: core
    coreQuestion: q5
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: "학생은 여러 강의를 듣고, 강의 하나는 여러 학생이 들어요. 이 관계를 담으려면 테이블이 모두 몇 개 필요하고, 외래 키는 어디에 있나요?"
    choices:
      - "두 개. 강의 테이블에 `student_id`"
      - "두 개. 학생 테이블에 `course_id` 배열 열"
      - "세 개. 수강 테이블에 `student_id`와 `course_id`"
      - "세 개. 학생 테이블과 강의 테이블에 수강 테이블의 id"
    answer: "3"
    explanation: |-
      **세 개예요.** 학생과 강의 사이에 짝을 담는 수강 테이블을 두고, 두 외래 키를 그 테이블에 둬요.

      - 수강 행 하나가 "이 학생이 이 강의를 듣는다"는 짝 하나예요
      - 학생 쪽에서 1:N, 강의 쪽에서 1:N이라 N:M이 1:N 둘로 풀려요
      - 배열 열은 안의 값마다 외래 키를 걸 수 없어요
    source: https://www.postgresql.org/docs/16/ddl-constraints.html
  # ── 면접 ──
  - key: tr-interview
    concept: core
    coreQuestion: all
    type: descriptive
    status: reviewed
    difficulty: 2
    body: 면접에서 "테이블 사이의 1:1, 1:N, N:M 관계를 각각 어떻게 설계하나요?"라는 질문을 받았어요. 1분 안에 답해 보세요.
    explanation: |-
      **관계의 종류를 양쪽 방향으로 물어 정하고, 칸 하나에 값 하나라는 제약에 맞춰 외래 키를 둬요.**

      - **정하기:** "A 하나에 B는 몇 개, B 하나에 A는 몇 개"를 둘 다 묻는다. ERD의 선 끝 기호가 이 답이다
      - **1:N:** N 쪽에 외래 키를 둔다. 꼭 있어야 하면 NOT NULL
      - **1:1:** 외래 키에 UNIQUE(또는 외래 키를 기본 키로). 없을 수 있는 쪽에 둔다
      - **N:M:** 외래 키 하나로 담을 수 없어 두 외래 키를 가진 매핑 테이블로 1:N 둘로 푼다
    checklist:
      - 관계의 종류를 양쪽 방향으로 물어 정한다고 말했다
      - 1:N은 N 쪽에 외래 키를 둔다고 말했다
      - 1:1은 외래 키에 UNIQUE가 있어야 한다고 말했다
      - N:M은 칸 하나에 상대 하나만 담겨 외래 키 하나로 담을 수 없다고 말했다
      - N:M은 두 외래 키를 가진 매핑 테이블로 푼다고 말했다
    source: https://www.postgresql.org/docs/16/ddl-constraints.html
