# 질문마다 첫 문제는 본문의 예시로 묻고, 둘째 문제는 다른 상황으로 옮겨 묻는다.
# 2026-11-25에 만들고 같은 날 검수해 reviewed로 바꿨다.
subject:
  key: dev
  name: 개발자 면접
lesson:
  key: string
  title: String
  unit: 자바 언어
  order: 41
concepts:
  - key: core
    name: String
coreQuestions:
  - key: q1
    text: "String이 불변이라는 것은 무슨 뜻이고, 왜 그렇게 만들었나요?"
  - key: q2
    text: "문자열 리터럴은 어디에 저장되나요?"
  - key: q3
    text: "그러면 문자열을 ==로 비교하면 언제 틀리나요?"
  - key: q4
    text: "문자열을 이어 붙일 때 무엇을 조심해야 하나요?"
questions:
  # ── 질문 1 ──
  - key: str-to-upper
    concept: core
    coreQuestion: q1
    type: code_predict
    status: reviewed
    difficulty: 1
    body: 아래 코드는 무엇을 출력할까요?
    code: |-
      String s = "paid";
      s.toUpperCase();
      System.out.println(s);
    choices:
      - paid
      - PAID
      - 컴파일 오류
      - "null"
    answer: "1"
    explanation: |-
      **paid예요.** toUpperCase는 s를 고치지 않고 대문자로 된 새 문자열을 돌려줘요.

      - String은 불변이라 글자를 고치는 메서드가 없어요
      - 결과를 받지 않아서 새 문자열은 버려졌어요. s = s.toUpperCase()로 받아야 해요
    source: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/lang/String.html
  - key: str-reassign
    concept: core
    coreQuestion: q1
    type: code_predict
    status: reviewed
    difficulty: 2
    body: 아래 코드를 실행한 뒤 t의 값은 무엇일까요?
    code: |-
      String s = "A";
      String t = s;
      s = s + "B";
    choices:
      - '"A"'
      - '"AB"'
      - '"B"'
      - "null"
    answer: "1"
    explanation: |-
      **"A"예요.** s + "B"는 원래 객체를 고치지 않고 새 문자열을 만들어요.

      - s는 새 문자열 "AB"를 가리키게 됐어요
      - t는 처음의 "A" 객체를 그대로 가리켜요
    source: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/lang/String.html
  # ── 질문 2 ──
  - key: str-pool
    concept: core
    coreQuestion: q2
    type: code_predict
    status: reviewed
    difficulty: 1
    body: 아래 세 줄은 차례로 무엇을 출력할까요?
    code: |-
      String a = "PAID";
      String b = "PAID";
      String c = new String("PAID");
      System.out.println(a == b);
      System.out.println(a == c);
      System.out.println(a == c.intern());
    choices:
      - true, false, true
      - true, false, false
      - true, true, true
      - false, false, true
    answer: "1"
    explanation: |-
      **true, false, true예요.** 같은 리터럴은 문자열 상수 풀의 객체 하나를 가리켜요.

      - new String은 풀과 상관없이 새 객체를 만들어서 a == c는 false예요
      - intern()은 풀에 있는 같은 글자의 객체를 돌려줘서 a와 같아요
    source: https://docs.oracle.com/javase/specs/jls/se21/html/jls-3.html#jls-3.10.5
  - key: str-pool-classes
    concept: core
    coreQuestion: q2
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: 클래스 A에 static String x = "KRW";가, 클래스 B에 static String y = "KRW";가 있어요. A.x == B.y의 결과는 무엇일까요?
    choices:
      - true. 클래스가 달라도 같은 리터럴은 풀의 같은 객체다
      - false. 클래스마다 문자열을 따로 만든다
      - 컴파일 오류
      - 클래스를 읽는 순서에 따라 다르다
    answer: "1"
    explanation: |-
      **true예요.** 리터럴은 문자열 상수 풀에 글자마다 하나만 있고, 어느 클래스에 썼든 그 객체를 가리켜요.

      - 같은 객체를 함께 써도 되는 것은 String이 불변이기 때문이에요
    source: https://docs.oracle.com/javase/specs/jls/se21/html/jls-3.html#jls-3.10.5
  # ── 질문 3 ──
  - key: str-runtime-concat
    concept: core
    coreQuestion: q3
    type: code_predict
    status: reviewed
    difficulty: 1
    body: half는 final이 아닌 지역 변수예요. 아래 두 줄은 각각 무엇을 출력할까요?
    code: |-
      String a = "PAID";
      String half = "PA";
      System.out.println(a == half + "ID");
      System.out.println(a == "PA" + "ID");
    choices:
      - true, true
      - false, true
      - false, false
      - true, false
    answer: "2"
    explanation: |-
      **false, true예요.** 변수가 끼면 실행할 때 이어 붙여 새 객체가 생기고, 리터럴끼리는 컴파일러가 미리 계산해서 풀의 객체가 돼요.

      - 겉보기가 비슷한데 결과가 갈려서 문자열의 ==는 믿을 수 없어요
      - half를 final로 선언하면 첫 줄도 true가 돼요
    source: https://docs.oracle.com/javase/specs/jls/se21/html/jls-15.html#jls-15.29
  - key: str-to-upper-compare
    concept: core
    coreQuestion: q3
    type: code_predict
    status: reviewed
    difficulty: 2
    body: 아래 두 줄은 각각 무엇을 출력할까요?
    code: |-
      String a = "PAID";
      String f = "paid".toUpperCase();
      System.out.println(a == f);
      System.out.println(a.equals(f));
    choices:
      - true, true
      - false, true
      - false, false
      - true, false
    answer: "2"
    explanation: |-
      **false, true예요.** toUpperCase의 결과는 실행 중에 만들어진 새 객체예요.

      - 풀의 "PAID"와 다른 객체라 ==는 false예요
      - 글자는 같아서 equals는 true예요
    source: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/lang/String.html
  - key: str-request-param
    concept: core
    coreQuestion: q3
    type: code_predict
    status: reviewed
    difficulty: 2
    body: 스프링 컨트롤러에 아래 코드가 있어요. 클라이언트가 GET /orders?status=PAID를 보냈어요. if의 조건은 어떻게 될까요?
    code: |-
      @GetMapping("/orders")
      List<Order> orders(
          @RequestParam String status) {
        if (status == "PAID") {
          return orderService.paid();
        }
        return List.of();
      }
    choices:
      - true. 요청 값이 PAID다
      - false. 요청에서 읽어 만든 문자열은 풀의 "PAID"와 다른 객체다
      - 컴파일 오류
      - NullPointerException
    answer: "2"
    explanation: |-
      **false예요.** 스프링이 요청에서 읽어 만든 문자열은 실행 중에 생긴 새 객체예요.

      - 테스트에서 리터럴을 직접 넘기면 우연히 true라서 통과해요
      - "PAID".equals(status)로 비교해요. status가 null이어도 예외가 나지 않아요
    source: https://docs.oracle.com/javase/specs/jls/se21/html/jls-3.html#jls-3.10.5
  # ── 질문 4 ──
  - key: str-loop-objects
    concept: core
    coreQuestion: q4
    type: code_predict
    status: reviewed
    difficulty: 1
    body: ids에 원소가 1000개 있어요. 아래 반복문이 도는 동안 csv에 새 String 객체가 몇 번 대입될까요?
    code: |-
      String csv = "";
      for (String id : ids) {
        csv += id + ",";
      }
    choices:
      - 1번. 마지막에 한 번 만든다
      - 1000번. 돌 때마다 새 문자열을 만든다
      - 0번. 같은 객체의 뒤에 붙인다
      - 2번
    answer: "2"
    explanation: |-
      **1000번이에요.** String은 불변이라 뒤에 붙일 수 없고, 돌 때마다 지금까지의 글자를 복사한 새 문자열을 만들어요.

      - 그래서 원소가 늘수록 복사하는 양이 급격히 늘어요
      - 반복문에서 누적할 때는 StringBuilder를 써요
    source: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/lang/StringBuilder.html
  - key: str-builder-mutable
    concept: core
    coreQuestion: q4
    type: code_predict
    status: reviewed
    difficulty: 2
    body: 아래 코드를 실행한 뒤 sb2.toString()은 무엇일까요?
    code: |-
      StringBuilder sb = new StringBuilder("A");
      StringBuilder sb2 = sb;
      sb.append("B");
    choices:
      - '"A"'
      - '"AB"'
      - '"B"'
      - 컴파일 오류
    answer: "2"
    explanation: |-
      **"AB"예요.** StringBuilder는 가변이라 append가 같은 객체를 고쳐요.

      - sb2도 같은 객체를 가리켜서 덧붙인 것이 보여요
      - 불변인 String에서 s = s + "B"를 했을 때와 반대예요
    source: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/lang/StringBuilder.html
  - key: str-log-placeholder
    concept: core
    coreQuestion: q4
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: 로그 수준을 INFO로 둔 서버에서 아래 두 줄이 요청마다 실행돼요. debug 로그는 남지 않아요. order.toString()이 불리는 줄은 어느 것일까요?
    code: |-
      log.debug("주문 " + order);
      log.debug("주문 {}", order);
    choices:
      - 둘 다 불리지 않는다. debug가 꺼져 있다
      - 첫째 줄만 불린다
      - 둘째 줄만 불린다
      - 둘 다 불린다
    answer: "2"
    explanation: |-
      **첫째 줄만 불려요.** 메서드에 넘기기 전에 "주문 " + order를 먼저 계산하면서 toString()을 부르고 이어 붙여요.

      - debug가 꺼진 것은 그다음에야 알고 만든 문자열을 버려요
      - {} 자리 표시로 넘기면 로그를 실제로 남길 때만 문자열을 만들어요
    source: https://www.slf4j.org/faq.html#logging_performance
  # ── 네 질문을 하나로 ──
  - key: str-interview
    concept: core
    coreQuestion: all
    type: descriptive
    status: reviewed
    difficulty: 2
    body: 면접에서 "String은 왜 불변이고, 문자열은 왜 equals로 비교해야 하나요?"라는 질문을 받았어요. 1분 안에 답해 보세요.
    explanation: |-
      **String은 불변이라 리터럴을 상수 풀에서 공유하고, 실행 중에 만든 문자열은 새 객체라서 ==가 아니라 equals로 비교해요.**

      - **불변:** 연산은 새 객체를 돌려준다. 그래서 함께 써도, 맵의 키로 써도, 여러 스레드가 읽어도 안전하다
      - **상수 풀:** 같은 리터럴은 객체 하나를 함께 쓴다. new String은 새 객체다
      - **비교:** 요청, DB에서 읽거나 이어 붙여 만든 문자열은 풀의 객체가 아니라 ==가 false다
      - **이어 붙이기:** 반복문의 +=는 돌 때마다 복사해서 느리니 StringBuilder를 쓴다
    checklist:
      - String은 한 번 만들면 바뀌지 않고 연산이 새 객체를 돌려준다고 말했다
      - 불변이라 여러 곳이 함께 써도 안전하다는 이유를 말했다
      - 리터럴은 문자열 상수 풀에서 같은 객체를 공유한다고 말했다
      - 실행 중에 만든 문자열은 새 객체라 ==가 false이니 equals로 비교한다고 말했다
      - 반복문의 누적은 StringBuilder를 쓴다고 말했다
    source: https://docs.oracle.com/javase/specs/jls/se21/html/jls-3.html#jls-3.10.5
