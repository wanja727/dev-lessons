# 람다와 함수형 인터페이스 문제
# 형식: https://github.com/wanja727/retrievo/blob/main/docs/content-format.md
#
# 모든 문제는 coreQuestions의 질문 하나에 묶이고(coreQuestion), 답의 근거가 레슨 본문에 있다
# (site/src/content/lesson-pages/lambda.yaml의 says).
# 동작과 컴파일 결과는 verification의 LambdaTest, LambdaJdbcTest로 확인했다 (자바 21).
# 질문마다 첫 문제는 본문의 예시로 묻고, 둘째 문제는 다른 상황으로 옮겨 묻는다.
# 2026-11-25에 만들고 같은 날 검수해 reviewed로 바꿨다.
subject:
  key: dev
  name: 개발자 면접
lesson:
  key: lambda
  title: 람다와 함수형 인터페이스
  unit: 자바 언어
  order: 48
concepts:
  - key: core
    name: 람다와 함수형 인터페이스
coreQuestions:
  - key: q1
    text: "람다는 무엇이고 함수형 인터페이스와 어떤 관계인가요?"
  - key: q2
    text: "람다를 받은 쪽은 그것을 어떻게 쓰고, 람다는 언제 실행되나요?"
  - key: q3
    text: "람다 안에서 바깥의 변수를 쓸 때 어떤 규칙이 있나요?"
  - key: q4
    text: "메서드 참조는 무엇인가요?"
questions:
  # ── 질문 1 ──
  - key: lam-predicate
    concept: core
    coreQuestion: q1
    type: code_predict
    status: reviewed
    difficulty: 1
    body: 금액이 5000인 주문 order로 p.test(order)를 부르면 결과는 무엇일까요?
    code: |-
      Predicate<Order> p =
          o -> o.getPrice() >= 10000;
    choices:
      - "true"
      - "false"
      - 컴파일 오류
      - NullPointerException
    answer: "2"
    explanation: |-
      **false예요.** 람다는 Predicate의 test 메서드를 구현한 것이고, 5000은 10000 이상이 아니에요.

      - 화살표 왼쪽 o가 test의 매개변수, 오른쪽이 본문이에요
      - 클래스로 구현하거나 익명 클래스로 써도 같은 결과예요
    source: https://docs.oracle.com/javase/specs/jls/se21/html/jls-15.html#jls-15.27
  - key: lam-two-methods
    concept: core
    coreQuestion: q1
    type: code_predict
    status: reviewed
    difficulty: 2
    body: 아래 코드를 컴파일하면 어떻게 될까요?
    code: |-
      interface Validator {
        boolean validate(Order o);
        String name();
      }

      Validator v = o -> o.getPrice() > 0;
    choices:
      - 컴파일되고 validate가 구현된다
      - 컴파일 오류. 추상 메서드가 둘이라 함수형 인터페이스가 아니다
      - 컴파일되고 두 메서드가 같은 본문을 쓴다
      - 컴파일되지만 name()을 부르면 예외가 난다
    answer: "2"
    explanation: |-
      **컴파일 오류예요.** 람다는 추상 메서드 하나의 구현이라, 메서드가 둘이면 어느 것의 본문인지 정할 수 없어요.

      - 추상 메서드가 하나뿐인 인터페이스를 함수형 인터페이스라고 해요
      - @FunctionalInterface를 붙이면 컴파일러가 이것을 확인해 줘요
    source: https://docs.oracle.com/javase/specs/jls/se21/html/jls-9.html#jls-9.8
  # ── 질문 2 ──
  - key: lam-lazy
    concept: core
    coreQuestion: q2
    type: code_predict
    status: reviewed
    difficulty: 1
    body: 아래 코드의 출력 순서는 어떻게 될까요?
    code: |-
      Supplier<Order> s = () -> {
        print("주문 만드는 중");
        return new Order(0);
      };
      print("람다를 정의함");
      s.get();
      s.get();
    choices:
      - 주문 만드는 중, 람다를 정의함
      - 람다를 정의함, 주문 만드는 중
      - 람다를 정의함, 주문 만드는 중, 주문 만드는 중
      - 주문 만드는 중, 람다를 정의함, 주문 만드는 중, 주문 만드는 중
    answer: "3"
    explanation: |-
      **람다를 정의함, 주문 만드는 중, 주문 만드는 중이에요.** 람다는 get()을 부를 때마다 실행돼요.

      - 람다를 변수에 담는 줄에서는 본문이 실행되지 않아요
      - 두 번 불렀으니 두 번 실행되고 주문도 두 개 만들어져요
    source: https://docs.oracle.com/javase/specs/jls/se21/html/jls-15.html#jls-15.27.4
  - key: lam-run-if
    concept: core
    coreQuestion: q2
    type: code_predict
    status: reviewed
    difficulty: 2
    body: 아래 코드를 실행하면 "실행"이 출력될까요?
    code: |-
      static void runIf(boolean flag, Runnable r) {
        if (flag) r.run();
      }

      runIf(false, () -> print("실행"));
    choices:
      - 출력된다. 람다를 넘겼다
      - 출력되지 않는다. run()이 불리지 않았다
      - 두 번 출력된다
      - 컴파일 오류
    answer: "2"
    explanation: |-
      **출력되지 않아요.** 람다는 받은 쪽이 run()을 불러야 실행되는데, flag가 false라 부르지 않았어요.

      - 람다를 넘기는 것은 값이 아니라 할 일을 넘기는 것이에요
    source: https://docs.oracle.com/javase/specs/jls/se21/html/jls-15.html#jls-15.27.4
  # ── 질문 3 ──
  - key: lam-reassign
    concept: core
    coreQuestion: q3
    type: code_predict
    status: reviewed
    difficulty: 1
    body: 아래 코드를 컴파일하면 어떻게 될까요?
    code: |-
      int min = 10000;
      Predicate<Order> p =
          o -> o.getPrice() >= min;
      min = 20000;
    choices:
      - 컴파일되고 p는 10000을 기준으로 판단한다
      - 컴파일되고 p는 20000을 기준으로 판단한다
      - 컴파일 오류. min이 사실상 final이 아니다
      - 컴파일되지만 p를 부르면 예외가 난다
    answer: "3"
    explanation: |-
      **컴파일 오류예요.** 람다가 잡는 지역 변수는 한 번 대입한 뒤 바뀌지 않아야(사실상 final) 해요.

      - 람다는 나중에 실행되므로 만들어질 때 값을 복사해 가요
      - 복사본과 원본이 어긋나지 않게 재대입 자체를 막아요
    source: https://docs.oracle.com/javase/specs/jls/se21/html/jls-15.html#jls-15.27.2
  - key: lam-list-add
    concept: core
    coreQuestion: q3
    type: code_predict
    status: reviewed
    difficulty: 2
    body: orders에 주문이 셋 있어요. 아래 코드는 어떻게 될까요?
    code: |-
      List<String> names = new ArrayList<>();
      orders.forEach(o -> names.add(o.getName()));
    choices:
      - 컴파일 오류. 람다 안에서 바깥 변수를 바꿨다
      - 컴파일되고 names에 이름 셋이 들어간다
      - 컴파일되지만 names는 비어 있다
      - 실행할 때 예외가 난다
    answer: "2"
    explanation: |-
      **컴파일되고 이름 셋이 들어가요.** names에 다시 대입하지 않았고, 가리키는 리스트의 내용만 바뀌었어요.

      - 막는 것은 지역 변수의 재대입뿐이에요
      - 다만 계산 결과는 바깥 상태를 바꾸기보다 스트림으로 돌려받는 편이 나아요
    source: https://docs.oracle.com/javase/specs/jls/se21/html/jls-15.html#jls-15.27.2
  - key: lam-stream-sum
    concept: core
    coreQuestion: q3
    type: code_predict
    status: reviewed
    difficulty: 2
    body: 서비스에서 람다로 누적하던 코드를 아래처럼 바꿨어요. 주문 금액이 10000과 20000일 때 total은 얼마이고, 컴파일은 될까요?
    code: |-
      int total = orders.stream()
          .mapToInt(Order::getPrice)
          .sum();
    choices:
      - 컴파일되고 30000
      - 컴파일 오류. 람다에서 바깥 변수를 바꿨다
      - 컴파일되고 0
      - 컴파일되고 20000
    answer: "1"
    explanation: |-
      **컴파일되고 30000이에요.** 바깥 변수를 람다 안에서 바꾸지 않고 결과를 돌려받았어요.

      - forEach 안에서 total += ...을 하면 컴파일되지 않아요
      - int[]나 AtomicInteger로 감싸 돌아가는 대신 이렇게 써요
    source: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/stream/IntStream.html#sum()
  # ── 질문 4 ──
  - key: lam-method-ref
    concept: core
    coreQuestion: q4
    type: multiple_choice
    status: reviewed
    difficulty: 1
    body: 'Function<Order, Integer> c = Order::getPrice;와 같은 일을 하는 람다는 무엇일까요?'
    choices:
      - () -> Order.getPrice()
      - o -> o.getPrice()
      - o -> Order.getPrice(o)
      - () -> new Order().getPrice()
    answer: "2"
    explanation: |-
      **o -> o.getPrice()예요.** 클래스 이름으로 쓴 인스턴스 메서드 참조는 첫 인자가 메서드를 부를 대상이 돼요.

      - name::length처럼 변수 이름으로 쓰면 대상이 이미 정해져 있어요
    source: https://docs.oracle.com/javase/specs/jls/se21/html/jls-15.html#jls-15.13
  - key: lam-comparator
    concept: core
    coreQuestion: q4
    type: code_predict
    status: reviewed
    difficulty: 2
    body: 금액이 3000, 1000, 2000인 주문 리스트를 아래처럼 정렬했어요. 정렬 뒤 첫 주문의 금액은 얼마일까요?
    code: |-
      orders.sort(Comparator
          .comparing(Order::getPrice)
          .reversed());
    choices:
      - "1000"
      - "2000"
      - "3000"
      - 정렬 전과 같다
    answer: "3"
    explanation: |-
      **3000이에요.** comparing(Order::getPrice)는 금액으로 비교하는 Comparator를 만들고, reversed()가 순서를 뒤집어요.

      - 금액이 큰 주문부터 와요
      - thenComparing으로 같을 때의 기준을 이어 쓸 수 있어요
    source: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/Comparator.html
  # ── 네 질문을 하나로 ──
  - key: lam-interview
    concept: core
    coreQuestion: all
    type: descriptive
    status: reviewed
    difficulty: 2
    body: 면접에서 "람다와 함수형 인터페이스를 설명해 주세요"라는 질문을 받았어요. 1분 안에 답해 보세요.
    explanation: |-
      **람다는 추상 메서드가 하나뿐인 인터페이스의 구현을 짧게 쓴 것이고, 받은 쪽이 그 메서드를 부를 때 실행돼요.**

      - **함수형 인터페이스:** 추상 메서드가 하나다. Function, Predicate, Supplier, Consumer가 대표다
      - **실행 시점:** 람다를 쓴 줄이 아니라 받은 쪽이 메서드를 부를 때마다 실행된다
      - **변수 잡기:** 값을 복사해 가므로 잡는 지역 변수는 사실상 final이어야 한다
      - **메서드 참조:** 이미 있는 메서드를 부르기만 하는 람다를 Order::getPrice처럼 줄인 것
    checklist:
      - 함수형 인터페이스는 추상 메서드가 하나뿐인 인터페이스라고 말했다
      - 람다는 그 메서드의 구현을 짧게 쓴 것이라고 말했다
      - 람다는 받은 쪽이 메서드를 부를 때 실행된다고 말했다
      - 잡는 지역 변수는 사실상 final이어야 하고 그 이유를 말했다
      - 메서드 참조가 무엇인지 예를 들어 말했다
    source: https://docs.oracle.com/javase/specs/jls/se21/html/jls-15.html#jls-15.27
