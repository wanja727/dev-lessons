questions:
  - key: q-a64a6926
    concept: core
    type: descriptive
    status: draft
    difficulty: 1
    body: Redis의 자료구조 다섯 가지와 각각의 대표적인 쓰임을 말해 보세요
    explanation: |-
      - 체크리스트 항목이 모범 답안의 요점이다
      - 검증: RedisRankingTest (fiveDataStructures)
    checklist:
      - "String: 캐시·카운터(INCR)"
      - "Hash: 필드 묶음(프로필, 장바구니)"
      - "List: 순서 있는 목록(최근 본 상품, LTRIM으로 개수 제한)"
      - "Set: 중복 없는 모음(방문자)"
      - "Sorted Set: 점수 정렬(랭킹)"
    source: https://redis.io/docs/latest/develop/data-types/
  - key: q-1a3f2bd8
    concept: core
    type: descriptive
    status: draft
    difficulty: 2
    body: 실시간 랭킹을 DB ORDER BY로 만드는 것과 Redis Sorted Set으로 만드는 것을 비교해 보세요
    explanation: "- 체크리스트 항목이 모범 답안의 요점이다"
    checklist:
      - DB는 점수가 바뀔 때마다 정렬하거나 내 순위를 세야 해 부담이 크다고 말했다
      - Sorted Set은 정렬 상태를 유지해 점수 변경·순위 조회가 O(log N)이라고 말했다
      - 하루 한 번 집계면 DB + 캐시로 충분하다고 말했다
      - 원본은 DB 원장, Redis는 다시 만들 수 있는 사본이라고 말했다
      - 메모리 저장소라 장애 시 유실 가능성을 말했다
    source: https://redis.io/docs/latest/develop/data-types/sorted-sets/
  - key: q-fe7cb8e4
    concept: core
    type: descriptive
    status: draft
    difficulty: 3
    body: 학습앱 XP 랭킹에서 "같은 점수면 먼저 달성한 사람이 위"라는 규칙을 어떻게 구현하나요?
    explanation: |-
      - 체크리스트 항목이 모범 답안의 요점이다
      - 검증: RedisRankingTest (tieBreaking)
    checklist:
      - 기본은 동점이면 이름 사전 역순(ZREVRANGE)이라고 말했다
      - 점수에 시간을 섞는다(포인트 앞자리, 시간 뒷자리)고 말했다
      - 먼저 달성할수록 뒷자리가 커지게(기준 시각 - 달성 시각) 만든다고 말했다
      - double 정밀도(약 9 x 10^15)와 자릿수가 겹치지 않게 해야 한다고 말했다
      - 화면에는 포인트 부분만 보여준다고 말했다
    source: https://redis.io/docs/latest/commands/zrevrange/
  - key: q-63033190
    concept: core
    type: code_predict
    status: draft
    difficulty: 2
    body: ZADD r 100 alice, ZADD r 100 bob 후 ZREVRANGE r 0 -1의 결과는?
    choices:
      - alice, bob
      - bob, alice
      - 실행마다 다르다
    answer: "2"
    explanation: |-
      - 동점은 사전 역순. 넣은 순서와 상관없다
      - 검증: RedisRankingTest (tieBreaking)
    source: https://redis.io/docs/latest/commands/zrevrange/
  - key: q-6ae2c413
    concept: core
    type: ox
    status: draft
    difficulty: 1
    body: ZREVRANK의 결과가 0이면 랭킹에 없다는 뜻이다
    answer: X
    explanation: |-
      - 0은 1위. 없으면 nil
      - 검증: RedisRankingTest (ranking)
    source: https://redis.io/docs/latest/develop/data-types/sorted-sets/
  - key: q-8e33822e
    concept: core
    type: multiple_choice
    status: draft
    difficulty: 1
    body: 두 서버가 동시에 같은 사용자에게 ZINCRBY +10을 보냈다. 결과는?
    choices:
      - +10만 반영될 수 있다
      - 항상 +20
      - 오류
    answer: "2"
    explanation: |-
      - Redis는 명령을 하나씩 실행한다
      - 검증: RedisRankingTest (concurrentIncrementsAreAtomic)
    source: https://redis.io/docs/latest/commands/zincrby/
  - key: q-a597f55c
    concept: core
    type: ox
    status: draft
    difficulty: 2
    body: "\"점수를 읽고, 100 미만이면 ZINCRBY\" 두 명령을 이어 보내면 사이에 다른 명령이 끼어들 수 없다"
    answer: X
    explanation: "- 명령 하나만 원자적이다. 묶으려면 Lua 스크립트"
    source: https://redis.io/docs/latest/develop/programmability/eval-intro/
