# Redis 문제
# 형식: https://github.com/wanja727/retrievo/blob/main/docs/content-format.md
#
# 모든 문제는 coreQuestions의 질문 하나에 묶이고(coreQuestion), 답의 근거가 레슨 본문에 있다
# (site/src/content/lesson-pages/redis-ranking.yaml의 says).
# 동작에 관한 정답은 verification의 RedisRankingTest와 RedisAtomicityTest로 확인했다 (Redis 7).
# 질문마다 첫 문제는 본문의 예시로 묻고, 둘째 문제는 다른 상황으로 옮겨 묻는다.
# 2026-11-25에 랭킹 레슨을 Redis 레슨으로 다시 쓰면서 예전 문제를 지우고 새로 썼다.
subject:
  key: dev
  name: 개발자 면접
lesson:
  key: redis-ranking
  title: Redis
  unit: 시스템 설계와 아키텍처
  order: 905
concepts:
  - key: core
    name: Redis
coreQuestions:
  - key: q1
    text: "Redis는 무엇이고 어떤 자료구조를 쓰나요?"
  - key: q2
    text: "Sorted Set으로 랭킹을 어떻게 만드나요?"
  - key: q3
    text: "여러 서버가 동시에 점수를 더해도 왜 값이 맞나요?"
  - key: q4
    text: "Redis에 둔 데이터는 믿어도 되나요?"
questions:
  # ── 질문 1 ──
  - key: rd-visitors-set
    concept: core
    coreQuestion: q1
    type: multiple_choice
    status: draft
    difficulty: 1
    body: 오늘 방문한 사용자 수를 중복 없이 세려고 해요. 같은 사용자가 하루에 여러 번 와도 한 명으로 쳐야 해요. Redis의 자료구조 가운데 무엇이 알맞을까요?
    choices:
      - String에 INCR
      - Set에 SADD하고 SCARD로 센다
      - List에 LPUSH
      - Hash에 HSET
    answer: "2"
    explanation: |-
      **Set이에요.** Set은 같은 값을 두 번 넣어도 하나만 담아요.

      - 테스트에서 user:1, user:2, user:1을 넣으니 SCARD가 2였어요
      - INCR는 같은 사용자가 올 때마다 늘어요
    source: https://redis.io/docs/latest/develop/data-types/
  - key: rd-chat-list
    concept: core
    coreQuestion: q1
    type: multiple_choice
    status: draft
    difficulty: 2
    body: 채팅방마다 마지막 메시지 50개만 보여 줘요. 새 메시지를 넣을 때마다 오래된 메시지를 버리려면 어떻게 하는 것이 알맞을까요?
    choices:
      - Set에 SADD하고 50개가 넘으면 서버에서 지운다
      - List에 LPUSH한 뒤 LTRIM 0 49로 앞의 50개만 남긴다
      - String 하나에 메시지를 모두 이어 붙인다
      - Sorted Set에 메시지 길이를 점수로 넣는다
    answer: "2"
    explanation: |-
      **List에 LPUSH 뒤 LTRIM 0 49예요.** List는 넣은 순서를 지키고, LTRIM이 범위 밖을 버려요.

      - 테스트에서 7개를 넣으며 LTRIM 0 4를 하니 최근 5개만 남았어요
      - Set은 순서가 없고 같은 메시지를 하나로 합쳐요
    source: https://redis.io/docs/latest/develop/data-types/
  # ── 질문 2 ──
  - key: rd-zrevrank-zero
    concept: core
    coreQuestion: q2
    type: code_predict
    status: draft
    difficulty: 1
    body: 아래 명령을 차례로 실행하면 마지막 ZREVRANK의 결과는 무엇일까요?
    code: |-
      ZADD ranking 100 minji
      ZADD ranking 90 junho
      ZADD ranking 120 alice
      ZREVRANK ranking junho
    choices:
      - "3"
      - "2"
      - "1"
      - "0"
    answer: "2"
    explanation: |-
      **2예요.** 높은 점수부터 alice, minji, junho이고, 순위는 0부터 세요.

      - 사람에게 보여 줄 때는 1을 더해 3위로 보여요
      - Sorted Set은 늘 점수 순서를 유지해서 순위를 바로 구해요
    source: https://redis.io/docs/latest/develop/data-types/sorted-sets/
  - key: rd-sales-top10
    concept: core
    coreQuestion: q2
    type: multiple_choice
    status: draft
    difficulty: 2
    body: 주문이 들어올 때마다 `ZINCRBY sales 1 <상품id>`로 상품별 판매량을 더해요. 가장 많이 팔린 상품 10개를 꺼내는 명령은 무엇일까요?
    choices:
      - ZRANGE sales 0 9
      - ZREVRANGE sales 0 9
      - ZREVRANGE sales 1 10
      - ZCARD sales
    answer: "2"
    explanation: |-
      **ZREVRANGE sales 0 9예요.** 점수가 높은 쪽부터 0번째에서 9번째까지 10개를 꺼내요.

      - ZRANGE는 낮은 점수부터라 가장 적게 팔린 10개가 나와요
      - 꺼낼 때 정렬하지 않아서 상품이 많아도 빨라요
    source: https://redis.io/docs/latest/develop/data-types/sorted-sets/
  - key: rd-tie-order
    concept: core
    coreQuestion: q2
    type: code_predict
    status: draft
    difficulty: 2
    body: 아래처럼 두 사람의 점수가 같아요. ZREVRANGE의 결과는 무엇일까요?
    code: |-
      ZADD event 200 coffee
      ZADD event 200 apple
      ZREVRANGE event 0 -1
    choices:
      - apple, coffee
      - coffee, apple
      - 정해져 있지 않아 매번 다르다
      - 오류가 난다
    answer: "2"
    explanation: |-
      **coffee, apple이에요.** 점수가 같으면 이름의 사전 순서(apple, coffee)로 놓이고, ZREVRANGE는 그것을 거꾸로 읽어요.

      - 테스트에서 alice와 bob이 동점일 때 bob, alice 순서였어요
      - 먼저 달성한 사람을 앞에 두려면 점수에 시간을 섞어요
    source: https://redis.io/docs/latest/develop/data-types/sorted-sets/
  # ── 질문 3 ──
  - key: rd-incr-two-servers
    concept: core
    coreQuestion: q3
    type: multiple_choice
    status: draft
    difficulty: 1
    body: views가 10이에요. 서버 두 대가 동시에 `INCR views`를 한 번씩 보냈어요. 끝난 뒤 views는 얼마일까요?
    choices:
      - "11"
      - "12"
      - 11 또는 12, 정해지지 않는다
      - "20"
    answer: "2"
    explanation: |-
      **12예요.** Redis는 명령을 하나씩 실행해서 INCR 하나는 다른 명령과 섞이지 않아요.

      - 테스트에서 연결 50개가 1,000번 INCR하니 정확히 1,000이었어요
      - GET 뒤 SET으로 나눴다면 11이 될 수 있어요
    source: https://redis.io/docs/latest/develop/data-types/
  - key: rd-coupon-get-decr
    concept: core
    coreQuestion: q3
    type: code_predict
    status: draft
    difficulty: 2
    body: 쿠폰 남은 수량이 1이에요. 서버 두 대가 동시에 아래 코드를 실행하면 생길 수 있는 일은 무엇일까요?
    code: |-
      long left = Long.parseLong(
          redis.get("coupon"));
      if (left > 0) {
        redis.decr("coupon");
        issue(userId);
      }
    choices:
      - 한 서버만 발급하고 수량은 0이 된다
      - 둘 다 1을 읽고 둘 다 발급해 수량이 -1이 된다
      - Redis가 두 번째 GET을 거절한다
      - DECR이 0에서 멈춰서 둘 다 발급하지 못한다
    answer: "2"
    explanation: |-
      **둘 다 발급하고 수량이 -1이 될 수 있어요.** GET과 DECR은 따로 실행되는 명령이라 그 사이에 다른 서버의 명령이 끼어들어요.

      - 명령 하나는 원자적이지만 명령 둘 사이는 아니에요
      - 확인과 차감을 Lua 스크립트로 묶으면 한 번에 실행돼요
    source: https://redis.io/docs/latest/develop/interact/programmability/eval-intro/
  # ── 질문 4 ──
  - key: rd-zunionstore-sum
    concept: core
    coreQuestion: q4
    type: code_predict
    status: draft
    difficulty: 1
    body: 아래 명령을 실행한 뒤 week에서 민지의 점수는 얼마일까요?
    code: |-
      ZINCRBY day1 100 민지
      ZINCRBY day2 50 민지
      ZUNIONSTORE week 2 day1 day2
    choices:
      - "100"
      - "150"
      - "50"
      - "75"
    answer: "2"
    explanation: |-
      **150이에요.** ZUNIONSTORE는 기본으로 같은 멤버의 점수를 더해요.

      - 테스트에서 민지 100과 50을 합치니 150이었어요
      - 날짜별 키에는 EXPIRE로 수명을 줘야 메모리가 쌓이지 않아요
    source: https://redis.io/docs/latest/commands/zunionstore/
  - key: rd-balance-only-redis
    concept: core
    coreQuestion: q4
    type: multiple_choice
    status: draft
    difficulty: 2
    body: 포인트 잔액을 DB 없이 Redis에만 두고 `INCRBY`로 바꾸자는 제안을 받았어요. 영속화는 AOF `everysec`(1초마다 디스크에 맞춤)로 해요. Redis 서버가 갑자기 꺼지면 생길 수 있는 일은 무엇일까요?
    choices:
      - 아무것도 잃지 않는다. AOF가 모든 명령을 바로 디스크에 쓴다
      - 마지막 1초쯤의 잔액 변경을 잃을 수 있다. 잔액의 원본은 DB에 둔다
      - Redis는 꺼지지 않는다
      - 잔액이 모두 0으로 돌아간다
    answer: "2"
    explanation: |-
      **마지막 1초쯤의 변경을 잃을 수 있어요.** everysec는 1초마다 디스크에 맞춰서 그 사이의 쓰기는 메모리에만 있어요.

      - 잃으면 안 되는 원본은 DB에 두고, Redis에는 다시 만들 수 있는 것을 둬요
      - 근거는 Redis 영속화 문서예요
    source: https://redis.io/docs/latest/operate/oss_and_stack/management/persistence/
  - key: rd-redistemplate-bytes
    concept: core
    coreQuestion: q4
    type: multiple_choice
    status: draft
    difficulty: 2
    body: "스프링에서 기본 `RedisTemplate<Object, Object>`로 `opsForValue().set(\"views\", 1)`을 했어요. redis-cli에서 `GET views`를 하면 아무것도 나오지 않아요. 왜 그럴까요?"
    choices:
      - 값이 아직 저장되지 않았다
      - 기본 RedisTemplate은 키를 자바 직렬화한 바이트로 저장해서 "views"라는 키가 없다
      - redis-cli는 숫자를 읽지 못한다
      - RedisTemplate은 메모리에만 저장하고 Redis에 보내지 않는다
    answer: "2"
    explanation: |-
      **키가 자바 직렬화된 바이트로 저장됐기 때문이에요.** Redis에는 \xac\xed... 같은 키가 들어가요.

      - 문자열을 다루면 StringRedisTemplate을 써요. 키와 값을 문자열 그대로 저장해요
      - 근거는 스프링 데이터 Redis 문서예요
    source: https://docs.spring.io/spring-data/redis/reference/redis/template.html
  # ── 네 질문을 하나로 ──
  - key: rd-interview
    concept: core
    coreQuestion: all
    type: descriptive
    status: draft
    difficulty: 2
    body: 면접에서 "Redis는 무엇이고, 어떤 상황에 어떻게 쓰나요?"라는 질문을 받았어요. 1분 안에 답해 보세요.
    explanation: |-
      **메모리에 자료구조를 담는 키-값 저장소이고, 캐시, 카운터, 랭킹처럼 빠르고 다시 만들 수 있는 데이터에 써요.**

      - **자료구조:** String, Hash, List, Set, Sorted Set. 값의 모양에 맞게 고른다
      - **랭킹:** Sorted Set에 ZINCRBY로 더하고 ZREVRANGE, ZREVRANK로 꺼낸다. O(log n)
      - **동시성:** 명령을 하나씩 실행해 명령 하나는 원자적이다. GET 뒤 SET은 값을 잃으니 명령 하나나 Lua로 묶는다
      - **믿어도 되나:** RDB, AOF로도 마지막 조금은 잃는다. 원본은 DB에 두고 키에 만료를 준다
    checklist:
      - 메모리에 두는 키-값 저장소라고 말했다
      - 자료구조 둘 이상과 쓰임을 말했다
      - Sorted Set으로 랭킹을 만드는 법을 말했다
      - 명령 하나는 원자적이고 명령 둘 사이는 아니라고 말했다
      - 원본은 DB에 두는 이유(영속화의 한계)를 말했다
    source: https://redis.io/docs/latest/develop/data-types/
