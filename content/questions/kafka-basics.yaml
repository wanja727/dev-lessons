# 메시지 큐 문제
# 형식: https://github.com/wanja727/retrievo/blob/main/docs/content-format.md
#
# 모든 문제는 coreQuestions의 질문 하나에 묶이고(coreQuestion), 답의 근거가 레슨 본문에 있다
# (site/src/content/lesson-pages/kafka-basics.yaml의 says).
# 동작에 관한 정답은 verification의 KafkaBasicsTest로 확인했다 (카프카 컨테이너).
# 질문마다 첫 문제는 본문의 예시로 묻고, 둘째 문제는 다른 상황으로 옮겨 묻는다.
# 2026-11-25에 메시지 큐 레슨으로 다시 쓰면서 예전 문제를 지우고 새로 썼다.
subject:
  key: dev
  name: 개발자 면접
lesson:
  key: kafka-basics
  title: 메시지 큐
  unit: 시스템 설계와 아키텍처
  order: 908
concepts:
  - key: core
    name: 메시지 큐
coreQuestions:
  - key: q1
    text: "왜 일을 메시지 큐로 떼어 놓나요?"
  - key: q2
    text: "카프카는 메시지를 어떻게 담고, 순서는 어디까지 지키나요?"
  - key: q3
    text: "컨슈머 여러 대는 메시지를 어떻게 나눠 받나요?"
  - key: q4
    text: "메시지가 두 번 오거나 사라지는 것은 언제인가요?"
questions:
  # ── 질문 1 ──
  - key: mq-mail-down
    concept: core
    coreQuestion: q1
    type: multiple_choice
    status: draft
    difficulty: 1
    body: 주문 서버는 주문 완료 메시지를 큐에 남기고 바로 응답하고, 알림 서버가 큐에서 받아 메일을 보내요. 알림 서버가 10분 동안 죽어 있었어요. 그동안의 주문과 메일은 어떻게 되나요?
    choices:
      - 주문이 실패한다
      - 주문은 성공하고, 메시지는 큐에 남아 있다가 알림 서버가 살아나면 메일이 나간다
      - 주문은 성공하지만 그동안의 메일은 영원히 사라진다
      - 주문 서버도 함께 멈춘다
    answer: "2"
    explanation: |-
      **주문은 성공하고 메일은 나중에 나가요.** 큐가 메시지를 맡아 두니 보내는 쪽은 받는 쪽을 기다리지 않아요.

      - 직접 부르는 구조였다면 메일 서버 장애로 주문까지 실패했어요
      - 대신 메일은 조금 늦게 나가요(결과적 일관성)
    source: https://kafka.apache.org/documentation/#design
  - key: mq-coupon-immediate
    concept: core
    coreQuestion: q1
    type: multiple_choice
    status: draft
    difficulty: 2
    body: 회원 가입 직후 화면에서 가입 축하 쿠폰을 바로 보여 주고 써야 해요. 쿠폰 발급을 메시지 큐로 떼어 놓을 때 생길 수 있는 문제는?
    choices:
      - 가입 요청이 실패한다
      - 쿠폰이 조금 뒤에 생겨 가입 직후 화면에서 보이지 않을 수 있다
      - 쿠폰이 두 장 발급된다
      - 문제없다. 큐는 늘 바로 처리한다
    answer: "2"
    explanation: |-
      **쿠폰이 조금 뒤에 생겨요.** 큐로 떼면 받는 쪽이 자기 속도로 처리해서 결과를 바로 알 수 없어요.

      - 결과가 응답에 꼭 필요한 일은 직접 불러요
      - 결과를 바로 몰라도 되는 일(메일, 통계)을 큐로 떼요
    source: https://kafka.apache.org/documentation/#design
  # ── 질문 2 ──
  - key: mq-key-order
    concept: core
    coreQuestion: q2
    type: multiple_choice
    status: draft
    difficulty: 1
    body: 파티션 3개인 토픽에 키 order-1의 메시지 A, 키 order-2의 메시지 C, 키 order-1의 메시지 B를 차례로 보냈어요. 읽는 순서가 보장되는 것은?
    choices:
      - A, C, B 전체의 순서
      - A 다음 B. C와의 순서는 보장되지 않는다
      - 아무 순서도 보장되지 않는다
      - C 다음 A
    answer: "2"
    explanation: |-
      **같은 키인 A와 B의 순서만 보장돼요.** 같은 키는 같은 파티션에 가고, 순서는 한 파티션 안에서만 지켜져요.

      - order-2는 다른 파티션에 갈 수 있어서 A, B와의 순서는 정해지지 않아요
      - 테스트에서 주문마다 이벤트 5개가 한 파티션에 모여 보낸 순서로 읽혔어요
    source: https://kafka.apache.org/documentation/#design
  - key: mq-member-no-key
    concept: core
    coreQuestion: q2
    type: multiple_choice
    status: draft
    difficulty: 2
    body: 회원 이벤트(가입, 이메일 변경)를 키 없이 보냈더니, 같은 회원의 "이메일 변경"이 "가입"보다 먼저 처리되는 일이 생겼어요. 가장 알맞은 고치는 방법은?
    choices:
      - 파티션을 늘린다
      - 회원 id를 키로 보낸다
      - 컨슈머를 늘린다
      - 메시지를 두 번 보낸다
    answer: "2"
    explanation: |-
      **회원 id를 키로 보내요.** 같은 키는 같은 파티션에 가서 보낸 순서대로 읽혀요.

      - 키가 없으면 메시지가 여러 파티션에 흩어져 순서가 섞일 수 있어요
      - 파티션이나 컨슈머를 늘리면 오히려 더 흩어져요
    source: https://kafka.apache.org/documentation/#design
  # ── 질문 3 ──
  - key: mq-four-consumers
    concept: core
    coreQuestion: q3
    type: multiple_choice
    status: draft
    difficulty: 1
    body: 파티션 3개인 토픽을 같은 컨슈머 그룹의 컨슈머 4대가 읽어요. 메시지를 받는 컨슈머는 몇 대인가요?
    choices:
      - 4대
      - 3대
      - 1대
      - 2대
    answer: "2"
    explanation: |-
      **3대예요.** 한 파티션은 그룹 안에서 컨슈머 하나만 읽어서, 파티션보다 많은 컨슈머는 놀아요.

      - 테스트에서도 컨슈머 하나가 파티션 없이 대기했어요
      - 처리 대수를 늘리려면 파티션부터 늘려요
    source: https://kafka.apache.org/documentation/#intro_concepts_and_terms
  - key: mq-other-group
    concept: core
    coreQuestion: q3
    type: multiple_choice
    status: draft
    difficulty: 2
    body: 정산 서버 2대를 같은 그룹 settle로, 통계 서버 1대를 다른 그룹 stats로 같은 토픽에 붙였어요. 메시지 100개가 오면 통계 서버가 받는 메시지는 몇 개인가요?
    choices:
      - 50개
      - 100개
      - 33개
      - 0개
    answer: "2"
    explanation: |-
      **100개예요.** 그룹이 다르면 서로 상관없이 모든 메시지를 따로 받아요.

      - 정산 서버 두 대는 같은 그룹이라 100개를 나눠 받아요
      - 테스트에서 다른 그룹의 컨슈머는 메시지 6개를 모두 받았어요
    source: https://kafka.apache.org/documentation/#intro_concepts_and_terms
  # ── 질문 4 ──
  - key: mq-crash-before-commit
    concept: core
    coreQuestion: q4
    type: code_predict
    status: draft
    difficulty: 1
    body: 아래 컨슈머가 포인트를 적립한 직후, commitSync 전에 죽었어요. 다시 띄우면 어떻게 되나요?
    code: |-
      var records = consumer.poll(
          Duration.ofMillis(500));
      for (var r : records) {
        earnPoint(r.value());
      }
      consumer.commitSync();
    choices:
      - 다음 메시지부터 읽어서 아무 일도 없다
      - 같은 메시지를 다시 받는다. 거르지 않으면 포인트가 두 번 적립된다
      - 메시지가 사라져 포인트가 적립되지 않는다
      - 컨슈머가 시작되지 않는다
    answer: "2"
    explanation: |-
      **같은 메시지를 다시 받아요.** 커밋하지 않았으니 재시작한 컨슈머는 그 offset부터 다시 읽어요(최소 한 번).

      - 테스트에서 재시작한 컨슈머가 같은 offset 0을 받았고, 그냥 처리하면 포인트가 두 번이었어요
      - 이벤트 id로 거르면 한 번만 적립돼요
    source: https://kafka.apache.org/documentation/#semantics
  - key: mq-commit-first-mail
    concept: core
    coreQuestion: q4
    type: multiple_choice
    status: draft
    difficulty: 2
    body: 알림 컨슈머가 메시지를 받자마자 offset을 커밋하고, 그다음 메일을 보내요. 메일을 보내기 전에 컨슈머가 죽었다가 다시 떴어요. 그 알림은 어떻게 되나요?
    choices:
      - 다시 와서 메일이 나간다
      - 다시 오지 않아 메일이 나가지 않는다
      - 두 번 와서 메일이 두 번 나간다
      - 카프카가 알아서 메일을 보낸다
    answer: "2"
    explanation: |-
      **다시 오지 않아요.** 이미 커밋해서 그 메시지는 읽은 것으로 남았어요(최대 한 번, 유실).

      - 테스트에서 커밋 뒤 처리 전에 끝내니 재시작한 컨슈머가 받은 메시지가 0개였어요
      - 보통 처리한 뒤 커밋하고, 중복은 이벤트 id로 걸러요
    source: https://kafka.apache.org/documentation/#semantics
  - key: mq-listener-dedup
    concept: core
    coreQuestion: q4
    type: multiple_choice
    status: draft
    difficulty: 2
    body: "스프링 카프카의 `@KafkaListener`로 포인트를 적립해요. 같은 메시지가 다시 와도 한 번만 적립되게 하는 방법으로 가장 알맞은 것은?"
    choices:
      - 리스너에 @Transactional만 붙인다
      - 처리한 이벤트 id를 유니크 제약이 있는 테이블에 적립과 같은 트랜잭션으로 넣고, 위반이 나면 건너뛴다
      - 메시지를 받자마자 커밋한다
      - 컨슈머를 한 대로 줄인다
    answer: "2"
    explanation: |-
      **처리한 이벤트 id를 유니크 제약으로 기록해요.** 다시 온 메시지는 유니크 위반이 나서 적립도 함께 롤백돼요.

      - @Transactional만으로는 같은 메시지를 두 번 받는 것을 막지 못해요
      - 받자마자 커밋하면 중복 대신 유실이 생겨요
    source: https://docs.spring.io/spring-kafka/reference/kafka/receiving-messages.html
  # ── 네 질문을 하나로 ──
  - key: mq-interview
    concept: core
    coreQuestion: all
    type: descriptive
    status: draft
    difficulty: 2
    body: 면접에서 "메시지 큐(카프카)를 왜 쓰고, 쓸 때 무엇을 조심하나요?"라는 질문을 받았어요. 1분 안에 답해 보세요.
    explanation: |-
      **보내는 쪽이 받는 쪽을 기다리지 않게 떼어 놓으려고 쓰고, 순서와 중복을 조심해요.**

      - **왜:** 응답이 빨라지고, 받는 쪽이 죽어도 보내는 쪽은 성공하고, 몰린 요청을 쌓아 둔다
      - **순서:** 같은 키는 같은 파티션에 가고, 순서는 한 파티션 안에서만 지켜진다
      - **나눠 받기:** 같은 그룹은 파티션을 나눠 가지고, 다른 그룹은 모두 받는다. 파티션 수가 한계다
      - **중복과 유실:** 처리 뒤 커밋은 최소 한 번이라 이벤트 id로 걸러 멱등하게 만든다
    checklist:
      - 큐로 떼어 놓으면 얻는 것을 둘 이상 말했다
      - 결과를 바로 알 수 없다는 잃는 것을 말했다
      - 같은 키와 파티션으로 순서를 지킨다고 말했다
      - 컨슈머 그룹과 파티션의 관계를 말했다
      - 최소 한 번과 컨슈머의 멱등 처리를 말했다
    source: https://kafka.apache.org/documentation/#design
