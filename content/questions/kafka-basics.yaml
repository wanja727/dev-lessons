questions:
  - key: q-4d04a774
    concept: core
    type: descriptive
    status: draft
    difficulty: 1
    body: Kafka의 토픽, 파티션, 오프셋, 컨슈머 그룹을 설명해 보세요
    explanation: |-
      - 체크리스트 항목이 모범 답안의 요점이다
      - 검증: KafkaBasicsTest (consumerGroupSplitsPartitions)
    checklist:
      - "토픽: 메시지 종류별 이름표"
      - "파티션: 토픽을 나눈 칸, 끝에 덧붙이기만 하고 동시 처리 단위"
      - "오프셋: 파티션 안 메시지 번호, 그룹마다 읽은 위치를 커밋"
      - "컨슈머 그룹: 파티션을 나눠 가짐, 파티션 하나는 그룹 안 한 컨슈머"
      - 다른 그룹은 같은 메시지를 따로 받는다
    source: https://kafka.apache.org/documentation/#intro_concepts_and_terms
  - key: q-e197549f
    concept: core
    type: descriptive
    status: draft
    difficulty: 2
    body: 오프셋을 처리 전에 커밋할 때와 처리 후에 커밋할 때를 비교해 보세요
    explanation: |-
      - 체크리스트 항목이 모범 답안의 요점이다
      - 검증: KafkaBasicsTest (processThenCrashBeforeCommitRedelivers, commitThenCrashLosesMessage)
    checklist:
      - "처리 → 커밋: 사이에 죽으면 중복(최소 한 번)"
      - "커밋 → 처리: 사이에 죽으면 유실(최대 한 번)"
      - 잃으면 안 되는 메시지는 처리 후 커밋이라고 말했다
      - 중복은 event_id로 거르는 멱등 컨슈머로 막는다고 말했다
      - 자동 커밋(5초 간격)의 위험을 말했다
    source: https://kafka.apache.org/documentation/#semantics
  - key: q-e8ab2d90
    concept: core
    type: descriptive
    status: draft
    difficulty: 3
    body: 주문 이벤트의 "생성 → 결제 → 취소" 순서가 배송 서비스에서 뒤바뀌어 처리됐습니다. 원인과 해결을 말해 보세요
    explanation: |-
      - 체크리스트 항목이 모범 답안의 요점이다
      - 검증: KafkaBasicsTest (sameKeySamePartitionInOrder)
    checklist:
      - 순서는 파티션 안에서만 보장된다고 말했다
      - 키가 없거나 주문 번호가 아닌 키였을 가능성을 말했다
      - 주문 번호를 키로 주어 같은 파티션으로 보낸다고 말했다
      - 파티션 수를 늘리면 키 배정이 바뀌어 섞일 수 있다고 말했다
      - 컨슈머 안에서 여러 스레드로 나눠 처리하면 순서가 섞일 수 있다고 말했다
    source: https://kafka.apache.org/documentation/#intro_concepts_and_terms
  - key: q-4fc1b460
    concept: core
    type: ox
    status: draft
    difficulty: 1
    body: Kafka는 토픽 전체에서 메시지 순서를 보장한다
    answer: X
    explanation: |-
      - 파티션 안에서만. 같은 키는 같은 파티션
      - 검증: KafkaBasicsTest (sameKeySamePartitionInOrder)
    source: https://kafka.apache.org/documentation/#intro_concepts_and_terms
  - key: q-e943b625
    concept: core
    type: multiple_choice
    status: draft
    difficulty: 1
    body: 파티션 3개인 토픽을 같은 그룹의 컨슈머 4개가 읽으면?
    choices:
      - 4개 모두 나눠 읽는다
      - 1개는 배정이 없다
      - 4개가 같은 메시지를 받는다
    answer: "2"
    explanation: |-
      - 파티션 하나는 그룹 안에서 컨슈머 하나만 읽는다
      - 검증: KafkaBasicsTest (consumerGroupSplitsPartitions)
    source: https://kafka.apache.org/documentation/#intro_concepts_and_terms
  - key: q-81afdb29
    concept: core
    type: code_predict
    status: draft
    difficulty: 2
    body: 컨슈머가 메시지를 처리한 뒤 오프셋을 커밋하기 전에 죽었다. 재시작하면?
    choices:
      - 같은 메시지를 다시 받는다
      - 그 메시지는 사라진다
      - 다음 메시지부터 받는다
    answer: "1"
    explanation: |-
      - 커밋된 위치부터 다시 읽는다 (CI 실측: 같은 offset 0)
      - 검증: KafkaBasicsTest (processThenCrashBeforeCommitRedelivers)
    source: https://kafka.apache.org/documentation/#semantics
  - key: q-405064b8
    concept: core
    type: ox
    status: draft
    difficulty: 2
    body: 파티션 수는 운영 중에 늘리거나 줄일 수 있다
    answer: X
    explanation: "- 늘릴 수는 있지만 줄일 수 없다. 늘리면 키가 가는 파티션이 바뀌어 순서가 섞일 수 있다"
    source: https://kafka.apache.org/documentation/
