# 스레드 풀 문제
# 형식: https://github.com/wanja727/retrievo/blob/main/docs/content-format.md
#
# 모든 문제는 coreQuestions의 질문 하나에 묶이고(coreQuestion), 답의 근거가 레슨 본문에 있다
# (site/src/content/lesson-pages/thread-pool.yaml의 says).
# 동작에 관한 정답은 verification의 threadpool/ThreadPoolTest, ThreadPoolOutputTest로 확인했다 (자바 21).
# 질문마다 첫 문제는 본문의 예시로 묻고, 둘째 문제는 다른 상황으로 옮겨 묻는다.
# 2026-11-25에 핵심 질문 구조로 다시 썼다. 예전 문제는 지웠다.
subject:
  key: dev
  name: 개발자 면접
lesson:
  key: thread-pool
  title: 스레드 풀
  unit: 운영체제와 동시성
  order: 407
concepts:
  - key: core
    name: 스레드 풀
coreQuestions:
  - key: q1
    text: "스레드를 매번 만들지 않고 스레드 풀을 쓰는 이유는 무엇인가요?"
  - key: q2
    text: "작업이 몰리면 스레드 풀은 어떤 순서로 받나요?"
  - key: q3
    text: "Executors가 만들어 주는 풀에는 어떤 함정이 있나요?"
  - key: q4
    text: "스레드 풀은 어떻게 끝내고, 작업의 예외는 어디로 가나요?"
questions:
  # ── 질문 1 ──
  - key: tp-reuse
    concept: core
    coreQuestion: q1
    type: multiple_choice
    status: draft
    difficulty: 1
    body: 작업 20개를 Executors.newFixedThreadPool(2)에 넣고, 각 작업이 실행한 스레드의 이름을 모았어요. 이름은 몇 가지일까요?
    choices:
      - 20가지
      - 2가지 이하
      - 10가지
      - 1가지뿐
    answer: "2"
    explanation: |-
      **2가지 이하예요.** 풀은 스레드 2개를 만들어 두고 작업을 큐로 받아 다시 써요.

      - 작업마다 스레드를 만들지 않아 비용을 아끼고 스레드 수가 끝없이 늘지 않아요
      - 검증: ThreadPoolTest.reusesThreads
    source: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/concurrent/Executors.html
  - key: tp-callable
    concept: core
    coreQuestion: q1
    type: multiple_choice
    status: draft
    difficulty: 2
    body: 읽지 않은 메일 수를 다른 스레드에서 세고, 그 숫자를 받아 화면에 쓰고 싶어요. 무엇으로 넘기는 게 맞을까요?
    choices:
      - Runnable을 execute로
      - Callable을 submit으로, Future로 결과를 받는다
      - Runnable을 run()으로 직접 부른다
      - Thread를 새로 만들어 start()한다
    answer: "2"
    explanation: |-
      **Callable을 submit해요.** Callable은 값을 돌려주고, submit은 그 결과를 받을 Future를 줘요.

      - Runnable은 결과가 없어서 값을 돌려받을 수 없어요
    source: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/concurrent/ExecutorService.html
  # ── 질문 2 ──
  - key: tp-fifth-task
    concept: core
    coreQuestion: q2
    type: code_predict
    status: draft
    difficulty: 1
    body: 아래 풀에 끝나지 않는 작업을 하나씩 넣어요. 다섯째 작업을 넣은 직후 스레드 수와 큐의 길이는?
    code: |-
      var pool = new ThreadPoolExecutor(
          2, 4,                // core, max
          60, SECONDS,
          new ArrayBlockingQueue<>(2));
    choices:
      - 스레드 2개, 큐 3개
      - 스레드 3개, 큐 2개
      - 스레드 4개, 큐 1개
      - 스레드 5개, 큐 0개
    answer: "2"
    explanation: |-
      **스레드 3개, 큐 2개예요.** core 2개가 찬 뒤 셋째와 넷째는 큐로 가고, 큐가 가득 찬 뒤에야 다섯째를 위해 스레드를 늘려요.

      - 일곱째는 스레드도 큐도 가득이라 RejectedExecutionException이에요
      - 검증: ThreadPoolOutputTest.predictExample
    source: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/concurrent/ThreadPoolExecutor.html
  - key: tp-big-queue
    concept: core
    coreQuestion: q2
    type: multiple_choice
    status: draft
    difficulty: 2
    body: core 4, max 20, 큐 1000칸인 ThreadPoolExecutor에 오래 걸리는 작업 500개를 한꺼번에 넣었어요. 스레드는 몇 개까지 늘어날까요?
    choices:
      - 20개
      - 4개
      - 500개
      - 24개
    answer: "2"
    explanation: |-
      **4개예요.** 큐가 먼저라서, 큐 1000칸이 차기 전에는 스레드가 core에서 늘지 않아요.

      - 나머지 496개는 큐에서 기다려요
      - 바쁘면 max까지 먼저 는다고 생각하기 쉬운데 반대예요
    source: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/concurrent/ThreadPoolExecutor.html
  # ── 질문 3 ──
  - key: tp-fixed-queue
    concept: core
    coreQuestion: q3
    type: multiple_choice
    status: draft
    difficulty: 1
    body: Executors.newFixedThreadPool(2)에 끝나지 않는 작업 100개를 넣었어요. 스레드 수와 큐의 길이는?
    choices:
      - 스레드 100개, 큐 0개
      - 스레드 2개, 큐 98개
      - 스레드 2개, 98개는 거절
      - 스레드 4개, 큐 96개
    answer: "2"
    explanation: |-
      **스레드 2개, 큐 98개예요.** newFixedThreadPool의 큐는 크기 제한이 없는 LinkedBlockingQueue라 거절 없이 계속 쌓여요.

      - 쌓인 작업이 힙을 채우고, 늦어지는 것을 알기 어려워요
      - 검증: ThreadPoolTest.fixedPoolUnboundedQueue
    source: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/concurrent/Executors.html
  - key: tp-cached-slow-api
    concept: core
    coreQuestion: q3
    type: multiple_choice
    status: draft
    difficulty: 2
    body: 외부 API가 느려져 응답이 30초씩 걸리는데, 호출을 newCachedThreadPool() 하나에 맡기고 있어요. 초당 100건이 들어오면 무엇이 계속 늘어날까요?
    choices:
      - 큐의 길이
      - 스레드 수
      - 거절된 작업 수
      - 아무것도 늘지 않는다
    answer: "2"
    explanation: |-
      **스레드 수예요.** newCachedThreadPool은 max가 사실상 끝이 없고 큐가 한 칸도 담지 않아서, 쉬는 스레드가 없으면 작업마다 새 스레드를 만들어요.

      - 30초 동안 3000개 가까이 생길 수 있어요
      - 검증: ThreadPoolTest.cachedPoolGrowsPerTask (붙잡힌 작업 50개 → 스레드 50개)
    source: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/concurrent/Executors.html
  # ── 질문 4 ──
  - key: tp-shutdown
    concept: core
    coreQuestion: q4
    type: multiple_choice
    status: draft
    difficulty: 1
    body: 오래 걸리는 작업 3개가 실행과 큐에 있을 때 pool.shutdown()을 불렀어요. 그 뒤 넣은 넷째 작업과 이미 받은 3개는 각각 어떻게 될까요?
    choices:
      - 넷째는 거절, 받은 3개는 끝까지 실행
      - 넷째도 실행, 받은 3개도 실행
      - 넷째는 거절, 받은 3개는 바로 멈춤
      - 넷째는 큐에서 기다렸다 실행
    answer: "1"
    explanation: |-
      **넷째는 거절되고 받은 3개는 끝까지 실행돼요.** shutdown은 새 작업만 막아요.

      - 실행 중인 것을 인터럽트하고 큐의 것을 돌려받으려면 shutdownNow예요
      - 검증: ThreadPoolTest.shutdownFinishesAcceptedTasks
    source: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/concurrent/ExecutorService.html
  - key: tp-submit-hidden
    concept: core
    coreQuestion: q4
    type: ox
    status: draft
    difficulty: 2
    body: "\"pool.submit(() -> { throw new IllegalStateException(); })만 하고 get()을 부르지 않아도, 예외는 스레드의 예외 처리기를 거쳐 로그에 찍힌다\""
    answer: X
    explanation: |-
      **틀렸어요.** submit은 예외를 Future에 잡아 둬서, get()을 부르지 않으면 어디에도 찍히지 않아요.

      - execute로 넘긴 작업의 예외는 UncaughtExceptionHandler로 가서 찍혀요
      - 검증: ThreadPoolTest.executeVsSubmitExceptions
    source: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/concurrent/ExecutorService.html
  - key: tp-per-request
    concept: core
    coreQuestion: q4
    type: code_predict
    status: draft
    difficulty: 2
    body: 아래 컨트롤러 메서드를 요청마다 부르고, 요청이 1000번 들어왔어요. 서버의 스레드 수는 어떻게 될까요?
    code: |-
      @GetMapping("/report")
      String report() throws Exception {
        var pool = Executors
            .newFixedThreadPool(4);
        return pool.submit(this::build)
            .get();
      }
    choices:
      - 그대로다. 요청이 끝나면 풀도 사라진다
      - 계속 늘어난다. 끝내지 않은 풀의 스레드가 남는다
      - 4개로 고정된다
      - 첫 요청 뒤로는 풀을 다시 쓴다
    answer: "2"
    explanation: |-
      **계속 늘어나요.** 풀의 스레드는 데몬이 아니고 다음 작업을 기다리며 살아 있어요. shutdown하지 않은 풀이 요청마다 남아요.

      - 풀은 빈으로 하나 만들어 주입받아 써요
      - 검증: ThreadPoolTest.poolPerRequestLeaksThreads (요청 10번에 스레드 10개 넘게 늘어남)
    source: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/concurrent/ExecutorService.html
  # ── 네 질문을 하나로 ──
  - key: tp-interview
    concept: core
    coreQuestion: all
    type: descriptive
    status: draft
    difficulty: 2
    body: 면접에서 "스레드 풀이 작업을 받는 방식과 주의할 점을 설명해 주세요"라는 질문을 받았어요. 1분 안에 답해 보세요.
    explanation: |-
      **core만큼 스레드를 쓰고, 넘치면 큐, 큐가 차면 max까지, 그것도 차면 거절해요. 끝이 없는 큐와 스레드를 피해요.**

      - **이유:** 스레드를 만드는 비용과 끝없이 느는 것을 막고 다시 쓴다
      - **순서:** core → 큐 → max → 거절(AbortPolicy, CallerRunsPolicy 등). 큐가 먼저다
      - **함정:** newFixedThreadPool은 끝없는 큐, newCachedThreadPool은 끝없는 스레드. 크기를 정한 큐를 준다
      - **운영:** 빈으로 하나 두고 shutdown으로 끝낸다. submit의 예외는 get에서. 병렬 스트림은 공용 풀이다
    checklist:
      - 풀을 쓰는 이유(만드는 비용, 스레드 수 제한)를 말했다
      - core, 큐, max, 거절의 순서를 말했다
      - Executors 팩토리의 끝없는 큐나 스레드의 위험을 말했다
      - 거절 정책이나 종료 방법을 말했다
      - submit의 예외가 Future에 숨는 것이나 공용 풀 이야기를 했다
    source: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/concurrent/ThreadPoolExecutor.html
