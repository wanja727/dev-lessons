# HTTP 요청과 응답 문제
# 형식: https://github.com/wanja727/retrievo/blob/main/docs/content-format.md
#
# 모든 문제는 coreQuestions의 질문 하나에 묶이고(coreQuestion), 답의 근거가 레슨 본문에 있다
# (site/src/content/lesson-pages/http-basics.yaml의 says).
# 동작에 관한 정답은 verification의 HttpBasicsTest로 확인했다 (톰캣 10.1, 스프링 부트 3.5, 자바 21).
# 질문마다 첫 문제는 본문의 예시로 묻고, 둘째 문제는 다른 상황으로 옮겨 묻는다.
# 2026-11-25에 만들고 같은 날 검수해 reviewed로 바꿨다. 정답을 본문(says)과 테스트 결과에 맞춰 봤고, 문제 하나만 보고 풀리는지 봤다. 고친 문제는 없다.
subject:
  key: dev
  name: 개발자 면접
lesson:
  key: http-basics
  title: HTTP 요청과 응답
  unit: 네트워크와 웹
  order: 58
concepts:
  - key: core
    name: HTTP 요청과 응답
coreQuestions:
  - key: q1
    text: "HTTP 요청과 응답은 어떻게 생겼나요?"
  - key: q2
    text: "메서드와 상태 코드는 무엇을 알려 주나요?"
  - key: q3
    text: "헤더는 무슨 일을 하나요?"
  - key: q4
    text: "연결 하나로 요청을 여러 번 보낼 수 있나요?"
questions:
  # ── 질문 1 ──
  - key: hb-blank-line
    concept: core
    coreQuestion: q1
    type: line_pick
    status: reviewed
    difficulty: 1
    body: "아래 HTTP 요청 글에서 헤더가 끝났다는 것을 서버에 알리는 줄은 몇 번째 줄일까요?"
    code: |-
      POST /products HTTP/1.1
      Host: localhost
      Content-Type: application/json
      Content-Length: 30

      {"name":"커피","price":4500}
    answer: "5"
    explanation: |-
      **5번째 줄, 빈 줄이에요.** 빈 줄 하나가 헤더의 끝이고 그 뒤가 본문이에요.

      - 첫 줄은 메서드, 대상, 버전이에요
      - 2~4번째 줄이 헤더이고, 6번째 줄이 본문이에요
    source: https://www.rfc-editor.org/rfc/rfc9112.html#section-2.1
  - key: hb-host-virtual
    concept: core
    coreQuestion: q1
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: "IP 주소가 하나인 서버에 `shop.example.com`과 `admin.example.com` 두 사이트가 함께 떠 있어요. 두 사이트로 가는 요청은 같은 IP의 같은 443번 포트로 와요. 서버는 요청이 어느 사이트로 온 것인지 무엇으로 구별할까요?"
    choices:
      - 요청 첫 줄의 경로
      - Host 헤더
      - 클라이언트의 IP 주소
      - Content-Type 헤더
    answer: "2"
    explanation: |-
      **Host 헤더예요.** IP와 포트가 같으니 연결만으로는 구별할 수 없고, 요청 글의 Host를 봐요.

      - 그래서 HTTP/1.1은 Host를 꼭 적게 했어요
      - 톰캣은 Host가 없는 HTTP/1.1 요청에 400으로 답해요
    source: https://www.rfc-editor.org/rfc/rfc9110.html#section-7.2
  # ── 질문 2 ──
  - key: hb-405-allow
    concept: core
    coreQuestion: q2
    type: multiple_choice
    status: reviewed
    difficulty: 1
    body: "스프링 서버의 `/products/1`은 `@GetMapping`만 있어요. 이 주소에 DELETE 요청을 보내면 어떤 응답이 올까요? (스프링 부트 3.5)"
    choices:
      - 404, 그런 주소가 없음
      - 405와 쓸 수 있는 메서드를 알려 주는 Allow 헤더
      - 200, GET으로 처리함
      - 500, 서버 오류
    answer: "2"
    explanation: |-
      **405와 Allow 헤더예요.** 경로는 있지만 그 메서드를 받지 않을 때의 상태 코드예요.

      - 테스트에서 Allow: GET이 함께 왔어요
      - 404는 경로 자체가 없을 때예요
    source: https://www.rfc-editor.org/rfc/rfc9110.html#section-15.5.6
  - key: hb-retry-5xx
    concept: core
    coreQuestion: q2
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: "앱이 주문 API를 불렀는데 응답이 둘 중 하나였어요. A는 400, B는 503이에요. 요청을 바꾸지 않고 잠시 뒤 그대로 다시 보내 볼 만한 것은 무엇일까요?"
    choices:
      - A만
      - B만
      - 둘 다
      - 둘 다 아니다
    answer: "2"
    explanation: |-
      **B(503)만이에요.** 5xx는 서버 쪽 사정이라 잠시 뒤에 성공할 수 있어요.

      - 4xx는 요청이 잘못된 것이라 같은 요청을 다시 보내도 또 실패해요. 요청을 고쳐야 해요
      - 503은 지금 처리할 수 없다는 뜻이에요
    source: https://www.rfc-editor.org/rfc/rfc9110.html#section-15
  # ── 질문 3 ──
  - key: hb-406
    concept: core
    coreQuestion: q3
    type: multiple_choice
    status: reviewed
    difficulty: 1
    body: "스프링 서버의 `/products/1`은 JSON만 만들 수 있어요. 클라이언트가 `Accept: application/xml`만 적어 GET을 보내면 어떤 상태 코드가 올까요?"
    choices:
      - "200"
      - "400"
      - "406"
      - "415"
    answer: "3"
    explanation: |-
      **406이에요.** Accept에 맞는 종류로 응답을 만들 수 없을 때예요.

      - 415는 반대로 요청 본문의 Content-Type을 서버가 읽지 못할 때예요
      - 클라이언트와 서버가 Accept로 종류를 맞추는 것을 내용 협상이라고 해요
    source: https://www.rfc-editor.org/rfc/rfc9110.html#section-15.5.7
  - key: hb-chunked-end
    concept: core
    coreQuestion: q3
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: "응답 헤더에 Content-Length가 없고 `Transfer-Encoding: chunked`가 있어요. 연결은 닫히지 않아요. 클라이언트는 이 응답의 본문이 끝난 것을 어떻게 알까요?"
    choices:
      - 빈 줄이 나오면 끝이다
      - 길이가 0인 조각이 오면 끝이다
      - 서버가 연결을 닫으면 끝이다
      - 일정 시간 바이트가 오지 않으면 끝이다
    answer: "2"
    explanation: |-
      **길이가 0인 조각이 끝이에요.** chunked는 조각마다 앞에 길이를 붙이고, 0으로 끝을 알려요.

      - 길이를 미리 모를 때 써요. 테스트에서 StreamingResponseBody의 응답이 이렇게 왔어요
      - 빈 줄은 헤더의 끝이에요
    source: https://www.rfc-editor.org/rfc/rfc9112.html#section-7.1
  - key: hb-missing-content-type
    concept: core
    coreQuestion: q3
    type: code_predict
    status: reviewed
    difficulty: 2
    body: "아래 컨트롤러에 클라이언트가 JSON 본문 `{\"name\":\"커피\",\"price\":4500}`을 보내면서 Content-Type 헤더를 빠뜨렸어요. 응답의 상태 코드는 무엇일까요? (스프링 부트 3.5)"
    code: |-
      @PostMapping("/products")
      ResponseEntity<Product> create(
          @RequestBody NewProduct body) {
        return ResponseEntity
            .status(HttpStatus.CREATED)
            .body(products.save(body));
      }
    choices:
      - "201"
      - "400"
      - "406"
      - "415"
    answer: "4"
    explanation: |-
      **415예요.** 스프링은 Content-Type을 보고 본문을 읽을 변환기를 고르는데, 없으니 JSON으로 읽지 않아요.

      - 본문이 올바른 JSON이어도 마찬가지예요. 메시지는 Content-Type 'null' is not supported예요
      - 서버 코드가 아니라 요청에 Content-Type: application/json을 넣어 고쳐요
    source: https://docs.spring.io/spring-framework/reference/web/webmvc/mvc-controller/ann-requestmapping.html
  # ── 질문 4 ──
  - key: hb-keep-alive
    concept: core
    coreQuestion: q4
    type: ox
    status: reviewed
    difficulty: 1
    body: "\"HTTP/1.1 서버는 Connection: close가 없는 요청에 응답한 뒤 바로 TCP 연결을 닫는다\""
    answer: X
    explanation: |-
      **아니에요.** HTTP/1.1은 응답 뒤에도 연결을 열어 두고 다음 요청을 기다리는 것이 기본이에요.

      - 테스트에서 소켓 하나로 요청 둘을 보내 응답 둘을 받았어요
      - 쉬는 시간이 길면 서버가 닫아요. 톰캣의 기본은 20초예요
    source: https://www.rfc-editor.org/rfc/rfc9112.html#section-9.3
  - key: hb-length-needed
    concept: core
    coreQuestion: q4
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: "HTTP/1.0은 응답이 끝나면 연결을 닫아서 본문의 길이를 몰라도 됐어요. HTTP/1.1에서는 본문의 길이(Content-Length나 chunked)가 꼭 있어야 하는 이유로 가장 알맞은 것은 무엇일까요?"
    choices:
      - 연결이 닫히지 않아서, 길이로 본문의 끝을 알아야 다음 응답을 읽기 때문에
      - 길이가 없으면 TCP가 데이터를 보내지 않기 때문에
      - 서버가 길이로 Host를 확인하기 때문에
      - 길이가 본문의 암호화에 쓰이기 때문에
    answer: "1"
    explanation: |-
      **연결이 닫히지 않기 때문이에요.** 연결이 끝을 알려 주지 않으니 길이로 응답의 끝을 알아요.

      - TCP는 바이트의 흐름이라 메시지의 끝을 알려 주지 않아요
      - 길이만큼 읽은 다음 바이트가 다음 응답의 시작이에요
    source: https://www.rfc-editor.org/rfc/rfc9112.html#section-6
  # ── 전체 ──
  - key: hb-interview
    concept: core
    coreQuestion: all
    type: descriptive
    status: reviewed
    difficulty: 2
    body: 면접에서 "HTTP 요청과 응답의 구조와, 상태 코드를 어떻게 읽는지 설명해 주세요"라는 질문을 받았어요. 1분 안에 답해 보세요.
    explanation: |-
      **요청과 응답은 첫 줄, 헤더, 빈 줄, 본문으로 된 글이고, 상태 코드의 첫 자리가 결과의 묶음이에요.**

      - **모양:** 요청 첫 줄은 메서드, 대상, 버전. 응답 첫 줄은 버전, 상태 코드. HTTP/1.1은 Host가 꼭 있어야 한다
      - **메서드와 상태 코드:** GET, POST, PUT, DELETE. 2xx 성공, 3xx 다른 곳으로, 4xx 요청 쪽 잘못, 5xx 서버 쪽 잘못
      - **헤더:** Content-Type으로 본문의 종류, Content-Length나 chunked로 끝, Accept로 받고 싶은 종류
      - **연결:** HTTP/1.1은 연결을 다시 쓰는 것이 기본이라 길이로 응답의 끝을 안다
    checklist:
      - 요청과 응답이 첫 줄, 헤더, 빈 줄, 본문으로 되어 있다고 말했다
      - 메서드가 무엇을 할지, 상태 코드가 결과를 알려 준다고 말했다
      - 상태 코드의 묶음(2xx, 4xx, 5xx)과 4xx와 5xx의 차이를 말했다
      - Content-Type, Content-Length, Accept 같은 헤더의 일을 말했다
      - HTTP/1.1이 연결을 다시 쓴다는 것을 말했다
    source: https://www.rfc-editor.org/rfc/rfc9110.html
