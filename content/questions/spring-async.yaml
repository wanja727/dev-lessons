# @Async 문제
# 형식: https://github.com/wanja727/retrievo/blob/main/docs/content-format.md
#
# 모든 문제는 coreQuestions의 질문 하나에 묶이고(coreQuestion), 답의 근거가 레슨 본문에 있다
# (site/src/content/lesson-pages/spring-async.yaml의 says).
# 동작에 관한 정답은 verification의 SpringAsyncTest로 확인했다 (스프링 부트 3.5).
# 질문마다 첫 문제는 본문의 예시로 묻고, 둘째 문제는 다른 상황으로 옮겨 묻는다.
subject:
  key: dev
  name: 개발자 면접
lesson:
  key: spring-async
  title: "@Async"
  unit: 스프링
  order: 714
concepts:
  - key: core
    name: "@Async"
coreQuestions:
  - key: q1
    text: "@Async를 붙이면 메서드는 어디서 도나요?"
  - key: q2
    text: "@Async는 어떤 스레드 풀을 쓰고, 무엇을 조심하나요?"
  - key: q3
    text: "@Async 메서드에서 난 예외는 어디로 가나요?"
  - key: q4
    text: "@Async 메서드에는 트랜잭션과 로그인 정보가 따라가나요?"
questions:
  # ── 질문 1 ──
  - key: async-self
    concept: core
    coreQuestion: q1
    type: code_predict
    status: reviewed
    difficulty: 1
    body: '@EnableAsync가 켜진 앱에서 컨트롤러가 sendAll을 불렀어요. send는 어느 스레드에서 돌까요?'
    code: |-
      @Component
      class ReceiptMailer {
        public void sendAll(List<Receipt> rs) {
          for (Receipt r : rs) {
            this.send(r);
          }
        }

        @Async
        public void send(Receipt r) { ... }
      }
    choices:
      - task-N 스레드에서 따로 돈다
      - sendAll을 부른 요청 스레드에서 그대로 돈다
      - 영수증마다 새 스레드가 만들어진다
      - 컴파일 오류가 난다
    answer: "2"
    explanation: |-
      **부른 스레드에서 그대로 돌아요.** this.send는 같은 클래스 안의 호출이라 @Async 프록시를 거치지 않아요.

      - send를 다른 빈으로 옮겨 그 빈을 받아 부르면 task 스레드에서 돌아요
    source: https://docs.spring.io/spring-framework/reference/integration/scheduling.html
  - key: async-no-wait
    concept: core
    coreQuestion: q1
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: '컨트롤러가 다른 빈의 @Async 메서드(3초 걸림)를 부른 뒤 바로 응답을 돌려줘요. 응답은 몇 초 뒤에 나갈까요?'
    choices:
      - 3초를 기다린 뒤
      - 거의 바로. 메서드는 다른 스레드에서 따로 돈다
      - 1.5초 뒤
      - 메서드가 실패할 때만 바로
    answer: "2"
    explanation: |-
      **거의 바로 나가요.** 프록시가 메서드를 스레드 풀에 맡기고 바로 돌아와서, 컨트롤러는 3초를 기다리지 않아요.
    source: https://docs.spring.io/spring-framework/reference/integration/scheduling.html
  # ── 질문 2 ──
  - key: async-default-pool
    concept: core
    coreQuestion: q2
    type: multiple_choice
    status: reviewed
    difficulty: 1
    body: 스프링 부트 3.5 기본 설정(spring.task.execution.* 설정 없음)에서 오래 걸리는 @Async 작업 1,000개를 한꺼번에 넣었어요. 실행기의 스레드는 몇 개까지 생길까요?
    choices:
      - 8개. 나머지는 큐에서 기다린다
      - 1,000개
      - 200개
      - 스레드 대신 작업이 거절된다
    answer: "1"
    explanation: |-
      **8개예요.** 기본 실행기는 코어 8에 큐가 무제한이라, 코어가 다 차면 나머지는 모두 큐에 들어가고 최대 수까지 늘어날 일이 없어요.

      - 몰리면 작업이 메모리에 끝없이 쌓여요
    source: https://docs.spring.io/spring-boot/reference/features/task-execution-and-scheduling.html
  - key: async-bounded
    concept: core
    coreQuestion: q2
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: 'spring.task.execution.pool의 core-size: 2, max-size: 4, queue-capacity: 10으로 바꾸고, 끝나지 않는 @Async 작업 20개를 차례로 넣었어요. 몇 개를 받고, 나머지는 어떻게 될까요?'
    choices:
      - 20개 모두 받는다
      - 12개를 받고 8개는 기다린다
      - 14개를 받고 6개는 부른 쪽에서 TaskRejectedException
      - 4개를 받고 16개는 버려진다
    answer: "3"
    explanation: |-
      **14개를 받고 6개는 거절돼요.** 코어 2개가 차면 큐 10개에 넣고, 큐가 차면 최대 4개까지 스레드를 늘려요. 4 + 10 = 14개를 넘으면 부른 쪽에서 TaskRejectedException이 나요.
    source: https://docs.spring.io/spring-boot/reference/features/task-execution-and-scheduling.html
  # ── 질문 3 ──
  - key: async-void-exception
    concept: core
    coreQuestion: q3
    type: multiple_choice
    status: reviewed
    difficulty: 1
    body: 반환 타입이 void인 @Async 메서드가 런타임 예외를 던졌어요. 핸들러는 따로 바꾸지 않았어요. 그 메서드를 부른 컨트롤러는 어떻게 될까요?
    choices:
      - 예외를 받는다
      - 예외를 받지 않는다. 예외는 AsyncUncaughtExceptionHandler(기본은 로그)로 간다
      - 컨트롤러도 멈춘다
      - 자동으로 다시 시도된다
    answer: "2"
    explanation: |-
      **예외를 받지 않아요.** 부른 쪽은 이미 돌아갔고, void 메서드의 예외는 AsyncUncaughtExceptionHandler로 가요. 기본은 로그만 남겨요.

      - AsyncConfigurer로 핸들러를 바꿔 실패를 기록할 수 있어요
    source: https://docs.spring.io/spring-framework/reference/integration/scheduling.html
  - key: async-future-join
    concept: core
    coreQuestion: q3
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: 'CompletableFuture<Void>를 돌려주는 @Async 메서드가 IllegalStateException으로 실패했어요. 부른 쪽이 돌려받은 future에 .join()을 부르면 어떻게 될까요?'
    choices:
      - null을 돌려받는다
      - CompletionException이 나고 원인은 IllegalStateException이다
      - 예외 없이 끝난다
      - 영원히 기다린다
    answer: "2"
    explanation: |-
      **CompletionException이 나요.** CompletableFuture를 돌려주면 예외가 결과에 담겨서, 부른 쪽이 join()에서 원래 예외를 원인으로 가진 CompletionException을 받아요.
    source: https://docs.spring.io/spring-framework/reference/integration/scheduling.html
  # ── 질문 4 ──
  - key: async-security
    concept: core
    coreQuestion: q4
    type: multiple_choice
    status: reviewed
    difficulty: 1
    body: 로그인한 kim의 요청에서 @Async 메서드를 불렀어요. 기본 설정에서 그 메서드 안의 SecurityContextHolder.getContext().getAuthentication()은 무엇일까요?
    choices:
      - kim의 Authentication
      - "null"
      - 마지막으로 로그인한 사용자
      - 예외가 난다
    answer: "2"
    explanation: |-
      **null이에요.** SecurityContextHolder는 기본으로 스레드에 묶인 저장소라 task 스레드로 따라가지 않아요.

      - 필요한 값(사용자 id)은 인자로 넘겨요
    source: https://docs.spring.io/spring-framework/reference/integration/scheduling.html
  - key: async-uncommitted
    concept: core
    coreQuestion: q4
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: '@Transactional 주문 서비스가 주문을 저장한 뒤, 커밋하기 전에 @Async 메일 메서드(@Transactional)에 주문 id를 넘겨요. 메일 메서드가 그 주문을 조회하면 늘 찾을 수 있을까요?'
    choices:
      - 찾는다. 같은 트랜잭션이다
      - 늘 찾는다고 할 수 없다. 다른 스레드의 새 트랜잭션이라 커밋 전의 주문이 보이지 않을 수 있다
      - 예외가 난다
      - 주문 서비스의 트랜잭션이 끝날 때까지 기다렸다 찾는다
    answer: "2"
    explanation: |-
      **늘 찾지는 못해요.** @Async 메서드는 다른 스레드에서 새 트랜잭션을 열어요. 주문 서비스가 아직 커밋하지 않았으면 그 주문은 보이지 않아요.

      - 커밋된 뒤에 돌리려면 @TransactionalEventListener에 @Async를 함께 붙여요
    source: https://docs.spring.io/spring-framework/reference/data-access/transaction/event.html
  - key: async-executor-name
    concept: core
    coreQuestion: q2
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: 메일 발송이 몰릴 때 다른 @Async 작업까지 밀리지 않게 하려고 해요. 가장 알맞은 방법은 무엇일까요?
    choices:
      - 기본 실행기의 코어 수를 크게 늘린다
      - 큐 크기와 스레드 이름 접두사를 정한 메일 전용 ThreadPoolTaskExecutor 빈을 만들고 @Async("mailExecutor")로 고른다
      - '@Async를 지우고 요청 스레드에서 보낸다'
      - 메일마다 new Thread()를 만든다
    answer: "2"
    explanation: |-
      **메일 전용 실행기를 만들어요.** 용도별로 실행기를 나누면 한 일이 몰려도 다른 일의 스레드를 빼앗지 않고, 큐 크기로 메모리도 지켜요.
    source: https://docs.spring.io/spring-framework/reference/integration/scheduling.html
  # ── 전체 ──
  - key: async-interview
    concept: core
    coreQuestion: all
    type: descriptive
    status: reviewed
    difficulty: 2
    body: 면접에서 "@Async는 어떻게 동작하고, 무엇을 조심해야 하나요?"라는 질문을 받았어요. 1분 안에 답해 보세요.
    explanation: |-
      **프록시가 메서드를 스레드 풀에 맡기고, 풀 설정과 예외와 스레드에 묶인 값을 조심해요.**

      - **동작:** @EnableAsync의 AOP 프록시가 호출을 실행기에 맡기고 바로 돌아온다. 내부 호출과 private에는 걸리지 않는다
      - **풀:** 스프링 부트의 applicationTaskExecutor는 코어 8, 큐 무제한. 큐 크기를 정하거나 용도별 실행기를 둔다
      - **예외:** void면 핸들러(기본 로그)로, CompletableFuture면 부른 쪽이 받는다
      - **컨텍스트:** 트랜잭션과 SecurityContextHolder가 따라가지 않는다
    checklist:
      - 프록시가 메서드를 스레드 풀에 맡기고 바로 돌아온다고 말했다
      - 기본 실행기의 큐가 무제한이라 몰리면 쌓인다고 말했다
      - void 메서드의 예외를 부른 쪽이 모른다고 말했다
      - 트랜잭션이나 로그인 정보가 따라가지 않거나 내부 호출에 걸리지 않는다고 말했다
    source: https://docs.spring.io/spring-framework/reference/integration/scheduling.html
