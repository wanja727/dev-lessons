# 대량 DML 안전하게 하기 문제
# 형식: https://github.com/wanja727/retrievo/blob/main/docs/content-format.md
#
# 2026-11-25에 레슨을 핵심 질문 구조로 다시 쓰며 문제도 새로 만들었다. 예전 문제는 지웠다.
# 모든 문제는 coreQuestions의 질문 하나에 묶이고(coreQuestion), 답의 근거가 레슨 본문에 있다
# (site/src/content/lesson-pages/bulk-dml.yaml의 says).
# 동작에 관한 정답은 verification의 BulkDmlLessonTest, BulkDmlTest로 확인했다 (PostgreSQL 16).
# 질문마다 첫 문제는 본문의 예시로 묻고, 둘째 문제는 다른 상황으로 옮겨 묻는다.
subject:
  key: dev
  name: 개발자 면접
lesson:
  key: bulk-dml
  title: 대량 DML 안전하게 하기
  unit: DB
  order: 615
concepts:
  - key: core
    name: 대량 DML 안전하게 하기
coreQuestions:
  - key: q1
    text: "많은 행을 한 번에 고치면 무엇이 위험한가요?"
  - key: q2
    text: "나눠서 하면 무엇이 달라지고, 실패하면 어떻게 다시 하나요?"
  - key: q3
    text: "하기 전과 후에 무엇을 확인하나요?"
  - key: q4
    text: "잘못 고쳤으면 어떻게 되돌리나요?"
questions:
  # ── 질문 1 ──
  - key: bulk-one-tx-zero
    concept: core
    coreQuestion: q1
    type: multiple_choice
    status: draft
    difficulty: 1
    body: "주문 5,000건의 상태를 한 트랜잭션으로 바꾸다가, 마지막 문장에서 오류가 나 롤백했어요. 바뀐 채 남은 주문은 몇 건인가요?"
    choices:
      - "0건"
      - "4,999건"
      - "5,000건"
      - 오류가 난 한 건만 빼고 모두
    answer: "1"
    explanation: |-
      **0건이에요.** 한 트랜잭션이라 앞에서 바꾼 것까지 전부 롤백돼요.

      - 몇 분 걸린 작업이었다면 처음부터 다시 해야 해요
      - 나눠서 커밋하면 앞 묶음은 남아요
    source: https://www.postgresql.org/docs/16/sql-update.html
  - key: bulk-lock-wait
    concept: core
    coreQuestion: q1
    type: multiple_choice
    status: draft
    difficulty: 2
    body: "주문 50만 건의 상태를 한 UPDATE로 바꾸는 데 3분이 걸려요. 그 3분 동안, 그 가운데 주문 하나를 결제 취소하려는 요청은 어떻게 되나요?"
    choices:
      - 바로 성공한다
      - UPDATE가 커밋할 때까지 기다리거나, lock_timeout이 있으면 실패한다
      - 대량 UPDATE가 롤백된다
      - 결제 취소가 대량 UPDATE를 덮어쓴다
    answer: "2"
    explanation: |-
      **기다리거나 lock_timeout으로 실패해요.** 대량 UPDATE가 바꾼 행을 커밋까지 잠가요.

      - 테스트에서 lock_timeout 1초인 요청은 1초 뒤 55P03으로 실패했어요
      - 작업이 길수록 막히는 요청이 쌓여 장애처럼 보여요
    source: https://www.postgresql.org/docs/16/runtime-config-client.html
  # ── 질문 2 ──
  - key: bulk-batch-left
    concept: core
    coreQuestion: q2
    type: multiple_choice
    status: draft
    difficulty: 1
    body: "주문 10,000건 가운데 홀수 id 5,000건을 바꿔요. id 1,000개 범위씩 묶어(한 묶음에 대상 500건) 묶음마다 커밋하다 넷째 묶음에서 실패했어요. 바뀐 채 남은 건수는?"
    choices:
      - "0건"
      - "1,500건"
      - "2,000건"
      - "5,000건"
    answer: "2"
    explanation: |-
      **1,500건이에요.** 앞의 세 묶음은 이미 커밋됐고, 넷째 묶음만 롤백돼요.

      - 그래서 일부만 바뀐 상태가 생겨요
      - 대상 조건이 있으면 처음부터 다시 돌려도 안전해요
    source: https://www.postgresql.org/docs/16/sql-update.html
  - key: bulk-coupon-rerun
    concept: core
    coreQuestion: q2
    type: multiple_choice
    status: draft
    difficulty: 2
    body: "회원 3,000명에게 1000점씩 `update member_point set point = point + 1000 where member_id between ? and ?`로 1,000명씩 지급하다, 둘째 묶음 뒤 실패했어요. 같은 스크립트를 처음부터 다시 돌리면?"
    choices:
      - 모두 정확히 1000점씩 받는다
      - 이미 받은 2,000명이 두 번 받아 2000점이 된다
      - 두 번째 실행은 오류로 멈춘다
      - 아무도 더 받지 않는다
    answer: "2"
    explanation: |-
      **이미 받은 2,000명이 두 번 받아요.** 값을 더하는 작업은 다시 돌리면 또 더해져요.

      - 지급 표시(`paid`)를 함께 쓰고 `and not paid`로 거르면 한 번씩만 받아요
      - 여러 번 돌려도 결과가 같게(재실행 가능하게) 만들어요
    source: https://www.postgresql.org/docs/16/sql-update.html
  # ── 질문 3 ──
  - key: bulk-count-mismatch
    concept: core
    coreQuestion: q3
    type: multiple_choice
    status: draft
    difficulty: 1
    body: "미리 센 대상은 5,000건인데, UPDATE가 7,200건을 바꿨다고 나왔어요. 아직 커밋하지 않았어요. 할 일은?"
    choices:
      - 커밋한다. 더 많이 바뀌었을 뿐이다
      - 롤백하고 조건을 다시 본다
      - 2,200건을 골라 되돌린다
      - 다시 한 번 UPDATE를 돌린다
    answer: "2"
    explanation: |-
      **롤백하고 조건을 다시 봐요.** 건수가 다르면 조건이 생각과 다르다는 뜻이에요.

      - 커밋 전이면 롤백 한 번으로 끝나요
      - 그래서 하기 전에 대상 건수를 세 둬요
    source: https://www.postgresql.org/docs/16/sql-update.html
  - key: bulk-and-or
    concept: core
    coreQuestion: q3
    type: multiple_choice
    status: draft
    difficulty: 2
    body: "`update orders set status = 'EXPIRED' where status = 'PENDING' and created_at < '2026-03-01' or id < 100`을 실행하면 어떤 주문이 바뀌나요?"
    choices:
      - PENDING이면서, 3월 전이거나 id가 100 미만인 주문만
      - PENDING이고 3월 전인 주문, 그리고 상태와 상관없이 id가 100 미만인 모든 주문
      - id가 100 미만인 PENDING 주문만
      - 오류가 난다
    answer: "2"
    explanation: |-
      **and가 먼저 묶여서 id가 100 미만이면 PAID 주문까지 바뀌어요.**

      - `status = 'PENDING' and (created_at < ... or id < 100)`처럼 괄호를 써야 해요
      - 테스트에서 미리 센 1,007건보다 많은 1,056건이 바뀌어 커밋 전에 알아챘어요
    source: https://www.postgresql.org/docs/16/functions-logical.html
  # ── 질문 4 ──
  - key: bulk-restore
    concept: core
    coreQuestion: q4
    type: multiple_choice
    status: draft
    difficulty: 1
    body: "작업 전에 `create table orders_bak as select * from orders where status = 'PENDING'`으로 백업했어요. 커밋 뒤 잘못을 알았어요. 어떻게 되돌리나요?"
    choices:
      - "`rollback`을 실행한다"
      - 백업 테이블과 id로 조인해 원래 상태로 UPDATE한다
      - 백업 테이블의 이름을 orders로 바꾼다
      - 되돌릴 방법이 없다
    answer: "2"
    explanation: |-
      **백업 테이블과 id로 조인해 원래 값으로 UPDATE해요.**

      - 커밋한 변경은 rollback으로 되돌릴 수 없어요
      - 백업에는 대상 행만 있으니 이름을 바꾸면 나머지 주문이 사라져요
    source: https://www.postgresql.org/docs/16/sql-createtableas.html
  - key: bulk-no-backup
    concept: core
    coreQuestion: q4
    type: multiple_choice
    status: draft
    difficulty: 2
    body: "백업 테이블 없이 오래된 로그 30만 건을 DELETE하고 커밋했는데, 지우면 안 되는 로그가 섞여 있었어요. 할 수 있는 일은?"
    choices:
      - "`rollback`을 실행한다"
      - DB 전체의 백업이나 특정 시점 복구 같은 큰 수단밖에 없다
      - 같은 DELETE를 반대로 실행한다
      - VACUUM으로 되살린다
    answer: "2"
    explanation: |-
      **DB 단위의 복구밖에 없어요.** 지운 값이 어디에도 남아 있지 않아요.

      - 그래서 작업 전에 대상을 백업 테이블에 복사해 둬요
      - 지운 건수가 미리 센 건수와 같은지도 커밋 전에 봐요
    source: https://www.postgresql.org/docs/16/sql-createtableas.html
  - key: bulk-jpa-loop
    concept: core
    coreQuestion: q4
    type: multiple_choice
    status: draft
    difficulty: 2
    body: "`@Transactional` 메서드에서 `orderRepository.findByStatus(PENDING).forEach(Order::expire)`로 주문 5,000건을 바꿔요. 이 코드의 문제로 맞는 것은?"
    choices:
      - 문제없다. JPA가 알아서 한 번에 바꾼다
      - 5,000건을 메모리에 올리고 UPDATE를 5,000번 보내며, 한 트랜잭션이라 실패하면 전부 롤백된다
      - 첫 건만 바뀐다
      - 커밋하지 않아 아무것도 바뀌지 않는다
    answer: "2"
    explanation: |-
      **엔티티 5,000개를 읽고 하나씩 UPDATE해요.** 한 트랜잭션이라 질문 1의 위험도 그대로예요.

      - 벌크 UPDATE 쿼리(`@Modifying @Query`)로 묶음마다 바꾸고, 묶음마다 새 트랜잭션에서 불러요
    source: https://docs.spring.io/spring-data/jpa/reference/jpa/query-methods.html
  # ── 면접 질문 ──
  - key: bulk-interview
    concept: core
    coreQuestion: all
    type: descriptive
    status: draft
    difficulty: 3
    body: 면접에서 "운영 DB에서 수천 건 이상을 고쳐야 할 때 어떻게 하나요?"라는 질문을 받았어요. 1분 안에 답해 보세요.
    explanation: |-
      **세고, 백업하고, 나눠서 하고, 다시 세고, 되돌릴 길을 둬요.**

      - **위험:** 한 트랜잭션은 대상 행을 오래 잠그고, 끝에서 실패하면 전부 롤백
      - **나누기:** id 범위로 묶어 묶음마다 커밋. 대상 조건을 WHERE에 둬 다시 돌려도 안전하게
      - **확인:** 대상 건수, 백업 건수, 바뀐 건수, 끝난 뒤 0건. 다르면 커밋 전에 롤백
      - **되돌리기:** 백업 테이블과 id로 조인하는 원복 스크립트. 작업 세션에 lock_timeout
    checklist:
      - 한 트랜잭션으로 몰아서 하면 락과 전부 롤백의 위험이 있다고 말했다
      - 묶음마다 커밋한다고 말했다
      - 대상 조건으로 다시 돌려도 안전하게 만든다고 말했다
      - 전후 건수를 비교한다고 말했다
      - 백업 테이블과 원복 스크립트를 준비한다고 말했다
    source: https://www.postgresql.org/docs/16/sql-update.html
