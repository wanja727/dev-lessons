concepts:
  - key: core
    name: 대량 DML 안전하게 하기
questions:
  - key: q-736d4168
    concept: core
    type: descriptive
    status: reviewed
    difficulty: 2
    body: 운영 DB에서 대량 데이터를 수정해야 할 때의 절차를 1분 안에 설명해 보세요
    explanation: "- 사전 건수 기록 → 백업 테이블(건수 확인) → 원복 SQL 미리 작성·검토 → id 범위 분할 커밋(대상 조건 유지 → 재실행 안전) → 사후 검증(합계 = 사전 건수, 대상 조건 0건)"
    checklist:
      - 사전 건수 확인을 말했다
      - 백업 테이블을 말했다
      - 분할 커밋과 재실행 가능한 조건을 말했다
      - 사후 건수 비교를 말했다
      - 원복 SQL을 미리 준비한다고 말했다
    source: https://www.postgresql.org/docs/16/sql-update.html
  - key: q-923e3409
    concept: core
    type: descriptive
    status: reviewed
    difficulty: 2
    body: 대량 UPDATE를 한 트랜잭션으로 하는 것과 분할 커밋하는 것을 비교해 보세요
    explanation: |-
      - 한 트랜잭션: 전부 되거나 전부 안 됨. 대신 락이 길고 끝에서 실패하면 전부 롤백
      - 분할 커밋: 락이 짧고 실패해도 앞부분은 남음. 대신 중간 상태가 서비스에 보이고, 재실행 가능한 조건이 필요
      - 작업 성격(부분 상태 허용 여부)으로 선택
    checklist:
      - 한 트랜잭션의 락 문제를 말했다
      - 한 트랜잭션의 전부 롤백을 말했다
      - 분할의 중간 상태 노출을 말했다
      - 재실행 가능한 조건을 말했다
      - 작업 성격에 따른 선택을 말했다
    source: https://www.postgresql.org/docs/16/sql-update.html
  - key: q-bdfc24a4
    concept: core
    type: descriptive
    status: reviewed
    difficulty: 3
    body: 만료 처리 UPDATE를 실행했는데 예상(5천 건)보다 훨씬 많은 4만 건이 바뀌었다는 로그가 나왔다. 이미 커밋되었다. 어떻게 대응하고, 앞으로 어떻게 막을지 말해 보세요
    explanation: |-
      - 대응: 추가 변경 중단, 영향 범위 파악, 백업 테이블이 있으면 id 조인으로 원복. 없으면 DB 시점 복구나 로그로 복원 검토, 관련 부서 공유
      - 예방: 사전 건수를 세어 예상과 비교(여기서 멈추었을 것), 백업, 자동 커밋 끄기, 분할 실행 중 건수 확인, 두 사람 검토
    checklist:
      - 추가 작업을 멈추고 영향 범위를 파악한다고 말했다
      - 백업 테이블로 원복을 말했다
      - 백업이 없을 때의 복구 수단을 말했다
      - 사전 건수 비교로 막을 수 있었다고 말했다
      - 자동 커밋 끄기, 검토 같은 절차를 말했다
    source: https://www.postgresql.org/docs/16/sql-update.html
  - key: q-3b06fe58
    concept: core
    type: ox
    status: reviewed
    difficulty: 1
    body: "\"분할 UPDATE가 중간에 실패하면, 다시 돌리기 전에 반드시 앞서 바뀐 행을 원복해야 한다\""
    answer: X
    explanation: |-
      - 대상 조건(예: status = 'PENDING')을 WHERE에 두면 이미 바뀐 행은 걸리지 않아 처음부터 다시 돌려도 안전하다
      - 검증: BulkDmlTest (rerunIsSafe)
    source: https://www.postgresql.org/docs/16/sql-update.html
  - key: q-5fd2e932
    concept: core
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: 10,000건 중 대상 5,000건(홀수 id)을 id 1,000개 범위씩 분할 커밋하다 네 번째 묶음에서 장애가 났다. 바뀐 건수는?
    choices:
      - 0건
      - 1,500건
      - 3,000건
      - 2,000건
    answer: "2"
    explanation: |-
      - 앞의 세 묶음(id 1~3000)은 커밋됐고 그중 대상은 홀수 1,500건. 네 번째 묶음은 롤백
      - 검증: BulkDmlTest (splitCommitKeepsEarlierBatches)
    source: https://www.postgresql.org/docs/16/sql-update.html
  - key: q-7159db5a
    concept: core
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: 커밋하지 않은 대량 UPDATE가 진행 중일 때, 같은 행을 고치려는 서비스 요청(lock_timeout 300ms)은?
    choices:
      - 바로 반영된다
      - 대량 UPDATE에 덮어써져 사라진다
      - 기다리다 lock_timeout으로 실패한다 (SQLSTATE 55P03)
      - 대량 UPDATE가 롤백된다
    answer: "3"
    explanation: |-
      - 커밋 전 대량 UPDATE가 대상 행을 모두 잠가 두고 있어서 기다리다 실패한다. 그래서 분할 커밋과 트래픽 적은 시간
      - 검증: BulkDmlTest (longTransactionBlocksOthers)
    source: https://www.postgresql.org/docs/16/runtime-config-client.html
  - key: q-b293a913
    concept: core
    type: line_pick
    status: reviewed
    difficulty: 2
    body: "[코드 11-A] 분할 UPDATE 스크립트가 중간에 죽어 처음부터 다시 돌렸더니 이미 처리한 행의 만료일이 다시 밀렸다. 원인이 되는 줄은?"
    code: |-
      -- 대상: 2026-10-01 이전 가입한 회원의 쿠폰 만료일을 30일 연장
      UPDATE coupon
         SET expires_at = expires_at + interval '30 days'
       WHERE id BETWEEN :from AND :to
         AND member_joined_at < '2026-10-01';
      COMMIT;
    answer: "3"
    explanation: |-
      - 현재 값에 더하는 변경이라 다시 돌리면 또 더해진다. 대상 조건(5번)은 변경 후에도 그대로 참이라 걸러내지 못한다
      - 고치기: 목표 값을 직접 쓰거나(백업의 원래 값 + 30일), "아직 처리하지 않음"을 구분하는 조건(처리 표시 컬럼, 백업 테이블과의 비교)을 추가
      - 근거: 재실행 가능한 조건의 원리는 BulkDmlTest (rerunIsSafe). 이 코드 자체는 테스트하지 않음
    source: https://www.postgresql.org/docs/16/sql-update.html
