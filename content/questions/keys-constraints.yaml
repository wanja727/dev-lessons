# 키와 제약 조건 문제
# 형식: https://github.com/wanja727/retrievo/blob/main/docs/content-format.md
#
# 모든 문제는 coreQuestions의 질문 하나에 묶이고(coreQuestion), 답의 근거가 레슨 본문에 있다
# (site/src/content/lesson-pages/keys-constraints.yaml의 says).
# 동작에 관한 정답은 verification의 KeysConstraintsTest로 확인했다 (PostgreSQL 16).
# 질문마다 첫 문제는 본문의 예시로 묻고, 둘째 문제는 다른 상황으로 옮겨 묻는다.
subject:
  key: dev
  name: 개발자 면접
lesson:
  key: keys-constraints
  title: 키와 제약 조건
  unit: DB
  order: 601
concepts:
  - key: core
    name: 키와 제약 조건
coreQuestions:
  - key: q1
    text: "기본 키는 무엇이고, 왜 의미 없는 번호를 쓰나요?"
  - key: q2
    text: "외래 키는 무엇을 막나요?"
  - key: q3
    text: "NOT NULL, UNIQUE, CHECK는 각각 무엇을 지키나요?"
  - key: q4
    text: "앱에서 미리 확인하는데도 왜 DB 제약이 필요한가요?"
questions:
  # ── 질문 1 ──
  - key: kc-pk-duplicate
    concept: core
    coreQuestion: q1
    type: multiple_choice
    status: draft
    difficulty: 1
    body: "회원 테이블의 기본 키 `id`에 이미 1이 있어요. `id`가 1인 행을 하나 더 넣으면 어떻게 되나요? (PostgreSQL 16, 직접 id를 넣을 수 있는 `id int primary key` 열이에요)"
    choices:
      - 두 행이 모두 들어간다
      - 23505 오류로 실패한다
      - 기존 행이 새 값으로 바뀐다
      - id가 2로 바뀌어 들어간다
    answer: "2"
    explanation: |-
      **23505(중복 키) 오류로 실패해요.** 기본 키는 겹칠 수 없어요.

      - 기본 키는 UNIQUE와 NOT NULL을 합친 제약이에요
      - PostgreSQL은 기본 키에 인덱스를 만들어 겹치는지 바로 확인해요
    source: https://www.postgresql.org/docs/16/ddl-constraints.html
  - key: kc-natural-key
    concept: core
    coreQuestion: q1
    type: multiple_choice
    status: draft
    difficulty: 2
    body: "상품 테이블의 기본 키를 상품 코드(`SKU-001`)로 두었고, 주문 항목과 장바구니가 이 코드를 외래 키로 가리켜요. 상품 코드 체계가 바뀌어 모든 코드를 바꿔야 해요. 일련번호를 기본 키로 두고 상품 코드에 UNIQUE를 건 설계와 비교하면 무엇이 달라지나요?"
    choices:
      - 차이가 없다. 어느 쪽이든 상품 행만 고치면 된다
      - 상품 코드를 키로 쓴 쪽은 주문 항목과 장바구니의 외래 키 값까지 모두 고쳐야 한다
      - 일련번호를 키로 쓴 쪽이 주문 항목까지 고쳐야 한다
      - 기본 키는 바꿀 수 없으니 두 설계 모두 상품을 새로 만들어야 한다
    answer: "2"
    explanation: |-
      **자연 키를 기본 키로 쓰면 그 값을 가리키는 모든 외래 키가 함께 바뀌어야 해요.**

      - 일련번호(대리 키)는 뜻이 없어서 업무 규칙이 바뀌어도 그대로예요
      - 대리 키를 쓰면 상품 행의 상품 코드 열 하나만 고쳐요
      - 그래서 바뀔 수 있는 값은 기본 키 대신 UNIQUE를 건 열로 둬요
    source: https://www.postgresql.org/docs/16/ddl-constraints.html
  # ── 질문 2 ──
  - key: kc-fk-orphan
    concept: core
    coreQuestion: q2
    type: multiple_choice
    status: draft
    difficulty: 1
    body: "`orders.member_id`가 `references member(id)`인 외래 키예요. 회원 테이블에 id 999인 회원은 없어요. `insert into orders(member_id, amount) values (999, 10000)`을 실행하면 어떻게 되나요?"
    choices:
      - 들어가고, member_id가 NULL로 바뀐다
      - 들어가고, 회원 999가 저절로 만들어진다
      - 23503 오류로 실패한다
      - 들어가지만 조회할 때 오류가 난다
    answer: "3"
    explanation: |-
      **23503(외래 키 위반) 오류로 실패해요.** 외래 키는 없는 부모를 가리키는 행을 막아요.

      - 외래 키가 없는 테이블이었다면 그대로 들어가 주인 없는 주문이 생겨요
      - 오류는 넣는 순간 DB가 내요
    source: https://www.postgresql.org/docs/16/ddl-constraints.html#DDL-CONSTRAINTS-FK
  - key: kc-fk-cascade
    concept: core
    coreQuestion: q2
    type: multiple_choice
    status: draft
    difficulty: 1
    body: "댓글 테이블의 `post_id`가 `references post(id) on delete cascade`예요. 댓글 30개가 달린 글 하나를 지우면, 그 글의 댓글은 몇 개 남나요?"
    choices:
      - "30개"
      - "0개"
      - 글을 지울 수 없어서 30개
      - 댓글은 남고 post_id만 NULL이 된다
    answer: "2"
    explanation: |-
      **0개예요.** CASCADE는 부모를 지울 때 그 부모를 가리키는 자식도 함께 지워요.

      - 기본 규칙(NO ACTION)이었다면 글을 지우는 것이 23503 오류로 실패해요
      - post_id만 비우는 것은 `on delete set null`이에요
    source: https://www.postgresql.org/docs/16/ddl-constraints.html#DDL-CONSTRAINTS-FK
  - key: kc-fk-spring-delete
    concept: core
    coreQuestion: q2
    type: multiple_choice
    status: draft
    difficulty: 2
    body: "주문의 `member_id`가 삭제 규칙을 따로 적지 않은 외래 키로 회원을 가리켜요. 스프링 서비스가 `JdbcTemplate`으로 주문이 2건 있는 회원을 `delete from member where id = ?`로 지우면 어떻게 되나요?"
    choices:
      - 회원과 주문 2건이 모두 지워진다
      - 회원만 지워지고 주문의 member_id는 NULL이 된다
      - 지워지지 않고 DataIntegrityViolationException이 난다
      - 회원만 지워지고 주문은 그대로 남는다
    answer: "3"
    explanation: |-
      **지워지지 않고 `DataIntegrityViolationException`이 나요.** 기본 규칙(NO ACTION)은 자식이 있는 부모를 지우지 못하게 해요.

      - DB는 23503 오류를 내고, 스프링이 이것을 자기 예외로 바꿔 던져요
      - 함께 지우려면 `on delete cascade`, 끊으려면 `on delete set null`을 적어요
    source: https://docs.spring.io/spring-framework/reference/data-access/dao.html
  # ── 질문 3 ──
  - key: kc-unique-null
    concept: core
    coreQuestion: q3
    type: multiple_choice
    status: draft
    difficulty: 2
    body: "`create table coupon_owner (email text unique)`처럼 NOT NULL 없이 UNIQUE만 건 열이 있어요. 이메일 없이(NULL로) 세 번 넣으면 몇 행이 들어가나요? (PostgreSQL 16)"
    choices:
      - "1행. 둘째부터 23505로 실패한다"
      - "3행"
      - "0행. UNIQUE 열에는 NULL을 넣을 수 없다"
      - "2행"
    answer: "2"
    explanation: |-
      **3행 모두 들어가요.** SQL에서 NULL은 "모르는 값"이라 NULL끼리 같다고 보지 않아요.

      - 그래서 UNIQUE는 NULL끼리를 겹친다고 하지 않아요
      - 막으려면 `not null`을 함께 걸거나 `unique nulls not distinct`(PostgreSQL 15부터)를 써요
    source: https://www.postgresql.org/docs/16/ddl-constraints.html#DDL-CONSTRAINTS-UNIQUE-CONSTRAINTS
  - key: kc-composite-unique
    concept: core
    coreQuestion: q3
    type: multiple_choice
    status: draft
    difficulty: 1
    body: "좋아요 테이블에 `unique (member_id, post_id)`가 있어요. (1, 10), (1, 11), (2, 10), (1, 10)을 차례로 넣으면 몇 번째가 실패하나요?"
    choices:
      - 두 번째
      - 세 번째
      - 네 번째
      - 두 번째, 세 번째, 네 번째 모두
    answer: "3"
    explanation: |-
      **네 번째만 실패해요.** 복합 UNIQUE는 두 열의 조합이 겹치지 않게 해요.

      - (1, 11)은 회원이 같지만 글이 다르고, (2, 10)은 글이 같지만 회원이 달라요
      - 조합이 같은 것은 네 번째 (1, 10)뿐이에요
    source: https://www.postgresql.org/docs/16/ddl-constraints.html#DDL-CONSTRAINTS-UNIQUE-CONSTRAINTS
  # ── 질문 4 ──
  - key: kc-race-unique
    concept: core
    coreQuestion: q4
    type: multiple_choice
    status: draft
    difficulty: 2
    body: "회원 가입 코드가 \"같은 이메일이 있는지 세고, 0이면 넣기\"예요. `email`에 UNIQUE가 걸려 있어요. 같은 이메일로 두 요청이 동시에 와서, 둘 다 센 뒤에 넣었어요. 결과는?"
    choices:
      - 둘 다 0을 봤으니 회원이 2명 생긴다
      - 회원은 1명이고, 한 요청은 23505 오류로 실패한다
      - 두 요청 모두 23505 오류로 실패한다
      - 나중 요청이 먼저 요청의 행을 덮어쓴다
    answer: "2"
    explanation: |-
      **회원은 1명이고, 나중에 넣은 요청은 23505로 실패해요.** UNIQUE는 넣는 순간 DB가 검사해요.

      - 앱의 확인은 두 요청 모두 통과했어요. 세는 것과 넣는 것 사이에 틈이 있어서예요
      - UNIQUE가 없었다면 같은 이메일 회원이 2명 생겨요
    source: https://www.postgresql.org/docs/16/ddl-constraints.html#DDL-CONSTRAINTS-UNIQUE-CONSTRAINTS
  - key: kc-race-coupon
    concept: core
    coreQuestion: q4
    type: multiple_choice
    status: draft
    difficulty: 2
    body: "쿠폰 발급 코드가 \"이 회원이 이 쿠폰을 받았는지 조회하고, 없으면 발급 행을 넣기\"예요. 발급 테이블에는 제약이 없어요. 같은 회원의 요청 두 개가 동시에 오면 어떻게 될 수 있고, 무엇으로 막나요?"
    choices:
      - 앱이 확인하니 한 장만 발급된다. 더 막을 것은 없다
      - 두 장이 발급될 수 있다. 발급 테이블에 unique (member_id, coupon_id)를 건다
      - 두 장이 발급될 수 있다. 조회와 넣기를 한 트랜잭션으로 묶으면 기본 격리 수준에서 막힌다
      - 두 요청 모두 실패한다
    answer: "2"
    explanation: |-
      **두 장이 발급될 수 있고, 두 열의 복합 UNIQUE로 막아요.**

      - 두 요청 모두 아직 아무도 넣지 않은 때 조회하면 둘 다 "없음"을 봐요
      - 한 트랜잭션으로 묶어도 기본 격리 수준(READ COMMITTED)에서는 남이 아직 커밋하지 않은 INSERT가 보이지 않아요
      - UNIQUE는 넣는 순간 검사해서 하나만 남겨요
    source: https://www.postgresql.org/docs/16/transaction-iso.html
  - key: kc-spring-catch
    concept: core
    coreQuestion: q4
    type: multiple_choice
    status: draft
    difficulty: 2
    body: "회원 저장을 `try { repository.save(m); } catch (DataIntegrityViolationException e) { throw new EmailTakenException(); }`로 감쌌어요. 이름(NOT NULL 열)을 빠뜨린 버그가 생기면 사용자는 무엇을 보게 되나요?"
    choices:
      - NOT NULL 위반 오류가 그대로 드러난다
      - '"이미 가입한 이메일이에요"라는 엉뚱한 오류'
      - 이름 없이 저장된다
      - 저장이 조용히 무시된다
    answer: "2"
    explanation: |-
      **"이미 가입한 이메일"이라는 엉뚱한 오류를 봐요.** NOT NULL과 외래 키 위반도 `DataIntegrityViolationException`이에요.

      - 유니크 위반만 잡으려면 하위 클래스 `DuplicateKeyException`을 잡아요
      - 그러면 다른 위반은 그대로 올라가 버그로 드러나요
    source: https://docs.spring.io/spring-framework/reference/data-access/dao.html
  # ── 면접 질문 ──
  - key: kc-interview
    concept: core
    coreQuestion: all
    type: descriptive
    status: draft
    difficulty: 2
    body: 면접에서 "기본 키, 외래 키, 유니크 제약은 무엇이고, 앱에서 검사하는데 왜 DB 제약이 필요한가요?"라는 질문을 받았어요. 1분 안에 답해 보세요.
    explanation: |-
      **키와 제약은 잘못된 데이터를 DB가 막게 하는 규칙이고, 동시 요청은 앱의 검사를 통과하므로 마지막 방어는 DB 제약이에요.**

      - **기본 키:** 행 하나를 가리키는 값. NULL 없고 겹치지 않는다. 바뀔 수 있는 자연 키 대신 일련번호를 쓴다
      - **외래 키:** 없는 부모를 가리키는 행을 막는다. 부모를 지울 때 막거나 함께 지우거나 끊는다
      - **UNIQUE, NOT NULL, CHECK:** 겹치지 않게, 꼭 있게, 범위 안에 있게 지킨다
      - **동시 요청:** "확인하고 넣기"는 두 문장이라 둘 다 통과한다. 넣는 순간 검사하는 UNIQUE가 막는다
    checklist:
      - 기본 키는 NULL일 수 없고 겹칠 수 없는 값이라고 말했다
      - 바뀔 수 있는 값 대신 일련번호를 기본 키로 쓰는 이유를 말했다
      - 외래 키가 없는 부모를 가리키는 행을 막는다고 말했다
      - 동시에 오는 요청이 앱의 확인을 둘 다 통과할 수 있다고 말했다
      - UNIQUE 제약이 넣는 순간 검사해 중복을 끝까지 막는다고 말했다
    source: https://www.postgresql.org/docs/16/ddl-constraints.html
