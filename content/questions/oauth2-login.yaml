# OAuth 2.0과 소셜 로그인 문제
# 형식: https://github.com/wanja727/retrievo/blob/main/docs/content-format.md
#
# 모든 문제는 coreQuestions의 질문 하나에 묶이고(coreQuestion), 답의 근거가 레슨 본문에 있다
# (site/src/content/lesson-pages/oauth2-login.yaml의 says).
# 흐름의 규칙은 RFC 6749가 근거이고, verification의 OAuth2FlowTest가 그 규칙대로 만든 작은 인가 서버로 확인했다.
# 실제 카카오나 구글 서버로 확인한 것은 아니다. 스프링 시큐리티 설정은 공식 문서가 근거다.
# 질문마다 첫 문제는 본문의 예시로 묻고, 둘째 문제는 다른 상황으로 옮겨 묻는다.
subject:
  key: dev
  name: 개발자 면접
lesson:
  key: oauth2-login
  title: OAuth 2.0과 소셜 로그인
  unit: 네트워크와 웹
  order: 62
concepts:
  - key: core
    name: OAuth 2.0과 소셜 로그인
coreQuestions:
  - key: q1
    text: "OAuth 2.0은 비밀번호 없이 무엇을 어떻게 넘기나요?"
  - key: q2
    text: "인가 코드 흐름은 어떤 순서로 진행되나요?"
  - key: q3
    text: "왜 바로 토큰을 주지 않고 코드를 거치나요?"
  - key: q4
    text: "소셜 로그인은 OAuth와 무엇이 다른가요?"
questions:
  # ── 질문 1 ──
  - key: oa-client-role
    concept: core
    coreQuestion: q1
    type: multiple_choice
    status: draft
    difficulty: 1
    body: "쇼핑몰에 \"카카오로 로그인\"을 붙였어요. 사용자 kim, kim의 브라우저, 쇼핑몰 서버, 카카오 로그인 서버가 나와요. OAuth 2.0에서 \"클라이언트\" 역할은 누구일까요?"
    choices:
      - kim
      - kim의 브라우저
      - 쇼핑몰 서버
      - 카카오 로그인 서버
    answer: "3"
    explanation: |-
      **쇼핑몰 서버예요.** 클라이언트는 권한(액세스 토큰)을 받아 쓰려는 서비스예요.

      - kim은 자원 소유자, 카카오 로그인 서버는 인가 서버예요
      - 브라우저는 리다이렉트로 흐름을 이어 주는 통로일 뿐이에요
    source: https://www.rfc-editor.org/rfc/rfc6749.html#section-1.1
  - key: oa-scope
    concept: core
    coreQuestion: q1
    type: multiple_choice
    status: draft
    difficulty: 2
    body: "일정 관리 앱이 사용자의 구글 캘린더 일정을 읽기만 하려고 OAuth 2.0을 써요. 사용자는 동의 화면에서 \"캘린더 읽기\"만 허락했어요. 앱이 받은 것과 그것으로 할 수 있는 일로 맞는 것은 무엇일까요?"
    choices:
      - 사용자의 구글 비밀번호. 무엇이든 할 수 있다
      - 읽기 범위의 액세스 토큰. 일정을 지울 수는 없다
      - 읽기 범위의 액세스 토큰. 일정을 지울 수도 있다
      - client_secret. 사용자 대신 로그인할 수 있다
    answer: "2"
    explanation: |-
      **읽기 범위(scope)의 액세스 토큰이에요.** 토큰은 사용자가 동의한 범위만큼만 쓸 수 있어요.

      - 비밀번호는 앱에 넘어가지 않아요
      - client_secret은 앱이 등록할 때 받은 자기 비밀값이에요
    source: https://www.rfc-editor.org/rfc/rfc6749.html#section-3.3
  # ── 질문 2 ──
  - key: oa-callback-values
    concept: core
    coreQuestion: q2
    type: multiple_choice
    status: draft
    difficulty: 1
    body: "kim이 카카오에서 로그인하고 동의하자, 카카오 인가 서버가 kim의 브라우저를 쇼핑몰의 redirect_uri로 돌려보내요. 이때 주소에 붙는 것은 무엇일까요?"
    choices:
      - 액세스 토큰
      - 인가 코드와 state
      - client_secret
      - kim의 카카오 비밀번호
    answer: "2"
    explanation: |-
      **인가 코드와 state예요.** 브라우저를 거치는 주소에는 코드만 실어요.

      - 쇼핑몰은 state를 확인한 뒤 코드를 서버끼리 보내 토큰으로 바꿔요
      - 토큰과 client_secret은 브라우저를 거치지 않아요
    source: https://www.rfc-editor.org/rfc/rfc6749.html#section-4.1.2
  - key: oa-state-mismatch
    concept: core
    coreQuestion: q2
    type: multiple_choice
    status: draft
    difficulty: 2
    body: "쇼핑몰 서버가 흐름을 시작할 때 state=x7Kp2를 세션에 넣어 뒀어요. 그런데 콜백 주소로 돌아온 요청의 state는 attacker예요. 코드는 들어 있어요. 쇼핑몰 서버는 어떻게 해야 할까요?"
    choices:
      - 코드가 있으니 토큰으로 바꿔 로그인시킨다
      - 토큰을 요청하지 않고 흐름을 멈춘다
      - state를 세션 값으로 고쳐서 계속한다
      - 인가 서버에 state를 다시 물어본다
    answer: "2"
    explanation: |-
      **멈춰요.** state가 다르면 쇼핑몰이 시작한 흐름에서 돌아온 요청이 아니에요.

      - 공격자가 자기 코드를 kim의 브라우저로 보내 kim을 공격자 계정으로 로그인시키는 공격(CSRF)을 막아요
      - 테스트에서도 state가 다르면 쇼핑몰은 400으로 멈추고 토큰 요청을 보내지 않았어요
    source: https://www.rfc-editor.org/rfc/rfc6749.html#section-10.12
  # ── 질문 3 ──
  - key: oa-code-reuse
    concept: core
    coreQuestion: q3
    type: multiple_choice
    status: draft
    difficulty: 1
    body: "쇼핑몰 서버가 인가 코드로 액세스 토큰을 받았어요. 네트워크가 잠깐 끊겨 같은 코드로 토큰 요청을 한 번 더 보냈어요. RFC 6749를 따르는 인가 서버는 어떻게 답할까요?"
    choices:
      - 같은 토큰을 다시 준다
      - 새 토큰을 하나 더 준다
      - invalid_grant로 거절한다
      - invalid_client로 거절한다
    answer: "3"
    explanation: |-
      **invalid_grant로 거절해요.** 인가 코드는 한 번만 쓸 수 있어요.

      - RFC 6749는 코드가 두 번 쓰이면 그 코드로 준 토큰도 취소하는 것이 좋다고 적어요
      - invalid_client는 client_secret이 틀렸을 때예요
    source: https://www.rfc-editor.org/rfc/rfc6749.html#section-4.1.2
  - key: oa-stolen-code
    concept: core
    coreQuestion: q3
    type: multiple_choice
    status: draft
    difficulty: 2
    body: "누군가 kim의 브라우저 방문 기록에서 아직 쓰이지 않은 인가 코드를 훔쳤어요. 쇼핑몰의 client_secret은 모르고, 코드가 만들어진 지 1분밖에 안 됐어요. 이 사람이 코드로 액세스 토큰을 받을 수 있을까요? (쇼핑몰은 client_secret을 가진 서버 앱이에요)"
    choices:
      - 받을 수 있다. 코드가 아직 살아 있다
      - 받을 수 없다. 토큰 요청에 client_secret이 필요하다
      - 받을 수 있다. 코드에 토큰이 들어 있다
      - 받을 수 없다. 코드는 1분 안에 만료된다
    answer: "2"
    explanation: |-
      **받을 수 없어요.** 코드를 토큰으로 바꾸려면 쇼핑몰 서버만 아는 client_secret이 필요해요.

      - 코드가 브라우저에 드러나도 괜찮게 만든 장치예요
      - 코드의 수명은 RFC가 최대 10분을 권해요. 1분이면 아직 살아 있어요
    source: https://www.rfc-editor.org/rfc/rfc6749.html#section-4.1.3
  - key: oa-redirect-mismatch
    concept: core
    coreQuestion: q3
    type: multiple_choice
    status: draft
    difficulty: 2
    body: "스프링 시큐리티 OAuth2 Client로 카카오 로그인을 붙였어요. 카카오에는 redirect_uri를 `https://shop.com/login/oauth2/code/kakao`로 등록했어요. 운영 서버는 로드 밸런서 뒤에 있고 로드 밸런서가 TLS를 끝내요. forward 헤더 설정은 하지 않았어요. 로그인을 누르면 무슨 일이 생길까요?"
    choices:
      - 정상적으로 로그인된다
      - redirect_uri가 http://로 만들어져 등록 값과 달라 카카오가 redirect_uri_mismatch로 거절한다
      - client_secret이 틀려 invalid_client가 난다
      - state가 달라 쇼핑몰이 멈춘다
    answer: "2"
    explanation: |-
      **redirect_uri_mismatch가 나요.** 스프링은 받은 요청으로 {baseUrl}을 만드는데, 로드 밸런서가 HTTP로 넘겨서 http://가 돼요.

      - 인가 서버는 등록한 redirect_uri와 정확히 같을 때만 돌려보내요
      - server.forward-headers-strategy를 켜서 X-Forwarded-Proto를 읽게 하면 고쳐져요
    source: https://docs.spring.io/spring-security/reference/servlet/oauth2/login/core.html
  # ── 질문 4 ──
  - key: oa-link-member
    concept: core
    coreQuestion: q4
    type: multiple_choice
    status: draft
    difficulty: 1
    body: "카카오 로그인으로 들어온 사용자를 쇼핑몰 회원과 이으려고 해요. 열쇠로 쓰기에 가장 알맞은 값은 무엇일까요?"
    choices:
      - 사용자의 이메일
      - 제공자(kakao)와 ID 토큰의 sub
      - 액세스 토큰 문자열
      - 사용자의 닉네임
    answer: "2"
    explanation: |-
      **제공자와 sub예요.** sub는 그 제공자 안에서 사용자를 가리키는 바뀌지 않는 번호예요.

      - 이메일과 닉네임은 바뀌거나 비어 있을 수 있어요
      - 액세스 토큰은 로그인할 때마다 달라요
    source: https://openid.net/specs/openid-connect-core-1_0.html#IDToken
  - key: oa-aud-check
    concept: core
    coreQuestion: q4
    type: multiple_choice
    status: draft
    difficulty: 2
    body: "어떤 서비스는 클라이언트가 보낸 구글 토큰이 유효하기만 하면 그 사용자로 로그인시켜요. 토큰이 어느 앱(client_id)에게 발급됐는지는 확인하지 않아요. 공격자가 자기가 만든 다른 앱에서 받은 kim의 토큰을 들고 오면 어떻게 될까요?"
    choices:
      - 토큰의 서명이 맞지 않아 거부된다
      - kim으로 로그인된다. 우리에게 발급된 것인지(aud) 확인해야 한다
      - 만료 시간이 지나 거부된다
      - 구글이 알아서 막아 준다
    answer: "2"
    explanation: |-
      **kim으로 로그인돼요.** 토큰 자체는 구글이 발급한 진짜라서 서명도 맞아요.

      - OAuth의 액세스 토큰은 권한 증명이지 우리 서비스의 로그인 증명이 아니에요
      - 로그인에는 ID 토큰을 받아 aud가 우리 client_id인지, iss, exp, 서명을 확인해요
    source: https://openid.net/specs/openid-connect-core-1_0.html#IDTokenValidation
  # ── 전체 ──
  - key: oa-interview
    concept: core
    coreQuestion: all
    type: descriptive
    status: draft
    difficulty: 2
    body: 면접에서 "OAuth 2.0의 인가 코드 흐름을 설명하고, 소셜 로그인과 무엇이 다른지 말해 주세요"라는 질문을 받았어요. 1분 안에 답해 보세요.
    explanation: |-
      **비밀번호 대신 범위가 정해진 액세스 토큰을 넘기는 규칙이고, 코드를 거쳐 토큰을 서버끼리 받아요. 로그인에는 OIDC의 ID 토큰을 써요.**

      - **역할:** 자원 소유자, 클라이언트(우리 서비스), 인가 서버, 자원 서버
      - **흐름:** 인가 서버로 리다이렉트, 로그인과 동의, 코드와 state를 들고 돌아옴, state 확인, 코드와 client_secret으로 토큰 받기
      - **코드를 거치는 이유:** 코드는 브라우저에 드러나니 짧게 살고 한 번만 쓰이고 secret 없이는 쓸모없다
      - **로그인:** 액세스 토큰은 누구인지 약속하지 않는다. ID 토큰의 sub, aud, iss, exp를 확인하고 (제공자, sub)로 회원을 잇는다
    checklist:
      - 비밀번호 대신 범위가 정해진 액세스 토큰을 넘긴다고 말했다
      - 리다이렉트로 코드를 받고 서버끼리 토큰으로 바꾸는 순서를 말했다
      - state로 시작한 흐름인지 확인한다고 말했다
      - 코드를 거치는 이유(브라우저에 드러남, client_secret 필요, 한 번만 씀)를 말했다
      - 로그인에는 OpenID Connect의 ID 토큰을 쓴다고 말했다
    source: https://www.rfc-editor.org/rfc/rfc6749.html
