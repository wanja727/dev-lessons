# 단위 테스트와 테스트 더블 문제
# 형식: https://github.com/wanja727/retrievo/blob/main/docs/content-format.md
#
# 모든 문제는 coreQuestions의 질문 하나에 묶이고(coreQuestion), 답의 근거가 레슨 본문에 있다
# (site/src/content/lesson-pages/unit-test-double.yaml의 says).
# 동작에 관한 정답은 verification의 UnitTestDoubleTest로 확인했다 (자바 21, Mockito 5).
# 질문마다 첫 문제는 본문의 예시로 묻고, 둘째 문제는 다른 상황으로 옮겨 묻는다.
# 2026-11-25에 만들고 같은 날 검수해 reviewed로 바꿨다.
subject:
  key: dev
  name: 개발자 면접
lesson:
  key: unit-test-double
  title: 단위 테스트와 테스트 더블
  unit: 테스트와 운영
  order: 902
concepts:
  - key: core
    name: 단위 테스트와 테스트 더블
coreQuestions:
  - key: q1
    text: "단위 테스트는 무엇을 확인하나요?"
  - key: q2
    text: "협력 객체가 DB나 메일이면 어떻게 테스트하나요?"
  - key: q3
    text: "목과 스텁은 무엇이 다른가요?"
  - key: q4
    text: "목을 많이 쓰면 무엇이 나빠지나요?"
questions:
  # ── 질문 1 ──
  - key: utd-private-method
    concept: core
    coreQuestion: q1
    type: multiple_choice
    status: reviewed
    difficulty: 1
    body: 할인 정책 클래스 DiscountPolicy의 공개 메서드 discount(price)가 안에서 private 메서드 round를 불러요. round가 맞게 반올림하는지 확인하고 싶을 때 단위 테스트는 어떻게 쓰는 것이 맞을까요?
    choices:
      - 리플렉션으로 round를 직접 불러 검사한다
      - round를 public으로 바꿔 테스트한다
      - discount에 입력을 주고 나온 결과로 확인한다
      - round는 private이라 테스트하지 않아도 된다
    answer: "3"
    explanation: |-
      **공개 메서드 discount의 결과로 확인해요.** 단위 테스트는 바깥에서 보이는 동작을 검증하고, private 메서드는 공개 메서드를 부를 때 함께 돌아서 함께 확인돼요.

      - 내부 구현을 직접 검사하면 구현을 고칠 때마다 테스트가 깨져요
    source: https://martinfowler.com/articles/mocksArentStubs.html
  - key: utd-boundary
    concept: core
    coreQuestion: q1
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: 포인트 적립 규칙이 "결제 금액 5만 원 이상이면 2% 적립, 미만이면 1% 적립"이에요. 테스트에 10000원 입력 하나만 있어요. 조건을 > 와 >= 로 헷갈린 버그를 잡으려면 어떤 입력을 더해야 할까요?
    choices:
      - 20000과 30000
      - 49999와 50000
      - 100000과 200000
      - 0과 음수만
    answer: "2"
    explanation: |-
      **49999와 50000이에요.** 버그는 조건이 바뀌는 경계에서 드러나요.

      - price > 50000으로 잘못 짜면 50000에서만 1%가 나와 틀려요
      - 경계에서 먼 입력은 맞는 구현과 틀린 구현이 같은 답을 내요
    source: https://junit.org/junit5/docs/current/user-guide/
  # ── 질문 2 ──
  - key: utd-new-inside
    concept: core
    coreQuestion: q2
    type: multiple_choice
    status: reviewed
    difficulty: 1
    body: SignupService의 생성자가 this.mail = new SmtpMailSender(); 처럼 메일 발송 객체를 직접 만들어요. 단위 테스트에서 메일을 가짜로 바꿀 수 있을까요?
    choices:
      - 바꿀 수 있다. Mockito가 new를 가로챈다
      - 바꿀 수 없다. 바깥에서 다른 구현을 넣을 길이 없다
      - 바꿀 수 있다. 테스트에서 필드에 그냥 대입한다
      - SmtpMailSender가 인터페이스면 바꿀 수 있다
    answer: "2"
    explanation: |-
      **바꿀 수 없어요.** 클래스 안에서 new로 만들면 테스트가 다른 구현을 넣을 자리가 없어요.

      - 협력 객체를 인터페이스로, 생성자에서 받게 만들어야 테스트 더블로 바꿀 수 있어요
    source: https://martinfowler.com/bliki/TestDouble.html
  - key: utd-fake
    concept: core
    coreQuestion: q2
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: 주문 서비스 테스트에서 OrderRepository 대신, 저장과 조회를 HashMap으로 진짜처럼 구현한 MemoryOrderRepository를 넣었어요. 이 테스트 더블은 무엇일까요?
    choices:
      - 더미
      - 스텁
      - 목
      - 페이크
    answer: "4"
    explanation: |-
      **페이크예요.** 진짜처럼 동작하는 가벼운 구현이에요.

      - 스텁은 정해진 답만 돌려주고, 목은 호출을 기록해 검증해요
      - 더미는 자리만 채우고 불리지 않아요
    source: https://martinfowler.com/bliki/TestDouble.html
  # ── 질문 3 ──
  - key: utd-stub-duplicate
    concept: core
    coreQuestion: q3
    type: code_predict
    status: reviewed
    difficulty: 1
    body: 아래 테스트에서 repo와 mail은 Mockito의 mock()으로 만들었고, 다른 답은 정하지 않았어요. signup은 existsByEmail이 true면 DuplicateEmail을 던지고, 아니면 save한 뒤 mail.send를 불러요. 결과는 무엇일까요?
    code: |-
      when(repo.existsByEmail("a@b.com"))
          .thenReturn(true);

      service.signup("a@b.com");
    choices:
      - DuplicateEmail이 난다
      - null을 돌려준다
      - 환영 메일이 나간다
      - NullPointerException이 난다
    answer: "1"
    explanation: |-
      **DuplicateEmail이 나요.** when(...).thenReturn(true)로 "이미 있는 이메일" 상황을 만든 스텁이에요.

      - 스텁은 상황을 만들고, 테스트는 그 상황의 결과(예외)를 검증해요
      - 메일이 나가지 않았는지는 verify(mail, never())로 확인해요
    source: https://javadoc.io/doc/org.mockito/mockito-core/latest/org/mockito/Mockito.html
  - key: utd-void-verify
    concept: core
    coreQuestion: q3
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: 주문을 취소하면 PushSender의 void 메서드 push(userId, text)를 불러 알림을 보내는 서비스가 있어요. 취소했을 때 알림이 갔는지 단위 테스트로 확인하는 방법은?
    choices:
      - when(push.push(...)).thenReturn(true)로 스텁한다
      - verify(push).push(...)로 호출을 검증한다
      - void라서 확인할 방법이 없다
      - push의 반환값을 assertThat으로 본다
    answer: "2"
    explanation: |-
      **목으로 호출을 검증해요.** 돌려받을 결과가 없으니 그 인자로 불렸는지를 봐요.

      - void 메서드에는 thenReturn을 쓸 수 없어요
      - 바깥으로 나가는 알림은 목이 맞는 자리예요
    source: https://martinfowler.com/articles/mocksArentStubs.html
  - key: utd-optional-default
    concept: core
    coreQuestion: q3
    type: code_predict
    status: reviewed
    difficulty: 3
    body: '@ExtendWith(MockitoExtension.class) 테스트에서 @Mock OrderRepository repo의 findById는 Optional<Order>를 돌려줘요. findById를 스텁하지 않고 아래 서비스 코드를 테스트하면 어떻게 될까요?'
    code: |-
      Order order = repo.findById(1L)
          .orElseThrow();
      order.cancel();
    choices:
      - findById가 null을 돌려줘 NullPointerException이 난다
      - findById가 빈 Optional을 돌려줘 NoSuchElementException이 난다
      - 비어 있는 Order가 만들어져 cancel이 불린다
      - 스텁하지 않은 메서드라 컴파일 오류가 난다
    answer: "2"
    explanation: |-
      **NoSuchElementException이 나요.** 답을 정하지 않은 목은 Optional을 돌려주는 메서드에서 null이 아니라 빈 Optional을 돌려줘요.

      - 객체는 null, boolean은 false, 컬렉션은 빈 컬렉션이 기본값이에요
      - 찾은 상황을 만들려면 given(repo.findById(1L)).willReturn(Optional.of(order))로 스텁해요
    source: https://javadoc.io/doc/org.mockito/mockito-core/latest/org/mockito/Mockito.html
  # ── 질문 4 ──
  - key: utd-refactor-breaks
    concept: core
    coreQuestion: q4
    type: multiple_choice
    status: reviewed
    difficulty: 1
    body: SignupService의 중복 확인을 repo.existsByEmail(email)에서 repo.findByEmail(email).isPresent()로 바꿨어요. 동작은 같아요. verify(repo).existsByEmail("a@b.com")이 든 테스트는 어떻게 될까요?
    choices:
      - 동작이 같으니 통과한다
      - 실패한다. existsByEmail이 불리지 않는다
      - 컴파일 오류가 난다
      - Mockito가 findByEmail로 바꿔 검증해 통과한다
    answer: "2"
    explanation: |-
      **실패해요(WantedButNotInvoked).** 호출을 검증한 테스트는 동작이 아니라 부르는 방법에 묶여 있어요.

      - 메모리 페이크로 "가입 뒤 저장소에 회원이 있다"를 본 테스트는 그대로 통과해요
    source: https://martinfowler.com/articles/mocksArentStubs.html
  - key: utd-value-object-mock
    concept: core
    coreQuestion: q4
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: 장바구니 합계를 테스트하면서 상품 값 객체 Item을 mock(Item.class)로 만들고 getPrice()를 스텁했어요. 더 나은 방법은 무엇일까요?
    choices:
      - Item도 verify로 getPrice 호출을 검증한다
      - new Item("펜", 1000)처럼 진짜 Item을 만들어 쓴다
      - 장바구니까지 목으로 만든다
      - 합계는 테스트하지 않는다
    answer: "2"
    explanation: |-
      **진짜 Item을 만들어 써요.** 값 객체와 내 도메인 객체는 목으로 만들지 않아요.

      - 진짜가 더 쉽고, 목이 진짜와 다르게 동작할 위험도 없어요
      - 목은 메일이나 외부 API처럼 결과를 볼 수 없는 바깥 경계에만 써요
    source: https://martinfowler.com/articles/mocksArentStubs.html
  # ── 면접 ──
  - key: utd-interview
    concept: core
    coreQuestion: all
    type: descriptive
    status: reviewed
    difficulty: 2
    body: 면접에서 "목과 스텁의 차이를 설명하고, 목을 언제 쓰는지 말해 주세요"라는 질문을 받았어요. 1분 안에 답해 보세요.
    explanation: |-
      **스텁은 답을 정해 상황을 만들고 결과를 보게 하고, 목은 호출을 기록해 그 호출을 검증하게 해요.**

      - **단위 테스트:** 클래스 하나의 공개된 동작을 빠르게 확인
      - **테스트 더블:** 생성자로 받은 협력 객체를 바꿔 끼운다
      - **스텁 vs 목:** when으로 상황, verify로 호출
      - **주의:** 목은 구현에 묶이고 진짜와 다르게 돌아도 통과한다
      - **기준:** 결과로 볼 수 있으면 결과로, 목은 바깥 경계에만
    checklist:
      - 스텁은 정해진 답을 돌려줘 상황을 만든다고 말했다
      - 목은 호출을 기록하고 그 호출을 검증한다고 말했다
      - 협력 객체를 주입받아야 바꿔 끼울 수 있다고 말했다
      - 목으로 호출을 검증하면 리팩터링에 깨진다는 점을 말했다
      - 목은 메일, 외부 API 같은 바깥 경계에 쓴다는 기준을 말했다
    source: https://martinfowler.com/articles/mocksArentStubs.html
