  # ── 질문 5. 둘 다 맞게 재정의하면 HashMap에서 언제나 찾을 수 있나요? ──
  - key: eqh-mutate-output
    concept: core
    coreQuestion: q5
    type: code_predict
    status: draft
    difficulty: 2
    body: 자바 21(OpenJDK)이에요. Member는 equals가 이메일을 비교하고 hashCode가 email.hashCode()를 돌려줘요. email은 final이 아니에요. "kim@a.com"과 "lee@a.com"의 hashCode는 달라요. 아래 코드의 두 줄은 차례로 무엇을 출력할까요?
    code: |-
      Member a = new Member("kim@a.com");
      Map<Member, String> map = new HashMap<>();
      map.put(a, "VIP");

      a.email = "lee@a.com";

      System.out.println(map.get(a));
      System.out.println(map.size());
    choices:
      - VIP, 1
      - null, 1
      - null, 0
      - VIP, 0
    answer: "2"
    explanation: |-
      **null, 1이에요.** 값은 맵 안에 남아 있는데 찾을 길이 없어요.

      - HashMap은 키를 넣을 때의 hashCode로 둘 곳을 정하고, 키가 바뀌어도 다시 옮기지 않아요
      - 이메일을 바꾸면 a의 hashCode가 바뀌어요. 찾을 때는 바뀐 hashCode로 찾아서 null이에요
      - 지운 것은 없으니 크기는 1 그대로예요
    source: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/Map.html
