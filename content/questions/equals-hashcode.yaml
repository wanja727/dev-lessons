questions:
  # ── 질문 1. 값이 같은 두 객체를 같다고 판정하게 하려면 어떻게 하나요? ──
  - key: eqh-plain-list-contains
    concept: core
    coreQuestion: q1
    type: code_predict
    status: reviewed
    difficulty: 1
    body: Member는 equals와 hashCode를 재정의하지 않았어요. 아래 코드는 무엇을 출력할까요?
    code: |-
      class Member {
          String email;
          Member(String email) {
              this.email = email;
          }
      }

      Member a = new Member("kim@a.com");
      Member b = new Member("kim@a.com");
      List<Member> list = new ArrayList<>();
      list.add(a);
      System.out.println(list.contains(b));
    choices:
      - "true"
      - "false"
    answer: "2"
    explanation: |-
      **false예요.** ArrayList의 contains는 들어 있는 객체마다 equals를 불러 찾는데, 그 equals가 false예요.

      - 재정의하지 않은 equals는 같은 객체일 때만 true예요
      - 리스트에 든 것은 a이고 찾는 것은 b예요. 이메일은 같지만 다른 객체예요
    source: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/lang/Object.html#equals(java.lang.Object)
  - key: eqh-override-identity-and-equals
    concept: core
    coreQuestion: q1
    type: code_predict
    status: reviewed
    difficulty: 1
    body: Member는 equals가 이메일을 비교하게 재정의했어요. 아래 코드의 두 줄은 차례로 무엇을 출력할까요?
    code: |-
      class Member {
          String email;
          Member(String email) {
              this.email = email;
          }
          @Override
          public boolean equals(Object o) {
              if (!(o instanceof Member m)) {
                  return false;
              }
              return email.equals(m.email);
          }
      }

      Member a = new Member("kim@a.com");
      Member b = new Member("kim@a.com");
      System.out.println(a == b);
      System.out.println(a.equals(b));
    choices:
      - true, true
      - true, false
      - false, true
      - false, false
    answer: "3"
    explanation: |-
      **false, true예요.** equals를 재정의해도 ==의 결과는 바뀌지 않아요.

      - ==는 두 변수가 같은 객체를 가리키는지 봐요. a와 b는 따로 만든 두 객체예요
      - 재정의한 equals는 이메일을 비교해요. 둘 다 kim@a.com이라 true예요
    source: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/lang/Object.html#equals(java.lang.Object)
  - key: eqh-default-equals-fields
    concept: core
    coreQuestion: q1
    type: ox
    status: reviewed
    difficulty: 1
    body: 재정의하지 않은 equals는 두 객체의 필드 값이 모두 같으면 true를 돌려준다.
    answer: X
    explanation: |-
      **X. 필드 값은 보지 않아요.**

      - Object의 equals는 두 변수가 같은 객체를 가리킬 때만 true를 돌려줘요
      - 필드 값이 같으면 같다고 판정하게 하려면 equals를 재정의해야 해요
    source: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/lang/Object.html#equals(java.lang.Object)

  # ── 질문 2. equals를 재정의했는데 HashSet은 왜 같은 회원을 찾지 못하나요? ──
  - key: eqh-equals-only-size
    concept: core
    coreQuestion: q2
    type: code_predict
    status: reviewed
    difficulty: 1
    body: Member는 equals만 이메일을 비교하게 재정의했고 hashCode는 재정의하지 않았어요. a와 b의 hashCode가 다르게 나왔어요. 아래 코드는 무엇을 출력할까요?
    code: |-
      Member a = new Member("kim@a.com");
      Member b = new Member("kim@a.com");
      Set<Member> set = new HashSet<>();
      set.add(a);
      set.add(b);
      System.out.println(set.size());
    choices:
      - "1"
      - "2"
    answer: "2"
    explanation: |-
      **2예요.** 같은 회원이 두 번 들어가요.

      - HashSet은 hashCode가 같은 객체에만 equals를 불러요
      - 두 객체의 hashCode가 달라서 b를 a와 비교하지 않고 새 객체로 넣어요
      - set.add(b)는 true를 돌려줘요
    source: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/lang/Object.html#hashCode()
  - key: eqh-list-vs-set
    concept: core
    coreQuestion: q2
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: Member는 equals만 재정의했고, 이메일이 같은 a와 b의 hashCode가 다르게 나왔어요. a만 넣었을 때 list.contains(b)는 true인데 set.contains(b)는 false예요. 결과가 다른 까닭은 무엇일까요? list는 ArrayList, set은 HashSet이에요.
    choices:
      - ArrayList는 ==로 비교하고 HashSet은 equals로 비교한다
      - ArrayList는 hashCode를 쓰지 않고 equals만 부르고, HashSet은 hashCode가 같은 객체에만 equals를 부른다
      - HashSet은 equals를 쓰지 않고 hashCode만 비교한다
      - ArrayList는 넣은 순서를 기억하고 HashSet은 기억하지 않는다
    answer: "2"
    explanation: |-
      **ArrayList는 equals만 부르고, HashSet은 hashCode가 같은 객체에만 equals를 불러요.**

      - ArrayList의 contains는 들어 있는 객체마다 equals를 불러요. 재정의한 equals가 true를 돌려줘요
      - HashSet은 hashCode로 찾을 곳을 먼저 좁혀요. hashCode가 달라서 equals까지 가지 못해요
      - HashSet도 equals를 써요. hashCode가 같은 객체를 찾았을 때 equals로 확인해요
    source: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/Collection.html

  # ── 질문 3. 그러면 hashCode는 어떻게 재정의해야 하나요? ──
  - key: eqh-both-size
    concept: core
    coreQuestion: q3
    type: code_predict
    status: reviewed
    difficulty: 1
    body: Member는 equals가 이메일을 비교하고 hashCode가 email.hashCode()를 돌려주게 재정의했어요. 아래 코드는 무엇을 출력할까요?
    code: |-
      Member a = new Member("kim@a.com");
      Member b = new Member("kim@a.com");
      Set<Member> set = new HashSet<>();
      set.add(a);
      set.add(b);
      System.out.println(set.size());
    choices:
      - "1"
      - "2"
    answer: "1"
    explanation: |-
      **1이에요.** HashSet이 b를 이미 들어 있는 회원으로 봐요.

      - a와 b는 hashCode가 같고 equals도 true예요
      - set.add(b)는 넣지 않고 false를 돌려줘요
    source: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/lang/Object.html#hashCode()
  - key: eqh-contract-violation
    concept: core
    coreQuestion: q3
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: equals가 email만 비교하는 Member 클래스가 있어요. 필드는 email과 가입 시각 두 개예요. hashCode의 규약을 어기는 것은 무엇일까요?
    choices:
      - email.hashCode()를 돌려준다
      - 항상 1을 돌려준다
      - email과 가입 시각으로 만든 값을 돌려준다
    answer: "3"
    explanation: |-
      **email과 가입 시각으로 만든 값이에요.** equals로 같은 두 객체의 hashCode가 달라질 수 있어요.

      - 규약은 equals로 같은 두 객체가 같은 hashCode를 돌려주는 것이에요
      - 이메일이 같고 가입 시각이 다른 두 회원은 equals로 같은데 hashCode가 달라질 수 있어요
      - 항상 1은 같은 객체에 같은 값을 주므로 규약을 지켜요. 대신 느려져요
    source: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/lang/Object.html#hashCode()
  - key: eqh-no-compile-error
    concept: core
    coreQuestion: q3
    type: ox
    status: reviewed
    difficulty: 1
    body: equals와 hashCode 가운데 하나만 재정의하면 컴파일 오류가 난다.
    answer: X
    explanation: |-
      **X. 컴파일도 되고 예외도 나지 않아요.**

      - hashCode의 규약은 자바 API 문서가 정한 약속이고, 컴파일러는 검사하지 않아요
      - 어기면 HashSet과 HashMap의 결과만 틀려요
    source: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/lang/Object.html#hashCode()

  # ── 질문 4. 거꾸로 hashCode가 같은 두 객체는 equals도 같아야 하나요? ──
  - key: eqh-aa-bb-size
    concept: core
    coreQuestion: q4
    type: code_predict
    status: reviewed
    difficulty: 2
    body: 문자열 "Aa"와 "BB"의 hashCode는 둘 다 2112예요. Member는 equals가 이메일을 비교하고 hashCode가 email.hashCode()를 돌려주게 재정의했어요. 아래 코드는 무엇을 출력할까요?
    code: |-
      Set<Member> set = new HashSet<>();
      set.add(new Member("Aa"));
      set.add(new Member("BB"));
      System.out.println(set.size());
    choices:
      - "1"
      - "2"
    answer: "2"
    explanation: |-
      **2예요.** hashCode가 같아도 equals가 false면 다른 객체로 봐요.

      - HashSet은 hashCode가 같은 객체를 찾으면 equals로 마지막 확인을 해요
      - "Aa"와 "BB"는 equals가 false라서 두 회원이 따로 들어가요
    source: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/lang/String.html#hashCode()
  - key: eqh-constant-missing-calls
    concept: core
    coreQuestion: q4
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: 자바 21(OpenJDK)이에요. Member는 equals가 이메일을 비교하고 hashCode가 항상 1을 돌려줘요. 이메일이 서로 다른 회원 5명을 넣은 HashSet에서, 들어 있지 않은 회원을 contains로 찾았어요. 그동안 Member의 equals는 몇 번 불릴까요?
    choices:
      - 0번
      - 1번
      - 5번
      - 10번
    answer: "3"
    explanation: |-
      **5번이에요.** 들어 있는 회원 전부와 비교해요.

      - hashCode가 모두 1이라 들어 있는 5명이 모두 후보가 돼요
      - 후보마다 equals를 불러요. 전부 false라서 contains는 false를 돌려줘요
    source: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/lang/Object.html#hashCode()

  # ── 질문 5. 둘 다 맞게 재정의하면 HashMap에서 언제나 찾을 수 있나요? ──
  - key: eqh-mutate-output
    concept: core
    coreQuestion: q5
    type: code_predict
    status: reviewed
    difficulty: 2
    body: 자바 21(OpenJDK)이에요. Member는 equals가 이메일을 비교하고 hashCode가 email.hashCode()를 돌려줘요. email은 final이 아니에요. "kim@a.com"과 "lee@a.com"의 hashCode는 달라요. 아래 코드의 두 줄은 차례로 무엇을 출력할까요?
    code: |-
      Member a = new Member("kim@a.com");
      Map<Member, String> map = new HashMap<>();
      map.put(a, "VIP");

      a.email = "lee@a.com";

      System.out.println(map.get(a));
      System.out.println(map.size());
    choices:
      - VIP, 1
      - null, 1
      - null, 0
      - VIP, 0
    answer: "2"
    explanation: |-
      **null, 1이에요.** 값은 맵 안에 남아 있는데 찾을 길이 없어요.

      - HashMap은 키를 넣을 때의 hashCode로 둘 곳을 정하고, 키가 바뀌어도 다시 옮기지 않아요
      - 이메일을 바꾸면 a의 hashCode가 바뀌어요. 찾을 때는 바뀐 hashCode로 찾아서 null이에요
      - 지운 것은 없으니 크기는 1 그대로예요
    source: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/Map.html
  - key: eqh-final-compile
    concept: core
    coreQuestion: q5
    type: multiple_choice
    status: reviewed
    difficulty: 1
    body: Member의 email 필드를 final String email로 선언했어요. HashMap에 a를 키로 넣은 뒤 a.email = "lee@a.com"을 실행하려고 하면 어떻게 될까요?
    choices:
      - 이메일이 바뀌고 map.get(a)가 null을 돌려준다
      - 이메일이 바뀌지 않고 조용히 넘어간다
      - 그 줄에서 컴파일 오류가 난다
      - 실행 중에 예외가 난다
    answer: "3"
    explanation: |-
      **그 줄에서 컴파일 오류가 나요.** final 필드는 생성자에서 한 번 정한 뒤로 값을 바꿀 수 없어요.

      - 컴파일러가 "cannot assign a value to final variable email"이라고 알려 줘요
      - 그래서 키로 넣은 뒤에 hashCode가 바뀌는 실수를 실행하기 전에 막아요
    source: https://docs.oracle.com/javase/specs/jls/se21/html/jls-4.html#jls-4.12.4

  # ── 다섯 질문을 하나로 ──
  - key: eqh-interview
    concept: core
    coreQuestion: all
    type: descriptive
    status: reviewed
    difficulty: 2
    body: 면접에서 "equals와 hashCode를 왜 함께 재정의해야 하나요?"라는 질문을 받았어요. 1분 안에 답해 보세요.
    explanation: |-
      **HashSet과 HashMap은 hashCode로 찾을 곳을 먼저 좁힌 뒤 equals로 비교해서, 값이 같은 객체는 hashCode도 같아야 찾을 수 있기 때문이에요.**

      - **equals:** 재정의하지 않으면 ==처럼 같은 객체인지만 본다. 값을 비교하려면 재정의한다
      - **규약:** equals로 같은 두 객체는 hashCode도 같아야 한다. 거꾸로는 아니어서 hashCode가 같아도 equals는 다를 수 있다
      - **어기면:** equals만 재정의하면 HashSet에 같은 회원이 둘 들어가고 contains가 false다. 컴파일러는 알려 주지 않는다
      - **만들기:** equals에서 비교한 필드로 hashCode를 만든다. 상수를 돌려주면 규약은 지키지만 한 칸에 몰려 느려진다
      - **키는 바꾸지 않기:** 키로 넣은 뒤 hashCode에 쓰는 필드를 바꾸면 찾지 못한다. 필드를 final로 둔다
    checklist:
      - HashSet이 hashCode로 칸을 고른 뒤 equals로 비교한다고 말했다
      - equals로 같으면 hashCode도 같아야 한다는 규약을 말했다
      - equals만 재정의하면 같은 값을 찾지 못하거나 중복이 들어간다고 말했다
      - equals에서 비교한 필드로 hashCode를 만든다고 말했다
      - 키로 넣은 객체의 필드를 바꾸면 찾지 못하고, final로 막는다고 말했다
    source: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/lang/Object.html#hashCode()
