questions:
  # ── 질문 1. 값이 같은 두 객체를 같다고 판정하게 하려면 어떻게 하나요? ──
  - key: eqh-plain-equals
    concept: core
    coreQuestion: q1
    type: code_predict
    status: draft
    difficulty: 1
    body: Member는 equals와 hashCode를 재정의하지 않았어요. 아래 코드는 무엇을 출력할까요?
    code: |-
      class Member {
          String email;
          Member(String email) {
              this.email = email;
          }
      }

      Member a = new Member("kim@a.com");
      Member b = new Member("kim@a.com");
      System.out.println(a.equals(b));
    choices:
      - "true"
      - "false"
      - 컴파일 오류가 난다
      - 실행 중에 예외가 난다
    answer: "2"
    explanation: |-
      **false예요.** 재정의하지 않은 equals는 두 변수가 같은 객체를 가리킬 때만 true예요.

      - Object가 준 equals는 ==와 똑같이 판정해요
      - a와 b는 이메일이 같아도 따로 만든 두 객체예요
      - equals는 Object에 들어 있어서 재정의하지 않아도 부를 수 있어요. 컴파일 오류도 예외도 아니에요
    source: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/lang/Object.html#equals(java.lang.Object)
  - key: eqh-plain-list-contains
    concept: core
    coreQuestion: q1
    type: code_predict
    status: draft
    difficulty: 1
    body: Member는 equals와 hashCode를 재정의하지 않았어요. 아래 코드는 무엇을 출력할까요?
    code: |-
      class Member {
          String email;
          Member(String email) {
              this.email = email;
          }
      }

      Member a = new Member("kim@a.com");
      Member b = new Member("kim@a.com");
      List<Member> list = new ArrayList<>();
      list.add(a);
      System.out.println(list.contains(b));
    choices:
      - "true"
      - "false"
    answer: "2"
    explanation: |-
      **false예요.** ArrayList의 contains는 들어 있는 객체마다 equals를 불러 찾는데, 그 equals가 false예요.

      - 재정의하지 않은 equals는 같은 객체일 때만 true예요
      - 리스트에 든 것은 a이고 찾는 것은 b예요. 이메일은 같지만 다른 객체예요
    source: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/lang/Object.html#equals(java.lang.Object)
  - key: eqh-override-identity-and-equals
    concept: core
    coreQuestion: q1
    type: code_predict
    status: draft
    difficulty: 1
    body: Member는 equals가 이메일을 비교하게 재정의했어요. 아래 코드의 두 줄은 차례로 무엇을 출력할까요?
    code: |-
      class Member {
          String email;
          Member(String email) {
              this.email = email;
          }
          @Override
          public boolean equals(Object o) {
              if (!(o instanceof Member m)) {
                  return false;
              }
              return email.equals(m.email);
          }
      }

      Member a = new Member("kim@a.com");
      Member b = new Member("kim@a.com");
      System.out.println(a == b);
      System.out.println(a.equals(b));
    choices:
      - true, true
      - true, false
      - false, true
      - false, false
    answer: "3"
    explanation: |-
      **false, true예요.** equals를 재정의해도 ==의 결과는 바뀌지 않아요.

      - ==는 두 변수가 같은 객체를 가리키는지 봐요. a와 b는 따로 만든 두 객체예요
      - 재정의한 equals는 이메일을 비교해요. 둘 다 kim@a.com이라 true예요
    source: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/lang/Object.html#equals(java.lang.Object)
  - key: eqh-default-equals-fields
    concept: core
    coreQuestion: q1
    type: ox
    status: draft
    difficulty: 1
    body: 재정의하지 않은 equals는 두 객체의 필드 값이 모두 같으면 true를 돌려준다.
    answer: X
    explanation: |-
      **X. 필드 값은 보지 않아요.**

      - Object의 equals는 두 변수가 같은 객체를 가리킬 때만 true를 돌려줘요
      - 필드 값이 같으면 같다고 판정하게 하려면 equals를 재정의해야 해요
    source: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/lang/Object.html#equals(java.lang.Object)
  - key: eqh-three-comparisons
    concept: core
    coreQuestion: q1
    type: descriptive
    status: draft
    difficulty: 1
    body: ==, 재정의하지 않은 equals, 재정의한 equals가 각각 무엇을 비교하는지 설명해 보세요.
    explanation: |-
      **==와 재정의하지 않은 equals는 같은 객체인지를 보고, 재정의한 equals는 내가 정한 기준(예: 이메일)을 비교해요.**

      - ==는 두 변수가 같은 객체를 가리키는지 봐요
      - 재정의하지 않은 equals는 Object의 것을 그대로 써서 ==와 똑같이 판정해요
      - equals를 재정의하면 무엇이 같을 때 같은 객체로 볼지 직접 정해요
      - equals를 재정의해도 ==의 결과는 바뀌지 않아요
      - ArrayList의 contains처럼 equals를 불러 찾는 메서드의 결과가 함께 바뀌어요
    checklist:
      - ==는 두 변수가 같은 객체를 가리키는지 본다고 말했다
      - 재정의하지 않은 equals는 ==와 똑같이 판정한다고 말했다
      - 재정의한 equals는 내가 정한 값(예 이메일)을 비교한다고 말했다
      - equals를 재정의해도 ==의 결과는 그대로라고 말했다
      - ArrayList의 contains가 equals를 부른다고 말했다
    source: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/lang/Object.html#equals(java.lang.Object)

  # ── 질문 2. equals를 재정의했는데 HashSet은 왜 같은 회원을 찾지 못하나요? ──
  - key: eqh-equals-only-calls
    concept: core
    coreQuestion: q2
    type: multiple_choice
    status: draft
    difficulty: 2
    body: Member는 equals만 이메일을 비교하게 재정의했고 hashCode는 재정의하지 않았어요. 이메일이 같은 a와 b를 만들었는데 두 객체의 hashCode가 다르게 나왔어요. a를 넣은 HashSet에 contains(b)를 부르는 동안 Member의 equals는 몇 번 불릴까요?
    choices:
      - 0번
      - 1번
      - 2번
    answer: "1"
    explanation: |-
      **0번이에요.** HashSet은 hashCode가 같은 객체에만 equals를 불러요.

      - HashSet은 찾는 객체의 hashCode로 찾을 곳을 먼저 좁혀요
      - a와 b의 hashCode가 달라서 a는 후보가 되지 못해요
      - 후보가 없으니 equals는 한 번도 불리지 않고 contains는 false를 돌려줘요
    source: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/Collection.html
  - key: eqh-equals-only-size
    concept: core
    coreQuestion: q2
    type: code_predict
    status: draft
    difficulty: 1
    body: Member는 equals만 이메일을 비교하게 재정의했고 hashCode는 재정의하지 않았어요. a와 b의 hashCode가 다르게 나왔어요. 아래 코드는 무엇을 출력할까요?
    code: |-
      Member a = new Member("kim@a.com");
      Member b = new Member("kim@a.com");
      Set<Member> set = new HashSet<>();
      set.add(a);
      set.add(b);
      System.out.println(set.size());
    choices:
      - "1"
      - "2"
    answer: "2"
    explanation: |-
      **2예요.** 같은 회원이 두 번 들어가요.

      - HashSet은 hashCode가 같은 객체에만 equals를 불러요
      - 두 객체의 hashCode가 달라서 b를 a와 비교하지 않고 새 객체로 넣어요
      - set.add(b)는 true를 돌려줘요
    source: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/lang/Object.html#hashCode()
  - key: eqh-equals-only-map-get
    concept: core
    coreQuestion: q2
    type: code_predict
    status: draft
    difficulty: 1
    body: Member는 equals만 이메일을 비교하게 재정의했고 hashCode는 재정의하지 않았어요. a와 b의 hashCode가 다르게 나왔어요. 아래 코드는 무엇을 출력할까요?
    code: |-
      Member a = new Member("kim@a.com");
      Member b = new Member("kim@a.com");
      Map<Member, String> map = new HashMap<>();
      map.put(a, "VIP");
      System.out.println(map.get(b));
    choices:
      - VIP
      - "null"
      - 실행 중에 예외가 난다
    answer: "2"
    explanation: |-
      **null이에요.** HashMap도 hashCode가 같은 키에만 equals를 불러요.

      - b의 hashCode가 a의 것과 달라서 a는 후보가 되지 못해요
      - 찾지 못하면 get은 예외를 던지지 않고 null을 돌려줘요
    source: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/lang/Object.html#hashCode()
  - key: eqh-list-vs-set
    concept: core
    coreQuestion: q2
    type: multiple_choice
    status: draft
    difficulty: 2
    body: Member는 equals만 재정의했고, 이메일이 같은 a와 b의 hashCode가 다르게 나왔어요. a만 넣었을 때 list.contains(b)는 true인데 set.contains(b)는 false예요. 결과가 다른 까닭은 무엇일까요? list는 ArrayList, set은 HashSet이에요.
    choices:
      - ArrayList는 ==로 비교하고 HashSet은 equals로 비교한다
      - ArrayList는 hashCode를 쓰지 않고 equals만 부르고, HashSet은 hashCode가 같은 객체에만 equals를 부른다
      - HashSet은 equals를 쓰지 않고 hashCode만 비교한다
      - ArrayList는 넣은 순서를 기억하고 HashSet은 기억하지 않는다
    answer: "2"
    explanation: |-
      **ArrayList는 equals만 부르고, HashSet은 hashCode가 같은 객체에만 equals를 불러요.**

      - ArrayList의 contains는 들어 있는 객체마다 equals를 불러요. 재정의한 equals가 true를 돌려줘요
      - HashSet은 hashCode로 찾을 곳을 먼저 좁혀요. hashCode가 달라서 equals까지 가지 못해요
      - HashSet도 equals를 써요. hashCode가 같은 객체를 찾았을 때 equals로 확인해요
    source: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/Collection.html
  - key: eqh-equals-enough
    concept: core
    coreQuestion: q2
    type: ox
    status: draft
    difficulty: 1
    body: equals가 true를 돌려주게 재정의하기만 하면, hashCode가 서로 다른 두 객체도 HashSet이 같은 것으로 본다.
    answer: X
    explanation: |-
      **X. hashCode가 다르면 HashSet은 equals를 부르지도 않아요.**

      - HashSet은 hashCode가 같은 객체에만 equals를 불러요
      - hashCode를 재정의하지 않으면 값이 같은 두 객체도 hashCode가 달라요
      - 그래서 contains는 false이고 같은 객체가 두 번 들어가요
    source: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/lang/Object.html#hashCode()
  - key: eqh-equals-only-explain
    concept: core
    coreQuestion: q2
    type: descriptive
    status: draft
    difficulty: 2
    body: equals만 재정의한 클래스의 객체를 HashSet에 넣으면 어떤 일이 생기는지, 왜 그런지 설명해 보세요.
    explanation: |-
      **값이 같은 객체를 찾지 못하고 같은 객체가 두 번 들어가요. HashSet이 hashCode가 같은 객체에만 equals를 부르기 때문이에요.**

      - HashSet은 찾는 객체의 hashCode로 찾을 곳을 먼저 좁혀요
      - 재정의하지 않은 hashCode는 필드 값과 상관없이 객체마다 따로 정해져요
      - 그래서 값이 같은 두 객체도 hashCode가 달라 equals가 불리지 않아요
      - contains는 false, add는 true가 되어 같은 객체가 두 번 들어가요
      - ArrayList는 equals만 불러서 같은 클래스로도 찾아요
    checklist:
      - HashSet이 hashCode로 찾을 곳을 먼저 좁힌다고 말했다
      - hashCode가 같은 객체에만 equals를 부른다고 말했다
      - 재정의하지 않은 hashCode는 객체마다 따로 정해진다고 말했다
      - contains가 false이고 같은 객체가 두 번 들어간다고 말했다
      - equals가 불리지 않는다(0번)고 말했다
    source: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/lang/Object.html#hashCode()

  # ── 질문 3. 그러면 hashCode는 어떻게 재정의해야 하나요? ──
  - key: eqh-both-contains-calls
    concept: core
    coreQuestion: q3
    type: multiple_choice
    status: draft
    difficulty: 2
    body: Member는 equals가 이메일을 비교하고 hashCode가 email.hashCode()를 돌려주게 재정의했어요. 이메일이 같은 a와 b를 만들고 a를 넣은 HashSet에 contains(b)를 불렀어요. 결과와, 그동안 Member의 equals가 불린 횟수는 무엇일까요?
    choices:
      - true, 0번
      - true, 1번
      - false, 0번
      - false, 1번
    answer: "2"
    explanation: |-
      **true, 1번이에요.** hashCode가 같은 a가 후보가 되고, equals 1번으로 확인해요.

      - 이메일이 같으니 a와 b의 hashCode가 같아요
      - HashSet은 hashCode가 같은 a에 equals를 불러요. 이메일이 같아서 true예요
    source: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/lang/Object.html#hashCode()
  - key: eqh-both-size
    concept: core
    coreQuestion: q3
    type: code_predict
    status: draft
    difficulty: 1
    body: Member는 equals가 이메일을 비교하고 hashCode가 email.hashCode()를 돌려주게 재정의했어요. 아래 코드는 무엇을 출력할까요?
    code: |-
      Member a = new Member("kim@a.com");
      Member b = new Member("kim@a.com");
      Set<Member> set = new HashSet<>();
      set.add(a);
      set.add(b);
      System.out.println(set.size());
    choices:
      - "1"
      - "2"
    answer: "1"
    explanation: |-
      **1이에요.** HashSet이 b를 이미 들어 있는 회원으로 봐요.

      - a와 b는 hashCode가 같고 equals도 true예요
      - set.add(b)는 넣지 않고 false를 돌려줘요
    source: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/lang/Object.html#hashCode()
  - key: eqh-both-put-twice
    concept: core
    coreQuestion: q3
    type: code_predict
    status: draft
    difficulty: 2
    body: Member는 equals가 이메일을 비교하고 hashCode가 email.hashCode()를 돌려주게 재정의했어요. 아래 코드의 두 줄은 차례로 무엇을 출력할까요?
    code: |-
      Member a = new Member("kim@a.com");
      Member b = new Member("kim@a.com");
      Map<Member, String> map = new HashMap<>();
      map.put(a, "VIP");
      map.put(b, "GOLD");
      System.out.println(map.size());
      System.out.println(map.get(a));
    choices:
      - 1, VIP
      - 1, GOLD
      - 2, VIP
      - 2, GOLD
    answer: "2"
    explanation: |-
      **1, GOLD예요.** HashMap이 a와 b를 같은 키로 봐요.

      - a와 b는 hashCode가 같고 equals도 true예요
      - map.put(b, "GOLD")는 새로 넣지 않고 같은 키의 값을 GOLD로 바꿔요
      - 그래서 크기는 1이고 a로 꺼내도 GOLD예요
    source: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/lang/Object.html#hashCode()
  - key: eqh-contract-violation
    concept: core
    coreQuestion: q3
    type: multiple_choice
    status: draft
    difficulty: 2
    body: equals가 email만 비교하는 Member 클래스가 있어요. 필드는 email과 가입 시각 두 개예요. hashCode의 규약을 어기는 것은 무엇일까요?
    choices:
      - email.hashCode()를 돌려준다
      - 항상 1을 돌려준다
      - email과 가입 시각으로 만든 값을 돌려준다
    answer: "3"
    explanation: |-
      **email과 가입 시각으로 만든 값이에요.** equals로 같은 두 객체의 hashCode가 달라질 수 있어요.

      - 규약은 equals로 같은 두 객체가 같은 hashCode를 돌려주는 것이에요
      - 이메일이 같고 가입 시각이 다른 두 회원은 equals로 같은데 hashCode가 달라져요
      - 항상 1은 같은 객체에 같은 값을 주므로 규약을 지켜요. 대신 느려져요
    source: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/lang/Object.html#hashCode()
  - key: eqh-no-compile-error
    concept: core
    coreQuestion: q3
    type: ox
    status: draft
    difficulty: 1
    body: equals와 hashCode 가운데 하나만 재정의하면 컴파일 오류가 난다.
    answer: X
    explanation: |-
      **X. 컴파일도 되고 예외도 나지 않아요.**

      - hashCode의 규약은 자바 API 문서가 정한 약속이고, 컴파일러는 검사하지 않아요
      - 어기면 HashSet과 HashMap의 결과만 틀려요
    source: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/lang/Object.html#hashCode()
  - key: eqh-why-together
    concept: core
    coreQuestion: q3
    type: descriptive
    status: draft
    difficulty: 2
    body: equals와 hashCode를 함께 재정의해야 하는 이유를 hashCode의 규약과 HashSet이 객체를 찾는 순서로 설명해 보세요.
    explanation: |-
      **equals로 같은 두 객체는 hashCode도 같아야 한다는 규약이 있고, HashSet은 이 규약을 믿고 hashCode가 다른 객체를 건너뛰기 때문이에요.**

      - hashCode의 규약: equals로 같은 두 객체는 hashCode가 같은 값을 돌려줘야 해요
      - HashSet은 hashCode로 찾을 곳을 먼저 좁히고, hashCode가 같은 객체에만 equals를 불러요
      - equals만 재정의하면 값이 같은 두 객체의 hashCode가 달라 equals까지 가지 못해요
      - equals에서 비교한 필드로 hashCode를 만들면 규약을 지켜요
      - 컴파일러는 규약을 검사하지 않아서 어겨도 결과만 틀려요
    checklist:
      - equals로 같은 두 객체는 hashCode도 같아야 한다는 규약을 말했다
      - HashSet이 hashCode가 같은 객체에만 equals를 부른다고 말했다
      - equals만 재정의하면 값이 같은 객체를 찾지 못한다고 말했다
      - equals에서 비교한 필드로 hashCode를 만든다고 말했다
      - 컴파일러가 규약을 검사하지 않는다고 말했다
    source: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/lang/Object.html#hashCode()

