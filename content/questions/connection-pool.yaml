questions:
  # ── 질문 1. 커넥션은 무엇이고, 왜 매번 새로 만들면 안 되나요? ──
  - key: cp-create-steps
    concept: core
    coreQuestion: q1
    type: multiple_choice
    status: reviewed
    difficulty: 1
    body: 프로그램이 PostgreSQL에 연결을 새로 만들 때 일어나는 일이 아닌 것은 무엇인가요?
    choices:
      - 네트워크로 DB 서버에 접속한다
      - 아이디와 비밀번호로 인증한다
      - DB 서버가 이 연결을 맡을 서버 프로세스를 띄운다
      - 테이블의 데이터를 프로그램으로 모두 복사해 둔다
    answer: "4"
    explanation: |-
      **테이블의 데이터를 복사해 두는 일은 없어요.** 연결은 SQL을 보내고 결과를 받는 통로일 뿐이에요.

      - 연결을 만들 때는 네트워크 접속, 인증, DB 서버의 준비가 일어나요
      - PostgreSQL은 연결마다 서버 프로세스를 하나씩 띄워요. 그래서 연결을 만드는 일이 SQL 한 번보다 훨씬 오래 걸려요
    source: https://www.postgresql.org/docs/16/connect-estab.html
  - key: cp-server-process
    concept: core
    coreQuestion: q1
    type: multiple_choice
    status: reviewed
    difficulty: 1
    body: "애플리케이션 서버가 3대 있고, 서버마다 PostgreSQL에 연결을 10개씩 열어 두고 있어요. PostgreSQL 서버에서 이 연결들을 맡고 있는 서버 프로세스는 몇 개일까요?"
    choices:
      - "1개"
      - "3개"
      - "10개"
      - "30개"
    answer: "4"
    explanation: |-
      **30개예요.** PostgreSQL은 연결마다 서버 프로세스를 하나씩 띄워요.

      - 연결이 3 × 10 = 30개니 서버 프로세스도 30개예요
      - 그래서 연결을 무한정 만들 수 없어요. PostgreSQL이 동시에 받을 수 있는 연결 수의 기본값은 100개예요
    source: https://www.postgresql.org/docs/16/connect-estab.html
  # ── 질문 2. 커넥션 풀은 어떻게 동작하나요? ──
  - key: cp-reuse
    concept: core
    coreQuestion: q2
    type: code_predict
    status: reviewed
    difficulty: 1
    body: pool은 연결을 1개만 가진 HikariCP 풀이에요. 아래 코드에서 두 번째 try 블록이 빌린 연결은 무엇일까요?
    code: |-
      try (Connection c = pool.getConnection()) {
          // SQL 실행
      }
      try (Connection c = pool.getConnection()) {
          // SQL 실행
      }
    choices:
      - 첫 번째 블록이 쓰던 것과 같은 DB 연결
      - 새로 만든 다른 DB 연결
      - 빌릴 연결이 없어서 예외가 난다
    answer: "1"
    explanation: |-
      **첫 번째 블록이 쓰던 것과 같은 DB 연결이에요.**

      - 첫 번째 try 블록이 끝나면 close()가 불려서 연결이 풀로 돌아가요. 끊어지지 않아요
      - 두 번째 블록은 풀에 돌아와 있는 그 연결을 다시 빌려요. PostgreSQL에서 확인하면 두 번 모두 같은 서버 프로세스예요
    source: https://github.com/brettwooldridge/HikariCP
  - key: q-be7e20b9
    concept: core
    coreQuestion: q2
    type: multiple_choice
    status: reviewed
    difficulty: 1
    body: "HikariCP 풀의 크기는 2, 연결을 기다리는 최대 시간은 500ms예요. 어떤 메서드에 버그가 있어서 getConnection()으로 연결을 빌린 뒤 close()를 부르지 않아요. 이 메서드가 두 번 실행된 뒤에 다른 요청이 getConnection()을 불렀어요. 어떻게 될까요?"
    choices:
      - "앞의 메서드가 끝났으니 연결이 저절로 반납돼서 바로 받는다"
      - "풀이 연결을 하나 더 만들어 준다"
      - "약 500ms 기다린 뒤 예외로 실패한다"
      - "DB 서버에 새로 접속해서 연결을 받는다"
    answer: "3"
    explanation: |-
      **약 500ms 기다린 뒤 예외로 실패해요.** 반납된 연결이 없기 때문이에요.

      - 풀에서 빌린 연결은 close()를 불러야 풀로 돌아가요. 메서드가 끝났다고 저절로 반납되지 않아요
      - 연결 2개가 모두 빌려준 상태로 남아 있어서, 다음 요청은 기다리다가 실패해요. 풀은 최대 크기를 넘겨 만들지 않아요
      - 그래서 try-with-resources로 빌려요. 블록이 끝나면 close()가 자동으로 불려요
    source: https://github.com/brettwooldridge/HikariCP
  # ── 질문 3. 풀의 연결이 모두 쓰이고 있으면 다음 요청은 어떻게 되나요? ──
  - key: q-d4692514
    concept: core
    coreQuestion: q3
    type: code_predict
    status: reviewed
    difficulty: 1
    body: HikariCP 풀의 크기는 2, 연결을 기다리는 최대 시간은 500ms예요. 요청 두 개가 연결을 하나씩 쥔 채 몇 초가 걸리는 SQL을 실행하는 중에, 세 번째 요청이 연결을 달라고 했어요. 세 번째 요청은 어떻게 될까요?
    choices:
      - 풀이 연결을 하나 더 만들어 준다
      - 기다리지 않고 바로 예외가 난다
      - 약 500ms 기다린 뒤 SQLTransientConnectionException이 난다
      - 연결이 반납될 때까지 시간 제한 없이 기다린다
    answer: "3"
    explanation: |-
      **약 500ms 기다린 뒤 SQLTransientConnectionException이 나요.**

      - 풀은 최대 크기를 넘겨 연결을 만들지 않아요
      - 빌려줄 연결이 없으면 기다리는 최대 시간까지 기다려요. 그 안에 반납되는 연결이 없으면 예외로 실패해요
    source: https://github.com/brettwooldridge/HikariCP
  - key: cp-waiter
    concept: core
    coreQuestion: q3
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: HikariCP 풀의 크기는 1, 연결을 기다리는 최대 시간은 3초예요. 요청 A가 연결을 쥐고 있는 동안 요청 B가 연결을 달라고 해서 기다리기 시작했어요. 0.3초 뒤에 A가 연결을 반납했어요. B는 어떻게 될까요?
    choices:
      - A가 반납한 연결을 바로 받는다
      - 3초를 다 기다린 다음에 연결을 받는다
      - 풀이 새 연결을 만들어 B에게 준다
      - 예외로 실패한다
    answer: "1"
    explanation: |-
      **A가 반납한 연결을 바로 받아요.**

      - 기다리던 요청은 누군가 연결을 반납하는 순간 그 연결을 받아요
      - 기다리는 최대 시간 3초는 그때까지 못 받으면 실패하는 한도예요. 꼭 그만큼 기다리는 시간이 아니에요
    source: https://github.com/brettwooldridge/HikariCP
  # ── 질문 4. 트랜잭션은 연결을 얼마나 오래 쥐고 있나요? ──
  - key: q-1a470682
    concept: core
    coreQuestion: q4
    type: line_pick
    status: reviewed
    difficulty: 2
    body: 요청이 몰리면 연결을 기다리다 실패하는 예외가 나는데, DB 서버는 한가해요. paymentApi.pay는 다른 회사의 결제 서버를 부르고 응답에 몇 초가 걸려요. 이 요청이 연결을 오래 쥐게 만드는 줄은 어디일까요?
    code: |-
      @Transactional
      void checkout(Long id) {
          Order o = orders.findById(id);
          Receipt r = paymentApi.pay(o);
          o.markPaid(r);
      }
    answer: "4"
    explanation: |-
      **4번 줄, 결제 서버를 부르는 줄이에요.**

      - 트랜잭션은 끝날 때까지 연결을 쥐고 있어요. 결제 서버의 응답을 기다리는 몇 초 동안 SQL은 보내지 않지만 연결은 쥔 채예요
      - 그래서 DB는 한가한데 풀의 연결이 모자라요
      - 결제 호출을 트랜잭션 밖으로 빼고, 결과를 저장하는 부분만 짧은 트랜잭션으로 묶어요
    source: https://github.com/brettwooldridge/HikariCP
  - key: q-96e767fb
    concept: core
    coreQuestion: q4
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: "스프링의 @Transactional 메서드가 회원을 조회하고(0.02초), 다른 회사의 이미지 서버에 프로필 사진을 올리고(2초), 회원 정보를 저장해요(0.03초). 이 요청이 풀에서 빌린 연결을 쥐고 있는 시간은 얼마일까요?"
    choices:
      - "0.02초"
      - "0.05초"
      - "2초"
      - "2.05초"
    answer: "4"
    explanation: |-
      **2.05초예요.** 트랜잭션이 끝날 때까지 연결을 쥐고 있어요.

      - 연결은 트랜잭션이 커밋되거나 롤백될 때 풀로 돌아가요. SQL 한 문장이 끝날 때마다 돌아가지 않아요
      - 이미지 서버를 기다리는 2초 동안에는 SQL을 보내지 않지만 연결은 쥔 채예요
      - 사진을 올리는 일을 트랜잭션 밖으로 빼면 연결을 쥐는 시간은 0.05초가 돼요
    source: https://docs.spring.io/spring-boot/reference/data/sql.html
  - key: cp-tx-hold-explain
    concept: core
    coreQuestion: q4
    type: descriptive
    status: reviewed
    difficulty: 2
    body: 트랜잭션 안에서 응답이 느린 외부 서버를 부르면 커넥션 풀에 어떤 문제가 생기는지, 어떻게 고치는지 설명해 보세요.
    explanation: |-
      **외부 서버를 기다리는 동안에도 연결을 쥐고 있어서 풀의 연결이 모자라요. 느린 호출을 트랜잭션 밖으로 빼요.**

      - 트랜잭션은 커밋이나 롤백으로 끝날 때까지 연결 하나를 쥐고 있어요
      - 외부 서버의 응답을 기다리는 동안 SQL은 보내지 않지만 연결은 풀로 돌아가지 않아요
      - 요청이 몰리면 다른 요청이 연결을 기다리다 실패해요. DB 서버는 한가해요
      - 외부 호출을 트랜잭션 밖으로 빼고, DB에 저장하는 부분만 짧은 트랜잭션으로 묶어요
    checklist:
      - 트랜잭션은 끝날 때까지 연결을 쥔다고 말했다
      - 외부 서버를 기다리는 동안에도 연결을 쥔다고 말했다
      - 그래서 다른 요청이 연결을 기다리거나 실패한다고 말했다
      - 외부 호출을 트랜잭션 밖으로 뺀다고 말했다
      - 트랜잭션을 짧게 둔다고 말했다
    source: https://github.com/brettwooldridge/HikariCP
  # ── 네 질문을 하나로 ──
  - key: q-1ca0e891
    concept: core
    coreQuestion: all
    type: descriptive
    status: reviewed
    difficulty: 1
    body: 커넥션 풀을 왜 쓰는지, 풀의 연결이 모자라면 무슨 일이 생기는지 1분 안에 설명해 보세요.
    explanation: |-
      **연결을 만드는 비용이 커서, 미리 만들어 둔 연결을 빌려 쓰고 돌려주려고 써요.**

      - 연결을 새로 만들려면 네트워크 접속, 인증, DB 서버의 준비가 필요해요
      - 풀은 연결을 미리 만들어 두고 빌려주고 돌려받아요. 풀에서 빌린 연결의 close()는 반납이에요
      - 연결이 모두 쓰이고 있으면 다음 요청은 기다리고, 정해진 시간 안에 받지 못하면 예외로 실패해요
      - 트랜잭션은 끝날 때까지 연결을 쥐므로 트랜잭션을 짧게 둬요
      - 스프링 부트는 HikariCP를 기본으로 쓰고 기본 최대 크기는 10이에요
    checklist:
      - 연결을 만드는 비용이 크다고 말했다
      - 미리 만들어 두고 빌려주고 돌려받는다고 말했다
      - close()가 반납이라고 말했다
      - 연결이 모자라면 기다리다가 실패한다고 말했다
      - 트랜잭션이 연결을 쥐는 시간을 줄여야 한다고 말했다
    source: https://github.com/brettwooldridge/HikariCP
