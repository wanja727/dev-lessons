questions:
  - key: q-b85daeb5
    concept: core
    type: descriptive
    status: reviewed
    difficulty: 2
    body: 감사 로그를 AOP로 남기는 방법과, 트랜잭션과 함께 쓸 때 주의할 점을 1분 안에 설명해 보세요
    explanation: |-
      - 감사 로그는 여러 서비스에 똑같이 필요한 횡단 관심사. @Audited 어노테이션을 포인트컷으로 쓰는 @Around 애스펙트가 전후 값과 actor, 성공 여부를 기록
      - 트랜잭션 어드바이스(order 0)가 바깥, 감사 애스펙트(order 10)가 안쪽 → SUCCESS 기록은 본 작업과 원자적
      - 실패 기록은 REQUIRES_NEW로 따로 커밋해야 롤백과 함께 사라지지 않음. 예외는 기록 후 다시 던짐
      - 프록시 기반이라 내부 호출, private 메서드는 기록되지 않음
    checklist:
      - 횡단 관심사와 애스펙트(포인트컷, @Around)를 말했다
      - 어드바이스 순서(트랜잭션이 바깥)를 말했다
      - 실패 기록은 REQUIRES_NEW라고 말했다
      - 예외를 다시 던져야 한다고 말했다
      - 내부 호출 한계를 말했다
    source: https://docs.spring.io/spring-framework/reference/core/aop/ataspectj/advice.html
  - key: q-64c1efc5
    concept: core
    type: descriptive
    status: reviewed
    difficulty: 2
    body: 감사 로그를 남기는 방법으로 서비스에 직접 작성, AOP, Hibernate Envers를 비교해 보세요
    explanation: |-
      - 직접 작성: 명확하지만 중복, 빠뜨리기 쉽고 형식이 제각각
      - AOP: 한 곳에 모으고 어노테이션으로 대상 표시. 업무 단위(실패한 시도, 조회 기록)까지 남김. 내부 호출에서 빠짐
      - Envers: 엔티티 변경 이력을 자동으로 남김. 성공한 변경만, 실패 시도나 조회는 못 남김
    checklist:
      - 직접 작성의 누락 위험을 말했다
      - AOP의 장점(한 곳, 어노테이션)을 말했다
      - AOP의 한계(프록시)를 말했다
      - Envers는 엔티티 변경 이력이라고 말했다
      - Envers는 실패 시도를 못 남긴다고 말했다
    source: https://docs.spring.io/spring-framework/reference/core/aop/ataspectj.html
  - key: q-db057512
    concept: core
    type: descriptive
    status: reviewed
    difficulty: 3
    body: 보안 감사에서 "권한 변경 실패 시도가 기록에 없다"는 지적을 받았다. 감사 로그는 AOP로 남기고 있다. 원인과 해결을 말해 보세요
    explanation: |-
      - 원인 후보 1: 실패 기록을 본 작업과 같은 트랜잭션(REQUIRED)에 저장 → 롤백과 함께 사라짐
      - 원인 후보 2: 실패 경로가 내부 호출이라 애스펙트를 안 거침, 또는 애스펙트가 예외를 다른 형태로 처리
      - 해결: 실패 기록 저장을 별도 빈의 REQUIRES_NEW 메서드로, 어드바이스 순서 명시. 테스트로 "예외 후 FAILED 행이 남는다"를 고정
    checklist:
      - 같은 트랜잭션이라 롤백된다고 말했다
      - REQUIRES_NEW를 말했다
      - 저장 메서드를 별도 빈에 둬야 한다고 말했다
      - 내부 호출 가능성을 말했다
      - 테스트로 고정한다고 말했다
    source: https://docs.spring.io/spring-framework/reference/data-access/transaction/declarative/tx-propagation.html
  - key: q-d64e403b
    concept: core
    type: ox
    status: reviewed
    difficulty: 2
    body: "\"감사 애스펙트가 예외를 잡아 FAILED 기록만 남기고 정상 반환해도, 바깥 트랜잭션은 롤백된다\""
    answer: X
    explanation: |-
      - 바깥 트랜잭션 프록시는 예외를 보지 못하니 정상 종료로 보고 커밋한다. 실패한 변경 일부가 반영될 수 있다. 기록 후 반드시 다시 던진다
      - 검증: AuditAspectTest는 다시 던지는 애스펙트로 한도가 100 그대로임을 확인 (failureLogInNewTxSurvives)
    source: https://docs.spring.io/spring-framework/reference/core/aop/ataspectj/advice.html
  - key: q-8e5b3941
    concept: core
    type: code_predict
    status: reviewed
    difficulty: 2
    body: 트랜잭션(order 0)이 감사 애스펙트(order 10)를 감싼다. 실패 기록을 REQUIRED로 저장하고 다시 던지면, 요청 후 audit_log는?
    choices:
      - FAILED 1행
      - SUCCESS 1행
      - 0행
      - FAILED 1행, 한도도 변경됨
    answer: "3"
    explanation: |-
      - 예외가 애스펙트를 지날 때 트랜잭션은 아직 열려 있고, FAILED 행도 그 안에 저장된다. 이어서 통째로 롤백된다
      - 검증: AuditAspectTest (failureLogInSameTxIsLost)
    source: https://docs.spring.io/spring-framework/reference/data-access/transaction/declarative/tx-propagation.html
  - key: q-3af68e5d
    concept: core
    type: multiple_choice
    status: reviewed
    difficulty: 1
    body: "@Audited 메서드인데 감사 로그가 남지 않는 경우는?"
    choices:
      - 컨트롤러가 주입받은 서비스로 호출
      - 같은 클래스의 다른 메서드에서 this로 호출
      - 다른 서비스 빈에서 호출
      - 메서드가 예외 없이 끝남
    answer: "2"
    explanation: |-
      - this는 진짜 객체라서 프록시(애스펙트)를 거치지 않는다. 변경은 일어나고 기록만 빠진다
      - 검증: AuditAspectTest (selfInvocationIsNotAudited)
    source: https://docs.spring.io/spring-framework/reference/core/aop/proxying.html
  - key: q-cbeb7121
    concept: core
    type: line_pick
    status: reviewed
    difficulty: 3
    body: "[코드 14-A] 한도 변경이 실패하면 FAILED 감사 로그를 남기려 한다. 그런데 실패 기록이 하나도 남지 않는다. 원인이 되는 줄은? (트랜잭션 order 0, 애스펙트 order 10)"
    code: |-
      @Around("@annotation(audited)")
      public Object audit(ProceedingJoinPoint pjp, Audited audited) throws Throwable {
          try {
              return pjp.proceed();
          } catch (RuntimeException e) {
              auditRepository.save(failed(audited, e));
              throw e;
          }
      }
    answer: "6"
    explanation: |-
      - 리포지토리 save는 이미 열린 본 작업 트랜잭션에 합류(REQUIRED)해서, 7번 줄 이후 롤백과 함께 사라진다. 고치기: 별도 빈의 @Transactional(propagation = REQUIRES_NEW) 메서드로 저장
      - 7번 줄은 맞다. 다시 던져야 본 작업이 롤백된다
      - 검증: AuditAspectTest (failureLogInSameTxIsLost, failureLogInNewTxSurvives)
    source: https://docs.spring.io/spring-framework/reference/data-access/transaction/declarative/tx-propagation.html
