# AOP 문제
# 형식: https://github.com/wanja727/retrievo/blob/main/docs/content-format.md
#
# 모든 문제는 coreQuestions의 질문 하나에 묶이고(coreQuestion), 답의 근거가 레슨 본문에 있다
# (site/src/content/lesson-pages/aop-audit.yaml의 says).
# 동작에 관한 정답은 verification의 AopLessonTest로 확인했다 (스프링 프레임워크 6.2).
# 질문마다 첫 문제는 본문의 예시로 묻고, 둘째 문제는 다른 상황으로 옮겨 묻는다.
# 2026-11-25에 검수해 reviewed로 바꿨다.
# 2026-11-25에 예전 레슨 "AOP와 감사 로그"의 문제를 지우고 AOP 레슨의 문제로 새로 썼다.
subject:
  key: dev
  name: 개발자 면접
lesson:
  key: aop-audit
  title: AOP
  unit: 스프링
  order: 709
concepts:
  - key: core
    name: AOP
coreQuestions:
  - key: q1
    text: "AOP는 어떻게 서비스 코드를 고치지 않고 기능을 더하나요?"
  - key: q2
    text: "스프링은 프록시를 어떻게 만들고, 어디에는 걸지 못하나요?"
  - key: q3
    text: "같은 클래스 안에서 부르면 왜 기능이 빠지나요?"
  - key: q4
    text: "애스펙트가 여럿이면 어떤 순서로 실행되나요?"
questions:
  # ── 질문 1 ──
  - key: aop-proceed
    concept: core
    coreQuestion: q1
    type: multiple_choice
    status: reviewed
    difficulty: 1
    body: '@Around("@annotation(audited)") 어드바이스에서 jp.proceed() 줄을 지우고 return null;로 바꿨어요. @Audited가 붙은 changeLimit(1, 500)을 부르면 한도는 어떻게 될까요?'
    choices:
      - 500으로 바뀐다
      - 바뀌지 않는다. 원래 메서드가 불리지 않는다
      - 앱이 뜨지 않는다
      - 두 번 바뀐다
    answer: "2"
    explanation: |-
      **바뀌지 않아요.** jp.proceed()가 원래 메서드를 부르는 곳이에요. 부르지 않으면 프록시는 어드바이스만 실행하고 원래 메서드는 실행되지 않아요.

      - @Around는 원래 메서드를 부를지, 무엇을 돌려줄지까지 정할 수 있어 조심해서 써요
    source: https://docs.spring.io/spring-framework/reference/core/aop/ataspectj/advice.html
  - key: aop-timed
    concept: core
    coreQuestion: q1
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: '@Timed 어노테이션과, 걸린 메서드의 실행 시간을 재는 @Around 애스펙트 빈을 만들었어요. OrderService.place에 @Timed를 붙이면, 컨트롤러가 place를 부를 때 시간이 재지는 원리로 맞는 것은 무엇일까요?'
    choices:
      - 컴파일러가 place 안에 시간 재는 코드를 넣는다
      - 컨트롤러가 받은 OrderService가 프록시이고, 프록시가 애스펙트를 실행한 뒤 원래 place를 부른다
      - OrderService가 애스펙트를 직접 부른다
      - '@Timed가 붙은 메서드는 별도 스레드에서 돈다'
    answer: "2"
    explanation: |-
      **프록시가 애스펙트를 실행해요.** 스프링이 OrderService 대신 프록시를 넣어 두고, 호출을 가로채 어드바이스를 실행한 뒤 proceed()로 원래 메서드를 불러요. OrderService 코드에는 시간 재는 코드가 없어요.
    source: https://docs.spring.io/spring-framework/reference/core/aop/proxying.html
  # ── 질문 2 ──
  - key: aop-final
    concept: core
    coreQuestion: q2
    type: code_predict
    status: reviewed
    difficulty: 1
    body: 스프링 부트 기본 설정이에요. 아래 두 메서드를 밖에서 한 번씩 부르면 감사 로그는 몇 줄 남을까요?
    code: |-
      @Service
      public class LimitService {
        @Audited("CHANGE_LIMIT")
        public void changeLimit(
            long id, int limit) { ... }

        @Audited("CHANGE_LIMIT")
        public final void changeLimitFinal(
            long id, int limit) { ... }
      }
    choices:
      - 0줄
      - 1줄
      - 2줄
      - 앱이 뜨지 않는다
    answer: "2"
    explanation: |-
      **1줄이에요.** 스프링 부트는 클래스를 상속해 메서드를 오버라이딩한 CGLIB 프록시를 만들어요. final 메서드는 오버라이딩할 수 없어 어드바이스가 걸리지 않아요.

      - 그 final 메서드는 필드가 빈 프록시 객체 위에서 돌아 주입받은 필드가 null이기도 해요
    source: https://docs.spring.io/spring-framework/reference/core/aop/proxying.html
  - key: aop-final-tx
    concept: core
    coreQuestion: q2
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: '@Transactional을 붙인 PaymentService.pay를 public final로 선언했어요. 스프링 부트 기본 설정에서 pay 안에 트랜잭션이 열릴까요?'
    choices:
      - 열린다
      - 열리지 않는다. @Transactional도 같은 CGLIB 프록시로 동작한다
      - 앱이 뜨지 않는다
      - final이면 JDK 동적 프록시로 바꿔 열린다
    answer: "2"
    explanation: |-
      **열리지 않아요.** @Transactional도 AOP 프록시로 동작해요. final 메서드는 오버라이딩되지 않아 프록시가 트랜잭션을 열 기회가 없어요. 에러도 경고도 없어요.
    source: https://docs.spring.io/spring-framework/reference/core/aop/proxying.html
  # ── 질문 3 ──
  - key: aop-self
    concept: core
    coreQuestion: q3
    type: code_predict
    status: reviewed
    difficulty: 1
    body: 컨트롤러가 아래 LimitService의 resetLimit(1)을 불렀어요. 한도와 감사 로그는 어떻게 될까요?
    code: |-
      @Service
      public class LimitService {
        public void resetLimit(long id) {
          this.changeLimit(id, 0);
        }

        @Audited("CHANGE_LIMIT")
        public void changeLimit(
            long id, int limit) { ... }
      }
    choices:
      - 한도는 0이 되고 감사 로그도 남는다
      - 한도는 0이 되지만 감사 로그는 남지 않는다
      - 한도도 바뀌지 않는다
      - 앱이 뜨지 않는다
    answer: "2"
    explanation: |-
      **한도는 바뀌지만 기록은 없어요.** 원래 객체 안에서 this는 원래 객체라 this.changeLimit은 프록시를 거치지 않아요.

      - changeLimit을 다른 빈으로 옮겨 그 빈을 받아 부르면 기록돼요
    source: https://docs.spring.io/spring-framework/reference/core/aop/proxying.html
  - key: aop-self-timed
    concept: core
    coreQuestion: q3
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: NoticeService.sendAll이 반복문 안에서 this.send(user)를 부르고, send에만 @Timed(시간 재기 애스펙트)가 붙어 있어요. 컨트롤러가 sendAll을 부르면 send의 시간이 기록될까요?
    choices:
      - 기록된다
      - 기록되지 않는다. 내부 호출이라 프록시를 거치지 않는다
      - 첫 번째 send만 기록된다
      - sendAll의 시간으로 함께 기록된다
    answer: "2"
    explanation: |-
      **기록되지 않아요.** 프록시는 밖에서 들어오는 호출만 가로채요. sendAll 안의 this.send는 원래 객체 안의 호출이에요.
    source: https://docs.spring.io/spring-framework/reference/core/aop/proxying.html
  # ── 질문 4 ──
  - key: aop-order
    concept: core
    coreQuestion: q4
    type: multiple_choice
    status: reviewed
    difficulty: 1
    body: '@Order(1) AuditAspect와 @Order(2) TimingAspect가 같은 메서드에 @Around로 걸려 있어요. 기록 순서로 맞는 것은 무엇일까요?'
    choices:
      - Audit 시작, Timing 시작, Timing 끝, Audit 끝
      - Timing 시작, Audit 시작, Audit 끝, Timing 끝
      - Audit 시작, Audit 끝, Timing 시작, Timing 끝
      - Audit 시작, Timing 시작, Audit 끝, Timing 끝
    answer: "1"
    explanation: |-
      **Audit가 Timing을 감싸요.** @Order 값이 작은 애스펙트가 바깥이라 먼저 시작하고 마지막에 끝나요.
    source: https://docs.spring.io/spring-framework/reference/core/aop/ataspectj/advice.html
  - key: aop-order-security
    concept: core
    coreQuestion: q4
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: 같은 메서드에 권한 검사 애스펙트와 캐시 애스펙트가 걸려요. 권한이 없는 사람에게 캐시된 값을 돌려주지 않으려면 어느 쪽의 @Order 값이 작아야 할까요?
    choices:
      - 권한 검사. 바깥에서 먼저 막아야 한다
      - 캐시. 캐시가 먼저 값을 찾아야 빠르다
      - 상관없다. 둘 다 실행된다
      - '@Order로는 정할 수 없다'
    answer: "1"
    explanation: |-
      **권한 검사예요.** 작은 값이 바깥이라 먼저 실행돼요. 캐시가 바깥이면 캐시에 값이 있을 때 안쪽의 권한 검사를 거치지 않고 바로 돌려줘요.
    source: https://docs.spring.io/spring-framework/reference/core/aop/ataspectj/advice.html
  - key: aop-swallow
    concept: core
    coreQuestion: q4
    type: code_predict
    status: reviewed
    difficulty: 2
    body: 아래 애스펙트가 걸린 changeLimit(1, -1)이 IllegalArgumentException을 던졌어요. 호출한 쪽은 어떻게 될까요?
    code: |-
      @Around("@annotation(audited)")
      Object audit(ProceedingJoinPoint jp,
          Audited audited) {
        try {
          return jp.proceed();
        } catch (Throwable e) {
          logs.failure(e);
          return null;
        }
      }
    choices:
      - IllegalArgumentException을 받는다
      - 예외를 받지 않고 성공한 줄 안다
      - NullPointerException을 받는다
      - 앱이 멈춘다
    answer: "2"
    explanation: |-
      **예외를 받지 않아요.** 애스펙트가 예외를 잡고 다시 던지지 않았어요. 트랜잭션 안이었다면 롤백되지 않고 커밋돼요.

      - 기록한 뒤 throw e로 다시 던져요
    source: https://docs.spring.io/spring-framework/reference/core/aop/ataspectj/advice.html
  # ── 전체 ──
  - key: aop-interview
    concept: core
    coreQuestion: all
    type: descriptive
    status: reviewed
    difficulty: 2
    body: 면접에서 "스프링 AOP는 어떻게 동작하고, 어디에 걸리지 않나요?"라는 질문을 받았어요. 1분 안에 답해 보세요.
    explanation: |-
      **빈 대신 프록시를 넣어 어드바이스를 실행하고, 프록시를 거치지 않는 호출에는 걸리지 않아요.**

      - **원리:** 애스펙트에 어드바이스와 포인트컷을 두고, 프록시가 어드바이스를 실행한 뒤 proceed()로 원래 메서드를 부른다
      - **프록시:** 스프링 부트는 CGLIB(상속과 오버라이딩). final, private 메서드와 final 클래스에는 걸리지 않는다
      - **내부 호출:** this로 부르면 프록시를 거치지 않는다. 다른 빈으로 나눈다
      - **순서:** @Order가 작은 것이 바깥. @Transactional도 같은 줄에 선다
    checklist:
      - 스프링이 빈 대신 프록시를 넣어 어드바이스를 실행한다고 말했다
      - CGLIB 프록시라 final이나 private 메서드에 걸리지 않는다고 말했다
      - 같은 클래스 안의 this 호출에는 걸리지 않는다고 말했다
      - '@Order로 애스펙트 순서를 정한다고 말했다'
    source: https://docs.spring.io/spring-framework/reference/core/aop/proxying.html
