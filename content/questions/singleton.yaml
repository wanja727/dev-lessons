# 싱글톤 패턴 문제
# 형식: https://github.com/wanja727/retrievo/blob/main/docs/content-format.md
#
# 모든 문제는 coreQuestions의 질문 하나에 묶이고(coreQuestion), 답의 근거가 레슨 본문에 있다
# (site/src/content/lesson-pages/singleton.yaml의 says).
# 동작에 관한 정답은 verification의 SingletonTest로 확인했다 (자바 21, 스프링 부트 3.5).
# 질문마다 첫 문제는 본문의 예시로 묻고, 둘째 문제는 다른 상황으로 옮겨 묻는다.
# 2026-11-25에 만들고 같은 날 검수해 reviewed로 바꿨다.
subject:
  key: dev
  name: 개발자 면접
lesson:
  key: singleton
  title: 싱글톤 패턴
  unit: 객체지향 설계와 패턴
  order: 311
concepts:
  - key: core
    name: 싱글톤 패턴
coreQuestions:
  - key: q1
    text: "싱글톤은 어떻게 만드나요?"
    answer: "생성자를 `private`으로 막고, 만든 하나를 `static`으로 들고 있다가 꺼내 줘요. 미리 만들기, 처음 쓸 때 만들기, 홀더 클래스, enum 네 가지 방법이 있어요. 스레드에 안전하면서 처음 쓸 때 만드는 방법은 홀더 클래스와 enum이에요. JVM이 클래스 초기화를 한 번만 하기 때문이에요."
    points:
      - "생성자를 `private`으로 막아 밖에서 만들지 못하게 해요"
      - "만든 하나를 `static`으로 들고 있다가 꺼내 줘요"
  - key: q2
    text: "여러 스레드에서 써도 하나만 만들어지나요?"
    answer: "`if (instance == null)`로 처음 쓸 때 만드는 방식은 아니에요. 두 스레드가 동시에 처음 부르면 둘 이상 만들어질 수 있어요. 미리 만들기, 홀더 클래스, enum은 JVM의 클래스 초기화에 기대서 하나만 만들어져요."
    points:
      - "`if (instance == null)`로 처음 쓸 때 만드는 방식은 두 스레드가 동시에 처음 부르면 둘 이상 만들어질 수 있어요"
      - "미리 만들기, 홀더 클래스, enum은 JVM이 클래스 초기화를 한 번만 해서 하나만 만들어져요 (방법 하나 이상과 이 이유를 말하면 돼요)"
  - key: q3
    text: "싱글톤은 왜 테스트하기 어렵나요?"
    answer: "쓰는 쪽이 `getInstance()`를 직접 불러서 가짜로 바꿀 수 없고, 하나뿐인 객체의 상태가 테스트 사이에 남기 때문이에요. 싱글톤을 생성자로 주입받게 바꾸면 테스트에서는 가짜를, 운영에서는 그 하나를 넣을 수 있어요."
    points:
      - "쓰는 쪽이 `getInstance()`를 직접 불러서 가짜로 바꿀 수 없어요"
      - "하나뿐인 객체의 상태가 테스트 사이에 남아요"
  - key: q4
    text: "스프링의 싱글톤은 싱글톤 패턴과 무엇이 다른가요?"
    answer: "스프링 싱글톤은 클래스가 막는 것이 아니라 컨테이너가 빈을 하나만 만들어 나눠 주는 것이에요. 그래서 클래스는 평범하게 두고 생성자로 주입받을 수 있어요. 대신 `new`로는 얼마든지 더 만들 수 있고, 컨테이너가 둘이면 빈도 둘이에요."
    points:
      - "싱글톤 패턴은 클래스가 생성자를 막아 스스로 하나임을 지켜요"
      - "스프링 싱글톤은 클래스는 평범하고, 컨테이너가 빈을 하나만 만들어 나눠 줘요"
questions:
  # ── 질문 1 ──
  - key: si-holder-lazy
    concept: core
    coreQuestion: q1
    type: code_predict
    status: reviewed
    difficulty: 1
    body: 아래 AppConfig에서 다른 static 메서드 version()만 불렀어요. 이때 AppConfig 객체는 몇 개 만들어졌을까요?
    code: |-
      class AppConfig {
        private AppConfig() {...}
        private static class Holder {
          static final AppConfig INSTANCE =
              new AppConfig();
        }
        static AppConfig getInstance() {
          return Holder.INSTANCE;
        }
        static String version() {
          return "1.0";
        }
      }

      AppConfig.version();
    choices:
      - 0개
      - 1개
      - 2개
    answer: "1"
    explanation: |-
      **0개예요.** 객체는 Holder의 static 필드라서 Holder가 처음 쓰일 때 만들어져요. version()은 Holder를 쓰지 않아요.

      - getInstance()가 처음 Holder.INSTANCE를 읽을 때 만들어져요
    source: https://github.com/wanja727/dev-lessons/blob/main/verification/src/test/java/lab/devlessons/singleton/SingletonTest.java
  - key: si-private-ctor
    concept: core
    coreQuestion: q1
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: class IdGenerator { private IdGenerator() {} static final IdGenerator INSTANCE = new IdGenerator(); }가 있어요. 다른 클래스에서 new IdGenerator()를 쓰면 어떻게 될까요?
    choices:
      - 두 번째 객체가 만들어진다
      - 컴파일 오류
      - INSTANCE가 돌아온다
    answer: "2"
    explanation: |-
      **컴파일 오류예요.** 생성자가 private이라 밖에서 부를 수 없어요.

      - 싱글톤의 네 방법 모두 생성자를 막아서 만드는 곳을 클래스 안 한 곳으로 둬요
    source: https://github.com/wanja727/dev-lessons/blob/main/verification/src/test/java/lab/devlessons/singleton/SingletonTest.java
  # ── 질문 2 ──
  - key: si-lazy-race
    concept: core
    coreQuestion: q2
    type: multiple_choice
    status: reviewed
    difficulty: 1
    body: getInstance()가 if (instance == null) { instance = new AppConfig(); }로 처음 쓸 때 만들어요. 생성자는 0.1초 걸려요. 두 스레드가 동시에 처음 부르면 어떻게 될 수 있을까요?
    choices:
      - 언제나 객체 하나만 만들어진다
      - 둘 다 null을 보고 각자 만들어 객체가 둘 생길 수 있다
      - 두 번째 스레드는 예외를 받는다
    answer: "2"
    explanation: |-
      **객체가 둘 생길 수 있어요.** 한 스레드가 생성자를 실행하는 동안 instance는 아직 null이라, 다른 스레드도 확인을 통과해요.

      - 테스트에서 열 번 돌려 열 번 모두 두 번 만들어졌어요
    source: https://github.com/wanja727/dev-lessons/blob/main/verification/src/test/java/lab/devlessons/singleton/SingletonTest.java
  - key: si-which-safe
    concept: core
    coreQuestion: q2
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: 다음 가운데 여러 스레드가 동시에 처음 꺼내도 객체가 하나만 만들어지는 것을 모두 고르면?
    choices:
      - static final 필드에 미리 만든 것과 enum의 상수
      - if (x == null) x = new X();로 만드는 getInstance와 enum의 상수
      - 매번 new X()를 돌려주는 getInstance
    answer: "1"
    explanation: |-
      **미리 만든 static final 필드와 enum이에요.** 둘 다 클래스가 초기화될 때 만들어지고, JVM이 클래스 초기화를 한 스레드만 하게 지켜요.

      - if 확인으로 처음 쓸 때 만드는 방식은 동시에 부르면 둘 이상 생길 수 있어요
    source: https://docs.oracle.com/javase/specs/jls/se21/html/jls-12.html#jls-12.4.2
  # ── 질문 3 ──
  - key: si-hidden
    concept: core
    coreQuestion: q3
    type: multiple_choice
    status: reviewed
    difficulty: 1
    body: OrderService.shippingFee()가 메서드 안에서 AppConfig.getInstance().getInt("shipping.fee")를 불러요. OrderService를 고치지 않고, 배송비가 5000원일 때를 테스트할 수 있을까요?
    choices:
      - 있다. 테스트에서 가짜 AppConfig를 넘긴다
      - 없다. 진짜 설정을 바꿔야 한다
    answer: "2"
    explanation: |-
      **없어요.** OrderService가 getInstance()를 직접 불러서 테스트가 다른 객체를 넣을 자리가 없어요.

      - AppConfig를 생성자로 받게 바꾸면 테스트에서 원하는 값을 넣을 수 있어요
    source: https://github.com/wanja727/dev-lessons/blob/main/verification/src/test/java/lab/devlessons/singleton/SingletonTest.java
  - key: si-counter-order
    concept: core
    coreQuestion: q3
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: 테스트 A가 싱글톤 카운터를 3 올리고, 테스트 B는 카운터가 0인지 확인해요. 같은 JVM에서 B만 돌리면 통과해요. A 다음 B를 돌리면?
    choices:
      - 통과한다. 테스트마다 새로 만든다
      - 실패한다. A가 올린 3이 남아 있다
      - 컴파일 오류
    answer: "2"
    explanation: |-
      **실패해요.** 싱글톤은 JVM에 하나라서 A가 바꾼 상태가 B까지 남아요.

      - 테스트 순서에 따라 결과가 달라지는 테스트가 돼요
    source: https://github.com/wanja727/dev-lessons/blob/main/verification/src/test/java/lab/devlessons/singleton/SingletonTest.java
  # ── 질문 4 ──
  - key: si-get-bean
    concept: core
    coreQuestion: q4
    type: multiple_choice
    status: reviewed
    difficulty: 1
    body: '@Component class AppConfig가 있어요. 같은 컨테이너에서 ctx.getBean(AppConfig.class)를 두 번 부른 결과를 ==로 비교하면? 그리고 new AppConfig()와 비교하면?'
    choices:
      - true, true
      - true, false
      - false, false
    answer: "2"
    explanation: |-
      **true와 false예요.** 컨테이너는 빈을 하나만 만들어 나눠 주지만, new는 컨테이너를 거치지 않아 새 객체예요.

      - 스프링 싱글톤은 클래스가 막는 것이 아니라 컨테이너가 하나만 만드는 것이에요
    source: https://docs.spring.io/spring-framework/reference/core/beans/factory-scopes.html#beans-factory-scopes-singleton
  - key: si-two-containers
    concept: core
    coreQuestion: q4
    type: ox
    status: reviewed
    difficulty: 2
    body: "\"같은 클래스를 등록한 스프링 컨테이너를 둘 만들면, 두 컨테이너의 그 빈은 같은 객체다\""
    answer: X
    explanation: |-
      **다른 객체예요.** 스프링 싱글톤은 컨테이너마다 하나예요.

      - 싱글톤 패턴은 클래스 로더에 하나, 스프링 싱글톤은 컨테이너에 하나예요
    source: https://github.com/wanja727/dev-lessons/blob/main/verification/src/test/java/lab/devlessons/singleton/SingletonTest.java
  - key: si-stateful-bean
    concept: core
    coreQuestion: q4
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: 싱글톤 빈 OrderService가 필드 private int lastTotal에 요청의 주문 금액을 넣고, 몇 줄 뒤에 lastTotal을 읽어 돌려줘요. 두 요청이 동시에 오면 무슨 일이 생길 수 있을까요?
    choices:
      - 요청마다 빈이 새로 만들어져 문제가 없다
      - 한 요청이 다른 요청의 금액을 읽을 수 있다
      - 컴파일 오류
    answer: "2"
    explanation: |-
      **다른 요청의 금액을 읽을 수 있어요.** 모든 요청이 같은 빈 객체의 같은 필드를 써요.

      - 요청의 값은 지역 변수나 메서드 인자로 다뤄요
    source: https://github.com/wanja727/dev-lessons/blob/main/verification/src/test/java/lab/devlessons/singleton/SingletonTest.java
  # ── 네 질문을 하나로 ──
  - key: si-interview
    concept: core
    coreQuestion: all
    type: descriptive
    status: reviewed
    difficulty: 2
    body: 면접에서 "싱글톤 패턴을 만드는 방법과 문제점, 스프링 싱글톤과의 차이를 설명해 주세요"라는 질문을 받았어요. 1분 안에 답해 보세요.
    explanation: |-
      **private 생성자로 하나만 만드는 패턴이고, 스레드와 테스트에서 문제가 생기며, 스프링은 컨테이너가 하나를 만들어 줘요.**

      - **방법:** 미리 만들기, 처음 쓸 때 만들기, 홀더 클래스, enum
      - **스레드:** if null 방식은 동시에 처음 부르면 둘 생길 수 있다. 홀더와 enum은 클래스 초기화 덕에 안전
      - **테스트:** getInstance를 직접 부르면 가짜로 못 바꾸고 상태가 테스트 사이에 남는다
      - **스프링:** 컨테이너마다 하나. 평범한 클래스를 주입받는다. 빈 필드에 요청 값을 두지 않는다
    checklist:
      - 생성자를 private으로 막는다고 말했다
      - if null로 늦게 만들면 여러 스레드에서 둘 생길 수 있다고 말했다
      - 홀더 클래스나 enum이 안전한 이유(클래스 초기화)를 말했다
      - 테스트에서 가짜로 바꾸기 어렵고 상태가 남는다고 말했다
      - 스프링 싱글톤은 컨테이너가 하나를 만드는 것이라고 말했다
    source: https://github.com/wanja727/dev-lessons/blob/main/verification/src/test/java/lab/devlessons/singleton/SingletonTest.java
