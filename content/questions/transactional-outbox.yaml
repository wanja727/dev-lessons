# 트랜잭셔널 아웃박스 문제
# 형식: https://github.com/wanja727/retrievo/blob/main/docs/content-format.md
#
# 모든 문제는 coreQuestions의 질문 하나에 묶이고(coreQuestion), 답의 근거가 레슨 본문에 있다
# (site/src/content/lesson-pages/transactional-outbox.yaml의 says).
# 동작에 관한 정답은 verification의 TransactionalOutboxTest로 확인했다 (스프링 부트 3.5, PostgreSQL 16).
# 질문마다 첫 문제는 본문의 예시로 묻고, 둘째 문제는 다른 상황으로 옮겨 묻는다.
# 2026-11-25에 핵심 질문 구조로 다시 쓰면서 예전 문제를 지우고 새로 썼다.
subject:
  key: dev
  name: 개발자 면접
lesson:
  key: transactional-outbox
  title: 트랜잭셔널 아웃박스
  unit: 시스템 설계와 아키텍처
  order: 918
concepts:
  - key: core
    name: 트랜잭셔널 아웃박스
coreQuestions:
  - key: q1
    text: "DB 저장과 메시지 발행은 왜 어긋나나요?"
  - key: q2
    text: "커밋한 뒤에 보내면 해결되나요?"
  - key: q3
    text: "아웃박스는 어떻게 둘을 맞추나요?"
  - key: q4
    text: "아웃박스가 남기는 문제는 무엇인가요?"
questions:
  # ── 질문 1 ──
  - key: ob-direct-rollback
    concept: core
    coreQuestion: q1
    type: code_predict
    status: draft
    difficulty: 1
    body: 아래 코드에서 checkStock이 예외를 던져 트랜잭션이 롤백됐어요. 주문 테이블과 브로커가 받은 메시지는?
    code: |-
      @Transactional
      public Long place(String item) {
        Order o = orders.saveAndFlush(
            new Order(item));
        broker.send(toMessage(o));
        checkStock(o);
        return o.getId();
      }
    choices:
      - 주문 0행, 메시지 0개
      - 주문 1행, 메시지 1개
      - 주문 1행, 메시지 0개
      - 주문 0행, 메시지 1개
    answer: "4"
    explanation: |-
      **주문은 롤백되고 메시지는 나가 있어요.** 브로커는 DB 트랜잭션에 묶이지 않아요.

      - 없는 주문의 유령 메시지가 생겨요
      - 테스트에서도 주문 0행, 메시지 1개였어요
    source: https://microservices.io/patterns/data/transactional-outbox.html
  - key: ob-welcome-mail
    concept: core
    coreQuestion: q1
    type: multiple_choice
    status: draft
    difficulty: 2
    body: 회원 가입 트랜잭션 안에서 가입 축하 메일을 바로 보냈는데, 그 뒤 커밋에서 실패했어요. 회원과 메일은 어떻게 되나요?
    choices:
      - 회원은 없고 메일은 나갔다
      - 회원도 메일도 없다
      - 회원은 있고 메일은 없다
      - 커밋이 실패하면 메일 서버가 메일을 회수한다
    answer: "1"
    explanation: |-
      **회원은 없고 메일은 나갔어요.** 메일 발송은 DB 트랜잭션과 따로라 롤백되지 않아요.

      - DB와 바깥 시스템은 한 트랜잭션으로 묶이지 않아요
    source: https://microservices.io/patterns/data/transactional-outbox.html
  # ── 질문 2 ──
  - key: ob-after-commit-down
    concept: core
    coreQuestion: q2
    type: multiple_choice
    status: draft
    difficulty: 1
    body: 주문을 저장하고 @TransactionalEventListener(AFTER_COMMIT) 리스너가 커밋 뒤에 브로커로 보내요. 커밋 뒤 보낼 때 브로커가 죽어 있었어요. 결과로 맞는 것은?
    choices:
      - 주문도 롤백된다
      - 주문은 남고 메시지는 사라지며, place()를 부른 쪽은 예외를 받지 않는다
      - 리스너가 브로커가 살아날 때까지 기다렸다가 보낸다
      - place()가 예외를 던진다
    answer: "2"
    explanation: |-
      **주문은 남고 메시지는 사라져요.** 커밋 뒤 리스너의 예외는 호출한 쪽에 전해지지 않아요.

      - 테스트에서 place()는 예외 없이 끝났고 주문 1행, 메시지 0개였어요
      - 유령 메시지 대신 잃어버린 메시지가 생겨요
    source: https://docs.spring.io/spring-framework/reference/data-access/transaction/event.html
  - key: ob-after-commit-crash
    concept: core
    coreQuestion: q2
    type: multiple_choice
    status: draft
    difficulty: 2
    body: AFTER_COMMIT 리스너로 포인트 적립 메시지를 보내요. 주문이 커밋된 직후, 리스너가 보내기 전에 서버가 꺼졌어요. 서버가 다시 뜨면 어떻게 되나요?
    choices:
      - 메시지가 저절로 다시 나간다
      - 주문도 사라진다
      - 주문은 있고 메시지는 영영 나가지 않는다
      - 메시지가 두 번 나간다
    answer: "3"
    explanation: |-
      **주문은 있고 메시지는 나가지 않아요.** 보낼 메시지는 메모리에만 있었어요.

      - 보낼 것을 DB에 적어 두는 아웃박스가 이 문제를 풀어요
    source: https://docs.spring.io/spring-framework/reference/data-access/transaction/event.html
  # ── 질문 3 ──
  - key: ob-outage
    concept: core
    coreQuestion: q3
    type: multiple_choice
    status: draft
    difficulty: 1
    body: 아웃박스 방식에서 브로커가 죽어 있는 동안 주문 2건이 들어왔어요. 릴레이는 1회차에 보내지 못했고, 그 뒤 브로커가 살아났어요. 다음 릴레이가 돈 뒤 브로커가 받은 메시지는?
    choices:
      - 0개
      - 1개
      - 4개
      - 2개
    answer: "4"
    explanation: |-
      **2개예요.** 주문과 아웃박스 행이 함께 커밋돼 있다가, 브로커가 살아나자 릴레이가 보냈어요.

      - 브로커 장애 중에도 주문은 성공했어요
      - 테스트에서도 2회차에 2개를 보냈어요
    source: https://microservices.io/patterns/data/transactional-outbox.html
  - key: ob-outbox-rollback
    concept: core
    coreQuestion: q3
    type: code_predict
    status: draft
    difficulty: 2
    body: 아래 코드에서 checkStock이 예외를 던져 롤백됐어요. 그 뒤 릴레이가 돌면 이 주문의 메시지는 어떻게 되나요?
    code: |-
      @Transactional
      public Long place(String item) {
        Order o = orders.saveAndFlush(...);
        outbox.save(new OutboxEvent(
            "OrderPlaced", payload(o)));
        checkStock(o);
        return o.getId();
      }
    choices:
      - 나가지 않는다. 아웃박스 행도 함께 롤백됐다
      - 나간다
      - 두 번 나간다
      - 릴레이가 예외를 던진다
    answer: "1"
    explanation: |-
      **나가지 않아요.** 아웃박스 행은 주문과 같은 트랜잭션이라 함께 롤백됐어요.

      - 릴레이가 읽을 행이 없어요
    source: https://microservices.io/patterns/data/transactional-outbox.html
  # ── 질문 4 ──
  - key: ob-relay-crash
    concept: core
    coreQuestion: q4
    type: multiple_choice
    status: draft
    difficulty: 1
    body: 릴레이가 브로커에 메시지를 보낸 직후, published_at을 표시하기 전에 죽었어요. 다시 뜬 릴레이는 그 메시지를 어떻게 하나요?
    choices:
      - 건너뛴다
      - 지운다
      - 안 보낸 것으로 남아 있으니 다시 보낸다
      - 다른 메시지로 바꿔 보낸다
    answer: "3"
    explanation: |-
      **다시 보내요.** 표시가 없으니 안 보낸 것으로 보여요(최소 한 번).

      - 테스트에서 같은 event_id의 메시지가 2개 나갔고, 걸러서 1번 처리했어요
    source: https://microservices.io/patterns/data/transactional-outbox.html
  - key: ob-mark-first
    concept: core
    coreQuestion: q4
    type: code_predict
    status: draft
    difficulty: 2
    body: 중복을 막으려고 릴레이를 아래처럼 바꿨어요. 표시를 저장한 뒤 send 직전에 서버가 꺼지면 어떻게 되나요?
    code: |-
      for (OutboxEvent e : pending) {
        e.markPublished();
        outbox.save(e);
        broker.send(e.toMessage());
      }
    choices:
      - 다시 뜬 릴레이가 그 메시지를 보낸다
      - 그 메시지는 보낸 것으로 남아 영영 나가지 않는다
      - 두 번 나간다
      - 주문이 롤백된다
    answer: "2"
    explanation: |-
      **메시지를 잃어요.** 표시를 먼저 해서 보낸 것으로 남았어요.

      - 순서는 보내고 그다음 표시예요
      - 생기는 중복은 받는 쪽이 event_id로 걸러요
    source: https://microservices.io/patterns/data/transactional-outbox.html
  - key: ob-many-relays
    concept: core
    coreQuestion: q4
    type: multiple_choice
    status: draft
    difficulty: 2
    body: 서버 3대가 각자 @Scheduled 릴레이를 돌려요. 같은 아웃박스 행을 두 릴레이가 함께 보내지 않게 하는 PostgreSQL의 방법은?
    choices:
      - select ... for update skip locked로 읽어, 다른 릴레이가 잠근 행은 건너뛴다
      - 릴레이를 더 자주 돌린다
      - 아웃박스 테이블을 서버마다 만든다
      - published_at을 먼저 표시한다
    answer: "1"
    explanation: |-
      **FOR UPDATE SKIP LOCKED예요.** 행을 잠그며 읽고, 이미 잠긴 행은 건너뛰어 릴레이마다 다른 행을 가져가요.

      - 근거는 PostgreSQL 문서예요
    source: https://www.postgresql.org/docs/16/sql-select.html
  # ── 네 질문을 하나로 ──
  - key: ob-interview
    concept: core
    coreQuestion: all
    type: descriptive
    status: draft
    difficulty: 2
    body: 면접에서 "DB 저장과 메시지 발행을 어떻게 맞추나요?"라는 질문을 받았어요. 1분 안에 답해 보세요.
    explanation: |-
      **보낼 메시지를 같은 트랜잭션의 아웃박스 테이블에 적고, 릴레이가 따로 보내요.**

      - **문제:** DB와 브로커는 한 트랜잭션이 아니다. 바로 보내면 유령 메시지, 커밋 뒤에 보내면 잃어버린 메시지
      - **아웃박스:** 주문과 메시지 행이 함께 커밋되거나 롤백된다
      - **릴레이:** 안 보낸 행을 순서대로 보내고 표시한다. 브로커가 죽어도 나중에 보낸다
      - **남는 것:** 최소 한 번이라 받는 쪽이 event_id로 거른다. 늦음, 테이블 정리, SKIP LOCKED
    checklist:
      - DB와 브로커가 한 트랜잭션으로 묶이지 않는다고 말했다
      - 바로 보내기나 커밋 뒤 보내기의 문제를 말했다
      - 같은 트랜잭션에 아웃박스 행을 저장한다고 말했다
      - 릴레이가 따로 보낸다고 말했다
      - 중복이 생겨 받는 쪽이 거른다고 말했다
    source: https://microservices.io/patterns/data/transactional-outbox.html
