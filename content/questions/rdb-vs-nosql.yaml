# 관계형 DB와 NoSQL 문제
# 형식: https://github.com/wanja727/retrievo/blob/main/docs/content-format.md
#
# 모든 문제는 coreQuestions의 질문 하나에 묶이고(coreQuestion), 답의 근거가 레슨 본문에 있다
# (site/src/content/lesson-pages/rdb-vs-nosql.yaml의 says).
# 동작에 관한 정답은 verification의 RdbVsNosqlTest로 확인했다 (PostgreSQL 16의 jsonb로 문서 모델을 흉내 냈다).
# 2026-11-25에 만들고 같은 날 검수해 reviewed로 바꿨다.
# 질문마다 첫 문제는 본문의 예시로 묻고, 둘째 문제는 다른 상황으로 옮겨 묻는다.
subject:
  key: dev
  name: 개발자 면접
lesson:
  key: rdb-vs-nosql
  title: 관계형 DB와 NoSQL
  unit: DB
  order: 612
concepts:
  - key: core
    name: 관계형 DB와 NoSQL
coreQuestions:
  - key: q1
    text: "관계형 DB는 무엇을 약속하나요?"
  - key: q2
    text: "NoSQL은 무엇을 다르게 하나요?"
  - key: q3
    text: "함께 읽는 것을 한 문서에 담으면 무엇을 얻고 잃나요?"
  - key: q4
    text: "언제 무엇을 고르나요?"
questions:
  # ── 질문 1 ──
  - key: nosql-rdb-reject
    concept: core
    coreQuestion: q1
    type: multiple_choice
    status: reviewed
    difficulty: 1
    body: "관계형 DB의 주문 항목 테이블에 `qty int not null check (qty > 0)`이 있어요. 수량에 `'two'`라는 글자를 넣는 INSERT를 보내면?"
    choices:
      - 들어간다. 읽을 때 앱이 해석한다
      - DB가 거절한다
      - 0으로 바뀌어 들어간다
      - NULL로 들어간다
    answer: "2"
    explanation: |-
      **DB가 거절해요(22P02).** 관계형의 스키마는 쓸 때 검사해요.

      - 0을 넣으면 CHECK가 23514로 막아요
      - 잘못된 데이터가 어느 코드에서 들어오든 DB가 막아요
    source: https://www.postgresql.org/docs/16/ddl-constraints.html
  - key: nosql-rdb-tx
    concept: core
    coreQuestion: q1
    type: multiple_choice
    status: reviewed
    difficulty: 1
    body: "결제를 기록하고 포인트를 차감하는 두 일이 반드시 함께 되거나 함께 안 되어야 해요. 두 일은 서로 다른 테이블을 고쳐요. 관계형 DB에서 무엇으로 보장하나요?"
    choices:
      - 외래 키
      - 인덱스
      - 두 문장을 하나로 묶는 트랜잭션
      - 정규화
    answer: "3"
    explanation: |-
      **트랜잭션이에요.** 여러 테이블의 변경을 함께 커밋하거나 함께 롤백해요.

      - 관계형 DB가 약속하는 핵심 가운데 하나예요
      - 여러 덩어리를 묶는 트랜잭션은 NoSQL 제품마다 지원이 달라요
    source: https://www.postgresql.org/docs/16/tutorial-transactions.html
  # ── 질문 2 ──
  - key: nosql-kinds-session
    concept: core
    coreQuestion: q2
    type: multiple_choice
    status: reviewed
    difficulty: 1
    body: "로그인 세션을 세션 id로 찾아 읽기만 해요. NoSQL의 종류 가운데 가장 맞는 것은?"
    choices:
      - 키-값
      - 그래프
      - 와이드 컬럼
      - 문서
    answer: "1"
    explanation: |-
      **키-값이에요.** 키 하나로 값 하나를 빠르게 읽고 쓰는 일이에요.

      - Redis가 대표적이에요
      - 그래프는 점과 선의 관계를 따라가는 데이터에 맞아요
    source: https://www.postgresql.org/docs/16/datatype-json.html
  - key: nosql-field-typo
    concept: core
    coreQuestion: q2
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: "스키마를 읽을 때 해석하는 문서 저장소에 회원 문서를 넣어요. 한 문서는 `phone`, 다른 문서는 실수로 `phoneNumber`라는 필드 이름으로 넣었어요. 저장소가 막아 주나요?"
    choices:
      - 막는다. 같은 컬렉션은 같은 필드를 가져야 한다
      - 막지 않는다. 둘 다 들어가고, 검사는 앱의 몫이다
      - 둘째 문서의 필드를 phone으로 바꿔 넣는다
      - 둘째 문서는 읽을 수 없다
    answer: "2"
    explanation: |-
      **막지 않아요.** 문서마다 필드가 달라도 들어가요.

      - 모양이 제각각인 데이터에는 편하지만, 실수도 그대로 들어가요
      - 관계형은 스키마에 없는 열을 쓰면 거절해요
    source: https://www.postgresql.org/docs/16/datatype-json.html
  # ── 질문 3 ──
  - key: nosql-rename-docs
    concept: core
    coreQuestion: q3
    type: multiple_choice
    status: reviewed
    difficulty: 1
    body: "주문 문서 1만 개마다 회원 이름을 복사해 두었어요. kim의 주문은 300개예요. kim이 이름을 바꾸면 몇 개의 문서를 고쳐야 하나요?"
    choices:
      - "1개"
      - "300개"
      - "1만 개"
      - "0개. 이름은 문서에 남아도 된다"
    answer: "2"
    explanation: |-
      **300개예요.** 이름을 복사해 둔 kim의 주문 문서를 모두 고쳐야 해요.

      - 하나라도 빠뜨리면 같은 회원의 이름이 둘이 돼요
      - 관계형은 회원 테이블 한 행만 고쳐요
    source: https://www.postgresql.org/docs/16/datatype-json.html
  - key: nosql-blog-comments
    concept: core
    coreQuestion: q3
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: "블로그 글 문서 안에 그 글의 댓글을 모두 넣었어요. 인기 글에는 댓글이 수만 개 달려요. 어떤 문제가 생기나요?"
    choices:
      - 없다. 한 번에 읽으니 늘 빠르다
      - 글 문서가 계속 커지고, 댓글 하나를 달 때마다 큰 문서를 고친다
      - 댓글을 더 달 수 없다
      - 댓글을 읽을 때 조인이 필요하다
    answer: "2"
    explanation: |-
      **글 문서가 끝없이 커지고, 작은 변경에도 큰 문서를 고쳐요.**

      - 한 문서에는 함께 읽고 함께 바뀌는 것만 넣어요
      - 따로 계속 늘어나는 댓글은 따로 두는 편이 나아요
    source: https://www.postgresql.org/docs/16/datatype-json.html
  # ── 질문 4 ──
  - key: nosql-choose-payment
    concept: core
    coreQuestion: q4
    type: multiple_choice
    status: reviewed
    difficulty: 1
    body: "결제와 포인트 차감이 함께 되어야 하고, 회원과 주문을 가리키는 데이터예요. 주 저장소로 가장 맞는 것은?"
    choices:
      - 관계형 DB
      - 키-값 저장소
      - 그래프 DB
      - 로그 파일
    answer: "1"
    explanation: |-
      **관계형 DB예요.** 서로를 가리키는 데이터에 제약과 트랜잭션이 필요해요.

      - 대부분의 서비스는 관계형을 주 저장소로 두고 NoSQL을 더해요
    source: https://www.postgresql.org/docs/16/tutorial-transactions.html
  - key: nosql-view-count
    concept: core
    coreQuestion: q4
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: "상품 상세 페이지의 조회수가 초당 수천 번 올라요. 몇 개를 잃어도 큰일은 아니에요. 관계형 DB에 매번 UPDATE하는 대신 고를 만한 것은?"
    choices:
      - Redis 같은 키-값 저장소에서 올리고 가끔 DB에 옮긴다
      - 그래프 DB에 담는다
      - 조회수마다 새 테이블을 만든다
      - 조회수를 jsonb 문서에 복사해 둔다
    answer: "1"
    explanation: |-
      **키-값 저장소에서 빠르게 올리고 가끔 모아 옮겨요.**

      - 자주 바뀌고 정확도보다 속도가 중요한 값이에요
      - 주 저장소는 그대로 관계형이에요
    source: https://www.postgresql.org/docs/16/datatype-json.html
  - key: nosql-all-jsonb
    concept: core
    coreQuestion: q4
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: "스키마를 정하기 귀찮아서 상품 엔티티의 모든 속성(이름, 가격, 상태, 색, 사이즈)을 `jsonb` 열 하나에 넣었어요. 가장 먼저 생길 문제는?"
    choices:
      - 상품을 저장할 수 없다
      - 가격과 상태처럼 찾고 검사할 값에 제약을 걸 수 없고, 잘못된 값이 그대로 들어간다
      - 조회가 항상 더 빨라진다
      - 하이버네이트가 엔티티를 만들지 못한다
    answer: "2"
    explanation: |-
      **찾고 검사해야 할 값까지 검사 없이 들어가요.**

      - 찾고 검사할 값은 열로 두고, 제각각인 부가 속성(색, 사이즈)만 jsonb로 둬요
      - jsonb는 관계형 안에 문서 칸 하나를 두는 도구예요
    source: https://www.postgresql.org/docs/16/datatype-json.html
  # ── 면접 질문 ──
  - key: nosql-interview
    concept: core
    coreQuestion: all
    type: descriptive
    status: reviewed
    difficulty: 2
    body: 면접에서 "관계형 DB와 NoSQL의 차이와, 언제 무엇을 쓰는지 설명해 주세요"라는 질문을 받았어요. 1분 안에 답해 보세요.
    explanation: |-
      **관계형은 스키마, 제약, 조인, 트랜잭션을 약속하고, NoSQL은 함께 읽는 것을 한 덩어리로 담아 빠르게 읽고 나눠 담기 쉽게 했어요.**

      - **관계형:** 나눠 담고 조인으로 붙인다. 쓸 때 검사. 여러 행 트랜잭션
      - **NoSQL:** 키-값, 문서, 와이드 컬럼, 그래프. 읽을 때 해석하는 스키마
      - **대가:** 복사해 둔 값은 모두 고쳐야 하고, 검사는 앱이 한다
      - **고르기:** 주문과 결제는 관계형, 세션과 캐시는 키-값, 제각각인 데이터는 문서. 대개 함께 쓴다
    checklist:
      - 관계형이 스키마와 제약, 조인, 트랜잭션을 약속한다고 말했다
      - NoSQL이 여러 종류를 묶는 말이고 대표 종류를 들었다
      - 한 덩어리로 담으면 읽기가 편한 대신 복사본을 맞춰야 한다고 말했다
      - 데이터의 성격에 따라 저장소를 고른다고 말했다
      - 관계형을 주 저장소로 두고 NoSQL을 함께 쓴다고 말했다
    source: https://www.postgresql.org/docs/16/datatype-json.html
