# 스프링 이벤트 문제
# 형식: https://github.com/wanja727/retrievo/blob/main/docs/content-format.md
#
# 모든 문제는 coreQuestions의 질문 하나에 묶이고(coreQuestion), 답의 근거가 레슨 본문에 있다
# (site/src/content/lesson-pages/spring-events.yaml의 says).
# 동작에 관한 정답은 verification의 SpringEventsTest로 확인했다 (스프링 부트 3.5, PostgreSQL 16).
# 질문마다 첫 문제는 본문의 예시로 묻고, 둘째 문제는 다른 상황으로 옮겨 묻는다.
subject:
  key: dev
  name: 개발자 면접
lesson:
  key: spring-events
  title: 스프링 이벤트
  unit: 스프링
  order: 713
concepts:
  - key: core
    name: 스프링 이벤트
coreQuestions:
  - key: q1
    text: "스프링 이벤트는 언제, 어느 스레드에서 리스너를 부르나요?"
  - key: q2
    text: "리스너가 실패하면 이벤트를 낸 쪽은 어떻게 되나요?"
  - key: q3
    text: "커밋 뒤에 도는 리스너에서는 무엇을 조심하나요?"
questions:
  # ── 질문 1 ──
  - key: sev-order
    concept: core
    coreQuestion: q1
    type: code_predict
    status: reviewed
    difficulty: 1
    body: 아래 join을 부르면 로그는 어떤 순서로 남을까요? 리스너는 @EventListener예요.
    code: |-
      @Transactional
      public void join(String email) {
        log("publishEvent 앞");
        events.publishEvent(
            new MemberJoined(email));
        log("publishEvent 뒤");
      }

      @EventListener
      void welcome(MemberJoined e) {
        log("리스너");
      }
    choices:
      - publishEvent 앞, publishEvent 뒤, 리스너
      - publishEvent 앞, 리스너, publishEvent 뒤
      - 리스너, publishEvent 앞, publishEvent 뒤
      - 리스너는 다른 스레드라 순서가 정해지지 않는다
    answer: "2"
    explanation: |-
      **publishEvent 앞, 리스너, publishEvent 뒤예요.** @EventListener는 publishEvent를 부른 그 자리에서, 같은 스레드로 바로 불려요. 큐를 거치지 않는 메서드 호출이에요.
    source: https://docs.spring.io/spring-framework/reference/core/beans/context-introduction.html
  - key: sev-same-tx
    concept: core
    coreQuestion: q1
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: '@Transactional 주문 서비스가 OrderPlaced 이벤트를 내고, @EventListener가 재고를 줄여요. 재고 감소는 어느 트랜잭션에서 일어날까요?'
    choices:
      - 주문과 같은 트랜잭션에 합류한다
      - 리스너마다 새 트랜잭션이 열린다
      - 트랜잭션 없이 자동 커밋된다
      - 주문이 커밋된 뒤에 따로 실행된다
    answer: "1"
    explanation: |-
      **주문과 같은 트랜잭션이에요.** @EventListener는 같은 스레드에서 그 자리에서 불려서, 스레드에 묶인 주문 트랜잭션에 합류해요.

      - 주문이 롤백되면 재고 감소도 함께 롤백돼요
    source: https://docs.spring.io/spring-framework/reference/core/beans/context-introduction.html
  # ── 질문 2 ──
  - key: sev-listener-fail
    concept: core
    coreQuestion: q2
    type: multiple_choice
    status: reviewed
    difficulty: 1
    body: '@Transactional join이 회원을 저장하고 이벤트를 내요. @EventListener의 환영 메일 발송이 런타임 예외를 던지면 회원 행은 DB에 남을까요?'
    choices:
      - 남는다. 이벤트로 떼어 놓았다
      - 남지 않는다. 예외가 join까지 올라가 가입이 롤백된다
      - 남고, 예외는 로그에만 남는다
      - 메일만 롤백된다
    answer: "2"
    explanation: |-
      **남지 않아요.** 리스너는 같은 스레드의 메서드 호출이라, 예외가 publishEvent를 거쳐 join의 트랜잭션 프록시까지 올라가 롤백돼요.

      - 커밋된 뒤에만 보내려면 @TransactionalEventListener를 써요
    source: https://docs.spring.io/spring-framework/reference/data-access/transaction/event.html
  - key: sev-rollback-skip
    concept: core
    coreQuestion: q2
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: 주문 서비스가 OrderPlaced 이벤트를 낸 뒤, 결제 검증에서 런타임 예외가 나 주문이 롤백됐어요. 기본 설정의 @TransactionalEventListener로 만든 배송 요청 리스너는 실행될까요?
    choices:
      - 실행된다. 이벤트는 이미 났다
      - 실행되지 않는다. 기본 단계는 AFTER_COMMIT이다
      - 롤백되기 직전에 실행된다
      - 예외가 나서 앱이 멈춘다
    answer: "2"
    explanation: |-
      **실행되지 않아요.** @TransactionalEventListener는 기본으로 트랜잭션이 커밋된 뒤에만 불려요. 롤백된 주문에 배송 요청이 나가지 않아요.

      - 롤백된 뒤에 할 일은 phase = AFTER_ROLLBACK으로 따로 들어요
    source: https://docs.spring.io/spring-framework/reference/data-access/transaction/event.html
  # ── 질문 3 ──
  - key: sev-after-fail
    concept: core
    coreQuestion: q3
    type: multiple_choice
    status: reviewed
    difficulty: 1
    body: '@TransactionalEventListener로 만든 커밋 뒤 리스너에서 포인트 적립이 런타임 예외로 실패했어요. 이미 커밋된 가입은 어떻게 될까요?'
    choices:
      - 함께 롤백된다
      - 남는다. 이미 커밋된 뒤라 되돌릴 수 없다
      - UnexpectedRollbackException이 난다
      - 가입이 다시 시도된다
    answer: "2"
    explanation: |-
      **남아요.** AFTER_COMMIT 리스너는 가입이 커밋된 다음에 돌아서, 리스너의 실패가 가입을 되돌리지 못해요.

      - 실패한 적립은 따로 기록하고 다시 시도할 방법을 둬야 해요
    source: https://docs.spring.io/spring-framework/reference/data-access/transaction/event.html
  - key: sev-after-silent
    concept: core
    coreQuestion: q3
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: 스프링 부트 3.5에서 컨트롤러가 @Transactional join을 부르고, 커밋 뒤 리스너(@TransactionalEventListener)가 메일 발송 중 런타임 예외를 던졌어요. 컨트롤러는 그 예외를 받을까요?
    choices:
      - 받는다. 같은 스레드다
      - 받지 않는다. 가입은 정상으로 끝난 것으로 보인다
      - UnexpectedRollbackException을 받는다
      - 컨트롤러가 다시 시도한다
    answer: "2"
    explanation: |-
      **받지 않아요.** 이 레슨의 테스트에서 커밋 뒤 리스너의 예외는 join을 부른 쪽으로 오지 않았어요. 그래서 실패를 아무도 모를 수 있어요.

      - 리스너 안에서 실패를 잡아 기록하고 다시 보낼 작업을 둬요
    source: https://docs.spring.io/spring-framework/docs/current/javadoc-api/org/springframework/transaction/event/TransactionalEventListener.html
  - key: sev-coupon-new
    concept: core
    coreQuestion: q3
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: 가입이 커밋된 뒤 @TransactionalEventListener에서 JPA 리포지토리로 가입 쿠폰을 저장하려고 해요. 스프링 문서가 권하는 방법은 무엇일까요?
    choices:
      - 그대로 save한다. 가입 트랜잭션이 아직 열려 있다
      - 저장하는 메서드를 propagation = REQUIRES_NEW로 새 트랜잭션에서 돌린다
      - '@EventListener로 바꾼다'
      - 리스너에서 가입 트랜잭션을 다시 연다
    answer: "2"
    explanation: |-
      **REQUIRES_NEW로 새 트랜잭션을 열어요.** 커밋 뒤에는 가입 트랜잭션이 이미 끝나 있어서, 트랜잭션에 기대는 쓰기는 반영되지 않을 수 있다고 스프링 문서가 경고해요.

      - @EventListener로 바꾸면 쿠폰 실패가 가입까지 롤백시켜요
    source: https://docs.spring.io/spring-framework/reference/data-access/transaction/event.html
  # ── 전체 ──
  - key: sev-interview
    concept: core
    coreQuestion: all
    type: descriptive
    status: reviewed
    difficulty: 2
    body: 면접에서 "스프링 이벤트와 @TransactionalEventListener를 설명해 주세요"라는 질문을 받았어요. 1분 안에 답해 보세요.
    explanation: |-
      **@EventListener는 그 자리에서 같은 트랜잭션으로, @TransactionalEventListener는 커밋 뒤에 돌아요.**

      - **이벤트:** publishEvent로 내고 리스너가 듣는다. 내는 쪽과 후속 일을 코드로 떼어 놓는다
      - **@EventListener:** 같은 스레드에서 바로 불려 같은 트랜잭션. 예외가 내는 쪽을 롤백시킨다
      - **@TransactionalEventListener:** 커밋된 뒤에만 불리고 롤백되면 불리지 않는다
      - **조심할 것:** 커밋 뒤 실패는 되돌릴 수 없고 부른 쪽도 모른다. DB 쓰기는 REQUIRES_NEW, 꼭 전달할 것은 아웃박스
    checklist:
      - '@EventListener가 같은 스레드에서 그 자리에서 불린다고 말했다'
      - 리스너의 예외가 이벤트를 낸 트랜잭션을 롤백시킨다고 말했다
      - '@TransactionalEventListener가 커밋 뒤에만 불린다고 말했다'
      - 커밋 뒤 리스너의 실패나 쓰기에서 조심할 점을 말했다
    source: https://docs.spring.io/spring-framework/reference/data-access/transaction/event.html
