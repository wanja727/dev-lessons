questions:
  - key: q-525f2f5f
    concept: core
    type: descriptive
    status: reviewed
    difficulty: 2
    body: 결제 API에서 중복 결제를 어떻게 막는지 1분 안에 설명해 보세요
    explanation: |-
      - 재시도·더블 클릭으로 같은 요청이 오는 것은 막을 수 없으니 API를 멱등하게
      - 클라이언트가 멱등 키를 보내고, 서버는 키 컬럼 유니크 제약 + 바로 INSERT, 중복이면 처음 결과 반환
      - 먼저 조회는 동시 요청에서 실패, 내용이 다른 같은 키는 거절
    checklist:
      - 같은 요청이 두 번 오는 상황을 말했다
      - 멱등 키를 말했다
      - DB 유니크 제약을 말했다
      - 중복 시 처음 결과를 돌려준다고 말했다
      - 조회 후 저장이 왜 안 되는지 말했다
    source: https://docs.stripe.com/api/idempotent_requests
  - key: q-8754f4c8
    concept: core
    type: descriptive
    status: reviewed
    difficulty: 2
    body: 중복 요청 방지 방법인 "먼저 조회 후 저장", "synchronized", "DB 유니크 제약"을 비교해 보세요
    explanation: |-
      - 조회 후 저장: 순차 재시도는 막지만 동시 요청은 둘 다 조회를 통과(check-then-act)
      - synchronized: 서버 한 대 안에서만 효과, 여러 대면 무의미. 트랜잭션 커밋 시점과도 어긋날 수 있음
      - DB 유니크 제약: 서버 수와 상관없이 DB가 하나만 통과시킴. 최종 방어선
    checklist:
      - 조회 후 저장의 경쟁 상태를 말했다
      - synchronized가 서버 한 대에서만 효과라고 말했다
      - 유니크 제약이 서버 수와 무관하다고 말했다
      - 각 방법이 막는 상황(순차/동시)을 구분했다
      - 최종 판단을 DB에 맡긴다는 결론을 말했다
    source: https://docs.stripe.com/api/idempotent_requests
  - key: q-f983f53a
    concept: core
    type: descriptive
    status: reviewed
    difficulty: 3
    body: 멱등 키로 중복 결제를 막는 API를 설계할 때, 키 하나 외에 더 챙겨야 할 것들을 말해 보세요
    explanation: "- 키 범위(사용자별 유니크), 처음 응답 저장과 재사용, 같은 키·다른 내용 거절, 처리 중 상태(외부 호출 중 재요청), 키 보관 기간, 외부 PG사에도 멱등 키 전달"
    checklist:
      - 처음 응답을 저장해 그대로 돌려준다고 말했다
      - 같은 키·다른 내용을 거절한다고 말했다
      - 처리 중 상태를 말했다
      - 보관 기간(TTL)을 말했다
      - 외부 연동에도 멱등 키를 넘긴다고 말했다
    source: https://datatracker.ietf.org/doc/draft-ietf-httpapi-idempotency-key-header/
  - key: q-5fdcfdeb
    concept: core
    type: ox
    status: reviewed
    difficulty: 1
    body: "\"먼저 같은 멱등 키가 있는지 조회하고 없을 때만 저장하면, 동시에 온 같은 키 요청도 항상 하나만 저장된다\""
    answer: X
    explanation: |-
      - 두 요청이 모두 저장 전에 조회하면 둘 다 "없음"을 보고 저장한다
      - 검증: IdempotencyTest (checkThenInsertFailsUnderConcurrency)
    source: https://docs.stripe.com/api/idempotent_requests
  - key: q-17d9cdf2
    concept: core
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: 같은 멱등 키로 결제 요청 10개가 동시에 왔다. 키 컬럼에 유니크 제약이 있고, 서버는 바로 INSERT하되 중복이면 처음 결제를 돌려준다. 결과는?
    choices:
      - 결제 10건, 각자 다른 id
      - 결제 1건, 9개 요청은 예외로 실패 응답
      - 결제 1건, 10개 요청 모두 같은 결제 id를 응답받음
      - 교착 상태(데드락)로 멈춤
    answer: "3"
    explanation: |-
      - DB가 하나만 통과시키고, 나머지는 유니크 위반을 받아 처음 결제를 찾아 그대로 돌려준다
      - 검증: IdempotencyTest (idempotentUnderConcurrency)
    source: https://docs.stripe.com/api/idempotent_requests
  - key: q-2fa54686
    concept: core
    type: multiple_choice
    status: reviewed
    difficulty: 1
    body: 다음 HTTP 메서드 중 RFC 9110상 멱등이 아닌 것은?
    choices:
      - GET
      - PUT
      - DELETE
      - POST
    answer: "4"
    explanation: |-
      - POST는 요청마다 새 리소스를 만들 수 있어 멱등이 아니다. 그래서 결제 생성 API는 멱등 키로 서버가 직접 멱등하게 만든다
      - 근거: RFC 9110 (테스트 없음)
    source: https://www.rfc-editor.org/rfc/rfc9110.html
  - key: q-b209211e
    concept: core
    type: line_pick
    status: reviewed
    difficulty: 3
    body: "[코드 6-A] 멱등 처리를 넣었는데 중복 요청 때 \"현재 트랜잭션이 중단됨\" 오류가 난다. 원인이 되는 줄은?"
    code: |-
      @Transactional
      public Payment pay(String key, Long orderId, long amount) {
          try {
              return paymentRepository.saveAndFlush(new Payment(key, orderId, amount));
          } catch (DataIntegrityViolationException duplicate) {
              return paymentRepository.findByIdempotencyKey(key).orElseThrow();
          }
      }
    answer: "1"
    explanation: |-
      - 메서드 전체가 한 트랜잭션이라, 4번 줄의 INSERT가 실패하면 그 트랜잭션은 더 쓸 수 없다(PostgreSQL은 이후 질의를 거절, 마지막에는 롤백 전용). 6번 줄의 재조회는 실패한 트랜잭션 밖에서 해야 한다
      - 고치기: @Transactional을 빼서 saveAndFlush가 자기 트랜잭션에서 INSERT하게 한다 (레슨 4장)
      - 근거: 레슨 구현은 @Transactional 없이 검증됨 (IdempotencyTest). 이 오류 자체는 테스트하지 않음
    source: https://docs.stripe.com/api/idempotent_requests
