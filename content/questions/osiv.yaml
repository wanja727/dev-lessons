# OSIV 문제
# 형식: https://github.com/wanja727/retrievo/blob/main/docs/content-format.md
#
# 모든 문제는 coreQuestions의 질문 하나에 묶이고(coreQuestion), 답의 근거가 레슨 본문에 있다
# (site/src/content/lesson-pages/osiv.yaml의 says).
# 동작에 관한 정답은 verification의 OsivOnTest, OsivOffTest로 확인했다 (스프링 부트 3.5, PostgreSQL 16).
# 질문마다 첫 문제는 본문의 예시로 묻고, 둘째 문제는 다른 상황으로 옮겨 묻는다.
# 2026-11-25에 핵심 질문 구조로 다시 썼다. 예전 문제 가운데 면접 질문(q-fa934d44)만 키를 이어 쓴다.
# 같은 날 검수해 reviewed로 바꿨다.
subject:
  key: dev
  name: 개발자 면접
lesson:
  key: osiv
  title: OSIV
  unit: JPA
  order: 16
concepts:
  - key: core
    name: OSIV
coreQuestions:
  - key: q1
    text: "OSIV는 무엇을 요청 끝까지 열어 두나요?"
  - key: q2
    text: "OSIV를 켜면 컨트롤러에서 무엇이 되나요?"
  - key: q3
    text: "OSIV를 켜 두면 무엇을 잃나요?"
  - key: q4
    text: "OSIV를 켜면 컨트롤러에서 바꾼 엔티티는 어떻게 되나요?"
  - key: q5
    text: "OSIV를 끄면 지연 로딩은 어디서 끝내나요?"
questions:
  # ── 질문 1 ──
  - key: osiv-tx-vs-pc
    concept: core
    coreQuestion: q1
    type: multiple_choice
    status: reviewed
    difficulty: 1
    body: OSIV를 켠 앱에서 서비스의 @Transactional 메서드가 막 끝나고 컨트롤러로 돌아왔어요. 이 순간 트랜잭션과 영속성 컨텍스트는 각각 어떤 상태일까요?
    choices:
      - 둘 다 열려 있다
      - 트랜잭션은 커밋되어 끝났고, 영속성 컨텍스트는 열려 있다
      - 트랜잭션은 열려 있고, 영속성 컨텍스트는 닫혔다
      - 둘 다 닫혔다
    answer: "2"
    explanation: |-
      **트랜잭션은 끝났고 영속성 컨텍스트는 열려 있어요.** OSIV는 트랜잭션의 범위를 바꾸지 않고, 영속성 컨텍스트만 요청이 끝날 때까지 열어 둬요.

      - 스프링 MVC의 인터셉터가 요청 시작에 영속성 컨텍스트를 열어요
    source: https://docs.spring.io/spring-framework/docs/current/javadoc-api/org/springframework/orm/jpa/support/OpenEntityManagerInViewInterceptor.html
  - key: osiv-default-value
    concept: core
    coreQuestion: q1
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: 새로 만든 스프링 부트 3 앱의 application.yml에는 JPA 설정이 데이터소스 주소뿐이에요. 이 앱의 OSIV는 어떤 상태일까요?
    choices:
      - 꺼져 있다. 켜려면 설정을 적어야 한다
      - 켜져 있고, 앱이 뜰 때 경고 로그를 남긴다
      - 켜져 있고, 아무 로그도 남기지 않는다
      - 웹 요청이 있을 때만 정해진다
    answer: "2"
    explanation: |-
      **켜져 있고 경고를 남겨요.** spring.jpa.open-in-view의 기본값은 true이고, 직접 적지 않으면 시작할 때 enabled by default 경고를 남겨요.

      - API 서버는 open-in-view: false를 적어요
    source: https://docs.spring.io/spring-boot/reference/data/sql.html#data.sql.jpa-and-spring-data.open-entity-manager-in-view
  # ── 질문 2 ──
  - key: osiv-off-lazy
    concept: core
    coreQuestion: q2
    type: multiple_choice
    status: reviewed
    difficulty: 1
    body: 아래 컨트롤러에는 트랜잭션이 없고, service.findPlayer는 @Transactional로 선수 엔티티를 돌려줘요. 선수의 팀은 LAZY예요. spring.jpa.open-in-view를 false로 둔 앱에서 이 요청은 어떻게 될까요?
    code: |-
      @GetMapping("/players/{id}/team-name")
      String teamName(@PathVariable Long id) {
        Player player = service.findPlayer(id);
        return player.getTeam().getName();
      }
    choices:
      - 팀 이름을 돌려준다
      - LazyInitializationException이 난다
      - 팀 이름 대신 null을 돌려준다
    answer: "2"
    explanation: |-
      **LazyInitializationException이 나요.** OSIV를 끄면 서비스의 트랜잭션이 끝날 때 영속성 컨텍스트도 닫혀서, 컨트롤러에서 팀 프록시를 초기화할 수 없어요.

      - 켜 둔 앱에서는 같은 코드가 팀 이름을 돌려줘요
    source: https://docs.spring.io/spring-boot/reference/data/sql.html#data.sql.jpa-and-spring-data.open-entity-manager-in-view
  - key: osiv-on-json
    concept: core
    coreQuestion: q2
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: OSIV를 켠 앱의 주문 상세 컨트롤러가 서비스에서 받은 주문 엔티티를 그대로 돌려줘서 잭슨이 JSON을 만들어요. 주문의 회원은 LAZY이고 서비스에서는 회원을 읽지 않았어요. 어떻게 될까요?
    choices:
      - 응답에 회원 정보가 들어가고, 회원 SELECT는 컨트롤러 쪽에서 나간다
      - LazyInitializationException이 난다
      - 회원 자리가 null로 나간다
      - 회원 SELECT가 서비스의 트랜잭션 안에서 나간다
    answer: "1"
    explanation: |-
      **회원 정보가 들어가요.** 잭슨이 회원을 읽을 때 열려 있는 영속성 컨텍스트로 프록시를 초기화해요. 이 SELECT는 트랜잭션이 끝난 뒤에 나가요.

      - 그래서 서비스 코드만 봐서는 SQL이 어디서 몇 번 나갈지 알기 어려워져요
    source: https://docs.spring.io/spring-boot/reference/data/sql.html#data.sql.jpa-and-spring-data.open-entity-manager-in-view
  # ── 질문 3 ──
  - key: osiv-connections-after
    concept: core
    coreQuestion: q3
    type: multiple_choice
    status: reviewed
    difficulty: 1
    body: 서비스의 @Transactional 메서드가 끝난 직후, 컨트롤러에서 커넥션 풀의 사용 중 커넥션 수를 읽었어요. 다른 요청은 없어요. OSIV를 켰을 때와 껐을 때 값은 각각 얼마일까요?
    choices:
      - 켜면 0, 끄면 0
      - 켜면 1, 끄면 0
      - 켜면 0, 끄면 1
      - 켜면 1, 끄면 1
    answer: "2"
    explanation: |-
      **켜면 1, 끄면 0이에요.** 영속성 컨텍스트는 닫힐 때 커넥션을 돌려주는데, OSIV를 켜면 닫히는 때가 응답이 끝날 때예요.

      - 끄면 트랜잭션과 함께 닫히며 바로 돌려줘요
    source: https://docs.spring.io/spring-framework/docs/current/javadoc-api/org/springframework/orm/jpa/support/OpenEntityManagerInViewInterceptor.html
  - key: osiv-pool-burst
    concept: core
    coreQuestion: q3
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: 커넥션 풀 크기가 10이고 OSIV가 켜진 API가 있어요. 요청마다 서비스는 0.05초 만에 끝나고, 그 뒤 컨트롤러가 결제사 API를 3초 동안 불러요. 같은 순간 요청 30개가 들어오면 어떻게 될까요?
    choices:
      - 30개 모두 0.05초 안에 커넥션을 돌려줘 문제없다
      - 10개만 커넥션을 쥐고, 나머지 20개는 3초 넘게 커넥션을 기다린다
      - 결제사 API 호출은 커넥션과 상관없어 30개 모두 바로 처리된다
      - DB가 30개 쿼리를 한꺼번에 받아 느려진다
    answer: "2"
    explanation: |-
      **20개는 커넥션을 기다려요.** OSIV가 켜져 있으면 서비스가 끝나도 응답이 끝날 때까지 커넥션을 쥐고 있어요.

      - 결제사 API를 기다리는 3초 동안 커넥션은 DB 일을 하지 않아요
      - 끄면 커넥션을 0.05초씩만 쥐어요
    source: https://docs.spring.io/spring-boot/reference/data/sql.html#data.sql.jpa-and-spring-data.open-entity-manager-in-view
  # ── 질문 4 ──
  - key: osiv-rename-no-tx
    concept: core
    coreQuestion: q4
    type: multiple_choice
    status: reviewed
    difficulty: 1
    body: OSIV를 켠 앱의 컨트롤러가 서비스에서 받은 선수의 이름을 바꾸고, 다른 서비스는 부르지 않고 "ok"를 돌려줘요. 요청이 끝난 뒤 DB의 선수 이름은 어떻게 될까요?
    choices:
      - 바뀐 이름으로 저장된다
      - 그대로다
      - 응답할 때 예외가 난다
    answer: "2"
    explanation: |-
      **그대로예요.** 선수는 영속 상태로 남아 있지만, 컨트롤러에는 트랜잭션이 없어 flush할 곳이 없어요.

      - 뒤에 쓰기 트랜잭션을 하나라도 부르면 그 커밋이 바뀐 이름까지 flush해요
    source: https://docs.spring.io/spring-boot/reference/data/sql.html#data.sql.jpa-and-spring-data.open-entity-manager-in-view
  - key: osiv-log-flush
    concept: core
    coreQuestion: q4
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: OSIV를 켠 앱에서 컨트롤러가 주문 엔티티의 금액을 할인 표시용으로 바꾼 뒤, 로그 엔티티를 저장하는 서비스(@Transactional)를 불렀어요. 주문 금액은 어떻게 될까요?
    choices:
      - 그대로다. 로그 서비스는 주문과 상관없다
      - 바꾼 금액이 저장된다
      - 로그 저장이 실패한다
      - 다음 요청에서 저장된다
    answer: "2"
    explanation: |-
      **바꾼 금액이 저장돼요.** 로그 서비스의 트랜잭션이 커밋할 때 영속성 컨텍스트 전체를 flush하고, 주문은 그 안에 영속 상태로 남아 있어요.

      - OSIV를 끄면 주문은 준영속이라 저장되지 않아요
    source: https://docs.spring.io/spring-boot/reference/data/sql.html#data.sql.jpa-and-spring-data.open-entity-manager-in-view
  # ── 질문 5 ──
  - key: osiv-dto-works
    concept: core
    coreQuestion: q5
    type: multiple_choice
    status: reviewed
    difficulty: 1
    body: OSIV를 끈 앱이에요. 서비스의 @Transactional(readOnly = true) findView가 선수를 조회해 이름과 팀 이름을 record PlayerView에 담아 돌려주고, 컨트롤러는 view.teamName()을 응답해요. 어떻게 될까요?
    choices:
      - 팀 이름을 돌려준다
      - LazyInitializationException이 난다
      - readOnly라서 팀을 읽지 못한다
    answer: "1"
    explanation: |-
      **팀 이름을 돌려줘요.** 팀 이름은 트랜잭션 안에서 이미 읽어 DTO에 담았어요. 컨트롤러는 엔티티를 만지지 않아요.

      - readOnly는 변경 감지를 하지 않을 뿐, 조회와 지연 로딩은 돼요
    source: https://docs.spring.io/spring-boot/reference/data/sql.html#data.sql.jpa-and-spring-data.open-entity-manager-in-view
  - key: osiv-list-fix
    concept: core
    coreQuestion: q5
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: OSIV를 끄자 게시글 목록 API에서 LazyInitializationException이 나요. 목록의 게시글마다 작성자 이름이 필요해요. 어떻게 고칠까요?
    choices:
      - 작성자 연관을 EAGER로 바꾼다
      - 서비스에서 게시글과 작성자를 fetch join으로 조회하고, 트랜잭션 안에서 DTO 목록으로 바꿔 돌려준다
      - OSIV를 다시 켠다
      - 컨트롤러에 @Transactional을 붙인다
    answer: "2"
    explanation: |-
      **fetch join으로 함께 조회한 뒤 DTO로 바꿔요.** 트랜잭션 안에서 필요한 연관을 한 번에 가져오면 쿼리도 늘지 않고 밖에서 프록시를 만지지 않아요.

      - EAGER는 작성자가 필요 없는 조회에도 늘 가져와 쿼리를 늘려요
    source: https://docs.spring.io/spring-boot/reference/data/sql.html#data.sql.jpa-and-spring-data.open-entity-manager-in-view
  # ── 다섯 질문을 하나로 ──
  - key: q-fa934d44
    concept: core
    coreQuestion: all
    type: descriptive
    status: reviewed
    difficulty: 2
    body: 면접에서 "OSIV가 무엇이고, 왜 끄라고 하나요?"라는 질문을 받았어요. 1분 안에 답해 보세요.
    explanation: |-
      **영속성 컨텍스트를 요청 끝까지 열어 두는 설정이라 컨트롤러에서 지연 로딩이 되지만, 커넥션을 응답 끝까지 쥐고 뜻밖의 저장이 생겨서 API 서버는 꺼요.**

      - 스프링 부트의 기본값은 true이고, 트랜잭션의 범위는 그대로 서비스다
      - 서비스 뒤의 느린 일 동안 커넥션이 풀에서 빠져 풀이 바닥난다
      - 컨트롤러에서 바꾼 엔티티가 다른 쓰기 트랜잭션의 커밋에 함께 저장된다
      - 끄면 서비스 안에서 fetch join과 DTO로 지연 로딩을 끝낸다
    checklist:
      - 영속성 컨텍스트를 요청 끝까지 연다고 말했다
      - 기본값이 켜짐이라고 말했다
      - 커넥션을 오래 쥐는 문제를 말했다
      - 컨트롤러의 변경이 저장되는 문제를 말했다
      - 끄면 DTO나 fetch join으로 서비스에서 끝낸다고 말했다
    source: https://docs.spring.io/spring-boot/reference/data/sql.html#data.sql.jpa-and-spring-data.open-entity-manager-in-view
