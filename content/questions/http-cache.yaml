# HTTP 캐시 문제
# 형식: https://github.com/wanja727/retrievo/blob/main/docs/content-format.md
#
# 모든 문제는 coreQuestions의 질문 하나에 묶이고(coreQuestion), 답의 근거가 레슨 본문에 있다
# (site/src/content/lesson-pages/http-cache.yaml의 says).
# 서버의 헤더와 304 응답은 verification의 HttpCacheTest로 확인했다 (스프링 부트 3.5, 자바 21).
# 브라우저와 CDN이 저장하고 꺼내 쓰는 동작은 RFC 9111이 근거다.
# 질문마다 첫 문제는 본문의 예시로 묻고, 둘째 문제는 다른 상황으로 옮겨 묻는다.
subject:
  key: dev
  name: 개발자 면접
lesson:
  key: http-cache
  title: HTTP 캐시
  unit: 네트워크와 웹
  order: 65
concepts:
  - key: core
    name: HTTP 캐시
coreQuestions:
  - key: q1
    text: "HTTP 캐시는 무엇을 언제 다시 쓰나요?"
  - key: q2
    text: "시간이 지난 캐시는 어떻게 다시 확인하나요?"
  - key: q3
    text: "Cache-Control의 값은 어떻게 고르나요?"
  - key: q4
    text: "CDN은 무엇을 캐시하고 어떻게 비우나요?"
questions:
  # ── 질문 1 ──
  - key: hc-fresh
    concept: core
    coreQuestion: q1
    type: ox
    status: draft
    difficulty: 1
    body: "\"Cache-Control: max-age=60인 상품 목록을 받은 브라우저는, 30초 뒤 같은 주소를 다시 열 때 서버에 요청을 보내지 않고 저장한 응답을 쓴다\""
    answer: O
    explanation: |-
      **맞아요.** max-age 동안은 신선하다고 보고 서버에 묻지 않아요.

      - 그래서 빠르고 서버의 일이 줄어요
      - 대신 그동안 서버에서 바뀐 내용은 보이지 않아요
    source: https://www.rfc-editor.org/rfc/rfc9111.html#section-4.2
  - key: hc-stale-notice
    concept: core
    coreQuestion: q1
    type: multiple_choice
    status: draft
    difficulty: 2
    body: "공지 API에 `Cache-Control: max-age=3600`을 줬어요. 사용자가 공지를 받고 10분 뒤에 운영자가 공지를 고쳤어요. 이미 받아 간 사용자의 브라우저는 언제 새 공지를 보여 줄까요?"
    choices:
      - 고친 즉시
      - 받은 때부터 한 시간이 지나 서버에 다시 물을 때
      - 다음 날
      - 사용자가 로그아웃할 때
    answer: "2"
    explanation: |-
      **한 시간이 지난 뒤예요.** max-age는 "이만큼은 옛것을 봐도 된다"는 약속이에요.

      - 그 시간 동안 브라우저는 서버에 묻지 않아요
      - 자주 바뀌는 응답일수록 max-age를 짧게 잡거나 no-cache를 써요
    source: https://www.rfc-editor.org/rfc/rfc9111.html#section-4.2
  # ── 질문 2 ──
  - key: hc-304
    concept: core
    coreQuestion: q2
    type: multiple_choice
    status: draft
    difficulty: 1
    body: "`ETag: \"v3\"`를 받아 둔 클라이언트가 `If-None-Match: \"v3\"`로 다시 요청했어요. 그동안 상품은 바뀌지 않았어요. 서버의 응답은 무엇일까요? (스프링의 checkNotModified 사용)"
    choices:
      - 200과 같은 본문
      - 304와 빈 본문
      - 404
      - 412
    answer: "2"
    explanation: |-
      **304와 빈 본문이에요.** 바뀌지 않았으니 가진 것을 그대로 쓰라고 알려요.

      - 본문을 다시 보내지 않아 전송량이 줄어요
      - 바뀌었으면 200과 새 본문, 새 ETag가 와요
    source: https://www.rfc-editor.org/rfc/rfc9110.html#section-15.4.5
  - key: hc-304-saves
    concept: core
    coreQuestion: q2
    type: multiple_choice
    status: draft
    difficulty: 2
    body: "1MB짜리 상품 목록 응답을 조건부 요청으로 다시 확인했더니 304가 왔어요. 처음부터 200으로 다시 받는 것과 비교해 무엇이 줄었을까요?"
    choices:
      - 요청과 응답의 왕복 한 번
      - 본문 1MB의 전송
      - TCP 연결을 맺는 시간
      - 아무것도 줄지 않았다
    answer: "2"
    explanation: |-
      **본문의 전송이 줄었어요.** 304는 본문 없이 와요.

      - 서버에 묻는 요청과 응답의 왕복은 그대로 들어요
      - 왕복까지 없애려면 max-age 동안 묻지 않게 해요
    source: https://www.rfc-editor.org/rfc/rfc9110.html#section-13
  # ── 질문 3 ──
  - key: hc-no-cache
    concept: core
    coreQuestion: q3
    type: multiple_choice
    status: draft
    difficulty: 1
    body: "`Cache-Control: no-cache`를 받은 브라우저는 그 응답을 어떻게 할까요?"
    choices:
      - 저장하지 않는다
      - 저장하고, 쓸 때마다 서버에 바뀌었는지 확인한다
      - 저장하고, 확인하지 않고 계속 쓴다
      - 공유 캐시에만 저장한다
    answer: "2"
    explanation: |-
      **저장하고 쓸 때마다 확인해요.** no-cache는 "저장하지 마"가 아니에요.

      - 바뀌지 않았으면 304라 본문 전송은 아껴요
      - 아예 저장하지 말라는 것은 no-store예요
    source: https://www.rfc-editor.org/rfc/rfc9111.html#section-5.2.2.4
  - key: hc-hashed-assets
    concept: core
    coreQuestion: q3
    type: multiple_choice
    status: draft
    difficulty: 2
    body: "배포를 했는데 사용자 화면에는 하루 동안 옛 `app.js`가 돌아요. `app.js`는 이름이 늘 같고 `max-age=86400`이에요. 빠르게 받으면서도 배포 즉시 새 파일이 쓰이게 하려면 어떻게 할까요?"
    choices:
      - app.js에 no-store를 준다
      - 파일 이름에 내용의 해시를 넣어 길게 캐시하고, 그 이름을 가리키는 HTML은 no-cache로 둔다
      - max-age를 1년으로 늘린다
      - 사용자에게 새로고침을 안내한다
    answer: "2"
    explanation: |-
      **이름에 해시를 넣어요.** 내용이 바뀌면 이름이 바뀌니 브라우저가 새 파일을 받아요.

      - 해시 이름의 파일은 그 이름으로는 안 바뀌니 1년 max-age와 immutable을 줘요
      - HTML은 no-cache로 두어 늘 새 이름을 가리키게 해요. no-store는 매번 받아 느려요
    source: https://www.rfc-editor.org/rfc/rfc8246.html
  # ── 질문 4 ──
  - key: hc-public-me
    concept: core
    coreQuestion: q4
    type: code_predict
    status: draft
    difficulty: 1
    body: "CDN 뒤에 있는 서버의 내 정보 API예요. kim이 먼저 요청하고 20초 뒤 lee가 같은 주소를 요청했어요. 무슨 일이 생길 수 있을까요?"
    code: |-
      @GetMapping("/me")
      ResponseEntity<String> me() {
        return ResponseEntity.ok()
            .cacheControl(CacheControl
                .maxAge(Duration.ofSeconds(60))
                .cachePublic())
            .body(현재사용자의정보());
      }
    choices:
      - lee는 자기 정보를 받는다. CDN이 쿠키로 나눠 저장한다
      - CDN이 저장한 kim의 응답을 lee가 받을 수 있다
      - CDN은 /me를 저장하지 않는다
      - lee는 304를 받는다
    answer: "2"
    explanation: |-
      **kim의 응답을 lee가 받을 수 있어요.** 공유 캐시는 주소가 같으면 같은 응답을 여러 사용자에게 줘요.

      - public은 CDN도 저장해도 된다는 뜻이에요
      - 사용자의 응답은 CacheControl.noStore()나 cachePrivate()로 둬요
    source: https://www.rfc-editor.org/rfc/rfc9111.html#section-5.2.2.9
  - key: hc-vary
    concept: core
    coreQuestion: q4
    type: multiple_choice
    status: draft
    difficulty: 2
    body: "같은 주소의 응답이 요청의 `Accept-Language`(ko, en)에 따라 한국어나 영어로 나와요. CDN이 이 응답을 저장해요. 한국어 응답이 영어 사용자에게 가지 않게 하려면 응답에 무엇이 있어야 할까요?"
    choices:
      - "Cache-Control: public"
      - "Vary: Accept-Language"
      - "ETag"
      - "Last-Modified"
    answer: "2"
    explanation: |-
      **Vary: Accept-Language예요.** 그 요청 헤더의 값마다 따로 저장하라는 뜻이에요.

      - 없으면 CDN은 주소만 보고 같은 응답을 내줘요
      - 압축(Accept-Encoding)이나 CORS의 Origin도 같은 이유로 Vary에 적어요
    source: https://www.rfc-editor.org/rfc/rfc9110.html#section-12.5.5
  - key: hc-shallow-etag
    concept: core
    coreQuestion: q2
    type: multiple_choice
    status: draft
    difficulty: 2
    body: "상품 목록 컨트롤러는 DB를 조회해 응답을 만들어요. ShallowEtagHeaderFilter를 등록했더니 같은 내용의 재요청에 304가 나가요. 이때 DB 조회는 어떻게 될까요? (스프링 부트 3.5)"
    choices:
      - 304일 때는 컨트롤러가 실행되지 않아 DB 조회도 없다
      - 컨트롤러는 매번 실행되어 DB 조회도 매번 한다. 줄어드는 것은 전송량이다
      - 필터가 DB 결과를 캐시해 두고 쓴다
      - 304일 때만 DB를 두 번 조회한다
    answer: "2"
    explanation: |-
      **DB 조회는 매번 해요.** 이 필터는 응답을 다 만든 뒤 본문의 해시로 ETag를 계산해요.

      - 테스트에서 304를 준 요청에도 컨트롤러가 불렸어요
      - 서버의 일까지 줄이려면 판 번호로 ETag를 만들어 checkNotModified로 먼저 확인해요
    source: https://docs.spring.io/spring-framework/reference/web/webmvc/mvc-caching.html
  # ── 전체 ──
  - key: hc-interview
    concept: core
    coreQuestion: all
    type: descriptive
    status: draft
    difficulty: 2
    body: 면접에서 "HTTP 캐시가 어떻게 동작하는지, ETag와 no-cache, no-store를 함께 설명해 주세요"라는 질문을 받았어요. 1분 안에 답해 보세요.
    explanation: |-
      **브라우저와 CDN이 응답을 저장해 다시 쓰고, 서버가 Cache-Control로 얼마나, 누가 저장할지 정해요.**

      - **신선도:** max-age 동안은 서버에 묻지 않고 쓴다
      - **조건부 요청:** 지나면 ETag를 If-None-Match에 실어 묻고, 바뀌지 않았으면 304와 빈 본문
      - **값 고르기:** no-cache는 저장하되 매번 확인, no-store는 저장하지 않음, private은 브라우저만, public은 CDN도
      - **주의:** 사용자의 응답에 public을 붙이지 않는다. 정적 파일은 이름에 해시를 넣고 길게 캐시한다
    checklist:
      - max-age 동안 서버에 묻지 않고 다시 쓴다고 말했다
      - ETag와 If-None-Match, 304를 말했다
      - no-cache와 no-store의 차이를 말했다
      - private과 public(공유 캐시, CDN)의 차이를 말했다
      - 사용자의 응답을 공유 캐시에 두지 않거나, 파일 이름에 해시를 넣는 것을 말했다
    source: https://www.rfc-editor.org/rfc/rfc9111.html
