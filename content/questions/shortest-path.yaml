# 질문마다 첫 문제는 본문의 예시로 묻고, 둘째 문제는 다른 상황으로 옮겨 묻는다.
# 2026-11-26에 만들고 같은 날 검수해 reviewed로 바꿨다.
subject:
  key: dev
  name: 개발자 면접
lesson:
  key: shortest-path
  title: 최단 경로
  unit: 자료구조와 알고리즘
  order: 68
concepts:
  - key: core
    name: 최단 경로
coreQuestions:
  - key: q1
    text: "가중치가 있으면 왜 너비 우선 탐색으로 최단 경로를 못 구하나요?"
  - key: q2
    text: "다익스트라는 어떤 순서로 최단 거리를 구하나요?"
  - key: q3
    text: "가장 가까운 점부터 확정해도 되는 이유는 무엇이고, 음수 가중치에서는 왜 틀리나요?"
  - key: q4
    text: "우선순위 큐로 다익스트라를 어떻게 빠르게 만드나요?"
questions:
  # ── 질문 1 ──
  - key: sp-bfs-path
    concept: core
    coreQuestion: q1
    type: code_predict
    status: reviewed
    difficulty: 1
    body: 물류 센터 사이 도로의 이동 시간(분)이에요. A에서 시작한 너비 우선 탐색이 처음 D에 닿는 길은 선 몇 개이고, 그 길이 A에서 D로 가장 빨리 가는 길일까요?
    code: |-
      A-B 4   A-C 1   C-B 2
      B-D 1   C-D 5   D-E 3
    choices:
      - 선 2개이고, 가장 빠른 길이다
      - 선 2개이지만 5분이나 6분이라, 선 3개인 A-C-B-D(4분)가 더 빠르다
      - 선 3개이고, 가장 빠른 길이다
      - 너비 우선 탐색은 D에 닿지 못한다
    answer: "2"
    explanation: |-
      **선 2개이지만 가장 빠르지 않아요.** 너비 우선 탐색은 선의 수가 가장 적은 길을 찾아요.

      - A-B-D는 5분, A-C-D는 6분이에요
      - A-C-B-D는 선이 3개지만 1 + 2 + 1 = 4분이에요
      - 선마다 비용이 다르면 비용의 합이 가장 작은 길을 찾는 다익스트라가 필요해요
    source: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/PriorityQueue.html
  - key: sp-subway
    concept: core
    coreQuestion: q1
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: 지하철 노선도에서 "환승이 가장 적은 길"과 "역 사이 시간을 더한 값이 가장 짧은 길"을 구하려고 해요. 각각 무엇으로 구할까요?
    choices:
      - 둘 다 너비 우선 탐색
      - 환승은 너비 우선 탐색, 시간은 다익스트라
      - 환승은 다익스트라, 시간은 너비 우선 탐색
      - 둘 다 깊이 우선 탐색
    answer: "2"
    explanation: |-
      **환승은 너비 우선 탐색, 시간은 다익스트라예요.** 환승은 갈아탈 때마다 1씩 세니 모든 선의 비용이 같아요.

      - 비용이 모두 같으면 선의 수가 적은 길이 가장 싼 길이에요
      - 역 사이 시간은 구간마다 달라서 다익스트라가 필요해요
    source: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/PriorityQueue.html
  # ── 질문 2 ──
  - key: sp-confirm-order
    concept: core
    coreQuestion: q2
    type: code_predict
    status: reviewed
    difficulty: 1
    body: 아래 도로망에서 A를 시작점으로 다익스트라를 돌려요. 점을 확정하는 순서는 무엇일까요?
    code: |-
      A-B 4   A-C 1   C-B 2
      B-D 1   C-D 5   D-E 3
    choices:
      - A, B, C, D, E
      - A, C, B, D, E
      - A, C, D, B, E
      - A, B, D, C, E
    answer: "2"
    explanation: |-
      **A, C, B, D, E예요.** 확정하지 않은 점 가운데 거리가 가장 작은 점을 차례로 확정해요.

      - A(0)를 확정하고 B 4, C 1을 적어요
      - C(1)를 확정하면 B가 1 + 2 = 3으로 줄어요(완화). D는 6
      - B(3)를 확정하면 D가 4로 줄고, D(4) 다음 E(7)예요
    source: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/PriorityQueue.html
  - key: sp-prev-path
    concept: core
    coreQuestion: q2
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: "A에서 시작한 다익스트라를 돌린 뒤, 거리를 줄일 때마다 어디서 왔는지 적은 prev가 {B: C, C: A, D: B, E: D}였어요. A에서 E까지의 최단 경로는 무엇일까요?"
    choices:
      - A-C-B-D-E
      - A-B-D-E
      - E-D-B-C-A
      - A-C-D-E
    answer: "1"
    explanation: |-
      **A-C-B-D-E예요.** E에서 prev를 거꾸로 따라가 모은 뒤 뒤집어요.

      - E의 prev는 D, D는 B, B는 C, C는 A예요
      - 모으면 E, D, B, C, A이고 뒤집으면 A-C-B-D-E예요
    source: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/PriorityQueue.html
  # ── 질문 3 ──
  - key: sp-negative
    concept: core
    coreQuestion: q3
    type: code_predict
    status: reviewed
    difficulty: 1
    body: 방향이 있는 도로망에 음수 비용이 하나 있어요. A에서 시작한 다익스트라는 D까지의 거리를 얼마로 내고, 실제 최단 거리는 얼마일까요? (다익스트라는 B를 C보다 먼저 확정해요)
    code: |-
      A→B 2   B→D 1
      A→C 3   C→B -2
    choices:
      - 다익스트라 3, 실제 3
      - 다익스트라 3, 실제 2
      - 다익스트라 2, 실제 2
      - 다익스트라 2, 실제 3
    answer: "2"
    explanation: |-
      **다익스트라는 3, 실제는 2예요.** B를 2로 확정해 D를 3으로 정한 뒤, C를 거쳐 B로 오는 더 짧은 길(1)을 D에 퍼뜨리지 못해요.

      - A→C→B→D는 3 - 2 + 1 = 2예요
      - 음수 비용이 있으면 확정한 거리가 나중에 더 짧아질 수 있어요
      - 이때는 모든 선의 완화를 되풀이하는 벨만 포드를 써요
    source: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/PriorityQueue.html
  - key: sp-no-shorter-later
    concept: core
    coreQuestion: q3
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: 모든 선의 비용이 0 이상인 그래프에서 다익스트라가 점 X를 거리 10으로 확정했어요. 그 뒤에 X로 가는 9짜리 길이 발견될 수 있을까요?
    choices:
      - 있다. 아직 확정하지 않은 점이 남아 있다
      - 없다. 확정하지 않은 점의 거리는 모두 10 이상이고, 거기에 0 이상의 비용을 더해도 10보다 작아질 수 없다
      - 그래프의 크기에 따라 다르다
      - 있다. 우선순위 큐의 순서는 보장되지 않는다
    answer: "2"
    explanation: |-
      **없어요.** X를 10으로 골랐다는 것은 남은 점이 모두 10 이상이라는 뜻이에요.

      - X로 오는 다른 길은 그런 점을 거쳐야 하고, 비용은 음수가 아니에요
      - 그래서 가장 가까운 점을 확정하고 되돌아보지 않는 그리디가 맞아요
    source: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/PriorityQueue.html
  # ── 질문 4 ──
  - key: sp-stale-entry
    concept: core
    coreQuestion: q4
    type: code_predict
    status: reviewed
    difficulty: 1
    body: 다익스트라를 돌리다 B의 거리가 4에서 3으로 줄어 (B, 3)을 큐에 넣었어요. 큐에는 (B, 4)도 남아 있어요. (B, 3)이 먼저 나와 B를 확정한 뒤, 나중에 (B, 4)를 꺼내면 어떻게 될까요?
    code: |-
      Entry e = pq.poll();
      if (!done.add(e.node())) continue;
      // 이웃의 거리를 줄인다
    choices:
      - B의 거리를 다시 4로 바꾼다
      - B는 이미 확정했으니 건너뛴다
      - NoSuchElementException이 난다
      - B의 이웃을 4를 기준으로 다시 줄인다
    answer: "2"
    explanation: |-
      **건너뛰어요.** done.add가 false를 돌려줘서 continue로 넘어가요.

      - 자바의 PriorityQueue에는 들어 있는 원소의 우선순위를 줄이는 연산이 없어요
      - 그래서 줄어든 거리를 새로 넣고, 낡은 항목은 꺼낼 때 버려요(게으른 삭제)
    source: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/PriorityQueue.html
  - key: sp-complexity
    concept: core
    coreQuestion: q4
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: 점 10만 개, 선 30만 개의 도로망이에요. 가장 작은 점을 매번 배열에서 찾는 다익스트라와, 우선순위 큐에서 꺼내는 다익스트라의 시간 복잡도는 각각 무엇일까요? (V는 점, E는 선의 수)
    choices:
      - 둘 다 O(V²)
      - O(V²)과 O((V + E) log V)
      - O((V + E) log V)와 O(V²)
      - O(E)와 O(V)
    answer: "2"
    explanation: |-
      **배열은 O(V²), 우선순위 큐는 O((V + E) log V)예요.** 배열은 가장 작은 점을 찾을 때마다 점 V개를 다 봐요.

      - 우선순위 큐는 가장 작은 것을 O(log V)에 꺼내요
      - 선이 점의 몇 배 정도인 도로망에서 훨씬 빨라요. 테스트에서 점 2만 개로 수십 배 차이였어요
    source: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/PriorityQueue.html
  - key: sp-mark-on-push
    concept: core
    coreQuestion: q4
    type: code_predict
    status: reviewed
    difficulty: 2
    body: 너비 우선 탐색처럼 큐에 넣을 때 확정 표시를 하는 다익스트라예요(A는 처음에 표시해요). 도로망 A-B 4, A-C 1, C-B 2, B-D 1, C-D 5, D-E 3에서 A부터 돌리면 D까지의 거리는 얼마로 나올까요?
    code: |-
      Entry e = pq.poll();
      for (Edge ed : graph.get(e.node())) {
        int nd = e.dist() + ed.minutes();
        if (nd < dist.getOrDefault(
            ed.to(), Integer.MAX_VALUE)) {
          dist.put(ed.to(), nd);
          if (done.add(ed.to())) {
            pq.add(new Entry(ed.to(), nd));
          }
        }
      }
    choices:
      - "4"
      - "5"
      - "6"
      - "3"
    answer: "2"
    explanation: |-
      **5예요. 정답은 4예요.** A를 꺼낼 때 B를 거리 4로 넣고 표시해서, C를 거쳐 B가 3으로 줄어도 다시 넣지 못해요.

      - 큐에 남은 (B, 4)가 꺼내져 D를 4 + 1 = 5로 정해요
      - 다익스트라는 꺼낼 때 확정하고, 이미 확정한 점은 건너뛰어요
    source: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/PriorityQueue.html
  # ── 네 질문을 하나로 ──
  - key: sp-interview
    concept: core
    coreQuestion: all
    type: descriptive
    status: reviewed
    difficulty: 2
    body: 면접에서 "다익스트라는 어떻게 동작하고, 언제 쓸 수 없나요?"라는 질문을 받았어요. 1분 안에 답해 보세요.
    explanation: |-
      **가장 가까운 점부터 확정하며 이웃의 거리를 줄여 가는 알고리즘이고, 음수 비용이 있으면 쓸 수 없어요.**

      - **왜 필요한가:** 비용이 다르면 선의 수가 적은 길(너비 우선 탐색)이 가장 싸지 않다
      - **동작:** 확정하지 않은 점 가운데 거리가 가장 작은 점을 확정하고 이웃을 완화한다. prev로 경로를 복원한다
      - **근거와 한계:** 비용이 음수가 아니면 돌아오는 길이 더 짧아질 수 없다. 음수면 벨만 포드
      - **구현:** 우선순위 큐로 O((V + E) log V). 줄어든 거리는 새로 넣고 낡은 항목은 꺼낼 때 건너뛰며, 확정은 꺼낼 때 한다
    checklist:
      - 비용이 다르면 너비 우선 탐색이 틀리는 이유를 말했다
      - 가장 가까운 점을 확정하고 이웃의 거리를 줄인다(완화)고 말했다
      - 비용이 음수가 아니어야 하는 이유와 음수일 때의 대안을 말했다
      - 우선순위 큐로 빠르게 만든다고 말했다
      - 확정은 꺼낼 때 하고 낡은 항목은 건너뛴다고 말했다
    source: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/PriorityQueue.html
