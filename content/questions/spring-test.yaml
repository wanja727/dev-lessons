# 스프링 테스트 문제
# 형식: https://github.com/wanja727/retrievo/blob/main/docs/content-format.md
#
# 모든 문제는 coreQuestions의 질문 하나에 묶이고(coreQuestion), 답의 근거가 레슨 본문에 있다
# (site/src/content/lesson-pages/spring-test.yaml의 says).
# 동작에 관한 정답은 verification의 springtest 패키지 테스트로 확인했다 (스프링 부트 3.5, PostgreSQL 16).
# 질문마다 첫 문제는 본문의 예시로 묻고, 둘째 문제는 다른 상황으로 옮겨 묻는다.
# 2026-11-25에 만들고 같은 날 검수해 reviewed로 바꿨다.
subject:
  key: dev
  name: 개발자 면접
lesson:
  key: spring-test
  title: 스프링 테스트
  unit: 테스트와 운영
  order: 903
concepts:
  - key: core
    name: 스프링 테스트
coreQuestions:
  - key: q1
    text: "@SpringBootTest는 무엇을 띄우나요?"
  - key: q2
    text: "슬라이스 테스트는 무엇만 띄우나요?"
  - key: q3
    text: "테스트에 @Transactional을 붙이면 무엇이 달라지나요?"
  - key: q4
    text: "스프링 테스트가 많아지면 왜 느려지나요?"
questions:
  # ── 질문 1 ──
  - key: st-boot-all-beans
    concept: core
    coreQuestion: q1
    type: multiple_choice
    status: reviewed
    difficulty: 1
    body: 회원 API 프로젝트에서 테스트 클래스에 @SpringBootTest만 붙였어요. 컨텍스트에 뜨는 빈은 무엇일까요?
    choices:
      - MemberController만
      - MemberService와 MemberRepository만
      - MemberController, MemberService, MemberRepository와 자동 설정의 빈 모두
      - 테스트 클래스가 @Autowired로 받는 빈만
    answer: "3"
    explanation: |-
      **모두 떠요.** @SpringBootTest는 @SpringBootApplication을 찾아 애플리케이션을 실행할 때와 같은 컨텍스트 전체를 띄워요.

      - 레슨의 테스트에서는 빈이 270개가 넘었어요. 대부분 자동 설정이 만든 것이에요
    source: https://docs.spring.io/spring-boot/reference/testing/spring-boot-applications.html
  - key: st-boot-for-pure
    concept: core
    coreQuestion: q1
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: 다른 빈을 쓰지 않는 금액 계산 클래스 PriceCalculator를 @SpringBootTest로 테스트하고 있어요. 단위 테스트로 바꾸면 얻는 것은?
    choices:
      - 더 운영에 가깝게 확인한다
      - 상관없는 빈 수백 개를 띄우지 않아 훨씬 빠르다
      - 자동 설정을 확인할 수 있다
      - 얻는 것이 없다
    answer: "2"
    explanation: |-
      **속도예요.** @SpringBootTest는 확인하려는 것과 상관없는 빈까지 모두 만들어서 몇 초씩 걸려요.

      - 다른 빈을 쓰지 않는 클래스는 new로 만들어 확인하는 단위 테스트로 충분해요
    source: https://docs.spring.io/spring-boot/reference/testing/spring-boot-applications.html
  # ── 질문 2 ──
  - key: st-webmvc-no-service
    concept: core
    coreQuestion: q2
    type: multiple_choice
    status: reviewed
    difficulty: 1
    body: '@WebMvcTest(MemberController.class)로 컨트롤러를 테스트해요. MemberController는 생성자로 MemberService를 받아요. 테스트 클래스에 @MockitoBean MemberService를 두지 않으면 어떻게 될까요?'
    choices:
      - 진짜 MemberService가 주입된다
      - 컨텍스트가 뜨지 않는다. MemberService 빈이 없다
      - MemberService 자리에 null이 들어간다
      - 스프링이 자동으로 목을 만든다
    answer: "2"
    explanation: |-
      **컨텍스트가 뜨지 않아요.** @WebMvcTest는 컨트롤러와 @ControllerAdvice, 필터, JSON 변환기 같은 웹 계층 빈만 띄워서 서비스가 없어요.

      - @MockitoBean으로 서비스 자리에 목을 넣어요
    source: https://docs.spring.io/spring-boot/reference/testing/spring-boot-applications.html
  - key: st-pick-slice
    concept: core
    coreQuestion: q2
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: 주문 리포지토리에 @Query로 쓴 "지난달 결제 완료 주문" 조회가 맞는 행만 고르는지 확인하고 싶어요. 가장 맞는 테스트는?
    choices:
      - 리포지토리를 목으로 바꾼 단위 테스트
      - '@WebMvcTest'
      - '@DataJpaTest'
      - '@JsonTest'
    answer: "3"
    explanation: |-
      **@DataJpaTest예요.** 엔티티, 리포지토리, EntityManager와 DB 연결만 띄워 쿼리와 매핑을 확인해요.

      - 리포지토리를 목으로 바꾸면 쿼리가 DB에 가지 않아 확인할 수 없어요
    source: https://docs.spring.io/spring-boot/reference/testing/spring-boot-applications.html
  # ── 질문 3 ──
  - key: st-lazy-in-test-tx
    concept: core
    coreQuestion: q3
    type: code_predict
    status: reviewed
    difficulty: 2
    body: 회원과 팀은 미리 저장해 두었고 팀은 지연 로딩이에요. find는 @Transactional(readOnly = true) 메서드예요. 이 테스트는 어떻게 될까요?
    code: |-
      @SpringBootTest
      @Transactional
      class MemberServiceTest {
        @Test
        void 팀_이름() {
          Member m = service.find(savedId);
          m.getTeam().getName();
        }
      }
    choices:
      - 통과한다
      - LazyInitializationException으로 실패한다
      - getName()이 null을 돌려준다
      - 컴파일 오류가 난다
    answer: "1"
    explanation: |-
      **통과해요.** 서비스의 트랜잭션이 테스트가 연 트랜잭션에 합류해서, find가 끝나도 영속성 컨텍스트가 테스트 끝까지 열려 있어요.

      - 테스트의 @Transactional을 떼면 같은 코드가 LazyInitializationException으로 실패해요
      - 운영의 컨트롤러는 트랜잭션 밖에서 부르니 실패하는 쪽과 같아요
    source: https://docs.spring.io/spring-framework/reference/testing/testcontext-framework/tx.html
  - key: st-not-null-no-flush
    concept: core
    coreQuestion: q3
    type: multiple_choice
    status: reviewed
    difficulty: 3
    body: '@DataJpaTest에서 쿠폰 엔티티의 code 열에 유니크 제약이 있어요. id는 시퀀스 전략이에요. 같은 code로 쿠폰 두 개를 save하고, 다른 확인 없이 테스트가 끝났어요. 결과는?'
    choices:
      - 유니크 제약 위반으로 실패한다
      - 통과한다. flush 전에 롤백되어 INSERT가 나가지 않는다
      - 두 번째 save가 null을 돌려준다
      - 테스트가 끝난 뒤 행 두 개가 남는다
    answer: "2"
    explanation: |-
      **통과해요.** 시퀀스 전략은 INSERT를 flush 때까지 미루고, @DataJpaTest는 커밋 대신 롤백으로 끝나서 INSERT가 한 번도 나가지 않아요.

      - em.flush()를 부르면 그때 DB가 제약 위반을 알려요
    source: https://docs.spring.io/spring-framework/reference/testing/testcontext-framework/tx.html
  - key: st-fix-lazy-test
    concept: core
    coreQuestion: q3
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: '@Transactional을 붙인 서비스 테스트는 통과했는데, 운영에서 컨트롤러가 service.find(id).getTeam().getName()을 부르다 LazyInitializationException이 났어요. 운영처럼 실패를 잡는 테스트로 고치는 방법은?'
    choices:
      - 테스트에 @Transactional을 하나 더 붙인다
      - 테스트에서 @Transactional을 떼고, 끝나면 데이터를 직접 지운다
      - 팀을 EAGER로 바꾸고 테스트는 그대로 둔다
      - '@MockitoBean으로 MemberService를 목으로 바꾼다'
    answer: "2"
    explanation: |-
      **테스트에서 @Transactional을 떼요.** 그러면 find가 끝날 때 영속성 컨텍스트가 닫혀 운영과 같은 예외가 테스트에서 나요.

      - 데이터는 @AfterEach에서 지워요
      - 코드는 필요한 연관을 fetch join으로 함께 읽게 고쳐요
    source: https://docs.spring.io/spring-framework/reference/testing/testcontext-framework/tx.html
  # ── 질문 4 ──
  - key: st-cache-same
    concept: core
    coreQuestion: q4
    type: multiple_choice
    status: reviewed
    difficulty: 1
    body: 설정이 같은 @SpringBootTest 클래스 5개를 한 번에 돌렸어요. 스프링 컨텍스트는 몇 번 만들어질까요?
    choices:
      - 5번
      - 한 번
      - 0번
      - 테스트 메서드 수만큼
    answer: "2"
    explanation: |-
      **한 번이에요.** 스프링은 설정을 열쇠로 컨텍스트를 캐시해서, 같은 설정의 테스트 클래스는 처음 만든 컨텍스트를 다시 써요.
    source: https://docs.spring.io/spring-framework/reference/testing/testcontext-framework/ctx-management/caching.html
  - key: st-cache-mockitobean
    concept: core
    coreQuestion: q4
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: '@SpringBootTest 클래스 10개가 있고, 각자 서로 다른 빈 하나씩을 @MockitoBean으로 바꿨어요. 나머지 설정은 같아요. 컨텍스트는 몇 번 만들어질까요?'
    choices:
      - 한 번
      - 두 번
      - 10번
      - 0번
    answer: "3"
    explanation: |-
      **10번이에요.** @MockitoBean 목록도 캐시의 열쇠에 들어가서, 목으로 바꾼 빈이 다르면 설정이 다른 컨텍스트예요.

      - 자주 바꾸는 목 빈을 공통 부모 클래스에 모으면 컨텍스트 하나를 나눠 써요
    source: https://docs.spring.io/spring-framework/reference/testing/testcontext-framework/ctx-management/caching.html
  # ── 면접 ──
  - key: st-interview
    concept: core
    coreQuestion: all
    type: descriptive
    status: reviewed
    difficulty: 2
    body: 면접에서 "@SpringBootTest와 슬라이스 테스트의 차이, 테스트에 @Transactional을 붙일 때 주의할 점을 설명해 주세요"라는 질문을 받았어요. 1분 안에 답해 보세요.
    explanation: |-
      **@SpringBootTest는 컨텍스트 전체를, 슬라이스는 한 계층만 띄우고, 테스트의 @Transactional은 운영과 다르게 만들 수 있어요.**

      - **@SpringBootTest:** 모든 빈과 자동 설정. 운영에 가깝지만 느리다
      - **슬라이스:** @WebMvcTest는 웹 계층, @DataJpaTest는 JPA. 없는 빈은 @MockitoBean
      - **@Transactional:** 롤백되지만 서비스가 합류해 지연 로딩이 성공하고 flush 오류를 못 본다
      - **컨텍스트 캐시:** 설정이 같으면 다시 쓰고 목 빈이 다르면 새로 띄운다
    checklist:
      - '@SpringBootTest가 컨텍스트 전체를 띄운다고 말했다'
      - 슬라이스가 한 계층의 빈만 띄우고 나머지는 목으로 넣는다고 말했다
      - 테스트의 @Transactional은 끝나면 롤백된다고 말했다
      - 서비스가 테스트의 트랜잭션에 합류해 지연 로딩이 운영과 다르게 성공한다고 말했다
      - 컨텍스트 캐시와 목 빈이 다르면 새로 띄운다는 것을 말했다
    source: https://docs.spring.io/spring-boot/reference/testing/spring-boot-applications.html
