# HTTPS와 TLS 문제
# 형식: https://github.com/wanja727/retrievo/blob/main/docs/content-format.md
#
# 모든 문제는 coreQuestions의 질문 하나에 묶이고(coreQuestion), 답의 근거가 레슨 본문에 있다
# (site/src/content/lesson-pages/https-tls.yaml의 says).
# 동작에 관한 정답은 verification의 HttpsTlsTest로 확인했다 (자바 21 JSSE, 스프링 부트 3.5).
# TLS 메시지의 순서와 암호화 시점은 RFC 8446이 근거다.
# 질문마다 첫 문제는 본문의 예시로 묻고, 둘째 문제는 다른 상황으로 옮겨 묻는다.
# 2026-11-25에 만들고 같은 날 검수해 reviewed로 바꿨다. 정답을 본문(says)과 테스트 결과에 맞춰 봤고, 문제 하나만 보고 풀리는지 봤다. 고친 문제는 없다.
subject:
  key: dev
  name: 개발자 면접
lesson:
  key: https-tls
  title: HTTPS와 TLS
  unit: 네트워크와 웹
  order: 60
concepts:
  - key: core
    name: HTTPS와 TLS
coreQuestions:
  - key: q1
    text: "HTTP는 무엇이 위험하고, HTTPS는 무엇을 지키나요?"
  - key: q2
    text: "TLS는 내용을 어떻게 암호화하나요?"
  - key: q3
    text: "인증서는 무엇을 증명하고, 클라이언트는 무엇을 확인하나요?"
  - key: q4
    text: "TLS 연결은 어떤 순서로 맺나요?"
questions:
  # ── 질문 1 ──
  - key: tls-what-hidden
    concept: core
    coreQuestion: q1
    type: multiple_choice
    status: reviewed
    difficulty: 1
    body: "카페 와이파이에서 `https://shop.example.com`에 로그인 요청(본문에 비밀번호)을 보냈어요. 같은 와이파이의 공격자가 오가는 바이트를 엿볼 때 읽을 수 없는 것은 무엇일까요?"
    choices:
      - 서버의 IP 주소
      - 요청 본문의 비밀번호
      - 접속한 포트 443
      - 주고받은 바이트의 양
    answer: "2"
    explanation: |-
      **비밀번호예요.** TLS가 HTTP 글 전체(경로, 헤더, 본문)를 암호화해요.

      - 테스트에서 HTTP로 보낸 바이트에는 비밀번호가 그대로 있었고, HTTPS로 보낸 바이트에는 POST라는 낱말조차 없었어요
      - IP와 포트, 주고받은 양은 아래 계층이나 바깥에서 보여서 숨기지 못해요
    source: https://www.rfc-editor.org/rfc/rfc8446.html
  - key: tls-auth-needed
    concept: core
    coreQuestion: q1
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: "공격자가 은행 서버인 척하면서 자기가 만든 인증서로 TLS 연결을 맺으려 해요. 연결되면 오가는 내용은 암호화돼요. TLS의 세 가지 가운데 이 공격을 막는 것은 무엇일까요?"
    choices:
      - 기밀성
      - 무결성
      - 인증
      - 막지 못한다. 암호화되니 안전하다
    answer: "3"
    explanation: |-
      **인증이에요.** 클라이언트는 인증서가 은행 도메인의 것이고 믿는 CA가 서명했는지 확인해요.

      - 암호화만으로는 상대가 누구인지 몰라요. 공격자와 암호화된 대화를 하게 될 뿐이에요
      - 그래서 인증서 확인을 끄면 HTTPS가 사칭을 막지 못해요
    source: https://www.rfc-editor.org/rfc/rfc8446.html#section-1
  # ── 질문 2 ──
  - key: tls-symmetric
    concept: core
    coreQuestion: q2
    type: multiple_choice
    status: reviewed
    difficulty: 1
    body: "TLS 연결이 맺어진 뒤 HTTP 요청과 응답의 본문을 암호화하는 데 쓰는 것은 무엇일까요?"
    choices:
      - 서버의 개인키
      - 키 교환으로 양쪽이 만든 대칭키
      - 서버의 인증서
      - 클라이언트의 비밀번호
    answer: "2"
    explanation: |-
      **키 교환으로 만든 대칭키예요.** 많은 데이터는 빠른 대칭키 암호(AES)로 암호화해요.

      - 테스트에서 자바 21은 TLS_AES_256_GCM_SHA384로 합의했어요
      - 개인키는 인증서의 주인임을 보이는 서명에 써요
    source: https://www.rfc-editor.org/rfc/rfc8446.html
  - key: tls-forward-secrecy
    concept: core
    coreQuestion: q2
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: "공격자가 1년 동안 어떤 서비스의 TLS 1.3 통신을 모두 녹화해 뒀어요. 오늘 그 서비스 서버의 개인키를 훔쳤어요. 녹화한 지난 대화를 풀 수 있을까요?"
    choices:
      - 풀 수 있다. 개인키로 모든 대화를 연다
      - 풀 수 없다. 연결마다 새로 만들고 버린 키 교환 값으로 대칭키를 만들었다
      - 풀 수 있다. 인증서에 대칭키가 들어 있다
      - 녹화 자체가 불가능하다
    answer: "2"
    explanation: |-
      **풀 수 없어요.** TLS 1.3의 키 교환은 연결마다 새 비밀 값을 쓰고 버려요. 전방 비밀성이라고 해요.

      - 대칭키는 양쪽의 비밀 값으로 계산했고, 그 값은 남지 않았어요
      - 개인키는 인증서의 주인임을 보이는 서명에만 썼어요
    source: https://www.rfc-editor.org/rfc/rfc8446.html#section-1.2
  # ── 질문 3 ──
  - key: tls-pkix
    concept: core
    coreQuestion: q3
    type: multiple_choice
    status: reviewed
    difficulty: 1
    body: "keytool로 스스로 서명한 localhost 인증서를 만들어 TLS 서버를 띄웠어요. 기본 설정의 자바 HttpClient로 `https://localhost:8443`에 요청하면 어떻게 될까요?"
    choices:
      - 연결된다. 암호화는 되기 때문이다
      - SSLHandshakeException(PKIX path building failed)으로 거부된다
      - 경고를 출력하고 연결된다
      - HTTP로 바꿔서 연결된다
    answer: "2"
    explanation: |-
      **PKIX path building failed로 거부돼요.** 서명을 따라가도 자바의 신뢰 저장소(cacerts)에 있는 CA가 나오지 않아요.

      - 그 인증서를 신뢰 저장소에 넣은 SSLContext로는 연결돼요
      - 운영에서는 CA가 발급한 인증서를 써요
    source: https://www.rfc-editor.org/rfc/rfc5280.html#section-6
  - key: tls-wrong-domain
    concept: core
    coreQuestion: q3
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: "`api.shop.com`용으로 발급받은 인증서를 `pay.shop.com` 서버에 그대로 설치했어요. 믿는 CA가 발급했고 기간도 남았어요. 클라이언트가 `https://pay.shop.com`에 연결하면 어떻게 될까요?"
    choices:
      - 연결된다. CA가 발급했으니까
      - 거부된다. 인증서의 도메인이 접속한 주소와 다르다
      - 연결된다. 같은 shop.com이니까
      - 거부된다. 기간이 지났다
    answer: "2"
    explanation: |-
      **거부돼요.** 클라이언트는 인증서의 도메인(SAN)이 접속한 주소와 같은지 확인해요.

      - 테스트에서 shop.example.com 인증서로 localhost에 접속하자 No subject alternative DNS name matching으로 거부됐어요
      - 그래서 남의 인증서를 훔쳐도 다른 도메인에서는 쓸 수 없어요
    source: https://www.rfc-editor.org/rfc/rfc9525.html
  - key: tls-trust-all
    concept: core
    coreQuestion: q3
    type: code_predict
    status: reviewed
    difficulty: 2
    body: "사내 API를 부르다 PKIX 오류가 나자 누군가 아래 TrustManager를 HttpClient에 넣었어요. 오류는 사라졌어요. 이 코드 때문에 생긴 문제는 무엇일까요?"
    code: |-
      new X509TrustManager() {
        public void checkServerTrusted(
            X509Certificate[] chain,
            String authType) {
        }
        public void checkClientTrusted(
            X509Certificate[] chain,
            String authType) {
        }
        public X509Certificate[]
            getAcceptedIssuers() {
          return new X509Certificate[0];
        }
      }
    choices:
      - 암호화가 꺼져서 내용이 그대로 보인다
      - 서버 확인(인증)이 꺼져서 누가 그 API인 척해도 연결한다
      - 연결이 HTTP로 바뀐다
      - 문제없다. 사내망이라 안전하다
    answer: "2"
    explanation: |-
      **인증이 꺼졌어요.** checkServerTrusted가 아무것도 확인하지 않아 어떤 인증서든 받아들여요.

      - 암호화는 여전히 되지만, 공격자와 암호화된 대화를 할 수 있어요
      - 고치려면 사내 CA의 인증서를 신뢰 저장소에 넣어요
    source: https://docs.oracle.com/en/java/javase/21/security/java-secure-socket-extension-jsse-reference-guide.html
  # ── 질문 4 ──
  - key: tls-cert-encrypted
    concept: core
    coreQuestion: q4
    type: ox
    status: reviewed
    difficulty: 1
    body: "\"TLS 1.3 handshake에서 서버의 인증서는 암호화되어 간다\""
    answer: O
    explanation: |-
      **맞아요.** ServerHello로 키 교환이 끝나면 대칭키가 생기고, 그 뒤의 메시지는 모두 암호화돼요.

      - 인증서, CertificateVerify, Finished는 ServerHello 뒤에 가요
      - ClientHello와 ServerHello는 암호화되지 않아요
    source: https://www.rfc-editor.org/rfc/rfc8446.html#section-2
  - key: tls-round-trips
    concept: core
    coreQuestion: q4
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: "서울에서 미국 서버까지 왕복이 150ms예요. 새로 연결해서 HTTPS(TLS 1.3) 요청 하나를 보내고 응답을 받기까지 왕복은 최소 몇 번 들까요? (DNS는 빼고, 서버의 처리 시간은 0으로 봐요)"
    choices:
      - 한 번 (150ms)
      - 두 번 (300ms)
      - 세 번 (450ms)
      - 네 번 (600ms)
    answer: "3"
    explanation: |-
      **세 번이에요.** TCP 연결에 왕복 한 번, TLS 1.3 연결에 한 번, HTTP 요청과 응답에 한 번이에요.

      - 그래서 연결을 다시 쓰는 것이 HTTPS에서 더 중요해요
      - HTTP였다면 TLS가 없어 두 번이에요
    source: https://www.rfc-editor.org/rfc/rfc8446.html#section-2
  # ── 전체 ──
  - key: tls-interview
    concept: core
    coreQuestion: all
    type: descriptive
    status: reviewed
    difficulty: 2
    body: 면접에서 "HTTPS는 어떻게 안전한가요? TLS handshake를 설명해 주세요"라는 질문을 받았어요. 1분 안에 답해 보세요.
    explanation: |-
      **HTTPS는 HTTP를 TLS 위에서 보내고, TLS는 키 교환으로 대칭키를 만들어 암호화하고 인증서로 서버를 확인해요.**

      - **지키는 것:** 기밀성(암호화), 무결성(바뀌면 알아챔), 인증(인증서)
      - **암호화:** ECDHE 키 교환으로 양쪽만 아는 대칭키를 만들고 AES GCM으로 데이터를 암호화한다
      - **인증서:** CA가 서명한 문서. 믿는 CA까지 이어지는지, 도메인, 기간을 확인한다
      - **순서:** TCP 뒤 ClientHello, ServerHello, 인증서와 Finished, 클라이언트 Finished. TCP 다음 왕복 한 번
    checklist:
      - HTTPS가 HTTP를 TLS 위에서 보내는 것이라고 말했다
      - 기밀성, 무결성, 인증 세 가지를 말했다
      - 키 교환으로 대칭키를 만들어 데이터를 암호화한다고 말했다
      - 인증서를 CA 서명, 도메인, 기간으로 확인한다고 말했다
      - ClientHello와 ServerHello로 시작하는 handshake 순서를 말했다
    source: https://www.rfc-editor.org/rfc/rfc8446.html
