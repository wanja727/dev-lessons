# 다대다와 매핑 테이블 문제
# 형식: https://github.com/wanja727/retrievo/blob/main/docs/content-format.md
#
# 모든 문제는 coreQuestions의 질문 하나에 묶이고(coreQuestion), 답의 근거가 레슨 본문에 있다
# (site/src/content/lesson-pages/many-to-many-table.yaml의 says).
# 동작에 관한 정답은 verification의 ManyToManyTableTest로 확인했다 (PostgreSQL 16, 하이버네이트 6.6).
# 2026-11-27에 만들었다. 검수 전이라 draft다.
# 질문마다 첫 문제는 본문의 예시로 묻고, 둘째 문제는 다른 상황으로 옮겨 묻는다. 실무 구역의 문제는 관련된 질문의 셋째 문제다.
subject:
  key: dev
  name: 개발자 면접
lesson:
  key: many-to-many-table
  title: 다대다와 매핑 테이블
  unit: DB
  order: 618
concepts:
  - key: core
    name: 다대다와 매핑 테이블
coreQuestions:
  - key: q1
    text: "매핑 테이블에 같은 쌍이 두 번 들어가면 무슨 일이 생기나요?"
  - key: q2
    text: "기본 키는 (member_id, study_id)로 둘까요, 따로 id를 둘까요?"
  - key: q3
    text: "양쪽 방향으로 찾으려면 인덱스를 어떻게 두나요?"
  - key: q4
    text: "가입일이나 역할은 어디에 두나요?"
  - key: q5
    text: "회원이나 스터디를 지우면 매핑 행은 어떻게 하나요?"
questions:
  # ── 질문 1 ──
  - key: mt-dup-count
    concept: core
    coreQuestion: q1
    type: code_predict
    status: draft
    difficulty: 1
    body: "매핑 테이블 `study_member(member_id, study_id)`에는 두 외래 키만 있고 기본 키도 UNIQUE도 없어요. kim(1)이 자바 스터디(1) 가입 버튼을 두 번 눌렀고, lee(2)도 가입했어요. 마지막 select의 결과는? (PostgreSQL 16)"
    code: |-
      insert into study_member
      values (1, 1), (1, 1), (2, 1);

      select count(*) from study_member
       where study_id = 1;
    choices:
      - "2"
      - "3"
      - 둘째 (1, 1)이 외래 키 위반으로 실패해서 2
    answer: "2"
    explanation: |-
      **3이에요.** 같은 짝 (1, 1)이 두 행으로 들어갔어요.

      - 외래 키는 회원 1과 스터디 1이 있는지만 보고, 짝이 겹치는지는 보지 않아요
      - 같은 사실이 두 행이라 인원 수, 정원 검사, 조인한 목록이 모두 부풀어요
      - `primary key (member_id, study_id)`를 걸면 둘째 (1, 1)은 23505로 실패해요
      - 검증: ManyToManyTableTest.duplicatePair
    source: https://github.com/wanja727/dev-lessons/blob/main/verification/src/test/java/lab/devlessons/manytomany/ManyToManyTableTest.java
  - key: mt-dup-post-tag
    concept: core
    coreQuestion: q1
    type: multiple_choice
    status: draft
    difficulty: 2
    body: "게시글 태그 매핑 `post_tag(post_id, tag_id)`에는 두 외래 키만 있어요. 버그로 (10, 3)이 두 번 들어갔어요. 태그 3이 붙은 글은 실제로 4개예요. 이 문제를 바르게 고치는 방법은?"
    choices:
      - "태그 수를 셀 때마다 `count(distinct post_id)`로 센다"
      - "`post_tag`에 `primary key (post_id, tag_id)`를 걸어 둘째 행을 DB가 막게 한다"
      - "앱에서 태그를 붙이기 전에 이미 붙었는지 조회한다. 제약은 두지 않는다"
      - "`post_id` 외래 키에 ON DELETE CASCADE를 건다"
    answer: "2"
    explanation: |-
      **짝에 기본 키나 UNIQUE를 걸어 DB가 막게 해요.**

      - `count(distinct)`는 세는 곳 하나만 고쳐요. 조인한 목록과 다른 집계는 여전히 부풀어요
      - 앱의 사전 확인은 동시에 오는 두 요청을 둘 다 통과시켜요
      - CASCADE는 지울 때의 규칙이라 겹치는 짝과 상관없어요
    source: https://www.postgresql.org/docs/16/ddl-constraints.html
  - key: mt-many-to-many-list
    concept: core
    coreQuestion: q1
    type: multiple_choice
    status: draft
    difficulty: 3
    body: "`Member`에 `@ManyToMany @JoinTable(name = \"member_study\") List<Study> studies`가 있고, 테이블은 하이버네이트 6.6의 `ddl-auto`로 만들었어요. 스터디 셋에 들어간 kim에게서 `studies.remove(0)`으로 하나를 빼고 커밋하면 `member_study`에 어떤 SQL이 나가나요?"
    choices:
      - "`delete ... where member_id=? and study_id=?` 한 번"
      - "`delete ... where member_id=?` 한 번과 `insert` 두 번"
      - "`update ... set study_id=null` 한 번"
      - "아무것도 나가지 않는다"
    answer: "2"
    explanation: |-
      **kim의 행을 모두 지우고 남은 둘을 다시 넣어요.**

      - List로 둔 매핑 테이블에는 기본 키가 없어서, 하이버네이트가 지울 행 하나를 가리킬 방법이 없어요
      - 같은 쌍도 그대로 들어가요(기본 키가 없으니까요)
      - Set으로 두면 (member_id, study_id) 기본 키가 생기고 그 행 하나만 지워요. 열을 더해야 하면 연결 엔티티로 풀어요
      - 검증: ManyToManyTableTest.manyToManyListVersusSet
    source: https://github.com/wanja727/dev-lessons/blob/main/verification/src/test/java/lab/devlessons/manytomany/ManyToManyTableTest.java
  # ── 질문 2 ──
  - key: mt-surrogate-without-unique
    concept: core
    coreQuestion: q2
    type: multiple_choice
    status: draft
    difficulty: 1
    body: "매핑 테이블을 `study_member(id bigint generated always as identity primary key, member_id, study_id)`로 만들었어요. 두 열은 외래 키이고 다른 제약은 없어요. kim을 자바 스터디에 두 번 넣으면 어떻게 되나요?"
    choices:
      - 둘째 insert가 기본 키 위반(23505)으로 실패한다
      - 둘 다 들어간다
      - 둘째 insert가 외래 키 위반(23503)으로 실패한다
      - 둘째 insert가 첫째 행을 덮어쓴다
    answer: "2"
    explanation: |-
      **둘 다 들어가요.** id는 행마다 새 번호라 짝이 겹쳐도 겹치지 않아요.

      - 따로 id를 두면 `unique (member_id, study_id)`를 꼭 함께 걸어야 같은 쌍을 막아요
      - 복합 기본 키 (member_id, study_id)는 그 자체로 막아요
      - 검증: ManyToManyTableTest.surrogateIdNeedsUnique
    source: https://github.com/wanja727/dev-lessons/blob/main/verification/src/test/java/lab/devlessons/manytomany/ManyToManyTableTest.java
  - key: mt-composite-reference
    concept: core
    coreQuestion: q2
    type: multiple_choice
    status: draft
    difficulty: 2
    body: "수강 테이블 `enrollment`의 기본 키가 `(student_id, course_id)`예요. 과제 제출 테이블 `submission`이 \"어느 수강의 제출인지\"를 외래 키로 가리키려면 어떻게 해야 하나요? (PostgreSQL 16)"
    choices:
      - "`student_id` 한 열로 `references enrollment(student_id)`를 건다"
      - "`foreign key (student_id, course_id) references enrollment(student_id, course_id)`로 두 열을 함께 가리킨다"
      - "`course_id` 한 열로 `references enrollment(course_id)`를 건다"
      - "복합 기본 키는 외래 키로 가리킬 수 없다"
    answer: "2"
    explanation: |-
      **두 열을 함께 가리켜요.** 복합 기본 키는 두 열이 합쳐져야 행 하나가 정해져요.

      - 한 열만 가리키면 그 열에 맞는 UNIQUE가 없어서 42830 오류로 외래 키를 만들 수 없어요
      - 매핑 행을 다른 테이블이 자주 가리킨다면 따로 id를 두고 UNIQUE를 거는 것이 편해요. 외래 키가 한 열이에요
      - 검증: ManyToManyTableTest.compositeKeyReference
    source: https://github.com/wanja727/dev-lessons/blob/main/verification/src/test/java/lab/devlessons/manytomany/ManyToManyTableTest.java
  # ── 질문 3 ──
  - key: mt-index-study-direction
    concept: core
    coreQuestion: q3
    type: multiple_choice
    status: draft
    difficulty: 1
    body: "매핑 테이블 `study_member`에 짝이 10만 개 있고, 인덱스는 기본 키 `(member_id, study_id)` 하나뿐이에요. 스터디 하나의 짝은 50개쯤이에요. `select member_id from study_member where study_id = 42`의 실행계획은? (PostgreSQL 16, 통계를 갱신한 뒤)"
    choices:
      - 기본 키 인덱스로 Index Only Scan
      - Seq Scan
      - 기본 키 인덱스로 Index Scan
    answer: "2"
    explanation: |-
      **Seq Scan이에요.** 기본 키 인덱스는 member_id로 먼저 정렬돼 있어요.

      - study_id가 42인 짝은 인덱스 곳곳에 흩어져 있어 범위를 좁힐 수 없어요
      - `(study_id, member_id)` 인덱스를 더하면 Index Only Scan이 돼요
      - 검증: ManyToManyTableTest.bothDirectionIndexes
    source: https://www.postgresql.org/docs/16/indexes-multicolumn.html
  - key: mt-index-follow
    concept: core
    coreQuestion: q3
    type: multiple_choice
    status: draft
    difficulty: 2
    body: "팔로우 테이블 `follow(follower_id, followee_id)`의 기본 키가 `(follower_id, followee_id)`예요. \"나를 팔로우하는 사람\" 목록(`where followee_id = ?`)이 느려요. 무엇을 더하나요?"
    choices:
      - "`(follower_id)` 인덱스"
      - "`(followee_id, follower_id)` 인덱스"
      - "없다. 기본 키 인덱스에 followee_id가 있으니 그대로 빠르다"
      - "`follower_id`에 UNIQUE"
    answer: "2"
    explanation: |-
      **followee_id가 앞인 인덱스를 더해요.** 기본 키 인덱스는 follower_id로 먼저 정렬돼 있어요.

      - followee_id가 같은 항목은 기본 키 인덱스 곳곳에 흩어져 있어요
      - 둘째 열에 follower_id까지 담으면 목록에 필요한 값을 인덱스에서 바로 읽어요
      - `follower_id`에 UNIQUE를 걸면 한 사람이 한 명만 팔로우할 수 있게 돼요
    source: https://www.postgresql.org/docs/16/indexes-multicolumn.html
  # ── 질문 4 ──
  - key: mt-attr-role
    concept: core
    coreQuestion: q4
    type: multiple_choice
    status: draft
    difficulty: 1
    body: "kim은 자바 스터디에서는 LEADER, SQL 스터디에서는 MEMBER예요. 역할(`role`) 열은 어디에 두나요?"
    choices:
      - "`member` 테이블"
      - "`study` 테이블"
      - "매핑 테이블 `study_member`"
      - "`member`와 `study` 두 테이블 모두"
    answer: "3"
    explanation: |-
      **매핑 테이블에 둬요.** 역할은 회원의 사실도 스터디의 사실도 아니고 "kim이 자바 스터디에서"라는 짝의 사실이에요.

      - 회원 테이블에 두면 칸 하나라 스터디마다 다른 역할을 담을 수 없어요
      - 스터디 테이블에 두면 회원마다 다른 역할을 담을 수 없어요
      - 열이 생긴 매핑 테이블은 멤버십이라는 엔티티로 봐요
    source: https://www.postgresql.org/docs/16/ddl-constraints.html
  - key: mt-attr-reenroll
    concept: core
    coreQuestion: q4
    type: multiple_choice
    status: draft
    difficulty: 3
    body: "수강 테이블의 기본 키가 `(student_id, course_id)`이고, 수강을 취소하면 행을 지우지 않고 `dropped_at`에 날짜를 적어요. 취소한 학생이 같은 강의를 다시 신청하자 23505 오류가 났어요. 취소 기록을 남기면서 다시 신청할 수 있게 하려면? (PostgreSQL 16)"
    choices:
      - "기본 키를 없애고 아무 제약도 두지 않는다"
      - "id를 기본 키로 두고, `(student_id, course_id)`에 `where dropped_at is null` 부분 유니크 인덱스를 건다"
      - "다시 신청할 때 지난 행의 `dropped_at`을 지우고 그 행을 다시 쓴다"
      - "`(student_id, course_id, dropped_at)`을 기본 키로 둔다"
    answer: "2"
    explanation: |-
      **id를 기본 키로 두고, 활동 중인 짝만 겹치지 않게 부분 유니크 인덱스를 걸어요.**

      - 기록을 남기면 같은 짝이 여러 행이 돼서 복합 기본 키로는 담을 수 없어요
      - 부분 유니크 인덱스는 `dropped_at`이 NULL인 행끼리만 겹치는지 봐요. 듣는 중인 수강은 하나, 지난 기록은 여럿이에요
      - 제약을 없애면 같은 강의를 동시에 두 번 신청하는 것도 막지 못해요. 지난 행을 다시 쓰면 기록이 사라져요
      - 기본 키의 열은 NULL이 될 수 없어서 `dropped_at`을 넣은 기본 키는 듣는 중인 행을 담을 수 없어요
      - 검증: ManyToManyTableTest.rejoinHistory
    source: https://www.postgresql.org/docs/16/indexes-partial.html
  # ── 질문 5 ──
  - key: mt-delete-cascade
    concept: core
    coreQuestion: q5
    type: multiple_choice
    status: draft
    difficulty: 1
    body: "`study_member`의 두 외래 키가 모두 `on delete cascade`예요. kim과 lee가 자바 스터디에, kim이 SQL 스터디에 있어요. 자바 스터디를 지우면 어떻게 되나요?"
    choices:
      - 자바 스터디의 짝 둘이 지워지고, 회원 kim과 lee도 지워진다
      - 자바 스터디의 짝 둘만 지워지고, 회원은 모두 남는다
      - kim의 짝이 모두 지워져 SQL 스터디의 짝도 사라진다
      - 짝이 남아 있어 23503 오류로 실패한다
    answer: "2"
    explanation: |-
      **자바 스터디를 가리키는 짝 둘만 지워져요.** CASCADE는 지운 부모를 가리키는 행만 지워요.

      - 매핑 테이블을 넘어 반대편의 회원까지 가지 않아요
      - kim의 SQL 스터디 짝은 자바 스터디를 가리키지 않아서 남아요
      - 검증: ManyToManyTableTest.onDelete
    source: https://github.com/wanja727/dev-lessons/blob/main/verification/src/test/java/lab/devlessons/manytomany/ManyToManyTableTest.java
  - key: mt-delete-order-item
    concept: core
    coreQuestion: q5
    type: multiple_choice
    status: draft
    difficulty: 2
    body: "주문 항목 `order_item(order_id, product_id, qty, price)`이 상품을 외래 키로 가리켜요. 판매를 끝낸 상품을 지우려 할 때, `product_id` 외래 키의 규칙으로 알맞은 것은?"
    choices:
      - "ON DELETE CASCADE로 그 상품의 주문 항목도 지운다"
      - "ON DELETE SET NULL로 상품과의 연결만 끊는다"
      - "기본(NO ACTION)으로 삭제를 막고, 상품은 지우지 않고 판매 종료로 표시한다"
    answer: "3"
    explanation: |-
      **주문 항목은 남겨야 할 기록이라 삭제를 막고, 상품은 상태로 표시해요.**

      - CASCADE는 지난 주문의 기록을 지워요
      - SET NULL은 무엇을 샀는지 모르는 행을 남겨요. 키의 일부인 열이면 NOT NULL 위반(23502)으로 실패해요
      - CASCADE는 짝만 뜻하는 매핑 행(스터디 멤버십, 좋아요)에 써요
    source: https://www.postgresql.org/docs/16/ddl-constraints.html
  # ── 면접 ──
  - key: mt-interview
    concept: core
    coreQuestion: all
    type: descriptive
    status: draft
    difficulty: 3
    body: 면접에서 "다대다 관계를 테이블로 어떻게 설계하고, 매핑 테이블에서는 무엇을 신경 쓰나요?"라는 질문을 받았어요. 1분 안에 답해 보세요.
    explanation: |-
      **두 외래 키를 가진 매핑 테이블로 풀고, 짝의 중복, 양쪽 방향 인덱스, 짝의 속성, 삭제 규칙을 정해요.**

      - **중복:** 외래 키는 짝이 겹치는지 보지 않는다. (a_id, b_id)에 기본 키나 UNIQUE. 따로 id를 두면 UNIQUE를 꼭 함께
      - **인덱스:** (a_id, b_id)는 a_id 방향만 빠르다. 반대 방향에 (b_id, a_id)
      - **속성:** 가입일, 역할은 짝의 사실이라 매핑 테이블의 열. 재가입 기록은 부분 유니크 인덱스
      - **삭제:** 짝만 뜻하면 CASCADE, 기록이면 막는다
      - **JPA:** @ManyToMany 대신 연결 엔티티와 @ManyToOne 둘
    checklist:
      - 두 외래 키를 가진 매핑 테이블로 푼다고 말했다
      - 같은 짝을 기본 키나 UNIQUE로 막는다고 말했다
      - 복합 인덱스의 열 순서 때문에 반대 방향 인덱스가 필요하다고 말했다
      - 가입일이나 역할 같은 값은 매핑 테이블에 둔다고 말했다
      - 부모를 지울 때 매핑 행이 짝인지 기록인지에 따라 CASCADE와 막기를 고른다고 말했다
    source: https://www.postgresql.org/docs/16/ddl-constraints.html
