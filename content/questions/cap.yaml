# CAP 정리와 결과적 일관성 문제
# 형식: https://github.com/wanja727/retrievo/blob/main/docs/content-format.md
#
# 모든 문제는 coreQuestions의 질문 하나에 묶이고(coreQuestion), 답의 근거가 레슨 본문에 있다
# (site/src/content/lesson-pages/cap.yaml의 says).
# 동작에 관한 정답은 verification의 CapTest(복제본 세 개짜리 모형)로 확인했다.
# 질문마다 첫 문제는 본문의 예시로 묻고, 둘째 문제는 다른 상황으로 옮겨 묻는다.
# 쓴 날 검수까지 마쳐 reviewed로 올린다 (2026-11-26)
subject:
  key: dev
  name: 개발자 면접
lesson:
  key: cap
  title: CAP 정리와 결과적 일관성
  unit: 시스템 설계와 아키텍처
  order: 916
concepts:
  - key: core
    name: CAP 정리와 결과적 일관성
coreQuestions:
  - key: q1
    text: "CAP 정리는 무엇을 말하나요?"
  - key: q2
    text: "일관성을 고르면 무엇을 포기하나요?"
  - key: q3
    text: "가용성을 고르면 무엇이 생기나요?"
  - key: q4
    text: "정족수는 무엇이고, 기능마다 어떻게 고르나요?"
questions:
  # ── 질문 1 ──
  - key: cap-meaning
    concept: core
    coreQuestion: q1
    type: multiple_choice
    status: reviewed
    difficulty: 1
    body: CAP 정리가 말하는 것으로 가장 알맞은 것은?
    choices:
      - 분산 시스템은 일관성, 가용성, 분할 내성 가운데 아무 둘이나 골라 늘 셋 가운데 둘을 지킨다
      - 네트워크 분할이 생기면 일관성과 가용성을 함께 지킬 수 없어 하나를 고른다
      - 분산 시스템은 일관성을 지킬 수 없다
      - 복제본을 늘리면 셋 다 지킨다
    answer: "2"
    explanation: |-
      **분할이 생기면 C와 A 가운데 하나를 골라요.** 분할은 피할 수 없어 P는 고르는 대상이 아니에요.

      - 분할이 없을 때는 셋 다 지킬 수 있어요
    source: https://www.infoq.com/articles/cap-twelve-years-later-how-the-rules-have-changed/
  - key: cap-ca-claim
    concept: core
    coreQuestion: q1
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: 어떤 팀이 "우리는 CA를 고른 분산 DB라서 데이터센터 사이 회선이 끊겨도 일관성과 가용성을 모두 지켜요"라고 설명해요. 무엇이 틀렸나요?
    choices:
      - 틀린 곳이 없다
      - CAP에는 A가 없다
      - 회선이 끊기면 데이터가 사라진다
      - 분산 시스템에서 분할은 피할 수 없어, 분할이 생기면 C와 A 가운데 하나를 포기해야 한다
    answer: "4"
    explanation: |-
      **분할은 고르는 것이 아니라 일어나는 일이에요.** 일어나면 C와 A를 함께 지킬 수 없어요.

      - 떨어진 노드는 답하면서 최신 값을 보장할 방법이 없어요
    source: https://www.infoq.com/articles/cap-twelve-years-later-how-the-rules-have-changed/
  # ── 질문 2 ──
  - key: cap-minority-write
    concept: core
    coreQuestion: q2
    type: multiple_choice
    status: reviewed
    difficulty: 1
    body: 복제본 A, B, C 가운데 C가 분할로 떨어져 나갔어요. 저장소는 두 곳 이상에 써야 성공하는 정족수 쓰기(W=2)를 해요. C에서 쓰면 어떻게 되나요?
    choices:
      - 거절된다
      - 성공한다
      - 성공하고 나중에 A, B에 옮겨진다
      - A, B의 값이 지워진다
    answer: "1"
    explanation: |-
      **거절돼요.** C는 혼자라 두 곳에 쓸 수 없어요. 일관성을 고른 대가로 가용성을 포기해요.

      - 다수 쪽 A, B는 계속 쓰고 읽어요
    source: https://cassandra.apache.org/doc/latest/cassandra/architecture/dynamo.html
  - key: cap-majority-read
    concept: core
    coreQuestion: q2
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: 분할 {A, B} | {C}, 정족수 W=2, R=2인 저장소에서 A에 쓴 뒤 B에서 읽으면 어떻게 되나요?
    choices:
      - 거절된다
      - C의 옛 값을 읽는다
      - A, B 두 곳에 닿아 최신 값을 읽는다
      - 빈 값을 읽는다
    answer: "3"
    explanation: |-
      **최신 값을 읽어요.** 다수 쪽은 정족수를 채워 계속 일해요.

      - 테스트 모형에서도 B에서 준호2를 읽었어요
    source: https://cassandra.apache.org/doc/latest/cassandra/architecture/dynamo.html
  # ── 질문 3 ──
  - key: cap-lww
    concept: core
    coreQuestion: q3
    type: multiple_choice
    status: reviewed
    difficulty: 1
    body: 가용성을 고른 저장소에서 분할 중 A에 준호2, C에 준호3을 썼어요(C의 쓰기가 더 나중). 분할이 풀리고 마지막 쓰기 승리로 맞추면 남는 값은?
    choices:
      - 준호2
      - 준호3. 준호2는 사라진다
      - 준호2와 준호3 둘 다
      - 처음 값 준호
    answer: "2"
    explanation: |-
      **준호3이 남고 준호2는 사라져요.** 마지막 쓰기 승리는 한쪽 쓰기를 버려요.

      - 결국 모든 복제본이 같아지는 것이 결과적 일관성이에요
    source: https://www.allthingsdistributed.com/files/amazon-dynamo-sosp2007.pdf
  - key: cap-likes
    concept: core
    coreQuestion: q3
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: 좋아요 수를 가용성 우선 저장소에 둬요. 분할 중 양쪽에서 좋아요가 3개, 2개 눌렸어요. 풀린 뒤 마지막 쓰기 승리로 맞추면 어떻게 되나요?
    choices:
      - 5개로 합쳐진다
      - 0개가 된다
      - 분할이 풀리지 않는다
      - 한쪽에서 누른 좋아요가 사라진다. 증가분을 더하는 방식으로 합쳐야 한다
    answer: "4"
    explanation: |-
      **한쪽이 사라져요.** 카운터는 양쪽의 증가분을 더하는 식으로 합쳐요.

      - 데이터에 맞는 합치는 방법을 따로 둬요
    source: https://www.allthingsdistributed.com/files/amazon-dynamo-sosp2007.pdf
  # ── 질문 4 ──
  - key: cap-r1w1
    concept: core
    coreQuestion: q4
    type: multiple_choice
    status: reviewed
    difficulty: 1
    body: 복제본 N=3이에요. A에만 쓰고(W=1) 아직 복제되기 전에 C 하나만 읽었어요(R=1). 무엇을 읽나요?
    choices:
      - 옛 값을 읽을 수 있다. R + W가 N보다 크지 않다
      - 늘 최신 값
      - 오류
      - A의 값을 C가 가져와 준다
    answer: "1"
    explanation: |-
      **옛 값을 읽을 수 있어요.** R + W = 2라 쓴 곳과 읽은 곳이 겹치지 않을 수 있어요.

      - R=3으로 읽으니 최신 값이었어요
    source: https://cassandra.apache.org/doc/latest/cassandra/architecture/dynamo.html
  - key: cap-quorum-math
    concept: core
    coreQuestion: q4
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: 복제본 N=5, 쓰기를 W=3에게 확인받아요. 읽기가 늘 최신 쓰기를 포함하려면 R은 최소 얼마인가요?
    choices:
      - "1"
      - "2"
      - "3"
      - "5"
    answer: "3"
    explanation: |-
      **3이에요.** R + W > N이어야 해서 R + 3 > 5예요.

      - 그러면 읽은 복제본과 쓴 복제본이 적어도 하나 겹쳐요
    source: https://cassandra.apache.org/doc/latest/cassandra/architecture/dynamo.html
  - key: cap-balance-replica
    concept: core
    coreQuestion: q4
    type: code_predict
    status: reviewed
    difficulty: 2
    body: readOnly 트랜잭션은 비동기 복제본으로 가요. 아래 코드로 출금을 허락할지 정할 때의 문제는?
    code: |-
      @Transactional(readOnly = true)
      public boolean canWithdraw(Long id,
          long amount) {
        return accounts.balance(id) >= amount;
      }
    choices:
      - 문제없다
      - readOnly는 출금을 막는다
      - 복제본의 잔액은 방금의 출금이 아직 반영되지 않은 옛 값일 수 있어, 잔액보다 많이 내줄 수 있다
      - 잔액이 두 배로 보인다
    answer: "3"
    explanation: |-
      **옛 잔액으로 판단할 수 있어요.** 복제본은 결과적 일관성이에요.

      - 돈을 내주는 판단은 원본에서 조건부 UPDATE로 해요
    source: https://www.infoq.com/articles/cap-twelve-years-later-how-the-rules-have-changed/
  # ── 네 질문을 하나로 ──
  - key: cap-interview
    concept: core
    coreQuestion: all
    type: descriptive
    status: reviewed
    difficulty: 2
    body: 면접에서 "CAP 정리와 결과적 일관성을 설명해 주세요"라는 질문을 받았어요. 1분 안에 답해 보세요.
    explanation: |-
      **분할이 생기면 일관성과 가용성 가운데 하나를 고르고, 가용성을 고르면 결국 맞춰지는 결과적 일관성이 돼요.**

      - **CAP:** 분할은 피할 수 없으니 그때 C와 A 가운데 하나
      - **일관성:** 정족수에 못 닿는 쪽은 거절
      - **가용성:** 엇갈렸다가 결국 맞춰진다. 충돌을 합치는 방법이 필요하다
      - **정족수와 고르기:** R + W > N, 잔액은 일관성, 좋아요는 가용성
    checklist:
      - 분할이 생기면 C와 A 가운데 고른다고 말했다
      - 일관성을 고르면 거절이 생긴다고 말했다
      - 결과적 일관성을 정의했다
      - 충돌 해결이나 마지막 쓰기 승리의 문제를 말했다
      - 정족수나 기능마다 고르는 기준을 말했다
    source: https://www.infoq.com/articles/cap-twelve-years-later-how-the-rules-have-changed/
