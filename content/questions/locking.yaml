# 낙관적 락과 비관적 락 문제
# 형식: https://github.com/wanja727/retrievo/blob/main/docs/content-format.md
#
# 2026-11-25에 레슨을 핵심 질문 구조로 다시 쓰며 문제도 새로 만들었다. 예전 문제(q-xxxxxxxx)는 지웠다.
# 모든 문제는 coreQuestions의 질문 하나에 묶이고(coreQuestion), 답의 근거가 레슨 본문에 있다
# (site/src/content/lesson-pages/locking.yaml의 says).
# 동작에 관한 정답은 verification의 LockingLessonTest, LockingTest로 확인했다 (PostgreSQL 16, 하이버네이트 6.6).
# 2026-11-25에 만들고 같은 날 검수해 reviewed로 바꿨다.
# 질문마다 첫 문제는 본문의 예시로 묻고, 둘째 문제는 다른 상황으로 옮겨 묻는다.
subject:
  key: dev
  name: 개발자 면접
lesson:
  key: locking
  title: 낙관적 락과 비관적 락
  unit: DB
  order: 610
concepts:
  - key: core
    name: 낙관적 락과 비관적 락
coreQuestions:
  - key: q1
    text: "갱신 손실은 왜 생기고, 언제 락이 필요한가요?"
  - key: q2
    text: "낙관적 락은 어떻게 동작하나요?"
  - key: q3
    text: "비관적 락은 어떻게 동작하나요?"
  - key: q4
    text: "낙관적 락과 비관적 락은 어떻게 고르나요?"
questions:
  # ── 질문 1 ──
  - key: lock-lost-update
    concept: core
    coreQuestion: q1
    type: multiple_choice
    status: reviewed
    difficulty: 1
    body: "재고 50에서 두 주문이 동시에 들어와, 각자 재고를 읽고 앱에서 5를 뺀 값을 써요. 둘 다 50을 읽은 뒤에 썼고 락은 없어요. 남은 재고는?"
    choices:
      - "40"
      - "45"
      - 한쪽이 오류로 실패해 45
      - "50"
    answer: "2"
    explanation: |-
      **45예요.** 둘 다 50을 읽고 각자 45를 써서 먼저 쓴 수정이 사라졌어요. 갱신 손실이에요.

      - 오류 없이 두 주문 모두 성공해요
      - 계산을 `quantity = quantity - 5`처럼 UPDATE 안에서 하면 40이에요
    source: https://www.postgresql.org/docs/16/transaction-iso.html#XACT-READ-COMMITTED
  - key: lock-atomic-point
    concept: core
    coreQuestion: q1
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: "포인트 사용을 `update member set point = point - 300 where id = 1 and point >= 300`으로 해요. 포인트가 1000인 회원의 요청 두 개가 동시에 오면 결과는? (PostgreSQL 기본 설정)"
    choices:
      - "700. 한 요청의 수정이 사라진다"
      - "400. 두 번째 UPDATE가 첫 번째의 커밋을 기다렸다가 최신 값에서 뺀다"
      - 두 요청 모두 실패한다
      - "-200까지 내려갈 수 있다"
    answer: "2"
    explanation: |-
      **400이에요.** 계산이 UPDATE 안에 있는 원자적 UPDATE라 행 락이 차례를 지켜요.

      - 이런 경우는 낙관적 락도 비관적 락도 필요 없어요
      - 포인트가 모자라면 `point >= 300` 때문에 0행을 바꿔요
    source: https://www.postgresql.org/docs/16/explicit-locking.html
  # ── 질문 2 ──
  - key: lock-version-zero-rows
    concept: core
    coreQuestion: q2
    type: multiple_choice
    status: reviewed
    difficulty: 1
    body: "A와 B가 재고 행을 version 3으로 읽었어요. A가 `update ... set version = version + 1 where id = 1 and version = 3`으로 고치고 커밋했어요. B가 같은 UPDATE를 보내면 바뀐 행은 몇 개인가요?"
    choices:
      - "1개"
      - "0개"
      - B는 A가 커밋할 때까지 기다린다
      - 오류가 난다
    answer: "2"
    explanation: |-
      **0개예요.** A가 버전을 4로 올려서 `version = 3`에 맞는 행이 없어요.

      - 앱은 바뀐 행 수 0을 보고 충돌로 판단해요
      - 다시 읽어서(version 4) 다시 계산하고 다시 써요
    source: https://jakarta.ee/specifications/persistence/3.1/jakarta-persistence-spec-3.1.html
  - key: lock-wiki-edit
    concept: core
    coreQuestion: q2
    type: multiple_choice
    status: reviewed
    difficulty: 1
    body: "위키 문서 편집에 낙관적 락을 써요. 두 사람이 같은 판을 열고 편집해서 차례로 저장하면 어떻게 되나요?"
    choices:
      - 둘 다 저장되고 나중 사람의 내용만 남는다
      - 먼저 저장한 사람은 성공하고, 나중 사람은 충돌로 실패해 바뀐 내용을 보고 다시 저장한다
      - 나중 사람은 먼저 사람이 저장할 때까지 문서를 열 수 없다
      - 둘 다 실패한다
    answer: "2"
    explanation: |-
      **먼저 저장한 쪽만 성공하고 나중 쪽은 충돌을 받아요.**

      - 편집하는 동안 아무것도 잠그지 않아요
      - 저장하는 순간 버전으로 그사이 바뀌었는지 확인해요
    source: https://jakarta.ee/specifications/persistence/3.1/jakarta-persistence-spec-3.1.html
  - key: lock-version-exception
    concept: core
    coreQuestion: q2
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: "엔티티에 `@Version Long version;`이 있어요. 두 `@Transactional` 메서드가 같은 엔티티를 같은 버전으로 읽고 각자 필드를 고쳐 커밋하면, 나중에 커밋하는 쪽에서 무슨 일이 생기나요?"
    choices:
      - 성공하고 먼저 쪽의 수정을 덮어쓴다
      - "`ObjectOptimisticLockingFailureException`이 난다"
      - 먼저 쪽이 커밋할 때까지 기다린 뒤 성공한다
      - "`DuplicateKeyException`이 난다"
    answer: "2"
    explanation: |-
      **`ObjectOptimisticLockingFailureException`이 나요.** 하이버네이트가 `where id=? and version=?`으로 UPDATE를 보내고 바뀐 행이 0이라 예외를 던져요.

      - 다시 시도는 트랜잭션 바깥에서 새 트랜잭션으로 해요
      - 트랜잭션 안에서 잡으면 이미 롤백 표시가 되어 소용이 없어요
    source: https://docs.spring.io/spring-data/jpa/reference/jpa/locking.html
  # ── 질문 3 ──
  - key: lock-for-update-wait
    concept: core
    coreQuestion: q3
    type: multiple_choice
    status: reviewed
    difficulty: 1
    body: "A가 `select ... for update`로 재고 행을 잠근 채 3초 뒤 커밋해요. 그사이 B가 같은 행을 `for update`로 읽으면 어떻게 되나요?"
    choices:
      - 바로 A가 쓰기 전의 값을 읽는다
      - A가 커밋할 때까지 약 3초 기다린 뒤 A가 쓴 값을 읽는다
      - 바로 오류가 난다
      - A의 트랜잭션이 롤백된다
    answer: "2"
    explanation: |-
      **A가 끝날 때까지 기다렸다가 A가 쓴 값을 읽어요.** FOR UPDATE는 읽는 순간 행을 잠가요.

      - 그래서 실패나 다시 시도는 없지만 기다리는 시간이 생겨요
      - 잠금 없이 하는 일반 SELECT는 기다리지 않아요
    source: https://www.postgresql.org/docs/16/sql-select.html#SQL-FOR-UPDATE-SHARE
  - key: lock-skip-locked
    concept: core
    coreQuestion: q3
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: "배치 서버 세 대가 `job` 테이블에서 처리할 작업을 하나씩 가져가요. 같은 작업을 두 서버가 가져가지 않으면서, 서로를 기다리지도 않게 하려면 무엇을 붙이나요?"
    choices:
      - "`for update`"
      - "`for update nowait`"
      - "`for update skip locked`"
      - 아무것도 붙이지 않는다
    answer: "3"
    explanation: |-
      **`for update skip locked`예요.** 다른 서버가 잠근 작업은 건너뛰고 다음 작업을 가져가요.

      - `for update`는 앞 서버가 끝날 때까지 기다려요
      - `nowait`는 잠긴 행이면 바로 55P03 오류예요
    source: https://www.postgresql.org/docs/16/sql-select.html#SQL-FOR-UPDATE-SHARE
  # ── 질문 4 ──
  - key: lock-retries-pile
    concept: core
    coreQuestion: q4
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: "한 상품의 재고에 동시에 50건이 1씩 빼는 주문이 들어와요. 낙관적 락(다시 시도 포함)과 비관적 락 모두 결과는 맞게 나와요. 둘의 차이로 맞는 것은?"
    choices:
      - 차이가 없다
      - 낙관적 락은 충돌과 다시 시도가 많이 생기고, 비관적 락은 줄을 서서 다시 시도 없이 처리한다
      - 비관적 락에서만 다시 시도가 생긴다
      - 낙관적 락은 재고가 틀린다
    answer: "2"
    explanation: |-
      **한 행에 요청이 몰리면 낙관적 락의 다시 시도가 쌓여요.** 테스트에서 50건을 처리하는 데 다시 시도가 수백 번 생겼어요.

      - 비관적 락은 차례로 처리해 다시 시도가 없어요
      - 그래서 충돌이 잦은 곳에는 비관적 락이 맞아요
    source: https://www.postgresql.org/docs/16/explicit-locking.html
  - key: lock-admin-edit
    concept: core
    coreQuestion: q4
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: "관리자 둘이 가끔 같은 상품 설명을 고쳐요. 고칠 때 화면에서 몇 분씩 편집해요. 어느 락이 맞나요?"
    choices:
      - 낙관적 락
      - 비관적 락. 편집 화면을 여는 순간 잠근다
      - 원자적 UPDATE
      - 락이 필요 없다. 나중 저장이 이기면 된다
    answer: "1"
    explanation: |-
      **낙관적 락이에요.** 충돌이 드물고, 저장할 때 버전으로 확인하면 돼요.

      - 비관적 락이면 편집하는 몇 분 동안 행을 잠가 다른 관리자가 기다려요
      - 락이 없으면 먼저 저장한 사람의 수정이 조용히 사라져요
    source: https://jakarta.ee/specifications/persistence/3.1/jakarta-persistence-spec-3.1.html
  # ── 면접 질문 ──
  - key: lock-interview
    concept: core
    coreQuestion: all
    type: descriptive
    status: reviewed
    difficulty: 2
    body: 면접에서 "낙관적 락과 비관적 락의 차이와 고르는 기준을 설명해 주세요"라는 질문을 받았어요. 1분 안에 답해 보세요.
    explanation: |-
      **둘 다 갱신 손실을 막고, 낙관적 락은 쓸 때 버전으로 확인하고 비관적 락은 읽을 때 잠가요.**

      - **갱신 손실:** 같은 값을 읽고 각자 덮어써서 한쪽 수정이 사라진다
      - **낙관적 락:** `where version = ?`로 쓰고 0행이면 충돌. 진 쪽이 다시 시도. JPA는 @Version
      - **비관적 락:** `select ... for update`로 잠그고 뒤는 기다린다. JPA는 @Lock(PESSIMISTIC_WRITE)
      - **고르기:** 충돌이 드물면 낙관적, 몰리면 비관적. 원자적 UPDATE로 되면 둘 다 필요 없다
    checklist:
      - 갱신 손실이 무엇인지 말했다
      - 낙관적 락은 버전으로 쓸 때 확인하고 실패하면 다시 시도한다고 말했다
      - 비관적 락은 읽을 때 잠가 다른 트랜잭션이 기다린다고 말했다
      - 충돌 빈도로 둘을 고른다고 말했다
      - 원자적 UPDATE로 풀리면 락이 필요 없다고 말했다
    source: https://www.postgresql.org/docs/16/explicit-locking.html
