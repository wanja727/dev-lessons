# 벌크 연산과 영속성 컨텍스트 문제
# 형식: https://github.com/wanja727/retrievo/blob/main/docs/content-format.md
#
# 모든 문제는 coreQuestions의 질문 하나에 묶이고(coreQuestion), 답의 근거가 레슨 본문에 있다
# (site/src/content/lesson-pages/jpa-bulk-update.yaml의 says).
# 동작에 관한 정답은 verification의 BulkUpdateTest로 확인했다 (Hibernate 6.6, PostgreSQL 16).
# 질문마다 첫 문제는 본문의 예시로 묻고, 둘째 문제는 다른 상황으로 옮겨 묻는다.
# 2026-11-25에 만들고 같은 날 검수해 reviewed로 바꿨다.
subject:
  key: dev
  name: 개발자 면접
lesson:
  key: jpa-bulk-update
  title: 벌크 연산과 영속성 컨텍스트
  unit: JPA
  order: 808
concepts:
  - key: core
    name: 벌크 연산과 영속성 컨텍스트
coreQuestions:
  - key: q1
    text: "벌크 연산은 변경 감지와 무엇이 다른가요?"
  - key: q2
    text: "벌크 연산 뒤 조회한 엔티티는 왜 옛 값인가요?"
  - key: q3
    text: "벌크 연산과 영속성 컨텍스트는 어떻게 맞추나요?"
  - key: q4
    text: "벌크 연산에서 빠지는 것은 무엇인가요?"
questions:
  # ── 질문 1 ──
  - key: bulk-dirty-count
    concept: core
    coreQuestion: q1
    type: multiple_choice
    status: reviewed
    difficulty: 1
    body: 한 트랜잭션에서 상품 500개를 findAll로 조회해 가격을 하나씩 바꾸고 커밋했어요. 나가는 UPDATE는 몇 번일까요? 같은 일을 벌크 연산 update Product p set p.price = p.price * 11 / 10으로 하면 몇 번일까요?
    choices:
      - 변경 감지 1번, 벌크 연산 1번
      - 변경 감지 500번, 벌크 연산 1번
      - 변경 감지 500번, 벌크 연산 500번
    answer: "2"
    explanation: |-
      **변경 감지 500번, 벌크 연산 1번이에요.** 변경 감지는 엔티티마다 UPDATE를 보내고, 벌크 연산은 조건에 맞는 행을 한 번에 바꿔요.

      - 벌크 연산은 바뀐 행 수(500)를 돌려줘요
    source: https://jakarta.ee/specifications/persistence/3.1/jakarta-persistence-spec-3.1.html
  - key: bulk-no-modifying
    concept: core
    coreQuestion: q1
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: 스프링 데이터 리포지토리에 @Query("update Member m set m.grade = 'DORMANT' where m.lastLoginAt < :since")만 붙인 int 메서드를 만들고 @Modifying은 빠뜨렸어요. 이 메서드를 부르면 어떻게 될까요?
    choices:
      - 정상으로 회원들을 휴면으로 바꾼다
      - 조회 쿼리로 실행하려다 예외가 나고 아무것도 바뀌지 않는다
      - 첫 회원만 바꾼다
    answer: "2"
    explanation: |-
      **예외가 나요.** @Modifying이 없으면 스프링 데이터가 결과 목록을 받는 조회로 실행하는데, UPDATE는 결과 목록이 없어요.

      - 벌크 연산에는 @Modifying을 함께 붙여요
    source: https://docs.spring.io/spring-data/jpa/reference/jpa/query-methods.html#jpa.modifying-queries
  # ── 질문 2 ──
  - key: bulk-stale-find
    concept: core
    coreQuestion: q2
    type: code_predict
    status: reviewed
    difficulty: 1
    body: 펜의 가격은 1000이고, raiseAll은 @Modifying만 붙은(clearAutomatically 없음) 벌크 연산으로 모든 가격을 10% 올려요. 한 트랜잭션에서 아래를 실행하면 마지막 줄의 값은 무엇일까요?
    code: |-
      Product pen = repository
          .findById(1L).orElseThrow();
      repository.raiseAll();
      Product again = repository
          .findById(1L).orElseThrow();
      int price = again.getPrice();
    choices:
      - "1000"
      - "1100"
      - 예외가 난다
    answer: "1"
    explanation: |-
      **1000이에요.** 벌크 연산은 영속성 컨텍스트를 거치지 않고 DB만 바꾸고, 다시 findById하면 1차 캐시의 옛 펜을 돌려줘요.

      - DB의 펜은 1100이에요
    source: https://jakarta.ee/specifications/persistence/3.1/jakarta-persistence-spec-3.1.html
  - key: bulk-stale-grade
    concept: core
    coreQuestion: q2
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: 한 트랜잭션에서 회원 kim(등급 SILVER)을 조회한 뒤, @Modifying만 붙은 벌크 연산으로 모든 회원의 등급을 GOLD로 바꾸고, kim.getGrade()를 응답에 담았어요. 응답의 등급은 무엇일까요?
    choices:
      - GOLD
      - SILVER
      - "null"
    answer: "2"
    explanation: |-
      **SILVER예요.** 이미 조회한 kim 객체는 벌크 연산이 고치지 않았어요.

      - 커밋 뒤 DB의 kim은 GOLD예요
    source: https://jakarta.ee/specifications/persistence/3.1/jakarta-persistence-spec-3.1.html
  # ── 질문 3 ──
  - key: bulk-clear-auto
    concept: core
    coreQuestion: q3
    type: multiple_choice
    status: reviewed
    difficulty: 1
    body: 펜(1000)을 조회한 뒤 @Modifying(clearAutomatically = true)인 raiseAll로 가격을 10% 올리고, 같은 트랜잭션에서 펜을 다시 findById했어요. 결과는 무엇일까요?
    choices:
      - SELECT 없이 1000
      - SELECT가 나가고 1100
      - SELECT 없이 1100
    answer: "2"
    explanation: |-
      **SELECT가 나가고 1100이에요.** 벌크 연산 뒤 영속성 컨텍스트가 비워져서 DB에서 다시 읽어요.

      - 벌크 연산을 트랜잭션의 처음에 하는 것도 방법이에요
    source: https://docs.spring.io/spring-data/jpa/reference/jpa/query-methods.html#jpa.modifying-queries
  - key: bulk-pending-flush
    concept: core
    coreQuestion: q3
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: 기본 설정(flush 모드 AUTO)에서 한 트랜잭션 안에 펜의 이름을 "새 펜"으로 바꾼 뒤, @Modifying(clearAutomatically = true)인 벌크 연산으로 가격을 올리고 커밋했어요. DB의 펜 이름은 어떻게 될까요?
    choices:
      - 새 펜. Hibernate가 벌크 연산 직전에 flush한다
      - 옛 이름. clear가 바꾼 이름을 버렸다
      - 커밋할 때 예외가 난다
    answer: "1"
    explanation: |-
      **새 펜이에요.** Hibernate는 벌크 연산을 보내기 직전에 자동으로 flush해서 이름 UPDATE가 먼저 나가요.

      - flush 모드를 커밋 때만으로 바꾼 곳은 flushAutomatically = true로 보장해요
    source: https://docs.spring.io/spring-data/jpa/reference/jpa/query-methods.html#jpa.modifying-queries
  # ── 질문 4 ──
  - key: bulk-version
    concept: core
    coreQuestion: q4
    type: multiple_choice
    status: reviewed
    difficulty: 1
    body: "@Version 값이 0인 상품을 벌크 연산 update Product p set p.price = p.price * 11 / 10으로 바꾸고 커밋했어요. DB의 version은 얼마일까요?"
    choices:
      - "0"
      - "1"
      - 상품 수만큼 오른다
    answer: "1"
    explanation: |-
      **0이에요.** 벌크 연산은 엔티티를 거치지 않아 버전을 올리지 않아요.

      - 다른 트랜잭션의 낙관적 락이 이 변경을 알아채지 못해요
      - 필요하면 set p.version = p.version + 1을 직접 써요
    source: https://jakarta.ee/specifications/persistence/3.1/jakarta-persistence-spec-3.1.html
  - key: bulk-preupdate
    concept: core
    coreQuestion: q4
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: 회원 엔티티는 @PreUpdate로 updatedAt을 지금 시각으로 채워요. 벌크 연산으로 휴면 회원 3만 명의 등급을 바꿨어요. 그 회원들의 updated_at은 어떻게 될까요?
    choices:
      - 벌크 연산 시각으로 바뀐다
      - 원래 값 그대로다
      - null이 된다
    answer: "2"
    explanation: |-
      **원래 값 그대로예요.** 벌크 연산은 엔티티 콜백을 부르지 않아요.

      - 수정 시각이 필요하면 쿼리의 set에 직접 써요
    source: https://jakarta.ee/specifications/persistence/3.1/jakarta-persistence-spec-3.1.html
  - key: bulk-response-stale
    concept: core
    coreQuestion: q3
    type: code_predict
    status: reviewed
    difficulty: 2
    body: raiseAll은 @Modifying만 붙은(clearAutomatically 없음) 벌크 연산이에요. 모든 상품의 가격은 1000이었어요. 이 메서드가 돌려준 목록의 가격은 얼마일까요?
    code: |-
      @Transactional
      public List<Product> raise() {
        List<Product> list =
            repository.findAll();
        repository.raiseAll();
        return list;
      }
    choices:
      - 모두 1000
      - 모두 1100
      - 섞여 있다
    answer: "1"
    explanation: |-
      **모두 1000이에요.** 벌크 연산 전에 조회한 엔티티는 옛 값 그대로예요.

      - 고친 코드: 벌크 연산을 먼저 하고, clearAutomatically를 붙인 뒤 조회해요
    source: https://jakarta.ee/specifications/persistence/3.1/jakarta-persistence-spec-3.1.html
  # ── 네 질문을 하나로 ──
  - key: bulk-interview
    concept: core
    coreQuestion: all
    type: descriptive
    status: reviewed
    difficulty: 2
    body: 면접에서 "JPA에서 벌크 연산을 쓸 때 무엇을 조심해야 하나요?"라는 질문을 받았어요. 1분 안에 답해 보세요.
    explanation: |-
      **벌크 연산은 영속성 컨텍스트를 거치지 않아서, 이미 조회한 엔티티가 옛 값으로 남아요. 벌크 연산 뒤에 영속성 컨텍스트를 비우거나 트랜잭션 처음에 해요.**

      - 변경 감지는 엔티티마다 UPDATE, 벌크 연산은 한 번
      - 다시 findById해도 1차 캐시의 옛 객체가 나온다
      - clearAutomatically로 비우고, Hibernate는 벌크 연산 직전에 자동 flush한다
      - 버전, 콜백, cascade가 빠진다
    checklist:
      - UPDATE 한 번으로 많은 행을 바꾼다고 말했다
      - 영속성 컨텍스트를 거치지 않는다고 말했다
      - 이미 조회한 엔티티가 옛 값이라고 말했다
      - clear나 순서로 맞춘다고 말했다
      - 버전이나 콜백이 빠진다고 말했다
    source: https://jakarta.ee/specifications/persistence/3.1/jakarta-persistence-spec-3.1.html
