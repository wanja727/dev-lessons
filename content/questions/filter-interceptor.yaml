# 필터와 인터셉터 문제
# 형식: https://github.com/wanja727/retrievo/blob/main/docs/content-format.md
#
# 모든 문제는 coreQuestions의 질문 하나에 묶이고(coreQuestion), 답의 근거가 레슨 본문에 있다
# (site/src/content/lesson-pages/filter-interceptor.yaml의 says).
# 동작에 관한 정답은 verification의 FilterInterceptorTest로 확인했다 (스프링 부트 3.5).
# 질문마다 첫 문제는 본문의 예시로 묻고, 둘째 문제는 다른 상황으로 옮겨 묻는다.
subject:
  key: dev
  name: 개발자 면접
lesson:
  key: filter-interceptor
  title: 필터와 인터셉터
  unit: 스프링
  order: 707
concepts:
  - key: core
    name: 필터와 인터셉터
coreQuestions:
  - key: q1
    text: "필터와 인터셉터는 어디에서 실행되나요?"
  - key: q2
    text: "필터와 인터셉터는 어떻게 등록하고, 여러 개면 순서는 어떻게 되나요?"
  - key: q3
    text: "공통 기능은 필터와 인터셉터 가운데 어디에 두나요?"
  - key: q4
    text: "컨트롤러에서 예외가 나면 무엇이 불리나요?"
questions:
  # ── 질문 1 ──
  - key: fi-order
    concept: core
    coreQuestion: q1
    type: multiple_choice
    status: draft
    difficulty: 1
    body: 필터 하나와 인터셉터 하나가 등록된 앱에 정상 요청이 왔어요. 기록되는 순서로 맞는 것은 무엇일까요?
    choices:
      - preHandle → 필터 앞 → 컨트롤러 → 필터 뒤 → postHandle
      - 필터 앞 → preHandle → 컨트롤러 → postHandle → afterCompletion → 필터 뒤
      - 필터 앞 → 필터 뒤 → preHandle → 컨트롤러 → postHandle
      - preHandle → 컨트롤러 → postHandle → 필터 앞 → 필터 뒤
    answer: "2"
    explanation: |-
      **필터가 바깥, 인터셉터가 안쪽이에요.** 필터는 톰캣이 DispatcherServlet을 부르기 전후에, 인터셉터는 DispatcherServlet이 컨트롤러를 부르기 전후에 실행돼요.

      - afterCompletion은 응답을 다 쓴 뒤라 필터 뒤보다 먼저예요
    source: https://docs.spring.io/spring-framework/reference/web/webmvc/mvc-servlet/handlermapping-interceptor.html
  - key: fi-timing-scope
    concept: core
    coreQuestion: q1
    type: multiple_choice
    status: draft
    difficulty: 2
    body: 요청 처리 시간을 필터의 chain.doFilter 앞뒤에서 재요. 같은 요청에서 인터셉터의 preHandle과 afterCompletion이 쓴 시간도 이 측정에 들어갈까요?
    choices:
      - 들어간다. 인터셉터는 필터의 chain.doFilter 안쪽에서 돈다
      - 들어가지 않는다. 인터셉터는 필터가 끝난 뒤에 돈다
      - preHandle만 들어간다
      - 인터셉터가 있으면 필터가 불리지 않는다
    answer: "1"
    explanation: |-
      **들어가요.** chain.doFilter 안에서 DispatcherServlet이 불리고, 그 안에서 인터셉터와 컨트롤러가 돌아요.

      - 그래서 필터는 요청 전체를 감싸는 가장 바깥 자리예요
    source: https://jakarta.ee/specifications/servlet/6.0/jakarta-servlet-spec-6.0
  # ── 질문 2 ──
  - key: fi-after-order
    concept: core
    coreQuestion: q2
    type: multiple_choice
    status: draft
    difficulty: 1
    body: addInterceptors에서 인터셉터 X, Y를 이 순서로 등록했어요. 정상 요청에서 afterCompletion은 어느 쪽이 먼저 불릴까요?
    choices:
      - X
      - Y
      - 동시에 불린다
      - 정해지지 않는다
    answer: "2"
    explanation: |-
      **Y예요.** 앞쪽(preHandle)은 등록 순서(X, Y)이고, 뒤쪽(postHandle, afterCompletion)은 반대 순서(Y, X)예요.

      - 필터도 같아요. 바깥 것이 안쪽 것을 감싸는 모양이에요
    source: https://docs.spring.io/spring-framework/reference/web/webmvc/mvc-servlet/handlermapping-interceptor.html
  - key: fi-forgotten
    concept: core
    coreQuestion: q2
    type: multiple_choice
    status: draft
    difficulty: 2
    body: AuthInterceptor 클래스에 @Component를 붙였지만 WebMvcConfigurer의 addInterceptors에는 넣지 않았어요. /orders에 요청하면 AuthInterceptor의 preHandle이 불릴까요?
    choices:
      - 불린다. 빈이면 스프링이 알아서 등록한다
      - 불리지 않는다. 인터셉터는 addInterceptors에 등록해야 한다
      - 앱이 뜨지 않는다
      - 첫 요청에만 불린다
    answer: "2"
    explanation: |-
      **불리지 않아요.** 빈은 만들어지지만 DispatcherServlet이 부르는 인터셉터 목록에는 들어가지 않아요. 에러도 경고도 없어요.

      - 필터는 다르게, @Component를 붙인 Filter 빈을 스프링 부트가 톰캣에 등록해 줘요
    source: https://docs.spring.io/spring-framework/reference/web/webmvc/mvc-config/interceptors.html
  # ── 질문 3 ──
  - key: fi-404-filter
    concept: core
    coreQuestion: q3
    type: multiple_choice
    status: draft
    difficulty: 1
    body: 응답 시간을 404와 405 응답까지 빠짐없이 남기고 싶어요. 어디에 두는 것이 맞을까요?
    choices:
      - 인터셉터의 preHandle과 afterCompletion
      - 필터의 chain.doFilter 앞뒤
      - 모든 컨트롤러 메서드의 첫 줄과 끝 줄
      - '@ExceptionHandler'
    answer: "2"
    explanation: |-
      **필터예요.** 404와 405는 핸들러 매핑이 부를 메서드를 찾지 못한 요청이라 인터셉터가 불리지 않아요. 필터는 DispatcherServlet 바깥이라 모든 요청에 걸려요.
    source: https://docs.spring.io/spring-framework/reference/web/webmvc/mvc-servlet/handlermapping-interceptor.html
  - key: fi-admin-only
    concept: core
    coreQuestion: q3
    type: multiple_choice
    status: draft
    difficulty: 2
    body: 관리자용 컨트롤러 메서드에만 @AdminOnly 어노테이션을 붙이고, 그 메서드를 부를 때만 관리자인지 확인하고 싶어요. 어디에 두는 것이 알맞을까요?
    choices:
      - 필터. 모든 요청에 걸린다
      - 인터셉터. preHandle의 handler로 부를 메서드의 어노테이션을 읽는다
      - 톰캣 설정
      - 서블릿을 새로 하나 등록한다
    answer: "2"
    explanation: |-
      **인터셉터예요.** preHandle은 세 번째 인자로 부를 메서드(HandlerMethod)를 받아서 hasMethodAnnotation(AdminOnly.class)로 확인할 수 있어요.

      - 필터 단계에서는 아직 어느 메서드로 갈지 정해지지 않았어요
    source: https://docs.spring.io/spring-framework/reference/web/webmvc/mvc-servlet/handlermapping-interceptor.html
  - key: fi-prehandle-false
    concept: core
    coreQuestion: q3
    type: code_predict
    status: draft
    difficulty: 2
    body: 아래 인터셉터를 /orders/**에 등록했고, 앞에 필터 하나도 있어요. @LoginRequired가 붙은 GET /orders/mine을 X-User 헤더 없이 보내면 어떻게 될까요?
    code: |-
      public boolean preHandle(
          HttpServletRequest req,
          HttpServletResponse res,
          Object handler) {
        if (handler instanceof HandlerMethod m
            && m.hasMethodAnnotation(
                LoginRequired.class)
            && req.getHeader("X-User") == null) {
          res.setStatus(401);
          return false;
        }
        return true;
      }
    choices:
      - 401. 컨트롤러는 실행되지 않고 필터의 뒤쪽은 실행된다
      - 401. 컨트롤러도 필터의 뒤쪽도 실행되지 않는다
      - 컨트롤러가 실행된 뒤 401로 바뀐다
      - 200. false를 돌려줘도 컨트롤러는 불린다
    answer: "1"
    explanation: |-
      **401이고 컨트롤러는 실행되지 않아요.** preHandle이 false면 DispatcherServlet이 거기서 멈춰 컨트롤러와 postHandle을 건너뛰어요. 필터는 바깥이라 chain.doFilter가 돌아온 뒤의 코드가 그대로 실행돼요.
    source: https://docs.spring.io/spring-framework/reference/web/webmvc/mvc-servlet/handlermapping-interceptor.html
  # ── 질문 4 ──
  - key: fi-exception-calls
    concept: core
    coreQuestion: q4
    type: multiple_choice
    status: draft
    difficulty: 1
    body: 컨트롤러가 IllegalStateException을 던지고 처리하는 @ExceptionHandler는 없어요. 인터셉터의 postHandle과 afterCompletion 가운데 무엇이 불릴까요?
    choices:
      - 둘 다 불린다
      - postHandle만 불린다
      - afterCompletion만 불리고 예외를 받는다
      - 둘 다 불리지 않는다
    answer: "3"
    explanation: |-
      **afterCompletion만 불려요.** postHandle은 컨트롤러가 정상으로 끝났을 때만 불리고, afterCompletion은 성공이든 실패든 불리며 네 번째 인자로 예외를 받아요.

      - 처리하지 않은 예외는 필터의 chain.doFilter까지 올라와요
    source: https://docs.spring.io/spring-framework/reference/web/webmvc/mvc-servlet/handlermapping-interceptor.html
  - key: fi-posthandle-timing
    concept: core
    coreQuestion: q4
    type: multiple_choice
    status: draft
    difficulty: 2
    body: 인터셉터의 postHandle에서 요청 처리 시간을 로그로 남겨요. 서비스에서 예외가 나 500이 된 요청의 처리 시간도 로그에 남을까요?
    choices:
      - 남는다
      - 남지 않는다. 예외가 나면 postHandle을 건너뛴다
      - 남지만 시간이 0이다
      - 예외가 IllegalArgumentException일 때만 남는다
    answer: "2"
    explanation: |-
      **남지 않아요.** 예외가 나면 postHandle은 불리지 않아요. 정작 알고 싶은 실패한 요청이 빠지는 거예요.

      - afterCompletion이나 필터의 finally로 옮기면 실패한 요청도 남아요
    source: https://docs.spring.io/spring-framework/reference/web/webmvc/mvc-servlet/handlermapping-interceptor.html
  # ── 전체 ──
  - key: fi-interview
    concept: core
    coreQuestion: all
    type: descriptive
    status: draft
    difficulty: 2
    body: 면접에서 "필터와 인터셉터의 차이를 설명해 주세요"라는 질문을 받았어요. 1분 안에 답해 보세요.
    explanation: |-
      **필터는 DispatcherServlet 바깥에서 모든 요청에, 인터셉터는 안쪽에서 컨트롤러로 가는 요청에 걸려요.**

      - **위치:** 필터는 서블릿 규약이라 톰캣이, 인터셉터는 스프링 MVC라 DispatcherServlet이 부른다
      - **등록과 순서:** 필터는 빈이나 FilterRegistrationBean, 인터셉터는 addInterceptors. 뒤쪽은 반대 순서다
      - **쓰임:** 모든 요청의 기록과 인증은 필터, 메서드의 어노테이션을 보는 검사는 인터셉터
      - **예외:** postHandle은 건너뛰고 afterCompletion은 예외를 받는다. 끝나면 할 일은 finally나 afterCompletion에
    checklist:
      - 필터는 DispatcherServlet 앞, 인터셉터는 컨트롤러 앞뒤에서 실행된다고 말했다
      - 필터는 없는 경로까지 모든 요청에 걸리고 인터셉터는 부를 메서드를 안다고 말했다
      - 인터셉터는 addInterceptors에 등록해야 한다고 말했다
      - 예외가 나면 postHandle이 불리지 않는다고 말했다
    source: https://docs.spring.io/spring-framework/reference/web/webmvc/mvc-servlet/handlermapping-interceptor.html
