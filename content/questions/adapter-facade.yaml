# 어댑터와 퍼사드 패턴 문제
# 형식: https://github.com/wanja727/retrievo/blob/main/docs/content-format.md
#
# 모든 문제는 coreQuestions의 질문 하나에 묶이고(coreQuestion), 답의 근거가 레슨 본문에 있다
# (site/src/content/lesson-pages/adapter-facade.yaml의 says).
# 동작에 관한 정답은 verification의 AdapterFacadeTest로 확인했다 (자바 21, 스프링 부트 3.5).
# 질문마다 첫 문제는 본문의 예시로 묻고, 둘째 문제는 다른 상황으로 옮겨 묻는다.
subject:
  key: dev
  name: 개발자 면접
lesson:
  key: adapter-facade
  title: 어댑터와 퍼사드 패턴
  unit: 객체지향 설계와 패턴
  order: 314
concepts:
  - key: core
    name: 어댑터와 퍼사드 패턴
coreQuestions:
  - key: q1
    text: "어댑터 패턴은 무엇인가요?"
  - key: q2
    text: "어댑터를 두면 무엇이 좋아지나요?"
  - key: q3
    text: "퍼사드 패턴은 무엇이고, 어댑터와 무엇이 다른가요?"
questions:
  # ── 질문 1 ──
  - key: af-fail-code
    concept: core
    coreQuestion: q1
    type: code_predict
    status: draft
    difficulty: 1
    body: TossAdapter는 우리 PaymentGateway를 구현하고 SDK의 결과 Map을 우리 타입 Approval로 바꿔요. SDK가 {"code"는 "1001", "tid"는 null}을 돌려주면 approve는 무엇을 돌려줄까요?
    code: |-
      var res = sdk.requestPayment(params);
      return new Approval(
          "0000".equals(res.get("code")),
          res.get("tid"));
    choices:
      - Approval(ok=true, txId=null)
      - Approval(ok=false, txId=null)
      - 예외가 난다
    answer: "2"
    explanation: |-
      **Approval(ok=false, txId=null)이에요.** 어댑터는 SDK의 결과 코드를 우리 타입으로 바꿔요. "0000"이 아니면 실패예요.
    source: https://github.com/wanja727/dev-lessons/blob/main/verification/src/test/java/lab/devlessons/adapterfacade/AdapterFacadeTest.java
  - key: af-thermometer
    concept: core
    coreQuestion: q1
    type: multiple_choice
    status: draft
    difficulty: 2
    body: 우리 코드는 섭씨를 돌려주는 Thermometer 인터페이스를 원하는데, 장비 라이브러리는 화씨를 주는 double readF()만 있어요. Thermometer를 구현하고 안에서 readF()를 불러 섭씨로 바꾸는 클래스는 무엇이고, 데코레이터와 무엇이 다를까요?
    choices:
      - 데코레이터. 같은 인터페이스를 유지한다
      - 어댑터. 감싸는 것과 다른 인터페이스(우리 것)를 구현한다
      - 퍼사드. 여러 시스템을 묶는다
    answer: "2"
    explanation: |-
      **어댑터예요.** 감싸는 라이브러리와 다른, 우리가 원하는 인터페이스를 구현해서 모양을 바꿔요.

      - 데코레이터와 프록시는 감싸는 것과 같은 인터페이스를 구현해요
    source: https://refactoring.guru/design-patterns/adapter
  # ── 질문 2 ──
  - key: af-switch-vendor
    concept: core
    coreQuestion: q2
    type: multiple_choice
    status: draft
    difficulty: 1
    body: 주문 서비스, 환불 서비스, 정산 배치가 모두 PaymentGateway만 쓰고, 토스 SDK는 TossAdapter 안에서만 써요. 결제 대행사를 나이스로 바꾸면 무엇이 바뀔까요?
    choices:
      - 세 서비스를 모두 고친다
      - NiceAdapter를 새로 만들고 조립하는 곳만 바꾼다
      - PaymentGateway 인터페이스를 나이스에 맞게 바꾼다
    answer: "2"
    explanation: |-
      **새 어댑터를 만들고 조립하는 곳만 바꿔요.** 세 서비스는 우리 인터페이스만 알아서 그대로예요.

      - SDK를 서비스에서 직접 썼다면 세 서비스를 모두 고쳐야 했어요
    source: https://github.com/wanja727/dev-lessons/blob/main/verification/src/test/java/lab/devlessons/adapterfacade/AdapterFacadeTest.java
  - key: af-sms-format
    concept: core
    coreQuestion: q2
    type: multiple_choice
    status: draft
    difficulty: 2
    body: 문자 발송 업체 SDK의 응답 형식이 바뀌었어요. 우리 코드에는 SmsSender 인터페이스와 그 업체용 어댑터가 있고, 서비스들은 SmsSender만 써요. 어디를 고칠까요?
    choices:
      - SmsSender를 쓰는 모든 서비스
      - 그 업체의 어댑터 하나
      - SmsSender 인터페이스와 모든 서비스
    answer: "2"
    explanation: |-
      **어댑터 하나예요.** SDK의 모양은 어댑터 안에만 있어요.

      - 어댑터에는 모양을 바꾸는 일만 두고 업무 규칙은 넣지 않아요
    source: https://github.com/wanja727/dev-lessons/blob/main/verification/src/test/java/lab/devlessons/adapterfacade/AdapterFacadeTest.java
  - key: af-sdk-leak
    concept: core
    coreQuestion: q2
    type: multiple_choice
    status: draft
    difficulty: 2
    body: TossAdapter를 만들어 두었지만, 주문 서비스의 메서드가 SDK의 결과 Map<String, String>을 그대로 반환해서 환불 서비스와 정산 배치가 그 Map의 "code"를 읽어요. 대행사를 바꾸면 어떻게 될까요?
    choices:
      - 어댑터만 바꾸면 된다
      - Map을 읽는 서비스들도 고쳐야 한다. SDK의 모양이 새어 나갔다
      - 아무것도 고치지 않아도 된다
    answer: "2"
    explanation: |-
      **Map을 읽는 서비스들도 고쳐야 해요.** SDK 타입이 서비스 사이를 오가면 어댑터를 둔 의미가 사라져요.

      - SDK 타입은 어댑터 안에만 두고 서비스 사이에는 Approval 같은 우리 타입만 오가게 해요
  # ── 질문 3 ──
  - key: af-facade-count
    concept: core
    coreQuestion: q3
    type: multiple_choice
    status: draft
    difficulty: 1
    body: 컨트롤러가 재고 예약, 결제 승인, 배송 요청, 알림을 직접 차례로 부르다가, 이 넷을 순서대로 부르는 OrderFacade.placeOrder(cart)만 부르게 바꿨어요. 컨트롤러가 직접 아는 클래스는 몇 개에서 몇 개가 됐을까요?
    choices:
      - 4개에서 4개
      - 4개에서 1개
      - 1개에서 4개
    answer: "2"
    explanation: |-
      **4개에서 1개가 됐어요.** 퍼사드가 여러 하위 시스템을 부르는 순서를 창구 하나 뒤에 감췄어요.

      - 하위 시스템은 막히지 않아서 필요하면 직접 쓸 수 있어요
    source: https://github.com/wanja727/dev-lessons/blob/main/verification/src/test/java/lab/devlessons/adapterfacade/AdapterFacadeTest.java
  - key: af-which-adapter
    concept: core
    coreQuestion: q3
    type: multiple_choice
    status: draft
    difficulty: 2
    body: 다음 둘 가운데 어댑터는 무엇일까요? (가) 레거시 결제 모듈의 메서드 이름이 우리 규칙과 달라서 우리 인터페이스로 감싼 클래스 (나) 회원 가입에 필요한 다섯 시스템을 순서대로 부르는 SignupFacade
    choices:
      - (가)
      - (나)
      - 둘 다
    answer: "1"
    explanation: |-
      **(가)예요.** 하나의 모양을 우리 인터페이스로 바꾸는 것이 어댑터, 여럿을 창구 하나로 묶는 것이 퍼사드예요.
  - key: af-aslist
    concept: core
    coreQuestion: q3
    type: code_predict
    status: draft
    difficulty: 2
    body: 아래 코드를 실행하면 array[0]은 무엇이 될까요?
    code: |-
      String[] array = {"a", "b", "c"};
      List<String> list =
          Arrays.asList(array);
      list.set(0, "X");
    choices:
      - a. 리스트는 복사본이다
      - X. 리스트가 배열을 감싼 어댑터다
      - UnsupportedOperationException
    answer: "2"
    explanation: |-
      **X예요.** Arrays.asList는 배열을 복사하지 않고 감싸서 List로 보여 주는 어댑터라, set이 원래 배열을 바꿔요.

      - 배열은 길이를 바꿀 수 없어서 add는 UnsupportedOperationException이에요
    source: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/Arrays.html#asList(T...)
  # ── 세 질문을 하나로 ──
  - key: af-interview
    concept: core
    coreQuestion: all
    type: descriptive
    status: draft
    difficulty: 2
    body: 면접에서 "어댑터 패턴과 퍼사드 패턴을 설명하고, 둘의 차이를 말해 주세요"라는 질문을 받았어요. 1분 안에 답해 보세요.
    explanation: |-
      **어댑터는 하나의 맞지 않는 모양을 우리 인터페이스로 바꾸고, 퍼사드는 여러 시스템을 창구 하나로 묶어요.**

      - **어댑터:** 외부 SDK를 감싸 우리 인터페이스를 구현한다. 데코레이터와 달리 인터페이스가 바뀐다
      - **이득:** 외부 모양이 안으로 새지 않아 업체를 바꿀 때 어댑터만 바꾼다. 테스트는 우리 인터페이스의 가짜로
      - **퍼사드:** 여러 하위 시스템의 호출 순서를 감춘다. 하위 시스템은 막지 않는다
      - **예:** Arrays.asList(어댑터), SLF4J(퍼사드)
    checklist:
      - 어댑터를 맞지 않는 인터페이스를 원하는 인터페이스로 바꾸는 것이라고 말했다
      - 업체를 바꿀 때 어댑터만 바뀐다는 이득을 말했다
      - 퍼사드를 여러 하위 시스템을 단순한 창구로 묶는 것이라고 말했다
      - 어댑터는 하나를 바꾸고 퍼사드는 여럿을 묶는다는 차이를 말했다
      - 자바나 스프링의 예(Arrays.asList, SLF4J)를 들었다
    source: https://www.slf4j.org/
