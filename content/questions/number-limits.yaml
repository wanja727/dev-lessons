# 2026-11-25에 만들고 같은 날 검수해 reviewed로 바꿨다.
subject:
  key: dev
  name: 개발자 면접
lesson:
  key: number-limits
  title: 숫자 타입의 한계
  unit: 자바 언어
  order: 119
concepts:
  - key: core
    name: 숫자 타입의 한계
coreQuestions:
  - key: q1
    text: "정수 계산의 결과가 타입의 범위를 넘으면 어떻게 되나요?"
  - key: q2
    text: "0.1 + 0.2는 왜 0.3이 아닌가요?"
  - key: q3
    text: "그러면 돈은 무엇으로 계산하나요?"
  - key: q4
    text: "BigDecimal 두 개가 같은 금액인지는 어떻게 비교하나요?"
questions:
  # ── 질문 1 ──
  - key: num-expire
    concept: core
    coreQuestion: q1
    type: code_predict
    status: reviewed
    difficulty: 1
    body: 토큰의 만료 시간을 30일(밀리초)로 계산해요. 아래 두 줄은 각각 무엇을 출력할까요?
    code: |-
      long a = 30 * 24 * 60 * 60 * 1000;
      long b = 30L * 24 * 60 * 60 * 1000;
      System.out.println(a);
      System.out.println(b);
    choices:
      - 둘 다 2592000000
      - a는 음수 -1702967296, b는 2592000000
      - a는 컴파일 오류, b는 2592000000
      - 둘 다 음수
    answer: "2"
    explanation: |-
      **a는 음수, b는 2592000000이에요.** a의 곱셈은 int로 계산되어 넘친 뒤 long에 담겨요.

      - 변수의 타입이 아니라 계산하는 값의 타입이 결과를 정해요
      - 첫 수에 L을 붙이면 처음부터 long으로 계산돼요
      - 오버플로는 예외도 경고도 없어요
    source: https://docs.oracle.com/javase/specs/jls/se21/html/jls-4.html#jls-4.2.2
  - key: num-int-divide
    concept: core
    coreQuestion: q1
    type: code_predict
    status: reviewed
    difficulty: 2
    body: 할인 금액을 계산하는 두 식이에요. price는 990, rate는 10이고 둘 다 int예요. 두 식의 값은 각각 얼마일까요?
    code: |-
      price / 100 * rate
      price * rate / 100
    choices:
      - 99와 99
      - 90과 99
      - 99.0과 99
      - 90과 90
    answer: "2"
    explanation: |-
      **90과 99예요.** 정수끼리 나누면 소수 부분이 버려져요.

      - 990 / 100은 9가 되고 9 × 10 = 90이에요
      - 곱셈을 먼저 하면 9900 / 100 = 99예요
    source: https://docs.oracle.com/javase/specs/jls/se21/html/jls-15.html#jls-15.17.2
  # ── 질문 2 ──
  - key: num-double-sum
    concept: core
    coreQuestion: q2
    type: code_predict
    status: reviewed
    difficulty: 1
    body: 아래 코드의 마지막 줄은 무엇을 출력할까요?
    code: |-
      double total = 0;
      for (int i = 0; i < 10; i++) {
        total += 0.1;
      }
      System.out.println(total == 1.0);
    choices:
      - "true"
      - "false"
      - 컴파일 오류
      - ArithmeticException
    answer: "2"
    explanation: |-
      **false예요.** 0.1은 2진수로 끝나지 않아서 double에 가장 가까운 값이 담기고, 더할수록 오차가 쌓여요.

      - 0.1을 열 번 더한 값은 0.9999999999999999예요
      - 그래서 double끼리 ==로 비교하지 않아요
    source: https://docs.oracle.com/javase/specs/jls/se21/html/jls-4.html#jls-4.2.3
  - key: num-double-exact
    concept: core
    coreQuestion: q2
    type: code_predict
    status: reviewed
    difficulty: 2
    body: 아래 식의 결과는 무엇일까요?
    code: |-
      0.5 + 0.25 == 0.75
    choices:
      - "true"
      - "false"
      - 컴파일 오류
      - 실행할 때마다 다르다
    answer: "1"
    explanation: |-
      **true예요.** 0.5, 0.25, 0.75는 2의 거듭제곱으로 만들어지는 수라 2진수로 정확히 담겨요.

      - 오차는 0.1처럼 2진수로 끝나지 않는 수에서 생겨요
      - 그래도 어떤 수가 정확히 담기는지 일일이 따지지 않고, 정확해야 하는 값에는 double을 쓰지 않아요
    source: https://docs.oracle.com/javase/specs/jls/se21/html/jls-4.html#jls-4.2.3
  # ── 질문 3 ──
  - key: num-divide-scale
    concept: core
    coreQuestion: q3
    type: code_predict
    status: reviewed
    difficulty: 1
    body: 10000원을 세 명이 나눠 내는 금액을 계산해요. 아래 두 줄은 각각 어떻게 될까요?
    code: |-
      BigDecimal price = new BigDecimal("10000");
      BigDecimal three = new BigDecimal("3");
      price.divide(three);
      price.divide(three, 0, RoundingMode.DOWN);
    choices:
      - 3333.333...과 3333
      - ArithmeticException과 3333
      - 3333과 3333
      - 둘 다 ArithmeticException
    answer: "2"
    explanation: |-
      **첫 줄은 ArithmeticException, 둘째 줄은 3333이에요.** 나누어떨어지지 않는데 자릿수를 주지 않으면 정확한 값을 만들 수 없어 예외를 던져요.

      - 소수 몇째 자리까지, 어떻게 자를지를 줘야 해요
      - 반올림 방법은 업무 규칙이라 코드에 직접 적어요
    source: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/math/BigDecimal.html
  - key: num-immutable
    concept: core
    coreQuestion: q3
    type: code_predict
    status: reviewed
    difficulty: 2
    body: 아래 코드는 무엇을 출력할까요?
    code: |-
      BigDecimal total = new BigDecimal("1000");
      total.add(new BigDecimal("500"));
      System.out.println(total);
    choices:
      - "1500"
      - "1000"
      - "500"
      - 컴파일 오류
    answer: "2"
    explanation: |-
      **1000이에요.** BigDecimal은 불변이라 add는 새 값을 돌려줄 뿐 total을 고치지 않아요.

      - total = total.add(...)로 받아야 1500이 돼요
      - 결과를 받지 않아도 컴파일 오류나 경고가 없어서 놓치기 쉬워요
    source: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/math/BigDecimal.html
  - key: num-bigdecimal-double
    concept: core
    coreQuestion: q3
    type: code_predict
    status: reviewed
    difficulty: 2
    body: 할인율을 아래처럼 만들어 가격 10000원에 곱했어요. discount는 정확히 1000일까요?
    code: |-
      BigDecimal rate = new BigDecimal(0.1);
      BigDecimal price = new BigDecimal("10000");
      BigDecimal discount = price.multiply(rate);
    choices:
      - 정확히 1000이다
      - 1000.000000000000055...처럼 1000보다 조금 크다
      - 999.99...처럼 1000보다 조금 작다
      - 컴파일 오류
    answer: "2"
    explanation: |-
      **1000보다 조금 커요.** new BigDecimal(0.1)은 double 0.1이 담고 있던 0.1000000000000000055...를 그대로 옮겨요.

      - double의 오차를 고치지 못하고 정확하게 보존해 버려요
      - new BigDecimal("0.1")이나 BigDecimal.valueOf(0.1)로 만들어요
    source: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/math/BigDecimal.html#%3Cinit%3E(double)
  # ── 질문 4 ──
  - key: num-hashset-treeset
    concept: core
    coreQuestion: q4
    type: code_predict
    status: reviewed
    difficulty: 1
    body: 아래 두 집합의 크기는 각각 얼마일까요?
    code: |-
      BigDecimal a = new BigDecimal("2.0");
      BigDecimal b = new BigDecimal("2.00");
      new HashSet<>(Set.of(a, b)).size();
      new TreeSet<>(Set.of(a, b)).size();
    choices:
      - 1과 1
      - 2와 1
      - 1과 2
      - 2와 2
    answer: "2"
    explanation: |-
      **HashSet은 2, TreeSet은 1이에요.** HashSet은 equals로, TreeSet은 compareTo로 같은지 봐요.

      - BigDecimal의 equals는 값과 소수 자릿수를 함께 봐서 2.0과 2.00이 달라요
      - compareTo는 크기만 봐서 둘이 같아요
    source: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/math/BigDecimal.html#equals(java.lang.Object)
  - key: num-payment-equals
    concept: core
    coreQuestion: q4
    type: code_predict
    status: reviewed
    difficulty: 2
    body: 결제 금액 열은 NUMERIC(19, 2)예요. 요청으로 받은 금액 new BigDecimal("10000")을 저장했다가 DB에서 다시 읽은 값을 stored라고 할게요. 아래 검증은 어떻게 될까요?
    code: |-
      BigDecimal requested = new BigDecimal("10000");
      if (!stored.equals(requested)) {
        throw new AmountMismatchException();
      }
    choices:
      - 통과한다. 같은 금액이다
      - 예외가 난다. stored는 10000.00이라 자릿수가 다르다
      - NullPointerException이 난다
      - 컴파일 오류
    answer: "2"
    explanation: |-
      **예외가 나요.** DB에서 읽은 값은 열의 자릿수를 따라 10000.00이고, equals는 자릿수까지 봐요.

      - 같은 금액인데 정상 결제가 거부돼요
      - stored.compareTo(requested) != 0으로 비교하면 크기만 봐서 통과해요
    source: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/math/BigDecimal.html#compareTo(java.math.BigDecimal)
  # ── 네 질문을 하나로 ──
  - key: num-interview
    concept: core
    coreQuestion: all
    type: descriptive
    status: reviewed
    difficulty: 2
    body: 면접에서 "자바에서 돈을 계산할 때 무엇을 조심해야 하나요?"라는 질문을 받았어요. 1분 안에 답해 보세요.
    explanation: |-
      **정수는 범위를 넘으면 조용히 틀리고 double은 십진 소수를 정확히 담지 못해서, 돈은 BigDecimal로 계산하고 compareTo로 비교해요.**

      - **오버플로:** int는 약 21억까지라 넘으면 예외 없이 틀린 값이 된다. 합계와 밀리초는 long으로
      - **double:** 0.1을 2진수로 정확히 담지 못해 0.1 + 0.2가 0.3이 아니다
      - **BigDecimal:** 문자열로 만들고, 불변이라 결과를 받고, 나눌 때 자릿수와 반올림을 준다
      - **비교:** equals는 자릿수까지 봐서 10000과 10000.00이 다르니 compareTo로 비교한다
    checklist:
      - 정수는 범위를 넘으면 예외 없이 틀린 값이 된다고(오버플로) 말했다
      - double은 0.1 같은 십진 소수를 정확히 담지 못한다고 말했다
      - 돈은 BigDecimal로, 소수가 없으면 long으로 계산한다고 말했다
      - BigDecimal은 문자열로 만들고 나눌 때 자릿수와 반올림을 준다고 말했다
      - 금액 비교는 equals가 아니라 compareTo로 한다고 말했다
    source: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/math/BigDecimal.html
