# 페이지네이션 문제
# 형식: https://github.com/wanja727/retrievo/blob/main/docs/content-format.md
#
# 모든 문제는 coreQuestions의 질문 하나에 묶이고(coreQuestion), 답의 근거가 레슨 본문에 있다
# (site/src/content/lesson-pages/pagination.yaml의 says).
# 동작에 관한 정답은 verification의 PaginationTest로 확인했다 (PostgreSQL 16).
# 질문마다 첫 문제는 본문의 예시로 묻고, 둘째 문제는 다른 상황으로 옮겨 묻는다.
subject:
  key: dev
  name: 개발자 면접
lesson:
  key: pagination
  title: 페이지네이션
  unit: DB
  order: 608
concepts:
  - key: core
    name: 페이지네이션
coreQuestions:
  - key: q1
    text: "OFFSET 페이지네이션은 어떻게 동작하나요?"
  - key: q2
    text: "뒤 페이지는 왜 느려지나요?"
  - key: q3
    text: "페이지를 넘기는 사이에 글이 추가되면 어떻게 되나요?"
  - key: q4
    text: "커서 페이지네이션은 무엇을 바꾸나요?"
questions:
  # ── 질문 1 ──
  - key: page-offset-calc
    concept: core
    coreQuestion: q1
    type: multiple_choice
    status: draft
    difficulty: 1
    body: "한 페이지에 20개씩, 페이지 번호는 0부터 세요. 5번 페이지를 읽는 쿼리의 OFFSET은 얼마인가요?"
    choices:
      - "5"
      - "80"
      - "100"
      - "120"
    answer: "3"
    explanation: |-
      **100이에요.** 페이지 번호 p와 크기 n이면 `offset p × n`이에요.

      - 0번부터 4번 페이지까지 다섯 페이지, 100개를 건너뛰어요
      - 쿼리는 `limit 20 offset 100`이에요
    source: https://www.postgresql.org/docs/16/queries-limit.html
  - key: page-price-ties
    concept: core
    coreQuestion: q1
    type: multiple_choice
    status: draft
    difficulty: 2
    body: "상품 목록을 `order by price limit 30 offset ?`로 나눠요. 같은 가격의 상품이 수백 개예요. 페이지를 넘길 때 생길 수 있는 일과 고치는 법은?"
    choices:
      - 아무 일도 없다. 가격으로 정렬했다
      - 같은 상품이 두 페이지에 나오거나 어느 페이지에도 나오지 않을 수 있다. `order by price, id`로 고친다
      - 오류가 난다. 정렬 열에 중복이 있으면 OFFSET을 쓸 수 없다
      - 같은 가격의 상품은 모두 첫 페이지에 모인다
    answer: "2"
    explanation: |-
      **같은 가격끼리의 순서가 정해지지 않아 페이지 경계에서 흔들려요.**

      - DB는 ORDER BY로 정해지지 않는 순서를 약속하지 않아요
      - 마지막 기준으로 겹치지 않는 id를 붙이면 순서가 하나로 정해져요
    source: https://www.postgresql.org/docs/16/queries-limit.html
  # ── 질문 2 ──
  - key: page-offset-reads
    concept: core
    coreQuestion: q2
    type: multiple_choice
    status: draft
    difficulty: 1
    body: "게시글 100만 건에 (`created_at`, `id`) 인덱스가 있어요. `order by created_at desc, id desc limit 20 offset 100000`을 실행하면 DB는 몇 행을 읽나요?"
    choices:
      - "20행"
      - "100,000행"
      - "100,020행을 읽고 앞의 100,000행을 버린다"
      - "100만 행"
    answer: "3"
    explanation: |-
      **100,020행을 읽고 앞의 10만 행을 버려요.**

      - 인덱스는 값으로 찾는 구조라 "10만 번째 행"으로 바로 갈 수 없어요
      - 그래서 OFFSET이 클수록 읽는 행이 늘어 느려져요
    source: https://www.postgresql.org/docs/16/queries-limit.html
  - key: page-batch-offset
    concept: core
    coreQuestion: q2
    type: multiple_choice
    status: draft
    difficulty: 2
    body: "회원 1000만 명에게 메일을 보내는 배치가 `order by id limit 1000 offset ?`로 1000명씩 돌아요. 뒤로 갈수록 느려져요. 가장 알맞은 고침은?"
    choices:
      - 한 번에 읽는 수를 100으로 줄인다
      - 마지막으로 처리한 id보다 큰 회원을 `where id > ? order by id limit 1000`으로 읽는다
      - 정렬을 빼고 `limit 1000 offset ?`만 쓴다
      - id에 인덱스를 하나 더 만든다
    answer: "2"
    explanation: |-
      **마지막으로 처리한 id부터 읽는 커서 방식으로 바꿔요.**

      - OFFSET은 마지막 묶음에서 999만 9000행을 읽고 버려요
      - `where id > ?`는 기본 키 인덱스로 그 자리를 바로 찾아 묶음마다 1000행만 읽어요
      - 정렬을 빼면 순서가 약속되지 않아 회원이 빠지거나 겹쳐요
    source: https://www.postgresql.org/docs/16/queries-limit.html
  # ── 질문 3 ──
  - key: page-insert-dup
    concept: core
    coreQuestion: q3
    type: multiple_choice
    status: draft
    difficulty: 1
    body: "최신순 목록 1페이지(20개)를 본 뒤 새 글 3개가 올라왔어요. OFFSET 방식으로 2페이지(`offset 20`)를 읽으면 1페이지와 겹치는 글은 몇 개인가요?"
    choices:
      - "0개"
      - "3개"
      - "17개"
      - "20개"
    answer: "2"
    explanation: |-
      **3개예요.** 앞쪽에 3개가 끼어들어 모든 글이 세 칸씩 밀렸어요.

      - OFFSET 20 자리에 1페이지의 마지막 세 글이 와요
      - 커서 방식은 "1페이지의 마지막 글보다 뒤"부터라 겹치지 않아요
    source: https://www.postgresql.org/docs/16/queries-limit.html
  - key: page-delete-skip
    concept: core
    coreQuestion: q3
    type: multiple_choice
    status: draft
    difficulty: 2
    body: "관리자가 오래된 순으로 신고 목록 1페이지(20개)를 모두 처리하고, 처리한 신고는 목록에서 지워요. 그다음 OFFSET 방식으로 2페이지(`offset 20`)를 열면 무엇이 보이나요?"
    choices:
      - 처리하지 않은 다음 신고 20개
      - 처리하지 않은 신고 20개를 건너뛴 그다음 20개
      - 1페이지에서 처리한 신고 20개
      - 빈 목록
    answer: "2"
    explanation: |-
      **처리하지 않은 첫 20개를 건너뛰어요.** 1페이지의 20개가 지워져서 남은 신고가 20칸 당겨졌어요.

      - OFFSET은 "앞에서 몇 번째"로 자르기 때문이에요
      - 이 화면은 늘 첫 페이지를 다시 읽거나, 마지막으로 본 id 뒤부터 읽어요
    source: https://www.postgresql.org/docs/16/queries-limit.html
  # ── 질문 4 ──
  - key: page-cursor-rows
    concept: core
    coreQuestion: q4
    type: multiple_choice
    status: draft
    difficulty: 1
    body: "게시글 100만 건에 (`created_at`, `id`) 인덱스가 있어요. 커서 방식 `where (created_at, id) < (?, ?) order by created_at desc, id desc limit 20`으로 거의 끝 페이지를 읽으면 DB가 읽는 행은 대략 몇 개인가요?"
    choices:
      - "20개 남짓"
      - "1만 개"
      - "50만 개"
      - "100만 개"
    answer: "1"
    explanation: |-
      **20개 남짓이에요.** 인덱스로 그 자리를 바로 찾고 거기서부터 20개만 읽어요.

      - 페이지가 몇 번째든 읽는 양이 같아요
      - 대신 페이지 번호로 바로 갈 수는 없어요
    source: https://www.postgresql.org/docs/16/functions-comparisons.html#ROW-WISE-COMPARISON
  - key: page-cursor-ranking
    concept: core
    coreQuestion: q4
    type: multiple_choice
    status: draft
    difficulty: 2
    body: "정렬이 `order by score desc, id desc`인 랭킹 목록을 커서로 나누려 해요. 다음 페이지의 조건과 필요한 인덱스는?"
    choices:
      - "`where score < 마지막 score`, 인덱스 `(score)`"
      - "`where (score, id) < (마지막 score, 마지막 id)`, 인덱스 `(score, id)`"
      - "`offset 20`, 인덱스 `(id)`"
      - "`where id < 마지막 id`, 인덱스 `(id)`"
    answer: "2"
    explanation: |-
      **정렬 기준 그대로 행 비교를 하고 같은 순서의 인덱스를 둬요.**

      - score만 비교하면 같은 점수의 글이 빠지거나 겹쳐요
      - id만 비교하면 점수순이 아니게 돼요
    source: https://www.postgresql.org/docs/16/functions-comparisons.html#ROW-WISE-COMPARISON
  - key: page-slice-count
    concept: core
    coreQuestion: q4
    type: multiple_choice
    status: draft
    difficulty: 2
    body: "무한 스크롤 피드의 리포지토리 메서드가 `Page<Post>`를 돌려줘요. 화면은 \"다음 글이 있는지\"만 알면 돼요. 글이 100만 건일 때 `Slice<Post>`로 바꾸면 무엇이 줄어드나요?"
    choices:
      - 한 페이지에 읽는 글의 수
      - 요청마다 보내던 전체 개수 count 쿼리
      - 정렬 시간
      - 줄어드는 것이 없다
    answer: "2"
    explanation: |-
      **요청마다 보내던 count 쿼리가 사라져요.** `Page`는 전체 개수와 페이지 수를 알려고 count를 한 번 더 보내요.

      - 100만 건의 count는 테이블을 훑는 비용이 들어요
      - `Slice`는 크기보다 하나 더 읽어 다음이 있는지만 알아요
    source: https://docs.spring.io/spring-data/jpa/reference/repositories/query-methods-details.html
  # ── 면접 질문 ──
  - key: page-interview
    concept: core
    coreQuestion: all
    type: descriptive
    status: draft
    difficulty: 2
    body: 면접에서 "OFFSET 페이지네이션과 커서 페이지네이션의 차이를 설명해 주세요"라는 질문을 받았어요. 1분 안에 답해 보세요.
    explanation: |-
      **OFFSET은 앞의 행을 읽고 버리며 자르고, 커서는 마지막 행 뒤를 WHERE로 찾아 인덱스로 바로 읽어요.**

      - **OFFSET:** 페이지 번호로 바로 간다. 뒤로 갈수록 건너뛸 행을 다 읽어 느려진다
      - **변하는 목록:** 앞쪽에 행이 끼거나 빠지면 OFFSET은 중복이나 누락이 생긴다
      - **커서:** (정렬값, id) < (마지막 값) 조건과 같은 순서의 인덱스. 어느 페이지든 빠르다. 번호로는 못 간다
      - **정렬:** 마지막 기준에 id를 붙인다. Page는 count를 더 보내니 필요 없으면 Slice
    checklist:
      - OFFSET은 건너뛸 행을 실제로 읽고 버려 뒤 페이지가 느리다고 말했다
      - 페이지 사이에 행이 추가되면 OFFSET에서 중복이 생긴다고 말했다
      - 커서는 마지막 행의 값보다 뒤를 WHERE로 찾아 인덱스로 바로 읽는다고 말했다
      - 커서는 페이지 번호로 바로 갈 수 없다는 대가를 말했다
      - 정렬 기준에 id 같은 겹치지 않는 열을 붙인다고 말했다
    source: https://www.postgresql.org/docs/16/queries-limit.html
