# 객체지향의 네 가지 특징 문제
# 형식: https://github.com/wanja727/retrievo/blob/main/docs/content-format.md
#
# 모든 문제는 coreQuestions의 질문 하나에 묶이고(coreQuestion), 답의 근거가 레슨 본문에 있다
# (site/src/content/lesson-pages/oop-four-pillars.yaml의 says).
# 동작에 관한 정답은 verification의 OopFourPillarsTest로 확인했다 (자바 21).
# 질문마다 첫 문제는 본문의 예시로 묻고, 둘째 문제는 다른 상황으로 옮겨 묻는다.
# 2026-11-25에 만들고 같은 날 검수해 reviewed로 바꿨다.
subject:
  key: dev
  name: 개발자 면접
lesson:
  key: oop-four-pillars
  title: 객체지향의 네 가지 특징
  unit: 객체지향 설계와 패턴
  order: 301
concepts:
  - key: core
    name: 객체지향의 네 가지 특징
coreQuestions:
  - key: q1
    text: "캡슐화는 무엇이고, 무엇을 막아 주나요?"
  - key: q2
    text: "필드를 private으로 두고 getter와 setter를 열면 캡슐화인가요?"
  - key: q3
    text: "추상화는 무엇인가요?"
  - key: q4
    text: "상속과 다형성은 무엇이고, 무엇을 쉽게 해 주나요?"
questions:
  # ── 질문 1 ──
  - key: oop-wallet-use
    concept: core
    coreQuestion: q1
    type: code_predict
    status: reviewed
    difficulty: 1
    body: 잔액 필드가 private이고 잔액은 use()에서만 줄어드는 포인트 지갑이에요. 잔액이 1000점일 때 아래 코드는 어떻게 될까요?
    code: |-
      void use(int amount) {
        if (amount > balance) {
          throw new IllegalStateException(
              "잔액 부족");
        }
        balance -= amount;
      }

      wallet.use(3000);
    choices:
      - 잔액이 -2000이 된다
      - IllegalStateException이 나고 잔액은 1000 그대로다
      - 컴파일 오류
      - 잔액이 0이 된다
    answer: "2"
    explanation: |-
      **예외가 나고 잔액은 1000 그대로예요.** 잔액을 줄이는 길이 use() 하나라서 규칙을 건너뛸 수 없어요.

      - 필드가 public이었다면 wallet.balance -= 3000으로 -2000이 됐어요
      - 규칙이 바뀌어도 use() 한 곳만 고쳐요
    source: https://docs.oracle.com/javase/specs/jls/se21/html/jls-6.html#jls-6.6
  - key: oop-stock-places
    concept: core
    coreQuestion: q1
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: 재고 클래스 Stock의 quantity 필드가 public이고, 재고를 줄이는 코드가 서비스 다섯 곳에 있어요. "재고는 0 밑으로 내려가지 않는다"를 지키려고 필드를 private으로 닫고 줄이는 일을 decrease() 메서드에만 두었어요. 이 규칙을 확인하는 코드는 몇 곳에 있으면 될까요?
    choices:
      - 다섯 곳 그대로
      - decrease() 한 곳
      - 어디에도 필요 없다. 컴파일러가 확인한다
      - 서비스마다 한 곳씩, 그리고 decrease()에도
    answer: "2"
    explanation: |-
      **decrease() 한 곳이에요.** 재고를 줄이는 길이 그 메서드 하나뿐이에요.

      - private은 밖에서 필드를 직접 바꾸는 코드를 컴파일 오류로 막아요
      - 0 밑으로 내려가는지 확인하는 일은 메서드가 해요
    source: https://docs.oracle.com/javase/specs/jls/se21/html/jls-6.html#jls-6.6
  # ── 질문 2 ──
  - key: oop-setter-negative
    concept: core
    coreQuestion: q2
    type: code_predict
    status: reviewed
    difficulty: 1
    body: 잔액 필드는 private이고 getter와 setter가 있어요. 잔액이 1000점일 때 주문 서비스가 아래 코드를 실행하면 잔액은 얼마가 될까요?
    code: |-
      int b = wallet.getBalance();
      wallet.setBalance(b - 3000);
    choices:
      - "1000"
      - "-2000"
      - 컴파일 오류
      - 예외가 난다
    answer: "2"
    explanation: |-
      **-2000이에요.** setter는 받은 값을 그대로 넣어서, 필드를 public으로 연 것과 같은 길을 내요.

      - 잔액 규칙은 여전히 서비스 쪽에 있어야 해요
      - 꺼내서 계산하지 말고 wallet.use(3000)처럼 객체에게 시켜요
  - key: oop-cart-clear
    concept: core
    coreQuestion: q2
    type: code_predict
    status: reviewed
    difficulty: 2
    body: 장바구니에 상품이 3개 들어 있어요. 아래 코드를 실행한 뒤 cart.size()는 얼마일까요?
    code: |-
      class Cart {
        private final List<Item> items =
            new ArrayList<>();
        List<Item> getItems() {
          return items;
        }
        int size() { return items.size(); }
      }

      cart.getItems().clear();
    choices:
      - "3"
      - "0"
      - 컴파일 오류. items가 private이다
      - UnsupportedOperationException
    answer: "2"
    explanation: |-
      **0이에요.** getter가 내부 리스트 자체를 돌려줘서 밖의 clear()가 장바구니 안을 비워요.

      - private은 필드 이름으로 닿는 것만 막아요
      - Collections.unmodifiableList(items)나 List.copyOf(items)를 돌려주면 밖에서 바꿀 수 없어요
    source: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/Collections.html
  - key: oop-entity-setter
    concept: core
    coreQuestion: q2
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: 회원 엔티티 Member에 롬복 @Setter가 붙어 있어서, 포인트를 쓰는 서비스 네 곳이 각각 member.setPoint(member.getPoint() - amount)를 해요. "포인트보다 많이 쓸 수 없다"는 규칙을 가장 확실하게 지키는 방법은 무엇일까요?
    choices:
      - 서비스 네 곳에 if 문으로 확인을 넣는다
      - setter를 지우고 Member에 usePoint(amount)를 두어 그 안에서 확인한다
      - point 필드를 public으로 바꾼다
      - getPoint()를 지운다
    answer: "2"
    explanation: |-
      **setter를 지우고 usePoint() 안에서 확인해요.** 포인트를 줄이는 길이 하나가 되어 규칙이 한 곳에 모여요.

      - 서비스마다 확인을 넣으면 다섯째 서비스에서 빠뜨릴 수 있어요
      - 값을 꺼내 계산하지 말고 객체에게 시켜요
  # ── 질문 3 ──
  - key: oop-abstraction-change
    concept: core
    coreQuestion: q3
    type: multiple_choice
    status: reviewed
    difficulty: 1
    body: 결제 코드는 Payment 인터페이스의 pay(amount)만 불러요. 포인트 결제(PointPayment)는 PointWallet.use()로 잔액을 빼요. "한 번에 5만 점까지만 쓸 수 있다"는 규칙이 생기면 어디를 고칠까요?
    choices:
      - 결제 코드
      - Payment 인터페이스
      - PointWallet
      - 결제 코드와 PointWallet 둘 다
    answer: "3"
    explanation: |-
      **PointWallet이에요.** 결제 코드는 Payment.pay(amount)만 알고, 잔액 규칙은 그 뒤에 감춰져 있어요.

      - 추상화한 타입은 쓰는 쪽에 필요한 모양만 보여 줘요
      - 세부가 바뀌어도 쓰는 쪽은 그대로예요
  - key: oop-abstraction-name
    concept: core
    coreQuestion: q3
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: 알림을 보내는 인터페이스를 만들어요. 메일과 카카오 알림톡 구현이 있고, 나중에 문자도 더할 예정이에요. 메서드 이름으로 가장 알맞은 것은 무엇일까요?
    choices:
      - sendBySmtpOrKakao(message)
      - send(message)
      - callKakaoApi(message)
      - smtpSend(message)
    answer: "2"
    explanation: |-
      **send(message)예요.** 이름은 무엇을 하는지만 말하고, 어떻게 하는지는 구현이 정해요.

      - 어떻게를 드러낸 이름은 문자 구현을 더하는 순간 맞지 않게 돼요
  # ── 질문 4 ──
  - key: oop-add-transfer
    concept: core
    coreQuestion: q4
    type: multiple_choice
    status: reviewed
    difficulty: 1
    body: 결제 코드가 checkout(Payment payment, int amount) { payment.pay(amount); }이고, 카드와 포인트 결제가 Payment를 구현해요. 계좌이체 결제를 더할 때 결제 수단 쪽에서 일어나는 일은 무엇일까요? (결제 수단 객체를 넘겨 주는 곳은 빼고 생각해요)
    choices:
      - checkout에 else if를 더한다
      - BankTransferPayment 클래스를 새로 만들고 checkout은 그대로 둔다
      - Payment 인터페이스에 메서드를 더한다
      - CardPayment를 상속한다
    answer: "2"
    explanation: |-
      **새 클래스만 만들고 checkout은 그대로예요.** payment.pay(amount)가 넘어온 실제 객체의 구현을 실행하는 다형성 덕분이에요.

      - 결제 수단을 문자열로 나눈 코드였다면 checkout을 열어 else if를 더해야 했어요
    source: https://docs.oracle.com/javase/specs/jls/se21/html/jls-8.html#jls-8.4.8
  - key: oop-shape-area
    concept: core
    coreQuestion: q4
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: 넓이를 구하는 코드가 if (shape instanceof Circle) ... else if (shape instanceof Square) ...로 되어 있어요. 삼각형을 더할 때 넓이를 구하는 코드를 고치지 않으려면 어떻게 바꿔야 할까요?
    choices:
      - else if (shape instanceof Triangle)을 더한다
      - Shape에 area()를 두고 도형마다 구현한다
      - 도형 이름을 문자열로 받아 switch로 나눈다
      - Triangle이 Circle을 상속한다
    answer: "2"
    explanation: |-
      **Shape에 area()를 두고 도형마다 구현해요.** 넓이를 구하는 코드는 shape.area() 한 줄이 되고, 삼각형은 Triangle 클래스를 더하기만 하면 돼요.

      - 같은 호출이 실제 객체에 따라 다르게 동작하는 것이 다형성이에요
  # ── 네 질문을 하나로 ──
  - key: oop-interview
    concept: core
    coreQuestion: all
    type: descriptive
    status: reviewed
    difficulty: 2
    body: 면접에서 "객체지향의 네 가지 특징을 코드와 함께 설명해 주세요"라는 질문을 받았어요. 1분 안에 답해 보세요.
    explanation: |-
      **캡슐화는 규칙을 객체 안에 모으고, 추상화는 쓰는 쪽에 보일 모양을 정하고, 상속은 같은 타입으로 묶고, 다형성은 같은 호출이 객체마다 다르게 동작하게 해요.**

      - **캡슐화:** private 필드와 메서드. 잔액은 use()로만 줄어서 음수가 되지 않는다
      - **getter와 setter:** setter를 열면 private이어도 규칙이 밖에 있다. 객체에게 시킨다
      - **추상화:** Payment.pay(amount)만 보이고 카드사 API와 지갑은 감춰진다
      - **상속과 다형성:** 결제 수단을 Payment로 묶어 payment.pay() 한 줄로 부른다. 새 수단은 클래스만 더한다
    checklist:
      - 캡슐화를 데이터와 규칙을 한 객체에 두고 메서드로만 바꾸게 하는 것이라고 말했다
      - setter를 모두 열면 캡슐화가 아니라고 말했다
      - 추상화를 쓰는 쪽에 필요한 것만 보이는 타입(인터페이스)이라고 말했다
      - 다형성을 같은 호출이 실제 객체에 따라 다르게 동작하는 것이라고 말했다
      - 새 종류를 더해도 부르는 쪽을 고치지 않는다는 예를 들었다
