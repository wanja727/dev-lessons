# 웹소켓과 SSE 문제
# 형식: https://github.com/wanja727/retrievo/blob/main/docs/content-format.md
#
# 모든 문제는 coreQuestions의 질문 하나에 묶이고(coreQuestion), 답의 근거가 레슨 본문에 있다
# (site/src/content/lesson-pages/websocket-sse.yaml의 says).
# 서버의 응답은 verification의 WebSocketSseTest로 확인했다 (스프링 부트 3.5, 톰캣 10.1, 자바 21).
# 브라우저의 EventSource와 다시 연결하기는 HTML 명세가 근거다.
# 질문마다 첫 문제는 본문의 예시로 묻고, 둘째 문제는 다른 상황으로 옮겨 묻는다.
# 2026-11-25에 만들고 같은 날 검수해 reviewed로 바꿨다. 정답을 본문(says)과 테스트 결과에 맞춰 봤고, 문제 하나만 보고 풀리는지 봤다. 고친 문제는 없다.
subject:
  key: dev
  name: 개발자 면접
lesson:
  key: websocket-sse
  title: 웹소켓과 SSE
  unit: 네트워크와 웹
  order: 512
concepts:
  - key: core
    name: 웹소켓과 SSE
coreQuestions:
  - key: q1
    text: "서버가 먼저 알려야 할 때 HTTP는 왜 불편한가요?"
  - key: q2
    text: "SSE는 어떻게 서버가 먼저 보내게 하나요?"
  - key: q3
    text: "웹소켓은 무엇이 다른가요?"
  - key: q4
    text: "무엇을 고르고, 서버가 여러 대면 무엇을 더해야 하나요?"
questions:
  # ── 질문 1 ──
  - key: wss-polling-count
    concept: core
    coreQuestion: q1
    type: multiple_choice
    status: reviewed
    difficulty: 1
    body: "주문 상태를 100ms마다 10번(1초 동안) 폴링했어요. 상태는 0.7초쯤에 \"준비 중\"에서 \"배송 시작\"으로 한 번 바뀌어요. 10번의 응답 가운데 배송 시작을 처음 알려 준 응답은 몇 번일까요?"
    choices:
      - 1번
      - 3번
      - 7번
      - 10번
    answer: "1"
    explanation: |-
      **1번이에요.** 바뀐 뒤 처음 물은 응답만 새 소식을 전해요.

      - 그 앞의 응답은 준비 중을, 그 뒤의 응답은 이미 안 것을 되풀이해요
      - 상태는 0.7초쯤 바뀌었지만 사용자는 다음 폴링 때 알았어요. 간격만큼 늦어요
    source: https://html.spec.whatwg.org/multipage/server-sent-events.html
  - key: wss-polling-scale
    concept: core
    coreQuestion: q1
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: "사용자 1만 명이 5초마다 새 알림을 폴링해요. 알림은 하루에 한두 번 와요. 서버가 받는 요청은 초당 몇 번쯤이고, 그 대부분은 무엇일까요?"
    choices:
      - 초당 2번쯤, 대부분 새 알림
      - 초당 2천 번쯤, 대부분 바뀐 것이 없는 헛된 요청
      - 초당 5만 번쯤, 대부분 새 알림
      - 요청은 없다. 서버가 먼저 보낸다
    answer: "2"
    explanation: |-
      **초당 2천 번쯤이고 대부분 헛된 요청이에요.** 1만 명이 5초마다 물으면 1만 ÷ 5 = 2천이에요.

      - 알림은 드문데 묻기는 계속해요
      - SSE나 웹소켓은 서버가 일이 생길 때만 보내서 이 요청이 없어요
    source: https://html.spec.whatwg.org/multipage/server-sent-events.html
  # ── 질문 2 ──
  - key: wss-sse-type
    concept: core
    coreQuestion: q2
    type: multiple_choice
    status: reviewed
    difficulty: 1
    body: "스프링 MVC 컨트롤러가 SseEmitter를 돌려줘요. 클라이언트가 받는 응답의 Content-Type은 무엇일까요?"
    choices:
      - "application/json"
      - "text/event-stream"
      - "text/plain"
      - "application/websocket"
    answer: "2"
    explanation: |-
      **text/event-stream이에요.** 서버는 응답을 열어 두고 이 형식의 이벤트를 이어 써요.

      - 이벤트는 id, event, data 줄과 빈 줄로 끝나요
      - 테스트에서 이벤트 셋이 0.2초 간격으로 따로 도착했어요
    source: https://html.spec.whatwg.org/multipage/server-sent-events.html#text/event-stream
  - key: wss-sse-oneway
    concept: core
    coreQuestion: q2
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: "채팅방의 새 메시지를 SSE로 받고 있어요. 사용자가 쓴 메시지를 서버에 보내려면 어떻게 할까요?"
    choices:
      - 같은 SSE 연결로 보낸다
      - 다른 HTTP 요청(POST 등)으로 보낸다
      - SSE 응답에 Last-Event-ID를 실어 보낸다
      - 보낼 수 없다
    answer: "2"
    explanation: |-
      **다른 HTTP 요청으로 보내요.** SSE는 서버에서 클라이언트로 한 방향이에요.

      - 받기는 SSE로, 보내기는 평소의 POST로 나눠요
      - 양쪽이 자주 주고받으면 웹소켓이 더 맞아요
    source: https://html.spec.whatwg.org/multipage/server-sent-events.html
  # ── 질문 3 ──
  - key: wss-101
    concept: core
    coreQuestion: q3
    type: multiple_choice
    status: reviewed
    difficulty: 1
    body: "클라이언트가 `Upgrade: websocket`과 `Sec-WebSocket-Key`를 실어 HTTP 요청을 보냈어요. 서버가 받아들이면 돌려주는 상태 코드는 무엇일까요?"
    choices:
      - "200"
      - "101"
      - "204"
      - "302"
    answer: "2"
    explanation: |-
      **101 Switching Protocols예요.** 그 뒤 같은 TCP 연결이 웹소켓으로 바뀌어요.

      - 서버는 키로 계산한 Sec-WebSocket-Accept를 함께 줘요
      - 테스트에서 톰캣이 RFC 6455의 예시와 같은 값을 돌려줬어요
    source: https://www.rfc-editor.org/rfc/rfc6455.html#section-1.3
  - key: wss-server-first
    concept: core
    coreQuestion: q3
    type: ox
    status: reviewed
    difficulty: 2
    body: "\"웹소켓 연결이 열린 뒤에도 서버는 클라이언트의 요청이 와야 그에 대한 답으로만 메시지를 보낼 수 있다\""
    answer: X
    explanation: |-
      **아니에요.** 101 뒤로는 요청과 응답의 짝이 없어서 양쪽이 아무 때나 보내요.

      - 테스트에서 연결이 열리자 서버가 요청 없이 먼저 메시지를 보냈어요
      - 클라이언트도 같은 연결로 보내요
    source: https://www.rfc-editor.org/rfc/rfc6455.html#section-1.1
  # ── 질문 4 ──
  - key: wss-relay
    concept: core
    coreQuestion: q4
    type: multiple_choice
    status: reviewed
    difficulty: 1
    body: "서버가 두 대예요. kim의 SSE 연결은 서버 A에 붙어 있는데, kim의 주문을 배송 시작으로 바꾼 요청은 서버 B가 처리했어요. kim에게 알림이 가려면 무엇이 필요할까요?"
    choices:
      - 아무것도 필요 없다. B가 kim의 연결에 바로 쓴다
      - 서버들이 이벤트를 함께 받는 중계(Redis pub/sub 같은 것)
      - kim의 브라우저가 B로 다시 연결하게 한다
      - SSE 대신 쿠키를 쓴다
    answer: "2"
    explanation: |-
      **이벤트를 나누는 중계가 필요해요.** 연결은 A에만 있어서 B는 쓸 수 없어요.

      - B가 이벤트를 중계에 알리면 모든 서버가 받아 자기 연결에 보내요
      - 웹소켓도 같은 문제가 있어요
    source: https://docs.spring.io/spring-framework/reference/web/websocket/stomp/handle-broker-relay.html
  - key: wss-choose
    concept: core
    coreQuestion: q4
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: "여러 사람이 함께 쓰는 문서 편집기에서 각자의 입력을 서로에게 바로 보여 줘야 해요. 가장 맞는 방식은 무엇일까요?"
    choices:
      - 10초마다 폴링
      - SSE
      - 웹소켓
      - 롱 폴링
    answer: "3"
    explanation: |-
      **웹소켓이에요.** 양쪽이 자주, 아무 때나 주고받아야 해요.

      - SSE는 서버에서 받기만 하고, 보내기는 따로 요청해야 해요
      - 폴링은 간격만큼 늦고 헛된 요청이 많아요
    source: https://www.rfc-editor.org/rfc/rfc6455.html
  - key: wss-sse-timeout
    concept: core
    coreQuestion: q4
    type: code_predict
    status: reviewed
    difficulty: 2
    body: "아래 컨트롤러의 첫 이벤트는 3초 뒤에 생겨요. 클라이언트가 요청하면 어떻게 될까요? (스프링 부트 3.5)"
    code: |-
      @GetMapping(value = "/orders/1/events",
          produces = TEXT_EVENT_STREAM_VALUE)
      SseEmitter events() {
        SseEmitter emitter =
            new SseEmitter(500L);
        // 3초 뒤 첫 이벤트를 send
        return emitter;
      }
    choices:
      - 3초 뒤 첫 이벤트를 받는다
      - 이벤트 없이 503으로 끝난다
      - 연결이 무한히 열려 있다
      - 200과 빈 이벤트를 받는다
    answer: "2"
    explanation: |-
      **503으로 끝나요.** 생성자의 값(0.5초)이 응답을 열어 둘 시간이에요.

      - 아무것도 보내기 전에 시간이 지나면 스프링이 요청 시간 초과(503)로 답해요
      - 시간을 넉넉히 주고, 로드 밸런서가 끊지 않게 하트비트를 보내요
    source: https://docs.spring.io/spring-framework/reference/web/webmvc/mvc-ann-async.html
  # ── 전체 ──
  - key: wss-interview
    concept: core
    coreQuestion: all
    type: descriptive
    status: reviewed
    difficulty: 2
    body: 면접에서 "실시간 알림을 만든다면 폴링, SSE, 웹소켓 가운데 무엇을 고르고 왜 그런가요?"라는 질문을 받았어요. 1분 안에 답해 보세요.
    explanation: |-
      **받기만 하는 알림은 SSE, 양쪽이 주고받으면 웹소켓, 드물게 확인하면 폴링을 골라요.**

      - **폴링:** 클라이언트가 계속 묻는다. 헛된 요청이 많고 간격만큼 늦다
      - **SSE:** 응답 하나를 열어 두고 text/event-stream으로 이어 쓴다. 한 방향, EventSource가 다시 연결
      - **웹소켓:** Upgrade와 101로 연결을 바꿔 양쪽이 아무 때나 보낸다
      - **운영:** 시간 제한과 하트비트, 서버가 여러 대면 Redis pub/sub 같은 중계
    checklist:
      - HTTP는 서버가 먼저 보낼 수 없고 폴링은 헛된 요청과 늦음이 있다고 말했다
      - SSE가 응답을 열어 두고 서버에서 클라이언트로 이벤트를 보낸다고 말했다
      - 웹소켓이 Upgrade와 101로 시작해 양방향이라고 말했다
      - 용도에 따라 무엇을 고르는지 말했다
      - 서버가 여러 대일 때의 중계나 하트비트를 말했다
    source: https://www.rfc-editor.org/rfc/rfc6455.html
