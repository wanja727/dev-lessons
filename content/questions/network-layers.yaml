# OSI 7계층과 TCP/IP 4계층 문제
# 형식: https://github.com/wanja727/retrievo/blob/main/docs/content-format.md
#
# 모든 문제는 coreQuestions의 질문 하나에 묶이고(coreQuestion), 답의 근거가 레슨 본문에 있다
# (site/src/content/lesson-pages/network-layers.yaml의 says).
# 동작에 관한 정답은 verification의 NetworkLayersTest로 확인했다 (자바 21, 톰캣 10.1).
# 헤더를 붙이고 떼는 아래 계층의 동작은 RFC가 근거다.
# 질문마다 첫 문제는 본문의 예시로 묻고, 둘째 문제는 다른 상황으로 옮겨 묻는다.
subject:
  key: dev
  name: 개발자 면접
lesson:
  key: network-layers
  title: OSI 7계층과 TCP/IP 4계층
  unit: 네트워크와 웹
  order: 56
concepts:
  - key: core
    name: OSI 7계층과 TCP/IP 4계층
coreQuestions:
  - key: q1
    text: "네트워크는 왜 계층을 나누나요?"
  - key: q2
    text: "TCP/IP 4계층은 각각 무엇을 하나요?"
  - key: q3
    text: "데이터는 계층을 지나며 어떻게 바뀌나요?"
  - key: q4
    text: "OSI 7계층과 TCP/IP 4계층은 어떻게 맞춰 보나요?"
questions:
  # ── 질문 1 ──
  - key: nl-same-request
    concept: core
    coreQuestion: q1
    type: multiple_choice
    status: draft
    difficulty: 1
    body: "같은 HTTP 요청 글을 한 번은 TCP 소켓(127.0.0.1의 포트)으로, 한 번은 파일 경로로 여는 유닉스 도메인 소켓으로 보내려고 해요. 받는 쪽은 두 통로에서 같은 코드로 요청을 읽어요. 요청 글에서 바꿔야 하는 것은 무엇일까요?"
    choices:
      - 첫 줄의 HTTP 버전
      - Host 헤더에 IP 주소 대신 파일 경로를 적는다
      - 바꿀 것이 없다
      - 유닉스 소켓으로는 HTTP를 보낼 수 없다
    answer: "3"
    explanation: |-
      **바꿀 것이 없어요.** HTTP는 아래 통로가 바이트를 순서대로 날라 준다는 것만 믿어요.

      - 테스트에서도 같은 요청 글을 두 통로로 보내 같은 응답을 받았어요
      - 통로가 TCP인지 유닉스 소켓인지는 아래 계층의 일이라 HTTP는 몰라요
    source: https://www.rfc-editor.org/rfc/rfc1122.html
  - key: nl-switch-network
    concept: core
    coreQuestion: q1
    type: multiple_choice
    status: draft
    difficulty: 2
    body: "사용자가 회사 와이파이에서 휴대폰 핫스팟(LTE)으로 바꿔 우리 서비스에 접속해요. 스프링 서버의 컨트롤러 코드를 고치지 않아도 되는 이유로 가장 알맞은 것은 무엇일까요?"
    choices:
      - 스프링이 접속한 망의 종류를 알아서 바꿔 주기 때문에
      - 위 계층(HTTP)은 아래 계층이 하는 일만 믿고 그 방법은 모르기 때문에
      - 와이파이와 LTE는 같은 계층이 아니라서 서로 상관없기 때문에
      - 컨트롤러는 IP 주소를 쓰지 않기 때문에
    answer: "2"
    explanation: |-
      **위 계층은 아래 계층이 해 주는 일만 믿어요.** 아래 계층이 바뀌어도 위는 고치지 않는 것이 계층을 나눈 이유예요.

      - 와이파이와 LTE는 둘 다 링크 계층의 방법이에요. 바뀌어도 그 위의 IP, TCP, HTTP는 그대로예요
      - 스프링은 망의 종류를 구별하지 않아요
    source: https://www.rfc-editor.org/rfc/rfc1122.html
  # ── 질문 2 ──
  - key: nl-port-layer
    concept: core
    coreQuestion: q2
    type: multiple_choice
    status: draft
    difficulty: 1
    body: "한 컴퓨터(IP 하나)에 주문 서버가 8080 포트로, 결제 서버가 8081 포트로 떠 있어요. 요청이 두 서버 가운데 어느 쪽으로 갈지 정하는 것은 어느 계층의 무슨 값일까요?"
    choices:
      - 응용 계층의 URL 경로
      - 전송 계층의 포트 번호
      - 인터넷 계층의 IP 주소
      - 링크 계층의 MAC 주소
    answer: "2"
    explanation: |-
      **전송 계층의 포트 번호예요.** IP 주소는 컴퓨터를, 포트는 그 컴퓨터 안의 프로그램을 구별해요.

      - 두 서버는 IP 주소가 같아서 IP로는 구별하지 못해요
      - 테스트에서 IP가 같고 포트만 다른 서버 둘이 각자 다르게 답했어요
    source: https://www.rfc-editor.org/rfc/rfc9293.html
  - key: nl-four-tuple
    concept: core
    coreQuestion: q2
    type: multiple_choice
    status: draft
    difficulty: 2
    body: "브라우저가 같은 서버의 443번 포트로 TCP 연결을 둘 열었어요. 서버는 두 연결에서 온 바이트를 섞지 않아요. 무엇으로 구별할까요?"
    choices:
      - 서버 쪽 포트가 연결마다 다르다
      - 클라이언트 쪽 포트가 연결마다 다르다
      - 연결마다 MAC 주소가 다르다
      - 구별하지 못해서 한 연결만 쓴다
    answer: "2"
    explanation: |-
      **클라이언트 쪽 포트가 달라요.** 연결은 출발 IP, 출발 포트, 도착 IP, 도착 포트 네 값으로 구별돼요.

      - 도착 IP와 포트(443)는 두 연결이 같아요
      - OS가 연결을 맺을 때 클라이언트 쪽에 빈 포트를 하나씩 골라 줘서 네 값이 달라져요
    source: https://www.rfc-editor.org/rfc/rfc9293.html
  # ── 질문 3 ──
  - key: nl-no-headers
    concept: core
    coreQuestion: q3
    type: multiple_choice
    status: draft
    difficulty: 1
    body: "클라이언트가 HTTP 요청을 보냈고, 서버의 자바 코드가 `socket.getInputStream()`으로 읽었어요. 읽은 바이트에 들어 있는 것은 무엇일까요?"
    choices:
      - 클라이언트가 쓴 HTTP 요청 글만
      - TCP 헤더와 HTTP 요청 글
      - IP 헤더, TCP 헤더와 HTTP 요청 글
      - 이더넷부터 TCP까지의 헤더와 HTTP 요청 글
    answer: "1"
    explanation: |-
      **HTTP 요청 글만 있어요.** 아래 계층의 헤더는 받는 쪽 OS가 계층마다 보고 떼어 내요.

      - 보낼 때 내려가며 붙인 헤더를 받을 때 올라가며 떼요(캡슐화의 반대)
      - 프로그램은 상대 프로그램이 쓴 바이트만 받아요
    source: https://www.rfc-editor.org/rfc/rfc1122.html
  - key: nl-read-once
    concept: core
    coreQuestion: q3
    type: multiple_choice
    status: draft
    difficulty: 2
    body: "파일 서버가 1MB 파일을 `out.write(data)` 한 번으로 보내요. 받는 쪽은 `in.read(buf)`를 딱 한 번 불러서 돌려받은 바이트를 파일 전체로 저장해요(buf는 1MB). 이 코드의 문제는 무엇일까요?"
    choices:
      - 문제없다. 한 번 쓴 것은 한 번에 읽힌다
      - read가 그때까지 도착한 일부만 돌려줄 수 있어서 파일이 잘릴 수 있다
      - TCP 헤더가 섞여서 파일이 깨진다
      - 1MB는 TCP로 보낼 수 없다
    answer: "2"
    explanation: |-
      **파일이 잘릴 수 있어요.** 큰 데이터는 아래 계층에서 조각으로 나뉘어 오고, read는 도착한 만큼만 돌려줘요.

      - 테스트에서 1MB를 한 번에 썼는데 받는 쪽은 read를 여러 번 불러야 했어요
      - 끝(-1)이 나올 때까지, 또는 정해 둔 길이만큼 반복해서 읽어야 해요
    source: https://www.rfc-editor.org/rfc/rfc894.html
  # ── 질문 4 ──
  - key: nl-osi-network
    concept: core
    coreQuestion: q4
    type: multiple_choice
    status: draft
    difficulty: 1
    body: "OSI 7계층의 네트워크 계층(3계층)은 TCP/IP 4계층의 어느 계층에 해당할까요?"
    choices:
      - 응용 계층
      - 전송 계층
      - 인터넷 계층
      - 링크 계층
    answer: "3"
    explanation: |-
      **인터넷 계층이에요.** IP 주소로 컴퓨터를 정하고 라우터로 길을 찾는 계층이에요.

      - OSI의 응용, 표현, 세션(7, 6, 5)은 TCP/IP의 응용 계층에 해당해요
      - OSI의 데이터 링크와 물리(2, 1)는 링크 계층에 해당해요
    source: https://www.itu.int/rec/T-REC-X.200-199407-I/en
  - key: nl-l7-balancer
    concept: core
    coreQuestion: q4
    type: multiple_choice
    status: draft
    difficulty: 2
    body: "`/api`로 시작하는 요청은 API 서버들로, `/images`로 시작하는 요청은 이미지 서버들로 나눠 보내는 로드 밸런서를 두려고 해요. 이 로드 밸런서는 무엇이어야 할까요?"
    choices:
      - L2 스위치
      - L3 라우터
      - L4 로드 밸런서
      - L7 로드 밸런서
    answer: "4"
    explanation: |-
      **L7 로드 밸런서예요.** 경로는 HTTP 요청 글 안에 있어서 응용 계층까지 읽어야 해요.

      - L4 로드 밸런서는 IP와 포트까지만 보고 HTTP는 읽지 않아요
      - 장비를 부르는 번호는 그 장비가 어느 계층의 헤더까지 읽는지를 뜻해요
    source: https://www.itu.int/rec/T-REC-X.200-199407-I/en
  - key: nl-remote-addr
    concept: core
    coreQuestion: q4
    type: code_predict
    status: draft
    difficulty: 2
    body: "스프링 부트 서버가 L7 로드 밸런서 뒤에 있어요. 로드 밸런서는 클라이언트 IP 203.0.113.7을 X-Forwarded-For 헤더에 적어 넘기고, 로드 밸런서 자신의 IP는 10.0.0.2예요. 설정은 기본값이에요. 아래 메서드는 무엇을 돌려줄까요?"
    code: |-
      @GetMapping("/ip")
      String ip(HttpServletRequest request) {
        return request.getRemoteAddr();
      }
    choices:
      - 203.0.113.7
      - 10.0.0.2
      - "null"
      - 203.0.113.7, 10.0.0.2
    answer: "2"
    explanation: |-
      **10.0.0.2예요.** getRemoteAddr()는 이 연결의 출발 IP이고, 연결은 로드 밸런서가 맺었어요.

      - X-Forwarded-For를 반영하려면 server.forward-headers-strategy를 켜요
      - 믿는 로드 밸런서 뒤에서만 켜요. 헤더는 누구나 적을 수 있어요
    source: https://docs.spring.io/spring-boot/how-to/webserver.html
  # ── 전체 ──
  - key: nl-interview
    concept: core
    coreQuestion: all
    type: descriptive
    status: draft
    difficulty: 2
    body: 면접에서 "OSI 7계층과 TCP/IP 4계층을 설명하고, 왜 계층을 나누는지 말해 주세요"라는 질문을 받았어요. 1분 안에 답해 보세요.
    explanation: |-
      **계층마다 자기 일만 하고 아래 계층이 주는 기능만 믿게 나눠서, 한 계층을 바꿔도 다른 계층을 고치지 않아요.**

      - **TCP/IP 4계층:** 응용(HTTP, DNS), 전송(TCP, UDP, 포트), 인터넷(IP, 라우터), 링크(이더넷, MAC)
      - **OSI 7계층:** 응용, 표현, 세션이 TCP/IP 응용에, 데이터 링크와 물리가 링크에 해당한다
      - **캡슐화:** 보낼 때 계층마다 헤더를 붙이고 받을 때 뗀다. 프로그램은 상대가 보낸 바이트만 받는다
      - **실무:** L4, L7 로드 밸런서처럼 장비가 어느 계층까지 읽는지를 OSI 번호로 부른다
    checklist:
      - TCP/IP 4계층의 이름과 계층마다 하는 일을 말했다
      - OSI 7계층과 TCP/IP 4계층의 대응을 말했다
      - 계층을 나누는 이유(아래 계층의 방법을 몰라도 되고, 바꿔도 위를 고치지 않음)를 말했다
      - 보낼 때 헤더를 붙이고 받을 때 떼는 캡슐화를 말했다
      - L4와 L7 로드 밸런서처럼 계층 번호가 실무에서 쓰이는 예를 말했다
    source: https://www.rfc-editor.org/rfc/rfc1122.html
