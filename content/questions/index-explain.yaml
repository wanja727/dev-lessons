  title: 인덱스와 실행계획
  unit: DB
  order: 21
concepts:
  - key: core
    name: 인덱스와 실행계획
questions:
  - key: q-fa46b64b
    concept: core
    type: descriptive
    status: draft
    difficulty: 1
    body: 인덱스가 조회를 빠르게 하는 원리와, 인덱스가 있어도 쓰이지 않는 경우를 1분 안에 설명해 보세요
    explanation: |-
      - 정렬된 B-tree로 몇 단계 만에 찾음. 사용 여부는 옵티마이저가 통계로 결정, EXPLAIN으로 확인
      - 못 쓰는 경우: 컨럼에 함수, 앞쪽 와일드카드, 낮은 선택도, 복합 인덱스 선두 컨럼 누락
      - 쓰기 비용과 공간
    checklist:
      - B-tree와 정렬을 말했다
      - 실행계획(EXPLAIN) 확인을 말했다
      - 못 쓰는 경우를 2개 이상 말했다
      - 낮은 선택도에서는 일부러 안 쓴다고 말했다
      - 쓰기 비용을 말했다
    source: https://www.postgresql.org/docs/16/using-explain.html
  - key: q-4802e0cc
    concept: core
    type: descriptive
    status: draft
    difficulty: 2
    body: Seq Scan, Index Scan, Bitmap Heap Scan, Index Only Scan을 비교해 보세요
    explanation: |-
      - Seq Scan: 전체 순차 (대부분을 읽을 때 유리)
      - Index Scan: 인덱스로 찾은 행을 하나씩 (소수)
      - Bitmap: 위치를 모아 테이블을 위치 순으로 (중간)
      - Index Only Scan: 인덱스만으로 답함, VACUUM으로 가시성 정보 필요
    checklist:
      - Seq Scan을 설명했다
      - Index Scan을 설명했다
      - Bitmap 스캔을 설명했다
      - Index Only Scan을 설명했다
      - 각각 유리한 건수나 조건을 말했다
    source: https://www.postgresql.org/docs/16/using-explain.html
  - key: q-01fa3098
    concept: core
    type: descriptive
    status: draft
    difficulty: 3
    body: "\"주문 날짜별 조회\"가 느리다는 제보가 왔다. created_at에 인덱스는 있다. 어떻게 원인을 찾고 고칠지 말해 보세요"
    explanation: |-
      - 실제 SQL을 로그에서 찾아 EXPLAIN (ANALYZE)로 실행계획 확인
      - Seq Scan이면 조건을 봄: created_at::date = ?, date(created_at) 등 함수/형변환 → 범위 조건으로 바꾸거나 함수 인덱스
      - 다른 조건과 함께면 복합 인덱스 순서, 통계 갱신(ANALYZE)도 확인
    checklist:
      - 실제 SQL과 실행계획부터 본다고 말했다
      - 컨럼 변환을 의심했다
      - 범위 조건이나 함수 인덱스를 말했다
      - 복합 인덱스나 선택도를 말했다
      - 통계 갱신을 말했다
    source: https://www.postgresql.org/docs/16/indexes-expressional.html
  - key: q-cffe9cb1
    concept: core
    type: ox
    status: draft
    difficulty: 1
    body: "\"인덱스가 있는 컬럼을 조건으로 쓰면 항상 인덱스로 찾는다\""
    answer: X
    explanation: |-
      - 대부분의 행이 해당하면(낮은 선택도) 플래너가 Seq Scan을 고른다. 함수를 씌우거나 앞쪽 와일드카드면 아예 못 쓴다
      - 검증: IndexPlanTest (selectivity, functionOnColumn)
    source: https://www.postgresql.org/docs/16/using-explain.html
  - key: q-c8c44a8a
    concept: core
    type: code_predict
    status: draft
    difficulty: 2
    body: 20만 건 중 99%가 PAID인 테이블에 status 인덱스가 있다. WHERE status = 'PAID'의 실행계획은?
    choices:
      - Index Scan using idx_status
      - Seq Scan
      - Index Only Scan
      - 오류
    answer: "2"
    explanation: |-
      - 거의 모든 행을 읽어야 해서 전체 순차가 싼다. 같은 인덱스도 1%인 CANCELED에는 쓰인다
      - 검증: IndexPlanTest (selectivity)
    source: https://www.postgresql.org/docs/16/using-explain.html
  - key: q-92351db0
    concept: core
    type: multiple_choice
    status: draft
    difficulty: 2
    body: 복합 인덱스 (status, created_at)를 가장 효율적으로 쓰는 조건은?
    choices:
      - created_at > '2026-03-01'
      - status = 'CANCELED' AND created_at > '2026-03-01'
      - created_at = ? OR status = ?
      - lower(status) = 'canceled'
    answer: "2"
    explanation: |-
      - 선두 컨럼 등치 + 다음 컨럼 범위는 인덱스의 한 구간만 읽는다. 1번은 선두 컨럼 없음, 4번은 함수
      - 검증: IndexPlanTest (compositeIndex)
    source: https://www.postgresql.org/docs/16/indexes-multicolumn.html
  - key: q-6b4ea2d1
    concept: core
    type: line_pick
    status: draft
    difficulty: 3
    body: "[코드 13-A] 이메일 검색이 느리다. email에 일반 인덱스가 있는데도 Seq Scan이 나온다. 원인이 되는 줄은? (PostgreSQL, 정렬 규칙 en_US.utf8)"
    code: |-
      CREATE INDEX idx_email ON member (email);

      SELECT * FROM member
       WHERE lower(email) = lower(:input)
         AND status = 'ACTIVE';
    answer: "4"
    explanation: |-
      - 컨럼에 lower()를 씌워서 email 인덱스를 못 쓴다. 고치기: lower(email)로 함수 인덱스를 만들거나, 저장 때 소문자로 정규화해 email = ?로 조회
      - 검증: IndexPlanTest (functionOnColumn)
    source: https://www.postgresql.org/docs/16/indexes-opclass.html
