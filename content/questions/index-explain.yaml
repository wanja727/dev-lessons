# 인덱스와 실행계획 문제
# 형식: https://github.com/wanja727/retrievo/blob/main/docs/content-format.md
#
# 2026-11-25에 레슨을 핵심 질문 구조로 다시 쓰며 문제도 새로 만들었다. 예전 문제(q-xxxxxxxx)는 지웠다.
# 모든 문제는 coreQuestions의 질문 하나에 묶이고(coreQuestion), 답의 근거가 레슨 본문에 있다
# (site/src/content/lesson-pages/index-explain.yaml의 says).
# 동작에 관한 정답은 verification의 IndexExplainTest, IndexPlanTest로 확인했다 (PostgreSQL 16).
# 질문마다 첫 문제는 본문의 예시로 묻고, 둘째 문제는 다른 상황으로 옮겨 묻는다.
subject:
  key: dev
  name: 개발자 면접
lesson:
  key: index-explain
  title: 인덱스와 실행계획
  unit: DB
  order: 607
concepts:
  - key: core
    name: 인덱스와 실행계획
coreQuestions:
  - key: q1
    text: "인덱스는 조회를 어떻게 빠르게 하나요?"
  - key: q2
    text: "인덱스가 있는데 왜 쓰이지 않을까요?"
  - key: q3
    text: "복합 인덱스는 왜 열의 순서가 중요한가요?"
  - key: q4
    text: "인덱스를 많이 만들면 무엇을 잃나요?"
questions:
  # ── 질문 1 ──
  - key: idx-seq-scan
    concept: core
    coreQuestion: q1
    type: multiple_choice
    status: draft
    difficulty: 1
    body: "주문 20만 건에서 인덱스가 없는 `member_id`로 `where member_id = 123`을 실행하고 `explain analyze`를 봤어요. 맞는 행은 10개예요. 실행계획은 어떻게 나오나요?"
    choices:
      - Index Scan으로 10행만 읽는다
      - Seq Scan으로 20만 행을 읽고 199,990행을 버린다
      - Index Only Scan으로 테이블을 읽지 않는다
      - 오류가 난다. 인덱스가 없는 열은 조건으로 쓸 수 없다
    answer: "2"
    explanation: |-
      **Seq Scan으로 전체를 읽어요.** 인덱스가 없으면 조건에 맞는 행을 찾을 다른 길이 없어요.

      - `Rows Removed by Filter: 199990`이 읽고 버린 행이에요
      - 인덱스를 만들면 정렬된 트리로 10행만 찾아요
    source: https://www.postgresql.org/docs/16/using-explain.html
  - key: idx-phone-seq
    concept: core
    coreQuestion: q1
    type: multiple_choice
    status: draft
    difficulty: 1
    body: "회원 500만 명의 `member`에서 `where phone = ?`로 찾는 API가 느려요. 실행계획에 `Seq Scan on member`가 나와요. 가장 먼저 할 일은 무엇인가요?"
    choices:
      - 서버 메모리를 늘린다
      - "`phone`에 인덱스를 만들고 실행계획이 인덱스로 바뀌었는지 본다"
      - 회원을 모두 읽어 자바에서 찾는다
      - 커넥션 풀을 키운다
    answer: "2"
    explanation: |-
      **`phone`에 인덱스를 만들어요.** Seq Scan은 500만 행을 다 읽는다는 뜻이에요.

      - 인덱스는 정렬된 트리라 O(log n)에 찾아요
      - 만든 뒤 EXPLAIN으로 Index Scan이나 Bitmap Heap Scan으로 바뀌었는지 확인해요
    source: https://www.postgresql.org/docs/16/using-explain.html
  # ── 질문 2 ──
  - key: idx-selectivity
    concept: core
    coreQuestion: q2
    type: multiple_choice
    status: draft
    difficulty: 2
    body: "주문 20만 건 가운데 99%가 PAID, 1%가 CANCELED예요. `status`에 인덱스가 있어요. `where status = 'PAID'`와 `where status = 'CANCELED'`의 실행계획은?"
    choices:
      - 둘 다 인덱스를 쓴다
      - PAID는 Seq Scan, CANCELED는 인덱스를 쓴다
      - PAID는 인덱스, CANCELED는 Seq Scan
      - 둘 다 Seq Scan이다
    answer: "2"
    explanation: |-
      **PAID는 Seq Scan, CANCELED는 인덱스예요.** 플래너가 통계로 맞는 행의 비율(선택도)을 어림해요.

      - 거의 다 읽을 거면 인덱스와 테이블을 오가는 것보다 차례로 읽는 편이 싸요
      - 맞는 행이 적으면 인덱스가 싸요
    source: https://www.postgresql.org/docs/16/using-explain.html
  - key: idx-date-function
    concept: core
    coreQuestion: q2
    type: multiple_choice
    status: draft
    difficulty: 2
    body: "`created_at`에 인덱스가 있는데 `where date(created_at) = '2026-11-25'`가 Seq Scan이에요. 인덱스를 쓰게 고친 조건은?"
    choices:
      - "`where date(created_at) >= '2026-11-25'`"
      - "`where created_at >= '2026-11-25' and created_at < '2026-11-26'`"
      - "`where created_at::text like '2026-11-25%'`"
      - "`where cast(created_at as date) = '2026-11-25'`"
    answer: "2"
    explanation: |-
      **열은 그대로 두고 범위로 써요.** 인덱스에는 `created_at` 값이 정렬되어 있지 `date(created_at)` 값이 있지 않아요.

      - 나머지 보기는 모두 열에 함수나 변환을 씌워 인덱스를 못 써요
      - 같은 식으로 함수 인덱스를 만드는 방법도 있어요
    source: https://www.postgresql.org/docs/16/indexes-expressional.html
  # ── 질문 3 ──
  - key: idx-composite-leading
    concept: core
    coreQuestion: q3
    type: multiple_choice
    status: draft
    difficulty: 2
    body: "인덱스 (`status`, `created_at`)가 있어요. 주문 20만 건에서 `where created_at > '2026-03-01'`(전체의 절반쯤)만으로 조회하면 실행계획은?"
    choices:
      - 인덱스의 두 번째 열로 바로 찾는다
      - 선두 열 조건이 없어 Seq Scan이다
      - 오류가 난다
      - Index Only Scan이다
    answer: "2"
    explanation: |-
      **Seq Scan이에요.** 날짜는 status마다 따로 정렬되어 있어 한 구간으로 모여 있지 않아요.

      - 복합 인덱스는 첫 열로 정렬하고 같으면 다음 열로 정렬해요
      - `status = 'CANCELED' and created_at > ...`처럼 선두 열 조건이 있으면 인덱스를 써요
    source: https://www.postgresql.org/docs/16/indexes-multicolumn.html
  - key: idx-member-created
    concept: core
    coreQuestion: q3
    type: multiple_choice
    status: draft
    difficulty: 2
    body: "`where member_id = ? order by created_at desc limit 10`이 자주 불려요. 어떤 인덱스가 가장 맞나요?"
    choices:
      - "`(created_at, member_id)`"
      - "`(member_id, created_at)`"
      - "`(member_id)`와 `(created_at)` 두 개"
      - "`(created_at)` 하나"
    answer: "2"
    explanation: |-
      **`(member_id, created_at)`이에요.** 같음 조건 열을 앞에 두면 회원 한 명의 구간을 바로 찾아요.

      - 그 구간 안은 날짜순이라 Sort 없이 10개만 읽고 멈춰요
      - 날짜를 앞에 두면 날짜 범위를 훑으며 회원을 하나씩 걸러야 해요
    source: https://www.postgresql.org/docs/16/indexes-ordering.html
  # ── 질문 4 ──
  - key: idx-write-cost
    concept: core
    coreQuestion: q4
    type: ox
    status: draft
    difficulty: 1
    body: "테이블에 인덱스를 다섯 개 더 만들어도 INSERT의 속도는 그대로다. 인덱스는 조회할 때만 쓰이기 때문이다."
    answer: X
    explanation: |-
      **X. INSERT가 느려져요.** 행을 넣을 때마다 모든 인덱스에도 그 값을 넣어야 해요.

      - 같은 20만 행을 넣는 시간이 인덱스 다섯 개를 더하자 몇 배로 늘었어요
      - UPDATE와 DELETE도 같아요. 인덱스는 공간도 써요
    source: https://www.postgresql.org/docs/16/indexes-intro.html
  - key: idx-log-table
    concept: core
    coreQuestion: q4
    type: multiple_choice
    status: draft
    difficulty: 2
    body: "하루 수백만 건이 쌓이고 거의 조회하지 않는 로그 테이블의 열 여덟 개에 모두 인덱스를 만들자는 의견이 있어요. 가장 알맞은 판단은?"
    choices:
      - 좋다. 인덱스는 많을수록 빠르다
      - 쓰기마다 인덱스 여덟 개를 고쳐 쌓는 속도가 느려지니, 실제로 조회하는 조건에만 만든다
      - 인덱스 대신 외래 키를 건다
      - PostgreSQL은 인덱스를 다섯 개까지만 만든다
    answer: "2"
    explanation: |-
      **실제로 조회하는 조건에만 만들어요.** 인덱스는 읽기를 빠르게 하는 대신 쓰기마다 함께 고쳐야 해요.

      - 쓰기가 많고 읽기가 드문 테이블에서는 비용만 커요
      - 쓰이지 않는 인덱스는 `pg_stat_user_indexes`의 `idx_scan`으로 찾아 지워요
    source: https://www.postgresql.org/docs/16/indexes-intro.html
  - key: idx-find-all-filter
    concept: core
    coreQuestion: q4
    type: multiple_choice
    status: draft
    difficulty: 2
    body: "`status`에 인덱스가 있는 주문 20만 건을 `orderRepository.findAll().stream().filter(o -> o.isCanceled())`로 걸러요. 맞는 주문은 2000건이에요. 무엇이 문제인가요?"
    choices:
      - 문제없다. 결과가 같다
      - 20만 행을 모두 앱으로 옮기고, 인덱스를 쓸 기회도 없다
      - 취소 주문이 빠진다
      - 쿼리가 2000번 나간다
    answer: "2"
    explanation: |-
      **20만 행을 다 옮기고, DB는 조건을 몰라 인덱스를 못 써요.**

      - `findByStatus(CANCELED)`처럼 조건을 WHERE로 보내면 2000행만 받아요
      - 거르는 조건은 쿼리에 둬요
    source: https://www.postgresql.org/docs/16/using-explain.html
  # ── 면접 질문 ──
  - key: idx-interview
    concept: core
    coreQuestion: all
    type: descriptive
    status: draft
    difficulty: 2
    body: 면접에서 "인덱스가 조회를 빠르게 하는 원리와, 인덱스가 있어도 쓰이지 않는 경우를 설명해 주세요"라는 질문을 받았어요. 1분 안에 답해 보세요.
    explanation: |-
      **인덱스는 정렬된 B-트리라 O(log n)에 찾고, 조건이 정렬된 값과 맞지 않거나 맞는 행이 많으면 쓰이지 않아요.**

      - **원리:** 값을 정렬해 둔 트리와 행 위치. 전체를 읽는 Seq Scan 대신 Index Scan
      - **못 쓰는 경우:** 열에 함수, 앞쪽 %, 맞는 행이 대부분(선택도), 복합 인덱스의 선두 열 없음
      - **확인:** EXPLAIN ANALYZE로 실제 행 수와 시간
      - **비용:** 쓰기마다 인덱스도 고친다. 자주 거는 조건과 외래 키에 만든다
    checklist:
      - 인덱스는 정렬된 B-트리라 전체를 읽지 않고 찾는다고 말했다
      - 열에 함수를 씌우거나 앞에 %를 붙이면 못 쓴다고 말했다
      - 맞는 행이 많으면 플래너가 Seq Scan을 고른다고 말했다
      - 복합 인덱스는 선두 열 조건이 필요하다고 말했다
      - 인덱스는 쓰기를 느리게 해서 필요한 곳에만 만든다고 말했다
    source: https://www.postgresql.org/docs/16/using-explain.html
