# 요청 수 제한 문제
# 형식: https://github.com/wanja727/retrievo/blob/main/docs/content-format.md
#
# 모든 문제는 coreQuestions의 질문 하나에 묶이고(coreQuestion), 답의 근거가 레슨 본문에 있다
# (site/src/content/lesson-pages/rate-limit.yaml의 says).
# 동작에 관한 정답은 verification의 RateLimitTest로 확인했다 (Redis 7, 스프링 부트 3.5).
# 질문마다 첫 문제는 본문의 예시로 묻고, 둘째 문제는 다른 상황으로 옮겨 묻는다.
# 쓴 날 검수까지 마쳐 reviewed로 올린다 (2026-11-25)
subject:
  key: dev
  name: 개발자 면접
lesson:
  key: rate-limit
  title: 요청 수 제한
  unit: 시스템 설계와 아키텍처
  order: 913
concepts:
  - key: core
    name: 요청 수 제한
coreQuestions:
  - key: q1
    text: "요청 수는 왜 제한하고, 카운터는 어디에 두나요?"
  - key: q2
    text: "고정 창에는 어떤 구멍이 있나요?"
  - key: q3
    text: "토큰 버킷은 어떻게 다른가요?"
  - key: q4
    text: "제한은 어디에 두고, 넘으면 무엇을 돌려주나요?"
questions:
  # ── 질문 1 ──
  - key: rl-other-user
    concept: core
    coreQuestion: q1
    type: multiple_choice
    status: reviewed
    difficulty: 1
    body: 사용자마다 1초에 5번으로 제한하는 고정 창이에요. 사용자 A가 1초 안에 7번을 보내 6번째와 7번째가 거절됐어요. 같은 때 사용자 B가 처음 보낸 요청은 어떻게 되나요?
    choices:
      - 거절된다. A가 한도를 다 썼다
      - 허용된다. 사용자마다 키가 달라 따로 센다
      - 1초를 기다려야 한다
      - A의 한도가 B에게 넘어간다
    answer: "2"
    explanation: |-
      **허용돼요.** 키에 사용자 id가 들어가서 사용자마다 따로 세요.

      - 테스트에서도 같은 때 B의 첫 요청은 허용됐어요
    source: https://redis.io/docs/latest/commands/incr/
  - key: rl-memory-three
    concept: core
    coreQuestion: q1
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: 서버 3대가 각자 메모리 맵으로 사용자마다 1초에 5번을 세요. 로드 밸런서가 라운드 로빈으로 나누면 한 사용자는 1초에 최대 몇 번 통과하나요?
    choices:
      - 5번
      - 3번
      - 15번
      - 1번
    answer: "3"
    explanation: |-
      **15번이에요.** 서버마다 따로 세니 셋을 합쳐 15번이에요.

      - 카운터를 Redis 같은 공유 저장소에 두면 5번이에요
    source: https://redis.io/docs/latest/commands/incr/
  # ── 질문 2 ──
  - key: rl-boundary
    concept: core
    coreQuestion: q2
    type: multiple_choice
    status: reviewed
    difficulty: 1
    body: 1초에 5번인 고정 창이에요. 10.90초부터 10.98초 사이에 5번, 11.00초부터 11.08초 사이에 5번을 보냈어요. 허용된 수는?
    choices:
      - 5번
      - 0번
      - 7번
      - 10번
    answer: "4"
    explanation: |-
      **10번이에요.** 창이 바뀌며 카운터가 0부터 다시 시작했어요.

      - 0.2초도 안 되는 사이에 한도의 두 배가 통과했어요
      - 같은 요청에서 토큰 버킷은 5번만 허용했어요
    source: https://redis.io/docs/latest/commands/incr/
  - key: rl-minute-window
    concept: core
    coreQuestion: q2
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: 1분에 100번인 고정 창(매분 0초에 새로 셈)이에요. 0분 59초에 100번, 1분 0초에 100번을 보내면 2초 안에 통과하는 수는?
    choices:
      - 200번
      - 100번
      - 0번
      - 150번
    answer: "1"
    explanation: |-
      **200번이에요.** 앞 창의 끝과 새 창의 시작에서 100번씩 통과해요.

      - 각 창은 한도를 지켰지만 순간의 몰림은 막지 못해요
    source: https://redis.io/docs/latest/commands/incr/
  # ── 질문 3 ──
  - key: rl-bucket-burst
    concept: core
    coreQuestion: q3
    type: multiple_choice
    status: reviewed
    difficulty: 1
    body: 용량 5, 초당 5개를 채우는 토큰 버킷이 가득 차 있어요. 한꺼번에 8번을 보내면 몇 번 허용되나요?
    choices:
      - 8번
      - 5번
      - 0번
      - 1번
    answer: "2"
    explanation: |-
      **5번이에요.** 버킷에 든 토큰 5개만큼 몰아 보내기를 허용해요.

      - 테스트에서도 5번이었고, 0.4초 뒤에는 그동안 채워진 2개만큼 허용됐어요
    source: https://bucket4j.com/
  - key: rl-bucket-rest
    concept: core
    coreQuestion: q3
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: 용량 10, 초당 2개를 채우는 토큰 버킷을 다 쓴 뒤 3초를 쉬었어요. 그다음 한꺼번에 10번을 보내면 몇 번 허용되나요?
    choices:
      - 10번
      - 2번
      - 3번
      - 6번
    answer: "4"
    explanation: |-
      **6번이에요.** 3초 동안 초당 2개씩 6개가 채워졌어요.

      - 용량 10을 넘지 않으니 6개 그대로예요
    source: https://bucket4j.com/
  # ── 질문 4 ──
  - key: rl-429
    concept: core
    coreQuestion: q4
    type: multiple_choice
    status: reviewed
    difficulty: 1
    body: 인터셉터가 사용자마다 1초에 3번으로 제한해요. 같은 사용자의 4번째 요청이 받는 응답으로 알맞은 것은?
    choices:
      - 200 OK
      - 500 Internal Server Error
      - 429 Too Many Requests와 Retry-After 헤더
      - 404 Not Found
    answer: "3"
    explanation: |-
      **429와 Retry-After예요.** 429는 요청이 너무 많다는 뜻이고, Retry-After는 언제 다시 보내면 되는지 알려 줘요.

      - 테스트에서 세 번은 200, 네 번째는 429와 Retry-After: 1이었어요
    source: https://www.rfc-editor.org/rfc/rfc6585#section-4
  - key: rl-office-ip
    concept: core
    coreQuestion: q4
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: 회사 사무실 100명이 같은 공인 IP로 인터넷에 나가요. 서비스가 로그인한 사용자의 API를 IP당 1초에 10번으로 제한해요. 무슨 일이 생길 수 있나요?
    choices:
      - 사무실 사용자들이 한도를 나눠 써서 정상 사용자도 막힌다
      - 사용자마다 10번씩 쓸 수 있다
      - IP 제한은 사무실에는 걸리지 않는다
      - 서버가 IP를 사용자로 바꿔 센다
    answer: "1"
    explanation: |-
      **정상 사용자도 막혀요.** 같은 IP라 하나로 세요.

      - 로그인한 사용자는 사용자 id로, 공개 API는 API 키로 세는 편이 맞아요
    source: https://www.rfc-editor.org/rfc/rfc6585#section-4
  - key: rl-memory-map
    concept: core
    coreQuestion: q4
    type: code_predict
    status: reviewed
    difficulty: 2
    body: 서버 한 대에서 아래 코드로 사용자마다 요청을 제한해요. 사용자 A가 오늘 5번 요청했어요. 내일 A의 첫 요청은 어떻게 되나요?
    code: |-
      private final Map<String, AtomicInteger>
          counts = new ConcurrentHashMap<>();

      boolean tryAcquire(String user) {
        return counts.computeIfAbsent(user,
            k -> new AtomicInteger())
            .incrementAndGet() <= 5;
      }
    choices:
      - 허용된다. 하루가 지나 새로 센다
      - 서버를 다시 띄우기 전까지 영원히 거절된다
      - 1초 뒤에 허용된다
      - 허용되고 카운터가 1이 된다
    answer: "2"
    explanation: |-
      **영원히 거절돼요.** 카운터를 0으로 돌리는 창이나 만료가 없어요.

      - 서버가 여러 대면 서버마다 따로 세는 문제도 있어요
      - Redis에 창 번호가 든 키와 만료를 두거나 토큰 버킷을 써요
    source: https://redis.io/docs/latest/commands/incr/
  # ── 네 질문을 하나로 ──
  - key: rl-interview
    concept: core
    coreQuestion: all
    type: descriptive
    status: reviewed
    difficulty: 2
    body: 면접에서 "요청 수 제한을 어떻게 설계하나요?"라는 질문을 받았어요. 1분 안에 답해 보세요.
    explanation: |-
      **공유 저장소에 카운터를 두고, 경계 문제가 없는 토큰 버킷을 쓰며, 넘으면 429를 돌려줘요.**

      - **왜:** 서버와 다른 사용자를 지키고 공격을 늦춘다
      - **고정 창:** 단순하지만 경계에서 한도의 두 배가 통과한다
      - **토큰 버킷:** 용량만큼의 몰림과 평균 속도를 함께 다룬다. Redis에서는 Lua로
      - **어디에:** 게이트웨이와 인터셉터. 무엇으로 셀지 정하고 429와 Retry-After
    checklist:
      - 제한의 목적을 말했다
      - 서버가 여러 대면 카운터를 공유 저장소에 둔다고 말했다
      - 고정 창의 경계 문제를 말했다
      - 토큰 버킷을 말했다
      - 429와 Retry-After를 말했다
    source: https://www.rfc-editor.org/rfc/rfc6585#section-4
