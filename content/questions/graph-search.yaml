  key: graph-search
  title: 그래프와 탐색
  unit: 자료구조와 알고리즘
  order: 65
concepts:
  - key: core
    name: 그래프와 탐색
coreQuestions:
  - key: q1
    text: "그래프는 코드로 어떻게 담나요?"
  - key: q2
    text: "너비 우선 탐색은 어떤 순서로 둘러보나요?"
  - key: q3
    text: "깊이 우선 탐색은 어떤 순서로 둘러보나요?"
  - key: q4
    text: "너비 우선과 깊이 우선은 각각 어떤 문제에 쓰나요?"
questions:
  # ── 질문 1 ──
  - key: graph-neighbors
    concept: core
    coreQuestion: q1
    type: multiple_choice
    status: draft
    difficulty: 1
    body: 회원 일곱 명의 친구 관계가 1-2, 1-3, 2-4, 2-5, 3-6, 5-7이에요(방향 없음). 인접 리스트로 담으면 5번 회원의 이웃 목록은 무엇이고, 선은 모두 몇 개일까요?
    choices:
      - 5번의 이웃은 7번뿐, 선 6개
      - 5번의 이웃은 2번과 7번, 선 6개
      - 5번의 이웃은 2번과 7번, 선 12개
      - 5번의 이웃은 2번뿐, 선 7개
    answer: "2"
    explanation: |-
      **이웃은 2번과 7번, 선은 6개예요.** 방향이 없으면 선 하나를 양쪽 점의 목록에 모두 적어요.

      - 2-5 선은 2의 목록과 5의 목록에, 5-7 선은 5와 7의 목록에 들어가요
      - 목록의 길이를 모두 더하면 12이고, 선 하나를 두 번 적었으니 선은 6개예요
    source: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/Map.html
  - key: graph-matrix-size
    concept: core
    coreQuestion: q1
    type: multiple_choice
    status: draft
    difficulty: 2
    body: 점이 10만 개이고 점마다 선이 평균 10개인 그래프를 담아요. 인접 행렬과 인접 리스트가 쓰는 칸 수는 대략 각각 얼마일까요?
    choices:
      - 둘 다 100만 칸 남짓
      - 인접 행렬은 100억 칸, 인접 리스트는 100만 칸 남짓
      - 인접 행렬은 100만 칸, 인접 리스트는 100억 칸
      - 둘 다 100억 칸
    answer: "2"
    explanation: |-
      **인접 행렬은 100억 칸, 인접 리스트는 100만 칸 남짓이에요.** 인접 행렬은 점 수의 제곱만큼 칸을 써요.

      - 10만 × 10만 = 100억. 칸 대부분이 비어 있어요
      - 인접 리스트는 점마다 이웃 목록이라 점 수와 선 수에 비례해요
    source: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/Map.html
  # ── 질문 2 ──
  - key: graph-bfs-from3
    concept: core
    coreQuestion: q2
    type: code_predict
    status: draft
    difficulty: 1
    body: 친구 관계 1-2, 1-3, 2-4, 2-5, 3-6, 5-7에서, 이웃을 목록에 적힌 순서(번호 순)로 보는 아래 bfs를 3번 회원부터 돌려요. 방문 순서는 무엇일까요?
    code: |-
      q.offer(start);
      seen.add(start);
      while (!q.isEmpty()) {
        int v = q.poll();
        order.add(v);
        for (int w : g.get(v)) {
          if (seen.add(w)) {
            q.offer(w);
          }
        }
      }
    choices:
      - 3, 1, 6, 2, 4, 5, 7
      - 3, 1, 2, 4, 5, 7, 6
      - 3, 6, 1, 2, 4, 5, 7
      - 3, 1, 2, 6, 4, 5, 7
    answer: "1"
    explanation: |-
      **3, 1, 6, 2, 4, 5, 7이에요.** 큐는 먼저 넣은 점을 먼저 꺼내서 가까운 겹부터 둘러봐요.

      - 3의 이웃 1, 6이 먼저, 그다음 1의 이웃 2, 그다음 2의 이웃 4, 5, 마지막으로 7이에요
      - 3, 1, 2, 4, 5, 7, 6은 깊이 우선의 순서예요
    source: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/ArrayDeque.html
  - key: graph-no-seen
    concept: core
    coreQuestion: q2
    type: multiple_choice
    status: draft
    difficulty: 2
    body: 너비 우선 탐색에서 방문 표시(seen)를 모두 지우고 꺼낸 점의 이웃을 무조건 q.offer(w)로 넣게 바꿨어요. 1-2 선이 있는 친구 그래프에서 1부터 돌리면 어떻게 될까요?
    choices:
      - 방문 순서만 조금 달라지고 정상으로 끝난다
      - 끝나지 않는다. 서로 이웃인 두 점이 서로를 계속 큐에 넣는다
      - 첫 점만 방문하고 끝난다
      - NullPointerException이 난다
    answer: "2"
    explanation: |-
      **끝나지 않아요.** 1이 2를 넣고, 2가 1을 다시 넣고, 그 1이 또 2를 넣어요.

      - 방향이 없는 선은 양쪽 목록에 다 있어서 돌아오는 길이 늘 있어요
      - 큐에 넣는 순간 seen에 표시해야 한 점이 한 번만 들어가요
    source: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/ArrayDeque.html
  - key: graph-late-mark
    concept: core
    coreQuestion: q2
    type: code_predict
    status: draft
    difficulty: 2
    body: 방문 표시를 꺼낼 때 하도록 바꾼 너비 우선이에요. 넣을 때 표시하는 코드와 비교해 맞는 것은 무엇일까요?
    code: |-
      while (!q.isEmpty()) {
        int v = q.poll();
        if (!seen.add(v)) continue;
        order.add(v);
        for (int w : g.get(v)) {
          if (!seen.contains(w)) {
            q.offer(w);
          }
        }
      }
    choices:
      - 방문 순서가 달라진다
      - 방문 순서는 같지만 같은 점이 큐에 여러 번 들어가 offer가 크게 는다
      - 끝나지 않는다
      - 넣을 때 표시하는 코드와 완전히 같다
    answer: "2"
    explanation: |-
      **방문 순서는 같지만 같은 점이 큐에 여러 번 들어가요.** 아직 꺼내지 않은 점은 표시가 없어서 다른 이웃들이 또 넣어요.

      - 모두 서로 친구인 1천 명에서 offer가 1000번에서 49만 9501번으로 늘었어요
      - 결과가 같아서 작은 테스트로는 드러나지 않아요
    source: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/ArrayDeque.html
  # ── 질문 3 ──
  - key: graph-dfs-from3
    concept: core
    coreQuestion: q3
    type: code_predict
    status: draft
    difficulty: 1
    body: 친구 관계 1-2, 1-3, 2-4, 2-5, 3-6, 5-7에서, 이웃을 번호 순으로 보는 아래 재귀 dfs를 3번 회원부터 돌려요. 방문 순서는 무엇일까요?
    code: |-
      void dfs(int v, Set<Integer> seen,
               List<Integer> order) {
        seen.add(v);
        order.add(v);
        for (int w : g.get(v)) {
          if (!seen.contains(w)) {
            dfs(w, seen, order);
          }
        }
      }
    choices:
      - 3, 1, 6, 2, 4, 5, 7
      - 3, 1, 2, 4, 5, 7, 6
      - 3, 6, 1, 2, 4, 5, 7
      - 3, 1, 2, 5, 7, 4, 6
    answer: "2"
    explanation: |-
      **3, 1, 2, 4, 5, 7, 6이에요.** 한 이웃을 따라 끝까지 들어간 뒤 돌아 나와 다음 이웃으로 가요.

      - 3에서 1, 1에서 2, 2에서 4로 들어가고, 돌아와 5, 7까지 다 봐요
      - 그다음에야 3으로 돌아와 6을 봐요
    source: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/ArrayDeque.html
  - key: graph-deep-line
    concept: core
    coreQuestion: q3
    type: multiple_choice
    status: draft
    difficulty: 2
    body: 점 100만 개가 1-2-3-...-1000000처럼 한 줄로 이어진 그래프를 재귀 DFS로 1부터 끝까지 둘러봐요. 어떤 일이 생길 수 있고, 어떻게 피할까요?
    choices:
      - 아무 일 없다. DFS는 O(V + E)라 빠르다
      - StackOverflowError가 날 수 있다. ArrayDeque를 스택으로 써서 직접 돈다
      - OutOfMemoryError가 난다. 방문 표시를 지운다
      - 끝나지 않는다. 방문 표시를 넣을 때로 옮긴다
    answer: "2"
    explanation: |-
      **StackOverflowError가 날 수 있어요.** 재귀는 깊이만큼 호출 스택에 프레임을 쌓아요.

      - 한 줄로 이어진 점 10만 개에서도 재귀 버전은 StackOverflowError로 멈췄어요
      - ArrayDeque를 스택으로 쓰면 깊이와 상관없이 모두 방문해요
    source: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/ArrayDeque.html
  # ── 질문 4 ──
  - key: graph-distance
    concept: core
    coreQuestion: q4
    type: multiple_choice
    status: draft
    difficulty: 1
    body: 친구 관계 1-2, 1-3, 2-4, 2-5, 3-6, 5-7에서 4번 회원과 6번 회원 사이의 최단 거리(거치는 선의 수)는 얼마일까요?
    choices:
      - "2"
      - "3"
      - "4"
      - "5"
    answer: "3"
    explanation: |-
      **4예요.** 4-2-1-3-6으로 선 네 개를 거쳐요.

      - 4에서 너비 우선으로 둘러보면 6에 처음 닿는 겹이 4예요
      - 가중치가 없으면 처음 닿는 순간의 겹 수가 최단 거리예요
    source: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/ArrayDeque.html
  - key: graph-maze
    concept: core
    coreQuestion: q4
    type: multiple_choice
    status: draft
    difficulty: 2
    body: 미로를 칸이 점, 이웃한 칸이 선인 그래프로 봐요. 입구에서 출구까지 가장 적게 움직이는 횟수를 구하려면 어느 탐색을 쓰고, 왜 그럴까요?
    choices:
      - 깊이 우선. 출구까지 끝까지 들어가기 때문이다
      - 너비 우선. 움직임마다 비용이 같아서 처음 닿은 겹 수가 최단이다
      - 어느 쪽이든 처음 닿은 길이 최단이다
      - 다익스트라. 너비 우선으로는 구할 수 없다
    answer: "2"
    explanation: |-
      **너비 우선이에요.** 가까운 겹부터 보니 출구에 처음 닿는 순간의 겹 수가 가장 적게 움직인 횟수예요.

      - 깊이 우선은 먼 길로 먼저 닿을 수 있어요
      - 움직임마다 비용이 다를 때 다익스트라가 필요해요
    source: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/ArrayDeque.html
  - key: graph-spring-cycle
    concept: core
    coreQuestion: q4
    type: code_predict
    status: draft
    difficulty: 2
    body: 두 서비스가 서로를 생성자로 받아요. 스프링 컨텍스트를 띄우면 어떻게 될까요?
    code: |-
      @Service
      class OrderService {
        OrderService(MemberService members) {}
      }

      @Service
      class MemberService {
        MemberService(OrderService orders) {}
      }
    choices:
      - 정상으로 뜬다. 스프링이 프록시로 순환을 푼다
      - 빈을 만들다 지금 만들고 있는 빈을 다시 만나 BeanCurrentlyInCreationException으로 실패한다
      - 두 빈 가운데 하나만 만들어진다
      - 컴파일 오류가 난다
    answer: "2"
    explanation: |-
      **BeanCurrentlyInCreationException으로 실패해요.** OrderService를 만들려고 MemberService를 만들다가, 지금 만들고 있는 OrderService를 다시 필요로 해요.

      - 깊이 우선에서 지금 따라가는 길의 점을 다시 만난 것과 같은 순환이에요
      - 생성자 주입은 객체를 만들기 전에 상대가 있어야 해서 풀 수 없어요. 책임을 나눠 순환을 없애요
    source: https://docs.spring.io/spring-framework/reference/core/beans/dependencies/factory-collaborators.html
  # ── 네 질문을 하나로 ──
  - key: graph-interview
    concept: core
    coreQuestion: all
    type: descriptive
    status: draft
    difficulty: 2
    body: 면접에서 "BFS와 DFS는 어떻게 다르고, 각각 언제 쓰나요?"라는 질문을 받았어요. 1분 안에 답해 보세요.
    explanation: |-
      **BFS는 큐로 가까운 겹부터, DFS는 재귀나 스택으로 한 길을 끝까지 둘러보고, 최단 거리는 BFS, 순환 찾기는 DFS가 맞아요.**

      - **담기:** 그래프는 보통 인접 리스트(Map<점, List<점>>)로 담는다
      - **BFS:** 큐로 한 겹씩. 방문 표시는 넣을 때. 가중치 없는 최단 거리
      - **DFS:** 재귀나 스택으로 끝까지. 깊으면 StackOverflowError라 스택으로. 순환, 연결된 덩어리
      - **비용:** 둘 다 O(V + E)
    checklist:
      - BFS는 큐로 가까운 점부터 한 겹씩 넓혀 간다고 말했다
      - DFS는 재귀나 스택으로 한 길을 끝까지 따라간다고 말했다
      - 가중치가 없는 최단 거리는 BFS로 구한다고 말했다
      - 순환 찾기나 연결된 덩어리는 DFS가 맞다고 말했다
      - 둘 다 O(V + E)이거나, 방문 표시가 필요하다고 말했다
    source: https://docs.spring.io/spring-framework/reference/core/beans/dependencies/factory-collaborators.html
