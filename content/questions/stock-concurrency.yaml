# 동시 요청에서 재고 지키기 문제
# 형식: https://github.com/wanja727/retrievo/blob/main/docs/content-format.md
#
# 모든 문제는 coreQuestions의 질문 하나에 묶이고(coreQuestion), 답의 근거가 레슨 본문에 있다
# (site/src/content/lesson-pages/stock-concurrency.yaml의 says).
# 동작에 관한 정답은 verification의 InventoryConcurrencyTest와 InventoryPracticeTest로 확인했다 (PostgreSQL 16, Redis 7).
# 질문마다 첫 문제는 본문의 예시로 묻고, 둘째 문제는 다른 상황으로 옮겨 묻는다.
# 2026-11-25에 핵심 질문 구조로 다시 쓰면서 예전 문제를 지우고 새로 썼다.
subject:
  key: dev
  name: 개발자 면접
lesson:
  key: stock-concurrency
  title: 동시 요청에서 재고 지키기
  unit: 시스템 설계와 아키텍처
  order: 907
concepts:
  - key: core
    name: 동시 요청에서 재고 지키기
coreQuestions:
  - key: q1
    text: "재고를 확인하고 줄였는데 왜 재고보다 많이 팔리나요?"
  - key: q2
    text: "DB에서는 어떻게 재고를 지키나요?"
  - key: q3
    text: "Redis로 재고를 줄일 때는 무엇을 조심하나요?"
  - key: q4
    text: "여러 방법 가운데 무엇을 고르나요?"
questions:
  # ── 질문 1 ──
  - key: sc-two-orders-one-left
    concept: core
    coreQuestion: q1
    type: multiple_choice
    status: reviewed
    difficulty: 1
    body: 재고가 1켤레 남았어요. 주문 A와 B가 동시에 재고를 읽어 둘 다 1을 봤고, 각자 1 - 1 = 0을 써서 커밋했어요. 팔린 수와 남은 재고는?
    choices:
      - 2켤레, -1
      - 1켤레, 1
      - 1켤레, 0
      - 2켤레, 0
    answer: "4"
    explanation: |-
      **2켤레를 팔았는데 재고는 0이에요.** 둘 다 같은 값을 읽고 같은 값을 써서 한 번의 차감이 사라졌어요(갱신 손실).

      - 그래서 재고보다 많이 팔려요(초과 판매)
      - 테스트에서 재고 50에 주문 100건을 읽고-계산하고-쓰기로 처리하니 100건이 모두 성공했어요
    source: https://www.postgresql.org/docs/16/explicit-locking.html
  - key: sc-seat-reserve
    concept: core
    coreQuestion: q1
    type: code_predict
    status: reviewed
    difficulty: 2
    body: 두 사람이 같은 좌석을 동시에 눌렀어요. 아래 코드(PostgreSQL 기본 격리 수준)에서 생길 수 있는 일은?
    code: |-
      @Transactional
      void reserve(long seatId, long userId) {
        Seat seat = seats.findById(seatId)
            .orElseThrow();
        if (seat.isReserved()) {
          throw new AlreadyReserved();
        }
        seat.reserve(userId);
      }
    choices:
      - 데드락이 난다
      - 한 사람만 예매된다. @Transactional이 막는다
      - 둘 다 "비어 있음"을 읽고 둘 다 예매에 성공할 수 있다
      - 둘 다 AlreadyReserved로 실패한다
    answer: "3"
    explanation: |-
      **둘 다 예매에 성공할 수 있어요.** 확인과 쓰기 사이의 틈은 트랜잭션이 막지 않아요.

      - 기본 격리 수준은 다른 트랜잭션이 같은 행을 읽는 것을 막지 않아요
      - 조건부 UPDATE나 비관적 락으로 막아요
    source: https://www.postgresql.org/docs/16/explicit-locking.html
  # ── 질문 2 ──
  - key: sc-conditional-result
    concept: core
    coreQuestion: q2
    type: code_predict
    status: reviewed
    difficulty: 1
    body: 재고 50에 아래 조건부 UPDATE로 동시 주문 100건을 처리했어요(바뀐 행이 0이면 품절). 성공, 품절, 남은 재고는?
    code: |-
      update item
      set quantity = quantity - 1
      where id = 1 and quantity >= 1
    choices:
      - 성공 50, 품절 50, 재고 10
      - 성공 100, 품절 0, 재고 -50
      - 성공 50, 품절 50, 재고 0
      - 성공 60, 품절 40, 재고 0
    answer: "3"
    explanation: |-
      **성공 50, 품절 50, 재고 0이에요.** DB가 행 락으로 확인과 차감을 한 번에 해서 틈이 없어요.

      - 기다리던 UPDATE는 바뀐 값을 다시 보고 조건을 따져요
      - 테스트에서도 정확히 이 결과였어요
    source: https://www.postgresql.org/docs/16/explicit-locking.html
  - key: sc-optimistic-coupon
    concept: core
    coreQuestion: q2
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: 쿠폰 1,000장을 낙관적 락(@Version)으로 발급해요. 오픈 순간 1만 명이 몰리고 재시도는 없어요. 어떤 일이 생길까요?
    choices:
      - 충돌로 실패하는 요청이 많아 쿠폰이 남았는데도 발급 실패가 난다
      - 1,000장보다 많이 발급된다
      - 모든 요청이 기다렸다가 차례로 발급된다
      - 정확히 1,000장이 발급된다
    answer: "1"
    explanation: |-
      **쿠폰이 남았는데도 충돌로 실패하는 요청이 많아요.** 낙관적 락은 초과 발급은 막지만 같은 행에 몰리면 대부분이 충돌해요.

      - 테스트에서 재고 50에 100건이 오니 18건만 성공하고 82건이 충돌로 실패, 재고 32가 남았어요
      - 몰리는 데이터에는 조건부 UPDATE나 비관적 락이 맞아요
    source: https://docs.spring.io/spring-data/jpa/reference/jpa/locking.html
  - key: sc-modifying-stale
    concept: core
    coreQuestion: q2
    type: code_predict
    status: reviewed
    difficulty: 3
    body: 재고가 50인 상품이에요. 한 트랜잭션 안에서 아래 코드를 실행하면 마지막 줄이 돌려주는 값은? (decrease는 @Modifying @Query로 만든 조건부 UPDATE, 다른 설정은 없음)
    code: |-
      Item item = items.findById(1L)
          .orElseThrow();
      items.decrease(1L);
      return items.findById(1L)
          .orElseThrow().getQuantity();
    choices:
      - 예외가 난다
      - "49"
      - "50"
      - "0"
    answer: "3"
    explanation: |-
      **50이에요.** @Modifying 쿼리는 영속성 컨텍스트를 거치지 않고 DB만 바꿔서, 1차 캐시의 엔티티는 옛 값이에요.

      - 다시 findById해도 1차 캐시의 같은 객체를 줘요. DB는 49예요
      - clearAutomatically = true를 주거나 수량을 다시 읽을 일이 없게 짜요
    source: https://docs.spring.io/spring-data/jpa/reference/jpa/query-methods.html
  # ── 질문 3 ──
  - key: sc-decr-negative
    concept: core
    coreQuestion: q3
    type: multiple_choice
    status: reviewed
    difficulty: 1
    body: 재고 50을 Redis에 두고, 주문마다 DECR만 해서 결과가 0 이상이면 성공으로 쳐요. 주문 100건이 동시에 오면 끝난 뒤 Redis의 재고 값은?
    choices:
      - "-50"
      - "50"
      - "-100"
      - "0"
    answer: "1"
    explanation: |-
      **-50이에요.** DECR은 섞이지 않지만 0에서 멈추지 않아 100번 모두 줄여요.

      - 성공은 50건이 맞지만 재고 값이 음수로 남아요
      - 확인과 차감을 Lua 스크립트로 묶으면 0에서 멈춰요
    source: https://redis.io/docs/latest/develop/interact/programmability/eval-intro/
  - key: sc-redis-rollback
    concept: core
    coreQuestion: q3
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: Lua 스크립트로 Redis 재고를 줄인 뒤 DB에 주문을 저장하다 DB 오류로 실패했어요. 아무것도 하지 않으면 어떻게 되고, 무엇을 해야 할까요?
    choices:
      - 팔리지 않았는데 Redis 재고가 하나 줄어 있다. Redis 재고를 다시 늘린다
      - DB 재고가 하나 줄어 있다. DB를 고친다
      - 다음 주문이 실패한다
      - 문제없다. Redis가 알아서 되돌린다
    answer: "1"
    explanation: |-
      **Redis 재고만 줄어 있어요. 다시 늘려 되돌려요.** Redis로 줄이면 재고가 Redis와 DB 두 곳에 생겨요.

      - Redis와 DB는 한 트랜잭션으로 묶이지 않아요
      - Redis가 값을 잃으면 DB의 주문 기록으로 다시 채워요
    source: https://redis.io/docs/latest/develop/interact/programmability/eval-intro/
  # ── 질문 4 ──
  - key: sc-choose-plain-shop
    concept: core
    coreQuestion: q4
    type: multiple_choice
    status: reviewed
    difficulty: 1
    body: 하루 주문이 수천 건인 평범한 쇼핑몰이에요. 재고가 있으면 1 줄이고 없으면 품절로 거절하면 돼요. 가장 단순하게 맞는 방법은?
    choices:
      - 애플리케이션의 synchronized
      - 조건부 UPDATE
      - Redis와 Lua 스크립트
      - 낙관적 락과 무한 재시도
    answer: "2"
    explanation: |-
      **조건부 UPDATE예요.** 판단이 숫자 하나라 UPDATE 한 문장으로 끝나요.

      - Redis는 운영할 것이 늘어서 몰리지 않으면 얻는 것이 적어요
      - synchronized는 서버가 여러 대면 막지 못해요
    source: https://www.postgresql.org/docs/16/explicit-locking.html
  - key: sc-lock-with-api
    concept: core
    coreQuestion: q4
    type: code_predict
    status: reviewed
    difficulty: 2
    body: 같은 상품에 주문 10건이 동시에 왔어요. 결제 API는 2초 걸려요. 마지막 주문은 대략 얼마나 기다릴까요?
    code: |-
      @Transactional
      void order(long itemId) {
        Item item =
            items.findForUpdate(itemId);
        item.decrease();
        payment.approve(...); // 2초
      }
    choices:
      - 기다리지 않는다
      - 0.2초쯤
      - 2초쯤
      - 18초쯤
    answer: "4"
    explanation: |-
      **18초쯤이에요.** 앞의 9건이 하나씩 2초씩 락을 쥐어요.

      - 락을 잡은 채 오래 걸리는 일을 하지 않아요
      - 재고를 줄이고 커밋한 뒤 결제하고, 실패하면 재고를 되돌려요
    source: https://www.postgresql.org/docs/16/explicit-locking.html
  # ── 네 질문을 하나로 ──
  - key: sc-interview
    concept: core
    coreQuestion: all
    type: descriptive
    status: reviewed
    difficulty: 2
    body: 면접에서 "동시에 들어온 주문에서 재고를 어떻게 지키나요?"라는 질문을 받았어요. 1분 안에 답해 보세요.
    explanation: |-
      **읽기와 쓰기 사이의 틈을 없애는 조건부 UPDATE를 기본으로, 상황에 따라 비관적 락이나 Redis를 써요.**

      - **문제:** 같은 재고를 동시에 읽고 같은 값을 써서 초과 판매가 난다. @Transactional로는 막지 못한다
      - **DB:** 조건부 UPDATE는 판단을 UPDATE에 넣고 바뀐 행 수로 품절을 안다. 비관적 락은 읽을 때 잠근다
      - **Redis:** DECR은 0에서 멈추지 않아 Lua로 묶는다. 재고가 두 곳이라 되돌리기가 필요하다
      - **고르기:** 대부분 조건부 UPDATE, 판단이 많으면 비관적 락, 몰리면 Redis. 락을 쥔 채 외부 API를 부르지 않는다
    checklist:
      - 갱신 손실과 초과 판매가 생기는 이유를 말했다
      - 조건부 UPDATE를 말했다
      - 비관적 락이나 낙관적 락의 차이를 말했다
      - Redis로 줄일 때 Lua 스크립트가 필요한 이유를 말했다
      - 상황에 따라 고르는 기준을 말했다
    source: https://www.postgresql.org/docs/16/explicit-locking.html
