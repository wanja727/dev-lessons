# 팩토리 문제
# 형식: https://github.com/wanja727/retrievo/blob/main/docs/content-format.md
#
# 모든 문제는 coreQuestions의 질문 하나에 묶이고(coreQuestion), 답의 근거가 레슨 본문에 있다
# (site/src/content/lesson-pages/factory.yaml의 says).
# 동작에 관한 정답은 verification의 FactoryTest로 확인했다 (자바 21, 스프링 부트 3.5).
# 질문마다 첫 문제는 본문의 예시로 묻고, 둘째 문제는 다른 상황으로 옮겨 묻는다.
# 2026-11-25에 만들고 같은 날 검수해 reviewed로 바꿨다.
subject:
  key: dev
  name: 개발자 면접
lesson:
  key: factory
  title: 팩토리
  unit: 객체지향 설계와 패턴
  order: 309
concepts:
  - key: core
    name: 팩토리
coreQuestions:
  - key: q1
    text: "정적 팩토리 메서드는 생성자로 못 하는 무엇을 하나요?"
  - key: q2
    text: "정적 팩토리 메서드는 어떻게 짓고, 언제 단점이 되나요?"
  - key: q3
    text: "팩토리 메서드 패턴은 무엇이고, 단순한 팩토리와 무엇이 다른가요?"
  - key: q4
    text: "만드는 코드를 따로 빼면 무엇이 좋아지나요?"
questions:
  # ── 질문 1 ──
  - key: fa-valueof-1000
    concept: core
    coreQuestion: q1
    type: code_predict
    status: reviewed
    difficulty: 1
    body: 아래 두 줄은 각각 무엇을 찍을까요?
    code: |-
      System.out.println(
          Integer.valueOf(100)
              == Integer.valueOf(100));
      System.out.println(
          Integer.valueOf(1000)
              == Integer.valueOf(1000));
    choices:
      - true, true
      - true, false
      - false, false
      - false, true
    answer: "2"
    explanation: |-
      **true와 false예요.** valueOf는 -128부터 127까지 미리 만든 객체를 돌려주고, 1000은 범위 밖이라 새 객체를 만들어요.

      - 생성자는 늘 새 객체를 만들지만 정적 팩토리 메서드는 같은 객체를 다시 줄 수 있어요
    source: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/lang/Integer.html#valueOf(int)
  - key: fa-boolean
    concept: core
    coreQuestion: q1
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: Boolean.valueOf("true")를 두 번 불러 ==로 비교하면 결과는 무엇이고, 그 이유는 무엇일까요?
    choices:
      - false. 부를 때마다 새 객체를 만든다
      - true. 미리 만들어 둔 Boolean.TRUE를 돌려준다
      - 컴파일 오류. 문자열을 받을 수 없다
    answer: "2"
    explanation: |-
      **true예요.** Boolean.valueOf는 새 객체를 만들지 않고 Boolean.TRUE나 Boolean.FALSE를 돌려줘요.

      - 매번 새 객체를 만들지 않아도 되는 것이 정적 팩토리 메서드가 생성자와 다른 점이에요
    source: https://github.com/wanja727/dev-lessons/blob/main/verification/src/test/java/lab/devlessons/factory/FactoryTest.java
  # ── 질문 2 ──
  - key: fa-private-ctor
    concept: core
    coreQuestion: q2
    type: code_predict
    status: reviewed
    difficulty: 1
    body: Order의 생성자는 private이고, 밖에는 static Order create(...)만 열려 있어요. 다른 클래스에서 아래 코드를 쓰면 어떻게 될까요?
    code: |-
      Order order = new Order(member, items,
          0, Status.CREATED);
    choices:
      - 총액 0원인 주문이 만들어진다
      - 컴파일 오류
      - 실행 중 예외
    answer: "2"
    explanation: |-
      **컴파일 오류예요.** 생성자가 private이라 밖에서는 create로만 만들 수 있어요.

      - 총액 계산 같은 생성 규칙을 create 한 곳에 모으면 규칙을 건너뛴 객체가 생기지 않아요
    source: https://github.com/wanja727/dev-lessons/blob/main/verification/src/test/java/lab/devlessons/factory/FactoryTest.java
  - key: fa-name-from
    concept: core
    coreQuestion: q2
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: 정적 팩토리 메서드의 관례 이름 가운데, 다른 타입의 값 하나를 받아 이 타입으로 바꿀 때 쓰는 것은 무엇일까요? (예 Money.???("1,000원"))
    choices:
      - of
      - from
      - getInstance
      - newInstance
    answer: "2"
    explanation: |-
      **from이에요.** Date.from(instant)처럼 다른 타입 하나에서 바꿀 때 써요.

      - of는 여러 값으로, valueOf는 값으로(캐시하기도 함), getInstance는 같은 객체일 수 있을 때, newInstance나 create는 항상 새 객체일 때 써요
    source: https://github.com/wanja727/dev-lessons/blob/main/verification/src/test/java/lab/devlessons/factory/FactoryTest.java
  # ── 질문 3 ──
  - key: fa-sms-alert
    concept: core
    coreQuestion: q3
    type: code_predict
    status: reviewed
    difficulty: 1
    body: 아래에서 new SmsAlertService().alert("010", "배송 시작")을 부르면 어느 Notifier가 쓰일까요?
    code: |-
      abstract class AlertService {
        void alert(String to, String msg) {
          Notifier n = createNotifier();
          n.notify(to, msg);
        }
        protected abstract⤶
            Notifier createNotifier();
      }

      class SmsAlertService
          extends AlertService {
        protected Notifier createNotifier() {
          return new AligoSmsNotifier();
        }
      }
    choices:
      - Notifier 인터페이스 자체
      - AligoSmsNotifier
      - 컴파일 오류. 추상 메서드를 부른다
    answer: "2"
    explanation: |-
      **AligoSmsNotifier예요.** 무엇을 만들지를 자식이 createNotifier를 오버라이드해 정했어요. 이것이 팩토리 메서드 패턴이에요.
    source: https://github.com/wanja727/dev-lessons/blob/main/verification/src/test/java/lab/devlessons/factory/FactoryTest.java
  - key: fa-editor
    concept: core
    coreQuestion: q3
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: Editor.open()이 createDocument()를 불러 문서를 만들고, PdfEditor와 WordEditor가 createDocument()를 각각 오버라이드해요. 이것은 무엇일까요?
    choices:
      - 단순 팩토리
      - 팩토리 메서드 패턴
      - 정적 팩토리 메서드
      - 빌더 패턴
    answer: "2"
    explanation: |-
      **팩토리 메서드 패턴이에요.** 무엇을 만들지를 자식 클래스의 메서드가 정해요.

      - 단순 팩토리는 한 클래스가 switch 같은 조건문으로 고르는 것이에요
    source: https://github.com/wanja727/dev-lessons/blob/main/verification/src/test/java/lab/devlessons/factory/FactoryTest.java
  # ── 질문 4 ──
  - key: fa-seven-services
    concept: core
    coreQuestion: q4
    type: multiple_choice
    status: reviewed
    difficulty: 1
    body: 알림을 보내는 서비스 일곱 곳이 NotifierFactory.of(Channel.SMS)로 알림 객체를 얻어요. 문자 업체를 바꿀 때 일곱 서비스 가운데 고칠 파일은 몇 개일까요?
    choices:
      - 7개
      - 1개
      - 0개
    answer: "3"
    explanation: |-
      **0개예요.** 서비스는 Notifier와 팩토리만 알아요. 팩토리 한 파일과 새 구현만 바뀌어요.

      - 서비스마다 new AligoSmsNotifier()를 했다면 일곱 파일을 고쳐야 했어요
    source: https://github.com/wanja727/dev-lessons/blob/main/verification/src/test/java/lab/devlessons/factory/FactoryTest.java
  - key: fa-toss-key
    concept: core
    coreQuestion: q4
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: 여러 서비스가 각자 new TossClient(key)로 결제 클라이언트를 만들어요. 결제사의 키를 받는 방법이 바뀌면 어디를 고쳐야 할까요? 만드는 코드를 팩토리 하나로 모았다면 어디를 고칠까요?
    choices:
      - 모든 서비스, 팩토리 한 곳
      - 팩토리 한 곳, 모든 서비스
      - TossClient만, TossClient만
    answer: "1"
    explanation: |-
      **직접 만들면 모든 서비스, 모으면 팩토리 한 곳이에요.** 만드는 방법이 흩어져 있으면 그 방법이 바뀔 때 흩어진 곳을 모두 고쳐요.
    source: https://github.com/wanja727/dev-lessons/blob/main/verification/src/test/java/lab/devlessons/factory/FactoryTest.java
  - key: fa-optional-of
    concept: core
    coreQuestion: q4
    type: code_predict
    status: reviewed
    difficulty: 2
    body: findName(id)가 이름이 없으면 null을 돌려줘요. 이름이 없는 id로 아래 코드를 실행하면 어떻게 될까요?
    code: |-
      Optional<String> name =
          Optional.of(repository
              .findName(id));
    choices:
      - 빈 Optional이 된다
      - NullPointerException
      - Optional 안에 null이 들어간다
    answer: "2"
    explanation: |-
      **NullPointerException이에요.** Optional.of는 null이 아닌 값을 약속받는 팩토리라서 null이면 바로 예외를 던져요.

      - null일 수 있는 값은 Optional.ofNullable로 만들어요
    source: https://github.com/wanja727/dev-lessons/blob/main/verification/src/test/java/lab/devlessons/factory/FactoryTest.java
  # ── 네 질문을 하나로 ──
  - key: fa-interview
    concept: core
    coreQuestion: all
    type: descriptive
    status: reviewed
    difficulty: 2
    body: 면접에서 "생성자 대신 정적 팩토리 메서드를 쓰는 이유와, 팩토리 메서드 패턴이 무엇인지 설명해 주세요"라는 질문을 받았어요. 1분 안에 답해 보세요.
    explanation: |-
      **정적 팩토리 메서드는 이름, 캐시, 하위 타입 돌려주기를 할 수 있고, 팩토리 메서드 패턴은 무엇을 만들지 자식이 정하는 패턴이에요.**

      - **정적 팩토리:** 이름이 있다, valueOf처럼 같은 객체를 준다, List.of처럼 감춘 클래스를 준다
      - **규칙 모으기:** 생성자를 private으로 막고 create에 생성 규칙을 둔다. 단점은 상속 불가와 찾기 어려움
      - **패턴:** 팩토리 메서드 패턴은 자식이 오버라이드해 고르고, 단순 팩토리는 조건문으로 고른다
      - **효과:** 만드는 코드를 모으면 구현을 바꿀 때 한 곳만 고친다
    checklist:
      - 정적 팩토리 메서드는 이름을 가질 수 있다고 말했다
      - 매번 새 객체를 만들지 않아도 된다(캐시)고 말했다
      - 하위 타입이나 감춘 클래스를 돌려줄 수 있다고 말했다
      - 팩토리 메서드 패턴은 무엇을 만들지 자식 클래스가 정한다고 말했다
      - 만드는 코드를 모으면 구현을 바꿀 때 한 곳만 고친다고 말했다
    source: https://github.com/wanja727/dev-lessons/blob/main/verification/src/test/java/lab/devlessons/factory/FactoryTest.java
