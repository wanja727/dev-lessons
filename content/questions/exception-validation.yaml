# 예외 처리와 검증 문제
# 형식: https://github.com/wanja727/retrievo/blob/main/docs/content-format.md
#
# 모든 문제는 coreQuestions의 질문 하나에 묶이고(coreQuestion), 답의 근거가 레슨 본문에 있다
# (site/src/content/lesson-pages/exception-validation.yaml의 says).
# 동작에 관한 정답은 verification의 ExceptionValidationTest로 확인했다 (스프링 부트 3.5, Hibernate Validator).
# 질문마다 첫 문제는 본문의 예시로 묻고, 둘째 문제는 다른 상황으로 옮겨 묻는다.
subject:
  key: dev
  name: 개발자 면접
lesson:
  key: exception-validation
  title: 예외 처리와 검증
  unit: 스프링
  order: 708
concepts:
  - key: core
    name: 예외 처리와 검증
coreQuestions:
  - key: q1
    text: "컨트롤러에서 예외가 나면 응답은 어떻게 되나요?"
  - key: q2
    text: "예외를 원하는 응답으로 바꾸려면 어떻게 하나요?"
  - key: q3
    text: "잘못된 입력은 어떻게 막나요?"
  - key: q4
    text: "에러 응답의 모양은 어떻게 하나로 맞추나요?"
questions:
  # ── 질문 1 ──
  - key: ev-unhandled-500
    concept: core
    coreQuestion: q1
    type: multiple_choice
    status: draft
    difficulty: 1
    body: 예외를 처리하는 @ExceptionHandler가 하나도 없는 앱에서, 서비스가 IllegalArgumentException("수량은 1 이상")을 던졌어요. 응답 상태 코드는 몇일까요?
    choices:
      - "400"
      - "404"
      - "422"
      - "500"
    answer: "4"
    explanation: |-
      **500이에요.** 스프링은 내가 던진 예외의 뜻을 몰라서, 처리하지 않은 예외는 모두 500으로 봐요.

      - 본문은 스프링 부트의 기본 에러 응답(timestamp, status, error, path)이에요
      - 400으로 바꾸려면 핸들러가 필요해요
    source: https://docs.spring.io/spring-boot/reference/web/servlet.html
  - key: ev-type-400
    concept: core
    coreQuestion: q1
    type: multiple_choice
    status: draft
    difficulty: 2
    body: 상품 API GET /products/{id}의 id가 long이고, 예외 처리 코드는 따로 없어요. GET /products/12a를 보내면 응답은 몇이고, 그 상태 코드는 누가 정했을까요?
    choices:
      - 500. 컨트롤러에서 예외가 났다
      - 400. 스프링이 타입 변환 실패를 400으로 바꿨다
      - 404. 그런 상품이 없다
      - 200. id가 0으로 들어간다
    answer: "2"
    explanation: |-
      **400이에요.** 타입 변환 실패 같은 스프링 MVC의 예외는 스프링이 뜻을 알아서 알맞은 4xx로 바꿔요. 컨트롤러는 불리지도 않아요.
    source: https://docs.spring.io/spring-framework/reference/web/webmvc/mvc-ann-rest-exceptions.html
  # ── 질문 2 ──
  - key: ev-closest
    concept: core
    coreQuestion: q2
    type: multiple_choice
    status: draft
    difficulty: 1
    body: '@RestControllerAdvice에 Exception 핸들러(500)와 MemberNotFoundException 핸들러(404)가 함께 있어요. MemberNotFoundException은 RuntimeException을 상속해요. 없는 회원을 조회하면 몇이 올까요?'
    choices:
      - "500. Exception 핸들러가 모든 예외를 잡는다"
      - "404. 던진 예외와 가장 가까운 타입의 핸들러가 골라진다"
      - 앱이 뜨지 않는다. 핸들러가 겹친다
      - 둘 다 불려 나중 것이 이긴다
    answer: "2"
    explanation: |-
      **404예요.** 핸들러가 여럿이면 던진 예외와 상속 거리로 가장 가까운 타입의 것이 골라져요.

      - 그래서 Exception 핸들러를 마지막 그물로 함께 둘 수 있어요
    source: https://docs.spring.io/spring-framework/reference/web/webmvc/mvc-controller/ann-exceptionhandler.html
  - key: ev-local-first
    concept: core
    coreQuestion: q2
    type: multiple_choice
    status: draft
    difficulty: 2
    body: 주문 컨트롤러 안에 @ExceptionHandler(IllegalStateException.class)가 409를 돌려주고, @RestControllerAdvice에는 Exception 핸들러가 500을 돌려줘요. 주문 컨트롤러에서 IllegalStateException이 나면 몇일까요? 회원 컨트롤러에서 같은 예외가 나면 몇일까요?
    choices:
      - 둘 다 409
      - 주문 409, 회원 500
      - 둘 다 500
      - 주문 500, 회원 409
    answer: "2"
    explanation: |-
      **주문은 409, 회원은 500이에요.** 컨트롤러 안의 핸들러는 그 컨트롤러에만 걸리고 어드바이스보다 먼저예요. 회원 컨트롤러에는 그 핸들러가 없으니 어드바이스의 Exception 핸들러로 가요.
    source: https://docs.spring.io/spring-framework/reference/web/webmvc/mvc-controller/ann-exceptionhandler.html
  # ── 질문 3 ──
  - key: ev-not-blank
    concept: core
    coreQuestion: q3
    type: code_predict
    status: draft
    difficulty: 1
    body: 아래 컨트롤러에 {"email":"   ","age":20}을 보내면 어떻게 될까요? spring-boot-starter-validation이 있어요.
    code: |-
      record SignUp(
          @NotBlank @Email String email,
          @NotNull @Min(0) Integer age) {}

      @PostMapping("/members")
      Member create(
          @RequestBody @Valid SignUp req) {
        return members.create(req);
      }
    choices:
      - 200. 이메일 칸이 비어 있지 않다
      - 400. @NotBlank가 공백만 있는 문자열을 막고 컨트롤러는 불리지 않는다
      - 컨트롤러가 불린 뒤 400이 된다
      - 500
    answer: "2"
    explanation: |-
      **400이고 컨트롤러는 불리지 않아요.** @Valid가 붙은 인자를 바꾼 뒤 검증하고, 걸리면 MethodArgumentNotValidException을 던져요. @NotBlank는 공백만 있는 문자열도 막아요.
    source: https://jakarta.ee/specifications/bean-validation/3.0/jakarta-bean-validation-spec-3.0
  - key: ev-not-null-empty
    concept: core
    coreQuestion: q3
    type: multiple_choice
    status: draft
    difficulty: 2
    body: '상품 등록 record에 @NotNull String name만 있고 @Valid로 받아요. {"name":""}을 보내면 검증을 통과할까요?'
    choices:
      - 통과한다. @NotNull은 null만 막는다
      - 막는다. 빈 문자열은 null로 본다
      - 막는다. @NotNull은 빈 문자열까지 막는다
      - 500이 난다
    answer: "1"
    explanation: |-
      **통과해요.** @NotNull은 null만 막아요. 빈 문자열까지 막으려면 @NotEmpty, 공백만 있는 문자열까지 막으려면 @NotBlank를 써요.
    source: https://jakarta.ee/specifications/bean-validation/3.0/jakarta-bean-validation-spec-3.0
  - key: ev-missing-valid
    concept: core
    coreQuestion: q3
    type: multiple_choice
    status: draft
    difficulty: 2
    body: 'record SignUp(@NotBlank String email, @Min(0) Integer age)를 @RequestBody로 받는데, 인자에 @Valid를 붙이는 것을 잊었어요. {"email":" ","age":-1}을 보내면 어떻게 될까요?'
    choices:
      - 400. 어노테이션이 있으니 검사한다
      - 200. @Valid가 없어 검사하지 않고 값이 그대로 들어간다
      - 500. 검증 설정이 잘못됐다
      - 컴파일 오류
    answer: "2"
    explanation: |-
      **200이에요.** 검증 어노테이션은 표시일 뿐이고, 스프링은 @Valid가 붙은 인자만 검증해요. 음수 나이가 그대로 들어가요.

      - spring-boot-starter-validation이 없어도 같은 일이 생겨요
    source: https://docs.spring.io/spring-boot/reference/io/validation.html
  # ── 질문 4 ──
  - key: ev-enum-unreadable
    concept: core
    coreQuestion: q4
    type: multiple_choice
    status: draft
    difficulty: 1
    body: 'enum Grade { BASIC, VIP }를 필드로 가진 요청 record에 {"email":"a@b.com","age":20,"grade":"GOLD"}를 보냈어요. 처리하는 핸들러는 없어요. 어떤 예외가 나고 응답은 몇일까요?'
    choices:
      - MethodArgumentNotValidException, 400
      - HttpMessageNotReadableException, 400
      - IllegalArgumentException, 500
      - 예외 없이 grade가 null로 들어가 200
    answer: "2"
    explanation: |-
      **HttpMessageNotReadableException이고 400이에요.** 잭슨이 GOLD를 Grade로 바꾸지 못해 본문을 읽는 단계에서 실패해요. 검증 전이라 MethodArgumentNotValidException이 아니에요.

      - 같은 에러 형식으로 바꾸려면 이 예외의 핸들러를 둬요
    source: https://docs.spring.io/spring-framework/reference/web/webmvc/mvc-ann-rest-exceptions.html
  - key: ev-fallback
    concept: core
    coreQuestion: q4
    type: multiple_choice
    status: draft
    difficulty: 2
    body: 'Exception 핸들러가 로그를 남기고 ProblemDetail.forStatusAndDetail(INTERNAL_SERVER_ERROR, "잠시 후 다시 시도해 주세요")를 돌려줘요. 리포지토리가 메시지에 SQL이 든 DB 예외를 던지면 응답의 상태 코드와 detail은 무엇일까요?'
    choices:
      - 500, 예외 메시지(SQL 포함)
      - 500, "잠시 후 다시 시도해 주세요"
      - 400, "잠시 후 다시 시도해 주세요"
      - 200, 빈 본문
    answer: "2"
    explanation: |-
      **500과 일반 문구예요.** 예상하지 못한 예외도 같은 형식으로 내보내고, 자세한 내용은 로그에만 남겨요.

      - 응답에 SQL이나 예외 이름이 나가면 공격자에게 내부를 알려 줘요
    source: https://www.rfc-editor.org/rfc/rfc9457
  - key: ev-problemdetails
    concept: core
    coreQuestion: q4
    type: multiple_choice
    status: draft
    difficulty: 2
    body: '@RestControllerAdvice가 ResponseEntityExceptionHandler를 상속하고 다른 핸들러는 없어요. GET /members/abc(id는 long)를 보내면 응답 본문은 어떤 모양일까요?'
    choices:
      - 스프링 부트 기본 에러 응답(timestamp, status, error, path)
      - ProblemDetail(type, title, status, detail, instance)
      - 빈 본문
      - 'abc'
    answer: "2"
    explanation: |-
      **ProblemDetail이에요.** ResponseEntityExceptionHandler는 타입 변환 실패, 본문 읽기, 검증, 405 같은 스프링 MVC의 예외를 모두 ProblemDetail로 바꿔요.

      - spring.mvc.problemdetails.enabled=true로도 같은 효과를 낼 수 있어요
    source: https://docs.spring.io/spring-framework/reference/web/webmvc/mvc-ann-rest-exceptions.html
  # ── 전체 ──
  - key: ev-interview
    concept: core
    coreQuestion: all
    type: descriptive
    status: draft
    difficulty: 2
    body: 면접에서 "스프링에서 예외 처리와 입력 검증은 어떻게 하나요?"라는 질문을 받았어요. 1분 안에 답해 보세요.
    explanation: |-
      **예외는 던지게 두고 @RestControllerAdvice에서 한 형식으로 바꾸며, 입력은 @Valid와 검증 어노테이션으로 막아요.**

      - **기본:** 처리하지 않은 내 예외는 500, 스프링 MVC의 예외는 알맞은 4xx
      - **어드바이스:** 예외마다 @ExceptionHandler. 가장 가까운 타입, 컨트롤러 안의 것이 먼저
      - **검증:** @Valid와 @NotBlank 등. 걸리면 컨트롤러 전에 400. @NotNull, @NotEmpty, @NotBlank의 차이
      - **형식:** ProblemDetail로 맞추고 Exception 그물로 예외 메시지가 나가지 않게 한다
    checklist:
      - '@RestControllerAdvice와 @ExceptionHandler로 예외를 응답으로 바꾼다고 말했다'
      - '@Valid와 검증 어노테이션으로 입력을 막고 걸리면 400이라고 말했다'
      - 에러 응답을 한 형식(ProblemDetail)으로 맞춘다고 말했다
      - 예외 메시지나 스택 트레이스를 응답에 내보내지 않는다고 말했다
    source: https://docs.spring.io/spring-framework/reference/web/webmvc/mvc-controller/ann-exceptionhandler.html
