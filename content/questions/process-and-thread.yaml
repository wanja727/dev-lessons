# 프로세스와 스레드 문제
# 형식: https://github.com/wanja727/retrievo/blob/main/docs/content-format.md
#
# 모든 문제는 coreQuestions의 질문 하나에 묶이고(coreQuestion), 답의 근거가 레슨 본문에 있다
# (site/src/content/lesson-pages/process-and-thread.yaml의 says).
# 동작에 관한 정답은 verification의 processthread/ProcessAndThreadTest로 확인했다 (자바 21).
# 질문마다 첫 문제는 본문의 예시로 묻고, 둘째 문제는 다른 상황으로 옮겨 묻는다.
# 2026-11-25에 핵심 질문 구조로 다시 썼다. 예전 문제는 지웠다.
subject:
  key: dev
  name: 개발자 면접
lesson:
  key: process-and-thread
  title: 프로세스와 스레드
  unit: 운영체제와 동시성
  order: 401
concepts:
  - key: core
    name: 프로세스와 스레드
coreQuestions:
  - key: q1
    text: "프로세스와 스레드는 무엇이 다른가요?"
  - key: q2
    text: "같은 프로세스의 스레드는 무엇을 함께 쓰고 무엇을 따로 가지나요?"
  - key: q3
    text: "스레드는 어떻게 만들고 실행하나요?"
  - key: q4
    text: "스레드가 메모리를 함께 쓰면 무엇이 문제인가요?"
questions:
  # ── 질문 1 ──
  - key: pt-child-jvm
    concept: core
    coreQuestion: q1
    type: multiple_choice
    status: draft
    difficulty: 1
    body: 자바 프로그램이 자식 JVM을 하나 더 띄웠고, 자식은 자기의 static 변수 count를 100으로 바꾸고 끝났어요. 부모 JVM의 같은 이름 변수 count(처음 0)는 무엇일까요?
    choices:
      - "0"
      - "100"
      - 실행할 때마다 다르다
      - 자식이 끝나면 100으로 맞춰진다
    answer: "1"
    explanation: |-
      **0이에요.** 프로세스끼리는 메모리를 공유하지 않아서, 같은 클래스의 같은 변수라도 서로 다른 칸이에요.

      - 자식은 자기 메모리의 count만 바꿨어요
      - 프로세스끼리 값을 주고받으려면 파일, 소켓 같은 통로(IPC)를 따로 써요
    source: https://docs.oracle.com/javase/tutorial/essential/concurrency/procthread.html
  - key: pt-process-crash
    concept: core
    coreQuestion: q1
    type: multiple_choice
    status: draft
    difficulty: 2
    body: 서버 프로세스 하나에서 요청 스레드 여러 개가 일하는 중에, 한 요청 때문에 프로세스가 죽었어요. 같은 프로세스의 다른 요청 스레드들은 어떻게 될까요?
    choices:
      - 다른 스레드는 영향 없이 계속 일한다
      - 모두 함께 끝난다
      - 죽은 스레드의 일을 나눠 맡는다
      - 운영체제가 새 프로세스로 옮겨 이어서 실행한다
    answer: "2"
    explanation: |-
      **모두 함께 끝나요.** 스레드는 프로세스 안의 실행 흐름이라, 프로세스가 끝나면 그 안의 스레드도 모두 끝나요.

      - 프로세스끼리는 서로 격리되어 한쪽이 죽어도 다른 쪽은 살아요. 브라우저가 탭마다 프로세스를 두는 이유예요
    source: https://docs.oracle.com/javase/tutorial/essential/concurrency/procthread.html
  # ── 질문 2 ──
  - key: pt-local-per-thread
    concept: core
    coreQuestion: q2
    type: code_predict
    status: draft
    difficulty: 1
    body: 두 스레드가 아래 메서드를 동시에 실행해요. 각 스레드가 돌려받는 값은 무엇일까요?
    code: |-
      static int countLocal() {
        int n = 0;
        for (int i = 0; i < 10_000; i++)
          n++;
        return n;
      }
    choices:
      - 둘 다 10000
      - 두 값의 합이 10000
      - 10000보다 작을 수 있다
      - 한 스레드만 10000
    answer: "1"
    explanation: |-
      **둘 다 10000이에요.** 지역 변수 n은 스레드마다 자기 스택 프레임에 따로 있어서 서로 건드리지 않아요.

      - 같은 메서드를 동시에 실행해도 지역 변수는 섞이지 않아요
    source: https://docs.oracle.com/javase/specs/jls/se21/html/jls-17.html
  - key: pt-shared-object
    concept: core
    coreQuestion: q2
    type: ox
    status: draft
    difficulty: 2
    body: "\"두 요청 스레드가 각자 지역 변수 list를 가지고 있고, 둘 다 같은 싱글톤 빈의 getItems()가 돌려준 리스트를 받았다. 변수가 지역 변수이니 이 리스트는 스레드마다 따로다\""
    answer: X
    explanation: |-
      **틀렸어요.** 변수는 스레드마다 따로지만, 두 변수가 가리키는 리스트 객체는 힙에 있는 같은 것이에요.

      - 지역 변수가 가리키는 객체가 같다면 그 객체는 함께 쓰는 거예요
      - 한 스레드가 리스트를 고치면 다른 스레드도 그 변화를 봐요
    source: https://docs.oracle.com/javase/specs/jls/se21/html/jls-17.html
  # ── 질문 3 ──
  - key: pt-run-vs-start
    concept: core
    coreQuestion: q3
    type: code_predict
    status: draft
    difficulty: 1
    body: main 스레드에서 아래 두 줄을 차례로 실행해요. 두 줄이 찍는 스레드 이름은 각각 무엇일까요?
    code: |-
      Runnable job = () -> System.out.println(
          Thread.currentThread().getName());

      new Thread(job, "worker").run();
      new Thread(job, "worker").start();
    choices:
      - worker, worker
      - main, worker
      - main, main
      - worker, main
    answer: "2"
    explanation: |-
      **main, worker예요.** run()은 새 스레드를 만들지 않고 부른 스레드에서 그냥 메서드로 실행돼요.

      - 새 스레드에서 실행하려면 start()를 불러요
    source: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/lang/Thread.html
  - key: pt-no-join
    concept: core
    coreQuestion: q3
    type: multiple_choice
    status: draft
    difficulty: 2
    body: 스레드 A와 B를 차례로 start()하고, join() 없이 바로 결과 리스트의 크기를 출력했어요. A와 B는 각각 리스트에 값 하나를 넣어요(리스트는 여러 스레드가 써도 안전한 것). 출력으로 맞는 것은?
    choices:
      - 항상 2
      - 항상 0
      - 0, 1, 2 가운데 무엇이든 나올 수 있다
      - A가 먼저 시작했으니 1 또는 2
    answer: "3"
    explanation: |-
      **0, 1, 2 가운데 무엇이든 나올 수 있어요.** join()으로 기다리지 않았고, 스레드가 언제 실행될지는 운영체제의 스케줄러가 정해요.

      - 먼저 start()했다고 먼저 실행된다는 보장도 없어요
      - 끝난 뒤의 결과를 보려면 join()으로 기다려요
    source: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/lang/Thread.html
  # ── 질문 4 ──
  - key: pt-lost-update-values
    concept: core
    coreQuestion: q4
    type: multiple_choice
    status: draft
    difficulty: 1
    body: count가 5일 때 두 스레드가 거의 동시에 count++를 한 번씩 했어요. 동기화는 하지 않았어요. 끝난 뒤 count로 나올 수 있는 값을 모두 고르면?
    choices:
      - 7만
      - 6 또는 7
      - 5, 6, 7 가운데 아무것
      - 6만
    answer: "2"
    explanation: |-
      **6 또는 7이에요.** count++는 읽기, 더하기, 쓰기 세 단계예요.

      - 겹치지 않으면 7이에요
      - 둘이 같은 5를 읽고 각자 6을 쓰면 6이에요. 한쪽의 갱신이 사라졌어요(갱신 손실)
    source: https://docs.oracle.com/javase/specs/jls/se21/html/jls-17.html
  - key: pt-likes
    concept: core
    coreQuestion: q4
    type: multiple_choice
    status: draft
    difficulty: 2
    body: 좋아요 수를 likes = likes + 1로 올리는 코드를 스레드 10개가 100번씩 실행했어요. 동기화는 하지 않았어요. 결과로 맞는 설명은?
    choices:
      - 항상 1000
      - 1000 이하이고, 1000이 나올 수도 있지만 보장되지 않는다
      - 항상 1000보다 작다
      - 1000보다 클 수 있다
    answer: "2"
    explanation: |-
      **1000 이하이고 보장되지 않아요.** 두 스레드가 같은 값을 읽고 각자 1을 더해 쓰면 하나가 사라져요.

      - 겹치지 않으면 1000이 나올 수도 있어서, 몇 번 돌려 보고 맞았다고 안심할 수 없어요
      - 한 번 더한 것이 두 번 셀 일은 없어서 1000을 넘지는 않아요
    source: https://docs.oracle.com/javase/specs/jls/se21/html/jls-17.html
  - key: pt-service-field
    concept: core
    coreQuestion: q4
    type: code_predict
    status: draft
    difficulty: 2
    body: 스프링의 싱글톤 빈인 아래 서비스의 visit()을 요청 스레드 여럿이 동시에 1만 번 불렀어요. 끝난 뒤 count는?
    code: |-
      @Service
      class VisitService {
        private int count = 0;

        int visit() {
          return ++count;
        }
      }
    choices:
      - 정확히 10000
      - 10000 이하. 갱신이 사라질 수 있다
      - 요청 스레드마다 따로 세서 스레드 수만큼 나뉜다
      - 컴파일 오류
    answer: "2"
    explanation: |-
      **10000 이하예요.** 싱글톤 빈은 힙에 하나 있어서 빈의 필드는 모든 요청 스레드가 함께 쓰는 변수예요.

      - 요청마다 다른 값은 지역 변수나 매개변수로 넘겨요
      - 함께 세야 하면 AtomicLong이나 DB를 써요
      - 검증: ProcessAndThreadTest.serviceFieldIsShared (스레드 8개 × 10만 번에서 80만보다 작은 값)
    source: https://docs.oracle.com/javase/specs/jls/se21/html/jls-17.html
  # ── 네 질문을 하나로 ──
  - key: pt-interview
    concept: core
    coreQuestion: all
    type: descriptive
    status: draft
    difficulty: 2
    body: 면접에서 "프로세스와 스레드의 차이를 설명해 주세요"라는 질문을 받았어요. 1분 안에 답해 보세요.
    explanation: |-
      **프로세스는 메모리를 따로 받은 실행 중인 프로그램이고, 스레드는 그 안에서 메모리를 함께 쓰는 실행 흐름이에요.**

      - **정의:** 프로세스는 운영체제가 메모리와 PID를 따로 준다. 스레드는 프로세스 안의 실행 흐름이다
      - **공유:** 스레드끼리 힙과 static 필드를 함께 쓰고, 스택(지역 변수)과 실행 위치는 따로 가진다
      - **차이:** 프로세스는 무겁지만 격리되고 IPC로 주고받는다. 스레드는 가볍고 데이터를 바로 나누지만 프로세스가 죽으면 함께 끝난다
      - **주의:** 같은 값을 동시에 고치면 count++처럼 갱신이 사라지는 경쟁 상태가 생긴다
    checklist:
      - 프로세스와 스레드를 각각 정의했다
      - 스레드가 함께 쓰는 것(힙, static)과 따로 가지는 것(스택)을 말했다
      - 만드는 비용이나 한쪽이 죽을 때의 차이를 말했다
      - 함께 쓰는 값을 동시에 고칠 때의 문제(경쟁 상태)를 말했다
      - 스프링의 요청 스레드나 싱글톤 빈 같은 실무의 예를 들었다
    source: https://docs.oracle.com/javase/tutorial/essential/concurrency/procthread.html
