# 선착순 이벤트 설계 문제
# 형식: https://github.com/wanja727/retrievo/blob/main/docs/content-format.md
#
# 모든 문제는 coreQuestions의 질문 하나에 묶이고(coreQuestion), 답의 근거가 레슨 본문에 있다
# (site/src/content/lesson-pages/first-come-event.yaml의 says).
# 동작에 관한 정답은 verification의 FirstComeEventTest로 확인했다 (Redis 7).
# 질문마다 첫 문제는 본문의 예시로 묻고, 둘째 문제는 다른 상황으로 옮겨 묻는다.
# 쓴 날 검수까지 마쳐 reviewed로 올린다 (2026-11-25)
subject:
  key: dev
  name: 개발자 면접
lesson:
  key: first-come-event
  title: 선착순 이벤트 설계
  unit: 시스템 설계와 아키텍처
  order: 914
concepts:
  - key: core
    name: 선착순 이벤트 설계
coreQuestions:
  - key: q1
    text: "몰리는 요청을 왜 DB에서 바로 판정하지 않나요?"
  - key: q2
    text: "수량과 중복 참여는 어떻게 함께 판정하나요?"
  - key: q3
    text: "당첨자는 어떻게 DB에 저장하나요?"
  - key: q4
    text: "Redis까지 오기 전에 무엇을 막아 두나요?"
questions:
  # ── 질문 1 ──
  - key: fc-db-rows
    concept: core
    coreQuestion: q1
    type: multiple_choice
    status: reviewed
    difficulty: 1
    body: 쿠폰 100장 이벤트에 요청 600건이 왔고, 당첨 판정은 Redis에서 해요. DB에 저장해야 하는 것은 몇 건인가요?
    choices:
      - 600건
      - 500건
      - 100건. 당첨자만
      - 0건
    answer: "3"
    explanation: |-
      **100건이에요.** 떨어진 요청은 Redis에서 끝나고 DB는 당첨자만 받아요.

      - 테스트에서도 당첨 100, 품절 434, 중복 거절 66이었어요
    source: https://redis.io/docs/latest/develop/interact/programmability/eval-intro/
  - key: fc-db-lock
    concept: core
    coreQuestion: q1
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: 선착순 이벤트를 이벤트 행의 SELECT ... FOR UPDATE로 판정했어요. 오픈 순간 요청 1만 건이 같은 행을 기다리면 어떻게 되나요?
    choices:
      - 락 덕분에 빠르게 처리된다
      - DB가 요청을 알아서 나눠 처리한다
      - 아무 일도 없다
      - 요청들이 락을 기다리며 커넥션을 쥐어 풀이 바닥나고 다른 기능까지 멈춘다
    answer: "4"
    explanation: |-
      **커넥션 풀이 바닥나요.** 모두 한 행의 락 앞에 줄을 서는 동안 커넥션을 쥐어요.

      - 판정을 Redis로 옮기고 DB는 당첨자만 받게 해요
    source: https://redis.io/docs/latest/develop/interact/programmability/eval-intro/
  # ── 질문 2 ──
  - key: fc-double-click
    concept: core
    coreQuestion: q2
    type: code_predict
    status: reviewed
    difficulty: 1
    body: 같은 사용자가 버튼을 두 번 눌러, 두 요청이 동시에 아래 코드의 SISMEMBER를 지났어요. 이 사용자는 대기열에 몇 번 들어가나요? (수량은 충분해요)
    code: |-
      if (redis.sismember(users, uid)) {
        return ALREADY;
      }
      long left = redis.decr(stockKey);
      if (left < 0) return SOLD_OUT;
      redis.sadd(users, uid);
      redis.rpush(queue, uid);
    choices:
      - 1번
      - 2번
      - 0번
      - Redis가 오류를 낸다
    answer: "2"
    explanation: |-
      **2번이에요.** 두 요청 모두 확인할 때는 참여 기록이 없었어요.

      - 테스트에서 따로 하는 코드는 대기열에 2번, Lua는 1번이었어요
      - 확인, 차감, 기록을 Lua 하나로 묶어요
    source: https://redis.io/docs/latest/develop/interact/programmability/eval-intro/
  - key: fc-half-lua
    concept: core
    coreQuestion: q2
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: 수량 차감과 참여 기록은 Lua 스크립트로 하지만, 참여 여부 확인은 그 전에 SISMEMBER로 따로 해요. 두 번 누른 사용자는 어떻게 될 수 있나요?
    choices:
      - 두 번 당첨될 수 있다. 확인과 기록 사이에 틈이 있다
      - 한 번만 당첨된다. 기록이 Lua 안에 있다
      - 두 요청 모두 거절된다
      - 수량이 음수가 된다
    answer: "1"
    explanation: |-
      **두 번 당첨될 수 있어요.** 확인이 스크립트 밖에 있으면 두 요청이 동시에 확인을 지나요.

      - 확인까지 같은 스크립트에 넣어야 틈이 없어요
    source: https://redis.io/docs/latest/develop/interact/programmability/eval-intro/
  # ── 질문 3 ──
  - key: fc-worker-batches
    concept: core
    coreQuestion: q3
    type: multiple_choice
    status: reviewed
    difficulty: 1
    body: 대기열의 당첨자 100명을 워커가 0.2초마다 20명씩 꺼내 DB에 저장해요. 모두 저장하려면 몇 번 꺼내나요?
    choices:
      - 1번
      - 20번
      - 100번
      - 5번
    answer: "4"
    explanation: |-
      **5번이에요.** 100명을 20명씩 꺼내요.

      - DB는 몰린 순간과 상관없이 자기 속도로 받아요
    source: https://redis.io/docs/latest/develop/data-types/lists/
  - key: fc-db-unique
    concept: core
    coreQuestion: q3
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: 버그로 같은 사용자가 대기열에 두 번 들어갔어요. 워커가 두 번째를 저장할 때 막아 줄 수 있는 것은?
    choices:
      - Redis의 만료 시간
      - 워커의 재시도
      - DB의 (이벤트, 회원) 유니크 제약
      - 대기열의 순서
    answer: "3"
    explanation: |-
      **DB의 유니크 제약이에요.** 판정을 Redis에서 해도 마지막 방어선은 DB에 둬요.

      - 두 번째 INSERT는 유니크 위반으로 거절돼요
    source: https://redis.io/docs/latest/develop/data-types/lists/
  # ── 질문 4 ──
  - key: fc-soldout-flag
    concept: core
    coreQuestion: q4
    type: multiple_choice
    status: reviewed
    difficulty: 1
    body: 이미 품절이 확인된 뒤에도 요청마다 Redis에 판정 스크립트를 보내고 있어요. Redis의 부하를 줄이는 방법은?
    choices:
      - 서버 메모리에 품절 표시를 두고 이후 요청은 Redis까지 보내지 않는다
      - 스크립트를 두 번 보낸다
      - 품절 뒤에는 DB에서 판정한다
      - 대기열을 비운다
    answer: "1"
    explanation: |-
      **품절 표시를 서버 메모리에 둬요.** 품절은 되돌아오지 않는 상태라 서버가 기억하면 돼요.

      - 앞에서 걸러 낼수록 판정이 빨라요
    source: https://redis.io/docs/latest/develop/interact/programmability/eval-intro/
  - key: fc-macro
    concept: core
    coreQuestion: q4
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: 매크로를 쓰는 사용자가 오픈 순간 1초에 수백 번씩 참여 요청을 보내요. 판정 Redis에 닿기 전에 막는 장치로 알맞은 것은?
    choices:
      - Lua 스크립트를 길게 만든다
      - 사용자별 요청 수 제한
      - DB 유니크 제약
      - 워커를 늘린다
    answer: "2"
    explanation: |-
      **사용자별 요청 수 제한이에요.** 정상 사용자의 두세 번은 통과하고 과한 요청은 429로 막아요.

      - 통과한 중복은 Lua가 이미 참여로 걸러요
    source: https://redis.io/docs/latest/develop/interact/programmability/eval-intro/
  # ── 네 질문을 하나로 ──
  - key: fc-interview
    concept: core
    coreQuestion: all
    type: descriptive
    status: reviewed
    difficulty: 2
    body: 면접에서 "선착순 쿠폰 이벤트를 설계해 보세요"라는 질문을 받았어요. 1분 안에 답해 보세요.
    explanation: |-
      **판정은 Redis Lua로, 저장은 대기열과 워커로, 앞에서는 요청을 걸러요.**

      - **왜 DB 밖에서:** 한 행에 몰려 커넥션이 바닥난다
      - **판정:** 참여 확인, 수량 차감, 기록, 대기열을 Lua 하나로
      - **저장:** 워커가 대기열에서 정해진 속도로 꺼낸다. DB 유니크 제약
      - **앞단:** 요청 수 제한, 오픈 전 거절, 품절 표시
    checklist:
      - DB에서 바로 판정하면 안 되는 이유를 말했다
      - 수량과 중복 참여를 한 번에 판정한다고 말했다
      - 대기열과 워커로 DB 저장 속도를 조절한다고 말했다
      - DB 유니크 제약을 마지막 방어선으로 둔다고 말했다
      - 앞에서 거르는 장치를 하나 이상 말했다
    source: https://redis.io/docs/latest/develop/interact/programmability/eval-intro/
