questions:
  # ── 질문 1. 트랜잭션은 무엇이고 왜 필요한가요? ──
  - key: txb-autocommit-result
    concept: core
    coreQuestion: q1
    type: code_predict
    status: reviewed
    difficulty: 1
    body: park의 잔액은 30, choi의 잔액은 10이에요. 잔액은 0보다 작아질 수 없어요. 트랜잭션을 시작하지 않고(자동 커밋) 아래 두 문장을 차례로 보냈어요. 둘째 문장은 잔액이 모자라 실패했어요. 두 사람의 잔액은 얼마일까요?
    code: |-
      update account
      set balance = balance + 50
      where owner = 'choi';

      update account
      set balance = balance - 50
      where owner = 'park';
    choices:
      - park 30, choi 10
      - park 30, choi 60
      - park -20, choi 60
      - park 0, choi 60
    answer: "2"
    explanation: |-
      **park 30, choi 60이에요.** 첫 문장만 반영되고 둘째 문장은 반영되지 않았어요.

      - 자동 커밋이라 첫 문장의 +50은 끝나자마자 확정됐어요
      - 둘째 문장은 실패해서 park의 잔액은 30 그대로예요. 실패한 문장은 아무것도 바꾸지 않아요
      - 합계가 40에서 90이 됐어요. 없던 돈 50이 생긴 거예요
    source: https://www.postgresql.org/docs/16/tutorial-transactions.html
  - key: q-5d541492
    concept: core
    coreQuestion: q1
    type: multiple_choice
    status: reviewed
    difficulty: 1
    body: "쇼핑몰에서 주문을 받으면 SQL 두 문장을 보내요. 주문 표에 주문 한 줄을 INSERT하고, 재고 표에서 그 상품의 재고를 1 줄이는 UPDATE예요. 재고는 0보다 작아질 수 없어요. 트랜잭션을 시작하지 않고(자동 커밋) 두 문장을 차례로 보냈는데, 재고가 0이라서 둘째 문장이 실패했어요. 어떻게 될까요?"
    choices:
      - "주문도 함께 취소되고 재고는 0 그대로다"
      - "주문은 남고 재고는 0 그대로다"
      - "주문은 남고 재고는 -1이 된다"
      - "두 문장 모두 반영된다"
    answer: "2"
    explanation: |-
      **주문은 남고 재고는 0 그대로예요.** 재고가 없는 상품의 주문이 생겼어요.

      - 자동 커밋에서는 문장 하나가 끝날 때마다 바로 확정돼요. INSERT는 둘째 문장을 보내기 전에 이미 확정됐어요
      - 둘째 문장은 실패해서 반영되지 않았어요
      - 두 문장을 한 트랜잭션으로 묶었다면 주문도 함께 취소됐을 거예요
    source: https://www.postgresql.org/docs/16/tutorial-transactions.html
  # ── 질문 2. 커밋과 롤백은 무엇을 하나요? ──
  - key: txb-rollback-result
    concept: core
    coreQuestion: q2
    type: code_predict
    status: reviewed
    difficulty: 1
    body: kim의 잔액은 50, lee의 잔액은 0이에요. 잔액은 0보다 작아질 수 없어요. 아래 문장을 차례로 보냈는데 둘째 UPDATE가 잔액이 모자라 실패했고, 그래서 마지막에 ROLLBACK을 보냈어요. 두 사람의 잔액은 얼마일까요?
    code: |-
      begin;

      update account
      set balance = balance + 100
      where owner = 'lee';

      update account
      set balance = balance - 100
      where owner = 'kim';

      rollback;
    choices:
      - kim 50, lee 0
      - kim 50, lee 100
      - kim -50, lee 100
      - kim 0, lee 100
    answer: "1"
    explanation: |-
      **kim 50, lee 0이에요.** 처음 그대로예요.

      - BEGIN 뒤의 변경은 커밋하기 전까지 확정이 아니에요
      - ROLLBACK은 트랜잭션 안의 변경을 모두 취소해요. 이미 성공한 첫 UPDATE의 +100도 함께 취소돼요
    source: https://www.postgresql.org/docs/16/tutorial-transactions.html
  - key: txb-rollback-scope
    concept: core
    coreQuestion: q2
    type: ox
    status: reviewed
    difficulty: 1
    body: 한 트랜잭션 안에서 INSERT, UPDATE, DELETE를 한 번씩 실행한 뒤 ROLLBACK하면, UPDATE만 되돌아가고 INSERT와 DELETE는 남는다.
    answer: X
    explanation: |-
      **X. 세 가지 모두 되돌아가요.**

      - 롤백은 트랜잭션 안에서 한 변경을 종류와 상관없이 모두 취소해요
      - 넣은 행은 사라지고, 지운 행은 돌아오고, 바꾼 값은 원래 값이 돼요
    source: https://www.postgresql.org/docs/16/tutorial-transactions.html
  - key: q-2b51ba33
    concept: core
    coreQuestion: q2
    type: descriptive
    status: reviewed
    difficulty: 2
    body: DB 툴에서 운영 데이터를 고치다가 조건을 잘못 쓴 UPDATE가 바로 반영돼 버렸어요. 왜 바로 반영됐는지, 앞으로는 어떤 순서로 작업해야 하는지 설명해 보세요.
    explanation: |-
      **자동 커밋 상태라서 실행한 UPDATE가 바로 확정됐어요. 앞으로는 트랜잭션을 시작하고, 결과를 확인한 뒤에 커밋해요.**

      - 트랜잭션을 시작하지 않으면 문장 하나가 끝날 때마다 바로 확정돼요
      - BEGIN으로 트랜잭션을 시작하고 UPDATE를 실행해요
      - 바뀐 결과를 확인하고, 맞으면 COMMIT으로 확정해요
      - 잘못됐으면 ROLLBACK으로 모두 취소해요
    checklist:
      - 자동 커밋이라 바로 확정됐다고 말했다
      - BEGIN으로 트랜잭션을 시작한다고 말했다
      - 결과를 확인한 뒤에 COMMIT한다고 말했다
      - 잘못됐으면 ROLLBACK으로 되돌린다고 말했다
    source: https://www.postgresql.org/docs/16/tutorial-transactions.html
  # ── 질문 3. 커밋하기 전의 변경은 다른 연결에 보이나요? ──
  - key: q-da4e5ee5
    concept: core
    coreQuestion: q3
    type: code_predict
    status: reviewed
    difficulty: 1
    body: PostgreSQL 기본 설정이에요. kim의 잔액은 50이에요. 연결 A가 BEGIN 뒤에 kim의 잔액을 999로 바꾸고 아직 커밋하지 않았어요. 이때 연결 B가 kim의 잔액을 읽으면 어떻게 될까요?
    choices:
      - 999를 읽는다
      - 50을 읽는다
      - A가 커밋할 때까지 기다린다
      - 오류가 난다
    answer: "2"
    explanation: |-
      **50을 읽어요.** 커밋 전의 변경은 바꾼 연결에만 보여요.

      - 연결 B는 기다리지 않고 확정된 값 50을 바로 읽어요
      - A가 커밋하면 그때부터 B도 999를 읽어요
    source: https://www.postgresql.org/docs/16/tutorial-transactions.html
  - key: txb-visible-after-commit
    concept: core
    coreQuestion: q3
    type: multiple_choice
    status: reviewed
    difficulty: 1
    body: "PostgreSQL 기본 설정이에요. 영화관의 좌석 표에서 7번 좌석의 상태는 \"빈자리\"예요. 연결 A가 BEGIN 뒤에 7번 좌석의 상태를 \"예약됨\"으로 바꿨어요. 연결 B가 7번 좌석의 상태를 A가 커밋하기 전에 한 번, 커밋한 뒤에 한 번 읽었어요. B가 읽은 값은 차례로 무엇일까요?"
    choices:
      - "빈자리, 빈자리"
      - "빈자리, 예약됨"
      - "예약됨, 예약됨"
      - "예약됨, 빈자리"
    answer: "2"
    explanation: |-
      **빈자리, 예약됨이에요.** 커밋한 순간부터 다른 연결에 보여요.

      - 커밋 전의 변경은 바꾼 연결 A에만 보여요. B는 확정된 값인 빈자리를 읽어요
      - A가 커밋하면 그 뒤로는 B도 예약됨을 읽어요
      - 잔액이든 좌석의 상태든 같아요
    source: https://www.postgresql.org/docs/16/tutorial-transactions.html
  # ── 질문 4. 자바와 스프링 코드에서는 어떻게 쓰나요? ──
  - key: q-3bbb5c20
    concept: core
    coreQuestion: q4
    type: line_pick
    status: reviewed
    difficulty: 2
    body: kim(잔액 50)이 lee에게 100을 보냈더니 예외가 났는데, lee의 잔액만 100 늘어나 있었어요. deposit과 withdraw는 각각 UPDATE 한 문장을 보내요. 두 문장을 한 트랜잭션으로 묶으려면 어느 줄 위에 @Transactional을 붙여야 할까요?
    code: |-
      void transfer(long from, long to, int n) {
          deposit(to, n);
          withdraw(from, n);
      }
    answer: "1"
    explanation: |-
      **1번 줄, transfer 메서드에 붙여요.**

      - `@Transactional`은 붙인 메서드 전체를 한 트랜잭션으로 묶어요. 메서드가 시작할 때 트랜잭션을 열고, 예외가 나면 롤백해요
      - 지금은 붙어 있지 않아서 두 UPDATE가 각각 자동 커밋돼요. 그래서 withdraw가 실패해도 deposit의 +100이 남았어요
    source: https://docs.spring.io/spring-framework/reference/data-access/transaction/declarative/annotations.html
  - key: q-d4bf1495
    concept: core
    coreQuestion: q4
    type: multiple_choice
    status: reviewed
    difficulty: 1
    body: "회원 가입을 처리하는 스프링의 @Transactional 메서드가 회원을 DB에 INSERT하고, 환영 문자를 보낸 다음, 런타임 예외를 던졌어요. 어떻게 될까요?"
    choices:
      - "회원 저장과 문자가 모두 취소된다"
      - "회원 저장은 롤백되지만 문자는 이미 나갔다"
      - "회원 저장은 남고 문자만 취소된다"
      - "예외가 나도 회원 저장과 문자가 모두 남는다"
    answer: "2"
    explanation: |-
      **회원 저장은 롤백되지만 문자는 이미 나갔어요.**

      - @Transactional 메서드에서 런타임 예외가 나면 스프링이 롤백해요. 회원 INSERT는 취소돼요
      - 롤백은 DB의 변경만 되돌려요. 이미 보낸 문자는 취소되지 않아요
      - 그래서 문자나 메일을 보내는 일은 커밋한 뒤에 해요
    source: https://www.postgresql.org/docs/16/tutorial-transactions.html
  # ── 질문 5. ACID는 무엇인가요? ──
  - key: txb-acid-atomicity
    concept: core
    coreQuestion: q5
    type: multiple_choice
    status: reviewed
    difficulty: 1
    body: 이체 트랜잭션에서 출금이 실패하자, 이미 한 입금까지 함께 취소됐어요. ACID 가운데 어느 성질인가요?
    choices:
      - 원자성
      - 일관성
      - 격리성
      - 지속성
    answer: "1"
    explanation: |-
      **원자성이에요.** 트랜잭션의 변경이 전부 반영되거나 하나도 반영되지 않는 성질이에요.

      - 격리성은 동시에 도는 트랜잭션이 서로의 중간 상태를 보지 않는 성질이에요
      - 지속성은 커밋된 변경이 장애 뒤에도 남는 성질이에요
    source: https://www.postgresql.org/docs/16/tutorial-transactions.html
  - key: txb-acid-isolation
    concept: core
    coreQuestion: q5
    type: multiple_choice
    status: reviewed
    difficulty: 1
    body: "쇼핑몰의 주문 트랜잭션이 주문을 저장하고 재고를 줄이는 중이에요. 그동안 다른 연결은 \"주문은 저장됐는데 재고는 아직 줄지 않은\" 상태를 읽지 못했어요. ACID 가운데 어느 성질인가요?"
    choices:
      - "원자성"
      - "일관성"
      - "격리성"
      - "지속성"
    answer: "3"
    explanation: |-
      **격리성이에요.** 동시에 실행되는 트랜잭션이 서로의 중간 상태를 보지 않는 성질이에요.

      - 주문 트랜잭션이 커밋하기 전의 변경은 다른 연결에 보이지 않아요
      - 원자성은 트랜잭션의 변경이 전부 반영되거나 하나도 반영되지 않는 성질이라 다른 이야기예요
    source: https://www.postgresql.org/docs/16/tutorial-transactions.html
  # ── 다섯 질문을 하나로 ──
  - key: q-d579776f
    concept: core
    coreQuestion: all
    type: descriptive
    status: reviewed
    difficulty: 1
    body: 트랜잭션이 무엇이고 왜 필요한지 계좌 이체를 예로 들어 1분 안에 설명해 보세요.
    explanation: |-
      **여러 SQL을 하나로 묶어, 전부 반영(커밋)하거나 전부 취소(롤백)하는 작업 단위예요.**

      - 이체는 입금과 출금 두 문장이에요. 묶지 않으면 자동 커밋이라, 둘째 문장이 실패할 때 첫째 문장만 남아 돈이 생기거나 사라져요
      - 트랜잭션의 변경은 커밋 전까지 확정이 아니고, 다른 연결에 보이지 않아요
      - 실패하면 롤백으로 시작 전 상태로 돌아가요
      - 롤백은 DB 변경만 되돌리고, 트랜잭션은 필요한 SQL만 넣어 짧게 둬요
    checklist:
      - 전부 반영되거나 전부 취소된다고 말했다
      - 커밋과 롤백을 말했다
      - 자동 커밋의 위험을 이체로 설명했다
      - 커밋 전의 변경은 다른 연결에 보이지 않는다고 말했다
      - 트랜잭션을 짧게 두는 이유나 롤백이 되돌리지 못하는 것을 말했다
    source: https://www.postgresql.org/docs/16/tutorial-transactions.html
