# 조인 문제
# 형식: https://github.com/wanja727/retrievo/blob/main/docs/content-format.md
#
# 모든 문제는 coreQuestions의 질문 하나에 묶이고(coreQuestion), 답의 근거가 레슨 본문에 있다
# (site/src/content/lesson-pages/sql-join.yaml의 says).
# 동작에 관한 정답은 verification의 SqlJoinTest로 확인했다 (PostgreSQL 16).
# 질문마다 첫 문제는 본문의 예시로 묻고, 둘째 문제는 다른 상황으로 옮겨 묻는다.
subject:
  key: dev
  name: 개발자 면접
lesson:
  key: sql-join
  title: 조인
  unit: DB
  order: 602
concepts:
  - key: core
    name: 조인
coreQuestions:
  - key: q1
    text: "INNER JOIN은 어떤 행을 돌려주나요?"
  - key: q2
    text: "짝이 없는 행까지 보려면 어떻게 하나요?"
  - key: q3
    text: "조인하면 왜 행이 늘어나고, 합계가 부풀까요?"
  - key: q4
    text: "앱에서 짝짓지 않고 왜 DB에서 조인하나요?"
questions:
  # ── 질문 1 ──
  - key: join-inner-choi
    concept: core
    coreQuestion: q1
    type: ox
    status: draft
    difficulty: 1
    body: "회원 kim, lee, park, choi와 주문 테이블을 `member m join orders o on o.member_id = m.id`로 조인했어요. choi는 주문이 하나도 없어요. 결과에 choi가 한 행으로 나온다."
    answer: X
    explanation: |-
      **X. choi는 나오지 않아요.** INNER JOIN은 짝이 맞는 행만 돌려줘요.

      - choi와 짝이 되는 주문이 없어서 결과에서 빠져요
      - 오류나 경고 없이 조용히 빠져요
      - 남기려면 LEFT JOIN을 써요
    source: https://www.postgresql.org/docs/16/queries-table-expressions.html#QUERIES-JOIN
  - key: join-inner-reviews
    concept: core
    coreQuestion: q1
    type: multiple_choice
    status: draft
    difficulty: 1
    body: "상품 10개와 리뷰 15개가 있어요. 리뷰는 모두 상품을 가리키고, 리뷰가 하나라도 있는 상품은 6개예요. `product p join review r on r.product_id = p.id`의 결과는 몇 행인가요?"
    choices:
      - "6행"
      - "10행"
      - "15행"
      - "25행"
    answer: "3"
    explanation: |-
      **15행이에요.** 리뷰 하나마다 짝이 되는 상품이 하나씩 있어요.

      - 결과의 행 수는 짝의 수예요
      - 리뷰가 없는 상품 4개는 INNER JOIN에서 빠져요
    source: https://www.postgresql.org/docs/16/queries-table-expressions.html#QUERIES-JOIN
  # ── 질문 2 ──
  - key: join-left-where
    concept: core
    coreQuestion: q2
    type: multiple_choice
    status: draft
    difficulty: 2
    body: "회원 4명 가운데 choi만 주문이 없어요. 아래 쿼리의 결과에 choi가 나오나요?"
    code: |-
      select m.name, o.id
        from member m
        left join orders o
          on o.member_id = m.id
       where o.status = 'PAID';
    choices:
      - 나온다. LEFT JOIN이라 회원은 모두 남는다
      - 나오지 않는다. choi 행의 o.status가 NULL이라 WHERE에서 걸러진다
      - 오류가 난다. LEFT JOIN에는 WHERE를 쓸 수 없다
    answer: "2"
    explanation: |-
      **나오지 않아요.** LEFT JOIN이 choi를 NULL 행으로 남겨도, WHERE가 그 행을 걸러요.

      - `NULL = 'PAID'`는 참이 아니에요
      - 결과가 INNER JOIN과 같아져요
      - 조건을 ON으로 옮기면 choi가 NULL 행으로 남아요
    source: https://www.postgresql.org/docs/16/queries-table-expressions.html#QUERIES-JOIN
  - key: join-left-today
    concept: core
    coreQuestion: q2
    type: multiple_choice
    status: draft
    difficulty: 2
    body: "모든 상품과 오늘 달린 리뷰 수를 보이고 싶어요. 오늘 리뷰가 없는 상품도 0으로 나와야 해요. 날짜 조건 `r.created_at >= current_date`를 어디에 두어야 하나요?"
    code: |-
      select p.name, count(r.id)
        from product p
        left join review r
          on r.product_id = p.id
        -- 날짜 조건은 어디에?
       group by p.name;
    choices:
      - WHERE에 둔다
      - ON에 and로 붙인다
      - HAVING에 둔다
      - 어디에 두어도 결과가 같다
    answer: "2"
    explanation: |-
      **ON에 붙여요.** 오른쪽 테이블에 거는 조건은 "어떤 리뷰와 짝지을까"라서 ON에 둬요.

      - WHERE에 두면 리뷰가 없는 상품의 행(리뷰 칸이 NULL)이 걸러져 사라져요
      - ON에 두면 짝이 없는 상품도 남고 `count(r.id)`가 0이 돼요
    source: https://www.postgresql.org/docs/16/queries-table-expressions.html#QUERIES-JOIN
  # ── 질문 3 ──
  - key: join-double-sum
    concept: core
    coreQuestion: q3
    type: multiple_choice
    status: draft
    difficulty: 2
    body: "주문 1에 항목이 3개, 결제가 2건(6000원, 4000원) 있어요. 아래 쿼리의 합계는 얼마인가요?"
    code: |-
      select o.id, sum(p.amount)
        from orders o
        join order_item i
          on i.order_id = o.id
        join payment p
          on p.order_id = o.id
       group by o.id;
    choices:
      - "10000"
      - "20000"
      - "30000"
      - "60000"
    answer: "3"
    explanation: |-
      **30000이에요.** 항목 3개와 결제 2건을 함께 붙이면 3 × 2 = 6행이 되고, 결제 금액이 3번씩 더해져요.

      - 실제 결제 합계는 10000이에요
      - 결제를 주문별로 먼저 합친 뒤 붙이면 맞아요
    source: https://www.postgresql.org/docs/16/queries-table-expressions.html#QUERIES-JOIN
  - key: join-count-tags
    concept: core
    coreQuestion: q3
    type: multiple_choice
    status: draft
    difficulty: 2
    body: "게시글 하나에 태그 4개와 댓글 5개가 있어요. 글과 태그와 댓글을 한꺼번에 조인한 뒤 `count(*)`로 댓글 수를 세면 얼마가 나오나요?"
    choices:
      - "5"
      - "9"
      - "20"
      - "1"
    answer: "3"
    explanation: |-
      **20이에요.** 태그 4행 각각에 댓글 5행이 붙어 4 × 5 = 20행이 돼요.

      - 1:N 두 개를 함께 조인하면 곱만큼 늘어나요
      - 댓글 수는 댓글 테이블만 세거나, 먼저 센 결과를 붙여요
    source: https://www.postgresql.org/docs/16/queries-table-expressions.html#QUERIES-JOIN
  - key: join-stats-mistake
    concept: core
    coreQuestion: q3
    type: multiple_choice
    status: draft
    difficulty: 2
    body: "회원별 결제 합계를 잘 내던 통계 쿼리(`member join payment`)에, 화면에 쿠폰 사용 내역도 보이려고 `coupon_use`(회원 하나에 여러 행)를 조인으로 더했어요. 쿠폰을 2번 쓴 회원의 결제 합계는 어떻게 되나요?"
    choices:
      - 그대로다
      - 2배로 나온다
      - 쿠폰을 쓴 만큼 줄어든다
      - 쿠폰을 쓴 회원은 결과에서 빠진다
    answer: "2"
    explanation: |-
      **2배로 나와요.** 결제 행마다 쿠폰 사용 2행이 붙어 결제 금액이 두 번씩 더해져요.

      - 오류 없이 숫자만 커져서 알아채기 어려워요
      - 결제 합계를 먼저 묶은 뒤 붙이면 그대로예요
    source: https://www.postgresql.org/docs/16/queries-table-expressions.html#QUERIES-JOIN
  # ── 질문 4 ──
  - key: join-n-plus-one-count
    concept: core
    coreQuestion: q4
    type: multiple_choice
    status: draft
    difficulty: 1
    body: "주문 300건을 한 번에 읽은 뒤, 주문마다 `select name from member where id = ?`로 회원 이름을 읽어요. DB로 보낸 쿼리는 모두 몇 번인가요?"
    choices:
      - "1번"
      - "2번"
      - "300번"
      - "301번"
    answer: "4"
    explanation: |-
      **301번이에요.** 주문 목록 1번에 주문마다 1번씩이에요.

      - 쿼리마다 DB 왕복이 들어서 쌓이면 느려져요
      - 주문과 회원을 조인하면 1번이에요
    source: https://www.postgresql.org/docs/16/tutorial-join.html
  - key: join-n-plus-one-fix
    concept: core
    coreQuestion: q4
    type: multiple_choice
    status: draft
    difficulty: 1
    body: "게시글 50개와 글쓴이 이름을 보여 주는 화면이 쿼리를 51번 보내요. 같은 DB에 있는 게시글과 회원 테이블로 쿼리를 한 번으로 줄이려면 어떻게 하나요?"
    choices:
      - 글쓴이를 찾는 쿼리를 더 빠르게 만든다
      - 게시글과 회원을 조인해 한 번에 읽는다
      - 게시글을 25개씩 두 번 나눠 읽는다
      - 회원을 하나씩 읽되 캐시에 둔다
    answer: "2"
    explanation: |-
      **조인해서 한 번에 읽어요.** 글마다 회원을 따로 읽어서 1 + 50번이었어요.

      - 조인은 DB 안에서 짝지어 결과만 한 번에 보내요
      - 쿼리 하나를 빠르게 해도 왕복 51번은 그대로예요
    source: https://www.postgresql.org/docs/16/tutorial-join.html
  # ── 면접 질문 ──
  - key: join-interview
    concept: core
    coreQuestion: all
    type: descriptive
    status: draft
    difficulty: 2
    body: 면접에서 "INNER JOIN과 LEFT JOIN의 차이와, 조인할 때 조심할 점을 설명해 주세요"라는 질문을 받았어요. 1분 안에 답해 보세요.
    explanation: |-
      **INNER는 짝이 있는 행만, LEFT는 왼쪽 행을 모두 남기고, 조인은 행 수를 바꾸니 빠지는 행과 늘어나는 행을 조심해요.**

      - **INNER JOIN:** ON 조건으로 짝이 맞는 행만. 짝이 없는 행은 조용히 빠진다
      - **LEFT JOIN:** 왼쪽을 모두 남기고 짝이 없으면 NULL. 오른쪽 조건은 ON에
      - **늘어나는 행:** 1:N 조인은 반복되고, 1:N 둘을 함께 붙이면 SUM이 부푼다. 먼저 묶고 붙인다
      - **N+1:** 행마다 다시 조회하면 쿼리가 데이터 수만큼 는다. 조인으로 한 번에 읽는다
    checklist:
      - INNER JOIN은 짝이 있는 행만 돌려준다고 말했다
      - LEFT JOIN은 왼쪽 행을 모두 남기고 짝이 없으면 NULL로 채운다고 말했다
      - LEFT JOIN의 오른쪽 조건을 WHERE에 두면 INNER처럼 된다고 말했다
      - 1:N 조인으로 행이 늘어 합계가 부풀 수 있다고 말했다
      - 행마다 다시 조회하는 N+1 대신 조인으로 한 번에 읽는다고 말했다
    source: https://www.postgresql.org/docs/16/queries-table-expressions.html#QUERIES-JOIN
