questions:
  - key: q-045e48f0
    concept: core
    type: descriptive
    status: reviewed
    difficulty: 1
    body: JPA 지연 로딩이 프록시로 어떻게 동작하는지, LazyInitializationException은 왜 나는지 1분 안에 설명해 보세요
    explanation: |-
      - LAZY 연관 필드에는 엔티티를 상속한 프록시. FK(id)만 알고 있음
      - id 외의 값을 처음 읽을 때 영속성 컨텍스트로 SELECT(초기화), 이후엔 SELECT 없음
      - 영속성 컨텍스트 = 트랜잭션 범위. 끝난 뒤 초기화하면 LazyInitializationException
      - 해결: 트랜잭션 안에서 fetch join/EntityGraph, DTO 반환
    checklist:
      - 프록시가 엔티티를 상속한 가짜 객체라고 말했다
      - 초기화 시점(id 외의 값 처음 접근)을 말했다
      - 영속성 컨텍스트가 트랜잭션 범위라고 말했다
      - 해결책(fetch join, DTO)을 말했다
      - EAGER가 해결책이 아닌 이유를 말했다
    source: https://docs.hibernate.org/orm/6.6/userguide/html_single/#fetching
  - key: q-a6142f6c
    concept: core
    type: descriptive
    status: reviewed
    difficulty: 2
    body: em.find()와 em.getReference()를 SELECT 시점, 돌려주는 것, 없는 id일 때로 비교해 보세요
    explanation: |-
      - find: 즉시 SELECT, 진짜 엔티티, 없으면 null
      - getReference: SELECT 없이 프록시, 초기화 때 SELECT, 없으면 초기화 때 EntityNotFoundException
      - 단, 이미 영속성 컨텍스트에 있으면 같은 인스턴스를 돌려줌
      - 쓰임: 연관관계만 걸 때(FK만 필요) getReference(getReferenceById)
    checklist:
      - SELECT 시점 차이를 말했다
      - 진짜 엔티티 vs 프록시를 말했다
      - 없는 id일 때 차이를 말했다
      - 같은 id는 같은 인스턴스 규칙을 말했다
      - getReference의 쓰임을 말했다
    source: https://jakarta.ee/specifications/persistence/3.1/apidocs/jakarta.persistence/jakarta/persistence/EntityManager.html
  - key: q-011350e6
    concept: core
    type: descriptive
    status: reviewed
    difficulty: 3
    body: 엔티티를 그대로 JSON 응답하는 API에서 LazyInitializationException이 났다(OSIV 꺼짐). 원인과 고치는 방법을 말해 보세요
    explanation: |-
      - 원인: 서비스 트랜잭션이 끝난 뒤 JSON 직렬화가 getter로 LAZY 프록시를 초기화하려 함
      - 고치기: 서비스 안에서 필요한 연관을 fetch join/EntityGraph로 조회하고 DTO로 바꿔 반환. 엔티티를 응답으로 내보내지 않음
      - 피할 것: EAGER로 바꾸기(N+1, 과조회), OSIV를 켜서 덮기(커넥션 점유)
    checklist:
      - 직렬화가 트랜잭션 밖에서 일어난다고 말했다
      - 프록시 초기화 실패를 말했다
      - fetch join/EntityGraph를 말했다
      - DTO 반환을 말했다
      - EAGER나 OSIV가 좋은 해결이 아닌 이유를 말했다
    source: https://docs.hibernate.org/orm/6.6/userguide/html_single/#fetching
  - key: q-fd2a9efb
    concept: core
    type: ox
    status: reviewed
    difficulty: 1
    body: "\"초기화되지 않은 프록시에서 getId()를 호출하면 SELECT가 나간다\""
    answer: X
    explanation: |-
      - 프록시는 식별자를 이미 알고 있어서 SELECT 없이 돌려준다. 트랜잭션 밖에서도 예외가 없다
      - 검증: ProxyLazyLoadingTest (getReferenceDefersSelect, lazyInitializationAfterTransaction)
    source: https://docs.hibernate.org/orm/6.6/userguide/html_single/#fetching
  - key: q-011293d4
    concept: core
    type: code_predict
    status: reviewed
    difficulty: 3
    body: 같은 트랜잭션에서 em.getReference(Team, 10)을 먼저 하고 em.find(Team, 10)을 하면 find가 돌려주는 것은?
    choices:
      - 새로 조회한 진짜 Team (프록시와 다른 인스턴스)
      - 같은 프록시, 초기화됨
      - 같은 프록시, 미초기화
      - 예외
    answer: "2"
    explanation: |-
      - 영속성 컨텍스트는 같은 id에 같은 인스턴스를 보장한다. find는 이미 있는 프록시를 초기화해서 돌려준다. 클래스는 여전히 프록시
      - 검증: ProxyLazyLoadingTest (findAfterReferenceIsSameProxy)
    source: https://docs.hibernate.org/orm/6.6/userguide/html_single/#fetching
  - key: q-7910b535
    concept: core
    type: multiple_choice
    status: reviewed
    difficulty: 1
    body: LazyInitializationException을 해결하는 방법으로 가장 권장되는 것은?
    choices:
      - 연관관계를 EAGER로 바꾼다
      - 트랜잭션 안에서 fetch join으로 조회해 DTO로 반환한다
      - 엔티티 클래스를 final로 만든다
      - try-catch로 예외를 무시한다
    answer: "2"
    explanation: |-
      - 필요한 범위를 서비스가 정하고 엔티티를 밖으로 내보내지 않는다. EAGER는 과조회와 N+1, final은 프록시를 못 만듦
      - 검증: ProxyLazyLoadingTest (fetchJoinInitializes)
    source: https://docs.hibernate.org/orm/6.6/userguide/html_single/#fetching
  - key: q-c6a42d40
    concept: core
    type: line_pick
    status: reviewed
    difficulty: 2
    body: "[코드 16-A] 컨트롤러에서 LazyInitializationException이 난다(OSIV 꺼짐). 예외가 나는 줄은?"
    code: |-
      // PlayerService (@Transactional(readOnly = true))
      public Player find(Long id) { return playerRepository.findById(id).orElseThrow(); }

      // PlayerController
      Player p = playerService.find(1L);
      String name = p.getName();
      Long teamId = p.getTeam().getId();
      String teamName = p.getTeam().getName();
    answer: "8"
    explanation: |-
      - 6번은 이미 로딩된 플레이어 값, 7번은 프록시가 아는 id라 괜찮다. 8번에서 초기화하려는데 트랜잭션(영속성 컨텍스트)이 닫혔다
      - 고치기: 서비스에서 fetch join으로 조회해 DTO 반환
      - 검증: ProxyLazyLoadingTest (lazyInitializationAfterTransaction)
    source: https://docs.hibernate.org/orm/6.6/userguide/html_single/#fetching
