# 프록시와 지연 로딩 문제
# 형식: https://github.com/wanja727/retrievo/blob/main/docs/content-format.md
#
# 모든 문제는 coreQuestions의 질문 하나에 묶이고(coreQuestion), 답의 근거가 레슨 본문에 있다
# (site/src/content/lesson-pages/proxy-lazy-loading.yaml의 says).
# 동작에 관한 정답은 verification의 ProxyLazyLoadingTest로 확인했다 (Hibernate 6.6, PostgreSQL 16).
# 질문마다 첫 문제는 본문의 예시로 묻고, 둘째 문제는 다른 상황으로 옮겨 묻는다.
# 2026-11-25에 핵심 질문 구조로 다시 썼다. 예전 문제 가운데 면접 질문(q-045e48f0)만 키를 이어 쓴다.
# 같은 날 검수해 reviewed로 바꿨다.
subject:
  key: dev
  name: 개발자 면접
lesson:
  key: proxy-lazy-loading
  title: 프록시와 지연 로딩
  unit: JPA
  order: 804
concepts:
  - key: core
    name: 프록시와 지연 로딩
coreQuestions:
  - key: q1
    text: "지연 로딩이면 연관 필드에는 무엇이 들어 있나요?"
  - key: q2
    text: "프록시는 언제 SELECT를 보내나요?"
  - key: q3
    text: "LazyInitializationException은 왜 나나요?"
  - key: q4
    text: "LazyInitializationException은 어떻게 막나요?"
questions:
  # ── 질문 1 ──
  - key: proxy-class-check
    concept: core
    coreQuestion: q1
    type: code_predict
    status: reviewed
    difficulty: 1
    body: Player의 team은 @ManyToOne(fetch = FetchType.LAZY)예요. 트랜잭션 안에서 아래 코드를 실행했어요. 팀 테이블의 SELECT 수와 마지막 줄의 값은 무엇일까요?
    code: |-
      Player player = em.find(Player.class, 1L);
      boolean same =
          player.getTeam().getClass() == Team.class;
    choices:
      - SELECT 0번, false
      - SELECT 0번, true
      - SELECT 1번, true
      - SELECT 1번, false
    answer: "1"
    explanation: |-
      **SELECT 0번, false예요.** 팀 자리에는 Team을 상속해 Hibernate가 만든 프록시가 들어 있어요.

      - 프록시의 클래스 이름은 Team$HibernateProxy 같은 모양이에요
      - getClass()는 팀을 초기화하지 않아요
    source: https://docs.hibernate.org/orm/6.6/userguide/html_single/#fetching
  - key: proxy-orders-users
    concept: core
    coreQuestion: q1
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: 주문(Order)이 회원(User)을 @ManyToOne(fetch = LAZY)로 가리켜요. 한 트랜잭션에서 주문 10개를 JPQL select o from Order o로 조회한 직후예요. 회원 테이블의 SELECT는 몇 번 나갔을까요?
    choices:
      - 0번
      - 1번
      - 10번
      - 11번
    answer: "1"
    explanation: |-
      **0번이에요.** 회원 자리에는 모두 id만 아는 프록시가 들어가고, 아직 아무도 회원 값을 읽지 않았어요.

      - 회원의 id는 주문 행의 외래 키에서 와요
    source: https://docs.hibernate.org/orm/6.6/userguide/html_single/#fetching
  # ── 질문 2 ──
  - key: proxy-reference-count
    concept: core
    coreQuestion: q2
    type: code_predict
    status: reviewed
    difficulty: 1
    body: 한 트랜잭션 안에서 아래 코드를 실행했어요. 팀 테이블의 SELECT는 모두 몇 번일까요?
    code: |-
      Team t = em.getReference(Team.class, 1L);
      t.getId();
      t.getName();
      t.getName();
    choices:
      - 0번
      - 1번
      - 2번
      - 3번
    answer: "2"
    explanation: |-
      **1번이에요.** getId()는 프록시가 이미 알고, 처음 getName()에서 초기화하며 SELECT하고, 두 번째는 SELECT가 없어요.

      - getReference는 SELECT 없이 프록시를 돌려줘요
    source: https://docs.hibernate.org/orm/6.6/userguide/html_single/#fetching
  - key: proxy-stream-count
    concept: core
    coreQuestion: q2
    type: code_predict
    status: reviewed
    difficulty: 2
    body: Order의 user는 LAZY예요. 한 트랜잭션에서 주문 20개를 조회했고, 20개 주문의 회원은 모두 달라요. 아래 줄을 실행하는 동안 회원 테이블의 SELECT는 몇 번 나갈까요?
    code: |-
      List<String> emails = orders.stream()
          .map(o -> o.getUser().getEmail())
          .toList();
    choices:
      - 0번
      - 1번
      - 20번
      - 스트림 안에서는 지연 로딩이 되지 않아 예외가 난다
    answer: "3"
    explanation: |-
      **20번이에요.** 회원 프록시마다 처음 이메일을 읽을 때 초기화하며 SELECT해요.

      - 반복문이든 스트림의 map이든 같아요
      - 목록 크기를 따라 늘어나는 이 쿼리가 N+1 문제예요
    source: https://docs.hibernate.org/orm/6.6/userguide/html_single/#fetching
  # ── 질문 3 ──
  - key: proxy-id-after-tx
    concept: core
    coreQuestion: q3
    type: code_predict
    status: reviewed
    difficulty: 1
    body: Player의 team은 LAZY예요. 트랜잭션이 끝난 뒤 아래 두 줄을 실행해요. 어떻게 될까요?
    code: |-
      Player player = tx.execute(s ->
          em.find(Player.class, id));
      Long teamId = player.getTeam().getId();
      String name = player.getTeam().getName();
    choices:
      - 둘 다 된다
      - 첫 줄(getId)에서 LazyInitializationException
      - 둘째 줄(getName)에서 LazyInitializationException
      - 둘 다 NullPointerException
    answer: "3"
    explanation: |-
      **getName에서 예외가 나요.** id는 프록시가 이미 알아서 SELECT가 필요 없지만, 이름은 초기화해야 하는데 영속성 컨텍스트가 닫혔어요.

      - 메시지 끝의 no session이 그 뜻이에요
    source: https://docs.hibernate.org/orm/6.6/userguide/html_single/#fetching
  - key: proxy-initialized-before
    concept: core
    coreQuestion: q3
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: 서비스 메서드(@Transactional) 안에서 주문의 회원 이메일을 한 번 읽어 로그에 남긴 뒤 주문 엔티티를 돌려줬어요. 회원은 LAZY이고 OSIV는 꺼져 있어요. 컨트롤러에서 order.getUser().getEmail()을 읽으면 어떻게 될까요?
    choices:
      - LazyInitializationException이 난다
      - 이메일을 읽는다
      - 회원 SELECT가 한 번 더 나간다
      - EntityNotFoundException이 난다
    answer: "2"
    explanation: |-
      **이메일을 읽어요.** 트랜잭션 안에서 이미 초기화된 프록시는 진짜 회원을 가지고 있어서 영속성 컨텍스트가 없어도 돼요.

      - 초기화되지 않은 프록시만 트랜잭션 밖에서 예외를 내요
    source: https://docs.hibernate.org/orm/6.6/userguide/html_single/#fetching
  # ── 질문 4 ──
  - key: proxy-fetch-join-outside
    concept: core
    coreQuestion: q4
    type: multiple_choice
    status: reviewed
    difficulty: 1
    body: 트랜잭션 안에서 select p from Player p join fetch p.team where p.id = :id로 받은 선수의 팀 이름을 트랜잭션 밖에서 읽었어요. 어떻게 될까요?
    choices:
      - LazyInitializationException이 난다
      - 팀 이름을 읽는다
      - 팀 SELECT가 한 번 더 나간 뒤 읽는다
    answer: "2"
    explanation: |-
      **팀 이름을 읽어요.** fetch join이 선수와 팀을 SQL 하나로 가져와 팀 자리에 진짜 엔티티를 넣었어요.

      - @EntityGraph(attributePaths = "team")도 같은 일을 해요
    source: https://docs.hibernate.org/orm/6.6/userguide/html_single/#fetching
  - key: proxy-eager-or-dto
    concept: core
    coreQuestion: q4
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: 게시글 상세 API가 게시글 엔티티를 그대로 돌려주는데, 응답 JSON을 만들며 LAZY인 작성자의 이름을 읽다가 LazyInitializationException이 나요. 권하는 고침은 무엇일까요?
    choices:
      - 작성자 연관을 EAGER로 바꾼다
      - 서비스의 트랜잭션 안에서 작성자 이름까지 DTO에 담아 돌려준다
      - 컨트롤러에서 try-catch로 예외를 잡고 이름을 비운다
      - 작성자 필드를 지운다
    answer: "2"
    explanation: |-
      **DTO로 돌려줘요.** 트랜잭션 안에서 필요한 값을 다 읽어 두면, 밖에서는 엔티티를 만지지 않아요.

      - EAGER는 작성자가 필요 없는 조회에도 늘 함께 가져와 쿼리를 늘려요
      - 목록이면 fetch join으로 함께 조회한 뒤 DTO로 바꿔요
    source: https://docs.spring.io/spring-data/jpa/reference/jpa/query-methods.html#jpa.entity-graph
  - key: proxy-equals-getclass
    concept: core
    coreQuestion: q4
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: Team의 equals가 getClass() != o.getClass()면 false를 돌려줘요. 같은 id 7의 팀을 하나는 em.find로, 하나는 다른 트랜잭션에서 em.getReference로 받아 equals로 비교했어요. 결과는 무엇일까요?
    choices:
      - "true"
      - "false"
      - LazyInitializationException
      - 컴파일 오류
    answer: "2"
    explanation: |-
      **false예요.** 프록시의 클래스는 Team이 아니라 Team$HibernateProxy라 getClass()가 달라요.

      - 고친 equals: o instanceof Team t로 타입을 보고 getId()로 비교해요
      - 프록시의 필드는 비어 있으니 필드 대신 getter를 써요
    source: https://docs.hibernate.org/orm/6.6/userguide/html_single/#fetching
  # ── 네 질문을 하나로 ──
  - key: q-045e48f0
    concept: core
    coreQuestion: all
    type: descriptive
    status: reviewed
    difficulty: 2
    body: 면접에서 "지연 로딩은 어떻게 동작하고, LazyInitializationException은 왜 나나요?"라는 질문을 받았어요. 1분 안에 답해 보세요.
    explanation: |-
      **연관 자리에 id만 아는 프록시를 넣었다가 처음 값을 읽을 때 SELECT로 초기화하는데, 영속성 컨텍스트가 닫힌 뒤에는 초기화할 수 없어서 예외가 나요.**

      - 프록시는 엔티티를 상속해 Hibernate가 만든 클래스다
      - id는 SELECT 없이, 다른 값은 처음 읽을 때 한 번 SELECT한다
      - 스프링에서는 트랜잭션이 끝나면 영속성 컨텍스트가 닫힌다
      - fetch join, EntityGraph, DTO로 트랜잭션 안에서 미리 가져온다. EAGER는 해결이 아니다
    checklist:
      - 프록시가 연관 자리에 들어간다고 말했다
      - 처음 값을 읽을 때 SELECT로 초기화한다고 말했다
      - 영속성 컨텍스트가 닫혀 예외가 난다고 말했다
      - fetch join이나 DTO로 막는다고 말했다
      - EAGER가 해결이 아닌 이유를 말했다
    source: https://docs.hibernate.org/orm/6.6/userguide/html_single/#fetching
