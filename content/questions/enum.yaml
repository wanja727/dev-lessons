# enum 문제
# 형식: https://github.com/wanja727/retrievo/blob/main/docs/content-format.md
#
# 모든 문제는 coreQuestions의 질문 하나에 묶이고(coreQuestion), 답의 근거가 레슨 본문에 있다
# (site/src/content/lesson-pages/enum.yaml의 says).
# 동작에 관한 정답은 verification의 EnumTest, EnumJpaTest로 확인했다 (자바 21, 하이버네이트 6.6, PostgreSQL 16).
# 질문마다 첫 문제는 본문의 예시로 묻고, 둘째 문제는 다른 상황으로 옮겨 묻는다.
# 2026-11-25에 만든 문제다. 검수 전이라 draft다.
subject:
  key: dev
  name: 개발자 면접
lesson:
  key: enum
  title: enum
  unit: 자바 언어
  order: 44
concepts:
  - key: core
    name: enum
coreQuestions:
  - key: q1
    text: "정해진 값들을 int나 String 상수 대신 enum으로 만들면 무엇이 좋은가요?"
  - key: q2
    text: "enum 상수는 실제로 무엇인가요?"
  - key: q3
    text: "값마다 다른 데이터와 동작은 어떻게 주나요?"
  - key: q4
    text: "enum을 저장하거나 주고받을 때 name과 ordinal 가운데 무엇을 써야 하나요?"
questions:
  # ── 질문 1 ──
  - key: enum-type-safety
    concept: core
    coreQuestion: q1
    type: code_predict
    status: draft
    difficulty: 1
    body: 아래 메서드에 두 호출을 각각 썼어요. 컴파일 결과는 어떻게 될까요?
    code: |-
      enum OrderStatus { CREATED, PAID, SHIPPED, CANCELLED }

      void changeStatus(long orderId, OrderStatus status) {}

      changeStatus(1L, 7);
      changeStatus(1L, OrderStatus.PAID);
    choices:
      - 둘 다 컴파일된다
      - 첫째는 컴파일 오류, 둘째는 컴파일된다
      - 첫째는 컴파일되고 실행할 때 예외가 난다
      - 둘 다 컴파일 오류
    answer: "2"
    explanation: |-
      **첫째는 컴파일 오류, 둘째는 컴파일돼요.** 매개변수가 OrderStatus면 넘길 수 있는 것은 네 상수와 null뿐이에요.

      - int로 받았다면 7도 컴파일돼서 실행한 뒤에야 문제가 드러나요
      - 틀린 값을 컴파일러가 막아 주는 것이 enum을 쓰는 가장 큰 이유예요
    source: https://docs.oracle.com/javase/specs/jls/se21/html/jls-8.html#jls-8.9
  - key: enum-value-of-case
    concept: core
    coreQuestion: q1
    type: multiple_choice
    status: draft
    difficulty: 2
    body: 'enum Grade { BASIC, VIP }에서 Grade.valueOf("vip")를 실행하면 어떻게 될까요?'
    choices:
      - VIP가 나온다. 대소문자는 무시한다
      - null이 나온다
      - IllegalArgumentException이 난다
      - 컴파일 오류
    answer: "3"
    explanation: |-
      **IllegalArgumentException이 나요.** valueOf는 이름이 정확히 같은 상수만 찾아요.

      - 대소문자도 맞아야 해서 "vip"는 없는 이름이에요
    source: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/lang/Enum.html#valueOf(java.lang.Class,java.lang.String)
  # ── 질문 2 ──
  - key: enum-same-object
    concept: core
    coreQuestion: q2
    type: code_predict
    status: draft
    difficulty: 1
    body: 아래 코드는 무엇을 출력할까요?
    code: |-
      OrderStatus a = OrderStatus.valueOf("PAID");
      OrderStatus b = OrderStatus.PAID;
      System.out.println(a == b);
    choices:
      - "true"
      - "false"
      - 컴파일 오류
      - 실행할 때마다 다르다
    answer: "1"
    explanation: |-
      **true예요.** enum 상수는 상수마다 객체가 딱 하나만 만들어져요.

      - valueOf도 그 하나뿐인 객체를 돌려줘요
      - 그래서 enum은 ==로 비교해도 안전해요
    source: https://docs.oracle.com/javase/specs/jls/se21/html/jls-8.html#jls-8.9
  - key: enum-null-equals
    concept: core
    coreQuestion: q2
    type: multiple_choice
    status: draft
    difficulty: 2
    body: 'Grade g = null;일 때 g == Grade.VIP와 g.equals(Grade.VIP)를 각각 실행하면 어떻게 될까요?'
    choices:
      - false와 false
      - false와 NullPointerException
      - NullPointerException과 false
      - 둘 다 NullPointerException
    answer: "2"
    explanation: |-
      **false와 NullPointerException이에요.** ==는 점을 찍지 않고, g.equals는 null에 점을 찍어요.

      - 그래서 enum은 ==로 비교하면 null일 때도 안전해요
    source: https://docs.oracle.com/javase/specs/jls/se21/html/jls-15.html#jls-15.21.3
  # ── 질문 3 ──
  - key: enum-can-cancel
    concept: core
    coreQuestion: q3
    type: code_predict
    status: draft
    difficulty: 1
    body: 아래 enum에서 OrderStatus.SHIPPED.canCancel()의 결과는 무엇일까요?
    code: |-
      enum OrderStatus {
        CREATED("주문 접수", true),
        PAID("결제 완료", true),
        SHIPPED("배송 중", false),
        CANCELLED("취소", false);

        private final String label;
        private final boolean cancellable;

        OrderStatus(String label, boolean cancellable) {
          this.label = label;
          this.cancellable = cancellable;
        }
        boolean canCancel() { return cancellable; }
      }
    choices:
      - "true"
      - "false"
      - 컴파일 오류. enum은 생성자를 가질 수 없다
      - NullPointerException
    answer: "2"
    explanation: |-
      **false예요.** 상수 뒤의 괄호가 생성자 호출이고, SHIPPED는 cancellable을 false로 받았어요.

      - enum도 클래스라서 필드, 생성자, 메서드를 가질 수 있어요
      - 규칙을 enum 안에 두면 새 상수를 추가할 때 그 값도 정해야 해서 빠뜨리지 않아요
    source: https://docs.oracle.com/javase/specs/jls/se21/html/jls-8.html#jls-8.9.2
  - key: enum-switch-missing
    concept: core
    coreQuestion: q3
    type: code_predict
    status: draft
    difficulty: 2
    body: 상수가 CREATED, PAID, SHIPPED, CANCELLED인 enum이에요. 아래 코드를 컴파일하면 어떻게 될까요?
    code: |-
      String text = switch (status) {
        case CREATED -> "접수";
        case PAID -> "결제";
        case SHIPPED -> "배송";
      };
    choices:
      - 컴파일되고 CANCELLED면 null을 돌려준다
      - 컴파일 오류. CANCELLED를 다루지 않았다
      - 컴파일되고 CANCELLED면 예외가 난다
      - 컴파일되지만 경고가 난다
    answer: "2"
    explanation: |-
      **컴파일 오류예요.** 값을 돌려주는 switch 식은 default가 없으면 모든 상수를 다뤄야 해요.

      - 상수를 추가하는 날 빠뜨린 switch 식이 컴파일 오류로 드러나요
      - default를 넣거나 예전 방식의 switch 문을 쓰면 빠뜨려도 조용히 컴파일돼요
    source: https://docs.oracle.com/javase/specs/jls/se21/html/jls-15.html#jls-15.28.1
  # ── 질문 4 ──
  - key: enum-ordinal-shift
    concept: core
    coreQuestion: q4
    type: code_predict
    status: draft
    difficulty: 1
    body: 원래 선언은 CREATED, PAID, SHIPPED, CANCELLED였고 CANCELLED.ordinal()은 3이었어요. 아래처럼 PREPARING을 끼워 넣은 뒤 CANCELLED.ordinal()은 얼마일까요?
    code: |-
      enum OrderStatus {
        CREATED, PAID, PREPARING,
        SHIPPED, CANCELLED
      }
    choices:
      - "3"
      - "4"
      - "5"
      - 끼워 넣은 상수만 번호가 없다
    answer: "2"
    explanation: |-
      **4예요.** ordinal은 0부터 시작하는 선언 순서라서, 중간에 끼워 넣으면 뒤의 상수들이 하나씩 밀려요.

      - 예전에 번호로 저장한 데이터는 다른 상수로 읽혀요
      - 그래서 저장할 때는 name을 써요
    source: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/lang/Enum.html#ordinal()
  - key: enum-reorder
    concept: core
    coreQuestion: q4
    type: multiple_choice
    status: draft
    difficulty: 2
    body: 'enum Grade { BASIC, VIP }의 ordinal()을 DB에 저장해 왔어요. 선언을 enum Grade { VIP, BASIC }으로 순서만 바꿨어요. 예전에 0으로 저장한 회원을 Grade.values()[0]으로 읽으면 무엇이 나올까요?'
    choices:
      - BASIC
      - VIP
      - IllegalArgumentException
      - "null"
    answer: "2"
    explanation: |-
      **VIP예요.** 0번 자리에 이제 VIP가 있어요. 저장할 때는 BASIC이었어요.

      - 예외가 나지 않아서 조용히 틀린 값이 돼요
      - 이름으로 저장했다면 순서를 바꿔도 BASIC으로 읽혀요
    source: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/lang/Enum.html#ordinal()
  - key: enum-jpa-default
    concept: core
    coreQuestion: q4
    type: code_predict
    status: draft
    difficulty: 2
    body: 아래 엔티티로 상태가 SHIPPED인 주문을 저장했어요. enum은 CREATED, PAID, SHIPPED, CANCELLED 순서예요. status 열에 무엇이 들어갈까요?
    code: |-
      @Entity
      class Order {
        @Id @GeneratedValue
        private Long id;

        private OrderStatus status;
      }
    choices:
      - 문자열 SHIPPED
      - 숫자 2
      - 숫자 3
      - "null"
    answer: "2"
    explanation: |-
      **숫자 2예요.** @Enumerated를 붙이지 않으면 기본값 EnumType.ORDINAL로 저장돼요.

      - 상수를 중간에 끼워 넣으면 저장된 값의 뜻이 바뀌어요
      - @Enumerated(EnumType.STRING)을 붙이면 이름 "SHIPPED"가 저장돼요
    source: https://jakarta.ee/specifications/persistence/3.1/apidocs/jakarta.persistence/jakarta/persistence/Enumerated.html
  # ── 네 질문을 하나로 ──
  - key: enum-interview
    concept: core
    coreQuestion: all
    type: descriptive
    status: draft
    difficulty: 2
    body: 면접에서 "enum을 DB에 저장할 때 무엇을 조심해야 하나요?"라는 질문을 받았어요. 1분 안에 답해 보세요.
    explanation: |-
      **ordinal은 선언 순서라서 상수를 끼워 넣으면 저장된 값의 뜻이 바뀌니, 이름(EnumType.STRING)으로 저장해요.**

      - **enum:** 정해진 값만 들어가게 컴파일러가 막는다. 상수마다 객체가 하나라 ==로 비교한다
      - **데이터와 동작:** 필드, 생성자, 메서드, 상수별 구현을 둘 수 있다. 규칙을 enum 안에 둔다
      - **ordinal의 함정:** 중간에 끼워 넣으면 번호가 밀려 예외 없이 다른 상수로 읽힌다
      - **JPA:** @Enumerated의 기본값이 ORDINAL이니 EnumType.STRING을 명시한다
    checklist:
      - enum은 정해진 값만 들어가게 컴파일러가 막아 준다고 말했다
      - 상수마다 객체가 하나라 ==로 비교해도 된다고 말했다
      - ordinal은 선언 순서라 상수를 끼워 넣으면 바뀐다고 말했다
      - JPA의 @Enumerated 기본값이 ORDINAL이라 STRING을 명시한다고 말했다
    source: https://jakarta.ee/specifications/persistence/3.1/apidocs/jakarta.persistence/jakarta/persistence/Enumerated.html
