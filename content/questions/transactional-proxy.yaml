concepts:
  - key: core
    name: "@Transactional 동작 원리와 내부 호출"
questions:
  - key: q-7bac4206
    concept: core
    type: line_pick
    status: draft
    difficulty: 2
    body: "[코드 1-A] 컨트롤러가 placeOrder()를 호출했다. addPoint()의 @Transactional이 적용되지 않게 만드는 줄은 몇 번인가?"
    code: |-
      @Service
      @RequiredArgsConstructor
      public class OrderService {
          private final OrderRepository orderRepository;
          private final PointRepository pointRepository;

          public void placeOrder(Order order) {
              orderRepository.save(order);
              addPoint(order.getUserId(), 100);
          }

          @Transactional
          public void addPoint(Long userId, int amount) {
              Point point = pointRepository.findByUserId(userId);
              point.add(amount);
          }
      }
    answer: "9"
    explanation: |-
      - 9번 줄의 addPoint(...)는 this.addPoint(...)와 같다. 같은 객체 안에서 부르는 내부 호출이라 트랜잭션을 처리하는 프록시를 거치지 않는다
      - 흔한 오답: 12번(어노테이션 자체는 문제가 아니다), 7번(placeOrder에 트랜잭션이 없는 것은 원인이 아니라 해결 방법 중 하나와 관련)
    source: https://docs.spring.io/spring-framework/reference/data-access/transaction/declarative/annotations.html
  - key: q-84177273
    concept: core
    type: code_predict
    status: draft
    difficulty: 3
    body: "[코드 1-B] 같은 코드에서 placeOrder() 호출이 끝난 뒤 DB 상태는? (이후 다른 DB 작업은 없다)"
    choices:
      - 주문 저장됨, 포인트 100 증가함
      - 주문 저장됨, 포인트 그대로
      - 주문 저장 안 됨, 포인트 그대로
      - 예외가 발생한다
    answer: "2"
    explanation: |-
      - 8번 줄: Spring Data JPA의 save()는 자체 트랜잭션을 갖고 있어서 주문은 저장되고 커밋된다
      - 14~15번 줄: addPoint에 트랜잭션이 없다. 조회는 되지만 point.add()의 변경을 커밋할 트랜잭션이 없어서 변경 감지(flush)가 일어나지 않는다
      - 예외도 나지 않아서 **조용히 포인트가 빠지는 버그**가 된다. 그래서 위험하다
      - 심화: OSIV가 켜져 있으면 같은 요청에서 이후 다른 트랜잭션이 커밋될 때 이 변경이 함께 flush될 수 있다. 동작이 호출 순서에 따라 달라지는 것 자체가 문제다
    source: https://docs.spring.io/spring-framework/reference/data-access/transaction/declarative/annotations.html
  - key: q-a7d3c749
    concept: core
    type: descriptive
    status: draft
    difficulty: 3
    body: "[코드 1-C] 같은 코드에서 포인트가 반영되지 않는 원인을 설명하고, 해결 방법 2가지와 그 차이를 말해 보세요"
    explanation: |-
      - **원인:** @Transactional은 스프링이 만든 프록시가 메서드 호출을 가로채서 처리한다. 9번 줄은 같은 객체 안의 내부 호출이라 프록시를 거치지 않고, addPoint는 트랜잭션 없이 실행된다. 따라서 15번 줄의 변경을 커밋할 트랜잭션이 없다
      - **해결 1:** placeOrder에 @Transactional을 붙인다. 주문 저장과 포인트 적립이 **한 트랜잭션**이 되어 하나가 실패하면 함께 롤백된다
      - **해결 2:** addPoint를 PointService 같은 **다른 빈으로 분리**해 프록시를 거치게 한다. placeOrder에 트랜잭션이 없으면 두 작업은 각각 따로 커밋된다
      - 자기 자신 주입이나 AopContext 사용은 가능하지만 구조가 꼬여서 권하지 않는다
    checklist:
      - "@Transactional은 프록시(AOP)가 처리한다고 말했다"
      - 내부 호출(this)은 프록시를 거치지 않는다고 말했다
      - 트랜잭션이 없어 변경 감지가 반영되지 않는다고 말했다
      - 해결 방법 2가지(호출하는 쪽에 @Transactional, 다른 빈으로 분리)를 말했다
      - 두 해결의 트랜잭션 범위 차이(하나로 묶임 vs 따로 커밋)를 말했다
    source: https://docs.spring.io/spring-framework/reference/data-access/transaction/declarative/annotations.html
  - key: q-d06ff1b4
    concept: core
    type: descriptive
    status: draft
    difficulty: 1
    body: "@Transactional은 어떻게 동작하고, 같은 클래스에서 호출하면 왜 적용되지 않는지 1분 안에 설명해 보세요"
    explanation: |-
      - 스프링 AOP가 만든 CGLIB 프록시가 주입되고, 프록시가 호출을 가로채 트랜잭션 시작 → 진짜 메서드 → 커밋/롤백
      - 내부 호출은 this(진짜 객체)를 직접 부르므로 프록시를 거치지 않는다. private도 덮어쓸 수 없어 적용 안 됨
    checklist:
      - 프록시(AOP)가 트랜잭션을 연다고 말했다
      - 프록시의 순서(시작, 호출, 커밋/롤백)를 말했다
      - 내부 호출은 this라서 프록시를 안 거친다고 말했다
      - 예외 없이 데이터가 빠지는 결과를 말했다
      - 해결 방법을 하나 이상 말했다
    source: https://docs.spring.io/spring-framework/reference/core/aop/proxying.html
  - key: q-c2507cd8
    concept: core
    type: descriptive
    status: draft
    difficulty: 2
    body: 내부 호출 문제의 해결 방법 세 가지(호출하는 쪽에 @Transactional, 다른 빈으로 분리, TransactionTemplate)를 트랜잭션 범위 관점에서 비교해 보세요
    explanation: |-
      - 호출하는 쪽: 한 트랜잭션, 함께 커밋·함께 롤백 (대부분의 경우)
      - 빈 분리: 트랜잭션이 나뉘어 따로 커밋. 하나가 실패해도 다른 하나는 남음
      - TransactionTemplate: 코드로 정한 범위, 메서드보다 좁게 잡을 때
    checklist:
      - 호출하는 쪽은 한 트랜잭션이라고 말했다
      - 빈 분리는 따로 커밋된다고 말했다
      - 예외가 나면 각각 무엇이 남는지 말했다
      - TransactionTemplate의 장점(범위가 코드에 드러남)을 말했다
      - 상황별 선택 기준을 말했다
    source: https://docs.spring.io/spring-framework/reference/data-access/transaction/declarative/annotations.html
  - key: q-9f76b9d9
    concept: core
    type: ox
    status: draft
    difficulty: 1
    body: "\"private 메서드에 @Transactional을 붙이면 그 메서드를 부를 때 트랜잭션이 열린다\""
    answer: X
    explanation: |-
      - CGLIB 프록시는 상속으로 메서드를 덮어써서 가로채는데, private 메서드는 덮어쓸 수 없다. 게다가 private 메서드는 같은 클래스에서만 부르니 항상 내부 호출이다
      - 근거: Spring 문서 (테스트 없음)
    source: https://docs.spring.io/spring-framework/reference/data-access/transaction/declarative/annotations.html
  - key: q-fa12bd6a
    concept: core
    type: code_predict
    status: draft
    difficulty: 3
    body: placeOrder()가 주문을 저장한 뒤 다른 빈 pointService.addPoint()(@Transactional)를 부른다. placeOrder에는 @Transactional이 없다. addPoint에서 런타임 예외가 나면?
    choices:
      - 주문도 포인트도 롤백된다
      - 주문은 남고 포인트 변경만 롤백된다
      - 둘 다 커밋된다
      - 예외가 삼켜져 컨트롤러는 모른다
    answer: "2"
    explanation: |-
      - placeOrder에 트랜잭션이 없으니 주문 저장은 리포지토리 자체 트랜잭션으로 이미 커밋됐다. addPoint는 프록시를 거쳐 자기 트랜잭션을 갖고, 그 트랜잭션만 롤백된다. 예외는 컨트롤러까지 전달된다
      - 검증: TransactionalProxyTest (splitBeansSplitTransactions)
    source: https://docs.spring.io/spring-framework/reference/data-access/transaction/declarative/annotations.html
