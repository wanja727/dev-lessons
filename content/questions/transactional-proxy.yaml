# @Transactional 동작 원리 문제
# 형식: https://github.com/wanja727/retrievo/blob/main/docs/content-format.md
#
# 모든 문제는 coreQuestions의 질문 하나에 묶이고(coreQuestion), 답의 근거가 레슨 본문에 있다
# (site/src/content/lesson-pages/transactional-proxy.yaml의 says).
# 동작에 관한 정답은 verification의 TxProxyLessonTest, transaction/TransactionalProxyTest, SelfInvocationTest로 확인했다.
# 질문마다 첫 문제는 본문의 예시로 묻고, 둘째 문제는 다른 상황으로 옮겨 묻는다.
# 2026-11-25에 검수해 reviewed로 바꿨다.
# 2026-11-25에 핵심 질문 구조로 다시 썼다. 예전 문제는 지웠다.
subject:
  key: dev
  name: 개발자 면접
lesson:
  key: transactional-proxy
  title: "@Transactional 동작 원리"
  unit: 스프링
  order: 710
concepts:
  - key: core
    name: "@Transactional 동작 원리"
coreQuestions:
  - key: q1
    text: "@Transactional을 붙이면 누가 트랜잭션을 여닫나요?"
  - key: q2
    text: "같은 클래스 안에서 부르면 왜 트랜잭션이 빠지나요?"
  - key: q3
    text: "@Transactional은 어디에 붙여야 걸리나요?"
  - key: q4
    text: "프록시 없이 트랜잭션을 열 수도 있나요?"
questions:
  # ── 질문 1 ──
  - key: tp-who
    concept: core
    coreQuestion: q1
    type: multiple_choice
    status: reviewed
    difficulty: 1
    body: '@Transactional이 붙은 OrderService.placeOrder를 컨트롤러가 불러요. 트랜잭션을 시작하고 커밋하는 것은 누구일까요?'
    choices:
      - placeOrder 메서드 자신
      - 컨트롤러
      - 빈 앞에 선 프록시의 트랜잭션 어드바이스(TransactionInterceptor)
      - DB가 알아서 한다
    answer: "3"
    explanation: |-
      **프록시의 트랜잭션 어드바이스예요.** @Transactional이 붙은 빈은 프록시로 바뀌어 주입되고, 프록시가 메서드 전에 트랜잭션을 열고 정상이면 커밋, 런타임 예외면 롤백해요.
    source: https://docs.spring.io/spring-framework/reference/data-access/transaction/declarative/tx-decl-explained.html
  - key: tp-same-connection
    concept: core
    coreQuestion: q1
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: '@Transactional 메서드 안에서 JdbcTemplate으로 UPDATE 두 번을 하고, 두 번째 다음에 런타임 예외가 났어요. 첫 번째 UPDATE는 DB에 남을까요?'
    choices:
      - 남는다. JdbcTemplate은 문장마다 커밋한다
      - 남지 않는다. 두 UPDATE가 스레드에 묶인 같은 커넥션의 한 트랜잭션이라 함께 롤백된다
      - 남는다. 예외는 두 번째 다음에 났다
      - 절반만 남는다
    answer: "2"
    explanation: |-
      **남지 않아요.** 트랜잭션 매니저가 빌린 커넥션을 스레드에 묶어 두고, 메서드 안의 JdbcTemplate과 리포지토리가 그 커넥션을 함께 써요. 프록시가 예외를 보고 롤백하면 함께 사라져요.
    source: https://docs.spring.io/spring-framework/reference/data-access/transaction/declarative/tx-decl-explained.html
  # ── 질문 2 ──
  - key: tp-self
    concept: core
    coreQuestion: q2
    type: code_predict
    status: reviewed
    difficulty: 1
    body: 컨트롤러가 아래 placeOrder를 불렀어요. p.add(amount)는 엔티티의 값만 바꾸고 save를 부르지 않아요. 끝난 뒤 DB는 어떨까요?
    code: |-
      @Service
      public class OrderService {
        public void placeOrder(Order o) {
          orders.save(o);
          this.addPoint(o.userId(), 100);
        }

        @Transactional
        public void addPoint(long userId,
            int amount) {
          Point p = points.findByUserId(userId);
          p.add(amount);
        }
      }
    choices:
      - 주문 저장, 포인트 100
      - 주문 저장, 포인트 그대로
      - 둘 다 없음
      - 예외가 난다
    answer: "2"
    explanation: |-
      **주문은 저장되고 포인트는 그대로예요.** this.addPoint는 프록시를 거치지 않아 트랜잭션이 열리지 않고, 트랜잭션이 없으니 커밋할 때 변경을 반영하는 일(변경 감지)도 없어요. 예외도 나지 않아요.
    source: https://docs.spring.io/spring-framework/reference/data-access/transaction/declarative/annotations.html
  - key: tp-split
    concept: core
    coreQuestion: q2
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: 'placeOrder(어노테이션 없음)가 orders.save로 주문을 저장한 뒤, 다른 빈의 @Transactional PointService.addPoint를 불러요. addPoint에서 런타임 예외가 나면 주문 행은 남을까요?'
    choices:
      - 남지 않는다. 같은 요청이라 함께 롤백된다
      - 남는다. 주문 save는 이미 따로 커밋됐다
      - 주문은 남고 예외는 사라진다
      - 앱이 뜨지 않는다
    answer: "2"
    explanation: |-
      **남아요.** placeOrder에는 트랜잭션이 없어 리포지토리의 save가 스스로 트랜잭션을 열고 커밋해요. addPoint의 롤백은 자기 트랜잭션만 되돌려요.

      - 주문과 적립을 함께 롤백하려면 placeOrder에 @Transactional을 붙여요
    source: https://docs.spring.io/spring-data/jpa/reference/jpa/transactions.html
  # ── 질문 3 ──
  - key: tp-private
    concept: core
    coreQuestion: q3
    type: multiple_choice
    status: reviewed
    difficulty: 1
    body: OrderService의 private void savePoint()에 @Transactional을 붙이고, public placeOrder(어노테이션 없음)에서 불러요. savePoint 안에 트랜잭션이 열릴까요?
    choices:
      - 열린다
      - 열리지 않는다. private은 오버라이딩할 수 없고 늘 내부 호출이다
      - 앱이 뜨지 않는다
      - placeOrder가 public이라 열린다
    answer: "2"
    explanation: |-
      **열리지 않아요.** CGLIB 프록시는 오버라이딩으로 끼어드는데 private 메서드는 오버라이딩할 수 없어요. 같은 클래스 안에서만 부르니 늘 내부 호출이기도 해요. 에러도 경고도 없어요.
    source: https://docs.spring.io/spring-framework/reference/data-access/transaction/declarative/annotations.html
  - key: tp-protected
    concept: core
    coreQuestion: q3
    type: multiple_choice
    status: reviewed
    difficulty: 3
    body: 스프링 부트 3.5(스프링 프레임워크 6.2) 기본 설정이에요. 같은 패키지의 다른 빈이 OrderService의 @Transactional protected 메서드를 부르면 트랜잭션이 열릴까요?
    choices:
      - 열린다. 스프링 6.0부터 CGLIB 프록시는 protected와 패키지 접근 메서드에도 건다
      - 열리지 않는다. @Transactional은 public 메서드에만 걸린다
      - 앱이 뜨지 않는다
      - 읽기 전용으로만 열린다
    answer: "1"
    explanation: |-
      **열려요.** 스프링 6.0부터 클래스 기반(CGLIB) 프록시는 protected와 패키지 접근 메서드에도 트랜잭션을 걸어요. "public에만 걸린다"는 5.x까지의 설명이에요.

      - private과 final 메서드에는 여전히 걸리지 않아요
    source: https://docs.spring.io/spring-framework/reference/data-access/transaction/declarative/annotations.html
  # ── 질문 4 ──
  - key: tp-template-commit
    concept: core
    coreQuestion: q4
    type: code_predict
    status: reviewed
    difficulty: 1
    body: '@Transactional이 없는 아래 메서드에서 notifyUser가 예외를 던졌어요. 주문 행은 DB에 남을까요?'
    code: |-
      public void placeOrder(Order o) {
        validate(o);
        tx.executeWithoutResult(s -> {
          orders.save(o);
          addPoint(o.userId(), 100);
        });
        notifyUser(o);
      }
    choices:
      - 남는다. 람다가 끝날 때 이미 커밋됐다
      - 남지 않는다. 메서드 전체가 롤백된다
      - notifyUser의 예외 종류에 따라 다르다
      - 람다는 트랜잭션이 아니라 원래 남는다
    answer: "1"
    explanation: |-
      **남아요.** TransactionTemplate은 넘긴 람다만 트랜잭션 안에서 돌리고, 람다가 정상으로 끝나면 그 자리에서 커밋해요. 그 뒤의 예외는 이미 끝난 트랜잭션과 상관없어요.
    source: https://docs.spring.io/spring-framework/reference/data-access/transaction/programmatic.html
  - key: tp-external-hold
    concept: core
    coreQuestion: q4
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: '@Transactional pay 메서드가 주문 상태를 바꾼 뒤 외부 결제 API(평소 5초 걸림)를 부르고, 다시 상태를 바꿔요. 결제 요청이 몰리면 무엇이 먼저 모자랄까요?'
    choices:
      - CPU
      - DB 커넥션 풀. API를 기다리는 동안에도 트랜잭션이 커넥션을 쥐고 있다
      - 메모리
      - 아무것도 모자라지 않는다
    answer: "2"
    explanation: |-
      **커넥션 풀이에요.** 트랜잭션이 열려 있는 동안 커넥션은 스레드에 묶여 있어요. 5초씩 쥐고 있으면 요청이 조금만 몰려도 풀이 바닥나요.

      - TransactionTemplate으로 DB 작업만 짧게 묶고 외부 호출은 밖에 둬요
    source: https://docs.spring.io/spring-framework/reference/data-access/transaction/programmatic.html
  # ── 전체 ──
  - key: tp-interview
    concept: core
    coreQuestion: all
    type: descriptive
    status: reviewed
    difficulty: 2
    body: 면접에서 "@Transactional은 어떻게 동작하고, 왜 내부 호출에서는 적용되지 않나요?"라는 질문을 받았어요. 1분 안에 답해 보세요.
    explanation: |-
      **프록시가 트랜잭션을 여닫고, 프록시를 거치지 않는 호출에는 걸리지 않아요.**

      - **원리:** 프록시의 TransactionInterceptor가 커넥션을 빌려 자동 커밋을 끄고 스레드에 묶는다. 정상이면 커밋, 런타임 예외면 롤백
      - **내부 호출:** this 호출은 원래 객체라 프록시를 거치지 않는다. 바깥에 붙이거나 다른 빈으로 나눈다(범위가 달라진다)
      - **붙이는 곳:** final, private에는 안 걸린다. 메서드 설정이 클래스 설정보다 먼저다
      - **TransactionTemplate:** 프록시 없이 일부만 묶는다. 외부 호출은 트랜잭션 밖에 둔다
    checklist:
      - 프록시가 트랜잭션을 열고 커밋이나 롤백한다고 말했다
      - 같은 클래스 안의 this 호출은 프록시를 거치지 않아 빠진다고 말했다
      - final이나 private 메서드에는 걸리지 않는다고 말했다
      - 바깥 메서드에 붙이거나 빈을 나누거나 TransactionTemplate으로 고친다고 말했다
    source: https://docs.spring.io/spring-framework/reference/data-access/transaction/declarative/tx-decl-explained.html
