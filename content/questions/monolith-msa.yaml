# 모놀리스와 마이크로서비스 문제
# 형식: https://github.com/wanja727/retrievo/blob/main/docs/content-format.md
#
# 모든 문제는 coreQuestions의 질문 하나에 묶이고(coreQuestion), 답의 근거가 레슨 본문에 있다
# (site/src/content/lesson-pages/monolith-msa.yaml의 says).
# 동작에 관한 정답은 verification의 MonolithMsaTest로 확인했다 (PostgreSQL 16, 내장 톰캣).
# 질문마다 첫 문제는 본문의 예시로 묻고, 둘째 문제는 다른 상황으로 옮겨 묻는다.
subject:
  key: dev
  name: 개발자 면접
lesson:
  key: monolith-msa
  title: 모놀리스와 마이크로서비스
  unit: 시스템 설계와 아키텍처
  order: 909
concepts:
  - key: core
    name: 모놀리스와 마이크로서비스
coreQuestions:
  - key: q1
    text: "모놀리스는 무엇이고, 커지면 무엇이 힘들어지나요?"
  - key: q2
    text: "마이크로서비스로 나누면 무엇을 얻고 무엇을 잃나요?"
  - key: q3
    text: "서비스를 나누면 트랜잭션은 어떻게 되나요?"
  - key: q4
    text: "언제 나누고, 나누지 않는다면 무엇을 지키나요?"
questions:
  # ── 질문 1 ──
  - key: ms-local-rollback
    concept: core
    coreQuestion: q1
    type: code_predict
    status: draft
    difficulty: 1
    body: 한 애플리케이션 안에서 주문 서비스가 재고 서비스를 메서드로 불러요. 둘은 같은 DB를 써요. payment.approve가 예외를 던지면 주문과 재고는 어떻게 되나요?
    code: |-
      @Transactional
      void order(long itemId, int qty) {
        orders.save(new Order(itemId, qty));
        stockService.decrease(itemId, qty);
        payment.approve(itemId, qty);
      }
    choices:
      - 주문만 롤백되고 재고는 줄어든 채 남는다
      - 둘 다 롤백된다
      - 둘 다 커밋된다
      - 재고만 롤백된다
    answer: "2"
    explanation: |-
      **둘 다 롤백돼요.** 같은 애플리케이션, 같은 DB의 한 트랜잭션이라 함께 되돌아가요.

      - 테스트에서도 주문 0건, 재고는 처음 값 그대로였어요
      - 모놀리스의 장점 가운데 하나예요
    source: https://martinfowler.com/bliki/MonolithFirst.html
  - key: ms-small-team
    concept: core
    coreQuestion: q1
    type: multiple_choice
    status: draft
    difficulty: 2
    body: 개발자 4명이 만드는 사내 예약 서비스예요. 하루 요청은 1만 건, 기능은 예약과 회원 두 가지예요. 모놀리스로 두었을 때의 판단으로 맞는 것은?
    choices:
      - 배포와 늘리기가 묶이는 문제가 크게 드러나니 바로 나눠야 한다
      - 배포와 늘리기가 묶여도 문제될 크기가 아니어서 모놀리스가 알맞다
      - 모놀리스는 트랜잭션을 쓸 수 없어서 맞지 않는다
      - 요청이 적으면 마이크로서비스가 더 빠르다
    answer: "2"
    explanation: |-
      **모놀리스가 알맞아요.** 커질 때의 문제는 크기와 팀 수의 문제라 작은 팀의 작은 서비스에서는 드러나지 않아요.

      - 모놀리스는 호출이 빠르고 트랜잭션 하나로 묶여 단순해요
      - 나누면 네트워크 호출과 운영할 것만 늘어요
    source: https://martinfowler.com/bliki/MonolithFirst.html
  # ── 질문 2 ──
  - key: ms-stock-down
    concept: core
    coreQuestion: q2
    type: multiple_choice
    status: draft
    difficulty: 1
    body: 주문 서버가 재고 서버를 HTTP로 불러 재고를 줄여요. 재고 서버가 꺼져 있고, 다른 대책은 없어요. 주문 요청은 어떻게 되나요?
    choices:
      - 성공한다. 재고는 나중에 줄어든다
      - 실패한다. HTTP 호출이 예외로 끝난다
      - 재고 서버가 켜질 때까지 영원히 기다렸다가 성공한다
      - 주문 서버가 재고를 대신 줄인다
    answer: "2"
    explanation: |-
      **실패해요.** 재고 서버가 꺼져 있으면 연결이 실패하고 ResourceAccessException이 나요.

      - 테스트에서도 꺼진 서버를 부르니 ResourceAccessException이었어요
      - 상대의 장애가 부르는 쪽으로 번져요. 결과가 바로 필요 없으면 메시지로 넘겨요
    source: https://docs.spring.io/spring-framework/reference/integration/rest-clients.html
  - key: ms-review-slow
    concept: core
    coreQuestion: q2
    type: multiple_choice
    status: draft
    difficulty: 2
    body: 상품 상세 페이지 서버가 리뷰 서버를 HTTP로 불러 리뷰를 붙여요. 타임아웃은 정하지 않았어요. 리뷰 서버가 응답을 5초 늦게 하면 상세 페이지는 어떻게 되나요?
    choices:
      - 리뷰 없이 바로 뜬다
      - 상세 페이지도 5초 넘게 걸린다
      - 상세 페이지가 리뷰 서버보다 빨리 실패한다
      - 리뷰 서버가 알아서 빨라진다
    answer: "2"
    explanation: |-
      **상세 페이지도 5초 넘게 걸려요.** 부르는 쪽은 응답이 올 때까지 기다려요.

      - 테스트에서 1.5초 늦는 서버를 부르니 호출도 1.5초 넘게 걸렸어요
      - 타임아웃을 두고, 늦으면 리뷰 없이 보여 주게 해요
    source: https://docs.spring.io/spring-framework/reference/integration/rest-clients.html
  - key: ms-no-timeout
    concept: core
    coreQuestion: q2
    type: code_predict
    status: draft
    difficulty: 2
    body: 재고 서버가 2초 늦게 응답해요. 아래 두 클라이언트로 각각 부르면 어떻게 되나요?
    code: |-
      RestClient plain =
          RestClient.create(base);

      SimpleClientHttpRequestFactory f =
          new SimpleClientHttpRequestFactory();
      f.setReadTimeout(500);
      RestClient guarded = RestClient.builder()
          .baseUrl(base).requestFactory(f)
          .build();
    choices:
      - 둘 다 0.5초에 실패한다
      - plain은 2초를 기다려 받고, guarded는 0.5초쯤에 타임아웃 예외가 난다
      - plain은 바로 실패하고, guarded는 2초를 기다린다
      - 둘 다 2초를 기다려 받는다
    answer: "2"
    explanation: |-
      **plain은 끝까지 기다리고 guarded는 0.5초쯤에 포기해요.** 기본 설정에는 읽기 타임아웃이 없어요.

      - 테스트에서 guarded는 RestClientException(원인 SocketTimeoutException)을 던졌어요
      - 타임아웃이 없으면 상대가 응답하지 않을 때 요청 스레드가 묶여요
    source: https://docs.spring.io/spring-framework/reference/integration/rest-clients.html
  # ── 질문 3 ──
  - key: ms-remote-not-rolled
    concept: core
    coreQuestion: q3
    type: code_predict
    status: draft
    difficulty: 1
    body: stockClient는 재고 서버를 HTTP로 불러요. 재고 서버는 자기 DB에서 재고를 줄이고 커밋한 뒤 응답해요. 그다음 payment.approve가 예외를 던지면 재고 서버의 재고는?
    code: |-
      @Transactional
      void order(long itemId, int qty) {
        orders.save(new Order(itemId, qty));
        stockClient.decrease(itemId, qty);
        payment.approve(itemId, qty);
      }
    choices:
      - 주문 서버의 롤백과 함께 되돌아간다
      - 줄어든 채로 남는다
      - 재고 서버가 기다렸다가 알아서 되돌린다
      - 두 배로 줄어든다
    answer: "2"
    explanation: |-
      **줄어든 채로 남아요.** @Transactional은 주문 서버의 DB 연결 하나의 트랜잭션이라 다른 서버의 DB에 닿지 않아요.

      - 테스트에서 주문은 0건(롤백), 재고는 10에서 8로 남았어요
      - 보상 요청이나 메시지로 맞춰요
    source: https://martinfowler.com/articles/microservices.html
  - key: ms-member-point
    concept: core
    coreQuestion: q3
    type: multiple_choice
    status: draft
    difficulty: 2
    body: 회원 서버가 탈퇴한 회원을 지우고 커밋한 뒤, 포인트 서버에 포인트 삭제를 요청했는데 포인트 서버가 실패했어요. 맞는 설명은?
    choices:
      - 회원 서버의 @Transactional이 포인트 서버까지 묶어 회원 삭제가 되돌아간다
      - 회원 삭제는 이미 커밋됐다. 포인트 삭제를 다시 시도하거나 보상을 설계해야 한다
      - 포인트 서버가 실패하면 회원 서버도 자동으로 실패한다
      - 두 서버가 같은 DB를 쓰면 이런 일이 없으니 DB를 합치는 것이 정답이다
    answer: "2"
    explanation: |-
      **회원 삭제는 이미 커밋돼서 한쪽만 성공한 상태예요.** 서비스마다 DB와 트랜잭션이 따로예요.

      - 다시 시도하거나 보상(되돌리는 요청)으로 맞춰요
      - DB를 함께 쓰면 두 서비스를 함께 배포해야 해서 나눈 의미가 사라져요
    source: https://martinfowler.com/articles/microservices.html
  # ── 질문 4 ──
  - key: ms-module-repo
    concept: core
    coreQuestion: q4
    type: code_predict
    status: draft
    difficulty: 1
    body: 모듈러 모놀리스에서 order와 stock은 서로 다른 모듈이에요. 아래 코드는 무엇을 어겼나요?
    code: |-
      package com.shop.order;

      @Service
      class OrderService {
        private final StockRepository stock;
        ...
      }
    choices:
      - 아무것도 어기지 않았다
      - 모듈의 경계. 재고 모듈의 공개 서비스(StockService)로 불러야 한다
      - 계층의 방향. 서비스가 리포지토리를 부르면 안 된다
      - "@Service를 붙이면 안 된다"
    answer: "2"
    explanation: |-
      **모듈의 경계를 어겼어요.** 다른 모듈의 리포지토리를 직접 쓰면 두 모듈이 얽혀요.

      - 공개한 서비스로만 부르면 나중에 그 서비스를 HTTP 클라이언트로 바꿔 떼어 낼 수 있어요
      - 자기 모듈의 리포지토리를 부르는 것은 괜찮아요
    source: https://martinfowler.com/bliki/MonolithFirst.html
  - key: ms-video-split
    concept: core
    coreQuestion: q4
    type: multiple_choice
    status: draft
    difficulty: 2
    body: 동영상 서비스에서 업로드한 영상을 변환하는 기능만 CPU를 많이 써서, 변환이 몰리면 재생 API까지 느려져요. 팀은 하나예요. 가장 알맞은 판단은?
    choices:
      - 나눌 신호가 아니다. 서버 한 대를 더 크게만 만든다
      - 나눌 신호다. 변환 기능만 따로 늘려야 해서 그 기능을 떼어 낸다
      - 모든 기능을 서비스로 잘게 나눈다
      - 재생 API를 지운다
    answer: "2"
    explanation: |-
      **나눌 신호예요.** 한 기능만 따로 늘려야 하고, 그 기능의 부하가 다른 기능을 멈추게 해요.

      - 변환 기능만 떼어 내면 그것만 늘리고 재생 API는 영향받지 않아요
      - 모든 기능을 잘게 나눌 이유는 없어요
    source: https://martinfowler.com/articles/microservices.html
  # ── 네 질문을 하나로 ──
  - key: ms-interview
    concept: core
    coreQuestion: all
    type: descriptive
    status: draft
    difficulty: 2
    body: 면접에서 "모놀리스와 마이크로서비스는 무엇이 다르고, 언제 나누나요?"라는 질문을 받았어요. 1분 안에 답해 보세요.
    explanation: |-
      **한 덩어리로 배포하느냐 기능별로 따로 배포하느냐가 다르고, 팀과 배포가 서로를 막을 때 나눠요.**

      - **모놀리스:** 호출이 빠르고 트랜잭션 하나. 커지면 배포, 늘리기, 장애, 팀이 묶인다
      - **마이크로서비스:** 따로 배포하고 늘린다. 호출이 느리고 실패하며 장애가 번진다. 타임아웃을 둔다
      - **트랜잭션:** 서비스마다 DB가 따로라 묶을 수 없다. 보상이나 메시지로 맞춘다
      - **언제:** 나눌 신호가 있을 때. 그 전에는 모듈러 모놀리스로 경계를 지킨다
    checklist:
      - 모놀리스와 마이크로서비스의 정의를 말했다
      - 마이크로서비스의 얻는 것과 잃는 것을 하나 이상씩 말했다
      - 서비스를 나누면 트랜잭션을 하나로 묶을 수 없다고 말했다
      - 나눌 신호를 말했다
      - 모듈러 모놀리스를 말했다
    source: https://martinfowler.com/articles/microservices.html
