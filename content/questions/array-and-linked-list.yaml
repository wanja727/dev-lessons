lesson:
  key: array-and-linked-list
  title: 배열과 연결 리스트
  unit: 자료구조와 알고리즘
  order: 202
concepts:
  - key: core
    name: 배열과 연결 리스트
coreQuestions:
  - key: q1
    text: "ArrayList는 크기가 정해진 배열로 어떻게 계속 늘어나나요?"
  - key: q2
    text: "중간에 넣으면 ArrayList와 LinkedList는 각각 무엇을 하나요?"
  - key: q3
    text: "그러면 LinkedList는 언제 더 빠른가요?"
questions:
  # ── 질문 1 ──
  - key: al-capacity-16
    concept: core
    coreQuestion: q1
    type: code_predict
    status: reviewed
    difficulty: 1
    body: 빈 ArrayList에 숫자 16개를 넣었어요. 다 넣은 뒤 ArrayList가 안에 가진 배열의 길이는 얼마일까요? (자바 21)
    code: |-
      List<Integer> list = new ArrayList<>();
      for (int i = 1; i <= 16; i++) {
        list.add(i);
      }
    choices:
      - "16"
      - "20"
      - "22"
      - "32"
    answer: "3"
    explanation: |-
      **22예요.** 배열이 차면 지금 길이의 절반을 더해 1.5배로 늘려요.

      - 처음 add에서 10칸이 생겨요
      - 열한 번째에서 15칸, 열여섯 번째에서 15 + 7 = 22칸이 돼요
      - 늘릴 때마다 새 배열을 만들고 원소를 모두 옮겨요
    source: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/ArrayList.html
  - key: al-presized
    concept: core
    coreQuestion: q1
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: new ArrayList<>(100)으로 만든 리스트에 원소 100개를 넣었어요. 그동안 안쪽 배열을 새로 만들어 원소를 옮긴 횟수는 몇 번일까요?
    choices:
      - 0번
      - 1번
      - 6번
      - 100번
    answer: "1"
    explanation: |-
      **0번이에요.** 처음부터 길이 100의 배열을 만들어서 100개가 모두 빈 칸에 들어가요.

      - 배열을 새로 만드는 것은 빈 칸이 없을 때뿐이에요
      - 용량을 주지 않았다면 10, 15, 22, ... 로 여러 번 옮겼을 거예요
    source: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/ArrayList.html
  # ── 질문 2 ──
  - key: al-add-front-shift
    concept: core
    coreQuestion: q2
    type: multiple_choice
    status: reviewed
    difficulty: 1
    body: 원소 1,000개가 든 ArrayList에서 list.add(0, x)를 해요. 이미 있던 원소 가운데 몇 개가 자리를 옮길까요?
    choices:
      - 0개
      - 1개
      - 500개
      - 1,000개
    answer: "4"
    explanation: |-
      **1,000개예요.** 배열은 칸이 이어 붙어 있어 사이에 빈 칸을 만들 수 없어서, 넣는 자리 뒤의 원소를 모두 한 칸씩 밀어요.

      - 0번 자리면 모든 원소가 밀려서 O(n)이에요
      - 맨 뒤에 넣으면 하나도 밀리지 않아요
    source: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/ArrayList.html
  - key: al-linked-get
    concept: core
    coreQuestion: q2
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: 원소 1,000개가 든 LinkedList에서 get(500)을 불러요. 이 연산이 O(1)이 아닌 이유는 무엇일까요?
    choices:
      - 노드가 이어 붙어 있지 않아 위치를 계산할 수 없고, 끝에서부터 노드를 따라가야 해서
      - 뒤의 원소 500개를 한 칸씩 당겨야 해서
      - 안쪽 배열이 모자라 새로 만들어야 해서
      - 노드를 찾을 때마다 정렬해야 해서
    answer: "1"
    explanation: |-
      **노드를 따라가야 하기 때문이에요.** LinkedList는 배열을 쓰지 않고 노드를 참조로 이어서, 노드가 메모리에 흩어져 있어요.

      - "시작 위치 + i × 칸 크기" 같은 계산을 할 수 없어요
      - 가까운 쪽 끝에서 next나 prev를 하나씩 따라가서 O(n)이에요
      - 미는 것은 ArrayList가 중간에 넣을 때 하는 일이에요
    source: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/LinkedList.html
  # ── 질문 3 ──
  - key: al-front-insert-winner
    concept: core
    coreQuestion: q3
    type: code_predict
    status: reviewed
    difficulty: 1
    body: 아래 코드를 ArrayList와 LinkedList로 각각 돌려요. 어느 쪽이 빨리 끝나고, 왜 그럴까요?
    code: |-
      for (int i = 0; i < 100_000; i++) {
        list.add(0, i);
      }
    choices:
      - ArrayList. get(i)가 O(1)이라서
      - LinkedList. ArrayList는 넣을 때마다 모든 원소를 한 칸씩 민다
      - 둘이 같다. 둘 다 add는 O(1)이다
      - LinkedList. ArrayList는 넣을 때마다 배열을 새로 만든다
    answer: "2"
    explanation: |-
      **LinkedList가 빨라요.** 맨 앞에 넣기는 LinkedList만 O(1)이에요.

      - ArrayList는 넣을 때마다 지금까지 넣은 것을 모두 밀어서 전체가 O(n²)이에요
      - 배열을 새로 만드는 것은 빈 칸이 없을 때뿐이라 가끔이에요
    source: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/LinkedList.html
  - key: al-read-all-choice
    concept: core
    coreQuestion: q3
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: 조회한 상품 1만 개를 리스트에 차례로 담고, 화면에 그리며 처음부터 끝까지 한 번 읽어요. 어느 리스트가 맞을까요?
    choices:
      - LinkedList. 넣는 일이 많아서
      - ArrayList. 뒤에 넣기와 차례로 읽기는 비슷하고, LinkedList는 원소마다 노드 메모리를 더 쓴다
      - LinkedList. 노드로 이어서 차례로 읽기가 늘 더 빠르다
      - LinkedList. 노드가 흩어져 있어 캐시를 잘 탄다
    answer: "2"
    explanation: |-
      **ArrayList예요.** 맨 앞에서 넣고 빼는 일이 없으면 LinkedList를 쓸 이유가 없어요.

      - 뒤에 넣기는 둘 다 O(1), 차례로 읽기는 둘 다 O(n)이라 시간은 비슷해요
      - LinkedList는 원소마다 노드 객체와 참조 둘을 더 써요
      - 나중에 get(i)가 필요해지면 ArrayList는 O(1), LinkedList는 O(n)이에요
    source: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/ArrayList.html
  - key: al-get-loop-linked
    concept: core
    coreQuestion: q3
    type: code_predict
    status: reviewed
    difficulty: 2
    body: List로 받은 ids를 아래처럼 돌아요. ids가 원소 n개의 LinkedList면 이 반복의 시간 복잡도는 무엇일까요?
    code: |-
      for (int i = 0; i < ids.size(); i++) {
        process(ids.get(i));
      }
    choices:
      - O(1)
      - O(n)
      - O(n log n)
      - O(n²)
    answer: "4"
    explanation: |-
      **O(n²)이에요.** LinkedList.get(i)는 매번 끝에서부터 노드를 따라가는 O(n)이고, 그것을 n번 불러요.

      - ArrayList였다면 get(i)가 O(1)이라 O(n)이에요
      - 향상된 for(for (Long id : ids))로 돌면 반복자가 다음 노드로 넘어가서 어느 리스트든 O(n)이에요
    source: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/LinkedList.html
  # ── 세 질문을 하나로 ──
  - key: al-interview
    concept: core
    coreQuestion: all
    type: descriptive
    status: reviewed
    difficulty: 2
    body: 면접에서 "ArrayList와 LinkedList의 차이는 무엇이고, 무엇을 쓰나요?"라는 질문을 받았어요. 1분 안에 답해 보세요.
    explanation: |-
      **ArrayList는 배열 하나로, LinkedList는 노드를 이어 만든 리스트이고, 대부분 ArrayList를 써요.**

      - **ArrayList:** 차면 1.5배 큰 배열로 옮긴다. get(i)는 O(1), 뒤에 넣기는 분할 상환 O(1), 중간과 맨 앞은 뒤를 밀어 O(n)
      - **LinkedList:** 넣고 빼는 것 자체는 O(1)이지만 그 자리까지 따라가서 get(i)와 가운데 넣기는 O(n)
      - **실제로:** LinkedList는 노드마다 메모리를 더 쓰고 get(i)가 느려서 대부분 ArrayList를 쓴다. 맨 앞을 자주 다루면 ArrayDeque
    checklist:
      - ArrayList는 배열이 차면 더 큰 배열로 옮긴다고 말했다
      - ArrayList의 get(i)는 O(1), 중간이나 맨 앞에 넣기는 뒤를 밀어 O(n)이라고 말했다
      - LinkedList는 노드를 참조로 잇고, 그 자리까지 따라가야 해서 get(i)가 O(n)이라고 말했다
      - LinkedList는 맨 앞에서 넣고 빼는 것이 O(1)이라고 말했다
      - LinkedList는 노드마다 메모리를 더 써서 대부분 ArrayList를 쓴다고 말했다
    source: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/LinkedList.html
