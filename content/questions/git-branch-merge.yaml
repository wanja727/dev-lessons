# Git 브랜치와 병합 문제
# 형식: https://github.com/wanja727/retrievo/blob/main/docs/content-format.md
#
# 모든 문제는 coreQuestions의 질문 하나에 묶이고(coreQuestion), 답의 근거가 레슨 본문에 있다
# (site/src/content/lesson-pages/git-branch-merge.yaml의 says).
# 동작에 관한 정답은 verification의 GitBranchMergeTest로 확인했다 (Git 2.4x).
# 질문마다 첫 문제는 본문의 예시로 묻고, 둘째 문제는 다른 상황으로 옮겨 묻는다.
# 2026-11-25에 만들고 같은 날 검수해 reviewed로 바꿨다.
subject:
  key: dev
  name: 개발자 면접
lesson:
  key: git-branch-merge
  title: Git 브랜치와 병합
  unit: 테스트와 운영
  order: 901
concepts:
  - key: core
    name: Git 브랜치와 병합
coreQuestions:
  - key: q1
    text: "브랜치는 무엇인가요?"
  - key: q2
    text: "merge는 두 브랜치를 어떻게 합치나요?"
  - key: q3
    text: "rebase는 merge와 무엇이 다른가요?"
  - key: q4
    text: "충돌은 언제 생기고 어떻게 푸나요?"
  - key: q5
    text: "팀은 브랜치를 어떻게 나눠 쓰나요?"
questions:
  # ── 질문 1 ──
  - key: git-ref-unchanged
    concept: core
    coreQuestion: q1
    type: multiple_choice
    status: reviewed
    difficulty: 1
    body: main에서 feature/coupon 브랜치를 만들고 feature/coupon으로 옮겨 커밋을 하나 했어요. .git/refs/heads/main 파일의 내용은 어떻게 될까요?
    choices:
      - 새 커밋의 해시로 바뀐다
      - 그대로다
      - 파일이 지워진다
      - feature/coupon을 가리키는 줄이 더해진다
    answer: "2"
    explanation: |-
      **그대로예요.** 커밋하면 HEAD가 가리키는 지금 브랜치(feature/coupon)의 파일만 새 해시로 바뀌어요.

      - 브랜치 파일에는 커밋 해시 한 줄만 들어 있어요
      - 다른 브랜치의 이름표는 움직이지 않아요
    source: https://git-scm.com/book/en/v2/Git-Branching-Branches-in-a-Nutshell
  - key: git-branch-cost
    concept: core
    coreQuestion: q1
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: 파일이 2GB인 저장소에서 git branch hotfix로 브랜치를 새로 하나 만들었어요. 디스크에는 무엇이 새로 생길까요?
    choices:
      - 저장소 파일 전체의 복사본 2GB
      - 마지막 커밋에서 바뀐 파일만큼의 복사본
      - 커밋 해시 한 줄이 든 파일 하나
      - 아무것도 생기지 않는다
    answer: "3"
    explanation: |-
      **커밋 해시 한 줄이 든 파일 하나예요.** 브랜치는 커밋을 가리키는 이름표라 .git/refs/heads/hotfix 파일만 생겨요.

      - 파일을 복사하지 않아서 저장소가 커도 브랜치는 바로 만들어져요
    source: https://git-scm.com/book/en/v2/Git-Branching-Branches-in-a-Nutshell
  # ── 질문 2 ──
  - key: git-ff-no-commit
    concept: core
    coreQuestion: q2
    type: multiple_choice
    status: reviewed
    difficulty: 1
    body: main에 커밋 1개가 있을 때 feature/coupon을 따서 커밋 2개를 했어요. 그사이 main에는 아무도 커밋하지 않았어요. main에서 git merge feature/coupon을 하면 main의 커밋은 몇 개가 될까요?
    choices:
      - 3개. 이름표만 앞으로 옮긴다
      - 4개. 병합 커밋이 하나 생긴다
      - 2개. 쿠폰 커밋으로 바뀐다
      - 5개. 커밋이 복사된다
    answer: "1"
    explanation: |-
      **3개예요.** main이 움직이지 않았으면 fast-forward라서 main 이름표를 쿠폰의 마지막 커밋으로 옮길 뿐 새 커밋이 없어요.

      - 병합 커밋은 두 줄기가 갈라졌을 때만 생겨요
    source: https://git-scm.com/docs/git-merge
  - key: git-merge-parents
    concept: core
    coreQuestion: q2
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: develop과 feature/search가 갈라진 뒤 develop에서 git merge feature/search로 병합 커밋 M을 만들었어요. git cat-file -p M을 열면 parent 줄은 무엇일까요?
    choices:
      - 한 줄. feature/search의 끝
      - 두 줄. 병합 전 develop의 끝과 feature/search의 끝
      - 세 줄. 공통 조상과 두 끝
      - 없다. 병합 커밋은 부모가 없다
    answer: "2"
    explanation: |-
      **두 줄이에요.** 병합 커밋의 부모는 합친 두 줄기의 끝이에요.

      - 공통 조상은 무엇이 바뀌었는지 비교할 때만 써요(3-way 병합)
    source: https://git-scm.com/docs/git-merge
  # ── 질문 3 ──
  - key: git-rebase-hash
    concept: core
    coreQuestion: q3
    type: ox
    status: reviewed
    difficulty: 1
    body: feature/coupon의 쿠폰 커밋 2개를 git rebase main으로 main 위에 다시 쌓았어요. 메시지와 바뀐 내용이 같으니 쿠폰 커밋의 해시도 rebase 전과 같다.
    answer: "X"
    explanation: |-
      **틀렸어요. 해시가 바뀌어요.** rebase는 커밋을 옮기지 않고 상대 브랜치 끝에 다시 적용해 새 커밋을 만들어요.

      - 부모가 달라졌으니 내용이 같아도 다른 커밋이에요
    source: https://git-scm.com/book/en/v2/Git-Branching-Rebasing
  - key: git-rebase-shared
    concept: core
    coreQuestion: q3
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: 동료와 함께 쓰는 release/1.2 브랜치를 원격에서 받은 뒤, 로컬에서 rebase하고 git push를 했어요. 어떻게 될까요?
    choices:
      - 그대로 올라간다
      - 거절된다. 원격의 커밋이 내 기록에 없다
      - 원격이 자동으로 merge한다
      - 동료의 커밋만 지워지고 올라간다
    answer: "2"
    explanation: |-
      **거절돼요(non-fast-forward).** rebase로 커밋을 새로 만들어서 원격의 옛 커밋과 내 기록이 갈라졌어요.

      - 여기서 --force로 밀면 동료가 그 브랜치에 올린 커밋이 원격에서 사라질 수 있어요
      - 그래서 함께 쓰는 브랜치는 rebase하지 않아요
    source: https://git-scm.com/book/en/v2/Git-Branching-Rebasing
  - key: git-revert-pushed
    concept: core
    coreQuestion: q3
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: 배송비를 0원으로 바꾼 실수 커밋을 이미 main에 push했고 동료들도 받았어요. 실수를 되돌리는 방법으로 가장 맞는 것은?
    choices:
      - git reset --hard HEAD~1 뒤 git push --force
      - git revert로 되돌리는 커밋을 만들어 push
      - 실수 커밋의 브랜치를 지운다
      - git rebase로 실수 커밋을 빼고 push
    answer: "2"
    explanation: |-
      **revert예요.** 실수 커밋의 변경을 거꾸로 적용한 새 커밋을 만들어서 기록을 지우지 않아요.

      - reset과 force push는 남이 받은 기록을 바꿔서 실수 커밋이 다시 살아나거나 동료의 커밋이 사라질 수 있어요
    source: https://git-scm.com/docs/git-revert
  # ── 질문 4 ──
  - key: git-conflict-head
    concept: core
    coreQuestion: q4
    type: multiple_choice
    status: reviewed
    difficulty: 1
    body: main에서 git merge feature/coupon을 했더니 충돌한 파일에 아래 내용이 생겼어요. int fee = 3000; 은 누구의 내용일까요?
    code: |-
      <<<<<<< HEAD
      int fee = 3000;
      =======
      int fee = 2500;
      >>>>>>> feature/coupon
    choices:
      - merge를 실행한 main의 내용
      - feature/coupon의 내용
      - 두 브랜치의 공통 조상의 내용
      - Git이 고른 정답
    answer: "1"
    explanation: |-
      **main의 내용이에요.** HEAD는 지금 브랜치라서, <<<<<<< HEAD부터 =======까지가 merge를 실행한 쪽이에요.

      - ======= 아래부터 >>>>>>>까지가 합치려는 feature/coupon의 내용이에요
      - 표시 줄을 지우고 남길 내용으로 고친 뒤 git add와 커밋으로 마쳐요
    source: https://git-scm.com/docs/git-merge
  - key: git-conflict-apart
    concept: core
    coreQuestion: q4
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: 한 브랜치는 Coupon.java의 10번째 줄을, 다른 브랜치는 같은 파일의 80번째 줄을 고쳤어요. 두 브랜치를 merge하면 어떻게 될까요?
    choices:
      - 같은 파일을 고쳤으니 충돌한다
      - 충돌 없이 두 변경이 모두 담긴다
      - 나중에 커밋한 쪽의 파일로 덮어쓴다
      - merge가 거절된다
    answer: "2"
    explanation: |-
      **충돌 없이 둘 다 담겨요.** Git은 줄 단위로 비교해서 한쪽만 바꾼 줄은 그 변경을 그대로 가져와요.

      - 충돌은 같은 줄이나 붙어 있는 줄을 양쪽이 다르게 바꿨을 때만 생겨요
      - 충돌이 없어도 코드의 뜻은 깨질 수 있으니 합친 뒤 테스트를 돌려요
    source: https://git-scm.com/docs/git-merge
  # ── 질문 5 ──
  - key: git-github-flow-main
    concept: core
    coreQuestion: q5
    type: multiple_choice
    status: reviewed
    difficulty: 1
    body: GitHub flow로 일하는 팀에서 main 브랜치는 어떤 상태여야 할까요?
    choices:
      - 다음 릴리스를 모으는 중이라 깨져 있어도 된다
      - 언제든 배포할 수 있는 상태
      - 배포가 끝난 커밋만 일주일에 한 번 모은다
      - 개발자마다 직접 push하는 작업 공간
    answer: "2"
    explanation: |-
      **언제든 배포할 수 있는 상태예요.** 기능은 짧은 브랜치에서 만들고, PR로 리뷰와 CI를 통과한 것만 main에 합쳐요.

      - 브랜치 보호 규칙으로 직접 push를 막고 리뷰와 CI 통과를 요구해요
    source: https://docs.github.com/en/get-started/using-github/github-flow
  - key: git-long-branch
    concept: core
    coreQuestion: q5
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: 검색 기능 브랜치를 3주째 main에 합치지 않았고, 그사이 main에 커밋 120개가 올라왔어요. 합칠 때 예상되는 일과 앞으로 줄이는 방법으로 맞는 것은?
    choices:
      - 커밋이 많을수록 Git이 더 잘 합쳐서 문제없다
      - 같은 줄을 따로 고친 곳이 많아 충돌이 커진다. 작게 나눠 자주 합친다
      - 충돌은 브랜치 이름이 같을 때만 생긴다
      - 3주가 지난 브랜치는 Git이 자동으로 지운다
    answer: "2"
    explanation: |-
      **충돌이 커져요.** 브랜치가 오래 살수록 그사이 main에 쌓인 변경과 같은 줄을 고칠 일이 많아져요.

      - 작게 나눠 자주 합치는 것이 충돌을 줄이는 가장 쉬운 방법이에요
    source: https://trunkbaseddevelopment.com/
  # ── 면접 ──
  - key: git-interview
    concept: core
    coreQuestion: all
    type: descriptive
    status: reviewed
    difficulty: 2
    body: 면접에서 "merge와 rebase의 차이를 설명하고, 충돌은 언제 생기는지 말해 주세요"라는 질문을 받았어요. 1분 안에 답해 보세요.
    explanation: |-
      **merge는 두 줄기를 합치는 커밋을 만들거나 이름을 옮기고, rebase는 내 커밋을 상대 끝에 새로 다시 만들어요.**

      - **브랜치:** 커밋 하나를 가리키는 이름
      - **merge:** 앞서 있으면 fast-forward, 갈라졌으면 부모 둘인 병합 커밋
      - **rebase:** 해시가 바뀌고 기록이 한 줄. 올린 커밋에는 쓰지 않는다
      - **충돌:** 같은 줄을 다르게 고쳤을 때. 고르고 add, 커밋
      - **실무:** 올린 커밋은 revert, force는 force-with-lease, 짧은 브랜치
    checklist:
      - 브랜치가 커밋을 가리키는 이름이라고 말했다
      - fast-forward와 병합 커밋의 차이를 말했다
      - rebase가 커밋을 새로 만들어 해시가 바뀐다고 말했다
      - 이미 push한 브랜치를 rebase하면 안 되는 이유를 말했다
      - 충돌이 같은 줄을 다르게 고쳤을 때 생긴다고 말했다
    source: https://git-scm.com/book/en/v2/Git-Branching-Rebasing
