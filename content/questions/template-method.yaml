# 템플릿 메서드 패턴 문제
# 형식: https://github.com/wanja727/retrievo/blob/main/docs/content-format.md
#
# 모든 문제는 coreQuestions의 질문 하나에 묶이고(coreQuestion), 답의 근거가 레슨 본문에 있다
# (site/src/content/lesson-pages/template-method.yaml의 says).
# 동작에 관한 정답은 verification의 TemplateMethodTest로 확인했다 (자바 21, 스프링 프레임워크 6.2).
# 질문마다 첫 문제는 본문의 예시로 묻고, 둘째 문제는 다른 상황으로 옮겨 묻는다.
subject:
  key: dev
  name: 개발자 면접
lesson:
  key: template-method
  title: 템플릿 메서드 패턴
  unit: 객체지향 설계와 패턴
  order: 308
concepts:
  - key: core
    name: 템플릿 메서드 패턴
coreQuestions:
  - key: q1
    text: "템플릿 메서드 패턴은 무엇인가요?"
  - key: q2
    text: "뼈대는 왜 추상 클래스에 두고, 무엇을 막아 두나요?"
  - key: q3
    text: "템플릿 메서드와 전략 패턴은 무엇이 다른가요?"
questions:
  # ── 질문 1 ──
  - key: tm-html-export
    concept: core
    coreQuestion: q1
    type: code_predict
    status: draft
    difficulty: 1
    body: 부모 OrderExporter의 final export()가 header(), 주문마다 row(o), footer() 순서로 글을 이어 붙여요. footer()의 기본값은 빈 글이에요. 아래 HtmlExporter로 주문 두 건(id 1, 2)을 내보내면 결과는?
    code: |-
      class HtmlExporter extends OrderExporter {
        protected String header() {
          return "<table>";
        }
        protected String row(Order o) {
          return "<tr>" + o.id() + "</tr>";
        }
        protected String footer() {
          return "</table>";
        }
      }
    choices:
      - <table><tr>1</tr><tr>2</tr></table>
      - <tr>1</tr><tr>2</tr>
      - <table><tr>1</tr><tr>2</tr>
      - 컴파일 오류
    answer: "1"
    explanation: |-
      **<table><tr>1</tr><tr>2</tr></table>예요.** 순서는 부모의 export가 정하고, HtmlExporter는 각 단계의 모양만 채워요.

      - footer를 채우지 않았다면 부모의 기본값(빈 글)이 붙어요
  - key: tm-settlement
    concept: core
    coreQuestion: q1
    type: multiple_choice
    status: draft
    difficulty: 2
    body: 정산 배치의 부모 SettlementJob.run()이 "데이터 읽기, 계산, 저장, 알림" 순서를 정하고, 카드 정산과 계좌 정산은 calculate()만 다르게 채워요. "저장 전에 검증 단계를 넣는다"는 요구가 오면 어디를 고칠까요?
    choices:
      - 부모의 run() 하나
      - 카드 정산과 계좌 정산 두 클래스
      - 두 클래스의 calculate()
      - 세 클래스 모두
    answer: "1"
    explanation: |-
      **부모의 run() 하나예요.** 순서는 템플릿 메서드에 있어서, 순서에 대한 요구는 부모만 고쳐요.

      - 자식은 단계만 채우고 순서를 다시 쓰지 않아요
  # ── 질문 2 ──
  - key: tm-override-final
    concept: core
    coreQuestion: q2
    type: code_predict
    status: draft
    difficulty: 1
    body: 부모 OrderExporter의 export는 final이에요. 자식이 아래처럼 export를 다시 쓰면 어떻게 될까요?
    code: |-
      class CsvExporter extends OrderExporter {
        ...
        String export(List<Order> os) {
          return "순서를 바꿨다";
        }
      }
    choices:
      - 자식의 export가 실행된다
      - 컴파일 오류
      - 부모의 export가 실행된다
    answer: "2"
    explanation: |-
      **컴파일 오류예요.** final 메서드는 자식이 오버라이드할 수 없어요.

      - 순서를 지키는 것이 이 패턴의 목적이라 템플릿 메서드를 final로 막아요
  - key: tm-default-final
    concept: core
    coreQuestion: q2
    type: multiple_choice
    status: draft
    difficulty: 2
    body: 뼈대 메서드를 추상 클래스 대신 인터페이스의 default 메서드로 두면 무엇이 달라질까요?
    choices:
      - 달라지는 것이 없다
      - default 메서드에는 final을 붙일 수 없어서, 구현 클래스가 뼈대를 덮어써 순서를 바꿀 수 있다
      - 구현 클래스가 단계 메서드를 채우지 않아도 된다
      - 단계 메서드를 protected로 숨길 수 있다
    answer: "2"
    explanation: |-
      **구현이 뼈대를 덮어쓸 수 있어요.** 인터페이스 메서드에는 final을 쓸 수 없어요.

      - 인터페이스 메서드는 public이라 단계를 protected로 숨길 수도 없어요
      - 그래서 순서를 막아 두려면 추상 클래스에 final 템플릿 메서드를 둬요
    source: https://docs.oracle.com/javase/specs/jls/se21/html/jls-9.html#jls-9.4
  # ── 질문 3 ──
  - key: tm-class-count
    concept: core
    coreQuestion: q3
    type: multiple_choice
    status: draft
    difficulty: 1
    body: 내보내기 형식 셋(CSV, HTML, 엑셀)과 압축 셋(없음, gzip, zip)을 모두 조합해서 고를 수 있게 하려 해요. 템플릿 메서드로 하면 자식 클래스가 몇 개, 형식과 압축을 각각 전략으로 받으면 구현 클래스가 몇 개 필요할까요?
    choices:
      - 9개, 6개
      - 6개, 9개
      - 6개, 6개
      - 9개, 9개
    answer: "1"
    explanation: |-
      **9개와 6개예요.** 템플릿 메서드는 조합마다 자식이 필요해서 3 곱하기 3이고, 전략은 형식 3개와 압축 3개를 따로 만들어 넣어요.

      - 바뀌는 축이 둘 이상이면 전략이 나아요
  - key: tm-which-feature
    concept: core
    coreQuestion: q3
    type: multiple_choice
    status: draft
    difficulty: 2
    body: 다음 가운데 템플릿 메서드 패턴의 특징은 무엇일까요?
    choices:
      - 실행 중에 방법을 바꿔 끼운다
      - 상속으로 단계를 채우고 순서는 부모가 정한다
      - 바뀌는 부분을 생성자로 받는다
      - 공개 인터페이스에만 기대서 부모의 내부를 몰라도 된다
    answer: "2"
    explanation: |-
      **상속으로 단계를 채우고 순서는 부모가 정해요.** 나머지는 전략 패턴(조합)의 특징이에요.

      - 템플릿 메서드는 객체를 만들 때 자식이 정해지고 부모의 내부에 묶여요
  - key: tm-filter-override
    concept: core
    coreQuestion: q3
    type: multiple_choice
    status: draft
    difficulty: 2
    body: 스프링 6.2에서 OncePerRequestFilter를 상속한 필터가 doFilterInternal 대신 doFilter를 오버라이드하고, 그 안에서 로그를 남긴 뒤 chain.doFilter를 불러요. 같은 요청 안에서 필터가 두 번 불리면(포워드) 어떻게 될까요?
    choices:
      - 컴파일 오류. doFilter는 final이다
      - 로그가 한 번 남는다. 부모가 한 번만 실행하게 막는다
      - 로그가 두 번 남고 doFilterInternal은 불리지 않는다
    answer: "3"
    explanation: |-
      **로그가 두 번 남아요.** doFilter는 final이 아니라서 덮어쓸 수 있고, 덮어쓰면 "이미 실행했나"를 확인하는 부모의 뼈대가 사라져요.

      - 자식은 doFilterInternal만 채워야 해요
    source: https://docs.spring.io/spring-framework/docs/current/javadoc-api/org/springframework/web/filter/OncePerRequestFilter.html
  # ── 세 질문을 하나로 ──
  - key: tm-interview
    concept: core
    coreQuestion: all
    type: descriptive
    status: draft
    difficulty: 2
    body: 면접에서 "템플릿 메서드 패턴을 설명하고, 전략 패턴과 비교해 주세요"라는 질문을 받았어요. 1분 안에 답해 보세요.
    explanation: |-
      **부모가 순서를 정하고 자식이 단계를 채우는 상속 패턴이고, 전략은 같은 일을 조합으로 해요.**

      - **구조:** final 템플릿 메서드가 순서를 정하고, protected abstract 단계와 훅을 자식이 채운다
      - **효과:** 순서에 대한 요구는 부모 한 곳에서 고친다
      - **추상 클래스:** default 메서드는 final을 붙일 수 없어서 뼈대는 추상 클래스에 둔다
      - **비교:** 템플릿 메서드는 만들 때 정해지고 부모에 묶인다. 축이 둘이면 곱만큼 늘어 전략이 낫다
    checklist:
      - 부모의 메서드가 순서를 정하고 자식이 단계를 채운다고 말했다
      - 템플릿 메서드를 final로 막는다고 말했다
      - 순서에 대한 변경을 부모 한 곳에서 한다고 말했다
      - 템플릿 메서드는 상속, 전략은 조합이라는 차이를 말했다
      - 바뀌는 축이 여럿이면 전략이 낫다고 말했다
