# cascade와 orphanRemoval 문제
# 형식: https://github.com/wanja727/retrievo/blob/main/docs/content-format.md
#
# 모든 문제는 coreQuestions의 질문 하나에 묶이고(coreQuestion), 답의 근거가 레슨 본문에 있다
# (site/src/content/lesson-pages/cascade-orphan.yaml의 says).
# 동작에 관한 정답은 verification의 CascadeOrphanTest로 확인했다 (Hibernate 6.6, PostgreSQL 16).
# 질문마다 첫 문제는 본문의 예시로 묻고, 둘째 문제는 다른 상황으로 옮겨 묻는다.
# 2026-11-25에 만들고 같은 날 검수해 reviewed로 바꿨다.
subject:
  key: dev
  name: 개발자 면접
lesson:
  key: cascade-orphan
  title: cascade와 orphanRemoval
  unit: JPA
  order: 807
concepts:
  - key: core
    name: cascade와 orphanRemoval
coreQuestions:
  - key: q1
    text: "부모만 저장하면 자식은 어떻게 되나요?"
  - key: q2
    text: "부모를 지우면 자식은 어떻게 되나요?"
  - key: q3
    text: "컬렉션에서 자식을 빼면 어떻게 되나요?"
  - key: q4
    text: "cascade와 orphanRemoval은 언제 쓰나요?"
questions:
  # ── 질문 1 ──
  - key: cas-no-cascade-insert
    concept: core
    coreQuestion: q1
    type: multiple_choice
    status: reviewed
    difficulty: 1
    body: Order.items는 @OneToMany(mappedBy = "order")이고 cascade가 없어요. 새 주문에 새 상품 셋을 addItem(양쪽을 맞추는 편의 메서드)으로 넣고 em.persist(order)만 한 뒤 커밋했어요. order_item 테이블의 행은 몇 개일까요?
    choices:
      - 0개
      - 3개
      - 커밋할 때 예외가 나서 주문도 없다
    answer: "1"
    explanation: |-
      **0개예요.** JPA는 엔티티를 하나씩 따로 저장해서, 주문만 persist하면 상품은 비영속으로 남아요.

      - 예외도 나지 않아서 놓치기 쉬워요
      - cascade = PERSIST나 ALL을 붙이면 상품도 저장돼요
    source: https://jakarta.ee/specifications/persistence/3.1/jakarta-persistence-spec-3.1.html
  - key: cas-persist-post
    concept: core
    coreQuestion: q1
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: Post.comments는 @OneToMany(mappedBy = "post", cascade = CascadeType.PERSIST)예요. 새 게시글에 새 댓글 둘을 addComment로 넣고 postRepository.save(post)만 불렀어요. 댓글 테이블에 나가는 INSERT는 몇 번일까요?
    choices:
      - 0번
      - 1번
      - 2번
    answer: "3"
    explanation: |-
      **2번이에요.** 부모를 저장할 때 cascade PERSIST가 컬렉션의 댓글에도 저장을 넘겨요.

      - 외래 키 post_id는 addComment가 댓글 쪽에 게시글을 넣어서 채워져요
    source: https://jakarta.ee/specifications/persistence/3.1/jakarta-persistence-spec-3.1.html
  # ── 질문 2 ──
  - key: cas-remove-fk
    concept: core
    coreQuestion: q2
    type: multiple_choice
    status: reviewed
    difficulty: 1
    body: cascade가 없는 주문에 상품 2개가 저장돼 있어요. 트랜잭션 안에서 em.remove(order)를 하고 커밋했어요. 어떻게 될까요?
    choices:
      - 주문과 상품이 모두 지워진다
      - 주문만 지워지고 상품의 order_id는 null이 된다
      - 외래 키 위반으로 실패해 주문도 그대로다
    answer: "3"
    explanation: |-
      **외래 키 위반으로 실패해요.** 상품 행이 아직 주문을 가리키는데 주문 행만 지우려 했어요.

      - cascade REMOVE가 있으면 상품을 먼저 지운 뒤 주문을 지워요
    source: https://jakarta.ee/specifications/persistence/3.1/jakarta-persistence-spec-3.1.html
  - key: cas-remove-count
    concept: core
    coreQuestion: q2
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: Post.comments에 cascade = REMOVE가 있고 게시글에 댓글이 5개 있어요. 게시글을 em.remove로 지우고 flush했어요. 나가는 DELETE는 모두 몇 번일까요?
    choices:
      - 1번
      - 2번
      - 6번
    answer: "3"
    explanation: |-
      **6번이에요.** cascade REMOVE는 댓글을 하나씩 엔티티로 지워서 댓글 DELETE 5번 뒤 게시글 DELETE 1번이 나가요.

      - 자식이 많으면 벌크 연산으로 한 번에 지워요
    source: https://jakarta.ee/specifications/persistence/3.1/jakarta-persistence-spec-3.1.html
  # ── 질문 3 ──
  - key: cas-orphan-delete
    concept: core
    coreQuestion: q3
    type: code_predict
    status: reviewed
    difficulty: 1
    body: Order.items는 @OneToMany(mappedBy = "order", cascade = ALL, orphanRemoval = true)이고 상품이 2개 있어요. 아래 코드가 flush할 때 나가는 SQL은 무엇일까요?
    code: |-
      Order order = em.find(Order.class, id);
      order.getItems().remove(0);
      em.flush();
    choices:
      - 없다
      - 뺀 상품의 DELETE
      - 뺀 상품의 order_id를 null로 바꾸는 UPDATE
      - 주문의 DELETE
    answer: "2"
    explanation: |-
      **뺀 상품의 DELETE가 나가요.** 부모와 연결이 끊긴 자식(고아)을 orphanRemoval이 지워요.

      - orphanRemoval이 없으면 SQL이 하나도 없어요
    source: https://jakarta.ee/specifications/persistence/3.1/jakarta-persistence-spec-3.1.html
  - key: cas-cascade-not-orphan
    concept: core
    coreQuestion: q3
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: Post.comments는 @OneToMany(mappedBy = "post", cascade = CascadeType.ALL)이고 orphanRemoval은 없어요. 트랜잭션 안에서 댓글 하나를 post.getComments().remove(c)로 뺐어요. 커밋 뒤 그 댓글 행은 어떻게 될까요?
    choices:
      - 지워진다
      - 그대로이고 post_id도 그대로다
      - post_id가 null이 된다
    answer: "2"
    explanation: |-
      **그대로예요.** 고아를 지우는 것은 orphanRemoval이고, mappedBy 쪽에서 빼는 것은 외래 키도 바꾸지 않아요.

      - cascade ALL은 부모에게 한 일을 넘길 뿐, 목록에서 빼는 것은 부모에게 한 일이 아니에요
    source: https://jakarta.ee/specifications/persistence/3.1/jakarta-persistence-spec-3.1.html
  - key: cas-replace-list
    concept: core
    coreQuestion: q3
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: orphanRemoval = true인 Order.items를 비우려고 order.setItems(new ArrayList<>())처럼 새 리스트로 바꿨어요. flush하면 어떻게 될까요?
    choices:
      - 상품이 모두 DELETE된다
      - 아무 일도 없다
      - Hibernate가 예외를 던진다
    answer: "3"
    explanation: |-
      **예외를 던져요.** Hibernate는 처음 컬렉션 객체를 지켜보며 빠진 자식을 찾는데, 새 리스트로 바꾸면 그 컬렉션이 사라져요.

      - 비우려면 items.clear()를 써요
    source: https://docs.hibernate.org/orm/6.6/userguide/html_single/#pc-cascade-orphan-removal
  # ── 질문 4 ──
  - key: cas-team-members
    concept: core
    coreQuestion: q4
    type: multiple_choice
    status: reviewed
    difficulty: 1
    body: 아래 관계 가운데 부모 쪽 @OneToMany에 cascade ALL과 orphanRemoval을 붙이기에 알맞은 것은 무엇일까요?
    choices:
      - 팀과 회원
      - 주문과 주문 상품
      - 카테고리와 상품
      - 회원과 주문
    answer: "2"
    explanation: |-
      **주문과 주문 상품이에요.** 주문 상품은 주문 없이 뜻이 없고 다른 엔티티가 가리키지 않아요.

      - 회원, 상품, 주문은 따로 살고 다른 엔티티가 가리켜요
    source: https://jakarta.ee/specifications/persistence/3.1/jakarta-persistence-spec-3.1.html
  - key: cas-many-to-one
    concept: core
    coreQuestion: q4
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: Member.team이 @ManyToOne(cascade = CascadeType.ALL)이에요. 팀 레드에 kim과 lee가 있을 때 kim만 em.remove로 지우고 커밋했어요. 어떻게 될까요?
    choices:
      - kim만 지워진다
      - kim을 지우며 팀도 지우려다, lee가 팀을 가리켜 외래 키 위반으로 실패한다
      - kim과 lee가 모두 지워진다
    answer: "2"
    explanation: |-
      **외래 키 위반으로 실패해요.** 회원에게 한 삭제가 팀으로 넘어가 팀 DELETE까지 나가요.

      - 다 쪽(자식)에는 cascade를 걸지 않아요
      - lee가 없었다면 팀이 조용히 지워졌을 거예요
    source: https://jakarta.ee/specifications/persistence/3.1/jakarta-persistence-spec-3.1.html
  # ── 네 질문을 하나로 ──
  - key: cas-interview
    concept: core
    coreQuestion: all
    type: descriptive
    status: reviewed
    difficulty: 2
    body: 면접에서 "cascade와 orphanRemoval은 무엇이고 언제 쓰나요?"라는 질문을 받았어요. 1분 안에 답해 보세요.
    explanation: |-
      **cascade는 부모에게 한 일을 자식에게 넘기고, orphanRemoval은 컬렉션에서 빠진 자식을 지워요. 자식의 생명주기를 부모 하나가 온전히 가질 때만 써요.**

      - JPA는 엔티티를 따로 저장해서 cascade가 없으면 자식은 저장되지 않는다
      - cascade REMOVE는 자식을 하나씩 먼저 지운다
      - orphanRemoval이 없으면 mappedBy 컬렉션에서 빼도 아무 일도 없다
      - 다른 엔티티가 가리키는 자식이나 다 쪽 ManyToOne에는 걸지 않는다
    checklist:
      - cascade가 부모의 일을 자식에게 넘긴다고 말했다
      - orphanRemoval이 고아를 지운다고 말했다
      - cascade가 없으면 자식이 저장되지 않는다고 말했다
      - 생명주기를 부모가 온전히 가질 때만 쓴다고 말했다
      - 다 쪽이나 공유되는 자식에 걸면 생기는 문제를 말했다
    source: https://jakarta.ee/specifications/persistence/3.1/jakarta-persistence-spec-3.1.html
