# 격리 수준과 이상 현상 문제
# 형식: https://github.com/wanja727/retrievo/blob/main/docs/content-format.md
#
# 2026-11-25에 레슨을 핵심 질문 구조로 다시 쓰며 문제도 새로 만들었다. 예전 문제(q-xxxxxxxx)는 지웠다.
# 모든 문제는 coreQuestions의 질문 하나에 묶이고(coreQuestion), 답의 근거가 레슨 본문에 있다
# (site/src/content/lesson-pages/isolation-level.yaml의 says).
# 동작에 관한 정답은 verification의 IsolationLessonTest, IsolationLevelTest로 확인했다 (PostgreSQL 16).
# 2026-11-25에 만들고 같은 날 검수해 reviewed로 바꿨다.
# 질문마다 첫 문제는 본문의 예시로 묻고, 둘째 문제는 다른 상황으로 옮겨 묻는다.
subject:
  key: dev
  name: 개발자 면접
lesson:
  key: isolation-level
  title: 격리 수준과 이상 현상
  unit: DB
  order: 609
concepts:
  - key: core
    name: 격리 수준과 이상 현상
coreQuestions:
  - key: q1
    text: "동시에 도는 트랜잭션은 서로 무엇을 볼 수 있나요?"
  - key: q2
    text: "격리 수준 네 가지는 각각 무엇을 막나요?"
  - key: q3
    text: "기본값인 READ COMMITTED에서는 무엇이 보이나요?"
  - key: q4
    text: "REPEATABLE READ는 무엇을 막고, 대신 무엇이 생기나요?"
  - key: q5
    text: "갱신 손실은 격리 수준으로 막히나요?"
questions:
  # ── 질문 1 ──
  - key: iso-phantom-name
    concept: core
    coreQuestion: q1
    type: multiple_choice
    status: reviewed
    difficulty: 1
    body: "트랜잭션 A가 `count(*) where amount > 1000`을 두 번 하는 사이에, B가 조건에 맞는 쿠폰을 넣고 커밋해서 두 수가 달라졌어요. 어떤 이상 현상인가요?"
    choices:
      - Dirty Read
      - Non-Repeatable Read
      - Phantom Read
      - 갱신 손실
    answer: "3"
    explanation: |-
      **Phantom Read예요.** 행 하나의 값이 아니라 조건에 맞는 행의 집합이 바뀌었어요.

      - 같은 행의 값이 바뀌어 보이는 것은 Non-Repeatable Read예요
      - 커밋 전 값을 읽는 것은 Dirty Read예요
    source: https://www.postgresql.org/docs/16/transaction-iso.html
  - key: iso-dirty-name
    concept: core
    coreQuestion: q1
    type: multiple_choice
    status: reviewed
    difficulty: 1
    body: "재고 화면이, B가 아직 커밋하지 않은 \"재고 0\"을 읽어 품절로 보였어요. 그런데 B는 롤백했어요. 어떤 이상 현상인가요?"
    choices:
      - Dirty Read
      - Non-Repeatable Read
      - Phantom Read
      - 쓰기 치우침
    answer: "1"
    explanation: |-
      **Dirty Read예요.** 커밋되지 않은 값을 읽었어요.

      - B가 롤백해서 재고 0은 한 번도 확정된 적이 없어요
      - PostgreSQL은 어느 격리 수준에서도 이것을 허용하지 않아요
    source: https://www.postgresql.org/docs/16/transaction-iso.html
  # ── 질문 2 ──
  - key: iso-pg-read-uncommitted
    concept: core
    coreQuestion: q2
    type: ox
    status: reviewed
    difficulty: 2
    body: "PostgreSQL 16에서 `begin isolation level read uncommitted`로 연 트랜잭션은 다른 트랜잭션이 아직 커밋하지 않은 값을 읽을 수 있다."
    answer: X
    explanation: |-
      **X. 읽을 수 없어요.** PostgreSQL은 READ UNCOMMITTED를 READ COMMITTED처럼 다뤄요.

      - 표준은 READ UNCOMMITTED에서 Dirty Read를 허용하지만, 허용은 최소한의 약속일 뿐이에요
      - 그래서 "격리 수준 X는 Y를 막는다"는 DB를 붙여 말해요
    source: https://www.postgresql.org/docs/16/transaction-iso.html
  - key: iso-standard-rr
    concept: core
    coreQuestion: q2
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: "SQL 표준의 격리 수준 표에서, REPEATABLE READ가 허용하는 이상 현상은 무엇인가요?"
    choices:
      - Dirty Read
      - Non-Repeatable Read
      - Phantom Read
      - 아무것도 허용하지 않는다
    answer: "3"
    explanation: |-
      **Phantom Read예요.** 표준의 REPEATABLE READ는 Dirty Read와 Non-Repeatable Read를 막아요.

      - SERIALIZABLE은 셋 다 막아요
      - PostgreSQL의 REPEATABLE READ는 Phantom Read까지 막아 표준보다 엄격해요
    source: https://www.postgresql.org/docs/16/transaction-iso.html
  # ── 질문 3 ──
  - key: iso-rc-second-read
    concept: core
    coreQuestion: q3
    type: multiple_choice
    status: reviewed
    difficulty: 1
    body: "PostgreSQL 기본 설정에서 A가 kim의 잔액 100을 읽었어요. 그 뒤 B가 50으로 바꾸고 커밋했어요. A가 같은 트랜잭션에서 다시 읽으면 얼마가 보이나요?"
    choices:
      - "100"
      - "50"
      - 오류가 난다
      - B가 커밋할 때까지 기다린다
    answer: "2"
    explanation: |-
      **50이에요.** 기본 격리 수준 READ COMMITTED는 문장마다 그 순간까지 커밋된 값을 봐요.

      - 같은 트랜잭션 안에서 같은 행의 값이 바뀌어 보이는 Non-Repeatable Read예요
      - REPEATABLE READ였다면 100이 보여요
    source: https://www.postgresql.org/docs/16/transaction-iso.html#XACT-READ-COMMITTED
  - key: iso-report-mismatch
    concept: core
    coreQuestion: q3
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: "월말 보고서가 한 트랜잭션에서 \"전체 잔액 합계\"를 구한 뒤 \"계좌별 잔액 목록\"을 읽어요. 기본 격리 수준(READ COMMITTED)에서 그 사이에 이체가 커밋되면 어떤 일이 생길 수 있나요?"
    choices:
      - 아무 일도 없다. 한 트랜잭션 안이다
      - 목록의 합이 먼저 구한 합계와 다를 수 있다
      - 이체가 보고서가 끝날 때까지 기다린다
      - 보고서 트랜잭션이 40001로 실패한다
    answer: "2"
    explanation: |-
      **목록의 합이 합계와 다를 수 있어요.** 두 SELECT가 각자 그 순간 커밋된 값을 봐요.

      - 두 값이 서로 맞아야 하면 REPEATABLE READ로 같은 스냅샷에서 읽어요
      - 읽기만 하는 트랜잭션은 직렬화 오류가 나지 않아요
    source: https://www.postgresql.org/docs/16/transaction-iso.html#XACT-READ-COMMITTED
  # ── 질문 4 ──
  - key: iso-rr-update-fails
    concept: core
    coreQuestion: q4
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: "REPEATABLE READ의 A가 kim의 잔액을 읽었어요. 그 뒤 B가 kim의 잔액을 고치고 커밋했어요. A가 kim의 행을 `update ... set balance = balance + 10`으로 고치면 어떻게 되나요? (PostgreSQL 16)"
    choices:
      - A의 스냅샷 값에 10을 더해 성공한다
      - B가 커밋한 값에 10을 더해 성공한다
      - 40001 직렬화 오류로 실패한다
      - 영원히 기다린다
    answer: "3"
    explanation: |-
      **40001로 실패해요.** A의 스냅샷 뒤에 B가 고친 행을 A가 고치면 B의 수정을 덮어쓰게 되기 때문이에요.

      - 앱은 트랜잭션 전체를 처음부터 다시 시도해야 해요
      - READ COMMITTED였다면 B가 커밋한 값에 더해 성공해요
    source: https://www.postgresql.org/docs/16/transaction-iso.html#XACT-REPEATABLE-READ
  - key: iso-rr-readonly
    concept: core
    coreQuestion: q4
    type: ox
    status: reviewed
    difficulty: 2
    body: "읽기만 하는 보고서 트랜잭션을 REPEATABLE READ로 바꾸면, 다른 요청이 같은 행을 고칠 때 이 보고서 트랜잭션이 40001로 실패할 수 있다. (PostgreSQL 16)"
    answer: X
    explanation: |-
      **X. 읽기만 하면 40001이 나지 않아요.** 직렬화 오류는 남이 먼저 고친 행을 내가 고치려 할 때 나요.

      - 보고서는 자기 스냅샷을 계속 읽을 뿐이에요
      - 그래서 합계와 목록을 맞추는 데 부담 없이 쓸 수 있어요
    source: https://www.postgresql.org/docs/16/transaction-iso.html#XACT-REPEATABLE-READ
  - key: iso-spring-no-retry
    concept: core
    coreQuestion: q4
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: "결제 서비스 메서드에 `@Transactional(isolation = Isolation.REPEATABLE_READ)`만 붙이고 다시 시도 코드는 두지 않았어요. 같은 주문을 고치는 요청 둘이 거의 동시에 오면 어떻게 되나요?"
    choices:
      - 둘 다 성공한다
      - 나중 요청이 CannotAcquireLockException으로 실패하고 사용자가 오류를 받는다
      - 나중 요청은 먼저 요청이 끝날 때까지 기다렸다가 성공한다
      - 먼저 요청이 롤백된다
    answer: "2"
    explanation: |-
      **나중 요청이 실패해요.** 스프링은 PostgreSQL의 40001을 `CannotAcquireLockException`으로 바꿔 던져요.

      - 격리 수준을 올리면 트랜잭션 바깥에서 잡아 다시 시도하는 코드가 함께 있어야 해요
      - 트랜잭션 안에서 잡으면 이미 실패한 트랜잭션이라 소용이 없어요
    source: https://docs.spring.io/spring-framework/reference/data-access/transaction/declarative/annotations.html
  # ── 질문 5 ──
  - key: iso-lost-update
    concept: core
    coreQuestion: q5
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: "READ COMMITTED에서 A와 B가 둘 다 잔액 100을 읽고, A는 앱에서 계산한 150을, B는 130을 각자 `update ... set balance = ?`로 써요. A가 먼저 커밋해요. 결과 잔액은?"
    choices:
      - "180"
      - "150"
      - "130"
      - B가 오류로 실패해 150
    answer: "3"
    explanation: |-
      **130이에요.** B가 읽은 100으로 계산한 값을 써서 A의 +50이 사라졌어요. 갱신 손실이에요.

      - 기본 격리 수준은 이것을 막지 않고 오류도 내지 않아요
      - `balance = balance + 30`처럼 계산을 UPDATE 안에서 하면 180이에요
    source: https://www.postgresql.org/docs/16/transaction-iso.html#XACT-READ-COMMITTED
  - key: iso-views-counter
    concept: core
    coreQuestion: q5
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: "READ COMMITTED에서 두 트랜잭션이 동시에 `update post set views = views + 1 where id = 1`을 실행하고 각자 커밋해요. 처음 조회수가 10이면 결과는?"
    choices:
      - "11"
      - "12"
      - 한쪽이 오류로 실패해 11
      - 두 트랜잭션 모두 실패해 10
    answer: "2"
    explanation: |-
      **12예요.** 원자적 UPDATE라 뒤 트랜잭션이 앞 트랜잭션의 커밋을 기다렸다가 최신 값에서 더해요.

      - UPDATE는 고친 행을 커밋까지 잠가요
      - 앱에서 읽고 +1 해서 쓰면 11이 될 수 있어요
    source: https://www.postgresql.org/docs/16/transaction-iso.html#XACT-READ-COMMITTED
  # ── 면접 질문 ──
  - key: iso-interview
    concept: core
    coreQuestion: all
    type: descriptive
    status: reviewed
    difficulty: 2
    body: 면접에서 "트랜잭션 격리 수준과 이상 현상을 설명해 주세요"라는 질문을 받았어요. 1분 안에 답해 보세요.
    explanation: |-
      **격리 수준은 동시에 도는 트랜잭션이 서로의 변경을 얼마나 보는지 정하고, 높을수록 덜 보지만 실패가 늘어요.**

      - **이상 현상:** Dirty Read, Non-Repeatable Read, Phantom Read
      - **표준 네 단계:** READ UNCOMMITTED부터 SERIALIZABLE까지 하나씩 더 막는다. PostgreSQL은 더 엄격하다
      - **READ COMMITTED와 REPEATABLE READ:** 문장마다 커밋된 값 대 첫 스냅샷. 뒤는 동시 수정이 40001로 실패해 다시 시도가 필요하다
      - **갱신 손실:** 기본 수준에서 막히지 않는다. 원자적 UPDATE나 락으로 막는다
    checklist:
      - 세 가지 이상 현상을 구분해 말했다
      - 격리 수준이 높을수록 더 많이 막는다고 말했다
      - READ COMMITTED는 문장마다, REPEATABLE READ는 스냅샷을 본다고 말했다
      - 격리 수준을 올리면 직렬화 오류와 다시 시도가 필요하다고 말했다
      - 갱신 손실은 기본 격리 수준에서 막히지 않는다고 말했다
    source: https://www.postgresql.org/docs/16/transaction-iso.html
