# 도메인 모델과 트랜잭션 스크립트 문제
# 형식: https://github.com/wanja727/retrievo/blob/main/docs/content-format.md
#
# 모든 문제는 coreQuestions의 질문 하나에 묶이고(coreQuestion), 답의 근거가 레슨 본문에 있다
# (site/src/content/lesson-pages/domain-model.yaml의 says).
# 동작에 관한 정답은 verification의 DomainModelTest로 확인했다 (Hibernate 6.6, PostgreSQL 16).
# 질문마다 첫 문제는 본문의 예시로 묻고, 둘째 문제는 다른 상황으로 옮겨 묻는다.
subject:
  key: dev
  name: 개발자 면접
lesson:
  key: domain-model
  title: 도메인 모델과 트랜잭션 스크립트
  unit: 시스템 설계와 아키텍처
  order: 902
concepts:
  - key: core
    name: 도메인 모델과 트랜잭션 스크립트
coreQuestions:
  - key: q1
    text: "트랜잭션 스크립트와 도메인 모델은 로직을 어디에 두나요?"
  - key: q2
    text: "규칙이 엔티티 안에 있으면 무엇이 달라지나요?"
  - key: q3
    text: "애그리거트는 무엇이고 경계는 어떻게 정하나요?"
  - key: q4
    text: "두 방식 가운데 언제 무엇을 고르나요?"
questions:
  # ── 질문 1 ──
  - key: dm-rule-in-service
    concept: core
    coreQuestion: q1
    type: code_predict
    status: draft
    difficulty: 1
    body: 아래 주문 취소 코드에서 "배송된 주문은 취소할 수 없다"는 규칙은 어느 클래스에 있고, 이 코드는 어느 방식일까요?
    code: |-
      @Transactional
      void cancel(Long orderId) {
        Order o = orders.findById(orderId)
            .orElseThrow();
        if (o.getStatus() == SHIPPED) {
          throw new CannotCancel();
        }
        o.setStatus(CANCELED);
      }
    choices:
      - 규칙은 Order 엔티티에 있고, 도메인 모델이다
      - 규칙은 서비스에 있고, 트랜잭션 스크립트다
      - 규칙은 리포지토리에 있고, 트랜잭션 스크립트다
      - 규칙은 서비스에 있고, 도메인 모델이다
    answer: "2"
    explanation: |-
      **규칙은 서비스에 있고 트랜잭션 스크립트예요.** 서비스가 상태를 읽어 판단하고 세터로 바꿔요.

      - Order 엔티티는 값만 들고 있어요
      - 도메인 모델이면 같은 확인이 Order.cancel() 안에 있고 서비스는 그 메서드를 불러요
    source: https://martinfowler.com/eaaCatalog/transactionScript.html
  - key: dm-point-use
    concept: core
    coreQuestion: q1
    type: multiple_choice
    status: draft
    difficulty: 2
    body: "`MemberService.use(memberId, amount)`가 `member.getPoint()`를 읽어 모자라면 예외를 던지고, `member.setPoint(member.getPoint() - amount)`로 줄여요. 이 기능을 도메인 모델로 바꾸면 어떤 모양이 될까요?"
    choices:
      - MemberService에 if 문을 하나 더 둔다
      - Member에 usePoint(amount) 메서드를 두고 그 안에서 확인하고 줄인다. 서비스는 그 메서드를 부른다
      - PointRepository에 확인하는 SQL을 둔다
      - 컨트롤러에서 포인트를 확인한다
    answer: "2"
    explanation: |-
      **Member.usePoint(amount)가 규칙을 가져요.** 데이터(포인트)를 가진 객체가 그 데이터의 규칙을 지켜요.

      - 서비스는 회원을 꺼내 member.usePoint(amount)를 부르기만 해요
      - setPoint 세터는 닫아서 다른 길로 포인트를 바꾸지 못하게 해요
    source: https://martinfowler.com/eaaCatalog/domainModel.html
  # ── 질문 2 ──
  - key: dm-bulk-cancel-model
    concept: core
    coreQuestion: q2
    type: code_predict
    status: draft
    difficulty: 1
    body: "`Order`는 세터가 없고 취소하는 길은 `cancel()` 하나예요. `cancel()`은 배송된 주문이면 `CannotCancel`을 던져요. 아래 일괄 취소에 배송된 주문의 id가 섞여 들어오면 어떻게 될까요?"
    code: |-
      @Transactional
      void bulkCancel(List<Long> ids) {
        for (Long id : ids) {
          orders.findById(id)
              .orElseThrow()
              .cancel();
        }
      }
    choices:
      - 배송된 주문도 취소된다
      - 배송된 주문에서 CannotCancel 예외가 난다
      - 배송된 주문은 건너뛰고 나머지만 취소된다
      - 컴파일 오류가 난다
    answer: "2"
    explanation: |-
      **CannotCancel 예외가 나요.** 규칙이 cancel() 안에 있어서 일괄 취소도 그 확인을 거쳐요.

      - 예외가 나면 트랜잭션이 롤백되어 앞서 취소한 주문도 되돌아가요
      - 세터가 열려 있고 setStatus로 바꾸는 코드였다면 배송된 주문도 취소됐어요
    source: https://martinfowler.com/eaaCatalog/domainModel.html
  - key: dm-coupon-two-places
    concept: core
    coreQuestion: q2
    type: multiple_choice
    status: draft
    difficulty: 2
    body: "\"만료된 쿠폰은 쓸 수 없다\"는 확인이 주문 서비스와 선물 서비스에 if 문으로 하나씩 있어요. 여기에 \"회원 등급이 맞아야 쓸 수 있다\"를 더해야 해요. 지금 고칠 곳은 몇 곳이고, 한 곳으로 만들려면 규칙을 어디로 옮기나요?"
    choices:
      - 한 곳. 이미 모여 있다
      - 두 곳. Coupon.use() 같은 쿠폰의 메서드로 옮긴다
      - 두 곳. 컨트롤러로 옮긴다
      - 쿠폰을 쓰는 화면 수만큼. 옮길 방법이 없다
    answer: "2"
    explanation: |-
      **지금은 두 곳이고, Coupon.use()로 옮기면 한 곳이 돼요.** 확인이 서비스마다 있으면 규칙이 바뀔 때 모두 찾아 고쳐야 해요.

      - 하나를 빠뜨리면 그 기능에서만 규칙이 깨져요
      - 쿠폰의 메서드로 모으면 새 기능도 그 메서드를 부를 수밖에 없어요
    source: https://martinfowler.com/eaaCatalog/domainModel.html
  - key: dm-setter-left-open
    concept: core
    coreQuestion: q2
    type: code_predict
    status: draft
    difficulty: 2
    body: "`Order`에 `cancel()`을 만들어 규칙을 넣었지만 롬복 `@Data`는 그대로 뒀어요. 새로 만든 관리자 기능이 아래처럼 배송된 주문의 상태를 바꾸면 어떻게 될까요?"
    code: |-
      @Entity
      @Data
      public class Order {
        private OrderStatus status;
        public void cancel() {
          if (status == SHIPPED)
            throw new CannotCancel();
          status = CANCELED;
        }
      }

      // 관리자 기능
      order.setStatus(CANCELED);
    choices:
      - CannotCancel 예외가 난다
      - 배송된 주문이 취소된다. @Data가 만든 세터가 cancel()을 거치지 않는 길을 열어 둔다
      - 컴파일 오류가 난다. cancel()이 있으면 setStatus는 만들어지지 않는다
      - 변경 감지가 막아서 DB는 바뀌지 않는다
    answer: "2"
    explanation: |-
      **배송된 주문이 취소돼요.** @Data는 모든 필드에 세터를 만들어서 규칙을 건너뛰는 길이 생겨요.

      - 고친 코드는 @Getter만 두고 바꾸는 메서드를 직접 쓰는 것이에요
      - 변경 감지는 바뀐 필드를 그대로 UPDATE로 보내요
    source: https://projectlombok.org/features/Data
  # ── 질문 3 ──
  - key: dm-line-quantity
    concept: core
    coreQuestion: q3
    type: multiple_choice
    status: draft
    difficulty: 1
    body: "주문 애그리거트에는 \"주문 금액은 주문 상품 금액의 합\"이라는 규칙이 있어요. 주문 상품에 `setQuantity`를 열어 두고 다른 서비스가 `orderLine.setQuantity(5)`로 수량만 바꾸면 무엇이 깨지나요?"
    choices:
      - 아무것도 깨지지 않는다
      - 주문 금액이 주문 상품 금액의 합이라는 규칙. 주문이 수량이 바뀐 것을 모른다
      - 주문 상품의 id
      - 회원의 포인트
    answer: "2"
    explanation: |-
      **주문 금액의 규칙이 깨져요.** 수량이 바뀌어도 주문의 totalPrice는 그대로예요.

      - 그래서 주문 상품은 루트인 주문을 거쳐서만(addLine 같은 메서드) 더하고 바꿔요
      - 함께 바뀌어야 규칙이 지켜지는 묶음이 애그리거트예요
    source: https://martinfowler.com/bliki/DDD_Aggregate.html
  - key: dm-post-comment-member
    concept: core
    coreQuestion: q3
    type: multiple_choice
    status: draft
    difficulty: 2
    body: 게시글을 지우면 그 댓글도 함께 지워져요. 회원은 게시글과 상관없이 가입하고 탈퇴해요. 게시글 애그리거트를 어떻게 잡는 것이 알맞을까요?
    choices:
      - 댓글과 회원을 모두 게시글 애그리거트에 넣는다
      - 댓글은 게시글 애그리거트에 넣고, 회원은 id로 가리킨다
      - 댓글과 회원 모두 id로만 가리킨다
      - 회원은 넣고 댓글은 id로 가리킨다
    answer: "2"
    explanation: |-
      **댓글은 넣고 회원은 id로 가리켜요.** 댓글은 게시글과 함께 생기고 사라지고, 회원은 따로 바뀌는 다른 애그리거트예요.

      - 리포지토리도 루트인 게시글에 둬요
      - 회원을 객체로 들면 게시글을 불러올 때 회원까지 끌려와요
    source: https://martinfowler.com/bliki/DDD_Aggregate.html
  # ── 질문 4 ──
  - key: dm-refund-where
    concept: core
    coreQuestion: q4
    type: multiple_choice
    status: draft
    difficulty: 1
    body: 주문을 취소하면 외부 결제사의 환불 API도 불러야 해요. 주문은 도메인 모델로 짰어요. 환불 API 호출은 어디에 두는 것이 알맞을까요?
    choices:
      - Order.cancel() 안. 엔티티에 환불 클라이언트를 주입한다
      - 서비스. order.cancel()을 부른 뒤 환불 클라이언트를 부른다
      - 주문 리포지토리
      - 주문 상품 엔티티
    answer: "2"
    explanation: |-
      **서비스에 둬요.** 엔티티는 자기 필드와 규칙만 다루고 바깥 시스템을 몰라요.

      - 서비스는 트랜잭션, 엔티티 꺼내기와 저장, 외부 시스템 호출을 맡아요
      - 엔티티에 클라이언트를 넣으면 DB 없이 하던 단위 테스트가 어려워져요
    source: https://martinfowler.com/eaaCatalog/domainModel.html
  - key: dm-faq-choice
    concept: core
    coreQuestion: q4
    type: multiple_choice
    status: draft
    difficulty: 2
    body: FAQ 글을 등록하고 고치는 관리자 기능이에요. 지킬 규칙은 "제목은 비울 수 없다" 하나뿐이에요. 어느 방식이 알맞을까요?
    choices:
      - 트랜잭션 스크립트. 입력 검증으로 충분하고 지킬 상태 규칙이 없다
      - 도메인 모델. 모든 엔티티는 도메인 모델로 짜야 한다
      - 둘 다 맞지 않아 컨트롤러에서 SQL을 쓴다
      - 애그리거트를 셋으로 나눈다
    answer: "1"
    explanation: |-
      **트랜잭션 스크립트가 알맞아요.** 규칙이 없으면 엔티티 메서드가 세터와 다를 게 없어 얻는 것이 없어요.

      - 상태가 여러 단계로 바뀌고 단계마다 규칙이 있을 때 도메인 모델이 값어치가 있어요
      - 한 프로젝트에서 두 방식을 섞어 써요
    source: https://martinfowler.com/eaaCatalog/transactionScript.html
  # ── 네 질문을 하나로 ──
  - key: dm-interview
    concept: core
    coreQuestion: all
    type: descriptive
    status: draft
    difficulty: 2
    body: 면접에서 "트랜잭션 스크립트와 도메인 모델은 무엇이 다르고, 언제 무엇을 쓰나요?"라는 질문을 받았어요. 1분 안에 답해 보세요.
    explanation: |-
      **규칙을 서비스의 절차에 두느냐 엔티티의 메서드에 두느냐가 다르고, 규칙이 많은 핵심 객체에 도메인 모델을 써요.**

      - **정의:** 스크립트는 서비스가 위에서 아래로 처리하고 엔티티는 값만 든다. 모델은 엔티티가 규칙을 가진다
      - **차이:** 모델에서는 상태를 바꾸는 길이 메서드 하나라 새 기능도 규칙을 건너뛸 수 없다. 변경 감지로 저장된다
      - **애그리거트:** 함께 바뀌어야 하는 묶음은 루트를 거쳐서만 바꾸고 다른 묶음은 id로 가리킨다
      - **고르기:** 조회와 단순 저장은 스크립트, 상태와 규칙이 많은 객체는 모델. 섞어 쓴다
    checklist:
      - 트랜잭션 스크립트는 규칙이 서비스에 있다고 말했다
      - 도메인 모델은 규칙이 엔티티의 메서드에 있다고 말했다
      - 상태를 바꾸는 길이 하나라 규칙을 건너뛸 수 없다는 장점을 말했다
      - 애그리거트와 루트를 말했다
      - 규칙이 적으면 트랜잭션 스크립트가 낫다는 기준을 말했다
    source: https://martinfowler.com/eaaCatalog/domainModel.html
