# 리스코프 치환과 인터페이스 분리 원칙 문제
# 형식: https://github.com/wanja727/retrievo/blob/main/docs/content-format.md
#
# 모든 문제는 coreQuestions의 질문 하나에 묶이고(coreQuestion), 답의 근거가 레슨 본문에 있다
# (site/src/content/lesson-pages/lsp-isp.yaml의 says).
# 실행 결과와 컴파일 오류는 verification의 LspIspTest로 확인했다 (자바 21).
# 질문마다 첫 문제는 본문의 예시로 묻고, 둘째 문제는 다른 상황으로 옮겨 묻는다.
subject:
  key: dev
  name: 개발자 면접
lesson:
  key: lsp-isp
  title: 리스코프 치환과 인터페이스 분리 원칙
  unit: 객체지향 설계와 패턴
  order: 304
concepts:
  - key: core
    name: 리스코프 치환과 인터페이스 분리 원칙
coreQuestions:
  - key: q1
    text: "리스코프 치환 원칙은 무엇인가요?"
  - key: q2
    text: "어떤 상속이 리스코프 치환 원칙을 깨고, 어떻게 알아보나요?"
  - key: q3
    text: "인터페이스 분리 원칙은 무엇이고, 리스코프 치환 원칙과 어떻게 이어지나요?"
  - key: q4
    text: "인터페이스를 나누면 무엇이 좋아지나요?"
questions:
  # ── 질문 1 ──
  - key: li-gift-cancel
    concept: core
    coreQuestion: q1
    type: code_predict
    status: draft
    difficulty: 1
    body: GiftCardPayment는 Payment(pay, refund, partialRefund)를 구현하고, partialRefund에서 예외를 던져요. 아래 코드는 어떻게 될까요?
    code: |-
      void cancelItem(Payment payment,
                      int itemPrice) {
        payment.partialRefund(itemPrice);
      }

      cancelItem(new GiftCardPayment(), 5000);
    choices:
      - 컴파일 오류
      - 컴파일되고 실행 중에 UnsupportedOperationException
      - 5000원이 환불된다
      - 아무 일도 일어나지 않는다
    answer: "2"
    explanation: |-
      **컴파일되고 실행 중에 예외가 나요.** GiftCardPayment도 Payment라서 넘길 수 있지만, 부분 환불 약속을 지키지 못해요.

      - 컴파일러는 메서드가 있는지만 보고, 약속대로 동작하는지는 보지 않아요
      - 부모 자리에서 맞게 동작하지 못하니 리스코프 치환 원칙을 어겼어요
  - key: li-penguin
    concept: core
    coreQuestion: q1
    type: multiple_choice
    status: draft
    difficulty: 2
    body: Bird에 fly()가 있고, Penguin extends Bird는 fly()에서 예외를 던져요. List<Bird>를 돌며 모두 fly()를 부르는 코드에 펭귄이 섞이면 무슨 일이 생기고, 어느 원칙을 어긴 것일까요?
    choices:
      - 컴파일 오류. 인터페이스 분리 원칙
      - 실행 중 예외. 리스코프 치환 원칙
      - 펭귄만 건너뛴다. 어긴 원칙 없음
      - 실행 중 예외. 단일 책임 원칙
    answer: "2"
    explanation: |-
      **실행 중에 예외가 나고, 리스코프 치환 원칙을 어겼어요.** Penguin은 Bird 자리에 들어가지만 fly()의 약속을 지키지 못해요.

      - 컴파일은 돼요. Penguin도 Bird예요
    source: https://www.cs.cmu.edu/~wing/publications/LiskovWing94.pdf
  # ── 질문 2 ──
  - key: li-big-coupon
    concept: core
    coreQuestion: q2
    type: code_predict
    status: draft
    difficulty: 1
    body: 쿠폰 목록을 3만 원 주문에 차례로 적용해요. 어떻게 될까요?
    code: |-
      class Coupon {
        int apply(int price) {
          return price - 1000;
        }
      }
      class BigOrderCoupon extends Coupon {
        int apply(int price) {
          if (price < 50000) {
            throw new IllegalArgumentException();
          }
          return price - 5000;
        }
      }

      for (Coupon c : List.of(new Coupon(),
          new BigOrderCoupon())) {
        System.out.println(c.apply(30000));
      }
    choices:
      - 29000과 25000을 찍는다
      - 29000을 찍고 IllegalArgumentException
      - 컴파일 오류
      - 29000을 두 번 찍는다
    answer: "2"
    explanation: |-
      **29000을 찍고 둘째 쿠폰에서 예외가 나요.** 자식이 부모보다 받는 조건을 까다롭게 했어요.

      - Coupon을 쓰는 코드는 어떤 금액이든 받는다고 믿어요
      - 받는 조건을 강하게 하는 것도 리스코프 치환 원칙을 깨는 모양이에요
  - key: li-silent-save
    concept: core
    coreQuestion: q2
    type: ox
    status: draft
    difficulty: 2
    body: "\"Storage.save(file)의 약속은 파일을 저장하는 것이다. ReadOnlyStorage가 save에서 아무 일도 하지 않고 예외 없이 끝나면, 예외가 없으니 리스코프 치환 원칙을 지킨 것이다\""
    answer: X
    explanation: |-
      **어긴 거예요.** 원칙은 예외가 나는지가 아니라 부모의 약속을 지키는지를 봐요.

      - 저장한 뒤 읽어서 확인하는 코드는 파일이 없어서 틀린 결과를 내요
      - 결과를 덜 보장하는 것도 깨는 모양이에요
  # ── 질문 3 ──
  - key: li-split-gift
    concept: core
    coreQuestion: q3
    type: multiple_choice
    status: draft
    difficulty: 1
    body: 부분 환불을 Payment에서 빼서 PartialRefundable 인터페이스로 나눴어요. Payment에는 pay와 refund가 남았어요. 부분 환불을 할 수 없는 상품권 결제 클래스가 구현해야 하는 메서드는 무엇일까요?
    choices:
      - pay, refund, partialRefund
      - pay, refund
      - partialRefund
      - 아무것도 없다
    answer: "2"
    explanation: |-
      **pay와 refund예요.** 상품권은 Payment만 구현하고 PartialRefundable은 구현하지 않아요.

      - 할 수 없는 메서드에서 예외를 던질 일이 없어져요
      - 쓰지 않는 메서드에 기대지 않게 나누는 것이 인터페이스 분리 원칙이에요
  - key: li-printer
    concept: core
    coreQuestion: q3
    type: multiple_choice
    status: draft
    difficulty: 2
    body: Printer 인터페이스에 print, scan, fax가 있어요. 흑백 프린터는 scan과 fax에서 UnsupportedOperationException을 던져요. 인터페이스 분리 원칙대로 고치면 흑백 프린터는 무엇을 구현할까요?
    choices:
      - 그대로 Printer를 구현한다
      - print만 있는 인터페이스를 구현한다
      - scan과 fax만 있는 인터페이스를 구현한다
      - 인터페이스를 구현하지 않는다
    answer: "2"
    explanation: |-
      **print만 있는 인터페이스를 구현해요.** 흑백 프린터가 할 수 있는 일만 든 인터페이스예요.

      - 큰 인터페이스를 억지로 구현하면 예외를 던지는 구현이 생겨 리스코프 치환 원칙도 깨져요
    source: https://web.archive.org/web/20150905081110/http://www.objectmentor.com/resources/articles/isp.pdf
  # ── 질문 4 ──
  - key: li-compile-catch
    concept: core
    coreQuestion: q4
    type: code_predict
    status: draft
    difficulty: 1
    body: GiftCardPayment는 Payment만 구현하고, PartialRefundable은 구현하지 않아요. 아래 코드는 어떻게 될까요?
    code: |-
      void cancelItem(
          PartialRefundable payment,
          int itemPrice) {
        payment.partialRefund(itemPrice);
      }

      cancelItem(new GiftCardPayment(), 5000);
    choices:
      - 컴파일 오류
      - 실행 중 UnsupportedOperationException
      - 5000원이 환불된다
    answer: "1"
    explanation: |-
      **컴파일 오류예요.** GiftCardPayment는 PartialRefundable이 아니라서 넘길 수 없어요.

      - 큰 인터페이스였을 때 실행 중에 나던 예외가 컴파일 시점으로 앞당겨졌어요
  - key: li-four-payments
    concept: core
    coreQuestion: q4
    type: multiple_choice
    status: draft
    difficulty: 2
    body: 결제 수단이 카드, 포인트, 상품권, 계좌이체 넷이고 부분 환불은 카드와 계좌이체만 돼요. 부분 환불 메서드의 매개변수 타입을 바꿀 때, 모든 메서드가 한 인터페이스에 있는 모양과 부분 환불을 따로 뺀 모양에서 각각 고칠 구현 클래스는 몇 개일까요?
    choices:
      - 4개, 4개
      - 4개, 2개
      - 2개, 2개
      - 2개, 4개
    answer: "2"
    explanation: |-
      **4개와 2개예요.** 큰 인터페이스는 부분 환불을 못 하는 구현까지 그 메서드를 가져서 넷 다 고쳐요.

      - 나눈 인터페이스는 부분 환불을 구현한 둘만 고쳐요
  - key: li-list-of
    concept: core
    coreQuestion: q4
    type: code_predict
    status: draft
    difficulty: 2
    body: 아래 코드는 어떻게 될까요?
    code: |-
      void addDefault(List<String> tags) {
        tags.add("new");
      }

      addDefault(List.of("a", "b"));
    choices:
      - 컴파일 오류
      - 실행 중 UnsupportedOperationException
      - tags가 [a, b, new]가 된다
    answer: "2"
    explanation: |-
      **실행 중에 UnsupportedOperationException이 나요.** List의 add는 API 문서에 선택 연산으로 적혀 있고, List.of가 돌려준 목록은 지원하지 않아요.

      - 바꿀 목록이 필요하면 new ArrayList<>(tags)로 복사해서 써요
    source: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/List.html
  # ── 네 질문을 하나로 ──
  - key: li-interview
    concept: core
    coreQuestion: all
    type: descriptive
    status: draft
    difficulty: 2
    body: 면접에서 "리스코프 치환 원칙과 인터페이스 분리 원칙을 예를 들어 설명해 주세요"라는 질문을 받았어요. 1분 안에 답해 보세요.
    explanation: |-
      **자식은 부모 자리에서 맞게 동작해야 하고, 그러려면 인터페이스를 쓰는 쪽에 맞춰 작게 나눠요.**

      - **LSP:** 부모 타입을 쓰는 코드에 자식을 넣어도 맞게 동작해야 한다. 컴파일되는 것과는 다르다
      - **깨는 모양:** 예외를 던지기, 받는 조건을 까다롭게, 결과를 덜 보장. instanceof 분기가 신호
      - **ISP:** 쓰지 않는 메서드에 기대지 않게 나눈다. 큰 인터페이스가 LSP 위반을 만든다
      - **효과:** 할 수 없는 일이 컴파일 오류로 잡히고, 바뀔 때 영향받는 클래스가 준다
    checklist:
      - 부모 자리에 자식을 넣어도 맞게 동작해야 한다고 말했다
      - 컴파일되는 것만으로는 부족하고 약속(동작)을 지켜야 한다고 말했다
      - 예외를 던지거나 조건을 까다롭게 하는 자식이 원칙을 깬다는 예를 들었다
      - 쓰는 쪽에 맞춰 인터페이스를 작게 나눈다고 말했다
      - 나누면 할 수 없는 호출이 컴파일 오류로 잡힌다고 말했다
