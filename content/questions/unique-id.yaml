# 유일한 ID 만들기 문제
# 형식: https://github.com/wanja727/retrievo/blob/main/docs/content-format.md
#
# 모든 문제는 coreQuestions의 질문 하나에 묶이고(coreQuestion), 답의 근거가 레슨 본문에 있다
# (site/src/content/lesson-pages/unique-id.yaml의 says).
# 동작에 관한 정답은 verification의 UniqueIdTest로 확인했다 (PostgreSQL 16, 자바 21).
# 질문마다 첫 문제는 본문의 예시로 묻고, 둘째 문제는 다른 상황으로 옮겨 묻는다.
# 쓴 날 검수까지 마쳐 reviewed로 올린다 (2026-11-25)
subject:
  key: dev
  name: 개발자 면접
lesson:
  key: unique-id
  title: 유일한 ID 만들기
  unit: 시스템 설계와 아키텍처
  order: 917
concepts:
  - key: core
    name: 유일한 ID 만들기
coreQuestions:
  - key: q1
    text: "DB의 자동 증가 번호는 언제 좋고 어디서 한계가 오나요?"
  - key: q2
    text: "무작위 UUID는 무엇이 좋고 무엇이 나쁜가요?"
  - key: q3
    text: "시간 순서가 있는 ID는 어떻게 만드나요?"
  - key: q4
    text: "상황마다 어떤 ID를 고르나요?"
questions:
  # ── 질문 1 ──
  - key: ui-rollback-gap
    concept: core
    coreQuestion: q1
    type: code_predict
    status: reviewed
    difficulty: 1
    body: orders 테이블의 id는 identity 열(1부터 자동 증가)이에요. 아래를 차례로 실행하면 c의 id는 무엇일까요?
    code: |-
      insert into orders(item) values ('a');
      begin;
      insert into orders(item) values ('b');
      rollback;
      insert into orders(item) values ('c');
    choices:
      - "2"
      - "1"
      - "3"
      - 오류가 난다
    answer: "3"
    explanation: |-
      **3이에요.** 시퀀스는 롤백돼도 번호를 되돌리지 않아요.

      - 2는 롤백된 b가 쓰고 비어요
      - 자동 증가 번호는 유일할 뿐 빠짐없이 이어지지 않아요
    source: https://www.postgresql.org/docs/16/functions-sequence.html
  - key: ui-two-dbs
    concept: core
    coreQuestion: q1
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: 주문 DB를 두 대로 나눠, 각자 identity 열로 주문 id를 매겨요. 두 DB에서 처음 저장한 주문의 id는?
    choices:
      - 1과 2
      - DB가 알아서 겹치지 않게 나눈다
      - 둘 다 1이라 겹친다
      - 1과 1000001
    answer: "3"
    explanation: |-
      **둘 다 1이에요.** identity는 그 DB 안에서만 유일해요.

      - 여러 DB에 걸치면 시간 순서 ID처럼 DB에 기대지 않는 ID를 써요
    source: https://www.postgresql.org/docs/16/sql-createtable.html
  # ── 질문 2 ──
  - key: ui-index-size
    concept: core
    coreQuestion: q2
    type: multiple_choice
    status: reviewed
    difficulty: 1
    body: uuid 기본 키 테이블 두 개에 무작위 UUID(v4)와 시간 순서 UUID(v7 모양)를 10만 개씩 넣었어요. 기본 키 인덱스가 더 큰 쪽과 그 이유는?
    choices:
      - 시간 순서 UUID. 시각이 들어가 값이 길다
      - 둘이 같다. 둘 다 16바이트다
      - 무작위 UUID. 아무 페이지에나 끼어들어 페이지가 쪼개지고 빈 공간이 남는다
      - 무작위 UUID. 값이 겹쳐 두 번 저장된다
    answer: "3"
    explanation: |-
      **무작위 UUID의 인덱스가 커요.** 시간 순서 값은 맨 끝 페이지에 붙어 꽉 채워 가요.

      - 테스트에서 4,336KB 대 3,104KB였어요
      - 10만 개 사이에 겹친 값은 없었어요
    source: https://www.rfc-editor.org/rfc/rfc9562
  - key: ui-offline-app
    concept: core
    coreQuestion: q2
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: 앱이 오프라인에서 주문을 만들어 두었다가 나중에 서버로 보내요. 서버에 저장하기 전에 앱에서 주문 id를 정해야 해요. 알맞은 것은?
    choices:
      - UUID처럼 DB 없이 어디서나 만들 수 있는 ID
      - DB 자동 증가 번호
      - 앱마다 1부터 센 번호
      - 주문 시각(초)만 쓴 번호
    answer: "1"
    explanation: |-
      **UUID처럼 DB 없이 만드는 ID예요.** 자동 증가는 저장해야 번호를 알아요.

      - 앱마다 1부터 세면 겹치고, 초 단위 시각만 쓰면 같은 초의 주문이 겹쳐요
    source: https://www.rfc-editor.org/rfc/rfc9562
  # ── 질문 3 ──
  - key: ui-snowflake-nodes
    concept: core
    coreQuestion: q3
    type: multiple_choice
    status: reviewed
    difficulty: 1
    body: 스노플레이크 모양 ID(시각 41비트, 서버 번호 10비트, 순번 12비트)를 서버 1과 서버 2가 동시에 10만 개씩 만들었어요. 겹친 값은 몇 개일까요?
    choices:
      - 수천 개
      - 0개
      - 정확히 1개
      - 절반
    answer: "2"
    explanation: |-
      **0개예요.** 같은 밀리초에 같은 순번이어도 서버 번호가 달라 값이 달라요.

      - 서버마다 만든 순서대로 커졌어요
    source: https://www.rfc-editor.org/rfc/rfc9562
  - key: ui-same-node
    concept: core
    coreQuestion: q3
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: 스노플레이크 모양 ID를 쓰는데 두 서버에 실수로 같은 서버 번호를 줬어요. 두 서버가 같은 밀리초에 순번 0으로 ID를 만들면 어떻게 되나요?
    choices:
      - 서버마다 다른 ID가 나온다
      - 두 번째 서버가 1밀리초 기다린다
      - DB가 겹침을 고쳐 준다
      - 같은 ID가 나와 겹친다
    answer: "4"
    explanation: |-
      **같은 ID가 나와요.** 시각, 서버 번호, 순번이 모두 같아요.

      - 서버 번호는 설정이나 ZooKeeper, DB로 겹치지 않게 나눠 줘요
      - 서버 시계가 뒤로 가도 겹칠 수 있어요
    source: https://www.rfc-editor.org/rfc/rfc9562
  - key: ui-v7-counter
    concept: core
    coreQuestion: q3
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: UUIDv7을 직접 만들면서 앞 48비트에 밀리초 시각을 두고 나머지를 모두 무작위로 채웠어요. 1밀리초에 수백 개를 만드는 서비스라면 무엇이 문제인가요?
    choices:
      - 문제없다
      - 같은 밀리초 안에서는 순서가 섞여, 인덱스 끝에 붙는 장점을 잃는다
      - 값이 겹친다
      - UUID 칸에 넣을 수 없다
    answer: "2"
    explanation: |-
      **같은 밀리초 안에서 순서가 섞여요.** 시각 뒤에 카운터를 두어 같은 밀리초에도 커지게 해요.

      - 테스트에서 처음 그렇게 짰더니 무작위 UUID보다 인덱스가 컸어요
    source: https://www.rfc-editor.org/rfc/rfc9562
  # ── 질문 4 ──
  - key: ui-exposed-url
    concept: core
    coreQuestion: q4
    type: multiple_choice
    status: reviewed
    difficulty: 1
    body: 주문 URL에 /orders/1042처럼 자동 증가 id가 드러나, 다음 번호를 넣어 남의 주문을 열어 보려는 시도가 있어요. 기본 키를 바꾸지 않고 고치는 방법은?
    choices:
      - 밖에는 짐작할 수 없는 주문 번호 칸을 따로 두고 그것을 보여 준다
      - 기본 키를 무작위 UUID로 바꾼다
      - URL을 길게 만든다
      - 주문 번호를 매일 0부터 다시 센다
    answer: "1"
    explanation: |-
      **내부 키와 외부 키를 나눠요.** 기본 키는 짧고 정렬된 값으로 두고, 밖에 보이는 번호는 따로 둬요.

      - 남의 주문을 열 때 권한을 확인하는 것도 함께 해요
    source: https://www.postgresql.org/docs/16/sql-createtable.html
  - key: ui-cross-service
    concept: core
    coreQuestion: q4
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: 주문 서비스와 결제 서비스가 각자 DB를 쓰는데, 같은 주문을 하나의 id로 주고받고 시간 순서로도 보고 싶어요. 알맞은 id는?
    choices:
      - 주문 DB의 자동 증가 번호를 결제 DB도 따로 매긴다
      - 무작위 UUID
      - 시간 순서 ID(UUIDv7이나 스노플레이크)
      - 두 서비스의 번호를 이어 붙인다
    answer: "3"
    explanation: |-
      **시간 순서 ID예요.** 어느 DB에도 기대지 않고 만들면서 시간 순서로 정렬돼요.

      - 무작위 UUID도 겹치지 않지만 정렬되지 않아요
    source: https://www.rfc-editor.org/rfc/rfc9562
  # ── 네 질문을 하나로 ──
  - key: ui-interview
    concept: core
    coreQuestion: all
    type: descriptive
    status: reviewed
    difficulty: 2
    body: 면접에서 "분산 환경에서 유일한 ID를 어떻게 만드나요?"라는 질문을 받았어요. 1분 안에 답해 보세요.
    explanation: |-
      **DB 하나면 자동 증가, 여러 곳에 걸치면 앞에 시각을 둔 시간 순서 ID를 쓰고, 밖에 보이는 번호는 따로 둬요.**

      - **자동 증가:** 짧고 정렬되지만 DB 여러 대면 겹치고 번호가 드러난다
      - **무작위 UUID:** 어디서나 만들지만 크고 인덱스가 쪼개진다
      - **시간 순서 ID:** UUIDv7, 스노플레이크. 서버 번호와 시계를 챙긴다
      - **고르기:** 내부 키와 외부 키를 나눈다
    checklist:
      - 자동 증가의 장점과 한계를 말했다
      - 무작위 UUID가 인덱스에 나쁜 이유를 말했다
      - 시간 순서 ID를 말했다
      - 스노플레이크의 서버 번호나 시계 문제를 말했다
      - 내부 키와 외부 키를 나누는 방법을 말했다
    source: https://www.rfc-editor.org/rfc/rfc9562
