questions:
  # ── 질문 1. 변수에는 무엇이 들어 있나요? ──
  - key: var-alias
    concept: core
    coreQuestion: q1
    type: code_predict
    status: reviewed
    difficulty: 1
    body: Order는 int price 필드 하나를 가진 클래스예요. 아래 코드를 실행한 뒤 마지막 줄은 무엇을 출력할까요?
    code: |-
      Order a = new Order(10000);
      Order b = a;
      b.price = 5000;
      System.out.println(a.price);
    choices:
      - "10000"
      - "5000"
      - 컴파일 오류
      - NullPointerException
    answer: "2"
    explanation: |-
      **5000이에요.** b = a는 주문 객체를 복사하지 않고 그 객체를 가리키는 참조를 복사해요.

      - new는 한 번만 불렸으니 주문 객체는 하나예요
      - a와 b가 같은 객체를 가리켜서 b로 바꾼 금액이 a로도 보여요
      - 객체를 하나 더 갖고 싶으면 new로 새로 만들어야 해요
    source: https://docs.oracle.com/javase/specs/jls/se21/html/jls-4.html
  - key: var-array-reassign
    concept: core
    coreQuestion: q1
    type: code_predict
    status: reviewed
    difficulty: 2
    body: 아래 코드를 실행한 뒤 x[0]은 얼마일까요?
    code: |-
      int[] x = {1, 2};
      int[] y = x;
      y = new int[]{7, 8};
      y[0] = 9;
    choices:
      - "1"
      - "7"
      - "9"
      - 컴파일 오류
    answer: "1"
    explanation: |-
      **1이에요.** y는 셋째 줄에서 새 배열을 가리키게 됐고, 그 뒤로는 x와 다른 배열이에요.

      - 배열도 참조형이라 y = x는 같은 배열을 가리키게 해요
      - y = new int[]{...}는 y에 다른 참조를 넣을 뿐 x는 건드리지 않아요
      - y[0] = 9는 새 배열의 칸을 바꿔요
    source: https://docs.oracle.com/javase/specs/jls/se21/html/jls-10.html
  # ── 질문 2. 메서드에 넘기면 무엇이 복사되나요? ──
  - key: var-reassign-param
    concept: core
    coreQuestion: q2
    type: code_predict
    status: reviewed
    difficulty: 1
    body: 아래 코드를 실행하면 무엇이 출력될까요?
    code: |-
      static void replace(Order o) {
        o = new Order(1);
      }

      Order order = new Order(10000);
      replace(order);
      System.out.println(order.price);
    choices:
      - "1"
      - "10000"
      - "0"
      - NullPointerException
    answer: "2"
    explanation: |-
      **10000이에요.** 매개변수 o에 새 객체를 대입한 것은 메서드의 변수만 바꿔요.

      - 호출할 때 order에 든 참조가 o로 복사돼요
      - o = new Order(1)은 o가 다른 객체를 가리키게 할 뿐, 바깥의 order에 든 참조는 그대로예요
      - 자바는 언제나 값으로 넘기고, 참조형은 그 값이 참조예요
    source: https://docs.oracle.com/javase/specs/jls/se21/html/jls-8.html#jls-8.4.1
  - key: var-list-param
    concept: core
    coreQuestion: q2
    type: code_predict
    status: reviewed
    difficulty: 2
    body: '"kim" 하나가 든 ArrayList를 아래 메서드에 넘겼어요. 메서드가 끝난 뒤 호출한 쪽 리스트에 든 것은 무엇일까요?'
    code: |-
      static void add(List<String> names) {
        names.add("lee");
        names = new ArrayList<>();
        names.add("park");
      }
    choices:
      - "[kim]"
      - "[kim, lee]"
      - "[kim, lee, park]"
      - "[park]"
    answer: "2"
    explanation: |-
      **[kim, lee]예요.** "lee"는 넘겨받은 리스트에 더했고, "park"은 새 리스트에 더했어요.

      - names에는 호출한 쪽 리스트의 참조가 복사됐어요. add("lee")는 그 리스트를 고쳐요
      - names = new ArrayList<>()부터는 메서드의 변수가 새 리스트를 가리켜요
      - 새 리스트는 호출한 쪽이 모르는 리스트라 "park"은 보이지 않아요
    source: https://docs.oracle.com/javase/specs/jls/se21/html/jls-8.html#jls-8.4.1
  - key: var-service-clear
    concept: core
    coreQuestion: q2
    type: code_predict
    status: reviewed
    difficulty: 2
    body: 서비스에 아래 메서드가 있어요. 컨트롤러가 원소 3개가 든 리스트 cart를 넘겨 reset(cart)를 부른 뒤 cart.size()를 출력하면 얼마일까요?
    code: |-
      void reset(List<Item> items) {
        items = new ArrayList<>();
      }
    choices:
      - "0"
      - "3"
      - NullPointerException
      - 컴파일 오류
    answer: "2"
    explanation: |-
      **3이에요.** 메서드의 변수 items에 새 리스트를 대입했을 뿐 cart가 가리키는 리스트는 그대로예요.

      - 넘겨받은 리스트를 비우려면 items.clear()를 불러요. 같은 리스트라 호출한 쪽에도 보여요
      - 새 리스트가 필요하면 돌려주고 호출한 쪽이 받게 해요
    source: https://docs.oracle.com/javase/specs/jls/se21/html/jls-8.html#jls-8.4.1
  # ── 질문 3. ==는 무엇을 비교하나요? ──
  - key: var-equals-default
    concept: core
    coreQuestion: q3
    type: code_predict
    status: reviewed
    difficulty: 1
    body: Order는 equals를 재정의하지 않았어요. 아래 세 비교의 결과는 차례로 무엇일까요?
    code: |-
      Order a = new Order(10000);
      Order b = new Order(10000);
      Order c = a;

      a == b
      a == c
      a.equals(b)
    choices:
      - true, true, true
      - false, true, false
      - false, true, true
      - false, false, false
    answer: "2"
    explanation: |-
      **false, true, false예요.** ==는 같은 객체인지를 보고, 재정의하지 않은 equals도 같아요.

      - a와 b는 금액이 같아도 new를 두 번 불러 만든 다른 객체예요
      - c = a는 참조를 복사해서 같은 객체를 가리켜요
      - Object의 equals는 ==와 같은 일을 해요
    source: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/lang/Object.html#equals(java.lang.Object)
  - key: var-string-new
    concept: core
    coreQuestion: q3
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: 'String s = new String("PAID"); String t = new String("PAID");일 때 s == t와 s.equals(t)의 결과는 무엇일까요?'
    choices:
      - true와 true
      - false와 true
      - true와 false
      - false와 false
    answer: "2"
    explanation: |-
      **false와 true예요.** new로 만든 두 문자열은 다른 객체이고, String의 equals는 글자를 비교해요.

      - ==는 같은 객체인지를 봐요. new를 두 번 불렀으니 달라요
      - String은 equals를 "글자가 같으면 같다"로 재정의했어요
    source: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/lang/String.html#equals(java.lang.Object)
  # ── 질문 4. null은 무엇이고 왜 NullPointerException이 나나요? ──
  - key: var-default-null
    concept: core
    coreQuestion: q4
    type: code_predict
    status: reviewed
    difficulty: 1
    body: Member를 만들고 필드에 아무것도 넣지 않았어요. 아래 두 줄을 차례로 실행하면 어떻게 될까요?
    code: |-
      class Member {
        String name;
        int age;
      }

      Member m = new Member();
      System.out.println(m.age);
      System.out.println(m.name.length());
    choices:
      - 0을 출력하고, 다음 줄에서 0을 출력한다
      - 0을 출력하고, 다음 줄에서 NullPointerException이 난다
      - 첫 줄에서 컴파일 오류가 난다. age에 값을 넣지 않았다
      - 첫 줄에서 NullPointerException이 난다
    answer: "2"
    explanation: |-
      **0을 출력하고 다음 줄에서 NullPointerException이 나요.** 값을 넣지 않은 필드는 기본값으로 시작해요.

      - 숫자 필드는 0, 참조형 필드는 null이에요
      - m.name은 아무 객체도 가리키지 않아서 .length()로 닿을 객체가 없어요
      - 필드와 달리 지역 변수는 기본값이 없어서 값 없이 읽으면 컴파일 오류예요
    source: https://docs.oracle.com/javase/specs/jls/se21/html/jls-4.html#jls-4.12.5
  - key: var-null-compare
    concept: core
    coreQuestion: q4
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: 'String status = null;일 때 아래 셋 가운데 NullPointerException이 나는 것은 무엇일까요?'
    choices:
      - status == null
      - '"PAID".equals(status)'
      - status.equals("PAID")
      - 셋 다 예외가 나지 않는다
    answer: "3"
    explanation: |-
      **status.equals("PAID")예요.** null인 status에 점을 찍어 메서드를 부르기 때문이에요.

      - == null은 참조를 비교할 뿐 점을 찍지 않아요
      - "PAID".equals(status)는 리터럴에서 부르니 예외 없이 false예요
      - 둘 다 null일 수 있으면 Objects.equals(a, b)를 써요
    source: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/Objects.html#equals(java.lang.Object,java.lang.Object)
  # ── 네 질문을 하나로 ──
  - key: var-interview
    concept: core
    coreQuestion: all
    type: descriptive
    status: reviewed
    difficulty: 2
    body: 면접에서 "자바는 값으로 넘기나요, 참조로 넘기나요?"라는 질문을 받았어요. 1분 안에 답해 보세요.
    explanation: |-
      **자바는 언제나 값으로 넘기고, 참조형일 때는 그 값이 참조예요.**

      - **변수:** 기본형 변수에는 값이, 참조형 변수에는 객체를 가리키는 참조가 들어 있다
      - **넘기기:** 변수에 든 것이 매개변수로 복사된다. 참조형은 같은 객체를 가리키게 되어 필드를 바꾸면 보이고, 매개변수에 새 객체를 대입하면 보이지 않는다
      - **비교:** ==는 변수에 든 것을 비교해서 참조형은 같은 객체인지를 본다. 내용 비교는 equals
      - **null:** 아무것도 가리키지 않는 참조라 점을 찍으면 NullPointerException
    checklist:
      - 기본형 변수에는 값, 참조형 변수에는 참조가 들어 있다고 말했다
      - 자바는 언제나 값으로 넘기고 참조형은 참조가 복사된다고 말했다
      - 메서드 안에서 필드를 바꾸면 보이지만 매개변수에 새 객체를 대입하면 보이지 않는다고 말했다
      - ==는 참조형에서 같은 객체인지를 비교하고 내용 비교는 equals라고 말했다
      - null에 점을 찍으면 NullPointerException이 난다고 말했다
    source: https://docs.oracle.com/javase/specs/jls/se21/html/jls-8.html#jls-8.4.1
