# 부하 테스트 문제
# 형식: https://github.com/wanja727/retrievo/blob/main/docs/content-format.md
#
# 모든 문제는 coreQuestions의 질문 하나에 묶이고(coreQuestion), 답의 근거가 레슨 본문에 있다
# (site/src/content/lesson-pages/load-testing.yaml의 says).
# 동작에 관한 정답은 verification의 LoadTestingTest로 확인했다 (스프링 부트 3.5, 내장 톰캣).
# 질문마다 첫 문제는 본문의 예시로 묻고, 둘째 문제는 다른 상황으로 옮겨 묻는다.
# 2026-11-26에 만들고 같은 날 검수해 reviewed로 바꿨다.
subject:
  key: dev
  name: 개발자 면접
lesson:
  key: load-testing
  title: 부하 테스트
  unit: 테스트와 운영
  order: 909
concepts:
  - key: core
    name: 부하 테스트
coreQuestions:
  - key: q1
    text: "부하 테스트는 무엇을 알아내려고 하나요?"
  - key: q2
    text: "사용자를 늘리면 처리량과 응답 시간은 어떻게 바뀌나요?"
  - key: q3
    text: "한계에 닿았을 때 병목은 어떻게 찾나요?"
  - key: q4
    text: "부하 테스트를 믿을 수 있게 하려면 무엇을 지켜야 하나요?"
questions:
  # ── 질문 1 ──
  - key: lt-goal
    concept: core
    coreQuestion: q1
    type: multiple_choice
    status: reviewed
    difficulty: 1
    body: 이벤트를 앞두고 주문 API의 부하 테스트를 하려고 해요. 목표로 가장 알맞은 것은?
    choices:
      - 주문 API가 빨라야 한다
      - 초당 200건을 p99 300ms 안에 처리한다
      - 평균 응답 시간이 짧아야 한다
      - 서버가 죽지 않아야 한다
    answer: "2"
    explanation: |-
      **처리량과 백분위를 숫자로 정한 목표예요.** 숫자로 정해야 재고 나서 통과와 실패를 가를 수 있어요.

      - 평균은 느린 요청을 숨겨서 백분위로 정해요
    source: https://grafana.com/docs/k6/latest/using-k6/thresholds/
  - key: lt-why
    concept: core
    coreQuestion: q1
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: 단위 테스트와 통합 테스트가 모두 통과한 서버가 오픈 이벤트 날 응답이 5초씩 걸렸어요. 미리 무엇을 했으면 알 수 있었을까요?
    choices:
      - 단위 테스트를 더 많이 쓴다
      - 예상한 동시 사용자만큼 요청을 보내 처리량과 응답 시간을 재는 부하 테스트
      - 코드 커버리지를 100%로 올린다
      - 로그 수준을 DEBUG로 바꾼다
    answer: "2"
    explanation: |-
      **부하 테스트예요.** 단위, 통합 테스트는 맞게 동작하는지를, 부하 테스트는 많이 올 때 버티는지를 봐요.
    source: https://grafana.com/docs/k6/latest/using-k6/thresholds/
  # ── 질문 2 ──
  - key: lt-saturation
    concept: core
    coreQuestion: q2
    type: multiple_choice
    status: reviewed
    difficulty: 1
    body: 톰캣 스레드 최대 10개, 요청마다 100ms가 걸리는 API에 동시 사용자를 20명에서 50명으로 늘렸어요. 처리량과 응답 시간은 어떻게 될까요?
    choices:
      - 처리량이 2.5배가 되고 응답 시간은 그대로다
      - 처리량은 초당 100건 가까이 그대로이고, 응답 시간이 길어진다
      - 둘 다 그대로다
      - 요청이 실패하기 시작해 처리량이 0이 된다
    answer: "2"
    explanation: |-
      **처리량은 그대로, 응답 시간만 늘어요.** 스레드 10개가 0.1초씩 쓰니 초당 100건이 한계예요.

      - 남는 요청은 실패하지 않고 대기열에서 기다려요
      - 레슨의 측정에서 50명은 처리량 초당 약 92건, 평균 약 500ms였어요
    source: https://en.wikipedia.org/wiki/Little%27s_law
  - key: lt-little
    concept: core
    coreQuestion: q2
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: 리틀의 법칙(서버 안의 요청 수 = 처리량 × 응답 시간)으로 계산해 보세요. 응답 시간이 0.2초인 API가 초당 300건을 처리하려면 서버 안에서 동시에 몇 건을 처리하고 있어야 할까요?
    choices:
      - 15건
      - 60건
      - 150건
      - 1500건
    answer: "2"
    explanation: |-
      **60건이에요.** 300건/초 × 0.2초 = 60건이에요.

      - 스레드가 60개보다 적으면 그만큼 처리량이 묶여요
    source: https://en.wikipedia.org/wiki/Little%27s_law
  - key: lt-average
    concept: core
    coreQuestion: q2
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: k6 결과에서 평균 응답 시간은 150ms로 목표(200ms)를 지켰는데, p99는 2초였어요. 이 부하 테스트를 통과로 봐도 될까요?
    choices:
      - 된다. 평균이 목표 안이다
      - 안 된다. 요청 100개 가운데 하나는 2초를 넘어 많은 사용자가 겪는다. 기준을 백분위로 건다
      - p99는 보지 않아도 된다
      - 평균과 p99가 다르면 측정이 틀린 것이다
    answer: "2"
    explanation: |-
      **통과가 아니에요.** 평균은 느린 요청을 숨겨요. 통과 기준은 p95, p99로 걸어요.

      - k6의 thresholds에 http_req_duration p(99)를 적어요
    source: https://grafana.com/docs/k6/latest/using-k6/thresholds/
  # ── 질문 3 ──
  - key: lt-busy-threads
    concept: core
    coreQuestion: q3
    type: multiple_choice
    status: reviewed
    difficulty: 1
    body: 부하 테스트 중 처리량이 멈췄어요. CPU는 20%이고, 톰캣의 바쁜 스레드 수가 최대치에 붙어 있어요. 병목은 무엇일까요?
    choices:
      - CPU
      - 톰캣 스레드. 모두 무언가를 기다리고 있다
      - 디스크
      - 병목이 없다
    answer: "2"
    explanation: |-
      **톰캣 스레드예요.** CPU가 노는데 스레드가 다 찼으면 스레드들이 외부 호출이나 DB를 기다리고 있어요.

      - 레슨의 측정에서 스레드를 10개에서 50개로 늘리자 처리량이 다섯 배가 됐어요
    source: https://docs.spring.io/spring-boot/appendix/application-properties/index.html
  - key: lt-moved-bottleneck
    concept: core
    coreQuestion: q3
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: 주문 API가 느려서 톰캣 스레드를 50개에서 200개로 늘렸어요. 처리량은 그대로이고 커넥션 풀의 대기 수(hikaricp.connections.pending)가 치솟았어요. 무슨 일일까요?
    choices:
      - 스레드가 아직 모자라다. 400개로 늘린다
      - 병목이 커넥션 풀로 옮겨 갔다. 스레드들이 커넥션을 기다린다
      - 부하 도구가 고장 났다
      - CPU가 병목이다
    answer: "2"
    explanation: |-
      **병목이 커넥션 풀로 옮겨 갔어요.** 스레드만 늘리면 커넥션을 기다리는 스레드가 늘 뿐이에요.

      - 커넥션을 오래 잡는 쿼리를 고치거나 풀 크기를 함께 봐요
    source: https://docs.spring.io/spring-boot/appendix/application-properties/index.html
  # ── 질문 4 ──
  - key: lt-warmup
    concept: core
    coreQuestion: q4
    type: multiple_choice
    status: reviewed
    difficulty: 1
    body: 서버를 띄운 직후부터 10초 동안 잰 응답 시간이, 1분 뒤부터 잰 값보다 컸어요. 이유로 맞는 것은?
    choices:
      - 서버가 고장 났다
      - 처음 구간은 JVM이 클래스를 읽고 JIT가 컴파일하기 전이라 느리다. 워밍업 뒤부터 잰다
      - 부하 도구가 처음에 더 많이 보낸다
      - DB가 처음에 더 빠르다
    answer: "2"
    explanation: |-
      **워밍업 전이라 느려요.** 레슨의 측정에서 처음 0.5초 안의 요청은 400ms를 넘기도 했고, 1초 뒤의 중앙값은 110ms였어요.

      - 측정 전에 워밍업 구간을 두고 그 결과는 버려요
    source: https://grafana.com/docs/k6/latest/using-k6/thresholds/
  - key: lt-client-bound
    concept: core
    coreQuestion: q4
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: 노트북 한 대로 부하를 보냈더니 노트북의 CPU가 100%였고 서버의 CPU는 30%였어요. 처리량은 초당 400건에서 멈췄어요. 이것을 서버의 한계로 봐도 될까요?
    choices:
      - 된다
      - 안 된다. 부하를 만드는 쪽이 먼저 한계에 닿았다
      - 서버의 CPU가 30%이니 서버가 병목이다
      - 노트북이 빠를수록 서버도 빨라진다
    answer: "2"
    explanation: |-
      **안 돼요.** 부하를 만드는 쪽이 지치면 서버가 아니라 그쪽의 한계를 재요.

      - 부하 머신의 자원도 함께 보고, 모자라면 여러 대로 나눠 보내요
    source: https://grafana.com/docs/k6/latest/using-k6/scenarios/concepts/open-vs-closed/
  # ── 면접 ──
  - key: lt-interview
    concept: core
    coreQuestion: all
    type: descriptive
    status: reviewed
    difficulty: 2
    body: 면접에서 "부하 테스트를 어떻게 하고, 결과로 무엇을 알아내는지 설명해 주세요"라는 질문을 받았어요. 1분 안에 답해 보세요.
    explanation: |-
      **숫자로 정한 목표를 두고 사용자를 늘려 가며, 처리량이 멈추는 한계와 그때 찬 병목을 찾아요.**

      - **목표:** 초당 몇 건을 p99 몇 ms 안에
      - **모양:** 처리량은 포화까지 늘고 그 뒤로 응답 시간만 늘어난다. 리틀의 법칙
      - **병목:** 한계에서 먼저 찬 자원. 넓히면 다음으로 옮겨 간다
      - **믿을 수 있게:** 워밍업, 부하 쪽 자원, 운영과 비슷한 데이터
    checklist:
      - 목표를 처리량과 백분위의 숫자로 정한다고 말했다
      - 처리량이 어느 지점에서 멈추고 응답 시간이 늘어난다고 말했다
      - 한계에서 먼저 찬 자원을 지표로 찾는다고 말했다
      - 병목을 넓히면 다음 병목으로 옮겨 간다고 말했다
      - 워밍업이나 부하를 만드는 쪽의 한계 같은 주의점을 말했다
    source: https://grafana.com/docs/k6/latest/using-k6/thresholds/
