# 동적 쿼리 문제
# 형식: https://github.com/wanja727/retrievo/blob/main/docs/content-format.md
#
# 모든 문제는 coreQuestions의 질문 하나에 묶이고(coreQuestion), 답의 근거가 레슨 본문에 있다
# (site/src/content/lesson-pages/dynamic-query.yaml의 says).
# 동작에 관한 정답은 verification의 DynamicQueryTest로 확인했다 (Hibernate 6.6, Querydsl 5.1, PostgreSQL 16).
# 질문마다 첫 문제는 본문의 예시로 묻고, 둘째 문제는 다른 상황으로 옮겨 묻는다.
# 2026-11-25에 만들었다.
subject:
  key: dev
  name: 개발자 면접
lesson:
  key: dynamic-query
  title: 동적 쿼리
  unit: JPA
  order: 811
concepts:
  - key: core
    name: 동적 쿼리
coreQuestions:
  - key: q1
    text: "조건이 바뀌는 조회를 JPQL 문자열로 만들면 무엇이 문제인가요?"
  - key: q2
    text: "Specification은 동적 쿼리를 어떻게 만드나요?"
  - key: q3
    text: "Querydsl은 무엇이 다른가요?"
  - key: q4
    text: "동적 쿼리는 무엇으로 만들까요?"
questions:
  # ── 질문 1 ──
  - key: dq-concat-name-only
    concept: core
    coreQuestion: q1
    type: code_predict
    status: draft
    difficulty: 1
    body: 아래 코드에 name만 "펜"으로 넣고 minPrice는 null로 두었어요. 만들어지는 JPQL은 어떻게 될까요?
    code: |-
      String jpql = "select p from Product p";
      if (name != null) {
        jpql += " where p.name = :name";
      }
      if (minPrice != null) {
        jpql += " and p.price >= :min";
      }
    choices:
      - where 절에 이름 조건만 있는 정상 쿼리
      - where 없이 and로 이어진 깨진 쿼리
      - 조건 없는 쿼리
    answer: "1"
    explanation: |-
      **정상 쿼리예요.** 이름이 있어 where가 붙고, 가격은 비어 and가 붙지 않아요.

      - 반대로 가격만 넣으면 where 없이 and가 붙어 깨져요
      - 이 조합만 시험하면 문제를 찾지 못해요
    source: https://jakarta.ee/specifications/persistence/3.1/jakarta-persistence-spec-3.1.html
  - key: dq-injection
    concept: core
    coreQuestion: q1
    type: multiple_choice
    status: draft
    difficulty: 2
    body: 게시글 검색을 "select p from Post p where p.title like '%" + keyword + "%'"처럼 검색어를 JPQL 문자열에 이어 만들었어요. 무엇이 위험하고 어떻게 고칠까요?
    choices:
      - 위험하지 않다. JPQL은 SQL이 아니다
      - 따옴표가 든 검색어가 쿼리의 일부가 되어 조건을 바꿀 수 있다. 값은 파라미터로 넘긴다
      - 검색어가 길면 느려진다. 길이를 제한한다
    answer: "2"
    explanation: |-
      **인젝션이 돼요.** 입력이 쿼리 문자열의 일부가 되면 따옴표와 or로 조건을 풀 수 있어요.

      - 레슨에서 x' or '1'='1을 넣었더니 모든 상품이 나왔어요
      - :keyword 같은 파라미터로 넘기면 값으로만 쓰여요
    source: https://docs.spring.io/spring-data/jpa/reference/jpa/query-methods.html
  # ── 질문 2 ──
  - key: dq-spec-where
    concept: core
    coreQuestion: q2
    type: multiple_choice
    status: draft
    difficulty: 1
    body: 조건 값이 null이면 null을 돌려주는 Specification 셋(nameIs, priceAtLeast, categoryIs)을 Specification.allOf로 이어 findAll에 넘겨요. 이름은 null, 최소 가격은 10000, 카테고리는 null일 때 WHERE 절에 들어가는 조건은 무엇일까요?
    choices:
      - 셋 다
      - 가격 조건 하나
      - WHERE 절이 없다
    answer: "2"
    explanation: |-
      **가격 조건 하나예요.** null을 돌려준 Specification은 빠지고, 남은 조건만 and로 이어져요.

      - 손으로 이어 붙일 때 깨졌던 조합도 그대로 돌아요
    source: https://docs.spring.io/spring-data/jpa/reference/jpa/specifications.html
  - key: dq-spec-count
    concept: core
    coreQuestion: q2
    type: multiple_choice
    status: draft
    difficulty: 2
    body: 회원 검색에 이메일, 등급, 가입일 범위 조건이 있고 모두 선택이에요. Specification으로 만들면 조회 메서드와 Specification은 각각 몇 개 필요할까요?
    choices:
      - 조회 메서드 8개, Specification 3개
      - 조회 메서드 1개, Specification 3개
      - 조회 메서드 1개, Specification 8개
    answer: "2"
    explanation: |-
      **조회 메서드 1개와 Specification 3개예요.** 조건 하나에 Specification 하나를 두고, 들어온 것만 이어서 findAll(spec) 하나로 모든 조합을 처리해요.

      - 리포지토리는 JpaSpecificationExecutor를 상속해요
    source: https://docs.spring.io/spring-data/jpa/reference/jpa/specifications.html
  # ── 질문 3 ──
  - key: dq-querydsl-null
    concept: core
    coreQuestion: q3
    type: code_predict
    status: draft
    difficulty: 1
    body: nameEq, priceGoe, categoryEq는 값이 null이면 null을, 아니면 조건을 돌려줘요. 아래 Querydsl 코드가 만드는 SQL의 WHERE 절은 무엇일까요?
    code: |-
      query.selectFrom(product)
          .where(nameEq(null),
              priceGoe(10000),
              categoryEq(null))
          .fetch();
    choices:
      - where price>=?
      - where name=? and price>=? and category=?
      - NullPointerException이 난다
    answer: "1"
    explanation: |-
      **where price>=?예요.** Querydsl의 where는 null 조건을 무시해요.

      - 그래서 조건 메서드가 값이 없을 때 null을 돌려주게 만들어요
    source: http://querydsl.com/static/querydsl/latest/reference/html/
  - key: dq-rename-field
    concept: core
    coreQuestion: q3
    type: multiple_choice
    status: draft
    difficulty: 2
    body: 엔티티 필드 price를 salePrice로 바꿨어요. Specification의 root.get("price")와 Querydsl의 product.price는 각각 언제 문제가 드러날까요?
    choices:
      - 둘 다 컴파일할 때
      - Specification은 그 조건으로 실행할 때, Querydsl은 컴파일할 때
      - 둘 다 실행할 때
    answer: "2"
    explanation: |-
      **Querydsl만 컴파일할 때 드러나요.** Q 클래스가 다시 만들어지며 price 필드가 사라지고, Specification의 "price"는 문자열이라 실행해야 알아요.

      - 이것이 Querydsl을 쓰는 가장 큰 이유예요
    source: http://querydsl.com/static/querydsl/latest/reference/html/
  # ── 질문 4 ──
  - key: dq-choose-fixed
    concept: core
    coreQuestion: q4
    type: multiple_choice
    status: draft
    difficulty: 1
    body: 이메일로 회원 하나를 찾는 조회를 만들어요. 조건은 늘 이메일 하나예요. 무엇으로 만들까요?
    choices:
      - 메서드 이름 쿼리 findByEmail
      - Specification
      - Querydsl
    answer: "1"
    explanation: |-
      **메서드 이름 쿼리예요.** 조건이 고정이면 동적 쿼리가 필요 없어요.

      - 동적 쿼리는 선택 조건의 조합이 많을 때 써요
    source: https://docs.spring.io/spring-data/jpa/reference/jpa/query-methods.html
  - key: dq-choose-many
    concept: core
    coreQuestion: q4
    type: multiple_choice
    status: draft
    difficulty: 2
    body: 관리자 주문 검색에 선택 조건이 7개이고, 팀은 필드 이름이 바뀌었을 때 컴파일 단계에서 알기를 원해요. 무엇을 고를까요?
    choices:
      - JPQL 문자열 이어 붙이기
      - Specification
      - Querydsl
    answer: "3"
    explanation: |-
      **Querydsl이에요.** Q 클래스의 필드로 쿼리를 써서 필드 이름 오타가 컴파일 오류가 돼요.

      - 대신 querydsl-apt 코드 생성 설정이 더 필요해요
    source: http://querydsl.com/static/querydsl/latest/reference/html/
  # ── 네 질문을 하나로 ──
  - key: dq-interview
    concept: core
    coreQuestion: all
    type: descriptive
    status: draft
    difficulty: 2
    body: 면접에서 "JPA에서 동적 쿼리는 어떻게 만들고, Querydsl은 왜 쓰나요?"라는 질문을 받았어요. 1분 안에 답해 보세요.
    explanation: |-
      **들어온 조건만 WHERE에 넣는 쿼리를 Specification이나 Querydsl로 조립하고, Querydsl은 필드 이름까지 컴파일러가 확인해서 써요.**

      - JPQL 문자열 이어 붙이기는 조합마다 깨지기 쉽고 값을 이으면 인젝션이 된다
      - Specification은 null 조건을 빼고 and로 잇지만 필드 이름이 문자열이다
      - Querydsl은 Q 클래스로 쓰고 where가 null을 무시한다
      - 조건이 고정이면 메서드 이름 쿼리나 JPQL로 충분하다
    checklist:
      - 문자열 이어 붙이기의 문제를 말했다
      - 값은 파라미터로 넘긴다고 말했다
      - Specification으로 조건을 조립한다고 말했다
      - Querydsl이 컴파일 시점에 필드를 확인한다고 말했다
      - 고정 조건은 메서드 이름 쿼리로 충분하다고 말했다
    source: https://docs.spring.io/spring-data/jpa/reference/jpa/specifications.html
