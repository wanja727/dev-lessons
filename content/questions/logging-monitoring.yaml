# 로그와 모니터링 문제
# 형식: https://github.com/wanja727/retrievo/blob/main/docs/content-format.md
#
# 모든 문제는 coreQuestions의 질문 하나에 묶이고(coreQuestion), 답의 근거가 레슨 본문에 있다
# (site/src/content/lesson-pages/logging-monitoring.yaml의 says).
# 동작에 관한 정답은 verification의 LoggingMonitoringTest로 확인했다 (스프링 부트 3.5, Logback, Micrometer).
# 질문마다 첫 문제는 본문의 예시로 묻고, 둘째 문제는 다른 상황으로 옮겨 묻는다.
# 2026-11-25에 만들고 같은 날 검수해 reviewed로 바꿨다.
subject:
  key: dev
  name: 개발자 면접
lesson:
  key: logging-monitoring
  title: 로그와 모니터링
  unit: 테스트와 운영
  order: 907
concepts:
  - key: core
    name: 로그와 모니터링
coreQuestions:
  - key: q1
    text: "로그는 무엇을 어느 수준으로 남기나요?"
  - key: q2
    text: "수천 줄 가운데 한 요청의 로그를 어떻게 찾나요?"
  - key: q3
    text: "서버가 느려졌는지는 무엇으로 아나요?"
  - key: q4
    text: "무엇이 생기면 사람을 깨워야 하나요?"
questions:
  # ── 질문 1 ──
  - key: lm-placeholder
    concept: core
    coreQuestion: q1
    type: multiple_choice
    status: reviewed
    difficulty: 1
    body: 로그 수준이 INFO인 서버에서 log.debug("장바구니 {}", cart)가 1만 번 불렸어요. cart.toString()은 몇 번 불릴까요?
    choices:
      - 0번
      - 1만 번
      - 1번
      - 수준과 상관없이 2만 번
    answer: "1"
    explanation: |-
      **0번이에요.** 자리표시자 {}를 쓰면 로거가 수준이 켜져 있을 때만 문자열을 만들어요.

      - "장바구니 " + cart처럼 이어 붙이면 로그가 버려져도 1만 번 불려요
    source: https://www.slf4j.org/faq.html#logging_performance
  - key: lm-exception
    concept: core
    coreQuestion: q1
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: '재고 차감 실패를 log.warn("재고 차감 실패: " + e.getMessage())로 남겼어요. 나중에 원인을 찾을 때 로그에서 알 수 없는 것은?'
    choices:
      - 경고 수준이라는 것
      - 예외가 난 줄과 원인 예외(스택 트레이스)
      - 예외의 메시지
      - 로그를 남긴 시각
    answer: "2"
    explanation: |-
      **스택 트레이스와 원인 예외를 잃어요.** 메시지 글자만 이어 붙였기 때문이에요.

      - log.warn("재고 차감 실패 {}", sku, e)처럼 예외 객체를 마지막 인자로 넘겨요
    source: https://docs.spring.io/spring-boot/reference/features/logging.html
  - key: lm-secret
    concept: core
    coreQuestion: q1
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: 가입 요청 record SignupRequest(String email, String password)를 log.info("가입 요청 {}", request)로 남겼어요. 무엇이 문제일까요?
    choices:
      - 문제없다. INFO는 운영에서 찍히지 않는다
      - record의 toString이 password까지 찍어 비밀번호가 로그에 남는다
      - record는 로그에 찍을 수 없다
      - 자리표시자를 써서 아무것도 찍히지 않는다
    answer: "2"
    explanation: |-
      **비밀번호가 로그에 남아요.** record의 toString은 모든 필드를 찍어요.

      - 운영은 보통 INFO라 이 줄은 찍혀요
      - 필요한 필드(email)만 찍어요
    source: https://docs.spring.io/spring-boot/reference/features/logging.html
  # ── 질문 2 ──
  - key: lm-mdc-leak
    concept: core
    coreQuestion: q2
    type: code_predict
    status: reviewed
    difficulty: 2
    body: 주문 요청에만 requestId를 MDC에 넣는 필터예요. 톰캣 스레드 하나가 GET /orders/1을 처리한 뒤 이어서 GET /health를 처리했어요. /health의 로그 줄에 찍히는 requestId는?
    code: |-
      if (uri.startsWith("/orders")) {
        MDC.put("requestId", newId());
      }
      chain.doFilter(req, res);
      // MDC.remove를 하지 않음
    choices:
      - 빈 값
      - /orders/1 요청의 ID
      - 새로 만든 ID
      - 톰캣 스레드의 이름
    answer: "2"
    explanation: |-
      **앞 주문 요청의 ID가 찍혀요.** MDC는 스레드마다의 값이고, 톰캣은 스레드를 다시 써요.

      - finally에서 MDC.remove를 해야 해요
    source: https://docs.spring.io/spring-boot/reference/features/logging.html
  - key: lm-mdc-async
    concept: core
    coreQuestion: q2
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: 필터가 MDC에 requestId를 넣는 서버에서, 주문 처리 중에 @Async 메서드로 알림 메일을 보내요. 메일 메서드 안의 로그 줄에 requestId가 찍힐까요? 따로 설정한 것은 없어요.
    choices:
      - 찍힌다. 같은 요청이다
      - 찍히지 않는다. 다른 스레드라 MDC가 비어 있다
      - 메일 메서드의 이름이 찍힌다
      - 요청이 끝난 뒤에만 찍힌다
    answer: "2"
    explanation: |-
      **찍히지 않아요.** MDC는 넣은 스레드에만 있고, @Async는 다른 스레드에서 돌아요.

      - 스레드 풀에 TaskDecorator를 달아 MDC를 복사해요
    source: https://docs.spring.io/spring-boot/reference/features/logging.html
  # ── 질문 3 ──
  - key: lm-p99
    concept: core
    coreQuestion: q3
    type: multiple_choice
    status: reviewed
    difficulty: 1
    body: 주문 API 요청 100개 가운데 95개는 10ms, 5개는 2초가 걸렸어요. 평균과 p50, p99 가운데 느린 사용자를 드러내는 숫자는?
    choices:
      - 평균 (약 110ms)
      - p50 (10ms)
      - p99 (약 2초)
      - 셋 다 같다
    answer: "3"
    explanation: |-
      **p99예요.** 평균은 110ms, p50은 10ms라 느린 요청이 묻혀요.

      - 응답 시간은 평균이 아니라 p95, p99로 봐요
    source: https://docs.micrometer.io/micrometer/reference/concepts/timers.html
  - key: lm-tag-cardinality
    concept: core
    coreQuestion: q3
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: 결제 API의 응답 시간 타이머에 orderId 태그를 붙여 주문마다 따로 보려고 해요. 하루 주문이 50만 건이에요. 무엇이 문제일까요?
    choices:
      - 문제없다. 주문마다 자세히 볼 수 있다
      - 태그 값마다 지표가 생겨 하루에 수십만 개가 되어 저장소가 버티지 못한다
      - 타이머는 태그를 받지 않는다
      - 응답 시간이 길어진다
    answer: "2"
    explanation: |-
      **지표가 폭발해요.** 태그는 값마다 지표를 따로 만들어요.

      - 태그는 상태 코드, URI 틀처럼 값이 몇 개뿐인 것만 써요
      - 특정 주문을 쫓는 일은 로그와 요청 ID가 해요
    source: https://docs.micrometer.io/micrometer/reference/concepts/timers.html
  # ── 질문 4 ──
  - key: lm-alert-cpu
    concept: core
    coreQuestion: q4
    type: multiple_choice
    status: reviewed
    difficulty: 1
    body: CPU 사용률 80%에 알림을 걸었더니 새벽 배치가 돌 때마다 울려요. 그때 사용자 응답은 빨라요. 어떻게 고치는 것이 맞을까요?
    choices:
      - 기준을 90%로 올린다
      - 오류율이나 응답 시간 p99 같은 증상에 알림을 건다
      - 배치를 낮에 돌린다
      - 알림을 모두 끈다
    answer: "2"
    explanation: |-
      **증상에 알림을 걸어요.** CPU는 원인 후보라 사용자가 멀쩡해도 울리고, 아플 때 조용할 수도 있어요.

      - 원인 지표는 알림이 울린 뒤 원인을 찾을 때 봐요
    source: https://sre.google/sre-book/monitoring-distributed-systems/
  - key: lm-alert-symptom
    concept: core
    coreQuestion: q4
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: CPU 20%, 메모리 여유, GC도 조용한데 주문 API의 p99가 5초로 올랐어요. 알림이 울려야 할까요?
    choices:
      - 울리지 않아도 된다. 자원이 넉넉하다
      - 울려야 한다. 사용자가 겪는 증상이다
      - 평균이 괜찮으면 울리지 않는다
      - 메모리가 오를 때까지 기다린다
    answer: "2"
    explanation: |-
      **울려야 해요.** 응답 시간은 사용자가 겪는 증상이에요.

      - 원인은 CPU가 아닌 곳(커넥션 풀, 외부 API, 락)에 있을 수 있어요
    source: https://sre.google/sre-book/monitoring-distributed-systems/
  # ── 면접 ──
  - key: lm-interview
    concept: core
    coreQuestion: all
    type: descriptive
    status: reviewed
    difficulty: 2
    body: 면접에서 "운영 중인 서버의 상태를 로그와 지표로 어떻게 보는지 설명해 주세요"라는 질문을 받았어요. 1분 안에 답해 보세요.
    explanation: |-
      **로그는 수준을 정해 남기고 요청 ID로 묶고, 지표는 백분위로 보며, 알림은 증상에 걸어요.**

      - **로그:** 수준, 자리표시자, 예외 객체, 비밀 값 금지
      - **요청 ID:** 필터에서 MDC에 넣고 finally에서 지운다. 스레드 풀은 복사
      - **지표:** 카운터, 게이지, 타이머. 평균 대신 p95, p99. 태그는 값이 적은 것만
      - **알림:** 오류율과 응답 시간 같은 증상에
    checklist:
      - 로그 수준과 운영에서 INFO를 쓴다는 것을 말했다
      - 요청 ID를 MDC에 넣어 한 요청의 로그를 묶는다고 말했다
      - 응답 시간을 평균이 아니라 백분위로 본다고 말했다
      - 알림을 원인이 아니라 증상에 건다고 말했다
      - MDC를 지우거나 비밀 값을 남기지 않는 것 같은 주의점을 말했다
    source: https://docs.spring.io/spring-boot/reference/actuator/metrics.html
