# 프록시와 데코레이터 패턴 문제
# 형식: https://github.com/wanja727/retrievo/blob/main/docs/content-format.md
#
# 모든 문제는 coreQuestions의 질문 하나에 묶이고(coreQuestion), 답의 근거가 레슨 본문에 있다
# (site/src/content/lesson-pages/proxy-decorator.yaml의 says).
# 동작에 관한 정답은 verification의 ProxyDecoratorTest로 확인했다 (자바 21, 스프링 프레임워크 6.2).
# 질문마다 첫 문제는 본문의 예시로 묻고, 둘째 문제는 다른 상황으로 옮겨 묻는다.
# 2026-11-25에 만들고 같은 날 검수해 reviewed로 바꿨다.
subject:
  key: dev
  name: 개발자 면접
lesson:
  key: proxy-decorator
  title: 프록시와 데코레이터 패턴
  unit: 객체지향 설계와 패턴
  order: 312
concepts:
  - key: core
    name: 프록시와 데코레이터 패턴
coreQuestions:
  - key: q1
    text: "같은 인터페이스로 감싼다는 것은 무엇이고, 무엇이 좋은가요?"
    answer: "감싸는 객체가 진짜 객체를 필드로 갖고, 같은 인터페이스를 구현해서 호출을 받은 뒤 진짜에게 넘기는 것이에요. 쓰는 쪽은 인터페이스만 알아서, 진짜를 받았는지 감싼 것을 받았는지 몰라요. 쓰는 쪽과 진짜 객체를 고치지 않고 기능을 붙여요."
    points:
      - "감싸는 객체가 진짜와 같은 인터페이스를 구현하고, 진짜를 안에 갖고 있다가 호출을 넘겨요"
      - "쓰는 쪽과 진짜 객체를 고치지 않고 기능을 붙일 수 있어요"
  - key: q2
    text: "프록시와 데코레이터는 무엇이 다른가요?"
    answer: "구조는 같고 의도가 달라요. 프록시는 진짜로 가는 접근을 다루고, 데코레이터는 진짜에 기능을 덧붙여요. 프록시는 캐시처럼 진짜를 부르지 않기도 해요. 데코레이터는 항상 진짜에게 넘기고 앞뒤에 일을 더하며, 여러 겹으로 쌓아요."
    points:
      - "구조는 같아요. 둘 다 같은 인터페이스를 구현하고 진짜를 감싸요"
      - "프록시는 진짜로 가는 접근을 다뤄요 (진짜를 부르지 않기도 해요)"
      - "데코레이터는 진짜를 그대로 부르고 기능을 덧붙여요"
  - key: q3
    text: "여러 겹으로 감싸면 순서가 중요한가요?"
    answer: "네. 바깥 것이 먼저 호출을 받아서, 감싸는 순서에 따라 무엇을 재고 무엇을 건너뛰는지가 달라져요. 시간 재기를 캐시 바깥에 두면 캐시에서 답한 빠른 호출까지 재고, 안쪽에 두면 진짜 API를 부른 느린 호출만 재요."
    points:
      - "중요해요. 바깥 것이 먼저 호출을 받아요"
      - "바깥 것이 스스로 답하면 안쪽은 불리지 않아서, 순서에 따라 안쪽이 보는 호출이 달라져요"
  - key: q4
    text: "감싸는 클래스를 매번 만들지 않을 수는 없나요?"
    answer: "있어요. JDK 동적 프록시는 실행 중에 인터페이스의 구현 클래스를 만들고, 모든 호출을 `InvocationHandler` 하나로 보내요. 감싼 것은 바깥에서 들어오는 호출만 받아요. 진짜 객체가 안에서 `this.method()`로 자기 메서드를 부르면 프록시를 지나지 않아요."
    points:
      - "JDK 동적 프록시가 실행 중에 인터페이스의 구현 클래스를 만들어 줘요"
      - "모든 메서드 호출을 핸들러(`InvocationHandler`) 하나로 보내요"
questions:
  # ── 질문 1 ──
  - key: pd-cache-calls
    concept: core
    coreQuestion: q1
    type: multiple_choice
    status: reviewed
    difficulty: 1
    body: CachingPriceService는 PriceService를 구현하고, 진짜 PriceService를 필드로 가져요. 캐시에 없는 상품만 진짜에게 넘겨요. id를 1, 2, 1, 3, 2 순서로 물으면 진짜 API는 몇 번 불릴까요?
    choices:
      - 5번
      - 3번
      - 2번
      - 1번
    answer: "2"
    explanation: |-
      **3번이에요.** 처음 보는 id(1, 2, 3)마다 한 번씩만 진짜에게 넘기고, 다시 나온 id는 캐시에서 답해요.
    source: https://github.com/wanja727/dev-lessons/blob/main/verification/src/test/java/lab/devlessons/proxydecorator/ProxyDecoratorTest.java
  - key: pd-member-repo
    concept: core
    coreQuestion: q1
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: MemberService는 생성자로 MemberRepository(인터페이스)를 받아요. findById 결과를 로그로 남기려고 MemberRepository를 구현하고 진짜 리포지토리를 감싸는 LoggingMemberRepository를 만들었어요. MemberService를 고쳐야 할까요?
    choices:
      - 고쳐야 한다. 새 클래스 타입으로 받아야 한다
      - 고치지 않는다. 조립하는 곳에서 감싼 것을 넘긴다
      - 고치지 않는다. 그런데 로그는 남지 않는다
    answer: "2"
    explanation: |-
      **고치지 않아요.** 감싼 것도 MemberRepository라서 진짜 자리에 그대로 들어가요.

      - 쓰는 쪽은 인터페이스만 알아서 감싼 것인지 몰라요
    source: https://github.com/wanja727/dev-lessons/blob/main/verification/src/test/java/lab/devlessons/proxydecorator/ProxyDecoratorTest.java
  # ── 질문 2 ──
  - key: pd-timing-calls
    concept: core
    coreQuestion: q2
    type: multiple_choice
    status: reviewed
    difficulty: 1
    body: TimingPriceService는 PriceService를 구현하고, 늘 진짜에게 넘긴 뒤 걸린 시간을 찍어요. 이것으로 감싸고 같은 상품을 세 번 물으면 진짜 API는 몇 번 불릴까요? 그리고 이 클래스는 무엇에 가까울까요?
    choices:
      - 1번, 프록시
      - 3번, 데코레이터
      - 3번, 프록시
      - 1번, 데코레이터
    answer: "2"
    explanation: |-
      **3번이고 데코레이터예요.** 진짜는 늘 부르고 그 앞뒤에 시간 재기를 덧붙여요.

      - 캐시처럼 진짜를 부르지 않기도 하며 접근을 다루는 것이 프록시예요
    source: https://github.com/wanja727/dev-lessons/blob/main/verification/src/test/java/lab/devlessons/proxydecorator/ProxyDecoratorTest.java
  - key: pd-admin-guard
    concept: core
    coreQuestion: q2
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: 관리자가 아니면 delete를 막고 예외를 던지는 감싸는 클래스를 만들었어요. 프록시와 데코레이터 가운데 어느 의도에 가까울까요?
    choices:
      - 프록시. 진짜로 가는 접근을 다룬다
      - 데코레이터. 기능을 덧붙인다
      - 둘 다 아니다
    answer: "1"
    explanation: |-
      **프록시예요.** 권한이 없으면 진짜를 부르지 않아요. 진짜로 가는 길을 다루는 것이 프록시의 의도예요.

      - 구조는 데코레이터와 같고, 이름은 무엇을 하려고 감쌌는지로 붙여요
    source: https://github.com/wanja727/dev-lessons/blob/main/verification/src/test/java/lab/devlessons/proxydecorator/ProxyDecoratorTest.java
  # ── 질문 3 ──
  - key: pd-stack-b
    concept: core
    coreQuestion: q3
    type: code_predict
    status: reviewed
    difficulty: 1
    body: 캐시가 바깥, 시간 재기가 안쪽이에요. 같은 상품 price(1)을 다섯 번 물으면 시간 로그는 몇 번 찍힐까요?
    code: |-
      PriceService b =
          new CachingPriceService(
              new TimingPriceService(api));
    choices:
      - 5번
      - 1번
      - 0번
    answer: "2"
    explanation: |-
      **1번이에요.** 처음 한 번만 캐시를 지나 안쪽 시간 재기와 진짜까지 가요. 나머지는 바깥 캐시가 답해서 안쪽까지 호출이 가지 않아요.

      - 시간 재기를 바깥에 두면 다섯 번 모두 찍혀요
    source: https://github.com/wanja727/dev-lessons/blob/main/verification/src/test/java/lab/devlessons/proxydecorator/ProxyDecoratorTest.java
  - key: pd-log-outside
    concept: core
    coreQuestion: q3
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: 권한 확인 프록시(권한이 없으면 예외)와 로그 데코레이터(들어온 호출을 기록)를 겹쳐요. 권한이 없어 막힌 호출도 로그에 남기려면 무엇을 바깥에 둬야 할까요?
    choices:
      - 권한 확인 프록시
      - 로그 데코레이터
      - 순서는 상관없다
    answer: "2"
    explanation: |-
      **로그 데코레이터를 바깥에 둬요.** 바깥이 먼저 호출을 받아서, 안쪽의 권한 확인이 막아도 로그는 이미 남아요.

      - 권한 확인이 바깥이면 막힌 호출은 로그까지 가지 않아요
    source: https://github.com/wanja727/dev-lessons/blob/main/verification/src/test/java/lab/devlessons/proxydecorator/ProxyDecoratorTest.java
  # ── 질문 4 ──
  - key: pd-handler-count
    concept: core
    coreQuestion: q4
    type: multiple_choice
    status: reviewed
    difficulty: 1
    body: Proxy.newProxyInstance로 PriceService의 프록시를 만들고, 핸들러는 메서드 이름을 기록한 뒤 method.invoke(api, args)로 넘겨요. proxy.price(1)을 두 번 부르면 핸들러가 받은 호출은 몇 번일까요?
    choices:
      - 0번
      - 1번
      - 2번
    answer: "3"
    explanation: |-
      **2번이에요.** 동적 프록시는 모든 메서드 호출을 핸들러 하나로 보내요.

      - 메서드가 많아도 감싸는 클래스를 직접 쓰지 않고 핸들러 하나로 감싸요
    source: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/lang/reflect/Proxy.html
  - key: pd-self-validate
    concept: core
    coreQuestion: q4
    type: ox
    status: reviewed
    difficulty: 2
    body: "\"동적 프록시로 감싼 OrderService의 placeOrder()가 안에서 this.validate()를 부르면, 핸들러는 placeOrder와 validate 두 호출을 받는다\""
    answer: X
    explanation: |-
      **placeOrder 하나만 받아요.** 진짜 객체 안의 this는 프록시가 아니라 진짜 자신이라, this로 부른 메서드는 프록시를 지나지 않아요.
    source: https://github.com/wanja727/dev-lessons/blob/main/verification/src/test/java/lab/devlessons/proxydecorator/ProxyDecoratorTest.java
  - key: pd-transactional-self
    concept: core
    coreQuestion: q4
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: 스프링 빈 OrderService의 placeAll()(@Transactional 없음)이 for 문에서 같은 클래스의 @Transactional 메서드 place()를 this로 불러요. 컨트롤러가 placeAll()을 부르면 place()에 트랜잭션이 걸릴까요?
    choices:
      - 걸린다. @Transactional이 붙어 있다
      - 걸리지 않는다. 자기 호출은 프록시를 지나지 않는다
      - 컴파일 오류
    answer: "2"
    explanation: |-
      **걸리지 않아요.** @Transactional은 스프링이 만든 프록시가 트랜잭션을 끼워 넣는 것이라, 같은 클래스 안의 this 호출에는 적용되지 않아요.

      - place를 다른 빈으로 옮기고 주입받아 부르면 프록시를 지나요
    source: https://docs.spring.io/spring-framework/reference/core/aop/proxying.html
  # ── 네 질문을 하나로 ──
  - key: pd-interview
    concept: core
    coreQuestion: all
    type: descriptive
    status: reviewed
    difficulty: 2
    body: 면접에서 "프록시 패턴과 데코레이터 패턴을 설명하고, 스프링 AOP와 어떻게 이어지는지 말해 주세요"라는 질문을 받았어요. 1분 안에 답해 보세요.
    explanation: |-
      **같은 인터페이스로 진짜를 감싸는 구조이고, 프록시는 접근을, 데코레이터는 기능 덧붙이기를 해요. 스프링 AOP는 이 프록시를 실행 중에 만들어요.**

      - **구조:** 같은 인터페이스 구현, 진짜를 필드로, 호출을 넘긴다. 쓰는 쪽은 모른다
      - **차이:** 프록시는 캐시, 권한처럼 진짜를 안 부르기도 하고, 데코레이터는 늘 부르고 일을 더한다
      - **순서:** 바깥이 먼저 받는다. 순서에 따라 재는 것이 달라진다
      - **동적 프록시와 함정:** 핸들러 하나로 감싼다. this 호출은 프록시를 지나지 않아 @Transactional이 빠진다
    checklist:
      - 같은 인터페이스를 구현하고 진짜를 감싼다고 말했다
      - 프록시는 접근을 다루고 데코레이터는 기능을 덧붙인다고 말했다
      - 겹쳐 감쌀 때 순서가 결과를 바꾼다고 말했다
      - 동적 프록시나 스프링 AOP가 실행 중에 프록시를 만든다고 말했다
      - 자기 호출은 프록시를 지나지 않는다고 말했다
    source: https://github.com/wanja727/dev-lessons/blob/main/verification/src/test/java/lab/devlessons/proxydecorator/ProxyDecoratorTest.java
