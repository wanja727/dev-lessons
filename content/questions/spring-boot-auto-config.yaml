# 스프링 부트의 자동 설정 문제
# 형식: https://github.com/wanja727/retrievo/blob/main/docs/content-format.md
#
# 모든 문제는 coreQuestions의 질문 하나에 묶이고(coreQuestion), 답의 근거가 레슨 본문에 있다
# (site/src/content/lesson-pages/spring-boot-auto-config.yaml의 says).
# 동작에 관한 정답은 verification의 AutoConfigTest로 확인했다 (스프링 부트 3.5).
# 질문마다 첫 문제는 본문의 예시로 묻고, 둘째 문제는 다른 상황으로 옮겨 묻는다.
subject:
  key: dev
  name: 개발자 면접
lesson:
  key: spring-boot-auto-config
  title: 스프링 부트의 자동 설정
  unit: 스프링
  order: 704
concepts:
  - key: core
    name: 스프링 부트의 자동 설정
coreQuestions:
  - key: q1
    text: "의존성만 넣었는데 왜 빈이 생기나요?"
  - key: q2
    text: "자동 설정은 언제 빈을 만들고 언제 만들지 않나요?"
  - key: q3
    text: "내가 같은 빈을 만들면 무엇이 쓰이나요?"
  - key: q4
    text: "자동 설정의 동작을 바꾸려면 어떻게 하나요?"
questions:
  # ── 질문 1 ──
  - key: ac-enable
    concept: core
    coreQuestion: q1
    type: multiple_choice
    status: draft
    difficulty: 1
    body: '컨트롤러만 둔 스프링 부트 웹 앱에서 @SpringBootApplication 대신 @SpringBootConfiguration과 @ComponentScan만 붙였어요(@EnableAutoConfiguration은 뺐어요). 이 앱에 자동 설정의 ObjectMapper 빈이 생길까요?'
    choices:
      - 생긴다. 스타터에 잭슨이 들어 있다
      - 생기지 않는다. 자동 설정 목록을 읽지 않는다
      - 생기지만 이름이 다르다
      - 컴파일 오류가 난다
    answer: "2"
    explanation: |-
      **생기지 않아요.** 자동 설정 클래스 목록을 읽어 빈을 만드는 것은 @EnableAutoConfiguration이에요.

      - @SpringBootApplication은 @SpringBootConfiguration, @ComponentScan, @EnableAutoConfiguration을 합친 것이에요
      - 잭슨 라이브러리가 있어도 그것을 빈으로 만드는 자동 설정이 돌지 않아요
    source: https://docs.spring.io/spring-boot/reference/using/auto-configuration.html
  - key: ac-starter
    concept: core
    coreQuestion: q1
    type: multiple_choice
    status: draft
    difficulty: 2
    body: 팀원이 "spring-boot-starter-data-redis jar 안에 Redis 빈을 만드는 설정 코드가 있다"고 말해요. 이 말에 대해 맞는 것은 무엇일까요?
    choices:
      - 맞다. 스타터마다 자기 설정 코드를 갖는다
      - 틀리다. 스타터는 라이브러리 묶음이고, 빈을 만드는 RedisAutoConfiguration은 spring-boot-autoconfigure에 있다
      - 틀리다. Redis 빈은 개발자가 늘 직접 만들어야 한다
      - 맞다. 스타터를 넣으면 @EnableAutoConfiguration 없이도 빈이 생긴다
    answer: "2"
    explanation: |-
      **틀려요.** 스타터는 함께 쓰는 라이브러리를 버전까지 맞춰 가져오는 묶음이고, 빈을 만드는 코드는 spring-boot-autoconfigure의 자동 설정 클래스에 있어요.

      - 그 목록은 AutoConfiguration.imports 파일에 적혀 있어요
    source: https://docs.spring.io/spring-boot/reference/features/developing-auto-configuration.html
  # ── 질문 2 ──
  - key: ac-conditions
    concept: core
    coreQuestion: q2
    type: multiple_choice
    status: draft
    difficulty: 1
    body: JacksonAutoConfiguration에는 클래스에 @ConditionalOnClass(ObjectMapper.class), ObjectMapper를 만드는 메서드에 @ConditionalOnMissingBean이 붙어 있어요. 클래스패스에 잭슨이 있고 내가 만든 ObjectMapper 빈은 없어요. 자동 설정이 ObjectMapper를 만들까요?
    choices:
      - 만든다. 두 조건이 모두 맞는다
      - 만들지 않는다. @ConditionalOnMissingBean은 빈이 있을 때만 만든다
      - 만들지 않는다. 잭슨이 있으면 개발자가 만들어야 한다
      - 둘을 만든다
    answer: "1"
    explanation: |-
      **만들어요.** 잭슨 클래스가 있어 클래스의 조건이 맞고, ObjectMapper 빈이 아직 없어 메서드의 조건도 맞아요.

      - @ConditionalOnMissingBean은 같은 빈이 "없을 때" 만든다는 뜻이에요
    source: https://docs.spring.io/spring-boot/reference/using/auto-configuration.html
  - key: ac-missing-class
    concept: core
    coreQuestion: q2
    type: multiple_choice
    status: draft
    difficulty: 2
    body: '어떤 자동 설정 클래스에 @ConditionalOnClass(name = "io.lettuce.core.RedisClient")가 붙어 있고, 안에 @Bean 메서드가 세 개 있어요. 앱에 Lettuce 라이브러리가 없으면 어떻게 될까요?'
    choices:
      - '@Bean 세 개가 모두 만들어진다'
      - 클래스를 통째로 건너뛰어 하나도 만들어지지 않는다
      - 앱이 ClassNotFoundException으로 뜨지 않는다
      - 첫 번째 @Bean만 만들어진다
    answer: "2"
    explanation: |-
      **통째로 건너뛰어요.** 클래스에 붙은 조건이 맞지 않으면 그 설정 클래스의 빈은 하나도 만들지 않고, 에러도 나지 않아요.

      - 왜 빠졌는지는 조건 평가 보고서에 "did not find required class"로 나와요
    source: https://docs.spring.io/spring-boot/reference/using/auto-configuration.html
  # ── 질문 3 ──
  - key: ac-my-mapper
    concept: core
    coreQuestion: q3
    type: code_predict
    status: draft
    difficulty: 1
    body: 아래처럼 내 ObjectMapper 빈을 만들고 설정 값도 적었어요. 컨트롤러가 OrderSummary(1, "latte", 2)를 돌려주면 응답 JSON의 첫 키는 무엇일까요?
    code: |-
      record OrderSummary(long orderId,
          String menuName, int quantity) {}

      @Configuration
      class JsonConfig {
        @Bean
        ObjectMapper objectMapper() {
          return new ObjectMapper();
        }
      }

      # application.yml
      spring.jackson.property-naming-strategy:
        SNAKE_CASE
    choices:
      - order_id
      - orderId
      - 앱이 뜨지 않는다. ObjectMapper가 둘이다
      - OrderId
    answer: "2"
    explanation: |-
      **orderId예요.** 내 ObjectMapper가 있으면 자동 설정은 물러나고, spring.jackson.* 값은 자동 설정이 자기 ObjectMapper를 만들 때만 적용돼요.

      - @ConditionalOnMissingBean 덕분에 빈이 둘이 되지 않아 앱은 떠요
      - 내 new ObjectMapper()는 날짜 모듈도 없어서 LocalDate가 든 응답은 500이 나요
    source: https://docs.spring.io/spring-boot/how-to/spring-mvc.html
  - key: ac-datasource-bean
    concept: core
    coreQuestion: q3
    type: multiple_choice
    status: draft
    difficulty: 3
    body: 'DataSource 자동 설정은 DataSource 빈이 없을 때만 커넥션 풀을 만들어요. 내가 @Bean으로 HikariDataSource를 직접 만들어 돌려주고, application.yml에는 spring.datasource.hikari.maximum-pool-size: 30을 적었어요. 내 빈에서 그 값을 따로 읽지는 않아요. 풀 크기는 30이 될까요?'
    choices:
      - 된다. 스프링이 설정 값을 모든 DataSource에 넣어 준다
      - 되지 않는다. 그 값은 자동 설정이 자기 빈을 만들 때 넣는데, 자동 설정이 물러났다
      - 앱이 뜨지 않는다. DataSource가 둘이다
      - 된다. hikari 설정은 HikariDataSource가 스스로 읽는다
    answer: "2"
    explanation: |-
      **되지 않아요.** 내 빈이 있으면 자동 설정이 물러나고, 자동 설정이 해 주던 설정 값 적용도 함께 사라져요.

      - 내 빈을 만들면 그 빈의 설정은 처음부터 내 몫이에요
      - 풀 크기만 바꾸려면 내 빈을 만들지 않고 설정 값만 적어요
    source: https://docs.spring.io/spring-boot/reference/using/auto-configuration.html
  # ── 질문 4 ──
  - key: ac-property-first
    concept: core
    coreQuestion: q4
    type: multiple_choice
    status: draft
    difficulty: 1
    body: 응답 JSON의 키를 order_id 같은 밑줄 모양으로 바꾸고, LocalDate 같은 날짜 처리는 그대로 두고 싶어요. 가장 알맞은 방법은 무엇일까요?
    choices:
      - '@Bean ObjectMapper를 만들고 setPropertyNamingStrategy를 부른다'
      - 'application.yml에 spring.jackson.property-naming-strategy: SNAKE_CASE를 적는다'
      - JacksonAutoConfiguration을 exclude한다
      - 모든 record 필드 이름을 밑줄로 바꾼다
    answer: "2"
    explanation: |-
      **설정 값을 적어요.** 내 빈을 만들지 않으면 자동 설정의 ObjectMapper가 이 값을 읽고, 날짜 모듈 같은 다른 설정도 그대로 남아요.

      - 내 ObjectMapper 빈은 자동 설정을 물러나게 해서 날짜 모듈까지 사라지게 해요
    source: https://docs.spring.io/spring-boot/how-to/spring-mvc.html
  - key: ac-customizer
    concept: core
    coreQuestion: q4
    type: multiple_choice
    status: draft
    difficulty: 2
    body: 설정 목록(spring.jackson.*)에 없는 잭슨 기능 하나를 켜고 싶어요. 자동 설정의 다른 설정은 모두 유지해야 해요. 무엇을 만들까요?
    choices:
      - 내 @Bean ObjectMapper
      - Jackson2ObjectMapperBuilderCustomizer 빈
      - '@SpringBootApplication(exclude = JacksonAutoConfiguration.class)'
      - '@ConditionalOnMissingBean을 붙인 @Configuration'
    answer: "2"
    explanation: |-
      **커스터마이저 빈을 만들어요.** 자동 설정은 물러나지 않고, ObjectMapper를 만들 때 내 커스터마이저를 함께 적용해요.

      - 그래서 ObjectMapper 빈은 여전히 자동 설정의 jacksonObjectMapper예요
    source: https://docs.spring.io/spring-boot/how-to/spring-mvc.html
  - key: ac-jpa-no-url
    concept: core
    coreQuestion: q4
    type: multiple_choice
    status: draft
    difficulty: 2
    body: spring-boot-starter-data-jpa와 PostgreSQL 드라이버를 넣고, spring.datasource.url은 적지 않은 채 앱을 띄웠어요. 내장 DB 라이브러리(H2 등)는 없어요. 어떻게 될까요?
    choices:
      - 앱이 뜨고 DB를 쓰는 순간 에러가 난다
      - 앱이 뜨지 않고 "Failed to configure a DataSource" 메시지가 나온다
      - 스프링 부트가 localhost의 PostgreSQL에 알아서 붙는다
      - JPA 자동 설정이 꺼져서 문제없이 뜬다
    answer: "2"
    explanation: |-
      **앱이 뜨지 않아요.** 스타터가 커넥션 풀 라이브러리를 가져와 DataSource 자동 설정의 조건이 맞는데, 어느 DB에 붙을지 몰라 DataSource를 만들지 못해요.

      - 고치려면 spring.datasource.url 등을 적거나, DB가 필요 없으면 그 자동 설정을 exclude해요
    source: https://docs.spring.io/spring-boot/reference/data/sql.html
  # ── 전체 ──
  - key: ac-interview
    concept: core
    coreQuestion: all
    type: descriptive
    status: draft
    difficulty: 2
    body: 면접에서 "스프링 부트의 자동 설정은 어떻게 동작하나요?"라는 질문을 받았어요. 1분 안에 답해 보세요.
    explanation: |-
      **@EnableAutoConfiguration이 자동 설정 목록을 읽고, 조건이 맞는 것의 빈을 만들며, 내 빈이 있으면 물러나요.**

      - **목록:** spring-boot-autoconfigure의 AutoConfiguration.imports. 스타터는 라이브러리 묶음이다
      - **조건:** @ConditionalOnClass, @ConditionalOnMissingBean, @ConditionalOnProperty. 조건 평가 보고서로 확인한다
      - **내 빈:** 같은 빈을 만들면 자동 설정이 물러나고 그 빈에 해 주던 설정도 사라진다
      - **바꾸는 순서:** 설정 값, 커스터마이저, 내 빈, exclude
    checklist:
      - '@EnableAutoConfiguration이 자동 설정 클래스 목록을 읽는다고 말했다'
      - 조건(@ConditionalOnClass, @ConditionalOnMissingBean)이 맞을 때만 빈을 만든다고 말했다
      - 내가 같은 빈을 만들면 자동 설정이 물러난다고 말했다
      - 설정 값이나 커스터마이저로 먼저 바꾼다고 말했다
    source: https://docs.spring.io/spring-boot/reference/using/auto-configuration.html
