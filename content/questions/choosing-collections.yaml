# 컬렉션 고르기 문제
# 형식: https://github.com/wanja727/retrievo/blob/main/docs/content-format.md
#
# 모든 문제는 coreQuestions의 질문 하나에 묶이고(coreQuestion), 답의 근거가 레슨 본문에 있다
# (site/src/content/lesson-pages/choosing-collections.yaml의 says).
# 동작에 관한 정답은 verification의 ChoosingCollectionsTest로 확인했다 (자바 21).
# 질문마다 첫 문제는 본문의 예시로 묻고, 둘째 문제는 다른 상황으로 옮겨 묻는다.
subject:
  key: dev
  name: 개발자 면접
lesson:
  key: choosing-collections
  title: 컬렉션 고르기
  unit: 자료구조와 알고리즘
  order: 64
concepts:
  - key: core
    name: 컬렉션 고르기
coreQuestions:
  - key: q1
    text: "List, Set, Map 가운데 무엇을 고르나요?"
  - key: q2
    text: "같은 Set과 Map이라도 Hash, LinkedHash, Tree는 무엇이 다른가요?"
  - key: q3
    text: "키가 enum이거나 큐가 필요할 때는 무엇을 쓰나요?"
  - key: q4
    text: "컬렉션을 돌면서 지우면 왜 예외가 나나요?"
questions:
  # ── 질문 1 ──
  - key: coll-visitors
    concept: core
    coreQuestion: q1
    type: multiple_choice
    status: draft
    difficulty: 1
    body: 오늘 접속한 회원의 id를 모아 서로 다른 회원 수를 세요. 같은 회원이 하루에 여러 번 접속해요. 무엇에 담는 것이 맞을까요?
    choices:
      - List. size()가 답이다
      - Set. 같은 id를 한 번만 담으니 size()가 답이다
      - Map. 키가 id다
      - Queue. 접속한 순서대로 담는다
    answer: "2"
    explanation: |-
      **Set이에요.** 같은 값을 한 번만 담아서 size()가 곧 서로 다른 회원 수예요.

      - List는 같은 id를 여러 번 담아서 접속 횟수가 돼요
      - Set.add는 이미 있으면 false를 돌려줘서 contains로 먼저 확인할 필요도 없어요
    source: https://docs.oracle.com/en/java/javase/21/core/java-collections-framework.html
  - key: coll-discount-list
    concept: core
    coreQuestion: q1
    type: multiple_choice
    status: draft
    difficulty: 2
    body: 상품 1만 개마다 그 상품이 할인 대상 목록 5천 개에 있는지 확인해요. 할인 대상을 List에 담을 때와 HashSet에 담을 때 전체 비교 횟수는 각각 어느 정도일까요?
    choices:
      - 둘 다 1만 번 남짓
      - List는 최악 5천만 번, HashSet은 1만 번 남짓
      - List는 1만 번, HashSet은 5천만 번
      - 둘 다 5천만 번
    answer: "2"
    explanation: |-
      **List는 최악 5천만 번, HashSet은 1만 번 남짓이에요.** List.contains는 처음부터 끝까지 비교하는 O(n)이에요.

      - 한 번에 최악 5천 번을 1만 번 하니 5천만 번이에요
      - HashSet.contains는 해시로 칸 하나만 보는 평균 O(1)이에요
    source: https://docs.oracle.com/en/java/javase/21/core/java-collections-framework.html
  # ── 질문 2 ──
  - key: coll-log-order
    concept: core
    coreQuestion: q2
    type: multiple_choice
    status: draft
    difficulty: 1
    body: 주문 상태 변경 기록을 변경 시각을 키로 맵에 담고, 들어온 순서대로 다시 보여 줘요. 시각은 늘 커지는 순서로 들어와요. LinkedHashMap과 TreeMap에 대해 맞는 것은 무엇일까요?
    choices:
      - LinkedHashMap만 순서가 맞다
      - TreeMap만 순서가 맞다
      - 둘 다 순서가 맞다. 찾는 비용은 LinkedHashMap이 평균 O(1), TreeMap이 O(log n)이다
      - 둘 다 순서가 맞지 않는다
    answer: "3"
    explanation: |-
      **둘 다 순서가 맞아요.** 넣은 순서와 시각 순서가 같기 때문이에요.

      - LinkedHashMap은 넣은 순서를 지키며 평균 O(1)이에요
      - TreeMap은 키 순서를 지키며 O(log n)이에요. 범위로 자를 일이 있으면 TreeMap이에요
    source: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/LinkedHashMap.html
  - key: coll-search-terms
    concept: core
    coreQuestion: q2
    type: multiple_choice
    status: draft
    difficulty: 2
    body: 사용자가 입력한 검색어를 입력한 순서대로 보여 주되, 같은 검색어는 한 번만 보여 줘요. 무엇을 고를까요?
    choices:
      - ArrayList
      - HashSet
      - LinkedHashSet
      - TreeSet
    answer: "3"
    explanation: |-
      **LinkedHashSet이에요.** 같은 값을 한 번만 담는 Set이면서 넣은 순서를 지켜요.

      - HashSet은 순서가 정해지지 않아요
      - TreeSet은 가나다순으로 바뀌어요
      - ArrayList는 같은 검색어를 여러 번 담아요
    source: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/LinkedHashMap.html
  # ── 질문 3 ──
  - key: coll-enummap-order
    concept: core
    coreQuestion: q3
    type: code_predict
    status: draft
    difficulty: 1
    body: 주문 상태별 개수를 EnumMap으로 셌어요. 주문의 상태는 SHIPPED, ORDERED, PAID, SHIPPED 순서로 들어왔어요. count를 for로 돌면 키가 어떤 순서로 나올까요?
    code: |-
      enum Status { ORDERED, PAID, SHIPPED }

      Map<Status, Integer> count =
          new EnumMap<>(Status.class);
      for (Order o : orders) {
        count.merge(o.status(), 1,
            Integer::sum);
      }
    choices:
      - SHIPPED, ORDERED, PAID (처음 들어온 순서)
      - ORDERED, PAID, SHIPPED (선언 순서)
      - PAID, ORDERED, SHIPPED (가나다순)
      - 실행할 때마다 다르다
    answer: "2"
    explanation: |-
      **선언 순서 ORDERED, PAID, SHIPPED예요.** EnumMap은 상수의 선언 순서 번호를 배열의 칸 번호로 써요.

      - 해시를 계산하지 않고 충돌도 없어요
      - 주문 흐름 순서대로 보여 줄 화면에 그대로 쓸 수 있어요
    source: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/EnumMap.html
  - key: coll-dayofweek
    concept: core
    coreQuestion: q3
    type: multiple_choice
    status: draft
    difficulty: 2
    body: 요일(DayOfWeek enum)마다 가게의 영업 시간을 담아 월요일부터 보여 줘요. 가장 맞는 것은 무엇일까요?
    choices:
      - HashMap. 가장 흔히 쓰는 맵이다
      - EnumMap. 배열로 담아 빠르고 월요일부터 선언 순서로 돈다
      - LinkedHashMap. 넣은 순서를 지킨다
      - ArrayList. 요일은 일곱 개뿐이다
    answer: "2"
    explanation: |-
      **EnumMap이에요.** 키가 enum이면 선언 순서 번호로 배열에 담아서 해시를 계산하지 않고 선언 순서로 돌아요.

      - HashMap은 도는 순서가 정해지지 않아요
      - LinkedHashMap은 넣는 순서가 달라지면 보여 주는 순서도 달라져요
    source: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/EnumMap.html
  # ── 질문 4 ──
  - key: coll-remove-a
    concept: core
    coreQuestion: q4
    type: code_predict
    status: draft
    difficulty: 1
    body: 아래 코드를 실행하면 어떻게 될까요?
    code: |-
      List<String> cart = new ArrayList<>(
          List.of("A", "B", "C", "D"));
      for (String item : cart) {
        if (item.equals("A")) {
          cart.remove(item);
        }
      }
    choices:
      - cart는 [B, C, D]가 된다
      - ConcurrentModificationException이 난다
      - cart는 [A, B, C, D] 그대로다
      - 컴파일 오류가 난다
    answer: "2"
    explanation: |-
      **ConcurrentModificationException이 나요.** 반복 중에 리스트를 직접 고치면 반복자가 기억한 수정 횟수와 달라져요.

      - 다음 원소로 넘어갈 때 반복자가 비교하고 예외를 던져요(fail-fast)
      - 스레드가 하나여도 나요. cart.removeIf(item -> item.equals("A"))로 바꿔요
    source: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/ArrayList.html
  - key: coll-stock-remove
    concept: core
    coreQuestion: q4
    type: multiple_choice
    status: draft
    difficulty: 2
    body: "재고가 0인 상품을 Map<String, Integer> stock에서 지우려고 for (String k : stock.keySet()) { if (stock.get(k) == 0) stock.remove(k); }를 썼다가 예외가 났어요. 무엇으로 바꾸는 것이 맞을까요?"
    choices:
      - stock.values().removeIf(v -> v == 0);
      - keySet()을 values()로 바꾸고 stock.remove를 그대로 둔다
      - synchronized 블록으로 감싼다
      - try-catch로 예외를 잡고 계속 돈다
    answer: "1"
    explanation: |-
      **stock.values().removeIf(v -> v == 0)이에요.** values()나 entrySet()에서 지우면 맵에서도 지워지고, 반복자를 거쳐 지우는 것이라 예외가 없어요.

      - 예외는 스레드 문제가 아니라 반복 중에 맵을 직접 고쳐서 나요
      - 예외를 잡고 계속 돌면 일부 상품을 건너뛸 수 있어요
    source: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/HashMap.html
  - key: coll-grouping-order
    concept: core
    coreQuestion: q4
    type: multiple_choice
    status: draft
    difficulty: 2
    body: 주문을 금액 구간(1만 원 단위)으로 groupingBy(o -> o.amount() / 10_000)로 묶어 구간 순서대로 화면에 보여 주려 해요. 이 맵을 for로 돌면 구간이 금액 순으로 나온다고 할 수 있을까요?
    choices:
      - 있다. 키가 정수라 작은 순서로 돈다
      - 없다. groupingBy는 맵의 종류를 약속하지 않고 지금 구현은 HashMap이다
      - 있다. 스트림의 순서를 지킨다
      - 없다. 실행할 때마다 예외가 난다
    answer: "2"
    explanation: |-
      **없어요.** 기본 groupingBy는 지금 HashMap을 만들고, 어떤 맵을 만들지 API 문서가 약속하지 않아요.

      - 테스트에서 구간이 16, 0, 17 ... 순서로 돌았어요
      - groupingBy(분류 함수, TreeMap::new, Collectors.toList())처럼 맵을 만드는 함수를 넘겨요
    source: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/stream/Collectors.html
  # ── 네 질문을 하나로 ──
  - key: coll-interview
    concept: core
    coreQuestion: all
    type: descriptive
    status: draft
    difficulty: 2
    body: 면접에서 "List, Set, Map은 언제 쓰고, 구현은 어떻게 고르나요?"라는 질문을 받았어요. 1분 안에 답해 보세요.
    explanation: |-
      **무엇으로 꺼낼지로 인터페이스를 고르고, 순서와 비용으로 구현을 골라요.**

      - **인터페이스:** 위치와 순서는 List, 들어 있는지는 Set, 키로 찾기는 Map, 넣은 순서나 우선순위는 Queue
      - **비용:** List.contains는 O(n), HashSet.contains는 평균 O(1)
      - **구현:** Hash는 순서 없이 O(1), LinkedHash는 넣은 순서, Tree는 키 순서와 범위로 O(log n). 키가 enum이면 EnumMap
      - **주의:** 돌면서 지우면 ConcurrentModificationException이니 removeIf를 쓴다
    checklist:
      - 무엇으로 꺼내는지(위치, 들어 있는지, 키)로 List, Set, Map을 고른다고 말했다
      - List.contains는 O(n)이고 HashSet은 평균 O(1)이라고 말했다
      - Hash, LinkedHash, Tree의 순서와 비용 차이를 말했다
      - 키가 enum이면 EnumMap을 쓴다고 말했다
      - 돌면서 지우면 ConcurrentModificationException이 나고 removeIf나 Iterator.remove를 쓴다고 말했다
    source: https://docs.oracle.com/en/java/javase/21/core/java-collections-framework.html
