questions:
  - key: q-bd663a78
    concept: core
    type: descriptive
    status: reviewed
    difficulty: 1
    body: cache-aside 패턴의 읽기·쓰기 흐름과 TTL의 역할을 설명해 보세요
    explanation: "- 읽기: 캐시 먼저, 없으면 DB에서 읽어 TTL과 함께 넣기. 쓰기: DB 갱신 후 캐시 삭제. TTL은 무효화를 놓쳤을 때의 안전망"
    checklist:
      - 캐시를 먼저 보고 없으면 DB를 읽는다고 말했다
      - DB에서 읽은 값을 캐시에 넣는다고 말했다
      - 쓰기는 DB 갱신 후 캐시 삭제라고 말했다
      - TTL이 지나면 키가 사라져 원본을 다시 읽는다고 말했다
      - TTL의 길이가 정확성과 DB 부하의 트레이드오프라고 말했다
    source: https://docs.aws.amazon.com/AmazonElastiCache/latest/dg/Strategies.html
  - key: q-2f68a446
    concept: core
    type: descriptive
    status: reviewed
    difficulty: 2
    body: cache-aside와 write-through를 비교해 보세요
    explanation: "- 체크리스트 항목이 모범 답안의 요점이다"
    checklist:
      - cache-aside는 읽을 때 채운다고 말했다
      - write-through는 쓸 때 DB와 캐시를 함께 바꾼다고 말했다
      - cache-aside는 읽히는 것만 캐시되고 캐시 장애에도 동작한다고 말했다
      - write-through는 쓴 직후도 맞지만 쓰기가 느려지고 안 읽힐 값도 넣는다고 말했다
      - DB와 캐시 중 하나만 성공하는 경우를 언급했다
    source: https://docs.aws.amazon.com/AmazonElastiCache/latest/dg/Strategies.html
  - key: q-7f7a6826
    concept: core
    type: descriptive
    status: reviewed
    difficulty: 3
    body: 인기 상품의 캐시가 만료될 때마다 DB CPU가 치솟습니다. 원인과 대책을 말해 보세요
    explanation: |-
      - 캐시 스탬피드. CI 실측: 동시 100건이면 DB 조회 100번, 단일 로드로 1번
      - 검증: CacheStrategyTest (stampedeAndSingleFlight)
    checklist:
      - 만료 순간 동시 요청이 모두 캐시 실패를 본다고 말했다
      - 이를 캐시 스탬피드라고 불렀다
      - 같은 키는 한 요청만 DB로(단일 로드, 분산 락)를 말했다
      - TTL에 무작위 값 더하기를 말했다
      - 만료 전 미리 갱신을 말했다
    source: https://redis.io/docs/latest/commands/set/
  - key: q-e63a815f
    concept: core
    type: ox
    status: reviewed
    difficulty: 2
    body: cache-aside에서 가격을 바꿀 때 캐시를 먼저 지우고 DB를 갱신하면 항상 안전하다
    answer: X
    explanation: |-
      - 삭제와 갱신 사이에 끼어든 조회가 옛 값을 다시 캐시에 넣는다
      - 검증: CacheStrategyTest (deleteThenUpdateRaceLeavesStaleCache)
    source: https://docs.aws.amazon.com/AmazonElastiCache/latest/dg/Strategies.html
  - key: q-bec2330d
    concept: core
    type: code_predict
    status: reviewed
    difficulty: 1
    body: cache-aside(TTL 1시간)로 가격 10,000을 캐시한 뒤 DB만 8,000으로 바꾸고 바로 조회하면?
    choices:
      - 8,000
      - 10,000
      - 오류
    answer: "2"
    explanation: |-
      - 무효화하지 않으면 TTL이 끝날 때까지 옛 값이 나온다
      - 검증: CacheStrategyTest (updateWithoutInvalidationServesStaleValue)
    source: https://redis.io/docs/latest/commands/expire/
  - key: q-5c8db87b
    concept: core
    type: multiple_choice
    status: reviewed
    difficulty: 1
    body: 다음 중 캐시하기 가장 조심해야 하는 데이터는?
    choices:
      - 카테고리 목록
      - 상품 설명
      - 계좌 잔액
    answer: "3"
    explanation: "- 틀린 값이 돈 문제로 이어지는 값은 원본을 읽는다"
    source: https://docs.aws.amazon.com/AmazonElastiCache/latest/dg/Strategies.html
  - key: q-2253a4b5
    concept: core
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: 커밋 전에 캐시를 지우면 어떤 문제가 생길 수 있나?
    choices:
      - 없다
      - 커밋 전 다른 조회가 옛 DB 값을 캐시에 다시 넣을 수 있다
      - Redis가 트랜잭션을 롤백한다
    answer: "2"
    explanation: "- \"캐시 먼저 삭제\"와 같은 경쟁이 생긴다. 삭제는 커밋 뒤(AFTER_COMMIT)에 한다"
    source: https://docs.spring.io/spring-framework/reference/integration/cache.html
