# 캐시 전략과 무효화 문제
# 형식: https://github.com/wanja727/retrievo/blob/main/docs/content-format.md
#
# 모든 문제는 coreQuestions의 질문 하나에 묶이고(coreQuestion), 답의 근거가 레슨 본문에 있다
# (site/src/content/lesson-pages/cache-strategy.yaml의 says).
# 동작에 관한 정답은 verification의 CacheStrategyTest와 CachePracticeTest로 확인했다 (PostgreSQL 16, Redis 7).
# 질문마다 첫 문제는 본문의 예시로 묻고, 둘째 문제는 다른 상황으로 옮겨 묻는다.
# 2026-11-25에 핵심 질문 구조로 다시 쓰면서 예전 문제를 지우고 새로 썼다.
subject:
  key: dev
  name: 개발자 면접
lesson:
  key: cache-strategy
  title: 캐시 전략과 무효화
  unit: 시스템 설계와 아키텍처
  order: 904
concepts:
  - key: core
    name: 캐시 전략과 무효화
coreQuestions:
  - key: q1
    text: "캐시는 무엇을 빠르게 하고, cache-aside는 어떻게 동작하나요?"
  - key: q2
    text: "값이 바뀌면 캐시를 언제 어떤 순서로 지우나요?"
  - key: q3
    text: "캐시에 얼마나 오래, 얼마나 많이 두나요?"
  - key: q4
    text: "인기 키가 만료되는 순간 무슨 일이 생기나요?"
questions:
  # ── 질문 1 ──
  - key: cs-aside-three-reads
    concept: core
    coreQuestion: q1
    type: multiple_choice
    status: draft
    difficulty: 1
    body: cache-aside로 상품 가격을 Redis에 캐시해요(TTL 60초). 비어 있는 캐시에서 같은 상품을 1초 간격으로 세 번 조회하면 DB 조회는 몇 번일까요?
    choices:
      - 0번
      - 한 번
      - 세 번
      - 두 번
    answer: "2"
    explanation: |-
      **한 번이에요.** 첫 조회만 캐시를 놓쳐 DB에서 읽고 캐시에 넣어요.

      - 둘째와 셋째 조회는 캐시에서 바로 나와요(적중)
      - 테스트에서도 두 번 조회에 DB 조회는 한 번이었어요
    source: https://redis.io/docs/latest/commands/set/
  - key: cs-local-three-servers
    concept: core
    coreQuestion: q1
    type: multiple_choice
    status: draft
    difficulty: 2
    body: 서버 세 대가 각자 메모리의 맵으로 상품 가격을 캐시해요. 셋 다 비어 있을 때 같은 상품을 라운드 로빈으로 세 번 조회하면 DB 조회는 몇 번일까요?
    choices:
      - 한 번
      - 세 번
      - 0번
      - 아홉 번
    answer: "2"
    explanation: |-
      **세 번이에요.** 로컬 캐시는 서버마다 따로 있어서 세 서버가 각자 놓치고 DB에 가요.

      - Redis 같은 원격 캐시였다면 모든 서버가 같은 캐시를 봐서 한 번이었어요
      - 로컬 캐시는 빠르지만 서버마다 어긋날 수 있어요
    source: https://docs.spring.io/spring-boot/reference/io/caching.html
  # ── 질문 2 ──
  - key: cs-delete-first-race
    concept: core
    coreQuestion: q2
    type: code_predict
    status: draft
    difficulty: 1
    body: 가격이 10000원이고 캐시에도 10000이 있어요. 아래 update(1, 8000)이 캐시를 지운 직후, 조회 요청 하나가 캐시를 놓치고 DB에서 10000을 읽었어요. 그다음 update가 DB를 8000으로 바꾸고, 조회 요청이 읽어 둔 값을 캐시에 넣었어요. 끝난 뒤 DB와 캐시의 가격은?
    code: |-
      void update(long id, long price) {
        redis.del("price:" + id);
        updateDb(id, price);
      }
    choices:
      - DB 8000, 캐시 8000
      - DB 8000, 캐시 10000
      - DB 10000, 캐시 8000
      - DB 8000, 캐시 없음
    answer: "2"
    explanation: |-
      **DB는 8000, 캐시는 10000이에요.** 캐시를 먼저 지우면 그 사이 조회가 옛 값을 다시 넣어요.

      - 테스트로 재현하니 캐시의 10000이 TTL(약 60초) 동안 남았어요
      - DB를 먼저 바꾸고 캐시를 지우면 이 틈이 생기지 않아요
    source: https://docs.spring.io/spring-framework/reference/integration/cache/annotations.html
  - key: cs-nickname-order
    concept: core
    coreQuestion: q2
    type: multiple_choice
    status: draft
    difficulty: 2
    body: 회원 닉네임을 캐시해요. 닉네임을 바꾸는 코드가 `cache.delete(key)`를 먼저 부르고 그다음 `memberRepository.save(member)`를 불러요. 이 코드의 문제와 고친 순서로 맞는 것은?
    choices:
      - 문제없다. 지웠으니 다음 조회는 늘 새 닉네임을 읽는다
      - 지우기와 저장 사이에 들어온 조회가 옛 닉네임을 캐시에 다시 넣을 수 있다. 저장한 뒤에 캐시를 지운다
      - 캐시를 지우지 말고 새 닉네임으로 덮어쓰기만 하면 늘 맞다
      - 저장을 두 번 한다
    answer: "2"
    explanation: |-
      **저장한 뒤에 캐시를 지워요.** 먼저 지우면 그 틈에 옛 값이 다시 들어가요.

      - 덮어쓰기는 쓰기 두 건이 동시에 오면 DB와 다른 값이 남을 수 있어요
      - 드물게 어긋나는 경우를 위해 TTL도 함께 둬요
    source: https://docs.spring.io/spring-framework/reference/integration/cache/annotations.html
  - key: cs-cache-evict-timing
    concept: core
    coreQuestion: q2
    type: multiple_choice
    status: draft
    difficulty: 2
    body: "`@CacheEvict(cacheNames = \"price\", key = \"#id\")`를 붙인 `change(id, price)` 메서드가 DB의 가격을 바꿔요. 다른 속성은 주지 않았어요. 캐시는 언제 지워지나요?"
    choices:
      - 메서드를 실행하기 전에
      - 메서드가 정상으로 끝난 뒤에
      - 지워지지 않는다
      - 다음 조회가 올 때
    answer: "2"
    explanation: |-
      **메서드가 끝난 뒤에 지워요.** 기본값이 그래서 "DB 먼저, 캐시 나중" 순서와 같아요.

      - beforeInvocation = true를 주면 메서드 전에 지워요
      - 테스트에서 change 뒤의 조회는 메서드를 다시 실행했어요
    source: https://docs.spring.io/spring-framework/reference/integration/cache/annotations.html
  # ── 질문 3 ──
  - key: cs-ttl-latest
    concept: core
    coreQuestion: q3
    type: multiple_choice
    status: draft
    difficulty: 1
    body: 가격을 TTL 60초로 Redis에 캐시했어요. 관리자가 DB의 가격만 바꾸고 캐시는 지우지 않았어요. 바뀐 가격이 가장 늦게 언제 보이나요?
    choices:
      - 바로
      - 그 키를 캐시에 넣은 때부터 60초 뒤
      - 서버를 다시 시작할 때까지 보이지 않는다
      - 관리자가 가격을 바꾼 때부터 120초 뒤
    answer: "2"
    explanation: |-
      **캐시에 넣은 때부터 60초 뒤예요.** TTL이 지나면 키가 사라지고 다음 조회가 DB에서 새 값을 읽어요.

      - 그래서 TTL은 "최악에 이만큼 늦을 수 있다"는 약속이에요
      - 테스트에서 0.5초 TTL이 지난 뒤 조회가 새 가격을 줬어요
    source: https://redis.io/docs/latest/commands/set/
  - key: cs-lru-abc
    concept: core
    coreQuestion: q3
    type: multiple_choice
    status: draft
    difficulty: 2
    body: 최대 크기가 2인 LRU 캐시가 있어요. A, B를 넣고, A를 읽은 뒤, C를 넣었어요. 캐시에 남은 것은 무엇일까요?
    choices:
      - A와 B
      - A와 C
      - B와 C
      - A, B, C
    answer: "2"
    explanation: |-
      **A와 C예요.** LRU는 가장 오래 쓰지 않은 것부터 지워요. A를 방금 읽어서 B가 가장 오래됐어요.

      - 크기 한도가 없으면 캐시가 메모리를 계속 차지해요
      - Caffeine은 LRU를 고친 방식이라 정확한 LRU와 다를 수 있어요
    source: https://redis.io/docs/latest/develop/reference/eviction/
  # ── 질문 4 ──
  - key: cs-stampede-single
    concept: core
    coreQuestion: q4
    type: multiple_choice
    status: draft
    difficulty: 1
    body: 서버 한 대에서, 막 만료된 인기 키를 동시에 100건이 조회해요. 같은 키를 놓친 요청 가운데 한 건만 DB로 보내고 나머지는 그 결과를 기다리게 했어요. DB 조회는 몇 번일까요?
    choices:
      - 100번
      - 한 번
      - 50번
      - 0번
    answer: "2"
    explanation: |-
      **한 번이에요.** 첫 요청이 DB에서 읽는 동안 나머지 99건은 그 결과를 기다려요.

      - 그냥 cache-aside는 테스트에서 100건 대부분이 DB로 갔어요(캐시 스탬피드)
      - 서버가 여러 대면 서버마다 한 번씩은 가요
    source: https://docs.spring.io/spring-framework/reference/integration/cache/annotations.html
  - key: cs-midnight-ttl
    concept: core
    coreQuestion: q4
    type: multiple_choice
    status: draft
    difficulty: 2
    body: 자정에 상품 1만 개의 정보를 한꺼번에 캐시에 넣으며 모두 TTL 1시간을 줬어요. 새벽 1시쯤 생길 일과 고치는 방법으로 맞는 것은?
    choices:
      - 아무 일도 없다
      - 1만 개가 함께 만료되어 조회가 DB로 몰린다. TTL에 무작위 몇 분을 더해 만료를 흩는다
      - 캐시가 가득 차서 쓰기를 거절한다. 크기 한도를 없앤다
      - Redis가 키를 지우지 못한다. TTL을 없앤다
    answer: "2"
    explanation: |-
      **함께 만료되어 DB로 몰려요.** 같은 때 넣고 같은 TTL을 주면 같은 때 비어요.

      - TTL에 무작위 값을 더하면 만료가 흩어져요
      - 만료 전에 미리 갱신하는 방법도 있어요
    source: https://redis.io/docs/latest/commands/set/
  - key: cs-self-invocation
    concept: core
    coreQuestion: q4
    type: code_predict
    status: draft
    difficulty: 2
    body: 아래 `PriceService`는 스프링 빈이고 `@EnableCaching`이 켜져 있어요. 컨트롤러가 `priceService.summary(1)`을 두 번 부르면 `price` 메서드의 본문은 몇 번 실행될까요?
    code: |-
      @Service
      class PriceService {
        @Cacheable("price")
        public long price(long id) {
          return loadFromDb(id);
        }

        public String summary(long id) {
          return "가격: " + this.price(id);
        }
      }
    choices:
      - 한 번
      - 두 번
      - 0번
      - 네 번
    answer: "2"
    explanation: |-
      **두 번이에요.** 같은 클래스 안에서 this.price()로 부르면 캐시를 처리하는 프록시를 거치지 않아요.

      - 테스트에서도 안에서 부른 두 번이 모두 실행됐어요
      - 캐시 메서드를 다른 빈으로 빼서 주입받아 부르면 캐시가 걸려요
    source: https://docs.spring.io/spring-framework/reference/integration/cache/annotations.html
  # ── 네 질문을 하나로 ──
  - key: cs-interview
    concept: core
    coreQuestion: all
    type: descriptive
    status: draft
    difficulty: 2
    body: 면접에서 "캐시를 쓸 때 DB와 캐시를 어떻게 맞추고, 무엇을 조심하나요?"라는 질문을 받았어요. 1분 안에 답해 보세요.
    explanation: |-
      **cache-aside로 읽고, 바꿀 때는 DB를 먼저 바꾼 뒤 캐시를 지우며, TTL과 크기 한도와 스탬피드를 함께 챙겨요.**

      - **cache-aside:** 캐시를 보고 없으면 DB에서 읽어 TTL과 함께 넣는다
      - **무효화:** DB 먼저, 캐시 삭제 나중. 먼저 지우면 그 사이 조회가 옛 값을 다시 넣는다
      - **TTL과 한도:** 옛 값을 견딜 시간으로 TTL을 정하고, 크기 한도와 LRU로 메모리를 지킨다
      - **스탬피드:** 인기 키 만료 순간 DB로 몰린다. 한 요청만 읽게 하거나 TTL을 흩는다
    checklist:
      - cache-aside의 동작을 말했다
      - DB를 먼저 바꾸고 캐시를 지우는 순서와 그 이유를 말했다
      - TTL을 안전망으로 둔다고 말했다
      - 캐시 스탬피드와 막는 방법을 말했다
      - 재고나 잔액처럼 틀리면 안 되는 값은 캐시하지 않는다고 말했다
    source: https://docs.spring.io/spring-framework/reference/integration/cache/annotations.html
