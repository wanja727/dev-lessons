# 인증과 인가 문제
# 형식: https://github.com/wanja727/retrievo/blob/main/docs/content-format.md
#
# 모든 문제는 coreQuestions의 질문 하나에 묶이고(coreQuestion), 답의 근거가 레슨 본문에 있다
# (site/src/content/lesson-pages/spring-security.yaml의 says).
# 동작에 관한 정답은 verification의 SpringSecurityLessonTest로 확인했다 (스프링 시큐리티 6.5).
# 질문마다 첫 문제는 본문의 예시로 묻고, 둘째 문제는 다른 상황으로 옮겨 묻는다.
subject:
  key: dev
  name: 개발자 면접
lesson:
  key: spring-security
  title: 인증과 인가
  unit: 스프링
  order: 712
concepts:
  - key: core
    name: 인증과 인가
coreQuestions:
  - key: q1
    text: "인증과 인가는 무엇이 다른가요?"
  - key: q2
    text: "스프링 시큐리티는 요청을 어디에서 막나요?"
  - key: q3
    text: "로그인한 사용자 정보는 요청 동안 어디에 있나요?"
  - key: q4
    text: "토큰 방식은 세션 방식과 설정이 어떻게 다른가요?"
questions:
  # ── 질문 1 ──
  - key: sec-403
    concept: core
    coreQuestion: q1
    type: code_predict
    status: draft
    difficulty: 1
    body: 아래 규칙에서 회원 kim(역할 USER)이 올바른 아이디와 비밀번호로 GET /admin/stats를 요청하면 응답은 몇일까요?
    code: |-
      http.authorizeHttpRequests(a -> a
          .requestMatchers("/products/**")
              .permitAll()
          .requestMatchers("/admin/**")
              .hasRole("ADMIN")
          .anyRequest().authenticated())
        .httpBasic(Customizer.withDefaults());
    choices:
      - "200"
      - "401"
      - "403"
      - "404"
    answer: "3"
    explanation: |-
      **403이에요.** 아이디와 비밀번호가 맞아 인증은 됐지만, ADMIN 역할이 없어 인가에서 막혀요.

      - 비밀번호가 틀리면 인증부터 실패해서 401이에요
    source: https://docs.spring.io/spring-security/reference/servlet/authorization/authorize-http-requests.html
  - key: sec-401-403
    concept: core
    coreQuestion: q1
    type: multiple_choice
    status: draft
    difficulty: 2
    body: 사내 시스템에서 사원 lee가 로그인한 뒤 다른 부서의 급여 화면을 열자 "권한이 없습니다"가 나와요. 이것은 무엇의 실패이고 상태 코드는 몇이 맞을까요?
    choices:
      - 인증 실패, 401
      - 인가 실패, 403
      - 인증 실패, 403
      - 인가 실패, 401
    answer: "2"
    explanation: |-
      **인가 실패, 403이에요.** lee가 누구인지는 알아요(로그인함). 그 화면을 볼 권한이 없을 뿐이에요.

      - 401은 누구인지 모를 때(인증 실패)예요. 다시 로그인하면 해결될 수 있어요
      - 403은 다시 로그인해도 소용없어요
    source: https://www.rfc-editor.org/rfc/rfc9110
  # ── 질문 2 ──
  - key: sec-filter-401
    concept: core
    coreQuestion: q2
    type: multiple_choice
    status: draft
    difficulty: 1
    body: 스프링 시큐리티를 켠 앱에 로그인 없이 GET /orders를 보내 401을 받았어요. 이 401 응답을 만든 것은 무엇일까요?
    choices:
      - OrderController
      - '@RestControllerAdvice'
      - 시큐리티 필터 체인의 ExceptionTranslationFilter
      - 톰캣의 기본 에러 페이지
    answer: "3"
    explanation: |-
      **시큐리티 필터예요.** AuthorizationFilter가 "로그인 필요" 예외를 던지고 ExceptionTranslationFilter가 받아 401로 응답해요. 컨트롤러는 한 번도 불리지 않아요.
    source: https://docs.spring.io/spring-security/reference/servlet/architecture.html
  - key: sec-advice-no
    concept: core
    coreQuestion: q2
    type: multiple_choice
    status: draft
    difficulty: 2
    body: 401 응답 본문을 회사의 에러 형식으로 바꾸려고 @RestControllerAdvice에 AuthenticationException 핸들러를 만들었어요. 로그인 없는 요청의 응답이 바뀔까요?
    choices:
      - 바뀐다. 모든 예외는 어드바이스로 간다
      - 바뀌지 않는다. 시큐리티는 DispatcherServlet 앞의 필터에서 막아 어드바이스가 불리지 않는다
      - 바뀌지만 상태 코드가 500이 된다
      - 앱이 뜨지 않는다
    answer: "2"
    explanation: |-
      **바뀌지 않아요.** @ControllerAdvice는 DispatcherServlet 안에서 동작하는데, 시큐리티는 그 앞의 필터에서 요청을 끝내요.

      - 바꾸려면 시큐리티의 AuthenticationEntryPoint(401)와 AccessDeniedHandler(403)를 설정해요
    source: https://docs.spring.io/spring-security/reference/servlet/architecture.html
  # ── 질문 3 ──
  - key: sec-new-thread
    concept: core
    coreQuestion: q3
    type: multiple_choice
    status: draft
    difficulty: 1
    body: 로그인한 kim의 요청을 처리하는 컨트롤러에서 new Thread(...)로 새 스레드를 만들고, 그 스레드에서 SecurityContextHolder.getContext().getAuthentication()을 읽었어요. 기본 설정에서 무엇이 나올까요?
    choices:
      - kim의 Authentication
      - "null"
      - 다른 사용자의 Authentication
      - 예외가 난다
    answer: "2"
    explanation: |-
      **null이에요.** SecurityContextHolder는 기본으로 스레드에 묶인 저장소(ThreadLocal)라서 새 스레드에는 따라가지 않아요.

      - 같은 요청 스레드의 컨트롤러와 서비스에서는 kim이 보여요
    source: https://docs.spring.io/spring-security/reference/servlet/authentication/architecture.html
  - key: sec-cookie-deleted
    concept: core
    coreQuestion: q3
    type: multiple_choice
    status: draft
    difficulty: 2
    body: 폼 로그인(세션 방식)으로 로그인한 사용자가 브라우저의 쿠키를 모두 지우고 로그인이 필요한 /orders를 요청했어요. 어떻게 될까요?
    choices:
      - 서버가 기억하니 그대로 200
      - 세션을 찾을 JSESSIONID 쿠키가 없어 로그인이 필요하다고 응답한다
      - 서버의 세션도 함께 지워진다
      - 403
    answer: "2"
    explanation: |-
      **로그인이 필요하다고 응답해요.** 세션 방식은 로그인 정보를 서버의 세션에 두고, 요청의 JSESSIONID 쿠키로 그 세션을 찾아 SecurityContextHolder에 넣어요. 쿠키가 없으면 찾을 수 없어요.
    source: https://docs.spring.io/spring-security/reference/servlet/authentication/persistence.html
  # ── 질문 4 ──
  - key: sec-stateless
    concept: core
    coreQuestion: q4
    type: multiple_choice
    status: draft
    difficulty: 1
    body: sessionCreationPolicy(STATELESS)와 Authorization 헤더의 토큰을 검증하는 필터로 설정한 API에, 토큰 없이 GET /orders를 보냈어요. 응답과 Set-Cookie 헤더는 어떨까요?
    choices:
      - 401, JSESSIONID 쿠키가 붙는다
      - 401, Set-Cookie가 없다
      - 200, Set-Cookie가 없다
      - 403, JSESSIONID 쿠키가 붙는다
    answer: "2"
    explanation: |-
      **401이고 Set-Cookie가 없어요.** STATELESS는 시큐리티가 세션을 만들지도 읽지도 않게 해요. 토큰이 없으니 인증되지 않아 401이에요.
    source: https://docs.spring.io/spring-security/reference/servlet/authentication/persistence.html
  - key: sec-csrf
    concept: core
    coreQuestion: q4
    type: multiple_choice
    status: draft
    difficulty: 2
    body: 세션 쿠키로 로그인하는 앱에서 CSRF 보호를 끄지 않았어요. 로그인한 브라우저가 CSRF 토큰 없이 POST /orders를 보내면 응답은 몇일까요?
    choices:
      - "200"
      - "401"
      - "403"
      - "405"
    answer: "3"
    explanation: |-
      **403이에요.** 인증은 됐지만 CSRF 토큰이 없어 시큐리티의 CSRF 필터가 막아요.

      - 쿠키는 브라우저가 다른 사이트의 요청에도 자동으로 붙여서 CSRF를 막아야 해요
      - 헤더로 토큰을 보내는 API는 자동으로 붙지 않아 CSRF를 끄는 경우가 많아요
    source: https://docs.spring.io/spring-security/reference/servlet/exploits/csrf.html
  - key: sec-bcrypt
    concept: core
    coreQuestion: q3
    type: multiple_choice
    status: draft
    difficulty: 2
    body: PasswordEncoderFactories.createDelegatingPasswordEncoder()로 같은 비밀번호 "kim-pw"를 두 번 encode했어요. 결과로 맞는 것은 무엇일까요?
    choices:
      - 두 결과가 같다. 같은 입력이면 같은 해시다
      - 두 결과가 다르고, matches("kim-pw", 결과)는 둘 다 true다
      - 두 결과가 다르고, 처음 것만 matches가 true다
      - 원래 비밀번호로 되돌릴 수 있다
    answer: "2"
    explanation: |-
      **결과는 다르고 둘 다 matches가 true예요.** bcrypt는 무작위 값(소금)을 섞어 매번 다른 해시를 만들고, 그 소금이 해시 안에 들어 있어 비교할 수 있어요. 앞의 {bcrypt}는 방식을 알려 주는 표시예요.
    source: https://docs.spring.io/spring-security/reference/features/authentication/password-storage.html
  # ── 전체 ──
  - key: sec-interview
    concept: core
    coreQuestion: all
    type: descriptive
    status: draft
    difficulty: 2
    body: 면접에서 "스프링 시큐리티의 동작 과정과 세션 방식, 토큰 방식의 차이를 설명해 주세요"라는 질문을 받았어요. 1분 안에 답해 보세요.
    explanation: |-
      **DispatcherServlet 앞의 필터 체인에서 인증하고 인가하며, 로그인 상태를 세션에 두는지 토큰으로 받는지가 달라요.**

      - **인증과 인가:** 누구인지 확인(실패 401), 해도 되는지 확인(실패 403)
      - **필터 체인:** 인증 필터가 사용자를 SecurityContextHolder에 넣고, AuthorizationFilter가 검사, ExceptionTranslationFilter가 401과 403으로 응답. 컨트롤러에 닿지 않는다
      - **세션 방식:** 로그인 정보를 세션에 저장하고 JSESSIONID로 꺼낸다. CSRF 보호를 켠다
      - **토큰 방식:** STATELESS, 요청마다 헤더의 토큰을 필터가 검증. 서버를 늘리기 쉽다
    checklist:
      - 인증과 인가의 차이와 401, 403을 말했다
      - 시큐리티가 DispatcherServlet 앞의 필터 체인에서 동작한다고 말했다
      - 로그인한 사용자가 SecurityContextHolder에 놓인다고 말했다
      - 세션 방식과 토큰 방식의 차이(세션 저장과 STATELESS, CSRF)를 말했다
    source: https://docs.spring.io/spring-security/reference/servlet/architecture.html
