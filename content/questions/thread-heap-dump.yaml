# 스레드 덤프와 힙 덤프 문제
# 형식: https://github.com/wanja727/retrievo/blob/main/docs/content-format.md
#
# 모든 문제는 coreQuestions의 질문 하나에 묶이고(coreQuestion), 답의 근거가 레슨 본문에 있다
# (site/src/content/lesson-pages/thread-heap-dump.yaml의 says).
# 동작에 관한 정답은 verification의 ThreadHeapDumpTest로 확인했다 (자바 21, jcmd).
# 질문마다 첫 문제는 본문의 예시로 묻고, 둘째 문제는 다른 상황으로 옮겨 묻는다.
subject:
  key: dev
  name: 개발자 면접
lesson:
  key: thread-heap-dump
  title: 스레드 덤프와 힙 덤프
  unit: 테스트와 운영
  order: 910
concepts:
  - key: core
    name: 스레드 덤프와 힙 덤프
coreQuestions:
  - key: q1
    text: "스레드 덤프에는 무엇이 보이나요?"
  - key: q2
    text: "멈춘 서버의 원인을 스레드 덤프에서 어떻게 찾나요?"
  - key: q3
    text: "메모리를 붙잡고 있는 것은 어떻게 찾나요?"
  - key: q4
    text: "메모리 장애의 증거를 어떻게 미리 남기나요?"
questions:
  # ── 질문 1 ──
  - key: td-sleep-state
    concept: core
    coreQuestion: q1
    type: multiple_choice
    status: draft
    difficulty: 1
    body: 스레드 덤프에서 synchronized 블록 안에서 Thread.sleep(600_000)을 하고 있는 스레드의 상태는 무엇으로 나올까요?
    choices:
      - RUNNABLE
      - BLOCKED
      - TIMED_WAITING
      - TERMINATED
    answer: "3"
    explanation: |-
      **TIMED_WAITING이에요.** 정해진 시간 동안 기다리는 중이에요. 락은 잡고 있어서 덩어리에 - locked <주소>가 함께 나와요.

      - 그 락을 얻으려고 기다리는 다른 스레드가 BLOCKED예요
    source: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/lang/Thread.State.html
  - key: td-lock-relation
    concept: core
    coreQuestion: q1
    type: multiple_choice
    status: draft
    difficulty: 2
    body: 스레드 덤프에서 pay-3 스레드의 덩어리에 - waiting to lock <0x7a1>이 있고, pay-holder 스레드의 덩어리에 - locked <0x7a1>이 있어요. 두 스레드의 관계로 맞는 것은?
    choices:
      - pay-3이 pay-holder가 잡은 락을 기다린다
      - pay-holder가 pay-3이 잡은 락을 기다린다
      - 두 스레드는 상관없다
      - 둘이 같은 락을 함께 잡고 있다
    answer: "1"
    explanation: |-
      **pay-3이 pay-holder가 잡은 락을 기다려요.** 주소가 같으면 같은 락이에요.

      - locked는 잡고 있는 락, waiting to lock은 얻으려고 기다리는 락이에요
    source: https://docs.oracle.com/en/java/javase/21/troubleshoot/
  # ── 질문 2 ──
  - key: td-deadlock
    concept: core
    coreQuestion: q2
    type: multiple_choice
    status: draft
    difficulty: 1
    body: 두 스레드가 synchronized 락 두 개를 서로 반대 순서로 잡다가 멈췄어요. jcmd <PID> Thread.print로 뜬 덤프에서 볼 수 있는 것은?
    choices:
      - 두 스레드가 RUNNABLE이고 덤프에 특별한 표시가 없다
      - 두 스레드가 BLOCKED이고 덤프 끝에 Found one Java-level deadlock이 나온다
      - 두 스레드가 TERMINATED로 나온다
      - 덤프를 뜰 수 없다
    answer: "2"
    explanation: |-
      **BLOCKED이고 JVM이 데드락을 직접 알려 줘요.** 덤프 끝에 누가 누구의 락을 기다리는지도 적혀요.
    source: https://docs.oracle.com/en/java/javase/21/docs/specs/man/jcmd.html
  - key: td-hikari
    concept: core
    coreQuestion: q2
    type: multiple_choice
    status: draft
    difficulty: 2
    body: 응답이 없는 서버의 스레드 덤프에서 톰캣 스레드 200개 가운데 190개가 HikariPool.getConnection 아래에서 TIMED_WAITING이에요. 무엇을 의심해야 할까요?
    choices:
      - 데드락
      - DB 커넥션 풀이 모자라다. 커넥션을 오래 잡는 코드나 풀 크기를 본다
      - 스레드 풀이 할 일이 없어 쉬고 있다
      - CPU가 100%다
    answer: "2"
    explanation: |-
      **커넥션 풀이 병목이에요.** 대부분의 스레드가 커넥션을 얻으려고 줄 서 있어요.

      - 덤프를 몇 초 간격으로 여러 장 떠서 계속 같은 자리인지 확인해요
    source: https://docs.oracle.com/en/java/javase/21/troubleshoot/
  - key: td-runnable-socket
    concept: core
    coreQuestion: q2
    type: multiple_choice
    status: draft
    difficulty: 3
    body: 서버가 느려서 덤프를 떴더니 BLOCKED인 스레드는 하나도 없고, 스레드 50개가 RUNNABLE이며 스택 맨 위가 모두 소켓 읽기(SocketInputStream.read)예요. 결론으로 맞는 것은?
    choices:
      - RUNNABLE이니 모두 일을 잘하고 있다. 문제없다
      - 모두 바깥(외부 API나 DB)의 응답을 기다린다. 그 호출이 느리다
      - 데드락이다
      - GC가 멈췄다
    answer: "2"
    explanation: |-
      **외부 호출이 느려요.** 소켓에서 응답을 기다리는 스레드는 BLOCKED가 아니라 RUNNABLE로 보여요.

      - 상태만 보지 말고 스택의 맨 위를 봐요
    source: https://docs.oracle.com/en/java/javase/21/troubleshoot/
  - key: td-restart-first
    concept: core
    coreQuestion: q2
    type: multiple_choice
    status: draft
    difficulty: 2
    body: 운영 중인 주문 서버 한 대가 응답하지 않아요. 로드 밸런서 뒤에 서버가 세 대 있어요. 할 일의 순서로 가장 맞는 것은?
    choices:
      - 바로 재시작한다
      - 로드 밸런서에서 빼고, 스레드 덤프를 몇 초 간격으로 세 장 뜬 뒤 재시작한다
      - kill -9로 끄고 로그를 본다
      - 힙을 두 배로 늘려 다시 띄운다
    answer: "2"
    explanation: |-
      **사용자를 다른 서버로 돌리고, 증거를 남긴 뒤 재시작해요.** 바로 재시작하면 무엇이 무엇을 기다렸는지 사라져요.

      - 덤프 여러 장으로 계속 같은 자리에 머문 스레드를 찾아요
    source: https://docs.oracle.com/en/java/javase/21/troubleshoot/
  # ── 질문 3 ──
  - key: td-histogram-next
    concept: core
    coreQuestion: q3
    type: multiple_choice
    status: draft
    difficulty: 1
    body: jcmd <PID> GC.class_histogram을 10분 간격으로 두 번 떴더니 byte[]가 1만 개에서 2만 개로 늘었어요. 다음에 할 일로 맞는 것은?
    choices:
      - 힙을 두 배로 늘린다
      - 힙 덤프를 떠서 그 byte[]를 누가 붙잡고 있는지 GC 루트까지의 경로를 본다
      - 스레드 덤프를 뜬다
      - 서버를 재시작한다
    answer: "2"
    explanation: |-
      **힙 덤프로 붙잡는 쪽을 찾아요.** 히스토그램은 무엇이 느는지를, 힙 덤프는 누가 붙잡는지를 알려 줘요.

      - MAT 같은 도구로 GC 루트까지의 경로와 retained size를 봐요
    source: https://docs.oracle.com/en/java/javase/21/docs/specs/man/jcmd.html
  - key: td-heapdump-risk
    concept: core
    coreQuestion: q3
    type: multiple_choice
    status: draft
    difficulty: 2
    body: 힙이 8GB인 운영 서버에서 사용자가 몰리는 낮 시간에 jcmd <PID> GC.heap_dump를 실행하려고 해요. 조심할 점으로 맞는 것은?
    choices:
      - 아무 영향이 없다
      - 뜨는 동안 JVM이 멈추고, 수 GB짜리 파일이 생기며, 개인정보가 담긴다. 트래픽에서 빼고 뜬다
      - 힙 덤프를 뜨면 힙이 비워진다
      - 힙 덤프는 1MB를 넘지 않는다
    answer: "2"
    explanation: |-
      **멈춤, 파일 크기, 개인정보를 조심해요.** 힙 덤프는 살아 있는 객체만큼 크고 메모리의 값을 그대로 담아요.

      - 가벼운 클래스 히스토그램으로 먼저 좁혀요
    source: https://docs.oracle.com/en/java/javase/21/troubleshoot/
  # ── 질문 4 ──
  - key: td-oom-dump
    concept: core
    coreQuestion: q4
    type: multiple_choice
    status: draft
    difficulty: 1
    body: java -Xmx512m -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/var/dumps -jar app.jar로 띄운 서버가 OutOfMemoryError로 죽었어요. 무엇이 남을까요?
    choices:
      - 아무것도 남지 않는다
      - /var/dumps에 그 순간의 힙 덤프 파일(java_pid<PID>.hprof)
      - 스레드 덤프만 남는다
      - GC 로그만 남는다
    answer: "2"
    explanation: |-
      **OOM 순간의 힙 덤프가 남아요.** 재시작해도 이 파일로 무엇이 메모리를 채웠는지 찾을 수 있어요.
    source: https://docs.oracle.com/en/java/javase/21/docs/specs/man/java.html
  - key: td-gc-rising
    concept: core
    coreQuestion: q4
    type: multiple_choice
    status: draft
    difficulty: 2
    body: GC 로그(-Xlog:gc)에서 GC 뒤의 힙 크기가 200MB, 350MB, 500MB로 계속 올라요. 힙을 2GB로 키우면 해결될까요?
    choices:
      - 해결된다
      - 안 된다. 누수라 늦게 죽을 뿐이다. 무엇이 붙잡는지 찾아 고친다
      - GC를 ZGC로 바꾸면 해결된다
      - GC 로그를 끄면 된다
    answer: "2"
    explanation: |-
      **늦게 죽을 뿐이에요.** GC가 돌아도 줄지 않고 오르면 닿을 수 있는 객체가 쌓이는 누수예요.

      - 힙 크기나 GC 종류를 바꿔도 쌓이는 것은 그대로예요
    source: https://docs.oracle.com/en/java/javase/21/docs/specs/man/java.html
  # ── 면접 ──
  - key: td-interview
    concept: core
    coreQuestion: all
    type: descriptive
    status: draft
    difficulty: 2
    body: 면접에서 "서버가 응답하지 않거나 메모리가 차서 죽을 때 원인을 어떻게 찾는지 설명해 주세요"라는 질문을 받았어요. 1분 안에 답해 보세요.
    explanation: |-
      **멈추면 스레드 덤프를 여러 장, 메모리가 차면 히스토그램 비교와 힙 덤프로 찾고, 증거는 미리 남기게 설정해요.**

      - **스레드 덤프:** 상태, 스택, 잡은 락과 기다리는 락
      - **멈춤:** 데드락 문구, 같은 락이나 커넥션에 몰린 스레드, 스택 맨 위
      - **메모리:** 히스토그램을 간격을 두고 비교, 힙 덤프의 GC 루트 경로
      - **미리:** HeapDumpOnOutOfMemoryError, GC 로그. 힙만 키우지 않는다
    checklist:
      - 스레드 덤프로 스레드의 상태와 락을 본다고 말했다
      - 데드락이나 한 곳에 몰린 스레드를 찾는 법을 말했다
      - 히스토그램을 비교하고 힙 덤프로 붙잡는 것을 찾는다고 말했다
      - HeapDumpOnOutOfMemoryError나 GC 로그로 증거를 남긴다고 말했다
      - 힙 덤프의 멈춤과 개인정보, 힙만 키우는 것의 한계 같은 주의점을 말했다
    source: https://docs.oracle.com/en/java/javase/21/troubleshoot/
