# 집계와 서브쿼리 문제
# 형식: https://github.com/wanja727/retrievo/blob/main/docs/content-format.md
#
# 모든 문제는 coreQuestions의 질문 하나에 묶이고(coreQuestion), 답의 근거가 레슨 본문에 있다
# (site/src/content/lesson-pages/aggregate-subquery.yaml의 says).
# 동작에 관한 정답은 verification의 AggregateSubqueryTest로 확인했다 (PostgreSQL 16).
# 질문마다 첫 문제는 본문의 예시로 묻고, 둘째 문제는 다른 상황으로 옮겨 묻는다.
subject:
  key: dev
  name: 개발자 면접
lesson:
  key: aggregate-subquery
  title: 집계와 서브쿼리
  unit: DB
  order: 603
concepts:
  - key: core
    name: 집계와 서브쿼리
coreQuestions:
  - key: q1
    text: "GROUP BY는 행을 어떻게 묶고 무엇을 돌려주나요?"
  - key: q2
    text: "WHERE와 HAVING은 무엇이 다른가요?"
  - key: q3
    text: "서브쿼리는 어디에 쓰고, NOT IN은 왜 위험한가요?"
  - key: q4
    text: "서브쿼리와 조인 가운데 무엇을 고르나요?"
questions:
  # ── 질문 1 ──
  - key: agg-count-null
    concept: core
    coreQuestion: q1
    type: multiple_choice
    status: draft
    difficulty: 1
    body: "주문 10건 가운데 3건은 쿠폰 없이 샀어요(`coupon_id`가 NULL). `select count(*), count(coupon_id) from orders`의 결과는?"
    choices:
      - "10, 10"
      - "10, 7"
      - "7, 7"
      - "10, 3"
    answer: "2"
    explanation: |-
      **10과 7이에요.** `count(*)`는 행을 세고, `count(열)`은 NULL이 아닌 값만 세요.

      - 쿠폰 없이 산 3건은 `count(coupon_id)`에서 빠져요
      - `sum`과 `avg`도 NULL을 건너뛰어요
    source: https://www.postgresql.org/docs/16/functions-aggregate.html
  - key: agg-ungrouped-column
    concept: core
    coreQuestion: q1
    type: multiple_choice
    status: draft
    difficulty: 1
    body: "리뷰를 상품별로 묶어 `select product_id, avg(score), writer from review group by product_id`를 실행하면 어떻게 되나요? (PostgreSQL 16)"
    choices:
      - 상품마다 첫 리뷰의 writer가 나온다
      - 상품마다 마지막 리뷰의 writer가 나온다
      - 오류가 난다
      - 리뷰마다 한 행이 나온다
    answer: "3"
    explanation: |-
      **오류(42803)가 나요.** `writer`는 묶은 열도 집계도 아니에요.

      - 상품 하나의 묶음에 writer가 여럿이라 한 행에 무엇을 보일지 정할 수 없어요
      - SELECT에는 묶은 열과 집계만 써요
    source: https://www.postgresql.org/docs/16/queries-table-expressions.html#QUERIES-GROUP
  # ── 질문 2 ──
  - key: agg-where-sum
    concept: core
    coreQuestion: q2
    type: multiple_choice
    status: draft
    difficulty: 1
    body: "결제 합계가 10만 원 넘는 회원을 구하려고 `select member_id, sum(amount) from orders where sum(amount) > 100000 group by member_id`를 실행했어요. 결과는?"
    choices:
      - 10만 원 넘게 산 회원이 나온다
      - 모든 회원이 나온다
      - 오류가 난다. 집계 조건은 HAVING에 써야 한다
      - 0행이 나온다
    answer: "3"
    explanation: |-
      **오류가 나요.** WHERE는 묶기 전에 처리돼서 아직 합계가 없어요.

      - SQL은 FROM, WHERE, GROUP BY, HAVING, SELECT 순서로 처리된다고 봐요
      - 묶은 뒤에 거르는 조건은 `having sum(amount) > 100000`이에요
    source: https://www.postgresql.org/docs/16/queries-table-expressions.html#QUERIES-GROUP
  - key: agg-having-count
    concept: core
    coreQuestion: q2
    type: multiple_choice
    status: draft
    difficulty: 1
    body: "리뷰가 5개 이상 달린 상품만, 평균 점수와 함께 보이려 해요. 조건 `count(*) >= 5`를 어디에 둬야 하나요?"
    choices:
      - WHERE
      - HAVING
      - ORDER BY
      - SELECT
    answer: "2"
    explanation: |-
      **HAVING이에요.** `count(*)`는 상품별로 묶은 뒤에야 계산돼요.

      - WHERE는 리뷰 한 행씩을 보는 조건만 쓸 수 있어요
      - HAVING은 묶음을 걸러요
    source: https://www.postgresql.org/docs/16/queries-table-expressions.html#QUERIES-GROUP
  # ── 질문 3 ──
  - key: agg-not-in-null
    concept: core
    coreQuestion: q3
    type: multiple_choice
    status: draft
    difficulty: 2
    body: "회원은 4명이고 kim만 주문을 취소한 적이 있어요. 회원이 지워진 취소 주문이 하나 있어 `member_id`가 NULL이에요. 아래 쿼리는 몇 명을 돌려주나요?"
    code: |-
      select name from member
       where id not in (
         select member_id from orders
          where status = 'CANCELED');
    choices:
      - "0명"
      - "1명"
      - "3명"
      - "4명"
    answer: "1"
    explanation: |-
      **0명이에요.** 서브쿼리 결과가 `(1, NULL)`이라 `id <> NULL`이 어느 회원에게도 참이 되지 않아요.

      - NULL과 비교한 결과는 참도 거짓도 아닌 NULL이에요
      - `not exists`로 바꾸면 3명이 나와요
    source: https://www.postgresql.org/docs/16/functions-subquery.html#FUNCTIONS-SUBQUERY-NOTIN
  - key: agg-block-list
    concept: core
    coreQuestion: q3
    type: multiple_choice
    status: draft
    difficulty: 2
    body: "차단 목록 `block(user_id)`에 실수로 NULL이 한 행 들어갔어요. 차단하지 않은 글쓴이의 글만 보이려는 `select * from post where writer_id not in (select user_id from block)`은 무엇을 돌려주나요?"
    choices:
      - 차단되지 않은 글쓴이의 글 전부
      - 0행
      - 오류
      - 모든 글
    answer: "2"
    explanation: |-
      **0행이에요.** 목록에 NULL이 있으면 NOT IN은 어떤 행도 통과시키지 않아요.

      - 오류가 없어서 "글이 없다"로 보이고 알아채기 어려워요
      - `not exists (select 1 from block b where b.user_id = p.writer_id)`로 고쳐요
    source: https://www.postgresql.org/docs/16/functions-subquery.html#FUNCTIONS-SUBQUERY-NOTIN
  # ── 질문 4 ──
  - key: agg-join-duplicates
    concept: core
    coreQuestion: q4
    type: multiple_choice
    status: draft
    difficulty: 2
    body: "kim은 5만 원 넘는 주문을 2건, park은 1건 했어요. `select m.name from member m join orders o on o.member_id = m.id where o.amount > 50000`의 결과는?"
    choices:
      - "kim, park"
      - "kim, kim, park"
      - "kim"
      - "park"
    answer: "2"
    explanation: |-
      **kim이 두 번 나와요.** 조건에 맞는 주문이 둘이라 짝이 둘이에요.

      - "있는지"만 보려면 EXISTS가 회원마다 한 번만 돌려줘요
      - 조인 뒤 distinct로 줄이고 있다면 EXISTS로 바꿀 신호예요
    source: https://www.postgresql.org/docs/16/functions-subquery.html#FUNCTIONS-SUBQUERY-EXISTS
  - key: agg-exists-reviews
    concept: core
    coreQuestion: q4
    type: multiple_choice
    status: draft
    difficulty: 2
    body: "상품 목록에 \"리뷰가 하나라도 있는 상품\"만 보이려 해요. 화면에는 상품 이름만 나오고 리뷰 내용은 나오지 않아요. 어떻게 쓰는 것이 맞나요?"
    choices:
      - "`product join review`로 조인한다"
      - "`where exists (select 1 from review r where r.product_id = p.id)`"
      - "`where id not in (select product_id from review)`"
      - "`group by`로 리뷰를 센 뒤 WHERE로 거른다"
    answer: "2"
    explanation: |-
      **EXISTS예요.** 있는지만 보니 상품마다 한 번씩 나와요.

      - 조인은 리뷰 수만큼 상품이 반복돼요
      - 리뷰 테이블의 열을 보여야 할 때만 조인해요
    source: https://www.postgresql.org/docs/16/functions-subquery.html#FUNCTIONS-SUBQUERY-EXISTS
  - key: agg-find-all-stream
    concept: core
    coreQuestion: q4
    type: multiple_choice
    status: draft
    difficulty: 2
    body: "주문 20만 건, 회원 1000명이에요. 회원별 결제 합계를 `orderRepository.findAll().stream().collect(groupingBy(...))`로 만들던 코드를 `group by member_id` 쿼리로 바꿨어요. 무엇이 달라지나요?"
    choices:
      - 결과가 달라진다
      - DB에서 앱으로 옮기는 행이 20만에서 1000으로 준다
      - 쿼리 수가 늘어난다
      - 달라지는 것이 없다
    answer: "2"
    explanation: |-
      **답은 같고 옮기는 행이 20만 행에서 1000행으로 줄어요.**

      - 합치는 일을 DB가 하고 결과만 보내요
      - 주문이 늘어도 받는 행은 회원 수 그대로예요
    source: https://www.postgresql.org/docs/16/queries-table-expressions.html#QUERIES-GROUP
  # ── 면접 질문 ──
  - key: agg-interview
    concept: core
    coreQuestion: all
    type: descriptive
    status: draft
    difficulty: 2
    body: 면접에서 "GROUP BY와 HAVING, 서브쿼리를 쓸 때 주의할 점을 설명해 주세요"라는 질문을 받았어요. 1분 안에 답해 보세요.
    explanation: |-
      **묶고 거르는 순서를 알고, NULL과 행 중복이 만드는 함정을 피해요.**

      - **GROUP BY:** 같은 값끼리 묶어 묶음마다 한 행. SELECT에는 묶은 열과 집계만
      - **WHERE와 HAVING:** WHERE는 묶기 전 행을, HAVING은 묶은 뒤 묶음을 거른다
      - **NULL:** 집계는 NULL을 건너뛰고, 행이 없으면 SUM은 NULL. NOT IN에 NULL이 있으면 0행
      - **고르기:** 있는지는 EXISTS, 다른 테이블의 열이 필요하면 조인. 합계는 먼저 묶고 붙인다
    checklist:
      - GROUP BY는 묶음마다 한 행을 만들고 SELECT에는 묶은 열과 집계만 쓴다고 말했다
      - WHERE는 묶기 전, HAVING은 묶은 뒤에 거른다고 말했다
      - NOT IN의 목록에 NULL이 있으면 결과가 비어 NOT EXISTS를 쓴다고 말했다
      - 있는지만 볼 때는 조인 대신 EXISTS를 쓴다고 말했다
      - 집계는 앱에서 다 읽지 않고 DB에 맡긴다고 말했다
    source: https://www.postgresql.org/docs/16/functions-subquery.html
