questions:
  # ── 질문 1. 자바 소스는 어떤 단계를 거쳐 실행되나요? ──
  - key: jex-magic-number
    concept: core
    coreQuestion: q1
    type: multiple_choice
    status: draft
    difficulty: 1
    body: 아래 OrderApp.java를 자바 21의 javac로 컴파일해 OrderApp.class를 얻었어요. 이 파일의 처음 4바이트를 16진수로 읽으면 무엇일까요?
    code: |-
      public class OrderApp {
        public static void main(String[] args) {
          System.out.println("주문 12000");
        }
      }
    choices:
      - "CAFEBABE"
      - "00000041"
      - "7F454C46"
      - 컴파일한 운영체제에 따라 다르다
    answer: "1"
    explanation: |-
      **CAFEBABE예요.** 모든 클래스 파일은 이 매직 넘버로 시작해요.

      - JVM은 이 값을 보고 클래스 파일이 맞는지 알아봐요
      - 그 뒤의 4바이트가 클래스 파일 버전이에요. 자바 21이면 주 버전이 65(16진수 41)예요
      - 클래스 파일에는 운영체제의 기계어가 없어서 어느 운영체제에서 컴파일해도 같아요
    source: https://docs.oracle.com/javase/specs/jvms/se21/html/jvms-4.html
  - key: jex-portable
    concept: core
    coreQuestion: q1
    type: multiple_choice
    status: draft
    difficulty: 2
    body: 맥에서 자바 21로 컴파일한 .class 파일 100개를 묶어 리눅스 서버에 올렸어요. 서버에도 자바 21이 깔려 있고, 서버에는 .java 파일이 없어요. 서버에서 이 프로그램을 실행하려면 무엇을 해야 할까요?
    choices:
      - 리눅스에서 다시 컴파일해야 하니 .java 파일도 올려야 한다
      - .class를 리눅스용 기계어로 바꾸는 도구를 먼저 돌려야 한다
      - 그대로 java 명령으로 실행하면 된다
      - 맥과 리눅스는 CPU가 같을 때만 실행된다
    answer: "3"
    explanation: |-
      **그대로 실행하면 돼요.** .class에는 바이트코드가 들어 있고, 그것을 실행하는 것은 리눅스용 JVM이에요.

      - 바이트코드는 특정 운영체제의 기계어가 아니라 JVM이 읽는 명령이에요
      - 운영체제마다 다른 것은 JVM이에요. 맥용과 리눅스용 JVM이 같은 .class를 읽어요
      - 다시 컴파일할 필요가 없어서 빌드한 결과물 하나를 여러 서버에 그대로 올려요
    source: https://docs.oracle.com/javase/specs/jvms/se21/html/jvms-4.html
  # ── 질문 2. JVM, JRE, JDK는 무엇이 다른가요? ──
  - key: jex-jre-only
    concept: core
    coreQuestion: q2
    type: multiple_choice
    status: draft
    difficulty: 1
    body: 서버에 java 명령은 있지만 javac는 없어요. 서버의 자바는 21이고, 올려 둔 .class 파일들은 자바 21로 컴파일한 것이에요. 이 서버에서 할 수 있는 일은 무엇일까요?
    choices:
      - .class 실행과 .java 컴파일 둘 다
      - .class 실행만
      - .java 컴파일만
      - 둘 다 할 수 없다
    answer: "2"
    explanation: |-
      **.class 실행만 할 수 있어요.** 실행에 필요한 JVM과 표준 라이브러리는 있고, 컴파일러는 없어요.

      - JVM에 표준 라이브러리를 더한 것이 JRE이고, 실행은 JRE로 충분해요
      - javac는 JDK에만 들어 있는 개발 도구예요
      - 그래서 서버에는 실행 환경만, 빌드하는 곳에는 JDK를 둬요
    source: https://docs.oracle.com/en/java/javase/21/vm/java-virtual-machine-technology-overview.html
  - key: jex-version-mismatch
    concept: core
    coreQuestion: q2
    type: multiple_choice
    status: draft
    difficulty: 2
    body: 자바 21로 컴파일한 클래스 파일(주 버전 65)을 자바 17의 JVM으로 실행했어요. 자바 17의 JVM은 주 버전 61까지 읽어요. 어떻게 될까요?
    choices:
      - 자바 17이 읽을 수 있는 부분만 실행된다
      - 경고를 남기고 정상으로 실행된다
      - UnsupportedClassVersionError가 나고 실행되지 않는다
      - JVM이 클래스 파일을 자바 17 형식으로 바꿔서 실행한다
    answer: "3"
    explanation: |-
      **UnsupportedClassVersionError가 나요.** 낮은 버전의 JVM은 자기보다 높은 버전의 클래스 파일을 읽지 않아요.

      - 클래스 파일에는 컴파일한 자바의 버전이 적혀 있어요
      - 메시지에 파일의 버전(65.0)과 이 JVM이 읽는 최고 버전(61.0)이 함께 나와요
      - 반대로 높은 버전의 JVM은 낮은 버전의 클래스 파일을 읽어요
    source: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/lang/UnsupportedClassVersionError.html
  - key: jex-docker-image
    concept: core
    coreQuestion: q2
    type: code_predict
    status: draft
    difficulty: 2
    body: 스프링 부트 프로젝트의 build.gradle에서 toolchain을 21로 두고 bootJar로 jar를 만들었어요. 서버 이미지는 아래 도커 파일로 만들어요. 컨테이너를 켜면 어떻게 될까요?
    code: |-
      FROM eclipse-temurin:17-jre
      COPY build/libs/shop.jar app.jar
      ENTRYPOINT ["java", "-jar", "app.jar"]
    choices:
      - 정상으로 켜진다. 스프링 부트 3은 자바 17을 지원한다
      - 켜지자마자 UnsupportedClassVersionError가 난다
      - 켜지지만 첫 요청에서 ClassNotFoundException이 난다
      - 이미지를 만들 때 COPY에서 실패한다
    answer: "2"
    explanation: |-
      **UnsupportedClassVersionError가 나요.** jar 안의 클래스 파일은 자바 21이 만들었고(65), 이미지의 JVM은 자바 17이라 61까지만 읽어요.

      - toolchain이 정한 버전이 클래스 파일 버전이 되고, 서버의 자바는 그 이상이어야 해요
      - 스프링 부트 3이 자바 17을 지원하는 것과 상관없이, 내 코드를 21로 컴파일했으면 21 이상이 필요해요
      - 베이스 이미지를 eclipse-temurin:21-jre로 맞추면 돼요
    source: https://docs.gradle.org/current/userguide/toolchains.html
  # ── 질문 3. JVM은 클래스를 언제, 어떻게 읽어 오나요? ──
  - key: jex-first-use
    concept: core
    coreQuestion: q3
    type: code_predict
    status: draft
    difficulty: 1
    body: Coupon 클래스의 static 블록은 클래스가 준비될 때 한 번 "Coupon 읽음"을 출력해요. 아래 코드를 실행하면 출력의 순서는 어떻게 될까요? Coupon은 이 코드 전에 쓰인 적이 없어요.
    code: |-
      print("시작");
      Coupon c = null;
      print("변수 선언 뒤");
      new Coupon();
      print("new 뒤");
    choices:
      - Coupon 읽음, 시작, 변수 선언 뒤, new 뒤
      - 시작, Coupon 읽음, 변수 선언 뒤, new 뒤
      - 시작, 변수 선언 뒤, Coupon 읽음, new 뒤
      - 시작, 변수 선언 뒤, new 뒤 (Coupon 읽음은 나오지 않는다)
    answer: "3"
    explanation: |-
      **시작, 변수 선언 뒤, Coupon 읽음, new 뒤예요.** 클래스는 처음 쓰이는 줄에서 읽히고 초기화돼요.

      - 프로그램을 시작할 때 모든 클래스를 미리 읽지 않아요
      - Coupon 타입의 변수를 선언만 하는 것은 클래스를 쓰는 것이 아니에요
      - new Coupon()으로 객체를 처음 만들 때 static 블록이 실행돼요
    source: https://docs.oracle.com/javase/specs/jvms/se21/html/jvms-5.html
  - key: jex-bootstrap-null
    concept: core
    coreQuestion: q3
    type: multiple_choice
    status: draft
    difficulty: 2
    body: 내가 만든 클래스 Report와 자바의 String에 대해 각각 getClassLoader()를 불러 출력했어요. 둘 가운데 null이 나오는 쪽은 어느 것이고, 왜 그럴까요?
    choices:
      - Report. 내가 만든 클래스는 로더 없이 읽힌다
      - String. 부트스트랩 로더가 읽었고, 이 로더는 자바 객체로 보여 줄 수 없다
      - 둘 다 null이다. 로더는 실행 중에 사라진다
      - 둘 다 null이 아니다. 모든 클래스는 애플리케이션 로더가 읽는다
    answer: "2"
    explanation: |-
      **String이 null이에요.** 핵심 클래스를 읽는 부트스트랩 로더는 JVM 안의 프로그램이라 자바 객체가 아니에요.

      - 내 코드와 라이브러리는 클래스패스에서 애플리케이션 로더가 읽어요
      - 로더는 찾을 때 부모에게 먼저 물어요. 그래서 String은 언제나 부트스트랩 로더가 읽어요
      - 누가 java.lang.String이라는 가짜를 클래스패스에 넣어도 JDK의 String이 쓰여요
    source: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/lang/ClassLoader.html
  # ── 질문 4. 바이트코드를 읽어서 실행하면 느리지 않나요? ──
  - key: jex-warmup-batch
    concept: core
    coreQuestion: q4
    type: multiple_choice
    status: draft
    difficulty: 1
    body: 같은 계산 메서드를 2만 번씩 다섯 묶음으로 불러 묶음마다 걸린 시간을 쟀어요. JVM 옵션은 기본값이에요. 가장 오래 걸릴 것으로 기대되는 묶음은 어느 것일까요?
    choices:
      - 첫째 묶음
      - 셋째 묶음
      - 다섯째 묶음
      - 다섯 묶음이 모두 같다
    answer: "1"
    explanation: |-
      **첫째 묶음이에요.** 처음에는 인터프리터가 바이트코드를 해석해서 실행하고, 그사이 JIT 컴파일러가 자주 도는 메서드를 기계어로 바꿔요.

      - 기계어가 생긴 뒤의 묶음은 해석하지 않고 바로 실행해서 빨라져요
      - JIT를 끄는 -Xint로 돌리면 다섯 묶음이 비슷하게 느려요
      - 시간은 기계마다 달라서 볼 것은 숫자가 아니라 줄어드는 모양이에요
    source: https://docs.oracle.com/en/java/javase/21/vm/java-virtual-machine-technology-overview.html
  - key: jex-deploy-slow
    concept: core
    coreQuestion: q4
    type: multiple_choice
    status: draft
    difficulty: 2
    body: 서버를 새로 배포한 직후 1분 동안 응답 시간이 평소의 몇 배였다가 저절로 평소로 돌아왔어요. 코드, DB, 트래픽은 배포 전과 같아요. JVM의 동작으로 설명되는 원인으로 알맞은 것을 고르세요.
    choices:
      - 처음 쓰이는 클래스의 로딩과, 아직 기계어로 컴파일되지 않은 코드의 해석 실행
      - JVM이 시작할 때 모든 클래스를 한꺼번에 읽느라 1분이 걸린다
      - 배포할 때마다 바이트코드를 기계어로 미리 바꾸는 작업이 1분 걸린다
      - 새 서버의 클래스 파일 버전이 맞지 않아 재시도한다
    answer: "1"
    explanation: |-
      **클래스 로딩과 해석 실행 때문이에요.** 요청이 쌓이면서 자주 쓰는 코드가 기계어로 바뀌어 빨라져요.

      - 클래스는 처음 쓰일 때 읽혀서 첫 요청들이 그 비용을 치러요
      - 처음에는 인터프리터가 돌리고, JIT가 자주 도는 메서드를 실행 중에 컴파일해요
      - 이것을 워밍업이라고 해요. 버전이 맞지 않으면 아예 켜지지 않아요
    source: https://docs.oracle.com/en/java/javase/21/vm/java-virtual-machine-technology-overview.html
  # ── 네 질문을 하나로 ──
  - key: jex-interview
    concept: core
    coreQuestion: all
    type: descriptive
    status: draft
    difficulty: 2
    body: 면접에서 "자바 프로그램이 실행되는 과정을 설명해 주세요"라는 질문을 받았어요. 1분 안에 답해 보세요.
    explanation: |-
      **javac가 소스를 바이트코드로 컴파일하고, JVM이 클래스를 필요할 때 읽어 인터프리터와 JIT로 실행해요.**

      - **컴파일:** javac가 .java를 바이트코드가 든 .class로 바꾼다. 바이트코드는 JVM이 읽는 명령이라 운영체제와 상관없다
      - **JVM, JRE, JDK:** 실행에는 JVM과 표준 라이브러리(JRE), 컴파일에는 JDK가 필요하다
      - **클래스 로딩:** 클래스는 처음 쓰일 때 클래스 로더가 읽고 로딩, 링크, 초기화를 거친다. 로더는 부모에게 먼저 묻는다
      - **실행:** 처음에는 인터프리터가 해석하고, 자주 도는 코드는 JIT가 기계어로 바꿔 빨라진다
    checklist:
      - javac가 소스를 바이트코드(.class)로 컴파일하고 JVM이 실행한다고 말했다
      - 바이트코드는 기계어가 아니라 운영체제마다 있는 JVM이 같은 파일을 실행한다고 말했다
      - 실행에는 JRE, 컴파일에는 JDK가 필요하다고 말했다
      - 클래스는 처음 쓰일 때 클래스 로더가 읽는다고 말했다
      - 인터프리터와 JIT 컴파일러로 실행되어 켠 직후가 느리다고 말했다
    source: https://docs.oracle.com/javase/specs/jvms/se21/html/jvms-5.html
