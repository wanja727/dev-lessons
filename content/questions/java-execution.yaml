concepts:
  - key: core
    name: 자바 프로그램이 실행되는 과정
coreQuestions:
  - key: q1
    text: "자바 소스는 어떤 단계를 거쳐 실행되나요?"
  - key: q2
    text: "JVM, JRE, JDK는 무엇이 다른가요?"
