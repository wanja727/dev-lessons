# 빈의 생명주기와 스코프 문제
# 형식: https://github.com/wanja727/retrievo/blob/main/docs/content-format.md
#
# 모든 문제는 coreQuestions의 질문 하나에 묶이고(coreQuestion), 답의 근거가 레슨 본문에 있다
# (site/src/content/lesson-pages/bean-lifecycle-scope.yaml의 says).
# 동작에 관한 정답은 verification의 BeanLifecycleTest로 확인했다 (스프링 프레임워크 6.2).
# 질문마다 첫 문제는 본문의 예시로 묻고, 둘째 문제는 다른 상황으로 옮겨 묻는다.
subject:
  key: dev
  name: 개발자 면접
lesson:
  key: bean-lifecycle-scope
  title: 빈의 생명주기와 스코프
  unit: 스프링
  order: 703
concepts:
  - key: core
    name: 빈의 생명주기와 스코프
coreQuestions:
  - key: q1
    text: "빈은 어떤 순서로 만들어지고 사라지나요?"
  - key: q2
    text: "초기화 코드는 생성자가 아니라 왜 @PostConstruct에 두나요?"
  - key: q3
    text: "싱글톤 빈의 필드에 값을 두면 무슨 일이 생기나요?"
  - key: q4
    text: "요청마다 새 객체가 필요하면 어떻게 하나요?"
questions:
  # ── 질문 1 ──
  - key: bl-order
    concept: core
    coreQuestion: q1
    type: multiple_choice
    status: draft
    difficulty: 1
    body: '@Autowired 필드 하나와 @PostConstruct, @PreDestroy 메서드를 가진 빈이 있어요. 컨테이너가 이 빈을 다룰 때 일어나는 일의 순서로 맞는 것은 무엇일까요?'
    choices:
      - '@Autowired 필드 주입 → 생성자 → @PostConstruct → @PreDestroy'
      - '생성자 → @Autowired 필드 주입 → @PostConstruct → @PreDestroy'
      - '생성자 → @PostConstruct → @Autowired 필드 주입 → @PreDestroy'
      - '@PostConstruct → 생성자 → @Autowired 필드 주입 → @PreDestroy'
    answer: "2"
    explanation: |-
      **생성자, 필드 주입, @PostConstruct, @PreDestroy 순서예요.** 객체를 만든 뒤에야 필드에 값을 넣을 수 있고, @PostConstruct는 주입이 모두 끝난 뒤 불려요.

      - @PreDestroy는 컨테이너가 닫힐 때 불려요
    source: https://docs.spring.io/spring-framework/reference/core/beans/factory-nature.html
  - key: bl-destroy-order
    concept: core
    coreQuestion: q1
    type: multiple_choice
    status: draft
    difficulty: 2
    body: ReportService가 생성자로 MailClient를 받아요. 둘 다 @PreDestroy 메서드가 있어요. 앱을 정상 종료하면 어느 쪽의 @PreDestroy가 먼저 불릴까요?
    choices:
      - MailClient. 먼저 만든 것이 먼저 정리된다
      - ReportService. 만든 순서의 반대로 정리된다
      - 둘이 동시에 불린다
      - 정상 종료에서는 @PreDestroy가 불리지 않는다
    answer: "2"
    explanation: |-
      **ReportService가 먼저예요.** 정리는 만든 순서의 반대라서, 다른 빈을 쓰는 쪽이 먼저 정리돼요.

      - 그래서 ReportService가 정리하는 동안 MailClient는 아직 살아 있어요
      - 프로세스를 강제로 죽이면 @PreDestroy는 불리지 않아요
    source: https://docs.spring.io/spring-framework/reference/core/beans/factory-nature.html
  # ── 질문 2 ──
  - key: bl-value-in-ctor
    concept: core
    coreQuestion: q2
    type: code_predict
    status: draft
    difficulty: 1
    body: 설정에 coupon.max=50이 있어요. 아래 빈을 만들 때 생성자 안에서 찍히는 값은 무엇일까요?
    code: |-
      @Component
      class CouponLimit {
        @Value("${coupon.max}")
        int max;

        CouponLimit() {
          System.out.println(max);
        }
      }
    choices:
      - "50"
      - "0"
      - "null"
      - 컴파일 오류
    answer: "2"
    explanation: |-
      **0이에요.** @Value 필드도 필드 주입이라 생성자가 끝난 뒤에 채워져요. 생성자 안에서는 int의 기본값 0이에요.

      - @PostConstruct 메서드에서 읽으면 50이에요
      - 생성자의 매개변수로 @Value를 받으면 생성자 안에서도 50이에요
    source: https://docs.spring.io/spring-framework/reference/core/beans/factory-nature.html
  - key: bl-postconstruct-fail
    concept: core
    coreQuestion: q2
    type: multiple_choice
    status: draft
    difficulty: 2
    body: 시작할 때 금칙어 파일을 읽어 두는 빈의 @PostConstruct 메서드가, 파일이 없어 IllegalStateException을 던졌어요. 앱은 어떻게 될까요?
    choices:
      - 앱은 뜨고, 그 빈만 null로 남는다
      - 앱은 뜨고, 금칙어 없이 동작한다
      - 빈을 만들다 실패해 앱이 뜨지 않는다
      - 첫 요청이 올 때 예외가 난다
    answer: "3"
    explanation: |-
      **앱이 뜨지 않아요.** @PostConstruct에서 난 예외는 빈 생성의 실패라서 BeanCreationException으로 감싸져 컨테이너 시작이 멈춰요.

      - 준비가 덜 된 채로 요청을 받는 것보다 시작할 때 실패하는 편이 나아요
    source: https://docs.spring.io/spring-framework/reference/core/beans/factory-nature.html
  # ── 질문 3 ──
  - key: bl-atomic
    concept: core
    coreQuestion: q3
    type: multiple_choice
    status: draft
    difficulty: 1
    body: 싱글톤 빈 OrderCounter의 필드를 private int count에서 private final AtomicLong count로 바꾸고 increase()에서 count.incrementAndGet()을 불러요. 스레드 두 개가 increase()를 1만 번씩 부르면 결과는 어떻게 될까요?
    choices:
      - 늘 20000이다
      - 20000보다 작을 때가 많다
      - 늘 10000이다
      - 예외가 난다
    answer: "1"
    explanation: |-
      **늘 20000이에요.** incrementAndGet은 읽고 더하고 쓰는 일을 끊기지 않고 한 번에 해요.

      - int count++는 세 걸음이라 두 스레드가 같은 값을 읽으면 한 번이 사라져요
      - 다만 서버가 여러 대면 서버마다 따로 세요
    source: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/concurrent/atomic/AtomicLong.html
  - key: bl-errors-list
    concept: core
    coreQuestion: q3
    type: code_predict
    status: draft
    difficulty: 2
    body: 아래 싱글톤 서비스에 두 요청이 거의 동시에 들어왔어요. 무슨 일이 생길 수 있을까요?
    code: |-
      @Service
      class SignUpValidator {
        private final List<String> errors =
            new ArrayList<>();

        List<String> validate(SignUp req) {
          errors.clear();
          if (req.email().isBlank()) {
            errors.add("이메일이 비었어요");
          }
          return List.copyOf(errors);
        }
      }
    choices:
      - 아무 문제 없다. 요청마다 errors가 따로 있다
      - 한 요청의 결과에 다른 요청의 오류가 섞이거나 빠질 수 있다
      - 두 번째 요청은 첫 요청이 끝날 때까지 기다린다
      - final이라 errors를 바꿀 수 없어 컴파일 오류가 난다
    answer: "2"
    explanation: |-
      **섞이거나 빠질 수 있어요.** 빈이 하나라서 errors 리스트도 하나이고, 두 요청 스레드가 같은 리스트를 비우고 담아요.

      - final은 errors가 다른 리스트를 가리키지 못하게 할 뿐, 리스트 안의 내용은 바뀌어요
      - errors를 validate 안의 지역 변수로 만들면 요청마다 따로예요
    source: https://docs.spring.io/spring-framework/reference/core/beans/factory-scopes.html
  - key: bl-stateless-fix
    concept: core
    coreQuestion: q3
    type: multiple_choice
    status: draft
    difficulty: 2
    body: '싱글톤 GreetingService가 private String userName 필드에 요청의 이름을 넣고, audit()를 부른 뒤 "안녕하세요 " + userName을 돌려줘요. 동시 요청에서 다른 사람의 이름이 섞이는 문제를 고치는 가장 알맞은 방법은 무엇일까요?'
    choices:
      - userName 필드에 volatile을 붙인다
      - userName 필드를 지우고 매개변수 name을 지역 변수로만 쓴다
      - 서비스에 @Scope("prototype")을 붙이고 컨트롤러가 생성자로 받는다
      - userName을 static으로 바꾼다
    answer: "2"
    explanation: |-
      **필드를 지우고 매개변수로 넘겨요.** 지역 변수는 스레드마다 따로라 섞이지 않아요.

      - 프로토타입으로 바꿔도 싱글톤 컨트롤러가 생성자로 받으면 한 번만 만들어져 같은 객체를 써요
      - static은 클래스에 하나라 문제가 그대로예요
    source: https://docs.spring.io/spring-framework/reference/core/beans/factory-scopes.html
  # ── 질문 4 ──
  - key: bl-prototype-in-singleton
    concept: core
    coreQuestion: q4
    type: multiple_choice
    status: draft
    difficulty: 1
    body: '@Scope("prototype")인 Cart를 싱글톤 CartService가 생성자로 받아 필드에 담았어요. kim과 lee가 차례로 CartService를 통해 상품을 담으면 어떻게 될까요?'
    choices:
      - 각자 다른 Cart에 담긴다
      - 같은 Cart에 담긴다
      - 두 번째 사용자는 예외가 난다
      - 담을 때마다 Cart가 새로 만들어져 늘 비어 있다
    answer: "2"
    explanation: |-
      **같은 Cart에 담겨요.** CartService는 한 번 만들어지고, 그때 생성자에 Cart를 한 번 넣어요. 그 뒤로는 그 Cart 하나를 계속 써요.

      - 쓸 때마다 새로 받으려면 ObjectProvider<Cart>를 받고 getObject()로 꺼내요
    source: https://docs.spring.io/spring-framework/reference/core/beans/factory-scopes.html
  - key: bl-request-scope
    concept: core
    coreQuestion: q4
    type: multiple_choice
    status: draft
    difficulty: 2
    body: 요청마다 고유한 추적 id를 가진 TraceContext 객체가 필요해요. 여러 사용자가 동시에 요청해도 요청마다 다른 id가 보장되는 방법은 무엇일까요?
    choices:
      - 싱글톤 빈의 필드에 요청마다 새 id를 넣는다
      - TraceContext를 @RequestScope 빈으로 만든다
      - TraceContext를 @Scope("prototype")으로 만들고 싱글톤 컨트롤러가 생성자로 받는다
      - TraceContext의 id 필드를 static으로 둔다
    answer: "2"
    explanation: |-
      **@RequestScope 빈으로 만들어요.** HTTP 요청마다 새 객체가 생기고, 싱글톤 컨트롤러에는 프록시가 들어가 지금 요청의 객체로 넘겨줘요.

      - 싱글톤 필드와 static은 모든 요청이 함께 써서 섞여요
      - 프로토타입을 생성자로 받으면 한 번만 만들어져요
    source: https://docs.spring.io/spring-framework/reference/core/beans/factory-scopes.html
  # ── 전체 ──
  - key: bl-interview
    concept: core
    coreQuestion: all
    type: descriptive
    status: draft
    difficulty: 2
    body: 면접에서 "스프링 빈의 생명주기와 스코프를 설명해 주세요"라는 질문을 받았어요. 1분 안에 답해 보세요.
    explanation: |-
      **빈은 생성, 주입, @PostConstruct, 사용, @PreDestroy 순서로 살고, 기본 스코프는 싱글톤이라 상태를 두면 안 돼요.**

      - **생명주기:** 생성자 → 필드와 세터 주입 → @PostConstruct → 사용 → 컨테이너가 닫힐 때 @PreDestroy. 정리는 만든 순서의 반대다
      - **초기화 위치:** 필드 주입은 생성자 뒤라서 초기화는 @PostConstruct에 둔다. 실패하면 앱이 뜨지 않는다
      - **싱글톤의 상태:** 모든 요청 스레드가 함께 써서 바뀌는 필드는 값이 사라지거나 섞인다. 매개변수로 넘긴다
      - **스코프:** 프로토타입은 꺼낼 때마다, request는 요청마다 새로 만든다. 싱글톤에 넣을 때는 ObjectProvider나 프록시를 쓴다
    checklist:
      - 생성자, 주입, @PostConstruct, @PreDestroy 순서를 말했다
      - 필드 주입한 값은 생성자에서 쓸 수 없어 @PostConstruct에 초기화를 둔다고 말했다
      - 싱글톤 빈에 바뀌는 필드를 두면 동시 요청에서 값이 섞인다고 말했다
      - 프로토타입이나 request 스코프가 무엇인지 말했다
    source: https://docs.spring.io/spring-framework/reference/core/beans/factory-scopes.html
