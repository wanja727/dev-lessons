# 스프링 MVC 요청 흐름 문제
# 형식: https://github.com/wanja727/retrievo/blob/main/docs/content-format.md
#
# 모든 문제는 coreQuestions의 질문 하나에 묶이고(coreQuestion), 답의 근거가 레슨 본문에 있다
# (site/src/content/lesson-pages/spring-mvc-flow.yaml의 says).
# 동작에 관한 정답은 verification의 MvcFlowTest로 확인했다 (스프링 부트 3.5).
# 질문마다 첫 문제는 본문의 예시로 묻고, 둘째 문제는 다른 상황으로 옮겨 묻는다.
# 2026-11-25에 검수해 reviewed로 바꿨다.
subject:
  key: dev
  name: 개발자 면접
lesson:
  key: spring-mvc-flow
  title: 스프링 MVC 요청 흐름
  unit: 스프링
  order: 706
concepts:
  - key: core
    name: 스프링 MVC 요청 흐름
coreQuestions:
  - key: q1
    text: "요청은 어떻게 컨트롤러 메서드를 찾아가나요?"
  - key: q2
    text: "메서드의 인자는 누가 어떻게 채우나요?"
  - key: q3
    text: "반환한 객체는 어떻게 응답 본문이 되나요?"
questions:
  # ── 질문 1 ──
  - key: mf-405
    concept: core
    coreQuestion: q1
    type: multiple_choice
    status: reviewed
    difficulty: 1
    body: 'OrderController에는 @GetMapping("/orders/{id}")와 @PostMapping("/orders")만 있어요. PUT /orders/1을 보내면 응답 상태 코드는 몇일까요?'
    choices:
      - "200"
      - "400"
      - "404"
      - "405"
    answer: "4"
    explanation: |-
      **405예요.** 경로 /orders/{id}는 표에 있지만 PUT 메서드가 없어요.

      - 경로가 아예 표에 없을 때가 404예요
      - 405 응답의 Allow 헤더가 그 경로에서 되는 메서드를 알려 줘요
    source: https://docs.spring.io/spring-framework/reference/web/webmvc/mvc-servlet/special-bean-types.html
  - key: mf-404
    concept: core
    coreQuestion: q1
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: '회원 API에 @GetMapping("/members/{id}")만 있어요. GET /members/7/orders를 보내면 어떻게 될까요?'
    choices:
      - '/members/{id}가 7/orders를 받아 컨트롤러가 불린다'
      - 404. 표에 그 경로가 없다
      - 405. 메서드가 다르다
      - 400. id를 long으로 바꾸지 못한다
    answer: "2"
    explanation: |-
      **404예요.** {id} 자리는 경로의 한 칸(/ 사이)만 받아요. /members/7/orders는 칸이 하나 더 있어 표의 어느 줄과도 맞지 않아요.

      - 핸들러 매핑 단계에서 멈추니 컨트롤러는 불리지 않아요
    source: https://docs.spring.io/spring-framework/reference/web/webmvc/mvc-controller/ann-requestmapping.html
  # ── 질문 2 ──
  - key: mf-enum-case
    concept: core
    coreQuestion: q2
    type: multiple_choice
    status: reviewed
    difficulty: 1
    body: '컨트롤러가 @RequestParam OrderStatus status로 받고, OrderStatus에는 PAID와 CANCELED가 있어요. GET /orders?status=paid를 보내면 어떻게 될까요?'
    choices:
      - 200. 대소문자를 가리지 않는다
      - 400. paid를 enum으로 바꾸지 못한다
      - 200. status가 null로 들어간다
      - 500. 컨트롤러에서 예외가 난다
    answer: "2"
    explanation: |-
      **400이에요.** 쿼리 값은 문자열이고, 인자 리졸버가 enum으로 바꿀 때 이름이 정확히 같아야 해요. 바꾸지 못하면 컨트롤러를 부르기 전에 400이에요.

      - status=PAID면 200이에요
    source: https://docs.spring.io/spring-framework/reference/web/webmvc/mvc-controller/ann-methods/typeconversion.html
  - key: mf-missing-int
    concept: core
    coreQuestion: q2
    type: code_predict
    status: reviewed
    difficulty: 2
    body: 아래처럼 받는데 요청 본문이 {"email":"a@b.com","nickname":"kim"}이에요. 응답과 age 값은 어떻게 될까요? 스프링 부트의 기본 설정이에요.
    code: |-
      record SignUp(String email, int age) {}

      @PostMapping("/members")
      SignUp join(@RequestBody SignUp req) {
        return req;
      }
    choices:
      - 200이고 age는 0이다
      - 400. age가 없다
      - 400. 모르는 필드 nickname이 있다
      - 200이고 age는 null이다
    answer: "1"
    explanation: |-
      **200이고 age는 0이에요.** JSON에 없는 int 필드는 기본값 0이 되고, 모르는 필드 nickname은 스프링 부트가 잭슨의 실패 설정을 꺼 두어 무시돼요.

      - 빠진 값을 막으려면 검증이 필요해요
    source: https://docs.spring.io/spring-boot/reference/features/json.html
  # ── 질문 3 ──
  - key: mf-string-return
    concept: core
    coreQuestion: q3
    type: multiple_choice
    status: reviewed
    difficulty: 1
    body: '@RestController의 @GetMapping("/ping") 메서드가 String "pong"을 돌려줘요. 응답 본문과 Content-Type은 무엇일까요?'
    choices:
      - '"pong"(따옴표 포함), application/json'
      - pong, text/plain
      - '{"value":"pong"}, application/json'
      - 뷰 pong.html을 찾다 실패한다
    answer: "2"
    explanation: |-
      **pong, text/plain이에요.** String은 문자열 컨버터가 글자 그대로 써요. JSON 따옴표가 붙지 않아요.

      - 객체를 돌려주면 잭슨 컨버터가 application/json으로 써요
      - 뷰를 찾는 것은 @ResponseBody가 없는 @Controller일 때예요
    source: https://docs.spring.io/spring-framework/reference/web/webmvc/message-converters.html
  - key: mf-406
    concept: core
    coreQuestion: q3
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: '@RestController의 메서드가 List<Order>를 돌려줘요(Order는 일반 record). 클라이언트가 Accept: text/csv만 보내면 어떻게 될까요?'
    choices:
      - JSON으로 200
      - CSV로 200
      - "406"
      - "415"
    answer: "3"
    explanation: |-
      **406이에요.** 메시지 컨버터는 반환 타입과 Accept 헤더로 골라요. CSV로 쓸 컨버터가 없어서 요청이 원하는 형식을 만들 수 없어요.

      - Accept를 보내지 않거나 */*면 JSON이 나가요
    source: https://docs.spring.io/spring-framework/reference/web/webmvc/message-converters.html
  - key: mf-entity-body
    concept: core
    coreQuestion: q2
    type: code_predict
    status: reviewed
    difficulty: 2
    body: 'OrderEntity는 id, menu, quantity, status 필드와 그 세터를 가진 엔티티예요. 클라이언트가 {"id":999,"menu":"latte","quantity":2,"status":"PAID"}를 보내면 req에는 무엇이 들어갈까요?'
    code: |-
      @PostMapping("/orders")
      Order create(
          @RequestBody OrderEntity req) {
        return orders.save(req);
      }
    choices:
      - menu와 quantity만 채워지고 id와 status는 기본값이다
      - id 999와 status PAID까지 클라이언트가 보낸 그대로 채워진다
      - id가 있어서 400이 난다
      - 엔티티는 @RequestBody로 받을 수 없어 500이 난다
    answer: "2"
    explanation: |-
      **보낸 그대로 채워져요.** 잭슨은 세터가 있는 필드를 모두 채워요. 결제하지 않은 주문을 PAID로 만들 수 있어요.

      - 받을 필드만 가진 요청 record(menu, quantity)로 받으면 나머지는 들어갈 자리가 없어요
    source: https://docs.spring.io/spring-framework/reference/web/webmvc/mvc-controller/ann-methods/requestbody.html
  # ── 전체 ──
  - key: mf-interview
    concept: core
    coreQuestion: all
    type: descriptive
    status: reviewed
    difficulty: 2
    body: 면접에서 "스프링 MVC에서 요청이 컨트롤러에 닿고 응답이 나가기까지를 설명해 주세요"라는 질문을 받았어요. 1분 안에 답해 보세요.
    explanation: |-
      **DispatcherServlet이 핸들러 매핑으로 메서드를 찾고, 어댑터가 인자를 채워 부르고, 메시지 컨버터가 반환 값을 본문에 써요.**

      - **찾기:** 앱이 뜰 때 만든 경로와 메서드의 표에서 찾는다. 없으면 404, 메서드가 다르면 405
      - **인자:** 리졸버가 경로, 쿼리, 본문에서 꺼내 타입을 바꾼다. 바꾸지 못하면 컨트롤러 전에 400
      - **응답:** 반환 타입과 Accept로 컨버터를 골라 쓴다. 객체는 JSON, String은 글자 그대로, 못 만들면 406
      - **상태 코드:** ResponseEntity로 정한다
    checklist:
      - DispatcherServlet이 핸들러 매핑으로 부를 메서드를 찾는다고 말했다
      - 인자 리졸버가 값을 꺼내 타입을 바꾸고, 실패하면 400이라고 말했다
      - 메시지 컨버터가 반환 값을 JSON 등으로 본문에 쓴다고 말했다
      - 404, 405, 400, 406 가운데 둘 이상이 어느 단계에서 나오는지 말했다
    source: https://docs.spring.io/spring-framework/reference/web/webmvc/mvc-servlet.html
