questions:
  # ── 질문 1 ──
  - key: tc-linear-count
    concept: core
    coreQuestion: q1
    type: code_predict
    status: reviewed
    difficulty: 1
    body: 회원 2,000명이 든 리스트에서 목록에 없는 이메일을 찾아요. equals는 몇 번 불릴까요?
    code: |-
      boolean exists(List<Member> members,
                     String email) {
        for (Member m : members) {
          if (m.email().equals(email)) {
            return true;
          }
        }
        return false;
      }
    choices:
      - 1번
      - 1,000번
      - 2,000번
      - 4,000,000번
    answer: "3"
    explanation: |-
      **2,000번이에요.** 없는 이메일이면 회원을 한 명씩 모두 비교해요.

      - 비교 횟수가 회원 수 n에 비례해서 O(n)이에요
      - 회원이 100배 늘면 비교도 100배 늘어요
    source: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/ArrayList.html
  - key: tc-drop-constant
    concept: core
    coreQuestion: q1
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: 어떤 코드가 실행하는 단계 수가 2n + 100이에요. n이 1만에서 2만으로 늘면 단계 수는 대략 몇 배가 될까요?
    choices:
      - 거의 그대로
      - 약 2배
      - 약 4배
      - 약 100배
    answer: "2"
    explanation: |-
      **약 2배예요.** 2n + 100은 가장 빨리 자라는 항 n만 남기면 O(n)이에요.

      - n이 1만일 때 100은 전체의 0.5%라 거의 보이지 않아요
      - 상수 2도 늘어나는 모양을 바꾸지 않아요. n이 두 배면 단계도 약 두 배예요
    source: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/ArrayList.html
  # ── 질문 2 ──
  - key: tc-pair-double
    concept: core
    coreQuestion: q2
    type: code_predict
    status: reviewed
    difficulty: 1
    body: 이메일이 같은 회원이 둘 있는지 보는 코드예요. n이 2배가 되면 비교 횟수는 대략 몇 배가 될까요?
    code: |-
      for (int i = 0; i < n; i++) {
        for (int j = i + 1; j < n; j++) {
          if (emails[i].equals(emails[j])) {
            return true;
          }
        }
      }
    choices:
      - 약 2배
      - 약 4배
      - 약 8배
      - 그대로
    answer: "2"
    explanation: |-
      **약 4배예요.** 겹친 반복이라 비교 횟수가 n(n-1)/2이고, 모양은 O(n²)이에요.

      - n이 1천이면 499,500번, 2천이면 1,999,000번이에요
      - n이 100배면 비교는 약 1만 배가 돼요
    source: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/ArrayList.html
  - key: tc-doubling-loop
    concept: core
    coreQuestion: q2
    type: code_predict
    status: reviewed
    difficulty: 2
    body: n이 1024일 때 아래 코드는 몇 번 출력할까요?
    code: |-
      for (int i = 1; i < n; i *= 2) {
        System.out.println(i);
      }
    choices:
      - 10번
      - 512번
      - 1024번
      - 1023번
    answer: "1"
    explanation: |-
      **10번이에요.** i가 1, 2, 4, ... 512로 두 배씩 늘어서 2를 10번 곱하면 1024에 닿아요.

      - 반복마다 남은 양이 절반이 되는 반복과 같은 O(log n)이에요
      - n이 1천 배가 돼도 반복은 10번 남짓 늘어요
    source: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/ArrayList.html
  # ── 질문 3 ──
  - key: tc-best-not-bigo
    concept: core
    coreQuestion: q3
    type: multiple_choice
    status: reviewed
    difficulty: 1
    body: 회원 1천 명이 든 리스트를 처음부터 하나씩 비교해 이메일을 찾는 메서드가 있어요. 찾는 이메일이 맨 앞에 있어서 비교 한 번에 끝났어요. 이 메서드의 시간 복잡도를 어떻게 말할까요?
    choices:
      - O(1)이다. 한 번에 끝났다
      - O(n)이다. 따로 말이 없으면 빅오는 최악을 말하고, 없는 이메일이면 n번 비교한다
      - O(log n)이다. 평균을 내면 그렇다
      - 정할 수 없다. 입력마다 다르다
    answer: "2"
    explanation: |-
      **O(n)이에요.** 한 번에 끝난 것은 최선의 경우예요.

      - 없거나 맨 뒤에 있으면 n번 비교해요. 이것이 최악이에요
      - 최선은 "운이 좋으면 빠르다"일 뿐이라 약속이 되지 않아요
      - 평균도 약 n/2번이라 상수를 버리면 O(n)이에요
    source: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/ArrayList.html
  - key: tc-max-best-worst
    concept: core
    coreQuestion: q3
    type: code_predict
    status: reviewed
    difficulty: 2
    body: 길이가 n인 정수 배열에서 가장 큰 값을 찾아요. 값이 어떻게 놓여 있을 때 비교 횟수가 가장 적고, 가장 많을까요?
    code: |-
      int max = arr[0];
      for (int i = 1; i < arr.length; i++) {
        if (arr[i] > max) {
          max = arr[i];
        }
      }
    choices:
      - 가장 큰 값이 맨 앞이면 1번, 맨 뒤면 n-1번
      - 어떻게 놓여 있든 n-1번이다. 최선과 최악이 같다
      - 정렬되어 있으면 log n번이다
      - 가장 큰 값이 맨 앞이면 0번이다
    answer: "2"
    explanation: |-
      **어떻게 놓여 있든 n-1번이에요.** 이 반복은 중간에 끝나는 곳이 없어서 끝까지 돌아요.

      - 최선과 최악이 같은 O(n)이에요
      - 이메일 찾기는 찾으면 return해서 최선과 최악이 달랐어요
    source: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/ArrayList.html
  # ── 질문 4 ──
  - key: tc-set-dedupe
    concept: core
    coreQuestion: q4
    type: code_predict
    status: reviewed
    difficulty: 1
    body: 이메일 n개 가운데 같은 것이 둘 있는지 보는 코드예요. 이중 for로 모든 짝을 비교하던 코드를 아래처럼 바꿨어요. 시간 복잡도는 무엇에서 무엇으로 바뀔까요?
    code: |-
      Set<String> seen = new HashSet<>();
      for (String e : emails) {
        if (!seen.add(e)) {
          return true;
        }
      }
      return false;
    choices:
      - O(n²)에서 O(n)
      - O(n²)에서 O(log n)
      - O(n)에서 O(1)
      - 바뀌지 않는다
    answer: "1"
    explanation: |-
      **O(n²)에서 O(n)이에요.** 반복은 한 겹이고 add 안의 확인은 평균 O(1)이에요.

      - n이 10만이면 겹친 반복은 몇 초 이상, 이 코드는 몇 밀리초에 끝나요
      - 대신 n개를 한 번 더 담는 메모리를 써요
    source: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/HashSet.html
  - key: tc-soldout-list
    concept: core
    coreQuestion: q4
    type: code_predict
    status: reviewed
    difficulty: 2
    body: 상품 n개를 돌며 품절 목록에 있는 상품을 숨겨요. soldOutIds는 크기가 m인 ArrayList예요. 이 코드의 시간 복잡도와, soldOutIds를 HashSet으로 바꾼 뒤의 시간 복잡도는 각각 무엇일까요?
    code: |-
      for (Long id : productIds) {
        if (soldOutIds.contains(id)) {
          hide(id);
        }
      }
    choices:
      - O(n)과 O(n)
      - O(n×m)과 O(n)
      - O(n×m)과 O(n×m)
      - O(n)과 O(1)
    answer: "2"
    explanation: |-
      **O(n×m)과 O(n)이에요.** ArrayList.contains는 한 줄이지만 안에서 m개를 하나씩 비교해요.

      - 반복 안에서 O(m) 연산을 부르면 겹친 반복과 같아요
      - HashSet.contains는 평균 O(1)이라 상품 n개를 도는 O(n)만 남아요
    source: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/HashSet.html
  - key: tc-match-slow
    concept: core
    coreQuestion: q4
    type: code_predict
    status: reviewed
    difficulty: 2
    body: 서비스 코드에서 주문 10,000건과 회원 1,000명을 짝지어요. 안쪽 if의 비교는 모두 몇 번 일어날까요?
    code: |-
      for (Order o : orders) {
        for (Member m : members) {
          if (m.id().equals(o.memberId())) {
            o.setMemberName(m.name());
          }
        }
      }
    choices:
      - 1,000번
      - 10,000번
      - 11,000번
      - 10,000,000번
    answer: "4"
    explanation: |-
      **10,000,000번이에요.** 주문 하나마다 회원 전체를 돌아서 주문 수 곱하기 회원 수예요.

      - 회원을 id로 찾는 Map을 한 번 만들고 주문마다 get하면 get 10,000번으로 줄어요
      - 두 방법의 결과는 같아요
    source: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/stream/Collectors.html
  # ── 네 질문을 하나로 ──
  - key: tc-interview
    concept: core
    coreQuestion: all
    type: descriptive
    status: reviewed
    difficulty: 2
    body: 면접에서 "시간 복잡도가 무엇이고, 코드를 보고 어떻게 알아보나요?"라는 질문을 받았어요. 1분 안에 답해 보세요.
    explanation: |-
      **입력이 늘 때 실행하는 단계 수가 늘어나는 모양이고, 반복문의 모양으로 알아봐요.**

      - **정의:** 걸리는 초 대신 단계 수를 n의 식으로 세고, 가장 빨리 자라는 항만 남긴 빅오로 쓴다
      - **읽는 법:** 반복 없음 O(1), 한 겹 O(n), 겹침 O(n²), 절반씩 O(log n)
      - **경우:** 따로 말이 없으면 최악을 말한다
      - **문제가 될 때:** n이 커질 때. 반복 안의 List.contains는 O(n²)을 만들고, HashSet이나 HashMap으로 O(n)으로 줄인다
    checklist:
      - 입력의 크기 n이 늘 때 단계 수가 늘어나는 모양이라고 말했다
      - 상수와 작은 항을 버린다고 말했다
      - 반복문의 모양(한 겹, 겹침, 절반씩)으로 알아본다고 말했다
      - 빅오는 보통 최악을 말한다고 말했다
      - 반복 안의 O(n) 탐색을 HashSet이나 HashMap으로 줄인다고 말했다
    source: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/HashSet.html
