# 도커와 컨테이너 문제
# 형식: https://github.com/wanja727/retrievo/blob/main/docs/content-format.md
#
# 모든 문제는 coreQuestions의 질문 하나에 묶이고(coreQuestion), 답의 근거가 레슨 본문에 있다
# (site/src/content/lesson-pages/docker-container.yaml의 says).
# 동작에 관한 정답은 verification의 DockerContainerTest로 확인했다 (도커, eclipse-temurin:21-jre).
# 질문마다 첫 문제는 본문의 예시로 묻고, 둘째 문제는 다른 상황으로 옮겨 묻는다.
# 2026-11-25에 만들고 같은 날 검수해 reviewed로 바꿨다.
subject:
  key: dev
  name: 개발자 면접
lesson:
  key: docker-container
  title: 도커와 컨테이너
  unit: 테스트와 운영
  order: 905
concepts:
  - key: core
    name: 도커와 컨테이너
coreQuestions:
  - key: q1
    text: "컨테이너는 가상 머신과 무엇이 다른가요?"
  - key: q2
    text: "이미지와 컨테이너는 무엇이 다른가요?"
  - key: q3
    text: "Dockerfile의 순서가 왜 빌드 시간을 바꾸나요?"
  - key: q4
    text: "컨테이너에서 자바 앱의 메모리는 어떻게 정해지나요?"
questions:
  # ── 질문 1 ──
  - key: dk-uname
    concept: core
    coreQuestion: q1
    type: multiple_choice
    status: reviewed
    difficulty: 1
    body: 우분투 22.04 리눅스 서버에서 docker run --rm alpine uname -r로 커널 버전을 찍었어요. 무엇이 나올까요?
    choices:
      - 알파인 리눅스 이미지에 든 커널의 버전
      - 호스트 우분투 서버의 커널 버전
      - 도커 엔진의 버전
      - 컨테이너마다 다른 임의의 버전
    answer: "2"
    explanation: |-
      **호스트 우분투의 커널 버전이에요.** 컨테이너는 호스트의 커널을 같이 쓰는 격리된 프로세스라서 이미지에는 커널이 없어요.

      - 가상 머신은 커널까지 든 운영체제를 따로 띄워서 자기 커널 버전이 나와요
    source: https://docs.docker.com/get-started/docker-concepts/the-basics/what-is-a-container/
  - key: dk-pid1-exit
    concept: core
    coreQuestion: q1
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: 컨테이너 안에서 java -jar app.jar로 띄운 스프링 서버가 시작 중에 예외로 끝났어요. 컨테이너는 어떻게 될까요?
    choices:
      - 컨테이너는 계속 돌고 앱만 멈춘다
      - 컨테이너도 함께 끝난다. 앱이 그 컨테이너의 PID 1이다
      - 도커가 같은 컨테이너 안에서 앱을 다시 띄운다
      - 컨테이너 안의 운영체제가 앱을 다시 띄운다
    answer: "2"
    explanation: |-
      **컨테이너도 끝나요.** 컨테이너 안의 첫 프로세스(PID 1)가 끝나면 컨테이너가 끝나요.

      - 컨테이너는 운영체제를 따로 띄운 것이 아니라 프로세스를 격리한 것이라 앱을 돌봐 줄 다른 프로세스가 없어요
    source: https://docs.docker.com/get-started/docker-concepts/the-basics/what-is-a-container/
  # ── 질문 2 ──
  - key: dk-file-gone
    concept: core
    coreQuestion: q2
    type: multiple_choice
    status: reviewed
    difficulty: 1
    body: 컨테이너 A 안에서 /tmp/order.log를 만들었어요. A를 지우고 같은 이미지로 컨테이너를 다시 띄우면 /tmp/order.log는 있을까요?
    choices:
      - 있다. 이미지에 저장됐다
      - 없다. A의 쓰기 층과 함께 사라졌다
      - 있다. 도커가 파일을 옮겨 준다
      - 이미지 태그가 같으면 있다
    answer: "2"
    explanation: |-
      **없어요.** 컨테이너에서 바꾼 파일은 이미지가 아니라 그 컨테이너의 쓰기 층에만 있어서, 컨테이너를 지우면 함께 사라져요.

      - 이미지는 읽기 전용이라 바뀌지 않아요
    source: https://docs.docker.com/get-started/docker-concepts/building-images/understanding-image-layers/
  - key: dk-db-volume
    concept: core
    coreQuestion: q2
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: 개발 PC에서 MySQL을 볼륨 없이 컨테이너로 띄워 회원 데이터를 넣었어요. MySQL 이미지를 새 버전으로 바꾸려고 컨테이너를 지우고 새 이미지로 다시 띄웠어요. 회원 데이터는 어떻게 될까요?
    choices:
      - 새 컨테이너로 자동으로 옮겨진다
      - 사라진다. 데이터를 남기려면 볼륨에 둬야 했다
      - 옛 이미지 안에 남아 있어 다시 읽힌다
      - 새 이미지가 옛 데이터를 변환해 읽는다
    answer: "2"
    explanation: |-
      **사라져요.** DB 파일이 지운 컨테이너의 쓰기 층에 있었어요.

      - 컨테이너 밖의 저장 공간인 볼륨을 데이터 폴더에 붙이면 컨테이너를 지워도 남아요
    source: https://docs.docker.com/get-started/docker-concepts/building-images/understanding-image-layers/
  # ── 질문 3 ──
  - key: dk-cache-deps
    concept: core
    coreQuestion: q3
    type: code_predict
    status: reviewed
    difficulty: 1
    body: 아래 Dockerfile로 한 번 빌드한 뒤 src의 컨트롤러 한 줄만 고치고 다시 빌드했어요. RUN ./gradlew dependencies 층은 어떻게 될까요?
    code: |-
      FROM eclipse-temurin:21-jdk
      WORKDIR /app
      COPY build.gradle settings.gradle ./
      RUN ./gradlew dependencies
      COPY src src
      RUN ./gradlew bootJar
    choices:
      - 다시 실행된다
      - 캐시를 쓴다. 그 위의 층이 바뀌지 않았다
      - 이미지에서 빠진다
      - 빌드가 실패한다
    answer: "2"
    explanation: |-
      **캐시를 써요.** 바뀐 것은 아래쪽의 COPY src 층이라, 그 위의 의존성 층은 지난번 것을 꺼내 써요.

      - 한 층이 바뀌면 그 아래 층만 다시 만들어요
    source: https://docs.docker.com/build/cache/
  - key: dk-node-order
    concept: core
    coreQuestion: q3
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: Node 서버의 Dockerfile이 COPY . . 다음 RUN npm install이에요. 소스 한 줄만 고쳐도 빌드가 3분씩 걸려요. 어떻게 고치는 것이 맞을까요?
    choices:
      - RUN npm install을 맨 아래로 옮긴다
      - package.json만 먼저 복사해 npm install을 하고, 그다음 소스를 복사한다
      - --no-cache로 빌드한다
      - COPY를 여러 번 나눠 쓰면 순서와 상관없이 빨라진다
    answer: "2"
    explanation: |-
      **의존성 목록만 먼저 복사해 설치하고 소스는 나중에 복사해요.** 소스를 고쳐도 package.json이 같으면 설치 층이 캐시를 써요.

      - COPY . .는 소스가 바뀔 때마다 그 층과 아래의 npm install을 다시 돌려요
    source: https://docs.docker.com/build/cache/
  # ── 질문 4 ──
  - key: dk-heap-default
    concept: core
    coreQuestion: q4
    type: multiple_choice
    status: reviewed
    difficulty: 1
    body: 메모리 한도 2GB를 준 컨테이너에서 자바 21로 스프링 서버를 띄웠어요. -Xmx 같은 메모리 옵션은 없어요. 힙 최대 크기는 얼마쯤일까요?
    choices:
      - 약 2GB
      - 약 512MB
      - 도커가 도는 PC 메모리의 4분의 1
      - 약 1.5GB
    answer: "2"
    explanation: |-
      **약 512MB예요.** JVM은 컨테이너의 한도를 자기 메모리로 보고 그 4분의 1을 힙 최대 크기의 기본값으로 잡아요.

      - -XX:MaxRAMPercentage=75로 비율을 올릴 수 있어요
    source: https://docs.oracle.com/en/java/javase/21/docs/specs/man/java.html
  - key: dk-oom-137
    concept: core
    coreQuestion: q4
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: 한도 1GB 컨테이너가 로그 한 줄 없이 재시작을 반복해요. docker inspect에는 종료 코드 137, OOMKilled true가 보여요. 자바 옵션은 -Xmx1g예요. 원인으로 가장 맞는 것은?
    choices:
      - 힙이 모자라 OutOfMemoryError가 났다
      - 힙에 한도 전부를 줘서 힙 밖의 메모리를 더하면 한도를 넘었고 커널이 죽였다
      - 도커 엔진이 오래돼 컨테이너를 멈췄다
      - CPU 한도를 넘었다
    answer: "2"
    explanation: |-
      **힙 밖의 메모리까지 더해 한도를 넘어 커널이 SIGKILL로 죽였어요.** 137은 128 + 9(SIGKILL)예요.

      - JVM은 힙 말고도 메타스페이스, 스레드 스택, 버퍼를 써요
      - OutOfMemoryError라면 로그에 예외가 남아요
      - -Xmx를 빼고 -XX:MaxRAMPercentage=75를 줘요
    source: https://docs.docker.com/engine/containers/resource_constraints/
  - key: dk-ram-percentage
    concept: core
    coreQuestion: q4
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: docker run -m 1g -e JAVA_TOOL_OPTIONS="-XX:MaxRAMPercentage=75" order-api:1.4.0으로 띄운 스프링 서버의 힙 최대 크기는 얼마쯤일까요?
    choices:
      - 약 256MB
      - 약 768MB
      - 약 1GB
      - 약 75MB
    answer: "2"
    explanation: |-
      **약 768MB예요.** 한도 1GB의 75%예요.

      - 나머지 약 256MB는 메타스페이스, 스레드 스택 같은 힙 밖의 메모리 몫으로 남아요
      - JAVA_TOOL_OPTIONS는 JVM이 시작할 때 읽는 환경 변수예요
    source: https://docs.oracle.com/en/java/javase/21/docs/specs/man/java.html
  # ── 면접 ──
  - key: dk-interview
    concept: core
    coreQuestion: all
    type: descriptive
    status: reviewed
    difficulty: 2
    body: 면접에서 "컨테이너와 가상 머신의 차이, 컨테이너에서 자바 앱의 메모리를 정할 때 주의할 점을 설명해 주세요"라는 질문을 받았어요. 1분 안에 답해 보세요.
    explanation: |-
      **컨테이너는 호스트 커널을 같이 쓰는 격리된 프로세스이고, JVM은 컨테이너 한도의 4분의 1을 힙으로 잡아요.**

      - **컨테이너 vs 가상 머신:** 커널 공유, 빠르고 가볍다. 격리는 가상 머신이 강하다
      - **이미지와 컨테이너:** 읽기 전용 틀과 그 위의 쓰기 층. 데이터는 볼륨
      - **Dockerfile:** 명령마다 층, 바뀐 층부터 다시. 의존성 먼저
      - **메모리:** 한도의 4분의 1, 넘으면 137. -Xmx를 한도와 같게 주지 않는다
    checklist:
      - 컨테이너가 호스트의 커널을 같이 쓰는 격리된 프로세스라고 말했다
      - 가상 머신은 운영체제 전체를 띄워 무겁지만 격리가 강하다고 말했다
      - 컨테이너의 파일은 지우면 사라지고 데이터는 볼륨에 둔다고 말했다
      - JVM이 컨테이너 한도의 4분의 1을 힙 기본값으로 잡는다고 말했다
      - 한도를 넘으면 커널이 죽여 137이 남고, 힙 밖의 메모리를 남겨야 한다고 말했다
    source: https://docs.docker.com/engine/containers/resource_constraints/
