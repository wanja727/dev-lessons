# 스레드 덤프와 힙 덤프
# 자료 파일의 칸은 docs/lesson-data-format.md에 있다. 문제는 content/questions/thread-heap-dump.yaml에 있다.
title: 스레드 덤프와 힙 덤프
description: 스레드 덤프에 보이는 것, 멈춘 서버의 원인을 덤프에서 찾는 법, 메모리를 붙잡는 것을 히스토그램과 힙 덤프로 찾는 법, 메모리 장애의 증거를 미리 남기는 법. 네 가지 질문에 스스로 답할 수 있게 데드락과 누수를 일부러 만든 자식 JVM으로 배우는 대화형 레슨.
unit: 테스트와 운영
minutes: 20
roadmap: T10
type: 자바 실행
prerequisites:
  - {slug: garbage-collection, title: 가비지 컬렉션}
  - {slug: deadlock, title: 데드락}
assume: '자바 21(OpenJDK)의 `jcmd`, `jstack`. 스레드의 상태와 락(경쟁 상태와 동기화 레슨), 데드락의 네 가지 조건(데드락 레슨), 닿을 수 있는 객체는 치워지지 않는다는 것과 GC(가비지 컬렉션 레슨), 힙과 힙 밖의 메모리(JVM 메모리 구조 레슨).'
example: '주문 서버가 두 가지로 아파요. 하나는 요청이 모두 멈춰 응답이 없고(데드락과 락 대기), 다른 하나는 메모리가 점점 차서 `OutOfMemoryError`로 죽어요(static 맵에 쌓이는 캐시). 자식 JVM을 띄워 두 장애를 일으키고 덤프로 원인을 찾아요.'
intro:
  - '서버가 살아는 있는데 요청에 아무 응답이 없어요. CPU도 0%예요. 로그에는 아무것도 없어요. 다른 날에는 서버가 몇 시간마다 `OutOfMemoryError`로 죽고, 재시작하면 한동안 괜찮아요. 로그와 지표만으로는 "지금 서버 안에서 무엇이 무엇을 기다리는지", "무엇이 메모리를 붙잡고 있는지"를 알 수 없어요.'
  - '스레드 덤프는 그 순간 모든 스레드가 어디에서 무엇을 기다리는지 찍은 사진이고, 힙 덤프는 그 순간 힙의 모든 객체와 누가 누구를 가리키는지 찍은 사진이에요. 백엔드 개발자는 장애 때 이 둘을 떠서 멈춘 원인과 새는 메모리를 찾아요. 운영 서버에서 뜰 때의 비용과 위험도 알아야 해요.'
  - '이 레슨에서는 자식 JVM에 데드락과 메모리 누수를 일부러 만들고, `jcmd`로 스레드 덤프와 클래스 히스토그램을 떠서 원인이 덤프에 어떻게 보이는지 실제 출력으로 확인해요.'
covers:
  - topic: '스레드 덤프는 그 순간 모든 스레드의 이름, 상태(RUNNABLE, BLOCKED, WAITING, TIMED_WAITING), 스택, 잡은 락과 기다리는 락을 보여 준다'
    where: '질문 1'
  - topic: '뜨는 법: `jcmd <PID> Thread.print`, `jstack <PID>`, `kill -3`. 스프링 부트 액추에이터의 `/actuator/threaddump`'
    where: '질문 1과 실무에서는'
  - topic: '데드락은 덤프 끝에 "Found one Java-level deadlock"으로 나오고, 서로의 락을 기다리는 스레드 둘이 보인다'
    where: '질문 2'
  - topic: '데드락이 아니어도 많은 스레드가 같은 락에 BLOCKED이거나, 같은 외부 호출에서 RUNNABLE(소켓 읽기)이면 그곳이 병목이다. 덤프를 몇 초 간격으로 여러 번 떠서 비교한다'
    where: '질문 2'
  - topic: 'CPU를 많이 쓰는 스레드 찾기: `top -H`로 스레드를 찾고 덤프의 `nid`와 맞춘다'
    where: '질문 2의 더 알아보기'
  - topic: '힙 덤프는 힙의 모든 객체와 참조를 파일로 쓴다. 크기가 힙만 하고, 뜨는 동안 JVM이 멈춘다'
    where: '질문 3'
  - topic: '클래스 히스토그램(`jcmd GC.class_histogram`)은 클래스마다 객체 수와 크기를 보여 주는 가벼운 대안이다. 시간 간격을 두고 두 번 떠서 늘어나는 클래스를 찾는다'
    where: '질문 3'
  - topic: '힙 덤프 분석: 무엇이 그 객체를 붙잡고 있는가(GC 루트까지의 경로), 붙잡고 있는 양(retained size). Eclipse MAT 같은 도구로 본다'
    where: '질문 3. 도구 사용법은 문서 근거'
  - topic: '`-XX:+HeapDumpOnOutOfMemoryError`와 `-XX:HeapDumpPath`로 OOM이 날 때 자동으로 힙 덤프를 남긴다'
    where: '질문 4 (자바 언어 과정의 JVM 메모리 구조(J14)가 넘긴 항목: 힙 덤프로 원인 찾기)'
  - topic: 'GC 로그(`-Xlog:gc`)로 힙이 GC 뒤에도 줄지 않고 계속 오르는지(누수) 본다. GC 튜닝보다 누수를 먼저 의심한다'
    where: '질문 4 (가비지 컬렉션(J15)이 넘긴 항목: GC 튜닝)'
  - topic: 'GC 튜닝의 기본: 힙 크기와 GC 종류(G1, ZGC)를 바꾸기 전에 목표(멈춤 시간, 처리량)와 GC 로그를 먼저 본다'
    where: '질문 4의 더 알아보기'
  - topic: '운영 서버에서 덤프를 뜰 때의 위험: 힙 덤프는 멈춤과 디스크, 개인정보가 담긴다'
    where: '실무에서는'
  - topic: '데드락을 막는 락 순서'
    where: '다루지 않음: 데드락(C5)'
  - topic: '어떤 객체가 치워지는지의 원리'
    where: '다루지 않음: 가비지 컬렉션(J15)'
links:
  test: https://github.com/wanja727/dev-lessons/blob/main/verification/src/test/java/lab/devlessons/dump/ThreadHeapDumpTest.java
  jcmd: https://docs.oracle.com/en/java/javase/21/docs/specs/man/jcmd.html
  state: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/lang/Thread.State.html
  javaCmd: https://docs.oracle.com/en/java/javase/21/docs/specs/man/java.html
  troubleshoot: https://docs.oracle.com/en/java/javase/21/troubleshoot/
  actuator: https://docs.spring.io/spring-boot/reference/actuator/endpoints.html
  mat: https://help.eclipse.org/latest/topic/org.eclipse.mat.ui.help/welcome.html
codes:
  deadlock: |-
    Object a = new Object();
    Object b = new Object();
    new Thread(() -> {
      synchronized (a) {
        sleep(200);
        synchronized (b) { }
      }
    }, "order-1").start();
    new Thread(() -> {
      synchronized (b) {
        sleep(200);
        synchronized (a) { }
      }
    }, "order-2").start();
  jcmd: |-
    $ jcmd                       # JVM 목록과 PID
    $ jcmd <PID> Thread.print
    $ jcmd <PID> GC.class_histogram
    $ jcmd <PID> GC.heap_dump /tmp/heap.hprof
  contention: |-
    static void decrease() {
      synchronized (STOCK) {
        sleep(600_000); // 느린 외부 호출
      }
    }
    // stock-holder가 먼저 들어가고
    // stock-1~5가 뒤따라 부름
  leak: |-
    class OrderCache {
      static final Map<Long, byte[]> CACHE =
          new HashMap<>();

      void put(Long id) {
        CACHE.put(id, new byte[10_000]);
      }
    }
  oomOptions: |-
    java -Xmx512m \
      -XX:+HeapDumpOnOutOfMemoryError \
      -XX:HeapDumpPath=/var/dumps \
      -Xlog:gc:file=/var/log/gc.log \
      -jar order-api.jar
  actuator: |-
    management:
      endpoints:
        web:
          exposure:
            include: health,threaddump
  dockerJcmd: |-
    $ docker exec order-api jcmd 1 Thread.print
predict:
  title: 서로를 기다리는 스레드는 어떤 상태일까요?
  text: '두 스레드가 서로가 잡은 락을 기다리며 멈췄어요. 이때 스레드 덤프를 뜨면 두 스레드의 상태는 무엇으로 나올까요? 모르는 게 정상이니 감으로 골라 보세요. 답은 질문 2에 나와요.'
  code: deadlock
  label: 내 예측
  options:
    - {value: RUNNABLE, label: RUNNABLE}
    - {value: BLOCKED, label: BLOCKED}
    - {value: WAITING, label: WAITING}
    - {value: TERMINATED, label: TERMINATED}
  answer: BLOCKED
  storageKey: dump-predict
  wrong: 예측은 "{label}"이었어요. 틀린 예측이 더 오래 남으니 괜찮아요.
questions:
  - id: q1
    title: 스레드 덤프에는 무엇이 보이나요?
    conclusion:
      lead: '그 순간 모든 스레드의 이름, 상태, 지금 실행 중인 메서드의 스택, 잡고 있는 락과 기다리는 락이 보여요.'
      sub: '"서버가 멈췄다"를 "어느 스레드가 어디서 무엇을 기다린다"로 바꿔 주는 사진이에요. 서버를 멈추지 않고 몇 초 안에 떠요.'
    says:
      - '`jcmd <PID> Thread.print`로 뜬다. 자식 JVM을 띄우고 실제로 떠서 한 스레드의 덩어리를 읽는다: 이름, `nid`, 상태(`java.lang.Thread.State`), 스택, `- locked <주소>`, `- waiting to lock <주소>`'
      - '상태 넷: RUNNABLE(실행 중이거나 입출력 중), BLOCKED(`synchronized` 락을 기다림), WAITING(`wait`, `join`, `LockSupport.park`로 기다림), TIMED_WAITING(`sleep`이나 시간을 정한 기다림)'
      - '스택은 위가 지금 실행 중인 메서드다. 아래로 내려가며 누가 불렀는지 읽는다'
      - '`jstack <PID>`와 `kill -3 <PID>`도 같은 것을 찍는다. `kill -3`은 표준 출력(로그)에 찍는다'
    asks:
      - '본문의 예시: 스레드 덤프에서 `Thread.sleep` 안에 있는 스레드의 상태는 (TIMED_WAITING)'
      - '옮긴 상황: 덤프의 한 스레드가 `- waiting to lock <0x...a1>`이고 다른 스레드가 `- locked <0x...a1>`이다. 두 스레드의 관계는 (앞 스레드가 뒤 스레드가 잡은 락을 기다린다)'
    body:
      - p: '**스레드 덤프**는 그 순간 JVM 안의 모든 스레드가 어디에서 무엇을 하고 있는지 찍은 글이에요. JDK에 든 `jcmd`로 떠요. `jcmd`만 치면 떠 있는 JVM과 PID 목록이 나와요([jcmd 문서](link:jcmd)).'
      - code: jcmd
      - p: '재고를 차감하는 메서드에 `synchronized`가 걸려 있고, 그 안에서 느린 외부 호출을 기다리는 프로그램을 자식 JVM으로 띄워 덤프를 떴어요. 스레드 하나(`stock-holder`)가 먼저 들어가 있고 다섯이 뒤따라 불렀어요.'
      - code: contention
      - ci:
          key: contention
          label: 실제 덤프의 두 덩어리 보기
          source: ThreadHeapDumpTest.threadDumpShowsDeadlockAndContention
      - p: '스레드 하나의 덩어리는 이렇게 읽어요.'
      - ul:
          - '**첫 줄**은 스레드 이름이에요. 톰캣이면 `http-nio-8080-exec-7` 같은 이름이에요. 실제 덤프에는 이름 뒤에 번호와 `nid`(운영체제의 스레드 번호)도 붙는데, 위 출력은 줄였어요.'
          - '**상태**(`java.lang.Thread.State`)가 둘째 줄에 나와요.'
          - '**스택**은 위가 지금 실행 중인 메서드이고, 아래로 내려가며 누가 불렀는지예요. `stock-holder`는 `decrease` 안에서 `Thread.sleep`을 하고 있어요.'
          - '**`- locked <주소>`**는 이 스레드가 잡고 있는 락, **`- waiting to lock <주소>`**는 얻으려고 기다리는 락이에요. 주소가 같으면 같은 락이에요. `stock-1`이 기다리는 락은 `stock-holder`가 잡은 그 락이에요.'
      - table:
          head: [상태, 뜻, 흔한 자리]
          rows:
            - [RUNNABLE, '실행 중이거나 입출력(소켓 읽기)을 하는 중', '계산, 외부 API 응답 기다리기']
            - [BLOCKED, '`synchronized` 락을 얻으려고 기다림', '다른 스레드가 잡은 락 앞']
            - [WAITING, '`wait`, `join`, `LockSupport.park`로 시간 제한 없이 기다림', '할 일이 없는 스레드 풀의 스레드']
            - [TIMED_WAITING, '`sleep`이나 시간을 정한 기다림', '`Thread.sleep`, 시간 제한이 있는 커넥션 대기']
      - p: '`jstack <PID>`도 같은 것을 찍고, `kill -3 <PID>`를 보내면 JVM이 자기 표준 출력(로그)에 덤프를 찍어요. 리눅스 기초 레슨의 `kill`과 달리 3번 신호(SIGQUIT)는 JVM을 끄지 않아요([문제 해결 안내](link:troubleshoot)).'
      - quiz:
          q: '스레드 덤프에서 `Thread.sleep` 안에 있는 스레드의 상태는 무엇일까요?'
          options:
            - RUNNABLE
            - BLOCKED
            - TIMED_WAITING
          answer: 3
          explain: '정해진 시간 동안 기다리는 것이라 TIMED_WAITING이에요. 락을 기다리는 것이 BLOCKED예요.'
      - next: '덤프를 읽을 수 있으면, 멈춘 서버의 원인을 어떻게 찾을까요?'
    recall: '스레드 덤프에는 그 순간 모든 스레드의 이름, 상태(RUNNABLE, BLOCKED, WAITING, TIMED_WAITING), 위가 지금 실행 중인 메서드인 스택, 잡은 락(`locked`)과 기다리는 락(`waiting to lock`)의 주소가 보여요. `jcmd <PID> Thread.print`, `jstack`, `kill -3`으로 서버를 멈추지 않고 떠요. 주소가 같으면 같은 락이에요.'
  - id: q2
    title: 멈춘 서버의 원인을 스레드 덤프에서 어떻게 찾나요?
    conclusion:
      lead: '데드락이면 덤프 끝에 JVM이 직접 찾아 알려 줘요. 데드락이 아니면 많은 스레드가 같은 곳에서 BLOCKED나 대기 중인지를 봐요.'
      sub: '덤프 한 장은 한 순간이라, 몇 초 간격으로 여러 장을 떠서 계속 같은 곳에 있는 스레드를 찾아요.'
    says:
      - '예측의 답. 코드 deadlock을 자식 JVM에서 돌리고 덤프를 뜬다. 두 스레드는 BLOCKED이고, 덤프 끝에 "Found one Java-level deadlock"과 누가 누구의 락을 기다리는지가 나온다. 실제 출력을 보인다'
      - '데드락이 아닌 멈춤: 스레드 20개가 같은 `synchronized` 메서드 앞에서 BLOCKED이고 하나만 그 안에서 느린 일을 한다. 덤프에서 `waiting to lock`의 주소가 같은 스레드를 세어 병목을 찾는다. 실제 출력을 보인다'
      - '외부 API를 기다리는 스레드는 BLOCKED가 아니라 RUNNABLE(소켓 읽기)로 보인다. 상태만 보지 말고 스택의 맨 위를 본다'
      - '덤프를 3초 간격으로 세 번 떠서 같은 스택에 머문 스레드를 찾는다. 한 번 뜬 것은 우연일 수 있다'
      - '더 알아보기: CPU를 많이 쓰는 스레드는 `top -H -p <PID>`로 스레드 ID를 찾고, 16진수로 바꿔 덤프의 `nid`와 맞춘다'
    widget:
      kind: classify
      note: '덤프의 장면(두 스레드가 서로의 락을 waiting to lock, 스레드 30개가 같은 주소를 waiting to lock, 스레드 50개가 `SocketInputStream.read`에서 RUNNABLE, 대부분이 `ThreadPoolExecutor.getTask`에서 WAITING)을 보고 "데드락", "한 락에 몰림", "외부 호출 대기", "할 일이 없어 쉼"으로 고른다'
    asks:
      - '본문의 예시: 코드 deadlock이 멈춘 뒤 뜬 덤프에서 두 스레드의 상태와 덤프 끝의 문구는 (BLOCKED, Found one Java-level deadlock)'
      - '옮긴 상황: 덤프의 톰캣 스레드 200개 가운데 190개가 `HikariPool.getConnection` 아래에서 TIMED_WAITING이다. 무엇을 의심하나 (커넥션 풀이 모자라다. 커넥션을 오래 잡는 코드나 풀 크기를 본다)'
    body:
      - p: '데드락 레슨의 데드락을 자식 JVM에서 일으켰어요. 두 스레드가 락을 반대 순서로 잡아요.'
      - code: deadlock
      - ci:
          key: deadlock
          label: 실제 덤프 보기
          source: ThreadHeapDumpTest.threadDumpShowsDeadlockAndContention
      - p: '예측의 답이에요. {{predict-result}} 두 스레드 모두 **BLOCKED**예요. `order-1`은 `...b650`을 잡고(`locked`) `...b660`을 기다리고(`waiting to lock`), `order-2`는 그 반대예요. 그리고 덤프 끝에 JVM이 직접 **"Found one Java-level deadlock"**이라고 적고 누가 누구를 기다리는지 알려 줘요. `synchronized`와 `ReentrantLock`의 데드락은 JVM이 찾아 줘요.'
      - h3: 데드락이 아닌 멈춤
      - p: '더 흔한 것은 데드락이 아니라 **한 곳에 몰린** 멈춤이에요. 질문 1의 덤프가 그랬어요. `stock-holder` 하나가 락을 잡고 느린 일을 하는 동안, `stock-1`부터 `stock-5`까지 다섯 스레드가 **같은 주소**를 `waiting to lock` 하며 BLOCKED였어요. 실제 서버라면 톰캣 스레드 200개 가운데 190개가 이렇게 줄 서 있고, 그래서 서버가 멈춘 것처럼 보여요. 같은 주소를 기다리는 스레드를 세면 병목이 보여요.'
      - p: '상태만 보면 놓치는 것도 있어요. 외부 API의 응답을 기다리는 스레드는 BLOCKED가 아니라 **RUNNABLE**(소켓 읽기 중)로 나와요. 상태보다 **스택의 맨 위**가 무엇인지를 봐요.'
      - p: '장면을 보고 무엇인지 골라 보세요.'
      - widget:
          kind: classify
          categories: [데드락, 한 락에 몰림, 외부 호출 대기, 할 일이 없어 쉼]
          items:
            - text: '두 스레드가 BLOCKED이고, 서로가 잡은 락을 waiting to lock 해요. 덤프 끝에 Found one Java-level deadlock이 있어요.'
              answer: 1
              explain: '서로를 기다리는 고리라 어느 쪽도 풀리지 않아요.'
            - text: '스레드 30개가 BLOCKED이고 모두 같은 주소를 waiting to lock 해요. 그 락을 잡은 스레드 하나는 안에서 sleep 중이에요.'
              answer: 2
              explain: '한 스레드가 락을 오래 잡아서 나머지가 줄 서 있어요.'
            - text: '스레드 50개가 RUNNABLE이고 스택 맨 위가 모두 SocketInputStream.read예요.'
              answer: 3
              explain: '모두 소켓에서 응답을 기다려요. 외부 API가 느린 거예요.'
            - text: '대부분의 스레드가 WAITING이고 스택 맨 위가 ThreadPoolExecutor.getTask예요.'
              answer: 4
              explain: '스레드 풀의 스레드가 일감을 기다리며 쉬고 있어요. 정상이에요.'
      - h3: 여러 장을 떠요
      - p: '덤프 한 장은 한 순간이라, 마침 그 순간에만 그 자리에 있었을 수도 있어요. 3초쯤 간격으로 세 장을 떠서, 계속 같은 스택에 머문 스레드를 찾아요. 그곳이 멈춘 자리예요.'
      - more:
          summary: '더 알아보기: CPU를 많이 쓰는 스레드 찾기'
          body:
            - p: '서버가 멈춘 게 아니라 CPU를 100% 쓰고 있다면, `top -H -p <PID>`로 CPU를 많이 쓰는 스레드의 번호를 찾고, 16진수로 바꿔 덤프의 `nid=0x...`와 맞춰요. 그 스레드의 스택이 CPU를 쓰는 코드예요.'
      - quiz:
          q: '덤프의 톰캣 스레드 200개 가운데 190개가 `HikariPool.getConnection` 아래에서 TIMED_WAITING이에요. 무엇을 의심할까요?'
          options:
            - 데드락
            - DB 커넥션 풀이 모자라다. 커넥션을 오래 잡는 코드나 풀 크기를 본다
            - 스레드 풀이 쉬고 있다
          answer: 2
          explain: '대부분의 스레드가 커넥션을 얻으려고 줄 서 있어요. 커넥션이 병목이에요.'
      - next: '멈춘 것은 스레드 덤프로 찾았어요. 그럼 메모리가 계속 차서 죽는 서버는요?'
    recall: '데드락이면 서로의 락을 기다리는 두 스레드가 BLOCKED로 보이고, 덤프 끝에 JVM이 "Found one Java-level deadlock"으로 알려 줘요. 데드락이 아니면 많은 스레드가 같은 락 주소를 waiting to lock 하거나, 같은 외부 호출(RUNNABLE의 소켓 읽기)이나 커넥션 대기에 머물러 있는지 봐요. 상태보다 스택의 맨 위를 보고, 몇 초 간격으로 여러 장을 떠 비교해요.'
  - id: q3
    title: 메모리를 붙잡고 있는 것은 어떻게 찾나요?
    conclusion:
      lead: '클래스 히스토그램을 시간 간격을 두고 두 번 떠서 계속 늘어나는 클래스를 찾고, 힙 덤프로 그 객체를 누가 붙잡고 있는지 따라가요.'
      sub: '힙 덤프는 힙만큼 크고 뜨는 동안 JVM이 멈추니, 가벼운 히스토그램으로 먼저 좁혀요.'
    says:
      - '코드 leak. 요청마다 static 맵에 10KB씩 넣고 빼지 않는다. 닿을 수 있으니 GC가 치우지 못한다(J15). 자식 JVM에서 돌린다'
      - '`jcmd <PID> GC.class_histogram`을 두 번 떠서 비교하면 `byte[]`와 `HashMap$Node`의 수가 늘어난다. 실제 출력의 위쪽 줄을 보인다'
      - '히스토그램은 "무엇이 많은가"를, 힙 덤프는 "누가 붙잡고 있는가"를 알려 준다. `jcmd <PID> GC.heap_dump`로 뜬 파일의 크기를 보인다. 힙만큼 크다'
      - '힙 덤프는 Eclipse MAT 같은 도구로 연다. 객체에서 GC 루트까지의 경로(여기서는 `OrderCache.CACHE` static 필드)와, 그 객체를 치우면 함께 풀리는 양(retained size)을 본다 (도구 문서 근거)'
    widget:
      kind: steps
      note: '요청이 1000번, 2000번, 3000번 들어온 뒤 뜬 클래스 히스토그램의 위쪽 줄(`byte[]`, `HashMap$Node`의 수와 크기)을 차례로 보인다. 숫자는 테스트의 실제 값. 마지막 단계에서 그 `byte[]`가 `OrderCache.CACHE`에 매달린 경로를 그림으로 보인다'
    asks:
      - '본문의 예시: 히스토그램을 10분 간격으로 두 번 떴더니 `byte[]`의 수가 1만 개에서 2만 개로 늘었다. 다음에 할 일은 (힙 덤프를 떠서 그 `byte[]`를 누가 붙잡고 있는지 GC 루트까지의 경로를 본다)'
      - '옮긴 상황: 힙이 8GB인 운영 서버에서 낮 시간에 힙 덤프를 떴다. 무엇을 조심해야 하나 (뜨는 동안 JVM이 멈추고 8GB 가까운 파일이 생기며 개인정보가 담긴다. 트래픽에서 빼고 뜬다)'
    body:
      - p: '요청마다 캐시에 10KB를 넣고 빼지 않는 코드예요. 맵이 static 필드라서 계속 닿을 수 있고, 가비지 컬렉션 레슨의 기준으로 GC가 치우지 못해요. 메모리가 조금씩 새요.'
      - code: leak
      - p: '"무엇이 메모리를 채우나"는 **클래스 히스토그램**이 먼저 알려 줘요. 클래스마다 살아 있는 객체의 수와 크기를 큰 순서로 보여 줘요. 이 프로그램을 자식 JVM으로 돌리며 요청 2000번 뒤와 6000번 뒤에 두 번 떴어요.'
      - ci:
          key: histogram
          label: 실제 히스토그램 보기
          source: ThreadHeapDumpTest.histogramShowsGrowingClass
      - p: '맨 위의 `[B`가 `byte[]`예요. 두 장 사이에 객체 수가 4000개, 크기가 40MB 늘었어요. 요청 4000번마다 10KB씩이니 정확히 맞아요. 한 장만 보면 "byte[]가 많다"일 뿐이지만, **간격을 두고 두 장을 비교하면 계속 늘어나는 것**이 보여요. 그것이 새는 것의 후보예요.'
      - h3: 누가 붙잡고 있는지는 힙 덤프로
      - p: '히스토그램은 무엇이 많은지만 알려 주고, **누가 그것을 붙잡고 있는지**는 몰라요. 그건 **힙 덤프**가 알려 줘요. 힙의 모든 객체와 누가 누구를 가리키는지를 파일로 써요.'
      - ci:
          key: heapdump
          label: 실제 결과 보기
          source: ThreadHeapDumpTest.histogramShowsGrowingClass
      - p: '파일이 100MB 가까이예요. 힙 덤프는 살아 있는 객체만큼 커서, 힙이 8GB인 서버면 몇 GB짜리 파일이 생겨요. 뜨는 동안 JVM이 멈추고, 파일 안에는 메모리에 있던 회원 정보와 토큰이 그대로 들어 있어요. 그래서 운영 서버에서는 트래픽에서 빼고 뜨고, 파일을 안전하게 다뤄요.'
      - p: '힙 덤프 파일은 Eclipse MAT 같은 도구로 열어요. 늘어나던 `byte[]`에서 시작해 **GC 루트까지의 경로**를 따라가면 `OrderCache.CACHE` static 필드가 나와요. 그 객체를 치우면 함께 풀리는 양(retained size)도 보여서, 무엇을 고치면 메모리가 얼마나 줄지 알 수 있어요([Eclipse MAT 문서](link:mat)). 도구의 사용법은 문서가 근거예요.'
      - quiz:
          q: '히스토그램을 10분 간격으로 두 번 떴더니 `byte[]`가 1만 개에서 2만 개로 늘었어요. 다음에 할 일은 무엇일까요?'
          options:
            - 힙을 두 배로 늘린다
            - 힙 덤프를 떠서 그 `byte[]`를 누가 붙잡고 있는지 GC 루트까지 따라간다
            - 스레드 덤프를 뜬다
          answer: 2
          explain: '히스토그램은 무엇이 느는지를, 힙 덤프는 누가 붙잡는지를 알려 줘요.'
      - next: '서버가 OOM으로 죽고 나서 재시작하면 그때의 힙은 사라져요. 증거를 미리 남길 수는 없을까요?'
    recall: '`jcmd <PID> GC.class_histogram`으로 클래스마다 객체 수와 크기를 보고, 간격을 두고 두 번 떠서 계속 늘어나는 클래스(예: byte[])를 찾아요. 그다음 `GC.heap_dump`로 힙 덤프를 떠서 MAT 같은 도구로 그 객체에서 GC 루트까지의 경로(예: static 맵)와 retained size를 봐요. 힙 덤프는 힙만큼 크고 뜨는 동안 멈추며 개인정보가 담겨요.'
  - id: q4
    title: 메모리 장애의 증거를 어떻게 미리 남기나요?
    conclusion:
      lead: '`-XX:+HeapDumpOnOutOfMemoryError`로 OOM이 나는 순간의 힙 덤프를 자동으로 남기고, GC 로그로 힙이 GC 뒤에도 계속 오르는지 기록해요.'
      sub: '서버가 죽고 재시작하면 증거가 사라져요. 죽기 직전의 덤프와 GC 기록이 있어야 원인을 찾아요.'
    says:
      - '코드 oomOptions. 작은 힙(`-Xmx64m`)의 자식 JVM에서 코드 leak을 OOM까지 돌린다. `HeapDumpPath`에 `.hprof` 파일이 생기고 출력에 "Dumping heap to ..."가 찍힌다. 실제 출력을 보인다'
      - '`-Xlog:gc`로 GC마다 전후의 힙 크기를 남긴다. 누수가 있으면 GC 뒤의 크기가 계속 오른다. 실제 로그 몇 줄로 그 모양을 보인다'
      - 'GC 튜닝(힙을 키우거나 GC를 바꾸기)은 누수를 늦출 뿐 고치지 못한다. GC 뒤의 크기가 오르면 누수를 먼저 찾는다'
      - '더 알아보기: GC 튜닝은 목표(멈춤 시간, 처리량)를 정하고 GC 로그로 지금을 잰 뒤 한 번에 하나씩 바꾼다. 자바 21의 기본은 G1이고, 멈춤을 아주 짧게 하려면 ZGC를 쓴다 (문서 근거)'
    asks:
      - '본문의 예시: `-XX:+HeapDumpOnOutOfMemoryError`를 준 서버가 OOM으로 죽었다. 무엇이 남나 (그 순간의 힙 덤프 파일 `.hprof`)'
      - '옮긴 상황: GC 로그에서 GC 뒤의 힙 크기가 200MB, 350MB, 500MB로 계속 오른다. 힙을 2GB로 키우면 해결되나 (안 된다. 누수라 늦게 죽을 뿐이다. 무엇이 붙잡는지 찾는다)'
    body:
      - p: '메모리가 새는 서버는 몇 시간 뒤 `OutOfMemoryError`로 죽고, 재시작하면 한동안 괜찮아요. 재시작하는 순간 그때의 힙이 사라지니 원인을 찾을 증거도 없어요. 그래서 처음부터 이 옵션을 켜 두고 띄워요.'
      - code: oomOptions
      - p: '질문 3의 누수 프로그램을 힙 64MB로 줄여 OOM까지 돌렸어요.'
      - ci:
          key: oom
          label: 실제 출력 보기
          source: ThreadHeapDumpTest.heapDumpOnOom
      - ul:
          - '**`-XX:+HeapDumpOnOutOfMemoryError`**와 **`-XX:HeapDumpPath`**: OOM이 나는 순간 JVM이 "Dumping heap to ..."를 찍고 그 폴더에 `java_pid<PID>.hprof`를 남겼어요. 죽기 직전의 힙이에요. 질문 3의 방법으로 열어 누가 붙잡았는지 봐요([java 명령 문서](link:javaCmd)).'
          - '**`-Xlog:gc`**: GC마다 한 줄씩 GC 전과 뒤의 힙 크기를 남겨요. `23M->5M`이면 GC 전 23MB에서 GC 뒤 5MB로 줄었다는 뜻이에요. 위 로그는 GC 뒤의 크기가 5MB, 53MB, 64MB로 **계속 올라요**. GC가 아무리 돌아도 치울 것이 없다는, 누수의 모양이에요. 운영에서는 `:file=`로 파일에 남겨요.'
      - h3: 힙을 키우는 것은 답이 아니에요
      - p: 'GC 뒤의 크기가 계속 오르는데 `-Xmx`만 키우면, 더 늦게 죽을 뿐이에요. GC의 종류나 설정을 바꾸는 GC 튜닝도 같아요. 누수가 있으면 무엇이 붙잡는지(질문 3)를 먼저 찾아 코드를 고쳐요. GC 뒤의 크기가 일정한데 멈춤이 길 때가 GC 튜닝을 볼 때예요.'
      - more:
          summary: '더 알아보기: GC 튜닝의 순서'
          body:
            - p: 'GC 튜닝은 목표(최대 멈춤 시간, 처리량)를 먼저 정하고, GC 로그로 지금을 잰 뒤, 한 번에 하나씩 바꿔 다시 재요. 자바 21의 기본 GC는 G1이고, 멈춤을 몇 ms 안으로 아주 짧게 하려면 ZGC를 써요(가비지 컬렉션 레슨, [문제 해결 안내](link:troubleshoot)).'
      - quiz:
          q: 'GC 로그에서 GC 뒤의 힙 크기가 200MB, 350MB, 500MB로 계속 올라요. 힙을 2GB로 키우면 해결될까요?'
          options:
            - 해결된다
            - 안 된다. 누수라 늦게 죽을 뿐이다. 무엇이 붙잡는지 찾는다
            - GC를 ZGC로 바꾸면 해결된다
          answer: 2
          explain: 'GC 뒤에도 줄지 않고 오르면 닿을 수 있는 객체가 쌓이는 누수예요. 힙이나 GC를 바꿔도 쌓이는 것은 그대로예요.'
    recall: '`-XX:+HeapDumpOnOutOfMemoryError`와 `-XX:HeapDumpPath`를 켜 두면 OOM이 나는 순간의 힙 덤프(.hprof)가 남아서, 재시작한 뒤에도 원인을 찾을 수 있어요. `-Xlog:gc`로 GC 전후의 힙 크기를 남기면, GC 뒤의 크기가 계속 오르는 누수의 모양이 보여요. 누수는 힙을 키우거나 GC를 튜닝해도 늦출 뿐이라 무엇이 붙잡는지 찾아 고쳐요.'
practice:
  title: 실무에서는 이렇게 써요
  says:
    - '스프링 부트 액추에이터의 `/actuator/threaddump`와 `/actuator/heapdump`. 힙 덤프 엔드포인트는 개인정보가 담기니 밖에 열지 않는다 (문서 근거)'
    - '컨테이너 안의 JVM에는 `docker exec <컨테이너> jcmd 1 Thread.print`로 뜬다. JRE 이미지에는 `jcmd`가 없을 수 있다. JDK 이미지나 `jattach`를 쓴다 (문서 근거)'
    - '흔한 실수 하나: 서버가 멈추자 바로 재시작해서 증거가 사라진다. 고친 순서: 트래픽에서 빼고, 스레드 덤프 세 장을 뜨고, 그다음 재시작한다'
    - '흔한 실수 둘: OOM 대응으로 `-Xmx`만 키운다. 질문 4대로 GC 로그와 OOM 때의 힙 덤프를 먼저 남기고 누수를 찾는다'
  body:
    - p: '이 구역의 액추에이터와 컨테이너 이야기는 테스트가 아니라 공식 문서가 근거예요.'
    - h3: 액추에이터로 뜨기
    - code: actuator
    - p: '스프링 부트 액추에이터는 `/actuator/threaddump`로 스레드 덤프를, `/actuator/heapdump`로 힙 덤프를 HTTP로 내려줘요. 서버에 접속하지 않아도 돼서 편하지만, 힙 덤프에는 메모리의 개인정보와 토큰이 그대로 들어 있으니 바깥에 열지 않아요. 위 설정처럼 필요한 것만 열고, 관리용 포트나 인증 뒤에 둬요([액추에이터 문서](link:actuator)).'
    - h3: 컨테이너 안의 JVM
    - code: dockerJcmd
    - p: '도커와 컨테이너 레슨에서 본 대로 컨테이너 안의 앱은 PID 1이에요. `docker exec`로 그 안에서 `jcmd 1`을 돌려요. JRE만 든 이미지에는 `jcmd`가 없을 수 있어서, JDK 이미지를 쓰거나 바깥에서 붙는 도구를 따로 둬요.'
    - h3: '흔한 실수: 멈추자마자 재시작한다'
    - p: '서버가 멈추면 급한 마음에 재시작부터 해요. 그러면 무엇이 무엇을 기다렸는지 증거가 사라지고, 같은 장애가 또 와요. 순서는 이래요. 로드 밸런서에서 그 서버를 빼서 사용자를 다른 서버로 보내고(CI/CD와 무중단 배포 레슨), 스레드 덤프를 3초 간격으로 세 장 뜨고(질문 2), 그다음 재시작해요.'
    - h3: '흔한 실수: OOM이면 -Xmx만 키운다'
    - p: '질문 4대로 누수면 늦게 죽을 뿐이에요. `HeapDumpOnOutOfMemoryError`와 GC 로그를 먼저 켜 두고, 다음 OOM 때 남은 힙 덤프에서 붙잡는 것을 찾아 고쳐요.'
interview:
  question: '서버가 응답하지 않거나 메모리가 차서 죽을 때 원인을 어떻게 찾는지 설명해 주세요'
  model:
    - label: 정의
      text: 스레드 덤프는 그 순간 모든 스레드의 상태, 스택, 잡은 락과 기다리는 락을 찍은 것이고, 힙 덤프는 힙의 모든 객체와 참조를 파일로 쓴 것입니다. jcmd의 Thread.print, GC.class_histogram, GC.heap_dump로 뜹니다.
    - label: 원리
      text: 응답이 없으면 스레드 덤프를 몇 초 간격으로 여러 장 떠서, 데드락(JVM이 Found one Java-level deadlock으로 알려 줌)인지, 많은 스레드가 같은 락이나 커넥션, 외부 호출에서 기다리는지 봅니다. 메모리가 차면 클래스 히스토그램을 간격을 두고 비교해 늘어나는 클래스를 찾고, 힙 덤프에서 GC 루트까지의 경로로 누가 붙잡는지 찾습니다.
    - label: 주의할 점
      text: 힙 덤프는 힙만큼 크고 뜨는 동안 멈추며 개인정보가 담기니 트래픽에서 빼고 뜨고 안전하게 다룹니다. 재시작하면 증거가 사라지니 HeapDumpOnOutOfMemoryError와 GC 로그를 미리 켜 둡니다. GC 뒤의 힙이 계속 오르면 힙을 키우지 말고 누수를 고칩니다.
    - label: 경험
      text: '(내 프로젝트로 채우기) 예: 몇 시간마다 OOM으로 죽던 서버의 OOM 힙 덤프에서 static 캐시 맵이 대부분을 붙잡고 있는 것을 찾아, 크기와 만료가 있는 캐시로 바꿨습니다.'
verified: '스레드 덤프, 클래스 히스토그램, 힙 덤프, OOM 때의 힙 덤프와 GC 로그는 자바 21의 자식 JVM에 데드락과 누수를 만들고 jcmd로 떠서 받은 값이에요. 주소와 PID는 실행할 때마다 달라요. MAT, 액추에이터, 컨테이너는 공식 문서가 근거예요. 코드가 바뀔 때마다 테스트([ThreadHeapDumpTest](link:test))가 다시 돌아요.'
footer: '근거: jcmd는 [jcmd 문서](link:jcmd), 스레드 상태는 [Thread.State](link:state), HeapDumpOnOutOfMemoryError와 -Xlog:gc는 [java 명령 문서](link:javaCmd), 덤프와 누수 찾기는 [문제 해결 안내](link:troubleshoot), 액추에이터는 [액추에이터 문서](link:actuator), MAT는 [Eclipse MAT 문서](link:mat). 오류는 [GitHub 이슈](https://github.com/wanja727/dev-lessons/issues)로 알려 주세요.'
claims:
  - claim: '데드락에 빠진 두 스레드는 덤프에서 BLOCKED이고, 덤프 끝에 "Found one Java-level deadlock"이 나온다'
    how: '단일 파일 자바 프로그램을 자식 JVM으로 띄우고 그 PID에 `jcmd Thread.print`를 실행한다'
    test: ThreadHeapDumpTest.threadDumpShowsDeadlockAndContention
  - claim: '한 `synchronized` 메서드에 스레드가 몰리면 많은 스레드가 같은 주소를 `waiting to lock`하고, 락을 잡은 스레드는 그 안에서 TIMED_WAITING이다'
    how: '같은 덤프에서 같은 주소를 기다리는 스레드 수를 센다'
    test: ThreadHeapDumpTest.threadDumpShowsDeadlockAndContention
  - claim: 'static 맵에 쌓는 프로그램의 클래스 히스토그램을 두 번 뜨면 `byte[]`의 수가 늘어나고, `GC.heap_dump`는 파일을 남긴다'
    how: '`jcmd GC.class_histogram`을 요청 2000번 뒤와 6000번 뒤에 실행해 `[B` 줄을 비교한다'
    test: ThreadHeapDumpTest.histogramShowsGrowingClass
  - claim: '`-XX:+HeapDumpOnOutOfMemoryError`를 준 작은 힙의 JVM은 OOM 때 `.hprof` 파일을 남기고, GC 로그의 GC 뒤 크기가 오른다'
    how: '`-Xmx64m`으로 OOM까지 돌리고 폴더의 파일과 출력을 남긴다'
    test: ThreadHeapDumpTest.heapDumpOnOom
sources:
  - '`jcmd`의 Thread.print, GC.class_histogram, GC.heap_dump: https://docs.oracle.com/en/java/javase/21/docs/specs/man/jcmd.html'
  - '스레드 상태: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/lang/Thread.State.html'
  - '`HeapDumpOnOutOfMemoryError`와 `-Xlog:gc`: java 명령 문서 https://docs.oracle.com/en/java/javase/21/docs/specs/man/java.html'
  - '문제 해결 안내(스레드 덤프, 힙 덤프, 메모리 누수): https://docs.oracle.com/en/java/javase/21/troubleshoot/'
  - '액추에이터의 threaddump와 heapdump: https://docs.spring.io/spring-boot/reference/actuator/endpoints.html'
  - 'Eclipse MAT의 GC 루트 경로와 retained size: https://help.eclipse.org/latest/topic/org.eclipse.mat.ui.help/welcome.html'
