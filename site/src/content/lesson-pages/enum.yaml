predict:
  title: 상수 하나를 끼워 넣으면?
  text: '`SHIPPED.ordinal()`은 2이고, 배송 중인 주문은 DB에 숫자 2로 저장되어 있어요. 이제 `PAID`와 `SHIPPED` 사이에 `PREPARING`을 끼워 넣고 다시 실행했어요. 저장된 2를 `OrderStatus.values()[2]`로 읽으면 무엇이 나올까요? 모르는 게 정상이니 감으로 골라 보세요. 답은 질문 4에 나와요.'
  code: inserted
  label: 내 예측
  options:
    - value: shipped
      label: SHIPPED
    - value: preparing
      label: PREPARING
    - value: error
      label: 예외
  answer: preparing
  storageKey: enum-predict
  wrong: 예측은 "{label}"이었어요. 틀린 예측이 더 오래 남으니 괜찮아요.
questions:
  - id: q1
    title: '정해진 값들을 int나 String 상수 대신 enum으로 만들면 무엇이 좋은가요?'
    conclusion:
      lead: '정해진 값 말고는 들어갈 수 없게 컴파일러가 막아 줘요.'
      sub: '`int`나 `String`으로 받으면 7이나 "PIAD" 같은 값도 컴파일을 통과하고, 실행한 뒤에야 문제가 드러나요.'
    says:
      - '코드 constants. 상태를 `int`로 받으면 `changeStatus(1L, 7)`이 컴파일된다. 7은 어떤 상태도 아니다. 주문 번호와 상태의 자리를 바꿔 넘겨도 둘 다 숫자라 컴파일된다'
      - '`String`도 같다. `"PIAD"`라는 오타가 컴파일된다. 비교할 때 `==`를 쓰는 실수(J4)도 따라온다'
      - '코드 basic. 매개변수 타입이 `OrderStatus`면 넘길 수 있는 것은 네 상수와 null뿐이다. `changeStatus(1L, 7)`은 컴파일 오류다'
      - '`OrderStatus.values()`는 모든 상수를 선언 순서대로 담은 배열을 준다. 선택지를 화면에 내려줄 때 쓴다'
      - '`OrderStatus.valueOf("PAID")`는 이름으로 상수를 찾는다. 없는 이름이면 `IllegalArgumentException`이다. 대소문자도 맞아야 한다'
    asks:
      - '본문의 예시: 코드 basic의 `changeStatus`에 `changeStatus(1L, 7)`과 `changeStatus(1L, OrderStatus.PAID)`를 쓰면 각각 어떻게 되나 (첫째는 컴파일 오류, 둘째는 컴파일된다)'
      - '옮긴 상황: `enum Grade { BASIC, VIP }`에서 `Grade.valueOf("vip")`를 실행하면 어떻게 되나 (`IllegalArgumentException`. 이름이 정확히 같은 상수가 없다)'
    body:
      - p: '주문 상태를 숫자 상수로 두는 코드를 자주 봐요.'
      - code: constants
      - p: '`changeStatus(1L, 7)`은 문제없이 컴파일돼요. 7은 어떤 상태도 아닌데요. 주문 번호와 상태의 자리를 바꿔 넘겨도 둘 다 숫자라 컴파일돼요. 문자열로 해도 같아요. `"PIAD"` 같은 오타가 컴파일되고, String 레슨에서 본 `==` 비교 실수도 따라와요.'
      - p: '**enum**은 정해진 값들의 목록을 하나의 타입으로 만들어요.'
      - code: basic
      - p: '매개변수 타입이 `OrderStatus`면 넘길 수 있는 것은 네 상수와 null뿐이에요. 같은 호출을 두 방식으로 컴파일해 봤어요.'
      - ci:
          key: type-safety
          label: 컴파일 결과 보기
          source: EnumTest.typeSafety
          code: typeRun
      - p: '틀린 값이 실행 중의 버그가 아니라 **컴파일 오류**가 됐어요. 이것이 enum을 쓰는 가장 큰 이유예요.'
      - h3: 목록과 이름으로 찾기
      - ul:
          - '**`OrderStatus.values()`**는 모든 상수를 선언 순서대로 담은 배열을 줘요. 화면에 선택지를 내려줄 때 써요.'
          - '**`OrderStatus.valueOf("PAID")`**는 이름으로 상수를 찾아요. 없는 이름이면 예외예요.'
      - ci:
          key: value-of
          label: 실제 결과 보기
          source: EnumTest.valueOfUnknown
          code: valueOfRun
      - p: '대소문자도 정확히 맞아야 해요. "paid"는 없는 이름이에요.'
      - quiz:
          q: '`enum Grade { BASIC, VIP }`에서 `Grade.valueOf("vip")`를 실행하면?'
          options:
            - VIP가 나온다
            - null이 나온다
            - IllegalArgumentException이 난다
          answer: 3
          explain: '`valueOf`는 이름이 정확히 같은 상수만 찾아요. 소문자 "vip"는 없는 이름이라 예외예요.'
      - next: '`OrderStatus.PAID`는 숫자도 문자열도 아니라면, 실제로는 무엇일까요?'
    recall: '정해진 값 말고는 들어갈 수 없게 컴파일러가 막아 줘요. `int`나 `String`으로 받으면 7이나 오타 같은 값도 컴파일되어 실행한 뒤에야 문제가 드러나지만, enum 타입으로 받으면 상수 말고는 컴파일 오류예요. `values()`는 모든 상수를, `valueOf`는 이름으로 상수를 찾고 없는 이름이면 `IllegalArgumentException`이에요.'
  - id: q2
    title: enum 상수는 실제로 무엇인가요?
    conclusion:
      lead: '상수 하나하나가 그 enum 타입의 객체이고, 상수마다 딱 하나만 만들어져요.'
      sub: '객체가 하나뿐이라서 enum은 `==`로 비교해도 안전해요.'
    says:
      - '`OrderStatus.PAID`는 숫자나 문자열이 아니라 `OrderStatus` 클래스의 객체를 가리키는 `public static final` 필드다. enum 클래스가 초기화될 때(J5) 상수마다 객체가 하나씩 만들어진다'
      - '바깥에서 `new OrderStatus()`는 컴파일 오류다. enum의 생성자는 언제나 private이다. 그래서 프로그램에 `PAID` 객체는 하나뿐이다'
      - '하나뿐이므로 `==`로 비교한다. `OrderStatus.valueOf("PAID") == OrderStatus.PAID`는 true다. `String`이나 `Long`과 달리 "값은 같은데 다른 객체"가 있을 수 없다'
      - '`status == OrderStatus.PAID`는 `status`가 null이어도 false를 줄 뿐이다. `status.equals(OrderStatus.PAID)`는 `NullPointerException`이다. 그래서 enum은 `==`로 비교한다'
      - '객체가 하나뿐이라는 성질로 싱글톤을 만들 수도 있다. O11에서 다룬다'
      - '더 알아보기: 모든 enum은 `java.lang.Enum`을 상속한다. 그래서 다른 클래스를 상속할 수 없다. 인터페이스는 구현할 수 있다'
    asks:
      - '본문의 예시: `OrderStatus a = OrderStatus.valueOf("PAID"); OrderStatus b = OrderStatus.PAID;`에서 `a == b`의 결과는 무엇인가 (true)'
      - '옮긴 상황: `Grade g = null;`일 때 `g == Grade.VIP`와 `g.equals(Grade.VIP)`를 각각 실행하면 어떻게 되나 (false, `NullPointerException`)'
    body:
      - p: '`enum OrderStatus { CREATED, PAID, SHIPPED, CANCELLED }`는 사실 **클래스**예요. 그리고 `PAID` 같은 상수 하나하나는 그 클래스의 **객체**를 가리키는 `public static final` 필드예요. static과 초기화 순서 레슨에서 본 클래스 초기화가 일어날 때 상수마다 객체가 하나씩 만들어져요.'
      - p: '바깥에서는 `new OrderStatus()`로 객체를 더 만들 수 없어요. enum의 생성자는 언제나 private이라 컴파일 오류가 나요. 그래서 프로그램 전체에 `PAID` 객체는 **딱 하나**예요.'
      - p: '하나뿐이니 `==`로 비교해도 돼요. 세 비교의 결과를 예상해 보고 열어 보세요.'
      - ci:
          key: single
          label: 실제 출력 보기
          source: EnumTest.singleInstance
          code: singleRun
      - ul:
          - '**`valueOf`로 얻은 것도 같은 객체예요.** 문자열이나 래퍼와 달리 "값은 같은데 다른 객체"가 있을 수 없어서 `==`가 언제나 맞아요.'
          - '**null과의 `==`는 안전해요.** false를 줄 뿐이에요.'
          - '**`equals`는 null에서 예외가 나요.** 그래서 enum은 `==`로 비교해요. 값과 참조 레슨의 "null에 점을 찍으면" 그대로예요.'
      - muted: '객체가 하나뿐이라는 성질을 써서 싱글톤을 만들 수도 있어요. 싱글톤 패턴 레슨에서 다뤄요.'
      - more:
          summary: '더 알아보기: enum과 상속'
          body:
            - p: '모든 enum은 자동으로 `java.lang.Enum`을 상속해요. 클래스는 하나만 상속할 수 있으니(상속과 다형성 레슨) enum은 다른 클래스를 상속할 수 없어요. 인터페이스는 구현할 수 있어요.'
      - quiz:
          q: '`Grade g = null;`일 때 `g == Grade.VIP`와 `g.equals(Grade.VIP)`는?'
          options:
            - false와 false
            - false와 NullPointerException
            - NullPointerException과 NullPointerException
          answer: 2
          explain: '`==`는 점을 찍지 않으니 false예요. `g.equals(...)`는 null에 점을 찍어서 예외가 나요.'
      - next: '상수가 객체라면, 객체처럼 필드와 메서드를 가질 수도 있을까요?'
    recall: '상수 하나하나가 그 enum 타입의 객체이고, 클래스가 초기화될 때 상수마다 딱 하나만 만들어져요. 생성자가 private이라 더 만들 수 없어요. 그래서 enum은 `==`로 비교해도 안전하고, null일 수 있는 값과도 `==`로 비교하면 예외 없이 false예요.'
  - id: q3
    title: 값마다 다른 데이터와 동작은 어떻게 주나요?
    conclusion:
      lead: 'enum도 클래스라서 필드, 생성자, 메서드를 가질 수 있고, 상수를 선언할 때 생성자에 값을 넘겨요.'
      sub: '값에 따라 갈리는 규칙을 enum 안에 두면, 상수를 추가할 때 그 규칙도 함께 정하게 돼요.'
    says:
      - '코드 rich. 상수 뒤의 괄호가 생성자 호출이다. `PAID("결제 완료", true)`는 `label`과 `cancellable`을 가진 객체를 만든다. `OrderStatus.SHIPPED.canCancel()`은 false다'
      - '규칙이 enum 밖에 있을 때와 견준다. 서비스 곳곳에 `if (status == CREATED || status == PAID)`가 흩어져 있으면 상수를 추가할 때 그 조건들을 다 찾아 고쳐야 한다. 코드 rich에서는 새 상수를 쓰는 순간 생성자가 `cancellable`을 요구한다'
      - '동작 자체가 다르면 상수마다 메서드를 구현한다. enum에 추상 메서드를 두고 상수마다 본문을 쓴다. 상수는 사실 enum을 상속한 작은 클래스가 되고 J7의 오버라이딩으로 동작한다. 결제 수단마다 수수료 계산이 다른 `PayMethod`로 보인다'
      - '`switch`로 가를 수도 있다. 값을 돌려주는 switch 식(`return switch (status) { case PAID -> ...; }`)은 `default` 없이 쓰면 모든 상수를 다뤄야 컴파일된다. 상수를 추가하면 빠뜨린 switch 식이 컴파일 오류로 드러난다'
      - '예전 방식의 switch 문은 상수를 빠뜨려도 컴파일된다. `default`를 둔 switch 식도 빠뜨린 상수를 `default`가 받아서 오류가 나지 않는다'
    asks:
      - '본문의 예시: 코드 rich에서 `OrderStatus.SHIPPED.canCancel()`의 결과는 무엇인가 (false)'
      - '옮긴 상황: 상수가 `CREATED, PAID, SHIPPED, CANCELLED`인 enum에 대해 `String text = switch (status) { case CREATED -> "접수"; case PAID -> "결제"; case SHIPPED -> "배송"; };`을 쓰면 어떻게 되나. 조건: `default`가 없다 (컴파일 오류. `CANCELLED`를 다루지 않았다)'
    body:
      - p: 'enum은 클래스라서 **필드, 생성자, 메서드**를 가질 수 있어요. 상수 이름 뒤의 괄호가 생성자 호출이에요.'
      - code: rich
      - p: '`PAID("결제 완료", true)`는 화면에 보일 이름과 취소할 수 있는지를 가진 객체를 만들어요. 이제 "취소할 수 있나"를 상태에게 직접 물어요.'
      - ci:
          key: rich
          label: 실제 출력 보기
          source: EnumTest.richEnum
          code: richRun
      - p: '규칙이 enum 밖에 있으면 어떨까요? 서비스 여기저기에 `if (status == CREATED || status == PAID)`가 흩어져요. 상태를 하나 추가하면 그 조건들을 모두 찾아 고쳐야 하고, 하나라도 놓치면 버그예요. 코드 rich에서는 새 상수를 쓰는 순간 생성자가 `cancellable`을 요구해서 **정하지 않고 넘어갈 수가 없어요.**'
      - h3: 상수마다 동작이 다르면
      - p: '데이터가 아니라 **계산 방법** 자체가 다를 때는 enum에 추상 메서드를 두고 상수마다 본문을 써요. 결제 수단마다 수수료를 다르게 계산하는 예예요.'
      - code: payMethod
        notes:
          - mark: abstract
            as: code
            text: '모든 상수가 이 메서드를 구현해야 컴파일돼요. 상수를 추가하면 수수료 계산도 함께 써야 해요.'
      - p: '각 상수는 enum을 상속한 작은 익명 클래스가 되고, `fee`는 상속과 다형성 레슨의 오버라이딩으로 동작해요. 위 출력의 아래 두 줄이 이 코드의 결과예요.'
      - h3: switch로 가를 때
      - p: '값을 돌려주는 **switch 식**은 `default` 없이 쓰면 모든 상수를 다뤄야 컴파일돼요.'
      - code: switchExpr
      - ci:
          key: switch
          label: 세 방식을 컴파일한 결과 보기
          source: EnumTest.switchExhaustive
      - p: '상태를 추가하는 날 빠뜨린 switch 식이 컴파일 오류로 드러나요. 반대로 예전 방식의 switch 문(`case X:` 와 `break`)이나 `default`를 넣은 switch 식은 빠뜨려도 조용히 컴파일돼요. enum을 가를 때는 `default` 없는 switch 식을 써요.'
      - muted: '상수마다 다른 동작을 enum 바깥의 객체로 빼는 방법은 전략 패턴 레슨에서, switch의 타입 패턴 매칭은 자바 17과 21에서 달라진 것 레슨에서 다뤄요.'
      - quiz:
          q: '상수가 CREATED, PAID, SHIPPED, CANCELLED인 enum에 `default` 없이 `switch (status) { case CREATED -> "접수"; case PAID -> "결제"; case SHIPPED -> "배송"; }`를 값을 돌려주는 식으로 썼어요. 어떻게 될까요?'
          options:
            - 컴파일되고 CANCELLED면 null을 돌려준다
            - 컴파일 오류. CANCELLED를 다루지 않았다
            - 컴파일되고 CANCELLED면 예외가 난다
          answer: 2
          explain: '값을 돌려주는 switch 식은 모든 상수를 다뤄야 해요. 빠뜨리면 컴파일 오류예요.'
      - next: '상수에 데이터와 동작까지 생겼어요. 이 상수를 DB나 JSON에 내보낼 때는 무엇으로 내보내야 할까요?'
    recall: 'enum도 클래스라서 필드, 생성자, 메서드를 가질 수 있고, 상수를 선언할 때 생성자에 값을 넘겨요. 동작 자체가 다르면 추상 메서드를 두고 상수마다 구현해요. 규칙을 enum 안에 두면 상수를 추가할 때 그 규칙도 정해야 해서 빠뜨리지 않아요. switch로 가를 때는 `default` 없는 switch 식을 써서 빠뜨린 상수를 컴파일 오류로 잡아요.'
  - id: q4
    title: 'enum을 저장하거나 주고받을 때 name과 ordinal 가운데 무엇을 써야 하나요?'
    conclusion:
      lead: '`name()`을 써요. `ordinal()`은 선언된 순서의 번호라서 상수를 끼워 넣거나 순서를 바꾸면 달라져요.'
      sub: '번호로 저장해 둔 데이터는 그대로인데 그 번호가 가리키는 상수가 바뀌어서, 오류 없이 다른 값으로 읽혀요.'
    says:
      - '`name()`은 선언한 이름 문자열("SHIPPED")이고, `ordinal()`은 0부터 시작하는 선언 순서(2)다'
      - '코드 inserted. `PREPARING`을 끼워 넣으면 `SHIPPED.ordinal()`은 3이 되고 `values()[2]`는 `PREPARING`이다. 예전에 2로 저장한 "배송 중"이 "상품 준비 중"으로 읽힌다. 예측의 답을 밝힌다'
      - '예외가 나지 않는다는 점이 더 위험하다. 2는 여전히 유효한 번호라서 조용히 틀린 값이 된다'
      - '이름으로 저장했다면 "SHIPPED"는 상수를 어디에 끼워 넣어도 `SHIPPED`로 읽힌다. 이름은 상수의 이름을 바꿀 때만 깨지고, 그때는 `valueOf`가 예외를 던져 바로 드러난다'
      - '맨 뒤에만 추가하면 ordinal이 유지되지만, 그 약속을 코드가 지켜 주지 않는다. 그래서 프로그램 밖으로 나가는 값(DB, JSON, 메시지)에는 ordinal을 쓰지 않는다'
      - '더 알아보기: `compareTo`와 정렬은 ordinal 순서다. `toString()`은 기본으로 `name()`과 같지만 재정의할 수 있어서 저장에는 `name()`을 쓴다. enum을 키로 쓰는 맵과 집합은 `EnumMap`과 `EnumSet`이 있다'
    widget:
      kind: compare
      note: '두 칸에 "번호로 저장한 주문 테이블"과 "이름으로 저장한 주문 테이블"을 둔다. 칸마다 주문 세 건(상태 PAID, SHIPPED, CANCELLED)이 저장된 값과 읽은 결과로 보인다. "PREPARING을 PAID 뒤에 끼워 넣기" 버튼을 누르면 왼쪽 칸은 저장된 값은 그대로인 채 읽은 결과 두 건이 다른 상태로 바뀌어 문제로 표시되고, 오른쪽 칸은 그대로다. 결과 줄에 "잘못 읽힌 주문 수"를 보여 준다'
    asks:
      - '본문의 예시: 코드 inserted로 바꾼 뒤 `OrderStatus.CANCELLED.ordinal()`은 얼마인가. 조건: 바꾸기 전에는 3이었다 (4)'
      - '옮긴 상황: `enum Grade { BASIC, VIP }`의 `ordinal()`을 저장하고 있었다. 선언을 `enum Grade { VIP, BASIC }`으로 순서만 바꿨다. 예전에 0으로 저장한 회원을 `Grade.values()[0]`으로 읽으면 무엇이 나오나 (VIP. 저장할 때는 BASIC이었다)'
      - '실무 구역: 엔티티의 `private OrderStatus status;` 필드에 `@Enumerated`를 붙이지 않았다. 상태가 `SHIPPED`인 주문을 저장하면 `status` 열에 무엇이 들어가나. 조건: enum은 코드 basic이다 (숫자 2. 기본값이 ORDINAL이다)'
    body:
      - p: '상수를 프로그램 밖(DB, JSON, 메시지)으로 내보낼 때 쓸 수 있는 값이 둘 있어요.'
      - ul:
          - '**`name()`:** 선언한 이름 문자열이에요. `SHIPPED.name()`은 "SHIPPED"예요.'
          - '**`ordinal()`:** 0부터 시작하는 선언 순서예요. `SHIPPED.ordinal()`은 2예요.'
      - p: '숫자가 더 작고 빨라 보여요. 그런데 처음 예측한 일이 생겨요. 답은 **PREPARING**이에요. {{predict-result}}'
      - ci:
          key: ordinal
          label: 실제 출력 보기
          source: EnumTest.ordinalShifts
          code: ordinalRun
      - p: '`ordinal`은 **선언된 순서**라서 상수를 중간에 끼워 넣으면 뒤의 상수들이 하나씩 밀려요. 예전에 2로 저장한 "배송 중"은 이제 2번 자리의 `PREPARING`으로 읽혀요. 도입부의 사고가 이거예요.'
      - p: '버튼을 눌러 두 방식으로 저장한 테이블이 어떻게 되는지 보세요.'
      - widget:
          kind: compare
          layout: [buttons, sides, verdict]
          run: {label: PAID 뒤에 PREPARING 끼워 넣기}
          sides:
            - label: 번호로 저장 (ordinal)
              items:
                - {name: 주문 1, note: '저장할 때 PAID, 열의 값 1'}
                - {name: 주문 2, note: '저장할 때 SHIPPED, 열의 값 2'}
                - {name: 주문 3, note: '저장할 때 CANCELLED, 열의 값 3'}
            - label: 이름으로 저장 (name)
              items:
                - {name: 주문 1, note: '저장할 때 PAID, 열의 값 PAID'}
                - {name: 주문 2, note: '저장할 때 SHIPPED, 열의 값 SHIPPED'}
                - {name: 주문 3, note: '저장할 때 CANCELLED, 열의 값 CANCELLED'}
          initial:
            sides:
              - result: [{k: 잘못 읽힌 주문, v: '0'}]
              - result: [{k: 잘못 읽힌 주문, v: '0'}]
          scenes:
            run:
              sides:
                - marks:
                    - {name: 주문 2, tag: 'PREPARING으로 읽힘', mark: bad}
                    - {name: 주문 3, tag: 'SHIPPED로 읽힘', mark: bad}
                  result: [{k: 잘못 읽힌 주문, v: '2', mark: bad}]
                - result: [{k: 잘못 읽힌 주문, v: '0'}]
              verdict: 'DB의 값은 그대로인데 번호가 가리키는 상수가 바뀌었어요. 예외도 나지 않아요. 이름으로 저장한 쪽은 끼워 넣은 자리와 상관없이 그대로예요.'
      - ul:
          - '**예외가 나지 않아서 더 위험해요.** 2는 여전히 유효한 번호라 조용히 틀린 상태가 돼요. 취소된 주문이 배송 중으로 보이기도 해요.'
          - '**이름은 끼워 넣어도 그대로예요.** "SHIPPED"는 어디에 상수를 더해도 `SHIPPED`로 읽혀요. 이름이 깨지는 것은 상수의 이름을 바꿀 때뿐이고, 그때는 `valueOf`가 예외를 던져 바로 드러나요.'
          - '**"맨 뒤에만 추가하면 된다"는 약속은 코드가 지켜 주지 않아요.** 누군가 보기 좋게 순서를 정리하는 순간 깨져요.'
      - p: '그래서 프로그램 밖으로 나가는 값에는 `ordinal`을 쓰지 않고 `name`을 써요.'
      - more:
          summary: '더 알아보기: compareTo, toString, EnumMap'
          body:
            - ul:
                - '`compareTo`와 정렬은 ordinal 순서를 따라요. 상태의 진행 순서로 정렬할 때 쓸 수 있지만, 그 순서도 끼워 넣기에 따라 바뀌어요.'
                - '`toString()`은 기본으로 `name()`과 같지만 재정의할 수 있어요. 저장할 때는 재정의되지 않는 `name()`을 써요.'
                - 'enum을 키로 쓰는 맵과 집합은 `EnumMap`, `EnumSet`이 있어요. 언제 쓰는지는 컬렉션 고르기 레슨에서 다뤄요.'
      - quiz:
          q: '`enum Grade { BASIC, VIP }`의 `ordinal()`을 저장해 왔어요. 선언을 `enum Grade { VIP, BASIC }`으로 바꿨어요. 예전에 0으로 저장한 회원을 `Grade.values()[0]`으로 읽으면?'
          options:
            - BASIC
            - VIP
            - 예외
          answer: 2
          explain: '0번 자리에 이제 VIP가 있어요. 저장할 때는 BASIC이었는데 VIP로 읽혀요.'
    recall: '`name()`을 써요. `ordinal()`은 선언된 순서의 번호라서 상수를 끼워 넣거나 순서를 바꾸면 달라지고, 번호로 저장해 둔 데이터가 오류 없이 다른 상수로 읽혀요. 이름으로 저장하면 상수를 어디에 끼워 넣어도 그대로이고, 이름을 바꿀 때만 `valueOf`가 예외로 알려 줘요.'
practice:
  title: JPA와 스프링 MVC에서는 이렇게 써요
  says:
    - 'JPA 엔티티에서는 `@Enumerated(EnumType.STRING) private OrderStatus status;`로 쓴다. 열에 "SHIPPED"라는 이름이 저장된다 (`@DataJpaTest`와 PostgreSQL 컨테이너로 저장한 뒤 열의 값을 SQL로 읽는 테스트)'
    - '흔한 실수: `@Enumerated`를 붙이지 않거나 `EnumType.ORDINAL`로 둔다. 기본값이 ORDINAL이라 숫자가 저장된다. 그 뒤 상수를 중간에 추가하면 질문 4의 일이 DB에서 일어난다. 고친 코드: `EnumType.STRING`. 이미 숫자로 쌓인 데이터는 열의 값을 옮기는 작업이 따로 필요하다는 것만 말한다 (같은 테이블을 상수가 넷인 enum으로 저장하고, 상수를 끼워 넣은 enum으로 읽어 다른 상태가 나오는 것을 확인하는 테스트. 기본값이 ORDINAL이라는 것은 자카르타 퍼시스턴스 명세 근거)'
    - 'JSON. 스프링 MVC(Jackson)는 enum을 이름 문자열로 주고받는다. 응답은 `"status": "PAID"`가 되고 요청의 `"PAID"`는 상수로 바뀐다. 없는 이름이 오면 역직렬화가 실패해 400이 나간다. `@RequestParam OrderStatus status`도 이름으로 변환한다 (Jackson `ObjectMapper`로 양쪽을 확인하고, 컨트롤러 하나를 띄워 없는 값에 대한 상태 코드를 확인하는 테스트)'
    - '규칙을 enum 안에 둔다. 서비스의 `if (status == CREATED || status == PAID)` 대신 `order.getStatus().canCancel()`. 질문 3의 코드 rich를 엔티티 메서드 `cancel()`에서 쓰는 모습을 보여 준다'
    - '더 알아보기: DB에 `"SHIPPED"` 대신 짧은 코드(`"S"`)를 저장해야 하면 `AttributeConverter`로 enum과 코드를 바꿔 준다. 이름을 바꿔도 저장된 값이 깨지지 않는다 (자카르타 퍼시스턴스 명세 근거)'
  body:
    - p: 'enum은 엔티티의 필드, 요청 파라미터, JSON 본문에 그대로 써요. DB에 저장하는 것은 PostgreSQL 컨테이너로, 요청 변환은 컨트롤러를 띄워 확인했어요.'
    - h3: '흔한 실수: @Enumerated를 빼먹음'
    - code: entityBad
    - p: '아무것도 붙이지 않으면 JPA는 **ordinal**로 저장해요. 기본값이 `EnumType.ORDINAL`이기 때문이에요.'
    - ci:
        key: jpa-stored
        label: PostgreSQL에 저장된 실제 값 보기
        source: EnumJpaTest.storedValue
        code: jpaStoredRun
    - p: '숫자 2가 저장됐어요. 이 상태로 상수를 중간에 추가해서 배포하면 질문 4의 일이 DB에서 그대로 일어나요. 같은 테이블을, 상수를 끼워 넣은 enum으로 읽어 봤어요.'
    - ci:
        key: jpa-shift
        label: 끼워 넣은 뒤에 읽은 실제 값 보기
        source: EnumJpaTest.insertedConstantChangesMeaning
        code: jpaShiftRun
    - p: '`@Enumerated(EnumType.STRING)`을 붙이면 이름이 저장돼요. 엔티티의 enum 필드에는 언제나 붙여요.'
    - code: entityFixed
      notes:
        - mark: '@Enumerated(EnumType.STRING)'
          as: anno
          text: '"SHIPPED"라는 이름을 저장해요. 상수를 어디에 추가해도 저장된 값의 뜻이 바뀌지 않아요.'
    - muted: '이미 숫자로 쌓인 데이터가 있다면 붙이기만 해서는 안 되고, 열의 값을 이름으로 옮기는 작업이 따로 필요해요. 근거: [@Enumerated 문서](link:enumerated).'
    - h3: 요청과 응답에서는 이름으로
    - p: '스프링 MVC는 enum을 **이름**으로 주고받아요. 요청 파라미터와 JSON 본문에 그대로 써요.'
    - code: controller
    - ci:
        key: spring
        label: 네 요청의 실제 응답 보기
        source: EnumTest.springConvertsByName
        code: springRun
    - p: '"PAID", "SHIPPED"는 상수로 바뀌고, 응답 JSON에도 `"status":"PAID"`처럼 이름으로 나가요. 없는 이름 "PIAD"는 컨트롤러에 닿기도 전에 400으로 막혀요. 문자열로 받았다면 직접 검사해야 했을 일이에요. 400 응답의 본문을 어떤 형식으로 줄지는 예외 처리와 검증 레슨에서 다뤄요.'
    - h3: 상태에 따른 규칙은 enum에
    - p: '서비스 코드에 이런 조건이 흩어져 있으면, 상태를 추가할 때마다 모두 찾아 고쳐야 해요.'
    - code: ruleOutside
    - p: '질문 3의 `canCancel()`을 엔티티 메서드에서 써요. 규칙이 enum 한곳에 있어요.'
    - code: ruleInside
      notes:
        - mark: status.canCancel()
          as: code
          text: '"이 상태에서 취소할 수 있나"를 상태에게 물어요. 새 상태를 추가하면 생성자가 그 값을 요구해요.'
    - more:
        summary: '더 알아보기: DB에 이름과 다른 값을 저장하려면'
        body:
          - p: '"SHIPPED" 대신 "S" 같은 짧은 코드를 저장해야 하는 테이블도 있어요. 이때는 `AttributeConverter`를 만들어 enum과 코드를 서로 바꿔 줘요. 상수의 이름을 바꿔도 저장된 코드는 그대로라 더 안전해요. 근거: [AttributeConverter 문서](link:converter).'
interview:
  question: enum을 DB에 저장할 때 무엇을 조심해야 하나요?
  model:
    - label: 정의
      text: enum은 정해진 값들의 목록을 하나의 타입으로 만든 것이고, 상수 하나하나는 그 타입의 객체로 상수마다 하나만 만들어집니다. 그래서 정해진 값만 들어가게 컴파일러가 막아 주고, ==로 비교해도 안전합니다.
    - label: 원리
      text: enum은 클래스라서 필드, 생성자, 메서드를 가질 수 있고 상수마다 다른 구현도 줄 수 있습니다. 상수는 name()이라는 이름과 ordinal()이라는 선언 순서 번호를 가집니다.
    - label: 주의할 점
      text: ordinal은 선언 순서라서 상수를 중간에 끼워 넣으면 번호가 밀리고, 번호로 저장한 데이터가 예외 없이 다른 상수로 읽힙니다. JPA의 @Enumerated 기본값이 ORDINAL이므로 EnumType.STRING을 명시합니다. switch 식은 default 없이 써서 빠뜨린 상수를 컴파일 오류로 잡습니다.
    - label: 경험
      text: '(내 프로젝트로 채우기) 예: 주문 상태를 문자열 상수로 비교하던 코드를 enum으로 바꾸고, 엔티티에는 @Enumerated(EnumType.STRING)을 붙여 상태를 추가해도 기존 데이터가 그대로 읽히게 했습니다.'
verified: 이 레슨의 출력은 짐작이 아니라 자바 21에서 코드를 돌려 받은 값이에요. DB에 저장된 값은 PostgreSQL 16 컨테이너로, 요청 변환은 스프링 부트 3.5 서버를 띄워 확인했어요. 코드가 바뀔 때마다 테스트([EnumTest](link:test), [EnumJpaTest](link:jpaTest))가 다시 돌아요.
footer: '근거: enum 타입과 상수별 본문은 자바 언어 명세 8.9([링크](link:jlsEnum)), name과 ordinal은 Enum API 문서([링크](link:enumApi)), @Enumerated의 기본값 ORDINAL은 자카르타 퍼시스턴스 API 문서. 결과는 OpenJDK 21, 하이버네이트 6.6, PostgreSQL 16에서 테스트로 확인했어요. 오류는 [GitHub 이슈](https://github.com/wanja727/dev-lessons/issues)로 알려 주세요.'
claims:
  - claim: '없는 이름으로 `valueOf`를 부르면 `IllegalArgumentException`이 난다. 대소문자가 달라도 그렇다'
    how: '`OrderStatus.valueOf("paid")`를 돌린다'
    test: EnumTest.valueOfUnknown
  - claim: '`int`로 받는 메서드에 7은 컴파일되고, enum으로 받는 메서드에 7은 컴파일되지 않는다'
    how: '`JavaSource`로 두 소스를 컴파일한다'
    test: EnumTest.typeSafety
  - claim: '`valueOf`로 얻은 상수와 직접 쓴 상수는 `==`가 true다. null과의 `==`는 false이고 null의 `equals`는 예외다'
    how: '그대로 돌린다'
    test: EnumTest.singleInstance
  - claim: 'enum은 `new`로 만들 수 없다'
    how: '`JavaSource`로 컴파일한다'
    test: EnumTest.cannotInstantiate
  - claim: '상수마다 필드를 줄 수 있고, 추상 메서드를 상수마다 구현하면 상수에 따라 다른 구현이 실행된다'
    how: '코드 rich와 `PayMethod`를 돌린다'
    test: EnumTest.richEnum
  - claim: '`default` 없는 switch 식이 상수를 빠뜨리면 컴파일되지 않고, `default`가 있는 switch 식과 예전 방식의 switch 문은 컴파일된다'
    how: '`JavaSource`로 세 소스를 컴파일한다'
    test: EnumTest.switchExhaustive
  - claim: '상수를 끼워 넣으면 뒤 상수의 `ordinal()`이 1씩 늘고, 예전 번호로 `values()`를 읽으면 다른 상수가 나온다'
    how: '상수가 넷인 enum과 다섯인 enum을 따로 두고 번호 2를 양쪽에서 읽는다'
    test: EnumTest.ordinalShifts
  - claim: 'Jackson은 enum을 이름으로 쓰고 읽으며, 없는 이름은 예외가 된다 (스프링 부트 3.5의 Jackson)'
    how: '`ObjectMapper`로 쓰고 읽는다'
    test: EnumTest.jacksonUsesName
  - claim: '스프링 MVC는 요청 파라미터와 JSON의 글자를 enum으로 바꾸고, 없는 이름이면 400으로 답한다 (스프링 부트 3.5)'
    how: '컨트롤러 하나를 띄워 네 요청을 보낸다'
    test: EnumTest.springConvertsByName
  - claim: '`@Enumerated`가 없으면 열에 숫자가, `EnumType.STRING`이면 이름이 저장된다 (하이버네이트 6.6, PostgreSQL 16)'
    how: '`@DataJpaTest`로 저장하고 `JdbcTemplate`으로 열의 값을 읽는다'
    test: EnumJpaTest.storedValue
  - claim: '숫자로 저장한 행을 상수를 끼워 넣은 enum으로 읽으면 다른 상태가 된다'
    how: '같은 테이블을 가리키는 엔티티를 enum만 다르게 둘 만들어 한쪽으로 저장하고 다른 쪽으로 읽는다'
    test: EnumJpaTest.insertedConstantChangesMeaning
sources:
  - 'enum 타입, 생성자, 상수별 본문: 자바 언어 명세 8.9 https://docs.oracle.com/javase/specs/jls/se21/html/jls-8.html#jls-8.9'
  - '`ordinal`은 직접 쓰지 말라는 것, `name`, `compareTo`: `Enum` API 문서 https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/lang/Enum.html'
  - 'switch 식이 모든 값을 다뤄야 하는 것: 자바 언어 명세 15.28.1 https://docs.oracle.com/javase/specs/jls/se21/html/jls-15.html#jls-15.28.1'
  - '`@Enumerated`의 기본값 ORDINAL: 자카르타 퍼시스턴스 API 문서 https://jakarta.ee/specifications/persistence/3.1/apidocs/jakarta.persistence/jakarta/persistence/Enumerated.html'
  - '`AttributeConverter`: 자카르타 퍼시스턴스 API 문서 https://jakarta.ee/specifications/persistence/3.1/apidocs/jakarta.persistence/jakarta/persistence/AttributeConverter.html'
  - '하이버네이트의 enum 매핑: 사용자 가이드 https://docs.hibernate.org/orm/6.6/userguide/html_single/#basic-enums'
