codes:
  constants: |-
    public static final int CREATED = 0;
    public static final int PAID = 1;

    void changeStatus(long orderId, int status)

    changeStatus(1L, 7);
  basic: |-
    enum OrderStatus {
      CREATED, PAID, SHIPPED, CANCELLED
    }

    void changeStatus(long orderId,
        OrderStatus status)
  rich: |-
    enum OrderStatus {
      CREATED("주문 접수", true),
      PAID("결제 완료", true),
      SHIPPED("배송 중", false),
      CANCELLED("취소", false);

      private final String label;
      private final boolean cancellable;

      OrderStatus(String label,
          boolean cancellable) {
        this.label = label;
        this.cancellable = cancellable;
      }

      boolean canCancel() { return cancellable; }
    }
  inserted: |-
    enum OrderStatus {
      CREATED, PAID, [[PREPARING]],
      SHIPPED, CANCELLED
    }
predict:
  text: '코드 basic의 `OrderStatus`에서 `SHIPPED.ordinal()`은 2예요. 주문 테이블에는 배송 중인 주문의 상태가 이 숫자 2로 저장되어 있어요. 이제 코드 inserted처럼 `PAID`와 `SHIPPED` 사이에 `PREPARING`을 끼워 넣고 다시 실행했어요. 저장되어 있던 숫자 2를 `OrderStatus.values()[2]`로 읽으면 무엇이 나올까요? 보기: SHIPPED, PREPARING, 예외.'
  answer: 'PREPARING. `ordinal`은 선언된 순서의 번호라서 상수를 끼워 넣으면 뒤의 상수들의 번호가 하나씩 밀린다. 저장된 2는 그대로인데 2가 뜻하는 상수가 바뀌었다. 질문 4에서 밝힌다.'
questions:
  - id: q1
    title: '정해진 값들을 int나 String 상수 대신 enum으로 만들면 무엇이 좋은가요?'
    conclusion:
      lead: '정해진 값 말고는 들어갈 수 없게 컴파일러가 막아 줘요.'
      sub: '`int`나 `String`으로 받으면 7이나 "PIAD" 같은 값도 컴파일을 통과하고, 실행한 뒤에야 문제가 드러나요.'
    says:
      - '코드 constants. 상태를 `int`로 받으면 `changeStatus(1L, 7)`이 컴파일된다. 7은 어떤 상태도 아니다. 주문 번호와 상태의 자리를 바꿔 넘겨도 둘 다 숫자라 컴파일된다'
      - '`String`도 같다. `"PIAD"`라는 오타가 컴파일된다. 비교할 때 `==`를 쓰는 실수(J4)도 따라온다'
      - '코드 basic. 매개변수 타입이 `OrderStatus`면 넘길 수 있는 것은 네 상수와 null뿐이다. `changeStatus(1L, 7)`은 컴파일 오류다'
      - '`OrderStatus.values()`는 모든 상수를 선언 순서대로 담은 배열을 준다. 선택지를 화면에 내려줄 때 쓴다'
      - '`OrderStatus.valueOf("PAID")`는 이름으로 상수를 찾는다. 없는 이름이면 `IllegalArgumentException`이다. 대소문자도 맞아야 한다'
    asks:
      - '본문의 예시: 코드 basic의 `changeStatus`에 `changeStatus(1L, 7)`과 `changeStatus(1L, OrderStatus.PAID)`를 쓰면 각각 어떻게 되나 (첫째는 컴파일 오류, 둘째는 컴파일된다)'
      - '옮긴 상황: `enum Grade { BASIC, VIP }`에서 `Grade.valueOf("vip")`를 실행하면 어떻게 되나 (`IllegalArgumentException`. 이름이 정확히 같은 상수가 없다)'
  - id: q2
    title: enum 상수는 실제로 무엇인가요?
    conclusion:
      lead: '상수 하나하나가 그 enum 타입의 객체이고, 상수마다 딱 하나만 만들어져요.'
      sub: '객체가 하나뿐이라서 enum은 `==`로 비교해도 안전해요.'
    says:
      - '`OrderStatus.PAID`는 숫자나 문자열이 아니라 `OrderStatus` 클래스의 객체를 가리키는 `public static final` 필드다. enum 클래스가 초기화될 때(J5) 상수마다 객체가 하나씩 만들어진다'
      - '바깥에서 `new OrderStatus()`는 컴파일 오류다. enum의 생성자는 언제나 private이다. 그래서 프로그램에 `PAID` 객체는 하나뿐이다'
      - '하나뿐이므로 `==`로 비교한다. `OrderStatus.valueOf("PAID") == OrderStatus.PAID`는 true다. `String`이나 `Long`과 달리 "값은 같은데 다른 객체"가 있을 수 없다'
      - '`status == OrderStatus.PAID`는 `status`가 null이어도 false를 줄 뿐이다. `status.equals(OrderStatus.PAID)`는 `NullPointerException`이다. 그래서 enum은 `==`로 비교한다'
      - '객체가 하나뿐이라는 성질로 싱글톤을 만들 수도 있다. O11에서 다룬다'
      - '더 알아보기: 모든 enum은 `java.lang.Enum`을 상속한다. 그래서 다른 클래스를 상속할 수 없다. 인터페이스는 구현할 수 있다'
    asks:
      - '본문의 예시: `OrderStatus a = OrderStatus.valueOf("PAID"); OrderStatus b = OrderStatus.PAID;`에서 `a == b`의 결과는 무엇인가 (true)'
      - '옮긴 상황: `Grade g = null;`일 때 `g == Grade.VIP`와 `g.equals(Grade.VIP)`를 각각 실행하면 어떻게 되나 (false, `NullPointerException`)'
  - id: q3
    title: 값마다 다른 데이터와 동작은 어떻게 주나요?
    conclusion:
      lead: 'enum도 클래스라서 필드, 생성자, 메서드를 가질 수 있고, 상수를 선언할 때 생성자에 값을 넘겨요.'
      sub: '값에 따라 갈리는 규칙을 enum 안에 두면, 상수를 추가할 때 그 규칙도 함께 정하게 돼요.'
    says:
      - '코드 rich. 상수 뒤의 괄호가 생성자 호출이다. `PAID("결제 완료", true)`는 `label`과 `cancellable`을 가진 객체를 만든다. `OrderStatus.SHIPPED.canCancel()`은 false다'
      - '규칙이 enum 밖에 있을 때와 견준다. 서비스 곳곳에 `if (status == CREATED || status == PAID)`가 흩어져 있으면 상수를 추가할 때 그 조건들을 다 찾아 고쳐야 한다. 코드 rich에서는 새 상수를 쓰는 순간 생성자가 `cancellable`을 요구한다'
      - '동작 자체가 다르면 상수마다 메서드를 구현한다. enum에 추상 메서드를 두고 상수마다 본문을 쓴다. 상수는 사실 enum을 상속한 작은 클래스가 되고 J7의 오버라이딩으로 동작한다. 결제 수단마다 수수료 계산이 다른 `PayMethod`로 보인다'
      - '`switch`로 가를 수도 있다. 값을 돌려주는 switch 식(`return switch (status) { case PAID -> ...; }`)은 `default` 없이 쓰면 모든 상수를 다뤄야 컴파일된다. 상수를 추가하면 빠뜨린 switch 식이 컴파일 오류로 드러난다'
      - '예전 방식의 switch 문은 상수를 빠뜨려도 컴파일된다. `default`를 둔 switch 식도 빠뜨린 상수를 `default`가 받아서 오류가 나지 않는다'
    asks:
      - '본문의 예시: 코드 rich에서 `OrderStatus.SHIPPED.canCancel()`의 결과는 무엇인가 (false)'
      - '옮긴 상황: 상수가 `CREATED, PAID, SHIPPED, CANCELLED`인 enum에 대해 `String text = switch (status) { case CREATED -> "접수"; case PAID -> "결제"; case SHIPPED -> "배송"; };`을 쓰면 어떻게 되나. 조건: `default`가 없다 (컴파일 오류. `CANCELLED`를 다루지 않았다)'
  - id: q4
    title: 'enum을 저장하거나 주고받을 때 name과 ordinal 가운데 무엇을 써야 하나요?'
    conclusion:
      lead: '`name()`을 써요. `ordinal()`은 선언된 순서의 번호라서 상수를 끼워 넣거나 순서를 바꾸면 달라져요.'
      sub: '번호로 저장해 둔 데이터는 그대로인데 그 번호가 가리키는 상수가 바뀌어서, 오류 없이 다른 값으로 읽혀요.'
    says:
      - '`name()`은 선언한 이름 문자열("SHIPPED")이고, `ordinal()`은 0부터 시작하는 선언 순서(2)다'
      - '코드 inserted. `PREPARING`을 끼워 넣으면 `SHIPPED.ordinal()`은 3이 되고 `values()[2]`는 `PREPARING`이다. 예전에 2로 저장한 "배송 중"이 "상품 준비 중"으로 읽힌다. 예측의 답을 밝힌다'
      - '예외가 나지 않는다는 점이 더 위험하다. 2는 여전히 유효한 번호라서 조용히 틀린 값이 된다'
      - '이름으로 저장했다면 "SHIPPED"는 상수를 어디에 끼워 넣어도 `SHIPPED`로 읽힌다. 이름은 상수의 이름을 바꿀 때만 깨지고, 그때는 `valueOf`가 예외를 던져 바로 드러난다'
      - '맨 뒤에만 추가하면 ordinal이 유지되지만, 그 약속을 코드가 지켜 주지 않는다. 그래서 프로그램 밖으로 나가는 값(DB, JSON, 메시지)에는 ordinal을 쓰지 않는다'
      - '더 알아보기: `compareTo`와 정렬은 ordinal 순서다. `toString()`은 기본으로 `name()`과 같지만 재정의할 수 있어서 저장에는 `name()`을 쓴다. enum을 키로 쓰는 맵과 집합은 `EnumMap`과 `EnumSet`이 있다'
    widget:
      kind: compare
      note: '두 칸에 "번호로 저장한 주문 테이블"과 "이름으로 저장한 주문 테이블"을 둔다. 칸마다 주문 세 건(상태 PAID, SHIPPED, CANCELLED)이 저장된 값과 읽은 결과로 보인다. "PREPARING을 PAID 뒤에 끼워 넣기" 버튼을 누르면 왼쪽 칸은 저장된 값은 그대로인 채 읽은 결과 두 건이 다른 상태로 바뀌어 문제로 표시되고, 오른쪽 칸은 그대로다. 결과 줄에 "잘못 읽힌 주문 수"를 보여 준다'
    asks:
      - '본문의 예시: 코드 inserted로 바꾼 뒤 `OrderStatus.CANCELLED.ordinal()`은 얼마인가. 조건: 바꾸기 전에는 3이었다 (4)'
      - '옮긴 상황: `enum Grade { BASIC, VIP }`의 `ordinal()`을 저장하고 있었다. 선언을 `enum Grade { VIP, BASIC }`으로 순서만 바꿨다. 예전에 0으로 저장한 회원을 `Grade.values()[0]`으로 읽으면 무엇이 나오나 (VIP. 저장할 때는 BASIC이었다)'
      - '실무 구역: 엔티티의 `private OrderStatus status;` 필드에 `@Enumerated`를 붙이지 않았다. 상태가 `SHIPPED`인 주문을 저장하면 `status` 열에 무엇이 들어가나. 조건: enum은 코드 basic이다 (숫자 2. 기본값이 ORDINAL이다)'
practice:
  says:
    - 'JPA 엔티티에서는 `@Enumerated(EnumType.STRING) private OrderStatus status;`로 쓴다. 열에 "SHIPPED"라는 이름이 저장된다 (`@DataJpaTest`와 PostgreSQL 컨테이너로 저장한 뒤 열의 값을 SQL로 읽는 테스트)'
    - '흔한 실수: `@Enumerated`를 붙이지 않거나 `EnumType.ORDINAL`로 둔다. 기본값이 ORDINAL이라 숫자가 저장된다. 그 뒤 상수를 중간에 추가하면 질문 4의 일이 DB에서 일어난다. 고친 코드: `EnumType.STRING`. 이미 숫자로 쌓인 데이터는 열의 값을 옮기는 작업이 따로 필요하다는 것만 말한다 (같은 테이블을 상수가 넷인 enum으로 저장하고, 상수를 끼워 넣은 enum으로 읽어 다른 상태가 나오는 것을 확인하는 테스트. 기본값이 ORDINAL이라는 것은 자카르타 퍼시스턴스 명세 근거)'
    - 'JSON. 스프링 MVC(Jackson)는 enum을 이름 문자열로 주고받는다. 응답은 `"status": "PAID"`가 되고 요청의 `"PAID"`는 상수로 바뀐다. 없는 이름이 오면 역직렬화가 실패해 400이 나간다. `@RequestParam OrderStatus status`도 이름으로 변환한다 (Jackson `ObjectMapper`로 양쪽을 확인하고, 컨트롤러 하나를 띄워 없는 값에 대한 상태 코드를 확인하는 테스트)'
    - '규칙을 enum 안에 둔다. 서비스의 `if (status == CREATED || status == PAID)` 대신 `order.getStatus().canCancel()`. 질문 3의 코드 rich를 엔티티 메서드 `cancel()`에서 쓰는 모습을 보여 준다'
    - '더 알아보기: DB에 `"SHIPPED"` 대신 짧은 코드(`"S"`)를 저장해야 하면 `AttributeConverter`로 enum과 코드를 바꿔 준다. 이름을 바꿔도 저장된 값이 깨지지 않는다 (자카르타 퍼시스턴스 명세 근거)'
claims:
  - claim: '없는 이름으로 `valueOf`를 부르면 `IllegalArgumentException`이 난다. 대소문자가 달라도 그렇다'
    how: '`OrderStatus.valueOf("paid")`를 돌린다'
  - claim: '`valueOf`로 얻은 상수와 직접 쓴 상수는 `==`가 true다'
    how: '그대로 돌린다'
  - claim: '상수를 끼워 넣으면 뒤 상수의 `ordinal()`이 1씩 늘고, 예전 번호로 `values()`를 읽으면 다른 상수가 나온다'
    how: '상수가 넷인 enum과 다섯인 enum을 따로 두고 번호 2를 양쪽에서 읽는다'
  - claim: '`default` 없는 switch 식이 상수를 빠뜨리면 컴파일되지 않는다'
    how: '`javax.tools.JavaCompiler`로 소스를 컴파일해 오류가 있는지 본다'
  - claim: '추상 메서드를 상수마다 구현하면 상수에 따라 다른 구현이 실행된다'
    how: '`PayMethod` 예제의 수수료 계산을 상수마다 불러 값을 본다'
  - claim: '`@Enumerated`가 없으면 열에 숫자가, `EnumType.STRING`이면 이름이 저장된다 (하이버네이트 6.6, PostgreSQL)'
    how: '`@DataJpaTest`로 저장하고 `JdbcTemplate`으로 열의 값을 읽는다'
  - claim: '숫자로 저장한 행을 상수를 끼워 넣은 enum으로 읽으면 다른 상태가 된다'
    how: '같은 테이블을 가리키는 엔티티를 enum만 다르게 둘 만들어 한쪽으로 저장하고 다른 쪽으로 읽는다'
  - claim: 'Jackson은 enum을 이름으로 쓰고 읽으며, 없는 이름은 예외가 된다. 스프링 MVC는 그 요청에 400으로 답한다 (스프링 부트 3.5)'
    how: '`ObjectMapper`로 쓰고 읽는다. 컨트롤러 하나를 띄워 없는 값을 보낸 요청의 상태 코드를 본다'
sources:
  - 'enum 타입, 생성자, 상수별 본문: 자바 언어 명세 8.9 https://docs.oracle.com/javase/specs/jls/se21/html/jls-8.html#jls-8.9'
  - '`ordinal`은 직접 쓰지 말라는 것, `name`, `compareTo`: `Enum` API 문서 https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/lang/Enum.html'
  - 'switch 식이 모든 값을 다뤄야 하는 것: 자바 언어 명세 15.28.1 https://docs.oracle.com/javase/specs/jls/se21/html/jls-15.html#jls-15.28.1'
  - '`@Enumerated`의 기본값 ORDINAL: 자카르타 퍼시스턴스 API 문서 https://jakarta.ee/specifications/persistence/3.1/apidocs/jakarta.persistence/jakarta/persistence/enumerated'
  - '`AttributeConverter`: 자카르타 퍼시스턴스 API 문서 https://jakarta.ee/specifications/persistence/3.1/apidocs/jakarta.persistence/jakarta/persistence/attributeconverter'
  - '하이버네이트의 enum 매핑: 사용자 가이드 https://docs.hibernate.org/orm/6.6/userguide/html_single/#basic-enums'
