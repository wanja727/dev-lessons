# enum
# 자료 파일의 칸은 docs/lesson-data-format.md에 있다. 문제는 content/questions/enum.yaml에 있다.
title: enum
description: 정해진 값들을 enum으로 만들면 무엇이 좋은지, enum 상수는 실제로 무엇인지, 값마다 다른 데이터와 동작을 어떻게 주는지, 저장할 때 name과 ordinal 가운데 무엇을 써야 하는지. 네 가지 질문에 스스로 답할 수 있게, 주문 상태로 배우는 대화형 레슨.
unit: 자바 언어
minutes: 20
roadmap: J8
type: 자바 실행
prerequisites:
  - {slug: inheritance-polymorphism, title: 상속과 다형성}
assume: '자바 21. `==`는 같은 객체인지를 본다는 것(값과 참조 레슨), 오버라이딩한 메서드는 실제 객체의 것이 실행된다는 것(상속과 다형성 레슨).'
example: '주문 상태 `OrderStatus`. `CREATED`, `PAID`, `SHIPPED`, `CANCELLED` 네 가지예요. 상태마다 취소할 수 있는지를 묻고, 나중에 `PAID`와 `SHIPPED` 사이에 `PREPARING`을 끼워 넣어 봐요. 실무 구역에서는 이 enum을 JPA 엔티티의 필드와 요청 DTO에 써요.'
intro:
  - '주문 상태에 "상품 준비 중"을 하나 추가해서 배포했더니, 어제까지 "배송 중"이던 주문들이 전부 "상품 준비 중"으로 보여요. 코드에는 상태를 한 줄 추가했을 뿐이고 DB는 건드리지 않았어요.'
  - '주문 상태, 회원 등급, 결제 수단처럼 정해진 몇 가지 값은 서버 코드 어디에나 있어요. 스프링 개발자는 이것을 enum으로 만들고, DB에 어떻게 저장할지, JSON으로 어떻게 주고받을지, 값마다 다른 규칙을 어디에 둘지를 정해요.'
  - '이 레슨에서는 enum 상수가 실제로 무엇인지 코드를 돌려 확인하고, 상수의 순서를 바꾸면 무엇이 달라지는지를 본 뒤 JPA와 JSON으로 옮겨요.'
covers:
  - topic: 'int나 String 상수 대신 enum을 쓰는 이유: 정해진 값만 들어가게 컴파일러가 막아 준다'
    where: '질문 1'
  - topic: 'values(), valueOf()와 없는 이름을 넘겼을 때의 IllegalArgumentException'
    where: '질문 1'
  - topic: 'enum 상수는 그 enum 타입의 객체이고 상수마다 하나뿐이다. new로 만들 수 없다'
    where: '질문 2'
  - topic: 'enum은 ==로 비교한다. null일 때 equals와의 차이'
    where: '질문 2'
  - topic: 'enum은 다른 클래스를 상속할 수 없고 인터페이스는 구현할 수 있다'
    where: '질문 2의 더 알아보기'
  - topic: '상수마다 필드를 주기: 생성자와 필드, 메서드'
    where: '질문 3'
  - topic: '상수마다 다른 동작 주기: 상수별 메서드 구현, 추상 메서드'
    where: '질문 3'
  - topic: 'switch로 enum을 가르기. switch 식은 상수를 빠뜨리면 컴파일 오류가 난다'
    where: '질문 3'
  - topic: 'name()과 ordinal(). ordinal은 선언 순서라서 상수를 끼워 넣으면 바뀐다'
    where: '질문 4'
  - topic: 'compareTo는 ordinal 순서다. name()과 toString()의 차이'
    where: '질문 4의 더 알아보기'
  - topic: 'EnumMap과 EnumSet'
    where: '질문 4의 더 알아보기. 컬렉션을 고르는 기준은 컬렉션 고르기(K10)'
  - topic: 'JPA에서 enum 저장하기: @Enumerated(EnumType.STRING)과 기본값 ORDINAL'
    where: '실무에서는'
  - topic: 'JSON과 요청 파라미터에서 enum 주고받기, 없는 값이 왔을 때'
    where: '실무에서는. 에러 응답의 형식은 예외 처리와 검증(S8)'
  - topic: '상태에 따른 규칙을 enum 안에 두기'
    where: '실무에서는'
  - topic: 'DB에 저장하는 값을 이름과 다르게 하기(AttributeConverter)'
    where: '실무에서는의 더 알아보기'
  - topic: 'enum으로 싱글톤 만들기'
    where: '질문 2에서 한 줄. 자세한 것은 싱글톤 패턴(O11)'
  - topic: '상수마다 다른 동작을 전략 객체로 빼는 것'
    where: '다루지 않음: 전략 패턴(O7)'
  - topic: 'switch의 패턴 매칭과 sealed'
    where: '다루지 않음: 자바 17과 21에서 달라진 것(J18)'
codes:
  constants: |-
    public static final int CREATED = 0;
    public static final int PAID = 1;

    void changeStatus(long orderId, int status)

    changeStatus(1L, 7);
  basic: |-
    enum OrderStatus {
      CREATED, PAID, SHIPPED, CANCELLED
    }

    void changeStatus(long orderId,
        OrderStatus status)
  typeRun: |-
    // int로 받는 changeStatus와
    // OrderStatus로 받는 changeStatus에
    changeStatus(1L, 7);
  valueOfRun: |-
    OrderStatus.valueOf("PAID");
    OrderStatus.valueOf("paid");
  singleRun: |-
    OrderStatus a = OrderStatus.valueOf("PAID");
    print(a == OrderStatus.PAID);

    OrderStatus status = null;
    print(status == OrderStatus.PAID);
    status.equals(OrderStatus.PAID);
  rich: |-
    enum OrderStatus {
      CREATED("주문 접수", true),
      PAID("결제 완료", true),
      SHIPPED("배송 중", false),
      CANCELLED("취소", false);

      private final String label;
      private final boolean cancellable;

      OrderStatus(String label,
          boolean cancellable) {
        this.label = label;
        this.cancellable = cancellable;
      }

      boolean canCancel() { return cancellable; }
    }
  payMethod: |-
    enum PayMethod {
      CARD {
        BigDecimal fee(BigDecimal amount) {
          return amount.multiply(
              new BigDecimal("0.03"));
        }
      },
      BANK {
        BigDecimal fee(BigDecimal amount) {
          return new BigDecimal("500");
        }
      };

      [[abstract]] BigDecimal fee(BigDecimal amount);
    }
  richRun: |-
    PAID.canCancel();
    SHIPPED.canCancel();
    SHIPPED.label();

    CARD.fee(new BigDecimal("10000"));
    BANK.fee(new BigDecimal("10000"));
  switchExpr: |-
    String text = switch (status) {
      case CREATED -> "접수";
      case PAID -> "결제";
      case SHIPPED -> "배송";
      // CANCELLED를 빠뜨림
    };
  inserted: |-
    enum OrderStatus {
      CREATED, PAID, [[PREPARING]],
      SHIPPED, CANCELLED
    }
  ordinalRun: |-
    // 끼워 넣기 전
    OrderStatus.SHIPPED.ordinal();
    // 끼워 넣은 뒤
    OrderStatus.SHIPPED.ordinal();
    OrderStatus.values()[2];
    OrderStatus.valueOf("SHIPPED");
  entityBad: |-
    @Entity
    class Order {
      @Id @GeneratedValue
      private Long id;

      private OrderStatus status;
    }
  entityFixed: |-
    @Entity
    class Order {
      @Id @GeneratedValue
      private Long id;

      [[@Enumerated(EnumType.STRING)]]
      private OrderStatus status;
    }
  jpaStoredRun: |-
    em.persist(new Order(OrderStatus.SHIPPED));
    // 열의 값을 SQL로 읽는다
    select status from orders where id = ?
  jpaShiftRun: |-
    // 상수가 넷인 enum으로 SHIPPED를 저장하고
    // PREPARING을 끼워 넣은 enum으로
    // 같은 행을 읽는다
  controller: |-
    @GetMapping("/orders")
    List<OrderResponse> orders(
        @RequestParam [[OrderStatus]] status) {
      ...
    }

    record ChangeRequest([[OrderStatus]] status) {}
  springRun: |-
    GET /orders?status=PAID
    GET /orders?status=PIAD
    POST /orders/status {"status":"SHIPPED"}
    POST /orders/status {"status":"PIAD"}
  ruleOutside: |-
    if (order.getStatus() == CREATED
        || order.getStatus() == PAID) {
      order.cancel();
    }
  ruleInside: |-
    // 엔티티
    void cancel() {
      if (![[status.canCancel()]]) {
        throw new IllegalStateException(
            status + "는 취소할 수 없어요");
      }
      this.status = OrderStatus.CANCELLED;
    }
