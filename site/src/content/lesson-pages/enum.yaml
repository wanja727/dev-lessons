# enum (설계서)
# 자료 파일의 칸은 docs/lesson-data-format.md에 있다.
stage: design
title: enum
unit: 자바 언어
roadmap: J8
type: 자바 실행
prerequisites:
  - {slug: inheritance-polymorphism, title: 상속과 다형성}
assume: '자바 21. `==`는 같은 객체인지를 본다는 것(값과 참조 레슨), 오버라이딩한 메서드는 실제 객체의 것이 실행된다는 것(상속과 다형성 레슨).'
example: '주문 상태 `OrderStatus`. `CREATED`, `PAID`, `SHIPPED`, `CANCELLED` 네 가지예요. 상태마다 취소할 수 있는지를 묻고, 나중에 `PAID`와 `SHIPPED` 사이에 `PREPARING`을 끼워 넣어 봐요. 실무 구역에서는 이 enum을 JPA 엔티티의 필드와 요청 DTO에 써요.'
intro:
  - '주문 상태에 "상품 준비 중"을 하나 추가해서 배포했더니, 어제까지 "배송 중"이던 주문들이 전부 "상품 준비 중"으로 보여요. 코드에는 상태를 한 줄 추가했을 뿐이고 DB는 건드리지 않았어요.'
  - '주문 상태, 회원 등급, 결제 수단처럼 정해진 몇 가지 값은 서버 코드 어디에나 있어요. 스프링 개발자는 이것을 enum으로 만들고, DB에 어떻게 저장할지, JSON으로 어떻게 주고받을지, 값마다 다른 규칙을 어디에 둘지를 정해요.'
  - '이 레슨에서는 enum 상수가 실제로 무엇인지 코드를 돌려 확인하고, 상수의 순서를 바꾸면 무엇이 달라지는지를 본 뒤 JPA와 JSON으로 옮겨요.'
