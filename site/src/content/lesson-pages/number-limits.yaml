# 숫자 타입의 한계
# 자료 파일의 칸은 docs/lesson-data-format.md에 있다. 문제는 content/questions/number-limits.yaml에 있다.
title: 숫자 타입의 한계
description: 정수 계산이 범위를 넘으면 무슨 일이 생기는지, 0.1 + 0.2가 왜 0.3이 아닌지, 돈은 무엇으로 계산하는지, BigDecimal 둘을 어떻게 비교하는지. 네 가지 질문에 스스로 답할 수 있게, 쇼핑몰의 금액 계산을 int, double, BigDecimal로 해 보며 배우는 대화형 레슨.
unit: 자바 언어
minutes: 20
roadmap: J19
type: 자바 실행
prerequisites:
  - {slug: wrapper-autoboxing, title: 래퍼 클래스와 오토박싱}
assume: '자바 21. `int`, `long`, `double`로 계산해 본 것. `equals`는 내용을, `==`는 같은 객체인지를 비교한다는 것(값과 참조 레슨).'
example: '쇼핑몰의 금액 계산. 상품 가격에 수량을 곱하고, 할인율을 적용하고, 여러 주문의 합계가 결제 금액과 같은지 비교해요. 같은 계산을 `int`, `double`, `BigDecimal`로 해서 결과를 견줘요. 실무 구역에서는 엔티티의 금액 필드와 JSON 응답으로 옮겨요.'
intro:
  - '로그인 토큰의 만료 시간을 30일로 잡으려고 `30 * 24 * 60 * 60 * 1000`이라고 썼더니 토큰이 만들자마자 만료돼요. 다른 팀에서는 주문 금액의 합계와 결제 금액이 1원도 안 되는 차이로 맞지 않아 정산이 멈췄어요. 두 코드 모두 컴파일 오류도 예외도 없었어요.'
  - '서버는 돈, 수량, 시간, 번호를 숫자로 다뤄요. 자바의 숫자 타입은 담을 수 있는 범위와 정밀도에 한계가 있고, 한계를 넘어도 알려 주지 않고 틀린 값을 내놓아요. 그래서 스프링 개발자는 필드마다 `int`, `long`, `BigDecimal` 가운데 무엇을 쓸지 정해야 하고, 그 선택이 DB의 열 타입과 JSON까지 이어져요.'
  - '이 레슨에서는 범위를 넘는 정수 계산과 소수 계산을 직접 돌려 틀린 값이 나오는 것을 확인하고, 돈을 정확하게 계산하는 `BigDecimal`을 쓰는 법과 그 안의 함정을 봐요.'
covers:
  - topic: '정수 타입의 범위: int는 약 ±21억, long은 약 ±922경'
    where: '질문 1'
  - topic: '정수 오버플로: 범위를 넘으면 예외 없이 반대쪽 끝으로 돌아간 값이 나온다'
    where: '질문 1'
  - topic: 'int끼리의 계산은 long 변수에 담아도 int로 계산된다. 리터럴에 L을 붙인다'
    where: '질문 1'
  - topic: '오버플로를 예외로 바꾸는 Math.addExact, multiplyExact'
    where: '질문 1'
  - topic: '정수끼리 나누면 소수 부분이 버려진다. 0으로 나누면 ArithmeticException'
    where: '질문 1'
  - topic: 'long을 int로 줄일 때 잘리는 것'
    where: '질문 1의 더 알아보기'
  - topic: 'double은 0.1 같은 십진 소수를 정확히 담지 못한다. 2진수로 가장 가까운 값을 담는다'
    where: '질문 2'
  - topic: '그래서 0.1 + 0.2 == 0.3이 false이고, 더할수록 오차가 쌓인다. double은 ==로 비교하지 않는다'
    where: '질문 2'
  - topic: 'float은 double보다 정밀도가 낮다. double을 0으로 나누면 예외가 아니라 Infinity, NaN'
    where: '질문 2의 더 알아보기'
  - topic: 'double을 써도 되는 곳과 안 되는 곳'
    where: '질문 2'
  - topic: 'BigDecimal은 십진수를 정확히 담는다. 문자열이나 valueOf로 만든다. new BigDecimal(0.1)의 함정'
    where: '질문 3'
  - topic: 'BigDecimal은 불변이다. 계산 결과를 받아야 한다'
    where: '질문 3'
  - topic: '나누기에는 자릿수와 반올림 방법을 줘야 한다. 주지 않고 나누어떨어지지 않으면 ArithmeticException. setScale과 RoundingMode'
    where: '질문 3'
  - topic: 'BigDecimal의 equals는 자릿수(scale)까지 본다. 2.0과 2.00은 equals가 false이고 compareTo가 0이다'
    where: '질문 4'
  - topic: '그래서 HashSet과 HashMap의 키로 쓸 때와 TreeSet에서의 동작이 다르다'
    where: '질문 4'
  - topic: '돈을 가장 작은 단위의 정수(long)로 다루는 방법'
    where: '질문 3, 실무에서는'
  - topic: 'BigInteger'
    where: '질문 1의 더 알아보기'
  - topic: 'JPA에서 금액 필드: BigDecimal과 열의 precision, scale. id는 Long과 BIGINT'
    where: '실무에서는'
  - topic: 'JSON에서 큰 정수와 소수: 받는 쪽(자바스크립트)의 숫자 정밀도, 문자열로 내보내기'
    where: '실무에서는'
  - topic: '시간 계산에서의 int 오버플로(밀리초, 만료 시간)'
    where: '실무에서는'
  - topic: 'int와 Integer의 차이, 박싱'
    where: '다루지 않음: 래퍼 클래스와 오토박싱(J3)'
  - topic: '불변 객체가 무엇인지'
    where: '다루지 않음: 불변 객체(J9)'
  - topic: 'equals와 hashCode의 규약, HashSet이 찾는 방법'
    where: '다루지 않음: equals와 hashCode(J6)'
  - topic: '이진 탐색에서 가운데를 구할 때의 오버플로'
    where: '다루지 않음: 이진 탐색(K7)'
  - topic: '결제 금액의 승인, 취소, 정산 흐름'
    where: '다루지 않음: 결제 시스템 흐름(A20)'
codes:
  predict: |-
    int max = Integer.MAX_VALUE;
    System.out.println(max);
    System.out.println(max + 1);
  expire: |-
    long expireMs = [[30 * 24 * 60 * 60 * 1000]];
    System.out.println(expireMs);

    long fixed = [[30L]] * 24 * 60 * 60 * 1000;
    System.out.println(fixed);
  exactRun: |-
    Math.addExact(Integer.MAX_VALUE, 1);

    int price = 990, rate = 10;
    print(price / 100 * rate);
    print(price * rate / 100);
  doubleSum: |-
    System.out.println(0.1 + 0.2);
    System.out.println(0.1 + 0.2 == 0.3);

    double total = 0;
    for (int i = 0; i < 10; i++) {
      total += 0.1;
    }
    System.out.println(total == 1.0);
  create: |-
    new BigDecimal("0.1")
    BigDecimal.valueOf(0.1)
    [[new BigDecimal(0.1)]]
  immutable: |-
    BigDecimal total = new BigDecimal("1000");
    [[total.add(new BigDecimal("500"))]];
    // total은 여전히 1000

    total = total.add(new BigDecimal("500"));
    // 이제 1500
  divide: |-
    BigDecimal price = new BigDecimal("10000");
    BigDecimal three = new BigDecimal("3");

    price.divide(three);
    price.divide(three, 0, RoundingMode.DOWN);
  scale: |-
    BigDecimal a = new BigDecimal("2.0");
    BigDecimal b = new BigDecimal("2.00");

    System.out.println(a.equals(b));
    System.out.println(a.compareTo(b) == 0);

    new HashSet<>(Set.of(a, b)).size();
    new TreeSet<>(Set.of(a, b)).size();
  entity: |-
    @Entity
    class Payment {
      @Id @GeneratedValue
      private Long id;

      @Column([[precision = 19, scale = 2]])
      private BigDecimal amount;
    }
  jpaRun: |-
    em.persist(new Payment(
        new BigDecimal("10000")));
    em.clear();
    BigDecimal stored =
        em.find(Payment.class, id).getAmount();
  rateBad: |-
    BigDecimal rate = [[new BigDecimal(0.1)]];
    BigDecimal discount = price.multiply(rate);
  rateFixed: |-
    BigDecimal rate = new BigDecimal("0.1");
    BigDecimal discount = price.multiply(rate)
        [[.setScale(0, RoundingMode.DOWN)]];
  compareBad: |-
    if (!payment.getAmount()
        [[.equals]](order.getAmount())) {
      throw new AmountMismatchException();
    }
  compareFixed: |-
    if (payment.getAmount()
        [[.compareTo]](order.getAmount()) != 0) {
      throw new AmountMismatchException();
    }
  duration: |-
    long expireMs =
        [[Duration.ofDays(30).toMillis()]];
  jsonDto: |-
    record PaymentResponse(
        @JsonFormat(shape = [[STRING]])
        BigDecimal amount,
        @JsonFormat(shape = [[STRING]])
        long id) {}
  jsonRun: |-
    // amount 12345.67,
    // id 9007199254740993을 JSON으로 쓴다
links:
  test: https://github.com/wanja727/dev-lessons/blob/main/verification/src/test/java/lab/devlessons/numberlimits/NumberLimitsTest.java
  jpaTest: https://github.com/wanja727/dev-lessons/blob/main/verification/src/test/java/lab/devlessons/numberlimits/NumberLimitsJpaTest.java
