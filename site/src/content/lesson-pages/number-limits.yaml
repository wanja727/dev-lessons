  column: https://jakarta.ee/specifications/persistence/3.1/apidocs/jakarta.persistence/jakarta/persistence/Column.html
  maxSafe: https://tc39.es/ecma262/#sec-number.max_safe_integer
predict:
  title: 가장 큰 int에 1을 더하면?
  text: '첫 줄은 `int`가 담을 수 있는 가장 큰 값 2147483647을 출력해요. 거기에 1을 더한 둘째 줄은 무엇을 출력할까요? 모르는 게 정상이니 감으로 골라 보세요. 답은 질문 1에 나와요.'
  code: predict
  label: 내 예측
  options:
    - value: bigger
      label: '2147483648'
    - value: same
      label: '2147483647 (더 커지지 않는다)'
    - value: negative
      label: '-2147483648'
    - value: error
      label: 예외가 난다
  answer: negative
  storageKey: num-predict
  wrong: 예측은 "{label}"이었어요. 틀린 예측이 더 오래 남으니 괜찮아요.
questions:
  - id: q1
    title: 정수 계산의 결과가 타입의 범위를 넘으면 어떻게 되나요?
    conclusion:
      lead: '예외도 경고도 없이, 범위의 반대쪽 끝으로 돌아간 틀린 값이 나와요.'
      sub: '`int`는 약 21억까지만 담으므로, 그보다 커질 수 있는 값은 처음부터 `long`으로 계산해요.'
    says:
      - '`int`는 32비트라 -2147483648부터 2147483647까지, `long`은 64비트라 약 ±922경까지 담는다. 21억은 금액, 밀리초, 누적 건수에서 쉽게 넘는 숫자다'
      - '코드 predict. `Integer.MAX_VALUE + 1`은 -2147483648이다. 담을 수 있는 비트를 넘친 부분이 버려져서 가장 작은 값이 된다. 이것을 오버플로라고 한다. 자바는 이때 아무것도 알리지 않는다. 예측의 답을 밝힌다'
      - '코드 expire. 30일을 밀리초로 바꾸면 2592000000이어야 한다. 그런데 곱하는 수가 모두 `int`라서 곱셈이 `int`로 계산되고 오버플로한 음수가 `long` 변수에 담긴다. 변수의 타입이 아니라 계산하는 값의 타입이 결과를 정한다. 첫 수에 `L`을 붙이면 전체가 `long`으로 계산된다'
      - '가격 30000원에 수량 100000개를 `int`로 곱해도 같은 일이 생긴다. 금액의 합계, 건수의 누적처럼 커질 수 있는 값은 `long`으로 둔다'
      - '틀린 값으로 계속 가는 것보다 멈추는 편이 나은 계산에는 `Math.addExact`, `Math.multiplyExact`를 쓴다. 범위를 넘으면 `ArithmeticException`을 던진다'
      - '정수끼리 나누면 소수 부분이 버려진다. `10 / 4`는 2다. 할인 금액을 `price / 100 * rate`로 계산하면 `price`가 100 미만일 때 0이 되고, 그 이상에서도 100으로 나눈 나머지가 버려진다. `price * rate / 100`처럼 곱셈을 먼저 한다. 정수를 0으로 나누면 `ArithmeticException`이다'
      - '더 알아보기: `(int) 3000000000L`처럼 `long`을 `int`로 줄이면 위쪽 비트가 잘려 다른 값이 된다. `long`으로도 모자란 정수는 `BigInteger`를 쓴다'
    asks:
      - '본문의 예시: 코드 expire의 두 줄은 각각 무엇을 출력하나. 보기: 둘 다 2592000000 / 첫째는 음수, 둘째는 2592000000 / 첫째는 컴파일 오류 (첫째는 음수 -1702967296, 둘째는 2592000000)'
      - '옮긴 상황: `int price = 990; int rate = 10;`에서 `price / 100 * rate`와 `price * rate / 100`의 값은 각각 얼마인가 (90과 99)'
    body:
      - p: '정수 타입은 담을 수 있는 크기가 정해져 있어요.'
      - table:
          head: [타입, 크기, 담을 수 있는 범위]
          rows:
            - ['`int`', 32비트, '-2,147,483,648 ~ 2,147,483,647 (약 ±21억)']
            - ['`long`', 64비트, '약 ±922경']
      - p: '21억은 생각보다 작아요. 원 단위 금액의 합계, 밀리초로 잰 시간, 쌓이는 건수가 금방 넘어요. 넘으면 어떻게 될까요? 처음 예측의 답은 **-2147483648**이에요. {{predict-result}}'
      - ci:
          key: predict
          label: 실제 출력 보기
          source: NumberLimitsTest.predict
          code: predict
      - p: '`int`는 32비트에 들어가는 만큼만 담고, 넘친 부분은 버려요. 그 결과 가장 큰 값에 1을 더하면 가장 작은 값으로 돌아가요. 이것을 **오버플로**라고 해요. 자바는 이때 **예외도 경고도 내지 않아요.** 틀린 값을 그대로 들고 다음 줄로 가요.'
      - h3: long 변수에 담아도 넘쳐요
      - p: '도입부의 토큰 만료 시간이에요. 결과를 `long`에 담으니 괜찮을 것 같아요. 두 줄의 출력을 예상해 보고 열어 보세요.'
      - ci:
          key: expire
          label: 실제 출력 보기
          source: NumberLimitsTest.expireMillis
          code: expire
      - p: '첫 줄이 음수예요. `30 * 24 * 60 * 60 * 1000`은 곱하는 수가 모두 `int`라서 **곱셈이 `int`로 계산되고**, 넘친 결과를 그다음에 `long` 변수에 담아요. 변수의 타입이 아니라 계산하는 값의 타입이 결과를 정해요. 첫 수에 `L`을 붙이면 처음부터 `long`으로 계산돼서 맞아요.'
      - p: '가격 30000원에 수량 10만 개를 `int`로 곱해도 30억이라 넘쳐요. 금액의 합계, 누적 건수처럼 커질 수 있는 값은 `long`으로 둬요.'
      - h3: 틀린 값보다 멈추는 게 나을 때, 그리고 나눗셈
      - ci:
          key: exact
          label: 실제 출력 보기
          source: NumberLimitsTest.exactAndDivide
          code: exactRun
      - ul:
          - '**`Math.addExact`, `multiplyExact`는 넘치면 `ArithmeticException`을 던져요.** 잔액 계산처럼 틀린 값으로 계속 가면 안 되는 곳에 써요.'
          - '**정수끼리 나누면 소수 부분이 버려져요.** `990 / 100`은 9예요. 그래서 `price / 100 * rate`는 90이 되고 9원을 잃어요. 곱셈을 먼저 하면 99예요. 정수를 0으로 나누면 `ArithmeticException`이에요.'
      - more:
          summary: '더 알아보기: long을 int로 줄일 때, long으로도 모자랄 때'
          body:
            - ul:
                - '`(int) 3000000000L`처럼 큰 `long`을 `int`로 바꾸면 위쪽 비트가 잘려 엉뚱한 값이 돼요. 이것도 예외가 나지 않아요.'
                - '`long`으로도 모자란 정수는 크기 제한이 없는 `BigInteger`를 써요.'
      - quiz:
          q: '`int price = 990; int rate = 10;`일 때 `price / 100 * rate`는 얼마일까요?'
          options:
            - '99'
            - '90'
            - '99.0'
          answer: 2
          explain: '`990 / 100`이 정수 나눗셈이라 9가 되고, 9 × 10 = 90이에요. 곱셈을 먼저 하면 99예요.'
      - next: '정수는 범위가 문제였어요. 그러면 소수를 담는 `double`은 정확할까요?'
    recall: '예외도 경고도 없이 범위의 반대쪽 끝으로 돌아간 틀린 값이 나와요. 이것이 오버플로예요. `int`는 약 21억까지라 금액 합계나 밀리초는 `long`으로 계산해요. `int`끼리의 곱은 `long` 변수에 담아도 `int`로 계산되니 첫 수에 `L`을 붙여요. 넘치면 멈춰야 하는 곳에는 `Math.addExact`를 써요.'
  - id: q2
    title: '0.1 + 0.2는 왜 0.3이 아닌가요?'
    conclusion:
      lead: '`double`은 숫자를 2진수로 담는데, 0.1은 2진수로 딱 떨어지지 않아서 가장 가까운 값이 대신 담기기 때문이에요.'
      sub: '담을 때부터 아주 작은 오차가 있고 계산할수록 쌓이므로, 정확해야 하는 값에는 `double`을 쓰지 않아요.'
    says:
      - '코드 doubleSum. `0.1 + 0.2`는 0.30000000000000004를 출력하고 `0.1 + 0.2 == 0.3`은 false다'
      - '이유. 10진수에서 1/3이 0.333...으로 끝나지 않듯, 2진수에서는 1/10이 끝나지 않는다. `double`은 64비트 안에서 0.1에 가장 가까운 값을 담는다. 정확한 0.1이 아니다. 0.5나 0.25처럼 2의 거듭제곱으로 만들어지는 수는 정확히 담긴다'
      - '오차는 쌓인다. 0.1을 열 번 더한 값은 1.0과 `==`로 같지 않다'
      - '그래서 `double`끼리 `==`로 비교하지 않는다. 합계가 맞는지 보는 정산, 금액이 같은지 보는 검증이 이 비교에 걸린다. 도입부의 사고가 이것이다'
      - '`double`의 잘못이 아니라 쓰임이 다른 것이다. 평균 응답 시간, 좌표, 통계처럼 근삿값이면 되는 곳에는 빠르고 충분하다. 1원이 틀리면 안 되는 돈에는 맞지 않는다'
      - '더 알아보기: `float`은 32비트라 `double`보다 더 일찍 틀어진다. `double`은 0으로 나눠도 예외가 나지 않고 `Infinity`나 `NaN`이 된다. `NaN`은 자기 자신과도 `==`가 false다'
    asks:
      - '본문의 예시: 코드 doubleSum의 마지막 줄 `total == 1.0`은 무엇을 출력하나 (false)'
      - '옮긴 상황: `0.5 + 0.25 == 0.75`의 결과는 무엇인가 (true. 세 수 모두 2진수로 정확히 담긴다)'
    body:
      - p: '세 줄의 결과를 예상해 보고 열어 보세요.'
      - ci:
          key: double
          label: 실제 출력 보기
          source: NumberLimitsTest.doubleError
          code: doubleSum
      - p: '`0.1 + 0.2`가 0.3이 아니라 0.30000000000000004예요. 0.1을 열 번 더하면 0.9999999999999999예요. 계산이 틀린 게 아니라 **처음 담을 때부터** 정확한 0.1이 아니었어요.'
      - p: '10진수에서 1/3을 쓰면 0.333...으로 끝나지 않죠. 2진수에서는 **1/10이 그래요.** `double`은 64비트 안에서 0.1에 **가장 가까운 2진수**를 담아요. 아주 조금 크거나 작은 값이에요. 이 작은 차이가 더하고 곱할수록 쌓여요. 반대로 0.5, 0.25처럼 2의 거듭제곱으로 만들어지는 수는 정확히 담겨서 `0.5 + 0.25 == 0.75`는 true예요.'
      - p: '그래서 **`double`끼리 `==`로 비교하지 않아요.** 도입부의 정산 사고가 이거예요. 주문 금액을 `double`로 더한 합계와 결제 금액을 `==`로 비교하면, 1원도 안 되는 차이 때문에 같은 금액이 다르다고 나와요.'
      - table:
          head: ['`double`이 맞는 곳', '`double`이 맞지 않는 곳']
          rows:
            - ['평균 응답 시간, 비율, 통계', '금액, 잔액, 정산']
            - ['좌표, 거리, 과학 계산', '같은지 정확히 비교해야 하는 값']
      - more:
          summary: '더 알아보기: float, Infinity, NaN'
          body:
            - ul:
                - '`float`은 32비트라 `double`보다 더 일찍 틀어져요. 새 코드에서는 쓸 일이 거의 없어요.'
                - '정수와 달리 `double`은 0으로 나눠도 예외가 나지 않아요. `1.0 / 0`은 `Infinity`, `0.0 / 0`은 `NaN`(숫자가 아님)이 돼요. `NaN`은 자기 자신과도 `==`가 false예요. 테스트로 확인했어요.'
      - quiz:
          q: '`0.5 + 0.25 == 0.75`의 결과는 무엇일까요?'
          options:
            - 'true'
            - 'false'
            - 컴파일 오류
          answer: 1
          explain: '0.5, 0.25, 0.75는 2진수로 딱 떨어져서 정확히 담겨요. 0.1처럼 2진수로 끝나지 않는 수에서만 오차가 생겨요.'
      - next: '돈은 1원도 틀리면 안 돼요. 그러면 무엇으로 계산할까요?'
    recall: '`double`은 숫자를 2진수로 담는데, 0.1은 2진수로 끝나지 않아서 가장 가까운 값이 대신 담겨요. 그래서 `0.1 + 0.2`는 0.30000000000000004이고 더할수록 오차가 쌓여요. `double`끼리 `==`로 비교하지 않고, 통계처럼 근삿값이면 되는 곳에만 써요. 돈에는 쓰지 않아요.'
  - id: q3
    title: 그러면 돈은 무엇으로 계산하나요?
    conclusion:
      lead: '`BigDecimal`로 계산해요. 십진수를 자릿수와 함께 정확히 담고, 반올림을 어떻게 할지를 코드에 직접 적게 해요.'
      sub: '문자열로 만들어야 하고, 불변이라 결과를 받아야 하고, 나눌 때는 자릿수와 반올림 방법을 줘야 해요.'
    says:
      - '`new BigDecimal("0.1").add(new BigDecimal("0.2"))`는 정확히 0.3이다'
      - '코드 create. 만드는 방법이 결과를 가른다. `new BigDecimal("0.1")`은 0.1이다. `new BigDecimal(0.1)`은 `double` 0.1이 실제로 담고 있던 값을 그대로 옮겨서 0.1000000000000000055...가 된다. `double`의 오차를 정확하게 보존해 버린다. `double`에서 만들어야 하면 `BigDecimal.valueOf(0.1)`을 쓴다'
      - '`BigDecimal`은 불변이다(J9). `price.add(tax);`만 쓰고 결과를 받지 않으면 `price`는 그대로다. `price = price.add(tax);`로 받는다. 연산은 `+`가 아니라 `add`, `subtract`, `multiply`, `divide` 메서드다'
      - '코드 divide. 10000을 3으로 나누면 3333.333...으로 끝나지 않는다. 자릿수를 주지 않은 `divide`는 정확한 답을 만들 수 없어 `ArithmeticException`을 던진다. 소수 몇째 자리까지, 어떻게 반올림할지를 준다. `divide(three, 0, RoundingMode.DOWN)`은 3333이다'
      - '반올림 방법은 업무 규칙이다. 버림(`DOWN`), 반올림(`HALF_UP`), 은행가 반올림(`HALF_EVEN`) 가운데 무엇인지는 기획과 법이 정하고, 코드는 그것을 적는다. `double`은 이 선택을 할 자리가 없었다'
      - '나눈 뒤 남는 금액. 10000원을 셋으로 나눠 3333원씩 주면 1원이 남는다. 남는 금액을 누구에게 붙일지도 정해서 합계가 원래 금액과 맞게 한다'
      - '다른 방법: 원화처럼 소수가 없는 돈은 가장 작은 단위(원)의 정수 `long`으로 다뤄도 정확하다. 이때는 질문 1의 오버플로와 나눗셈의 버림을 챙긴다. 환율, 이자율처럼 소수가 필요한 계산에는 `BigDecimal`을 쓴다'
    widget:
      kind: toggle
      note: '0.1과 0.2를 더하는 세 가지 방법 가운데 하나를 고른다: "`double`", "`new BigDecimal(0.1)`처럼 double로 만든 BigDecimal", "`new BigDecimal(\"0.1\")`처럼 문자열로 만든 BigDecimal". 실행 버튼을 누르면 두 칸에 "담긴 값"(0.1이 실제로 무엇으로 담겼는지)과 "더한 결과"를 보여 주고, 한 줄 정리에 0.3과 같은지를 적는다. 정확하지 않은 줄은 문제로 표시한다'
    asks:
      - '본문의 예시: 코드 divide의 두 `divide`는 각각 어떻게 되나 (첫째는 `ArithmeticException`, 둘째는 3333)'
      - '옮긴 상황: `BigDecimal total = new BigDecimal("1000"); total.add(new BigDecimal("500")); System.out.println(total);`의 출력은 무엇인가 (1000. `add`의 결과를 받지 않았다)'
      - '실무 구역: 할인율 0.1을 `new BigDecimal(0.1)`로 만들어 가격 `new BigDecimal("10000")`에 `multiply`했다. 결과는 정확히 1000인가 (아니다. 1000.000000000000055...가 된다. 문자열이나 `valueOf`로 만들어야 한다)'
    body:
      - p: '`java.math.BigDecimal`은 숫자를 **십진수 그대로**, 소수 몇째 자리까지인지(자릿수)와 함께 담아요. 2진수로 바꾸지 않으니 0.1이 정확히 0.1이에요. 대신 세 가지를 지켜야 해요.'
      - h3: 1. 문자열로 만들어요
      - p: '만드는 방법 세 가지로 0.1을 만들어 0.2와 더해 봤어요. 방법을 골라 실행해 보세요.'
      - widget:
          kind: toggle
          layout: [selector, buttons, duo, verdict]
          selector:
            label: 0.1과 0.2를 만드는 방법
            options:
              - {value: dbl, label: double}
              - {value: bdDouble, label: 'new BigDecimal(0.1)'}
              - {value: bdString, label: 'new BigDecimal("0.1")'}
          run: {label: 더하기}
          initial:
            duo:
              - {label: 0.1이 실제로 담긴 값, state: dim, text: 실행하면 보여요}
              - {label: 0.1 + 0.2, state: dim, text: 실행하면 보여요}
          scenes:
            dbl:
              duo:
                - label: 0.1이 실제로 담긴 값
                  rows: [{k: 값, v: '0.1에 가장 가까운 2진수', mark: bad}]
                - label: 0.1 + 0.2
                  rows: [{k: 합, v: '0.30000000000000004', mark: bad}]
              verdict: '0.3과 같지 않아요. 담을 때의 오차가 더하면서 드러났어요.'
            bdDouble:
              duo:
                - label: 0.1이 실제로 담긴 값
                  rows: [{k: 값, v: '0.1000000000000000055511151231257827021181583404541015625', mark: bad}]
                - label: 0.1 + 0.2
                  rows: [{k: 합, v: '0.3000000000000000166533453693773481063544750213623046875', mark: bad}]
              verdict: 'double이 담고 있던 값을 그대로 옮겨서, 오차를 아주 정확하게 보존해 버렸어요.'
            bdString:
              duo:
                - label: 0.1이 실제로 담긴 값
                  rows: [{k: 값, v: '0.1', mark: changed}]
                - label: 0.1 + 0.2
                  rows: [{k: 합, v: '0.3', mark: changed}]
              verdict: '문자열로 만들면 0.1이 정확히 0.1이고, 더한 결과도 정확히 0.3이에요.'
      - ci:
          key: sum-compare
          label: 세 방법을 실제로 돌린 결과 보기
          source: NumberLimitsTest.bigDecimalCreation
      - p: '`new BigDecimal(0.1)`은 인자가 이미 `double`이에요. `double` 0.1이 실제로 담고 있던 2진수 값을 십진수로 정확히 옮겨서 긴 숫자가 돼요. 질문 2의 오차를 고치는 게 아니라 그대로 보존해요. **문자열로 만들거나**, `double`에서 만들어야 하면 `BigDecimal.valueOf(0.1)`을 써요. `valueOf`는 0.1을 우리가 쓴 모양 그대로 만들어 줘요.'
      - ci:
          key: create
          label: 세 생성 방법의 실제 값 보기
          source: NumberLimitsTest.bigDecimalCreation
          code: create
      - h3: 2. 결과를 받아요
      - p: '`BigDecimal`은 불변이에요. `+` 대신 `add`, `subtract`, `multiply`, `divide`를 부르고, 이 메서드들은 자기를 고치지 않고 **새 값을 돌려줘요.**'
      - code: immutable
        notes:
          - mark: total.add(new BigDecimal("500"))
            as: code
            text: '결과를 받지 않았어요. 새 `BigDecimal`이 만들어지고 버려져요. 컴파일 오류도 경고도 없어요.'
      - h3: 3. 나눌 때는 자릿수와 반올림을 줘요
      - p: '10000원을 세 명이 나눠 내는 금액이에요. 두 줄은 각각 어떻게 될까요?'
      - ci:
          key: divide
          label: 실제 결과 보기
          source: NumberLimitsTest.bigDecimalDivide
          code: divide
      - p: '10000 ÷ 3은 3333.333...으로 끝나지 않아요. `BigDecimal`은 정확한 값만 내려고 해서, 자릿수를 주지 않으면 **예외를 던져요.** 소수 몇째 자리까지(`0`), 어떻게 자를지(`RoundingMode.DOWN`)를 줘야 해요.'
      - ul:
          - '**반올림 방법은 업무 규칙이에요.** 버림(`DOWN`), 반올림(`HALF_UP`), 은행가 반올림(`HALF_EVEN`) 가운데 무엇을 쓸지는 기획이나 법이 정하고, 코드는 그것을 적어요. `double`에는 이 선택을 적을 자리가 없었어요.'
          - '**남는 금액도 정해요.** 3333원씩 셋이면 9999원이라 1원이 남아요. 그 1원을 누구에게 붙일지 정해야 합계가 원래 금액과 맞아요.'
      - h3: 소수가 없는 돈은 long으로도
      - p: '원화처럼 소수가 없는 돈은 가장 작은 단위(원)의 정수로 `long`에 담아도 정확해요. 이때는 질문 1의 오버플로와 나눗셈의 버림을 챙겨요. 환율, 이자율, 할인율처럼 소수가 끼는 계산은 `BigDecimal`로 해요.'
      - quiz:
          q: '`BigDecimal total = new BigDecimal("1000"); total.add(new BigDecimal("500")); System.out.println(total);`의 출력은?'
          options:
            - '1500'
            - '1000'
            - '500'
          answer: 2
          explain: '`BigDecimal`은 불변이에요. `add`는 새 값을 돌려줄 뿐 `total`을 고치지 않아요. `total = total.add(...)`로 받아야 해요.'
      - next: '이제 금액이 정확해졌어요. 두 금액이 같은지는 어떻게 비교할까요? `equals`면 될까요?'
    recall: '`BigDecimal`로 계산해요. 십진수를 자릿수와 함께 정확히 담아요. `new BigDecimal(0.1)`은 double의 오차를 옮기니 문자열이나 `valueOf`로 만들어요. 불변이라 `add` 같은 메서드의 결과를 받아야 해요. 나누어떨어지지 않는 나눗셈은 자릿수와 반올림 방법을 주지 않으면 `ArithmeticException`이에요. 소수가 없는 원화는 `long`으로 다뤄도 돼요.'
  - id: q4
    title: 'BigDecimal 두 개가 같은 금액인지는 어떻게 비교하나요?'
    conclusion:
      lead: '`compareTo`의 결과가 0인지로 비교해요. `equals`는 값뿐 아니라 소수 자릿수까지 같아야 true예요.'
      sub: '2.0과 2.00은 같은 금액이지만 자릿수가 달라서 `equals`로는 다른 값이에요.'
    says:
      - '코드 scale. `new BigDecimal("2.0").equals(new BigDecimal("2.00"))`은 false이고 `compareTo`는 0이다'
      - '`BigDecimal`은 숫자와 함께 소수 자릿수(scale)를 가진다. "2.0"은 자릿수 1, "2.00"은 자릿수 2다. `equals`는 둘 다 본다. `compareTo`는 크기만 본다'
      - '자릿수가 달라지는 길은 흔하다. 요청 JSON의 `10000`과 DB의 `NUMERIC(19, 2)` 열에서 읽은 `10000.00`, 곱셈의 결과(자릿수가 더해진다)가 그렇다. 그래서 "결제 금액과 주문 금액이 같은가"를 `equals`로 보면 같은 금액인데 false가 나온다'
      - '`==`는 J2에서 본 대로 같은 객체인지를 보므로 쓰지 않는다. 금액 비교는 `a.compareTo(b) == 0`, 크기 비교는 `a.compareTo(b) > 0`. 0인지 보려면 `amount.signum() == 0`'
      - '컬렉션에서도 갈린다. `HashSet`은 `equals`와 `hashCode`를 쓰므로(J6) 2.0과 2.00을 둘로 담는다. `TreeSet`은 `compareTo`를 쓰므로 하나로 담는다. `BigDecimal`을 `HashMap`의 키로 쓸 때는 `setScale`이나 `stripTrailingZeros`로 자릿수를 맞춘 뒤에 넣는다'
    asks:
      - '본문의 예시: `new BigDecimal("2.0")`과 `new BigDecimal("2.00")`을 `HashSet`과 `TreeSet`에 각각 넣으면 크기는 얼마인가 (`HashSet`은 2, `TreeSet`은 1)'
      - '옮긴 상황: `new BigDecimal("1.5").multiply(new BigDecimal("2"))`의 결과 `r`에 대해 `r.equals(new BigDecimal("3"))`과 `r.compareTo(new BigDecimal("3")) == 0`은 각각 무엇인가 (false와 true. 결과는 자릿수 1인 3.0이다)'
    body:
      - p: '`BigDecimal`은 숫자와 함께 **소수 자릿수**(scale)를 들고 있어요. `"2.0"`은 자릿수 1, `"2.00"`은 자릿수 2예요. 같은 2인데 비교 방법에 따라 결과가 갈려요.'
      - ci:
          key: scale
          label: 실제 출력 보기
          source: NumberLimitsTest.bigDecimalEquality
          code: scale
      - ul:
          - '**`equals`는 값과 자릿수를 함께 봐요.** 2.0과 2.00은 자릿수가 달라서 false예요.'
          - '**`compareTo`는 크기만 봐요.** 둘은 같은 크기라 0이에요.'
          - '**컬렉션도 갈려요.** `HashSet`은 `equals`와 `hashCode`로 찾아서(equals와 hashCode 레슨) 둘을 다른 값으로 담아요. `TreeSet`은 `compareTo`로 정렬해서 하나로 담아요.'
      - p: '자릿수가 달라지는 일은 흔해요. 요청 JSON의 `10000`과 DB의 `NUMERIC(19, 2)` 열에서 읽은 `10000.00`이 다르고, `1.5 × 2`는 자릿수가 더해져 `3.0`이 돼요. 그래서 금액이 같은지는 `equals`가 아니라 **`a.compareTo(b) == 0`**으로 봐요. 크기 비교도 `compareTo`로 하고(`> 0`, `< 0`), 0원인지는 `amount.signum() == 0`으로 봐요. `==`는 같은 객체인지를 보니 쓰지 않아요.'
      - muted: '`BigDecimal`을 `HashMap`의 키나 `HashSet`에 넣어야 하면 `setScale(2)`나 `stripTrailingZeros()`로 자릿수를 맞춘 뒤에 넣어요.'
      - quiz:
          q: '`BigDecimal r = new BigDecimal("1.5").multiply(new BigDecimal("2"));`일 때 `r.equals(new BigDecimal("3"))`은?'
          options:
            - 'true'
            - 'false'
            - 예외가 난다
          answer: 2
          explain: '곱셈의 결과는 자릿수가 더해진 `3.0`(자릿수 1)이에요. `"3"`은 자릿수 0이라 `equals`가 false예요. `compareTo`로 비교하면 0이에요.'
    recall: '`compareTo`의 결과가 0인지로 비교해요. `BigDecimal`은 소수 자릿수를 함께 들고 있고, `equals`는 자릿수까지 같아야 true라서 2.0과 2.00이 다르다고 해요. 요청 값과 DB에서 읽은 값, 곱셈의 결과는 자릿수가 달라지기 쉬워요. `HashSet`은 둘을 따로 담고 `TreeSet`은 하나로 담아요.'
practice:
  title: 스프링과 JPA에서는 이렇게 써요
  says:
    - '엔티티의 금액 필드. `@Column(precision = 19, scale = 2) private BigDecimal amount;`. `precision`은 전체 자릿수, `scale`은 소수 자릿수이고 DB의 `NUMERIC(19, 2)` 열이 된다. `double` 필드와 `FLOAT` 열은 질문 2의 오차를 DB에 저장한다. 소수가 없는 원화만 다루면 `long`과 `BIGINT`도 쓴다 (`@DataJpaTest`와 PostgreSQL 컨테이너로 `10000`을 저장하고 다시 읽어 자릿수가 2가 된 것과, 그래서 `equals`가 false이고 `compareTo`가 0인 것을 확인하는 테스트)'
    - '흔한 실수 1: 금액을 `double`로 계산하거나 `new BigDecimal(double)`로 만든다. 예: `new BigDecimal(0.1)`로 만든 할인율. 고친 코드: `new BigDecimal("0.1")`, 그리고 `price.multiply(rate).setScale(0, RoundingMode.DOWN)`처럼 자릿수와 반올림을 적는다. 고치기 전과 뒤의 결과를 붙인다 (순수 자바 테스트)'
    - '흔한 실수 2: 금액이 같은지 `equals`로 비교한다. `if (!payment.getAmount().equals(order.getAmount())) throw ...`. 요청에서 온 `10000`과 DB에서 읽은 `10000.00`이 달라서 정상 결제가 거부된다. 고친 코드: `compareTo(...) != 0` (위 JPA 테스트의 값으로 확인한다)'
    - '시간의 오버플로. 토큰이나 쿠키의 만료 시간을 `int`로 곱한다(코드 expire). 고친 코드: `L`을 붙이는 것보다 `Duration.ofDays(30).toMillis()`를 쓴다. 단위를 손으로 곱하지 않는다 (순수 자바 테스트)'
    - 'id는 `Long`과 `BIGINT`로 둔다. `INT` 열의 자동 증가 번호는 약 21억에서 끝나고, 그 뒤에는 INSERT가 실패한다. 엔티티의 id를 `Long`으로 두는 다른 이유는 J3에서 봤다'
    - 'JSON. Jackson은 `BigDecimal`을 JSON 숫자로 내보낸다. 받는 쪽이 자바스크립트면 숫자를 `double`로 읽어서 질문 2의 오차가 생기고, 2의 53제곱보다 큰 `long`(큰 id)도 정확히 담지 못한다. 정확해야 하는 금액과 큰 번호는 `@JsonFormat(shape = JsonFormat.Shape.STRING)`으로 문자열로 내보낸다 (Jackson `ObjectMapper`로 두 방식의 JSON을 붙이는 테스트. 자바스크립트의 숫자 정밀도는 ECMAScript 명세 근거)'
  body:
    - p: '금액은 엔티티에서 DB 열로, 응답 DTO에서 JSON으로 이어져요. 어느 한 곳이 `double`이면 질문 2의 오차가 그곳으로 새요. DB 열의 자릿수는 PostgreSQL 컨테이너에 저장해 확인했고, JSON은 Jackson으로 확인했어요.'
    - h3: 엔티티의 금액 필드
    - code: entity
      notes:
        - mark: 'precision = 19, scale = 2'
          as: code
          text: '`precision`은 전체 자릿수, `scale`은 소수 자릿수예요. DB에 `NUMERIC(19, 2)` 열이 만들어져요. 필드를 `double`로 두면 열이 `FLOAT`가 되고 오차가 DB에 저장돼요.'
    - p: '이 엔티티에 `10000`을 저장하고, 1차 캐시를 비운 뒤 DB에서 다시 읽었어요.'
    - ci:
        key: jpa-scale
        label: PostgreSQL에서 읽은 실제 값 보기
        source: NumberLimitsJpaTest.scaleAfterRoundTrip
        code: jpaRun
    - p: '열의 자릿수가 2라서 `10000.00`으로 돌아왔어요. 같은 금액이지만 `equals`는 false예요. 질문 4가 바로 여기서 터져요.'
    - h3: '흔한 실수 1: 결제 금액을 equals로 검증'
    - code: compareBad
      notes:
        - mark: .equals
          as: code
          text: '요청에서 받은 `10000`과 DB에서 읽은 `10000.00`은 자릿수가 달라서 false예요. 정상 결제가 "금액이 다르다"로 거부돼요.'
    - code: compareFixed
      notes:
        - mark: .compareTo
          as: code
          text: '크기만 비교해요. 자릿수가 달라도 같은 금액이면 0이에요.'
    - h3: '흔한 실수 2: double로 만든 할인율'
    - code: rateBad
      notes:
        - mark: new BigDecimal(0.1)
          as: code
          text: '`double` 0.1의 오차를 옮겨요. 10000을 곱하면 1000이 아니라 1000.000000000000055...가 돼요.'
    - code: rateFixed
      notes:
        - mark: .setScale(0, RoundingMode.DOWN)
          as: code
          text: '원 단위로 자르고, 버림인지 반올림인지를 코드에 적어요. 할인 금액을 어떻게 자를지는 업무 규칙이에요.'
    - h3: 시간은 Duration으로
    - p: '도입부의 토큰 만료 시간은 `L`을 붙여도 고쳐지지만, 단위를 손으로 곱하지 않는 편이 안전해요.'
    - code: duration
      notes:
        - mark: Duration.ofDays(30).toMillis()
          as: code
          text: '`long`으로 계산해서 2592000000을 줘요. 무슨 값인지도 읽혀요.'
    - p: '같은 이유로 엔티티의 id는 `Long`과 `BIGINT` 열로 둬요. `INT` 열의 자동 증가 번호는 약 21억에서 끝나고, 그다음 INSERT는 실패해요.'
    - h3: JSON에서 금액과 큰 번호
    - p: 'Jackson은 `BigDecimal`과 `long`을 JSON 숫자로 내보내요. 받는 쪽이 자바스크립트면 JSON 숫자를 `double`과 같은 방식으로 읽어요. 그러면 금액에 질문 2의 오차가 생기고, 2의 53제곱(9007199254740992)보다 큰 정수는 정확히 담지 못해요. 정확해야 하는 값은 문자열로 내보내요.'
    - code: jsonDto
      notes:
        - mark: STRING
          as: code
          text: 'JSON에 숫자가 아니라 문자열로 써요. 받는 쪽이 문자열을 그대로 다루거나 자기 언어의 정확한 십진수 타입으로 바꿔요.'
    - ci:
        key: json
        label: 두 방식의 실제 JSON 보기
        source: NumberLimitsTest.jacksonShape
        code: jsonRun
    - muted: '근거: 열의 precision과 scale은 [자카르타 퍼시스턴스 API 문서](link:column), 자바스크립트가 정확히 담는 정수의 범위는 [ECMAScript 명세](link:maxSafe). 저장한 값과 JSON은 테스트로 확인했어요.'
interview:
  question: 자바에서 돈을 계산할 때 무엇을 조심해야 하나요?
  model:
    - label: 정의
      text: 정수 타입은 범위를 넘으면 예외 없이 반대쪽 끝으로 돌아가는 오버플로가 생기고, double은 0.1 같은 십진 소수를 2진수로 정확히 담지 못해 오차가 있습니다. 그래서 돈은 BigDecimal로, 소수가 없으면 가장 작은 단위의 long으로 계산합니다.
    - label: 원리
      text: int끼리의 계산은 long 변수에 담아도 int로 계산되어 넘칩니다. BigDecimal은 십진수를 자릿수와 함께 담고, 불변이라 연산 결과를 받아야 하며, 나눌 때는 자릿수와 반올림 방법을 직접 줘야 합니다.
    - label: 주의할 점
      text: new BigDecimal(0.1)은 double의 오차를 옮기니 문자열이나 valueOf로 만듭니다. equals는 자릿수까지 봐서 10000과 10000.00이 다르므로 금액 비교는 compareTo로 합니다. JPA에서는 precision과 scale을 정하고, JSON으로 내보낼 때는 문자열로 내보내는 것을 고려합니다.
    - label: 경험
      text: '(내 프로젝트로 채우기) 예: 결제 금액 검증을 equals로 했다가 DB에서 읽은 금액의 자릿수가 달라 정상 결제가 거부되는 버그를 compareTo로 고쳤습니다.'
verified: 이 레슨의 출력은 짐작이 아니라 자바 21에서 코드를 돌려 받은 값이에요. DB 열의 자릿수는 PostgreSQL 16 컨테이너에 저장하고 읽어 확인했어요. 코드가 바뀔 때마다 테스트([NumberLimitsTest](link:test), [NumberLimitsJpaTest](link:jpaTest))가 다시 돌아요.
footer: '근거: 정수 타입의 범위와 오버플로는 자바 언어 명세 4.2.2([링크](link:jlsInt)), 부동소수점은 4.2.3([링크](link:jlsFloat)), `BigDecimal`의 생성자 주의와 equals와 compareTo는 API 문서([링크](link:bigDecimal)). 결과는 OpenJDK 21과 하이버네이트 6.6, PostgreSQL 16에서 테스트로 확인했어요. 오류는 [GitHub 이슈](https://github.com/wanja727/dev-lessons/issues)로 알려 주세요.'
claims:
  - claim: '`Integer.MAX_VALUE + 1`은 -2147483648이다'
    how: '그대로 돌린다'
    test: NumberLimitsTest.overflow
  - claim: '`30 * 24 * 60 * 60 * 1000`을 `long`에 담으면 -1702967296이고, 첫 수에 `L`을 붙이면 2592000000이다. `Duration.ofDays(30).toMillis()`도 2592000000이다'
    how: '세 식과 변수로 받은 변형을 돌린다'
    test: NumberLimitsTest.expireMillis
  - claim: '`Math.addExact(Integer.MAX_VALUE, 1)`은 `ArithmeticException`을 던진다. 정수를 0으로 나눠도 그렇다. `990 / 100 * 10`은 90이고 `990 * 10 / 100`은 99다'
    how: '그대로 돌려 예외의 타입과 값을 본다'
    test: NumberLimitsTest.exactAndDivide
  - claim: '`0.1 + 0.2`는 0.30000000000000004이고 `0.3`과 `==`가 false다. 0.1을 열 번 더한 값은 `1.0`과 `==`가 false다. `0.5 + 0.25 == 0.75`는 true다'
    how: '코드 doubleSum과 마지막 식을 돌린다'
    test: NumberLimitsTest.doubleError
  - claim: 'double을 0으로 나누면 Infinity, 0.0/0.0은 NaN이고 NaN은 자신과 `==`가 false다'
    how: '그대로 돌린다'
    test: NumberLimitsTest.doubleSpecialValues
  - claim: '`new BigDecimal("0.1")`과 `BigDecimal.valueOf(0.1)`은 0.1이고 `new BigDecimal(0.1)`은 0.1000000000000000055로 시작하는 값이다'
    how: '세 값을 `toString`으로 출력한다. 위젯의 값과 맞춘다'
    test: NumberLimitsTest.bigDecimalCreation
  - claim: '나누어떨어지지 않는 `divide`는 자릿수를 주지 않으면 `ArithmeticException`이고, `divide(three, 0, RoundingMode.DOWN)`은 3333이다'
    how: '코드 divide를 돌린다'
    test: NumberLimitsTest.bigDecimalDivide
  - claim: '`add`의 결과를 받지 않으면 원래 `BigDecimal`은 그대로다'
    how: '그대로 돌린다'
    test: NumberLimitsTest.bigDecimalImmutable
  - claim: '"2.0"과 "2.00"은 `equals`가 false, `compareTo`가 0이다. `HashSet`의 크기는 2, `TreeSet`의 크기는 1이다. "1.5"와 "2"의 곱은 3.0이다'
    how: '각각 돌린다'
    test: NumberLimitsTest.bigDecimalEquality
  - claim: '`@Column(precision = 19, scale = 2)`인 `BigDecimal` 필드에 `new BigDecimal("10000")`을 저장하고 다시 읽으면 자릿수가 2다 (하이버네이트 6.6, PostgreSQL 16)'
    how: '`@DataJpaTest`로 저장하고 `em.clear()` 뒤 다시 읽어 `scale()`과 `equals`, `compareTo`를 본다'
    test: NumberLimitsJpaTest.scaleAfterRoundTrip
  - claim: 'Jackson은 `BigDecimal`과 `long`을 기본으로 JSON 숫자로 쓰고, `@JsonFormat(shape = STRING)`을 붙이면 문자열로 쓴다 (스프링 부트 3.5의 Jackson)'
    how: '`ObjectMapper`로 두 record를 써서 문자열을 본다'
    test: NumberLimitsTest.jacksonShape
sources:
  - '정수 타입의 범위와 오버플로: 자바 언어 명세 4.2.1, 4.2.2 https://docs.oracle.com/javase/specs/jls/se21/html/jls-4.html#jls-4.2.2'
  - '이항 연산에서 계산하는 타입이 정해지는 것: 자바 언어 명세 5.6 https://docs.oracle.com/javase/specs/jls/se21/html/jls-5.html#jls-5.6'
  - '부동소수점 타입(IEEE 754): 자바 언어 명세 4.2.3 https://docs.oracle.com/javase/specs/jls/se21/html/jls-4.html#jls-4.2.3'
  - '`Math.addExact`: API 문서 https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/lang/Math.html'
  - '`BigDecimal`의 생성자 주의, `equals`와 `compareTo`의 차이, `divide`: API 문서 https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/math/BigDecimal.html'
  - '`RoundingMode`: API 문서 https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/math/RoundingMode.html'
  - '`@Column`의 precision과 scale: 자카르타 퍼시스턴스 API 문서 https://jakarta.ee/specifications/persistence/3.1/apidocs/jakarta.persistence/jakarta/persistence/Column.html'
  - '자바스크립트의 Number가 정확히 담는 정수의 범위: ECMAScript 명세 https://tc39.es/ecma262/#sec-number.max_safe_integer'
