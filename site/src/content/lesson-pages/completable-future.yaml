# Future와 CompletableFuture (설계서)
# 자료 파일의 칸은 docs/lesson-data-format.md에 있다.
# 예전 레슨 둘(future-and-callable, completable-future)을 하나로 합친다.
stage: design
title: Future와 CompletableFuture
unit: 운영체제와 동시성
roadmap: C8
type: 자바 실행
prerequisites:
  - {slug: thread-pool, title: 스레드 풀}
  - {slug: lambda, title: 람다와 함수형 인터페이스}
assume: '자바 21(OpenJDK). 스레드 풀에 `Callable`을 `submit`하는 것, `execute`와 `submit`의 예외 차이(스레드 풀 레슨). `Function`, `Supplier` 같은 함수형 인터페이스와 메서드 참조(람다와 함수형 인터페이스 레슨). 체크 예외와 언체크 예외(예외 레슨).'
example: '주문 상세 화면을 만들려면 주문 정보, 배송 상태, 쿠폰 목록을 각각 다른 서비스에서 받아야 해요. 각 호출은 300ms 걸려요. 하나씩 기다리면 0.9초, 동시에 맡기고 합치면 0.3초 남짓이에요. `Future`로 결과를 받는 법에서 시작해 `CompletableFuture`로 잇고 합치고, 실패와 시간 초과를 다뤄요. 실무 구역에서는 스프링 서비스에서 외부 호출을 함께 보내는 코드와 공용 풀의 함정으로 옮겨요.'
intro:
  - '주문 상세 API가 1초 가까이 걸려요. 들여다보니 주문 정보, 배송 상태, 쿠폰 목록을 차례로 부르고 있었어요. 셋은 서로 상관이 없으니 동시에 부르면 될 것 같아 스레드 풀에 맡겼는데, 이번에는 결과를 어떻게 모으고 하나가 실패하면 어떻게 할지가 막혀요.'
  - '다른 스레드에 맡긴 일의 결과를 받는 것은 스프링 서버에서 흔한 일이에요. 외부 API 여러 개를 함께 부르기, `@Async`의 반환값, 메시지 전송 결과 받기가 다 그래요. 자바는 `Future`와 `CompletableFuture`로 "나중에 올 결과"를 값처럼 다루게 해 줘요. 어디서 기다리고 어디서 예외가 나오는지 알아야 빨라지기는커녕 더 느려지는 코드를 피할 수 있어요.'
  - '이 레슨에서는 300ms 걸리는 작업 셋을 하나씩 기다릴 때와 함께 기다릴 때의 시간을 재고, 중간에 예외가 나거나 시간을 넘긴 작업이 어떤 모양으로 돌아오는지 돌려서 확인해요.'
covers:
  - topic: 'Future: 아직 끝나지 않은 작업의 결과를 나중에 받을 표. submit은 바로 Future를 돌려준다'
    where: '질문 1'
  - topic: 'get()은 결과가 나올 때까지 부른 스레드를 막는다. get(시간)은 시간을 넘기면 TimeoutException이고 작업은 계속 돈다'
    where: '질문 1'
  - topic: '모두 맡긴 뒤 모으면 가장 긴 것만큼, 맡기자마자 get하면 합만큼 걸린다'
    where: '질문 1'
  - topic: 'cancel과 isDone'
    where: '질문 1의 더 알아보기'
  - topic: '다른 스레드에서 난 예외는 get()에서 ExecutionException으로 감싸져 나온다. getCause()로 원래 예외를 꺼낸다'
    where: '질문 2. J10에서 받은 항목'
  - topic: 'CompletableFuture의 join()은 CompletionException(언체크)으로 감싼다'
    where: '질문 2'
  - topic: 'Future만으로는 결과를 잇거나 합치려면 get으로 기다려야 한다. CompletableFuture는 결과가 나오면 실행할 일을 미리 붙인다'
    where: '질문 3'
  - topic: 'supplyAsync, thenApply(값 바꾸기), thenCompose(다음 비동기 호출 잇기), thenCombine(둘 합치기), allOf(모두 기다리기)'
    where: '질문 3'
  - topic: 'thenApply와 thenApplyAsync가 실행되는 스레드'
    where: '질문 3의 더 알아보기'
  - topic: '앞 단계가 실패하면 뒤의 thenApply는 건너뛴다. exceptionally는 실패만, handle은 성공과 실패를 모두 받는다'
    where: '질문 4'
  - topic: 'orTimeout(시간을 넘기면 실패), completeOnTimeout(시간을 넘기면 기본값)'
    where: '질문 4'
  - topic: 'executor를 넘기지 않은 supplyAsync는 ForkJoinPool.commonPool에서 돈다. 블로킹 입출력에는 따로 만든 풀을 넘긴다'
    where: '실무에서는. 공용 풀은 스레드 풀(C7)'
  - topic: '스프링의 @Async가 CompletableFuture를 돌려주는 것'
    where: '다루지 않음: @Async(S14)'
  - topic: '요청 스레드의 ThreadLocal 값이 다른 스레드로 따라가지 않는 것'
    where: '다루지 않음: 스레드에 안전한 객체(C6)'
  - topic: '논블로킹과 리액티브 방식'
    where: '다루지 않음: 동기와 비동기, 블로킹과 논블로킹(C9), 웹플럭스(S16)'
codes:
  predict: |-
    var pool = Executors
        .newFixedThreadPool(3);
    // 각 호출은 300ms 걸린다
    Future<Order> o =
        pool.submit(() -> orderApi());
    Future<Delivery> d =
        pool.submit(() -> deliveryApi());
    Future<List<Coupon>> c =
        pool.submit(() -> couponApi());

    render(o.get(), d.get(), c.get());
  serial: |-
    Order o = pool.submit(
        () -> orderApi()).get();
    Delivery d = pool.submit(
        () -> deliveryApi()).get();
    List<Coupon> c = pool.submit(
        () -> couponApi()).get();
  timeout: |-
    Future<Order> f = pool.submit(
        () -> slowOrderApi()); // 2초
    f.get(500, MILLISECONDS);
  failGet: |-
    Future<Order> f = pool.submit(() -> {
      throw new IllegalStateException(
          "주문 없음");
    });
    try {
      f.get();
    } catch (ExecutionException e) {
      e.getCause(); // IllegalStateException
    }
  combine: |-
    var order = CompletableFuture
        .supplyAsync(() -> orderApi(), pool);
    var delivery = CompletableFuture
        .supplyAsync(() -> deliveryApi(), pool);

    var page = order.[[thenCombine]](
        delivery, Page::new);
  compose: |-
    CompletableFuture<Order> order =
        supplyAsync(() -> orderApi(), pool);

    // thenApply면 CF<CF<Coupon>>이 된다
    CompletableFuture<Coupon> coupon =
        order.[[thenCompose]](o ->
            couponApiAsync(o.couponId()));
  allOf: |-
    var all = CompletableFuture.allOf(
        order, delivery, coupons);
    all.join();
    // 셋 다 끝났다. join은 바로 돌아온다
    render(order.join(), delivery.join(),
           coupons.join());
  recover: |-
    supplyAsync(() -> couponApi(), pool)
        .orTimeout(500, MILLISECONDS)
        .[[exceptionally]](e -> List.of());
  commonPool: |-
    // executor를 넘기지 않으면
    CompletableFuture.supplyAsync(
        () -> callExternalApi());
    // ForkJoinPool.commonPool에서 돈다
predict:
  text: '코드 predict는 300ms 걸리는 호출 셋을 스레드 3개짜리 풀에 모두 맡긴 뒤, 차례로 `get()`해서 화면을 만들어요. `render`가 불릴 때까지 대략 얼마나 걸릴까요? 보기: 0.3초쯤 / 0.9초쯤 / 바로'
  answer: '0.3초쯤. 셋이 동시에 돌고, 첫 get이 기다리는 동안 나머지도 끝난다. 질문 1에서 밝힌다.'
questions:
  - id: q1
    title: 다른 스레드에 맡긴 일의 결과는 어떻게 받나요?
    conclusion:
      lead: '`submit`이 바로 돌려주는 `Future`를 들고 있다가, 결과가 필요할 때 `get()`으로 받아요. `get()`은 결과가 나올 때까지 부른 스레드를 기다리게 해요.'
      sub: '그래서 모두 맡긴 뒤에 모으면 가장 긴 작업만큼, 맡기자마자 하나씩 `get()`하면 모든 작업의 합만큼 걸려요.'
    says:
      - '`submit`은 작업이 끝나길 기다리지 않고 바로 `Future`를 돌려준다. `Future`는 "나중에 결과를 받을 표"다. submit이 돌아오는 데 걸린 시간을 재면 1ms 남짓이다'
      - '`get()`은 결과가 나와 있으면 바로 돌려주고, 아니면 나올 때까지 부른 스레드를 막는다(블로킹). 300ms 작업에 get하면 300ms 남짓 걸린다'
      - '예측의 답을 밝힌다. 코드 predict는 0.3초 남짓이다. 셋이 동시에 돌고, `o.get()`이 기다리는 동안 다른 둘도 끝나서 `d.get()`과 `c.get()`은 바로 돌아온다. 코드 serial은 맡기자마자 기다려서 0.9초 남짓이다. 실제 시간을 나란히 보인다'
      - '`get(시간)`은 그 시간까지만 기다리고 `TimeoutException`을 던진다. 코드 timeout은 500ms 뒤에 예외다. 작업은 멈추지 않고 계속 돈다. 멈추려면 `cancel`을 부른다'
      - '풀의 스레드보다 작업이 많으면 나머지는 큐에서 기다린다(C7). 스레드 2개 풀에 300ms 작업 4개를 넣고 모두 get하면 0.6초 남짓이다'
      - '더 알아보기: `isDone()`은 기다리지 않고 끝났는지만 알려 준다. `cancel(true)`는 실행 중인 스레드를 인터럽트하고, 그 뒤 `get()`은 `CancellationException`이다'
    widget:
      kind: toggle
      note: '고르기: 모두 맡긴 뒤 get(코드 predict), 맡기자마자 get(코드 serial), 스레드 2개 풀에 4개. 장면마다 gantt로 main과 풀 스레드의 막대(실행, 기다림)를 보이고, 걸린 시간을 실제 측정값으로 적는다'
    asks:
      - '본문의 예시: 코드 serial처럼 300ms 작업 셋을 맡기자마자 하나씩 `get()`했다. 걸리는 시간은 (0.9초쯤. 하나씩 기다린다)'
      - '옮긴 상황: 스레드 2개 풀에 각각 1초 걸리는 작업 5개를 모두 맡긴 뒤 차례로 get했다. 대략 얼마나 걸리나 (3초쯤. 두 개씩 세 번)'
  - id: q2
    title: 다른 스레드에서 난 예외는 어떻게 받나요?
    conclusion:
      lead: '작업에서 난 예외는 `Future`가 잡아 두었다가, `get()`을 부를 때 `ExecutionException`으로 감싸 던져요. 원래 예외는 `getCause()`로 꺼내요.'
      sub: '`submit`할 때는 아무 일도 없어서, `get()`을 부르지 않으면 예외를 끝내 모를 수 있어요. `CompletableFuture`의 `join()`은 같은 예외를 언체크 예외인 `CompletionException`으로 감싸요.'
    says:
      - '예외는 그것을 던진 스레드의 스택을 따라 올라간다(J10). 작업은 풀의 스레드에서 돌았으니, `try-catch`로 `submit`을 감싸도 잡히지 않는다. 풀의 스레드에서 난 예외는 `Future`가 잡아 둔다'
      - '코드 failGet. `get()`을 부르는 순간 `ExecutionException`이 나고, `getCause()`가 원래의 `IllegalStateException`이다. 실제 출력으로 보인다'
      - '`ExecutionException`은 체크 예외라 `get()`을 부르는 코드는 잡거나 던져야 한다. `InterruptedException`도 함께다'
      - '`get()`을 부르지 않으면 예외는 어디에도 찍히지 않는다(C7 질문 4). 결과가 필요 없는 작업이어도 실패를 알고 싶으면 작업 안에서 잡아 로그를 남긴다'
      - '`CompletableFuture`의 `join()`은 `CompletionException`으로 감싼다. 언체크 예외라 람다 안에서도 쓰기 편하다. `get()`을 부르면 똑같이 `ExecutionException`이다. 두 경우를 나란히 보인다'
    asks:
      - '본문의 예시: 코드 failGet에서 `f.get()`이 던지는 예외와 `getCause()`가 돌려주는 예외는 (ExecutionException, IllegalStateException)'
      - '옮긴 상황: `try { pool.submit(() -> parse(bad)); } catch (NumberFormatException e) { log(e); }`에서 parse가 NumberFormatException을 던진다. catch가 실행되나 (안 된다. 예외는 풀의 스레드에서 났고 Future 안에 있다)'
  - id: q3
    title: CompletableFuture는 결과를 어떻게 잇고 합치나요?
    conclusion:
      lead: '결과를 기다려 꺼내는 대신, 결과가 나오면 실행할 일을 미리 붙여 둬요. `thenApply`로 값을 바꾸고, `thenCompose`로 다음 비동기 호출을 잇고, `thenCombine`과 `allOf`로 여럿을 합쳐요.'
      sub: '`Future`로 같은 일을 하려면 중간마다 `get()`으로 스레드를 묶어 둬야 해요. `CompletableFuture`는 붙이는 동안 아무 스레드도 기다리지 않아요.'
    says:
      - '`Future`의 한계: 주문 결과로 쿠폰을 부르려면 `get()`으로 기다려야 한다. 두 결과를 합치려면 둘 다 `get()`이다. 기다리는 동안 그 스레드는 아무것도 못 한다'
      - '`CompletableFuture.supplyAsync(공급자, 풀)`은 작업을 풀에 맡기고 바로 돌려준다. 여기에 이어서 할 일을 붙인다'
      - '`thenApply(f)`: 결과 값을 f로 바꾼 새 CompletableFuture. 주문을 주문 번호로 바꾸는 것처럼 바로 계산되는 일'
      - '코드 compose. 다음 일이 또 비동기 호출이면 `thenCompose`다. `thenApply`로 하면 `CompletableFuture<CompletableFuture<Coupon>>`이 된다. 스트림의 `map`과 `flatMap`의 관계와 같다(J13)'
      - '코드 combine. 두 작업을 동시에 돌려 둘 다 끝나면 합친다. 각 300ms 두 작업이 0.3초 남짓에 합쳐진다. 실제 시간을 보인다'
      - '코드 allOf. 셋 이상은 `allOf`로 모두 끝나길 기다린 뒤 각자 `join()`으로 꺼낸다. 이미 끝났으니 바로 돌아온다. 300ms 셋이 0.3초 남짓이다'
      - '더 알아보기: `thenApply`의 함수는 앞 단계를 끝낸 스레드에서 이어서 실행된다(이미 끝나 있으면 붙인 스레드에서). `thenApplyAsync(f, pool)`는 지정한 풀에서 실행된다. 스레드 이름을 실제 출력으로 보인다'
    asks:
      - '본문의 예시: 주문 결과의 쿠폰 id로 `couponApiAsync(id)`(CompletableFuture를 돌려줌)를 이어 부를 때 `thenApply`를 쓰면 결과의 타입은 (`CompletableFuture<CompletableFuture<Coupon>>`. thenCompose를 써야 펼쳐진다)'
      - '옮긴 상황: 상품 정보(200ms)와 재고(400ms)를 함께 받아 하나로 합친다. thenCombine으로 합치면 대략 얼마나 걸리나. 풀의 스레드는 충분하다 (0.4초쯤. 둘 중 긴 것)'
  - id: q4
    title: CompletableFuture에서 실패와 시간 초과는 어떻게 다루나요?
    conclusion:
      lead: '앞 단계가 실패하면 뒤의 `thenApply`는 건너뛰고 실패가 끝까지 전해져요. `exceptionally`로 실패를 기본값으로 바꾸고, `orTimeout`이나 `completeOnTimeout`으로 기다리는 시간에 끝을 정해요.'
      sub: '`exceptionally`는 실패만 받고 `handle`은 성공과 실패를 모두 받아요. 끝을 정하지 않은 외부 호출은 응답이 없을 때 영원히 기다려요.'
    says:
      - '중간 단계에서 예외가 나면 그 뒤에 붙인 `thenApply`, `thenCombine`은 실행되지 않는다. 실패한 CompletableFuture가 끝까지 전해지고 `join()`에서 `CompletionException`이 난다. 뒤 단계가 실행된 횟수가 0인 것을 보인다'
      - '`exceptionally(e -> 기본값)`은 실패했을 때만 불려 기본값으로 바꾼다. 쿠폰 서비스가 죽어도 쿠폰 없이 화면을 보여 줄 수 있다'
      - '`handle((값, 예외) -> ...)`는 성공과 실패 모두에 불린다. 둘 가운데 하나만 null이 아니다'
      - '`orTimeout(500ms)`는 시간 안에 끝나지 않으면 `TimeoutException`으로 실패시킨다. `completeOnTimeout(기본값, 500ms)`는 기본값으로 끝낸다. 코드 recover처럼 이어 붙이면 느린 쿠폰 서비스를 0.5초에 끊고 빈 목록을 쓴다. 실제 결과를 보인다'
      - '두 메서드는 기다림만 끝낸다. 맡긴 작업은 풀에서 계속 돌 수 있다. 외부 호출 자체에도 연결과 응답 타임아웃을 준다(A10)'
    widget:
      kind: steps
      note: '주문, 배송, 쿠폰 세 호출을 합치는 흐름. selector로 시나리오: 모두 성공, 쿠폰이 예외, 쿠폰이 2초 걸림(orTimeout 500ms + exceptionally). 단계마다 각 호출의 상태(실행 중, 성공, 실패)와 합친 결과를 duo로 보이고, 실패가 뒤 단계를 건너뛰는 것과 exceptionally가 빈 목록으로 바꾸는 것을 log에 적는다'
    asks:
      - '본문의 예시: `supplyAsync(() -> { throw new RuntimeException(); }).thenApply(x -> x + 1).exceptionally(e -> -1).join()`의 결과는 (-1. thenApply는 건너뛰고 exceptionally가 바꾼다)'
      - '옮긴 상황: 추천 상품 API가 가끔 5초 넘게 걸린다. 화면은 1초 안에 나가야 하고 추천이 없으면 빈 목록이면 된다. 붙일 것을 고르면 (`completeOnTimeout(List.of(), 1, SECONDS)` 또는 `orTimeout` 뒤 `exceptionally`)'
      - '실무 구역: 요청 스레드에서 코드 commonPool처럼 executor 없이 2초 걸리는 외부 호출을 수십 개 맡겼다. 같은 JVM의 병렬 스트림은 어떻게 되나 (느려진다. 둘 다 크기가 작은 공용 풀을 함께 쓴다)'
practice:
  says:
    - '스프링 서비스에서 외부 호출 셋을 함께 보내는 코드: 빈으로 만든 `ThreadPoolTaskExecutor`(C7)를 주입받아 `supplyAsync(..., executor)`로 넘기고, `allOf`로 모아 응답을 만든다. 호출마다 `orTimeout`과 `exceptionally`를 붙여 하나가 느리거나 실패해도 응답이 나가게 한다'
    - '흔한 실수: 코드 commonPool처럼 executor를 넘기지 않는다. 블로킹 호출이 `ForkJoinPool.commonPool()`의 스레드를 붙잡는다. 공용 풀은 코어 수보다 하나 적은 크기라 금방 다 차고, 병렬 스트림과 다른 CompletableFuture까지 기다린다. 고친 코드: 입출력용 풀을 따로 만들어 넘긴다. 실행된 스레드의 이름(`ForkJoinPool.commonPool-worker-1`과 넘긴 풀의 이름)을 테스트로 남긴다'
    - '또 하나의 실수: 각 단계마다 바로 `join()`한다(질문 1의 serial과 같다). 함께 돌지 않아 합만큼 걸린다'
    - '`@Async` 메서드가 `CompletableFuture`를 돌려주면 같은 방법으로 잇는다. 기본 풀 설정의 함정은 S14'
claims:
  - claim: 'submit은 작업이 끝나길 기다리지 않고 바로 Future를 돌려준다'
    how: '300ms 작업의 submit이 50ms 안에 돌아오는지 본다'
    test: FutureTest.submitReturnsImmediately
  - claim: 'get은 작업이 끝날 때까지 부른 스레드를 막는다'
    how: '300ms 작업의 get이 250ms 넘게 걸리는지 본다'
    test: FutureTest.getBlocks
  - claim: 'get(500ms)는 2초 작업에서 TimeoutException이고 작업은 끝나지 않은 채 남아 있다'
    how: '예외 뒤 isDone이 false인지 본다'
    test: FutureTest.getTimeout
  - claim: '작업의 예외는 get에서 ExecutionException으로 감싸져 나오고 getCause가 원래 예외다'
    how: '코드 failGet을 돌린다'
    test: FutureTest.exceptionWrapped
  - claim: 'cancel(true)는 실행 중인 스레드를 인터럽트하고, 그 뒤 get은 CancellationException이다'
    how: 'sleep하는 작업을 cancel한다'
    test: FutureTest.cancelInterrupts
  - claim: '모두 맡긴 뒤 get하면 300ms 셋이 0.55초 안에, 하나씩 get하면 0.9초 넘게 걸린다'
    how: '두 방법의 시간을 잰다'
    test: FutureTest.submitAllThenGet
  - claim: '스레드 2개 풀에 300ms 작업 4개를 넣고 모두 get하면 0.6초 넘게 걸린다'
    how: '시간을 잰다'
    test: FutureTest.queueWhenPoolFull
  - claim: 'join은 CompletionException, get은 ExecutionException으로 감싼다'
    how: '실패한 CompletableFuture에 둘을 부른다'
    test: CompletableFutureTest.getVsJoin
  - claim: 'thenCombine으로 300ms 두 작업을 0.55초 안에 합친다. allOf로 셋을 모아도 같다'
    how: '시간을 잰다'
    test: CompletableFutureTest.thenCombineParallel
  - claim: 'thenCompose는 다음 비동기 호출을 펼쳐 잇는다'
    how: '결과의 타입과 값을 본다'
    test: CompletableFutureTest.thenComposeFlattens
  - claim: '중간 단계가 실패하면 뒤의 thenApply는 실행되지 않고 join이 CompletionException을 던진다'
    how: '뒤 단계의 실행 횟수를 센다'
    test: CompletableFutureTest.failureSkipsStages
  - claim: 'exceptionally는 실패만 바꾸고, handle은 성공과 실패 모두에 불린다'
    how: '두 경우를 돌린다'
    test: CompletableFutureTest.exceptionallyAndHandle
  - claim: 'orTimeout은 시간을 넘기면 TimeoutException으로 실패시키고, completeOnTimeout은 기본값으로 끝낸다'
    how: '2초 작업에 500ms를 준다'
    test: CompletableFutureTest.timeouts
  - claim: 'executor 없는 supplyAsync는 ForkJoinPool.commonPool에서, 넘기면 그 풀에서 돈다. thenApplyAsync는 지정한 풀에서 돈다'
    how: '스레드 이름을 남긴다'
    test: CompletableFutureTest.whichThread
sources:
  - '`Future`: API 문서 https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/concurrent/Future.html'
  - '`ExecutionException`: API 문서 https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/concurrent/ExecutionException.html'
  - '`CompletableFuture`: API 문서 https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/concurrent/CompletableFuture.html'
  - '`CompletionStage`의 이어 붙이기 규칙: API 문서 https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/concurrent/CompletionStage.html'
  - '공용 풀: `ForkJoinPool` API 문서 https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/concurrent/ForkJoinPool.html'
