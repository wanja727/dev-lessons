      - p: '처음 예측의 답은 **거절된다**예요. {{predict-result}} 작업을 넣을 때마다 스레드 수와 큐의 길이를 실제로 셌어요.'
      - ci:
          key: predict
          label: 실제 출력 보기
          source: ThreadPoolOutputTest.predictExample
          code: predict
      - callout: '많은 사람이 "바쁘면 max까지 늘고 그다음 큐"라고 생각해요. 실제는 **큐가 먼저**예요. 큐를 1000칸으로 두면 작업이 1000개 쌓이기 전에는 스레드가 core에서 늘지 않아요.'
      - p: 'core보다 많은 스레드는 keepAlive(코드의 60초) 동안 일이 없으면 줄어들어요.'
      - h3: 거절될 때 무엇을 할까요
      - table:
          head: [거절 정책, 하는 일]
          rows:
            - ['`AbortPolicy` (기본)', '`RejectedExecutionException`을 던져요']
            - ['`CallerRunsPolicy`', '작업을 넣은 스레드가 직접 실행해요. 넣는 쪽이 느려져 자연스럽게 속도가 줄어요']
            - ['`DiscardPolicy`', '조용히 버려요']
            - ['`DiscardOldestPolicy`', '큐에서 가장 오래된 것을 버리고 넣어요']
      - ci:
