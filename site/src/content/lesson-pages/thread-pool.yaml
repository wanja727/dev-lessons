  test: https://github.com/wanja727/dev-lessons/blob/main/verification/src/test/java/lab/devlessons/threadpool/ThreadPoolTest.java
  outputTest: https://github.com/wanja727/dev-lessons/blob/main/verification/src/test/java/lab/devlessons/threadpool/ThreadPoolOutputTest.java
  tpe: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/concurrent/ThreadPoolExecutor.html
  executors: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/concurrent/Executors.html
  executorService: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/concurrent/ExecutorService.html
  blockingQueue: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/concurrent/BlockingQueue.html
  forkJoin: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/concurrent/ForkJoinPool.html
  springScheduling: https://docs.spring.io/spring-framework/reference/integration/scheduling.html
  bootTask: https://docs.spring.io/spring-boot/reference/features/task-execution-and-scheduling.html
predict:
  title: 일곱째 작업은 어디로
  text: 'core 2, max 4, 큐 2칸인 풀에 오래 걸리는 작업을 하나씩 7개 넣어요. 일곱째 작업은 어떻게 될까요? 답은 질문 2에 나와요.'
  code: predict
  label: 내 예측
  options:
    - value: queue
      label: 큐에서 기다린다
    - value: thread
      label: 새 스레드가 만들어져 실행된다
    - value: reject
      label: RejectedExecutionException으로 거절된다
  answer: reject
  storageKey: thread-pool-predict-v2
  wrong: 예측은 "{label}"이었어요. 틀린 예측이 더 오래 남으니 괜찮아요.
questions:
  - id: q1
    title: 스레드를 매번 만들지 않고 스레드 풀을 쓰는 이유는 무엇인가요?
    conclusion:
      lead: '스레드를 미리 몇 개 만들어 두고 작업을 받아 다시 쓰면, 만드는 비용을 아끼고 스레드 수가 끝없이 늘지 않게 막을 수 있어요.'
      sub: '할 일은 결과가 없으면 `Runnable`, 결과가 있으면 `Callable`로 넘겨요. 풀은 작업을 큐에 받아 두고 쉬는 스레드가 꺼내 실행해요.'
    says:
      - '스레드 하나를 만들면 운영체제의 스레드와 스택 메모리(J14)가 생긴다. 작업마다 만들면 그 비용을 매번 치르고, 작업이 몰리면 스레드가 작업 수만큼 생겨 메모리와 전환 비용(C2)이 커진다'
      - '스레드 풀은 스레드를 정한 수만큼 두고, 작업을 큐에 받는다. 쉬는 스레드가 큐에서 꺼내 실행하고 끝나면 다음 것을 꺼낸다'
      - '코드 reuse. 작업 20개를 스레드 2개짜리 풀에 넣으면 기록된 스레드 이름은 두 가지뿐이다(`pool-1-thread-1`, `thread-2`). 실제 출력으로 보인다'
      - '코드 callable. 결과가 없는 일은 `Runnable`로 `execute`한다. 결과가 필요하면 `Callable`을 `submit`하고 `Future`를 받는다. `Future`로 결과를 받는 법은 C8에서 다룬다'
      - '이름 정리: `Executor`는 "작업을 실행한다"(execute)만 가진 인터페이스, `ExecutorService`는 submit과 종료를 더한 것, `ThreadPoolExecutor`는 스레드 풀 구현이다. `Executors`는 이것들을 만들어 주는 도구 클래스다'
    asks:
      - '본문의 예시: 작업 20개를 `newFixedThreadPool(2)`에 넣었다. 작업을 실행한 스레드는 몇 가지인가 (2가지. 같은 스레드를 다시 쓴다)'
      - '옮긴 상황: 읽지 않은 메일 수를 다른 스레드에서 세어 그 숫자를 받아 쓰고 싶다. `Runnable`과 `Callable` 가운데 무엇으로 넘기나 (Callable. 값을 돌려준다)'
    body:
      - p: '스레드 하나를 만들면 운영체제의 스레드와 스택 메모리가 생겨요(JVM 메모리 구조 레슨). 작업마다 `new Thread`로 만들면 그 비용을 매번 치르고, 작업이 몰리면 스레드가 작업 수만큼 생겨 메모리와 전환 비용(컨텍스트 스위칭 레슨)이 커져요.'
      - p: '**스레드 풀**은 스레드를 정한 수만큼 두고 작업을 **큐**에 받아요. 쉬는 스레드가 큐에서 꺼내 실행하고, 끝나면 다음 것을 꺼내요. 스레드는 버리지 않고 다시 써요.'
      - code: reuse
      - ci:
          key: reuse
          label: 실행한 스레드의 실제 이름 보기
          source: ThreadPoolTest.reusesThreads
      - p: '작업은 20개인데 스레드 이름은 두 가지뿐이에요.'
      - h3: 할 일을 넘기는 두 가지
      - code: callable
      - ul:
          - '결과가 없는 일은 `Runnable`로 `execute`해요.'
          - '결과가 필요하면 `Callable`을 `submit`하고 `Future`를 받아요. `Future`로 결과를 받는 법은 Future와 CompletableFuture 레슨에서 다뤄요.'
      - muted: '이름 정리: `Executor`는 "작업을 실행한다"(execute)만 가진 인터페이스, `ExecutorService`는 submit과 종료를 더한 것, `ThreadPoolExecutor`는 스레드 풀 구현이에요. `Executors`는 이것들을 만들어 주는 도구 클래스예요.'
      - quiz:
          q: '작업 20개를 `newFixedThreadPool(2)`에 넣었어요. 작업을 실행한 스레드는 몇 가지일까요?'
          options:
            - 20가지
            - 2가지
            - 1가지
          answer: 2
          explain: '풀은 스레드 2개를 만들어 두고 다시 써요. 실제 출력에서도 이름이 둘뿐이었어요.'
      - next: '스레드가 모두 바쁠 때 작업이 계속 들어오면 풀은 어떻게 할까요?'
    recall: '스레드를 미리 몇 개 만들어 두고 작업을 받아 다시 쓰면, 만드는 비용을 아끼고 스레드 수가 끝없이 늘지 않게 막을 수 있어요. 할 일은 결과가 없으면 `Runnable`을 `execute`로, 결과가 있으면 `Callable`을 `submit`으로 넘겨요. 풀은 작업을 큐에 받아 두고 쉬는 스레드가 꺼내 실행해요.'
  - id: q2
    title: 작업이 몰리면 스레드 풀은 어떤 순서로 받나요?
    conclusion:
      lead: '기본 스레드(core)가 다 바쁘면 큐에 넣고, 큐가 가득 차야 최대(max)까지 스레드를 늘리고, 그것도 다 차면 거절해요.'
      sub: '큐가 먼저라서 큐가 크면 스레드는 core보다 늘지 않아요. 거절될 때 무엇을 할지는 거절 정책으로 정해요.'
    says:
      - '`ThreadPoolExecutor`가 작업을 받을 때: 1) 스레드가 core보다 적으면 새 스레드를 만들어 실행 2) 아니면 큐에 넣기 3) 큐가 가득이면 max까지 새 스레드 4) 그것도 안 되면 거절'
      - '예측의 답을 밝힌다. 작업을 하나씩 넣을 때마다 스레드 수와 큐의 길이를 실제 출력으로 보인다. 1, 2는 스레드, 3, 4는 큐, 5, 6은 늘린 스레드, 7은 `RejectedExecutionException`'
      - '많은 사람이 "바쁘면 max까지 늘고 그다음 큐"라고 생각한다. 실제는 큐가 먼저다. 큐를 1000칸으로 두면 작업이 1000개 쌓이기 전에는 스레드가 core에서 늘지 않는다'
      - 'core보다 많은 스레드는 keepAlive(코드의 60초) 동안 일이 없으면 줄어든다'
      - '거절 정책: `AbortPolicy`(기본. 예외를 던진다), `CallerRunsPolicy`(넣은 스레드가 직접 실행한다. 넣는 쪽이 느려져 자연스럽게 속도를 줄인다), `DiscardPolicy`(조용히 버린다), `DiscardOldestPolicy`(큐의 가장 오래된 것을 버리고 넣는다). `CallerRunsPolicy`에서 일곱째 작업을 main 스레드가 실행하는 것을 테스트로 보인다'
    widget:
      kind: steps
      note: 'core 2, max 4, 큐 2칸. "작업 넣기" 버튼을 누를 때마다 작업 1~7을 넣는다. duo 왼쪽은 스레드(실행 중인 작업), 오른쪽은 큐. log에 그 작업이 간 곳(새 스레드, 큐, 늘린 스레드, 거절). 일곱째는 bad로 거절. 실제 출력의 순서와 같게 맞춘다'
    asks:
      - '본문의 예시: core 2, max 4, 큐 2칸인 풀에 오래 걸리는 작업을 하나씩 넣는다. 다섯째 작업을 넣은 직후 스레드 수와 큐의 길이는 (스레드 3개, 큐 2개)'
      - '옮긴 상황: core 4, max 20, 큐 1000칸인 풀에 오래 걸리는 작업 500개를 한꺼번에 넣었다. 스레드는 몇 개까지 늘어나나 (4개. 큐가 차지 않아 max까지 늘지 않는다)'
    body:
      - p: '`ThreadPoolExecutor`가 작업을 받을 때의 순서예요([API 문서](link:tpe)).'
      - ol:
          - '스레드가 **core**보다 적으면 새 스레드를 만들어 실행해요.'
          - '아니면 **큐**에 넣어요.'
          - '큐가 가득이면 **max**까지 새 스레드를 만들어요.'
          - '그것도 안 되면 **거절**해요.'
      - widget:
          kind: steps
          layout: [duo, log, buttons, verdict]
          buttons: each
          initial:
            duo:
              - {label: '스레드 (core 2, max 4)', state: dim, text: 없음}
              - {label: '큐 (2칸)', state: dim, text: 비어 있음}
          scenarios:
            default:
              - label: 작업 1 넣기
                log: '작업 1 → 스레드가 core보다 적어 새 스레드'
                duo:
                  - {label: '스레드 (core 2, max 4)', rows: [{k: 스레드 1, v: 작업 1, mark: changed}]}
                  - {label: '큐 (2칸)', text: 비어 있음}
              - label: 작업 2 넣기
                log: '작업 2 → 새 스레드 (core를 채움)'
                duo:
