# 싱글톤 패턴 (설계서)
# 자료 파일의 칸은 docs/lesson-data-format.md에 있다.
stage: design
title: 싱글톤 패턴
unit: 객체지향 설계와 패턴
roadmap: O11
type: 설계
prerequisites:
  - {slug: dip-di, title: 의존 역전 원칙과 의존성 주입}
  - {slug: static-initialization, title: static과 초기화 순서}
assume: '자바 21. static 필드와 클래스가 처음 쓰일 때 초기화되는 것(static과 초기화 순서 레슨), enum 상수가 하나뿐인 객체라는 것(enum 레슨), 생성자로 주입받는 것(의존 역전 원칙과 의존성 주입 레슨). 스레드 두 개가 같은 코드를 동시에 실행할 수 있다는 정도만 알면 돼요.'
example: '쇼핑몰의 설정 저장소 `AppConfig`(설정 파일을 읽는 데 시간이 걸려서 하나만 두고 싶다)와 그것을 쓰는 `OrderService`. 싱글톤을 네 가지 방법으로 만들고, 두 스레드가 동시에 처음 꺼낼 때와 테스트에서 가짜로 바꿀 때 무슨 일이 생기는지 봐요.'
intro:
  - '설정을 읽는 객체를 하나만 만들려고 `getInstance()`를 만들었어요. 그런데 서버를 띄운 직후 요청이 몰리자 설정 파일을 읽었다는 로그가 두 번 찍혔어요. 다른 날에는 테스트 하나가 설정을 바꿔 놓아서, 그 뒤에 돌린 테스트들이 순서에 따라 실패했어요.'
  - '싱글톤은 "객체를 하나만 두고 어디서나 꺼내 쓴다"는 패턴이에요. 스프링 빈도 기본이 싱글톤이라서 "싱글톤 패턴과 스프링 싱글톤은 무엇이 다른가요"는 면접 단골이에요. 직접 만드는 법, 스레드에서 안전한지, 왜 테스트하기 어려운지를 알면 이 질문에 답할 수 있어요.'
  - '이 레슨에서는 싱글톤을 만드는 네 방법을 같은 조건(두 스레드가 동시에 처음 꺼낸다)에서 돌려 몇 개가 만들어지는지 세고, 스프링 컨테이너에서 같은 클래스를 꺼내 보며 차이를 확인해요.'
covers:
  - topic: '싱글톤 패턴: 클래스가 객체를 하나만 만들게 막고, 그 하나를 꺼내는 곳을 제공한다'
    where: '질문 1'
  - topic: '만드는 법: private 생성자와 public static final 필드(미리 만들기)'
    where: '질문 1'
  - topic: '처음 쓸 때 만들기(늦은 초기화)를 if (instance == null)로 하면'
    where: '질문 1, 질문 2'
  - topic: '홀더 클래스 방식: 중첩 클래스는 처음 쓰일 때 초기화되고, JVM이 클래스 초기화를 한 번만 하도록 지킨다'
    where: '질문 1. 클래스 초기화 시점은 static과 초기화 순서(J5)'
  - topic: 'enum 싱글톤: 상수가 하나뿐인 enum. 리플렉션으로도 하나를 더 만들 수 없다'
    where: '질문 1. enum의 문법은 enum(J8)'
  - topic: 'if (instance == null) 방식은 두 스레드가 동시에 처음 부르면 둘 이상 만들어진다'
    where: '질문 2. 경쟁 상태의 원리는 경쟁 상태와 동기화(C3)'
  - topic: 'synchronized getInstance와 이중 검사 잠금(volatile)'
    where: '질문 2의 더 알아보기'
  - topic: 'private 생성자 싱글톤은 리플렉션의 setAccessible로 하나를 더 만들 수 있다'
    where: '질문 2의 더 알아보기'
  - topic: '테스트하기 어려운 이유: 쓰는 쪽이 getInstance()에 묶여 가짜로 바꿀 수 없고, 상태가 테스트 사이에 남는다'
    where: '질문 3'
  - topic: '전역 상태가 숨은 의존이 된다. 생성자에 드러나지 않는다'
    where: '질문 3'
  - topic: '스프링 싱글톤: 컨테이너 하나에 빈 하나. 클래스가 막는 것이 아니라 컨테이너가 하나만 만든다. new로는 더 만들 수 있다'
    where: '질문 4'
  - topic: '싱글톤 객체에 바뀌는 상태를 두면 여러 스레드가 함께 바꾼다'
    where: '실무에서는. 싱글톤 빈의 상태는 빈의 생명주기와 스코프(S3)'
  - topic: '빈 스코프(prototype, request)'
    where: '다루지 않음: 빈의 생명주기와 스코프(S3)'
codes:
  eager: |-
    class AppConfig {
      static final AppConfig INSTANCE =
          new AppConfig();

      private AppConfig() {
        // 설정 파일을 읽는다
      }
    }
  lazy: |-
    class AppConfig {
      private static AppConfig instance;

      private AppConfig() {...}

      static AppConfig getInstance() {
        if (instance == null) {
          instance = new AppConfig();
        }
        return instance;
      }
    }
  holder: |-
    class AppConfig {
      private AppConfig() {...}

      private static class Holder {
        static final AppConfig INSTANCE =
            new AppConfig();
      }

      static AppConfig getInstance() {
        return Holder.INSTANCE;
      }
    }
  enumSingleton: |-
    enum AppConfig {
      INSTANCE;

      String get(String key) {...}
    }
  hidden: |-
    class OrderService {
      int shippingFee() {
        return AppConfig.getInstance()
            .getInt("shipping.fee");
      }
    }
  injected: |-
    class OrderService {
      private final AppConfig config;

      OrderService(AppConfig config) {
        this.config = config;
      }
    }
predict:
  text: '코드 lazy의 생성자는 설정 파일을 읽느라 0.1초가 걸려요. 서버를 띄운 직후 두 스레드가 동시에 `getInstance()`를 처음 불러요. `AppConfig` 객체는 몇 개 만들어질까요? 보기: 항상 1개, 2개가 될 수 있다, 항상 2개.'
  answer: '2개가 될 수 있다. 두 스레드가 모두 `instance == null`을 확인한 뒤 각자 `new`를 한다. 질문 2에서 밝힌다.'
questions:
  - id: q1
    title: 싱글톤은 어떻게 만드나요?
    conclusion:
      lead: '생성자를 `private`으로 막고, 만든 하나를 `static`으로 들고 있다가 꺼내 줘요. 미리 만들기, 처음 쓸 때 만들기, 홀더 클래스, enum 네 가지 방법이 있어요.'
      sub: '스레드에 안전하면서 처음 쓸 때 만드는 방법은 홀더 클래스와 enum이에요. JVM이 클래스 초기화를 한 번만 하기 때문이에요.'
    says:
      - '공통: 생성자가 `private`이라 밖에서 `new AppConfig()`를 쓰면 컴파일 오류다. 객체를 만드는 곳이 클래스 안 한 곳이 된다'
      - '미리 만들기(코드 eager): 클래스가 초기화될 때 만든다. 클래스 초기화는 JVM이 한 번만 하므로 스레드에 안전하다. 쓰지 않아도 만든다'
      - '처음 쓸 때 만들기(코드 lazy): `getInstance()`가 처음 불릴 때 만든다. 한 스레드에서는 하나만 만들어진다. 여러 스레드에서는 질문 2'
      - '홀더 클래스(코드 holder): `Holder`는 `getInstance()`가 처음 `Holder.INSTANCE`를 읽을 때 초기화된다. `AppConfig`의 다른 static 멤버를 써도 `Holder`는 초기화되지 않는다. 테스트로 초기화 시점을 찍는다'
      - 'enum(코드 enumSingleton): 상수가 하나인 enum이다. 상수는 enum 클래스가 초기화될 때 한 번 만들어진다. 직렬화와 리플렉션으로도 하나를 더 만들 수 없다'
    asks:
      - '본문의 예시: 코드 holder에서 `AppConfig`의 다른 static 메서드를 먼저 부르면 `AppConfig` 객체가 만들어지나 (아니다. `Holder`가 초기화될 때 만들어진다)'
      - '옮긴 상황: `class IdGenerator { private IdGenerator() {} }`가 있다. 다른 클래스에서 `new IdGenerator()`를 쓰면 (컴파일 오류)'
  - id: q2
    title: 여러 스레드에서 써도 하나만 만들어지나요?
    conclusion:
      lead: '`if (instance == null)`로 처음 쓸 때 만드는 방식은 아니에요. 두 스레드가 동시에 처음 부르면 둘 이상 만들어질 수 있어요.'
      sub: '미리 만들기, 홀더 클래스, enum은 JVM의 클래스 초기화에 기대서 하나만 만들어져요.'
    says:
      - '예측의 답을 밝힌다. 두 스레드가 동시에 `instance == null`을 본다. 둘 다 null이라 둘 다 `new`를 한다. 생성자가 0.1초 걸리면 그 사이에 다른 스레드가 같은 확인을 통과한다'
      - '테스트: 두 스레드를 같은 순간에 출발시켜 `getInstance()`를 부르고 생성자가 불린 횟수를 센다. 코드 lazy는 2, 코드 holder와 enum은 1이다. 같은 조건을 여러 번 돌려 lazy가 2인 경우가 나오는 것을 보인다'
      - '두 객체가 생기면 한 스레드는 다른 설정 객체를 들고 간다. 설정을 바꾸는 코드가 있으면 서로 다른 값을 본다'
      - '홀더 클래스와 enum이 안전한 이유: 자바 언어 명세는 클래스 초기화를 한 스레드만 하고 나머지는 기다리게 정해 두었다'
      - '더 알아보기: `getInstance()`에 `synchronized`를 붙이면 안전하지만 부를 때마다 락을 잡는다. 이중 검사 잠금은 필드를 `volatile`로 둬야 안전하다. 왜 그런지는 경쟁 상태와 동기화(C3)'
      - '더 알아보기: private 생성자는 리플렉션의 `setAccessible(true)`로 부를 수 있어 객체가 하나 더 생긴다. enum의 생성자를 리플렉션으로 부르면 `IllegalArgumentException`("Cannot reflectively create enum objects")이 난다'
    widget:
      kind: steps
      note: '두 스레드 A와 B가 코드 lazy의 `getInstance()`를 동시에 처음 부르는 장면을 한 단계씩 실행한다. 단계: A가 null 확인, B가 null 확인, A가 new(생성자 0.1초), B가 new, A가 instance에 넣기, B가 instance에 넣기. 단계마다 instance 필드의 값과 지금까지 만든 객체 수를 보여 준다. 시나리오를 "코드 lazy"와 "코드 holder"로 고르면 holder에서는 B가 클래스 초기화를 기다리다 A가 만든 객체를 받는다'
    asks:
      - '본문의 예시: 코드 lazy에서 두 스레드가 모두 null을 확인한 뒤 각자 생성자를 부르면 만들어진 객체 수와 마지막에 `instance`에 남는 것은 (2개. 늦게 넣은 스레드의 것)'
      - '옮긴 상황: 다음 가운데 여러 스레드가 동시에 처음 불러도 객체가 하나만 만들어지는 것은? 보기: `if (x == null) x = new X();`로 만드는 getInstance / static final 필드에 미리 만든 것 / 매번 `new X()`를 돌려주는 getInstance (둘째)'
  - id: q3
    title: 싱글톤은 왜 테스트하기 어렵나요?
    conclusion:
      lead: '쓰는 쪽이 `getInstance()`를 직접 불러서 가짜로 바꿀 수 없고, 하나뿐인 객체의 상태가 테스트 사이에 남기 때문이에요.'
      sub: '싱글톤을 생성자로 주입받게 바꾸면 테스트에서는 가짜를, 운영에서는 그 하나를 넣을 수 있어요.'
    says:
      - '코드 hidden의 `OrderService`는 메서드 안에서 `AppConfig.getInstance()`를 부른다. 배송비 설정이 5000원일 때를 테스트하려면 진짜 설정 파일을 바꿔야 한다. 의존 역전 원칙과 의존성 주입에서 본 "안에서 직접 만들기"와 같은 문제다'
      - '숨은 의존: `OrderService`의 생성자만 봐서는 설정에 기대는 것이 보이지 않는다'
      - '상태가 남는다: 한 테스트가 `AppConfig.getInstance().set("shipping.fee", "0")`을 하면 같은 JVM의 다음 테스트도 0을 본다. 테스트 순서를 바꾸면 결과가 달라진다. 테스트로 두 순서를 돌린다'
      - '고친 코드(코드 injected): `OrderService`는 `AppConfig`를 생성자로 받는다. 하나만 두는 일은 조립하는 곳이 한다. 테스트는 설정 값을 정한 객체를 넣는다'
    asks:
      - '본문의 예시: 코드 hidden에서 배송비 설정이 다른 경우를 테스트하려면 `OrderService`를 고치지 않고 할 수 있나 (없다. getInstance를 바꿀 길이 없다)'
      - '옮긴 상황: 테스트 A가 싱글톤 카운터를 3 올리고 테스트 B가 카운터가 0인지 확인한다. 같은 JVM에서 A 다음 B를 돌리면 B는 (실패한다. 카운터가 3이다)'
  - id: q4
    title: 스프링의 싱글톤은 싱글톤 패턴과 무엇이 다른가요?
    conclusion:
      lead: '스프링 싱글톤은 클래스가 막는 것이 아니라 컨테이너가 빈을 하나만 만들어 나눠 주는 것이에요.'
      sub: '그래서 클래스는 평범하게 두고 생성자로 주입받을 수 있어요. 대신 `new`로는 얼마든지 더 만들 수 있고, 컨테이너가 둘이면 빈도 둘이에요.'
    says:
      - '`@Component`를 붙인 `AppConfig`를 컨테이너에서 두 번 꺼내면 같은 객체다(`==`가 true). 주입받은 `OrderService` 두 곳도 같은 객체를 받는다'
      - '같은 클래스를 `new AppConfig()`로 만들면 컴파일되고 다른 객체다. 생성자가 public이기 때문이다'
      - '컨테이너를 둘 만들면 각 컨테이너에 하나씩 있다. 스프링 싱글톤은 "컨테이너마다 하나"다. 싱글톤 패턴은 "클래스 로더마다 하나"다'
      - '스프링을 쓰면 싱글톤 패턴을 직접 만들 일은 드물다. 하나만 두는 일은 컨테이너에 맡기고, 클래스는 질문 3의 코드 injected처럼 주입받는다'
    asks:
      - '본문의 예시: 같은 컨테이너에서 `getBean(AppConfig.class)`를 두 번 부른 결과를 `==`로 비교하면 (true)'
      - '옮긴 상황: 스프링 빈인 `PriceService`를 테스트 코드에서 `new PriceService()`로 만들었다. 이 객체는 컨테이너의 빈과 같은 객체인가 (아니다. 새 객체다)'
      - '실무 구역: 싱글톤 빈 `OrderService`의 필드 `private int lastTotal`에 요청마다 주문 금액을 넣고 다음 줄에서 읽는다. 두 요청이 동시에 오면 무슨 일이 생길 수 있나 (다른 요청의 금액을 읽는다)'
practice:
  says:
    - '스프링에서 빈은 기본이 싱글톤 스코프다. 직접 `getInstance()`를 만들지 않고 `@Component`나 `@Bean`으로 등록한다. `AnnotationConfigApplicationContext`로 같은 빈인지 확인한다'
    - '흔한 실수: 싱글톤 빈의 필드에 요청마다 바뀌는 값(현재 주문 금액, 로그인한 회원)을 둔다. 모든 요청이 같은 객체를 쓰므로 두 요청이 동시에 오면 값이 섞인다. 고친 코드: 그 값은 지역 변수나 메서드 인자로 다룬다. 두 스레드로 같은 빈을 부르는 테스트로 섞이는 것을 보인다'
    - '왜 섞이는지(경쟁 상태)는 경쟁 상태와 동기화(C3)에서, 빈의 스코프는 빈의 생명주기와 스코프(S3)에서 다룬다'
claims:
  - claim: '두 스레드가 동시에 처음 부르면 코드 lazy는 생성자가 2번 불리는 경우가 생기고, 홀더와 enum과 미리 만들기는 항상 1번이다'
    how: '`CountDownLatch`로 두 스레드를 함께 출발시키고, 생성자에서 0.1초 쉬며 생성 횟수를 센다. 여러 번 돌린다'
  - claim: '홀더 방식은 바깥 클래스의 다른 static 메서드를 불러도 객체를 만들지 않는다'
    how: '생성자에서 기록을 남겨 확인한다'
  - claim: 'private 생성자 싱글톤은 리플렉션으로 하나 더 만들어지고, enum은 `IllegalArgumentException`'
    how: '`Constructor.newInstance`로 확인한다'
  - claim: '싱글톤의 상태가 남아 테스트 순서에 따라 결과가 달라진다'
    how: '두 순서로 같은 동작을 돌려 결과를 비교한다'
  - claim: '스프링 컨테이너에서 두 번 꺼낸 빈은 같은 객체, `new`는 다른 객체, 컨테이너 둘은 빈 둘'
    how: '`AnnotationConfigApplicationContext`로 확인한다'
  - claim: '싱글톤 빈의 필드에 요청 값을 두면 두 스레드가 다른 값을 읽는다'
    how: '두 스레드로 같은 빈을 부르고 래치로 순서를 맞춰 확인한다'
sources:
  - '클래스 초기화는 한 번, 한 스레드가 한다: 자바 언어 명세 12.4.2 https://docs.oracle.com/javase/specs/jls/se21/html/jls-12.html#jls-12.4.2'
  - 'enum은 리플렉션으로 만들 수 없다: 자바 언어 명세 8.9 https://docs.oracle.com/javase/specs/jls/se21/html/jls-8.html#jls-8.9'
  - '스프링 싱글톤 스코프: 스프링 공식 문서 https://docs.spring.io/spring-framework/reference/core/beans/factory-scopes.html#beans-factory-scopes-singleton'
