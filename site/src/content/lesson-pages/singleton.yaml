  test: https://github.com/wanja727/dev-lessons/blob/main/verification/src/test/java/lab/devlessons/singleton/SingletonTest.java
  jlsInit: https://docs.oracle.com/javase/specs/jls/se21/html/jls-12.html#jls-12.4.2
  jlsEnum: https://docs.oracle.com/javase/specs/jls/se21/html/jls-8.html#jls-8.9
