codes:
  eager: |-
    class AppConfig {
      static final AppConfig INSTANCE =
          new AppConfig();

      private AppConfig() {
        // 설정 파일을 읽는다
      }
    }
  lazy: |-
    class AppConfig {
      private static AppConfig instance;

      private AppConfig() {...}

      static AppConfig getInstance() {
        if (instance == null) {
          instance = new AppConfig();
        }
        return instance;
      }
    }
  holder: |-
    class AppConfig {
      private AppConfig() {...}

      private static class Holder {
        static final AppConfig INSTANCE =
            new AppConfig();
      }

      static AppConfig getInstance() {
        return Holder.INSTANCE;
      }
    }
  enumSingleton: |-
    enum AppConfig {
      INSTANCE;

      String get(String key) {...}
    }
  hidden: |-
    class OrderService {
      int shippingFee() {
        return AppConfig.getInstance()
            .getInt("shipping.fee");
      }
    }
  injected: |-
    class OrderService {
      private final AppConfig config;

      OrderService(AppConfig config) {
        this.config = config;
      }
    }
  # 여기부터는 본문 단계에서 더한 코드다
  lazyMark: |-
    static AppConfig getInstance() {
      [[if (instance == null)]] {
        [[instance = new AppConfig()]];
      }
      return instance;
    }
  holderMark: |-
    class AppConfig {
      private AppConfig() {...}

      private static class [[Holder]] {
        static final AppConfig INSTANCE =
            new AppConfig();
      }

      static AppConfig getInstance() {
        return [[Holder.INSTANCE]];
      }
    }
  stateTest: |-
    // 테스트 A
    AppConfig.getInstance()
        .set("shipping.fee", "0");

    // 테스트 B
    assertThat(AppConfig.getInstance()
        .getInt("shipping.fee"))
        .isEqualTo(3000);
  springBean: |-
    @Component
    class AppConfig {...}

    @Service
    class OrderService {
      private final AppConfig config;

      OrderService(AppConfig config) {
        this.config = config;
      }
    }
  statefulBad: |-
    @Service
    class OrderService {
      private int lastTotal;

      int order(Order order) {
        lastTotal = order.total();
        // ... 다른 일
        return lastTotal;
      }
    }
  statefulGood: |-
    @Service
    class OrderService {
      int order(Order order) {
        int total = order.total();
        // ... 다른 일
        return total;
      }
    }
predict:
  title: 두 스레드가 동시에 처음 꺼내면 몇 개가 만들어질까요?
  text: '`getInstance()`는 `instance`가 null이면 새로 만들어요. 생성자는 설정 파일을 읽느라 0.1초가 걸려요. 서버를 띄운 직후 두 스레드가 동시에 `getInstance()`를 처음 불러요. `AppConfig` 객체는 몇 개 만들어질까요? 모르는 게 정상이니 감으로 골라 보세요. 답은 질문 2에 나와요.'
  code: lazy
  label: 내 예측
  options:
    - value: one
      label: 항상 1개
    - value: maybe
      label: 2개가 될 수 있다
    - value: two
      label: 항상 2개
  answer: maybe
  storageKey: singleton-predict
  wrong: '"{label}"로 예측했어요. 틀린 예측이 더 오래 남으니 괜찮아요.'
questions:
  - id: q1
    title: 싱글톤은 어떻게 만드나요?
    conclusion:
      lead: '생성자를 `private`으로 막고, 만든 하나를 `static`으로 들고 있다가 꺼내 줘요. 미리 만들기, 처음 쓸 때 만들기, 홀더 클래스, enum 네 가지 방법이 있어요.'
      sub: '스레드에 안전하면서 처음 쓸 때 만드는 방법은 홀더 클래스와 enum이에요. JVM이 클래스 초기화를 한 번만 하기 때문이에요.'
    says:
      - '공통: 생성자가 `private`이라 밖에서 `new AppConfig()`를 쓰면 컴파일 오류다. 객체를 만드는 곳이 클래스 안 한 곳이 된다'
      - '미리 만들기(코드 eager): 클래스가 초기화될 때 만든다. 클래스 초기화는 JVM이 한 번만 하므로 스레드에 안전하다. 쓰지 않아도 만든다'
      - '처음 쓸 때 만들기(코드 lazy): `getInstance()`가 처음 불릴 때 만든다. 한 스레드에서는 하나만 만들어진다. 여러 스레드에서는 질문 2'
      - '홀더 클래스(코드 holder): `Holder`는 `getInstance()`가 처음 `Holder.INSTANCE`를 읽을 때 초기화된다. `AppConfig`의 다른 static 멤버를 써도 `Holder`는 초기화되지 않는다. 테스트로 초기화 시점을 찍는다'
      - 'enum(코드 enumSingleton): 상수가 하나인 enum이다. 상수는 enum 클래스가 초기화될 때 한 번 만들어진다. 직렬화와 리플렉션으로도 하나를 더 만들 수 없다'
    asks:
      - '본문의 예시: 코드 holder에서 `AppConfig`의 다른 static 메서드를 먼저 부르면 `AppConfig` 객체가 만들어지나 (아니다. `Holder`가 초기화될 때 만들어진다)'
      - '옮긴 상황: `class IdGenerator { private IdGenerator() {} }`가 있다. 다른 클래스에서 `new IdGenerator()`를 쓰면 (컴파일 오류)'
    body:
      - p: '**싱글톤 패턴**은 클래스가 객체를 하나만 만들게 막고, 그 하나를 꺼내는 곳을 주는 패턴이에요. 설정 파일을 읽는 데 시간이 걸리는 `AppConfig`처럼, 여럿 둘 이유가 없고 만드는 데 비용이 드는 객체에 써요.'
      - p: '네 방법 모두 **생성자를 `private`으로 막아요.** 밖에서 `new AppConfig()`를 쓰면 컴파일 오류라, 객체를 만드는 곳이 클래스 안 한 곳이 돼요.'
      - table:
          head: [방법, 언제 만드나, 여러 스레드]
          rows:
            - ['미리 만들기(코드 eager)', 클래스가 초기화될 때, 안전]
            - ['처음 쓸 때 만들기(코드 lazy)', 처음 getInstance를 부를 때, 질문 2]
            - ['홀더 클래스(코드 holder)', 처음 getInstance를 부를 때, 안전]
            - ['enum(코드 enumSingleton)', enum이 초기화될 때, 안전]
      - code: eager
      - h3: 홀더 클래스는 처음 쓸 때 만들어요
      - code: holderMark
        notes:
          - mark: Holder
            as: code
            text: '중첩 클래스도 처음 쓰일 때 초기화돼요. 바깥 `AppConfig`가 초기화돼도 `Holder`는 그대로예요.'
          - mark: Holder.INSTANCE
            as: code
            text: '여기서 처음 `Holder`를 쓰니, 이때 `INSTANCE`가 만들어져요.'
      - ci:
          key: holder
          label: 객체가 만들어지는 때 보기
          source: SingletonTest.holderIsLazy
      - p: '`AppConfig`의 다른 static 메서드를 먼저 불러도 객체는 0개예요. `getInstance()`를 부를 때 만들어져요. 클래스가 초기화되는 때는 [static과 초기화 순서](lesson:static-initialization)에서 봤어요.'
      - h3: enum은 상수가 하나인 enum이에요
      - code: enumSingleton
      - p: '[enum](lesson:enum)의 상수는 enum이 초기화될 때 한 번 만들어져요. 직렬화나 리플렉션으로도 하나를 더 만들 수 없어요(질문 2의 더 알아보기).'
      - quiz:
          q: '코드 holder에서 `AppConfig`의 다른 static 메서드 `version()`을 먼저 부르면 `AppConfig` 객체가 만들어질까요?'
          options:
            - 만들어진다. AppConfig가 초기화된다
            - 만들어지지 않는다. Holder가 처음 쓰일 때 만들어진다
          answer: 2
          explain: '객체는 `Holder`의 static 필드라서, `Holder`가 초기화될 때 만들어져요. `getInstance()`가 처음 `Holder.INSTANCE`를 읽을 때예요.'
      - next: '코드 lazy도 처음 쓸 때 만들어요. 그런데 표에서 여러 스레드 칸이 비어 있었어요. 왜일까요?'
    recall: '생성자를 `private`으로 막고, 만든 하나를 `static`으로 들고 있다가 꺼내 줘요. 미리 만들기, 처음 쓸 때 만들기, 홀더 클래스, enum 네 가지 방법이 있어요. 홀더 클래스는 `getInstance()`가 처음 `Holder.INSTANCE`를 읽을 때 만들고, enum은 상수가 하나인 enum이에요. 둘 다 JVM이 클래스 초기화를 한 번만 하기 때문에 스레드에 안전해요.'
  - id: q2
    title: 여러 스레드에서 써도 하나만 만들어지나요?
    conclusion:
      lead: '`if (instance == null)`로 처음 쓸 때 만드는 방식은 아니에요. 두 스레드가 동시에 처음 부르면 둘 이상 만들어질 수 있어요.'
      sub: '미리 만들기, 홀더 클래스, enum은 JVM의 클래스 초기화에 기대서 하나만 만들어져요.'
    says:
      - '예측의 답을 밝힌다. 두 스레드가 동시에 `instance == null`을 본다. 둘 다 null이라 둘 다 `new`를 한다. 생성자가 0.1초 걸리면 그 사이에 다른 스레드가 같은 확인을 통과한다'
      - '테스트: 두 스레드를 같은 순간에 출발시켜 `getInstance()`를 부르고 생성자가 불린 횟수를 센다. 코드 lazy는 2, 코드 holder와 enum은 1이다. 같은 조건을 여러 번 돌려 lazy가 2인 경우가 나오는 것을 보인다'
      - '두 객체가 생기면 한 스레드는 다른 설정 객체를 들고 간다. 설정을 바꾸는 코드가 있으면 서로 다른 값을 본다'
      - '홀더 클래스와 enum이 안전한 이유: 자바 언어 명세는 클래스 초기화를 한 스레드만 하고 나머지는 기다리게 정해 두었다'
      - '더 알아보기: `getInstance()`에 `synchronized`를 붙이면 안전하지만 부를 때마다 락을 잡는다. 이중 검사 잠금은 필드를 `volatile`로 둬야 안전하다. 왜 그런지는 경쟁 상태와 동기화(C3)'
      - '더 알아보기: private 생성자는 리플렉션의 `setAccessible(true)`로 부를 수 있어 객체가 하나 더 생긴다. enum의 생성자를 리플렉션으로 부르면 `IllegalArgumentException`("Cannot reflectively create enum objects")이 난다'
    widget:
      kind: steps
      note: '두 스레드 A와 B가 코드 lazy의 `getInstance()`를 동시에 처음 부르는 장면을 한 단계씩 실행한다. 단계: A가 null 확인, B가 null 확인, A가 new(생성자 0.1초), B가 new, A가 instance에 넣기, B가 instance에 넣기. 단계마다 instance 필드의 값과 지금까지 만든 객체 수를 보여 준다. 시나리오를 "코드 lazy"와 "코드 holder"로 고르면 holder에서는 B가 클래스 초기화를 기다리다 A가 만든 객체를 받는다'
    asks:
      - '본문의 예시: 코드 lazy에서 두 스레드가 모두 null을 확인한 뒤 각자 생성자를 부르면 만들어진 객체 수와 마지막에 `instance`에 남는 것은 (2개. 늦게 넣은 스레드의 것)'
      - '옮긴 상황: 다음 가운데 여러 스레드가 동시에 처음 불러도 객체가 하나만 만들어지는 것은? 보기: `if (x == null) x = new X();`로 만드는 getInstance / static final 필드에 미리 만든 것 / 매번 `new X()`를 돌려주는 getInstance (둘째)'
    body:
      - code: lazyMark
        notes:
          - mark: if (instance == null)
            as: code
            text: '두 스레드가 동시에 여기를 지나면, 둘 다 아직 null을 봐요.'
          - mark: instance = new AppConfig()
            as: code
            text: '생성자가 0.1초 걸리는 동안 `instance`는 여전히 null이에요.'
      - p: '아래에서 두 스레드 A와 B가 동시에 처음 부르는 장면을 한 단계씩 보세요.'
      - widget:
          kind: steps
          layout: [selector, duo, buttons, log, verdict]
          selector:
            label: 코드
            options:
              - {value: lazy, label: 코드 lazy}
              - {value: holder, label: 코드 holder}
          initial:
            duo:
              - {label: instance 필드, text: 'null', state: dim}
              - {label: 만든 객체, text: '0개', state: dim}
          scenarios:
            lazy:
              - log: 'A: instance == null 확인 → null이다'
                duo: [{label: instance 필드, text: 'null'}, {label: 만든 객체, text: '0개'}]
              - log: 'B: instance == null 확인 → 아직 null이다'
                duo: [{label: instance 필드, text: 'null'}, {label: 만든 객체, text: '0개'}]
              - log: 'A: new AppConfig() (0.1초)'
                duo: [{label: instance 필드, text: 'null'}, {label: 만든 객체, rows: [{k: A가 만든 것, v: '1개', mark: changed}]}]
              - log: 'B: new AppConfig() (0.1초)'
                duo: [{label: instance 필드, text: 'null'}, {label: 만든 객체, rows: [{k: A와 B, v: '2개', mark: bad}]}]
              - log: 'A: instance에 넣고 돌려준다. B: instance에 덮어쓰고 돌려준다'
                duo: [{label: instance 필드, rows: [{k: 남은 것, v: B가 만든 객체, mark: changed}]}, {label: 만든 객체, rows: [{k: A와 B, v: '2개', mark: bad}]}]
                verdict: 'A는 자기가 만든 객체를, 나머지는 B의 객체를 써요. 하나라는 약속이 깨졌어요.'
            holder:
              - log: 'A: Holder.INSTANCE를 읽는다 → JVM이 Holder 초기화를 시작한다'
                duo: [{label: Holder 초기화, text: 'A가 하는 중'}, {label: 만든 객체, text: '0개'}]
              - log: 'B: Holder.INSTANCE를 읽는다 → 초기화 중이라 기다린다'
                duo: [{label: Holder 초기화, text: 'A가 하는 중, B는 기다림'}, {label: 만든 객체, text: '0개'}]
              - log: 'A: new AppConfig() (0.1초) 끝, 초기화 끝'
                duo: [{label: Holder 초기화, text: 끝}, {label: 만든 객체, rows: [{k: A가 만든 것, v: '1개', mark: changed}]}]
              - log: 'B: 기다림이 풀리고 A가 만든 객체를 받는다'
                duo: [{label: Holder 초기화, text: 끝}, {label: 만든 객체, rows: [{k: A가 만든 것, v: '1개'}]}]
                verdict: 'JVM이 클래스 초기화를 한 스레드만 하게 지켜서 하나만 만들어져요.'
      - ci:
          key: race
          label: 네 방법을 두 스레드로 돌린 결과 보기
          source: SingletonTest.raceOnFirstAccess
      - p: '처음에 예측한 답은 **2개가 될 수 있다**예요. 코드 lazy는 열 번 돌려 열 번 모두 생성자가 두 번 불렸어요. 생성자가 느릴수록 그 사이에 다른 스레드가 같은 확인을 통과하기 쉬워요. 미리 만들기, 홀더, enum은 언제나 한 번이에요. {{predict-result}}'
      - p: '두 객체가 생기면 한 스레드는 다른 설정 객체를 들고 가요. 설정을 바꾸는 코드가 있으면 스레드마다 다른 값을 봐요.'
      - p: '홀더와 enum이 안전한 이유는 **자바 언어 명세가 클래스 초기화를 한 스레드만 하고 나머지는 기다리게 정해 두었기 때문**이에요([자바 언어 명세 12.4.2](link:jlsInit)). 이런 문제가 왜 생기는지(경쟁 상태)는 경쟁 상태와 동기화 레슨에서 다뤄요.'
      - more:
          summary: synchronized를 붙이면 안 되나요?
          body:
            - p: '`getInstance()`에 `synchronized`를 붙이면 안전하지만, 이미 만든 뒤에도 부를 때마다 락을 잡아요. 락을 줄이려는 "이중 검사 잠금"은 필드를 `volatile`로 둬야 안전해요. 왜 그런지는 경쟁 상태와 동기화 레슨에서 다뤄요. 홀더 방식이면 이런 고민이 없어요.'
      - more:
          summary: private 생성자는 정말 막혀 있나요?
          body:
            - p: '리플렉션의 `setAccessible(true)`로 private 생성자를 부르면 객체가 하나 더 생겨요. enum은 그것도 막혀 있어요.'
            - ci:
                key: reflection
                label: 리플렉션으로 만들어 본 결과 보기
                source: SingletonTest.reflectionAttack
      - quiz:
          q: '다음 가운데 여러 스레드가 동시에 처음 불러도 객체가 하나만 만들어지는 것은 무엇일까요?'
          options:
            - if (x == null) x = new X();로 만드는 getInstance
            - static final 필드에 미리 만든 것
            - 매번 new X()를 돌려주는 getInstance
          answer: 2
          explain: 'static final 필드는 클래스가 초기화될 때 만들어지고, JVM이 클래스 초기화를 한 번만 해요.'
      - next: '하나만 만드는 데 성공했다고 해도, 싱글톤에는 또 다른 문제가 있어요.'
    recall: '`if (instance == null)`로 처음 쓸 때 만드는 방식은 아니에요. 두 스레드가 동시에 처음 부르면 둘 다 null을 보고 각자 만들어서 둘 이상 생길 수 있어요. 생성자가 0.1초 걸리는 코드로 열 번 돌리면 열 번 모두 두 번 만들어졌어요. 미리 만들기, 홀더 클래스, enum은 JVM이 클래스 초기화를 한 스레드만 하게 지켜서 하나만 만들어져요.'
  - id: q3
    title: 싱글톤은 왜 테스트하기 어렵나요?
    conclusion:
      lead: '쓰는 쪽이 `getInstance()`를 직접 불러서 가짜로 바꿀 수 없고, 하나뿐인 객체의 상태가 테스트 사이에 남기 때문이에요.'
      sub: '싱글톤을 생성자로 주입받게 바꾸면 테스트에서는 가짜를, 운영에서는 그 하나를 넣을 수 있어요.'
    says:
      - '코드 hidden의 `OrderService`는 메서드 안에서 `AppConfig.getInstance()`를 부른다. 배송비 설정이 5000원일 때를 테스트하려면 진짜 설정 파일을 바꿔야 한다. 의존 역전 원칙과 의존성 주입에서 본 "안에서 직접 만들기"와 같은 문제다'
      - '숨은 의존: `OrderService`의 생성자만 봐서는 설정에 기대는 것이 보이지 않는다'
      - '상태가 남는다: 한 테스트가 `AppConfig.getInstance().set("shipping.fee", "0")`을 하면 같은 JVM의 다음 테스트도 0을 본다. 테스트 순서를 바꾸면 결과가 달라진다. 테스트로 두 순서를 돌린다'
      - '고친 코드(코드 injected): `OrderService`는 `AppConfig`를 생성자로 받는다. 하나만 두는 일은 조립하는 곳이 한다. 테스트는 설정 값을 정한 객체를 넣는다'
    asks:
      - '본문의 예시: 코드 hidden에서 배송비 설정이 다른 경우를 테스트하려면 `OrderService`를 고치지 않고 할 수 있나 (없다. getInstance를 바꿀 길이 없다)'
      - '옮긴 상황: 테스트 A가 싱글톤 카운터를 3 올리고 테스트 B가 카운터가 0인지 확인한다. 같은 JVM에서 A 다음 B를 돌리면 B는 (실패한다. 카운터가 3이다)'
    body:
      - code: hidden
      - p: '`OrderService`가 메서드 안에서 `AppConfig.getInstance()`를 직접 불러요. 배송비가 5000원일 때를 테스트하려면 진짜 설정 파일을 바꿔야 해요. 테스트가 가짜 설정을 넣을 자리가 없어요. [의존 역전 원칙과 의존성 주입](lesson:dip-di)에서 본 "안에서 직접 만들기"와 같은 문제예요.'
      - p: '**의존이 숨어 있어요.** `OrderService`의 생성자만 봐서는 설정에 기대는 것이 보이지 않아요.'
      - h3: 상태가 테스트 사이에 남아요
      - p: '하나뿐인 객체는 같은 JVM에서 도는 모든 테스트가 함께 써요. 한 테스트가 값을 바꾸면 다음 테스트도 바뀐 값을 봐요.'
      - code: stateTest
      - ci:
          key: state
          label: 두 순서로 돌린 결과 보기
          source: SingletonTest.stateLeaksBetweenTests
      - p: 'B만 돌리면 통과하고, A 다음에 돌리면 실패해요. **테스트 순서에 따라 결과가 달라지는** 테스트는 원인을 찾기 가장 어려운 종류예요.'
      - h3: 고친 코드는 주입받기예요
      - code: injected
      - p: '`OrderService`는 `AppConfig`를 생성자로 받아요. 하나만 두는 일은 조립하는 곳이 해요. 테스트는 배송비를 원하는 값으로 정한 설정 객체를 넣고, 테스트마다 새로 만들어서 상태가 남지 않아요.'
      - quiz:
          q: '테스트 A가 싱글톤 카운터를 3 올리고, 테스트 B는 카운터가 0인지 확인해요. 같은 JVM에서 A 다음 B를 돌리면 B는 어떻게 될까요?'
          options:
            - 통과한다
            - 실패한다. 카운터가 3이다
          answer: 2
          explain: '싱글톤은 JVM에 하나라서 A가 바꾼 상태가 B까지 남아요.'
      - next: '스프링 빈도 기본이 싱글톤이에요. 그럼 스프링 빈도 같은 문제를 가질까요?'
    recall: '쓰는 쪽이 `getInstance()`를 직접 불러서 가짜로 바꿀 수 없고, 하나뿐인 객체의 상태가 테스트 사이에 남기 때문이에요. 한 테스트가 배송비를 0으로 바꾸면 다음 테스트도 0을 봐서 순서에 따라 결과가 달라져요. 싱글톤을 생성자로 주입받게 바꾸면 테스트에서는 가짜를, 운영에서는 그 하나를 넣어요.'
  - id: q4
    title: 스프링의 싱글톤은 싱글톤 패턴과 무엇이 다른가요?
    conclusion:
      lead: '스프링 싱글톤은 클래스가 막는 것이 아니라 컨테이너가 빈을 하나만 만들어 나눠 주는 것이에요.'
      sub: '그래서 클래스는 평범하게 두고 생성자로 주입받을 수 있어요. 대신 `new`로는 얼마든지 더 만들 수 있고, 컨테이너가 둘이면 빈도 둘이에요.'
    says:
      - '`@Component`를 붙인 `AppConfig`를 컨테이너에서 두 번 꺼내면 같은 객체다(`==`가 true). 주입받은 `OrderService` 두 곳도 같은 객체를 받는다'
      - '같은 클래스를 `new AppConfig()`로 만들면 컴파일되고 다른 객체다. 생성자가 public이기 때문이다'
      - '컨테이너를 둘 만들면 각 컨테이너에 하나씩 있다. 스프링 싱글톤은 "컨테이너마다 하나"다. 싱글톤 패턴은 "클래스 로더마다 하나"다'
      - '스프링을 쓰면 싱글톤 패턴을 직접 만들 일은 드물다. 하나만 두는 일은 컨테이너에 맡기고, 클래스는 질문 3의 코드 injected처럼 주입받는다'
    asks:
      - '본문의 예시: 같은 컨테이너에서 `getBean(AppConfig.class)`를 두 번 부른 결과를 `==`로 비교하면 (true)'
      - '옮긴 상황: 스프링 빈인 `PriceService`를 테스트 코드에서 `new PriceService()`로 만들었다. 이 객체는 컨테이너의 빈과 같은 객체인가 (아니다. 새 객체다)'
      - '실무 구역: 싱글톤 빈 `OrderService`의 필드 `private int lastTotal`에 요청마다 주문 금액을 넣고 다음 줄에서 읽는다. 두 요청이 동시에 오면 무슨 일이 생길 수 있나 (다른 요청의 금액을 읽는다)'
    body:
      - p: '스프링 빈은 기본이 **싱글톤 스코프**예요. 하지만 클래스가 생성자를 막아서 하나를 지키는 것이 아니라, **컨테이너가 하나만 만들어 나눠 주는 것**이에요([스프링 문서](link:springScope)).'
      - code: springBean
      - ci:
          key: spring
          label: 빈을 꺼내 비교한 결과 보기
          source: SingletonTest.springSingleton
      - p: '같은 컨테이너에서 두 번 꺼내면 같은 객체예요. 하지만 생성자가 public이라 `new AppConfig()`로 얼마든지 더 만들 수 있고, 컨테이너가 둘이면 빈도 둘이에요. 싱글톤 패턴은 "클래스 로더에 하나", 스프링 싱글톤은 "컨테이너에 하나"예요.'
      - p: '그래서 스프링을 쓰면 싱글톤 패턴을 직접 만들 일이 드물어요. 하나만 두는 일은 컨테이너에 맡기고, 클래스는 평범하게 두고 생성자로 주입받아요. 질문 3의 테스트 문제도 함께 풀려요.'
      - quiz:
          q: '스프링 빈인 `PriceService`를 테스트 코드에서 `new PriceService()`로 만들었어요. 이 객체는 컨테이너의 빈과 같은 객체일까요?'
          options:
            - 같다. 스프링 빈은 싱글톤이다
            - 다르다. 새 객체다
          answer: 2
          explain: '스프링 싱글톤은 컨테이너가 하나만 만들어 나눠 주는 것이에요. `new`는 컨테이너를 거치지 않아서 새 객체예요.'
    recall: '스프링 싱글톤은 클래스가 막는 것이 아니라 컨테이너가 빈을 하나만 만들어 나눠 주는 것이에요. 같은 컨테이너에서 두 번 꺼내면 같은 객체지만, 생성자가 public이라 `new`로 더 만들 수 있고 컨테이너가 둘이면 빈도 둘이에요. 그래서 클래스를 평범하게 두고 생성자로 주입받을 수 있어요.'
practice:
  title: 싱글톤 빈에 요청 값을 두지 마세요
  says:
    - '스프링에서 빈은 기본이 싱글톤 스코프다. 직접 `getInstance()`를 만들지 않고 `@Component`나 `@Bean`으로 등록한다. `AnnotationConfigApplicationContext`로 같은 빈인지 확인한다'
    - '흔한 실수: 싱글톤 빈의 필드에 요청마다 바뀌는 값(현재 주문 금액, 로그인한 회원)을 둔다. 모든 요청이 같은 객체를 쓰므로 두 요청이 동시에 오면 값이 섞인다. 고친 코드: 그 값은 지역 변수나 메서드 인자로 다룬다. 두 스레드로 같은 빈을 부르는 테스트로 섞이는 것을 보인다'
    - '왜 섞이는지(경쟁 상태)는 경쟁 상태와 동기화(C3)에서, 빈의 스코프는 빈의 생명주기와 스코프(S3)에서 다룬다'
  body:
    - p: '스프링에서는 `getInstance()`를 직접 만들지 않고 `@Component`나 `@Bean`으로 등록해요. 질문 4에서 본 것처럼 빈은 하나만 만들어져 모든 요청이 함께 써요.'
    - p: '그래서 흔한 실수가 생겨요. 싱글톤 빈의 **필드에 요청마다 바뀌는 값**을 두는 거예요.'
    - code: statefulBad
    - p: '두 요청이 동시에 와서, A가 값을 넣고 잠시 다른 일을 하는 사이 B가 값을 넣는 상황을 만들어 봤어요.'
    - ci:
        key: stateful
        label: 두 스레드로 같은 빈을 부른 결과 보기
        source: SingletonTest.statefulBean
    - p: '요청 A가 자기 금액 10000이 아니라 B의 20000을 읽어요. 모든 요청이 같은 객체의 같은 필드를 쓰기 때문이에요. 고친 코드는 그 값을 지역 변수나 메서드 인자로 다루는 거예요. 지역 변수는 스레드마다 따로 있어요.'
    - code: statefulGood
    - muted: '왜 섞이는지는 경쟁 상태와 동기화 레슨에서, 요청마다 새 빈을 만드는 스코프는 빈의 생명주기와 스코프 레슨에서 다뤄요.'
interview:
  question: 싱글톤 패턴을 만드는 방법과 문제점, 스프링 싱글톤과의 차이를 설명해 주세요
  model:
    - label: 정의
      text: 싱글톤 패턴은 클래스가 생성자를 private으로 막아 객체를 하나만 만들고, 그 하나를 static 메서드나 필드로 꺼내 쓰게 하는 패턴입니다.
    - label: 원리
      text: 만드는 방법은 미리 만들기, 처음 쓸 때 만들기, 홀더 클래스, enum이 있습니다. if (instance == null)로 처음 쓸 때 만들면 두 스레드가 동시에 처음 부를 때 둘 다 만들 수 있습니다. 홀더 클래스와 enum은 JVM이 클래스 초기화를 한 스레드만 하게 지켜서 안전하고, enum은 리플렉션으로도 하나를 더 만들 수 없습니다.
    - label: 주의할 점
      text: 쓰는 쪽이 getInstance()를 직접 부르면 가짜로 바꿀 수 없고, 상태가 테스트 사이에 남아 순서에 따라 결과가 달라집니다. 스프링 싱글톤은 컨테이너가 하나를 만들어 나눠 주는 것이라 클래스를 평범하게 두고 생성자로 주입받습니다. 싱글톤 빈의 필드에 요청 값을 두면 동시 요청끼리 섞입니다.
    - label: 경험
      text: '(내 프로젝트로 채우기) 예: 서비스 필드에 두던 요청 값을 지역 변수로 옮겨, 동시 요청에서 다른 사람의 금액이 보이던 버그를 고쳤습니다.'
verified: '이 레슨의 생성 횟수, 리플렉션 결과, 테스트 순서에 따른 결과, 스프링 빈 비교, 섞인 금액은 짐작이 아니라 자바 21과 스프링 부트 3.5에서 코드를 돌려 받은 값이에요. 코드가 바뀔 때마다 테스트([SingletonTest](link:test))가 다시 돌아요.'
footer: '근거: 클래스 초기화를 한 번, 한 스레드가 하는 것은 [자바 언어 명세 12.4.2](link:jlsInit), enum을 리플렉션으로 만들 수 없는 것은 [자바 언어 명세 8.9](link:jlsEnum), 스프링 싱글톤 스코프는 [스프링 공식 문서](link:springScope). 결과는 OpenJDK 21에서 테스트로 확인했어요. 오류는 [GitHub 이슈](https://github.com/wanja727/dev-lessons/issues)로 알려 주세요.'
claims:
  - claim: '두 스레드가 동시에 처음 부르면 코드 lazy는 생성자가 2번 불리는 경우가 생기고, 홀더와 enum과 미리 만들기는 항상 1번이다'
    how: '`CountDownLatch`로 두 스레드를 함께 출발시키고, 생성자에서 0.1초 쉬며 생성 횟수를 센다. 여러 번 돌린다'
    test: SingletonTest.raceOnFirstAccess
  - claim: '홀더 방식은 바깥 클래스의 다른 static 메서드를 불러도 객체를 만들지 않는다'
    how: '생성자에서 기록을 남겨 확인한다'
    test: SingletonTest.holderIsLazy
  - claim: 'private 생성자 싱글톤은 리플렉션으로 하나 더 만들어지고, enum은 `IllegalArgumentException`'
    how: '`Constructor.newInstance`로 확인한다'
    test: SingletonTest.reflectionAttack
  - claim: '싱글톤의 상태가 남아 테스트 순서에 따라 결과가 달라진다'
    how: '두 순서로 같은 동작을 돌려 결과를 비교한다'
    test: SingletonTest.stateLeaksBetweenTests
  - claim: '스프링 컨테이너에서 두 번 꺼낸 빈은 같은 객체, `new`는 다른 객체, 컨테이너 둘은 빈 둘'
    how: '`AnnotationConfigApplicationContext`로 확인한다'
    test: SingletonTest.springSingleton
  - claim: '싱글톤 빈의 필드에 요청 값을 두면 두 스레드가 다른 값을 읽는다'
    how: '두 스레드로 같은 빈을 부르고 래치로 순서를 맞춰 확인한다'
    test: SingletonTest.statefulBean
sources:
  - '클래스 초기화는 한 번, 한 스레드가 한다: 자바 언어 명세 12.4.2 https://docs.oracle.com/javase/specs/jls/se21/html/jls-12.html#jls-12.4.2'
  - 'enum은 리플렉션으로 만들 수 없다: 자바 언어 명세 8.9 https://docs.oracle.com/javase/specs/jls/se21/html/jls-8.html#jls-8.9'
  - '스프링 싱글톤 스코프: 스프링 공식 문서 https://docs.spring.io/spring-framework/reference/core/beans/factory-scopes.html#beans-factory-scopes-singleton'
