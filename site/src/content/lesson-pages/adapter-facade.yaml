codes:
  ours: |-
    interface PaymentGateway {
      Approval approve(long orderId,
                       int amount);
    }

    record Approval(boolean ok,
                    String txId) {}
  sdk: |-
    // 결제 대행사 SDK (고칠 수 없다)
    class TossSdk {
      Map<String, String> requestPayment(
          Map<String, Object> params) {...}
    }
    // 결과: {"code": "0000", "tid": "T1"}
  adapter: |-
    class TossAdapter
        implements PaymentGateway {
      private final TossSdk sdk;

      public Approval approve(long orderId,
                              int amount) {
        var res = sdk.requestPayment(Map.of(
            "orderNo", String.valueOf(orderId),
            "amount", (long) amount,
            "currency", "KRW"));
        return new Approval(
            "0000".equals(res.get("code")),
            res.get("tid"));
      }
    }
  facade: |-
    class OrderFacade {
      private final Inventory inventory;
      private final PaymentGateway payment;
      private final Delivery delivery;
      private final Notifier notifier;

      long placeOrder(Cart cart) {
        inventory.reserve(cart);
        Approval a = payment.approve(...);
        long id = delivery.request(cart);
        notifier.notify(...);
        return id;
      }
    }
predict:
  text: '주문 서비스, 환불 서비스, 정산 배치가 모두 `PaymentGateway`만 쓰고, 토스 SDK는 `TossAdapter` 안에서만 써요. 결제 대행사를 나이스로 바꾸면 세 서비스 가운데 몇 개를 고쳐야 할까요? 보기: 0개, 1개, 3개.'
  answer: '0개. 새 `NiceAdapter`를 만들고 조립하는 곳만 바꾼다. 질문 2에서 밝힌다.'
questions:
  - id: q1
    title: 어댑터 패턴은 무엇인가요?
    conclusion:
      lead: '맞지 않는 인터페이스를 가진 객체를 감싸서, 쓰는 쪽이 원하는 인터페이스로 바꿔 주는 패턴이에요.'
      sub: '메서드 이름, 인자와 결과의 모양을 바꿔요. 같은 인터페이스를 유지하는 데코레이터나 프록시와 달리, 어댑터는 인터페이스를 바꿔요.'
    says:
      - '우리 코드는 코드 ours의 `PaymentGateway.approve(orderId, amount)`를 원한다. SDK는 코드 sdk의 `requestPayment(Map)`이고 결과가 코드 문자열이다'
      - '코드 adapter: 우리 인터페이스를 구현하고 SDK를 필드로 갖는다. 주문 번호를 문자열로, 금액을 long으로 바꾸고 통화를 넣어 SDK를 부른다. 결과 코드 "0000"을 `Approval(ok=true)`로 바꾼다'
      - '테스트: 가짜 SDK에 들어온 파라미터와 돌려받은 `Approval`을 확인한다. 실패 코드는 `ok=false`다'
      - '데코레이터와 프록시는 감싸는 것과 같은 인터페이스를 구현한다. 어댑터는 감싸는 것(SDK)과 다른 인터페이스(우리 것)를 구현한다'
    asks:
      - '본문의 예시: SDK가 `{"code": "1001", "tid": null}`을 돌려주면 `TossAdapter.approve`가 돌려주는 것은 (`Approval(ok=false, txId=null)`)'
      - '옮긴 상황: 우리 코드는 `Temperature`를 섭씨로 받는 `Thermometer`를 원하는데, 장비 라이브러리는 화씨 `double readF()`만 준다. 두 모양을 잇는 클래스는 어떤 패턴이고 무엇을 하나 (어댑터. `Thermometer`를 구현하고 `readF()`를 불러 섭씨로 바꾼다)'
  - id: q2
    title: 어댑터를 두면 무엇이 좋아지나요?
    conclusion:
      lead: '외부의 모양이 우리 코드 안으로 새지 않아서, 업체나 라이브러리를 바꿀 때 어댑터만 바꿔요.'
      sub: '테스트에서는 우리 인터페이스의 가짜를 넣어요. 어댑터에는 바꾸는 일만 두고 업무 규칙을 넣지 않아요.'
    says:
      - '어댑터가 없으면 서비스마다 `Map` 파라미터와 "0000"을 다룬다. 업체를 바꾸면 그 서비스들을 모두 고친다'
      - '예측의 답을 밝힌다. 세 서비스가 `PaymentGateway`만 쓰면 나이스로 바꿀 때 `NiceAdapter`를 새로 만들고 조립하는 곳만 고친다. 세 서비스는 0개다. 바꾸기 전후 소스를 비교한다'
      - '테스트: 주문 서비스는 `PaymentGateway`의 가짜를 넣어 승인과 거절을 시험한다. SDK 없이 돈다'
      - '어댑터에 업무 규칙("5만 원 이상이면 할부")을 넣으면 업체를 바꿀 때 그 규칙도 옮겨 써야 한다. 어댑터는 모양만 바꾼다'
      - '인터페이스 `PaymentGateway`는 쓰는 쪽(주문)에 두고 우리 말로 짓는다. 의존 역전 원칙과 의존성 주입에서 본 것과 같다'
    widget:
      kind: compare
      note: '왼쪽 칸은 서비스 셋이 SDK를 직접 쓰는 코드, 오른쪽 칸은 어댑터를 둔 코드다. 요구(나이스로 바꾸기, SDK 결과 코드 형식이 바뀜, 주문 서비스 테스트하기)를 고르면 고칠 파일과 새로 만들 파일, 테스트에 필요한 것이 나온다'
    asks:
      - '본문의 예시: 세 서비스가 `PaymentGateway`만 쓸 때 나이스로 바꾸면 세 서비스 가운데 고칠 파일 수는 (0개)'
      - '옮긴 상황: 문자 발송 업체 SDK의 응답 형식이 바뀌었다. 우리 코드에 `SmsSender` 인터페이스와 그 업체의 어댑터가 있다면 고칠 곳은 (어댑터 하나)'
  - id: q3
    title: 퍼사드 패턴은 무엇이고, 어댑터와 무엇이 다른가요?
    conclusion:
      lead: '여러 하위 시스템을 정해진 순서로 부르는 일을 단순한 창구 하나 뒤에 두는 패턴이에요.'
      sub: '어댑터는 하나의 모양을 바꾸고, 퍼사드는 여럿을 단순하게 묶어요. 퍼사드 뒤의 시스템은 필요하면 여전히 직접 쓸 수 있어요.'
    says:
      - '주문하기는 재고 예약, 결제 승인, 배송 요청, 알림 순서다. 컨트롤러가 넷을 직접 부르면 순서와 네 시스템을 모두 안다'
      - '코드 facade: `OrderFacade.placeOrder(cart)` 하나만 부르면 넷이 순서대로 불린다. 테스트로 호출 순서를 기록한다'
      - '컨트롤러가 아는 클래스가 넷에서 하나로 준다. 결합도와 응집도에서 본 "알아야 할 것을 줄이기"다'
      - '퍼사드는 하위 시스템을 감추지만 막지는 않는다. 관리자 화면이 재고만 따로 볼 때는 `Inventory`를 직접 쓴다'
      - '어댑터와의 차이: 어댑터는 하나를 다른 인터페이스로 바꾸고, 퍼사드는 여럿을 새로운 단순한 인터페이스로 묶는다'
      - '더 알아보기: 퍼사드에 업무 규칙을 계속 더하면 모든 것을 아는 커다란 클래스가 된다. 퍼사드는 순서를 잇는 일만 하고 규칙은 각 시스템에 둔다'
    asks:
      - '본문의 예시: `OrderFacade`를 쓰기 전과 후에 컨트롤러가 직접 아는 클래스는 몇 개인가 (넷에서 하나)'
      - '옮긴 상황: 레거시 결제 모듈의 메서드 이름이 우리 규칙과 달라서 우리 인터페이스로 감싼 클래스와, 회원 가입에 필요한 다섯 시스템을 순서대로 부르는 `SignupFacade` 가운데 어댑터는 (앞의 것)'
practice:
  says:
    - '자바의 어댑터: `Arrays.asList(array)`는 배열을 `List`로 바꾼다. 복사가 아니라 배열을 감싼 것이라 `set(0, x)`가 배열을 바꾸고, `add`는 `UnsupportedOperationException`이다. 테스트로 확인한다'
    - '`InputStreamReader`는 바이트를 읽는 `InputStream`을 글자를 읽는 `Reader`로 바꾸는 어댑터다'
    - '로깅의 퍼사드: 스프링 코드는 `org.slf4j.Logger`에 로그를 남기고, 실제로 쓰는 것은 스프링 부트의 기본인 Logback이다. `LoggerFactory.getLogger(...)`가 돌려준 객체의 클래스를 찍어 Logback인 것을 테스트로 보인다. 구현을 바꿔도 로그를 남기는 코드는 그대로다'
    - '흔한 실수: SDK의 타입(`TossSdk`, 결과 `Map`)을 서비스의 메서드 인자나 반환값으로 쓴다. 고친 코드: SDK 타입은 어댑터 안에만 두고 서비스 사이에는 우리 타입(`Approval`)만 오간다'
claims:
  - claim: '`TossAdapter`는 주문 번호를 문자열로, 금액을 long으로 바꾸고 통화 KRW를 넣어 SDK를 부르며, 코드 "0000"은 ok=true, 그 밖은 ok=false다'
    how: '가짜 SDK로 받은 파라미터와 결과를 확인한다'
  - claim: '세 서비스가 `PaymentGateway`만 쓰면 나이스로 바꿀 때 서비스는 그대로이고 어댑터와 조립 코드만 바뀐다'
    how: '바꾸기 전후 소스를 비교한다(SourceChange)'
  - claim: '`OrderFacade.placeOrder`는 재고, 결제, 배송, 알림 순서로 부른다'
    how: '가짜 하위 시스템으로 호출 순서를 기록한다'
  - claim: '`Arrays.asList`의 `set`은 원래 배열을 바꾸고 `add`는 `UnsupportedOperationException`이다'
    how: '돌려서 확인한다'
  - claim: '스프링 부트에서 SLF4J `LoggerFactory.getLogger`가 돌려준 객체는 Logback의 Logger다'
    how: '클래스 이름을 확인한다'
sources:
  - '`Arrays.asList`: API 문서 https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/Arrays.html#asList(T...)'
  - 'SLF4J: 공식 사이트 https://www.slf4j.org/'
  - '스프링 부트의 로깅 기본값(Logback): 공식 문서 https://docs.spring.io/spring-boot/reference/features/logging.html'
  - '어댑터와 퍼사드 패턴: GoF, Design Patterns(1994). 용어 설명 https://refactoring.guru/design-patterns/adapter'
