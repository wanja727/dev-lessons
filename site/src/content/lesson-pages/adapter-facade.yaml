# 어댑터와 퍼사드 패턴 (설계서)
# 자료 파일의 칸은 docs/lesson-data-format.md에 있다.
stage: design
title: 어댑터와 퍼사드 패턴
unit: 객체지향 설계와 패턴
roadmap: O14
type: 설계
prerequisites:
  - {slug: strategy-pattern, title: 전략 패턴}
  - {slug: proxy-decorator, title: 프록시와 데코레이터 패턴}
assume: '자바 21. 인터페이스에 기대고 구현을 갈아 끼우는 것(전략 패턴 레슨), 같은 인터페이스로 감싸는 프록시와 데코레이터(프록시와 데코레이터 패턴 레슨), 인터페이스를 쓰는 쪽에 두는 것(의존 역전 원칙과 의존성 주입 레슨).'
example: '쇼핑몰의 결제. 우리 코드는 `PaymentGateway.approve(orderId, amount)`로 결제를 요청하는데, 결제 대행사 SDK는 `requestPayment(Map)`을 받고 결과를 코드 문자열 `"0000"`으로 돌려줘요. 둘을 잇는 어댑터를 만들고, 주문하기에 필요한 재고, 결제, 배송, 알림 네 시스템을 창구 하나(퍼사드) 뒤에 둬요.'
intro:
  - '결제 대행사를 바꾸기로 했는데, 주문 서비스, 환불 서비스, 정산 배치 곳곳에서 옛 SDK의 `Map` 파라미터와 결과 코드 `"0000"`을 직접 다루고 있었어요. 대행사의 말투가 우리 코드 깊숙이 들어와 있어서, 업체 하나를 바꾸는 일이 서비스 다섯 개를 고치는 일이 됐어요.'
  - '외부 라이브러리와 레거시 시스템은 우리가 원하는 모양으로 생기지 않았어요. 어댑터는 그 모양을 우리 인터페이스로 바꿔 주는 얇은 층이고, 퍼사드는 여러 시스템을 순서대로 부르는 복잡한 일을 창구 하나로 감춰요. 로그를 남길 때 쓰는 SLF4J가 이름부터 퍼사드(Simple Logging Facade for Java)이고, `Arrays.asList`가 배열을 리스트로 바꾸는 어댑터예요.'
  - '이 레슨에서는 결제 SDK 어댑터를 만들어 대행사를 바꿀 때 고치는 파일을 세고, 주문 퍼사드가 부르는 시스템의 순서를 확인하고, 자바와 스프링 안의 어댑터와 퍼사드를 돌려 봐요.'
