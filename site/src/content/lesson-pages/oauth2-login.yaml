# OAuth 2.0과 소셜 로그인
# 자료 파일의 칸은 docs/lesson-data-format.md에 있다. 문제는 content/questions/oauth2-login.yaml에 있다.
title: OAuth 2.0과 소셜 로그인
description: OAuth 2.0이 비밀번호 없이 무엇을 넘기는지, 인가 코드 흐름의 순서, 토큰 대신 코드를 거치는 이유, 소셜 로그인이 OAuth와 무엇이 다른지. 네 가지 질문에 스스로 답할 수 있게 만드는 대화형 레슨.
unit: 네트워크와 웹
minutes: 20
roadmap: N8
type: 개념 설명
prerequisites:
  - {slug: cookie-session-token, title: 쿠키, 세션, 토큰}
  - {slug: https-tls, title: HTTPS와 TLS}
assume: '세션과 JWT로 로그인 상태를 유지하는 법(쿠키, 세션, 토큰 레슨), HTTPS가 내용을 숨기고 서버를 확인한다는 것(HTTPS와 TLS 레슨), 3xx 응답과 Location 헤더(HTTP 요청과 응답 레슨). 실제 구글이나 카카오 서버에는 테스트로 요청할 수 없어서, RFC 6749의 규칙대로 만든 작은 인가 서버로 흐름을 돌리고 그렇다고 밝혀요.'
example: '쇼핑몰(우리 서비스)에 "카카오로 로그인" 버튼을 두는 일. 등장인물은 사용자 kim, 쇼핑몰 서버, 카카오의 로그인 서버(인가 서버), 카카오의 사용자 정보 API(자원 서버)예요.'
intro:
  - '"구글로 로그인" 버튼을 누르면 구글 화면으로 갔다가 돌아오는데, 우리 서비스는 사용자의 구글 비밀번호를 한 번도 보지 않아요. 그런데 어떻게 그 사용자가 누구인지 알까요?'
  - '스프링 개발자는 소셜 로그인을 붙일 때 이 흐름을 그대로 설정해요. `client-id`, `client-secret`, `redirect-uri`, `scope`가 무엇인지 모르면 `redirect_uri_mismatch` 같은 에러에서 막혀요. 면접에서는 "OAuth 2.0의 인가 코드 흐름을 설명해 주세요", "OAuth와 로그인은 무엇이 다른가요"를 물어요.'
  - '이 레슨에서는 RFC 6749의 규칙대로 만든 작은 인가 서버와 쇼핑몰 서버를 띄워 인가 코드 흐름을 한 단계씩 밟고, 코드를 두 번 쓰거나 비밀값을 틀리면 무슨 일이 생기는지 확인해요.'
covers:
  - {topic: 'OAuth 2.0은 비밀번호를 넘기지 않고, 정해진 범위의 권한(액세스 토큰)을 다른 서비스에 넘기는 규칙이다', where: 질문 1}
  - {topic: '네 역할: 자원 소유자(사용자), 클라이언트(우리 서비스), 인가 서버, 자원 서버', where: 질문 1}
  - {topic: 'scope: 넘기는 권한의 범위. 사용자가 동의 화면에서 본다', where: 질문 1}
  - {topic: '클라이언트 등록: client_id, client_secret, redirect_uri를 미리 등록한다', where: 질문 1}
  - {topic: '인가 코드 흐름의 단계: 인가 요청 리다이렉트, 로그인과 동의, 코드를 들고 돌아오기, 코드를 토큰으로 바꾸기, 토큰으로 API 부르기', where: 질문 2}
  - {topic: 'state: 시작한 요청과 돌아온 요청이 같은지 확인해 CSRF를 막는다', where: 질문 2}
  - {topic: '프론트 채널(브라우저를 거침)과 백 채널(서버끼리 직접)', where: 질문 3}
  - {topic: '코드를 한 번 더 바꾸는 이유: 코드는 브라우저 주소에 드러나니 짧게 살고 한 번만 쓰이고, 토큰은 client_secret과 함께 서버끼리 받는다', where: 질문 3}
  - {topic: 'redirect_uri는 등록한 값과 정확히 같아야 한다', where: '질문 3, 실무에서는'}
  - {topic: 'PKCE: 비밀값을 둘 수 없는 앱을 위한 장치', where: 질문 3의 더 알아보기}
  - {topic: 'OAuth는 권한을 넘기는 규칙이지 로그인 규칙이 아니다. 로그인에는 OpenID Connect의 ID 토큰을 쓴다', where: 질문 4}
  - {topic: 'ID 토큰은 JWT이고 sub(그 서비스 안의 사용자 번호)로 사용자를 구별한다', where: 질문 4}
  - {topic: '소셜 로그인 뒤 우리 회원과 잇기(제공자와 sub로), 그 뒤는 우리 세션이나 JWT', where: 질문 4}
  - {topic: '리프레시 토큰으로 액세스 토큰 다시 받기', where: 질문 4의 더 알아보기}
  - {topic: '스프링 시큐리티 OAuth2 Client: 의존성, application.yml의 registration과 provider, oauth2Login()', where: 실무에서는}
  - {topic: '스프링의 기본 주소: /oauth2/authorization/{id}, /login/oauth2/code/{id}', where: 실무에서는}
  - {topic: '흔한 실수: 로드 밸런서 뒤에서 redirect_uri가 http로 만들어져 등록 값과 다름', where: 실무에서는}
  - {topic: '스프링 시큐리티의 필터 체인', where: '다루지 않음: 인증과 인가(S12)'}
  - {topic: '우리 서비스가 인가 서버가 되는 일(Spring Authorization Server)', where: '다루지 않음: 백엔드 신입이 만들 일이 드물어 로드맵에 두지 않는다'}
  - {topic: '클라이언트 자격 증명 방식(서버끼리 부르는 OAuth)', where: '질문 1의 더 알아보기'}
codes:
  authorize: |-
    HTTP/1.1 302
    Location: https://auth.kakao.com
      /oauth/authorize
      ?response_type=[[code]]
      &client_id=shop
      &redirect_uri=https://shop.com
        /login/oauth2/code/kakao
      &scope=profile
      &state=[[x7Kp2]]
  callback: |-
    GET /login/oauth2/code/kakao
        ?code=[[Sp1xlOBe]]&state=x7Kp2
    Host: shop.com
  tokenRequest: |-
    POST /oauth/token
    Host: auth.kakao.com
    Content-Type:
      application/x-www-form-urlencoded

    grant_type=authorization_code
    &code=Sp1xlOBe
    &redirect_uri=https://shop.com/...
    &client_id=shop
    &client_secret=[[s3cr3t]]
  tokenResponse: |-
    {"access_token": "ya29.a0Af...",
     "token_type": "Bearer",
     "expires_in": 3600,
     "id_token": "eyJhbGci..."}
  idTokenPayload: |-
    {"iss": "https://auth.kakao.com",
     [["sub": "3812294"]],
     "aud": "shop",
     "exp": 1795000000}
  flowRun: |-
    // 브라우저 역할: 리다이렉트를 따라가지
    // 않는 HttpClient로 한 단계씩
    GET (쇼핑몰)/oauth2/authorization/kakao
    GET (302의 Location: 인가 서버)
    GET (302의 Location: 쇼핑몰의 콜백)
  rulesRun: |-
    // 쇼핑몰 서버처럼 서버끼리 보낸다
    POST /oauth/token (틀린 client_secret)
    POST /oauth/token (맞는 값)
    POST /oauth/token (같은 코드 다시)
    POST /oauth/token (다른 redirect_uri)
  stateRun: |-
    // 콜백 주소의 state만 바꿔서
    GET /login/oauth2/code/kakao
        ?code=...&[[state=attacker]]
    Cookie: OAUTH_STATE=(처음 받은 값)
  gradle: |-
    implementation 'org.springframework.boot:⤷
    spring-boot-starter-oauth2-client'
  yml: |-
    spring:
      security:
        oauth2:
          client:
            registration:
              kakao:
                client-id: shop
                client-secret: [[${SECRET}]]
                authorization-grant-type: ⤶
                  authorization_code
                redirect-uri: "{baseUrl}⤷
    /login/oauth2/code/{registrationId}"
                scope: profile
            provider:
              kakao:
                authorization-uri: ...
                token-uri: ...
                user-info-uri: ...
                user-name-attribute: id
  security: |-
    @Bean
    SecurityFilterChain web(HttpSecurity http)
        throws Exception {
      http
        .authorizeHttpRequests(a -> a
          .anyRequest().authenticated())
        .[[oauth2Login]](Customizer.withDefaults());
      return http.build();
    }
  forwarded: |-
    server:
      forward-headers-strategy: framework
links:
  test: https://github.com/wanja727/dev-lessons/blob/main/verification/src/test/java/lab/devlessons/oauth2login/OAuth2FlowTest.java
  rfc6749: https://www.rfc-editor.org/rfc/rfc6749.html
  rfc7636: https://www.rfc-editor.org/rfc/rfc7636.html
  oidc: https://openid.net/specs/openid-connect-core-1_0.html
  springLogin: https://docs.spring.io/spring-security/reference/servlet/oauth2/login/core.html
predict:
  title: 같은 코드를 두 번 쓰면?
  text: '쇼핑몰 서버가 카카오에서 받은 인가 코드로 액세스 토큰을 받았어요. 그런데 네트워크가 잠깐 끊겨 같은 코드로 토큰 요청을 한 번 더 보냈어요. 인가 서버는 어떻게 답할까요? 모르는 게 정상이니 감으로 골라 보세요. 답은 질문 3에 나와요.'
  code: tokenRequest
  label: 내 예측
  options:
    - value: same
      label: 같은 토큰을 다시 준다
    - value: new
      label: 새 토큰을 하나 더 준다
    - value: reject
      label: 거절한다(invalid_grant)
  answer: reject
  storageKey: oauth-predict
  wrong: 예측은 "{label}"이었어요. 틀린 예측이 더 오래 남으니 괜찮아요.
questions:
  - id: q1
    title: OAuth 2.0은 비밀번호 없이 무엇을 어떻게 넘기나요?
    conclusion:
      lead: '사용자의 비밀번호 대신, 사용자가 동의한 범위(scope)만큼만 쓸 수 있는 액세스 토큰을 우리 서비스에 넘겨요.'
      sub: '토큰은 사용자가 비밀번호를 넣은 인가 서버가 만들어 줘요. 우리 서비스는 비밀번호를 보지 못하고, 토큰으로는 허락받은 일만 해요.'
    says:
      - '옛날 방식: 다른 서비스의 연락처를 가져오려고 사용자의 그 서비스 비밀번호를 받아 저장했다. 비밀번호가 새면 모든 권한이 새고, 일부만 허락하거나 우리 서비스만 끊을 수 없다'
      - 'OAuth 2.0의 네 역할을 예제의 인물로 맞춘다. 자원 소유자(kim), 클라이언트(쇼핑몰 서버), 인가 서버(카카오 로그인), 자원 서버(카카오 사용자 정보 API). 클라이언트는 사용자가 아니라 우리 서비스다'
      - '인가 서버는 kim이 로그인하고 동의하면 액세스 토큰을 준다. 토큰에는 범위(scope)가 있다. `profile`만 동의했으면 친구 목록은 못 읽는다. kim은 카카오에서 쇼핑몰의 권한만 끊을 수 있다'
      - '클라이언트는 미리 인가 서버에 등록해 client_id(공개 이름), client_secret(서버만 아는 비밀값), redirect_uri(돌아올 주소)를 받는다'
      - '더 알아보기: 사용자 없이 서버끼리 부를 때는 클라이언트 자격 증명 방식(client_credentials)으로 client_id와 secret만으로 토큰을 받는다'
    asks:
      - '본문의 예시: 카카오 로그인 흐름에서 "클라이언트"는 누구인가 (보기: kim의 브라우저, 쇼핑몰 서버, 카카오 인가 서버)'
      - '옮긴 상황: 일정 관리 앱이 사용자의 구글 캘린더를 읽기만 하려 한다. 구글 비밀번호를 받는 대신 무엇을 받고, 그것으로 일정을 지울 수 있나 (읽기 scope의 액세스 토큰. 지울 수 없다)'
    body:
      - p: '쇼핑몰이 kim의 카카오 프로필(닉네임, 사진)을 가져오고 싶어요. 가장 단순한 방법은 kim에게 카카오 아이디와 비밀번호를 받아 쇼핑몰이 대신 로그인하는 거예요. 예전에는 실제로 이렇게 했어요. 그런데 문제가 많아요.'
      - ul:
          - '쇼핑몰이 kim의 카카오 비밀번호를 **저장**해야 해요. 쇼핑몰이 털리면 카카오 계정이 털려요.'
          - '비밀번호로는 **모든 것**을 할 수 있어요. 프로필만 필요한데 메시지도 보낼 수 있어요.'
          - 'kim이 쇼핑몰만 끊으려면 **비밀번호를 바꿔야** 해요. 그러면 다른 서비스도 다 끊겨요.'
      - p: '**OAuth 2.0**은 비밀번호 대신 **액세스 토큰**을 넘기는 규칙이에요. kim은 비밀번호를 카카오에만 넣고, 카카오가 "쇼핑몰은 kim의 프로필을 읽어도 된다"는 토큰을 만들어 쇼핑몰에 줘요.'
      - h3: 네 역할
      - table:
          head: [역할, 이 예에서, 하는 일]
          rows:
            - ['자원 소유자', 'kim', '권한을 넘길지 정하는 사람']
            - ['클라이언트', '쇼핑몰 서버', '권한을 받아 쓰려는 서비스. 사용자의 브라우저가 아니에요']
            - ['인가 서버', '카카오 로그인 서버', 'kim을 로그인시키고 동의를 받아 토큰을 만들어요']
            - ['자원 서버', '카카오 사용자 정보 API', '토큰을 보고 데이터를 줘요']
      - p: '토큰에는 **범위**(scope)가 있어요. kim이 동의 화면에서 `profile`만 허락했다면 쇼핑몰은 프로필만 읽을 수 있어요. kim은 카카오 설정에서 쇼핑몰의 권한만 따로 끊을 수 있어요.'
      - p: '쇼핑몰은 이 흐름을 쓰기 전에 카카오에 **등록**해요. 그때 받는 것이 셋이에요.'
      - ul:
          - '**client_id:** 쇼핑몰의 공개 이름. 주소에 드러나도 괜찮아요.'
          - '**client_secret:** 쇼핑몰 서버만 아는 비밀값. 브라우저에 절대 보내지 않아요.'
          - '**redirect_uri:** kim이 동의한 뒤 돌아올 쇼핑몰의 주소. 등록한 주소로만 돌려보내요.'
      - more:
          summary: '더 알아보기: 사용자가 없는 OAuth'
          body:
            - p: '서버가 다른 서버의 API를 자기 이름으로 부를 때는 사용자의 동의가 필요 없어요. 이때는 **클라이언트 자격 증명**(client_credentials) 방식으로 client_id와 client_secret만 보내 토큰을 받아요. 결제 대행사나 사내 API에서 흔히 써요.'
      - quiz:
          q: '카카오 로그인 흐름에서 OAuth의 "클라이언트"는 누구일까요?'
          options:
            - kim의 브라우저
            - 쇼핑몰 서버
            - 카카오 인가 서버
          answer: 2
          explain: 클라이언트는 권한을 받아 쓰려는 서비스예요. 브라우저는 흐름을 이어 주는 통로일 뿐이에요.
      - next: 그러면 토큰은 어떤 순서로 만들어져 쇼핑몰 손에 들어올까요?
    recall: 사용자의 비밀번호 대신, 사용자가 동의한 범위(scope)만큼만 쓸 수 있는 액세스 토큰을 우리 서비스에 넘겨요. 역할은 자원 소유자(사용자), 클라이언트(우리 서비스), 인가 서버(토큰을 만듦), 자원 서버(토큰을 보고 데이터를 줌) 넷이에요. 클라이언트는 미리 등록해 client_id, client_secret, redirect_uri를 받아요.
  - id: q2
    title: 인가 코드 흐름은 어떤 순서로 진행되나요?
    conclusion:
      lead: '우리 서버가 브라우저를 인가 서버로 보내고, 사용자가 거기서 로그인하고 동의하면, 인가 서버가 코드를 붙여 브라우저를 우리 서버로 돌려보내요. 우리 서버는 그 코드를 인가 서버에 직접 보내 토큰으로 바꿔요.'
      sub: 'state 값을 보냈다가 돌아올 때 같은지 확인해서, 우리가 시작한 흐름으로 돌아온 것인지 봐요.'
    says:
      - '1단계: kim이 "카카오로 로그인"을 누르면 쇼핑몰 서버는 302로 브라우저를 인가 서버로 보낸다(코드 authorize). response_type=code, client_id, redirect_uri, scope, state를 쿼리로 붙인다'
      - '2단계: kim은 카카오 화면에서 카카오 비밀번호로 로그인하고 동의한다. 쇼핑몰은 이 화면을 보지 못한다'
      - '3단계: 인가 서버는 302로 브라우저를 redirect_uri로 돌려보낸다. 주소에 code와 state가 붙는다(코드 callback)'
      - '4단계: 쇼핑몰 서버는 state가 1단계에서 세션에 넣어 둔 값과 같은지 확인한다. 다르면 멈춘다. 공격자가 자기 코드를 kim의 브라우저로 보내 kim을 공격자 계정으로 로그인시키는 일을 막는다'
      - '5단계: 쇼핑몰 서버가 인가 서버에 코드와 client_secret을 보내 토큰을 받는다(코드 tokenRequest, tokenResponse). 6단계: 액세스 토큰을 `Authorization: Bearer`에 실어 사용자 정보 API를 부른다'
      - '작은 인가 서버로 흐름 전체를 돌린 기록(주고받은 주소와 응답)을 실제 출력으로 보인다'
    widget:
      kind: steps
      note: '여섯 단계를 하나씩 넘긴다. 단계마다 누가 누구에게 보내는지(브라우저를 거치는지, 서버끼리인지), 오가는 값(state, code, client_secret, access_token)을 로그 한 줄로 쌓고, 지금까지 브라우저 주소창에 드러난 값을 따로 보여 준다'
    asks:
      - '본문의 예시: 인가 서버가 사용자를 쇼핑몰로 돌려보낼 때 주소에 붙여 주는 것은 (보기: 액세스 토큰, 인가 코드와 state, 사용자의 비밀번호)'
      - '옮긴 상황: 돌아온 요청의 state가 세션에 넣어 둔 값과 다르다. 쇼핑몰 서버는 어떻게 해야 하나 (토큰을 받지 않고 흐름을 멈춘다)'
    body:
      - p: '가장 많이 쓰는 방식은 **인가 코드 흐름**(authorization code grant)이에요. 브라우저를 리다이렉트로 이리저리 보내며 진행해요. 단계마다 누가 누구에게 보내는지, 주소창에 무엇이 드러나는지 보며 넘겨 보세요.'
      - widget:
          kind: steps
          layout: [duo, buttons, log, verdict]
          buttons: each
          initial:
            duo:
              - {label: 브라우저 주소창에 드러난 값, state: dim, text: 없음}
              - {label: 쇼핑몰 서버가 가진 값, text: 'client_id, client_secret'}
          scenarios:
            default:
              - label: '1. 카카오로 보내기'
                log: '쇼핑몰 → 브라우저: 302, Location: 카카오/oauth/authorize?response_type=code&client_id=shop&redirect_uri=...&scope=profile&state=x7Kp2'
                duo:
                  - label: 브라우저 주소창에 드러난 값
                    rows: [{k: client_id, v: shop}, {k: state, v: x7Kp2, mark: changed}]
                  - label: 쇼핑몰 서버가 가진 값
                    rows: [{k: 세션의 state, v: x7Kp2, mark: changed}, {k: client_secret, v: s3cr3t}]
              - label: '2. 로그인하고 동의'
                log: '브라우저 ↔ 카카오: kim이 카카오 비밀번호로 로그인하고 "프로필 제공"에 동의 (쇼핑몰은 못 봄)'
              - label: '3. 코드를 들고 돌아오기'
                log: '카카오 → 브라우저: 302, Location: 쇼핑몰/login/oauth2/code/kakao?code=Sp1xlOBe&state=x7Kp2'
                duo:
                  - label: 브라우저 주소창에 드러난 값
                    rows: [{k: code, v: Sp1xlOBe, mark: changed}, {k: state, v: x7Kp2}]
                  - label: 쇼핑몰 서버가 가진 값
                    rows: [{k: 세션의 state, v: x7Kp2}, {k: client_secret, v: s3cr3t}]
              - label: '4. state 확인'
                log: '쇼핑몰: 돌아온 state(x7Kp2)가 세션의 값과 같은지 확인 → 같음'
              - label: '5. 코드를 토큰으로 (서버끼리)'
                log: '쇼핑몰 → 카카오: POST /oauth/token (code, client_secret) → access_token'
                duo:
                  - label: 브라우저 주소창에 드러난 값
                    rows: [{k: code, v: '이미 쓴 코드'}]
                  - label: 쇼핑몰 서버가 가진 값
                    rows: [{k: access_token, v: 'ya29...', mark: changed}]
              - label: '6. 토큰으로 API 부르기 (서버끼리)'
                log: '쇼핑몰 → 카카오 API: GET /v2/user/me, Authorization: Bearer ya29... → kim의 프로필'
                verdict: '브라우저 주소창에는 state와 code만 드러났어요. client_secret과 access_token은 쇼핑몰 서버에서 나가지 않았어요.'
      - p: 'RFC 6749의 규칙대로 만든 작은 인가 서버와 쇼핑몰 서버를 띄우고, 브라우저 역할을 하는 클라이언트로 이 흐름을 처음부터 끝까지 밟아 봤어요. 실제 카카오 서버가 아니라 규칙을 따라 만든 서버예요.'
      - ci:
          key: flow
          label: 흐름 전체의 기록 보기
          source: OAuth2FlowTest.fullFlow
          code: flowRun
      - p: '1단계의 `Location`에 `response_type=code`, `client_id`, `redirect_uri`, `scope`, `state`가 붙어 있어요. 3단계에서 돌아온 주소에는 `code`와 같은 `state`가 붙어요. 5, 6단계는 브라우저를 거치지 않고 쇼핑몰 서버가 직접 보내요.'
      - h3: state는 왜 확인하나요
      - p: '공격자가 자기 카카오 계정으로 흐름을 시작해 받은 코드를 담은 콜백 주소를 kim에게 보낸다고 해 볼게요. kim이 그 주소를 열면 쇼핑몰은 공격자의 코드로 토큰을 받아, **kim을 공격자 계정으로 로그인**시켜요. kim이 그 상태로 카드를 등록하면 공격자 계정에 남아요.'
      - p: '그래서 쇼핑몰은 1단계에서 무작위 `state`를 만들어 kim의 세션(여기서는 쿠키)에 넣어 두고, 돌아온 `state`와 맞춰 봐요. 공격자가 만든 주소의 state는 kim의 세션 값과 다르니 멈춰요. state만 바꿔 콜백을 불러 봤어요.'
      - ci:
          key: state
          label: state가 다를 때의 결과 보기
          source: OAuth2FlowTest.stateMismatchStops
          code: stateRun
      - p: '쇼핑몰은 400으로 멈췄고, 인가 서버에 토큰 요청을 아예 보내지 않았어요. 다른 사이트가 사용자의 브라우저로 요청을 보내게 하는 이런 공격을 CSRF라고 하고, 웹 보안 기초 레슨에서 더 다뤄요.'
      - quiz:
          q: '인가 서버가 kim의 브라우저를 쇼핑몰로 돌려보낼 때 주소에 붙여 주는 것은 무엇일까요?'
          options:
            - 액세스 토큰
            - 인가 코드와 state
            - kim의 카카오 비밀번호
          answer: 2
          explain: 주소에는 코드와 state만 붙어요. 토큰은 5단계에서 쇼핑몰 서버가 서버끼리 직접 받아요.
      - next: 3단계에서 바로 토큰을 주면 한 단계가 줄어드는데, 왜 굳이 코드를 주고 다시 바꾸게 할까요?
    recall: 우리 서버가 302로 브라우저를 인가 서버로 보내고(client_id, redirect_uri, scope, state), 사용자가 거기서 로그인하고 동의하면, 인가 서버가 코드와 state를 붙여 redirect_uri로 돌려보내요. 우리 서버는 state가 세션의 값과 같은지 확인하고, 코드와 client_secret을 서버끼리 보내 토큰으로 바꾼 뒤, 토큰으로 API를 불러요.
  - id: q3
    title: 왜 바로 토큰을 주지 않고 코드를 거치나요?
    conclusion:
      lead: '코드는 브라우저 주소에 드러나서 새기 쉬우니, 짧게 살고 한 번만 쓰이고 그것만으로는 쓸모없게 해요. 토큰은 client_secret을 가진 우리 서버만 서버끼리 직접 받아요.'
      sub: '브라우저를 거치는 길(프론트 채널)에는 코드만, 서버끼리의 길(백 채널)에는 토큰이 다녀요.'
    says:
      - '브라우저를 거치는 값은 주소창, 방문 기록, 서버 로그, Referer 헤더에 남을 수 있다. 여기에 토큰을 실으면 토큰이 샌다'
      - '코드는 그것만으로 API를 부를 수 없다. 토큰으로 바꾸려면 client_secret이 필요하고, 그것은 우리 서버에만 있다. 토큰 요청은 HTTPS로 서버끼리 직접 간다(N6)'
      - '코드는 짧게 산다(RFC 6749는 최대 10분을 권한다). 한 번만 쓸 수 있다. 같은 코드로 두 번째 토큰을 요청하면 invalid_grant로 거절된다. 예측의 답을 밝힌다'
      - '틀린 client_secret은 invalid_client, 1단계와 다른 redirect_uri는 invalid_grant다. 인가 서버는 등록한 redirect_uri와 정확히 같아야만 돌려보낸다. 세 경우를 작은 인가 서버로 돌린 결과를 보인다. 실제 카카오나 구글이 아니라 RFC의 규칙대로 만든 서버라고 밝힌다'
      - '더 알아보기: 모바일 앱과 SPA는 client_secret을 숨길 수 없다. PKCE는 흐름을 시작할 때 무작위 값의 해시를 보내고 토큰을 받을 때 원래 값을 보내서, 코드를 가로챈 사람이 토큰을 받지 못하게 한다'
    asks:
      - '본문의 예시: 이미 토큰으로 바꾼 인가 코드로 토큰을 다시 요청하면 인가 서버의 답은 (invalid_grant로 거절)'
      - '옮긴 상황: 누군가 kim의 브라우저 기록에서 인가 코드를 훔쳤다. 아직 쓰이지 않은 코드다. client_secret은 모른다. 이 코드로 토큰을 받을 수 있나 (없다. 토큰 요청에 client_secret이 필요하다)'
    body:
      - p: '흐름에는 길이 두 가지 있어요.'
      - ul:
          - '**프론트 채널:** 브라우저를 거쳐 리다이렉트로 오가는 길(1, 3단계). 값이 주소창에 드러나요. 그래서 방문 기록, 서버의 접속 로그, 다음 페이지로 가는 `Referer` 헤더에 남을 수 있어요.'
          - '**백 채널:** 쇼핑몰 서버가 인가 서버에 HTTPS로 직접 보내는 길(5, 6단계). 브라우저를 거치지 않아요.'
      - p: '3단계에서 토큰을 바로 주면 **토큰이 프론트 채널에 드러나요**. 그래서 거기에는 **코드**만 실어요. 코드에는 세 가지 안전장치가 있어요.'
      - ol:
          - '**코드만으로는 쓸모없어요.** 토큰으로 바꾸려면 `client_secret`이 필요하고, 그것은 쇼핑몰 서버에만 있어요.'
          - '**짧게 살아요.** RFC 6749는 최대 10분을 권해요.'
          - '**한 번만 쓸 수 있어요.** 한 번 토큰으로 바꾸면 그 코드는 끝이에요.'
      - p: 'RFC 6749의 규칙대로 만든 인가 서버의 토큰 주소에 여러 요청을 보내 봤어요. 처음 예측한 "같은 코드로 다시 요청"도 들어 있어요.'
      - ci:
          key: token-rules
          label: 네 요청의 응답 보기
          source: OAuth2FlowTest.tokenEndpointRules
          code: rulesRun
      - p: '**거절한다(invalid_grant)**가 정답이에요. {{predict-result}} 이미 쓴 코드는 다시 쓸 수 없어요. RFC 6749는 코드가 두 번 쓰이면 그 코드로 준 토큰도 취소하는 것이 좋다고 적어요. 누군가 코드를 훔쳐 먼저 썼다는 신호일 수 있어서예요.'
      - ul:
          - '**틀린 client_secret → `invalid_client`:** 코드를 훔쳐도 비밀값이 없으면 토큰을 받지 못해요.'
          - '**다른 redirect_uri → `invalid_grant`:** 토큰 요청의 redirect_uri는 1단계에서 보낸 값과 같아야 해요. 인가 서버는 1단계에서도 등록한 redirect_uri와 **정확히 같을 때만** 돌려보내요. 공격자가 자기 주소로 코드를 받아 가지 못하게 하려는 거예요.'
      - muted: '이 결과는 RFC 6749 4.1과 5.2의 규칙대로 만든 서버에서 나온 것이에요. 실제 카카오나 구글도 같은 규칙을 따르지만, 에러 메시지의 글자는 서비스마다 조금 달라요.'
      - more:
          summary: '더 알아보기: client_secret을 둘 수 없는 앱은?'
          body:
            - p: '모바일 앱과 브라우저에서만 도는 SPA는 코드를 받아도 안전하게 숨길 `client_secret`이 없어요. 앱을 뜯어보면 나오니까요. 이때는 **PKCE**를 써요. 흐름을 시작할 때 무작위 값을 만들어 그 해시만 보내고, 토큰을 받을 때 원래 값을 보내요. 인가 서버는 둘이 맞는지 봐서, 코드를 가로챈 사람은 원래 값을 몰라 토큰을 받지 못해요. 요즘은 서버가 있는 서비스에도 PKCE를 함께 권해요.'
      - quiz:
          q: '누군가 kim의 브라우저 방문 기록에서 아직 쓰이지 않은 인가 코드를 훔쳤어요. client_secret은 몰라요. 이 코드로 액세스 토큰을 받을 수 있을까요?'
          options:
            - 받을 수 있다. 코드만 있으면 된다
            - 받을 수 없다. 토큰 요청에 client_secret이 필요하다
            - 받을 수 있다. 10분 안이라면
          answer: 2
          explain: 코드를 토큰으로 바꾸는 요청에는 쇼핑몰 서버만 아는 client_secret이 들어가요. 틀리면 invalid_client예요.
      - next: 이제 쇼핑몰은 액세스 토큰을 받았어요. 그런데 이것으로 "kim이 로그인했다"고 말할 수 있을까요?
    recall: 코드는 브라우저 주소(프론트 채널)에 드러나서 새기 쉬우니, 그것만으로는 쓸모없고(client_secret이 필요), 짧게 살고, 한 번만 쓰이게 해요. 토큰은 쇼핑몰 서버가 서버끼리(백 채널) HTTPS로 받아요. 같은 코드를 다시 쓰면 invalid_grant, 틀린 secret은 invalid_client, 다른 redirect_uri는 invalid_grant예요.
  - id: q4
    title: 소셜 로그인은 OAuth와 무엇이 다른가요?
    conclusion:
      lead: 'OAuth의 액세스 토큰은 "무엇을 해도 되는지"만 알려 주고 "누구인지"는 약속하지 않아요. 로그인에는 OAuth 위에 OpenID Connect를 얹어 받은 ID 토큰으로 사용자를 확인해요.'
      sub: 'ID 토큰은 인가 서버가 서명한 JWT이고, 그 안의 sub로 사용자를 구별해요. 확인이 끝나면 우리 서비스는 우리 세션이나 JWT로 로그인 상태를 유지해요.'
    says:
      - '액세스 토큰은 자원 서버에 내는 권한 증명이다. 클라이언트가 그 안을 읽어 사용자를 알아내는 용도가 아니다. 사용자 정보 API를 불러 누구인지 알아낼 수는 있지만, 그것은 로그인을 위한 표준 규칙이 아니었다'
      - 'OpenID Connect: scope에 `openid`를 넣으면 토큰 응답에 ID 토큰이 함께 온다(코드 tokenResponse). ID 토큰은 JWT다(N7). iss(발급자), sub(사용자 번호), aud(우리 client_id), exp(만료)를 확인한다(코드 idTokenPayload)'
      - '우리 회원과 잇는 열쇠는 이메일이 아니라 (제공자, sub)다. 이메일은 바뀌거나 비어 있을 수 있다. 처음 온 sub면 회원을 만들고, 아는 sub면 그 회원으로 로그인한다'
      - '확인이 끝나면 카카오 토큰과 우리 로그인은 따로다. 쇼핑몰은 N7의 세션이나 JWT로 kim의 로그인을 유지한다. 카카오 토큰은 카카오 API를 부를 때만 쓴다'
      - '더 알아보기: 액세스 토큰은 짧게 살고, 토큰 응답의 리프레시 토큰으로 사용자 없이 새 액세스 토큰을 받는다'
    asks:
      - '본문의 예시: 소셜 로그인으로 들어온 사용자를 우리 회원과 이을 때 쓰는 값으로 가장 알맞은 것은 (보기: 이메일, 제공자와 ID 토큰의 sub, 액세스 토큰 문자열)'
      - '옮긴 상황: 어느 서비스가 "액세스 토큰이 있으면 로그인한 사용자"라고 보고, 토큰이 어느 client_id에게 발급된 것인지 확인하지 않는다. 다른 앱이 받은 토큰을 들고 오면 어떻게 되나 (그 토큰의 사용자로 로그인된다. ID 토큰의 aud처럼 우리에게 발급된 것인지 확인해야 한다)'
    body:
      - p: 'OAuth 2.0은 원래 **권한을 넘기는** 규칙이에요. 액세스 토큰은 자원 서버에게 "이 토큰을 가진 쪽은 kim의 프로필을 읽어도 된다"고 말할 뿐이에요. 토큰을 받은 쇼핑몰에게 "지금 브라우저 앞의 사람이 kim이다"를 약속하지 않아요.'
      - p: '그래서 "OAuth로 로그인"을 하려면 한 겹을 더 얹어요. **OpenID Connect**(OIDC)예요. 1단계의 scope에 `openid`를 넣으면, 5단계의 토큰 응답에 **ID 토큰**이 함께 와요.'
      - code: tokenResponse
      - p: 'ID 토큰은 인가 서버가 서명한 **JWT**예요(쿠키, 세션, 토큰 레슨). 페이로드는 이래요.'
      - code: idTokenPayload
        notes:
          - mark: '"sub": "3812294"'
            as: code
            text: '그 서비스 안에서 kim을 가리키는 바뀌지 않는 번호예요.'
      - ul:
          - '**iss:** 누가 발급했나. 카카오가 맞는지 봐요.'
          - '**sub:** 이 사용자의 번호. 카카오 안에서 kim을 가리켜요.'
          - '**aud:** 누구에게 발급했나. 우리 client_id(`shop`)여야 해요. 다른 앱이 받은 토큰을 가져오면 여기서 걸려요.'
          - '**exp:** 만료 시간. 서명과 함께 확인해요.'
      - h3: 우리 회원과 잇기
      - p: '서명과 iss, aud, exp를 확인하면 "카카오의 3812294번 사용자"가 왔다는 것을 믿을 수 있어요. 우리 회원과 이을 때 열쇠는 **(제공자, sub)**예요. 이메일은 사용자가 바꾸거나, 제공하지 않거나, 다른 제공자에서 같은 이메일이 나올 수 있어서 열쇠로 쓰기 불안해요. 처음 온 (kakao, 3812294)면 회원을 만들고, 아는 값이면 그 회원으로 로그인시켜요.'
      - p: '그다음부터는 **우리의 로그인**이에요. 쇼핑몰은 쿠키, 세션, 토큰 레슨의 세션이나 JWT로 kim의 로그인 상태를 유지해요. 카카오의 액세스 토큰은 카카오 API를 부를 때만 쓰고, 우리 서비스의 로그인 확인에는 쓰지 않아요.'
      - more:
          summary: '더 알아보기: 액세스 토큰이 만료되면'
          body:
            - p: '액세스 토큰은 보통 짧게 살아요(한 시간 안팎). 토큰 응답에 **리프레시 토큰**이 함께 오면, 쇼핑몰 서버는 kim에게 다시 동의를 받지 않고 리프레시 토큰으로 새 액세스 토큰을 받아요. 리프레시 토큰은 오래 살아서 서버에만 안전하게 보관해요.'
      - quiz:
          q: '소셜 로그인으로 들어온 사용자를 우리 회원과 이을 때 쓰는 값으로 가장 알맞은 것은 무엇일까요?'
          options:
            - 사용자의 이메일
            - 제공자와 ID 토큰의 sub
            - 액세스 토큰 문자열
          answer: 2
          explain: sub는 그 제공자 안에서 사용자를 가리키는 바뀌지 않는 번호예요. 이메일은 바뀌거나 없을 수 있고, 토큰은 매번 달라요.
    recall: OAuth의 액세스 토큰은 무엇을 해도 되는지만 알려 주고 누구인지는 약속하지 않아요. 로그인에는 OpenID Connect로 받은 ID 토큰(JWT)을 써서 iss, sub, aud, exp와 서명을 확인해요. 우리 회원과는 (제공자, sub)로 잇고, 그 뒤는 우리 세션이나 JWT로 로그인 상태를 유지해요.
practice:
  title: 스프링 시큐리티로 붙이기
  says:
    - '스프링에서는 흐름을 직접 짜지 않고 스프링 시큐리티의 OAuth2 Client에 맡긴다. 의존성(코드 gradle), application.yml의 registration과 provider(코드 yml), `oauth2Login()`(코드 security). 구글, 깃허브 등은 provider를 적지 않아도 스프링이 안다. 카카오, 네이버는 provider를 직접 적는다 (스프링 시큐리티 문서 근거)'
    - '스프링이 만드는 주소: 1단계는 `/oauth2/authorization/{registrationId}`, 3단계로 돌아오는 주소는 `/login/oauth2/code/{registrationId}`다. state 생성과 확인, 코드 교환, 사용자 정보 불러오기를 스프링이 한다. 우리는 `OAuth2UserService`로 회원과 잇는 일만 한다'
    - '흔한 실수: 로드 밸런서 뒤에서 `{baseUrl}`이 `http://`로 만들어져 등록한 `https://` redirect_uri와 달라 인가 서버가 `redirect_uri_mismatch`로 거절한다. HTTPS와 TLS 레슨의 forward-headers-strategy를 켜서 고친다 (문서 근거)'
    - 'client-secret은 코드나 저장소에 적지 않고 환경 변수로 준다(`${KAKAO_SECRET}`)'
    - '이 구역은 스프링 시큐리티를 프로젝트에 더해야 돌릴 수 있어서 테스트가 아니라 공식 문서를 근거로 적는다'
  body:
    - p: '질문 넷의 흐름을 스프링에서 직접 짜지 않아요. state를 만들고 확인하고, 코드를 토큰으로 바꾸고, 사용자 정보를 불러오는 일을 스프링 시큐리티의 **OAuth2 Client**가 해요. 이 구역은 스프링 시큐리티를 프로젝트에 더해야 돌릴 수 있어서, 테스트가 아니라 공식 문서를 근거로 적었어요.'
    - code: gradle
    - code: yml
      notes:
        - mark: ${SECRET}
          as: code
          text: 'client-secret은 코드나 저장소에 적지 않고 환경 변수로 줘요.'
    - ul:
        - '**registration:** 우리 서비스가 등록한 값(client_id, secret, scope, 돌아올 주소)이에요.'
        - '**provider:** 인가 서버의 주소들이에요. 구글, 깃허브, 페이스북은 스프링이 알고 있어서 적지 않아도 돼요. 카카오, 네이버는 직접 적어요.'
    - code: security
      notes:
        - mark: oauth2Login
          as: code
          text: '질문 2의 여섯 단계를 스프링이 해요. 로그인이 끝나면 세션에 로그인 정보를 넣어요.'
    - p: '스프링이 만드는 주소는 둘이에요. 로그인 버튼은 `/oauth2/authorization/kakao`로 가게 하고(1단계), 인가 서버에 등록할 redirect_uri는 `/login/oauth2/code/kakao`예요(3단계). 우리가 할 일은 받은 사용자 정보를 질문 4처럼 우리 회원과 잇는 것뿐이에요. `OAuth2UserService`(OIDC면 `OidcUserService`)를 구현해 등록해요.'
    - h3: '흔한 실수: 로드 밸런서 뒤의 redirect_uri_mismatch'
    - p: '로컬에서는 잘 되는데 운영에 올리면 카카오가 `redirect_uri_mismatch`로 거절해요. 설정의 `{baseUrl}`은 스프링이 받은 요청으로 만드는데, 로드 밸런서가 TLS를 끝내고 HTTP로 넘기면 `http://shop.com/...`이 돼요. 등록한 값은 `https://shop.com/...`이라 질문 3의 "정확히 같아야 한다"에 걸려요.'
    - p: 'HTTPS와 TLS 레슨에서 본 설정을 켜서 로드 밸런서의 `X-Forwarded-Proto`를 읽게 해요. 그러면 `{baseUrl}`이 `https://`로 만들어져요.'
    - code: forwarded
    - muted: '근거: [스프링 시큐리티 문서의 OAuth2 Login](link:springLogin), [RFC 6749](link:rfc6749), [OpenID Connect Core](link:oidc), [PKCE RFC 7636](link:rfc7636).'
interview:
  question: OAuth 2.0의 인가 코드 흐름을 설명하고, 소셜 로그인과 무엇이 다른지 말해 주세요
  model:
    - label: 정의
      text: OAuth 2.0은 사용자의 비밀번호를 넘기지 않고, 사용자가 동의한 범위만큼의 권한을 액세스 토큰으로 다른 서비스에 넘기는 규칙입니다. 역할은 자원 소유자, 클라이언트, 인가 서버, 자원 서버입니다.
    - label: 원리
      text: 클라이언트가 브라우저를 인가 서버로 리다이렉트하면 사용자가 로그인하고 동의하고, 인가 서버가 코드와 state를 붙여 redirect_uri로 돌려보냅니다. 클라이언트는 state를 확인한 뒤 코드와 client_secret을 서버끼리 보내 토큰을 받습니다. 코드는 브라우저에 드러나니 짧게 살고 한 번만 쓰이며 secret 없이는 쓸모없습니다.
    - label: 주의할 점
      text: 액세스 토큰은 권한 증명이지 사용자 인증이 아니어서, 로그인에는 OpenID Connect의 ID 토큰으로 iss, aud, exp, 서명을 확인하고 sub로 회원을 잇습니다. redirect_uri는 등록한 값과 정확히 같아야 해서 로드 밸런서 뒤에서는 forward 헤더 설정이 필요합니다. secret을 둘 수 없는 앱은 PKCE를 씁니다.
    - label: 경험
      text: '(내 프로젝트로 채우기) 예: 스프링 시큐리티 OAuth2 Client로 카카오 로그인을 붙이다 운영에서 redirect_uri_mismatch가 나서 forward-headers-strategy로 해결했습니다.'
verified: 이 레슨의 흐름은 실제 카카오나 구글 서버가 아니라, RFC 6749 4.1과 5.2의 규칙대로 만든 작은 인가 서버와 쇼핑몰 서버를 자바 21로 띄워 밟은 결과예요. 스프링 시큐리티 설정은 공식 문서가 근거예요. 코드가 바뀔 때마다 테스트([OAuth2FlowTest](link:test))가 다시 돌아요.
footer: '근거: OAuth 2.0의 역할, 인가 코드 흐름, state, 코드의 수명과 한 번 쓰기, 에러 이름은 RFC 6749, Bearer 토큰은 RFC 6750, PKCE는 RFC 7636, ID 토큰은 OpenID Connect Core 1.0, 스프링 설정은 스프링 시큐리티 문서. 오류는 [GitHub 이슈](https://github.com/wanja727/dev-lessons/issues)로 알려 주세요.'
claims:
  - claim: '1단계 리다이렉트의 Location에 response_type=code, client_id, redirect_uri, scope, state가 붙고, 흐름을 끝까지 밟으면 쇼핑몰 서버가 액세스 토큰으로 사용자 정보를 받는다'
    how: 'RFC 6749 4.1의 규칙대로 만든 작은 인가 서버와 쇼핑몰 서버를 JDK HttpServer로 띄우고, 리다이렉트를 따라가지 않는 HttpClient로 흐름을 밟는다'
    test: OAuth2FlowTest.fullFlow
  - claim: '같은 코드로 두 번째 토큰 요청을 하면 invalid_grant, 틀린 client_secret은 invalid_client, 다른 redirect_uri는 invalid_grant다'
    how: '작은 인가 서버에 요청한다. RFC 6749 5.2의 에러 이름을 쓴다'
    test: OAuth2FlowTest.tokenEndpointRules
  - claim: '돌아온 state가 다르면 쇼핑몰 서버가 토큰을 요청하지 않는다'
    how: 'state를 바꿔 콜백 주소를 부르고 인가 서버가 받은 토큰 요청 수를 센다'
    test: OAuth2FlowTest.stateMismatchStops
sources:
  - 'OAuth 2.0의 역할, 인가 코드 흐름, state, 코드의 수명과 한 번 쓰기, 에러 이름: RFC 6749 https://www.rfc-editor.org/rfc/rfc6749.html'
  - 'Bearer 토큰: RFC 6750 https://www.rfc-editor.org/rfc/rfc6750.html'
  - 'PKCE: RFC 7636 https://www.rfc-editor.org/rfc/rfc7636.html'
  - 'OpenID Connect의 ID 토큰: https://openid.net/specs/openid-connect-core-1_0.html'
  - '스프링 시큐리티 OAuth2 Login: https://docs.spring.io/spring-security/reference/servlet/oauth2/login/core.html'
