# 값과 참조 (설계서)
# 자료 파일의 칸은 docs/lesson-data-format.md에 있다.
stage: design
title: 값과 참조
unit: 자바 언어
roadmap: J2
type: 자바 실행
prerequisites:
  - {slug: java-execution, title: 자바 프로그램이 실행되는 과정}
assume: '자바 21. 클래스를 만들고 `new`로 객체를 만들어 메서드를 불러 본 것. 변수가 메모리의 어디에 놓이는지는 몰라도 돼요.'
example: '주문 `Order`(필드는 `int price` 하나)와 할인 메서드. 주문과 금액을 메서드에 넘기고, 메서드가 끝난 뒤 호출한 쪽의 값이 바뀌었는지 봐요.'
intro:
  - '할인 금액을 계산하는 메서드에 주문을 넘겼을 뿐인데, 돌아와 보니 원래 주문의 금액이 바뀌어 있어요. 반대로 메서드 안에서 분명히 새 값으로 바꿨는데 호출한 쪽에는 반영되지 않는 일도 있어요. 두 일은 같은 규칙 하나에서 나와요.'
  - '스프링 개발자는 객체를 끊임없이 넘겨요. 컨트롤러가 서비스에 DTO를 넘기고, 서비스가 리포지토리에서 받은 엔티티를 고쳐요. JPA가 엔티티의 필드만 바꿔도 UPDATE를 보내는 것, 싱글톤 빈이 가진 리스트를 한 요청이 고치면 다른 요청에도 보이는 것이 모두 이 규칙 위에 있어요.'
  - '이 레슨에서는 변수에 실제로 무엇이 들어 있는지를 코드를 돌려 확인하고, 메서드에 넘길 때 복사되는 것과 `==`가 비교하는 것을 같은 눈으로 봐요.'
covers:
  - topic: '기본형 여덟 가지와 참조형. 기본형 변수에는 값이, 참조형 변수에는 객체를 가리키는 값(참조)이 들어 있다'
    where: '질문 1'
  - topic: '대입은 변수에 든 것을 복사한다. 참조형을 대입하면 두 변수가 같은 객체를 가리킨다'
    where: '질문 1'
  - topic: '배열도 참조형이다'
    where: '질문 1'
  - topic: '자바는 언제나 값으로 넘긴다(pass by value). 참조형은 참조가 복사된다'
    where: '질문 2'
  - topic: '메서드 안에서 객체의 필드를 바꾸면 호출한 쪽에 보이고, 매개변수에 새 객체를 대입하면 보이지 않는다'
    where: '질문 2'
  - topic: '==는 변수에 든 것을 비교한다. 기본형은 값, 참조형은 같은 객체인지'
    where: '질문 3'
  - topic: 'Object의 equals는 ==와 같고, String처럼 내용을 비교하게 재정의한 클래스가 있다'
    where: '질문 3'
  - topic: 'null은 아무 객체도 가리키지 않는 참조다. null에 점을 찍으면 NullPointerException'
    where: '질문 4'
  - topic: '필드의 기본값(0, false, null)과 지역 변수는 초기화해야 쓸 수 있다는 것'
    where: '질문 4'
  - topic: 'NullPointerException 메시지가 무엇이 null이었는지 알려 준다(자바 14부터)'
    where: '질문 4의 더 알아보기'
  - topic: '스프링에서: 서비스에 넘긴 객체를 고치면 호출한 쪽에도 보인다. JPA의 변경 감지가 이 위에 서 있다'
    where: '실무에서는. 변경 감지의 동작은 영속성 컨텍스트(P2)'
  - topic: '스프링에서: 싱글톤 빈이 가진 컬렉션을 그대로 돌려주면 모든 요청이 같은 객체를 고친다'
    where: '실무에서는. 막는 방법은 불변 객체(J9), 여러 스레드에서의 문제는 경쟁 상태와 동기화(C3)'
  - topic: 'Integer 같은 래퍼를 ==로 비교하면 생기는 일'
    where: '다루지 않음: 래퍼 클래스와 오토박싱(J3)'
  - topic: '문자열 리터럴을 ==로 비교하면 true가 나오는 이유(문자열 상수 풀)'
    where: '다루지 않음: String(J4)'
  - topic: 'equals를 직접 재정의하는 방법과 hashCode'
    where: '다루지 않음: equals와 hashCode(J6)'
  - topic: 'final 변수와 불변 객체, 넘겨받은 객체를 복사해 두는 방어적 복사, 얕은 복사와 깊은 복사'
    where: '다루지 않음: 불변 객체(J9)'
  - topic: '변수와 객체가 메모리의 어디(스택, 힙)에 놓이나'
    where: '다루지 않음: JVM 메모리 구조(J14)'
  - topic: 'null을 돌려주는 대신 Optional을 쓰는 것'
    where: '다루지 않음: 스트림과 Optional(J13)'
  - topic: '정수 오버플로, 부동소수점 오차, 돈 계산에 쓰는 BigDecimal'
    where: '다루지 않음: 숫자 타입의 한계(J19)'
codes:
  predict: |-
    static void discount(Order o, int rate) {
      o.price = o.price * (100 - rate) / 100;
      rate = 0;
    }

    Order order = new Order(10000);
    int rate = 10;
    discount(order, rate);
    System.out.println(order.price);
    System.out.println(rate);
  reassign: |-
    static void replace(Order o) {
      o = new Order(1);
    }

    Order order = new Order(10000);
    replace(order);
    System.out.println(order.price);
predict:
  text: '코드 predict를 실행하면 두 줄에 무엇이 출력될까요? 보기: 10000과 10, 9000과 10, 9000과 0, 10000과 0.'
  answer: '9000과 10. 메서드가 받은 `o`는 같은 주문 객체를 가리켜서 필드를 바꾼 것이 보이고, `rate`는 값이 복사된 것이라 메서드 안에서 0으로 바꿔도 바깥은 그대로다. 질문 2에서 밝힌다.'
questions:
  - id: q1
    title: 변수에는 무엇이 들어 있나요?
    conclusion:
      lead: '기본형 변수에는 값 자체가, 참조형 변수에는 객체가 아니라 객체를 가리키는 값(참조)이 들어 있어요.'
      sub: '대입은 변수에 든 것을 복사하므로, 참조형 변수를 대입하면 객체는 하나인 채로 두 변수가 그 객체를 함께 가리켜요.'
    says:
      - '기본형은 여덟 가지다: `byte`, `short`, `int`, `long`, `float`, `double`, `char`, `boolean`. 그 밖의 모든 타입(클래스, 배열, 인터페이스, enum)은 참조형이다'
      - '`int a = 10; int b = a; b = 20;` 뒤에 `a`는 10이다. 값이 복사됐고 두 변수는 서로 상관없다'
      - '`Order a = new Order(10000); Order b = a; b.price = 5000;` 뒤에 `a.price`는 5000이다. `new`는 한 번만 불렸고 객체는 하나다. 복사된 것은 그 객체를 가리키는 참조다'
      - '참조는 객체를 찾아가는 값이다. 자바는 그 값이 실제로 무엇인지(주소인지) 드러내지 않고, 개발자는 점(`.`)으로 객체에 닿을 수만 있다'
      - '배열도 참조형이다. `int[] x = {1, 2}; int[] y = x; y[0] = 9;` 뒤에 `x[0]`은 9다. 안에 든 것이 기본형이어도 배열 자체는 객체다'
      - '객체를 따로 하나 더 갖고 싶으면 `new`로 새로 만들어 값을 옮겨야 한다. 대입으로는 생기지 않는다'
    asks:
      - '본문의 예시: `Order a = new Order(10000); Order b = a; b.price = 5000;`을 실행한 뒤 `a.price`는 얼마인가 (5000)'
      - '옮긴 상황: `int[] x = {1, 2}; int[] y = x; y = new int[]{7, 8}; y[0] = 9;`를 실행한 뒤 `x[0]`은 얼마인가 (1. `y`에 새 배열을 대입한 뒤로는 `x`와 다른 배열을 가리킨다)'
  - id: q2
    title: 메서드에 넘기면 무엇이 복사되나요?
    conclusion:
      lead: '언제나 변수에 든 것이 복사돼요. 기본형은 값이, 참조형은 참조가 복사돼요.'
      sub: '그래서 메서드 안에서 객체의 필드를 바꾸면 호출한 쪽에 보이고, 매개변수에 다른 것을 대입하면 보이지 않아요.'
    says:
      - '메서드의 매개변수는 그 메서드의 새 변수다. 호출할 때 인자에 든 것이 그 변수로 복사된다. 대입과 같은 일이다'
      - '코드 predict에서 `rate`는 10이 복사됐다. 메서드 안의 `rate = 0`은 메서드의 변수만 바꾼다. 바깥의 `rate`는 10이다'
      - '`o`에는 참조가 복사됐다. 메서드의 `o`와 바깥의 `order`가 같은 객체를 가리킨다. `o.price`를 바꾸면 그 하나뿐인 객체가 바뀌므로 바깥에서 9000이 보인다. 예측의 답을 밝힌다'
      - '코드 reassign에서 `o = new Order(1)`은 메서드의 변수 `o`가 다른 객체를 가리키게 할 뿐이다. 바깥의 `order`는 여전히 원래 객체를 가리키고 `order.price`는 10000이다'
      - '자바에는 "참조로 넘기기"가 없다. 그것이 있다면 코드 reassign에서 바깥의 `order`가 바뀌었을 것이다. 자바는 참조를 값으로 넘긴다'
      - '돌려주는 값도 같다. 메서드가 객체를 반환하면 참조가 복사되어 나온다'
    widget:
      kind: steps
      note: '코드 predict와 코드 reassign을 시나리오로 고른다. 왼쪽 칸에 변수들(바깥의 `order`, `rate`와 메서드의 `o`, `rate`), 오른쪽 칸에 객체(`Order` price)를 두고, 줄을 하나씩 실행할 때마다 어느 변수가 어느 객체를 가리키는지와 바뀐 값을 표시한다. 메서드가 끝나면 메서드의 변수가 사라지는 것까지 보여 준다'
    asks:
      - '본문의 예시: 코드 reassign을 실행하면 무엇이 출력되나 (10000)'
      - '옮긴 상황: `static void add(List<String> names) { names.add("lee"); names = new ArrayList<>(); names.add("park"); }`에 `kim` 하나가 든 `ArrayList`를 넘겼다. 메서드가 끝난 뒤 호출한 쪽 리스트에 든 것은 무엇인가 (kim, lee)'
      - '실무 구역: 서비스 메서드 `void clear(List<Item> items) { items = new ArrayList<>(); }`를 부른 뒤 호출한 쪽 리스트의 크기는 어떻게 되나. 조건: 넘기기 전의 크기는 3이다 (3 그대로다)'
  - id: q3
    title: '==는 무엇을 비교하나요?'
    conclusion:
      lead: '`==`도 변수에 든 것을 비교해요. 기본형은 값이 같은지, 참조형은 같은 객체를 가리키는지를 봐요.'
      sub: '내용이 같은지 보려면 `equals`를 부르는데, 클래스가 `equals`를 재정의하지 않았으면 `equals`도 `==`와 같아요.'
    says:
      - '`int a = 10000, b = 10000;`에서 `a == b`는 true다. 값을 비교한다'
      - '`new Order(10000) == new Order(10000)`은 false다. 금액이 같아도 `new`를 두 번 불렀으니 객체가 둘이고 참조가 다르다'
      - '`Order a = ...; Order b = a;`에서 `a == b`는 true다. 같은 객체를 가리킨다'
      - '`Object`의 `equals`는 `==`와 같은 일을 한다. `Order`가 `equals`를 재정의하지 않았으면 `new Order(10000).equals(new Order(10000))`도 false다'
      - '`String`은 `equals`를 글자를 비교하게 재정의했다. `new String("kim").equals(new String("kim"))`은 true이고 `==`는 false다. 예제는 일부러 `new String`으로 만든다. 리터럴끼리의 `==`가 왜 다른지는 J4에서 다룬다'
      - '내 클래스에서 "값이 같으면 같다"를 만드는 방법은 J6에서 다룬다'
    asks:
      - '본문의 예시: `equals`를 재정의하지 않은 `Order`로 `Order a = new Order(10000); Order b = new Order(10000); Order c = a;`를 만들었다. `a == b`, `a == c`, `a.equals(b)`의 결과는 차례로 무엇인가 (false, true, false)'
      - '옮긴 상황: `String s = new String("PAID"); String t = new String("PAID");`에서 `s == t`와 `s.equals(t)`의 결과는 무엇인가 (false와 true)'
  - id: q4
    title: null은 무엇이고 왜 NullPointerException이 나나요?
    conclusion:
      lead: 'null은 아무 객체도 가리키지 않는 참조이고, 그 참조로 필드나 메서드에 닿으려 하면 닿을 객체가 없어서 `NullPointerException`이 나요.'
      sub: '객체의 참조형 필드는 값을 주지 않으면 null로 시작하므로, 넣은 적 없는 필드를 쓰는 곳에서 자주 만나요.'
    says:
      - '참조형 변수는 객체를 가리키거나 null이다. 기본형 변수는 null이 될 수 없다'
      - '`Order o = null; o.price`는 `NullPointerException`이다. null을 들고 있는 것, 넘기는 것, `==`로 비교하는 것은 문제가 없다. 점을 찍어 따라가는 순간에 난다'
      - '필드는 값을 주지 않으면 기본값으로 시작한다. 숫자는 0, `boolean`은 false, 참조형은 null이다. 배열의 칸도 같다. `new Order[3]`의 칸은 모두 null이다'
      - '지역 변수는 기본값이 없다. 값을 주지 않고 읽으면 컴파일 오류다'
      - '`o == null`은 참조를 비교하므로 안전하다. `o.equals(x)`는 `o`가 null이면 예외다. 그래서 `"PAID".equals(status)`처럼 null이 아닌 쪽에서 부르거나 `Objects.equals(a, b)`를 쓴다'
      - '더 알아보기: 자바 14부터 예외 메시지가 무엇이 null이었는지 알려 준다. 스택 트레이스의 줄 번호와 이 메시지로 한 줄에 점이 여러 개일 때 어느 것인지 찾는다'
    asks:
      - '본문의 예시: `class Member { String name; int age; }`를 `new Member()`로 만들고 아무것도 넣지 않았다. `m.age`와 `m.name.length()`를 차례로 실행하면 각각 어떻게 되나 (0이 나오고, 다음 줄에서 `NullPointerException`)'
      - '옮긴 상황: `String status = null;`일 때 `status == null`, `"PAID".equals(status)`, `status.equals("PAID")`를 각각 실행한 결과는 무엇인가 (true, false, `NullPointerException`)'
practice:
  says:
    - '서비스 메서드에 넘긴 객체를 고치면 호출한 쪽에도 보인다. 질문 2의 규칙 그대로다. 예: `orderService.applyCoupon(order, coupon)`이 `order.price`를 바꾸면 컨트롤러가 든 `order`도 바뀌어 있다. 반환값이 없어도 결과가 전해지는 코드와, 그래서 "이 메서드가 내 객체를 고치는지"를 이름과 시그니처로 드러내야 하는 이유를 보여 준다 (순수 자바 테스트)'
    - 'JPA의 변경 감지가 같은 원리다. `findById`로 받은 엔티티는 영속성 컨텍스트가 들고 있는 것과 같은 객체다. 그래서 필드만 바꾸고 `save`를 부르지 않아도 JPA가 바뀐 것을 안다. 이 레슨은 "같은 객체를 가리킨다"까지만 말하고 동작은 P2에 넘긴다 (설명만, 테스트 없음)'
    - '흔한 실수 1: 넘겨받은 매개변수에 새 객체를 대입하고 호출한 쪽이 바뀌길 기대한다(`items = new ArrayList<>()`). 고친 코드: 새 리스트를 반환하고 호출한 쪽이 받아 쓰거나, 받은 리스트에 `clear()`를 부른다 (순수 자바 테스트)'
    - '흔한 실수 2: 싱글톤 빈이 필드로 가진 리스트를 getter로 그대로 돌려준다. 한 요청이 그 리스트에 `add`하면 다음 요청에서도 보인다. 빈은 하나이고 모든 요청이 같은 객체의 참조를 받기 때문이다. 고친 코드: `List.copyOf(...)`로 복사본을 주거나 처음부터 `List.of(...)`로 만든다. 왜 그것으로 막히는지는 J9에서 다룬다 (스프링 컨텍스트를 작게 띄워 빈을 두 번 받아 확인하는 테스트)'
    - 'DTO와 엔티티의 `id`를 `Long`으로 두는 것과 그 비교는 J3에서 다룬다는 한 줄'
claims:
  - claim: '코드 predict의 출력은 9000과 10이다'
    how: '코드를 그대로 돌려 출력을 `CiOutput`에 남긴다'
  - claim: '코드 reassign의 출력은 10000이다'
    how: '코드를 그대로 돌린다'
  - claim: '참조형 변수를 대입한 뒤 한쪽으로 필드를 바꾸면 다른 쪽에서도 바뀐 값이 보인다. 배열도 같다'
    how: '`Order`와 `int[]`로 대입 뒤 값을 바꾸고 읽는다'
  - claim: '`equals`를 재정의하지 않은 클래스는 값이 같은 두 객체의 `==`와 `equals`가 모두 false다. `new String`으로 만든 두 문자열은 `==`가 false이고 `equals`가 true다'
    how: '두 경우를 돌려 결과를 본다'
  - claim: '값을 주지 않은 필드는 0, false, null이고, null에 점을 찍으면 `NullPointerException`이 난다. 메시지에 무엇이 null이었는지 들어 있다'
    how: '필드를 읽고, 예외를 잡아 메시지를 `CiOutput`에 남긴다. 메시지의 문구는 그대로 붙이고 단정은 타입과 필드 이름이 들어 있는지만 한다'
  - claim: '`"PAID".equals(null)`은 false이고 `Objects.equals(null, null)`은 true다'
    how: '그대로 돌린다'
  - claim: '싱글톤 빈이 필드의 리스트를 그대로 돌려주면 한 호출이 더한 원소가 다음 호출에서 보이고, `List.copyOf`로 돌려주면 보이지 않는다'
    how: '`AnnotationConfigApplicationContext`에 빈 하나를 등록하고, 받은 리스트에 더한 뒤 다시 받아 크기를 본다'
sources:
  - '기본형과 참조형: 자바 언어 명세 4장 https://docs.oracle.com/javase/specs/jls/se21/html/jls-4.html'
  - '메서드 호출에서 인자의 값으로 매개변수를 초기화한다: 자바 언어 명세 8.4.1 https://docs.oracle.com/javase/specs/jls/se21/html/jls-8.html#jls-8.4.1'
  - '필드의 기본값과 지역 변수의 초기화: 자바 언어 명세 4.12.5 https://docs.oracle.com/javase/specs/jls/se21/html/jls-4.html#jls-4.12.5'
  - '`==`의 참조 비교: 자바 언어 명세 15.21.3 https://docs.oracle.com/javase/specs/jls/se21/html/jls-15.html#jls-15.21.3'
  - '`Object.equals`: API 문서 https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/lang/Object.html#equals(java.lang.Object)'
  - '무엇이 null이었는지 알려 주는 메시지: JEP 358 https://openjdk.org/jeps/358'
