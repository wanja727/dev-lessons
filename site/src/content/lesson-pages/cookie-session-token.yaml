# 쿠키, 세션, 토큰
# 자료 파일의 칸은 docs/lesson-data-format.md에 있다. 문제는 content/questions/cookie-session-token.yaml에 있다.
title: 쿠키, 세션, 토큰
description: 쿠키가 왜 필요한지, 세션 방식과 토큰(JWT) 방식이 로그인 상태를 어떻게 유지하는지, 둘이 무엇을 얻고 무엇을 잃는지. 네 가지 질문에 스스로 답할 수 있게 만드는 대화형 레슨.
unit: 네트워크·웹
minutes: 15
roadmap: N7
type: 개념 설명
prerequisites: []
assume: HTTP 요청과 응답에 헤더가 있다는 것. JWT는 서명만 한 형태를 다뤄요. 쿠키의 보안 속성과 XSS, CSRF는 웹 보안 기초 레슨에서 다뤄요.
example: 사용자 kim이 쇼핑몰에 로그인하고 내 정보(GET /me)를 봐요. 코드 대신 요청과 응답의 헤더를 보여 줘요.
codes:
  setCookie: |-
    HTTP/1.1 200 OK
    [[Set-Cookie: theme=dark]]
  cookie: |-
    GET /me HTTP/1.1
    [[Cookie: theme=dark]]
  sessionRequest: |-
    GET /me HTTP/1.1
    Cookie: [[JSESSIONID=abc123]]
  tokenRequest: |-
    GET /me HTTP/1.1
    Authorization: [[Bearer eyJhbGci...]]
  payload: |-
    {
      "sub": "kim",
      "role": "USER",
      [["exp": 1795000000]]
    }
  roleRun: |-
    # 서버가 준 쿠키는 role=USER
    GET /admin HTTP/1.1
    Cookie: [[role=ADMIN]]
  sessionRun: |-
    POST /login HTTP/1.1

    GET /me HTTP/1.1
    Cookie: JSESSIONID=(받은 값)

    POST /logout HTTP/1.1
    Cookie: JSESSIONID=(받은 값)

    # 로그아웃한 뒤, 같은 쿠키로 다시
    [[GET /me HTTP/1.1]]
    Cookie: JSESSIONID=(받은 값)
  twoServersRun: |-
    # 서버 A에 로그인해서 쿠키를 받는다
    POST /login HTTP/1.1

    # 같은 쿠키를 서버 A와 [[서버 B]]에 보낸다
    GET /me HTTP/1.1
    Cookie: JSESSIONID=(받은 값)
  jwtRun: |-
    # 로그인해서 토큰을 받는다
    POST /login HTTP/1.1

    # 받은 토큰을 점(.)에서 나누고
    # 앞의 두 부분을 [[키 없이]] 풀어 본다
  tamperRun: |-
    # 페이로드의 role만 ADMIN으로 바꾼다
    # 서명(세 번째 부분)은 [[그대로]] 둔다
    GET /me HTTP/1.1
    Authorization: Bearer (바꾼 토큰)
  suspendRun: |-
    # kim이 세션 쿠키와 토큰을 받아 둔다
    # 관리자가 [[kim의 계정을 정지]]한다
    # 서버는 kim의 세션을 지운다

    GET /me HTTP/1.1
    Cookie: JSESSIONID=(받은 값)

    GET /me HTTP/1.1
    Authorization: Bearer (받은 토큰)
links:
  test: https://github.com/wanja727/dev-lessons/blob/main/verification/src/test/java/lab/devlessons/cookiesessiontoken/CookieSessionTokenTest.java
predict:
  title: 요청이 다른 서버로 가면 어떻게 될까요?
  text: 쇼핑몰에 서버 A와 B가 있어요. 두 서버는 로그인한 사용자의 정보(세션)를 각자 자기 메모리에만 저장해요. kim이 서버 A에서 로그인했고, 다음 요청은 서버 B로 갔어요. B는 이 요청을 어떻게 처리할까요? 모르는 게 정상이니 감으로 골라 보세요. 답은 질문 2에 나와요.
  label: 내 예측
  options:
    - value: ask
      label: A에게 물어봐서 kim으로 처리
    - value: none
      label: 로그인하지 않은 요청으로 처리
    - value: cookie
      label: 쿠키를 보고 kim으로 처리
  answer: none
  storageKey: cst-predict
  wrong: 예측은 "{label}"이었어요. 틀린 예측이 더 오래 남으니 괜찮아요.
questions:
  - id: q1
    title: 쿠키는 무엇이고 왜 필요한가요?
    conclusion:
      lead: 서버가 준 값을 브라우저가 저장했다가 요청마다 자동으로 실어 보내는 것이에요.
      sub: HTTP는 요청을 따로따로 이해해서, 요청마다 "나는 누구"를 알려 주는 값이 함께 가야 해요.
    says:
      - HTTP는 무상태다. 서버는 이 요청이 아까 그 사람의 요청인지 HTTP만으로는 알 수 없다. 그래서 누구인지 알려 주는 값을 요청마다 함께 보내야 한다
      - 서버는 응답의 Set-Cookie 헤더로 값을 준다. 브라우저는 저장했다가 그 사이트로 가는 요청의 Cookie 헤더에 자동으로 넣는다
      - 쿠키는 브라우저에 저장되어 사용자가 보거나 바꿀 수 있다. 서버는 바꾼 값인지 구별하지 못한다. 그래서 role=ADMIN 같은 값을 그대로 담으면 안 된다
    widget:
      kind: timeline
      note: 위젯을 두지 않는다. 쿠키가 오가는 모습은 응답과 다음 요청의 헤더 두 토막과 실제 출력으로 보여 준다. 타임라인은 질문 2에서 한 번만 쓴다 (설계 단계의 칸이 위젯을 꼭 적게 되어 있어 여기에 적는다)
    asks:
      - '본문의 예시: Set-Cookie: theme=dark가 든 응답을 받은 브라우저가 다음 요청에 넣는 헤더는 무엇인가 (Cookie: theme=dark)'
      - '옮긴 상황: 서버가 쿠키에 role=USER를 그대로 담아 주고 쿠키의 role만 보고 관리자 화면을 연다. 사용자가 값을 ADMIN으로 바꿔 보내면 어떻게 되나 (서버는 구별하지 못하고 관리자로 처리한다)'
    body:
      - p: 쇼핑몰에 로그인한 kim이 내 정보 화면을 열면 브라우저는 `GET /me` 요청을 보내요. 서버는 이 요청이 kim의 것인지 어떻게 알까요?
      - p: HTTP만으로는 알 수 없어요. HTTP는 **무상태**(stateless)예요. 요청 하나하나를 앞의 요청과 상관없이 따로 이해할 수 있게 만들어졌다는 뜻이에요. 서버가 보기에 방금 로그인한 요청과 지금 온 `GET /me`는 서로 모르는 두 요청이에요.
      - p: 그래서 **누구인지 알려 주는 값을 요청마다 함께 보내야** 해요. 그 값을 실어 나르는 수단이 쿠키예요.
      - h3: 서버가 주고, 브라우저가 돌려보내요
      - p: 서버는 응답의 `Set-Cookie` 헤더로 값을 줘요.
      - code: setCookie
        notes:
          - mark: 'Set-Cookie: theme=dark'
            as: code
            text: 서버가 브라우저에게 "이 값을 저장해 둬"라고 하는 헤더예요.
      - p: 브라우저는 이 값을 저장했다가, 같은 사이트로 가는 요청마다 `Cookie` 헤더에 넣어요.
      - code: cookie
        notes:
          - mark: 'Cookie: theme=dark'
            as: code
            text: 브라우저가 저장해 둔 값을 돌려보내는 헤더예요.
      - p: 넣는 일은 **브라우저가 자동으로** 해요. 페이지의 자바스크립트가 요청마다 챙기지 않아도 돼요. 쿠키 없이 온 요청에서는 서버가 읽을 값이 없어요.
      - h3: 쿠키의 값은 사용자가 바꿀 수 있어요
      - p: 쿠키는 브라우저, 곧 사용자의 컴퓨터에 저장돼요. 사용자는 브라우저의 개발자 도구로 값을 보고 고칠 수 있어요. 서버가 권한을 `role=USER`라는 쿠키로 줬는데, 사용자가 `ADMIN`으로 고쳐서 보내면 어떻게 될까요? 먼저 예상해 보고 열어 보세요.
      - ci:
          key: cookie-role
          label: 서버의 실제 응답 보기
          source: CookieSessionTokenTest.serverCannotTellEditedCookie
          code: roleRun
      - p: 관리자 화면이 열렸어요. 서버는 받은 값이 자기가 준 그대로인지, 사용자가 고친 것인지 구별하지 못해요. 그래서 권한이나 사용자 이름처럼 **서버가 믿어야 하는 값을 쿠키에 그대로 담으면 안 돼요**.
      - quiz:
          q: '브라우저가 응답에서 Set-Cookie: lang=ko를 받았어요. 같은 사이트로 가는 다음 요청에 이 값을 넣는 것은 누구일까요?'
          options:
            - 페이지의 자바스크립트가 요청마다 직접 넣는다
            - 브라우저가 자동으로 넣는다
            - 서버가 받은 요청에 채워 넣는다
          answer: 2
          explain: '브라우저가 저장해 둔 쿠키를 Cookie: lang=ko 헤더로 자동으로 넣어요.'
      - next: 값을 그대로 담을 수 없다면, 쿠키에 무엇을 담아야 서버가 로그인한 사용자를 믿고 알아볼 수 있을까요?
    recall: 서버가 Set-Cookie로 준 값을 브라우저가 저장했다가 요청마다 Cookie 헤더에 자동으로 실어 보내는 것이에요. HTTP는 요청을 따로따로 이해해서, 누구인지 알려 주는 값이 요청마다 함께 가야 해요. 쿠키의 값은 사용자가 바꿀 수 있어서 권한 같은 값을 그대로 담으면 안 돼요.
  - id: q2
    title: 세션 방식은 어떻게 로그인 상태를 유지하나요?
    conclusion:
      lead: 로그인 정보는 서버가 저장하고, 브라우저에는 그 정보를 찾는 번호(세션 ID)만 쿠키로 줘요.
      sub: 서버는 요청마다 세션 ID로 저장소에서 로그인 정보를 찾아요. 저장소에 없으면 로그인하지 않은 요청이에요.
    says:
      - 로그인하면 서버는 로그인 정보를 서버 쪽 저장소에 저장하고, 그 정보를 찾는 세션 ID를 만들어 Set-Cookie로 준다. 스프링 부트(톰캣)에서 쿠키 이름은 JSESSIONID다
      - 쿠키에는 세션 ID만 있다. 사용자 이름이나 권한은 서버에 있다. 다음 요청이 오면 서버는 세션 ID로 저장소에서 로그인 정보를 찾는다
      - 서버가 세션을 지우면(로그아웃) 브라우저에 쿠키가 남아 있어도 찾을 정보가 없어 로그인하지 않은 요청이 된다
      - 세션을 서버의 메모리에만 두면 그 서버만 찾을 수 있다. 서버가 두 대면 A에서 로그인한 요청이 B로 갔을 때 B에는 세션이 없다. 서버를 다시 켜도 사라진다. 그래서 서버가 여러 대면 세션 저장소를 함께 쓴다
    widget:
      kind: timeline
      note: 로그인 요청, Set-Cookie가 든 응답, 세션 ID가 든 다음 요청, 응답을 차례로 넘긴다. 위쪽 두 칸에 브라우저의 쿠키와 서버의 세션 저장소를 두고 단계마다 무엇이 들어가는지 보여 준다. 마지막 단계에서 로그아웃으로 저장소가 비면 같은 쿠키가 401을 받는다
    asks:
      - '본문의 예시: 서버가 세션 abc123을 지운 뒤(로그아웃), 브라우저에 남은 쿠키 JSESSIONID=abc123으로 온 요청은 어떻게 처리되나 (로그인하지 않은 요청)'
      - '옮긴 상황: 서버 한 대가 세션을 메모리에만 둔다. 배포하느라 서버를 다시 켠 뒤, 로그인해 있던 사용자의 다음 요청은 어떻게 되나 (세션이 사라져 로그인하지 않은 요청)'
    body:
      - p: 세션 방식은 서버가 믿어야 하는 값을 브라우저에 주지 않아요. 로그인 정보(누구인지, 권한이 무엇인지)는 **서버 쪽 저장소**에 두고, 브라우저에는 그 정보를 찾는 번호만 줘요. 서버에 둔 로그인 정보를 **세션**, 그 번호를 **세션 ID**라고 해요.
      - p: 아래에서 한 단계씩 넘기며 브라우저의 쿠키와 서버의 세션 저장소에 무엇이 들어가는지 보세요. 세션 ID는 실제로는 길고 무작위인 값인데, 여기서는 `abc123`으로 줄여 썼어요.
      - widget:
          kind: timeline
          layout: [duo, timeline, buttons, verdict]
          lanes: [브라우저, 서버]
          initial:
            duo:
              - {label: 브라우저에 저장된 쿠키, state: dim, text: 없음}
              - {label: 서버의 세션 저장소, state: dim, text: 없음}
          scenarios:
            default:
              - event:
                  dir: right
                  title: 로그인 요청
                  text: POST /login HTTP/1.1
                  note: kim이 아이디와 비밀번호를 보내요. 아직 쿠키가 없어요.
              - event:
                  dir: left
                  title: 응답
                  text: |
                    HTTP/1.1 200 OK
                    [[Set-Cookie: JSESSIONID=abc123]]
                  note: 서버가 로그인 정보를 저장소에 넣고, 그것을 찾는 번호만 쿠키로 줘요.
                duo:
                  - label: 브라우저에 저장된 쿠키
                    rows: [{k: JSESSIONID, v: abc123, mark: changed}]
                  - label: 서버의 세션 저장소
                    rows: [{k: abc123, v: kim, mark: changed}]
              - event:
                  dir: right
                  title: 다음 요청
                  text: |
                    GET /me HTTP/1.1
                    [[Cookie: JSESSIONID=abc123]]
                  note: 브라우저가 쿠키를 자동으로 넣어요. 요청에는 번호만 있고 kim이라는 이름은 없어요.
                duo:
                  - label: 브라우저에 저장된 쿠키
                    rows: [{k: JSESSIONID, v: abc123}]
                  - label: 서버의 세션 저장소
                    rows: [{k: abc123, v: kim}]
              - event:
                  dir: left
                  title: 응답
                  text: HTTP/1.1 200 OK
                  note: 서버가 abc123으로 저장소에서 kim을 찾았어요. kim의 정보를 돌려줘요.
              - event:
                  dir: right
                  title: 로그아웃 요청
                  text: |
                    POST /logout HTTP/1.1
                    Cookie: JSESSIONID=abc123
                  note: 서버가 저장소에서 abc123을 지워요. 브라우저의 쿠키는 지우지 않고 남겨 뒀다고 해 볼게요.
                duo:
                  - label: 브라우저에 저장된 쿠키
                    rows: [{k: JSESSIONID, v: abc123}]
                  - {label: 서버의 세션 저장소, text: 없음}
              - event:
                  dir: right
                  title: 남은 쿠키로 다시 요청
                  text: |
                    GET /me HTTP/1.1
                    [[Cookie: JSESSIONID=abc123]]
                  note: 쿠키는 그대로라서 같은 번호가 가요.
              - event:
                  dir: left
                  title: 응답
                  text: '[[HTTP/1.1 401 Unauthorized]]'
                  note: 저장소에 abc123이 없어요. 서버는 로그인하지 않은 요청으로 처리해요.
                verdict: 로그인했는지는 쿠키가 아니라 서버의 저장소가 정해요. 쿠키가 남아 있어도 저장소에 없으면 로그인하지 않은 요청이에요.
      - ul:
          - '**쿠키에는 세션 ID만 있어요.** 사용자 이름도 권한도 없어요. 사용자가 쿠키를 고쳐도 바뀌는 것은 번호뿐이고, 서버의 로그인 정보는 건드리지 못해요.'
          - '**서버는 요청마다 저장소를 찾아봐요.** 세션 ID로 로그인 정보를 찾으면 그 사용자의 요청이고, 찾지 못하면 로그인하지 않은 요청이에요.'
          - '**서버가 세션을 지우면 끝이에요.** 로그아웃이 그 일을 해요.'
      - p: 실제 서버에서도 그런지 볼게요. 스프링 부트가 기본으로 쓰는 웹 서버인 톰캣은 세션 ID 쿠키의 이름을 `JSESSIONID`로 지어요. 쿠키 값에 `kim`이 들어 있을지 예상해 보고 열어 보세요.
      - ci:
          key: session
          label: 실제 응답 보기
          source: CookieSessionTokenTest.sessionCookieHoldsOnlyId
          code: sessionRun
      - muted: 값 뒤에 붙은 `Path`와 `HttpOnly`는 쿠키의 속성이에요. 속성은 웹 보안 기초 레슨에서 다뤄요.
      - h3: 세션은 저장한 서버만 찾을 수 있어요
      - p: 처음에 예측한 상황이에요. 서버 A와 B가 세션을 각자 메모리에만 두고, A에서 로그인한 kim의 다음 요청이 B로 갔어요. 답은 **로그인하지 않은 요청으로 처리**예요. {{predict-result}}
      - ci:
          key: two-servers
          label: 두 서버의 실제 응답 보기
          source: CookieSessionTokenTest.otherServerAndRestartedServerDoNotHaveSession
          code: twoServersRun
      - p: B의 메모리에는 그 세션 ID가 없어요. 쿠키에는 번호만 있으니 B는 누구의 요청인지 알 길이 없어요. A에게 물어보지도 않아요. 같은 이유로, 서버를 껐다 켜면 메모리가 비워져서 로그인해 있던 사용자가 모두 로그인하지 않은 상태가 돼요.
      - p: 그래서 서버가 여러 대면 **세션 저장소를 함께 써요**. 세션을 각 서버의 메모리가 아니라 모든 서버가 접속하는 저장소 하나(Redis 같은 것)에 두면, 어느 서버로 요청이 가도 같은 세션을 찾아요.
      - more:
          summary: '더 알아보기: 저장소를 함께 쓰지 않는 방법'
          body:
            - p: 요청을 서버들에 나눠 주는 장치(로드 밸런서)가 같은 사용자의 요청을 늘 같은 서버로 보내게 할 수도 있어요. 다만 그 서버가 꺼지면 거기에 있던 세션은 사라져요.
      - quiz:
          q: 세션 방식에서 브라우저의 쿠키에 들어 있는 것은 무엇일까요?
          options:
            - 사용자 이름과 권한
            - 서버에 저장된 로그인 정보를 찾는 세션 ID
            - 사용자의 비밀번호
          answer: 2
          explain: 쿠키에는 번호만 있어요. 사용자 이름과 권한은 서버의 저장소에 있어요.
      - next: 서버가 꼭 저장해야 할까요? 로그인 정보를 브라우저에 주되, 고치면 서버가 알아채게 만들 수는 없을까요?
    recall: 로그인 정보는 서버가 저장하고, 브라우저에는 그 정보를 찾는 세션 ID만 쿠키로 줘요. 서버는 요청마다 세션 ID로 저장소에서 로그인 정보를 찾고, 없으면 로그인하지 않은 요청으로 처리해요. 세션은 저장한 서버만 찾을 수 있어서, 서버가 여러 대면 세션 저장소를 함께 써요.
  - id: q3
    title: 토큰(JWT) 방식은 어떻게 다른가요?
    conclusion:
      lead: 로그인 정보를 서명한 토큰에 담아 클라이언트에 주고, 서버는 저장하지 않아요.
      sub: 서버는 요청마다 서명과 만료 시간만 확인해요. 내용을 바꾸면 서명이 맞지 않아요.
    says:
      - 로그인하면 서버는 로그인 정보를 담은 토큰을 만들어 준다. 서버는 저장하지 않는다. 클라이언트는 보통 Authorization 헤더에 Bearer와 함께 실어 보낸다
      - JWT는 점으로 나뉜 세 부분이다. 헤더, 페이로드, 서명. 페이로드에 사용자 정보와 만료 시간이 들어간다
      - 서명은 서버만 아는 키로 헤더와 페이로드를 계산해 만든다. 서버는 요청마다 서명이 맞는지와 만료 시간이 지났는지만 확인한다. 페이로드를 바꾸면 서명이 맞지 않아 거부한다
      - 페이로드는 암호화된 것이 아니라 인코딩만 되어 있다. 토큰을 가진 사람은 키 없이 읽을 수 있다. 비밀번호나 개인 정보를 넣지 않는다
    widget:
      kind: steps
      note: 위젯을 두지 않는다. 토큰을 만들어 세 부분으로 나눈 것, 가운데 부분을 키 없이 읽은 것, role을 바꾼 토큰이 거부되는 것을 실제 출력(ci)으로 보여 준다. 먼저 예측하게 한 뒤 연다
    asks:
      - '본문의 예시: 페이로드의 role을 USER에서 ADMIN으로 바꾸고 서명은 그대로 둔 토큰을 보내면, 서명을 확인하는 서버는 어떻게 처리하나 (서명이 맞지 않아 거부)'
      - '옮긴 상황: 어떤 서비스가 JWT 페이로드에 사용자의 전화번호를 넣었다. 서명 키를 모르는 사람이 이 토큰을 손에 넣으면 전화번호를 읽을 수 있나 (읽을 수 있다. 인코딩일 뿐이다)'
    body:
      - p: 토큰 방식은 세션과 반대로 해요. 로그인 정보를 **클라이언트에 줘요**. 대신 고치면 알아챌 수 있게 **서명**을 붙여요. 이렇게 만든 값이 토큰이고, 가장 널리 쓰는 형식이 **JWT**(JSON Web Token)예요. 서버는 토큰을 저장하지 않아요.
      - p: 클라이언트는 받은 토큰을 보통 `Authorization` 헤더에 `Bearer`라는 낱말과 함께 실어 보내요.
      - code: tokenRequest
        notes:
          - mark: Bearer eyJhbGci...
            as: code
            text: '`Bearer` 뒤가 토큰이에요. 실제 토큰은 훨씬 길어요.'
      - muted: 토큰을 쿠키에 담아 보내기도 해요. 쿠키는 값을 실어 나르는 수단이고, 세션과 토큰은 그 값에 무엇을 담는지가 달라요.
      - h3: 토큰은 세 부분이에요
      - p: JWT는 점(`.`)으로 나뉜 세 부분이에요.
      - table:
          head:
            - 부분
            - 들어 있는 것
          rows:
            - - 헤더
              - 서명을 만든 방법
            - - 페이로드
              - 사용자 정보와 만료 시간
            - - 서명
              - 서버만 아는 키로 헤더와 페이로드를 계산한 값
      - p: 페이로드는 이런 모양이에요.
      - code: payload
        notes:
          - mark: '"exp": 1795000000'
            as: code
            text: '만료 시간이에요. 이 시각이 지나면 서버가 토큰을 받지 않아요. `sub`는 이 토큰이 누구의 것인지예요.'
      - p: 로그인해서 받은 토큰을 점에서 나누고, 앞의 두 부분을 키 없이 풀어 봤어요. 내용이 읽힐까요? 예상해 보고 열어 보세요.
      - ci:
          key: jwt
          label: 실제 토큰 보기
          source: CookieSessionTokenTest.jwtHasThreePartsAndReadablePayload
          code: jwtRun
      - p: 읽혀요. 페이로드는 **암호화한 것이 아니라 인코딩한 것**이에요. 인코딩은 글자를 다른 표기로 바꾼 것일 뿐이라 누구나 되돌릴 수 있어요. 그래서 토큰에는 비밀번호나 개인 정보를 넣지 않아요. 서명은 내용을 숨기는 장치가 아니라 **내용이 바뀌지 않았는지 확인하는 장치**예요.
      - h3: 고치면 서명이 맞지 않아요
      - p: 서버는 토큰을 받으면 헤더와 페이로드로 서명을 **다시 계산해서** 토큰에 붙어 온 서명과 비교해요. 질문 1에서 쿠키의 `role`을 고쳤던 것처럼, 이번에는 토큰의 `role`을 고쳐 볼게요.
      - ci:
          key: tamper
          label: 서버의 실제 응답 보기
          source: CookieSessionTokenTest.tamperedPayloadIsRejected
          code: tamperRun
      - p: 페이로드가 바뀌면 다시 계산한 서명이 붙어 온 서명과 달라져요. 사용자는 키를 모르니 맞는 서명을 새로 만들 수도 없어요.
      - p: 서버가 요청마다 확인하는 것은 두 가지뿐이에요. **서명이 맞는지**, **만료 시간이 지났는지**. 저장소를 찾아보지 않아요.
      - more:
          summary: '더 알아보기: 인코딩과 서명의 이름'
          body:
            - ul:
                - 헤더와 페이로드의 인코딩은 Base64URL이에요. 주소에 써도 되는 글자만 쓰는 표기법이에요.
                - 이 레슨의 서명은 HMAC-SHA256(헤더의 `HS256`)이에요. 키 하나로 서명을 만들고 같은 키로 확인해요. 서명하는 키와 확인하는 키가 다른 방식도 있어요.
                - 내용까지 암호화하는 JWT도 있지만 이 레슨에서는 다루지 않아요.
      - quiz:
          q: 토큰을 저장하지 않는 서버가 JWT를 받았을 때, 요청마다 확인하는 것은 무엇일까요?
          options:
            - 저장소에 그 토큰이 들어 있는지
            - 서명이 맞는지와 만료 시간이 지났는지
            - 페이로드를 읽을 수 있게 암호를 풀 수 있는지
          answer: 2
          explain: 서명을 다시 계산해 비교하고 만료 시간을 봐요. 저장소는 찾아보지 않고, 페이로드는 암호화되어 있지 않아요.
      - next: 서버가 저장하지 않아도 된다니 좋아 보여요. 그러면 잃는 것은 없을까요?
    recall: 로그인 정보를 서명한 토큰에 담아 클라이언트에 주고, 서버는 저장하지 않아요. JWT는 헤더, 페이로드, 서명 세 부분이고, 서버는 요청마다 서명이 맞는지와 만료 시간만 확인해요. 페이로드를 바꾸면 서명이 맞지 않아 거부돼요. 페이로드는 누구나 읽을 수 있어서 비밀을 넣지 않아요.
  - id: q4
    title: 두 방식은 각각 무엇을 얻고 무엇을 잃나요?
    conclusion:
      lead: 세션은 서버가 바로 끊을 수 있지만 서버들이 저장소를 함께 써야 하고, JWT는 저장소가 필요 없지만 만료 전에는 막기 어려워요.
      sub: 그래서 JWT는 만료 시간을 짧게 잡아요.
    says:
      - '세션: 서버가 세션을 지우면 바로 로그인이 끊긴다. 대신 서버가 여러 대면 세션 저장소를 함께 써야 하고, 요청마다 저장소를 찾아본다'
      - 'JWT: 서버가 저장하지 않는다. 같은 서명 키를 가진 서버는 어느 서버든 토큰을 확인할 수 있다'
      - JWT는 만료 전에는 막기 어렵다. 서버가 서명과 만료 시간만 확인하면, 계정을 정지해도 그 토큰은 만료될 때까지 통과한다
      - 만료 전의 토큰을 막으려면 막을 토큰을 서버에 저장해 두고 요청마다 확인해야 한다. 저장소가 다시 필요해진다. 그래서 JWT는 만료 시간을 짧게 잡는다
    widget:
      kind: compare
      note: 세션 방식과 JWT 방식을 두 칸에 두고 상황을 고른다. "계정 정지"를 고르면 세션 쪽은 세션을 지워 다음 요청이 401, JWT 쪽은 만료 전이라 200이다. "요청이 서버 B로 감"을 고르면 세션 쪽(각자 메모리)은 401, JWT 쪽(같은 서명 키)은 200이다. 얻는 것과 잃는 것이 서로 반대라는 것을 본다
    asks:
      - '본문의 예시: 서버 A와 B가 같은 서명 키를 가지고 함께 쓰는 저장소는 없다. A에서 받은 JWT로 B에 요청하면 어떻게 되나 (B가 서명을 확인해 통과시킨다)'
      - '옮긴 상황: 사내 도구의 JWT는 만료가 8시간이고 서버는 서명과 만료 시간만 확인한다. 오전 10시에 로그인한 직원의 계정을 11시에 비활성화했다. 오후 2시에 그 토큰으로 온 요청은 어떻게 되나 (통과한다. 만료 전이다)'
      - '설명형(all): 면접에서 "쿠키, 세션, 토큰(JWT)의 차이를 설명해 주세요"에 1분 안에 답하기'
    body:
      - p: 두 방식의 차이는 한 가지에서 나와요. **로그인 정보를 서버가 가지고 있는지**예요. 서버가 가지고 있으면 언제든 지울 수 있지만, 모든 서버가 그 저장소를 봐야 해요. 가지고 있지 않으면 저장소가 필요 없지만, 이미 준 것을 거둘 수 없어요.
      - p: 아래에서 상황을 골라 두 방식의 결과를 비교해 보세요. kim은 서버 A에서 로그인했어요. JWT 쪽 서버는 서명과 만료 시간만 확인해요.
      - widget:
          kind: compare
          layout: [selector, sides, verdict]
          selector:
            label: 로그인한 뒤에 생긴 일
            options:
              - {value: serverB, label: 다음 요청이 서버 B로 감}
              - {value: suspend, label: 관리자가 kim의 계정을 정지}
          sides:
            - label: 세션 방식
              items:
                - {name: 세션 저장소, note: 서버 A의 메모리에 abc123 → kim}
                - {name: 요청마다 확인하는 것, note: 세션 ID가 저장소에 있는지}
            - label: JWT 방식
              items:
                - {name: 서명 키, note: 서버 A와 B가 같은 키를 가짐}
                - {name: 요청마다 확인하는 것, note: 서명이 맞는지와 만료 시간}
          scenes:
            serverB:
              sides:
                - marks: [{name: 세션 저장소, tag: B에는 없음, mark: bad}]
                  result: [{k: kim의 다음 요청, v: '401', mark: bad}]
                - marks: [{name: 서명 키, tag: B도 가짐}]
                  result: [{k: kim의 다음 요청, v: '200'}]
              verdict: 세션은 저장한 서버만 찾을 수 있어요. JWT는 같은 서명 키를 가진 서버면 어디서든 확인돼요.
            suspend:
              sides:
                - marks: [{name: 세션 저장소, tag: 세션을 지움}]
                  result: [{k: kim의 다음 요청, v: '401'}]
                - marks: [{name: 요청마다 확인하는 것, tag: 계정 상태는 안 봄, mark: bad}]
                  result: [{k: kim의 다음 요청, v: '200 (만료될 때까지)', mark: bad}]
              verdict: 세션은 서버가 지우면 바로 끊겨요. JWT는 kim이 가지고 있어서 서버가 지울 수 없고, 만료될 때까지 통과해요.
      - h3: JWT는 서버가 늘어도 저장소가 필요 없어요
      - p: 토큰이 맞는지는 서명 키만 있으면 확인할 수 있어요. 그래서 같은 서명 키를 가진 서버는 어느 서버든, 다른 서버가 준 토큰을 통과시켜요. 테스트에서도 서버 A가 준 토큰을 서버 B가 200으로 받았어요. 요청마다 저장소를 찾아보지도 않아요.
      - h3: JWT는 만료 전에 막기 어려워요
      - p: kim이 세션 쿠키와 토큰을 둘 다 받아 둔 상태에서 관리자가 kim의 계정을 정지했어요. 서버는 정지하면서 kim의 세션을 지웠어요. 두 요청은 각각 어떻게 될까요? 예상해 보고 열어 보세요.
      - ci:
          key: suspend
          label: 서버의 실제 응답 보기
          source: CookieSessionTokenTest.suspendedAccountTokenPassesUntilExpiry
          code: suspendRun
      - p: 토큰은 서명이 맞고 만료 시간이 지나지 않았으니 통과해요. 서버는 계정 상태를 보지 않았고, kim의 손에 있는 토큰을 지울 방법도 없어요. 권한도 같아요. 서버가 페이로드의 `role`만 보고 판단하면, DB에서 권한을 낮춰도 이미 준 토큰에는 옛 권한이 적혀 있어요.
      - p: 만료 전의 토큰을 막으려면 **막을 토큰을 서버에 저장해 두고 요청마다 확인**해야 해요. 그러면 모든 서버가 함께 보는 저장소가 다시 필요해져서, 저장소가 필요 없다는 장점이 줄어요. 그래서 JWT는 **만료 시간을 짧게** 잡아요. 막지 못하는 시간을 줄이는 거예요.
      - table:
          head:
            - ''
            - 세션
            - JWT
          rows:
            - - 로그인 정보가 있는 곳
              - 서버의 저장소
              - 클라이언트가 가진 토큰
            - - 서버가 여러 대일 때
              - 세션 저장소를 함께 써야 함
              - 같은 서명 키만 있으면 됨
            - - 로그인을 바로 끊기
              - 세션을 지우면 됨
              - 만료 전에는 어려움
      - more:
          summary: '더 알아보기: 만료가 짧으면 자주 로그인해야 하나요?'
          body:
            - p: 그래서 토큰을 둘 주기도 해요. 요청에 쓰는 토큰은 만료를 짧게 잡고, 그 토큰을 새로 받는 데만 쓰는 토큰(리프레시 토큰)은 길게 잡아 서버에 저장해 둬요. 저장한 쪽은 서버가 지울 수 있어요.
      - quiz:
          q: JWT를 쓰는 서비스가 만료 전의 토큰도 막으려고, 막을 토큰의 목록을 만들어 요청마다 확인하기로 했어요. 서버가 여러 대일 때 다시 필요해지는 것은 무엇일까요?
          options:
            - 모든 서버가 함께 보는 저장소
            - 서버마다 다른 서명 키
            - 브라우저의 쿠키
          answer: 1
          explain: 어느 서버로 요청이 가도 같은 목록을 봐야 하니, 서버들이 함께 쓰는 저장소가 필요해요. 세션 방식이 치르던 값을 다시 치르는 셈이에요.
    recall: 세션은 서버가 세션을 지워 로그인을 바로 끊을 수 있지만, 서버가 여러 대면 세션 저장소를 함께 써야 해요. JWT는 서버가 저장하지 않아 같은 서명 키만 있으면 어느 서버든 확인하지만, 만료 전의 토큰은 막기 어려워요. 그래서 JWT는 만료 시간을 짧게 잡아요.
interview:
  question: 쿠키, 세션, 토큰(JWT)의 차이를 설명해 주세요
  model:
    - label: 정의
      text: 쿠키는 서버가 Set-Cookie로 준 값을 브라우저가 저장했다가 요청마다 자동으로 보내는 수단입니다. HTTP가 무상태라서 누구의 요청인지 알려 주는 값이 요청마다 필요합니다. 세션과 토큰은 그 값으로 로그인 상태를 유지하는 두 방식입니다.
    - label: 원리
      text: 세션 방식은 로그인 정보를 서버의 저장소에 두고 브라우저에는 그것을 찾는 세션 ID만 줍니다. JWT 방식은 로그인 정보를 서명한 토큰에 담아 클라이언트에 주고, 서버는 저장하지 않고 요청마다 서명과 만료 시간만 확인합니다.
    - label: 주의할 점
      text: 세션은 서버가 지우면 바로 끊을 수 있지만 서버가 여러 대면 세션 저장소를 함께 써야 합니다. JWT는 저장소가 필요 없지만 만료 전에는 막기 어려워서 만료 시간을 짧게 잡습니다. JWT의 페이로드는 누구나 읽을 수 있어 비밀을 넣지 않습니다.
    - label: 경험
      text: '(내 프로젝트로 채우기) 예: 서버를 두 대로 늘리면서 로그인이 풀리는 문제를 겪고 세션을 Redis로 옮겼습니다.'
verified: 이 레슨의 응답은 짐작이 아니라, 톰캣 서버를 띄우고 자바 21로 요청을 보내 받은 값이에요. 코드가 바뀔 때마다 테스트([CookieSessionTokenTest](link:test))가 다시 돌아요.
footer: '근거: HTTP의 무상태는 RFC 9110, 쿠키는 RFC 6265, JSESSIONID는 자카르타 서블릿 명세 6.0, JWT는 RFC 7519, Bearer는 RFC 6750. 응답은 톰캣 10.1(스프링 부트 3.5에 든 것)에서 테스트로 확인했어요. 오류는 [GitHub 이슈](https://github.com/wanja727/dev-lessons/issues)로 알려 주세요.'
claims:
  - claim: 서버가 Set-Cookie로 준 값은 다음 요청의 Cookie 헤더로 돌아오고, 쿠키 없이 온 요청에서는 서버가 그 값을 읽지 못한다
    how: 내장 톰캣으로 작은 앱을 띄우고 자바 HttpClient로 요청해 응답 헤더와 다음 요청의 결과를 본다
  - claim: 쿠키의 값을 바꿔 보내면 서버는 바꾼 값을 그대로 읽는다
    how: role=USER를 받은 뒤 role=ADMIN으로 바꿔 보내고 서버가 읽은 값을 본다
  - claim: 로그인 응답에 Set-Cookie JSESSIONID가 있고, 쿠키 값에 사용자 이름이 없다
    how: 로그인 요청을 보내 응답 헤더를 본다
  - claim: 세션 ID 쿠키를 보내면 로그인된 요청으로 처리된다. 세션을 지우면 같은 쿠키가 401을 받는다
    how: 로그아웃 전과 뒤에 같은 쿠키로 요청한다
  - claim: 세션을 각자 메모리에 둔 다른 서버, 그리고 다시 켠 서버에서는 그 세션 ID를 찾지 못한다
    how: 앱을 둘 띄워 한쪽에서 받은 쿠키를 다른 쪽에 보낸다. 앱을 껐다 켠 뒤 같은 쿠키를 보낸다
  - claim: JWT는 점으로 나뉜 세 부분이고, 페이로드는 키 없이 읽을 수 있다
    how: HMAC-SHA256으로 토큰을 만들어 가운데 부분을 Base64URL로 디코딩한다
  - claim: 페이로드를 바꾸고 서명을 그대로 둔 토큰은 거부된다
    how: role만 바꾼 토큰으로 요청해 401을 본다
  - claim: 같은 서명 키를 가진 다른 서버가 토큰을 통과시킨다
    how: 앱을 둘 띄워 한쪽에서 받은 토큰을 다른 쪽에 보낸다
  - claim: 서명과 만료 시간만 확인하는 서버는 계정을 정지해도 만료 전의 토큰을 통과시키고, 만료 시간이 지난 토큰은 거부한다
    how: 계정 상태를 바꾼 뒤 같은 토큰으로 요청한다. 만료 시간이 지난 토큰으로도 요청한다
sources:
  - 'HTTP가 무상태라는 것: RFC 9110 3.3 https://www.rfc-editor.org/rfc/rfc9110.html#section-3.3'
  - 'Set-Cookie와 Cookie 헤더: RFC 6265 https://www.rfc-editor.org/rfc/rfc6265.html'
  - '세션 쿠키 이름 JSESSIONID: 자카르타 서블릿 명세 6.0의 7.1.1 https://jakarta.ee/specifications/servlet/6.0/jakarta-servlet-spec-6.0'
  - 'JWT의 구조와 만료 시간: RFC 7519 https://www.rfc-editor.org/rfc/rfc7519.html'
  - 'Authorization 헤더의 Bearer: RFC 6750 https://www.rfc-editor.org/rfc/rfc6750.html'
