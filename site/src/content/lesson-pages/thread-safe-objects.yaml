questions:
  - id: q1
    title: 불변 객체는 왜 여러 스레드가 함께 써도 안전한가요?
    conclusion:
      lead: '만든 뒤에 바뀌지 않으니 누가 언제 읽어도 같은 값이라, 경쟁 상태가 생길 자리가 없어요.'
      sub: '자바는 final 필드를 생성자가 끝난 뒤 다른 스레드에게 보이게 약속해요. 값이 바뀌어야 하면 새 객체를 만들어 참조 하나만 바꿔요.'
    says:
      - '스레드에 안전하다는 것은 여러 스레드가 동시에 써도, 부르는 쪽이 따로 락을 걸지 않아도 맞게 동작한다는 뜻이다. 락을 걸지 않고 그렇게 만드는 방법은 셋이다: 바꾸지 않기, 함께 쓰지 않기, 안전한 도구에 맡기기. 질문 1~4가 차례로 다룬다'
      - '경쟁 상태는 함께 쓰는 값을 고칠 때 생긴다(C3). 불변 객체는 고칠 수 없으니 생기지 않는다. `String`, `Integer`, `LocalDate`, record가 여러 스레드에서 걱정 없이 쓰이는 이유다(J9)'
      - '코드 mutablePrice. 필드 둘을 차례로 쓰는 `set` 사이에 다른 스레드가 읽으면 새 금액과 옛 통화가 섞인 값을 본다. 래치로 쓰는 스레드를 두 줄 사이에 세우고 읽어 섞인 값을 보인다'
      - '코드 price. 바뀌어야 하면 새 `Price`를 만들어 참조를 바꾼다. 참조를 바꾸는 것은 한 번의 쓰기라 읽는 쪽은 옛 객체나 새 객체 가운데 하나를 통째로 본다. 섞인 값은 없다. 참조에 `volatile`을 붙여 새 객체를 보게 한다(C3 질문 2)'
      - '자바 메모리 모델은 final 필드에 대해 따로 약속한다: 생성자가 끝난 객체를 다른 스레드가 보면 final 필드는 생성자가 쓴 값으로 보인다. final이 아닌 필드는 이 약속이 없다(JLS 17.5)'
    asks:
      - '본문의 예시: 코드 mutablePrice의 `set(12000, "USD")` 중간(첫 줄 뒤)에 다른 스레드가 읽었다. 처음 값은 (10000, KRW)다. 읽은 값으로 나올 수 있는 것은 (12000, KRW. 금액만 바뀐 섞인 값)'
      - '옮긴 상황: `record Range(int lo, int hi)`를 `volatile Range range`로 두고 바꿀 때마다 새 Range를 만든다. 읽는 스레드가 lo는 새 값, hi는 옛 값을 볼 수 있나 (없다. 객체를 통째로 바꾸니 옛 객체나 새 객체 하나를 본다)'
    body:
      - p: '**스레드에 안전하다**는 것은 여러 스레드가 동시에 써도, 부르는 쪽이 따로 락을 걸지 않아도 맞게 동작한다는 뜻이에요. 락을 걸지 않고 그렇게 만드는 방법은 셋이에요: **바꾸지 않기**, **함께 쓰지 않기**, **안전한 도구에 맡기기**. 이 레슨의 질문들이 차례로 다뤄요.'
      - p: '경쟁 상태는 함께 쓰는 값을 **고칠 때** 생겨요. 먼저 바뀌는 객체가 무엇을 보여 주는지 봐요.'
      - code: mutablePrice
      - p: '쓰는 스레드를 `set`의 두 줄 사이에 세워 두고, 다른 스레드가 그때 읽었어요.'
      - ci:
          key: torn
          label: 읽은 값 보기
          source: ThreadSafeObjectsTest.mutableObjectShowsTornState
      - p: '새 금액과 옛 통화가 섞인 **있을 수 없는 값**을 봤어요. 필드 둘을 차례로 고치는 사이에 끼어든 거예요.'
      - h3: 불변 객체는 통째로 바꿔요
      - code: price
      - p: '불변 객체는 만든 뒤에 바뀌지 않으니, 누가 언제 읽어도 같은 값이에요. 값이 바뀌어야 하면 **새 객체를 만들어 참조 하나만 바꿔요.** 참조를 바꾸는 것은 한 번의 쓰기라, 읽는 쪽은 옛 객체나 새 객체 가운데 하나를 통째로 봐요.'
      - ci:
          key: immutable
          label: 100만 번 바꾸는 동안 읽은 결과 보기
          source: ThreadSafeObjectsTest.immutableSwapIsNeverTorn
      - ul:
          - '`String`, `Integer`, `LocalDate`, record 같은 불변 객체가 여러 스레드에서 걱정 없이 쓰이는 이유예요(불변 객체 레슨).'
          - '참조에 `volatile`을 붙여 새 객체를 다른 스레드가 보게 해요(경쟁 상태와 동기화 레슨의 질문 2).'
          - '자바 메모리 모델은 **final 필드**에 따로 약속해요. 생성자가 끝난 객체를 다른 스레드가 보면 final 필드는 생성자가 쓴 값으로 보여요. final이 아닌 필드에는 이 약속이 없어요([명세 17.5](link:jlsFinal)).'
      - quiz:
          q: '`record Range(int lo, int hi)`를 `volatile Range range`로 두고, 바꿀 때마다 새 `Range`를 만들어요. 읽는 스레드가 lo는 새 값, hi는 옛 값을 볼 수 있을까요?'
          options:
            - 있다. 필드가 둘이다
            - 없다. 옛 객체나 새 객체 하나를 통째로 본다
            - volatile이라 읽을 때마다 예외가 난다
          answer: 2
          explain: '불변 객체는 바뀌지 않고, 참조 하나를 바꾸니 섞인 값이 생길 수 없어요.'
      - next: '바꾸지 않는 것이 첫째 방법이었어요. 둘째는 아예 함께 쓰지 않는 거예요.'
    recall: '만든 뒤에 바뀌지 않으니 누가 언제 읽어도 같은 값이라 경쟁 상태가 생길 자리가 없어요. 바뀌는 객체는 필드를 고치는 사이에 섞인 값을 보일 수 있지만, 불변 객체는 새 객체를 만들어 참조 하나만 바꾸니 옛 것이나 새 것을 통째로 봐요. 자바는 final 필드를 생성자가 끝난 뒤 다른 스레드에게 보이게 약속해요.'
  - id: q2
    title: 스레드에 가둔다는 것과 ThreadLocal은 무엇인가요?
    conclusion:
      lead: '객체를 한 스레드만 보게 해서 함께 쓰지 않는 방법이에요. 지역 변수가 그렇고, `ThreadLocal`은 같은 변수를 스레드마다 다른 값으로 가지게 해요.'
      sub: '함께 쓰지 않으면 바뀌는 객체여도 안전해요. 다만 그 객체를 필드나 다른 스레드로 넘기는 순간 갇힌 것이 아니게 돼요.'
    says:
      - '지역 변수는 스레드의 스택에 있다(C1). 메서드 안에서 만들어 밖으로 내보내지 않은 `ArrayList`는 한 스레드만 본다. 동기화 없이 써도 된다'
      - '`ThreadLocal<T>`는 스레드마다 따로 값을 가진 변수다. 스레드 A가 `set("kim")`, B가 `set("lee")`하면 각자 `get()`이 자기 값을 돌려준다. 테스트로 보인다'
      - '쓰임: 요청마다 다른 정보(로그인 사용자, 요청 id, 트랜잭션)를 메서드마다 매개변수로 넘기지 않고 꺼내 쓴다. 요청 하나를 스레드 하나가 처리하니 스레드마다 다른 값이 곧 요청마다 다른 값이다'
      - '갇힘이 깨지는 때: 지역에서 만든 객체를 static 필드나 싱글톤 빈의 필드에 넣거나, 다른 스레드에 넘기면 함께 쓰는 것이 된다'
      - '더 알아보기: `SimpleDateFormat`은 안에 계산 중인 상태를 둬서 여러 스레드가 함께 쓰면 틀린 날짜를 내거나 예외를 던진다. 예전에는 `ThreadLocal`에 하나씩 두었다. 자바 8의 `DateTimeFormatter`는 불변이라 하나를 함께 쓴다'
    asks:
      - '본문의 예시: 스레드 A가 `user.set("kim")`, 스레드 B가 `user.set("lee")`를 한 뒤 A가 `user.get()`을 부른다. 결과는 (kim. 스레드마다 값이 따로다)'
      - '옮긴 상황: 메서드 안에서 `new ArrayList<>()`를 만들어 값을 넣고 리턴하기 전에 싱글톤 빈의 필드 `lastResult`에 넣었다. 이 리스트는 아직 스레드에 갇혀 있나 (아니다. 필드에 넣는 순간 다른 스레드가 볼 수 있다)'
    body:
      - p: '객체를 **한 스레드만 보게** 하면 바뀌는 객체여도 안전해요. 이것을 스레드에 가둔다고 해요.'
      - ul:
          - '**지역 변수.** 스레드의 스택에 있어요(프로세스와 스레드 레슨). 메서드 안에서 만들어 밖으로 내보내지 않은 `ArrayList`는 한 스레드만 봐서 동기화 없이 써도 돼요.'
          - '**`ThreadLocal<T>`.** 스레드마다 따로 값을 가진 변수예요. 같은 변수인데 스레드 A와 B가 각자 다른 값을 봐요.'
      - code: threadLocal
      - ci:
          key: per-thread
          label: 두 스레드의 실제 결과 보기
          source: ThreadSafeObjectsTest.threadLocalPerThread
      - p: '쓰임: 요청마다 다른 정보(로그인 사용자, 요청 id, 지금 트랜잭션)를 메서드마다 매개변수로 넘기지 않고 꺼내 써요. 요청 하나를 스레드 하나가 처리하니, 스레드마다 다른 값이 곧 요청마다 다른 값이에요.'
      - callout: '**갇힘이 깨지는 때:** 지역에서 만든 객체를 static 필드나 싱글톤 빈의 필드에 넣거나 다른 스레드에 넘기면, 그 순간부터 함께 쓰는 것이에요.'
      - more:
          summary: '더 알아보기: SimpleDateFormat과 DateTimeFormatter'
          body:
            - p: '`SimpleDateFormat`은 안에 계산 중인 상태를 둬서 여러 스레드가 함께 쓰면 틀린 날짜를 내거나 예외를 던져요([API 문서](link:sdf)). 예전에는 `ThreadLocal`에 하나씩 두었어요. 자바 8의 `DateTimeFormatter`는 불변이라 하나를 함께 써요. 첫째 방법(바꾸지 않기)으로 푼 거예요.'
      - quiz:
          q: '스레드 A가 `user.set("kim")`, 스레드 B가 `user.set("lee")`를 한 뒤 A가 `user.get()`을 불러요. 결과는?'
          options:
            - kim
            - lee
            - 먼저 끝난 쪽의 값
          answer: 1
          explain: '`ThreadLocal`은 스레드마다 따로 값을 가져요. A는 자기가 넣은 kim을 봐요.'
      - next: '스레드마다 따로라고 했어요. 그런데 스레드 풀은 스레드를 버리지 않고 다시 써요.'
    recall: '객체를 한 스레드만 보게 해서 함께 쓰지 않는 방법이에요. 지역 변수와 메서드 안에서만 쓰는 객체가 그렇고, `ThreadLocal`은 같은 변수를 스레드마다 다른 값으로 가지게 해요. 함께 쓰지 않으면 바뀌는 객체여도 안전하지만, 필드나 다른 스레드로 넘기는 순간 갇힌 것이 아니에요.'
  - id: q3
    title: 스레드 풀에서 ThreadLocal을 지우지 않으면 무슨 일이 생기나요?
    conclusion:
      lead: '풀은 스레드를 버리지 않고 다음 작업에 다시 쓰므로, 지우지 않은 값이 다음 작업에 그대로 보여요.'
      sub: '다른 사용자의 정보가 섞이고, 남은 값은 메모리를 붙잡아요. 그래서 넣은 곳의 `finally`에서 꼭 `remove()`해요.'
    says:
      - '스레드 풀은 정해진 스레드로 작업을 차례로 처리한다. 작업이 끝나도 스레드는 살아 있고 다음 작업을 받는다(자세한 것은 C7). 톰캣의 요청 처리 스레드도 풀이다'
      - '예측의 답을 밝힌다. 코드 predict의 둘째 작업은 kim을 출력한다. 같은 스레드에서 돌았고 첫 작업이 지우지 않았다. 실제 출력으로 보인다'
      - '실제로 생기는 일: 로그인한 사용자의 요청이 사용자를 넣고 지우지 않으면, 같은 스레드가 다음에 처리하는 로그인하지 않은 요청이 그 사용자로 보인다'
      - '코드 threadLocal. `finally`에서 `remove()`하면 둘째 작업은 null을 본다. 테스트로 비교한다'
      - '메모리: 지우지 않은 값은 스레드가 살아 있는 동안 남는다. 풀의 스레드는 서버가 꺼질 때까지 살아 있으니 큰 객체를 넣으면 계속 붙잡는다(J15의 "가리키는 것이 남아 있으면 치우지 않는다")'
      - '다른 스레드로 넘어가면 따라가지 않는다. 요청 스레드에서 넣은 값을 `CompletableFuture`나 `@Async`가 실행하는 다른 스레드에서 읽으면 null이다. 테스트로 보인다'
    widget:
      kind: steps
      note: '스레드 하나짜리 풀. duo 왼쪽은 풀의 스레드 pool-1이 가진 ThreadLocal 값, 오른쪽은 처리 중인 요청. 시나리오 "remove 없음": 요청 1(kim 로그인) 시작, user=kim, 요청 1 끝(값 남음), 요청 2(로그인 안 함) 시작, user.get()=kim(bad). 시나리오 "finally에서 remove": 요청 1 끝에서 값이 비고, 요청 2는 null'
    asks:
      - '본문의 예시: 코드 predict에서 첫 작업 끝에 `user.remove()`를 더했다. 둘째 작업의 출력은 (null)'
      - '옮긴 상황: 요청 스레드에서 `user.set("kim")`을 한 뒤 `CompletableFuture.runAsync(() -> log(user.get()))`로 공용 풀에서 실행했다. 찍히는 값은. 공용 풀의 스레드는 user를 넣은 적이 없다 (null. 다른 스레드라 값이 따라가지 않는다)'
    body:
      - p: '스레드 풀은 정해진 스레드로 작업을 차례로 처리해요. 작업이 끝나도 스레드는 살아서 다음 작업을 받아요(자세한 것은 스레드 풀 레슨). 톰캣의 요청 처리 스레드도 풀이에요.'
      - p: '처음 예측의 답은 **kim**이에요. {{predict-result}}'
      - ci:
          key: predict
          label: 지울 때와 안 지울 때의 실제 결과 보기
          source: ThreadSafeObjectsTest.threadLocalLeaksInPool
          code: predict
      - p: '둘째 작업은 첫째와 **같은 스레드**에서 돌았고, 첫 작업이 값을 지우지 않았어요. `finally`에서 `remove()`하면 null이에요.'
      - widget:
          kind: steps
          layout: [selector, duo, log, buttons, verdict]
          selector:
            label: 요청 1이 끝날 때
            options:
              - {value: keep, label: remove 없음}
              - {value: clean, label: finally에서 remove}
          initial:
            duo:
              - {label: '풀의 스레드 pool-1의 user', state: dim, text: 비어 있음}
              - {label: 처리 중인 요청, state: dim, text: 없음}
          scenarios:
            keep:
              - log: '요청 1(kim 로그인) 시작 → user.set("kim")'
                duo:
                  - {label: 풀의 스레드 pool-1의 user, rows: [{k: user, v: kim, mark: changed}]}
                  - {label: 처리 중인 요청, text: 요청 1 (kim)}
              - log: '요청 1 끝. 값을 지우지 않음'
                duo:
                  - {label: 풀의 스레드 pool-1의 user, rows: [{k: user, v: kim}]}
                  - {label: 처리 중인 요청, state: dim, text: 없음}
              - log: '요청 2(로그인 안 함)가 같은 스레드에서 시작 → user.get()'
                duo:
                  - {label: 풀의 스레드 pool-1의 user, rows: [{k: user, v: kim, mark: bad}]}
                  - {label: 처리 중인 요청, text: '요청 2 (로그인 안 함)'}
                verdict: '로그인하지 않은 요청 2가 kim으로 보여요. 다른 사람의 정보가 섞였어요.'
            clean:
              - log: '요청 1(kim 로그인) 시작 → user.set("kim")'
                duo:
                  - {label: 풀의 스레드 pool-1의 user, rows: [{k: user, v: kim, mark: changed}]}
                  - {label: 처리 중인 요청, text: 요청 1 (kim)}
              - log: '요청 1 끝. finally에서 user.remove()'
                duo:
                  - {label: 풀의 스레드 pool-1의 user, rows: [{k: user, v: 비어 있음, mark: changed}]}
                  - {label: 처리 중인 요청, state: dim, text: 없음}
              - log: '요청 2(로그인 안 함)가 같은 스레드에서 시작 → user.get()'
                duo:
                  - {label: 풀의 스레드 pool-1의 user, rows: [{k: user, v: 'null'}]}
                  - {label: 처리 중인 요청, text: '요청 2 (로그인 안 함)'}
                verdict: '요청 2는 null을 봐요. 넣은 곳에서 지우면 섞이지 않아요.'
      - ul:
          - '**정보가 섞여요.** 로그인한 요청이 넣고 지우지 않으면, 같은 스레드가 다음에 처리하는 다른 요청이 그 사용자로 보여요.'
          - '**메모리를 붙잡아요.** 지우지 않은 값은 스레드가 살아 있는 동안 남아요. 풀의 스레드는 서버가 꺼질 때까지 살아 있으니, 큰 객체를 넣으면 계속 붙잡아요. 가리키는 것이 남아 있으면 가비지 컬렉터가 치우지 않아요(가비지 컬렉션 레슨).'
      - h3: 다른 스레드로는 따라가지 않아요
      - ci:
          key: other-thread
          label: 실제 결과 보기
          source: ThreadSafeObjectsTest.threadLocalDoesNotFollow
      - p: '요청 스레드에서 넣은 값을 `CompletableFuture`나 `@Async`가 실행하는 다른 스레드에서 읽으면 null이에요. 그 스레드의 칸에는 아무도 넣지 않았어요.'
      - quiz:
          q: '처음 예측의 코드에서 첫 작업 끝에 `user.remove()`를 더했어요. 둘째 작업의 출력은?'
          options:
            - kim
            - 'null'
            - 예외
          answer: 2
          explain: '같은 스레드에서 돌지만 첫 작업이 자기 값을 지웠어요.'
      - next: '마지막 방법은 안전하게 만들어진 도구에 맡기는 거예요. 가장 많이 쓰는 것이 맵이에요.'
    recall: '풀은 스레드를 버리지 않고 다음 작업에 다시 쓰므로, 지우지 않은 값이 다음 작업에 그대로 보여요. 다른 사용자의 정보가 섞이고, 남은 값은 메모리를 붙잡아요. 그래서 넣은 곳의 `finally`에서 꼭 `remove()`해요. 다른 스레드로 넘어가면 값이 따라가지 않는 것도 기억해요.'
  - id: q4
    title: 여러 스레드가 함께 쓰는 맵은 무엇을 써야 하나요?
    conclusion:
      lead: '`HashMap`이 아니라 `ConcurrentHashMap`을 쓰고, 값을 읽고 고치는 일은 `merge`나 `computeIfAbsent`처럼 한 번의 호출로 해요.'
      sub: '`HashMap`은 동시에 넣으면 넣은 것이 사라질 수 있어요. 안전한 맵도 `get` 하고 `put` 하면 두 호출 사이에 다른 스레드가 끼어들어요.'
    says:
      - '코드 hashMap. 스레드 8개가 서로 다른 키를 1만 개씩 넣는다. 넣은 키는 8만 개인데 `size()`가 그보다 작거나, 드물게 예외가 날 수 있다. 같은 칸에 동시에 넣거나 배열을 늘리는 중에 끼어들면 하나가 사라진다. 실제 결과를 보인다'
      - '`ConcurrentHashMap`은 같은 일에서 정확히 8만이다. 칸마다 따로 잠가서 서로 다른 칸에 넣는 스레드는 기다리지 않는다. 읽기는 락 없이 한다'
      - '`Collections.synchronizedMap(new HashMap<>())`도 안전하지만 맵 전체를 락 하나로 잠가 모든 스레드가 한 줄로 선다. 순회할 때는 부르는 쪽이 직접 잠가야 한다'
      - '코드 merge. 안전한 맵이어도 `get` 뒤 `put`은 C3의 읽고-고치고-쓰기다. 스레드 8개가 같은 상품의 조회 수를 1만 번씩 올리면 8만보다 작다. `merge(id, 1, Integer::sum)`은 정확히 8만이다'
      - '`computeIfAbsent(key, f)`는 키가 없을 때만 f를 불러 넣는다. 스레드 여럿이 같은 키로 동시에 불러도 f는 한 번만 불린다. `containsKey` 뒤 `put`은 둘 다 만들 수 있다. 테스트로 비교한다'
      - '더 알아보기: `CopyOnWriteArrayList`는 쓸 때마다 배열을 통째로 복사한다. 읽기가 아주 많고 쓰기가 드문 리스너 목록에 맞다. 스레드끼리 작업을 넘기는 큐(`BlockingQueue`)는 C7에서 다룬다'
    asks:
      - '본문의 예시: 스레드 8개가 `ConcurrentHashMap`에 같은 키의 값을 `get` 하고 1을 더해 `put` 하기를 1만 번씩 했다. 값은 (8만 이하. 두 호출 사이에 끼어든다)'
      - '옮긴 상황: 상품 id별 재고 알림을 받을 사용자 목록을 맵에 모은다. 여러 요청이 같은 상품에 처음으로 동시에 등록할 때 목록이 하나만 만들어지게 하려면. 보기: if (!map.containsKey(id)) map.put(id, new ...), map.computeIfAbsent(id, k -> new ...) (computeIfAbsent. 키가 없을 때 한 번만 만든다)'
      - '실무 구역: 코드 cache를 `HashMap`으로 바꾸고 요청 스레드 여럿이 처음으로 같은 통화를 동시에 조회한다. 생길 수 있는 일은 (fetch가 여러 번 불리고, 맵이 깨져 넣은 값이 사라질 수 있다)'
    body:
      - code: hashMap
      - p: '스레드 8개가 **서로 다른 키**를 1만 개씩 넣었어요. 넣은 키는 8만 개예요.'
      - ci:
          key: hashmap
          label: HashMap과 ConcurrentHashMap의 실제 결과 보기
          source: ThreadSafeObjectsTest.hashMapIsNotThreadSafe
      - p: '`HashMap`은 넣은 것이 사라지거나, 드물게 예외가 나요. 같은 칸에 동시에 넣거나 배열을 늘리는 중에 끼어들면 하나가 덮여요([API 문서](link:hashMap)는 동기화되지 않는다고 적어요). `ConcurrentHashMap`은 정확히 8만이에요.'
      - table:
          head: [맵, 여러 스레드에서, 방식]
          rows:
            - ['`HashMap`', '안전하지 않아요', '동기화 없음']
            - ['`Collections.synchronizedMap(...)`', '안전해요', '맵 전체를 락 하나로 잠가 모두가 한 줄로 서요. 순회할 때는 부르는 쪽이 직접 잠가요']
            - ['`ConcurrentHashMap`', '안전해요', '칸마다 따로 잠가서 다른 칸에 넣는 스레드는 기다리지 않아요. 읽기는 락 없이 해요']
      - h3: 안전한 맵도 두 번 부르면 끼어들어요
      - code: merge
        notes:
          - mark: merge(id, 1, Integer::sum)
            as: code
            text: '없으면 1을 넣고, 있으면 더해요. 한 번의 호출이라 끼어들 틈이 없어요.'
      - ci:
          key: merge
          label: 실제 결과 보기
          source: ThreadSafeObjectsTest.getThenPutLosesButMergeIsExact
      - p: '`get` 뒤 `put`은 경쟁 상태와 동기화 레슨의 **읽고-고치고-쓰기**예요. 맵의 메서드 하나하나가 안전해도 두 호출을 묶어 주지는 않아요. 읽고 고치는 일은 한 번의 호출로 해요: `merge`, `compute`, `computeIfAbsent`, `putIfAbsent`.'
      - ci:
          key: compute
          label: computeIfAbsent와 containsKey 뒤 put 비교 보기
          source: ThreadSafeObjectsTest.computeIfAbsentCreatesOnce
      - p: '`computeIfAbsent(key, f)`는 키가 없을 때만 `f`를 불러 넣어요. 같은 키로 32개 스레드가 동시에 불러도 `f`는 한 번만 불렸어요. `containsKey` 뒤 `put`은 확인하고-행동하기라 여러 번 만들었어요.'
      - more:
          summary: '더 알아보기: CopyOnWriteArrayList와 큐'
          body:
            - p: '`CopyOnWriteArrayList`는 쓸 때마다 배열을 통째로 복사해요. 읽기가 아주 많고 쓰기가 드문 리스너 목록에 맞아요. 스레드끼리 작업을 넘기는 큐(`BlockingQueue`)는 스레드 풀 레슨에서 다뤄요.'
      - quiz:
          q: '스레드 8개가 `ConcurrentHashMap`에서 같은 키의 값을 `get` 하고 1을 더해 `put` 하기를 1만 번씩 했어요. 값은?'
          options:
            - 정확히 8만
            - 8만 이하. 두 호출 사이에 끼어든다
            - ConcurrentModificationException
          answer: 2
          explain: '`get`과 `put` 사이에 다른 스레드가 끼어들어 쓰기가 덮여요. `merge`로 한 번에 해요.'
    recall: '`HashMap`이 아니라 `ConcurrentHashMap`을 쓰고, 값을 읽고 고치는 일은 `merge`나 `computeIfAbsent`처럼 한 번의 호출로 해요. `HashMap`은 동시에 넣으면 넣은 것이 사라질 수 있어요. 안전한 맵도 `get` 하고 `put` 하면 두 호출 사이에 다른 스레드가 끼어들어요.'
practice:
  says:
    - '싱글톤 빈은 모든 요청 스레드가 함께 쓴다(C1). 스프링이 권하는 모양은 상태 없는 빈이다: 필드에는 다른 빈과 설정처럼 바뀌지 않는 것만 둔다. 요청마다 다른 값은 매개변수로 넘긴다'
    - '빈에 캐시를 두어야 하면 코드 cache처럼 `ConcurrentHashMap`과 `computeIfAbsent`를 쓴다. 크기 제한과 만료가 필요하면 캐시 라이브러리를 쓴다(A4)'
    - '스프링이 쓰는 ThreadLocal: `RequestContextHolder`(지금 요청), `SecurityContextHolder`(로그인 사용자), `TransactionSynchronizationManager`(지금 트랜잭션). 요청 스레드에서는 스프링이 넣고 지운다. 그래서 `@Async`나 직접 만든 풀에서는 이 값들이 없다(스프링 문서 근거)'
    - '흔한 실수: 인터셉터의 `preHandle`에서 직접 만든 ThreadLocal에 사용자를 넣고 지우지 않는다. 고친 코드: `afterCompletion`에서 `remove()`한다. `afterCompletion`은 예외가 나도 불린다. 질문 3의 테스트가 같은 원리를 보인다'
  body:
    - p: '스프링 서버에서 이 레슨의 세 방법은 **빈의 모양**, **캐시**, **요청 정보**로 만나요. 맵과 ThreadLocal의 동작은 테스트로 확인했고, 스프링이 쓰는 ThreadLocal은 스프링 문서가 근거예요.'
    - h3: 상태 없는 빈
    - p: '싱글톤 빈은 모든 요청 스레드가 함께 써요. 그래서 필드에는 다른 빈과 설정처럼 **바뀌지 않는 것만** 두고, 요청마다 다른 값은 매개변수로 넘겨요(첫째와 둘째 방법). 그러면 빈 자체가 스레드에 안전해요.'
    - h3: 빈에 캐시를 둬야 한다면
    - code: cache
      notes:
        - mark: computeIfAbsent
          as: code
          text: '처음 조회하는 통화만 `fetch`를 불러요. 같은 통화로 동시에 들어와도 한 번이에요.'
    - p: '`HashMap`으로 두면 질문 4의 결과처럼 넣은 값이 사라지고, `containsKey` 뒤 `put`이면 `fetch`가 여러 번 불려요. 크기 제한과 만료가 필요하면 캐시 라이브러리를 써요(캐시 전략과 무효화 레슨).'
    - h3: 스프링이 쓰는 ThreadLocal
    - ul:
        - '`RequestContextHolder`는 지금 요청을([API 문서](link:requestContext)), `SecurityContextHolder`는 로그인 사용자를([시큐리티 문서](link:securityContext)), `TransactionSynchronizationManager`는 지금 트랜잭션을 ThreadLocal에 둬요.'
        - '요청 스레드에서는 스프링이 넣고 요청이 끝나면 지워요. 그래서 `@Async`나 직접 만든 풀에서는 이 값들이 **없어요**(질문 3의 "따라가지 않아요").'
    - h3: '흔한 실수: 인터셉터에서 넣고 지우지 않기'
    - code: interceptorBad
    - p: '질문 3의 위젯 그대로, 다음에 같은 톰캣 스레드가 처리하는 요청이 이 사용자로 보여요. 지우는 곳은 `afterCompletion`이에요. 컨트롤러에서 예외가 나도 불려요.'
    - code: interceptorFixed
      notes:
        - mark: CURRENT.remove()
          as: code
          text: '요청이 어떻게 끝나든 지워요.'
interview:
  question: 스레드에 안전한 객체를 만드는 방법을 설명해 주세요
  model:
    - label: 정의
      text: 여러 스레드가 동시에 써도 부르는 쪽이 따로 동기화하지 않아도 맞게 동작하는 객체입니다. 락 없이 만드는 방법은 바꾸지 않기, 함께 쓰지 않기, 안전한 도구에 맡기기입니다.
    - label: 원리
      text: 불변 객체는 바뀌지 않아 경쟁 상태가 없고, 바뀌어야 하면 새 객체로 참조만 바꿉니다. 지역 변수와 ThreadLocal은 스레드마다 따로라 함께 쓰지 않습니다. 함께 쓰는 맵은 ConcurrentHashMap을 쓰고 읽고 고치는 일은 merge나 computeIfAbsent로 한 번에 합니다.
    - label: 주의할 점
      text: 스레드 풀은 스레드를 다시 쓰니 ThreadLocal을 finally에서 remove하지 않으면 다음 요청에 값이 섞이고 메모리를 붙잡습니다. 또 ThreadLocal은 다른 스레드로 따라가지 않아 @Async에서는 비어 있습니다. 안전한 맵도 get 뒤 put처럼 두 번 부르면 끼어듭니다.
    - label: 경험
      text: '(내 프로젝트로 채우기) 예: 인터셉터에서 ThreadLocal에 넣은 사용자 정보를 afterCompletion에서 지우지 않아 다른 요청에 섞여, remove를 넣었습니다.'
verified: 이 레슨의 결과는 짐작이 아니라 자바 21에서 코드를 돌려 받은 값이에요. 끼어드는 순서가 중요한 것은 래치로 맞췄고, 경쟁 상태는 여러 번 돌려 한 번이라도 생기는지를 확인했어요. 코드가 바뀔 때마다 테스트([ThreadSafeObjectsTest](link:test))가 다시 돌아요.
footer: '근거: final 필드의 의미는 자바 언어 명세 17.5([링크](link:jlsFinal)), ThreadLocal은 API 문서([링크](link:threadLocal)), ConcurrentHashMap의 원자적 메서드는 API 문서([링크](link:chm)), 스프링의 ThreadLocal은 스프링 문서. 결과는 OpenJDK 21에서 테스트로 확인했어요. 오류는 [GitHub 이슈](https://github.com/wanja727/dev-lessons/issues)로 알려 주세요.'
claims:
  - claim: '래치로 쓰는 스레드를 두 필드 쓰기 사이에 세우면, 읽는 스레드는 금액만 바뀐 섞인 값을 본다'
    how: 'MutablePrice의 set을 두 줄로 나누고 사이에 래치를 둔다'
    test: ThreadSafeObjectsTest.mutableObjectShowsTornState
  - claim: '불변 Price를 volatile 참조로 바꾸면, 쓰는 스레드가 100만 번 바꾸는 동안 읽는 스레드는 섞인 값을 한 번도 보지 않는다'
    how: '금액과 통화를 짝지어 바꾸고 읽을 때마다 짝이 맞는지 센다'
    test: ThreadSafeObjectsTest.immutableSwapIsNeverTorn
  - claim: 'ThreadLocal은 스레드마다 다른 값을 돌려준다'
    how: '두 스레드가 다른 값을 넣고 읽는다'
    test: ThreadSafeObjectsTest.threadLocalPerThread
  - claim: '스레드 하나짜리 풀에서 앞 작업이 지우지 않은 ThreadLocal 값을 다음 작업이 읽고, remove하면 null이다'
    how: '코드 predict와 고친 코드를 돌린다'
    test: ThreadSafeObjectsTest.threadLocalLeaksInPool
  - claim: '요청 스레드에서 넣은 ThreadLocal 값을 다른 스레드에서 읽으면 null이다'
    how: 'CompletableFuture.supplyAsync로 읽는다'
    test: ThreadSafeObjectsTest.threadLocalDoesNotFollow
  - claim: '스레드 8개가 HashMap에 서로 다른 키 1만 개씩 넣으면 size가 8만이 아니거나 예외가 날 수 있고, ConcurrentHashMap은 정확히 8만이다'
    how: 'HashMap 쪽은 최대 20번 돌려 한 번이라도 어긋나는지 본다'
    test: ThreadSafeObjectsTest.hashMapIsNotThreadSafe
  - claim: 'ConcurrentHashMap에서도 get 뒤 put으로 세면 8만보다 작을 수 있고, merge는 정확히 8만이다'
    how: '스레드 8개, 같은 키, 1만 번씩'
    test: ThreadSafeObjectsTest.getThenPutLosesButMergeIsExact
  - claim: 'computeIfAbsent는 스레드 32개가 같은 키로 동시에 불러도 값을 한 번만 만들고, containsKey 뒤 put은 여러 번 만들 수 있다'
    how: '래치로 동시에 출발시키고 만든 횟수를 센다'
    test: ThreadSafeObjectsTest.computeIfAbsentCreatesOnce
sources:
  - 'final 필드의 의미: 자바 언어 명세 17.5 https://docs.oracle.com/javase/specs/jls/se21/html/jls-17.html#jls-17.5'
  - '`ThreadLocal`: API 문서 https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/lang/ThreadLocal.html'
  - '`ConcurrentHashMap`의 원자적 메서드: API 문서 https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/concurrent/ConcurrentHashMap.html'
  - '`HashMap`은 동기화되지 않는다는 것: API 문서 https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/HashMap.html'
  - '`SimpleDateFormat`이 동기화되지 않는다는 것: API 문서 https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/text/SimpleDateFormat.html'
  - '`RequestContextHolder`: 스프링 API 문서 https://docs.spring.io/spring-framework/docs/current/javadoc-api/org/springframework/web/context/request/RequestContextHolder.html'
  - '`SecurityContextHolder`의 저장 방식: 스프링 시큐리티 문서 https://docs.spring.io/spring-security/reference/servlet/authentication/architecture.html'
