# 스레드에 안전한 객체 (설계서)
# 자료 파일의 칸은 docs/lesson-data-format.md에 있다.
stage: design
title: 스레드에 안전한 객체
unit: 운영체제와 동시성
roadmap: C6
type: 자바 실행
prerequisites:
  - {slug: synchronization, title: 경쟁 상태와 동기화}
  - {slug: immutable-object, title: 불변 객체}
assume: '자바 21(OpenJDK). 경쟁 상태, 원자성과 가시성, `synchronized`와 `AtomicInteger`(경쟁 상태와 동기화 레슨). 불변 객체를 만드는 법(불변 객체 레슨). 스레드 풀이 스레드를 다시 쓴다는 것은 이 레슨에서 짧게 설명해요.'
example: '상품의 가격 정보 `Price`와, 상품별 조회 수를 세는 맵. 락을 쓰지 않고 안전하게 만드는 세 가지 방법(바꾸지 않기, 스레드에 가두기, 안전한 컬렉션 쓰기)을 차례로 적용해요. 실무 구역에서는 스프링의 요청 정보를 담는 `ThreadLocal`과 싱글톤 빈의 캐시로 옮겨요.'
intro:
  - '로그인한 사용자 정보를 `ThreadLocal`에 넣어 두고 서비스 어디서든 꺼내 쓰게 했어요. 그런데 가끔 로그인하지 않은 요청에서 다른 사람의 이름이 찍혀요. 같은 서버의 조회 수 맵은 `HashMap`인데, 합계가 요청 수보다 늘 조금 적어요.'
  - '모든 코드에 락을 걸 수는 없어요. 느려지고, 잘못 걸면 데드락이 나요. 그래서 자바 개발자는 처음부터 여러 스레드가 함께 써도 안전한 모양으로 객체를 만들어요. 스프링이 싱글톤 빈을 상태 없이 만들라고 하는 것, 요청 정보를 `ThreadLocal`에 두는 것, 캐시에 `ConcurrentHashMap`을 쓰는 것이 모두 이 방법이에요.'
  - '이 레슨에서는 불변 객체를 여러 스레드가 함께 읽어도 깨지지 않는 것, 스레드 풀에서 `ThreadLocal`을 지우지 않으면 다음 작업이 앞 작업의 값을 보는 것, `HashMap`과 `ConcurrentHashMap`에 동시에 넣은 결과를 돌려 확인해요.'
covers:
  - topic: '스레드에 안전하다: 여러 스레드가 동시에 써도 부르는 쪽이 따로 동기화하지 않아도 맞게 동작한다'
    where: '질문 1'
  - topic: '락 없이 안전하게 만드는 세 방법: 바꾸지 않기(불변), 함께 쓰지 않기(스레드에 가두기), 안전한 도구에 맡기기'
    where: '질문 1'
  - topic: '불변 객체는 바뀌지 않으니 경쟁 상태가 없다. final 필드는 생성자가 끝나면 다른 스레드에 보인다'
    where: '질문 1. J9에서 받은 항목'
  - topic: '바뀐 값을 알리려면 새 불변 객체를 만들어 참조를 바꾼다(volatile이나 AtomicReference)'
    where: '질문 1'
  - topic: '스레드에 가두기: 지역 변수와 그 안에서만 쓰는 객체는 한 스레드만 본다'
    where: '질문 2'
  - topic: 'ThreadLocal: 같은 변수를 스레드마다 다른 값으로 가진다'
    where: '질문 2'
  - topic: '스레드에 안전하지 않은 클래스(SimpleDateFormat)와 안전한 대안(DateTimeFormatter)'
    where: '질문 2의 더 알아보기'
  - topic: '스레드 풀은 스레드를 다시 쓴다. ThreadLocal을 지우지 않으면 다음 작업이 앞 작업의 값을 본다. 남은 값은 메모리도 붙잡는다'
    where: '질문 3. J15에서 받은 항목'
  - topic: '다른 스레드로 넘어가면 ThreadLocal의 값은 따라가지 않는다'
    where: '질문 3'
  - topic: '여러 스레드가 함께 쓰는 HashMap은 넣은 것이 사라지거나 구조가 깨질 수 있다'
    where: '질문 4. J15에서 받은 항목, 해시 테이블의 원리는 해시 테이블(K4)'
  - topic: 'Collections.synchronizedMap과 ConcurrentHashMap의 차이'
    where: '질문 4'
  - topic: '안전한 맵도 get 하고 put 하면 두 연산 사이에 끼어든다. merge, compute, computeIfAbsent, putIfAbsent로 한 번에 한다'
    where: '질문 4'
  - topic: 'CopyOnWriteArrayList, 여러 스레드가 함께 쓰는 큐'
    where: '질문 4의 더 알아보기. 큐는 스레드 풀(C7)'
  - topic: '스프링의 싱글톤 빈은 상태를 두지 않는다. 요청 정보는 매개변수나 ThreadLocal(RequestContextHolder, SecurityContextHolder)로 다룬다'
    where: '실무에서는. 빈의 스코프는 빈의 생명주기와 스코프(S3)'
codes:
  predict: |-
    static ThreadLocal<String> user =
        new ThreadLocal<>();

    var pool = Executors
        .newSingleThreadExecutor();
    pool.submit(() -> user.set("kim"));
    pool.submit(() -> System.out.println(
        user.get()));
  price: |-
    record Price(long amount,
                 String currency) {}

    volatile Price price =
        new Price(10000, "KRW");

    // 바꿀 때는 새 객체로
    price = new Price(12000, "KRW");
  mutablePrice: |-
    class MutablePrice {
      long amount;
      String currency;

      void set(long a, String c) {
        amount = a;
        currency = c;
      }
    }
  threadLocal: |-
    static ThreadLocal<String> user =
        new ThreadLocal<>();

    try {
      user.set(login.name());
      handle();
    } finally {
      [[user.remove()]];
    }
  hashMap: |-
    Map<Integer, Integer> views =
        new HashMap<>();
    // 스레드 8개가 서로 다른 키 1만 개씩
    views.put(key, 1);
  merge: |-
    Map<Long, Integer> views =
        new ConcurrentHashMap<>();

    // 틀림: 두 연산 사이에 끼어든다
    Integer v = views.get(id);
    views.put(id, v == null ? 1 : v + 1);

    // 맞음: 한 번에
    views.[[merge(id, 1, Integer::sum)]];
  cache: |-
    @Service
    class ExchangeRateService {
      private final Map<String, Rate> cache =
          new ConcurrentHashMap<>();

      Rate rate(String code) {
        return cache.[[computeIfAbsent]](
            code, this::fetch);
      }
    }
predict:
  text: '코드 predict는 스레드 하나짜리 풀에서 첫 작업이 `ThreadLocal`에 "kim"을 넣고, 둘째 작업이 그것을 읽어요. 둘째 작업은 무엇을 출력할까요? 보기: null / kim / 예외'
  answer: 'kim. 풀은 같은 스레드를 다시 쓰고, 첫 작업이 값을 지우지 않았다. 질문 3에서 밝힌다.'
questions:
  - id: q1
    title: 불변 객체는 왜 여러 스레드가 함께 써도 안전한가요?
    conclusion:
      lead: '만든 뒤에 바뀌지 않으니 누가 언제 읽어도 같은 값이라, 경쟁 상태가 생길 자리가 없어요.'
      sub: '자바는 final 필드를 생성자가 끝난 뒤 다른 스레드에게 보이게 약속해요. 값이 바뀌어야 하면 새 객체를 만들어 참조 하나만 바꿔요.'
    says:
      - '스레드에 안전하다는 것은 여러 스레드가 동시에 써도, 부르는 쪽이 따로 락을 걸지 않아도 맞게 동작한다는 뜻이다. 락을 걸지 않고 그렇게 만드는 방법은 셋이다: 바꾸지 않기, 함께 쓰지 않기, 안전한 도구에 맡기기. 질문 1~4가 차례로 다룬다'
      - '경쟁 상태는 함께 쓰는 값을 고칠 때 생긴다(C3). 불변 객체는 고칠 수 없으니 생기지 않는다. `String`, `Integer`, `LocalDate`, record가 여러 스레드에서 걱정 없이 쓰이는 이유다(J9)'
      - '코드 mutablePrice. 필드 둘을 차례로 쓰는 `set` 사이에 다른 스레드가 읽으면 새 금액과 옛 통화가 섞인 값을 본다. 래치로 쓰는 스레드를 두 줄 사이에 세우고 읽어 섞인 값을 보인다'
      - '코드 price. 바뀌어야 하면 새 `Price`를 만들어 참조를 바꾼다. 참조를 바꾸는 것은 한 번의 쓰기라 읽는 쪽은 옛 객체나 새 객체 가운데 하나를 통째로 본다. 섞인 값은 없다. 참조에 `volatile`을 붙여 새 객체를 보게 한다(C3 질문 2)'
      - '자바 메모리 모델은 final 필드에 대해 따로 약속한다: 생성자가 끝난 객체를 다른 스레드가 보면 final 필드는 생성자가 쓴 값으로 보인다. final이 아닌 필드는 이 약속이 없다(JLS 17.5)'
    asks:
      - '본문의 예시: 코드 mutablePrice의 `set(12000, "USD")` 중간(첫 줄 뒤)에 다른 스레드가 읽었다. 처음 값은 (10000, KRW)다. 읽은 값으로 나올 수 있는 것은 (12000, KRW. 금액만 바뀐 섞인 값)'
      - '옮긴 상황: `record Range(int lo, int hi)`를 `volatile Range range`로 두고 바꿀 때마다 새 Range를 만든다. 읽는 스레드가 lo는 새 값, hi는 옛 값을 볼 수 있나 (없다. 객체를 통째로 바꾸니 옛 객체나 새 객체 하나를 본다)'
  - id: q2
    title: 스레드에 가둔다는 것과 ThreadLocal은 무엇인가요?
    conclusion:
      lead: '객체를 한 스레드만 보게 해서 함께 쓰지 않는 방법이에요. 지역 변수가 그렇고, `ThreadLocal`은 같은 변수를 스레드마다 다른 값으로 가지게 해요.'
      sub: '함께 쓰지 않으면 바뀌는 객체여도 안전해요. 다만 그 객체를 필드나 다른 스레드로 넘기는 순간 갇힌 것이 아니게 돼요.'
    says:
      - '지역 변수는 스레드의 스택에 있다(C1). 메서드 안에서 만들어 밖으로 내보내지 않은 `ArrayList`는 한 스레드만 본다. 동기화 없이 써도 된다'
      - '`ThreadLocal<T>`는 스레드마다 따로 값을 가진 변수다. 스레드 A가 `set("kim")`, B가 `set("lee")`하면 각자 `get()`이 자기 값을 돌려준다. 테스트로 보인다'
      - '쓰임: 요청마다 다른 정보(로그인 사용자, 요청 id, 트랜잭션)를 메서드마다 매개변수로 넘기지 않고 꺼내 쓴다. 요청 하나를 스레드 하나가 처리하니 스레드마다 다른 값이 곧 요청마다 다른 값이다'
      - '갇힘이 깨지는 때: 지역에서 만든 객체를 static 필드나 싱글톤 빈의 필드에 넣거나, 다른 스레드에 넘기면 함께 쓰는 것이 된다'
      - '더 알아보기: `SimpleDateFormat`은 안에 계산 중인 상태를 둬서 여러 스레드가 함께 쓰면 틀린 날짜를 내거나 예외를 던진다. 예전에는 `ThreadLocal`에 하나씩 두었다. 자바 8의 `DateTimeFormatter`는 불변이라 하나를 함께 쓴다'
    asks:
      - '본문의 예시: 스레드 A가 `user.set("kim")`, 스레드 B가 `user.set("lee")`를 한 뒤 A가 `user.get()`을 부른다. 결과는 (kim. 스레드마다 값이 따로다)'
      - '옮긴 상황: 메서드 안에서 `new ArrayList<>()`를 만들어 값을 넣고 리턴하기 전에 싱글톤 빈의 필드 `lastResult`에 넣었다. 이 리스트는 아직 스레드에 갇혀 있나 (아니다. 필드에 넣는 순간 다른 스레드가 볼 수 있다)'
  - id: q3
    title: 스레드 풀에서 ThreadLocal을 지우지 않으면 무슨 일이 생기나요?
    conclusion:
      lead: '풀은 스레드를 버리지 않고 다음 작업에 다시 쓰므로, 지우지 않은 값이 다음 작업에 그대로 보여요.'
      sub: '다른 사용자의 정보가 섞이고, 남은 값은 메모리를 붙잡아요. 그래서 넣은 곳의 `finally`에서 꼭 `remove()`해요.'
    says:
      - '스레드 풀은 정해진 스레드로 작업을 차례로 처리한다. 작업이 끝나도 스레드는 살아 있고 다음 작업을 받는다(자세한 것은 C7). 톰캣의 요청 처리 스레드도 풀이다'
      - '예측의 답을 밝힌다. 코드 predict의 둘째 작업은 kim을 출력한다. 같은 스레드에서 돌았고 첫 작업이 지우지 않았다. 실제 출력으로 보인다'
      - '실제로 생기는 일: 로그인한 사용자의 요청이 사용자를 넣고 지우지 않으면, 같은 스레드가 다음에 처리하는 로그인하지 않은 요청이 그 사용자로 보인다'
      - '코드 threadLocal. `finally`에서 `remove()`하면 둘째 작업은 null을 본다. 테스트로 비교한다'
      - '메모리: 지우지 않은 값은 스레드가 살아 있는 동안 남는다. 풀의 스레드는 서버가 꺼질 때까지 살아 있으니 큰 객체를 넣으면 계속 붙잡는다(J15의 "가리키는 것이 남아 있으면 치우지 않는다")'
      - '다른 스레드로 넘어가면 따라가지 않는다. 요청 스레드에서 넣은 값을 `CompletableFuture`나 `@Async`가 실행하는 다른 스레드에서 읽으면 null이다. 테스트로 보인다'
    widget:
      kind: steps
      note: '스레드 하나짜리 풀. duo 왼쪽은 풀의 스레드 pool-1이 가진 ThreadLocal 값, 오른쪽은 처리 중인 요청. 시나리오 "remove 없음": 요청 1(kim 로그인) 시작, user=kim, 요청 1 끝(값 남음), 요청 2(로그인 안 함) 시작, user.get()=kim(bad). 시나리오 "finally에서 remove": 요청 1 끝에서 값이 비고, 요청 2는 null'
    asks:
      - '본문의 예시: 코드 predict에서 첫 작업 끝에 `user.remove()`를 더했다. 둘째 작업의 출력은 (null)'
      - '옮긴 상황: 요청 스레드에서 `user.set("kim")`을 한 뒤 `CompletableFuture.runAsync(() -> log(user.get()))`로 공용 풀에서 실행했다. 찍히는 값은. 공용 풀의 스레드는 user를 넣은 적이 없다 (null. 다른 스레드라 값이 따라가지 않는다)'
  - id: q4
    title: 여러 스레드가 함께 쓰는 맵은 무엇을 써야 하나요?
    conclusion:
      lead: '`HashMap`이 아니라 `ConcurrentHashMap`을 쓰고, 값을 읽고 고치는 일은 `merge`나 `computeIfAbsent`처럼 한 번의 호출로 해요.'
      sub: '`HashMap`은 동시에 넣으면 넣은 것이 사라질 수 있어요. 안전한 맵도 `get` 하고 `put` 하면 두 호출 사이에 다른 스레드가 끼어들어요.'
    says:
      - '코드 hashMap. 스레드 8개가 서로 다른 키를 1만 개씩 넣는다. 넣은 키는 8만 개인데 `size()`가 그보다 작거나, 드물게 예외가 날 수 있다. 같은 칸에 동시에 넣거나 배열을 늘리는 중에 끼어들면 하나가 사라진다. 실제 결과를 보인다'
      - '`ConcurrentHashMap`은 같은 일에서 정확히 8만이다. 칸마다 따로 잠가서 서로 다른 칸에 넣는 스레드는 기다리지 않는다. 읽기는 락 없이 한다'
      - '`Collections.synchronizedMap(new HashMap<>())`도 안전하지만 맵 전체를 락 하나로 잠가 모든 스레드가 한 줄로 선다. 순회할 때는 부르는 쪽이 직접 잠가야 한다'
      - '코드 merge. 안전한 맵이어도 `get` 뒤 `put`은 C3의 읽고-고치고-쓰기다. 스레드 8개가 같은 상품의 조회 수를 1만 번씩 올리면 8만보다 작다. `merge(id, 1, Integer::sum)`은 정확히 8만이다'
      - '`computeIfAbsent(key, f)`는 키가 없을 때만 f를 불러 넣는다. 스레드 여럿이 같은 키로 동시에 불러도 f는 한 번만 불린다. `containsKey` 뒤 `put`은 둘 다 만들 수 있다. 테스트로 비교한다'
      - '더 알아보기: `CopyOnWriteArrayList`는 쓸 때마다 배열을 통째로 복사한다. 읽기가 아주 많고 쓰기가 드문 리스너 목록에 맞다. 스레드끼리 작업을 넘기는 큐(`BlockingQueue`)는 C7에서 다룬다'
    asks:
      - '본문의 예시: 스레드 8개가 `ConcurrentHashMap`에 같은 키의 값을 `get` 하고 1을 더해 `put` 하기를 1만 번씩 했다. 값은 (8만 이하. 두 호출 사이에 끼어든다)'
      - '옮긴 상황: 상품 id별 재고 알림을 받을 사용자 목록을 맵에 모은다. 여러 요청이 같은 상품에 처음으로 동시에 등록할 때 목록이 하나만 만들어지게 하려면. 보기: if (!map.containsKey(id)) map.put(id, new ...), map.computeIfAbsent(id, k -> new ...) (computeIfAbsent. 키가 없을 때 한 번만 만든다)'
      - '실무 구역: 코드 cache를 `HashMap`으로 바꾸고 요청 스레드 여럿이 처음으로 같은 통화를 동시에 조회한다. 생길 수 있는 일은 (fetch가 여러 번 불리고, 맵이 깨져 넣은 값이 사라질 수 있다)'
practice:
  says:
    - '싱글톤 빈은 모든 요청 스레드가 함께 쓴다(C1). 스프링이 권하는 모양은 상태 없는 빈이다: 필드에는 다른 빈과 설정처럼 바뀌지 않는 것만 둔다. 요청마다 다른 값은 매개변수로 넘긴다'
    - '빈에 캐시를 두어야 하면 코드 cache처럼 `ConcurrentHashMap`과 `computeIfAbsent`를 쓴다. 크기 제한과 만료가 필요하면 캐시 라이브러리를 쓴다(A4)'
    - '스프링이 쓰는 ThreadLocal: `RequestContextHolder`(지금 요청), `SecurityContextHolder`(로그인 사용자), `TransactionSynchronizationManager`(지금 트랜잭션). 요청 스레드에서는 스프링이 넣고 지운다. 그래서 `@Async`나 직접 만든 풀에서는 이 값들이 없다(스프링 문서 근거)'
    - '흔한 실수: 인터셉터의 `preHandle`에서 직접 만든 ThreadLocal에 사용자를 넣고 지우지 않는다. 고친 코드: `afterCompletion`에서 `remove()`한다. `afterCompletion`은 예외가 나도 불린다. 질문 3의 테스트가 같은 원리를 보인다'
claims:
  - claim: '래치로 쓰는 스레드를 두 필드 쓰기 사이에 세우면, 읽는 스레드는 금액만 바뀐 섞인 값을 본다'
    how: 'MutablePrice의 set을 두 줄로 나누고 사이에 래치를 둔다'
  - claim: '불변 Price를 volatile 참조로 바꾸면, 쓰는 스레드가 100만 번 바꾸는 동안 읽는 스레드는 섞인 값을 한 번도 보지 않는다'
    how: '금액과 통화를 짝지어 바꾸고 읽을 때마다 짝이 맞는지 센다'
  - claim: 'ThreadLocal은 스레드마다 다른 값을 돌려준다'
    how: '두 스레드가 다른 값을 넣고 읽는다'
  - claim: '스레드 하나짜리 풀에서 앞 작업이 지우지 않은 ThreadLocal 값을 다음 작업이 읽고, remove하면 null이다'
    how: '코드 predict와 고친 코드를 돌린다'
  - claim: '요청 스레드에서 넣은 ThreadLocal 값을 다른 스레드에서 읽으면 null이다'
    how: 'CompletableFuture.supplyAsync로 읽는다'
  - claim: '스레드 8개가 HashMap에 서로 다른 키 1만 개씩 넣으면 size가 8만이 아니거나 예외가 날 수 있고, ConcurrentHashMap은 정확히 8만이다'
    how: 'HashMap 쪽은 최대 20번 돌려 한 번이라도 어긋나는지 본다'
  - claim: 'ConcurrentHashMap에서도 get 뒤 put으로 세면 8만보다 작을 수 있고, merge는 정확히 8만이다'
    how: '스레드 8개, 같은 키, 1만 번씩'
  - claim: 'computeIfAbsent는 스레드 32개가 같은 키로 동시에 불러도 값을 한 번만 만들고, containsKey 뒤 put은 여러 번 만들 수 있다'
    how: '래치로 동시에 출발시키고 만든 횟수를 센다'
    test: SynchronizationTest.computeIfAbsentOnce
sources:
  - 'final 필드의 의미: 자바 언어 명세 17.5 https://docs.oracle.com/javase/specs/jls/se21/html/jls-17.html#jls-17.5'
  - '`ThreadLocal`: API 문서 https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/lang/ThreadLocal.html'
  - '`ConcurrentHashMap`의 원자적 메서드: API 문서 https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/concurrent/ConcurrentHashMap.html'
  - '`HashMap`은 동기화되지 않는다는 것: API 문서 https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/HashMap.html'
  - '`SimpleDateFormat`이 동기화되지 않는다는 것: API 문서 https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/text/SimpleDateFormat.html'
  - '`RequestContextHolder`: 스프링 API 문서 https://docs.spring.io/spring-framework/docs/current/javadoc-api/org/springframework/web/context/request/RequestContextHolder.html'
  - '`SecurityContextHolder`의 저장 방식: 스프링 시큐리티 문서 https://docs.spring.io/spring-security/reference/servlet/authentication/architecture.html'
