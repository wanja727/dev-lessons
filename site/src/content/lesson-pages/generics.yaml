predict:
  title: 두 리스트의 클래스는 같을까요?
  text: '`List<String>` 객체와 `List<Long>` 객체의 클래스가 같은지 비교해요. 무엇이 출력될까요? 모르는 게 정상이니 감으로 골라 보세요. 답은 질문 2에 나와요.'
  code: predict
  label: 내 예측
  options:
    - value: 'true'
      label: 'true'
    - value: 'false'
      label: 'false'
    - value: compile
      label: 컴파일 오류
  answer: 'true'
  storageKey: gen-predict
  wrong: 예측은 "{label}"이었어요. 틀린 예측이 더 오래 남으니 괜찮아요.
questions:
  - id: q1
    title: 제네릭은 어떤 문제를 해결하나요?
    conclusion:
      lead: '잘못된 타입을 넣는 실수를 실행 중의 `ClassCastException`이 아니라 컴파일 오류로 잡아 줘요.'
      sub: '컬렉션에 무엇이 들었는지를 타입에 적어 두면, 컴파일러가 넣는 곳을 검사하고 꺼내는 곳의 형변환을 대신 넣어 줘요.'
    says:
      - '코드 raw. 제네릭 없이 쓰면 리스트는 `Object`를 담는다. 문자열 사이에 `Long`을 넣어도 컴파일된다. 꺼낼 때 `(String)`으로 형변환해야 하고, `Long`이 든 칸을 꺼내는 줄에서 `ClassCastException`이 난다. 잘못 넣은 곳과 터지는 곳이 다르다'
      - '코드 typed. `List<String>`이라고 적으면 `list.add(10L)`이 컴파일 오류다. 꺼낼 때 형변환을 쓰지 않는다. 오류가 넣는 줄로, 실행 전으로 당겨졌다'
      - '직접 선언하기. `class Page<T> { List<T> content; int number; }`의 `T`는 쓰는 쪽이 정하는 타입이다. `Page<Order>`에서는 `content`가 `List<Order>`가 된다. 클래스 하나로 모든 타입의 페이지를 만든다'
      - '제네릭 메서드. `static <T> T first(List<T> list)`는 메서드 앞에 `<T>`를 적는다. 부를 때 인자를 보고 컴파일러가 `T`를 정한다'
      - '범위 제한. `<T extends Comparable<T>> T max(List<T> list)`는 `T`가 비교할 수 있는 타입일 때만 받는다. 그래서 메서드 안에서 `compareTo`를 부를 수 있다'
      - '더 알아보기: `new ArrayList<>()`의 빈 꺾쇠(다이아몬드)는 왼쪽을 보고 컴파일러가 채운다. `var list = new ArrayList<String>();`의 `var`도 컴파일러가 타입을 정해 주는 것이고 실행 중의 동작은 같다'
    asks:
      - '본문의 예시: 코드 raw와 코드 typed에서 `Long` 값을 리스트에 넣는 실수는 각각 언제 드러나나 (코드 raw는 실행 중에 꺼내는 줄에서 `ClassCastException`, 코드 typed는 넣는 줄의 컴파일 오류)'
      - '옮긴 상황: `static <T extends Comparable<T>> T max(List<T> list)`에 `List<String>`과 `List<Object>`를 각각 넘기면 어떻게 되나 (`List<String>`은 컴파일되고 `List<Object>`는 컴파일 오류다. `Object`는 `Comparable`이 아니다)'
    body:
      - p: '제네릭이 없던 시절의 리스트는 무엇이든 `Object`로 담았어요.'
      - code: raw
        notes:
          - mark: (String)
            as: code
            text: '꺼낸 것은 `Object`라서 원래 타입으로 직접 형변환해야 해요. 상속과 다형성 레슨의 내려받기예요.'
      - ci:
          key: raw
          label: 실제 결과 보기
          source: GenericsTest.rawList
      - p: '`Long`을 넣는 줄은 문제없이 지나갔고, **꺼내는 줄**에서 예외가 났어요. 잘못 넣은 곳과 터지는 곳이 달라요. 실제 코드에서는 넣는 곳과 꺼내는 곳이 다른 클래스, 다른 날에 있어서 원인을 찾기 어려워요.'
      - p: '제네릭은 리스트에 **무엇이 들었는지를 타입에 적어요.**'
      - code: typed
        notes:
          - mark: 10L
            as: code
            text: '`List<String>`에 `Long`을 넣으려 하니 컴파일러가 막아요.'
      - ci:
          key: typed
          label: 컴파일 결과 보기
          source: GenericsTest.typedListRejectsWrongType
      - p: '같은 실수가 **넣는 줄의 컴파일 오류**로 당겨졌어요. 꺼낼 때 형변환을 쓰지 않아도 되고요. 이것이 제네릭이 하는 일이에요.'
      - h3: 직접 만들기
      - p: '꺾쇠 안의 `T`는 "쓰는 쪽이 정하는 타입"이에요. 클래스 하나로 모든 타입의 페이지를 만들 수 있어요.'
      - code: page
        notes:
          - mark: T
            as: code
            text: '타입 매개변수예요. `Page<Order>`로 쓰면 이 클래스 안의 `T`가 모두 `Order`가 돼요.'
      - p: '메서드에도 붙일 수 있어요. 반환 타입 앞에 `<T>`를 적으면 부를 때 넘긴 인자를 보고 컴파일러가 `T`를 정해요. `T`에 조건을 걸 수도 있어요.'
      - code: max
        notes:
          - mark: T extends Comparable<T>
            as: code
            text: '`T`는 자기끼리 비교할 수 있는 타입이어야 해요. 그래서 안에서 `compareTo`를 부를 수 있어요. `List<String>`은 되고 `List<Object>`는 컴파일 오류예요.'
      - more:
          summary: '더 알아보기: 빈 꺾쇠와 var'
          body:
            - p: '`new ArrayList<>()`의 빈 꺾쇠(다이아몬드)는 왼쪽의 `List<String>`을 보고 컴파일러가 채워요. `var list = new ArrayList<String>();`의 `var`도 컴파일러가 타입을 정해 주는 것이에요. 둘 다 컴파일할 때의 편의일 뿐, 실행 중의 동작은 같아요.'
      - quiz:
          q: '`static <T extends Comparable<T>> T max(List<T> list)`에 `List<Object>`를 넘기면?'
          options:
            - 컴파일되고 아무것이나 돌려준다
            - 컴파일 오류. Object는 Comparable이 아니다
            - 실행할 때 ClassCastException
          answer: 2
          explain: '`T`의 범위를 `Comparable<T>`로 제한했어요. `Object`는 그 조건을 만족하지 않아 컴파일러가 막아요. 테스트로 확인했어요.'
      - next: '컴파일러가 꺾쇠 안의 타입으로 검사를 한다면, 실행 중인 리스트는 자기가 `String`용이라는 것을 알고 있을까요?'
    recall: '잘못된 타입을 넣는 실수를 실행 중의 `ClassCastException`이 아니라 넣는 줄의 컴파일 오류로 잡아 줘요. 제네릭이 없으면 `Object`로 담고 꺼낼 때 형변환해서, 잘못 넣은 곳과 터지는 곳이 달라요. `class Page<T>`나 `<T> T first(List<T>)`처럼 직접 만들 수 있고, `T extends Comparable<T>`로 범위를 제한할 수 있어요.'
  - id: q2
    title: 꺾쇠 안의 타입은 실행 중에 어떻게 되나요?
    conclusion:
      lead: '남아 있지 않아요. 컴파일러가 검사를 마친 뒤 타입 인자를 지우고, 필요한 자리에 형변환을 넣어요. 이것을 타입 소거라고 해요.'
      sub: '그래서 실행 중에 타입 인자가 필요한 일은 할 수 없고, 컴파일러의 검사를 비켜 간 값은 꺼내는 곳에서야 드러나요.'
    says:
      - '코드 predict. `names.getClass()`와 `ids.getClass()`는 둘 다 `ArrayList`다. 실행 중의 리스트는 자기가 `String`용인지 `Long`용인지 모른다. 예측의 답을 밝힌다'
      - '컴파일러가 하는 일은 둘이다. 넣는 곳의 타입을 검사한다. 그리고 `String s = list.get(0);`을 `String s = (String) list.get(0);`으로 바꾼다. 코드 raw에서 손으로 쓰던 형변환이 보이지 않게 들어가 있다'
      - '이렇게 만든 이유는 제네릭이 없던 시절의 코드와 클래스 파일이 그대로 돌게 하기 위해서다. 자바 5에서 제네릭이 들어왔다'
      - '소거 때문에 안 되는 것. `new T()`는 실행 중에 `T`가 무엇인지 몰라서, `obj instanceof List<String>`은 확인할 정보가 없어서, `void save(List<String> a)`와 `void save(List<Long> a)`의 오버로딩은 지우고 나면 둘이 같아져서 컴파일되지 않는다. `List<int>`가 안 되는 것도 지운 자리가 `Object`가 되어야 해서다(J3)'
      - '실행 중에 타입이 필요하면 `Class<T>`를 인자로 함께 받는다. `objectMapper.readValue(json, OrderDto.class)`의 둘째 인자가 그것이다'
      - '코드 pollution. 꺾쇠 없는 타입(로 타입)에 대입하면 컴파일러의 검사가 꺼진다. `raw.add(10L)`은 경고만 내고 컴파일된다. `List<String>`에 `Long`이 들어갔다. 예외는 넣을 때가 아니라 `names.get(0)`을 `String`에 담는 줄에서 난다. 그 줄에 숨은 `(String)` 형변환이 있기 때문이다. 코드에 형변환이 보이지 않는 줄에서 `ClassCastException`이 나면 이것을 의심한다'
      - '컴파일러의 unchecked 경고는 "이 줄은 검사하지 못했으니 타입이 틀려도 책임지지 못한다"는 뜻이다. 무시하지 않는다'
      - '더 알아보기: `new T[10]` 같은 제네릭 배열은 만들 수 없다. 제네릭 부모의 메서드를 오버라이딩하면 컴파일러가 소거된 시그니처를 잇는 브리지 메서드를 만든다'
    asks:
      - '본문의 예시: 코드 pollution을 실행하면 `ClassCastException`이 나는 줄은 어디인가. 보기: `List raw = names;`, `raw.add(10L);`, `String first = names.get(0);` (`String first = names.get(0);`. 넣는 줄은 지나간다)'
      - '옮긴 상황: `class Repo { void save(List<String> names) {} void save(List<Long> ids) {} }`를 컴파일하면 어떻게 되나 (컴파일 오류. 타입 인자를 지우면 두 메서드의 시그니처가 같다)'
      - '실무 구역: `List<OrderDto> orders = objectMapper.readValue(json, List.class);`가 경고와 함께 컴파일됐다. `json`은 주문 객체 둘의 배열이다. `OrderDto first = orders.get(0);`을 실행하면 어떻게 되나 (`ClassCastException`. 리스트에 든 것은 `LinkedHashMap`이다)'
    body:
      - p: '처음 예측의 답은 **true**예요. {{predict-result}}'
      - ci:
          key: predict
          label: 실제 출력 보기
          source: GenericsTest.predict
          code: predict
      - p: '둘 다 그냥 `ArrayList`예요. 실행 중인 리스트는 자기가 `String`용인지 `Long`용인지 **몰라요.** 컴파일러가 꺾쇠 안의 타입으로 검사를 마친 뒤 그 정보를 **지우기** 때문이에요. 이것을 **타입 소거**라고 해요.'
      - p: '지우는 대신 컴파일러는 꺼내는 자리에 형변환을 넣어요. 질문 1의 코드 raw에서 손으로 쓰던 그 형변환이에요.'
      - code: erased
        notes:
          - mark: (String)
            as: code
            text: '코드에는 보이지 않지만 클래스 파일에는 들어 있어요.'
      - p: '왜 이렇게 만들었을까요? 제네릭은 자바 5에 들어왔어요. 그 전에 만든 코드와 클래스 파일이 그대로 돌게 하려고, 실행 중의 모습은 예전과 같게 두고 검사만 컴파일러에 더했어요.'
      - h3: 지워져서 할 수 없는 것들
      - ul:
          - '**`new T()`:** 실행 중에 `T`가 무엇인지 모르니 만들 수 없어요.'
          - '**`obj instanceof List<String>`:** 확인할 정보가 객체에 없어요.'
          - '**타입 인자만 다른 오버로딩:** 지우고 나면 두 메서드가 같아져요.'
          - '**`List<int>`:** 지운 자리는 `Object`라서 기본형이 들어갈 수 없어요. 래퍼 클래스와 오토박싱 레슨에서 미뤄 둔 이유예요.'
      - code: overload
      - ci:
          key: erasure
          label: 컴파일 결과 보기
          source: GenericsTest.erasureClash
      - p: '실행 중에 타입이 정말 필요하면 `Class<T>`를 인자로 함께 받아요. `objectMapper.readValue(json, OrderDto.class)`의 둘째 인자가 그것이에요.'
      - h3: 검사를 비켜 간 값은 꺼내는 곳에서 터져요
      - p: '꺾쇠 없이 쓴 타입을 **로 타입**이라고 해요. 로 타입에 대입하면 컴파일러의 검사가 꺼져요. 어느 줄에서 예외가 날지 예상해 보고 열어 보세요.'
      - ci:
          key: pollution
          label: 실제 결과 보기
          source: GenericsTest.heapPollution
          code: pollution
      - p: '`List<String>`에 `Long`이 들어갔는데 넣는 줄은 지나갔어요. 예외는 `names.get(0)`을 `String`에 담는 줄에서 났어요. 그 줄에 컴파일러가 넣은 `(String)`이 숨어 있으니까요. **코드에 형변환이 보이지 않는 줄에서 `ClassCastException`이 나면 이것을 의심해요.** 컴파일러의 `unchecked` 경고는 "이 줄은 검사하지 못했다"는 뜻이니 무시하지 않아요. 도입부의 JSON 사고도 같은 이유이고, 실무 구역에서 봐요.'
      - more:
          summary: '더 알아보기: 제네릭 배열과 브리지 메서드'
          body:
            - ul:
                - '`new T[10]`이나 `new List<String>[10]` 같은 제네릭 배열은 만들 수 없어요. 다음 질문에서 볼 배열의 실행 중 검사와 소거가 맞지 않아서예요.'
                - '제네릭 부모의 메서드를 오버라이딩하면, 컴파일러가 지워진 시그니처와 내가 쓴 시그니처를 잇는 메서드(브리지 메서드)를 몰래 만들어요. 스택 트레이스에서 가끔 보여요.'
      - quiz:
          q: '`List<String> names`를 로 타입 `List raw`에 대입하고 `raw.add(10L)`을 했어요. 예외가 나는 곳은?'
          options:
            - '`raw.add(10L)` 줄'
            - '`String first = names.get(0)` 줄'
            - 예외가 나지 않는다
          answer: 2
          explain: '로 타입이라 넣는 줄은 검사 없이 지나가요. 꺼내서 `String`에 담는 줄의 숨은 형변환에서 터져요.'
      - next: '실행 중에는 막을 수단이 없다면, 컴파일러는 무엇을 미리 막아야 할까요? `List<Integer>`를 `List<Number>`로 쓰는 것은 어떨까요?'
    recall: '남아 있지 않아요. 컴파일러가 꺾쇠 안의 타입으로 검사를 마친 뒤 지우고, 꺼내는 자리에 형변환을 넣어요(타입 소거). 그래서 `List<String>`과 `List<Long>`은 실행 중에 같은 `ArrayList`이고, `new T()`, `instanceof List<String>`, 타입 인자만 다른 오버로딩은 할 수 없어요. 로 타입으로 검사를 비켜 간 값은 형변환이 보이지 않는 꺼내는 줄에서 `ClassCastException`을 내요.'
  - id: q3
    title: 'List<Integer>는 왜 List<Number>에 넣을 수 없나요?'
    conclusion:
      lead: '넣을 수 있다면 `List<Number>` 변수로 그 리스트에 `Double`을 넣을 수 있게 되어, `List<Integer>`에 `Integer`가 아닌 것이 들어가기 때문이에요.'
      sub: '`Integer`가 `Number`의 자식이어도 `List<Integer>`는 `List<Number>`의 자식이 아니에요.'
    says:
      - '`Number n = Integer.valueOf(1);`은 된다. 그래서 `List<Number> nums = ints;`도 될 것 같지만 컴파일 오류다'
      - '코드 invariant로 이유를 본다. 둘째 줄이 허용된다고 하자. `nums`와 `ints`는 같은 리스트를 가리킨다(J2). `nums.add(3.14)`는 `List<Number>`에 `Double`을 넣는 것이라 막을 이유가 없다. 그러면 `ints`에 `Double`이 들어 있고 `ints.get(0)`이 깨진다. 컴파일러는 이 길을 처음 줄에서 막는다'
      - '소거 때문에 실행 중에는 막을 방법이 없다(질문 2). 그래서 컴파일할 때 막는 수밖에 없다'
      - '배열은 반대로 정했다. `Number[] nums = new Integer[1];`이 컴파일된다. 대신 배열은 실행 중에 자기 원소 타입을 알고 있어서 `nums[0] = 3.14;`에서 `ArrayStoreException`을 던진다. 같은 문제를 배열은 실행 중에, 제네릭은 컴파일할 때 막는다'
      - '그러면 `List<Integer>`와 `List<Double>`을 모두 받아 합계를 내는 메서드는 어떻게 쓰나. 다음 질문의 와일드카드다'
    asks:
      - '본문의 예시: 코드 invariant에서 컴파일 오류가 나는 줄은 어디인가 (`List<Number> nums = ints;`)'
      - '옮긴 상황: `Object[] arr = new String[1]; arr[0] = 10;`은 어떻게 되나 (컴파일은 되고 실행 중에 `ArrayStoreException`)'
    body:
      - p: '`Integer`는 `Number`의 자식이라 `Number n = Integer.valueOf(1);`은 돼요. 그러면 `List<Integer>`도 `List<Number>` 자리에 들어갈 것 같지만, **컴파일 오류**예요.'
      - ci:
          key: invariant
          label: 컴파일 결과 보기
          source: GenericsTest.invariance
      - p: '이유는 허용됐다고 가정해 보면 보여요.'
      - code: invariant
        notes:
          - mark: ints
            as: code
            text: '이 대입이 된다고 해 볼게요. 값과 참조 레슨에서 본 대로 `nums`와 `ints`는 같은 리스트를 가리켜요.'
      - ol:
          - '`nums`의 타입은 `List<Number>`이니 `nums.add(3.14)`는 막을 이유가 없어요. `Double`도 `Number`니까요.'
          - '그런데 그 리스트는 `ints`가 가리키는 바로 그 리스트예요. 이제 `List<Integer>` 안에 `Double`이 있어요.'
          - '`ints.get(0)`을 `Integer`에 담는 순간 깨져요.'
      - p: '질문 2에서 본 대로 실행 중에는 리스트가 자기 원소 타입을 몰라서 이것을 막을 수단이 없어요. 그래서 컴파일러가 **첫 줄에서** 막아요. `Integer`가 `Number`의 자식이어도 `List<Integer>`는 `List<Number>`의 자식이 아니에요.'
      - h3: 배열은 반대로 정했어요
      - p: '배열은 이 대입을 허용해요. 대신 실행 중에 막아요.'
      - ci:
          key: array
          label: 실제 결과 보기
          source: GenericsTest.arrayStore
          code: arrayRun
      - p: '배열은 **자기 원소 타입을 실행 중에도 알고 있어서**, 엉뚱한 것을 넣는 순간 `ArrayStoreException`을 던져요. 같은 문제를 배열은 실행 중에, 제네릭은 컴파일할 때 막아요. 앞당겨 막는 쪽이 더 안전해요.'
      - quiz:
          q: '`Object[] arr = new String[1]; arr[0] = 10;`은 어떻게 될까요?'
          options:
            - 컴파일 오류
            - 컴파일되고 실행 중에 ArrayStoreException
            - 정상으로 실행된다
          answer: 2
          explain: '배열은 `String[]`을 `Object[]` 자리에 허용해요. 대신 실행 중에 원소 타입을 확인해서 정수를 넣는 순간 예외를 던져요.'
      - next: '그러면 `List<Integer>`와 `List<Double>`을 모두 받아 합계를 내는 메서드는 어떻게 쓸까요?'
    recall: '넣을 수 있다면 `List<Number>` 변수로 같은 리스트에 `Double`을 넣을 수 있게 되어 `List<Integer>`에 `Integer`가 아닌 것이 들어가기 때문이에요. 실행 중에는 타입이 지워져 막을 수 없으니 컴파일러가 대입을 막아요. 배열은 반대로 대입을 허용하고 실행 중에 `ArrayStoreException`으로 막아요.'
  - id: q4
    title: '와일드카드 ? extends와 ? super는 언제 쓰나요?'
    conclusion:
      lead: '컬렉션에서 꺼내기만 하는 매개변수에는 `? extends T`를, 넣기만 하는 매개변수에는 `? super T`를 써요.'
      sub: '`? extends T`는 무엇이든 `T`로 꺼낼 수 있지만 넣을 수 없고, `? super T`는 `T`를 넣을 수 있지만 `Object`로만 꺼낼 수 있어요.'
    says:
      - '`double sum(List<? extends Number> list)`는 `List<Integer>`도 `List<Double>`도 받는다. `?`는 "`Number`의 자식인 어떤 타입"이다'
      - '꺼낸 것은 `Number`로 쓸 수 있다. 어떤 타입이든 `Number`의 자식이기 때문이다'
      - '넣을 수는 없다. `list.add(1)`은 컴파일 오류다. 실제로는 `List<Double>`일 수도 있어서 컴파일러가 무엇도 안전하다고 할 수 없다. 질문 3의 문제를 이렇게 막는다'
      - '`void fill(List<? super Integer> list)`는 `List<Integer>`, `List<Number>`, `List<Object>`를 받는다. `Integer`를 넣는 것은 셋 모두에 안전하다. 꺼낸 것은 `Object`로만 받을 수 있다'
      - '정리: 그 컬렉션이 값을 내주는 쪽이면 extends, 값을 받는 쪽이면 super. `Collections.copy(List<? super T> dest, List<? extends T> src)`가 두 가지를 다 보여 준다. 읽기도 쓰기도 하면 와일드카드 없이 `List<T>`로 쓴다'
      - '와일드카드는 매개변수에 쓴다. 반환 타입에 쓰면 받는 쪽이 불편해진다'
      - '더 알아보기: `List<?>`는 무엇의 리스트인지 상관하지 않을 때 쓴다. `size()`를 부르거나 `Object`로 꺼내는 것만 한다'
    widget:
      kind: classify
      note: '코드 한 줄씩을 "컴파일된다"와 "컴파일 오류" 가운데 고른다. 앞에 `List<? extends Number> src`와 `List<? super Integer> dest`가 선언돼 있다고 적어 둔다. 항목: `Number n = src.get(0);`(된다), `src.add(1);`(오류), `Integer i = src.get(0);`(오류), `dest.add(1);`(된다), `Integer j = dest.get(0);`(오류), `Object o = dest.get(0);`(된다), `sum(new ArrayList<Double>())`에서 매개변수가 `List<? extends Number>`일 때(된다), 매개변수가 `List<Number>`일 때(오류)'
    asks:
      - '본문의 예시: `double sum(List<? extends Number> list)` 안에서 `Number n = list.get(0);`과 `list.add(1);`은 각각 어떻게 되나 (첫째는 컴파일되고 둘째는 컴파일 오류다)'
      - '옮긴 상황: `void addDefaults(List<? super Long> ids) { ids.add(0L); }`에 `List<Number>`와 `List<Integer>`를 각각 넘기면 어떻게 되나 (`List<Number>`는 컴파일되고 `List<Integer>`는 컴파일 오류다. `Integer`는 `Long`의 부모가 아니다)'
    body:
      - p: '`List<Integer>`와 `List<Double>`을 모두 받아 합계를 내고 싶어요. 매개변수를 `List<Number>`로 두면 질문 3대로 둘 다 안 들어가요. 이때 **와일드카드** `?`를 써요.'
      - code: sum
        notes:
          - mark: '? extends Number'
            as: code
            text: '"`Number`의 자식인 어떤 타입"의 리스트예요. 정확히 무엇인지는 모르지만 `Number`로 꺼낼 수 있는 것만은 확실해요.'
      - ul:
          - '**꺼내는 것은 돼요.** 무엇이든 `Number`의 자식이니 `Number`로 받을 수 있어요.'
          - '**넣는 것은 안 돼요.** `list.add(1)`은 컴파일 오류예요. 실제로는 `List<Double>`일 수도 있으니까요. 질문 3의 문제를 이렇게 막아요.'
      - p: '반대 방향도 있어요. 리스트에 `Integer`를 **넣기만** 하는 메서드는 `? super Integer`로 받아요.'
      - code: fill
        notes:
          - mark: '? super Integer'
            as: code
            text: '"`Integer`의 부모인 어떤 타입"의 리스트예요. `List<Integer>`, `List<Number>`, `List<Object>`가 들어와요. 어느 것이든 `Integer`를 넣는 것은 안전해요.'
      - p: '대신 꺼낸 것은 `Object`로만 받을 수 있어요. 무엇의 리스트인지 모르니까요.'
      - h3: 직접 골라 보세요
      - p: '앞에 아래 네 가지가 선언돼 있어요. 각 줄이 컴파일될지 골라 보세요.'
      - code: wildcardRun
      - widget:
          kind: classify
          categories: [컴파일된다, 컴파일 오류]
          items:
            - text: '`Number n = src.get(0);`'
              answer: 1
              explain: '`src`에서 꺼낸 것은 무엇이든 `Number`의 자식이에요.'
            - text: '`src.add(1);`'
              answer: 2
              explain: '`src`가 실제로 `List<Double>`일 수도 있어서 아무것도 넣을 수 없어요.'
            - text: '`Integer i = src.get(0);`'
              answer: 2
              explain: '꺼낸 것이 `Number`라는 것만 알고 `Integer`인지는 몰라요.'
            - text: '`dest.add(1);`'
              answer: 1
              explain: '`dest`는 `Integer`의 부모 타입의 리스트라 `Integer`를 넣는 것은 언제나 안전해요.'
            - text: '`Integer j = dest.get(0);`'
              answer: 2
              explain: '`dest`가 `List<Object>`일 수도 있어서 꺼낸 것이 `Integer`라는 보장이 없어요.'
            - text: '`Object o = dest.get(0);`'
              answer: 1
              explain: '무엇이든 `Object`로는 받을 수 있어요.'
            - text: '`sum(new ArrayList<Double>())` (매개변수가 `List<? extends Number>`)'
              answer: 1
              explain: '`Double`은 `Number`의 자식이에요.'
            - text: '`sumExact(new ArrayList<Double>())` (매개변수가 `List<Number>`)'
              answer: 2
              explain: '질문 3대로 `List<Double>`은 `List<Number>`가 아니에요.'
      - ci:
          key: wildcard
          label: 여덟 줄을 실제로 컴파일한 결과 보기
          source: GenericsTest.wildcardLines
      - h3: 고르는 기준
      - p: '그 컬렉션이 **값을 내주는 쪽이면 `extends`**, **값을 받는 쪽이면 `super`**예요. 자바의 `Collections.copy(List<? super T> dest, List<? extends T> src)`가 둘을 함께 보여 줘요. 꺼내서(`src`) 넣는(`dest`) 메서드예요. 읽기도 쓰기도 한다면 와일드카드 없이 `List<T>`로 써요. 와일드카드는 매개변수에 쓰고, 반환 타입에는 쓰지 않아요. 받는 쪽이 꺼내 쓰기 불편해져요.'
      - more:
          summary: '더 알아보기: 그냥 ?'
          body:
            - p: '`List<?>`는 무엇의 리스트인지 상관하지 않을 때 써요. `size()`를 부르거나 원소를 `Object`로 꺼내는 것만 할 수 있어요.'
      - quiz:
          q: '`void addDefaults(List<? super Long> ids) { ids.add(0L); }`에 넘길 수 있는 것은?'
          options:
            - '`List<Number>`만'
            - '`List<Integer>`만'
            - 둘 다
          answer: 1
          explain: '`? super Long`은 `Long`의 부모 타입의 리스트예요. `Number`는 `Long`의 부모지만 `Integer`는 아니에요.'
    recall: '컬렉션에서 꺼내기만 하는 매개변수에는 `? extends T`를, 넣기만 하는 매개변수에는 `? super T`를 써요. `? extends Number`는 `List<Integer>`도 `List<Double>`도 받고 `Number`로 꺼낼 수 있지만 넣을 수는 없어요. `? super Integer`는 `Integer`를 넣을 수 있지만 꺼낸 것은 `Object`예요. 읽기도 쓰기도 하면 와일드카드 없이 `List<T>`로 써요.'
practice:
  title: 스프링에서는 이렇게 만나요
  says:
    - '공통 응답 클래스. `record ApiResponse<T>(T data, String message) { static <T> ApiResponse<T> ok(T data) { ... } }`. 컨트롤러는 `ApiResponse<OrderResponse>`나 `ApiResponse<List<OrderResponse>>`를 돌려준다. 질문 1의 제네릭 클래스와 제네릭 메서드가 그대로 쓰인다 (Jackson `ObjectMapper`로 직렬화한 JSON을 붙이는 테스트)'
    - '스프링 데이터의 `interface OrderRepository extends JpaRepository<Order, Long>`에서 꺾쇠의 두 타입이 엔티티와 id의 타입이다. `findById`의 인자가 `Long`이고 반환이 `Optional<Order>`인 것이 여기서 정해진다. 사용법은 P1'
    - '흔한 실수: JSON 배열을 `objectMapper.readValue(json, List.class)`로 읽어 `List<OrderDto>`에 담는다. `List.class`에는 원소의 타입이 없다(질문 2). Jackson은 원소를 `LinkedHashMap`으로 만든다. 대입은 경고만 내고 지나가고, 원소를 `OrderDto`로 꺼내는 줄에서 `ClassCastException`이 난다. 고친 코드: `objectMapper.readValue(json, new TypeReference<List<OrderDto>>() {})`. 고치기 전의 예외 메시지와 고친 뒤의 결과를 붙인다 (Jackson `ObjectMapper`로 돌리는 테스트)'
    - '외부 API를 부를 때도 같다. `RestClient`의 `.body(List.class)` 대신 `.body(new ParameterizedTypeReference<List<OrderDto>>() {})`를 쓴다 (스프링 프레임워크 공식 문서 근거)'
    - '`TypeReference`가 지워진 타입을 어떻게 아는지는 한 줄만 적는다. 중괄호 `{}`로 만든 익명 클래스의 선언에는 부모의 타입 인자가 클래스 파일에 남고, Jackson이 그것을 읽는다. 읽는 방법은 J17'
    - '컴파일러의 unchecked 경고를 `@SuppressWarnings`로 끄기 전에 왜 났는지 본다는 것'
  body:
    - p: '스프링 코드에서는 제네릭을 쓰기도 하고 직접 만들기도 해요. 응답 클래스와 JSON 읽기는 Jackson으로 확인했고, `RestClient`는 공식 문서가 근거예요.'
    - h3: 공통 응답 클래스
    - code: apiResponse
      notes:
        - mark: T
          as: code
          text: '`data`에 무엇이 들어갈지는 쓰는 쪽이 정해요. 질문 1의 `Page<T>`와 같아요.'
    - ci:
        key: api-response
        label: 실제 JSON 보기
        source: GenericsTest.apiResponse
        code: apiRun
    - p: '클래스 하나로 주문 하나든 주문 목록이든 같은 모양으로 감싸요. `ok`는 제네릭 메서드라 인자를 보고 `T`가 정해져요.'
    - h3: 리포지토리의 꺾쇠
    - code: repository
      notes:
        - mark: 'Order, Long'
          as: code
          text: '첫째가 엔티티, 둘째가 id의 타입이에요. 그래서 `findById`의 인자가 `Long`이고 반환이 `Optional<Order>`예요.'
    - p: '리포지토리를 쓰는 법은 ORM과 JPA 레슨에서 다뤄요.'
    - h3: '흔한 실수: JSON 배열을 List.class로 읽음'
    - p: '도입부의 사고예요.'
    - code: jsonBad
      notes:
        - mark: List.class
          as: code
          text: '`List.class`에는 원소의 타입이 없어요. 질문 2대로 꺾쇠는 클래스 객체에 남지 않으니까요. Jackson은 원소를 무엇으로 만들지 몰라서 `LinkedHashMap`으로 만들어요.'
    - ci:
        key: jackson
        label: 고치기 전과 뒤의 실제 결과 보기
        source: GenericsTest.jacksonRawList
        code: jsonRun
    - p: '대입은 경고만 내고 지나가요. 질문 2의 코드 pollution과 같아서, 원소를 `OrderDto`로 꺼내는 줄의 숨은 형변환에서 터져요. 고칠 때는 원소 타입까지 담긴 타입 정보를 넘겨요.'
    - code: jsonFixed
      notes:
        - mark: TypeReference
          as: code
          text: '끝의 `{}`가 중요해요. 이름 없는 자식 클래스를 그 자리에서 만들어요. 클래스의 **선언**에 적힌 부모의 타입 인자는 지워지지 않고 클래스 파일에 남아서, Jackson이 그것을 읽어 `List<OrderDto>`를 알아내요. 읽는 방법은 리플렉션과 어노테이션 레슨에서 다뤄요.'
    - p: '외부 API를 `RestClient`로 부를 때도 같아요. `List.class` 대신 스프링의 `ParameterizedTypeReference`를 써요.'
    - code: restClient
    - muted: '근거: [ParameterizedTypeReference API 문서](link:ptr). 이 부분은 테스트로 확인하지 않았어요.'
    - p: '마지막으로, 컴파일러가 `unchecked` 경고를 내면 `@SuppressWarnings`로 끄기 전에 왜 났는지 먼저 봐요. 위의 `List.class` 대입이 바로 그 경고를 냈던 줄이에요.'
interview:
  question: 제네릭의 타입 소거를 설명해 주세요
  model:
    - label: 정의
      text: 제네릭은 컬렉션 같은 클래스가 다룰 타입을 꺾쇠로 적어, 잘못된 타입을 넣는 실수를 컴파일 오류로 잡아 주는 기능입니다. 타입 소거는 컴파일러가 검사를 마친 뒤 그 타입 인자를 지우고 꺼내는 자리에 형변환을 넣는 것입니다.
    - label: 원리
      text: 그래서 실행 중에 List<String>과 List<Long>은 같은 ArrayList이고, new T()나 instanceof List<String>, 타입 인자만 다른 오버로딩은 할 수 없습니다. 실행 중에 막을 수 없으니 List<Integer>를 List<Number>에 대입하는 것도 컴파일러가 막습니다. 대신 ? extends로 꺼내기만, ? super로 넣기만 하는 매개변수를 만듭니다.
    - label: 주의할 점
      text: 로 타입으로 검사를 비켜 간 값은 형변환이 보이지 않는 꺼내는 줄에서 ClassCastException을 냅니다. JSON을 List.class로 읽으면 원소가 LinkedHashMap이 되므로 TypeReference나 ParameterizedTypeReference로 원소 타입까지 넘깁니다.
    - label: 경험
      text: '(내 프로젝트로 채우기) 예: 외부 API의 목록 응답을 List.class로 읽었다가 원소를 꺼낼 때 ClassCastException이 나서 ParameterizedTypeReference로 고쳤습니다.'
verified: 이 레슨의 결과는 짐작이 아니라 자바 21에서 코드를 돌리고, 컴파일되는지는 테스트 안에서 javac를 돌려 확인한 값이에요. JSON은 Jackson으로 확인했어요. 코드가 바뀔 때마다 테스트([GenericsTest](link:test))가 다시 돌아요.
footer: '근거: 타입 소거는 자바 언어 명세 4.6([링크](link:jlsErasure)), 와일드카드는 4.5.1([링크](link:jlsWildcard)), 로 타입과 unchecked 경고는 4.8([링크](link:jlsRaw)), ParameterizedTypeReference는 스프링 프레임워크 API 문서. 결과는 OpenJDK 21에서 테스트로 확인했어요. 오류는 [GitHub 이슈](https://github.com/wanja727/dev-lessons/issues)로 알려 주세요.'
claims:
  - claim: '코드 predict의 출력은 true다'
    how: '그대로 돌린다'
    test: GenericsTest.predict
  - claim: '코드 raw는 꺼내는 줄에서 `ClassCastException`이 난다'
    how: '그대로 돌려 예외를 본다'
    test: GenericsTest.rawList
  - claim: '`List<String>`에 `Long`을 넣는 코드는 컴파일되지 않는다'
    how: '`JavaSource`로 컴파일한다'
    test: GenericsTest.typedListRejectsWrongType
  - claim: '코드 pollution에서 `raw.add(10L)`은 unchecked 경고만 내고 지나가고 `String first = names.get(0)`에서 `ClassCastException`이 난다'
    how: '줄마다 실행해 어느 줄에서 예외가 나는지 보고, `JavaSource`로 경고를 본다'
    test: GenericsTest.heapPollution
  - claim: '타입 인자만 다른 오버로딩, `new T()`, `instanceof List<String>`은 컴파일되지 않는다'
    how: '`JavaSource`로 각 소스를 컴파일한다'
    test: GenericsTest.erasureClash
  - claim: '`T extends Comparable<T>`인 메서드는 `List<String>`을 받고 `List<Object>`는 받지 않는다'
    how: '`JavaSource`로 두 호출을 컴파일한다'
    test: GenericsTest.boundedType
  - claim: '`List<Number> nums = ints`는 컴파일되지 않는다'
    how: '`JavaSource`로 컴파일한다'
    test: GenericsTest.invariance
  - claim: '`Number[] nums = new Integer[1]; nums[0] = 3.14;`는 `ArrayStoreException`을 던진다'
    how: '그대로 돌린다'
    test: GenericsTest.arrayStore
  - claim: '위젯의 여덟 줄이 적힌 대로 컴파일되거나 컴파일되지 않는다. `? super Long`에 `List<Number>`는 되고 `List<Integer>`는 안 된다'
    how: '`JavaSource`로 한 줄씩 컴파일한다'
    test: GenericsTest.wildcardLines
  - claim: 'Jackson으로 객체의 배열을 `List.class`로 읽으면 원소가 `LinkedHashMap`이고, `OrderDto`로 꺼내면 `ClassCastException`이 난다. `TypeReference<List<OrderDto>>`로 읽으면 원소가 `OrderDto`다 (스프링 부트 3.5의 Jackson)'
    how: '`ObjectMapper`로 두 방식으로 읽어 원소의 클래스를 보고, 첫 방식에서 꺼낼 때의 예외를 본다'
    test: GenericsTest.jacksonRawList
  - claim: '`ApiResponse<OrderDto>`가 `data` 안에 주문이 든 JSON으로 직렬화된다'
    how: '`ObjectMapper`로 써서 문자열을 본다'
    test: GenericsTest.apiResponse
sources:
  - '타입 소거: 자바 언어 명세 4.6 https://docs.oracle.com/javase/specs/jls/se21/html/jls-4.html#jls-4.6'
  - '제네릭 클래스와 타입 매개변수: 자바 언어 명세 8.1.2 https://docs.oracle.com/javase/specs/jls/se21/html/jls-8.html#jls-8.1.2'
  - '와일드카드와 타입 인자: 자바 언어 명세 4.5.1 https://docs.oracle.com/javase/specs/jls/se21/html/jls-4.html#jls-4.5.1'
  - '로 타입과 unchecked 경고: 자바 언어 명세 4.8 https://docs.oracle.com/javase/specs/jls/se21/html/jls-4.html#jls-4.8'
  - '배열의 저장 검사: 자바 언어 명세 10.5 https://docs.oracle.com/javase/specs/jls/se21/html/jls-10.html#jls-10.5'
  - '`Collections.copy`의 시그니처: API 문서 https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/Collections.html'
  - '`ParameterizedTypeReference`: 스프링 프레임워크 API 문서 https://docs.spring.io/spring-framework/docs/current/javadoc-api/org/springframework/core/ParameterizedTypeReference.html'
