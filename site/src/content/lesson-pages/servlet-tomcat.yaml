# 서블릿과 톰캣
# 자료 파일의 칸은 docs/lesson-data-format.md에 있다. 문제는 content/questions/servlet-tomcat.yaml에 있다.
title: 서블릿과 톰캣
description: 서블릿 컨테이너가 하는 일, 요청 하나를 맡는 스레드, 스레드가 모두 바쁠 때 새 요청이 기다리는 것, 서블릿 객체가 하나뿐이라는 것. 네 가지 질문에 스스로 답할 수 있게 내장 톰캣을 띄워 스레드 이름과 응답 시간을 재 보는 대화형 레슨.
unit: 스프링
minutes: 18
roadmap: S1
type: 동작 확인
prerequisites:
  - {slug: http-basics, title: HTTP 요청과 응답}
  - {slug: thread-pool, title: 스레드 풀}
assume: '자바 21, 스프링 부트 3.5(내장 톰캣 10.1). HTTP 요청이 메서드, 경로, 헤더, 본문으로 이루어진다는 것(HTTP 요청과 응답 레슨). 스레드 풀이 정해진 수의 스레드로 작업을 나눠 받고, 다 바쁘면 작업이 기다린다는 것(스레드 풀 레슨). 스프링 MVC는 몰라도 돼요.'
example: '주문 조회 API `GET /orders/{id}` 하나를 띄운 스프링 부트 앱. 요청마다 처리하는 스레드의 이름을 응답에 담아 보고, 톰캣의 스레드 수를 2로 줄여 느린 요청 세 개를 함께 보내 봐요.'
intro:
  - '외부 결제 API가 느려진 날, 결제와 상관없는 상품 조회까지 응답이 멈춰요. 서버의 CPU는 한가한데 요청이 줄을 서 있어요. 요청을 처리하는 스레드가 모두 결제 API의 응답을 기다리느라 묶여 있어서예요.'
  - '스프링 부트 앱은 안에 톰캣이라는 서블릿 컨테이너를 품고 있어요. 소켓을 열고, HTTP를 읽고, 요청마다 스레드를 하나 내주는 일은 톰캣이 하고, 스프링은 그 위에서 컨트롤러를 불러요. 컨트롤러 코드가 어느 스레드에서 도는지 알아야 스레드 수 설정, 타임아웃, `ThreadLocal`에 기대는 기능(트랜잭션, 로그인 정보)을 이해할 수 있어요.'
  - '이 레슨에서는 작은 앱을 띄워 요청마다 스레드 이름을 찍어 보고, 톰캣의 스레드 수를 줄였을 때 세 번째 요청이 기다리는 시간을 재요.'
covers:
  - topic: '서블릿은 요청을 받아 응답을 만드는 자바 객체의 규약(`HttpServlet`의 `service`)이다. 서블릿 컨테이너는 연결을 받고 HTTP를 읽어 `HttpServletRequest`와 `HttpServletResponse` 객체로 만들어 서블릿을 부른다'
    where: '질문 1'
  - topic: '톰캣은 서블릿 컨테이너이자 웹 서버다. 스프링 부트는 톰캣을 라이브러리로 넣어 `main`에서 띄운다(내장 톰캣). 따로 설치한 톰캣에 war를 올리는 방식과의 차이'
    where: '질문 1'
  - topic: '스프링 MVC는 서블릿 하나(`DispatcherServlet`)를 톰캣에 등록하고, 모든 요청을 그 서블릿이 받아 컨트롤러로 나눈다'
    where: '질문 1. 나누는 과정은 스프링 MVC 요청 흐름(S6)'
  - topic: '요청 하나는 톰캣 스레드 풀의 스레드 하나가 처음부터 응답까지 맡는다. 동시에 온 요청은 다른 스레드에서 돈다'
    where: '질문 2'
  - topic: '한 요청 안의 필터, 컨트롤러, 서비스는 같은 스레드에서 돈다. 그래서 스프링은 트랜잭션과 로그인 정보를 `ThreadLocal`에 둔다'
    where: '질문 2. 트랜잭션은 @Transactional 동작 원리(S10), 로그인 정보는 인증과 인가(S12)'
  - topic: '스레드가 모두 바쁘면 새 요청은 연결 큐에서 기다린다. 스레드 수는 `server.tomcat.threads.max`(기본 200)'
    where: '질문 3'
  - topic: '스레드를 오래 잡는 일(느린 외부 호출, 느린 쿼리)이 쌓이면 상관없는 요청까지 기다린다. 타임아웃을 둔다'
    where: '질문 3과 실무에서는'
  - topic: '`accept-count`, `max-connections`, `connection-timeout`이 각각 무엇인지'
    where: '실무에서는'
  - topic: '서블릿 객체는 하나만 만들어 모든 요청 스레드가 함께 쓴다. `init`은 한 번, `service`는 요청마다, `destroy`는 종료할 때 한 번'
    where: '질문 4'
  - topic: '서블릿과 컨트롤러는 여러 스레드가 함께 쓰므로 필드에 요청마다 다른 값을 두면 섞인다'
    where: '질문 4. 싱글톤 빈의 상태는 빈의 생명주기와 스코프(S3)'
  - topic: '스레드 풀 크기와 DB 커넥션 풀 크기를 함께 정하는 법'
    where: '다루지 않음: 스레드 풀과 커넥션 풀 크기(심화)'
  - topic: '요청마다 스레드를 쓰지 않는 방식(논블로킹, 웹플럭스)과 가상 스레드'
    where: '다루지 않음: 웹플럭스(S16), 가상 스레드(C12). 실무에서는에 `spring.threads.virtual.enabled`를 한 줄 소개한다'
links:
  test: https://github.com/wanja727/dev-lessons/blob/main/verification/src/test/java/lab/devlessons/servlettomcat/ServletTomcatTest.java
  servletSpec: https://jakarta.ee/specifications/servlet/6.0/jakarta-servlet-spec-6.0
  bootProps: https://docs.spring.io/spring-boot/appendix/application-properties/index.html
  dispatcher: https://docs.spring.io/spring-framework/reference/web/webmvc/mvc-servlet.html
  virtual: https://docs.spring.io/spring-boot/reference/features/spring-application.html#features.spring-application.virtual-threads
codes:
  predict: |-
    @GetMapping("/orders/{id}")
    String order(@PathVariable long id)
        throws InterruptedException {
      Thread.sleep(1000);
      return "order " + id;
    }
    // server.tomcat.threads.max=2
    // 요청 3개를 동시에 보낸다
  thread: |-
    @GetMapping("/orders/{id}")
    String order(@PathVariable long id) {
      return "order " + id + " on "
          + [[Thread.currentThread().getName()]];
    }
  servlet: |-
    public class HelloServlet
        extends [[HttpServlet]] {
      @Override
      protected void doGet(
          HttpServletRequest req,
          HttpServletResponse res)
          throws IOException {
        res.getWriter().write("hello");
      }
    }
  counting: |-
    public class CountingServlet
        extends HttpServlet {
      @Override
      public void [[init]]() {
        inits++;
      }

      @Override
      protected void [[doGet]](...) {
        services++;
        res.getWriter().write("hello");
      }
    }
  stateful: |-
    public class GreetingServlet
        extends HttpServlet {
      [[private String currentUser;]]

      protected void doGet(...) {
        currentUser =
            req.getParameter("user");
        audit();
        res.getWriter().write(
            "안녕하세요 " + currentUser);
      }
    }
  yml: |-
    server:
      tomcat:
        threads:
          max: 200
          min-spare: 10
        max-connections: 8192
        accept-count: 100
        connection-timeout: 20s
  noTimeout: |-
    RestClient client = RestClient
        .create("https://pg.example.com");

    client.post().uri("/approve")
        .body(request)
        .retrieve()
        .body(Approval.class);
  timeout: |-
    var http = HttpClient.newBuilder()
        .connectTimeout(
            Duration.ofSeconds(1))
        .build();
    var factory =
        new JdkClientHttpRequestFactory(http);
    [[factory.setReadTimeout(]]
        [[Duration.ofSeconds(2));]]

    RestClient client = RestClient.builder()
        .baseUrl("https://pg.example.com")
        .requestFactory(factory)
        .build();
predict:
  title: 셋째 요청은 언제 응답할까요?
  text: '1초 걸리는 컨트롤러를 두고, 톰캣의 스레드를 2개로 줄인 뒤 요청 3개를 동시에 보내요. 세 번째 요청의 응답은 보낸 지 얼마 뒤에 올까요? 답은 질문 3에 나와요.'
  code: predict
  label: 내 예측
  options:
    - {value: a, label: '약 1초. 셋 다 함께 처리된다'}
    - {value: b, label: '약 2초. 앞의 하나가 끝나길 기다린다'}
    - {value: c, label: '약 3초. 하나씩 차례로 처리된다'}
    - {value: d, label: '오지 않는다. 스레드가 없어 에러가 난다'}
  answer: b
  storageKey: st-predict
  wrong: 예측은 "{label}"이었어요. 틀린 예측이 더 오래 남으니 괜찮아요.
questions:
  - id: q1
    title: 서블릿 컨테이너는 무슨 일을 하나요?
    conclusion:
      lead: '연결을 받고 HTTP를 읽어 요청 객체와 응답 객체로 만든 뒤, 그 요청을 맡을 서블릿을 불러요.'
      sub: '개발자는 소켓과 HTTP 해석을 쓰지 않고 요청을 처리하는 코드만 써요. 스프링 부트는 톰캣을 안에 넣어 띄우고, 스프링 MVC는 `DispatcherServlet` 하나로 모든 요청을 받아요.'
    says:
      - '서블릿은 `HttpServlet`을 상속해 `doGet`, `doPost`를 쓰는 자바 객체다(코드 servlet). 요청이 오면 컨테이너가 `service`를 부르고, `service`가 메서드에 따라 `doGet` 등을 부른다'
      - '서블릿 컨테이너가 하는 일을 순서로 적는다: 포트를 열고 연결을 받는다, 바이트를 읽어 HTTP 요청으로 해석한다, `HttpServletRequest`와 `HttpServletResponse`를 만든다, 경로에 맞는 서블릿을 찾아 부른다, 응답 객체에 쓴 것을 HTTP 응답으로 보낸다'
      - '톰캣이 대표적인 서블릿 컨테이너다. 예전에는 톰캣을 따로 설치하고 war 파일을 올렸다. 스프링 부트는 톰캣을 라이브러리로 넣고 `main`에서 띄운다. 그래서 jar 하나로 실행된다'
      - '스프링 MVC는 서블릿을 하나만 등록한다. `DispatcherServlet`이 `/` 아래 모든 요청을 받아 알맞은 컨트롤러 메서드로 넘긴다. 앱을 띄우고 톰캣에 등록된 서블릿 목록을 출력해 `dispatcherServlet` 하나가 `/`에 걸려 있는 것을 보인다'
      - '컨트롤러는 서블릿이 아니다. `DispatcherServlet`이 부르는 보통 객체다. 나누는 과정은 S6에서 본다'
    asks:
      - '본문의 예시: 스프링 부트 앱에서 `GET /orders/7`과 `POST /members`는 각각 어느 서블릿이 받나 (둘 다 `DispatcherServlet`. 스프링 MVC는 서블릿 하나로 모든 요청을 받는다)'
      - '옮긴 상황: 다음 일 가운데 서블릿 컨테이너(톰캣)가 하는 일이 아닌 것은? 연결 받기, HTTP 헤더 읽기, 요청 객체 만들기, 경로에 맞는 컨트롤러 메서드 고르기 (컨트롤러 메서드를 고르는 것은 스프링의 `DispatcherServlet`이다)'
    body:
      - p: '브라우저가 보낸 것은 TCP 연결 위의 바이트예요. 그 바이트를 받아 "GET 요청이고 경로는 `/orders/7`"이라는 자바 객체로 바꿔 주는 프로그램이 **서블릿 컨테이너**예요. 컨테이너가 부르는 자바 객체를 **서블릿**이라고 해요.'
      - h3: 서블릿은 요청 하나를 받아 응답을 쓰는 객체예요
      - code: servlet
        notes:
          - mark: HttpServlet
            as: code
            text: '자바 웹의 표준(Jakarta Servlet)이 정한 클래스예요. 이것을 상속해 `doGet`, `doPost`를 오버라이딩하면 서블릿이 돼요.'
      - p: '요청이 오면 컨테이너가 서블릿의 `service` 메서드를 부르고, `service`가 HTTP 메서드를 보고 `doGet`이나 `doPost`를 불러요. 서블릿은 받은 요청 객체에서 값을 읽고, 응답 객체에 본문을 써요. 그게 전부예요.'
      - h3: 그 앞뒤의 일은 컨테이너가 해요
      - ol:
          - '포트(8080)를 열고 연결을 받아요.'
          - '들어온 바이트를 읽어 HTTP 요청으로 해석해요.'
          - '`HttpServletRequest`와 `HttpServletResponse` 객체를 만들어요.'
          - '요청 처리 스레드 하나에 이 요청을 맡기고, 경로에 맞는 서블릿을 불러요.'
          - '서블릿이 응답 객체에 쓴 것을 HTTP 응답 바이트로 보내요.'
      - p: '개발자가 쓰는 것은 4번의 "서블릿 안"뿐이에요. 나머지는 모든 웹 앱이 똑같이 해야 하는 일이라 컨테이너가 맡아요.'
      - h3: 톰캣은 스프링 부트 안에 들어 있어요
      - p: '**톰캣**이 가장 많이 쓰는 서블릿 컨테이너예요. 예전에는 서버에 톰캣을 따로 설치하고 앱을 war 파일로 만들어 올렸어요. 스프링 부트는 톰캣을 라이브러리로 넣고 `main` 메서드에서 띄워요. 이것을 **내장 톰캣**이라고 해요. 그래서 스프링 부트 앱은 `java -jar app.jar` 한 줄로 웹 서버까지 떠요.'
      - h3: 스프링 MVC의 서블릿은 하나예요
      - p: '스프링 부트 웹 앱을 띄우고 톰캣에 등록된 서블릿을 모두 출력해 봤어요. 컨트롤러가 여러 개여도 결과는 같아요.'
      - ci:
          key: servlets
          label: 등록된 서블릿 목록 보기
          source: ServletTomcatTest.dispatcherServletIsTheOnlyServlet
      - p: '서블릿은 `dispatcherServlet` 하나이고 `/`, 즉 모든 경로에 걸려 있어요. 이 서블릿이 모든 요청을 받아서 어느 컨트롤러 메서드를 부를지 정해요. 컨트롤러는 서블릿이 아니라 `DispatcherServlet`이 부르는 보통 객체예요. 고르는 과정은 [스프링 MVC 요청 흐름](lesson:spring-mvc-flow) 레슨에서 봐요.'
      - quiz:
          q: '스프링 부트 앱에서 다음 가운데 톰캣이 아니라 스프링이 하는 일은?'
          options:
            - 포트를 열고 연결 받기
            - HTTP 요청을 읽어 요청 객체 만들기
            - '경로에 맞는 컨트롤러 메서드 고르기'
          answer: 3
          explain: '톰캣은 요청을 `DispatcherServlet`에 넘길 뿐이에요. 어느 컨트롤러 메서드를 부를지는 스프링의 `DispatcherServlet`이 정해요.'
      - next: '톰캣은 요청을 스레드 하나에 맡긴다고 했어요. 그 스레드는 어떤 스레드이고, 요청 안에서 어디까지 따라갈까요?'
    recall: '서블릿 컨테이너는 포트를 열어 연결을 받고, HTTP를 읽어 요청 객체와 응답 객체를 만들고, 스레드에 맡겨 경로에 맞는 서블릿을 부르고, 응답 객체에 쓴 것을 보내요. 톰캣이 대표적이고 스프링 부트는 톰캣을 내장해 jar 하나로 띄워요. 스프링 MVC는 DispatcherServlet 하나를 모든 경로에 등록하고, 그 서블릿이 컨트롤러를 골라 불러요.'
  - id: q2
    title: 요청 하나는 어느 스레드에서 처리되나요?
    conclusion:
      lead: '톰캣 스레드 풀의 스레드 하나가 요청 하나를 받아 응답을 보낼 때까지 맡아요.'
      sub: '동시에 온 요청은 서로 다른 스레드에서 돌고, 한 요청 안의 필터와 컨트롤러와 서비스는 모두 같은 스레드에서 돌아요.'
    says:
      - '코드 thread로 요청마다 스레드 이름을 응답에 담는다. 이름은 `http-nio-포트-exec-번호` 꼴이다. `exec`는 톰캣의 요청 처리 스레드 풀이다. 실제 출력을 보인다'
      - '요청 두 개를 동시에 보내면 다른 스레드 이름이 나온다. 순서대로 여러 번 보내면 같은 스레드가 다시 쓰이기도 한다. 스레드를 요청마다 만들지 않고 풀에서 빌려 쓰고 돌려주기 때문이다(C7)'
      - '필터, 컨트롤러, 서비스에서 각각 스레드 이름을 찍으면 모두 같다. 요청 하나가 스레드 하나를 처음부터 끝까지 쓴다'
      - '그래서 스프링은 요청에 딸린 정보를 `ThreadLocal`(스레드마다 따로 가지는 변수)에 둔다. 트랜잭션의 커넥션(S10)과 로그인한 사용자(S12)가 그렇다. 다른 스레드로 넘어가면 이 값이 따라가지 않는다'
    asks:
      - '본문의 예시: 사용자 둘이 같은 순간에 `GET /orders/1`과 `GET /orders/2`를 보낸다. 두 요청의 컨트롤러는 같은 스레드에서 차례로 도나, 다른 스레드에서 함께 도나 (다른 스레드에서 함께 돈다)'
      - '옮긴 상황: 필터에서 `ThreadLocal`에 요청 id를 넣었다. 같은 요청의 서비스 메서드에서 그 값을 읽을 수 있나. 서비스가 그 일을 새 스레드에 맡기면 새 스레드에서도 읽을 수 있나 (같은 스레드라 읽힌다. 새 스레드에서는 읽히지 않는다)'
    body:
      - p: '컨트롤러가 자기를 실행하는 스레드의 이름을 응답에 담게 했어요.'
      - code: thread
        notes:
          - mark: Thread.currentThread().getName()
            as: code
            text: '지금 이 코드를 실행하고 있는 스레드의 이름이에요.'
      - ci:
          key: thread
          label: 실제 응답 보기
          source: ServletTomcatTest.controllerRunsOnTomcatThread
      - p: '`http-nio-8080-exec-1`은 톰캣이 만든 이름이에요. `nio`는 톰캣이 연결을 다루는 방식, `8080`은 포트, `exec`는 **요청을 처리하는 스레드 풀**, 마지막 숫자는 그 풀 안의 스레드 번호예요. 컨트롤러는 이 풀의 스레드 위에서 돌아요. (테스트는 빈 포트를 골라 띄워서 실제 이름은 포트 자리가 다르게 나와요. 보기 쉽게 8080으로 바꿨어요.)'
      - h3: 동시에 온 요청은 다른 스레드예요
      - p: '두 요청이 컨트롤러 안에서 서로를 기다리게 만들어, 둘이 정말 동시에 처리 중일 때 스레드 이름을 받았어요.'
      - ci:
          key: concurrent
          label: 실제 응답 보기
          source: ServletTomcatTest.concurrentRequestsUseDifferentThreads
      - p: '스레드는 요청마다 새로 만들지 않아요. 풀에 미리 만들어 둔 스레드를 빌려 쓰고, 응답을 보내면 풀에 돌려줘요. 그래서 요청을 차례로 여러 번 보내면 같은 이름이 다시 나오기도 해요. [스레드 풀](lesson:thread-pool) 레슨에서 본 그 구조예요.'
      - h3: 한 요청 안에서는 끝까지 같은 스레드예요
      - p: '요청이 컨트롤러에 닿기 전에 지나는 **필터**(요청 앞뒤에 끼는 코드, [필터와 인터셉터](lesson:filter-interceptor) 레슨)에서 스레드 이름을 적어 두고, 컨트롤러에서 다시 읽었어요.'
      - ci:
          key: same-thread
          label: 실제 응답 보기
          source: ServletTomcatTest.filterAndControllerShareThread
      - p: '같아요. 필터, 컨트롤러, 컨트롤러가 부르는 서비스와 리포지토리까지 **요청 하나를 스레드 하나가 처음부터 끝까지** 처리해요.'
      - p: '이 성질 덕분에 스프링은 요청에 딸린 정보를 `ThreadLocal`에 둬요. `ThreadLocal`은 스레드마다 따로 값을 가지는 변수예요. 트랜잭션이 쓰는 DB 커넥션([@Transactional 동작 원리](lesson:transactional-proxy))과 로그인한 사용자([인증과 인가](lesson:spring-security))가 그렇게 요청을 따라다녀요. 반대로 일을 **다른 스레드에 넘기면** 이 값들이 따라가지 않아요.'
      - quiz:
          q: '필터에서 `ThreadLocal`에 요청 id를 넣었어요. 같은 요청의 서비스가 이 값을 읽으면?'
          options:
            - 읽힌다. 같은 스레드다
            - null이다. 서비스는 다른 스레드다
            - 다른 요청의 id가 나온다
          answer: 1
          explain: '요청 하나는 필터부터 서비스까지 같은 스레드에서 돌아요. 그래서 그 스레드의 `ThreadLocal` 값이 그대로 보여요.'
      - next: '요청마다 스레드가 하나씩 필요해요. 그런데 스레드 풀의 스레드가 모두 일하는 중이면 새 요청은 어떻게 될까요?'
    recall: '톰캣 스레드 풀(http-nio-포트-exec-번호)의 스레드 하나가 요청 하나를 받아 응답을 보낼 때까지 맡아요. 동시에 온 요청은 다른 스레드에서 돌고, 스레드는 풀에서 빌려 쓰고 돌려줘요. 한 요청의 필터, 컨트롤러, 서비스는 같은 스레드라서 스프링은 트랜잭션과 로그인 정보를 ThreadLocal에 둬요. 다른 스레드로 넘기면 그 값은 따라가지 않아요.'
  - id: q3
    title: 스레드가 모두 바쁘면 새 요청은 어떻게 되나요?
    conclusion:
      lead: '바로 실패하지 않고, 스레드 하나가 풀릴 때까지 기다려요.'
      sub: '그래서 느린 일로 스레드가 모두 묶이면 빨리 끝날 요청도 함께 느려져요. 스레드 수의 기본값은 200이에요.'
    says:
      - '`server.tomcat.threads.max`가 요청 처리 스레드의 최대 수다. 기본 200이다'
      - '코드 predict를 돌린다. 스레드 2개, 1초 걸리는 요청 3개를 동시에 보내면 셋째는 앞의 하나가 끝난 뒤에 컨트롤러에 들어가 약 2초에 응답한다. 예측의 답을 밝힌다. 실제 걸린 시간을 실제 출력으로 보인다'
      - '기다리는 동안 셋째 요청은 에러가 나지 않는다. 연결은 이미 받아 두었고(`max-connections`) 처리할 스레드가 없어 기다릴 뿐이다. 연결 수까지 넘치면 운영체제의 대기열(`accept-count`)에서 기다리고, 그것도 넘치면 연결이 거절된다'
      - '도입부의 장면으로 돌아간다. 결제 API 호출이 10초씩 걸리면 그 요청들이 스레드를 10초씩 잡는다. 스레드가 모두 잡히면 상품 조회도 줄을 선다. CPU는 놀고 있다. 스레드가 기다리기만 해도 스레드는 쓰이고 있는 것이다'
    widget:
      kind: steps
      note: '스레드 두 칸과 대기 줄을 그린다. 요청 A, B, C가 차례로 들어온다. A와 B가 스레드를 잡고 C는 줄에 선다. 1초 뒤 A가 끝나 스레드가 풀리고 C가 그 스레드를 잡는다. 2초에 C가 끝난다. 단계마다 시각과 각 요청의 상태를 보인다'
    asks:
      - '본문의 예시: 스레드 2개, 1초 걸리는 요청 4개를 동시에 보내면 마지막 요청은 약 몇 초에 응답하나 (약 2초. 두 개씩 두 번에 처리된다)'
      - '옮긴 상황: 스레드 200개인 서버에서 외부 API가 갑자기 30초씩 걸린다. 그 API를 부르는 요청이 초당 10개 들어온다. 외부 API를 부르지 않는 요청은 언제부터 기다리게 되나 (약 20초 뒤. 200개 스레드가 모두 외부 호출에 묶인다)'
      - '실무 구역: 외부 API 클라이언트에 읽기 타임아웃 2초를 주면 스레드 하나가 그 호출에 묶이는 시간은 길어야 얼마인가 (약 2초)'
    body:
      - p: '요청을 처리하는 스레드의 최대 수는 `server.tomcat.threads.max`예요. 기본값은 **200**이에요. 예측에서는 이 값을 2로 줄였어요. 먼저 한 단계씩 따라가 보세요.'
      - widget:
          kind: steps
          layout: [log, buttons, verdict]
          initial: {}
          scenarios:
            default:
              - log: '0.0초  요청 A, B, C가 함께 도착'
              - log: '0.0초  A → 스레드 1, B → 스레드 2. 둘 다 1초 쉬기 시작'
              - log: '0.0초  C: 빈 스레드가 없어 기다림 (연결은 받아 둔 상태)'
              - log: '1.0초  A 끝. 스레드 1을 풀에 돌려줌'
              - log: '1.0초  C → 스레드 1. 1초 쉬기 시작'
              - log: '1.0초  B 끝. 스레드 2를 돌려줌'
              - log: '2.0초  C 끝. 셋 다 200 응답'
                verdict: '셋째 요청은 에러 없이, 스레드 하나가 풀릴 때까지 기다렸다가 처리돼요.'
      - p: '답은 **약 2초**예요. {{predict-result}} 실제로 띄워서 잰 값이에요. 각 요청이 컨트롤러에 들어간 시각과 응답을 받은 시각을 함께 남겼어요.'
      - ci:
          key: pool-full
          label: 실제 측정 보기
          source: ServletTomcatTest.thirdRequestWaitsForThread
          code: predict
      - p: '첫째와 둘째는 0초에 컨트롤러에 들어갔지만, 셋째는 약 1초가 지나서야 들어갔어요. 앞의 요청 하나가 끝나 스레드를 돌려줄 때까지 기다린 거예요. 응답 시각이 1초, 2초보다 조금 늦은 것은 연결을 맺고 응답을 주고받는 시간이 더해져서예요.'
      - h3: 기다리는 동안 에러가 나지 않는 이유
      - p: '셋째 요청의 연결은 톰캣이 이미 받아 두었어요. 처리할 스레드가 없어서 기다릴 뿐이에요. 받아 둘 수 있는 연결 수(`max-connections`, 기본 8192)까지 넘치면 운영체제의 대기열(`accept-count`, 기본 100)에서 기다리고, 그것마저 넘치면 그때 연결이 거절돼요.'
      - h3: 도입부의 장면
      - p: '결제 API가 10초씩 걸리면 결제 요청은 스레드를 10초씩 잡아요. 스레드는 응답을 **기다리기만 해도** 쓰이고 있는 거예요. 결제 요청이 많아 200개가 모두 잡히면, 1밀리초면 끝날 상품 조회도 줄을 서요. CPU는 놀고 있는데 서버는 느려요. 그래서 스레드를 오래 잡을 수 있는 일에는 꼭 **타임아웃**을 둬요. 실무 구역에서 코드로 봐요.'
      - quiz:
          q: '스레드 2개인 톰캣에 1초 걸리는 요청 4개를 동시에 보내면 마지막 요청은 약 몇 초에 응답할까요?'
          options:
            - 약 1초
            - 약 2초
            - 약 4초
          answer: 2
          explain: '두 개가 먼저 1초 동안 처리되고, 나머지 두 개가 풀린 스레드 둘에서 다음 1초 동안 처리돼요.'
      - next: '스레드는 여럿이에요. 그런데 그 스레드들이 부르는 서블릿 객체는 몇 개일까요?'
    recall: '스레드가 모두 바쁘면 새 요청은 에러 없이 스레드 하나가 풀릴 때까지 기다려요. 연결은 max-connections까지 받아 두고, 넘치면 accept-count 대기열에서, 그것도 넘치면 거절돼요. 스레드 수는 server.tomcat.threads.max이고 기본 200이에요. 그래서 느린 외부 호출이 스레드를 모두 잡으면 상관없는 요청까지 느려지고, 타임아웃으로 막아요.'
  - id: q4
    title: 서블릿 객체는 요청마다 새로 만들어지나요?
    conclusion:
      lead: '아니요. 서블릿은 하나만 만들어지고, 요청을 처리하는 모든 스레드가 그 객체 하나를 함께 불러요.'
      sub: '`init`은 처음 한 번, `service`는 요청마다, `destroy`는 끝날 때 한 번 불려요. 그래서 서블릿의 필드에 요청마다 다른 값을 두면 다른 요청과 섞여요.'
    says:
      - '서블릿의 생명주기: 컨테이너가 처음 쓸 때(또는 시작할 때) 객체를 하나 만들고 `init`을 한 번 부른다. 요청마다 `service`를 부른다. 종료할 때 `destroy`를 한 번 부른다'
      - '`init`과 `service`가 불린 횟수를 세는 서블릿을 등록하고 요청 5개를 보낸다. `init` 1번, `service` 5번, 객체는 하나다. 실제 출력을 보인다'
      - '요청 여러 개를 동시에 보내면 같은 객체의 `service`가 여러 스레드에서 동시에 불린다. 그래서 서블릿 필드에 "지금 요청의 사용자" 같은 값을 넣으면 다른 요청이 덮어쓴다. 지역 변수는 스레드마다 따로라 안전하다'
      - '`DispatcherServlet`도 하나이고, 스프링이 만드는 컨트롤러와 서비스 객체도 기본으로 하나다. 같은 문제가 그대로 생긴다. 스프링 빈에서 다시 보는 것은 S3이다'
    asks:
      - '본문의 예시: 서블릿에 요청 100개가 왔다. `init`과 `service`는 각각 몇 번 불렸나 (`init` 1번, `service` 100번)'
      - '옮긴 상황: 서블릿에 `private String currentUser` 필드를 두고 `service`의 첫 줄에서 요청의 사용자를 넣고, 마지막 줄에서 그 값으로 응답을 쓴다. 두 사용자가 동시에 요청하면 무엇이 생길 수 있나 (한 사용자가 다른 사용자의 이름으로 응답을 받을 수 있다)'
    body:
      - p: '서블릿에도 **생명주기**가 있어요. 컨테이너가 서블릿을 처음 쓸 때 객체를 하나 만들고 `init`을 한 번 불러요. 그 뒤로는 요청마다 `service`를 불러요. 앱이 끝날 때 `destroy`를 한 번 불러요.'
      - p: '`init`과 `doGet`이 불린 횟수를 세는 서블릿을 톰캣에 등록하고 요청 5개를 보냈어요.'
      - code: counting
        notes:
          - mark: init
            as: code
            text: '객체를 만든 뒤 한 번 불려요.'
          - mark: doGet
            as: code
            text: '요청마다 불려요. `service`가 GET 요청이면 이 메서드를 불러요.'
      - ci:
          key: lifecycle
          label: 실제 결과 보기
          source: ServletTomcatTest.servletIsSingleInstance
      - p: '객체는 하나예요. 질문 2에서 요청마다 스레드가 다르다고 했죠. 그러니 **여러 스레드가 같은 서블릿 객체의 `service`를 동시에** 불러요.'
      - h3: 필드에 요청의 값을 두면 섞여요
      - code: stateful
        notes:
          - mark: 'private String currentUser;'
            as: code
            text: '객체가 하나라서 이 필드도 하나예요. 모든 요청 스레드가 함께 써요.'
      - p: 'kim의 요청이 `currentUser`에 kim을 넣고 `audit()`을 하는 사이에, lee의 요청이 같은 필드에 lee를 넣을 수 있어요. 그러면 kim은 "안녕하세요 lee"를 받아요. 혼자 눌러 볼 때는 절대 안 나타나고, 사용자가 몰릴 때만 가끔 나타나는 버그예요.'
      - p: '`currentUser`를 메서드 안의 **지역 변수**로 바꾸면 사라져요. 지역 변수는 스레드마다 따로 생겨요.'
      - p: '스프링도 같아요. `DispatcherServlet`이 하나이고, 스프링이 만드는 컨트롤러와 서비스 객체도 기본으로 하나예요. 이 객체들의 필드에 요청마다 바뀌는 값을 두면 똑같이 섞여요. [빈의 생명주기와 스코프](lesson:bean-lifecycle-scope) 레슨에서 실제로 섞이는 것을 봐요.'
      - quiz:
          q: '서블릿에 요청 100개가 왔어요. `init`과 `service`는 각각 몇 번 불렸을까요?'
          options:
            - '`init` 100번, `service` 100번'
            - '`init` 1번, `service` 100번'
            - '`init` 1번, `service` 1번'
          answer: 2
          explain: '서블릿 객체는 하나라서 `init`은 처음 한 번이에요. `service`는 요청마다 불려요.'
    recall: '서블릿은 하나만 만들어져요. 컨테이너가 처음 쓸 때 만들어 init을 한 번 부르고, 요청마다 service를 부르고, 끝날 때 destroy를 한 번 불러요. 여러 요청 스레드가 같은 객체의 service를 동시에 부르므로 필드에 요청마다 다른 값을 두면 다른 요청이 덮어써요. 지역 변수는 스레드마다 따로라 안전해요. 스프링의 DispatcherServlet과 컨트롤러, 서비스도 기본으로 하나라서 같아요.'
practice:
  title: 스프링 부트에서는 이렇게 다뤄요
  says:
    - '스레드와 연결 설정은 `application.yml`의 `server.tomcat` 아래에 둔다(코드 yml). 각 칸이 무엇인지 한 줄씩: `threads.max`(요청 처리 스레드 최대 수), `threads.min-spare`(늘 살려 두는 수), `max-connections`(받아 두는 연결 수), `accept-count`(그것도 넘칠 때 운영체제 대기열), `connection-timeout`(연결 뒤 요청을 기다리는 시간). 근거는 스프링 부트 공식 문서의 서버 설정 목록이다'
    - '흔한 실수: 외부 API를 타임아웃 없이 부른다. 자바의 `HttpClient`와 스프링의 `RestClient`는 따로 정하지 않으면 응답을 오래(읽기는 끝없이) 기다린다. 상대가 느려지면 톰캣 스레드가 모두 묶인다. 고친 코드: `RestClient`에 연결 타임아웃과 읽기 타임아웃을 준다. 느린 서버를 흉내 내 타임아웃이 난 시간을 테스트로 남긴다'
    - '스레드를 늘리면 해결될까. 스레드는 늘어날수록 메모리를 쓰고 DB 커넥션을 놓고 다툰다. 크기를 정하는 법은 심화 레슨(스레드 풀과 커넥션 풀 크기)이 맡는다고 적는다'
    - '스프링 부트 3.2부터 `spring.threads.virtual.enabled=true`로 톰캣이 요청마다 가상 스레드를 쓰게 할 수 있다고 한 줄 적고 C12로 넘긴다. 공식 문서 근거'
  body:
    - h3: 톰캣 설정은 server.tomcat 아래에 둬요
    - code: yml
    - table:
        head: [설정, 뜻, 기본값]
        rows:
          - ['`threads.max`', '요청을 처리하는 스레드의 최대 수', '200']
          - ['`threads.min-spare`', '요청이 없어도 살려 두는 스레드 수', '10']
          - ['`max-connections`', '톰캣이 받아 두는 연결 수', '8192']
          - ['`accept-count`', '그것도 넘칠 때 운영체제가 줄 세우는 연결 수', '100']
          - ['`connection-timeout`', '연결을 맺은 뒤 요청을 기다리는 시간', '20초(톰캣 기본)']
    - muted: '근거: [스프링 부트의 설정 목록](link:bootProps). 값은 스프링 부트 3.5의 문서에서 옮겼어요.'
    - h3: '흔한 실수: 외부 API를 타임아웃 없이 부름'
    - code: noTimeout
    - p: '`RestClient.create`로 만든 클라이언트는 따로 정하지 않으면 응답을 오래 기다려요. 결제 서버가 멈추면 이 코드를 부른 톰캣 스레드도 함께 멈춰요. 질문 3에서 본 대로 결국 모든 요청이 줄을 서요.'
    - code: timeout
      notes:
        - mark: 'factory.setReadTimeout('
          as: code
          text: '응답이 이 시간 안에 오지 않으면 예외를 던지고 스레드를 놓아줘요. 연결을 맺는 시간은 `connectTimeout`으로 따로 정해요.'
    - p: '읽기 타임아웃을 1초로 주고, 3초 걸리는 서버를 불러 봤어요.'
    - ci:
        key: timeout
        label: 실제 측정 보기
        source: ServletTomcatTest.readTimeoutReleasesThread
    - p: '3초를 다 기다리지 않고 약 1초에 `ResourceAccessException`이 났어요. 스레드가 묶이는 시간이 타임아웃으로 정해져요. 예외가 났을 때 사용자에게 무엇을 돌려줄지는 [예외 처리와 검증](lesson:exception-validation) 레슨에서 다뤄요.'
    - h3: 스레드를 늘리면 되지 않나요
    - p: '스레드 하나는 스택 메모리를 쓰고, 많은 스레드가 같은 DB 커넥션 풀을 놓고 다퉈요. 무작정 늘리면 다른 곳이 막혀요. 스레드 수와 커넥션 풀 크기를 함께 정하는 법은 심화 레슨에서 다뤄요.'
    - muted: '스프링 부트 3.2부터는 `spring.threads.virtual.enabled=true`로 톰캣이 요청마다 가상 스레드를 쓰게 할 수 있어요. 기다리는 동안 운영체제 스레드를 놓아주는 가벼운 스레드예요. 근거: [스프링 부트 문서](link:virtual). 원리는 가상 스레드 레슨에서 다뤄요.'
interview:
  question: 스프링 부트 앱에서 요청 하나가 처리되는 동안 톰캣은 무엇을 하나요?
  model:
    - label: 정의
      text: 톰캣은 서블릿 컨테이너입니다. 연결을 받고 HTTP를 읽어 요청 객체와 응답 객체를 만들고, 스레드에 맡겨 서블릿을 부릅니다. 스프링 부트는 톰캣을 내장하고, 스프링 MVC는 DispatcherServlet 하나를 모든 경로에 등록합니다.
    - label: 원리
      text: 요청 하나는 톰캣 스레드 풀의 스레드 하나가 응답까지 맡습니다. 그래서 필터, 컨트롤러, 서비스가 같은 스레드에서 돌고, 스프링은 트랜잭션과 로그인 정보를 ThreadLocal에 둡니다. 서블릿과 스프링 빈은 하나만 만들어져 여러 스레드가 함께 씁니다.
    - label: 주의할 점
      text: 스레드가 모두 바쁘면 새 요청은 기다립니다. 기본 최대 200개라서 느린 외부 호출이 스레드를 잡으면 상관없는 요청까지 느려집니다. 외부 호출에는 타임아웃을 두고, 서블릿이나 빈의 필드에 요청마다 다른 값을 두지 않습니다.
    - label: 경험
      text: '(내 프로젝트로 채우기) 예: 외부 API에 읽기 타임아웃이 없어 장애가 번진 것을 RestClient에 타임아웃을 주어 막았습니다.'
verified: 이 레슨의 스레드 이름과 시간은 짐작이 아니라 스프링 부트 3.5의 내장 톰캣을 띄워 잰 값이에요. 코드가 바뀔 때마다 테스트([ServletTomcatTest](link:test))가 다시 돌아요.
footer: '근거: 서블릿의 생명주기는 Jakarta Servlet 6.0 명세([링크](link:servletSpec)), `DispatcherServlet`은 스프링 프레임워크 문서([링크](link:dispatcher)), 톰캣 설정과 기본값은 스프링 부트 설정 목록([링크](link:bootProps)). 결과는 OpenJDK 21에서 테스트로 확인했어요. 오류는 [GitHub 이슈](https://github.com/wanja727/dev-lessons/issues)로 알려 주세요.'
claims:
  - claim: '스프링 부트 앱의 컨트롤러는 `http-nio-포트-exec-번호` 이름의 스레드에서 돈다'
    how: '`MiniWeb`처럼 작은 앱을 띄우고 코드 thread의 응답을 읽는다'
    test: ServletTomcatTest.controllerRunsOnTomcatThread
  - claim: '동시에 보낸 요청 두 개는 서로 다른 스레드에서 처리된다'
    how: '두 요청이 컨트롤러 안에서 서로를 기다리게(`CountDownLatch`) 만들어 동시에 처리 중인 것을 보장하고, 응답의 스레드 이름이 다른지 본다'
    test: ServletTomcatTest.concurrentRequestsUseDifferentThreads
  - claim: '한 요청의 필터와 컨트롤러는 같은 스레드에서 돈다'
    how: '필터에서 스레드 이름을 요청 속성에 넣고 컨트롤러에서 비교한다'
    test: ServletTomcatTest.filterAndControllerShareThread
  - claim: '`server.tomcat.threads.max=2`에서 1초 걸리는 요청 3개를 동시에 보내면 셋째는 앞의 하나가 끝난 뒤(약 1초 뒤) 컨트롤러에 들어가고 에러가 나지 않는다'
    how: '컨트롤러에 들어간 시각을 응답에 담아 비교한다. `server.tomcat.*`을 적용하는 `EmbeddedWebServerFactoryCustomizerAutoConfiguration`을 함께 켠다'
    test: ServletTomcatTest.thirdRequestWaitsForThread
  - claim: '톰캣에 등록된 서블릿은 `dispatcherServlet` 하나이고 `/`에 걸려 있다'
    how: '`ServletWebServerApplicationContext`의 서블릿 컨텍스트에서 `getServletRegistrations()`를 읽는다'
    test: ServletTomcatTest.dispatcherServletIsTheOnlyServlet
  - claim: '등록한 서블릿에 요청 5개를 보내면 `init` 1번, `service` 5번, 객체는 하나다'
    how: '`ServletRegistrationBean`으로 세는 서블릿을 등록하고 센다'
    test: ServletTomcatTest.servletIsSingleInstance
  - claim: '읽기 타임아웃 1초를 준 `RestClient`는 3초 걸리는 서버를 부를 때 약 1초에 예외를 던진다'
    how: '같은 앱에 느린 엔드포인트를 두고 부른다'
    test: ServletTomcatTest.readTimeoutReleasesThread
sources:
  - '서블릿의 생명주기(init, service, destroy)와 하나의 인스턴스를 여러 스레드가 쓴다는 것: Jakarta Servlet 6.0 명세 2장 https://jakarta.ee/specifications/servlet/6.0/jakarta-servlet-spec-6.0'
  - '`server.tomcat.*` 설정과 기본값: 스프링 부트 공통 설정 목록 https://docs.spring.io/spring-boot/appendix/application-properties/index.html'
  - '`DispatcherServlet`이 앞단 서블릿이라는 것: 스프링 프레임워크 문서 https://docs.spring.io/spring-framework/reference/web/webmvc/mvc-servlet.html'
  - '가상 스레드 설정: 스프링 부트 문서 https://docs.spring.io/spring-boot/reference/features/spring-application.html#features.spring-application.virtual-threads'
