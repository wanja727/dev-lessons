# 서블릿과 톰캣 (설계서)
# 자료 파일의 칸은 docs/lesson-data-format.md에 있다.
stage: design
title: 서블릿과 톰캣
unit: 스프링
roadmap: S1
type: 동작 확인
prerequisites:
  - {slug: http-basics, title: HTTP 요청과 응답}
  - {slug: thread-pool, title: 스레드 풀}
assume: '자바 21, 스프링 부트 3.5(내장 톰캣 10.1). HTTP 요청이 메서드, 경로, 헤더, 본문으로 이루어진다는 것(HTTP 요청과 응답 레슨). 스레드 풀이 정해진 수의 스레드로 작업을 나눠 받고, 다 바쁘면 작업이 큐에서 기다린다는 것(스레드 풀 레슨). 스프링 MVC는 몰라도 돼요.'
example: '주문 조회 API `GET /orders/{id}` 하나를 띄운 스프링 부트 앱. 요청마다 처리하는 스레드의 이름을 응답에 담아 보고, 톰캣의 스레드 수를 2로 줄여 느린 요청 세 개를 함께 보내 봐요.'
intro:
  - '외부 결제 API가 느려진 날, 결제와 상관없는 상품 조회까지 응답이 멈춰요. 서버의 CPU는 한가한데 요청이 줄을 서 있어요. 요청을 처리하는 스레드가 모두 결제 API의 응답을 기다리느라 묶여 있어서예요.'
  - '스프링 부트 앱은 안에 톰캣이라는 서블릿 컨테이너를 품고 있어요. 소켓을 열고, HTTP를 읽고, 요청마다 스레드를 하나 내주는 일은 톰캣이 하고, 스프링은 그 위에서 컨트롤러를 불러요. 컨트롤러 코드가 어느 스레드에서 도는지 알아야 스레드 수 설정, 타임아웃, `ThreadLocal`에 기대는 기능(트랜잭션, 로그인 정보)을 이해할 수 있어요.'
  - '이 레슨에서는 작은 앱을 띄워 요청마다 스레드 이름을 찍어 보고, 톰캣의 스레드 수를 줄였을 때 세 번째 요청이 기다리는 시간을 재요.'
covers:
  - topic: '서블릿은 요청을 받아 응답을 만드는 자바 객체의 규약(`HttpServlet`의 `service`)이다. 서블릿 컨테이너는 연결을 받고 HTTP를 읽어 `HttpServletRequest`와 `HttpServletResponse` 객체로 만들어 서블릿을 부른다'
    where: '질문 1'
  - topic: '톰캣은 서블릿 컨테이너이자 웹 서버다. 스프링 부트는 톰캣을 라이브러리로 넣어 `main`에서 띄운다(내장 톰캣). 따로 설치한 톰캣에 war를 올리는 방식과의 차이'
    where: '질문 1'
  - topic: '스프링 MVC는 서블릿 하나(`DispatcherServlet`)를 톰캣에 등록하고, 모든 요청을 그 서블릿이 받아 컨트롤러로 나눈다'
    where: '질문 1. 나누는 과정은 스프링 MVC 요청 흐름(S6)'
  - topic: '요청 하나는 톰캣 스레드 풀의 스레드 하나가 처음부터 응답까지 맡는다. 동시에 온 요청은 다른 스레드에서 돈다'
    where: '질문 2'
  - topic: '한 요청 안의 필터, 컨트롤러, 서비스는 같은 스레드에서 돈다. 그래서 스프링은 트랜잭션과 로그인 정보를 `ThreadLocal`에 둔다'
    where: '질문 2. 트랜잭션은 @Transactional 동작 원리(S10), 로그인 정보는 인증과 인가(S12)'
  - topic: '스레드가 모두 바쁘면 새 요청은 연결 큐에서 기다린다. 스레드 수는 `server.tomcat.threads.max`(기본 200)'
    where: '질문 3'
  - topic: '스레드를 오래 잡는 일(느린 외부 호출, 느린 쿼리)이 쌓이면 상관없는 요청까지 기다린다. 타임아웃을 둔다'
    where: '질문 3과 실무에서는'
  - topic: '`accept-count`, `max-connections`, `connection-timeout`이 각각 무엇인지'
    where: '실무에서는'
  - topic: '서블릿 객체는 하나만 만들어 모든 요청 스레드가 함께 쓴다. `init`은 한 번, `service`는 요청마다, `destroy`는 종료할 때 한 번'
    where: '질문 4'
  - topic: '서블릿과 컨트롤러는 여러 스레드가 함께 쓰므로 필드에 요청마다 다른 값을 두면 섞인다'
    where: '질문 4. 싱글톤 빈의 상태는 빈의 생명주기와 스코프(S3)'
  - topic: '스레드 풀 크기와 DB 커넥션 풀 크기를 함께 정하는 법'
    where: '다루지 않음: 스레드 풀과 커넥션 풀 크기(심화)'
  - topic: '요청마다 스레드를 쓰지 않는 방식(논블로킹, 웹플럭스)과 가상 스레드'
    where: '다루지 않음: 웹플럭스(S16), 가상 스레드(C12). 실무에서는에 `spring.threads.virtual.enabled`를 한 줄 소개한다'
codes:
  predict: |-
    @GetMapping("/orders/{id}")
    String order(@PathVariable long id)
        throws InterruptedException {
      Thread.sleep(1000);
      return "order " + id;
    }
    // server.tomcat.threads.max=2
    // 요청 3개를 동시에 보낸다
  thread: |-
    @GetMapping("/orders/{id}")
    String order(@PathVariable long id) {
      return "order " + id + " on "
          + Thread.currentThread().getName();
    }
  servlet: |-
    public class HelloServlet
        extends HttpServlet {
      @Override
      protected void doGet(
          HttpServletRequest req,
          HttpServletResponse res)
          throws IOException {
        res.getWriter().write("hello");
      }
    }
  yml: |-
    server:
      tomcat:
        threads:
          max: 200
          min-spare: 10
        accept-count: 100
        max-connections: 8192
        connection-timeout: 20s
predict:
  text: '코드 predict처럼 1초 걸리는 컨트롤러를 두고, 톰캣의 스레드를 2개로 줄인 뒤 요청 3개를 동시에 보내요. 세 번째 요청의 응답은 보낸 지 얼마 뒤에 올까요? 보기: 약 1초, 약 2초, 약 3초, 오지 않는다(에러).'
  answer: '약 2초. 스레드 2개가 앞의 두 요청을 1초 동안 처리하는 사이 셋째 요청은 기다리고, 스레드가 하나 풀리면 그때 1초 걸려 처리된다. 질문 3에서 밝힌다.'
questions:
  - id: q1
    title: 서블릿 컨테이너는 무슨 일을 하나요?
    conclusion:
      lead: '연결을 받고 HTTP를 읽어 요청 객체와 응답 객체로 만든 뒤, 그 요청을 맡을 서블릿을 불러요.'
      sub: '개발자는 소켓과 HTTP 해석을 쓰지 않고 요청을 처리하는 코드만 써요. 스프링 부트는 톰캣을 안에 넣어 띄우고, 스프링 MVC는 `DispatcherServlet` 하나로 모든 요청을 받아요.'
    says:
      - '서블릿은 `HttpServlet`을 상속해 `doGet`, `doPost`를 쓰는 자바 객체다(코드 servlet). 요청이 오면 컨테이너가 `service`를 부르고, `service`가 메서드에 따라 `doGet` 등을 부른다'
      - '서블릿 컨테이너가 하는 일을 순서로 적는다: 포트를 열고 연결을 받는다, 바이트를 읽어 HTTP 요청으로 해석한다, `HttpServletRequest`와 `HttpServletResponse`를 만든다, 경로에 맞는 서블릿을 찾아 부른다, 응답 객체에 쓴 것을 HTTP 응답으로 보낸다'
      - '톰캣이 대표적인 서블릿 컨테이너다. 예전에는 톰캣을 따로 설치하고 war 파일을 올렸다. 스프링 부트는 톰캣을 라이브러리로 넣고 `main`에서 띄운다. 그래서 jar 하나로 실행된다'
      - '스프링 MVC는 서블릿을 하나만 등록한다. `DispatcherServlet`이 `/` 아래 모든 요청을 받아 알맞은 컨트롤러 메서드로 넘긴다. 앱을 띄우고 톰캣에 등록된 서블릿 목록을 출력해 `dispatcherServlet` 하나가 `/`에 걸려 있는 것을 보인다'
      - '컨트롤러는 서블릿이 아니다. `DispatcherServlet`이 부르는 보통 객체다. 나누는 과정은 S6에서 본다'
    widget:
      kind: steps
      note: '브라우저가 `GET /orders/7`을 보낸 뒤 톰캣이 하는 일을 한 단계씩 보인다: 연결 받기, HTTP 읽기, 요청 객체 만들기, 스레드에 맡기기, `DispatcherServlet` 부르기, 컨트롤러가 돌려준 값을 응답으로 쓰기. 단계마다 그 일을 하는 것이 톰캣인지 스프링인지 표시한다'
    asks:
      - '본문의 예시: 스프링 부트 앱에서 `GET /orders/7`과 `POST /members`는 각각 어느 서블릿이 받나 (둘 다 `DispatcherServlet`. 스프링 MVC는 서블릿 하나로 모든 요청을 받는다)'
      - '옮긴 상황: 다음 일 가운데 서블릿 컨테이너(톰캣)가 하는 일이 아닌 것은? 연결 받기, HTTP 헤더 읽기, 요청 객체 만들기, 경로에 맞는 컨트롤러 메서드 고르기 (컨트롤러 메서드를 고르는 것은 스프링의 `DispatcherServlet`이다)'
  - id: q2
    title: 요청 하나는 어느 스레드에서 처리되나요?
    conclusion:
      lead: '톰캣 스레드 풀의 스레드 하나가 요청 하나를 받아 응답을 보낼 때까지 맡아요.'
      sub: '동시에 온 요청은 서로 다른 스레드에서 돌고, 한 요청 안의 필터와 컨트롤러와 서비스는 모두 같은 스레드에서 돌아요.'
    says:
      - '코드 thread로 요청마다 스레드 이름을 응답에 담는다. 이름은 `http-nio-포트-exec-번호` 꼴이다. `exec`는 톰캣의 요청 처리 스레드 풀이다. 실제 출력을 보인다'
      - '요청 두 개를 동시에 보내면 다른 스레드 이름이 나온다. 순서대로 여러 번 보내면 같은 스레드가 다시 쓰이기도 한다. 스레드를 요청마다 만들지 않고 풀에서 빌려 쓰고 돌려주기 때문이다(C7)'
      - '필터, 컨트롤러, 서비스에서 각각 스레드 이름을 찍으면 모두 같다. 요청 하나가 스레드 하나를 처음부터 끝까지 쓴다'
      - '그래서 스프링은 요청에 딸린 정보를 `ThreadLocal`(스레드마다 따로 가지는 변수)에 둔다. 트랜잭션의 커넥션(S10)과 로그인한 사용자(S12)가 그렇다. 다른 스레드로 넘어가면 이 값이 따라가지 않는다'
    asks:
      - '본문의 예시: 사용자 둘이 같은 순간에 `GET /orders/1`과 `GET /orders/2`를 보낸다. 두 요청의 컨트롤러는 같은 스레드에서 차례로 도나, 다른 스레드에서 함께 도나 (다른 스레드에서 함께 돈다)'
      - '옮긴 상황: 필터에서 `ThreadLocal`에 요청 id를 넣었다. 같은 요청의 서비스 메서드에서 그 값을 읽을 수 있나. 서비스가 그 일을 새 스레드에 맡기면 새 스레드에서도 읽을 수 있나 (같은 스레드라 읽힌다. 새 스레드에서는 읽히지 않는다)'
  - id: q3
    title: 스레드가 모두 바쁘면 새 요청은 어떻게 되나요?
    conclusion:
      lead: '바로 실패하지 않고, 스레드 하나가 풀릴 때까지 연결 큐에서 기다려요.'
      sub: '그래서 느린 일로 스레드가 모두 묶이면 빨리 끝날 요청도 함께 느려져요. 스레드 수의 기본값은 200이에요.'
    says:
      - '`server.tomcat.threads.max`가 요청 처리 스레드의 최대 수다. 기본 200이다'
      - '코드 predict를 돌린다. 스레드 2개, 1초 걸리는 요청 3개를 동시에 보내면 앞의 둘은 약 1초, 셋째는 약 2초에 응답한다. 예측의 답을 밝힌다. 실제 걸린 시간을 실제 출력으로 보인다'
      - '기다리는 동안 셋째 요청은 에러가 나지 않는다. 연결은 이미 받아 두었고(`max-connections`) 처리할 스레드가 없어 기다릴 뿐이다. 연결 수까지 넘치면 운영체제의 대기열(`accept-count`)에서 기다리고, 그것도 넘치면 연결이 거절된다'
      - '도입부의 장면으로 돌아간다. 결제 API 호출이 10초씩 걸리면 그 요청들이 스레드를 10초씩 잡는다. 스레드가 모두 잡히면 상품 조회도 줄을 선다. CPU는 놀고 있다. 스레드가 기다리기만 해도 스레드는 쓰이고 있는 것이다'
    widget:
      kind: steps
      note: '스레드 두 칸과 대기 줄을 그린다. 요청 A, B, C가 차례로 들어온다. A와 B가 스레드를 잡고 C는 줄에 선다. 1초 뒤 A가 끝나 스레드가 풀리고 C가 그 스레드를 잡는다. 2초에 C가 끝난다. 단계마다 시각과 각 요청의 상태를 보인다'
    asks:
      - '본문의 예시: 스레드 2개, 1초 걸리는 요청 4개를 동시에 보내면 마지막 요청은 약 몇 초에 응답하나 (약 2초. 두 개씩 두 번에 처리된다)'
      - '옮긴 상황: 스레드 200개인 서버에서 외부 API가 갑자기 30초씩 걸린다. 그 API를 부르는 요청이 초당 10개 들어온다. 외부 API를 부르지 않는 요청은 언제부터 기다리게 되나 (약 20초 뒤. 200개 스레드가 모두 외부 호출에 묶인다)'
      - '실무 구역: 외부 API 클라이언트에 읽기 타임아웃 2초를 주면 스레드 하나가 그 호출에 묶이는 시간은 길어야 얼마인가 (약 2초)'
  - id: q4
    title: 서블릿 객체는 요청마다 새로 만들어지나요?
    conclusion:
      lead: '아니요. 서블릿은 하나만 만들어지고, 요청을 처리하는 모든 스레드가 그 객체 하나를 함께 불러요.'
      sub: '`init`은 처음 한 번, `service`는 요청마다, `destroy`는 끝날 때 한 번 불려요. 그래서 서블릿의 필드에 요청마다 다른 값을 두면 다른 요청과 섞여요.'
    says:
      - '서블릿의 생명주기: 컨테이너가 처음 쓸 때(또는 시작할 때) 객체를 하나 만들고 `init`을 한 번 부른다. 요청마다 `service`를 부른다. 종료할 때 `destroy`를 한 번 부른다'
      - '`init`과 `service`가 불린 횟수를 세는 서블릿을 등록하고 요청 5개를 보낸다. `init` 1번, `service` 5번, 객체의 `hashCode`는 모두 같다. 실제 출력을 보인다'
      - '요청 여러 개를 동시에 보내면 같은 객체의 `service`가 여러 스레드에서 동시에 불린다. 그래서 서블릿 필드에 "지금 요청의 사용자" 같은 값을 넣으면 다른 요청이 덮어쓴다. 지역 변수는 스레드마다 따로라 안전하다'
      - '`DispatcherServlet`도 하나이고, 스프링이 만드는 컨트롤러와 서비스 객체도 기본으로 하나다. 같은 문제가 그대로 생긴다. 스프링 빈에서 다시 보는 것은 S3이다'
    asks:
      - '본문의 예시: 서블릿에 요청 100개가 왔다. `init`과 `service`는 각각 몇 번 불렸나 (`init` 1번, `service` 100번)'
      - '옮긴 상황: 서블릿에 `private String currentUser` 필드를 두고 `service`의 첫 줄에서 요청의 사용자를 넣고, 마지막 줄에서 그 값으로 응답을 쓴다. 두 사용자가 동시에 요청하면 무엇이 생길 수 있나 (한 사용자가 다른 사용자의 이름으로 응답을 받을 수 있다)'
practice:
  says:
    - '스레드와 연결 설정은 `application.yml`의 `server.tomcat` 아래에 둔다(코드 yml). 각 칸이 무엇인지 한 줄씩: `threads.max`(요청 처리 스레드 최대 수), `threads.min-spare`(늘 살려 두는 수), `max-connections`(받아 두는 연결 수), `accept-count`(그것도 넘칠 때 운영체제 대기열), `connection-timeout`(연결 뒤 요청을 기다리는 시간). 근거는 스프링 부트 공식 문서의 서버 설정 목록이다'
    - '흔한 실수: 외부 API를 타임아웃 없이 부른다. 자바의 `HttpClient`와 스프링의 `RestClient`는 따로 정하지 않으면 응답을 오래(읽기는 끝없이) 기다린다. 상대가 느려지면 톰캣 스레드가 모두 묶인다. 고친 코드: `RestClient`에 연결 타임아웃과 읽기 타임아웃을 준다. 느린 서버를 흉내 내 타임아웃이 난 시간을 테스트로 남긴다'
    - '스레드를 늘리면 해결될까. 스레드는 늘어날수록 메모리를 쓰고 DB 커넥션을 놓고 다툰다. 크기를 정하는 법은 심화 레슨(스레드 풀과 커넥션 풀 크기)이 맡는다고 적는다'
    - '스프링 부트 3.2부터 `spring.threads.virtual.enabled=true`로 톰캣이 요청마다 가상 스레드를 쓰게 할 수 있다고 한 줄 적고 C12로 넘긴다. 공식 문서 근거'
claims:
  - claim: '스프링 부트 앱의 컨트롤러는 `http-nio-포트-exec-번호` 이름의 스레드에서 돈다'
    how: '`MiniWeb`처럼 작은 앱을 띄우고 코드 thread의 응답을 읽는다'
  - claim: '동시에 보낸 요청 두 개는 서로 다른 스레드에서 처리된다'
    how: '두 요청이 컨트롤러 안에서 서로를 기다리게(`CountDownLatch`) 만들어 동시에 처리 중인 것을 보장하고, 응답의 스레드 이름이 다른지 본다'
  - claim: '한 요청의 필터와 컨트롤러는 같은 스레드에서 돈다'
    how: '필터에서 스레드 이름을 요청 속성에 넣고 컨트롤러에서 비교한다'
  - claim: '`server.tomcat.threads.max=2`에서 1초 걸리는 요청 3개를 동시에 보내면 셋째는 약 2초에 응답하고 에러가 나지 않는다'
    how: '`HttpClient.sendAsync`로 동시에 보내 각 응답 시간을 잰다. 시간은 범위로 단정한다(셋째가 1.8초 이상)'
  - claim: '톰캣에 등록된 서블릿은 `dispatcherServlet` 하나이고 `/`에 걸려 있다'
    how: '`ServletWebServerApplicationContext`의 서블릿 컨텍스트에서 `getServletRegistrations()`를 읽는다'
  - claim: '등록한 서블릿에 요청 5개를 보내면 `init` 1번, `service` 5번, 객체는 하나다'
    how: '`ServletRegistrationBean`으로 세는 서블릿을 등록하고 센다'
  - claim: '읽기 타임아웃 1초를 준 `RestClient`는 3초 걸리는 서버를 부를 때 약 1초에 예외를 던진다'
    how: '같은 앱에 느린 엔드포인트를 두고 부른다'
sources:
  - '서블릿의 생명주기(init, service, destroy)와 하나의 인스턴스를 여러 스레드가 쓴다는 것: Jakarta Servlet 6.0 명세 2장 https://jakarta.ee/specifications/servlet/6.0/jakarta-servlet-spec-6.0'
  - '`server.tomcat.*` 설정과 기본값: 스프링 부트 공통 설정 목록 https://docs.spring.io/spring-boot/appendix/application-properties/index.html'
  - '`DispatcherServlet`이 앞단 서블릿이라는 것: 스프링 프레임워크 문서 https://docs.spring.io/spring-framework/reference/web/webmvc/mvc-servlet.html'
  - '가상 스레드 설정: 스프링 부트 문서 https://docs.spring.io/spring-boot/reference/features/spring-application.html#features.spring-application.virtual-threads'
