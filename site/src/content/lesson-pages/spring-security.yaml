# 인증과 인가
# 자료 파일의 칸은 docs/lesson-data-format.md에 있다. 문제는 content/questions/spring-security.yaml에 있다.
title: 인증과 인가
description: 인증과 인가의 차이와 401, 403, 스프링 시큐리티가 요청을 막는 필터 체인, 로그인한 사용자가 요청 동안 놓이는 SecurityContextHolder, 세션 방식과 토큰 방식의 설정 차이. 네 가지 질문에 스스로 답할 수 있게 시큐리티를 켠 작은 앱에 요청을 보내 보는 대화형 레슨.
unit: 스프링
minutes: 20
roadmap: S12
type: 동작 확인
prerequisites:
  - {slug: filter-interceptor, title: 필터와 인터셉터}
  - {slug: cookie-session-token, title: 쿠키, 세션, 토큰}
assume: '자바 21, 스프링 부트 3.5(스프링 시큐리티 6.5). 필터가 `DispatcherServlet` 앞에서 모든 요청에 걸리고 요청을 멈출 수 있다는 것(필터와 인터셉터 레슨). 로그인 상태를 세션 쿠키로 유지하는 방식과 요청마다 토큰을 보내는 방식(쿠키, 세션, 토큰 레슨). 요청 하나가 스레드 하나에서 처리된다는 것(서블릿과 톰캣 레슨).'
example: '쇼핑몰 API. `/products`는 누구나, `/orders`는 로그인한 회원만, `/admin`은 관리자만 쓸 수 있다. 같은 규칙을 세션 방식과 토큰 방식으로 각각 설정해 본다.'
intro:
  - '`spring-boot-starter-security`를 넣은 순간 모든 API가 401을 돌려주고, 로그에는 처음 보는 비밀번호가 찍혀요. 규칙을 적고 나니 로그인은 되는데 관리자 화면에서 403이 나요. 401과 403이 무엇이 다르고 어디서 나오는지 모르면 설정을 이것저것 바꿔 보게 돼요.'
  - '스프링 시큐리티는 요청이 컨트롤러에 닿기 전에 필터들로 "누구인가"(인증)와 "해도 되는가"(인가)를 확인해요. 스프링 개발자는 이 필터 체인에 규칙을 적고, 로그인 상태를 세션에 둘지 토큰으로 받을지 고르고, 비밀번호를 어떻게 저장할지 정해요. 면접에서도 "스프링 시큐리티의 동작 과정"과 "세션과 JWT의 차이"를 자주 물어요.'
  - '이 레슨에서는 시큐리티를 켠 작은 앱에서 필터 목록을 출력하고, 로그인하지 않은 요청과 권한이 없는 요청의 응답을 비교하고, 세션 방식과 토큰 방식에서 같은 요청이 어떻게 처리되는지 확인해요.'
covers:
  - topic: '인증은 요청한 사람이 누구인지 확인하는 것, 인가는 그 사람이 이 일을 해도 되는지 정하는 것이다. 인증 실패는 401, 인가 실패는 403'
    where: '질문 1'
  - topic: '스프링 시큐리티는 서블릿 필터 하나(`springSecurityFilterChain`, `FilterChainProxy`)로 톰캣에 등록되고, 그 안의 `SecurityFilterChain`에 든 필터들을 차례로 부른다'
    where: '질문 2'
  - topic: '주요 필터의 역할: 세션에서 로그인 정보 꺼내기(`SecurityContextHolderFilter`), 로그인 처리(`UsernamePasswordAuthenticationFilter`, `BasicAuthenticationFilter`), 예외를 401과 403으로 바꾸기(`ExceptionTranslationFilter`), 규칙 검사(`AuthorizationFilter`)'
    where: '질문 2'
  - topic: '스타터만 넣으면 모든 요청에 인증을 요구하고, 사용자 `user`와 시작할 때 만든 비밀번호를 준다'
    where: '질문 2'
  - topic: '규칙은 `SecurityFilterChain` 빈에 `authorizeHttpRequests`로 적는다. 위에서부터 처음 맞는 규칙을 쓴다. `permitAll`, `authenticated`, `hasRole`'
    where: '질문 1과 실무에서는'
  - topic: '인증된 사용자는 `SecurityContextHolder`(스레드에 묶인 저장소)의 `Authentication`에 담긴다. 컨트롤러는 `@AuthenticationPrincipal`로 꺼낸다'
    where: '질문 3'
  - topic: '세션 방식: 로그인에 성공하면 `SecurityContext`를 세션에 저장하고, 다음 요청은 `JSESSIONID` 쿠키로 세션에서 다시 꺼낸다'
    where: '질문 3'
  - topic: '토큰 방식: 세션을 만들지 않고(`STATELESS`), 요청마다 `Authorization` 헤더의 토큰을 필터가 검증해 `SecurityContext`를 채운다'
    where: '질문 4'
  - topic: 'CSRF 보호는 기본으로 켜져 있다. 쿠키로 로그인 상태를 보내는 세션 방식에는 필요하고, 헤더로 토큰을 보내는 방식에서는 끄는 경우가 많다'
    where: '질문 4'
  - topic: 'JWT 서명 검증은 `spring-boot-starter-oauth2-resource-server`가 해 준다'
    where: '질문 4의 더 알아보기. 토큰의 구조는 쿠키, 세션, 토큰(N7)'
  - topic: '비밀번호는 `PasswordEncoder`(기본 bcrypt)로 해시해 저장한다. 같은 비밀번호도 매번 다른 해시가 나오고 `matches`로 비교한다'
    where: '실무에서는'
  - topic: '메서드에 붙이는 권한 검사 `@PreAuthorize`'
    where: '질문 1의 더 알아보기'
  - topic: 'OAuth2 소셜 로그인(`oauth2Login`)이 필터로 하는 일'
    where: '실무에서는. 소셜 로그인의 흐름 자체는 이 과정에서 다루지 않는다'
  - topic: '시큐리티가 걸린 컨트롤러 테스트(`@WithMockUser`)'
    where: '실무에서는. 테스트 종류는 스프링 테스트(T3)'
  - topic: 'CSRF와 XSS 공격의 원리'
    where: '다루지 않음: 웹 보안 기초(N10)'
links:
  test: https://github.com/wanja727/dev-lessons/blob/main/verification/src/test/java/lab/devlessons/springsecurity/SpringSecurityLessonTest.java
  architecture: https://docs.spring.io/spring-security/reference/servlet/architecture.html
  authorize: https://docs.spring.io/spring-security/reference/servlet/authorization/authorize-http-requests.html
  authArch: https://docs.spring.io/spring-security/reference/servlet/authentication/architecture.html
  persistence: https://docs.spring.io/spring-security/reference/servlet/authentication/persistence.html
  csrf: https://docs.spring.io/spring-security/reference/servlet/exploits/csrf.html
  password: https://docs.spring.io/spring-security/reference/features/authentication/password-storage.html
  jwt: https://docs.spring.io/spring-security/reference/servlet/oauth2/resource-server/jwt.html
  testing: https://docs.spring.io/spring-security/reference/servlet/test/method.html
  rfc: https://www.rfc-editor.org/rfc/rfc9110
codes:
  predict: |-
    @Bean
    SecurityFilterChain api(HttpSecurity http)
        throws Exception {
      http.authorizeHttpRequests(a -> a
          .requestMatchers("/products/**")
              .permitAll()
          .requestMatchers("/admin/**")
              .hasRole("ADMIN")
          .anyRequest().authenticated())
        .httpBasic(Customizer.withDefaults());
      return http.build();
    }
    // 회원 kim(역할 USER)으로
    // GET /admin/stats
  principal: |-
    @GetMapping("/orders")
    List<Order> myOrders(
        [[@AuthenticationPrincipal]]
        UserDetails user) {
      return orders.findByUser(
          user.getUsername());
    }
  session: |-
    http
      .authorizeHttpRequests(a -> a
          .anyRequest().authenticated())
      [[.formLogin(Customizer.withDefaults());]]
  stateless: |-
    http
      [[.csrf(c -> c.disable())]]
      .sessionManagement(s -> s
          .sessionCreationPolicy(
              [[SessionCreationPolicy.STATELESS]]))
      .addFilterBefore(new TokenFilter(),
          UsernamePasswordAuthenticationFilter
              .class);
  tokenFilter: |-
    protected void doFilterInternal(
        HttpServletRequest req,
        HttpServletResponse res,
        FilterChain chain) ... {
      String h = req.getHeader(
          "Authorization");
      if (h != null
          && h.startsWith("Bearer ")) {
        Authentication a =
            tokens.verify(h.substring(7));
        [[SecurityContextHolder.getContext()]]
            [[.setAuthentication(a);]]
      }
      chain.doFilter(req, res);
    }
  encoder: |-
    @Bean
    PasswordEncoder passwordEncoder() {
      return PasswordEncoderFactories
          .createDelegatingPasswordEncoder();
    }
  signUp: |-
    public void join(String email,
        String rawPassword) {
      members.save(new Member(email,
          [[encoder.encode(rawPassword)]]));
    }
  withMockUser: |-
    @Test
    [[@WithMockUser(roles = "ADMIN")]]
    void adminCanSeeStats() throws Exception {
      mvc.perform(get("/admin/stats"))
          .andExpect(status().isOk());
    }
predict:
  title: 관리자 화면의 응답은 몇일까요?
  text: '코드 predict의 규칙에서 회원 kim(역할 USER)이 올바른 아이디와 비밀번호를 보내며 `GET /admin/stats`를 요청해요. 응답은 몇일까요? 답은 질문 1에 나와요.'
  code: predict
  label: 내 예측
  options:
    - {value: a, label: '200'}
    - {value: b, label: '401'}
    - {value: c, label: '403'}
    - {value: d, label: '404'}
  answer: c
  storageKey: sec-predict
  wrong: 예측은 "{label}"이었어요. 틀린 예측이 더 오래 남으니 괜찮아요.
questions:
  - id: q1
    title: 인증과 인가는 무엇이 다른가요?
    conclusion:
      lead: '인증은 "누구인가"를 확인하는 것이고, 인가는 "이 사람이 이 일을 해도 되는가"를 정하는 것이에요.'
      sub: '누구인지 모르면 401(Unauthorized), 누구인지는 알지만 허락되지 않았으면 403(Forbidden)이에요. 인증이 먼저고 인가는 그 결과를 써요.'
    says:
      - '코드 predict의 규칙에 요청 여섯 가지를 보낸다. 예측의 답을 밝힌다. 응답을 실제 출력으로 보인다'
      - '401은 이름과 달리 "인증되지 않음"이다. 403은 다시 로그인해도 소용없다는 뜻이다'
      - '규칙은 위에서부터 읽어 처음 맞는 것을 쓴다. `anyRequest()`는 맨 끝에 둔다'
      - '`hasRole("ADMIN")`은 권한 이름 `ROLE_ADMIN`을 찾는다'
      - '더 알아보기: `@EnableMethodSecurity`와 `@PreAuthorize`'
    asks:
      - '본문의 예시: 코드 predict의 규칙에서 관리자 admin이 비밀번호를 틀린 채 `/admin/stats`를 요청하면 몇인가 (401. 인증부터 실패한다)'
      - '옮긴 상황: 사내 시스템에서 사원 lee가 로그인한 뒤 다른 부서의 급여 화면을 열자 "권한이 없습니다"가 나온다. 인증 실패와 인가 실패 가운데 무엇이고 상태 코드는 몇이 맞나 (인가 실패, 403)'
    body:
      - p: '로그인과 권한은 두 단계예요. **인증**(authentication)은 요청한 사람이 **누구인지** 확인하는 것, **인가**(authorization)는 그 사람이 이 일을 **해도 되는지** 정하는 것이에요. 인증이 먼저고, 인가는 인증된 결과(누구이고 어떤 역할인지)를 써요.'
      - p: '예측의 규칙으로 시큐리티를 켠 앱에 여섯 가지 요청을 보냈어요. 아이디와 비밀번호는 HTTP 기본 인증(`Authorization: Basic ...` 헤더)으로 보냈어요.'
      - ci:
          key: status
          label: 실제 응답 보기
          source: SpringSecurityLessonTest.authenticationVersusAuthorization
          code: predict
      - p: 'kim의 `/admin/stats`는 **403**이에요. {{predict-result}} 아이디와 비밀번호가 맞아 인증은 됐지만, `ADMIN` 역할이 없어 인가에서 막혔어요. 비밀번호를 틀린 admin은 인증부터 실패해서 **401**이에요.'
      - table:
          head: [상태 코드, 뜻, 다시 로그인하면]
          rows:
            - ['401 Unauthorized', '누구인지 모른다(인증 실패)', '해결될 수 있다']
            - ['403 Forbidden', '누구인지 알지만 허락되지 않았다(인가 실패)', '소용없다']
      - p: '401은 이름이 "Unauthorized"라 헷갈리지만 뜻은 "인증되지 않음"이에요([근거](link:rfc)).'
      - h3: 규칙은 위에서부터 처음 맞는 것
      - p: '`authorizeHttpRequests`의 규칙은 위에서부터 읽어 **처음 맞는 것**을 써요. `/products/**`는 누구나(`permitAll`), `/admin/**`은 `ADMIN` 역할만(`hasRole`), 나머지는 로그인만 하면(`authenticated`) 돼요. 그래서 넓은 규칙인 `anyRequest()`는 맨 끝에 둬요([근거](link:authorize)). `hasRole("ADMIN")`은 권한 이름 `ROLE_ADMIN`을 찾아요. 역할은 `ROLE_`을 붙인 권한이라는 관례예요.'
      - more:
          summary: '더 알아보기: 메서드에 권한 붙이기'
          body:
            - p: 'URL이 아니라 서비스 메서드에 규칙을 붙이려면 `@EnableMethodSecurity`를 켜고 메서드에 `@PreAuthorize("hasRole(''ADMIN'')")`를 붙여요. 이것도 [AOP](lesson:aop-audit)의 프록시로 동작해요.'
      - quiz:
          q: '사원 lee가 로그인한 뒤 다른 부서의 급여 화면을 열자 "권한이 없습니다"가 나와요. 알맞은 상태 코드는?'
          options:
            - '401. 인증 실패'
            - '403. 인가 실패'
            - '404'
          answer: 2
          explain: 'lee가 누구인지는 알아요(로그인함). 그 화면을 볼 권한이 없을 뿐이에요. 인가 실패는 403이에요.'
      - next: '401과 403은 컨트롤러가 돌려준 것이 아니에요. 그럼 어디서 막았을까요?'
    recall: '인증은 요청한 사람이 누구인지 확인하는 것, 인가는 그 사람이 이 일을 해도 되는지 정하는 것이에요. 인증 실패는 401(누구인지 모름), 인가 실패는 403(알지만 허락 안 됨)이에요. 규칙은 SecurityFilterChain의 authorizeHttpRequests에 permitAll, hasRole, authenticated로 적고 위에서부터 처음 맞는 것을 써서 anyRequest()는 맨 끝에 둬요.'
  - id: q2
    title: 스프링 시큐리티는 요청을 어디에서 막나요?
    conclusion:
      lead: '`DispatcherServlet` 앞의 서블릿 필터에서 막아요. 그 필터 하나 안에 시큐리티 필터 여러 개가 줄지어 있어요.'
      sub: '로그인 정보를 꺼내는 필터, 로그인을 처리하는 필터, 예외를 401과 403으로 바꾸는 필터, 규칙을 검사하는 필터를 차례로 지나요. 막힌 요청은 컨트롤러에 닿지 않아요.'
    says:
      - '톰캣에 등록되는 시큐리티 필터는 `springSecurityFilterChain` 하나다(S7의 필터). 이 필터(`FilterChainProxy`)가 요청에 맞는 `SecurityFilterChain`의 필터들을 차례로 부른다'
      - '코드 predict의 체인에 든 필터 목록을 순서대로 출력한다'
      - '`AuthorizationFilter`가 규칙을 검사하고 안 되면 예외를 던지고, 그 앞의 `ExceptionTranslationFilter`가 인증이 없으면 401, 있으면 403으로 응답한다'
      - '필터에서 막히므로 컨트롤러는 불리지 않는다. 그래서 S8의 `@ControllerAdvice`로는 이 401과 403의 모양을 바꿀 수 없다'
      - '스타터만 넣고 아무 설정도 없으면 모든 요청이 인증을 요구하고, 사용자 `user`와 시작 로그에 찍힌 임의 비밀번호가 생긴다(S4의 자동 설정)'
    asks:
      - '본문의 예시: 로그인 없이 `/orders`를 요청했다. 401 응답을 만드는 것은 컨트롤러, `@ControllerAdvice`, 시큐리티 필터 가운데 무엇인가 (시큐리티 필터. `ExceptionTranslationFilter`)'
      - '옮긴 상황: 401 응답 본문을 회사의 에러 형식으로 바꾸려고 `@RestControllerAdvice`에 `AuthenticationException` 핸들러를 만들었다. 로그인 없는 요청의 응답이 바뀌나 (바뀌지 않는다. 컨트롤러 전에 필터에서 막혀 어드바이스가 불리지 않는다)'
    body:
      - p: '스프링 시큐리티는 [필터와 인터셉터](lesson:filter-interceptor) 레슨의 **필터**로 동작해요. 톰캣에는 `springSecurityFilterChain`이라는 필터 하나만 등록되고, 그 필터(`FilterChainProxy`)가 안에 든 시큐리티 필터들을 차례로 불러요([근거](link:architecture)). 예측의 규칙으로 만든 체인의 필터를 순서대로 출력했어요.'
      - ci:
          key: filters
          label: 실제 필터 목록 보기
          source: SpringSecurityLessonTest.filterChain
      - p: '열 개가 넘지만 이 레슨에서 볼 것은 넷이에요.'
      - table:
          head: [필터, 하는 일]
          rows:
            - ['`SecurityContextHolderFilter`', '세션 등에서 저장된 로그인 정보를 꺼내 질문 3의 저장소에 넣는다']
            - ['`BasicAuthenticationFilter`', '`Authorization: Basic` 헤더의 아이디와 비밀번호로 인증한다(폼 로그인이면 `UsernamePasswordAuthenticationFilter`)']
            - ['`ExceptionTranslationFilter`', '뒤에서 난 인증, 인가 예외를 받아 401이나 403으로 응답한다']
            - ['`AuthorizationFilter`', '규칙을 검사하고, 안 되면 예외를 던진다']
      - p: '로그인 없이 `/orders`를 보내면, 앞의 필터들이 사용자를 찾지 못하고, `AuthorizationFilter`가 "로그인 필요" 예외를 던지고, `ExceptionTranslationFilter`가 받아 401로 응답해요. 위 결과의 마지막 줄처럼 **컨트롤러는 한 번도 불리지 않아요.**'
      - p: '그래서 [예외 처리와 검증](lesson:exception-validation)의 `@RestControllerAdvice`로는 이 401과 403의 모양을 바꿀 수 없어요. 컨트롤러 전에 필터에서 끝났으니까요. 바꾸려면 시큐리티의 `AuthenticationEntryPoint`(401)와 `AccessDeniedHandler`(403)를 설정해요.'
      - p: '스타터만 넣고 아무 설정도 하지 않으면, 시큐리티의 자동 설정([스프링 부트의 자동 설정](lesson:spring-boot-auto-config))이 "모든 요청에 로그인 필요" 체인과 사용자 `user`를 만들고 시작 로그에 임의 비밀번호를 찍어요. 도입부의 장면이 이것이에요. 내 `SecurityFilterChain` 빈을 만들면 기본 체인은 물러나요.'
      - quiz:
          q: '401 응답 본문을 회사 형식으로 바꾸려고 `@RestControllerAdvice`에 `AuthenticationException` 핸들러를 만들었어요. 로그인 없는 요청의 응답이 바뀔까요?'
          options:
            - 바뀐다
            - 바뀌지 않는다. 컨트롤러 전에 필터에서 막힌다
            - 앱이 뜨지 않는다
          answer: 2
          explain: '시큐리티는 필터에서 막아서 `DispatcherServlet`과 어드바이스까지 가지 않아요. `AuthenticationEntryPoint`로 바꿔요.'
      - next: '필터에서 인증에 성공하면, 그 사용자 정보는 컨트롤러까지 어떻게 전해질까요?'
    recall: '스프링 시큐리티는 톰캣에 springSecurityFilterChain(FilterChainProxy) 필터 하나로 등록되고, 그 안의 SecurityFilterChain 필터들을 차례로 불러요. SecurityContextHolderFilter가 저장된 로그인을 꺼내고, BasicAuthenticationFilter 같은 필터가 인증하고, AuthorizationFilter가 규칙을 검사해 예외를 던지면 ExceptionTranslationFilter가 401이나 403으로 응답해요. 막힌 요청은 컨트롤러와 @ControllerAdvice에 닿지 않아요.'
  - id: q3
    title: 로그인한 사용자 정보는 요청 동안 어디에 있나요?
    conclusion:
      lead: '`SecurityContextHolder`에 있어요. 요청을 처리하는 스레드에 묶인 저장소라서, 같은 요청 안의 어디서든 꺼낼 수 있어요.'
      sub: '세션 방식에서는 로그인에 성공하면 이 정보를 세션에 저장해 두고, 다음 요청에서 `JSESSIONID` 쿠키로 세션을 찾아 다시 넣어요.'
    says:
      - '인증에 성공하면 필터가 `Authentication`을 만들어 `SecurityContextHolder`에 넣는다. 기본 저장 방식은 `ThreadLocal`이다'
      - '컨트롤러는 `@AuthenticationPrincipal`로 받는다. 두 곳이 같은 사용자를 보는 것을 테스트로 보인다. 새 스레드에서는 비어 있다'
      - '요청이 끝나면 필터가 이 저장소를 비운다'
      - '세션 방식(코드 session): 폼 로그인에 성공하면 세션에 저장하고 쿠키만 보내도 다시 꺼낸다. 로그인하면 세션 id를 새로 바꾼다(세션 고정 공격 방어)'
    asks:
      - '본문의 예시: 컨트롤러에서 새 스레드를 만들어 그 스레드에서 `SecurityContextHolder.getContext().getAuthentication()`을 읽으면 무엇이 나오나 (null. 스레드에 묶인 저장소라 새 스레드에 따라가지 않는다)'
      - '옮긴 상황: 세션 방식으로 로그인한 사용자가 브라우저의 쿠키를 지우고 `/orders`를 요청한다. 응답은 (401 또는 로그인 페이지로 이동. 세션을 찾을 쿠키가 없다)'
    body:
      - p: '인증에 성공하면 필터가 `Authentication`(사용자 이름과 권한 목록)을 만들어 **`SecurityContextHolder`**에 넣어요. 기본 저장 방식은 `ThreadLocal`이에요. [서블릿과 톰캣](lesson:servlet-tomcat)에서 본 "요청 하나는 스레드 하나" 덕분에, 필터에서 넣은 값을 같은 요청의 컨트롤러와 서비스가 꺼내 써요([근거](link:authArch)).'
      - code: principal
        notes:
          - mark: '@AuthenticationPrincipal'
            as: anno
            text: '`SecurityContextHolder`의 로그인한 사용자를 인자로 받아요.'
      - p: '컨트롤러의 `@AuthenticationPrincipal`과 `SecurityContextHolder`를 함께 읽고, 새 스레드에서도 읽어 봤어요.'
      - ci:
          key: holder
          label: 실제 결과 보기
          source: SpringSecurityLessonTest.securityContextHolder
      - p: '같은 요청 스레드에서는 둘 다 kim이고, **새 스레드에서는 null**이에요. 스레드에 묶인 저장소라 다른 스레드로 따라가지 않아요. 요청이 끝나면 필터가 이 저장소를 비워요. 톰캣 스레드는 다음 요청에 다시 쓰이니, 비우지 않으면 다음 사람이 앞사람으로 보여요.'
      - h3: 세션 방식은 세션에 저장해 둬요
      - code: session
        notes:
          - mark: '.formLogin(Customizer.withDefaults());'
            as: code
            text: '`POST /login`으로 아이디와 비밀번호를 받아 인증하는 필터를 켜요.'
      - p: '폼 로그인에 성공하면 `SecurityContext`를 HTTP 세션에 저장하고 `JSESSIONID` 쿠키를 줘요. 다음 요청은 쿠키만 보내면 `SecurityContextHolderFilter`가 세션에서 꺼내 넣어요([근거](link:persistence)). [쿠키, 세션, 토큰](lesson:cookie-session-token)에서 손으로 하던 세션 로그인을 시큐리티가 대신해요. 브라우저처럼 쿠키를 저장하는 클라이언트로 해 봤어요.'
      - ci:
          key: session
          label: 실제 결과 보기
          source: SpringSecurityLessonTest.sessionLogin
      - p: '로그인 전후로 `JSESSIONID`가 **바뀌었어요.** 로그인 전에 공격자가 심어 둔 세션 id를 그대로 쓰게 만드는 공격(세션 고정)을 막으려고, 로그인에 성공하면 세션 id를 새로 발급해요. 마지막 줄의 403은 질문 4에서 봐요.'
      - quiz:
          q: '컨트롤러에서 `new Thread(...)`로 만든 새 스레드에서 `SecurityContextHolder.getContext().getAuthentication()`을 읽으면?'
          options:
            - 로그인한 사용자
            - 'null'
            - 예외
          answer: 2
          explain: '`SecurityContextHolder`는 기본으로 스레드에 묶인 저장소예요. 새 스레드에는 따라가지 않아요.'
      - next: '세션 방식은 서버가 로그인 상태를 기억해요. 서버가 기억하지 않는 토큰 방식은 설정이 어떻게 다를까요?'
    recall: '인증에 성공하면 필터가 Authentication을 SecurityContextHolder(기본 ThreadLocal)에 넣어서, 같은 요청 스레드의 컨트롤러(@AuthenticationPrincipal)와 서비스가 꺼내 써요. 새 스레드로는 따라가지 않고, 요청이 끝나면 비워요. 세션 방식에서는 로그인 성공 시 SecurityContext를 세션에 저장하고 다음 요청의 JSESSIONID 쿠키로 다시 꺼내며, 로그인하면 세션 id를 바꿔 세션 고정을 막아요.'
  - id: q4
    title: 토큰 방식은 세션 방식과 설정이 어떻게 다른가요?
    conclusion:
      lead: '세션을 만들지 않게(`STATELESS`) 하고, 요청마다 `Authorization` 헤더의 토큰을 검증해 `SecurityContextHolder`를 채우는 필터를 체인에 넣어요.'
      sub: '서버가 로그인 상태를 기억하지 않으니 요청마다 토큰을 보내야 해요. 쿠키로 로그인 상태를 보내지 않으므로 CSRF 보호를 끄는 경우가 많아요.'
    says:
      - '코드 stateless와 코드 tokenFilter를 보인다. 검증은 예로 단순한 문자열을 쓰고, 실제 JWT는 더 알아보기로 넘긴다'
      - '토큰을 보낸 요청은 200, 토큰 없거나 틀리면 401이다. 응답에 `Set-Cookie`가 없다'
      - '`STATELESS`는 시큐리티가 세션을 만들지도 읽지도 않게 한다'
      - 'CSRF: 세션 방식에서 CSRF 토큰 없이 POST하면 403이다. 헤더로 토큰을 보내는 API는 끄는 경우가 많다. 세션 방식에서 끄면 안 된다'
      - '더 알아보기: `spring-boot-starter-oauth2-resource-server`'
    widget:
      kind: compare
      note: '두 칸은 "세션 방식"과 "토큰 방식". 버튼으로 "두 번째 요청 보내기", "서버 한 대 더", "POST 요청"을 고른다'
    asks:
      - '본문의 예시: 코드 stateless의 앱에 토큰 없이 `GET /orders`를 보내면 몇이고, 응답에 `JSESSIONID` 쿠키가 붙나 (401, 붙지 않는다)'
      - '옮긴 상황: 세션 방식의 앱에서 CSRF를 끄지 않았다. 로그인한 브라우저가 CSRF 토큰 없이 `POST /orders`를 보내면 몇인가 (403)'
    body:
      - code: stateless
        notes:
          - mark: '.csrf(c -> c.disable())'
            as: code
            text: '쿠키로 로그인 상태를 보내지 않으니 CSRF 보호를 꺼요. 아래에서 이유를 봐요.'
          - mark: SessionCreationPolicy.STATELESS
            as: code
            text: '시큐리티가 세션을 만들지도 읽지도 않아요.'
      - code: tokenFilter
        notes:
          - mark: SecurityContextHolder.getContext()
            as: code
            text: '토큰이 맞으면 질문 3의 저장소에 사용자를 직접 넣어요. 뒤의 `AuthorizationFilter`가 이것을 보고 규칙을 검사해요.'
      - p: '토큰 필터는 [필터와 인터셉터](lesson:filter-interceptor)에서 본 `OncePerRequestFilter`예요. 요청마다 `Authorization` 헤더의 토큰을 검증해서 사용자를 넣어요. 이 레슨의 테스트는 "token-이름" 모양의 단순한 토큰을 썼어요. 실제 JWT의 서명 검증은 더 알아보기에 있어요.'
      - ci:
          key: token
          label: 실제 결과 보기
          source: SpringSecurityLessonTest.tokenStateless
      - p: '토큰이 맞으면 200, 없거나 틀리면 401이에요. 응답에 **`Set-Cookie`가 없어요.** 서버가 로그인 상태를 기억하지 않으니, 서버를 여러 대로 늘려도 세션을 나눠 가질 필요가 없어요. [쿠키, 세션, 토큰](lesson:cookie-session-token)에서 본 토큰의 장점이에요.'
      - h3: CSRF는 왜 세션 방식에서만 필요한가요
      - p: '시큐리티는 기본으로 POST 같은 바꾸는 요청에 **CSRF 토큰**을 요구해요. 질문 3의 마지막 줄처럼 세션 방식에서 CSRF 토큰 없이 POST하면 **403**이에요. 브라우저는 다른 사이트에서 보낸 요청에도 쿠키를 자동으로 붙이는데, 이것을 악용해 로그인한 사용자 몰래 요청을 보내는 공격(CSRF)을 막으려는 거예요([근거](link:csrf)). 헤더로 토큰을 보내는 API는 브라우저가 자동으로 붙이지 않으니 CSRF 보호를 끄는 경우가 많아요. 세션 쿠키로 로그인하는 한 끄면 안 돼요. 공격의 원리는 웹 보안 기초 레슨에서 다뤄요.'
      - widget:
          kind: compare
          layout: [selector, sides, verdict]
          selector:
            label: 상황
            options:
              - {value: second, label: 두 번째 요청}
              - {value: scale, label: 서버를 한 대 더}
              - {value: post, label: 'POST 요청'}
          sides:
            - label: 세션 방식
              items:
                - {name: 로그인 상태, note: '서버의 세션'}
                - {name: 요청이 보내는 것, note: 'JSESSIONID 쿠키'}
                - {name: CSRF, note: '켠다'}
            - label: 토큰 방식
              items:
                - {name: 로그인 상태, note: '토큰 안(서버는 기억 안 함)'}
                - {name: 요청이 보내는 것, note: 'Authorization 헤더'}
                - {name: CSRF, note: '끄는 경우가 많다'}
          scenes:
            second:
              sides:
                - marks: [{name: 요청이 보내는 것, tag: 자동}]
                  result: [{k: 서버가 하는 일, v: 세션에서 꺼냄}]
                - marks: [{name: 요청이 보내는 것, tag: 직접}]
                  result: [{k: 서버가 하는 일, v: 토큰 검증}]
              verdict: '세션은 서버가 기억해서 꺼내고, 토큰은 요청마다 검증해요.'
            scale:
              sides:
                - marks: [{name: 로그인 상태, tag: 나눠 가져야, mark: bad}]
                  result: [{k: 할 일, v: 세션 저장소를 함께 쓰기, mark: bad}]
                - marks: [{name: 로그인 상태, tag: 그대로}]
                  result: [{k: 할 일, v: 없음}]
              verdict: '서버가 여러 대면 세션은 공유 저장소가 필요하고, 토큰은 아무 서버나 검증하면 돼요.'
            post:
              sides:
                - marks: [{name: CSRF, tag: 토큰 필요}]
                  result: [{k: CSRF 토큰 없이 POST, v: '403', mark: bad}]
                - marks: [{name: CSRF, tag: 끔}]
                  result: [{k: CSRF 토큰 없이 POST, v: '200'}]
              verdict: '쿠키는 브라우저가 자동으로 붙여서 CSRF를 막아야 하고, 헤더 토큰은 자동으로 붙지 않아요.'
      - more:
          summary: '더 알아보기: 실제 JWT는'
          body:
            - p: '실제 JWT는 `spring-boot-starter-oauth2-resource-server`를 넣고 `oauth2ResourceServer(o -> o.jwt(...))`로 켜면 시큐리티가 서명과 만료를 검증하는 필터를 넣어 줘요. 이 레슨처럼 필터를 직접 만들 일이 줄어요([근거](link:jwt)). JWT의 구조는 쿠키, 세션, 토큰 레슨에서 봤어요.'
      - quiz:
          q: '세션 방식의 앱에서 CSRF를 끄지 않았어요. 로그인한 브라우저가 CSRF 토큰 없이 `POST /orders`를 보내면?'
          options:
            - '200'
            - '401'
            - '403'
          answer: 3
          explain: '로그인은 됐지만(인증 성공) CSRF 토큰이 없어 막혀요. 시큐리티의 CSRF 필터가 403으로 응답해요.'
    recall: '토큰 방식은 sessionCreationPolicy(STATELESS)로 세션을 만들지도 읽지도 않게 하고, 요청마다 Authorization 헤더의 토큰을 검증해 SecurityContextHolder를 채우는 필터(OncePerRequestFilter)를 체인에 넣어요. 응답에 JSESSIONID가 없고 서버를 늘려도 세션을 나눠 가질 필요가 없어요. CSRF는 쿠키를 자동으로 붙이는 세션 방식에서 필요하고, 헤더 토큰 API에서는 끄는 경우가 많아요. 실제 JWT는 oauth2-resource-server가 검증해요.'
practice:
  title: 스프링 부트에서는 이렇게 둬요
  says:
    - '프로젝트의 모양: `SecurityFilterChain` 빈 하나, `PasswordEncoder` 빈, DB의 회원을 읽는 `UserDetailsService`. 같은 비밀번호를 두 번 인코딩하면 다른 문자열이 나오고 둘 다 `matches`가 `true`인 것을 테스트로 보인다'
    - '흔한 실수 하나: 비밀번호를 평문이나 SHA-256 한 번으로 저장한다'
    - '흔한 실수 둘: 세션 방식인데 "API라서" CSRF를 끈다'
    - '시큐리티가 걸린 컨트롤러를 테스트하는 법: `@WithMockUser`'
    - '소셜 로그인은 `spring-boot-starter-oauth2-client`와 `oauth2Login()`'
  body:
    - h3: 비밀번호는 PasswordEncoder로
    - code: encoder
    - code: signUp
      notes:
        - mark: encoder.encode(rawPassword)
          as: code
          text: '받은 비밀번호를 그대로 저장하지 않고 해시해서 저장해요.'
    - p: '프로젝트의 모양은 `SecurityFilterChain` 빈 하나(질문 1의 코드를 다듬은 것), `PasswordEncoder` 빈, DB의 회원을 읽는 `UserDetailsService`예요. 가입할 때 `encode`로 해시해 저장하고, 로그인할 때 시큐리티가 `matches`로 비교해요. 같은 비밀번호를 두 번 인코딩해 봤어요.'
    - ci:
        key: bcrypt
        label: 실제 결과 보기
        source: SpringSecurityLessonTest.passwordEncoder
    - p: '같은 비밀번호인데 결과가 매번 달라요. bcrypt는 무작위 값(소금)을 섞고 일부러 느리게 여러 번 계산하는 해시라서, 미리 계산한 표로 풀기 어려워요. 앞의 `{bcrypt}`는 어떤 방식으로 만든 해시인지 알려 주는 표시예요. 그래서 나중에 방식을 바꿔도 옛 비밀번호를 비교할 수 있어요([근거](link:password)).'
    - h3: '흔한 실수 1: 평문이나 SHA-256 한 번으로 저장'
    - p: '평문이면 DB가 새는 순간 그대로 쓰여요. SHA-256 한 번은 빨라서 흔한 비밀번호를 미리 계산한 표로 금방 풀려요. `PasswordEncoder`를 써요.'
    - h3: '흔한 실수 2: 세션 방식인데 CSRF를 끔'
    - p: '"API라서" CSRF를 끄는 글을 따라 했는데, 실제로는 브라우저 세션 쿠키로 로그인하는 서비스예요. 그러면 질문 4의 CSRF 공격이 그대로 통해요. CSRF를 끄는 것은 쿠키로 로그인 상태를 보내지 않을 때만이에요.'
    - h3: 테스트와 소셜 로그인
    - code: withMockUser
    - p: '`spring-security-test`의 `@WithMockUser`를 붙이면 그 사용자로 로그인한 것처럼 `SecurityContextHolder`가 채워져요. USER와 ADMIN의 응답을 나눠 테스트할 수 있어요([근거](link:testing)). 스프링 테스트의 종류는 스프링 테스트 레슨에서 다뤄요. 이 저장소는 `@WithMockUser`를 돌려 보지 않았어요.'
    - muted: '소셜 로그인은 `spring-boot-starter-oauth2-client`와 `oauth2Login()`이에요. 이것도 필터를 더해요. 로그인 시작 주소로 오면 소셜 로그인 화면으로 보내는 필터, 돌아온 코드를 토큰으로 바꿔 `Authentication`을 만드는 필터예요. 흐름 자체는 이 과정에서 다루지 않아요.'
interview:
  question: 스프링 시큐리티의 동작 과정과 세션 방식, 토큰 방식의 차이를 설명해 주세요
  model:
    - label: 정의
      text: 인증은 누구인지 확인하는 것, 인가는 그 사람이 이 일을 해도 되는지 정하는 것으로, 실패하면 각각 401과 403입니다. 스프링 시큐리티는 DispatcherServlet 앞의 필터 체인에서 둘을 처리합니다.
    - label: 원리
      text: springSecurityFilterChain 필터 안에서 SecurityContextHolderFilter가 저장된 로그인을 꺼내고, 인증 필터가 사용자를 확인해 SecurityContextHolder(스레드에 묶인 저장소)에 넣고, AuthorizationFilter가 규칙을 검사해 실패하면 ExceptionTranslationFilter가 401이나 403으로 응답합니다. 세션 방식은 로그인 정보를 세션에 저장해 JSESSIONID로 다시 꺼내고, 토큰 방식은 STATELESS로 두고 요청마다 헤더의 토큰을 검증합니다.
    - label: 주의할 점
      text: 막힌 요청은 컨트롤러와 @ControllerAdvice에 닿지 않습니다. 세션 방식은 CSRF 보호를 켜 두고, 헤더 토큰 방식에서만 끕니다. 비밀번호는 PasswordEncoder(bcrypt)로 해시해 저장합니다.
    - label: 경험
      text: '(내 프로젝트로 채우기) 예: 관리자 화면에서 403이 나던 것을 역할 이름(ROLE_ 접두사)과 규칙 순서를 바로잡아 고쳤습니다.'
verified: 이 레슨의 응답과 필터 목록은 짐작이 아니라 스프링 부트 3.5(스프링 시큐리티 6.5)의 작은 웹 앱에 요청을 보내 받은 값이에요. 코드가 바뀔 때마다 테스트([SpringSecurityLessonTest](link:test))가 다시 돌아요.
footer: '근거: 시큐리티의 필터 구조는 스프링 시큐리티 문서([링크](link:architecture)), 인가 규칙은 [링크](link:authorize), `SecurityContextHolder`와 저장은 [링크](link:authArch), [링크](link:persistence), CSRF는 [링크](link:csrf), 비밀번호 저장은 [링크](link:password), 401과 403의 뜻은 RFC 9110([링크](link:rfc)). 결과는 OpenJDK 21에서 테스트로 확인했어요. 오류는 [GitHub 이슈](https://github.com/wanja727/dev-lessons/issues)로 알려 주세요.'
claims:
  - claim: '로그인 없이 `/products`는 200, `/orders`는 401, USER로 `/orders`는 200, USER로 `/admin/stats`는 403, 비밀번호가 틀리면 401'
    how: '`spring-boot-starter-security`를 testImplementation으로 넣고, `MiniWeb`에 `@EnableWebSecurity` 설정과 메모리 사용자를 넣어 HTTP 기본 인증으로 요청한다. 다른 레슨의 `@SpringBootTest`에 시큐리티가 켜지지 않게 `application.yml`에서 시큐리티 자동 설정을 껐다. 시큐리티 필터가 요청 매핑을 일찍 읽어 `PropertyPlaceholderAutoConfiguration`을 함께 켰다'
    test: SpringSecurityLessonTest.authenticationVersusAuthorization
  - claim: '체인 안의 필터 목록에 `SecurityContextHolderFilter`, `BasicAuthenticationFilter`, `ExceptionTranslationFilter`, `AuthorizationFilter`가 이 순서로 있고, 401 요청에서 컨트롤러는 불리지 않는다'
    how: '`FilterChainProxy.getFilterChains()`의 필터 이름을 출력하고 컨트롤러 호출 수를 센다'
    test: SpringSecurityLessonTest.filterChain
  - claim: '컨트롤러의 `@AuthenticationPrincipal`과 `SecurityContextHolder`가 같은 사용자를 보고, 새 스레드에서는 비어 있다'
    how: '응답에 둘을 담고 새 스레드에서 읽는다'
    test: SpringSecurityLessonTest.securityContextHolder
  - claim: '세션 방식: 로그인 뒤 쿠키만으로 200, 쿠키 없으면 401, 로그인 전후 세션 id가 바뀌고, CSRF 토큰 없는 POST는 403'
    how: '쿠키를 저장하는 `HttpClient`로 폼 로그인한다'
    test: SpringSecurityLessonTest.sessionLogin
  - claim: '토큰 방식: 토큰이 맞으면 200, 없거나 틀리면 401, `Set-Cookie`가 없다'
    how: '같은 작은 앱의 다른 체인'
    test: SpringSecurityLessonTest.tokenStateless
  - claim: '같은 비밀번호를 두 번 인코딩하면 다르고 둘 다 `matches`가 `true`이며 `{bcrypt}`로 시작한다'
    how: '`PasswordEncoderFactories.createDelegatingPasswordEncoder()`'
    test: SpringSecurityLessonTest.passwordEncoder
sources:
  - '스프링 시큐리티의 서블릿 구조(필터 체인): https://docs.spring.io/spring-security/reference/servlet/architecture.html'
  - '인가 규칙 `authorizeHttpRequests`: https://docs.spring.io/spring-security/reference/servlet/authorization/authorize-http-requests.html'
  - '`SecurityContextHolder`와 인증 저장: https://docs.spring.io/spring-security/reference/servlet/authentication/architecture.html , https://docs.spring.io/spring-security/reference/servlet/authentication/persistence.html'
  - 'CSRF: https://docs.spring.io/spring-security/reference/servlet/exploits/csrf.html'
  - '비밀번호 저장: https://docs.spring.io/spring-security/reference/features/authentication/password-storage.html'
  - 'JWT 리소스 서버: https://docs.spring.io/spring-security/reference/servlet/oauth2/resource-server/jwt.html'
  - '401과 403의 뜻: RFC 9110 15.5.2, 15.5.4 https://www.rfc-editor.org/rfc/rfc9110'
