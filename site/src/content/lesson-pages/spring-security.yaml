# 인증과 인가 (설계서)
# 자료 파일의 칸은 docs/lesson-data-format.md에 있다.
stage: design
title: 인증과 인가
unit: 스프링
roadmap: S12
type: 동작 확인
prerequisites:
  - {slug: filter-interceptor, title: 필터와 인터셉터}
  - {slug: cookie-session-token, title: 쿠키, 세션, 토큰}
assume: '자바 21, 스프링 부트 3.5(스프링 시큐리티 6.5). 필터가 `DispatcherServlet` 앞에서 모든 요청에 걸리고 요청을 멈출 수 있다는 것(필터와 인터셉터 레슨). 로그인 상태를 세션 쿠키로 유지하는 방식과 요청마다 토큰을 보내는 방식(쿠키, 세션, 토큰 레슨). 요청 하나가 스레드 하나에서 처리된다는 것(서블릿과 톰캣 레슨).'
example: '쇼핑몰 API. `/products`는 누구나, `/orders`는 로그인한 회원만, `/admin`은 관리자만 쓸 수 있다. 같은 규칙을 세션 방식과 토큰 방식으로 각각 설정해 본다.'
intro:
  - '`spring-boot-starter-security`를 넣은 순간 모든 API가 401을 돌려주고, 로그에는 처음 보는 비밀번호가 찍혀요. 규칙을 적고 나니 로그인은 되는데 관리자 화면에서 403이 나요. 401과 403이 무엇이 다르고 어디서 나오는지 모르면 설정을 이것저것 바꿔 보게 돼요.'
  - '스프링 시큐리티는 요청이 컨트롤러에 닿기 전에 필터들로 "누구인가"(인증)와 "해도 되는가"(인가)를 확인해요. 스프링 개발자는 이 필터 체인에 규칙을 적고, 로그인 상태를 세션에 둘지 토큰으로 받을지 고르고, 비밀번호를 어떻게 저장할지 정해요. 면접에서도 "스프링 시큐리티의 동작 과정"과 "세션과 JWT의 차이"를 자주 물어요.'
  - '이 레슨에서는 시큐리티를 켠 작은 앱에서 필터 목록을 출력하고, 로그인하지 않은 요청과 권한이 없는 요청의 응답을 비교하고, 세션 방식과 토큰 방식에서 같은 요청이 어떻게 처리되는지 확인해요.'
covers:
  - topic: '인증은 요청한 사람이 누구인지 확인하는 것, 인가는 그 사람이 이 일을 해도 되는지 정하는 것이다. 인증 실패는 401, 인가 실패는 403'
    where: '질문 1'
  - topic: '스프링 시큐리티는 서블릿 필터 하나(`DelegatingFilterProxy` → `FilterChainProxy`)로 톰캣에 등록되고, 그 안의 `SecurityFilterChain`에 든 필터들을 차례로 부른다'
    where: '질문 2'
  - topic: '주요 필터의 역할: 세션에서 로그인 정보 꺼내기(`SecurityContextHolderFilter`), 로그인 처리(`UsernamePasswordAuthenticationFilter`, `BasicAuthenticationFilter`), 예외를 401과 403으로 바꾸기(`ExceptionTranslationFilter`), 규칙 검사(`AuthorizationFilter`)'
    where: '질문 2'
  - topic: '스타터만 넣으면 모든 요청에 인증을 요구하고, 사용자 `user`와 시작할 때 만든 비밀번호를 준다'
    where: '질문 2'
  - topic: '규칙은 `SecurityFilterChain` 빈에 `authorizeHttpRequests`로 적는다. 위에서부터 처음 맞는 규칙을 쓴다. `permitAll`, `authenticated`, `hasRole`'
    where: '질문 1과 실무에서는'
  - topic: '인증된 사용자는 `SecurityContextHolder`(스레드에 묶인 저장소)의 `Authentication`에 담긴다. 컨트롤러는 `@AuthenticationPrincipal`이나 `Authentication` 인자로 꺼낸다'
    where: '질문 3'
  - topic: '세션 방식: 로그인에 성공하면 `SecurityContext`를 세션에 저장하고, 다음 요청은 `JSESSIONID` 쿠키로 세션에서 다시 꺼낸다'
    where: '질문 3'
  - topic: '토큰 방식: 세션을 만들지 않고(`STATELESS`), 요청마다 `Authorization` 헤더의 토큰을 필터가 검증해 `SecurityContext`를 채운다. 요청이 끝나면 비운다'
    where: '질문 4'
  - topic: 'CSRF 보호는 기본으로 켜져 있다. 쿠키로 로그인 상태를 보내는 세션 방식에는 필요하고, 헤더로 토큰을 보내는 방식에서는 끄는 경우가 많다'
    where: '질문 4'
  - topic: 'JWT 서명 검증은 `spring-boot-starter-oauth2-resource-server`가 해 준다'
    where: '질문 4의 더 알아보기. 토큰의 구조는 쿠키, 세션, 토큰(N7)'
  - topic: '비밀번호는 `PasswordEncoder`(기본 bcrypt)로 해시해 저장한다. 같은 비밀번호도 매번 다른 해시가 나오고 `matches`로 비교한다'
    where: '실무에서는'
  - topic: '메서드에 붙이는 권한 검사 `@PreAuthorize`'
    where: '질문 1의 더 알아보기'
  - topic: 'CSRF와 XSS 공격의 원리'
    where: '다루지 않음: 웹 보안 기초(N10)'
  - topic: 'OAuth2 소셜 로그인(`oauth2Login`)이 필터로 하는 일'
    where: '실무에서는. 소셜 로그인의 흐름 자체는 이 과정에서 다루지 않는다'
  - topic: '시큐리티가 걸린 컨트롤러 테스트(`@WithMockUser`)'
    where: '실무에서는. 테스트 종류는 스프링 테스트(T3)'
codes:
  predict: |-
    @Bean
    SecurityFilterChain api(HttpSecurity http)
        throws Exception {
      http.authorizeHttpRequests(a -> a
          .requestMatchers("/products/**")
              .permitAll()
          .requestMatchers("/admin/**")
              .hasRole("ADMIN")
          .anyRequest().authenticated())
        .httpBasic(Customizer.withDefaults());
      return http.build();
    }
    // 회원 kim(역할 USER)으로
    // GET /admin/stats
  principal: |-
    @GetMapping("/orders")
    List<Order> myOrders(
        @AuthenticationPrincipal
        UserDetails user) {
      return orders.findByUser(
          user.getUsername());
    }
  session: |-
    http
      .formLogin(Customizer.withDefaults())
      .sessionManagement(s -> s
          .sessionCreationPolicy(
              SessionCreationPolicy
                  .IF_REQUIRED));
  stateless: |-
    http
      .csrf(c -> c.disable())
      .sessionManagement(s -> s
          .sessionCreationPolicy(
              SessionCreationPolicy
                  .STATELESS))
      .addFilterBefore(tokenFilter,
          UsernamePasswordAuthenticationFilter
              .class);
  tokenFilter: |-
    protected void doFilterInternal(
        HttpServletRequest req,
        HttpServletResponse res,
        FilterChain chain) ... {
      String h = req.getHeader(
          "Authorization");
      if (h != null
          && h.startsWith("Bearer ")) {
        Authentication a =
            tokens.verify(h.substring(7));
        SecurityContextHolder.getContext()
            .setAuthentication(a);
      }
      chain.doFilter(req, res);
    }
  encoder: |-
    @Bean
    PasswordEncoder passwordEncoder() {
      return PasswordEncoderFactories
          .createDelegatingPasswordEncoder();
    }
predict:
  text: '코드 predict의 규칙에서 회원 kim(역할 USER)이 올바른 아이디와 비밀번호를 보내며 `GET /admin/stats`를 요청해요. 응답은 몇일까요? 보기: 200, 401, 403, 404.'
  answer: '403. 아이디와 비밀번호가 맞아 인증은 됐지만, 관리자 역할이 없어 인가에서 막힌다. 비밀번호를 틀리면 401이다. 질문 1에서 밝힌다.'
questions:
  - id: q1
    title: 인증과 인가는 무엇이 다른가요?
    conclusion:
      lead: '인증은 "누구인가"를 확인하는 것이고, 인가는 "이 사람이 이 일을 해도 되는가"를 정하는 것이에요.'
      sub: '누구인지 모르면 401(Unauthorized), 누구인지는 알지만 허락되지 않았으면 403(Forbidden)이에요. 인증이 먼저고 인가는 그 결과를 써요.'
    says:
      - '코드 predict의 규칙에 요청 네 가지를 보낸다: 로그인 없이 `/products`(200), 로그인 없이 `/orders`(401), kim으로 `/orders`(200), kim으로 `/admin/stats`(403). 예측의 답을 밝힌다. 네 응답을 실제 출력으로 보인다'
      - '401은 이름과 달리 "인증되지 않음"이다. 응답에 `WWW-Authenticate` 헤더가 붙어 어떻게 인증하라고 알려 준다. 403은 다시 로그인해도 소용없다는 뜻이다'
      - '규칙은 위에서부터 읽어 처음 맞는 것을 쓴다. `anyRequest()`는 맨 끝에 둬야 한다. 그 뒤에 규칙을 더하면 시큐리티가 앱을 띄울 때 실패시킨다. 테스트로 확인한 결과를 보인다'
      - '`hasRole("ADMIN")`은 권한 이름 `ROLE_ADMIN`을 찾는다. 역할은 `ROLE_` 접두사를 붙인 권한이라는 관례다'
      - '더 알아보기: URL이 아니라 메서드에 규칙을 붙이려면 `@EnableMethodSecurity`를 켜고 `@PreAuthorize("hasRole(''ADMIN'')")`를 쓴다. 이것도 S9의 프록시로 동작한다'
    asks:
      - '본문의 예시: 코드 predict의 규칙에서 관리자 admin(역할 ADMIN)이 비밀번호를 틀린 채 `/admin/stats`를 요청하면 몇인가 (401. 인증부터 실패한다)'
      - '옮긴 상황: 사내 시스템에서 사원 lee가 로그인한 뒤 다른 부서의 급여 화면을 열자 "권한이 없습니다"가 나온다. 이것은 인증 실패와 인가 실패 가운데 무엇이고 상태 코드는 몇이 맞나 (인가 실패, 403)'
  - id: q2
    title: 스프링 시큐리티는 요청을 어디에서 막나요?
    conclusion:
      lead: '`DispatcherServlet` 앞의 서블릿 필터에서 막아요. 그 필터 하나 안에 시큐리티 필터 열몇 개가 줄지어 있어요.'
      sub: '로그인 정보를 꺼내는 필터, 로그인을 처리하는 필터, 예외를 401과 403으로 바꾸는 필터, 규칙을 검사하는 필터를 차례로 지나요. 막힌 요청은 컨트롤러에 닿지 않아요.'
    says:
      - '톰캣에 등록된 필터 목록을 출력하면 시큐리티는 `springSecurityFilterChain` 하나다(S7의 필터). 이 필터(`DelegatingFilterProxy`)가 스프링 빈 `FilterChainProxy`에 넘기고, `FilterChainProxy`가 요청에 맞는 `SecurityFilterChain`의 필터들을 차례로 부른다'
      - '코드 predict의 체인에 든 필터 목록을 순서대로 출력한다. 실제 출력을 보이고, 이 레슨에서 볼 넷에 표시한다: `SecurityContextHolderFilter`, `BasicAuthenticationFilter`, `ExceptionTranslationFilter`, `AuthorizationFilter`'
      - '막는 순서로 다시 읽는다. 앞의 필터들이 인증을 시도한다(헤더나 세션에서 사용자를 찾는다). 마지막 근처의 `AuthorizationFilter`가 규칙을 검사하고 안 되면 예외를 던진다. 그 바로 앞의 `ExceptionTranslationFilter`가 예외를 받아, 인증이 없으면 401(또는 로그인 페이지로), 있으면 403으로 응답한다'
      - '필터에서 막히므로 컨트롤러는 불리지 않는다. 401 요청에서 컨트롤러가 불린 횟수가 0인 것을 보인다. 그래서 S8의 `@ControllerAdvice`로는 이 401과 403의 모양을 바꿀 수 없다. 바꾸려면 시큐리티의 `AuthenticationEntryPoint`와 `AccessDeniedHandler`를 쓴다'
      - '스타터만 넣고 아무 설정도 없으면 모든 요청이 인증을 요구하고, 사용자 `user`와 시작 로그에 찍힌 임의 비밀번호가 생긴다. 시큐리티의 자동 설정(S4)이 기본 체인과 사용자를 만든 것이다. 내 `SecurityFilterChain` 빈을 만들면 기본 체인은 물러난다'
    widget:
      kind: steps
      note: '시큐리티 필터 다섯 칸(SecurityContextHolder, BasicAuthentication, ExceptionTranslation, Authorization, 그 뒤 DispatcherServlet)을 놓고 요청을 하나씩 통과시킨다. 시나리오 셋: 로그인 없이 `/orders`(Authorization에서 막혀 401), kim으로 `/orders`(통과, 200), kim으로 `/admin/stats`(Authorization에서 막혀 403). 단계마다 `SecurityContext`에 든 사용자 칸을 보인다'
    asks:
      - '본문의 예시: 로그인 없이 `/orders`를 요청했다. 401 응답을 만드는 것은 컨트롤러, `@ControllerAdvice`, 시큐리티 필터 가운데 무엇인가 (시큐리티 필터. `ExceptionTranslationFilter`)'
      - '옮긴 상황: 401 응답 본문을 회사의 에러 형식(`ProblemDetail`)으로 바꾸려고 `@RestControllerAdvice`에 `AuthenticationException` 핸들러를 만들었다. 로그인 없는 요청의 응답이 바뀌나 (바뀌지 않는다. 컨트롤러 전에 필터에서 막혀 어드바이스가 불리지 않는다)'
  - id: q3
    title: 로그인한 사용자 정보는 요청 동안 어디에 있나요?
    conclusion:
      lead: '`SecurityContextHolder`에 있어요. 요청을 처리하는 스레드에 묶인 저장소라서, 같은 요청 안의 어디서든 꺼낼 수 있어요.'
      sub: '세션 방식에서는 로그인에 성공하면 이 정보를 세션에 저장해 두고, 다음 요청에서 `JSESSIONID` 쿠키로 세션을 찾아 다시 넣어요.'
    says:
      - '인증에 성공하면 필터가 `Authentication`(사용자 이름, 권한 목록)을 만들어 `SecurityContextHolder.getContext()`에 넣는다. 기본 저장 방식은 `ThreadLocal`이다. S1에서 본 "한 요청은 한 스레드" 덕분에 필터에서 넣은 값을 컨트롤러와 서비스가 꺼낸다'
      - '컨트롤러는 코드 principal처럼 `@AuthenticationPrincipal`로 받는다. 서비스에서는 `SecurityContextHolder`에서 직접 꺼낸다. 두 곳이 같은 사용자를 보는 것을 테스트로 보인다. S9의 감사 로그가 "누가"를 여기서 읽는다'
      - '요청이 끝나면 필터가 이 저장소를 비운다. 톰캣 스레드는 다음 요청에 다시 쓰이므로(S1), 비우지 않으면 다음 사람이 앞사람으로 보인다'
      - '세션 방식(코드 session): 폼 로그인에 성공하면 `SecurityContext`를 HTTP 세션에 저장하고 `JSESSIONID` 쿠키를 준다. 다음 요청은 아이디와 비밀번호 없이 쿠키만 보내도 `SecurityContextHolderFilter`가 세션에서 꺼내 넣는다. 로그인 요청, 쿠키만 보낸 요청, 쿠키 없는 요청의 응답을 실제 출력으로 보인다(N7의 세션을 스프링이 대신 한다)'
      - '로그인에 성공하면 세션 id를 새로 바꾼다(세션 고정 공격 방어). 로그인 전후 `JSESSIONID`가 다른 것을 보인다'
    asks:
      - '본문의 예시: 컨트롤러에서 `@Async`로 새 스레드에 일을 넘기고 그 스레드에서 `SecurityContextHolder.getContext().getAuthentication()`을 읽으면 무엇이 나오나 (기본 설정에서는 null. 스레드에 묶인 저장소라 새 스레드에 따라가지 않는다)'
      - '옮긴 상황: 세션 방식으로 로그인한 사용자가 브라우저의 쿠키를 지우고 `/orders`를 요청한다. 응답은 (401 또는 로그인 페이지로 이동. 세션을 찾을 쿠키가 없다)'
  - id: q4
    title: 토큰 방식은 세션 방식과 설정이 어떻게 다른가요?
    conclusion:
      lead: '세션을 만들지 않게(`STATELESS`) 하고, 요청마다 `Authorization` 헤더의 토큰을 검증해 `SecurityContextHolder`를 채우는 필터를 체인에 넣어요.'
      sub: '서버가 로그인 상태를 기억하지 않으니 요청마다 토큰을 보내야 해요. 쿠키로 로그인 상태를 보내지 않으므로 CSRF 보호를 끄는 경우가 많아요.'
    says:
      - '코드 stateless와 코드 tokenFilter를 보인다. 토큰 필터는 `OncePerRequestFilter`이고(S7), 헤더의 토큰을 검증해 `Authentication`을 만들어 넣는다. 검증은 예로 단순한 서명 문자열을 쓰고, 실제 JWT는 더 알아보기로 넘긴다'
      - '토큰을 보낸 요청은 200, 토큰 없는 요청은 401, 잘못된 토큰은 401이다. 응답에 `Set-Cookie: JSESSIONID`가 없다. 세션 방식과 같은 요청을 비교한 실제 출력을 보인다'
      - '`STATELESS`는 시큐리티가 세션을 만들지도 읽지도 않게 한다. 그래서 서버를 여러 대로 늘려도 세션을 나눠 가질 필요가 없다(N7에서 본 토큰의 장점)'
      - 'CSRF: 시큐리티는 기본으로 POST 같은 바꾸는 요청에 CSRF 토큰을 요구한다. 세션 방식에서 CSRF 토큰 없이 POST하면 403이다. 브라우저가 쿠키를 자동으로 붙이는 것을 악용하는 공격을 막기 위해서다(N10). 헤더로 토큰을 보내는 API는 브라우저가 자동으로 붙이지 않으므로 끄는 경우가 많다. 세션 방식에서 끄면 안 되는 이유를 한 줄 적는다'
      - '더 알아보기: 실제 JWT는 `spring-boot-starter-oauth2-resource-server`를 넣고 `oauth2ResourceServer(o -> o.jwt(...))`로 켜면 시큐리티가 서명과 만료를 검증하는 필터를 넣어 준다. 직접 필터를 만들 일은 줄어든다(스프링 시큐리티 문서 근거)'
    widget:
      kind: compare
      note: '두 칸은 "세션 방식"과 "토큰 방식". 항목은 로그인 상태를 두는 곳, 다음 요청이 보내는 것, CSRF, 서버를 늘릴 때, 로그아웃. 버튼으로 "두 번째 요청 보내기", "서버 한 대 더", "로그아웃"을 고르면 양쪽에서 달라지는 항목을 강조하고 결과 줄을 보인다'
    asks:
      - '본문의 예시: 코드 stateless의 앱에 토큰 없이 `GET /orders`를 보내면 몇이고, 응답에 `JSESSIONID` 쿠키가 붙나 (401, 붙지 않는다)'
      - '옮긴 상황: 세션 방식의 앱에서 CSRF를 끄지 않았다. 로그인한 브라우저가 CSRF 토큰 없이 `POST /orders`를 보내면 몇인가 (403)'
practice:
  says:
    - '프로젝트의 모양: `SecurityFilterChain` 빈 하나(코드 predict를 다듬은 것), `PasswordEncoder` 빈(코드 encoder), DB의 회원을 읽는 `UserDetailsService`. 회원 가입에서 비밀번호를 `encode`해 저장하고 로그인에서 `matches`로 비교한다. 같은 비밀번호를 두 번 인코딩하면 다른 문자열이 나오고 둘 다 `matches`가 `true`인 것을 테스트로 보인다. 앞에 붙는 `{bcrypt}`가 어떤 방식인지 알려 주는 표시다'
    - '흔한 실수 하나: 비밀번호를 평문이나 SHA-256 한 번으로 저장한다. 유출되면 바로 쓰이거나 미리 계산한 표로 풀린다. bcrypt는 소금과 반복으로 느리게 만든 해시다(스프링 시큐리티 문서 근거)'
    - '흔한 실수 둘: `requestMatchers("/admin/**").hasRole("ADMIN")`보다 `anyRequest().permitAll()`을 위에 둔다. 시큐리티 6에서는 앱이 뜨지 않게 막아 준다. 질문 1의 테스트를 가리킨다'
    - '흔한 실수 셋: 세션 방식인데 "API라서" CSRF를 끈다. 브라우저 쿠키로 로그인하는 한 CSRF 공격이 그대로 통한다'
    - '시큐리티가 걸린 컨트롤러를 테스트하는 법: `spring-security-test`의 `@WithMockUser(roles = "ADMIN")`를 붙이면 그 사용자로 로그인한 것처럼 `SecurityContextHolder`가 채워진다. MockMvc로 USER와 ADMIN의 `/admin/stats` 응답(403, 200)을 비교한 테스트를 보인다. `@SpringBootTest`와 슬라이스 테스트는 T3에서 다룬다'
    - '소셜 로그인은 `spring-boot-starter-oauth2-client`와 `oauth2Login()`이다. 이것도 필터를 더한다: 로그인 시작 주소로 오면 소셜 로그인 화면으로 보내는 필터, 돌아온 코드를 토큰으로 바꿔 `Authentication`을 만드는 필터. 공식 문서 근거로 이름만 적는다'
claims:
  - claim: '로그인 없이 `/products`는 200, `/orders`는 401, USER로 `/orders`는 200, USER로 `/admin/stats`는 403, 비밀번호가 틀리면 401'
    how: '`spring-boot-starter-security`를 testImplementation으로 넣고, `MiniWeb`처럼 필요한 자동 설정만 켠 작은 앱에 `@EnableWebSecurity` 설정과 메모리 사용자를 넣어 HTTP 기본 인증으로 요청한다. 다른 레슨의 `@SpringBootTest`에 시큐리티가 켜지지 않게 `application.yml`에서 시큐리티 자동 설정을 끄고, 이 테스트의 앱은 직접 켠다'
  - claim: '`anyRequest()` 뒤에 규칙을 더하면 앱이 뜨지 않는다'
    how: '그 설정으로 띄워 예외를 본다'
  - claim: '톰캣에는 `springSecurityFilterChain` 하나가 등록되고, 체인 안의 필터 목록에 `SecurityContextHolderFilter`, `BasicAuthenticationFilter`, `ExceptionTranslationFilter`, `AuthorizationFilter`가 이 순서로 있다'
    how: '`FilterChainProxy.getFilterChains()`의 필터 이름을 출력한다'
  - claim: '401 요청에서 컨트롤러와 `@RestControllerAdvice`는 불리지 않는다'
    how: '호출 수를 센다'
  - claim: '필터에서 넣은 사용자를 컨트롤러의 `@AuthenticationPrincipal`과 서비스의 `SecurityContextHolder`가 함께 본다. 요청이 끝난 뒤 그 스레드의 저장소는 비어 있다'
    how: '응답에 둘을 담는다. 비는 것은 필터 뒤에서 확인한다'
  - claim: '새 스레드에서는 `SecurityContextHolder`가 비어 있다'
    how: '컨트롤러에서 새 스레드를 띄워 읽는다'
  - claim: '세션 방식: 로그인 뒤 쿠키만으로 200, 쿠키 없으면 401(또는 302), 로그인 전후 세션 id가 바뀐다'
    how: '`HttpClient`로 쿠키를 다룬다'
  - claim: '토큰 방식: 토큰이 맞으면 200, 없거나 틀리면 401, `Set-Cookie`가 없다'
    how: '같은 작은 앱의 다른 체인'
  - claim: '세션 방식에서 CSRF 토큰 없는 POST는 403'
    how: '로그인한 쿠키로 POST'
  - claim: '같은 비밀번호를 두 번 인코딩하면 다르고 둘 다 `matches`가 `true`이며 `{bcrypt}`로 시작한다'
    how: '`PasswordEncoderFactories.createDelegatingPasswordEncoder()`'
sources:
  - '스프링 시큐리티의 서블릿 구조(필터 체인): https://docs.spring.io/spring-security/reference/servlet/architecture.html'
  - '인가 규칙 `authorizeHttpRequests`: https://docs.spring.io/spring-security/reference/servlet/authorization/authorize-http-requests.html'
  - '`SecurityContextHolder`와 인증 저장: https://docs.spring.io/spring-security/reference/servlet/authentication/architecture.html , https://docs.spring.io/spring-security/reference/servlet/authentication/persistence.html'
  - 'CSRF: https://docs.spring.io/spring-security/reference/servlet/exploits/csrf.html'
  - '비밀번호 저장: https://docs.spring.io/spring-security/reference/features/authentication/password-storage.html'
  - 'JWT 리소스 서버: https://docs.spring.io/spring-security/reference/servlet/oauth2/resource-server/jwt.html'
  - '401과 403의 뜻: RFC 9110 15.5.2, 15.5.4 https://www.rfc-editor.org/rfc/rfc9110'
