# 빈의 생명주기와 스코프
# 자료 파일의 칸은 docs/lesson-data-format.md에 있다. 문제는 content/questions/bean-lifecycle-scope.yaml에 있다.
title: 빈의 생명주기와 스코프
description: 빈이 만들어지고 사라지는 순서, 초기화 코드를 @PostConstruct에 두는 이유, 싱글톤 빈에 상태를 두면 생기는 일, 요청마다 새 객체가 필요할 때의 스코프. 네 가지 질문에 스스로 답할 수 있게 컨테이너를 열고 닫으며 순서를 찍고 동시에 올린 숫자가 사라지는 것을 보는 대화형 레슨.
unit: 스프링
minutes: 20
roadmap: S3
type: 동작 확인
prerequisites:
  - {slug: spring-beans, title: 스프링 빈과 의존성 주입}
assume: '자바 21, 스프링 부트 3.5. 빈은 기본으로 하나만 만들어 모든 곳에 같은 객체를 넣는다는 것(스프링 빈과 의존성 주입 레슨). static 필드와 객체 필드의 차이(static과 초기화 순서 레슨). 여러 스레드가 같은 변수를 함께 바꾸면 값이 틀어질 수 있다는 것은 이 레슨에서 한 번 보여요.'
example: '자주 바뀌지 않는 쿠폰 정책을 시작할 때 읽어 두는 `CouponPolicyCache`와, 하루 주문 수를 세는 `OrderCounter`. 캐시로 생명주기를, 카운터로 싱글톤 빈의 상태 문제를, 장바구니 `Cart`로 스코프를 본다.'
intro:
  - '주문 수를 세려고 서비스에 `int count` 필드를 두었어요. 혼자 눌러 볼 때는 정확한데, 운영에서 하루가 지나고 보니 실제 주문 수보다 적어요. 또 시작할 때 캐시를 채우려고 생성자에서 주입받은 리포지토리를 썼더니 null이 나와요.'
  - '스프링 빈은 컨테이너가 정한 때에 만들어지고, 정한 순서로 값이 채워지고, 앱이 끝날 때 정리돼요. 하나만 만들어진 빈은 모든 요청 스레드가 동시에 써요. 언제 무엇을 해도 되는지, 빈에 무엇을 두면 안 되는지는 이 생명주기와 스코프에서 나와요.'
  - '이 레슨에서는 생성자, 주입, `@PostConstruct`, `@PreDestroy`가 불리는 순서를 출력으로 보고, 싱글톤 빈의 필드를 여러 스레드가 함께 올렸을 때 사라지는 숫자를 세요.'
covers:
  - topic: '빈의 생명주기: 객체 생성(생성자) → 의존성 주입(필드, 세터) → 초기화 콜백(`@PostConstruct`) → 사용 → 컨테이너 종료 때 소멸 콜백(`@PreDestroy`)'
    where: '질문 1'
  - topic: '소멸은 만든 순서의 반대로 한다. 나를 쓰는 빈이 먼저 정리된다'
    where: '질문 1'
  - topic: '`@PostConstruct`는 모든 주입이 끝난 뒤에 불린다. 필드 주입이나 세터 주입 값은 생성자에서 아직 null이다'
    where: '질문 2'
  - topic: '생성자 주입이면 생성자에서 받은 값을 바로 쓸 수 있다. 그래도 무거운 초기화(파일 읽기, 캐시 채우기)는 생성자보다 `@PostConstruct`나 시작 완료 뒤(`ApplicationRunner`)에 둔다'
    where: '질문 2와 실무에서는'
  - topic: '`@PostConstruct`에서 예외가 나면 앱이 뜨지 않는다'
    where: '질문 2'
  - topic: '`@Bean(initMethod, destroyMethod)`와 `InitializingBean`, `DisposableBean`도 같은 자리에서 불린다. 라이브러리 객체를 정리할 때 `@Bean`의 `destroyMethod`를 쓴다'
    where: '질문 1의 더 알아보기'
  - topic: '싱글톤 빈은 모든 요청 스레드가 함께 쓴다. 필드에 바뀌는 값을 두면 동시에 바꿀 때 값이 사라지거나 다른 사용자의 값이 섞인다'
    where: '질문 3'
  - topic: '싱글톤 빈은 상태가 없게 만든다: 요청마다 다른 값은 매개변수와 지역 변수로, 꼭 함께 세야 하는 값은 `AtomicLong`이나 DB로'
    where: '질문 3'
  - topic: '`static` 필드에 바뀌는 값을 두어도 같은 문제가 생긴다(J5)'
    where: '질문 3'
  - topic: '스코프: 싱글톤(기본), 프로토타입(꺼낼 때마다 새 객체), 웹의 request와 session 스코프'
    where: '질문 4'
  - topic: '프로토타입 빈을 싱글톤 빈에 주입하면 주입할 때 한 번만 만들어져 늘 같은 객체가 쓰인다. 꺼낼 때마다 새로 받으려면 `ObjectProvider`'
    where: '질문 4'
  - topic: '컨테이너는 프로토타입 빈의 `@PreDestroy`를 부르지 않는다'
    where: '질문 4의 더 알아보기'
  - topic: 'request 스코프 빈을 싱글톤에 넣을 때 프록시를 쓴다(`proxyMode`)'
    where: '질문 4의 더 알아보기. 프록시는 AOP(S9)'
  - topic: '여러 스레드가 함께 쓰는 값을 안전하게 바꾸는 법(락, 원자 변수)의 원리'
    where: '다루지 않음: 운영체제와 동시성 과정(C3, C6)'
links:
  test: https://github.com/wanja727/dev-lessons/blob/main/verification/src/test/java/lab/devlessons/beanlifecycle/BeanLifecycleTest.java
  callbacks: https://docs.spring.io/spring-framework/reference/core/beans/factory-nature.html
  scopes: https://docs.spring.io/spring-framework/reference/core/beans/factory-scopes.html
  runner: https://docs.spring.io/spring-boot/reference/features/spring-application.html#features.spring-application.command-line-runner
  graceful: https://docs.spring.io/spring-boot/reference/web/graceful-shutdown.html
codes:
  predict: |-
    @Service
    public class OrderCounter {
      private int count = 0;

      public void increase() {
        count++;
      }

      public int count() {
        return count;
      }
    }
    // 스레드 2개가 increase()를
    // 각각 10,000번 부른다
  lifecycle: |-
    @Component
    public class CouponPolicyCache {
      @Autowired
      private CouponRepository repository;

      public CouponPolicyCache() {
        log("생성자 repository="
            + repository);
      }

      [[@PostConstruct]]
      void load() {
        log("@PostConstruct repository="
            + repository);
      }

      [[@PreDestroy]]
      void close() {
        log("@PreDestroy");
      }
    }
  ctorInjection: |-
    @Component
    public class CouponPolicyCache {
      private final CouponRepository repository;

      public CouponPolicyCache(
          CouponRepository repository) {
        this.repository = repository;
      }

      @PostConstruct
      void load() {
        policies = repository.findAll();
      }
    }
  atomic: |-
    @Service
    public class OrderCounter {
      private final AtomicLong count =
          new AtomicLong();

      public void increase() {
        [[count.incrementAndGet();]]
      }
    }
  stateful: |-
    @Service
    public class GreetingService {
      [[private String userName;]]

      public String greet(String name) {
        this.userName = name;
        audit();
        return "안녕하세요 " + userName;
      }
    }
  stateless: |-
    @Service
    public class GreetingService {
      public String greet(String name) {
        audit();
        return "안녕하세요 " + name;
      }
    }
  prototype: |-
    @Component
    [[@Scope("prototype")]]
    public class Cart {
      final List<String> items =
          new ArrayList<>();
    }

    @Service
    public class CartService {
      private final Cart cart;

      public CartService(Cart cart) {
        this.cart = cart;
      }
    }
  provider: |-
    @Service
    public class CartService {
      private final ObjectProvider<Cart>
          carts;

      public CartService(
          ObjectProvider<Cart> carts) {
        this.carts = carts;
      }

      public Cart newCart() {
        return [[carts.getObject()]];
      }
    }
  requestScope: |-
    @Component
    [[@RequestScope]]
    public class TraceContext {
      private final String id = newId();

      public String id() {
        return id;
      }
    }
  runner: |-
    @Component
    class WarmUp implements ApplicationRunner {
      @Override
      public void run(
          ApplicationArguments args) {
        cache.load();
        pgClient.ping();
      }
    }
  destroy: |-
    @Bean(destroyMethod = "shutdown")
    ExecutorService mailExecutor() {
      return Executors.newFixedThreadPool(4);
    }
predict:
  title: 두 스레드가 1만 번씩 올리면 몇이 될까요?
  text: '코드 predict의 `OrderCounter`는 싱글톤 빈이에요. 스레드 두 개가 같은 빈의 `increase()`를 각각 1만 번 부르고 둘 다 끝난 뒤 `count()`를 읽어요. 몇이 나올까요? 답은 질문 3에 나와요.'
  code: predict
  label: 내 예측
  options:
    - {value: a, label: 늘 20000}
    - {value: b, label: 늘 10000}
    - {value: c, label: 20000보다 작을 때가 많다}
    - {value: d, label: 예외가 난다}
  answer: c
  storageKey: bl-predict
  wrong: 예측은 "{label}"이었어요. 틀린 예측이 더 오래 남으니 괜찮아요.
questions:
  - id: q1
    title: 빈은 어떤 순서로 만들어지고 사라지나요?
    conclusion:
      lead: '생성자로 만들고, 의존성을 넣고, `@PostConstruct`를 부른 뒤에 쓰이기 시작해요. 앱이 끝날 때 `@PreDestroy`를 부르고 사라져요.'
      sub: '사라질 때는 만든 순서의 반대예요. 다른 빈을 쓰는 빈이 먼저 정리되니, 정리하는 동안 아직 쓰는 빈이 살아 있어요.'
    says:
      - '코드 lifecycle을 띄웠다가 닫으며 찍은 출력을 보인다. 생성자, `@PostConstruct`, (사용), `@PreDestroy` 순서다'
      - '네 단계를 한 줄씩: 생성(생성자, 생성자 주입이면 이때 받는다), 주입(`@Autowired` 필드와 세터), 초기화 콜백(`@PostConstruct`), 소멸 콜백(`@PreDestroy`, 컨테이너가 닫힐 때)'
      - '`A`가 `B`를 쓰면 만들 때는 `B`가 먼저, 정리할 때는 `A`가 먼저다. 두 빈의 `@PreDestroy` 출력 순서로 보인다'
      - '컨테이너는 앱이 정상으로 끝날 때 닫힌다(`main`이 끝나거나 종료 신호를 받을 때). 프로세스를 강제로 죽이면 `@PreDestroy`는 불리지 않는다'
      - '더 알아보기: `@PostConstruct` 대신 `@Bean(initMethod = "start", destroyMethod = "stop")`, `InitializingBean`과 `DisposableBean`도 같은 자리에서 불린다. 내 코드에 어노테이션을 붙일 수 없는 라이브러리 객체는 `destroyMethod`를 쓴다. `@Bean`은 `close`나 `shutdown` 메서드가 있으면 따로 적지 않아도 종료 때 부른다'
    widget:
      kind: steps
      note: '`CouponRepository`와 `CouponPolicyCache` 두 빈을 놓고 컨테이너의 단계를 하나씩 넘긴다: Repository 생성, Cache 생성(repository 칸은 null), Cache에 주입(repository 칸이 채워짐), Cache의 `@PostConstruct`, 사용 중, 종료 신호, Cache의 `@PreDestroy`, Repository 정리. 단계마다 두 빈의 상태 칸을 바꾼다'
    asks:
      - '본문의 예시: 코드 lifecycle의 출력에서 `@PostConstruct` 줄과 생성자 줄 가운데 무엇이 먼저 나오나 (생성자 줄)'
      - '옮긴 상황: `ReportService`가 `MailClient`를 쓴다. 둘 다 `@PreDestroy`가 있다. 앱을 정상 종료하면 어느 것의 `@PreDestroy`가 먼저 불리나 (`ReportService`. 만든 순서의 반대다)'
    body:
      - p: '쿠폰 정책을 시작할 때 DB에서 읽어 두는 캐시예요. 리포지토리는 필드로 주입받고, 생성자와 두 콜백에서 한 줄씩 남겨요.'
      - code: lifecycle
        notes:
          - mark: '@PostConstruct'
            as: anno
            text: '주입이 모두 끝난 뒤 한 번 불러 달라는 표시예요.'
          - mark: '@PreDestroy'
            as: anno
            text: '컨테이너가 닫힐 때 불러 달라는 표시예요.'
      - p: '먼저 한 단계씩 따라가 보세요.'
      - widget:
          kind: steps
          layout: [duo, log, buttons, verdict]
          initial:
            duo:
              - {label: CouponRepository, state: dim, text: 아직 없음}
              - {label: CouponPolicyCache, state: dim, text: 아직 없음}
          scenarios:
            default:
              - log: 'CouponRepository 생성자 (Cache가 받을 것이라 먼저)'
                duo:
                  - {label: CouponRepository, rows: [{k: 상태, v: 만들어짐, mark: changed}]}
                  - {label: CouponPolicyCache, state: dim, text: 아직 없음}
              - log: 'CouponPolicyCache 생성자 repository=null'
                duo:
                  - {label: CouponRepository, rows: [{k: 상태, v: 만들어짐}]}
                  - {label: CouponPolicyCache, rows: [{k: repository, v: 'null', mark: bad}]}
              - log: '(컨테이너가 @Autowired 필드에 주입)'
                duo:
                  - {label: CouponRepository, rows: [{k: 상태, v: 만들어짐}]}
                  - {label: CouponPolicyCache, rows: [{k: repository, v: CouponRepository, mark: changed}]}
              - log: 'CouponPolicyCache @PostConstruct repository=CouponRepository'
              - log: '(사용 중: 요청을 받는다)'
              - log: '(종료 신호. 컨테이너를 닫는다)'
              - log: 'CouponPolicyCache @PreDestroy (나중에 만든 것부터)'
                duo:
                  - {label: CouponRepository, rows: [{k: 상태, v: 아직 살아 있음}]}
                  - {label: CouponPolicyCache, rows: [{k: 상태, v: 정리됨, mark: changed}]}
              - log: 'CouponRepository @PreDestroy'
                duo:
                  - {label: CouponRepository, rows: [{k: 상태, v: 정리됨, mark: changed}]}
                  - {label: CouponPolicyCache, rows: [{k: 상태, v: 정리됨}]}
                verdict: '만들 때는 받을 것이 먼저, 정리할 때는 쓰는 쪽이 먼저예요. 캐시가 정리되는 동안 리포지토리는 아직 살아 있어요.'
      - p: '실제로 컨테이너를 열고 닫은 출력이에요.'
      - ci:
          key: lifecycle
          label: 실제 출력 보기
          source: BeanLifecycleTest.lifecycleOrder
          code: lifecycle
      - p: '빈 하나의 일생은 네 단계예요.'
      - ol:
          - '**생성:** 생성자를 불러 객체를 만들어요. 생성자로 받는 의존성은 이때 들어와요.'
          - '**주입:** `@Autowired`가 붙은 필드와 세터에 값을 넣어요.'
          - '**초기화 콜백:** `@PostConstruct` 메서드를 한 번 불러요. 이제 빈이 쓰일 준비가 됐어요.'
          - '**소멸 콜백:** 컨테이너가 닫힐 때 `@PreDestroy` 메서드를 불러요.'
      - p: '정리 순서는 만든 순서의 **반대**예요. `CouponPolicyCache`가 `CouponRepository`를 쓰니까, 캐시가 정리를 마칠 때까지 리포지토리는 살아 있어야 해요.'
      - p: '컨테이너는 앱이 정상으로 끝날 때 닫혀요. `main`이 끝나거나 운영체제가 종료 신호를 보낼 때예요. 프로세스를 강제로 죽이면(`kill -9`) `@PreDestroy`는 불리지 않아요.'
      - more:
          summary: '더 알아보기: 어노테이션을 붙일 수 없는 객체는'
          body:
            - p: '`InitializingBean`과 `DisposableBean` 인터페이스를 구현하거나, `@Bean`에 `initMethod`와 `destroyMethod`를 적어도 같은 자리에서 불려요. 라이브러리 객체는 코드를 고칠 수 없으니 `@Bean`의 `destroyMethod`를 써요.'
            - code: destroy
            - p: '`@Bean`은 돌려준 객체에 `close`나 `shutdown` 메서드가 있으면 적지 않아도 종료 때 불러 줘요([근거](link:callbacks)).'
      - quiz:
          q: '`ReportService`가 `MailClient`를 써요. 둘 다 `@PreDestroy`가 있어요. 앱을 정상 종료하면 어느 쪽이 먼저 불릴까요?'
          options:
            - '`ReportService`'
            - '`MailClient`'
            - 정해지지 않는다
          answer: 1
          explain: '정리는 만든 순서의 반대예요. `MailClient`를 먼저 만들어 `ReportService`에 넣었으니, 정리는 `ReportService`가 먼저예요.'
      - next: '생성자에서 `repository`는 null이었어요. 그러면 시작할 때 할 일은 생성자에 두면 안 되는 걸까요?'
    recall: '빈은 생성자로 만들고, @Autowired 필드와 세터에 주입하고, @PostConstruct를 한 번 부른 뒤 쓰여요. 컨테이너가 닫힐 때 @PreDestroy를 불러요. 만들 때는 받을 빈이 먼저, 정리할 때는 만든 순서의 반대라서 다른 빈을 쓰는 쪽이 먼저 정리돼요. 강제로 죽이면 @PreDestroy는 불리지 않아요.'
  - id: q2
    title: 초기화 코드는 생성자가 아니라 왜 @PostConstruct에 두나요?
    conclusion:
      lead: '생성자가 불릴 때는 필드 주입이 아직 끝나지 않았고, `@PostConstruct`는 모든 주입이 끝난 뒤에 불리기 때문이에요.'
      sub: '생성자 주입이면 생성자에서 받은 값은 쓸 수 있어요. 그래도 주입이 다 끝난 뒤 한 번 할 일은 `@PostConstruct`에 두는 것이 정해진 자리예요. 여기서 예외가 나면 앱이 뜨지 않아요.'
    says:
      - '코드 lifecycle의 출력에서 생성자 줄은 `repository=null`, `@PostConstruct` 줄은 객체가 찍힌다. 필드 주입은 객체를 만든 뒤에 하기 때문이다'
      - '생성자 주입으로 바꾸면 생성자에서도 `repository`를 쓸 수 있다. 받은 매개변수이기 때문이다. 이 레슨이 생성자 주입을 쓰라는 S2의 이유를 하나 더한다'
      - '`@Value`로 받는 설정 값과 세터 주입도 필드 주입과 같다. 생성자 밖에서 받은 값은 `@PostConstruct`에서부터 쓸 수 있다'
      - '`@PostConstruct`에서 예외를 던지면 컨텍스트가 뜨지 않는다. 캐시를 채우지 못한 채 요청을 받는 것보다 낫다. 원인 예외가 `BeanCreationException`으로 감싸져 나오는 것을 보인다'
      - '`@PostConstruct`가 불릴 때 다른 빈이 모두 준비된 것은 아니다. 이 빈이 받은 빈만 준비되어 있다. 앱 전체가 뜬 뒤 할 일(외부 서버 연결 확인, 미리 데우기)은 실무 구역의 `ApplicationRunner`에 둔다'
    asks:
      - '본문의 예시: 필드에 `@Value("${coupon.max}") int max`를 두고 생성자에서 `max`를 읽으면 무엇이 나오나 (0. 아직 주입 전이라 int의 기본값이다)'
      - '옮긴 상황: 시작할 때 외부 파일에서 금칙어 목록을 읽는 `@PostConstruct`가 파일이 없어 예외를 던진다. 앱은 뜨나 (뜨지 않는다. 빈 생성이 실패한다)'
    body:
      - p: '질문 1의 출력에서 생성자 줄은 `repository=null`이었어요. 자바는 객체를 다 만든 뒤에야 그 객체의 필드에 값을 넣을 수 있어요. 컨테이너도 마찬가지라서 **생성자가 끝난 뒤에** `@Autowired` 필드를 채워요. 생성자 안에서 필드 주입한 것을 쓰면 null이에요.'
      - p: '`@Value`로 받는 설정 값도 필드라면 같아요. `@Value("${coupon.max}") int max`를 생성자에서 읽으면 int의 기본값 **0**이고, `@PostConstruct`에서 읽으면 설정한 50이에요. 테스트로 확인했어요.'
      - p: '`@PostConstruct`는 **모든 주입이 끝난 뒤** 한 번 불려요. 그래서 "받은 것을 써서 처음 한 번 할 일"은 여기에 둬요.'
      - h3: 생성자 주입이면 생성자에서도 쓸 수 있어요
      - code: ctorInjection
      - p: '생성자로 받으면 `repository`는 매개변수라서 생성자 안에서 이미 있어요. [스프링 빈과 의존성 주입](lesson:spring-beans) 레슨에서 생성자 주입을 권한 이유가 하나 더 생긴 셈이에요. 그래도 DB를 읽어 캐시를 채우는 일은 `@PostConstruct`에 두는 편이 읽기 쉬워요. 생성자는 받은 것을 필드에 담는 일만 하고, 일을 시작하는 곳은 따로 두는 거예요.'
      - h3: 여기서 실패하면 앱이 뜨지 않아요
      - p: '시작할 때 금칙어 파일을 읽는 `@PostConstruct`가, 파일이 없어 예외를 던지게 했어요.'
      - ci:
          key: post-construct-fail
          label: 실제 결과 보기
          source: BeanLifecycleTest.postConstructFailureStopsStartup
      - p: '빈을 만들다 실패했다며 컨테이너가 뜨지 않아요. 원인 예외의 메시지가 그대로 따라와요. 캐시가 비어 있는 채로 요청을 받는 것보다, 시작할 때 실패해서 바로 아는 편이 나아요.'
      - p: '한 가지 주의할 점이 있어요. `@PostConstruct`가 불릴 때 준비된 것은 **이 빈이 받은 빈**뿐이에요. 앱 전체가 다 뜬 것은 아니에요. 다 뜬 뒤에 할 일은 실무 구역의 `ApplicationRunner`에 둬요.'
      - quiz:
          q: '필드에 `@Value("${coupon.max}") int max`를 두고 설정은 `coupon.max=50`이에요. 생성자 안에서 `max`를 읽으면?'
          options:
            - '50'
            - '0'
            - '예외가 난다'
          answer: 2
          explain: '필드 주입은 생성자가 끝난 뒤에 해요. 생성자 안에서는 아직 int의 기본값 0이에요. `@PostConstruct`에서 읽으면 50이에요.'
      - next: '빈은 하나만 만들어져 모든 요청이 함께 써요. 그 빈의 필드에 값을 두면 어떻게 될까요?'
    recall: '필드 주입과 @Value 필드는 생성자가 끝난 뒤에 채워져서 생성자 안에서는 null이나 0이에요. @PostConstruct는 모든 주입이 끝난 뒤 한 번 불려서 받은 것을 써서 처음 할 일을 둬요. 생성자 주입이면 생성자에서도 쓸 수 있어요. @PostConstruct에서 예외가 나면 BeanCreationException으로 앱이 뜨지 않아요.'
  - id: q3
    title: 싱글톤 빈의 필드에 값을 두면 무슨 일이 생기나요?
    conclusion:
      lead: '모든 요청 스레드가 같은 객체의 같은 필드를 함께 바꿔서, 숫자가 사라지거나 다른 사용자의 값이 섞여요.'
      sub: '싱글톤 빈은 상태가 없게 만들어요. 요청마다 다른 값은 매개변수와 지역 변수로 넘기고, 꼭 함께 세야 하는 값은 `AtomicLong`이나 DB에 둬요.'
    says:
      - '코드 predict를 돌린다. 스레드 두 개가 1만 번씩 올려도 결과가 20000보다 작다. 예측의 답을 밝힌다. 다섯 번 돌린 실제 결과를 보인다'
      - '`count++`는 한 걸음이 아니다. 필드를 읽고, 1을 더하고, 필드에 쓴다. 두 스레드가 같은 값 7을 읽고 둘 다 8을 쓰면 한 번이 사라진다. 원리는 C3에서 자세히 본다'
      - '숫자만이 아니다. 코드 stateful은 요청의 사용자 이름을 필드에 둔다. 두 요청이 동시에 오면 kim의 요청이 lee의 이름으로 인사를 받을 수 있다. 두 스레드를 엇갈리게 멈춰 그 순간을 만든 테스트를 보인다'
      - '고치는 법: 요청마다 다른 값은 필드에 두지 않고 매개변수와 지역 변수로 넘긴다. 지역 변수는 스레드마다 따로다(S1의 질문 4와 같은 이유). 꼭 함께 세야 하면 코드 atomic의 `AtomicLong`을 쓴다. 고친 코드로 다시 돌리면 늘 20000이다'
      - '`final` 필드에 다른 빈이나 바뀌지 않는 설정을 두는 것은 괜찮다. 바뀌지 않으니 함께 써도 된다. 문제는 바뀌는 값이다'
      - '`static` 필드도 같다. 클래스에 딸린 값 하나를 모든 스레드가 함께 쓴다(J5)'
      - 'O7의 전략 빈(할인 정책 구현들)도 싱글톤이다. 전략 객체에 계산 중간값을 필드로 두면 같은 문제가 생긴다. 전략은 입력을 받아 결과를 돌려주기만 하게 만든다'
    asks:
      - '본문의 예시: 코드 atomic의 `OrderCounter`를 스레드 두 개가 1만 번씩 올리면 결과는 늘 20000인가 (그렇다. `incrementAndGet`은 끊기지 않고 한 번에 올린다)'
      - '옮긴 상황: 싱글톤 `@Service`에 `private List<String> errors = new ArrayList<>()` 필드를 두고 요청마다 검증 오류를 담았다가 응답에 쓰고 비운다. 동시에 두 요청이 오면 무엇이 생길 수 있나 (한 요청의 응답에 다른 요청의 오류가 섞인다. 리스트도 깨질 수 있다)'
      - '실무 구역: 코드 stateful의 `userName` 필드를 지우고 `name`을 지역 변수로만 쓰면 섞이는 문제가 사라지나 (사라진다)'
    body:
      - p: '예측한 코드를 다섯 번 돌렸어요. 매번 새 컨테이너를 띄우고 스레드 두 개가 같은 `OrderCounter` 빈을 1만 번씩 올렸어요. 같은 횟수를 `AtomicLong`으로 센 결과도 함께 남겼어요.'
      - ci:
          key: counter
          label: 실제 결과 보기
          source: BeanLifecycleTest.singletonStateLosesUpdates
          code: predict
      - p: '`int` 쪽은 20000이 안 될 때가 많아요. {{predict-result}} 몇 번이 사라질지는 돌릴 때마다 달라요. 운 좋게 20000이 나오는 판도 있어서 혼자 테스트할 때는 못 찾아요.'
      - h3: count++는 세 걸음이에요
      - p: '`count++`는 필드를 **읽고**, 1을 **더하고**, 필드에 **쓰는** 세 걸음이에요. 두 스레드가 같은 순간에 7을 읽으면 둘 다 8을 써요. 두 번 올렸는데 한 번만 오른 거예요. 빈이 하나라서 필드도 하나이고, 모든 요청 스레드가 이 필드를 함께 써요. 원리는 [경쟁 상태와 동기화](lesson:synchronization) 레슨에서 자세히 봐요.'
      - h3: 숫자만이 아니에요
      - code: stateful
        notes:
          - mark: 'private String userName;'
            as: code
            text: '빈이 하나라서 이 필드도 하나예요.'
      - p: 'kim의 요청이 `userName`에 kim을 넣고 `audit()`을 하는 사이에, lee의 요청이 같은 필드에 lee를 넣었어요. 두 스레드를 그 순간에 멈춰 엇갈리게 만든 결과예요.'
      - ci:
          key: stateful
          label: 실제 결과 보기
          source: BeanLifecycleTest.statefulSingletonMixesUsers
      - p: 'kim이 lee의 인사를 받았어요. 주문 화면이었다면 남의 주문 내역이 보였을 거예요. [서블릿과 톰캣](lesson:servlet-tomcat)에서 본 서블릿 필드와 똑같은 문제예요.'
      - h3: 상태가 없게 만들어요
      - code: stateless
      - p: '요청마다 다른 값은 필드에 두지 않고 **매개변수와 지역 변수**로 넘겨요. 지역 변수는 스레드마다 따로 생겨서 섞이지 않아요. 고친 코드는 같은 테스트에서 늘 자기 이름을 돌려줬어요.'
      - code: atomic
        notes:
          - mark: count.incrementAndGet();
            as: code
            text: '읽고 더하고 쓰는 일을 끊기지 않고 한 번에 해요. 다섯 번 모두 20000이었어요.'
      - p: '여럿이 꼭 함께 세야 하는 값이면 `AtomicLong`을 써요. 다만 서버가 두 대면 각자 세고, 재시작하면 0이 돼요. 실무 구역에서 다시 봐요.'
      - p: '괜찮은 필드도 있어요. 생성자로 받은 다른 빈과 바뀌지 않는 설정을 담은 `final` 필드는 아무도 바꾸지 않으니 함께 써도 돼요. 문제는 **바뀌는** 값이에요. `static` 필드도 클래스에 하나라서 같은 문제가 생겨요. 할인 정책처럼 전략 패턴으로 만든 빈도 싱글톤이니, 계산 중간값을 필드에 두지 말고 입력을 받아 결과만 돌려주게 만들어요.'
      - quiz:
          q: '싱글톤 `@Service`에 `private List<String> errors = new ArrayList<>()`를 두고, 요청마다 검증 오류를 담았다가 응답에 쓰고 비워요. 두 요청이 동시에 오면?'
          options:
            - 요청마다 리스트가 따로라 괜찮다
            - 한 요청의 응답에 다른 요청의 오류가 섞일 수 있다
            - 두 번째 요청은 첫 요청이 끝날 때까지 기다린다
          answer: 2
          explain: '빈이 하나라서 `errors` 리스트도 하나예요. 두 요청이 같은 리스트에 담고 비우니 섞여요. 리스트를 메서드 안의 지역 변수로 만들어요.'
      - next: '그러면 요청마다 정말로 새 객체가 필요할 때는 어떻게 할까요?'
    recall: '싱글톤 빈은 모든 요청 스레드가 같은 객체를 쓰므로, 필드에 바뀌는 값을 두면 count++ 같은 값이 사라지고 다른 사용자의 값이 섞여요. count++는 읽고 더하고 쓰는 세 걸음이라 두 스레드가 같은 값을 읽으면 한 번이 사라져요. 요청마다 다른 값은 매개변수와 지역 변수로 넘기고, 함께 세야 하면 AtomicLong이나 DB를 써요. final로 받은 빈과 설정은 괜찮아요.'
  - id: q4
    title: 요청마다 새 객체가 필요하면 어떻게 하나요?
    conclusion:
      lead: '스코프를 바꿔요. 프로토타입 스코프는 꺼낼 때마다 새 객체를, request 스코프는 HTTP 요청마다 새 객체를 만들어요.'
      sub: '프로토타입 빈을 싱글톤 빈의 생성자로 받으면 그때 한 번만 만들어져서 늘 같은 객체가 쓰여요. 쓸 때마다 새로 받으려면 `ObjectProvider`로 꺼내요.'
    says:
      - '`@Scope("prototype")`을 붙인 `Cart`는 `getBean`할 때마다 다른 객체다. 테스트로 보인다'
      - '함정: 싱글톤 `CartService`가 생성자로 `Cart`를 받으면 `CartService`를 만들 때 한 번 만들어 넣는다. 그 뒤로는 늘 같은 `Cart`다. 프로토타입이라는 표시가 무색해진다. 테스트로 보인다'
      - '고친 코드: 코드 provider처럼 `ObjectProvider<Cart>`를 받고 쓸 때마다 `getObject()`로 꺼낸다. 매번 다른 객체다'
      - '웹 앱에는 request 스코프(HTTP 요청 하나 동안 하나)와 session 스코프(세션 하나 동안 하나)가 있다. 요청 두 개에서 request 스코프 빈의 id가 다른 것을 작은 웹 앱으로 보인다'
      - '스코프가 필요한 일은 드물다. 장바구니는 대개 세션이나 DB에 두고, 서비스는 싱글톤으로 둔다. 질문 3처럼 값을 매개변수로 넘기면 대부분 해결된다'
      - '더 알아보기: request 스코프 빈은 앱이 뜰 때 아직 요청이 없어서 싱글톤에 바로 넣을 수 없다. `@RequestScope`는 프록시를 넣어 두고 메서드를 부를 때 그 요청의 객체를 찾아 넘긴다(S9). 컨테이너는 프로토타입 빈을 만들어 넘긴 뒤 관리하지 않아 `@PreDestroy`를 부르지 않는다'
    asks:
      - '본문의 예시: 프로토타입 `Cart`를 싱글톤 `CartService`가 생성자로 받았다. `CartService`의 메서드를 두 번 불러 각각 `cart`에 상품을 담으면 같은 `Cart`에 담기나 (같은 `Cart`에 담긴다)'
      - '옮긴 상황: 요청마다 고유한 추적 id를 갖는 `TraceContext`를 만들고 싶다. 싱글톤 빈에 담아 두는 것과 `@RequestScope` 빈으로 두는 것 가운데 요청마다 다른 값이 보장되는 것은 무엇인가 (`@RequestScope` 빈)'
    body:
      - p: '빈이 몇 개 만들어지고 얼마나 사는지를 **스코프**라고 해요. 기본은 컨테이너에 하나인 싱글톤이에요. 다른 스코프도 있어요.'
      - table:
          head: [스코프, 언제 새로 만드나]
          rows:
            - ['singleton (기본)', '컨테이너에 하나. 다시 만들지 않는다']
            - ['prototype', '컨테이너에서 꺼낼 때마다']
            - ['request', 'HTTP 요청마다']
            - ['session', 'HTTP 세션마다']
      - h3: 프로토타입을 싱글톤에 넣으면
      - code: prototype
        notes:
          - mark: '@Scope("prototype")'
            as: anno
            text: '꺼낼 때마다 새 객체를 만들라는 표시예요.'
      - p: '`Cart`는 꺼낼 때마다 새 객체예요. 그런데 싱글톤 `CartService`가 생성자로 받으면 어떻게 될까요?'
      - ci:
          key: prototype
          label: 실제 결과 보기
          source: BeanLifecycleTest.prototypeInSingleton
      - p: '`CartService`는 한 번 만들어지고, 그때 생성자에 `Cart`를 **한 번** 넣어요. 그 뒤로는 그 `Cart` 하나를 계속 써요. 모든 사용자의 상품이 한 장바구니에 담겨요. 프로토타입이라는 표시가 무색해졌어요.'
      - code: provider
        notes:
          - mark: carts.getObject()
            as: code
            text: '부를 때마다 컨테이너에서 새 `Cart`를 꺼내요.'
      - p: '쓸 때마다 새로 받으려면 `Cart` 대신 `ObjectProvider<Cart>`를 받고 필요할 때 `getObject()`로 꺼내요. 위 결과의 셋째 줄처럼 매번 다른 객체예요.'
      - h3: 요청마다 하나는 request 스코프
      - code: requestScope
      - p: '`@RequestScope` 빈은 HTTP 요청 하나 동안 하나예요. 작은 웹 앱에 두고 요청을 두 번 보내 id를 받았어요.'
      - ci:
          key: request-scope
          label: 실제 결과 보기
          source: BeanLifecycleTest.requestScopePerRequest
      - p: '요청마다 달라요. 하지만 이런 스코프가 필요한 일은 드물어요. 장바구니는 대개 세션이나 DB에 두고, 서비스는 싱글톤으로 두고, 요청의 값은 질문 3처럼 매개변수로 넘겨요.'
      - more:
          summary: '더 알아보기: 싱글톤 컨트롤러가 어떻게 요청마다 다른 TraceContext를 쓰나요'
          body:
            - p: '앱이 뜰 때는 아직 요청이 없어서 진짜 `TraceContext`를 만들 수 없어요. `@RequestScope`는 컨트롤러에 **프록시**를 대신 넣어 둬요. 메서드를 부르면 프록시가 지금 요청의 진짜 객체를 찾아 넘겨요. 프록시는 [AOP](lesson:aop-audit) 레슨에서 다뤄요.'
            - p: '그래서 `id` 필드를 바로 읽지 않고 `id()` 메서드를 불러야 해요. 프록시의 필드를 바로 읽으면 진짜 객체로 넘어가지 않아요. 테스트를 쓰다가 빈 문자열이 나와서 알게 된 거예요.'
            - p: '컨테이너는 프로토타입 빈을 만들어 넘긴 뒤 더 관리하지 않아요. 그래서 프로토타입 빈의 `@PreDestroy`는 불리지 않아요([근거](link:scopes)).'
      - quiz:
          q: '프로토타입 `Cart`를 싱글톤 `CartService`가 생성자로 받았어요. kim과 lee가 차례로 상품을 담으면?'
          options:
            - 각자 다른 Cart에 담긴다
            - 같은 Cart에 담긴다
            - 두 번째 사용자는 예외가 난다
          answer: 2
          explain: '`CartService`를 만들 때 `Cart`를 한 번 넣고 계속 써요. 매번 새로 받으려면 `ObjectProvider<Cart>`로 꺼내요.'
    recall: '스코프는 빈이 몇 개 만들어지고 얼마나 사는지예요. 기본은 싱글톤이고, prototype은 꺼낼 때마다, request는 HTTP 요청마다, session은 세션마다 새로 만들어요. 프로토타입 빈을 싱글톤의 생성자로 받으면 한 번만 만들어져 계속 같은 객체를 쓰니, 매번 새로 받으려면 ObjectProvider.getObject()로 꺼내요. 대부분은 값을 매개변수로 넘기면 스코프가 필요 없어요.'
practice:
  title: 스프링 부트에서는 이렇게 다뤄요
  says:
    - '시작할 때 할 일: 캐시를 채우는 것은 `@PostConstruct`, 앱이 모두 뜬 뒤 할 일은 코드 runner의 `ApplicationRunner`. 두 출력의 순서(모든 `@PostConstruct` 다음에 `ApplicationRunner`)를 테스트로 보인다'
    - '정리할 일: 스레드 풀이나 외부 연결을 직접 만든 빈은 `@PreDestroy`에서 닫는다. 스프링 부트는 종료 신호를 받으면 컨텍스트를 닫는다. `server.shutdown=graceful`이면 처리 중인 요청을 기다린 뒤 닫는다(스프링 부트 문서 근거)'
    - '흔한 실수: 코드 stateful처럼 싱글톤 서비스의 필드에 요청의 값을 둔다. 혼자 테스트할 때는 맞고 동시 요청에서만 틀린다. 고친 코드: 필드를 지우고 매개변수로 넘긴다(질문 3을 가리킨다)'
    - '흔한 실수 둘: 하루 주문 수 같은 값을 빈 필드에 센다. 서버가 두 대면 각자 센다. 재시작하면 0이 된다. 함께 세야 하는 값은 DB나 Redis에 둔다고 적는다'
  body:
    - h3: 시작할 때 할 일은 두 자리
    - p: '받은 빈으로 혼자 준비하는 일(캐시 채우기)은 `@PostConstruct`에 둬요. 앱 전체가 다 뜬 뒤에 할 일(외부 서버 연결 확인, 자주 쓰는 데이터 미리 읽기)은 스프링 부트의 `ApplicationRunner`에 둬요.'
    - code: runner
    - ci:
        key: runner
        label: 실제 순서 보기
        source: BeanLifecycleTest.runnerAfterPostConstruct
    - p: '`ApplicationRunner`는 모든 빈의 `@PostConstruct`가 끝나고 컨텍스트가 다 뜬 뒤에 불려요. 웹 앱이라면 요청을 받기 직전이에요([근거](link:runner)).'
    - h3: 정리할 일은 @PreDestroy
    - p: '빈이 직접 만든 스레드 풀이나 외부 연결은 `@PreDestroy`에서 닫아요. 스프링 부트는 종료 신호를 받으면 컨텍스트를 닫으며 이 메서드들을 불러요. `server.shutdown=graceful`을 켜면 처리 중인 요청이 끝날 때까지 기다린 뒤 닫아요([근거](link:graceful)). 기다리는 시간의 한도는 `spring.lifecycle.timeout-per-shutdown-phase`예요.'
    - h3: '흔한 실수 1: 서비스 필드에 요청의 값'
    - p: '질문 3의 `GreetingService`예요. 혼자 테스트하면 늘 맞고, 사용자가 몰릴 때만 남의 값이 보여요. 필드를 지우고 매개변수로 넘기면 고쳐져요. 코드 리뷰에서 서비스와 컨트롤러에 `final`이 아닌 필드가 보이면 의심해요.'
    - h3: '흔한 실수 2: 함께 세야 하는 값을 빈 필드에'
    - p: '`AtomicLong`으로 바꾸면 한 서버 안에서는 정확해요. 하지만 서버가 두 대면 각자 세고, 배포로 재시작하면 0이 돼요. 하루 주문 수처럼 모두가 함께 봐야 하는 값은 DB나 Redis에 둬요.'
interview:
  question: 스프링 빈의 생명주기와 스코프를 설명해 주세요
  model:
    - label: 정의
      text: 빈은 생성자로 만들어지고, 필드와 세터에 의존성이 주입된 뒤 @PostConstruct가 불리고, 컨테이너가 닫힐 때 @PreDestroy가 불립니다. 스코프는 빈이 몇 개 만들어지고 얼마나 사는지로, 기본은 컨테이너에 하나인 싱글톤입니다.
    - label: 원리
      text: 필드 주입은 생성자가 끝난 뒤라 생성자 안에서는 null이고, @PostConstruct는 주입이 모두 끝난 뒤라 초기화를 둡니다. 정리는 만든 순서의 반대입니다. 프로토타입은 꺼낼 때마다, request 스코프는 요청마다 새로 만듭니다.
    - label: 주의할 점
      text: 싱글톤 빈은 모든 요청 스레드가 함께 쓰므로 바뀌는 필드를 두면 값이 사라지거나 섞입니다. 요청의 값은 매개변수로 넘기고, 함께 세는 값은 AtomicLong이나 DB에 둡니다. 프로토타입을 싱글톤에 생성자로 넣으면 한 번만 만들어지므로 ObjectProvider로 꺼냅니다.
    - label: 경험
      text: '(내 프로젝트로 채우기) 예: 서비스 필드에 요청 값을 두어 동시 요청에서 다른 사용자의 값이 섞이던 것을 매개변수로 넘기게 고쳤습니다.'
verified: 이 레슨의 순서와 숫자는 짐작이 아니라 스프링 프레임워크 6.2의 컨테이너를 열고 닫고, 스레드를 돌려 받은 값이에요. 코드가 바뀔 때마다 테스트([BeanLifecycleTest](link:test))가 다시 돌아요.
footer: '근거: 초기화와 소멸 콜백은 스프링 프레임워크 문서([링크](link:callbacks)), 스코프는 [링크](link:scopes), `ApplicationRunner`는 스프링 부트 문서([링크](link:runner)), 정상 종료는 [링크](link:graceful). 결과는 OpenJDK 21에서 테스트로 확인했어요. 오류는 [GitHub 이슈](https://github.com/wanja727/dev-lessons/issues)로 알려 주세요.'
claims:
  - claim: '필드 주입 빈의 생성자에서 주입 필드는 null이고, `@PostConstruct`에서는 채워져 있다. 순서는 생성자, `@PostConstruct`, `@PreDestroy`다. `A`가 `B`를 쓰면 `@PreDestroy`는 `A`가 먼저다'
    how: '`AnnotationConfigApplicationContext`에 두 빈을 등록하고 열고 닫으며 기록을 남긴다'
    test: BeanLifecycleTest.lifecycleOrder
  - claim: '`@PostConstruct`에서 예외가 나면 컨텍스트가 `BeanCreationException`으로 뜨지 않는다'
    how: '예외를 던지는 빈으로 컨텍스트를 띄운다'
    test: BeanLifecycleTest.postConstructFailureStopsStartup
  - claim: '`@Value` 필드는 생성자에서 기본값이다'
    how: '`MapPropertySource`로 값을 주고 생성자에서 읽은 값을 기록한다'
    test: BeanLifecycleTest.valueFieldIsLaterThanConstructor
  - claim: '싱글톤 빈의 `int` 필드를 스레드 두 개가 1만 번씩 `++`하면 20000보다 작은 값이 나오곤 한다. `AtomicLong`은 늘 20000이다'
    how: '다섯 번 돌려 결과를 기록한다. 다섯 번 가운데 한 번 이상 작으면 통과'
    test: BeanLifecycleTest.singletonStateLosesUpdates
  - claim: '필드에 이름을 두는 싱글톤 서비스는 두 스레드가 엇갈리면 다른 사용자의 이름을 돌려준다'
    how: '`CountDownLatch`로 첫 스레드가 필드를 쓴 뒤 둘째 스레드가 덮어쓰게 맞추고 첫 스레드의 결과를 본다'
    test: BeanLifecycleTest.statefulSingletonMixesUsers
  - claim: '프로토타입 빈은 꺼낼 때마다 다르지만, 싱글톤에 생성자로 넣으면 늘 같다. `ObjectProvider.getObject()`는 매번 다르다'
    how: '작은 컨텍스트에서 비교한다'
    test: BeanLifecycleTest.prototypeInSingleton
  - claim: 'request 스코프 빈은 요청마다 다른 객체다. 주입된 프록시의 필드를 바로 읽으면 진짜 객체로 가지 않는다'
    how: '`MiniWeb`에 request 스코프 빈과 그 id를 돌려주는 컨트롤러를 넣고 두 번 요청한다. 처음에 필드를 바로 읽어 빈 문자열이 나왔고, 메서드로 바꿔 통과했다'
    test: BeanLifecycleTest.requestScopePerRequest
  - claim: '모든 `@PostConstruct`가 끝난 뒤 `ApplicationRunner`가 돈다'
    how: '`SpringApplicationBuilder`로 작은 앱을 띄워 기록 순서를 본다'
    test: BeanLifecycleTest.runnerAfterPostConstruct
sources:
  - '초기화와 소멸 콜백, 소멸 순서: 스프링 프레임워크 문서 https://docs.spring.io/spring-framework/reference/core/beans/factory-nature.html'
  - '빈 스코프와 프로토타입의 소멸 콜백, 스코프 프록시: https://docs.spring.io/spring-framework/reference/core/beans/factory-scopes.html'
  - '`ApplicationRunner`: 스프링 부트 문서 https://docs.spring.io/spring-boot/reference/features/spring-application.html#features.spring-application.command-line-runner'
  - '정상 종료(graceful shutdown): https://docs.spring.io/spring-boot/reference/web/graceful-shutdown.html'
