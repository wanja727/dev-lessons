predict:
  title: 닫기, catch, finally 가운데 무엇이 먼저일까요?
  text: '`Res`는 닫힐 때 "A 닫힘"처럼 자기 이름을 남겨요. 본문에서 예외가 던져지면 "본문" 다음에 무엇이 어떤 순서로 나올까요? 모르는 게 정상이니 감으로 골라 보세요. 답은 질문 3에 나와요.'
  code: predict
  label: 내 예측
  options:
    - value: a
      label: 'catch, finally, A 닫힘, B 닫힘'
    - value: b
      label: 'A 닫힘, B 닫힘, catch, finally'
    - value: c
      label: 'B 닫힘, A 닫힘, catch, finally'
    - value: d
      label: 'catch, B 닫힘, A 닫힘, finally'
  answer: c
  storageKey: exc-predict
  wrong: 예측은 "{label}"이었어요. 틀린 예측이 더 오래 남으니 괜찮아요.
questions:
  - id: q1
    title: 예외에는 어떤 종류가 있고, 체크 예외와 언체크 예외는 무엇이 다른가요?
    conclusion:
      lead: '체크 예외는 잡거나 `throws`로 선언하지 않으면 컴파일되지 않는 예외이고, 언체크 예외는 그런 강제가 없는 예외예요.'
      sub: '`RuntimeException`과 그 자식이 언체크이고, 그 밖의 `Exception`이 체크예요.'
    says:
      - '던질 수 있는 것은 모두 `Throwable`의 자식이다. 그 아래에 `Error`와 `Exception`이 있고, `Exception` 아래에 `RuntimeException`이 있다'
      - '`Error`는 JVM이 더 진행하기 어려운 상태다(`OutOfMemoryError`, `StackOverflowError`). 애플리케이션 코드가 잡아서 복구하는 대상이 아니다'
      - '체크 예외: `IOException`, `SQLException`처럼 `RuntimeException`이 아닌 `Exception`. 이것을 던질 수 있는 메서드를 부르면 `try-catch`로 잡거나 내 메서드에 `throws`를 붙여야 컴파일된다'
      - '언체크 예외: `RuntimeException`의 자식. `NullPointerException`, `IllegalArgumentException`, `IllegalStateException`. 잡지 않아도 선언하지 않아도 컴파일된다'
      - '차이는 컴파일러가 검사하느냐뿐이다. 실행할 때 던져지고 전파되는 방식은 같다'
      - '`throw`는 예외 객체를 던지는 문장이고, `throws`는 "이 메서드는 이 예외를 밖으로 내보낼 수 있다"는 선언이다'
      - '체크 예외의 뜻은 "호출한 쪽이 반드시 대비하라"다. 그런데 대비할 방법이 없는 곳까지 `throws`가 번지거나 빈 `catch`로 막게 되는 문제가 있다. 그래서 요즘 라이브러리와 스프링은 대부분 언체크 예외를 쓴다. 실무 구역에서 이어 간다'
    asks:
      - '본문의 예시: `void read() { Files.readString(path); }`처럼 `IOException`을 던질 수 있는 메서드를 `try`도 `throws`도 없이 부르면 어떻게 되나 (컴파일 오류. `IOException`은 체크 예외다)'
      - '옮긴 상황: `class OrderNotFoundException extends RuntimeException`과 `class FileFormatException extends Exception` 가운데, 던지는 메서드에 `throws`를 쓰지 않아도 컴파일되는 것은 어느 쪽인가 (`OrderNotFoundException`. 언체크 예외다)'
    body:
      - p: '자바에서 던질 수 있는 것은 모두 `Throwable`의 자식이에요. 계층은 이래요.'
      - code: hierarchy
      - ul:
          - '**`Error`:** 메모리가 바닥난 것처럼 JVM이 더 진행하기 어려운 상태예요. 애플리케이션 코드가 잡아서 고칠 수 있는 것이 아니라 잡지 않아요. 왜 나는지는 JVM 메모리 구조 레슨에서 다뤄요.'
          - '**체크 예외:** `RuntimeException`이 아닌 `Exception`이에요. 파일을 못 읽는 `IOException`, DB 오류인 `SQLException`이 그래요.'
          - '**언체크 예외:** `RuntimeException`과 그 자식이에요. null에 점을 찍은 것, 잘못된 인자, 지금 할 수 없는 상태 같은 것이에요.'
      - h3: 차이는 컴파일러가 검사하느냐예요
      - p: '체크 예외를 던질 수 있는 메서드를 부르면, `try-catch`로 잡거나 내 메서드에 `throws`로 "나도 밖으로 내보낸다"고 선언해야 컴파일돼요. 언체크 예외는 그런 강제가 없어요. 세 코드를 컴파일해 봤어요.'
      - ci:
          key: checked
          label: 컴파일 결과 보기
          source: ExceptionTest.checkedVersusUnchecked
          code: checkedRun
      - p: '컴파일러가 검사하느냐가 차이의 전부예요. **실행할 때 던져지고 전파되는 방식은 똑같아요.** `throw`는 예외 객체를 실제로 던지는 문장이고, `throws`는 메서드 선언에 붙이는 "이 예외가 밖으로 나갈 수 있다"는 표시예요.'
      - p: '체크 예외는 "호출한 쪽이 반드시 대비하라"는 뜻으로 만들었어요. 그런데 대비할 방법이 없는 곳까지 `throws`가 줄줄이 번지거나, 컴파일만 되게 빈 `catch`로 막아 버리는 일이 많았어요. 그래서 요즘 라이브러리와 스프링은 대부분 언체크 예외를 써요. 실무 구역에서 이어 가요.'
      - quiz:
          q: '`class OrderNotFoundException extends RuntimeException`과 `class FileFormatException extends Exception` 가운데, 던지는 메서드에 `throws`를 쓰지 않아도 컴파일되는 것은?'
          options:
            - OrderNotFoundException
            - FileFormatException
            - 둘 다
          answer: 1
          explain: '`RuntimeException`의 자식은 언체크 예외라 컴파일러가 처리를 강제하지 않아요. `FileFormatException`은 체크 예외예요.'
      - next: '어느 종류든 실행할 때는 똑같이 던져진다고 했어요. 던져지면 실행은 어디로 갈까요?'
    recall: '체크 예외는 잡거나 `throws`로 선언하지 않으면 컴파일되지 않는 예외이고, 언체크 예외는 그런 강제가 없는 예외예요. `RuntimeException`과 그 자식이 언체크, 그 밖의 `Exception`이 체크예요. `Error`는 JVM이 더 진행하기 어려운 상태라 잡지 않아요. 차이는 컴파일러의 검사뿐이고 실행할 때 던져지는 방식은 같아요.'
  - id: q2
    title: 예외가 던져지면 실행은 어디로 가나요?
    conclusion:
      lead: '그 자리에서 멈추고, 호출한 메서드를 거슬러 올라가며 그 예외를 받는 `catch`를 찾아 거기로 가요.'
      sub: '그 사이에 남아 있던 줄은 실행되지 않고, 지나가는 길의 `finally`만 실행돼요.'
    says:
      - '`controller`가 `service`를, `service`가 `client`를 부르는 세 메서드에서 `client`가 예외를 던진다. `client`의 남은 줄, `service`의 남은 줄은 실행되지 않는다. `controller`의 `catch`가 받으면 그 블록부터 이어서 실행된다. 각 줄에 출력을 넣어 확인한다'
      - '`catch`는 위에서부터 맞는 첫 블록 하나가 받는다. `catch (RuntimeException e)`는 그 자식인 `IllegalStateException`도 받는다(J7). 그래서 자식 타입의 `catch`를 먼저 쓴다. 순서를 뒤집으면 컴파일 오류다'
      - '`catch (IOException | TimeoutException e)`로 여러 타입을 한 블록에서 받는다'
      - '`finally`는 예외가 나지 않아도, 나서 잡혀도, 잡히지 않고 지나가도 실행된다. `try` 안에서 `return`해도 실행된다'
      - '아무도 잡지 않으면 그 스레드가 끝나고 스택 트레이스가 출력된다. 스택 트레이스는 예외가 던져진 줄이 맨 위이고 아래로 갈수록 호출한 쪽이다. 실제 스택 트레이스 하나를 놓고 읽는 순서를 짚는다'
      - '더 알아보기: `finally`에서 `return`하면 던져지던 예외가 사라지고 그 값이 반환된다. `finally`에서는 `return`하지 않는다'
    asks:
      - '본문의 예시: `service()`가 "S1"을 출력하고 `client()`를 부른 뒤 "S2"를 출력한다. `client()`는 "C1"을 출력하고 `IllegalStateException`을 던진다. `controller()`는 `try { service(); print("OK"); } catch (IllegalStateException e) { print("ERR"); }`다. 출력은 무엇인가 (S1, C1, ERR)'
      - '옮긴 상황: `int f() { try { return 1; } finally { print("F"); } }`를 부르면 "F"는 출력되나, 반환값은 무엇인가 (출력되고 1을 반환한다)'
    body:
      - p: '세 메서드가 서로를 불러요. `client`가 예외를 던지면 어떤 줄이 출력될지 예상해 보고 열어 보세요.'
      - ci:
          key: propagation
          label: 실제 출력 보기
          source: ExceptionTest.propagation
          code: calls
      - p: '"S2"와 "OK"가 없어요. 예외가 던져지면 **그 자리에서 멈추고**, 자기를 부른 메서드로, 또 그 메서드를 부른 메서드로 **거슬러 올라가며** 그 예외를 받는 `catch`를 찾아요. 찾으면 그 `catch` 블록부터 이어서 실행해요. 지나온 메서드들의 남은 줄은 건너뛰어요.'
      - h3: 어느 catch가 받나요
      - ul:
          - '**위에서부터 맞는 첫 블록 하나가 받아요.** `catch (RuntimeException e)`는 그 자식인 `IllegalStateException`도 받아요. 상속과 다형성 레슨에서 본 대로 자식은 부모 자리에 들어가니까요.'
          - '**그래서 자식 타입의 `catch`를 먼저 써요.** 부모를 먼저 쓰면 자식의 `catch`에 닿을 수 없어서 컴파일 오류가 나요.'
          - '**여러 타입을 한 블록에서 받을 수 있어요.** `catch (IOException | TimeoutException e)`처럼 써요.'
      - h3: finally는 언제나 실행돼요
      - p: '`finally`는 예외가 나지 않아도, 나서 잡혀도, 잡히지 않고 지나가도 실행돼요. `try` 안에서 `return`해도 실행된 뒤에 돌아가요. 그래서 반드시 해야 하는 정리를 여기에 둬요. 다음 질문에서 이 일을 더 간단히 하는 방법을 봐요.'
      - h3: 스택 트레이스는 위에서 아래로 읽어요
      - p: '아무도 잡지 않으면 그 스레드가 끝나고 스택 트레이스가 출력돼요. `client`가 던진 예외의 스택 트레이스예요.'
      - ci:
          key: stack
          label: 실제 스택 트레이스 보기
          source: ExceptionTest.stackTrace
          code: stackRun
      - ol:
          - '첫 줄은 예외의 타입과 메시지예요.'
          - '`at` 줄의 **맨 위가 예외가 던져진 곳**이에요(`client`).'
          - '아래로 갈수록 그것을 부른 쪽이에요(`service`, 그다음 테스트). 내 코드의 줄이 처음 나오는 곳부터 봐요.'
      - more:
          summary: '더 알아보기: finally에서 return하면'
          body:
            - p: '`finally`에서 `return`하면 던져지던 예외가 사라지고 그 값이 반환돼요. 호출한 쪽은 실패를 전혀 몰라요. 테스트에서 예외를 던지는 `try`에 `finally { return 2; }`를 붙였더니 예외 없이 2가 반환됐어요. `finally`에서는 `return`하지 않아요.'
      - quiz:
          q: '`int f() { try { return 1; } finally { print("F"); } }`를 부르면?'
          options:
            - F가 출력되지 않고 1을 반환한다
            - F가 출력되고 1을 반환한다
            - 컴파일 오류
          answer: 2
          explain: '`finally`는 `try`에서 `return`해도 실행돼요. 실행된 뒤에 1을 돌려줘요.'
      - next: '`finally`에서 자원을 닫는 코드를 쓰려니 길고 실수하기 쉬워요. 자바가 대신 닫아 줄 수는 없을까요?'
    recall: '그 자리에서 멈추고, 호출한 메서드를 거슬러 올라가며 그 예외를 받는 `catch`를 찾아 거기서부터 이어서 실행해요. 지나온 메서드의 남은 줄은 실행되지 않아요. `catch`는 위에서부터 맞는 첫 블록이 받으니 자식 타입을 먼저 써요. `finally`는 무슨 일이 있어도 실행돼요. 스택 트레이스는 맨 위가 던져진 곳이에요.'
  - id: q3
    title: try-with-resources는 무엇을 해 주나요?
    conclusion:
      lead: '`try` 블록을 어떻게 빠져나가든 괄호 안에 선언한 자원의 `close()`를 자동으로 불러 줘요.'
      sub: '선언한 순서의 반대로 닫고, `catch`와 `finally`가 실행되기 전에 닫아요.'
    says:
      - '파일, DB 커넥션, 소켓은 다 쓰면 닫아야 한다. `finally`에서 직접 닫는 코드는 길고, 닫는 것을 빠뜨리거나 닫다가 난 예외가 본문의 예외를 덮는 실수가 생긴다'
      - '`AutoCloseable`을 구현한 객체를 `try (...)` 괄호 안에 선언하면 블록을 나갈 때 `close()`가 불린다. 정상으로 끝나도, 예외가 나도, `return`해도 불린다'
      - '코드 predict의 순서. "본문"을 출력하고 예외가 던져진다. 먼저 자원이 닫힌다. 나중에 연 것부터 닫으므로 "B 닫힘", "A 닫힘"이다. 그다음 `catch`, 마지막에 `finally`다. 예측의 답을 밝힌다'
      - '반대 순서로 닫는 이유: 나중에 연 자원이 먼저 연 자원을 쓰고 있을 수 있다. 커넥션에서 만든 `Statement`를 커넥션보다 먼저 닫아야 하는 것과 같다'
      - '`catch`에 들어왔을 때 자원은 이미 닫혀 있다. `catch` 안에서 그 자원을 쓸 수 없다'
      - '본문도 예외를 던지고 `close()`도 예외를 던지면, 밖으로 나가는 것은 본문의 예외다. `close()`의 예외는 버려지지 않고 본문 예외의 `getSuppressed()`에 붙는다. 직접 `finally`에서 닫으면 `close()`의 예외가 본문의 예외를 덮어 원래 원인을 잃는다'
    widget:
      kind: steps
      note: '시나리오 셋을 고른다: "예외 없음", "본문에서 예외", "본문과 close 둘 다 예외". 코드 predict를 보여 주고 단계를 넘길 때마다 실행되는 줄을 강조하며 로그에 출력을 쌓는다. 셋째 시나리오에서는 마지막에 "밖으로 나간 예외"와 "suppressed에 붙은 예외"를 두 칸으로 보여 준다'
    asks:
      - '본문의 예시: 코드 predict에서 `throw` 줄을 지워 예외가 나지 않게 하면 출력의 순서는 무엇인가 (본문, B 닫힘, A 닫힘, finally)'
      - '옮긴 상황: `try (Res r = new Res("R")) { throw new IllegalStateException("본문"); }`에서 `Res`의 `close()`가 `IllegalArgumentException("닫기")`를 던진다. `try` 밖에서 잡히는 예외의 타입과, 그 예외의 `getSuppressed()` 길이는 무엇인가 (`IllegalStateException`이고 길이는 1)'
    body:
      - p: '파일, DB 커넥션, 네트워크 연결은 다 쓰면 닫아야 해요. `finally`에서 직접 닫으면 코드가 길어지고, 닫기를 빠뜨리거나 닫다가 난 예외가 원래 예외를 덮는 실수가 생겨요.'
      - p: '`AutoCloseable`(메서드는 `close()` 하나)을 구현한 객체를 `try (...)` 괄호 안에 선언하면, 블록을 **어떻게 빠져나가든** 자바가 `close()`를 불러 줘요. 정상으로 끝나도, 예외가 나도, `return`해도요. 이것을 **try-with-resources**라고 해요.'
      - code: res
      - p: '처음 예측한 코드를 세 시나리오로 한 단계씩 실행해 보세요.'
      - widget:
          kind: steps
          layout: [selector, duo, log, buttons, verdict]
          selector:
            label: 시나리오
            options:
              - {value: ok, label: 예외 없음}
              - {value: body, label: 본문에서 예외}
              - {value: both, label: 본문과 close 둘 다 예외}
          initial:
            duo:
              - {label: 열린 자원, state: dim, text: 없음}
              - {label: 밖으로 나갈 예외, state: dim, text: 없음}
          scenarios:
            ok:
              - log: 'A 열기, B 열기'
                duo:
                  - label: 열린 자원
                    rows: [{k: A, v: 열림}, {k: B, v: 열림, mark: changed}]
                  - {label: 밖으로 나갈 예외, text: 없음}
              - log: '본문'
              - log: 'B 닫힘   (나중에 연 것부터)'
                duo:
                  - label: 열린 자원
                    rows: [{k: A, v: 열림}, {k: B, v: 닫힘, mark: changed}]
                  - {label: 밖으로 나갈 예외, text: 없음}
              - log: 'A 닫힘'
                duo:
                  - label: 열린 자원
                    rows: [{k: A, v: 닫힘, mark: changed}, {k: B, v: 닫힘}]
                  - {label: 밖으로 나갈 예외, text: 없음}
              - log: 'finally'
                verdict: '예외가 없어도 블록을 나갈 때 반대 순서로 닫혀요.'
            body:
              - log: 'A 열기, B 열기'
                duo:
                  - label: 열린 자원
                    rows: [{k: A, v: 열림}, {k: B, v: 열림, mark: changed}]
                  - {label: 밖으로 나갈 예외, text: 없음}
              - log: '본문 → IllegalStateException("실패")'
                duo:
                  - label: 열린 자원
                    rows: [{k: A, v: 열림}, {k: B, v: 열림}]
                  - label: 밖으로 나갈 예외
                    rows: [{k: 본문, v: IllegalStateException, mark: bad}]
              - log: 'B 닫힘   (catch보다 먼저)'
                duo:
                  - label: 열린 자원
                    rows: [{k: A, v: 열림}, {k: B, v: 닫힘, mark: changed}]
                  - label: 밖으로 나갈 예외
                    rows: [{k: 본문, v: IllegalStateException, mark: bad}]
              - log: 'A 닫힘'
                duo:
                  - label: 열린 자원
                    rows: [{k: A, v: 닫힘, mark: changed}, {k: B, v: 닫힘}]
                  - label: 밖으로 나갈 예외
                    rows: [{k: 본문, v: IllegalStateException, mark: bad}]
              - log: 'catch   (자원은 이미 닫혀 있어요)'
                duo:
                  - label: 열린 자원
                    rows: [{k: A, v: 닫힘}, {k: B, v: 닫힘}]
                  - {label: 밖으로 나갈 예외, text: 'catch가 받음'}
              - log: 'finally'
                verdict: '자원을 먼저 닫고, 그다음 catch, 마지막에 finally예요.'
            both:
              - log: 'R 열기'
                duo:
                  - label: 열린 자원
                    rows: [{k: R, v: 열림, mark: changed}]
                  - {label: 밖으로 나갈 예외, text: 없음}
              - log: '본문 → IllegalStateException("본문")'
                duo:
                  - label: 열린 자원
                    rows: [{k: R, v: 열림}]
                  - label: 밖으로 나갈 예외
                    rows: [{k: 본문, v: IllegalStateException, mark: bad}]
              - log: 'R 닫힘 → close()도 IllegalArgumentException("닫기")'
                duo:
                  - label: 열린 자원
                    rows: [{k: R, v: 닫힘}]
                  - label: 밖으로 나갈 예외
                    rows: [{k: 본문, v: IllegalStateException, mark: bad}, {k: suppressed, v: IllegalArgumentException, mark: changed}]
                verdict: '밖으로 나가는 것은 본문의 예외예요. close의 예외는 버려지지 않고 getSuppressed()에 붙어요.'
      - p: '처음 예측의 답은 **B 닫힘, A 닫힘, catch, finally**예요. {{predict-result}}'
      - ci:
          key: predict
          label: 실제 출력 보기
          source: ExceptionTest.predict
          code: predict
      - ul:
          - '**나중에 연 것부터 닫아요.** 나중에 연 자원이 먼저 연 자원을 쓰고 있을 수 있어서예요. DB 커넥션으로 만든 `Statement`는 커넥션보다 먼저 닫아야 하는 것과 같아요.'
          - '**`catch`와 `finally`보다 먼저 닫아요.** `catch`에 들어왔을 때 자원은 이미 닫혀 있어서 `catch` 안에서 그 자원을 쓸 수 없어요.'
      - h3: 닫다가 또 실패하면
      - p: '본문에서 예외가 났는데 `close()`도 예외를 던지면, 둘 가운데 무엇이 밖으로 나갈까요?'
      - ci:
          key: suppressed
          label: 실제 결과 보기
          source: ExceptionTest.suppressed
          code: suppressedRun
      - p: '**본문의 예외가 나가요.** 실패의 진짜 원인은 본문이니까요. `close()`의 예외는 버려지지 않고 본문 예외의 `getSuppressed()`에 붙어서 스택 트레이스에 함께 찍혀요. `finally`에서 손으로 닫으면 `close()`의 예외가 본문의 예외를 **덮어서** 원래 원인이 사라져요. try-with-resources가 이것까지 해 줘요.'
      - quiz:
          q: '코드 predict에서 `throw` 줄을 지워 예외가 나지 않게 하면 출력의 순서는?'
          options:
            - '본문, finally, B 닫힘, A 닫힘'
            - '본문, B 닫힘, A 닫힘, finally'
            - '본문, A 닫힘, B 닫힘, finally'
          answer: 2
          explain: '예외가 없어도 블록을 나갈 때 나중에 연 B부터 닫고, 그다음 finally예요. catch는 실행되지 않아요.'
      - next: '예외를 잡는 법은 알았어요. 그런데 잡기만 하고 아무것도 하지 않으면 어떻게 될까요?'
    recall: '`try (...)` 괄호 안에 선언한 `AutoCloseable` 자원의 `close()`를 블록을 어떻게 빠져나가든 자동으로 불러 줘요. 나중에 연 것부터 반대 순서로 닫고, `catch`와 `finally`보다 먼저 닫아요. 본문과 `close()`가 둘 다 예외를 던지면 본문의 예외가 나가고 `close()`의 예외는 `getSuppressed()`에 붙어요.'
  - id: q4
    title: 예외를 잡고 아무것도 하지 않으면 어떤 일이 생기나요?
    conclusion:
      lead: '호출한 쪽은 실패한 줄 모르고 성공한 것으로 알고 다음 일을 계속해요.'
      sub: '예외는 "실패했다"는 신호라서, 복구할 수 없는 곳에서 잡았으면 원인을 붙여 다시 던져야 신호가 이어져요.'
    says:
      - '코드 swallow. `client.request`가 실패해도 `pay`는 true를 돌려준다. 호출한 쪽은 주문을 "결제 완료"로 바꾼다. 예외를 삼켰다고 한다. 도입부의 사고가 이것이다'
      - '빈 `catch`, 로그만 남기는 `catch`, `e.printStackTrace()`만 부르는 `catch`가 모두 같다. 호출한 쪽에 실패가 전해지지 않는다'
      - '잡아도 되는 때는 그 자리에서 복구할 수 있을 때다. 다른 값으로 대신하거나, 다시 시도하거나, 사용자에게 알리는 응답으로 바꿀 수 있을 때다. 그럴 수 없으면 잡지 않고 올려 보낸다'
      - '다른 예외로 바꿔 던질 때는 원인을 넘긴다. 코드 rethrow처럼 생성자의 마지막 인자로 원래 예외를 준다. 스택 트레이스에 `Caused by:`로 원래 예외와 그것이 던져진 줄이 이어진다'
      - '원인을 넘기지 않고 `throw new PaymentFailedException(orderId)`만 하면 어느 줄에서 무슨 이유로 실패했는지가 사라진다. `getCause()`가 null이다'
      - '`catch (Exception e)`로 넓게 잡으면 예상한 실패(`IOException`)뿐 아니라 버그(`NullPointerException`)까지 같은 처리로 덮인다. 대비한 타입만 잡는다'
      - '더 알아보기: 예외 객체를 만들 때 호출 스택 전체를 기록하므로 값을 돌려주는 것보다 비싸다. 반복문의 흐름 제어처럼 평소에 일어나는 일에는 예외를 쓰지 않는다'
    asks:
      - '본문의 예시: 코드 swallow에서 `client.request(orderId)`가 `IOException`을 던졌다. `pay`를 부른 쪽이 받는 것은 무엇인가 (true. 예외는 전해지지 않는다)'
      - '옮긴 상황: `catch (SQLException e) { throw new IllegalStateException("저장 실패"); }`로 던진 예외를 밖에서 잡아 `getCause()`를 부르면 무엇이 나오나 (null. 원인을 넘기지 않았다)'
      - '실무 구역: `catch (IOException e) { log.error("결제 실패: " + e.getMessage()); }`와 `catch (IOException e) { log.error("결제 실패 orderId={}", orderId, e); }` 가운데 로그에 스택 트레이스가 남는 것은 어느 쪽인가 (둘째. 예외 객체를 마지막 인자로 넘겼다)'
    body:
      - p: '도입부의 코드를 줄여 보면 이래요.'
      - code: swallow
        notes:
          - mark: catch (Exception e)
            as: code
            text: '무엇이든 잡아서 로그 한 줄만 남기고 끝내요. 예외가 여기서 멈춰요.'
      - ci:
          key: swallow
          label: 실제 결과 보기
          source: ExceptionTest.swallowing
      - p: '결제 서버가 실패했는데 `pay`는 true를 돌려줘요. 호출한 쪽은 성공한 줄 알고 주문을 "결제 완료"로 저장해요. 이렇게 잡고 아무것도 하지 않는 것을 **예외를 삼킨다**고 해요. 빈 `catch`, 로그만 남기는 `catch`, `e.printStackTrace()`만 부르는 `catch`가 모두 같아요. 예외는 "실패했다"는 신호인데, 그 신호가 여기서 끊겨요.'
      - h3: 언제 잡아야 하나요
      - p: '**그 자리에서 복구할 수 있을 때만** 잡아요. 다른 값으로 대신할 수 있거나, 다시 시도할 수 있거나, 사용자에게 알리는 응답으로 바꿀 수 있을 때예요. 결제처럼 그 자리에서 할 수 있는 것이 없으면 잡지 않고 올려 보내요. 바꿔 던져야 한다면 원인을 붙여요.'
      - code: rethrow
        notes:
          - mark: e
            as: code
            text: '원래 예외를 원인(cause)으로 넘겨요. 마지막 인자예요.'
      - ci:
          key: cause
          label: 원인을 넘겼을 때와 아닐 때 보기
          source: ExceptionTest.rethrowWithCause
      - p: '원인을 넘기면 스택 트레이스에 `Caused by:`로 원래 예외와 그것이 던져진 줄이 이어져요. 넘기지 않으면 `getCause()`가 null이라, 결제 서버 연결이 끊겼다는 사실과 그 줄이 사라져요.'
      - p: '`catch (Exception e)`처럼 넓게 잡는 것도 조심해요. 대비한 `IOException`뿐 아니라 버그인 `NullPointerException`까지 같은 처리로 덮여서, 버그가 "결제 실패"로 숨어 버려요. 대비한 타입만 잡아요.'
      - more:
          summary: '더 알아보기: 예외는 비싸요'
          body:
            - p: '예외 객체를 만들 때 그 순간의 호출 스택 전체를 기록해요. 그래서 값을 돌려주는 것보다 훨씬 비싸요. "끝에 닿으면 예외로 멈춘다" 같은 평소의 흐름 제어에는 예외를 쓰지 않아요. 예외는 정말 예외적인 실패에 써요.'
      - quiz:
          q: '`catch (SQLException e) { throw new IllegalStateException("저장 실패"); }`로 던진 예외를 밖에서 잡아 `getCause()`를 부르면?'
          options:
            - 원래의 SQLException
            - 'null'
            - IllegalStateException
          answer: 2
          explain: '원인을 넘기지 않았어요. `new IllegalStateException("저장 실패", e)`처럼 넘겨야 `getCause()`가 원래 예외를 줘요.'
    recall: '호출한 쪽은 실패한 줄 모르고 성공한 것으로 알고 계속해요. 예외는 "실패했다"는 신호인데 삼키면 그 신호가 끊겨요. 그 자리에서 복구할 수 있을 때만 잡고, 아니면 올려 보내요. 다른 예외로 바꿔 던질 때는 원인을 생성자로 넘겨야 `Caused by`로 원래 원인이 남아요. `Exception`으로 넓게 잡으면 버그까지 덮이니 대비한 타입만 잡아요.'
practice:
  title: 스프링에서는 이렇게 다뤄요
  says:
    - '서비스의 예외 클래스. `class PaymentFailedException extends RuntimeException`에 `(long orderId, Throwable cause)` 생성자를 두고 `super("결제 실패 orderId=" + orderId, cause)`를 부른다. 업무에서 생기는 실패(주문 없음, 재고 부족)마다 언체크 예외를 만들어 던지고, 서비스는 잡지 않는다. 에러 응답으로 바꾸는 곳은 한 군데(`@ControllerAdvice`)이고 S8에서 다룬다'
    - '스프링이 언체크 예외를 쓰는 예. JDBC의 `SQLException`은 체크 예외인데, 스프링은 이것을 언체크인 `DataAccessException`의 자식들로 바꿔 던진다. 그래서 리포지토리를 부르는 서비스 메서드에 `throws`가 없다 (스프링 프레임워크 공식 문서 근거)'
    - '흔한 실수: `catch (Exception e) { log.error("결제 실패: " + e.getMessage()); }`. 세 가지가 겹쳤다. 넓게 잡았고, 삼켰고, 스택 트레이스를 버렸다. 고친 코드: 대비한 타입만 잡아 `log.error("결제 실패 orderId={}", orderId, e)`로 남기고 코드 rethrow처럼 원인을 붙여 던진다. SLF4J는 마지막 인자가 예외면 스택 트레이스를 함께 남긴다 (Logback의 `ListAppender`로 두 로그 줄을 잡아 예외 정보가 붙었는지 확인하는 테스트. 삼킨 경우와 다시 던진 경우에 호출한 쪽이 받는 것도 순수 자바 테스트로 확인한다)'
    - '같은 예외를 여러 층에서 로그로 남기고 다시 던지면 같은 스택 트레이스가 여러 번 찍힌다. 로그는 예외를 마지막으로 처리하는 곳에서 한 번 남긴다'
    - '예외를 삼키는 실수가 스프링에서 더 위험한 이유: `@Transactional`은 예외가 메서드 밖으로 나가야 롤백한다. 삼키면 커밋된다. 그리고 기본으로는 언체크 예외에만 롤백한다. 이 레슨은 "예외가 밖으로 나갔는가가 신호"까지만 말하고 규칙은 S11에 넘긴다'
    - 'JDBC를 직접 쓸 때는 `Connection`, `Statement`, `ResultSet`을 try-with-resources로 연다는 것. 닫지 않으면 생기는 일은 D6'
  body:
    - p: '스프링 애플리케이션은 예외를 "던지는 곳"과 "응답으로 바꾸는 곳"을 나눠요. 서비스는 실패하면 던지고, 잡는 곳은 한 군데예요. 로그를 남기는 방법은 Logback으로 확인했고, 스프링의 예외 계층은 공식 문서가 근거예요.'
    - h3: 서비스의 예외는 언체크로
    - code: exceptionClass
      notes:
        - mark: RuntimeException
          as: code
          text: '언체크 예외라 이 예외가 지나가는 메서드마다 `throws`를 붙이지 않아도 돼요.'
        - mark: cause
          as: code
          text: '원래 예외를 받아 부모에게 넘겨요. 질문 4의 `Caused by`가 여기서 나와요.'
    - p: '주문 없음, 재고 부족, 결제 실패처럼 업무에서 생기는 실패마다 이런 언체크 예외를 만들어 던지고, 서비스 안에서는 잡지 않아요. 예외를 HTTP 응답(404, 409 같은)으로 바꾸는 일은 `@ControllerAdvice` 한 군데에서 하고, 예외 처리와 검증 레슨에서 다뤄요.'
    - p: '스프링 자신도 이렇게 해요. JDBC의 `SQLException`은 체크 예외지만, 스프링은 이것을 언체크인 `DataAccessException`의 자식들로 바꿔 던져요. 그래서 리포지토리를 부르는 서비스 메서드에 `throws SQLException`이 없어요. 근거: [스프링 문서의 DAO 예외 계층](link:springDao).'
    - h3: '흔한 실수: 넓게 잡고, 삼키고, 스택 트레이스를 버림'
    - code: logBad
      notes:
        - mark: '"결제 실패: " + e.getMessage()'
          as: code
          text: '예외의 메시지만 글자로 이어 붙여요. 예외 객체는 로그에 넘어가지 않아요.'
    - p: '세 가지가 겹쳤어요. `Exception`으로 넓게 잡았고, 다시 던지지 않아 삼켰고, 스택 트레이스를 버렸어요. 두 방식으로 로그를 남겨 봤어요.'
    - ci:
        key: logging
        label: 두 로그 줄의 실제 내용 보기
        source: ExceptionTest.loggingException
        code: logRun
    - p: 'SLF4J는 **마지막 인자가 예외면** `{}`에 쓰지 않고 예외로 다뤄서 스택 트레이스를 함께 남겨요. 메시지만 이어 붙인 줄에는 예외 정보가 없어서 어느 줄에서 났는지 알 수 없어요. 고친 코드는 대비한 타입만 잡고, 예외를 넘겨 남기고, 원인을 붙여 다시 던져요.'
    - code: logFixed
      notes:
        - mark: e
          as: code
          text: '예외 객체를 마지막 인자로 넘겨요. 근거: [SLF4J FAQ](link:slf4j).'
    - muted: '같은 예외를 여러 층에서 로그로 남기고 다시 던지면 같은 스택 트레이스가 여러 번 찍혀요. 로그는 예외를 마지막으로 처리하는 곳(보통 `@ControllerAdvice`)에서 한 번 남기는 것이 기본이에요. 위 코드처럼 중간에서 남길 때는 거기서만 아는 정보(`orderId`)가 있을 때예요.'
    - h3: 삼키면 트랜잭션도 커밋돼요
    - p: '스프링의 `@Transactional`은 메서드 밖으로 예외가 나가야 롤백해요. 질문 4처럼 안에서 삼키면 아무 일 없었던 것으로 보고 **커밋**해요. 결제는 실패했는데 주문 상태 변경은 저장되는 일이 이렇게 생겨요. 어떤 예외에 롤백하는지(기본은 언체크 예외)는 트랜잭션 전파와 롤백 규칙 레슨에서 다뤄요.'
    - h3: JDBC 자원은 try-with-resources로
    - code: jdbc
      notes:
        - mark: Connection con
          as: code
          text: '커넥션과 `PreparedStatement`를 괄호 안에 열어요. 질문 3대로 반대 순서로 닫혀요.'
    - p: '스프링의 `JdbcTemplate`이나 JPA를 쓰면 이 일을 프레임워크가 해 줘요. JDBC를 직접 쓸 때만 이렇게 열어요. 커넥션을 닫지 않으면 생기는 일은 DB 커넥션과 커넥션 풀 레슨에서 다뤄요.'
interview:
  question: 체크 예외와 언체크 예외의 차이, 그리고 예외를 다루는 원칙을 설명해 주세요
  model:
    - label: 정의
      text: 체크 예외는 RuntimeException이 아닌 Exception으로, 잡거나 throws로 선언하지 않으면 컴파일되지 않습니다. 언체크 예외는 RuntimeException과 그 자식으로 그런 강제가 없습니다. Error는 JVM이 진행하기 어려운 상태라 잡지 않습니다.
    - label: 원리
      text: 예외가 던져지면 호출 스택을 거슬러 올라가 맞는 catch를 찾고, 그 사이의 줄은 실행되지 않으며 finally만 실행됩니다. try-with-resources는 선언한 자원을 반대 순서로, catch보다 먼저 닫고, close의 예외는 suppressed로 붙입니다.
    - label: 주의할 점
      text: 예외를 삼키면 호출한 쪽이 성공한 줄 알고, @Transactional도 커밋합니다. 복구할 수 있는 곳에서만 잡고, 바꿔 던질 때는 원인을 넘깁니다. Exception으로 넓게 잡지 않고, 로그에는 예외 객체를 마지막 인자로 넘겨 스택 트레이스를 남깁니다.
    - label: 경험
      text: '(내 프로젝트로 채우기) 예: 결제 실패를 catch에서 로그만 남기고 삼켜 주문이 결제 완료로 저장되는 버그를 겪고, 원인을 붙인 업무 예외로 다시 던지고 응답은 @ControllerAdvice에서 만들게 고쳤습니다.'
verified: 이 레슨의 실행 순서와 로그는 짐작이 아니라 자바 21에서 코드를 돌려 받은 값이에요. 컴파일 오류는 테스트 안에서 javac를 돌려, 로그는 Logback으로 확인했어요. 코드가 바뀔 때마다 테스트([ExceptionTest](link:test))가 다시 돌아요.
footer: '근거: 예외의 종류와 체크 예외의 검사는 자바 언어 명세 11장([링크](link:jls11)), try-with-resources는 14.20.3([링크](link:jlsTry)), cause와 suppressed는 Throwable API 문서([링크](link:throwable)), 스프링의 DataAccessException은 스프링 프레임워크 문서. 결과는 OpenJDK 21에서 테스트로 확인했어요. 오류는 [GitHub 이슈](https://github.com/wanja727/dev-lessons/issues)로 알려 주세요.'
claims:
  - claim: '코드 predict의 출력 순서는 본문, B 닫힘, A 닫힘, catch, finally다. 예외가 없으면 본문, B 닫힘, A 닫힘, finally다'
    how: '출력 대신 리스트에 기록해서 두 경우를 돌린다'
    test: ExceptionTest.predict
  - claim: '본문과 `close()`가 둘 다 예외를 던지면 본문의 예외가 나가고 `close()`의 예외는 `getSuppressed()`에 하나 붙는다'
    how: '`close()`가 예외를 던지는 자원으로 돌려 잡힌 예외의 타입과 suppressed를 본다'
    test: ExceptionTest.suppressed
  - claim: '세 메서드를 거친 호출에서 예외가 던져지면 던진 줄 뒤의 줄들은 실행되지 않고 `catch` 블록이 실행된다'
    how: '각 줄에서 기록을 남겨 S1, C1, ERR을 확인한다'
    test: ExceptionTest.propagation
  - claim: '스택 트레이스의 맨 위는 예외가 던져진 메서드이고 그 아래가 부른 메서드다'
    how: '`getStackTrace()`의 앞 두 칸의 메서드 이름을 본다'
    test: ExceptionTest.stackTrace
  - claim: '`try`에서 `return`해도 `finally`가 실행된다. `finally`에서 `return`하면 던져지던 예외가 사라진다'
    how: '두 메서드를 돌려 반환값과 기록을 본다'
    test: ExceptionTest.finallyRules
  - claim: '예외를 삼킨 메서드는 호출한 쪽에 정상 값을 돌려준다'
    how: '코드 swallow를 실패하는 `client`로 돌려 반환값을 본다'
    test: ExceptionTest.swallowing
  - claim: '원인을 넘겨 다시 던지면 `getCause()`가 원래 예외이고 스택 트레이스에 `Caused by`가 있다. 넘기지 않으면 `getCause()`가 null이다'
    how: '두 방식으로 만든 예외의 `getCause()`와 출력한 스택 트레이스 문자열을 본다'
    test: ExceptionTest.rethrowWithCause
  - claim: '`log.error(메시지, 예외)`로 남긴 로그에는 예외 정보가 붙고, 메시지 문자열에 `e.getMessage()`만 이어 붙인 로그에는 붙지 않는다'
    how: 'Logback의 `ListAppender`를 로거에 달아 두 줄을 남긴 뒤 이벤트의 `getThrowableProxy()`가 있는지 본다'
    test: ExceptionTest.loggingException
  - claim: '체크 예외를 잡지도 선언하지도 않으면 컴파일되지 않고, 언체크 예외는 된다'
    how: '`JavaSource`로 세 소스를 컴파일한다'
    test: ExceptionTest.checkedVersusUnchecked
  - claim: '부모 타입의 `catch`를 자식 타입의 `catch`보다 먼저 쓰면 컴파일되지 않는다'
    how: '`JavaSource`로 소스를 컴파일해 오류가 있는지 본다'
    test: ExceptionTest.catchOrder
