# 예외
# 자료 파일의 칸은 docs/lesson-data-format.md에 있다. 문제는 content/questions/exception.yaml에 있다.
title: 예외
description: 체크 예외와 언체크 예외의 차이, 예외가 던져지면 실행이 어디로 가는지, try-with-resources가 해 주는 것, 예외를 잡고 아무것도 하지 않으면 생기는 일. 네 가지 질문에 스스로 답할 수 있게, 결제 실패를 처리하는 코드로 배우는 대화형 레슨.
unit: 자바 언어
minutes: 22
roadmap: J10
type: 자바 실행
prerequisites:
  - {slug: inheritance-polymorphism, title: 상속과 다형성}
assume: '자바 21. `try`와 `catch`를 써 본 것. 부모 타입의 변수가 자식 객체를 가리킬 수 있다는 것(상속과 다형성 레슨).'
example: '결제를 요청하는 `PaymentClient`와 닫아야 하는 자원 `Res`(닫힐 때 이름을 기록하는 `AutoCloseable`). 결제가 실패했을 때 실행이 어디로 가고, 자원이 언제 닫히고, 호출한 쪽이 실패를 아는지 봐요. 실무 구역에서는 서비스의 예외 클래스와 로그로 옮겨요.'
intro:
  - '결제가 실패했는데 주문은 "결제 완료"로 저장됐어요. 로그에는 "결제 실패"라는 한 줄만 있고, 어디서 왜 실패했는지 알려 줄 스택 트레이스는 없어요. 코드를 열어 보니 `catch` 블록이 로그 한 줄을 찍고 끝나 있었어요.'
  - '서버 코드는 실패할 수 있는 일로 가득해요. DB, 외부 API, 잘못된 입력이 그래요. 스프링 개발자는 어떤 예외를 만들어 던질지, 어디서 잡을지, 잡았다면 무엇을 남기고 다시 던질지를 정해요. 스프링의 트랜잭션 롤백과 에러 응답이 모두 "예외가 메서드 밖으로 나갔는가"를 보고 움직여요.'
  - '이 레슨에서는 예외가 던져졌을 때 실행되는 줄의 순서를 코드를 돌려 확인하고, 예외를 삼켰을 때 호출한 쪽에 무엇이 보이는지를 봐요.'
covers:
  - topic: '예외의 계층: Throwable, Error, Exception, RuntimeException'
    where: '질문 1'
  - topic: '체크 예외와 언체크 예외: 컴파일러가 처리(잡거나 throws로 선언)를 강제하는가'
    where: '질문 1'
  - topic: 'throw와 throws의 차이, Error는 잡지 않는다'
    where: '질문 1'
  - topic: '예외가 던져지면 호출 스택을 거슬러 올라가 맞는 catch를 찾는다. 그 사이의 줄은 실행되지 않는다'
    where: '질문 2'
  - topic: 'catch는 위에서부터 맞는 첫 블록이 받는다. 부모 타입의 catch는 자식 예외도 받는다. 여러 타입을 한 번에 잡기'
    where: '질문 2'
  - topic: 'finally는 예외가 나든 안 나든 실행된다'
    where: '질문 2'
  - topic: 'finally에서 return하면 예외가 사라진다'
    where: '질문 2의 더 알아보기'
  - topic: '스택 트레이스 읽기: 맨 위가 던져진 곳, Caused by가 원인'
    where: '질문 2, 질문 4'
  - topic: 'try-with-resources와 AutoCloseable: 선언의 반대 순서로, catch와 finally보다 먼저 닫힌다'
    where: '질문 3'
  - topic: '본문과 close가 둘 다 예외를 던질 때: 본문의 예외가 나가고 close의 예외는 suppressed로 붙는다'
    where: '질문 3'
  - topic: '예외를 삼키면 호출한 쪽은 성공한 줄 안다'
    where: '질문 4'
  - topic: '다른 예외로 바꿔 던질 때 원인(cause)을 넘기지 않으면 원래의 스택 트레이스를 잃는다'
    where: '질문 4'
  - topic: '예외를 다루는 기준: 복구할 수 있는 곳에서만 잡는다, Exception으로 넓게 잡지 않는다, 흐름 제어에 쓰지 않는다'
    where: '질문 4, 실무에서는'
  - topic: '직접 만드는 예외 클래스: 무엇을 상속하고 무엇을 담나'
    where: '실무에서는'
  - topic: '예외를 로그로 남기는 법: 예외 객체를 마지막 인자로 넘긴다'
    where: '실무에서는'
  - topic: '스프링이 언체크 예외를 쓰는 이유(SQLException을 DataAccessException으로 바꾼다)'
    where: '실무에서는'
  - topic: '스택 트레이스를 만드는 비용'
    where: '질문 4의 더 알아보기'
  - topic: '@Transactional이 롤백하는 예외와 하지 않는 예외'
    where: '다루지 않음: 트랜잭션 전파와 롤백 규칙(S11)'
  - topic: '@ControllerAdvice로 예외를 에러 응답으로 바꾸기'
    where: '다루지 않음: 예외 처리와 검증(S8)'
  - topic: '커넥션을 닫지 않으면 생기는 일'
    where: '다루지 않음: DB 커넥션과 커넥션 풀(D6)'
  - topic: 'StackOverflowError와 OutOfMemoryError가 나는 이유'
    where: '다루지 않음: JVM 메모리 구조(J14)'
  - topic: '람다 안에서 체크 예외를 던질 때의 문제'
    where: '다루지 않음: 람다와 함수형 인터페이스(J12)'
  - topic: '다른 스레드에서 난 예외를 받는 방법'
    where: '다루지 않음: Future와 CompletableFuture(C8)'
codes:
  predict: |-
    try (Res a = new Res("A");
         Res b = new Res("B")) {
      print("본문");
      throw new IllegalStateException("실패");
    } catch (IllegalStateException e) {
      print("catch");
    } finally {
      print("finally");
    }
  res: |-
    class Res implements AutoCloseable {
      private final String name;
      Res(String name) { this.name = name; }

      @Override
      public void close() {
        print(name + " 닫힘");
      }
    }
  hierarchy: |-
    Throwable
    ├─ Error              잡지 않는다
    │   ├─ OutOfMemoryError
    │   └─ StackOverflowError
    └─ Exception          체크 예외
        ├─ IOException
        ├─ SQLException
        └─ RuntimeException  언체크 예외
            ├─ NullPointerException
            ├─ IllegalArgumentException
            └─ IllegalStateException
  checkedRun: |-
    // 1. 잡지도 선언하지도 않음
    String read(Path path) {
      return Files.readString(path);
    }
    // 2. 언체크 예외를 던짐
    void find() {
      throw new OrderNotFoundException();
    }
    // 3. throws로 선언함
    String read(Path path) throws IOException
  calls: |-
    void controller() {
      try {
        service();
        print("OK");
      } catch (IllegalStateException e) {
        print("ERR");
      }
    }

    void service() {
      print("S1");
      client();
      print("S2");
    }

    void client() {
      print("C1");
      throw new IllegalStateException(
          "결제 서버 응답 없음");
    }
  stackRun: |-
    // client()가 던진 예외의 스택 트레이스
  suppressedRun: |-
    // close()가 IllegalArgumentException("닫기")를
    // 던지는 자원
    try (Res r = new Res("R", true)) {
      throw new IllegalStateException("본문");
    }
  swallow: |-
    boolean pay(long orderId) {
      try {
        client.request(orderId);
      } [[catch (Exception e)]] {
        log.error("결제 실패");
      }
      return true;
    }
  rethrow: |-
    void pay(long orderId) {
      try {
        client.request(orderId);
      } catch (IOException e) {
        throw new PaymentFailedException(
            orderId, [[e]]);
      }
    }
  exceptionClass: |-
    class PaymentFailedException
        extends [[RuntimeException]] {

      PaymentFailedException(long orderId,
          Throwable cause) {
        super("결제 실패 orderId=" + orderId,
            [[cause]]);
      }
    }
  logBad: |-
    } catch (Exception e) {
      log.error([["결제 실패: " + e.getMessage()]]);
    }
  logFixed: |-
    } catch (IOException e) {
      log.error("결제 실패 orderId={}",
          orderId, [[e]]);
      throw new PaymentFailedException(
          orderId, e);
    }
  logRun: |-
    log.error("결제 실패: " + e.getMessage());
    log.error("결제 실패 orderId={}",
        orderId, e);
  jdbc: |-
    try ([[Connection con]] = dataSource
             .getConnection();
         PreparedStatement ps =
             con.prepareStatement(sql)) {
      ...
    }
