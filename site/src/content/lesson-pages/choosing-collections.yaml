  lru: |-
    new LinkedHashMap<K, V>(16, 0.75f, [[true]]) {
      protected boolean removeEldestEntry(
          Map.Entry<K, V> e) {
        return [[size() > 3]];
      }
    };
  status: |-
    enum Status { ORDERED, PAID, SHIPPED }

    Map<Status, Integer> count =
        [[new EnumMap<>(Status.class)]];
