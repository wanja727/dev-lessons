    }
  enumSet: |-
    Set<Status> done =
        EnumSet.of(Status.PAID, Status.SHIPPED);
  declare: |-
    [[Map<Status, Integer>]] count =
        new EnumMap<>(Status.class);

    [[List<Order>]] findRecent(int days) {
      ...
    }
  removeLoop: |-
    List<String> cart = new ArrayList<>(
        List.of("A", "B", "C", "D"));
    for (String item : cart) {
      if (item.equals("B")) {
        [[cart.remove(item)]];
      }
    }
  removeIf: |-
    cart.removeIf(item -> item.equals("B"));
  iteratorRemove: |-
    Iterator<String> it = cart.iterator();
    while (it.hasNext()) {
      if (it.next().equals("B")) {
        [[it.remove()]];
      }
    }
  mapRemove: |-
