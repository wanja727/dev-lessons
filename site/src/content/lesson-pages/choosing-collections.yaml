# 컬렉션 고르기 (설계서)
# 자료 파일의 칸은 docs/lesson-data-format.md에 있다.
stage: design
title: 컬렉션 고르기
unit: 자료구조와 알고리즘
roadmap: K10
type: 자바 실행
prerequisites:
  - {slug: array-and-linked-list, title: 배열과 연결 리스트}
  - {slug: hash-table, title: 해시 테이블}
  - {slug: binary-search-tree, title: 이진 탐색 트리}
assume: '자바 21(OpenJDK). `ArrayList`, `HashMap`, `TreeMap`이 안에서 어떻게 동작하는지(배열과 연결 리스트, 해시 테이블, 이진 탐색 트리 레슨). enum(enum 레슨)과 제네릭(제네릭 레슨).'
example: '주문 처리 서비스의 요구 다섯 가지. 장바구니에 담은 순서대로 보여 주기, 쿠폰을 이미 썼는지 확인하기, 회원 id로 등급 찾기, 주문 상태별 개수 세기, 금액 구간별로 묶기. 요구마다 맞는 컬렉션을 고르고 틀리게 골랐을 때의 비용을 재요. 실무 구역에서는 스트림의 `groupingBy`가 만드는 맵과 응답 JSON으로 옮겨요.'
intro:
  - '쿠폰 번호 목록을 `List`에 담아 두고 `contains`로 이미 쓴 쿠폰인지 확인하는 코드가 있어요. 쿠폰이 100개일 때는 아무 문제가 없었는데, 50만 개가 되자 결제 API가 느려졌어요. `HashSet`으로 바꾼 한 줄로 해결됐어요. 컬렉션은 담는 그릇이 아니라 무엇을 빨리 할지를 고르는 선택이에요.'
  - '자바 개발자는 하루에도 수십 번 `new ArrayList`, `new HashMap`을 써요. 대개 습관으로 고르지만, 순서가 필요한지, 중복을 막아야 하는지, 키로 찾는지, 키가 enum인지에 따라 맞는 구현이 달라요. 면접에서도 "`List`, `Set`, `Map`을 언제 쓰나요", "`HashMap`과 `TreeMap`과 `LinkedHashMap`의 차이는"을 물어요.'
  - '이 레슨에서는 요구 다섯 가지마다 맞는 컬렉션을 고르고, 같은 요구를 다른 컬렉션으로 처리했을 때 결과와 걸린 시간이 어떻게 달라지는지 확인해요. 돌면서 지우다 예외가 나는 이유도 봐요.'
covers:
  - topic: '고르는 첫 질문: 무엇으로 꺼내나. 위치와 순서로는 List, 들어 있는지는 Set, 키로는 Map, 넣은 순서나 우선순위로는 Queue'
    where: '질문 1'
  - topic: 'List는 중복을 허용하고 순서를 지킨다. Set은 중복을 막는다. Map은 키가 겹치면 값을 덮어쓴다'
    where: '질문 1'
  - topic: 'List.contains는 O(n), HashSet.contains는 평균 O(1). 들어 있는지 자주 묻는다면 Set'
    where: '질문 1. 원리는 시간 복잡도(K1), 해시 테이블(K4)'
  - topic: 'Set과 Map의 세 구현: Hash는 순서 없이 평균 O(1), LinkedHash는 넣은 순서를 지키며 평균 O(1), Tree는 키 순서를 지키며 O(log n)'
    where: '질문 2'
  - topic: 'Tree 구현만 주는 것: 범위로 자르기, 이 값 이하인 가장 큰 키'
    where: '질문 2. 자세히는 이진 탐색 트리(K8)'
  - topic: 'LinkedHashMap의 접근 순서 모드로 가장 오래 안 쓴 것부터 지우는 캐시'
    where: '질문 2의 더 알아보기. 캐시 전략은 캐시 전략과 무효화(A4)'
  - topic: 'List의 구현은 거의 언제나 ArrayList. LinkedList를 고를 일은 드물다'
    where: '질문 3. 이유는 배열과 연결 리스트(K2)'
  - topic: '키가 enum이면 EnumMap, 원소가 enum이면 EnumSet. 배열과 비트로 담아 더 빠르고 작으며 선언 순서로 돈다'
    where: '질문 3. enum은 enum(J8)'
  - topic: '스택과 큐는 ArrayDeque, 우선순위는 PriorityQueue'
    where: '질문 3. 스택과 큐(K3), 힙과 우선순위 큐(K9)'
  - topic: '변수와 매개변수는 인터페이스 타입(List, Map)으로 선언한다. 구현을 바꿔도 쓰는 쪽을 고치지 않는다'
    where: '질문 3'
  - topic: '향상된 for로 돌면서 컬렉션에서 지우면 ConcurrentModificationException이 난다. 반복자가 구조가 바뀐 것을 알아채기 때문이다(fail-fast)'
    where: '질문 4'
  - topic: '돌면서 지우는 바른 방법: removeIf, Iterator.remove, 새 컬렉션에 모으기'
    where: '질문 4'
  - topic: 'fail-fast는 최선을 다할 뿐 약속이 아니다. 마지막에서 두 번째 원소를 지우면 예외 없이 끝나기도 한다'
    where: '질문 4의 더 알아보기'
  - topic: 'Collectors.groupingBy는 맵의 종류를 약속하지 않는다(지금은 HashMap). 순서가 필요하면 맵을 만드는 함수를 넘긴다'
    where: '실무에서는'
  - topic: '바꿀 수 없는 컬렉션 List.of, List.copyOf, unmodifiableList의 차이'
    where: '다루지 않음: 불변 객체(J9)'
  - topic: '여러 스레드가 함께 쓰는 컬렉션(ConcurrentHashMap, CopyOnWriteArrayList)'
    where: '다루지 않음: 스레드에 안전한 객체(C6)'
  - topic: 'JPA 엔티티의 연관 컬렉션을 List로 둘지 Set으로 둘지'
    where: '다루지 않음: JPA N+1 문제(P5)'
codes:
  predict: |-
    List<String> used = loadUsedCoupons();
    // 쿠폰 50만 개

    boolean canUse(String code) {
      return !used.contains(code);
    }
  status: |-
    enum Status { ORDERED, PAID, SHIPPED }

    Map<Status, Integer> count =
        new EnumMap<>(Status.class);
    for (Order o : orders) {
      count.merge(o.status(), 1,
          Integer::sum);
    }
  removeLoop: |-
    List<String> cart = new ArrayList<>(
        List.of("A", "B", "C", "D"));
    for (String item : cart) {
      if (item.equals("B")) {
        cart.remove(item);
      }
    }
  removeIf: |-
    cart.removeIf(item -> item.equals("B"));
  grouping: |-
    Map<Integer, List<Order>> byBand =
        orders.stream().collect(
            Collectors.groupingBy(
                o -> o.amount() / 10_000));
  groupingSorted: |-
    Map<Integer, List<Order>> byBand =
        orders.stream().collect(
            Collectors.groupingBy(
                o -> o.amount() / 10_000,
                TreeMap::new,
                Collectors.toList()));
predict:
  text: '코드 predict는 이미 쓴 쿠폰 50만 개를 `ArrayList`에 담아 두고, 결제할 때마다 `contains`로 확인해요. `used`를 `HashSet`으로 바꾸면 없는 쿠폰 하나를 확인하는 비교 횟수는 어떻게 될까요? 보기: 거의 그대로 50만 번, 절반인 25만 번, 몇 번.'
  answer: '몇 번. `HashSet`은 해시 값으로 칸 하나만 본다. `ArrayList`는 50만 개를 모두 비교한다. 질문 1에서 밝힌다.'
questions:
  - id: q1
    title: List, Set, Map 가운데 무엇을 고르나요?
    conclusion:
      lead: '무엇으로 꺼낼지로 골라요. 위치와 순서로 꺼내면 `List`, 들어 있는지를 물으면 `Set`, 키로 값을 찾으면 `Map`이에요.'
      sub: '`List`에 담아 두고 들어 있는지를 자주 물으면 매번 전부 비교해서 느려져요. 묻는 일에 맞는 그릇을 고르면 같은 일이 O(n)에서 O(1)이 돼요.'
    says:
      - '세 인터페이스가 약속하는 것을 나란히 둔다. `List`는 순서가 있고 같은 값을 여러 번 담는다. `Set`은 같은 값을 한 번만 담는다. `Map`은 키마다 값 하나를 담고 같은 키로 다시 넣으면 덮어쓴다'
      - '예제 요구 다섯 가지를 이 기준으로 가른다. 장바구니를 담은 순서대로 보여 준다: 순서가 필요하고 같은 상품을 두 번 담을 수 있으니 `List`. 쿠폰을 이미 썼는지: 들어 있는지를 물으니 `Set`. 회원 id로 등급: 키로 찾으니 `Map`. 나머지 둘은 질문 2와 3에서 고른다'
      - '예측의 답을 밝힌다. 코드 predict의 쿠폰 50만 개를 `ArrayList`와 `HashSet`에 담아 없는 쿠폰을 확인하는 `equals` 호출 수와 1만 번 확인하는 시간을 실측값으로 보인다'
      - '중복을 막는 일도 `Set`이 한다. `List`에 넣기 전에 `contains`로 확인하는 코드는 `Set.add`가 돌려주는 boolean 하나로 바뀐다'
      - '넣은 순서대로 꺼내거나 우선순위로 꺼내야 하면 `Queue`다. 질문 3에서 다룬다'
    widget:
      kind: classify
      note: '요구 문장 여덟 개를 `List`, `Set`, `Map`, `Queue` 칸으로 나눈다. 예: 장바구니를 담은 순서대로 보여 준다, 쿠폰을 이미 썼는지 확인한다, 회원 id로 등급을 찾는다, 먼저 들어온 문의부터 처리한다, 오늘 방문한 회원 수를 센다(같은 회원은 한 번), 상품 코드로 재고를 찾는다, 게시글의 댓글을 단 순서대로 보여 준다(같은 내용의 댓글도 따로 보인다), 마감이 이른 작업부터 처리한다. 틀리면 그 칸이 맞지 않는 이유를 한 줄로 보인다'
    asks:
      - '본문의 예시: 오늘 접속한 회원의 id를 모아 서로 다른 회원 수를 센다. 같은 회원이 여러 번 접속한다. 무엇에 담나 (`Set`. 같은 id를 한 번만 담고 `size()`가 답이다)'
      - '옮긴 상황: 상품 1만 개 각각에 대해 그 상품이 할인 대상 목록 5천 개에 있는지 확인한다. 할인 대상을 `List`에 담을 때와 `HashSet`에 담을 때 전체 비교 횟수는 각각 어느 정도인가 (`List`는 최악 5천만 번, `HashSet`은 1만 번 남짓)'
  - id: q2
    title: 같은 Set과 Map이라도 Hash, LinkedHash, Tree는 무엇이 다른가요?
    conclusion:
      lead: '꺼낼 때의 순서와 비용이 달라요. Hash는 순서가 없고, LinkedHash는 넣은 순서를, Tree는 키의 크기 순서를 지켜요.'
      sub: 'Hash와 LinkedHash는 평균 O(1), Tree는 O(log n)이에요. 순서가 필요 없으면 Hash를, 넣은 순서가 필요하면 LinkedHash를, 키의 순서나 범위가 필요하면 Tree를 골라요.'
    says:
      - '같은 키 다섯 개를 `HashMap`, `LinkedHashMap`, `TreeMap`에 같은 순서로 넣고 `keySet()`을 출력한다. 세 줄이 다르게 나오는 것을 보인다. 이유는 각각 K4의 질문 4, K8에서 다뤘다'
      - '비용. 키 100만 개를 넣고 찾는 시간을 셋으로 재서 실측값으로 보인다. Tree가 가장 느리다. LinkedHash는 Hash와 거의 같고 메모리를 조금 더 쓴다'
      - 'Tree만 주는 것. 예제의 금액 구간별로 묶기는 구간을 금액 순으로 보여 줘야 하니 `TreeMap`이다. 범위로 자르는 `subMap`과 `floorKey`도 Tree만 있다(K8)'
      - '`Set`도 같다. `HashSet`, `LinkedHashSet`, `TreeSet`은 각각 안에 같은 이름의 맵을 가진다'
      - '고르는 표 하나: 순서, 찾는 비용, 범위 질의, null 키, 키의 조건(`hashCode`와 `equals` 또는 비교)'
      - '더 알아보기: `LinkedHashMap`을 접근 순서 모드(`new LinkedHashMap<>(16, 0.75f, true)`)로 만들면 `get`할 때마다 그 키가 맨 뒤로 간다. `removeEldestEntry`를 재정의해 크기를 넘으면 맨 앞(가장 오래 안 쓴 것)을 지우게 하면 작은 캐시가 된다'
    asks:
      - '본문의 예시: 주문 상태 변경 기록을 키(변경 시각)로 담아, 들어온 시각 순서대로 다시 보여 주려 한다. 시각은 늘 커지는 순서로 들어온다. `LinkedHashMap`과 `TreeMap` 가운데 무엇이든 순서는 맞나, 그리고 찾는 비용은 각각 무엇인가 (둘 다 맞다. `LinkedHashMap`은 평균 O(1), `TreeMap`은 O(log n))'
      - '옮긴 상황: 검색어를 넣은 순서대로 보여 주되 같은 검색어는 한 번만 보여 준다. 무엇을 고르나 (`LinkedHashSet`)'
  - id: q3
    title: 키가 enum이거나 큐가 필요할 때는 무엇을 쓰나요?
    conclusion:
      lead: '키가 enum이면 `EnumMap`, 원소가 enum이면 `EnumSet`을 쓰고, 큐는 `ArrayDeque`, 우선순위 큐는 `PriorityQueue`를 써요.'
      sub: '`EnumMap`과 `EnumSet`은 enum의 상수 수가 정해져 있다는 것을 이용해 배열과 비트로 담아서, 해시를 계산하지 않고 선언 순서로 돌아요. 리스트는 거의 언제나 `ArrayList`예요.'
    says:
      - '코드 status. 주문 상태별 개수를 센다. 키가 `Status` enum이다. `EnumMap`은 상수의 선언 순서(`ordinal`)를 배열의 칸 번호로 쓴다. 해시 계산도 충돌도 없다. 돌면 선언 순서로 나와서 화면에 ORDERED, PAID, SHIPPED 순서가 지켜진다'
      - '`EnumSet`은 상수마다 비트 하나로 담는다. 상수가 64개 이하면 long 하나다. `EnumSet.of(PAID, SHIPPED)`, `EnumSet.range(...)`로 만든다'
      - '`HashMap<Status, Integer>`와 비교해 같은 결과와 걸린 시간을 실측값으로 보인다'
      - '큐가 필요하면 `ArrayDeque`(K3), 우선순위로 꺼내려면 `PriorityQueue`(K9)다. `LinkedList`를 큐나 리스트로 고를 일은 드물다(K2)'
      - '선언은 인터페이스로 한다. `Map<Status, Integer> count = new EnumMap<>(...)`. 쓰는 쪽은 `Map`만 알아서 구현을 바꿔도 고칠 곳이 한 줄이다. 메서드의 매개변수와 반환 타입도 `List`, `Map`으로 둔다'
    asks:
      - '본문의 예시: 코드 status를 돌린 뒤 `count`를 `for`로 출력하면 어떤 순서로 나오나 (ORDERED, PAID, SHIPPED. 선언 순서)'
      - '옮긴 상황: 요일(`DayOfWeek` enum)마다 영업 시간을 담는다. `HashMap`과 `EnumMap` 가운데 무엇이 맞고 왜 그런가 (`EnumMap`. 키가 enum이라 배열로 담아 빠르고, 월요일부터 선언 순서로 돈다)'
  - id: q4
    title: 컬렉션을 돌면서 지우면 왜 예외가 나나요?
    conclusion:
      lead: '반복자가 도는 동안 컬렉션의 구조가 반복자 모르게 바뀐 것을 알아채고 `ConcurrentModificationException`을 던지기 때문이에요.'
      sub: '돌면서 지우려면 `removeIf`나 반복자의 `remove`를 써요. 반복자를 거쳐 지우면 반복자가 바뀐 것을 알아요.'
    says:
      - '코드 removeLoop. 향상된 `for`는 안에서 반복자를 쓴다. 반복 중에 `cart.remove(item)`으로 리스트를 직접 고친다. 다음 원소로 넘어갈 때 반복자가 예외를 던진다. 실제 예외를 보인다'
      - '알아채는 방법. `ArrayList`는 구조를 바꿀 때마다 수정 횟수(`modCount`)를 하나 늘린다. 반복자는 만들 때의 수를 기억해 두고, 다음으로 넘어갈 때마다 비교한다. 다르면 예외를 던진다. 이것을 fail-fast라고 한다. 지운 뒤 엉뚱한 원소를 건너뛰거나 두 번 보는 것보다 바로 실패하는 편이 낫기 때문이다'
      - '"Concurrent"라는 이름이지만 스레드가 하나여도 난다'
      - '고친 코드 셋. 코드 removeIf: 조건으로 지운다. 가장 짧다. `Iterator`를 직접 쓰고 `it.remove()`를 부른다: 반복자를 거쳐 지운다. 남길 것만 새 리스트에 모은다: 스트림의 `filter`. 셋 모두 같은 결과 `[A, C, D]`를 보인다'
      - '`HashMap`도 같다. `map.keySet()`을 돌며 `map.remove(key)`를 하면 예외가 난다. `map.entrySet().removeIf(...)`나 `map.values().removeIf(...)`를 쓴다'
      - '더 알아보기: fail-fast는 최선을 다할 뿐 약속이 아니다. 코드 removeLoop에서 "C"(끝에서 두 번째)를 지우면 예외 없이 끝나고 "D"를 보지 않는다. 반복자가 남은 원소가 없다고 보고 비교하기 전에 멈추기 때문이다. 예외가 나지 않았다고 맞는 코드가 아니다'
    asks:
      - '본문의 예시: 코드 removeLoop에서 지우는 조건을 "A"로 바꾸면 어떻게 되나 (`ConcurrentModificationException`. 지운 뒤 다음 원소로 넘어갈 때 반복자가 알아챈다)'
      - '옮긴 상황: 재고가 0인 상품을 `Map<String, Integer> stock`에서 지우려고 `for (String k : stock.keySet()) if (stock.get(k) == 0) stock.remove(k);`를 썼다. 무엇으로 바꾸나 (`stock.values().removeIf(v -> v == 0)`. 또는 `entrySet().removeIf`)'
      - '실무 구역: 코드 grouping으로 금액 구간별로 묶은 맵을 `for`로 돌면 구간이 금액 순으로 나온다고 할 수 있나 (없다. `groupingBy`는 맵의 종류를 약속하지 않고 지금 구현은 `HashMap`이다)'
practice:
  says:
    - '스트림의 `groupingBy`(코드 grouping)는 어떤 맵을 만들지 API 문서가 약속하지 않고, 지금 구현은 `HashMap`을 만든다. 금액 구간을 순서대로 보여 줄 화면이면 순서가 운에 맡겨진다. 고친 코드: 코드 groupingSorted처럼 맵을 만드는 함수(`TreeMap::new`)를 둘째 인자로 넘긴다. 같은 데이터로 두 맵을 만들어 돌린 순서를 테스트로 남긴다. 키가 enum이면 `() -> new EnumMap<>(Status.class)`를 넘긴다'
    - '흔한 실수: 서비스 코드가 `List`를 받아 `contains`를 반복 안에서 부른다(질문 1). 받은 쪽에서 `new HashSet<>(list)`로 한 번 바꿔 두고 쓴다. 바꾸는 비용은 O(n) 한 번이다'
    - '응답의 순서가 필요한 곳(정렬된 그룹, 상태별 개수)에서 맵을 그대로 JSON으로 내보내면 잭슨은 맵을 도는 순서로 쓴다. 순서를 지키는 맵을 고르는 것이 응답 순서를 정하는 일이다. 해시 테이블(K4)의 실무 구역에서 본 것과 같다'
claims:
  - claim: '쿠폰 50만 개에서 없는 쿠폰을 확인할 때 `ArrayList`는 `equals`를 50만 번, `HashSet`은 몇 번 부른다'
    how: '`equals`를 세는 쿠폰 래퍼로 센다. 1만 번 확인하는 시간도 `CiOutput`에 남긴다'
  - claim: '같은 키를 같은 순서로 넣어도 `HashMap`, `LinkedHashMap`, `TreeMap`의 `keySet` 순서가 다르다'
    how: '세 맵의 출력을 남긴다'
  - claim: '`TreeMap`은 키 100만 개에서 `HashMap`보다 넣고 찾는 데 오래 걸린다'
    how: '걸린 시간을 남긴다. 어느 쪽이 빠른지만 단정한다'
  - claim: '`EnumMap`은 선언 순서로 돌고, 같은 집계를 `HashMap`으로 한 결과와 값이 같다'
    how: '코드 status를 두 맵으로 돌린다'
  - claim: '코드 removeLoop는 "B"나 "A"를 지우면 `ConcurrentModificationException`, "C"를 지우면 예외 없이 끝나고 "D"를 보지 않는다'
    how: '세 경우를 돌리고, 본 원소를 모은다'
  - claim: '`removeIf`, `Iterator.remove`, `filter`는 모두 `[A, C, D]`를 남긴다'
    how: '세 방법을 돌린다'
  - claim: '자바 21에서 `groupingBy`의 기본 맵은 `HashMap`이고, `TreeMap::new`를 넘기면 키 순서로 돈다'
    how: '`getClass()`와 도는 순서를 본다'
  - claim: '접근 순서 `LinkedHashMap`에 `removeEldestEntry`를 두면 크기를 넘을 때 가장 오래 안 쓴 키가 지워진다'
    how: '크기 3으로 넣고 `get`한 뒤 넷째를 넣어 남은 키를 본다'
sources:
  - '컬렉션 인터페이스와 구현의 개요: 자바 컬렉션 프레임워크 문서 https://docs.oracle.com/en/java/javase/21/core/java-collections-framework.html'
  - '`EnumMap`, `EnumSet`이 배열과 비트로 담는다는 것: API 문서 https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/EnumMap.html , https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/EnumSet.html'
  - 'fail-fast 반복자와 그것이 약속이 아니라는 것: `ArrayList` API 문서 https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/ArrayList.html'
