predict:
  title: 그릇 하나만 바꾸면?
  text: '코드 predict는 이미 쓴 쿠폰 50만 개를 `ArrayList`에 담아 두고, 결제할 때마다 `contains`로 확인해요. `used`를 `HashSet`으로 바꾸면, 없는 쿠폰 하나를 확인할 때 쿠폰끼리 `equals`로 비교하는 횟수는 어떻게 될까요? 답은 질문 1에 나와요.'
  code: predict
  label: 내 예측
  options:
    - value: same
      label: 거의 그대로 50만 번
    - value: half
      label: 절반인 25만 번
    - value: few
      label: 몇 번 이하
  answer: few
  storageKey: coll-predict
  wrong: 예측은 "{label}"이었어요. 틀린 예측이 더 오래 남으니 괜찮아요.
questions:
  - id: q1
    title: List, Set, Map 가운데 무엇을 고르나요?
    conclusion:
      lead: '무엇으로 꺼낼지로 골라요. 위치와 순서로 꺼내면 `List`, 들어 있는지를 물으면 `Set`, 키로 값을 찾으면 `Map`이에요.'
      sub: '`List`에 담아 두고 들어 있는지를 자주 물으면 매번 전부 비교해서 느려져요. 묻는 일에 맞는 그릇을 고르면 같은 일이 O(n)에서 O(1)이 돼요.'
    says:
      - '세 인터페이스가 약속하는 것을 나란히 둔다. `List`는 순서가 있고 같은 값을 여러 번 담는다. `Set`은 같은 값을 한 번만 담는다. `Map`은 키마다 값 하나를 담고 같은 키로 다시 넣으면 덮어쓴다'
      - '예제 요구 다섯 가지를 이 기준으로 가른다. 장바구니를 담은 순서대로 보여 준다: 순서가 필요하고 같은 상품을 두 번 담을 수 있으니 `List`. 쿠폰을 이미 썼는지: 들어 있는지를 물으니 `Set`. 회원 id로 등급: 키로 찾으니 `Map`. 나머지 둘은 질문 2와 3에서 고른다'
      - '예측의 답을 밝힌다. 코드 predict의 쿠폰 50만 개를 `ArrayList`와 `HashSet`에 담아 없는 쿠폰을 확인하는 `equals` 호출 수와 1만 번 확인하는 시간을 실측값으로 보인다. `HashSet`은 해시 값이 같은 원소에만 `equals`를 불러서, 없는 쿠폰에는 0번이었다'
      - '중복을 막는 일도 `Set`이 한다. `List`에 넣기 전에 `contains`로 확인하는 코드는 `Set.add`가 돌려주는 boolean 하나로 바뀐다'
      - '넣은 순서대로 꺼내거나 우선순위로 꺼내야 하면 `Queue`다. 질문 3에서 다룬다'
    widget:
      kind: classify
      note: '요구 문장 여덟 개를 `List`, `Set`, `Map`, `Queue` 칸으로 나눈다. 예: 장바구니를 담은 순서대로 보여 준다, 쿠폰을 이미 썼는지 확인한다, 회원 id로 등급을 찾는다, 먼저 들어온 문의부터 처리한다, 오늘 방문한 회원 수를 센다(같은 회원은 한 번), 상품 코드로 재고를 찾는다, 게시글의 댓글을 단 순서대로 보여 준다(같은 내용의 댓글도 따로 보인다), 마감이 이른 작업부터 처리한다. 틀리면 그 칸이 맞지 않는 이유를 한 줄로 보인다'
    asks:
      - '본문의 예시: 오늘 접속한 회원의 id를 모아 서로 다른 회원 수를 센다. 같은 회원이 여러 번 접속한다. 무엇에 담나 (`Set`. 같은 id를 한 번만 담고 `size()`가 답이다)'
      - '옮긴 상황: 상품 1만 개 각각에 대해 그 상품이 할인 대상 목록 5천 개에 있는지 확인한다. 할인 대상을 `List`에 담을 때와 `HashSet`에 담을 때 전체 비교 횟수는 각각 어느 정도인가 (`List`는 최악 5천만 번, `HashSet`은 1만 번 남짓)'
    body:
      - p: '자바의 컬렉션은 크게 셋이에요. 고르는 첫 질문은 **무엇으로 꺼내느냐**예요([자바 컬렉션 프레임워크 문서](link:framework)).'
      - table:
          head: [인터페이스, 약속하는 것, 꺼내는 방법]
          rows:
            - ['`List`', '순서가 있다. 같은 값을 여러 번 담는다', '위치(`get(i)`)와 순서']
            - ['`Set`', '같은 값을 한 번만 담는다', '들어 있는지(`contains`)']
            - ['`Map`', '키마다 값 하나. 같은 키로 넣으면 덮어쓴다', '키(`get(key)`)']
      - p: '주문 처리 서비스의 요구에 대 보면 이래요. **장바구니를 담은 순서대로** 보여 주기는 순서가 있고 같은 상품을 두 번 담을 수도 있으니 `List`예요. **쿠폰을 이미 썼는지**는 들어 있는지를 물으니 `Set`이에요. **회원 id로 등급**을 찾는 것은 키로 찾으니 `Map`이에요.'
      - h3: 들어 있는지를 List에 물으면
      - p: '처음 예측의 답은 **몇 번 이하**예요. {{predict-result}} 쿠폰 50만 개를 두 그릇에 담고 없는 쿠폰을 확인했어요.'
      - ci:
          key: predict
          label: 실제로 센 비교와 걸린 시간 보기
          source: ChoosingCollectionsTest.containsCost
          code: predict
      - p: '`ArrayList.contains`는 처음부터 끝까지 `equals`로 비교해요. 50만 번이에요. `HashSet`은 해시 값으로 칸 하나만 보고, 그 칸에 해시 값이 같은 원소가 있을 때만 `equals`를 불러요(해시 테이블 레슨). 없는 쿠폰이라 **0번**이었어요. 1만 번 확인하면 1분과 몇 밀리초의 차이예요. 고치는 곳은 한 줄이에요.'
      - code: fixed
      - p: '중복을 막는 일도 `Set`이 해요. 넣기 전에 `contains`로 확인할 필요가 없어요. `add`가 처음 넣었으면 `true`, 이미 있었으면 `false`를 돌려줘요.'
      - code: dedupBefore
      - code: dedupAfter
        notes:
          - mark: visitors.add(id)
            as: code
            text: '`visitors`가 `Set`이면 이 한 줄로 충분해요. 오늘 방문한 서로 다른 회원 수는 `visitors.size()`예요.'
      - p: '먼저 들어온 것부터, 또는 급한 것부터 꺼내야 하면 넷째 그릇 `Queue`예요. 질문 3에서 봐요. 요구 문장을 골라 보세요.'
      - widget:
          kind: classify
          categories: [List, Set, Map, Queue]
          items:
            - text: 장바구니에 담은 순서대로 상품을 보여 준다. 같은 상품을 두 번 담을 수 있다.
              answer: 1
              explain: 순서가 필요하고 같은 값을 여러 번 담으니 List예요.
            - text: 결제할 때 쿠폰을 이미 썼는지 확인한다.
              answer: 2
              explain: 들어 있는지를 묻는 일이라 Set이에요. List면 매번 전부 비교해요.
            - text: 회원 id로 회원 등급을 찾는다.
              answer: 3
              explain: 키(회원 id)로 값(등급)을 찾으니 Map이에요.
            - text: 먼저 들어온 고객 문의부터 처리한다.
              answer: 4
              explain: 넣은 순서대로 꺼내니 Queue예요.
            - text: 오늘 방문한 서로 다른 회원 수를 센다. 같은 회원이 여러 번 온다.
              answer: 2
              explain: 같은 id를 한 번만 담는 Set의 size()가 답이에요.
            - text: 상품 코드로 재고 수량을 찾는다.
              answer: 3
              explain: 키(상품 코드)로 값(재고)을 찾으니 Map이에요.
            - text: 게시글의 댓글을 단 순서대로 보여 준다. 같은 내용의 댓글도 따로 보인다.
              answer: 1
              explain: 순서가 있고 같은 값도 따로 담으니 List예요. Set이면 같은 내용이 하나로 합쳐져요.
            - text: 배송 작업을 마감이 이른 것부터 처리한다.
              answer: 4
              explain: 우선순위로 꺼내니 Queue, 그중 PriorityQueue예요.
      - quiz:
          q: '상품 1만 개마다 할인 대상 목록 5천 개에 있는지 확인해요. 할인 대상을 `List`에 담으면 비교는 최악 몇 번일까요?'
          options:
            - '1만 번'
            - '1만 5천 번'
            - '5천만 번'
          answer: 3
          explain: '`List.contains`는 한 번에 최악 5천 번 비교하고, 그걸 1만 번 해요. `HashSet`에 담으면 한 번에 칸 하나를 봐서 1만 번 남짓이에요.'
      - next: '`Set`과 `Map`도 구현이 셋씩 있어요. `HashMap`, `LinkedHashMap`, `TreeMap`은 무엇이 다를까요?'
    recall: '무엇으로 꺼낼지로 골라요. 위치와 순서로 꺼내면 `List`, 들어 있는지를 물으면 `Set`, 키로 값을 찾으면 `Map`, 넣은 순서나 우선순위로 꺼내면 `Queue`예요. `List.contains`는 전부 비교하는 O(n)이고 `HashSet.contains`는 평균 O(1)이라, 50만 개에서 없는 쿠폰을 확인하는 `equals`가 50만 번과 0번이었어요. 중복을 막는 일도 `Set.add` 하나로 해요.'
  - id: q2
    title: 같은 Set과 Map이라도 Hash, LinkedHash, Tree는 무엇이 다른가요?
    conclusion:
      lead: '꺼낼 때의 순서와 비용이 달라요. Hash는 순서가 없고, LinkedHash는 넣은 순서를, Tree는 키의 크기 순서를 지켜요.'
      sub: 'Hash와 LinkedHash는 평균 O(1), Tree는 O(log n)이에요. 순서가 필요 없으면 Hash를, 넣은 순서가 필요하면 LinkedHash를, 키의 순서나 범위가 필요하면 Tree를 골라요.'
    says:
      - '같은 키 다섯 개를 `HashMap`, `LinkedHashMap`, `TreeMap`에 같은 순서로 넣고 `keySet()`을 출력한다. 세 줄이 다르게 나오는 것을 보인다. 이유는 각각 K4의 질문 4, K8에서 다뤘다'
      - '비용. 키 100만 개를 넣고 찾는 시간을 셋으로 재서 실측값으로 보인다. Tree가 가장 느리다(테스트에서는 열 배 남짓). LinkedHash는 Hash와 같은 O(1)이지만 넣은 순서를 잇는 참조 때문에 조금 더 들고 메모리를 조금 더 쓴다'
      - 'Tree만 주는 것. 예제의 금액 구간별로 묶기는 구간을 금액 순으로 보여 줘야 하니 `TreeMap`이다. 범위로 자르는 `subMap`과 `floorKey`도 Tree만 있다(K8)'
      - '`Set`도 같다. `HashSet`, `LinkedHashSet`, `TreeSet`은 각각 안에 같은 이름의 맵을 가진다'
      - '고르는 표 하나: 순서, 찾는 비용, 범위 질의, null 키, 키의 조건(`hashCode`와 `equals` 또는 비교)'
      - '더 알아보기: `LinkedHashMap`을 접근 순서 모드(`new LinkedHashMap<>(16, 0.75f, true)`)로 만들면 `get`할 때마다 그 키가 맨 뒤로 간다. `removeEldestEntry`를 재정의해 크기를 넘으면 맨 앞(가장 오래 안 쓴 것)을 지우게 하면 작은 캐시가 된다'
    asks:
      - '본문의 예시: 주문 상태 변경 기록을 키(변경 시각)로 담아, 들어온 시각 순서대로 다시 보여 주려 한다. 시각은 늘 커지는 순서로 들어온다. `LinkedHashMap`과 `TreeMap` 가운데 무엇이든 순서는 맞나, 그리고 찾는 비용은 각각 무엇인가 (둘 다 맞다. `LinkedHashMap`은 평균 O(1), `TreeMap`은 O(log n))'
      - '옮긴 상황: 검색어를 넣은 순서대로 보여 주되 같은 검색어는 한 번만 보여 준다. 무엇을 고르나 (`LinkedHashSet`)'
    body:
      - p: '같은 과일 이름 다섯 개를 세 맵에 같은 순서로 넣고 키를 출력했어요.'
      - ci:
          key: order
          label: 실제 출력 보기
          source: ChoosingCollectionsTest.threeMapsOrder
          code: orderRun
      - ul:
          - '**`HashMap`**은 해시 값으로 정한 칸 순서로 돌아서 넣은 순서와도 이름 순서와도 달라요(해시 테이블 레슨).'
          - '**`LinkedHashMap`**은 해시 테이블에 더해 항목끼리 넣은 순서로 이어 둬서 **넣은 순서**로 돌아요.'
          - '**`TreeMap`**은 레드-블랙 트리라 **키의 크기 순서**로 돌아요(이진 탐색 트리 레슨).'
      - p: '비용도 달라요. 무작위 키 100만 개를 넣고 모두 찾아 봤어요.'
      - ci:
          key: timing
          label: 실제로 걸린 시간 보기
          source: ChoosingCollectionsTest.mapTiming
          code: timingRun
      - p: '`TreeMap`이 가장 오래 걸렸어요. 찾을 때마다 트리를 내려가는 O(log n)이라서예요. `LinkedHashMap`은 `HashMap`과 같은 평균 O(1)이지만 넣은 순서를 잇는 참조를 함께 고치느라 조금 더 들고 메모리도 더 써요. 걸린 시간은 기계마다 달라서 어느 쪽이 느린지만 보면 돼요.'
      - p: '그 대신 **`TreeMap`만 주는 것**이 있어요. 금액 구간별로 묶은 결과를 금액 순으로 보여 주려면 `TreeMap`이에요. 범위로 자르는 `subMap`, 이 값 이하에서 가장 큰 키 `floorKey`도 Tree에만 있어요.'
      - p: '`Set`도 같아요. `HashSet`, `LinkedHashSet`, `TreeSet`은 각각 안에 같은 이름의 맵을 두고 키만 써요.'
      - table:
          head: ['', 'Hash', 'LinkedHash', 'Tree']
          rows:
            - ['도는 순서', '정해지지 않음', '넣은 순서', '키 순서']
            - ['찾기, 넣기', '평균 O(1)', '평균 O(1)', 'O(log n)']
            - ['범위, 이웃 키', '없음', '없음', '`subMap`, `floorKey`']
            - ['null 키', '하나 됨', '하나 됨', '안 됨']
            - ['키의 조건', '`hashCode`, `equals`', '`hashCode`, `equals`', '`Comparable`이나 `Comparator`']
      - more:
          summary: '더 알아보기: LinkedHashMap으로 만드는 작은 캐시'
          body:
            - p: '`LinkedHashMap`을 접근 순서 모드로 만들면 `get`할 때마다 그 키가 맨 뒤로 가요. 그러면 맨 앞이 가장 오래 안 쓴 키예요. `removeEldestEntry`가 `true`를 돌려주면 넣은 뒤 맨 앞을 지워요.'
            - code: lru
            - p: 'a, b, c를 넣고 a를 `get`한 뒤 d를 넣으면, 가장 오래 안 쓴 b가 지워지고 c, a, d가 남아요. 테스트로 확인했어요. 실제 서비스의 캐시는 캐시 전략과 무효화 레슨에서 다뤄요.'
      - quiz:
          q: '검색어를 넣은 순서대로 보여 주되 같은 검색어는 한 번만 보여 줘요. 무엇을 고를까요?'
          options:
            - '`HashSet`'
            - '`LinkedHashSet`'
            - '`TreeSet`'
          answer: 2
          explain: '같은 값을 한 번만 담으니 `Set`이고, 넣은 순서를 지키는 것은 `LinkedHashSet`이에요. `TreeSet`은 가나다순으로 바뀌어요.'
      - next: '키가 주문 상태 같은 enum이면 해시도 트리도 필요 없을지 몰라요. 그럴 때는 무엇을 쓸까요?'
    recall: '꺼낼 때의 순서와 비용이 달라요. Hash는 순서가 정해지지 않고 평균 O(1), LinkedHash는 넣은 순서를 지키며 평균 O(1)이지만 메모리를 조금 더 써요. Tree는 키의 크기 순서를 지키고 O(log n)이며, 범위로 자르는 `subMap`과 `floorKey`를 줘요. 순서가 필요 없으면 Hash, 넣은 순서면 LinkedHash, 키 순서나 범위면 Tree예요.'
  - id: q3
    title: 키가 enum이거나 큐가 필요할 때는 무엇을 쓰나요?
    conclusion:
      lead: '키가 enum이면 `EnumMap`, 원소가 enum이면 `EnumSet`을 쓰고, 큐는 `ArrayDeque`, 우선순위 큐는 `PriorityQueue`를 써요.'
      sub: '`EnumMap`과 `EnumSet`은 enum의 상수 수가 정해져 있다는 것을 이용해 배열과 비트로 담아서, 해시를 계산하지 않고 선언 순서로 돌아요. 리스트는 거의 언제나 `ArrayList`예요.'
    says:
      - '코드 status. 주문 상태별 개수를 센다. 키가 `Status` enum이다. `EnumMap`은 상수의 선언 순서(`ordinal`)를 배열의 칸 번호로 쓴다. 해시 계산도 충돌도 없다. 돌면 선언 순서로 나와서 화면에 ORDERED, PAID, SHIPPED 순서가 지켜진다'
      - '`EnumSet`은 상수마다 비트 하나로 담는다. 상수가 64개 이하면 long 하나다. `EnumSet.of(PAID, SHIPPED)`, `EnumSet.range(...)`로 만든다'
      - '`HashMap<Status, Integer>`와 비교해 같은 결과와 도는 순서를 보인다. 설계 때는 걸린 시간도 보이려 했지만, 상수 셋짜리 맵에서는 시간 차이가 측정 오차보다 작아 순서만 보인다'
      - '큐가 필요하면 `ArrayDeque`(K3), 우선순위로 꺼내려면 `PriorityQueue`(K9)다. `LinkedList`를 큐나 리스트로 고를 일은 드물다(K2)'
      - '선언은 인터페이스로 한다. `Map<Status, Integer> count = new EnumMap<>(...)`. 쓰는 쪽은 `Map`만 알아서 구현을 바꿔도 고칠 곳이 한 줄이다. 메서드의 매개변수와 반환 타입도 `List`, `Map`으로 둔다'
    asks:
      - '본문의 예시: 코드 status를 돌린 뒤 `count`를 `for`로 출력하면 어떤 순서로 나오나 (ORDERED, PAID, SHIPPED. 선언 순서)'
      - '옮긴 상황: 요일(`DayOfWeek` enum)마다 영업 시간을 담는다. `HashMap`과 `EnumMap` 가운데 무엇이 맞고 왜 그런가 (`EnumMap`. 키가 enum이라 배열로 담아 빠르고, 월요일부터 선언 순서로 돈다)'
    body:
      - p: '주문 상태별 개수를 세요. 키가 `Status` enum이에요.'
      - code: status
        notes:
          - mark: new EnumMap<>(Status.class)
            as: code
            text: 'enum의 상수는 개수가 정해져 있고 저마다 선언 순서 번호(`ordinal`)가 있어요. `EnumMap`은 그 번호를 배열의 칸 번호로 써요. 해시를 계산하지 않고 충돌도 없어요.'
      - ci:
          key: enummap
          label: 두 맵으로 센 실제 결과 보기
          source: ChoosingCollectionsTest.enumMap
      - p: '값은 같지만 도는 순서가 달라요. `EnumMap`은 **선언 순서**(ORDERED, PAID, SHIPPED)로 돌아서, 주문 흐름 순서대로 보여 줄 화면에 그대로 쓸 수 있어요. `HashMap`은 해시 값의 순서라 흐름과 상관없어요. [EnumMap API 문서](link:enumMap)는 배열로 담아 해시 맵보다 빠를 가능성이 크다고 적어요.'
      - p: '원소가 enum인 집합은 `EnumSet`이에요. 상수마다 비트 하나로 담아서, 상수가 64개 이하면 `long` 하나에 다 들어가요([EnumSet API 문서](link:enumSet)).'
      - code: enumSet
      - h3: 큐와 리스트는
      - ul:
          - '**먼저 넣은 것부터 꺼내는 큐, 스택**은 `ArrayDeque`예요(스택과 큐 레슨).'
          - '**우선순위로 꺼내는 큐**는 `PriorityQueue`예요(힙과 우선순위 큐 레슨).'
          - '**리스트**는 거의 언제나 `ArrayList`예요. `LinkedList`는 중간에 넣고 빼는 것이 빠를 것 같지만, 그 자리까지 따라가는 데 O(n)이 들어서 고를 일이 드물어요(배열과 연결 리스트 레슨).'
      - h3: 선언은 인터페이스로
      - p: '변수, 매개변수, 반환 타입은 구현이 아니라 **인터페이스**로 적어요. 쓰는 쪽은 `Map`이 약속하는 것만 알면 되고, 구현을 `HashMap`에서 `EnumMap`으로 바꿔도 고칠 곳은 `new` 한 줄이에요.'
      - code: declare
      - quiz:
          q: '요일(`DayOfWeek` enum)마다 영업 시간을 담아 월요일부터 보여 줘요. 무엇이 맞을까요?'
          options:
            - '`HashMap`. 가장 흔히 쓴다'
            - '`EnumMap`. 배열로 담고 선언 순서로 돈다'
            - '`TreeMap`. 키 순서로 돈다'
          answer: 2
          explain: '키가 enum이면 `EnumMap`이에요. 선언 순서(월요일부터)로 돌고 해시를 계산하지 않아요. `TreeMap`도 enum의 비교가 선언 순서라 순서는 맞지만 O(log n)이에요.'
      - next: '그릇을 잘 골라도, 쓰는 방법에서 예외가 나기도 해요. 돌면서 지우면 왜 예외가 날까요?'
    recall: '키가 enum이면 `EnumMap`, 원소가 enum이면 `EnumSet`이에요. 상수의 선언 순서 번호를 배열 칸으로, 또는 비트 하나로 담아서 해시를 계산하지 않고 선언 순서로 돌아요. 큐와 스택은 `ArrayDeque`, 우선순위 큐는 `PriorityQueue`, 리스트는 거의 언제나 `ArrayList`예요. 선언은 `List`, `Map` 같은 인터페이스로 해서 구현을 바꿔도 쓰는 쪽을 고치지 않아요.'
  - id: q4
    title: 컬렉션을 돌면서 지우면 왜 예외가 나나요?
    conclusion:
      lead: '반복자가 도는 동안 컬렉션의 구조가 반복자 모르게 바뀐 것을 알아채고 `ConcurrentModificationException`을 던지기 때문이에요.'
      sub: '돌면서 지우려면 `removeIf`나 반복자의 `remove`를 써요. 반복자를 거쳐 지우면 반복자가 바뀐 것을 알아요.'
    says:
      - '코드 removeLoop. 향상된 `for`는 안에서 반복자를 쓴다. 반복 중에 `cart.remove(item)`으로 리스트를 직접 고친다. 다음 원소로 넘어갈 때 반복자가 예외를 던진다. 실제 예외를 보인다'
      - '알아채는 방법. `ArrayList`는 구조를 바꿀 때마다 수정 횟수(`modCount`)를 하나 늘린다. 반복자는 만들 때의 수를 기억해 두고, 다음으로 넘어갈 때마다 비교한다. 다르면 예외를 던진다. 이것을 fail-fast라고 한다. 지운 뒤 엉뚱한 원소를 건너뛰거나 두 번 보는 것보다 바로 실패하는 편이 낫기 때문이다'
      - '"Concurrent"라는 이름이지만 스레드가 하나여도 난다'
      - '고친 코드 셋. 코드 removeIf: 조건으로 지운다. 가장 짧다. `Iterator`를 직접 쓰고 `it.remove()`를 부른다: 반복자를 거쳐 지운다. 남길 것만 새 리스트에 모은다: 스트림의 `filter`. 셋 모두 같은 결과 `[A, C, D]`를 보인다'
      - '`HashMap`도 같다. `map.keySet()`을 돌며 `map.remove(key)`를 하면 예외가 난다. `map.entrySet().removeIf(...)`나 `map.values().removeIf(...)`를 쓴다'
      - '더 알아보기: fail-fast는 최선을 다할 뿐 약속이 아니다. 코드 removeLoop에서 "C"(끝에서 두 번째)를 지우면 예외 없이 끝나고 "D"를 보지 않는다. 반복자가 남은 원소가 없다고 보고 비교하기 전에 멈추기 때문이다. 예외가 나지 않았다고 맞는 코드가 아니다'
    asks:
      - '본문의 예시: 코드 removeLoop에서 지우는 조건을 "A"로 바꾸면 어떻게 되나 (`ConcurrentModificationException`. 지운 뒤 다음 원소로 넘어갈 때 반복자가 알아챈다)'
      - '옮긴 상황: 재고가 0인 상품을 `Map<String, Integer> stock`에서 지우려고 `for (String k : stock.keySet()) if (stock.get(k) == 0) stock.remove(k);`를 썼다. 무엇으로 바꾸나 (`stock.values().removeIf(v -> v == 0)`. 또는 `entrySet().removeIf`)'
      - '실무 구역: 코드 grouping으로 금액 구간별로 묶은 맵을 `for`로 돌면 구간이 금액 순으로 나온다고 할 수 있나 (없다. `groupingBy`는 맵의 종류를 약속하지 않고 지금 구현은 `HashMap`이다)'
    body:
      - p: '장바구니에서 "B"를 빼려고 돌면서 지웠어요.'
      - code: removeLoop
        notes:
          - mark: cart.remove(item)
            as: code
            text: '반복 중에 리스트를 직접 고쳐요. 향상된 `for`는 안에서 반복자를 쓰는데, 반복자는 이 변경을 몰라요.'
      - ci:
          key: cme
          label: 실제 결과 보기
          source: ChoosingCollectionsTest.removeWhileIterating
      - p: '`ConcurrentModificationException`이 났어요. 이름에 "동시"가 들어 있지만 **스레드가 하나여도** 나요.'
      - h3: 반복자는 구조가 바뀐 것을 알아채요
      - p: '`ArrayList`는 원소를 넣거나 지울 때마다 안의 수정 횟수(`modCount`)를 하나 늘려요. 반복자는 만들 때의 수를 기억해 두고, 다음 원소로 넘어갈 때마다 지금 수와 비교해요. 다르면 바로 예외를 던져요. 이것을 **fail-fast**라고 해요. 지운 자리 때문에 원소를 건너뛰거나 두 번 보며 조용히 틀리는 것보다, 바로 실패하는 편이 낫기 때문이에요.'
      - h3: 돌면서 지우는 바른 방법
      - code: removeIf
      - code: iteratorRemove
        notes:
          - mark: it.remove()
            as: code
            text: '반복자를 거쳐 지우면 반복자가 기억한 수도 함께 고쳐서 예외가 나지 않아요.'
      - p: '남길 것만 새 리스트에 모으는 방법(`stream().filter(...).toList()`)도 있어요. 세 방법 모두 같은 결과예요.'
      - ci:
          key: removeRight
          label: 세 방법의 실제 결과 보기
          source: ChoosingCollectionsTest.removeRight
      - p: '`HashMap`도 같아요. `keySet()`을 돌며 `map.remove(key)`를 하면 예외가 나요. 재고가 0인 상품을 지우려면 이렇게 써요.'
      - code: mapRemove
        notes:
          - mark: removeIf
            as: code
            text: '`values()`나 `entrySet()`에서 지우면 맵에서도 지워져요. 반복자를 거쳐 지우는 것과 같아요.'
      - more:
          summary: '더 알아보기: 예외가 안 났다고 맞는 것이 아니에요'
          body:
            - p: '위 실제 결과의 둘째 줄을 보세요. 끝에서 두 번째인 "C"를 지우면 **예외 없이 끝나고 "D"를 보지 않았어요.** "C"를 본 뒤 반복자의 위치는 3인데 지워서 크기도 3이 됐어요. 반복자가 남은 원소가 없다고 보고, 수정 횟수를 비교하기 전에 멈춰요.'
            - p: '[ArrayList API 문서](link:arrayList)도 fail-fast는 최선을 다할 뿐 약속이 아니니 이 예외에 기대어 프로그램을 짜지 말라고 적어요.'
      - quiz:
          q: '코드 removeLoop에서 지우는 조건을 "A"로 바꾸면 어떻게 될까요?'
          options:
            - '"A"만 빠지고 정상으로 끝난다'
            - '`ConcurrentModificationException`이 난다'
            - '"A"와 "B"가 함께 빠진다'
          answer: 2
          explain: '"A"를 지우면 수정 횟수가 바뀌어요. 다음 원소로 넘어갈 때 반복자가 남은 원소가 있다고 보고 수를 비교해서 예외를 던져요.'
    recall: '반복자는 만들 때의 수정 횟수를 기억하고 다음 원소로 넘어갈 때마다 비교해요. 반복 중에 컬렉션을 직접 고치면 수가 달라져 `ConcurrentModificationException`을 던져요. 스레드가 하나여도 나요. 돌면서 지우려면 `removeIf`, 반복자의 `remove`, 남길 것만 모으는 `filter`를 써요. fail-fast는 약속이 아니라 예외 없이 틀리기도 해요.'
practice:
  title: 실무에서는 이렇게 만나요
  says:
    - '스트림의 `groupingBy`(코드 grouping)는 어떤 맵을 만들지 API 문서가 약속하지 않고, 지금 구현은 `HashMap`을 만든다. 금액 구간을 순서대로 보여 줄 화면이면 순서가 운에 맡겨진다. 고친 코드: 코드 groupingSorted처럼 맵을 만드는 함수(`TreeMap::new`)를 둘째 인자로 넘긴다. 같은 데이터로 두 맵을 만들어 돌린 순서를 테스트로 남긴다. 키가 enum이면 `() -> new EnumMap<>(Status.class)`를 넘긴다'
    - '흔한 실수: 서비스 코드가 `List`를 받아 `contains`를 반복 안에서 부른다(질문 1). 받은 쪽에서 `new HashSet<>(list)`로 한 번 바꿔 두고 쓴다. 바꾸는 비용은 O(n) 한 번이다'
    - '응답의 순서가 필요한 곳(정렬된 그룹, 상태별 개수)에서 맵을 그대로 JSON으로 내보내면 잭슨은 맵을 도는 순서로 쓴다. 순서를 지키는 맵을 고르는 것이 응답 순서를 정하는 일이다. 해시 테이블(K4)의 실무 구역에서 본 것과 같다'
  body:
    - h3: groupingBy가 만드는 맵
    - p: '주문을 금액 구간(1만 원 단위)으로 묶어 구간 순서대로 보여 주는 화면이에요. 스트림의 `groupingBy`로 묶었어요.'
    - code: grouping
    - ci:
        key: grouping
        label: 두 방식의 실제 결과 보기
        source: ChoosingCollectionsTest.groupingBy
    - p: '기본 `groupingBy`는 `HashMap`을 만들어서 구간이 16, 0, 17 ... 순서로 돌았어요. [Collectors API 문서](link:collectors)는 어떤 맵을 만들지 **약속하지 않아요.** 순서가 필요하면 맵을 만드는 함수를 둘째 인자로 넘겨요.'
    - code: groupingSorted
      notes:
        - mark: TreeMap::new
          as: code
          text: '구간이 키 순서로 돌아요. 질문 2의 표에서 "키 순서"가 필요하면 Tree였어요.'
    - p: '키가 enum이면 질문 3의 `EnumMap`을 넘겨요. 상태별 개수가 선언 순서로 나와요.'
    - code: groupingEnum
    - p: '이 맵을 응답 DTO에 담아 그대로 JSON으로 내보내면, 잭슨은 맵을 **도는 순서대로** 써요. 그래서 맵을 고르는 일이 곧 응답의 순서를 정하는 일이에요. [해시 테이블](lesson:hash-table) 레슨의 실무 구역에서 본 것과 같아요.'
    - h3: '흔한 실수: 반복 안에서 List.contains'
    - p: '차단된 회원의 주문을 빼는 서비스 메서드예요. 차단 목록을 `List`로 받았어요.'
    - code: serviceBad
      notes:
        - mark: blocked.contains
          as: code
          text: '주문마다 차단 목록을 처음부터 훑어요. 주문 n건, 차단 m명이면 O(n × m)이에요.'
    - code: serviceFixed
      notes:
        - mark: new HashSet<>(blocked)
          as: code
          text: '받은 쪽에서 한 번 `Set`으로 바꿔요. 바꾸는 비용은 O(m) 한 번이고, 그 뒤 확인은 평균 O(1)이라 전체 O(n + m)이에요.'
    - p: '받는 타입을 처음부터 `Set<Long>`으로 정할 수 있으면 더 좋아요. 무엇을 할 그릇인지가 타입에 드러나요.'
interview:
  question: List, Set, Map은 언제 쓰고, 구현은 어떻게 고르나요?
  model:
    - label: 정의
      text: List는 순서가 있고 중복을 허용하고, Set은 중복을 막고, Map은 키마다 값 하나를 담습니다. 위치와 순서로 꺼내면 List, 들어 있는지를 물으면 Set, 키로 찾으면 Map, 넣은 순서나 우선순위로 꺼내면 Queue를 고릅니다.
    - label: 원리
      text: List.contains는 전부 비교하는 O(n)이고 HashSet.contains는 해시로 칸 하나를 보는 평균 O(1)입니다. Set과 Map의 구현은 Hash가 순서 없이 평균 O(1), LinkedHash가 넣은 순서를 지키며 평균 O(1), Tree가 키 순서와 범위 질의를 주며 O(log n)입니다. 키가 enum이면 배열로 담는 EnumMap을 씁니다.
    - label: 주의할 점
      text: 돌면서 컬렉션을 직접 지우면 fail-fast 반복자가 ConcurrentModificationException을 던지니 removeIf나 Iterator.remove를 씁니다. groupingBy는 맵 종류를 약속하지 않으니 순서가 필요하면 TreeMap::new를 넘깁니다. 선언은 인터페이스 타입으로 합니다.
    - label: 경험
      text: '(내 프로젝트로 채우기) 예: 쿠폰 사용 여부를 List.contains로 확인하던 코드를 HashSet으로 바꿔 결제 API의 응답 시간을 줄였습니다.'
verified: 이 레슨의 비교 횟수, 도는 순서, 걸린 시간, 예외는 짐작이 아니라 자바 21에서 코드를 돌려 받은 값이에요. 코드가 바뀔 때마다 테스트([ChoosingCollectionsTest](link:test))가 다시 돌아요.
footer: '근거: 컬렉션의 인터페이스와 구현은 [자바 컬렉션 프레임워크 문서](link:framework), `EnumMap`과 `EnumSet`이 배열과 비트로 담는다는 것은 [EnumMap](link:enumMap)과 [EnumSet](link:enumSet) API 문서, fail-fast가 약속이 아니라는 것은 [ArrayList API 문서](link:arrayList), `groupingBy`의 맵은 [Collectors API 문서](link:collectors), 접근 순서는 [LinkedHashMap API 문서](link:linkedHashMap). 결과는 OpenJDK 21에서 테스트로 확인했어요. 오류는 [GitHub 이슈](https://github.com/wanja727/dev-lessons/issues)로 알려 주세요.'
claims:
  - claim: '쿠폰 50만 개에서 없는 쿠폰을 확인할 때 `ArrayList`는 `equals`를 50만 번, `HashSet`은 몇 번 부른다'
    how: '`equals`를 세는 쿠폰 래퍼로 센다. `HashSet`은 0번이었다(해시 값이 같은 원소가 없었다). 1만 번 확인하는 시간도 남긴다'
    test: ChoosingCollectionsTest.containsCost
  - claim: '같은 키를 같은 순서로 넣어도 `HashMap`, `LinkedHashMap`, `TreeMap`의 `keySet` 순서가 다르다'
    how: '세 맵의 출력을 남긴다'
    test: ChoosingCollectionsTest.threeMapsOrder
  - claim: '`TreeMap`은 키 100만 개에서 `HashMap`보다 넣고 찾는 데 오래 걸린다'
    how: '걸린 시간을 남긴다. 어느 쪽이 빠른지만 단정한다'
    test: ChoosingCollectionsTest.mapTiming
  - claim: '`EnumMap`은 선언 순서로 돌고, 같은 집계를 `HashMap`으로 한 결과와 값이 같다'
    how: '코드 status를 두 맵으로 돌린다. `DayOfWeek` 키도 선언 순서로 돈다'
    test: ChoosingCollectionsTest.enumMap
  - claim: '코드 removeLoop는 "B"나 "A"를 지우면 `ConcurrentModificationException`, "C"를 지우면 예외 없이 끝나고 "D"를 보지 않는다'
    how: '세 경우를 돌리고, 본 원소를 모은다'
    test: ChoosingCollectionsTest.removeWhileIterating
  - claim: '`removeIf`, `Iterator.remove`, `filter`는 모두 `[A, C, D]`를 남긴다. 맵의 `keySet`을 돌며 `remove`하면 예외, `values().removeIf`는 된다'
    how: '각 방법을 돌린다'
    test: ChoosingCollectionsTest.removeRight
  - claim: '자바 21에서 `groupingBy`의 기본 맵은 `HashMap`이고, `TreeMap::new`를 넘기면 키 순서로 돈다'
    how: '`getClass()`와 도는 순서를 본다'
    test: ChoosingCollectionsTest.groupingBy
  - claim: '접근 순서 `LinkedHashMap`에 `removeEldestEntry`를 두면 크기를 넘을 때 가장 오래 안 쓴 키가 지워진다'
    how: '크기 3으로 넣고 `get`한 뒤 넷째를 넣어 남은 키를 본다'
    test: ChoosingCollectionsTest.lruCache
sources:
  - '컬렉션 인터페이스와 구현의 개요: 자바 컬렉션 프레임워크 문서 https://docs.oracle.com/en/java/javase/21/core/java-collections-framework.html'
  - '`EnumMap`, `EnumSet`이 배열과 비트로 담는다는 것: API 문서 https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/EnumMap.html , https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/EnumSet.html'
  - 'fail-fast 반복자와 그것이 약속이 아니라는 것: `ArrayList` API 문서 https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/ArrayList.html'
  - '`Collectors.groupingBy`의 기본 맵: API 문서 https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/stream/Collectors.html'
  - '`LinkedHashMap`의 접근 순서와 `removeEldestEntry`: API 문서 https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/LinkedHashMap.html'
