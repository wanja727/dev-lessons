        .[[removeIf]](v -> v == 0);
  grouping: |-
    Map<Integer, List<Order>> byBand =
        orders.stream().collect(
            Collectors.groupingBy(
                o -> o.amount() / 10_000));
  groupingSorted: |-
    Map<Integer, List<Order>> byBand =
        orders.stream().collect(
            Collectors.groupingBy(
                o -> o.amount() / 10_000,
                [[TreeMap::new]],
                Collectors.toList()));
  groupingEnum: |-
    Collectors.groupingBy(
        Order::status,
        [[() -> new EnumMap<>(Status.class)]],
        Collectors.counting())
  serviceBad: |-
    List<Order> filter(List<Order> orders,
        List<Long> blocked) {
      return orders.stream()
          .filter(o -> ![[blocked.contains]](
              o.memberId()))
          .toList();
    }
  serviceFixed: |-
    Set<Long> blockedSet =
        [[new HashSet<>(blocked)]];
    return orders.stream()
        .filter(o -> !blockedSet.contains(
            o.memberId()))
        .toList();
