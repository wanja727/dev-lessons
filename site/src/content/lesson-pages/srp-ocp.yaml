# 단일 책임과 개방 폐쇄 원칙
# 자료 파일의 칸은 docs/lesson-data-format.md에 있다. 문제는 content/questions/srp-ocp.yaml에 있다.
# 설계 유형의 기준 레슨이다 (docs/quality-plan.md 진행 순서 5번).
# 설계서는 2026-11-23에 승인받았다. 설계 때 채운 칸(says, widget, asks, claims, sources)은 그대로 남겨 둔다.
# 2026-11-26에 지금 표준에 맞췄다: 도입부, 알아야 할 것(covers), 실무에서는을 더하고, 실제 출력 상자에 코드를 넣고, 겹치는 설명을 줄였다.
title: 단일 책임과 개방 폐쇄 원칙
description: 클래스가 바뀌는 이유를 세는 법, 책임을 나누는 기준, if와 else if로 나눈 코드가 개방 폐쇄 원칙을 어기는 까닭, 인터페이스로 빼는 방법과 그 한계. 다섯 가지 질문에 스스로 답할 수 있게 만드는 대화형 레슨.
unit: 객체지향 설계와 패턴
minutes: 22
roadmap: O3
type: 설계
prerequisites:
  - {slug: coupling-cohesion, title: 결합도와 응집도}
assume: >-
  자바 21. 인터페이스를 선언하고 클래스가 구현하는 문법(`interface`, `implements`)과 `enum`, `List`를 for 문으로 도는 방법.
  `record Order(...)`는 `order.grade()`처럼 값을 꺼내는 메서드가 있는 클래스라고만 알면 돼요.
  메일을 실제로 보내는 코드(메일 서버에 접속하는 코드)는 `MailSender` 안에 있다고 봐요.
example: 쇼핑몰의 주문 결제. 회원 등급(VIP, GOLD)에 따라 할인하고, 결제 금액을 적은 영수증을 메일로 보낸다. 등급이 BASIC이면 할인이 없다
intro:
  - '영수증 문구 한 줄을 고쳤는데 VIP 할인 금액이 틀리게 나갔어요. 문구와 할인 계산이 같은 메서드에 있어서, 문구를 고치다 할인 줄을 건드렸어요. 몇 달 뒤 SILVER 등급을 더할 때는 `else if`를 빠뜨려서 SILVER 손님만 할인을 못 받았는데, 오류 하나 없이 배포됐어요.'
  - '단일 책임 원칙(SRP)과 개방 폐쇄 원칙(OCP)은 이런 일을 줄이는 기준이에요. 스프링 개발자는 서비스를 어디서 나눌지, 결제 수단이나 할인 정책처럼 늘어나는 것을 `if`로 나눌지 인터페이스와 빈으로 나눌지를 매일 정해요. 면접에서 SOLID를 물으면 가장 먼저 나오는 두 원칙이기도 해요.'
  - '이 레슨에서는 주문 결제 코드 하나를 두 번 고쳐요. 요구가 올 때 고치는 파일과 줄을 테스트로 세고, 고치는 것을 빠뜨리면 무엇이 나오는지, 인터페이스로 빼도 닫히지 않는 변경은 무엇인지 확인해요.'
covers:
  - {topic: '단일 책임 원칙: 클래스가 바뀌는 이유는 하나여야 한다. 바뀌는 이유는 그 변경을 요구하는 쪽으로 센다', where: '질문 1'}
  - {topic: '책임이 하나라는 것은 메서드나 필드가 하나라는 뜻이 아니다', where: '질문 1'}
  - {topic: '책임이 섞이면 한 이유로 고칠 때 상관없는 코드를 건드리고, 한 가지만 따로 테스트할 수 없다', where: '질문 2'}
  - {topic: '나누는 기준: 같은 이유로 바뀌는 것은 모으고 다른 이유로 바뀌는 것은 나눈다', where: '질문 2. 모으는 쪽의 원리는 결합도와 응집도(O2)'}
  - {topic: '개방 폐쇄 원칙: 기능을 더할 때 있던 코드를 고치지 않고 새 코드를 더한다. 확장에 열림과 수정에 닫힘의 뜻', where: '질문 3'}
  - {topic: 'if와 else if로 나눈 코드는 종류가 늘 때마다 있던 메서드를 고치고, 빠뜨리면 오류 없이 틀린 값이 나온다', where: '질문 3'}
  - {topic: '바뀌는 부분을 인터페이스로 빼고 새 기능은 새 구현 클래스로 더한다. 쓰는 쪽은 인터페이스만 안다', where: '질문 4. 다형성은 상속과 다형성(J7), 객체지향의 네 가지 특징(O1)'}
  - {topic: '고칠 곳은 없어지지 않고 조립 코드로 옮겨 간다', where: '질문 4'}
  - {topic: '인터페이스로 빼 둔 방향의 변경에만 닫힌다. 인터페이스에 메서드를 더하거나 모양을 바꾸면 구현과 호출하는 쪽을 고친다', where: '질문 5'}
  - {topic: 'default 메서드로 인터페이스에 메서드를 더하기', where: '질문 5'}
  - {topic: '스프링에서 조립 코드: 구현을 @Component 빈으로 만들고 List로 주입받으면 새 구현을 더할 때 조립 코드도 고치지 않는다. @Component를 빠뜨리면 오류 없이 빠진다', where: '실무에서는'}
  - {topic: '다형성 덕분에 부르는 쪽(DiscountCalculator)을 고치지 않는다', where: '질문 4. 오버라이딩은 상속과 다형성(J7)'}
  - {topic: 'sealed와 switch 패턴 매칭은 반대쪽을 고른다: 종류를 닫아 두고, 새 종류를 더하면 switch마다 컴파일 오류로 알린다', where: '질문 5의 더 알아보기. 문법은 자바 17과 21에서 달라진 것(J18)'}
  - {topic: '자식이 부모를 대신할 수 있어야 한다는 원칙과 인터페이스 분리', where: '다루지 않음: 리스코프 치환과 인터페이스 분리 원칙(O4)'}
  - {topic: '구현이 아니라 인터페이스에 기대고 밖에서 넣어 주기', where: '다루지 않음: 의존 역전 원칙과 의존성 주입(O5)'}
  - {topic: '바뀌는 계산을 갈아 끼우는 패턴, 구현을 이름으로 고르기', where: '다루지 않음: 전략 패턴(O7)'}
