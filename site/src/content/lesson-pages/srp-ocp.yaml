  - id: q4
    title: 있던 코드를 고치지 않고 어떻게 기능을 더하나요?
    conclusion:
      lead: 바뀌는 부분을 인터페이스로 빼고, 새 기능은 그 인터페이스의 새 구현 클래스로 더해요.
      sub: 쓰는 쪽은 인터페이스만 알아서, 구현이 늘어도 고칠 것이 없어요.
    says:
      - 등급마다 다른 계산을 `DiscountPolicy` 인터페이스로 뺀다. 등급 하나의 할인이 구현 클래스 하나다. `GoldDiscount`는 `VipDiscount`와 같은 모양이고 95를 곱한다
      - 코드 C의 `DiscountCalculator`는 `DiscountPolicy`만 안다. `VipDiscount` 같은 구현 클래스의 이름은 코드에 나오지 않는다
      - '정책 목록은 조립 코드에서 만들어 `DiscountCalculator`에 넣는다. 조립 코드는 프로그램이 시작할 때 한 번 실행된다'
      - 'SILVER를 더할 때 하는 일은 셋이다. `Grade`에 SILVER를 더한다, `SilverDiscount` 클래스를 새로 만든다, 조립 코드의 목록에 `new SilverDiscount()`를 넣는다'
      - '`DiscountCalculator`와 `DiscountPolicy`, 있던 구현 클래스(`VipDiscount`, `GoldDiscount`)는 고치지 않는다. 할인을 계산하는 코드 가운데 고치는 것이 없다'
      - '`Grade`에 SILVER를 더하는 것은 코드 B와 같다. 다른 것은 그다음이다. 코드 B는 계산이 든 `calculate()`를 고치고, 코드 C는 목록을 만드는 조립 코드를 고친다'
      - 고치는 곳이 없어지는 것이 아니다. 계산 코드 밖의 조립 코드로 옮겨 간다
      - 새 클래스를 만들고 목록에 넣지 않으면 SILVER 주문은 원래 금액이 나온다(10000). 목록에 넣으면 9700이 나온다. 빠뜨리면 오류 없이 틀린다는 점은 코드 B와 같다
    widget:
      kind: compare
      note: >-
        왼쪽 칸은 코드 B, 오른쪽 칸은 코드 C다. 칸의 항목은 파일이다(왼쪽은 `Grade`, `DiscountCalculator`. 오른쪽은 `Grade`,
        `DiscountPolicy`, `DiscountCalculator`, `VipDiscount`, `GoldDiscount`, 조립 코드). "SILVER 등급 더하기" 버튼을 누르면
        왼쪽은 `Grade`와 `DiscountCalculator`에 "고침"이 붙고, 오른쪽은 `Grade`와 조립 코드에 "고침"이 붙고 `SilverDiscount`가
        "새로 만듦"으로 생긴다. 칸 아래에는 "할인을 계산하는 코드 가운데 고친 것"을 적는다. 왼쪽은 `calculate()`, 오른쪽은 없음이다.
        고친 파일의 수는 양쪽 다 2라서 수로 비교하지 않는다.
    asks:
      - 코드 C에 SILVER 등급 할인을 더할 때 고치지 않아도 되는 것. 보기는 `Grade`, 조립 코드, `DiscountCalculator`, 셋 다 고쳐야 한다 (`DiscountCalculator`)
      - 코드 C에서 `SilverDiscount`를 만들었지만 정책 목록에 넣지 않았다. SILVER 등급 10,000원 주문으로 `calculate()`를 부르면 (10000)
      - '실무 구역: 스프링에서 정책을 `@Component` 빈으로 만들고 `DiscountCalculator`가 `List<DiscountPolicy>`를 생성자로 받는다. `SilverDiscount`를 더할 때 고치거나 만드는 것 (`@Component`를 붙인 `SilverDiscount`와 `Grade`. 계산 코드와 조립 코드는 그대로)'
    body:
    - p: '코드 B에서 등급이 늘 때마다 바뀌는 부분은 "등급마다 다른 계산"이에요. 이 부분을 `DiscountPolicy` 인터페이스로 빼요. 인터페이스를 구현한 클래스를 구현 클래스라고 하는데, 등급 하나의 할인이 구현 클래스 하나가 돼요. 이 코드를 **코드 C**라고 부를게요.'
