# 단일 책임과 개방 폐쇄 원칙
# 자료 파일의 칸은 docs/lesson-data-format.md에 있다. 문제는 content/questions/srp-ocp.yaml에 있다.
# 설계 유형의 기준 레슨이다 (docs/quality-plan.md 진행 순서 5번).
# 설계서는 2026-11-23에 승인받았다. 설계 때 채운 칸(says, widget, asks, claims, sources)은 그대로 남겨 둔다.
title: 단일 책임과 개방 폐쇄 원칙
description: 클래스가 바뀌는 이유를 세는 법, 책임을 나누는 기준, if와 else if로 나눈 코드가 개방 폐쇄 원칙을 어기는 까닭, 인터페이스로 빼는 방법과 그 한계. 다섯 가지 질문에 스스로 답할 수 있게 만드는 대화형 레슨.
unit: 객체지향 설계와 패턴
minutes: 20
roadmap: O3
type: 설계
# O2 결합도와 응집도는 아직 없는 레슨이다. 링크가 깨지지 않게 비워 두었다. O2를 만들면 아래 줄을 되살린다 (슬러그는 임시다)
#   - {slug: coupling-cohesion, title: 결합도와 응집도}
prerequisites: []
assume: >-
  자바 21. 인터페이스를 선언하고 클래스가 구현하는 문법(`interface`, `implements`)과 `enum`, `List`를 for 문으로 도는 방법.
  `record Order(...)`는 `order.grade()`처럼 값을 꺼내는 메서드가 있는 클래스라고만 알면 돼요.
  메일을 실제로 보내는 코드(메일 서버에 접속하는 코드)는 `MailSender` 안에 있다고 봐요.
example: 쇼핑몰의 주문 결제. 회원 등급(VIP, GOLD)에 따라 할인하고, 결제 금액을 적은 영수증을 메일로 보낸다. 등급이 BASIC이면 할인이 없다
links:
  test: https://github.com/wanja727/dev-lessons/blob/main/verification/src/test/java/lab/devlessons/srpocp/SrpOcpChangeTest.java
  srp: https://blog.cleancoder.com/uncle-bob/2014/05/08/SingleReponsibilityPrinciple.html
  ocp: https://blog.cleancoder.com/uncle-bob/2014/05/12/TheOpenClosedPrinciple.html
  jls: https://docs.oracle.com/javase/specs/jls/se21/html/jls-8.html#jls-8.1.1.1
# 코드 A를 두 번 고친다. A는 처음 코드, B는 바뀌는 이유마다 나눈 코드(질문 2), C는 등급마다 다른 계산을 인터페이스로 뺀 코드(질문 4)다.
# assemble은 본문에서 "조립 코드"라고 부른다. 문제의 코드도 이것과 같은 모양으로 쓴다.
codes:
  types: |-
    enum Grade { VIP, GOLD, BASIC }

    record Order(Grade grade, int price,
                 String email) {}
  A: |-
    class OrderService {
        MailSender mail;
        int pay(Order order) {
            Grade grade = order.grade();
            int price = order.price();
            if (grade == Grade.VIP) {
                price = price * 90 / 100;
            } else if (grade == Grade.GOLD) {
                price = price * 95 / 100;
            }
            String text =⤶
                "결제 금액: " + price + "원";
            mail.send(order.email(), text);
            return price;
        }
    }
  B: |-
    class DiscountCalculator {
        int calculate(Order order) {
            Grade grade = order.grade();
            int price = order.price();
            if (grade == Grade.VIP) {
                return price * 90 / 100;
            } else if (grade == Grade.GOLD) {
                return price * 95 / 100;
            }
            return price;
        }
    }

    class ReceiptWriter {
        String write(int price) {
            return "결제 금액: " + price + "원";
        }
    }

    class OrderService {
        DiscountCalculator calculator;
        ReceiptWriter writer;
        MailSender mail;
        int pay(Order order) {
            int price =⤶
                calculator.calculate(order);
            String text = writer.write(price);
            mail.send(order.email(), text);
            return price;
        }
    }
  C: |-
    interface DiscountPolicy {
        boolean supports(Grade grade);
        int apply(int price);
    }

    class VipDiscount⤶
            implements DiscountPolicy {
        public boolean supports(Grade grade) {
            return grade == Grade.VIP;
        }
        public int apply(int price) {
            return price * 90 / 100;
        }
    }

    class DiscountCalculator {
        List<DiscountPolicy> policies;
        int calculate(Order order) {
            Grade grade = order.grade();
            int price = order.price();
            for (DiscountPolicy p : policies) {
                if (p.supports(grade)) {
                    return p.apply(price);
                }
            }
            return price;
        }
    }
  assemble: |-
    var policies = List.of(
        new VipDiscount(),
        new GoldDiscount());
  silver: |-
    class SilverDiscount⤶
            implements DiscountPolicy {
        public boolean supports(Grade grade) {
            return grade == Grade.SILVER;
        }
        public int apply(int price) {
            return price * 97 / 100;
        }
    }
  named: |-
    interface DiscountPolicy {
        boolean supports(Grade grade);
        int apply(int price);
        String name();
    }

    class VipDiscount⤶
            implements DiscountPolicy {
        public boolean supports(Grade grade) {
            return grade == Grade.VIP;
        }
        public int apply(int price) {
            return price * 90 / 100;
        }
        public String name() {
            return "VIP 할인";
        }
    }

    class GoldDiscount⤶
            implements DiscountPolicy {
        public boolean supports(Grade grade) {
            return grade == Grade.GOLD;
        }
        public int apply(int price) {
            return price * 95 / 100;
        }
    }
  # 여기부터는 본문 단계에서 더한 코드다. 위의 코드를 강조만 바꾸거나 이어 붙였다
