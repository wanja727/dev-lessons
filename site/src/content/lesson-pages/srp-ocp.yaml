      - {mark: 'for (DiscountPolicy p : policies)', as: code, text: '`DiscountCalculator`는 `DiscountPolicy`만 알아요. `VipDiscount` 같은 구현 클래스의 이름은 이 클래스의 코드에 나오지 않아요.'}
