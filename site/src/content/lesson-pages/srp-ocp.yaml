# 단일 책임과 개방 폐쇄 원칙
# 설계서다 (docs/lesson-data-format.md의 "두 단계"). 승인 뒤 stage 줄을 지우고 나머지 칸을 채운다.
# 설계 유형의 기준 레슨이다 (docs/quality-plan.md 진행 순서 5번).
# 품질 계획 3단계에서 써 본 docs/type-trials/srp-ocp.md를 이 형식으로 옮기며 고쳤다. 문제 초안은 docs/type-trials/srp-ocp.yaml이다.
stage: design
title: 단일 책임과 개방 폐쇄 원칙
unit: 객체지향 설계와 패턴
roadmap: O3
type: 설계
# O2 결합도와 응집도는 아직 없는 레슨이다. 슬러그는 임시로 적었다. O2를 만들 때 맞춘다
prerequisites:
  - {slug: coupling-cohesion, title: 결합도와 응집도}
assume: >-
  자바 21. 인터페이스를 선언하고 클래스가 구현하는 문법(`interface`, `implements`)과 `enum`, `List`를 for 문으로 도는 방법.
  `record Order(...)`는 `order.grade()`처럼 값을 꺼내는 메서드가 있는 클래스라고만 알면 돼요.
  메일을 실제로 보내는 코드(메일 서버에 접속하는 코드)는 `MailSender` 안에 있다고 봐요.
example: 쇼핑몰의 주문 결제. 회원 등급(VIP, GOLD)에 따라 할인하고, 결제 금액을 적은 영수증을 메일로 보낸다. 등급이 BASIC이면 할인이 없다
links:
  srp: https://blog.cleancoder.com/uncle-bob/2014/05/08/SingleReponsibilityPrinciple.html
  ocp: https://blog.cleancoder.com/uncle-bob/2014/05/12/TheOpenClosedPrinciple.html
  jls: https://docs.oracle.com/javase/specs/jls/se21/html/jls-8.html#jls-8.1.1.1
# 코드 A를 두 번 고친다. A는 처음 코드, B는 바뀌는 이유마다 나눈 코드(질문 2), C는 등급마다 다른 계산을 인터페이스로 뺀 코드(질문 4)다.
# assemble은 본문에서 "조립 코드"라고 부른다. 문제의 코드도 이것과 같은 모양으로 쓴다.
codes:
  types: |-
    enum Grade { VIP, GOLD, BASIC }

    record Order(Grade grade, int price,
                 String email) {}
  A: |-
    class OrderService {
        MailSender mail;
        int pay(Order order) {
            Grade grade = order.grade();
            int price = order.price();
            if (grade == Grade.VIP) {
                price = price * 90 / 100;
            } else if (grade == Grade.GOLD) {
                price = price * 95 / 100;
            }
            String text =⤶
                "결제 금액: " + price + "원";
            mail.send(order.email(), text);
            return price;
        }
    }
  B: |-
    class DiscountCalculator {
        int calculate(Order order) {
            Grade grade = order.grade();
            int price = order.price();
            if (grade == Grade.VIP) {
                return price * 90 / 100;
            } else if (grade == Grade.GOLD) {
                return price * 95 / 100;
            }
            return price;
        }
    }

    class ReceiptWriter {
        String write(int price) {
            return "결제 금액: " + price + "원";
        }
    }

    class OrderService {
        DiscountCalculator calculator;
        ReceiptWriter writer;
        MailSender mail;
        int pay(Order order) {
            int price =⤶
                calculator.calculate(order);
            String text = writer.write(price);
            mail.send(order.email(), text);
            return price;
        }
    }
  C: |-
    interface DiscountPolicy {
        boolean supports(Grade grade);
        int apply(int price);
    }

    class VipDiscount⤶
            implements DiscountPolicy {
        public boolean supports(Grade grade) {
            return grade == Grade.VIP;
        }
        public int apply(int price) {
            return price * 90 / 100;
        }
    }

    class DiscountCalculator {
        List<DiscountPolicy> policies;
        int calculate(Order order) {
            Grade grade = order.grade();
            int price = order.price();
            for (DiscountPolicy p : policies) {
                if (p.supports(grade)) {
                    return p.apply(price);
                }
            }
            return price;
        }
    }
  assemble: |-
    var policies = List.of(
        new VipDiscount(),
        new GoldDiscount());
  silver: |-
    class SilverDiscount⤶
            implements DiscountPolicy {
        public boolean supports(Grade grade) {
            return grade == Grade.SILVER;
        }
        public int apply(int price) {
            return price * 97 / 100;
        }
    }
  named: |-
    interface DiscountPolicy {
        boolean supports(Grade grade);
        int apply(int price);
        String name();
    }

    class VipDiscount⤶
            implements DiscountPolicy {
        public boolean supports(Grade grade) {
            return grade == Grade.VIP;
        }
        public int apply(int price) {
            return price * 90 / 100;
        }
        public String name() {
            return "VIP 할인";
        }
    }

    class GoldDiscount⤶
            implements DiscountPolicy {
        public boolean supports(Grade grade) {
            return grade == Grade.GOLD;
        }
        public int apply(int price) {
            return price * 95 / 100;
        }
    }
predict:
  text: >-
    코드 A를 보여 주고 묻는다. "다음 세 요구 가운데 `OrderService`를 고쳐야 하는 것은 몇 개일까요?"
    요구는 VIP 할인율을 10%에서 15%로 바꾸기, 영수증 문구를 "결제 금액"에서 "결제하신 금액"으로 바꾸기, 메일 서버 주소 바꾸기다.
    보기는 0개, 1개, 2개, 3개 네 개다.
  answer: >-
    2개. 질문 1에서 확인한다. 서로 다른 팀의 요구 둘이 같은 클래스를 고치게 한다는 것이 단일 책임 원칙으로 들어가는 문이다.
questions:
  - id: q1
    title: 단일 책임 원칙은 무엇인가요?
    conclusion:
      lead: 클래스가 바뀌는 이유는 하나여야 한다는 원칙이에요.
      sub: 바뀌는 이유는 그 변경을 요구하는 쪽(마케팅팀, 고객지원팀)으로 세요. 메서드가 하나여야 한다는 뜻이 아니에요.
    says:
      - 단일 책임 원칙(SRP)은 클래스가 바뀌는 이유가 하나여야 한다는 원칙이다
      - 바뀌는 이유는 그 변경을 요구하는 쪽으로 센다. 할인 규칙은 마케팅팀이, 영수증 문구는 고객지원팀이 바꾸라고 한다
      - VIP 할인율을 바꾸는 것과 GOLD 할인율을 바꾸는 것은 요구는 둘이지만 바뀌는 이유는 하나다. 둘 다 마케팅팀이 요구한다
      - 예측의 답을 밝힌다. 코드 A의 `OrderService`는 할인율이 바뀔 때도, 영수증 문구가 바뀔 때도 고쳐야 한다. 세 요구 가운데 2개다
      - '`OrderService`를 고치게 하는 쪽이 마케팅팀과 고객지원팀 둘이다. 바뀌는 이유가 둘이라 단일 책임 원칙을 어겼다'
      - 메일 서버 주소가 바뀌면 `MailSender`를 고친다. `OrderService`는 고치지 않는다
      - 책임이 하나라는 것은 메서드나 필드가 하나라는 뜻이 아니다. 코드 A의 `OrderService`는 메서드가 `pay()` 하나인데도 원칙을 어겼다
    widget:
      kind: compare
      note: >-
        왼쪽 칸은 `OrderService`, 오른쪽 칸은 `MailSender`다. 칸의 항목은 그 클래스가 하는 일이다(왼쪽은 할인 계산, 영수증 문구 만들기,
        메일을 보내 달라고 부르기. 오른쪽은 메일 서버에 접속해서 보내기). 요구 넷(VIP 할인율 변경, GOLD 할인율 변경, 영수증 문구 변경,
        메일 서버 주소 변경) 가운데 하나를 고르면 고쳐야 하는 항목에 "고침"이 붙고, 칸 아래에 그 요구를 낸 쪽이 나온다.
        넷을 다 눌러 보면 `OrderService`를 고치게 하는 쪽이 둘이라는 것이 보인다. 코드의 어느 줄인지는 위젯 위의 코드 A에서
        할인 계산 줄과 문구 줄 두 곳을 `[[강조]]`해 보여 준다.
        원래 계획은 상황 분류하기였다. 바꾼 이유: 같은 세 요구를 예측에서 이미 판정하게 했고, 여기서 보여 줄 것은 "어디를 누가 고치게 하나"다.
    asks:
      - 책임이 하나라는 것은 무엇이 하나라는 뜻인가. 보기는 public 메서드, 클래스가 바뀌는 이유, 필드, 이 클래스를 쓰는 다른 클래스 (클래스가 바뀌는 이유)
      - 코드 A에서 VIP 할인율 변경, 영수증 문구 변경, 메일 서버 주소 변경 가운데 `OrderService`를 고쳐야 하는 것을 모두 고른다 (할인율 변경과 문구 변경)
      - 줄 고르기. 코드 A에서 영수증 문구를 바꾸라는 요구가 왔을 때 고쳐야 하는 줄 (12번째 줄)
      - OX. 단일 책임 원칙을 지키려면 클래스에 public 메서드가 하나만 있어야 한다 (X)
      - 설명형. 코드 A의 `OrderService`가 단일 책임 원칙을 어긴 이유를 바뀌는 이유를 세는 방법과 함께 설명한다
  - id: q2
    title: 책임이 섞여 있으면 어떤 문제가 생기고, 어떻게 나누나요?
    conclusion:
      lead: 한 가지 이유로 고칠 때 상관없는 기능의 코드까지 건드리게 돼요. 바뀌는 이유마다 클래스를 나눠요.
      sub: 나눈 뒤에는 할인율이 바뀌면 할인 계산만 든 클래스를, 문구가 바뀌면 문구만 든 클래스를 고쳐요.
    says:
      - 책임이 섞인 클래스는 한 가지 이유로 고칠 때 상관없는 기능의 코드도 같은 메서드 안에서 함께 건드리게 된다. 코드 A에서 영수증 문구를 고치려면 할인 계산이 든 `pay()`를 열어야 한다
      - 코드 A에서 영수증 문구가 맞는지 테스트하려면 `pay()`를 불러야 한다. 문구만 보려는데 할인 계산과 메일 보내기가 함께 실행된다
      - '나누는 기준: 같은 이유로 바뀌는 코드끼리 모으고, 다른 이유로 바뀌는 코드는 나눈다'
      - 코드 B는 할인 계산을 `DiscountCalculator`로, 영수증 문구를 `ReceiptWriter`로 나눴다
      - 코드 B에서 할인율이 바뀌면 `DiscountCalculator`만, 영수증 문구가 바뀌면 `ReceiptWriter`만 고친다. 고치는 클래스 안에 다른 이유로 바뀌는 코드가 없다
      - '코드 B에서 영수증 문구는 `ReceiptWriter.write()`만 불러 테스트할 수 있다. `write(9000)`은 "결제 금액: 9000원"을 돌려주고 메일은 나가지 않는다'
      - '`OrderService`에는 세 객체를 순서대로 부르는 일이 남는다. 할인율이 바뀌어도 문구가 바뀌어도 고치지 않는다'
    widget:
      kind: compare
      note: >-
        왼쪽 칸은 나누기 전(코드 A), 오른쪽 칸은 나눈 뒤(코드 B)다. 칸의 항목은 클래스이고, 그 클래스가 하는 일을 옆에 적는다.
        요구(VIP 할인율 변경, 영수증 문구 변경)를 고르면 양쪽에서 고쳐야 하는 클래스에 "고침"이 붙는다. 칸 아래에는
        "고치는 클래스에 함께 든 다른 일"을 적는다. 할인율 변경이면 왼쪽은 "영수증 문구, 메일 보내기", 오른쪽은 "없음"이다.
        고치는 클래스의 수는 양쪽 다 1이라서 수로 비교하지 않는다.
    asks:
      - 코드 B에서 VIP 할인율을 10%에서 15%로 바꿀 때 고쳐야 하는 클래스 (`DiscountCalculator`만)
      - OX. 코드 B에서 영수증 문구가 바뀌면 `OrderService`도 고쳐야 한다 (X)
      - 영수증 문구가 맞는지 테스트할 때 코드 A와 코드 B에서 각각 불러야 하는 메서드 (A는 `OrderService.pay()`, B는 `ReceiptWriter.write()`)
      - 설명형. 책임이 여럿인 클래스의 문제와, 코드 A를 코드 B로 나눈 기준을 설명한다
  - id: q3
    title: 개방 폐쇄 원칙은 무엇인가요?
    conclusion:
      lead: 기능을 더할 때 있던 코드를 고치지 않고 새 코드를 더해서 할 수 있어야 한다는 원칙이에요.
      sub: 확장에 열려 있다는 것은 새 기능을 더할 수 있다는 뜻이고, 수정에 닫혀 있다는 것은 그때 있던 코드를 고치지 않는다는 뜻이에요.
    says:
      - 개방 폐쇄 원칙(OCP)은 기능을 더할 때 있던 코드를 고치지 않고 새 코드를 더해서 할 수 있어야 한다는 원칙이다
      - '확장에 열려 있다: 새 기능을 더할 수 있다. 수정에 닫혀 있다: 그때 있던 코드를 고치지 않는다. 버그를 고치는 것은 기능을 더하는 것이 아니라서 이 원칙과 상관없다'
      - 코드 B의 `DiscountCalculator`는 등급을 `if`와 `else if`로 나눈다. SILVER 등급 3% 할인을 더하려면 `Grade`에 SILVER를 더하고 `calculate()` 안에 `else if`를 더해야 한다. 있던 메서드를 고치는 것이다
      - 등급이 늘 때마다 같은 메서드를 다시 고친다. 그 메서드에는 VIP와 GOLD의 계산이 함께 있어서, 고칠 때마다 이미 잘 돌던 계산을 잘못 건드릴 수 있다
      - '`calculate()`를 고치는 것을 빠뜨리면 SILVER 주문은 오류 없이 할인이 빠진 원래 금액이 나온다. 10,000원 주문이면 10000이다. 고치면 9700이다'
    widget:
      kind: steps
      note: >-
        `Grade`에 SILVER만 더하고 `calculate()`는 고치지 않은 코드 B에 10,000원 주문을 넣고 한 단계씩 넘긴다.
        시나리오는 "GOLD 주문"과 "SILVER 주문" 둘을 고르게 한다. 위의 두 칸(`duo`)에 넣은 주문(등급, 금액)과 돌려준 값을 두고,
        로그에 지나간 조건을 한 줄씩 쌓는다. GOLD는 `grade == Grade.VIP → false`, `grade == Grade.GOLD → true`, `return price * 95 / 100 → 9500`,
        SILVER는 조건 둘이 모두 false이고 `return price → 10000`이다. 마지막 단계에서 돌려준 값 10000에 문제 표시를 한다.
        코드는 위젯 위에 코드 B의 `calculate()`를 두고 마지막 `return price;`를 `[[강조]]`한다.
        원래 계획은 코드의 줄이 차례로 강조되는 것이었다. `steps`에는 그 조각이 없어서 지나간 조건을 로그로 보여 준다.
    asks:
      - '"수정에 닫혀 있다"의 뜻. 보기는 final로 상속을 막는다, 기능을 더할 때 있던 코드를 고치지 않는다, 필드를 private으로 숨긴다, 배포한 코드는 버그가 있어도 고치지 않는다 (기능을 더할 때 있던 코드를 고치지 않는다)'
      - OX. "확장에 열려 있다"는 것은 새 기능을 더할 수 있다는 뜻이다 (O)
      - 코드 B의 `DiscountCalculator`에 SILVER 등급 3% 할인을 더하려면 어떻게 해야 하나 (`calculate()` 안에 `else if`를 더한다)
      - 코드 B에서 `Grade`에 SILVER를 더하고 `calculate()`는 고치지 않았다. SILVER 등급 10,000원 주문으로 `calculate()`를 부르면 (10000)
      - 설명형. 등급을 `if`와 `else if`로 나눈 코드 B의 `DiscountCalculator`가 개방 폐쇄 원칙을 어긴 이유를 설명한다
  - id: q4
    title: 있던 코드를 고치지 않고 어떻게 기능을 더하나요?
    conclusion:
      lead: 바뀌는 부분을 인터페이스로 빼고, 새 기능은 그 인터페이스의 새 구현 클래스로 더해요.
      sub: 쓰는 쪽은 인터페이스만 알아서, 구현이 늘어도 고칠 것이 없어요.
    says:
      - 등급마다 다른 계산을 `DiscountPolicy` 인터페이스로 뺀다. 등급 하나의 할인이 구현 클래스 하나다. `GoldDiscount`는 `VipDiscount`와 같은 모양이고 95를 곱한다
      - 코드 C의 `DiscountCalculator`는 `DiscountPolicy`만 안다. `VipDiscount` 같은 구현 클래스의 이름은 코드에 나오지 않는다
      - '정책 목록은 조립 코드에서 만들어 `DiscountCalculator`에 넣는다. 조립 코드는 프로그램이 시작할 때 한 번 실행된다'
      - 'SILVER를 더할 때 하는 일은 셋이다. `Grade`에 SILVER를 더한다, `SilverDiscount` 클래스를 새로 만든다, 조립 코드의 목록에 `new SilverDiscount()`를 넣는다'
      - '`DiscountCalculator`와 `DiscountPolicy`, 있던 구현 클래스(`VipDiscount`, `GoldDiscount`)는 고치지 않는다. 할인을 계산하는 코드 가운데 고치는 것이 없다'
      - '`Grade`에 SILVER를 더하는 것은 코드 B와 같다. 다른 것은 그다음이다. 코드 B는 계산이 든 `calculate()`를 고치고, 코드 C는 목록을 만드는 조립 코드를 고친다'
      - 고치는 곳이 없어지는 것이 아니다. 계산 코드 밖의 조립 코드로 옮겨 간다
      - 새 클래스를 만들고 목록에 넣지 않으면 SILVER 주문은 원래 금액이 나온다(10000). 목록에 넣으면 9700이 나온다. 빠뜨리면 오류 없이 틀린다는 점은 코드 B와 같다
    widget:
      kind: compare
      note: >-
        왼쪽 칸은 코드 B, 오른쪽 칸은 코드 C다. 칸의 항목은 파일이다(왼쪽은 `Grade`, `DiscountCalculator`. 오른쪽은 `Grade`,
        `DiscountPolicy`, `DiscountCalculator`, `VipDiscount`, `GoldDiscount`, 조립 코드). "SILVER 등급 더하기" 버튼을 누르면
        왼쪽은 `Grade`와 `DiscountCalculator`에 "고침"이 붙고, 오른쪽은 `Grade`와 조립 코드에 "고침"이 붙고 `SilverDiscount`가
        "새로 만듦"으로 생긴다. 칸 아래에는 "할인을 계산하는 코드 가운데 고친 것"을 적는다. 왼쪽은 `calculate()`, 오른쪽은 없음이다.
        고친 파일의 수는 양쪽 다 2라서 수로 비교하지 않는다.
    asks:
      - 코드 C에 SILVER 등급 할인을 더할 때 고치지 않아도 되는 것. 보기는 `Grade`, 조립 코드, `DiscountCalculator`, 셋 다 고쳐야 한다 (`DiscountCalculator`)
      - 코드 C에서 `SilverDiscount`를 만들었지만 정책 목록에 넣지 않았다. SILVER 등급 10,000원 주문으로 `calculate()`를 부르면 (10000)
      - OX. 코드 C의 `DiscountCalculator` 코드에는 `VipDiscount`라는 클래스 이름이 나오지 않는다 (O)
      - 설명형. 코드 B의 `if`와 `else if`를 코드 C처럼 바꾸는 방법과, 바꾼 뒤에 새 등급을 더할 때 달라지는 것을 설명한다
  - id: q5
    title: 개방 폐쇄 원칙을 지키면 어떤 변경이든 있던 코드를 고치지 않고 할 수 있나요?
    conclusion:
      lead: 아니요. 인터페이스로 빼 둔 방향의 변경에만 닫혀 있어요.
      sub: 코드 C는 새 등급을 더하는 변경에는 닫혀 있지만, 인터페이스에 메서드를 더하는 변경에는 구현 클래스를 모두 고쳐야 해요.
    says:
      - 코드 C는 새 등급을 더하는 변경에만 닫혀 있다
      - '`DiscountPolicy`에 메서드를 더하면(예: 할인 이름을 돌려주는 `String name()`) 구현 클래스가 모두 그 메서드를 구현해야 한다. default 메서드를 쓰지 않으면, 고치지 않은 구현 클래스에서 컴파일 오류가 난다'
      - 코드 named처럼 `VipDiscount`만 고치면 `GoldDiscount`에서 컴파일 오류가 난다
      - 구현이 둘이면 인터페이스 1개와 구현 2개, 파일 3개를 고친다. 구현 클래스가 많을수록 고칠 곳이 많다
      - 메서드의 모양을 바꾸는 변경(`apply()`가 돌려주는 타입을 long으로, `supports()`가 받는 값을 주문 금액으로)은 인터페이스와 구현을 모두 고치고, 그 메서드를 부르는 `DiscountCalculator`도 고쳐야 한다
      - 어느 방향의 변경에 닫을지는 인터페이스를 만들 때 정해진다. 그래서 실제로 자주 바뀌는 곳에 적용한다
    widget:
      kind: classify
      note: >-
        코드 C에 온 변경 요구를 "있던 계산 코드는 그대로"와 "있던 계산 코드를 고친다"로 나눈다. 위젯 위에 "있던 계산 코드"가
        `DiscountPolicy`, `DiscountCalculator`, `VipDiscount`, `GoldDiscount`라고 적는다. 요구는 다섯이다. SILVER 등급 3% 할인 더하기(그대로),
        BRONZE 등급 1% 할인 더하기(그대로), `DiscountPolicy`에 `String name()` 더하기(고친다), `apply()`가 돌려주는 타입을 long으로 바꾸기(고친다),
        `supports()`가 등급 대신 주문 금액을 받게 바꾸기(고친다). 고르면 해설에 고쳐야 하는 파일의 이름과 수가 나온다.
        원래 계획은 누르면 고쳐야 하는 파일이 강조되는 것이었다. `classify`는 해설 글만 보여 주므로 파일 이름을 해설에 적는다.
        컴파일 오류는 위젯 위의 본문에서 코드 named와 실제 오류 문장으로 보여 준다.
    asks:
      - 코드 C의 `DiscountPolicy`에 `String name()`을 더한다. 구현은 `VipDiscount`와 `GoldDiscount` 둘이고 default 메서드는 쓰지 않는다. 인터페이스와 클래스는 파일 하나씩이다. 컴파일되려면 고쳐야 하는 파일 수 (3개)
      - 코드 named를 컴파일하면 어떻게 되나. 보기는 오류 없이 컴파일된다, `VipDiscount`에서 오류, `GoldDiscount`에서 오류, `DiscountPolicy`에서 오류 (`GoldDiscount`에서 컴파일 오류)
      - 코드 C에서 `DiscountCalculator`와 있던 구현 클래스를 고치지 않고 할 수 있는 변경. 보기는 SILVER 등급 할인 더하기, `DiscountPolicy`에 메서드 더하기, `apply()`가 돌려주는 타입 바꾸기, `supports()`가 받는 값 바꾸기 (SILVER 등급 할인 더하기)
      - 설명형. 코드 C에도 있던 코드를 고쳐야 하는 변경이 있다. 예를 하나 들고 이유를 설명한다
claims:
  - claim: '코드 A. VIP 10,000원 주문으로 `pay()`를 한 번 부르면 9000이 나오고, 그동안 `mail.send()`가 1번 불린다. 보낸 글은 "결제 금액: 9000원"이다'
    how: '`send()`가 불린 횟수와 받은 글을 적어 두는 가짜 `MailSender`를 넣고 돌린다. 돌려 봤다 (9000, 1번, 결제 금액: 9000원)'
  - claim: '코드 B. `ReceiptWriter.write(9000)`은 "결제 금액: 9000원"을 돌려주고, 그동안 `mail.send()`는 0번 불린다'
    how: '같은 방법. 돌려 봤다 (결제 금액: 9000원, 0번)'
  - claim: 코드 A와 코드 B의 `pay()`는 10,000원 주문에 같은 값을 돌려준다. VIP 9000, GOLD 9500, BASIC 10000
    how: 코드를 돌려 반환값을 본다. 나누기만 하고 동작은 바꾸지 않았다는 확인이다. 돌려 봤다 (양쪽 모두 9000, 9500, 10000)
  - claim: 코드 B에서 `Grade`에 SILVER를 더하고 `calculate()`를 고치지 않으면 SILVER 10,000원 주문은 10000이 나온다. `else if`를 더하면 9700이 나온다
    how: 코드를 돌려 반환값을 본다. 돌려 봤다 (10000, 9700)
  - claim: 코드 C에서 `SilverDiscount`를 목록에 넣지 않으면 SILVER 10,000원 주문은 10000, 넣으면 9700이 나온다
    how: 코드를 돌려 반환값을 본다. 돌려 봤다 (10000, 9700)
  - claim: 코드 B에 SILVER를 더하면 `Grade`와 `DiscountCalculator` 두 파일이 바뀐다
    how: >-
      요구를 반영하기 전과 후의 코드를 패키지 둘에 나란히 두고, 테스트가 두 패키지의 같은 이름 파일을 비교한다(패키지 선언 줄은 뺀다).
      테스트는 아직 없다. 폴더 둘을 `diff`로 비교해 봤다 (다른 파일은 `Grade`, `DiscountCalculator`)
  - claim: 코드 C에 SILVER를 더하면 `Grade`와 조립 코드가 바뀌고 `SilverDiscount`가 새로 생긴다. `DiscountPolicy`, `DiscountCalculator`, `VipDiscount`, `GoldDiscount`는 바뀌지 않는다
    how: 같은 방법. 조립 코드는 파일 하나(`Wiring`)에 두고 비교한다. `diff`로 비교해 봤다 (다른 파일은 `Grade`, `Wiring`. 새 파일은 `SilverDiscount`)
  - claim: 코드 named. `DiscountPolicy`에 `name()`을 더하고 `VipDiscount`만 고치면 `GoldDiscount`에서 컴파일 오류가 난다
    how: >-
      테스트 안에서 자바 컴파일러(`javax.tools.JavaCompiler`)로 소스를 컴파일해 오류가 난 클래스를 본다. `javac`로 돌려 봤다
      (GoldDiscount is not abstract and does not override abstract method name() in DiscountPolicy, 오류 1개)
  - claim: '`name()`을 인터페이스에만 더하면 오류는 `VipDiscount`와 `GoldDiscount`에서 하나씩 나고 `DiscountCalculator`에서는 나지 않는다. 고칠 파일은 인터페이스까지 3개다'
    how: 같은 방법. `javac`로 돌려 봤다 (오류 2개, `VipDiscount`와 `GoldDiscount`)
  - claim: '`name()`을 default 메서드로 더하면 구현 클래스를 고치지 않아도 컴파일된다'
    how: 같은 방법. `javac`로 돌려 봤다 (오류 없음)
  - claim: '`apply()`가 돌려주는 타입을 long으로 바꾸거나 `supports()`가 주문 금액(int)을 받게 바꾸면 구현 클래스 둘과 `DiscountCalculator`에서 컴파일 오류가 난다'
    how: 같은 방법. 인터페이스만 바꾸고 `javac`로 돌려 봤다 (두 경우 모두 `VipDiscount`, `GoldDiscount`, `DiscountCalculator`에서 오류)
sources:
  - '단일 책임 원칙의 정의(클래스가 바뀌는 이유는 하나), 바뀌는 이유를 그 변경을 요구하는 사람으로 센다는 것, 같은 이유로 바뀌는 것을 모으고 다른 이유로 바뀌는 것을 나눈다는 것: [Robert C. Martin, "The Single Responsibility Principle" (2014)](link:srp)'
  - '개방 폐쇄 원칙의 정의(고치지 않고 동작을 넓힐 수 있어야 한다, 새 기능은 새 코드를 써서 더한다): [Robert C. Martin, "The Open Closed Principle" (2014)](link:ocp)'
  - '추상 클래스가 아닌 클래스가 추상 메서드를 구현하지 않으면 컴파일 오류라는 것: [자바 언어 명세 8.1.1.1 (Java SE 21)](link:jls)'
