predict:
  title: OrderService를 고쳐야 하는 요구는 몇 개일까요?
  text: >-
    쇼핑몰의 주문 결제 코드예요. 회원 등급에 따라 할인하고, 결제 금액을 적은 영수증을 메일로 보내요.
    메일 서버에 접속해서 보내는 코드는 `MailSender` 안에 있어요. 이 코드에 요구 세 개가 왔어요.
    **VIP 할인율을 10%에서 15%로 바꾸기**, **영수증 문구를 "결제 금액"에서 "결제하신 금액"으로 바꾸기**, **메일 서버 주소 바꾸기**예요.
    이 가운데 `OrderService`를 고쳐야 하는 것은 몇 개일까요? 모르는 게 정상이니 감으로 골라 보세요.
  code: predictA
  label: 내 예측 (OrderService를 고쳐야 하는 요구의 수)
  options:
    - {value: n0, label: 0개}
    - {value: n1, label: 1개}
    - {value: n2, label: 2개}
    - {value: n3, label: 3개}
  answer: n2
  storageKey: srp-ocp-predict
  wrong: '"{label}"로 예측했어요. 틀린 예측이 더 오래 남으니 괜찮아요.'
questions:
  - id: q1
    title: 단일 책임 원칙은 무엇인가요?
    conclusion:
      lead: 클래스가 바뀌는 이유는 하나여야 한다는 원칙이에요.
      sub: 바뀌는 이유는 그 변경을 요구하는 쪽(마케팅팀, 고객지원팀)으로 세요. 메서드가 하나여야 한다는 뜻이 아니에요.
    says:
      - 단일 책임 원칙(SRP)은 클래스가 바뀌는 이유가 하나여야 한다는 원칙이다
      - 바뀌는 이유는 그 변경을 요구하는 쪽으로 센다. 할인 규칙은 마케팅팀이, 영수증 문구는 고객지원팀이 바꾸라고 한다
      - VIP 할인율을 바꾸는 것과 GOLD 할인율을 바꾸는 것은 요구는 둘이지만 바뀌는 이유는 하나다. 둘 다 마케팅팀이 요구한다
      - 예측의 답을 밝힌다. 코드 A의 `OrderService`는 할인율이 바뀔 때도, 영수증 문구가 바뀔 때도 고쳐야 한다. 세 요구 가운데 2개다
      - '`OrderService`를 고치게 하는 쪽이 마케팅팀과 고객지원팀 둘이다. 바뀌는 이유가 둘이라 단일 책임 원칙을 어겼다'
      - 메일 서버 주소가 바뀌면 `MailSender`를 고친다. `OrderService`는 고치지 않는다
      - 책임이 하나라는 것은 메서드나 필드가 하나라는 뜻이 아니다. 코드 A의 `OrderService`는 메서드가 `pay()` 하나인데도 원칙을 어겼다
    widget:
      kind: compare
      note: >-
        왼쪽 칸은 `OrderService`, 오른쪽 칸은 `MailSender`다. 칸의 항목은 그 클래스가 하는 일이다(왼쪽은 할인 계산, 영수증 문구 만들기,
        메일을 보내 달라고 부르기. 오른쪽은 메일 서버에 접속해서 보내기). 요구 넷(VIP 할인율 변경, GOLD 할인율 변경, 영수증 문구 변경,
        메일 서버 주소 변경) 가운데 하나를 고르면 고쳐야 하는 항목에 "고침"이 붙고, 칸 아래에 그 요구를 낸 쪽이 나온다.
        넷을 다 눌러 보면 `OrderService`를 고치게 하는 쪽이 둘이라는 것이 보인다. 코드의 어느 줄인지는 위젯 위의 코드 A에서
        할인 계산 줄과 문구 줄 두 곳을 `[[강조]]`해 보여 준다.
    asks:
      - 코드 A에서 VIP 할인율 변경, 영수증 문구 변경, 메일 서버 주소 변경 가운데 `OrderService`를 고쳐야 하는 것을 모두 고른다 (할인율 변경과 문구 변경)
      - 줄 고르기. 코드 A에서 영수증 문구를 바꾸라는 요구가 왔을 때 고쳐야 하는 줄 (12번째 줄)
      - OX. 단일 책임 원칙을 지키려면 클래스에 public 메서드가 하나만 있어야 한다 (X)
    body:
    - p: '단일 책임 원칙(SRP, Single Responsibility Principle)은 **클래스가 바뀌는 이유는 하나여야 한다**는 원칙이에요([로버트 마틴의 글](link:srp)). 여기서 "책임"은 클래스가 하는 일의 개수가 아니라 **바뀌는 이유**를 가리켜요.'
    - p: 바뀌는 이유는 **그 변경을 요구하는 쪽**으로 세요. 이 쇼핑몰에서 할인 규칙은 마케팅팀이 바꾸라고 하고, 영수증 문구는 고객지원팀이 바꾸라고 해요.
    - p: 처음에 본 코드에서 두 팀이 고치게 하는 곳을 찾아볼게요. 이 코드를 **코드 A**라고 부를게요.
    - code: AMark
      notes:
      - {mark: 'price = price * 90 / 100;', as: code, text: 할인 계산이에요. 아래의 GOLD 줄도 같아요. 마케팅팀이 할인율을 바꾸라고 하면 여기를 고쳐요.}
      - {mark: '"결제 금액: " + price + "원";', as: code, text: 영수증 문구예요. 고객지원팀이 문구를 바꾸라고 하면 여기를 고쳐요.}
    - p: '메일 서버 주소는 어떨까요? 메일 서버에 접속해서 보내는 코드는 `MailSender` 안에 있어요. `OrderService`는 `mail.send()`를 부르기만 해요. 그래서 주소가 바뀌면 `MailSender`를 고치고 `OrderService`는 고치지 않아요.'
    - p: 아래에서 요구를 하나씩 골라 보세요. 어느 클래스의 무엇을 고치는지, 누가 요구했는지 볼 수 있어요.
    - widget:
        kind: compare
        layout:
        - selector
        - sides
        - verdict
        selector:
          label: 들어온 요구
          options:
          - {value: vip, label: VIP 할인율 변경}
          - {value: gold, label: GOLD 할인율 변경}
          - {value: text, label: 영수증 문구 변경}
          - {value: server, label: 메일 서버 주소 변경}
        sides:
        - label: OrderService가 하는 일
          items:
          - name: 할인 계산
          - name: 영수증 문구 만들기
          - name: 메일을 보내 달라고 부르기
        - label: MailSender가 하는 일
          items:
          - name: 메일 서버에 접속해서 보내기
        scenes:
          vip:
            sides:
            - marks:
              - {name: 할인 계산, tag: 고침}
              result:
              - {k: 요구한 쪽, v: 마케팅팀}
            - result:
              - {k: 고칠 곳, v: 없음}
            verdict: 'VIP 할인율 변경: 마케팅팀의 요구로 OrderService를 고쳐요.'
          gold:
            sides:
            - marks:
              - {name: 할인 계산, tag: 고침}
              result:
              - {k: 요구한 쪽, v: 마케팅팀}
            - result:
              - {k: 고칠 곳, v: 없음}
            verdict: 'GOLD 할인율 변경: 이것도 마케팅팀의 요구예요. 요구는 달라도 바뀌는 이유는 VIP 할인율 변경과 같아요.'
          text:
            sides:
            - marks:
              - {name: 영수증 문구 만들기, tag: 고침}
              result:
              - {k: 요구한 쪽, v: 고객지원팀, mark: changed}
            - result:
              - {k: 고칠 곳, v: 없음}
            verdict: '영수증 문구 변경: 고객지원팀의 요구로도 OrderService를 고쳐요. OrderService를 고치게 하는 쪽이 둘이에요.'
          server:
            sides:
            - result:
              - {k: 고칠 곳, v: 없음}
            - marks:
              - {name: 메일 서버에 접속해서 보내기, tag: 고침}
              result:
              - {k: 요구한 쪽, v: 운영팀}
            verdict: '메일 서버 주소 변경: MailSender를 고쳐요. OrderService는 고치지 않아요.'
    - p: '처음에 예측한 문제의 답은 **2개**예요. `OrderService`는 할인율이 바뀔 때도, 영수증 문구가 바뀔 때도 고쳐야 해요. 메일 서버 주소가 바뀔 때는 고치지 않아요. {{predict-result}}'
    - p: '`OrderService`를 고치게 하는 쪽이 마케팅팀과 고객지원팀 둘이에요. 바뀌는 이유가 둘이라서 단일 책임 원칙을 어겼어요.'
    - callout: '**책임이 하나라는 것은 메서드나 필드가 하나라는 뜻이 아니에요.** 코드 A의 `OrderService`는 메서드가 `pay()` 하나뿐인데도 원칙을 어겼어요.'
    - quiz:
        q: 코드 A에 GOLD 할인율을 5%에서 7%로 바꾸라는 요구가 왔어요. VIP 할인율을 바꾸라는 요구와 견주면, OrderService가 바뀌는 이유는 같을까요 다를까요?
        options:
        - 같다. 둘 다 마케팅팀이 요구한다
        - 다르다. 요구가 둘이니 바뀌는 이유도 둘이다
        answer: 1
        explain: 바뀌는 이유는 요구의 수가 아니라 그 변경을 요구하는 쪽으로 세요. 두 요구 모두 마케팅팀이 내요.
    - next: 바뀌는 이유가 둘인 클래스는 무엇이 문제일까요? 그리고 어떻게 나눌까요?
    recall: '클래스가 바뀌는 이유는 하나여야 한다는 원칙이에요. 바뀌는 이유는 그 변경을 요구하는 쪽으로 세요. 코드 A의 `OrderService`는 마케팅팀이 할인율을 바꾸라고 해도, 고객지원팀이 영수증 문구를 바꾸라고 해도 고쳐야 해서 바뀌는 이유가 둘이에요. 메서드가 하나여야 한다는 뜻은 아니에요.'
  - id: q2
    title: 책임이 섞여 있으면 어떤 문제가 생기고, 어떻게 나누나요?
    conclusion:
      lead: 한 가지 이유로 고칠 때 상관없는 기능의 코드까지 건드리게 돼요. 바뀌는 이유마다 클래스를 나눠요.
      sub: 나눈 뒤에는 할인율이 바뀌면 할인 계산만 든 클래스를, 문구가 바뀌면 문구만 든 클래스를 고쳐요.
    says:
      - 책임이 섞인 클래스는 한 가지 이유로 고칠 때 상관없는 기능의 코드도 같은 메서드 안에서 함께 건드리게 된다. 코드 A에서 영수증 문구를 고치려면 할인 계산이 든 `pay()`를 열어야 한다
      - 코드 A에서 영수증 문구가 맞는지 테스트하려면 `pay()`를 불러야 한다. 문구만 보려는데 할인 계산과 메일 보내기가 함께 실행된다
      - '나누는 기준: 같은 이유로 바뀌는 코드끼리 모으고, 다른 이유로 바뀌는 코드는 나눈다'
      - 코드 B는 할인 계산을 `DiscountCalculator`로, 영수증 문구를 `ReceiptWriter`로 나눴다
      - 코드 B에서 할인율이 바뀌면 `DiscountCalculator`만, 영수증 문구가 바뀌면 `ReceiptWriter`만 고친다. 고치는 클래스 안에 다른 이유로 바뀌는 코드가 없다
      - '코드 B에서 영수증 문구는 `ReceiptWriter.write()`만 불러 테스트할 수 있다. `write(9000)`은 "결제 금액: 9000원"을 돌려주고 메일은 나가지 않는다'
      - '`OrderService`에는 세 객체를 순서대로 부르는 일이 남는다. 할인율이 바뀌어도 문구가 바뀌어도 고치지 않는다'
    widget:
      kind: compare
      note: >-
        왼쪽 칸은 나누기 전(코드 A), 오른쪽 칸은 나눈 뒤(코드 B)다. 칸의 항목은 클래스이고, 그 클래스가 하는 일을 옆에 적는다.
        요구(VIP 할인율 변경, 영수증 문구 변경)를 고르면 양쪽에서 고쳐야 하는 클래스에 "고침"이 붙는다. 칸 아래에는
        "고치는 클래스에 함께 든 다른 일"을 적는다. 할인율 변경이면 왼쪽은 "영수증 문구, 메일 보내기", 오른쪽은 "없음"이다.
        고치는 클래스의 수는 양쪽 다 1이라서 수로 비교하지 않는다.
    asks:
      - 코드 B에서 VIP 할인율을 10%에서 15%로 바꿀 때 고쳐야 하는 클래스 (`DiscountCalculator`만)
      - 영수증 문구가 맞는지 테스트할 때 코드 A와 코드 B에서 각각 불러야 하는 메서드 (A는 `OrderService.pay()`, B는 `ReceiptWriter.write()`)
    body:
    - p: 책임이 섞인 클래스는 한 가지 이유로 고칠 때 **상관없는 기능의 코드도 같은 메서드 안에서 함께 건드리게** 돼요.
    - p: '코드 A에서 고객지원팀이 영수증 문구를 바꿔 달라고 했다고 해 볼게요. 문구는 `pay()` 안에 있어요. 그 메서드에는 마케팅팀이 정한 할인 계산도 들어 있어요. 문구 한 줄을 고치려고 할인 계산이 든 메서드를 열어야 해요.'
    - p: '테스트할 때도 같아요. 코드 A에서 영수증 문구가 맞는지 보려면 `pay()`를 불러야 해요. 문구만 보려는데 할인 계산과 메일 보내기가 함께 실행돼요.'
    - ci:
        key: a-pay
        label: 코드 A에서 실제로 돌린 출력 보기
        source: CodeATest.payCalculatesWritesAndSends
        code: A
    - h3: 바뀌는 이유마다 나눠요
    - p: '나누는 기준은 하나예요. **같은 이유로 바뀌는 코드끼리 모으고, 다른 이유로 바뀌는 코드는 나눠요.** 할인 계산은 `DiscountCalculator`로, 영수증 문구는 `ReceiptWriter`로 옮겼어요. 이 코드를 **코드 B**라고 부를게요.'
    - code: BMark
      notes:
      - {mark: DiscountCalculator, as: code, text: 할인 계산만 들어 있어요. 마케팅팀이 할인율을 바꾸라고 할 때만 고쳐요.}
      - {mark: ReceiptWriter, as: code, text: 영수증 문구만 들어 있어요. 고객지원팀이 문구를 바꾸라고 할 때만 고쳐요.}
    - p: '`OrderService`에는 세 객체를 순서대로 부르는 일이 남았어요. 할인율이 바뀌어도 문구가 바뀌어도 고치지 않아요.'
    - p: 아래에서 요구를 골라, 나누기 전과 나눈 뒤에 고치는 클래스를 비교해 보세요.
    - widget:
        kind: compare
        layout:
        - selector
        - sides
        - verdict
        selector:
          label: 들어온 요구
          options:
          - {value: rate, label: VIP 할인율 변경}
          - {value: text, label: 영수증 문구 변경}
        sides:
        - label: 나누기 전 (코드 A)
          items:
          - {name: OrderService, note: '할인 계산, 영수증 문구, 메일 보내기'}
        - label: 나눈 뒤 (코드 B)
          items:
          - {name: DiscountCalculator, note: 할인 계산}
          - {name: ReceiptWriter, note: 영수증 문구}
          - {name: OrderService, note: 세 객체를 순서대로 부르기}
        scenes:
          rate:
            sides:
            - marks:
              - {name: OrderService, tag: 고침, mark: bad}
              result:
              - {k: 함께 든 다른 일, v: '영수증 문구, 메일 보내기', mark: bad}
            - marks:
              - {name: DiscountCalculator, tag: 고침}
              result:
              - {k: 함께 든 다른 일, v: 없음}
            verdict: 'VIP 할인율 변경: 나누기 전에는 영수증 문구와 메일 보내기가 함께 든 클래스를 고쳐요. 나눈 뒤에는 할인 계산만 든 클래스를 고쳐요.'
          text:
            sides:
            - marks:
              - {name: OrderService, tag: 고침, mark: bad}
              result:
              - {k: 함께 든 다른 일, v: '할인 계산, 메일 보내기', mark: bad}
            - marks:
              - {name: ReceiptWriter, tag: 고침}
              result:
              - {k: 함께 든 다른 일, v: 없음}
            verdict: '영수증 문구 변경: 나누기 전에는 할인 계산과 메일 보내기가 함께 든 클래스를 고쳐요. 나눈 뒤에는 문구만 든 클래스를 고쳐요.'
    - p: '고치는 클래스의 수는 양쪽 다 하나예요. 달라진 것은 **고치는 클래스 안에 무엇이 함께 들어 있느냐**예요.'
    - p: '테스트도 따로 할 수 있어요. 코드 B에서 영수증 문구는 `ReceiptWriter.write()`만 불러 확인해요.'
    - ci:
        key: b-write
        label: 코드 B에서 실제로 돌린 출력 보기
        source: CodeBTest.receiptIsTestedAlone
        code: bWrite
    - muted: '나누기만 했고 동작은 바꾸지 않았어요. 10,000원 주문에 `pay()`가 돌려주는 값은 코드 A와 코드 B가 같아요. VIP는 9000, GOLD는 9500, BASIC은 10000이에요.'
    - quiz:
        q: 코드 B에서 영수증 문구가 맞는지 보려고 ReceiptWriter의 write(9000)만 불렀어요. 그동안 mail.send()는 몇 번 불릴까요?
        options:
        - 0번
        - 1번
        answer: 1
        explain: write()는 문구를 만들어 돌려주기만 해요. 메일을 보내는 것은 OrderService의 pay()가 하는 일이에요.
    - next: '할인 계산을 `DiscountCalculator`에 모았어요. 여기에 새 등급을 더하려면 무엇을 고쳐야 할까요?'
    recall: '한 가지 이유로 고칠 때 상관없는 기능의 코드까지 건드리게 돼요. 코드 A에서 영수증 문구를 고치려면 할인 계산이 든 `pay()`를 열어야 하고, 문구를 테스트하려고 해도 할인 계산과 메일 보내기가 함께 실행돼요. 그래서 같은 이유로 바뀌는 코드끼리 모으고 다른 이유로 바뀌는 코드는 나눠요. 할인 계산은 `DiscountCalculator`로, 영수증 문구는 `ReceiptWriter`로 나누면 고치는 클래스 안에 다른 이유로 바뀌는 코드가 없어요.'
  - id: q3
    title: 개방 폐쇄 원칙은 무엇인가요?
    conclusion:
      lead: 기능을 더할 때 있던 코드를 고치지 않고 새 코드를 더해서 할 수 있어야 한다는 원칙이에요.
      sub: 확장에 열려 있다는 것은 새 기능을 더할 수 있다는 뜻이고, 수정에 닫혀 있다는 것은 그때 있던 코드를 고치지 않는다는 뜻이에요.
    says:
      - 개방 폐쇄 원칙(OCP)은 기능을 더할 때 있던 코드를 고치지 않고 새 코드를 더해서 할 수 있어야 한다는 원칙이다
      - '확장에 열려 있다: 새 기능을 더할 수 있다. 수정에 닫혀 있다: 그때 있던 코드를 고치지 않는다. 버그를 고치는 것은 기능을 더하는 것이 아니라서 이 원칙과 상관없다'
      - 코드 B의 `DiscountCalculator`는 등급을 `if`와 `else if`로 나눈다. SILVER 등급 3% 할인을 더하려면 `Grade`에 SILVER를 더하고 `calculate()` 안에 `else if`를 더해야 한다. 있던 메서드를 고치는 것이다
      - 등급이 늘 때마다 같은 메서드를 다시 고친다. 그 메서드에는 VIP와 GOLD의 계산이 함께 있어서, 고칠 때마다 이미 잘 돌던 계산을 잘못 건드릴 수 있다
      - '`calculate()`를 고치는 것을 빠뜨리면 SILVER 주문은 오류 없이 할인이 빠진 원래 금액이 나온다. 10,000원 주문이면 10000이다. 고치면 9700이다'
    widget:
      kind: steps
      note: >-
        `Grade`에 SILVER만 더하고 `calculate()`는 고치지 않은 코드 B에 10,000원 주문을 넣고 한 단계씩 넘긴다.
        시나리오는 "GOLD 주문"과 "SILVER 주문" 둘을 고르게 한다. 위의 두 칸(`duo`)에 넣은 주문(등급, 금액)과 돌려준 값을 두고,
        로그에 지나간 조건을 한 줄씩 쌓는다. GOLD는 `grade == Grade.VIP → false`, `grade == Grade.GOLD → true`, `return price * 95 / 100 → 9500`,
        SILVER는 조건 둘이 모두 false이고 `return price → 10000`이다. 마지막 단계에서 돌려준 값 10000에 문제 표시를 한다.
        코드는 위젯 위에 코드 B의 `calculate()`를 두고 마지막 `return price;`를 `[[강조]]`한다.
    asks:
      - 코드 B의 `DiscountCalculator`에 SILVER 등급 3% 할인을 더하려면 어떻게 해야 하나 (`calculate()` 안에 `else if`를 더한다)
      - 코드 B에서 `Grade`에 SILVER를 더하고 `calculate()`는 고치지 않았다. SILVER 등급 10,000원 주문으로 `calculate()`를 부르면 (10000)
    body:
    - p: '개방 폐쇄 원칙(OCP, Open-Closed Principle)은 **기능을 더할 때 있던 코드를 고치지 않고 새 코드를 더해서 할 수 있어야 한다**는 원칙이에요([로버트 마틴의 글](link:ocp)). 이름의 두 낱말은 이런 뜻이에요.'
    - ul:
      - '**확장에 열려 있다:** 새 기능을 더할 수 있어요.'
      - '**수정에 닫혀 있다:** 그때 있던 코드를 고치지 않아요.'
    - muted: 버그를 고치는 것은 기능을 더하는 것이 아니라서 이 원칙과 상관없어요.
    - p: '코드 B의 `DiscountCalculator`는 등급을 `if`와 `else if`로 나눠요. 여기에 마케팅팀이 SILVER 등급 3% 할인을 더해 달라고 했어요. 할 일은 둘이에요. `Grade`에 SILVER를 더하고, `calculate()` 안에 `else if`를 더해요.'
    - code: BSilver
      notes:
      - {mark: '} else if (grade == Grade.SILVER) {', as: code, text: '새 등급을 더하려고 있던 메서드 `calculate()` 안에 줄을 넣었어요.'}
    - p: '기능을 더하려고 **있던 메서드를 고쳤어요.** 개방 폐쇄 원칙을 어긴 코드예요.'
    - p: 등급이 늘 때마다 같은 메서드를 다시 고쳐야 해요. 그 메서드에는 VIP와 GOLD의 계산이 함께 있어요. 그래서 고칠 때마다 이미 잘 돌던 계산을 잘못 건드릴 수 있어요.
    - h3: 고치는 것을 빠뜨리면
    - p: '`Grade`에 SILVER만 더하고 `calculate()`를 고치는 것을 빠뜨렸다고 해 볼게요. VIP도 GOLD도 아닌 등급은 마지막 `return price;`로 가서 할인 없이 원래 금액을 돌려줘요. 아래에서 10,000원 주문을 넣고 한 단계씩 넘겨 보세요.'
