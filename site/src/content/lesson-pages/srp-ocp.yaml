  - id: q5
    title: 개방 폐쇄 원칙을 지키면 어떤 변경이든 있던 코드를 고치지 않고 할 수 있나요?
    conclusion:
      lead: 아니요. 인터페이스로 빼 둔 방향의 변경에만 닫혀 있어요.
      sub: 코드 C는 새 등급을 더하는 변경에는 닫혀 있지만, 인터페이스에 메서드를 더하는 변경에는 구현 클래스를 모두 고쳐야 해요.
    says:
      - 코드 C는 새 등급을 더하는 변경에만 닫혀 있다
      - '`DiscountPolicy`에 메서드를 더하면(예: 할인 이름을 돌려주는 `String name()`) 구현 클래스가 모두 그 메서드를 구현해야 한다. default 메서드를 쓰지 않으면, 고치지 않은 구현 클래스에서 컴파일 오류가 난다'
      - 코드 named처럼 `VipDiscount`만 고치면 `GoldDiscount`에서 컴파일 오류가 난다
      - 구현이 둘이면 인터페이스 1개와 구현 2개, 파일 3개를 고친다. 구현 클래스가 많을수록 고칠 곳이 많다
      - 메서드의 모양을 바꾸는 변경(`apply()`가 돌려주는 타입을 long으로, `supports()`가 받는 값을 주문 금액으로)은 인터페이스와 구현을 모두 고치고, 그 메서드를 부르는 `DiscountCalculator`도 고쳐야 한다
      - 어느 방향의 변경에 닫을지는 인터페이스를 만들 때 정해진다. 그래서 실제로 자주 바뀌는 곳에 적용한다
    widget:
      kind: classify
      note: >-
        코드 C에 온 변경 요구를 "있던 계산 코드는 그대로"와 "있던 계산 코드를 고친다"로 나눈다. 위젯 위에 "있던 계산 코드"가
        `DiscountPolicy`, `DiscountCalculator`, `VipDiscount`, `GoldDiscount`라고 적는다. 요구는 다섯이다. SILVER 등급 3% 할인 더하기(그대로),
        BRONZE 등급 1% 할인 더하기(그대로), `DiscountPolicy`에 `String name()` 더하기(고친다), `apply()`가 돌려주는 타입을 long으로 바꾸기(고친다),
        `supports()`가 등급 대신 주문 금액을 받게 바꾸기(고친다). 고르면 해설에 고쳐야 하는 파일의 이름과 수가 나온다.
        원래 계획은 누르면 고쳐야 하는 파일이 강조되는 것이었다. `classify`는 해설 글만 보여 주므로 파일 이름을 해설에 적는다.
        컴파일 오류는 위젯 위의 본문에서 코드 named와 실제 오류 문장으로 보여 준다.
    asks:
      - 코드 C의 `DiscountPolicy`에 `String name()`을 더한다. 구현은 `VipDiscount`와 `GoldDiscount` 둘이고 default 메서드는 쓰지 않는다. 인터페이스와 클래스는 파일 하나씩이다. 컴파일되려면 고쳐야 하는 파일 수 (3개)
      - 코드 named를 컴파일하면 어떻게 되나. 보기는 오류 없이 컴파일된다, `VipDiscount`에서 오류, `GoldDiscount`에서 오류, `DiscountPolicy`에서 오류 (`GoldDiscount`에서 컴파일 오류)
      - 코드 C에서 `DiscountCalculator`와 있던 구현 클래스를 고치지 않고 할 수 있는 변경. 보기는 SILVER 등급 할인 더하기, `DiscountPolicy`에 메서드 더하기, `apply()`가 돌려주는 타입 바꾸기, `supports()`가 받는 값 바꾸기 (SILVER 등급 할인 더하기)
      - 설명형. 코드 C에도 있던 코드를 고쳐야 하는 변경이 있다. 예를 하나 들고 이유를 설명한다
    body:
    - p: 코드 C는 **새 등급을 더하는 변경에만** 닫혀 있어요. 다른 방향의 변경이 오면 있던 코드를 고쳐야 해요.
    - h3: 인터페이스에 메서드를 더하면
    - p: '할인 이름을 돌려주는 `String name()`을 `DiscountPolicy`에 더한다고 해 볼게요. 인터페이스에 메서드를 더하면 구현 클래스가 모두 그 메서드를 구현해야 해요. 아래는 `VipDiscount`만 고친 코드예요.'
    - code: namedMark
      notes:
      - mark: String name();
        as: code
        text: 인터페이스에 더한 메서드예요.
      - mark: GoldDiscount
        as: code
        text: '`name()`을 구현하지 않았어요. 이 클래스에서 컴파일 오류가 나요.'
    - p: 이 코드를 컴파일하면 컴파일러가 이런 오류를 내요.
    - prewrap: 'error: GoldDiscount is not abstract and does not override abstract method name() in DiscountPolicy'
    - p: '`GoldDiscount`가 `DiscountPolicy`의 `name()`을 구현하지 않았다는 뜻이에요. 인터페이스를 구현하는 클래스는 인터페이스의 메서드를 모두 구현해야 해요([자바 언어 명세 8.1.1.1](link:jls)).'
    - ci:
        key: named
        label: 테스트에서 컴파일러가 낸 오류 보기
        source: SrpOcpChangeTest.addingMethodBreaksImplementationsLeftBehind
    - p: 구현이 둘이면 인터페이스 1개와 구현 2개, 파일 3개를 고쳐요. 구현 클래스가 많을수록 고칠 곳이 많아요.
    - muted: '인터페이스의 메서드에 `default`를 붙이고 몸통까지 적어 두는 방법도 있어요. 이것을 default 메서드라고 해요. 그러면 구현 클래스를 고치지 않아도 컴파일돼요. 여기서는 default 메서드를 쓰지 않는 경우를 다뤄요.'
    - h3: 메서드의 모양을 바꾸면
    - p: '메서드의 모양을 바꾸는 변경은 고칠 곳이 더 많아요. `apply()`가 돌려주는 타입을 `long`으로 바꾸거나, `supports()`가 등급 대신 주문 금액을 받게 바꾸는 변경이 그래요. 인터페이스와 구현 클래스를 모두 고치고, 그 메서드를 부르는 `DiscountCalculator`도 고쳐야 해요.'
    - p: '아래는 코드 C에 온 변경 요구예요. 있던 계산 코드를 고쳐야 하는지 골라 보세요. "있던 계산 코드"는 `DiscountPolicy`, `DiscountCalculator`, `VipDiscount`, `GoldDiscount` 네 파일이에요. default 메서드는 쓰지 않아요.'
    - widget:
        kind: classify
        categories:
        - 있던 계산 코드는 그대로
        - 있던 계산 코드를 고친다
        items:
        - text: SILVER 등급 3% 할인 더하기
          answer: 1
          explain: SilverDiscount를 새로 만들고 Grade와 조립 코드를 고쳐요. 계산 코드 네 파일은 그대로예요.
        - text: BRONZE 등급 1% 할인 더하기
          answer: 1
          explain: SILVER 때와 같아요. BronzeDiscount를 새로 만들고 Grade와 조립 코드를 고쳐요.
        - text: DiscountPolicy에 String name() 더하기
          answer: 2
          explain: DiscountPolicy, VipDiscount, GoldDiscount 3개를 고쳐요. 구현 클래스가 모두 name()을 구현해야 해요.
        - text: apply()가 돌려주는 타입을 long으로 바꾸기
          answer: 2
          explain: DiscountPolicy, VipDiscount, GoldDiscount, DiscountCalculator 4개를 고쳐요. apply()를 부르는 DiscountCalculator도 받는 타입이 달라져요.
        - text: supports()가 등급 대신 주문 금액을 받게 바꾸기
          answer: 2
          explain: DiscountPolicy, VipDiscount, GoldDiscount, DiscountCalculator 4개를 고쳐요. supports()를 부르는 DiscountCalculator도 넘기는 값을 바꿔야 해요.
    - p: '어느 방향의 변경에 닫을지는 인터페이스를 만들 때 정해져요. 코드 C는 등급마다 다른 계산을 인터페이스로 뺐어요. 그래서 등급이 느는 변경에 닫혀 있어요. 인터페이스를 미리 빼 두지 않은 방향의 변경에는 닫혀 있지 않아요. 그래서 개방 폐쇄 원칙은 실제로 자주 바뀌는 곳에 적용해요.'
    - quiz:
        q: 코드 C의 DiscountPolicy에 String name()을 더했어요. default 메서드는 쓰지 않았고, VipDiscount와 GoldDiscount는 고치지 않았어요. 컴파일하면 오류는 어디서 날까요?
        options:
        - VipDiscount와 GoldDiscount
        - DiscountCalculator
        - 오류가 나지 않는다
        answer: 1
        explain: 인터페이스에 더한 메서드를 구현하지 않은 구현 클래스마다 오류가 나요. DiscountCalculator는 name()을 부르지 않아서 오류가 나지 않아요.
    recall: '아니요. 인터페이스로 빼 둔 방향의 변경에만 닫혀 있어요. 코드 C는 새 등급을 더하는 변경에는 닫혀 있지만, `DiscountPolicy`에 메서드를 더하면 구현 클래스를 모두 고쳐야 해요. 구현이 둘이면 인터페이스까지 파일 3개예요. 메서드의 모양을 바꾸면 그 메서드를 부르는 `DiscountCalculator`도 고쳐야 해요. 어느 방향에 닫을지는 인터페이스를 만들 때 정해지므로, 실제로 자주 바뀌는 곳에 적용해요.'
interview:
  question: 단일 책임 원칙과 개방 폐쇄 원칙을 설명해 주세요.
  model:
  - label: 정의
    text: 단일 책임 원칙은 클래스가 바뀌는 이유가 하나여야 한다는 원칙이고, 개방 폐쇄 원칙은 기능을 더할 때 있던 코드를 고치지 않고 새 코드를 더해서 할 수 있어야 한다는 원칙입니다.
  - label: 원리
    text: 바뀌는 이유는 그 변경을 요구하는 쪽으로 셉니다. 할인 계산과 영수증 문구가 한 클래스에 있으면 마케팅팀의 요구와 고객지원팀의 요구가 같은 클래스를 고치게 하므로, 바뀌는 이유마다 클래스를 나눕니다. 또 등급을 if와 else if로 나누면 등급이 늘 때마다 그 메서드를 고쳐야 하므로, 등급마다 다른 계산을 인터페이스로 빼고 새 등급은 새 구현 클래스로 더합니다.
  - label: 주의할 점
    text: 고치는 곳이 없어지는 것이 아니라 구현을 목록에 넣는 조립 코드로 옮겨 갑니다. 그리고 인터페이스로 빼 둔 방향의 변경에만 닫힙니다. 인터페이스에 메서드를 더하면 구현 클래스를 모두 고쳐야 하므로, 실제로 자주 바뀌는 곳에 적용합니다.
  - label: 경험
    text: '(내 프로젝트로 채우기) 예: 결제 수단마다 다른 처리를 if 문으로 나눈 코드를 인터페이스와 구현 클래스로 바꿔서, 새 결제 수단을 더할 때 있던 처리 코드를 고치지 않게 했습니다.'
verified: "이 레슨에 나온 금액과 호출 횟수, 어느 파일을 고치는지, 컴파일 오류는 짐작이 아니라 자바 21(OpenJDK)에서 확인한 것이에요. 코드가 바뀔 때마다 테스트([SrpOcpChangeTest](link:test))가 다시 돌고, 결과가 달라지면 레슨을 고쳐요."
footer: '근거: 두 원칙의 정의는 Robert C. Martin의 글 [The Single Responsibility Principle](link:srp)과 [The Open Closed Principle](link:ocp). 구현하지 않은 메서드가 컴파일 오류라는 것은 [자바 언어 명세 8.1.1.1](link:jls). 금액, 호출 횟수, 고치는 파일, 컴파일 오류는 자바 21(OpenJDK)에서 테스트로 확인했어요. 오류는 [GitHub 이슈](https://github.com/wanja727/dev-lessons/issues)로 알려 주세요.'
# test는 본문 단계에서 더했다. how는 설계 때 적은 그대로다 (그때는 테스트가 없어서 손으로 돌렸다)
claims:
  - claim: '코드 A. VIP 10,000원 주문으로 `pay()`를 한 번 부르면 9000이 나오고, 그동안 `mail.send()`가 1번 불린다. 보낸 글은 "결제 금액: 9000원"이다'
    how: '`send()`가 불린 횟수와 받은 글을 적어 두는 가짜 `MailSender`를 넣고 돌린다. 돌려 봤다 (9000, 1번, 결제 금액: 9000원)'
    test: CodeATest.payCalculatesWritesAndSends
  - claim: '코드 B. `ReceiptWriter.write(9000)`은 "결제 금액: 9000원"을 돌려주고, 그동안 `mail.send()`는 0번 불린다'
    how: '같은 방법. 돌려 봤다 (결제 금액: 9000원, 0번)'
    test: CodeBTest.receiptIsTestedAlone
  - claim: 코드 A와 코드 B의 `pay()`는 10,000원 주문에 같은 값을 돌려준다. VIP 9000, GOLD 9500, BASIC 10000
    how: 코드를 돌려 반환값을 본다. 나누기만 하고 동작은 바꾸지 않았다는 확인이다. 돌려 봤다 (양쪽 모두 9000, 9500, 10000)
    test: CodeATest.payByGrade, CodeBTest.payReturnsSameAsCodeA
  - claim: 코드 B에서 `Grade`에 SILVER를 더하고 `calculate()`를 고치지 않으면 SILVER 10,000원 주문은 10000이 나온다. `else if`를 더하면 9700이 나온다
    how: 코드를 돌려 반환값을 본다. 돌려 봤다 (10000, 9700)
    test: CodeBForgotTest.silverGetsNoDiscountWithoutError, CodeBSilverTest.silverGetsThreePercent
  - claim: 코드 C에서 `SilverDiscount`를 목록에 넣지 않으면 SILVER 10,000원 주문은 10000, 넣으면 9700이 나온다
    how: 코드를 돌려 반환값을 본다. 돌려 봤다 (10000, 9700)
    test: CodeCSilverTest.silverNeedsToBeInTheList
  - claim: 코드 B에 SILVER를 더하면 `Grade`와 `DiscountCalculator` 두 파일이 바뀐다
    how: >-
      요구를 반영하기 전과 후의 코드를 패키지 둘에 나란히 두고, 테스트가 두 패키지의 같은 이름 파일을 비교한다(패키지 선언 줄은 뺀다).
      테스트는 아직 없다. 폴더 둘을 `diff`로 비교해 봤다 (다른 파일은 `Grade`, `DiscountCalculator`)
    test: SrpOcpChangeTest.codeBChangesGradeAndCalculator
  - claim: 코드 C에 SILVER를 더하면 `Grade`와 조립 코드가 바뀌고 `SilverDiscount`가 새로 생긴다. `DiscountPolicy`, `DiscountCalculator`, `VipDiscount`, `GoldDiscount`는 바뀌지 않는다
    how: 같은 방법. 조립 코드는 파일 하나(`Wiring`)에 두고 비교한다. `diff`로 비교해 봤다 (다른 파일은 `Grade`, `Wiring`. 새 파일은 `SilverDiscount`)
    test: SrpOcpChangeTest.codeCChangesGradeAndWiringOnly
  - claim: 코드 named. `DiscountPolicy`에 `name()`을 더하고 `VipDiscount`만 고치면 `GoldDiscount`에서 컴파일 오류가 난다
    how: >-
      테스트 안에서 자바 컴파일러(`javax.tools.JavaCompiler`)로 소스를 컴파일해 오류가 난 클래스를 본다. `javac`로 돌려 봤다
      (GoldDiscount is not abstract and does not override abstract method name() in DiscountPolicy, 오류 1개)
    test: SrpOcpChangeTest.addingMethodBreaksImplementationsLeftBehind
  - claim: '`name()`을 인터페이스에만 더하면 오류는 `VipDiscount`와 `GoldDiscount`에서 하나씩 나고 `DiscountCalculator`에서는 나지 않는다. 고칠 파일은 인터페이스까지 3개다'
    how: 같은 방법. `javac`로 돌려 봤다 (오류 2개, `VipDiscount`와 `GoldDiscount`)
    test: SrpOcpChangeTest.addingMethodBreaksEveryImplementation
  - claim: '`name()`을 default 메서드로 더하면 구현 클래스를 고치지 않아도 컴파일된다'
    how: 같은 방법. `javac`로 돌려 봤다 (오류 없음)
    test: SrpOcpChangeTest.defaultMethodBreaksNothing
  - claim: '`apply()`가 돌려주는 타입을 long으로 바꾸거나 `supports()`가 주문 금액(int)을 받게 바꾸면 구현 클래스 둘과 `DiscountCalculator`에서 컴파일 오류가 난다'
    how: 같은 방법. 인터페이스만 바꾸고 `javac`로 돌려 봤다 (두 경우 모두 `VipDiscount`, `GoldDiscount`, `DiscountCalculator`에서 오류)
    test: SrpOcpChangeTest.changingReturnTypeBreaksCallerToo, SrpOcpChangeTest.changingParameterBreaksCallerToo
sources:
  - '단일 책임 원칙의 정의(클래스가 바뀌는 이유는 하나), 바뀌는 이유를 그 변경을 요구하는 사람으로 센다는 것, 같은 이유로 바뀌는 것을 모으고 다른 이유로 바뀌는 것을 나눈다는 것: [Robert C. Martin, "The Single Responsibility Principle" (2014)](link:srp)'
  - '개방 폐쇄 원칙의 정의(고치지 않고 동작을 넓힐 수 있어야 한다, 새 기능은 새 코드를 써서 더한다): [Robert C. Martin, "The Open Closed Principle" (2014)](link:ocp)'
  - '추상 클래스가 아닌 클래스가 추상 메서드를 구현하지 않으면 컴파일 오류라는 것: [자바 언어 명세 8.1.1.1 (Java SE 21)](link:jls)'
