      - '`DiscountPolicy`에 메서드를 더하면(예: 할인 이름을 돌려주는 `String name()`) 구현 클래스가 모두 그 메서드를 구현해야 한다. default 메서드를 쓰지 않으면, 고치지 않은 구현 클래스에서 컴파일 오류가 난다'
      - 코드 named처럼 `VipDiscount`만 고치면 `GoldDiscount`에서 컴파일 오류가 난다
      - 구현이 둘이면 인터페이스 1개와 구현 2개, 파일 3개를 고친다. 구현 클래스가 많을수록 고칠 곳이 많다
      - 메서드의 모양을 바꾸는 변경(`apply()`가 돌려주는 타입을 long으로, `supports()`가 받는 값을 주문 금액으로)은 인터페이스와 구현을 모두 고치고, 그 메서드를 부르는 `DiscountCalculator`도 고쳐야 한다
      - 어느 방향의 변경에 닫을지는 인터페이스를 만들 때 정해진다. 그래서 실제로 자주 바뀌는 곳에 적용한다
    widget:
      kind: classify
      note: >-
        코드 C에 온 변경 요구를 "있던 계산 코드는 그대로"와 "있던 계산 코드를 고친다"로 나눈다. 위젯 위에 "있던 계산 코드"가
        `DiscountPolicy`, `DiscountCalculator`, `VipDiscount`, `GoldDiscount`라고 적는다. 요구는 다섯이다. SILVER 등급 3% 할인 더하기(그대로),
        BRONZE 등급 1% 할인 더하기(그대로), `DiscountPolicy`에 `String name()` 더하기(고친다), `apply()`가 돌려주는 타입을 long으로 바꾸기(고친다),
        `supports()`가 등급 대신 주문 금액을 받게 바꾸기(고친다). 고르면 해설에 고쳐야 하는 파일의 이름과 수가 나온다.
        컴파일 오류는 위젯 위의 본문에서 코드 named와 실제 오류 문장으로 보여 준다.
    asks:
      - 코드 C의 `DiscountPolicy`에 `String name()`을 더한다. 구현은 `VipDiscount`와 `GoldDiscount` 둘이고 default 메서드는 쓰지 않는다. 인터페이스와 클래스는 파일 하나씩이다. 컴파일되려면 고쳐야 하는 파일 수 (3개)
      - 코드 C에서 `DiscountCalculator`와 있던 구현 클래스를 고치지 않고 할 수 있는 변경. 보기는 SILVER 등급 할인 더하기, `DiscountPolicy`에 메서드 더하기, `apply()`가 돌려주는 타입 바꾸기, `supports()`가 받는 값 바꾸기 (SILVER 등급 할인 더하기)
    body:
    - p: 코드 C는 **새 등급을 더하는 변경에만** 닫혀 있어요. 다른 방향의 변경이 오면 있던 코드를 고쳐야 해요.
    - h3: 인터페이스에 메서드를 더하면
    - p: '할인 이름을 돌려주는 `String name()`을 `DiscountPolicy`에 더한다고 해 볼게요. 인터페이스에 메서드를 더하면 구현 클래스가 모두 그 메서드를 구현해야 해요. 아래는 `VipDiscount`만 고치고 `GoldDiscount`는 그대로 둔 코드예요.'
    - ci:
        key: named
        label: 이 코드를 컴파일한 결과 보기
        source: SrpOcpChangeTest.addingMethodBreaksImplementationsLeftBehind
        code: named
    - p: '`GoldDiscount`가 `name()`을 구현하지 않았다는 오류예요. 인터페이스를 구현하는 클래스는 인터페이스의 메서드를 모두 구현해야 해요([자바 언어 명세 8.1.1.1](link:jls)).'
    - p: 구현이 둘이면 인터페이스 1개와 구현 2개, 파일 3개를 고쳐요. 구현 클래스가 많을수록 고칠 곳이 많아요.
    - muted: '인터페이스의 메서드에 `default`를 붙이고 몸통까지 적어 두는 방법도 있어요. 이것을 default 메서드라고 해요. 그러면 구현 클래스를 고치지 않아도 컴파일돼요. 여기서는 default 메서드를 쓰지 않는 경우를 다뤄요.'
    - h3: 메서드의 모양을 바꾸면
    - p: '메서드의 모양을 바꾸는 변경은 고칠 곳이 더 많아요. `apply()`가 돌려주는 타입을 `long`으로 바꾸거나, `supports()`가 등급 대신 주문 금액을 받게 바꾸는 변경이 그래요. 인터페이스와 구현 클래스를 모두 고치고, 그 메서드를 부르는 `DiscountCalculator`도 고쳐야 해요.'
    - p: '아래는 코드 C에 온 변경 요구예요. 있던 계산 코드를 고쳐야 하는지 골라 보세요. "있던 계산 코드"는 `DiscountPolicy`, `DiscountCalculator`, `VipDiscount`, `GoldDiscount` 네 파일이에요. default 메서드는 쓰지 않아요.'
    - widget:
        kind: classify
        categories:
        - 있던 계산 코드는 그대로
        - 있던 계산 코드를 고친다
        items:
        - {text: 'SILVER 등급 3% 할인 더하기', answer: 1, explain: SilverDiscount를 새로 만들고 Grade와 조립 코드를 고쳐요. 계산 코드 네 파일은 그대로예요.}
        - {text: 'BRONZE 등급 1% 할인 더하기', answer: 1, explain: SILVER 때와 같아요. BronzeDiscount를 새로 만들고 Grade와 조립 코드를 고쳐요.}
        - {text: DiscountPolicy에 String name() 더하기, answer: 2, explain: 'DiscountPolicy, VipDiscount, GoldDiscount 3개를 고쳐요. 구현 클래스가 모두 name()을 구현해야 해요.'}
        - {text: apply()가 돌려주는 타입을 long으로 바꾸기, answer: 2, explain: 'DiscountPolicy, VipDiscount, GoldDiscount, DiscountCalculator 4개를 고쳐요. apply()를 부르는 DiscountCalculator도 받는 타입이 달라져요.'}
        - {text: supports()가 등급 대신 주문 금액을 받게 바꾸기, answer: 2, explain: 'DiscountPolicy, VipDiscount, GoldDiscount, DiscountCalculator 4개를 고쳐요. supports()를 부르는 DiscountCalculator도 넘기는 값을 바꿔야 해요.'}
    - p: '어느 방향의 변경에 닫을지는 인터페이스를 만들 때 정해져요. 그래서 개방 폐쇄 원칙은 실제로 자주 바뀌는 곳에 적용해요.'
    - more:
        summary: sealed와 switch로 짜면 어떻게 달라지나요?
        body:
        - p: '자바 21에서는 등급별 할인을 `sealed` 인터페이스와 `switch` 패턴 매칭으로 짤 수도 있어요. 이 방식은 반대쪽을 골라요. 종류를 닫아 두는 대신, 새 종류를 더하면 그 타입을 다루는 `switch`마다 컴파일 오류로 알려 줘요. 종류는 거의 안 늘고 종류마다 하는 일(메서드)이 자주 는다면 이쪽이 맞아요. 문법은 [자바 17과 21에서 달라진 것](lesson:modern-java)에서 다뤄요.'
    - quiz:
        q: 코드 C의 DiscountPolicy에 String name()을 더했어요. default 메서드는 쓰지 않았고, VipDiscount와 GoldDiscount는 고치지 않았어요. 컴파일하면 오류는 어디서 날까요?
        options:
        - VipDiscount와 GoldDiscount
        - DiscountCalculator
        - 오류가 나지 않는다
        answer: 1
        explain: 인터페이스에 더한 메서드를 구현하지 않은 구현 클래스마다 오류가 나요. DiscountCalculator는 name()을 부르지 않아서 오류가 나지 않아요.
    recall: '아니요. 인터페이스로 빼 둔 방향의 변경에만 닫혀 있어요. 코드 C는 새 등급을 더하는 변경에는 닫혀 있지만, `DiscountPolicy`에 메서드를 더하면 구현 클래스를 모두 고쳐야 해요. 구현이 둘이면 인터페이스까지 파일 3개예요. 메서드의 모양을 바꾸면 그 메서드를 부르는 `DiscountCalculator`도 고쳐야 해요. 어느 방향에 닫을지는 인터페이스를 만들 때 정해지므로, 실제로 자주 바뀌는 곳에 적용해요.'
practice:
  title: 스프링이 조립 코드를 대신해요
  says:
    - '코드 C의 조립 코드를 스프링이 대신한다. 할인 정책을 `@Component` 빈으로 만들고 `DiscountCalculator`가 생성자로 `List<DiscountPolicy>`를 받으면, 스프링이 그 타입의 빈을 모두 모아 넣는다. SILVER를 더할 때 `@Component`를 붙인 `SilverDiscount`만 만들면 되고, 계산 코드도 조립 코드도 고치지 않는다. 작은 스프링 컨텍스트로 확인한다'
    - '흔한 실수: `SilverDiscount` 클래스를 만들고 `@Component`를 빠뜨린다. 컴포넌트 스캔이 그 클래스를 빈으로 만들지 않아 목록에서 빠지고, SILVER 주문은 오류 없이 10000이 나온다. 고친 코드: `@Component`를 붙이고, 등급마다 정책이 있는지 확인하는 테스트를 둔다'
    - '구현이 여럿일 때 하나만 골라 주입하는 규칙(@Primary, @Qualifier)과 컴포넌트 스캔의 범위는 스프링 빈과 의존성 주입(S2)에서 다룬다'
  body:
    - p: '질문 4의 조립 코드는 스프링을 쓰면 스프링이 대신해요. 할인 정책을 `@Component` 빈으로 만들고, `DiscountCalculator`가 생성자로 `List<DiscountPolicy>`를 받으면 스프링이 그 타입의 빈을 모두 모아 넣어 줘요.'
    - ci:
        key: spring-list
        label: 작은 스프링 컨텍스트로 돌린 결과 보기
        source: SrpOcpSpringTest.springCollectsPolicies
        code: springList
    - p: 'SILVER를 더할 때 만든 것은 `@Component`를 붙인 `SilverDiscount` 하나예요. `DiscountCalculator`도, 목록을 만드는 조립 코드도 고치지 않았어요. 질문 4에서 조립 코드로 옮겨 갔던 "고칠 곳"이 어노테이션 하나로 줄었어요.'
    - h3: '흔한 실수: @Component를 빠뜨린다'
    - ci:
        key: spring-forgot
        label: 컴포넌트 스캔으로 돌린 결과 보기
        source: ForgotComponentTest.forgotComponent
        code: springForgot
    - p: '스캔이 `SilverDiscount`를 빈으로 만들지 않아서 목록에서 빠졌고, SILVER 주문은 오류 없이 10000이 나와요. 고친 코드는 `@Component`를 붙이는 것이고, 빠뜨림을 잡으려면 `Grade`의 모든 값에 맞는 정책이 목록에 있는지 확인하는 테스트를 하나 둬요.'
    - muted: '구현이 여럿일 때 하나만 골라 주입하는 규칙과 컴포넌트 스캔의 범위는 스프링 빈과 의존성 주입 레슨에서 다뤄요. 구현을 이름으로 골라 쓰는 방법은 [전략 패턴](lesson:strategy-pattern)에 있어요.'
interview:
  question: 단일 책임 원칙과 개방 폐쇄 원칙을 설명해 주세요.
  model:
  - {label: 정의, text: '단일 책임 원칙은 클래스가 바뀌는 이유가 하나여야 한다는 원칙이고, 개방 폐쇄 원칙은 기능을 더할 때 있던 코드를 고치지 않고 새 코드를 더해서 할 수 있어야 한다는 원칙입니다.'}
  - {label: 원리, text: '바뀌는 이유는 그 변경을 요구하는 쪽으로 셉니다. 할인 계산과 영수증 문구가 한 클래스에 있으면 마케팅팀의 요구와 고객지원팀의 요구가 같은 클래스를 고치게 하므로, 바뀌는 이유마다 클래스를 나눕니다. 또 등급을 if와 else if로 나누면 등급이 늘 때마다 그 메서드를 고쳐야 하므로, 등급마다 다른 계산을 인터페이스로 빼고 새 등급은 새 구현 클래스로 더합니다.'}
  - {label: 주의할 점, text: '고치는 곳이 없어지는 것이 아니라 구현을 목록에 넣는 조립 코드로 옮겨 갑니다. 그리고 인터페이스로 빼 둔 방향의 변경에만 닫힙니다. 인터페이스에 메서드를 더하면 구현 클래스를 모두 고쳐야 하므로, 실제로 자주 바뀌는 곳에 적용합니다.'}
  - {label: 경험, text: '(내 프로젝트로 채우기) 예: 결제 수단마다 다른 처리를 if 문으로 나눈 코드를 인터페이스와 구현 클래스로 바꿔서, 새 결제 수단을 더할 때 있던 처리 코드를 고치지 않게 했습니다.'}
verified: "이 레슨에 나온 금액과 호출 횟수, 어느 파일을 고치는지, 컴파일 오류는 짐작이 아니라 자바 21(OpenJDK)에서 확인한 것이에요. 스프링 부분은 작은 스프링 컨텍스트를 띄워 확인했어요. 코드가 바뀔 때마다 테스트([SrpOcpChangeTest](link:test)와 같은 패키지의 테스트들)가 다시 돌고, 결과가 달라지면 레슨을 고쳐요."
footer: '근거: 두 원칙의 정의는 Robert C. Martin의 글 [The Single Responsibility Principle](link:srp)과 [The Open Closed Principle](link:ocp). 구현하지 않은 메서드가 컴파일 오류라는 것은 [자바 언어 명세 8.1.1.1](link:jls). 금액, 호출 횟수, 고치는 파일, 컴파일 오류는 자바 21(OpenJDK)에서 테스트로 확인했어요. 오류는 [GitHub 이슈](https://github.com/wanja727/dev-lessons/issues)로 알려 주세요.'
# test는 본문 단계에서 더했다. how는 설계 때 적은 그대로다 (그때는 테스트가 없어서 손으로 돌렸다)
claims:
  - {claim: '코드 A. VIP 10,000원 주문으로 `pay()`를 한 번 부르면 9000이 나오고, 그동안 `mail.send()`가 1번 불린다. 보낸 글은 "결제 금액: 9000원"이다', how: '`send()`가 불린 횟수와 받은 글을 적어 두는 가짜 `MailSender`를 넣고 돌린다', test: CodeATest.payCalculatesWritesAndSends}
  - {claim: '코드 B. `ReceiptWriter.write(9000)`은 "결제 금액: 9000원"을 돌려주고, 그동안 `mail.send()`는 0번 불린다', how: '같은 방법', test: CodeBTest.receiptIsTestedAlone}
  - {claim: '코드 A와 코드 B의 `pay()`는 10,000원 주문에 같은 값을 돌려준다. VIP 9000, GOLD 9500, BASIC 10000', how: '코드를 돌려 반환값을 본다. 나누기만 하고 동작은 바꾸지 않았다는 확인이다', test: 'CodeATest.payByGrade, CodeBTest.payReturnsSameAsCodeA'}
  - {claim: '코드 B에서 `Grade`에 SILVER를 더하고 `calculate()`를 고치지 않으면 SILVER 10,000원 주문은 10000이 나온다. `else if`를 더하면 9700이 나온다', how: '코드를 돌려 반환값을 본다', test: 'CodeBForgotTest.silverGetsNoDiscountWithoutError, CodeBSilverTest.silverGetsThreePercent'}
  - {claim: '코드 C에서 `SilverDiscount`를 목록에 넣지 않으면 SILVER 10,000원 주문은 10000, 넣으면 9700이 나온다', how: '코드를 돌려 반환값을 본다', test: CodeCSilverTest.silverNeedsToBeInTheList}
  - claim: 코드 B에 SILVER를 더하면 `Grade`와 `DiscountCalculator` 두 파일이 바뀐다
    how: >-
      요구를 반영하기 전과 후의 코드를 패키지 둘에 나란히 두고, 테스트가 두 패키지의 같은 이름 파일을 비교한다(패키지 선언 줄은 뺀다)
    test: SrpOcpChangeTest.codeBChangesGradeAndCalculator
  - {claim: '코드 C에 SILVER를 더하면 `Grade`와 조립 코드가 바뀌고 `SilverDiscount`가 새로 생긴다. `DiscountPolicy`, `DiscountCalculator`, `VipDiscount`, `GoldDiscount`는 바뀌지 않는다', how: '같은 방법. 조립 코드는 파일 하나(`Wiring`)에 두고 비교한다', test: SrpOcpChangeTest.codeCChangesGradeAndWiringOnly}
  - claim: 코드 named. `DiscountPolicy`에 `name()`을 더하고 `VipDiscount`만 고치면 `GoldDiscount`에서 컴파일 오류가 난다
    how: >-
      테스트 안에서 자바 컴파일러(`javax.tools.JavaCompiler`)로 소스를 컴파일해 오류가 난 클래스를 본다 in DiscountPolicy, 오류 1개)
    test: SrpOcpChangeTest.addingMethodBreaksImplementationsLeftBehind
  - {claim: '`name()`을 인터페이스에만 더하면 오류는 `VipDiscount`와 `GoldDiscount`에서 하나씩 나고 `DiscountCalculator`에서는 나지 않는다. 고칠 파일은 인터페이스까지 3개다', how: '같은 방법', test: SrpOcpChangeTest.addingMethodBreaksEveryImplementation}
  - {claim: '`name()`을 default 메서드로 더하면 구현 클래스를 고치지 않아도 컴파일된다', how: '같은 방법', test: SrpOcpChangeTest.defaultMethodBreaksNothing}
  - {claim: '스프링에서 `@Component` 정책 빈을 `List<DiscountPolicy>`로 받으면 `SilverDiscount`를 더해도 계산 코드와 조립 코드를 고치지 않고 SILVER 10,000원은 9700이다. `@Component`를 빠뜨리면 스캔에서 빠져 오류 없이 10000이다', how: '`AnnotationConfigApplicationContext`로 빈을 등록하거나 패키지를 스캔해 돌린다', test: 'SrpOcpSpringTest.springCollectsPolicies, ForgotComponentTest.forgotComponent'}
  - {claim: '`apply()`가 돌려주는 타입을 long으로 바꾸거나 `supports()`가 주문 금액(int)을 받게 바꾸면 구현 클래스 둘과 `DiscountCalculator`에서 컴파일 오류가 난다', how: '같은 방법. 인터페이스만 바꾼다', test: 'SrpOcpChangeTest.changingReturnTypeBreaksCallerToo, SrpOcpChangeTest.changingParameterBreaksCallerToo'}
sources:
  - '단일 책임 원칙의 정의(클래스가 바뀌는 이유는 하나), 바뀌는 이유를 그 변경을 요구하는 사람으로 센다는 것, 같은 이유로 바뀌는 것을 모으고 다른 이유로 바뀌는 것을 나눈다는 것: [Robert C. Martin, "The Single Responsibility Principle" (2014)](link:srp)'
  - '개방 폐쇄 원칙의 정의(고치지 않고 동작을 넓힐 수 있어야 한다, 새 기능은 새 코드를 써서 더한다): [Robert C. Martin, "The Open Closed Principle" (2014)](link:ocp)'
  - '추상 클래스가 아닌 클래스가 추상 메서드를 구현하지 않으면 컴파일 오류라는 것: [자바 언어 명세 8.1.1.1 (Java SE 21)](link:jls)'
