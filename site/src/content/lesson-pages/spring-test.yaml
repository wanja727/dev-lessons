# 스프링 테스트
# 자료 파일의 칸은 docs/lesson-data-format.md에 있다. 문제는 content/questions/spring-test.yaml에 있다.
title: 스프링 테스트
description: '@SpringBootTest가 띄우는 것, @WebMvcTest와 @DataJpaTest 같은 슬라이스 테스트, 테스트에 붙인 @Transactional이 운영과 다르게 만드는 것, 테스트가 많아지면 느려지는 이유. 네 가지 질문에 스스로 답할 수 있게 회원 API로 배우는 대화형 레슨.'
unit: 테스트와 운영
minutes: 20
roadmap: T3
type: 동작 확인
prerequisites:
  - {slug: transactional-proxy, title: '@Transactional 동작 원리'}
  - {slug: unit-test-double, title: 단위 테스트와 테스트 더블}
assume: '스프링 부트 3.5, JUnit 5, Mockito, PostgreSQL 16. 스프링 컨테이너가 빈을 만들고 주입한다는 것(스프링 빈과 의존성 주입 레슨), `@Transactional`이 프록시로 트랜잭션을 열고 닫는다는 것(@Transactional 동작 원리 레슨), 목과 스텁(단위 테스트와 테스트 더블 레슨). 지연 로딩은 질문 3에서 한 문장으로 설명해요.'
example: '회원 API: `MemberController`가 `MemberService`를 부르고, 서비스가 `MemberRepository`(JPA)로 회원과 팀을 저장해요. 같은 기능을 `@SpringBootTest`, `@WebMvcTest`, `@DataJpaTest`로 각각 테스트해요.'
intro:
  - '테스트 클래스에 `@SpringBootTest`를 붙였더니 테스트 하나가 8초 걸려요. 테스트가 200개가 되자 빌드가 10분을 넘어요. 다른 날에는 테스트는 다 통과했는데 운영에서 `LazyInitializationException`이 나요. 테스트가 운영과 다르게 돌고 있었던 거예요.'
  - '스프링 개발자는 컨트롤러, 서비스, 리포지토리를 스프링이 띄운 채로 테스트해요. 무엇을 확인하느냐에 따라 전체를 띄울지(`@SpringBootTest`), 웹 계층만 띄울지(`@WebMvcTest`), JPA만 띄울지(`@DataJpaTest`) 골라야 해요. 테스트에 붙인 `@Transactional` 하나가 운영과 다른 결과를 만들기도 해요.'
  - '이 레슨에서는 같은 회원 기능을 세 가지 방법으로 테스트해 빈이 몇 개 뜨는지 세고, 테스트의 트랜잭션 때문에 운영에서는 실패하는 코드가 통과하는 것을 직접 돌려서 확인해요.'
covers:
  - topic: '`@SpringBootTest`는 `@SpringBootApplication`을 찾아 애플리케이션 컨텍스트 전체(모든 빈과 자동 설정)를 띄운다. 기본은 웹 서버 없이 목 서블릿 환경이다'
    where: '질문 1'
  - topic: '`webEnvironment = RANDOM_PORT`면 진짜 내장 서버를 띄우고 `TestRestTemplate`이나 `RestClient`로 요청한다'
    where: '질문 1의 더 알아보기'
  - topic: '테스트 컨텍스트 캐시: 설정이 같은 테스트 클래스끼리 컨텍스트를 한 번만 만들어 다시 쓴다'
    where: '질문 4'
  - topic: '`@MockitoBean`, `@TestPropertySource`, 다른 프로파일처럼 설정이 다르면 컨텍스트를 새로 만든다. 그래서 테스트마다 다른 `@MockitoBean`을 두면 느려진다'
    where: '질문 4'
  - topic: '`@DirtiesContext`는 캐시된 컨텍스트를 버린다'
    where: '질문 4'
  - topic: '`@WebMvcTest`는 컨트롤러, `@ControllerAdvice`, 필터, 변환기 같은 웹 계층 빈만 띄운다. 서비스는 없어서 `@MockitoBean`으로 넣는다. `MockMvc`로 요청을 흉내 낸다'
    where: '질문 2'
  - topic: '`@DataJpaTest`는 엔티티, 리포지토리, `EntityManager`만 띄운다. 기본으로 내장 DB로 바꾸고, 테스트마다 트랜잭션을 열고 끝나면 롤백한다'
    where: '질문 2'
  - topic: '그 밖의 슬라이스(`@JsonTest`, `@RestClientTest`, `@JdbcTest`)'
    where: '질문 2의 더 알아보기'
  - topic: '테스트 메서드에 `@Transactional`을 붙이면 테스트가 끝날 때 롤백한다. 데이터를 지울 필요가 없다'
    where: '질문 3'
  - topic: '테스트의 트랜잭션이 서비스의 트랜잭션에 합류하므로, 운영에서는 트랜잭션이 끝나 실패할 지연 로딩이 테스트에서는 성공한다'
    where: '질문 3'
  - topic: '롤백되면 flush하지 않으므로 커밋 때 나는 제약 위반과 SQL 오류를 테스트가 못 본다. `flush()`를 불러 확인한다'
    where: '질문 3'
  - topic: '`REQUIRES_NEW`와 다른 스레드에서 한 일은 테스트의 트랜잭션 밖이라 롤백되지 않는다'
    where: '질문 3의 더 알아보기. 전파는 트랜잭션 전파와 롤백 규칙(S11)'
  - topic: '`@MockitoBean`은 스프링 부트 3.4부터 쓰는 이름이고, 그 전의 `@MockBean`은 지원 중단됐다'
    where: '실무에서는'
  - topic: '단위 테스트, 슬라이스 테스트, 전체 테스트를 섞는 비율'
    where: '실무에서는'
  - topic: '진짜 DB를 테스트에 붙이기, `@AutoConfigureTestDatabase(replace = NONE)`'
    where: '다루지 않음: 통합 테스트와 Testcontainers(T4)'
  - topic: '스프링 시큐리티가 걸린 컨트롤러 테스트(`@WithMockUser`)'
    where: '다루지 않음: 인증과 인가(S12)'
links:
  test: https://github.com/wanja727/dev-lessons/tree/main/verification/src/test/java/lab/devlessons/springtest
  bootTesting: https://docs.spring.io/spring-boot/reference/testing/spring-boot-applications.html
  ctxCache: https://docs.spring.io/spring-framework/reference/testing/testcontext-framework/ctx-management/caching.html
  testTx: https://docs.spring.io/spring-framework/reference/testing/testcontext-framework/tx.html
  boot34: https://github.com/spring-projects/spring-boot/wiki/Spring-Boot-3.4-Release-Notes
codes:
  predict: |-
    @SpringBootTest
    @[[Transactional]]
    class MemberServiceTest {
      @Autowired MemberService service;

      @Test
      void 팀_이름을_읽는다() {
        // 회원과 팀은 미리 저장해 둠
        Member m = service.find(savedId);
        m.getTeam().getName(); // ?
      }
    }
  service: |-
    @Transactional(readOnly = true)
    public Member find(Long id) {
      return repo.findById(id)
          .orElseThrow(() -> new NoMember(id));
    }
  member: |-
    @Entity
    class Member {
      @Id @GeneratedValue Long id;
      @Column(unique = true) String email;

      @ManyToOne(fetch = FetchType.LAZY)
      Team team;
    }
  boot: |-
    @SpringBootTest
    class MemberFullTest {
      @Autowired ApplicationContext ctx;

      @Test
      void 무엇이_떠_있나() {
        ctx.getBeanDefinitionCount();
        ctx.getBeanNamesForType(
            MemberController.class);
      }
    }
  webMvc: |-
    @[[WebMvcTest]](MemberController.class)
    class MemberControllerTest {
      @Autowired MockMvc mvc;
      @[[MockitoBean]] MemberService service;

      @Test
      void 없는_회원은_404() throws Exception {
        given(service.find(9L))
            .willThrow(new NoMember(9L));
        mvc.perform(get("/members/9"))
            .andExpect(status().isNotFound());
      }
    }
  dataJpa: |-
    @DataJpaTest
    class MemberRepositoryTest {
      @Autowired MemberRepository repo;
      @Autowired TestEntityManager em;
    }
  noFlush: |-
    @DataJpaTest
    class MemberRepositoryTest {
      @Test
      void 같은_이메일_두_번() {
        repo.save(new Member("kim@a.com"));
        repo.save(new Member("kim@a.com"));
      }
    }
  flush: |-
    repo.save(new Member("lee@a.com"));
    repo.save(new Member("lee@a.com"));
    em.[[flush()]];
  noTx: |-
    @SpringBootTest
    class MemberServiceTest {
      @AfterEach
      void tearDown() {
        jdbc.update("delete from member");
      }

      @Test
      void 팀_이름을_읽는다() { ... }
    }
  mockitoBeanMix: |-
    @SpringBootTest
    class OrderTest {
      @MockitoBean PaymentClient pay;
    }

    @SpringBootTest
    class OrderTest2 {
      @MockitoBean PaymentClient pay;
    }

    @SpringBootTest
    class CouponTest {
      @MockitoBean MailSender mail;
    }
  baseClass: |-
    @SpringBootTest
    abstract class IntegrationTest {
      @MockitoBean PaymentClient pay;
      @MockitoBean MailSender mail;
    }

    class OrderTest extends IntegrationTest {
    }
    class CouponTest extends IntegrationTest {
    }
  fetchJoin: |-
    @Query("""
        select m from Member m
        join fetch m.team
        where m.id = :id""")
    Optional<Member> findWithTeam(Long id);
predict:
  title: 테스트는 운영과 같게 돌까요?
  text: '회원과 팀은 미리 저장해 두었고, 팀은 지연 로딩이에요. `service.find`는 트랜잭션이 끝난 뒤 회원을 돌려줘요. 운영에서 컨트롤러가 이렇게 팀 이름을 읽으면 `LazyInitializationException`이 나요. 이 테스트는 어떻게 될까요? 모르는 게 정상이니 감으로 골라 보세요. 답은 질문 3에 나와요.'
  code: predict
  label: 내 예측
  options:
    - {value: pass, label: 통과한다}
    - {value: fail, label: 'LazyInitializationException으로 실패한다'}
  answer: pass
  storageKey: st-predict
  wrong: 예측은 "{label}"이었어요. 틀린 예측이 더 오래 남으니 괜찮아요.
questions:
  - id: q1
    title: '@SpringBootTest는 무엇을 띄우나요?'
    conclusion:
      lead: '애플리케이션을 실행할 때와 같은 컨텍스트 전체를 띄워요. 모든 빈, 자동 설정, 설정 파일이 다 올라와요.'
      sub: '그래서 운영에 가장 가깝게 확인할 수 있지만, 한 번 띄우는 데 몇 초가 걸리고 확인하려는 것과 상관없는 빈까지 만들어요.'
    says:
      - '`@SpringBootTest`는 테스트 클래스의 패키지에서 위로 올라가며 `@SpringBootApplication`이 붙은 클래스를 찾고, 그 설정으로 컨텍스트를 띄운다. 빈의 수를 실제 출력으로 보인다'
      - '띄운 컨텍스트의 빈을 `@Autowired`로 받아 테스트한다. 서비스부터 리포지토리, DB까지 진짜로 돈다'
      - '기본 `webEnvironment`는 `MOCK`이다. 내장 톰캣을 띄우지 않고 서블릿 환경을 흉내 낸다. 진짜 포트로 요청하려면 `RANDOM_PORT`를 쓴다'
      - '빈 하나만 확인하고 싶어도 모든 빈을 만든다. 테스트가 느려지는 첫째 이유다. 다음 질문의 슬라이스로 잇는다'
      - '더 알아보기: `RANDOM_PORT`로 띄우면 요청이 다른 스레드(톰캣의 스레드)에서 처리된다. 그래서 테스트의 `@Transactional`이 서버 쪽 처리에 걸리지 않는다'
    asks:
      - '본문의 예시: `@SpringBootTest`만 붙인 테스트에서 `MemberController`, `MemberService`, `MemberRepository` 가운데 뜨는 빈은 (모두 뜬다)'
      - '옮긴 상황: 금액 계산 클래스 `PriceCalculator`는 다른 빈을 쓰지 않는다. 이 클래스를 `@SpringBootTest`로 테스트하면 무엇을 잃나 (속도. 상관없는 빈을 다 띄운다. 단위 테스트로 충분하다)'
    body:
      - p: '단위 테스트(앞 레슨)는 스프링 없이 객체를 직접 만들었어요. 스프링 테스트는 스프링이 빈을 만들고 주입한 상태로 테스트해요. 가장 넓은 것이 `@SpringBootTest`예요.'
      - code: boot
      - p: '`@SpringBootTest`는 테스트 클래스의 패키지에서 위로 올라가며 `@SpringBootApplication`이 붙은 클래스를 찾아, 그 설정으로 **애플리케이션 컨텍스트 전체**를 띄워요. 애플리케이션을 실행할 때와 같은 자동 설정, 같은 `application.yml`, 같은 빈이에요. 회원 API를 띄워 무엇이 떠 있는지 세어 봤어요.'
      - ci:
          key: full-beans
          label: 실제 출력 보기
          source: FullContextTest.fullContextHasEverything
      - p: '컨트롤러, 서비스, 리포지토리, DB 연결까지 모두 있고, 빈은 270개가 넘어요. 우리가 만든 빈은 몇 개뿐이고 나머지는 자동 설정이 만든 것(웹, JSON, JPA, 트랜잭션, 커넥션 풀)이에요. 테스트는 이 컨텍스트의 빈을 `@Autowired`로 받아 서비스부터 DB까지 **진짜로** 돌려요. 운영에 가장 가까워요.'
      - p: '대신 빈 하나를 확인하고 싶어도 전부 만들어요. 다른 빈을 쓰지 않는 금액 계산 클래스를 `@SpringBootTest`로 테스트하면 상관없는 빈 수백 개를 띄우느라 몇 초를 써요. 그런 클래스는 단위 테스트로 충분해요.'
      - p: '기본 설정(`webEnvironment = MOCK`)에서는 내장 톰캣을 띄우지 않고 서블릿 환경을 흉내만 내요. 포트를 열지 않아요.'
      - more:
          summary: '더 알아보기: RANDOM_PORT로 진짜 서버 띄우기'
          body:
            - p: '`@SpringBootTest(webEnvironment = RANDOM_PORT)`는 내장 톰캣을 빈 포트로 띄워요. 테스트는 `TestRestTemplate`이나 `RestClient`로 진짜 HTTP 요청을 보내요. 이때 요청은 톰캣의 스레드에서 처리되니, 테스트 메서드에 붙인 `@Transactional`은 서버 쪽 처리에 걸리지 않아요. 서버가 저장한 데이터는 커밋되어 남아요([스프링 부트 문서](link:bootTesting)).'
      - quiz:
          q: '`@SpringBootTest`만 붙인 테스트 클래스에서 `MemberController`, `MemberService`, `MemberRepository` 가운데 컨텍스트에 뜨는 빈은 무엇일까요?'
          options:
            - MemberService만
            - MemberService와 MemberRepository
            - 셋 다
          answer: 3
          explain: '`@SpringBootTest`는 애플리케이션을 실행할 때와 같은 컨텍스트 전체를 띄워요.'
      - next: '컨트롤러만, 또는 리포지토리만 확인할 때도 전부 띄워야 할까요?'
    recall: '`@SpringBootTest`는 `@SpringBootApplication`을 찾아 애플리케이션을 실행할 때와 같은 컨텍스트 전체를 띄워요. 모든 빈과 자동 설정, 설정 파일이 올라와서 서비스부터 DB까지 진짜로 돌아 운영에 가장 가까워요. 대신 상관없는 빈까지 수백 개를 만드느라 느려요. 기본은 서버를 띄우지 않는 MOCK 환경이고, RANDOM_PORT면 진짜 톰캣을 띄워요.'
  - id: q2
    title: 슬라이스 테스트는 무엇만 띄우나요?
    conclusion:
      lead: '`@WebMvcTest`는 웹 계층의 빈만, `@DataJpaTest`는 JPA의 빈만 띄워요. 나머지는 없어서 필요하면 목으로 넣어요.'
      sub: '컨텍스트가 작아 빨리 뜨고, 그 계층의 일(요청을 받고 응답 만들기, 쿼리와 매핑)만 집중해서 확인해요.'
    says:
      - '코드 webMvc. `@WebMvcTest(MemberController.class)`는 그 컨트롤러와 `@ControllerAdvice`, 필터, JSON 변환기만 띄운다. `MemberService`는 뜨지 않아 `@MockitoBean`으로 목을 넣는다. `MockMvc`로 서버 없이 요청을 흉내 내고 상태 코드와 JSON을 본다'
      - '`@WebMvcTest`의 컨텍스트에 서비스와 리포지토리 빈이 없는 것을 테스트로 보인다. 빈의 수도 `@SpringBootTest`와 비교한다'
      - '이 테스트가 확인하는 것: URL과 메서드 연결, 요청 JSON을 객체로 바꾸기, 입력 검증, 예외를 상태 코드로 바꾸기. 비즈니스 로직은 목이 대신하므로 확인하지 않는다'
      - '코드 dataJpa. `@DataJpaTest`는 엔티티와 리포지토리, `EntityManager`만 띄운다. 기본으로 설정의 DB를 내장 DB로 바꾸고, 테스트마다 트랜잭션을 열어 끝나면 롤백한다. 쿼리 메서드와 매핑, 실제로 나간 SQL을 확인한다. 이 저장소는 내장 DB 대신 PostgreSQL 컨테이너를 쓴다(T4)'
      - '더 알아보기: `@JsonTest`(JSON 직렬화만), `@RestClientTest`(바깥 API를 부르는 클라이언트만), `@JdbcTest`(`JdbcTemplate`만)도 있다'
    widget:
      kind: classify
      note: '확인하려는 것(없는 회원이면 404, `findByEmail`이 만드는 SQL, 가입부터 메일 발송까지 전체 흐름, 요청 JSON의 빈 이름에 400, 금액 계산)을 보고 단위 테스트, `@WebMvcTest`, `@DataJpaTest`, `@SpringBootTest` 가운데 맞는 것을 고른다'
    asks:
      - '본문의 예시: `@WebMvcTest(MemberController.class)`에서 `MemberService`를 `@Autowired`로 받으려 하면 어떻게 되나 (빈이 없어 컨텍스트가 뜨지 않는다. `@MockitoBean`으로 넣어야 한다)'
      - '옮긴 상황: 주문 리포지토리의 `@Query`가 맞는 행을 고르는지 확인하고 싶다. 어느 테스트가 맞나 (`@DataJpaTest`)'
    body:
      - p: '**슬라이스 테스트**는 애플리케이션을 계층으로 잘라(slice) 한 계층의 빈만 띄우는 테스트예요. 가장 많이 쓰는 둘을 봐요.'
      - h3: '@WebMvcTest: 웹 계층만'
      - code: webMvc
        notes:
          - mark: WebMvcTest
            as: anno
            text: '이 컨트롤러와 웹 계층의 빈(`@ControllerAdvice`, 필터, JSON 변환기)만 띄워요.'
          - mark: MockitoBean
            as: anno
            text: '컨텍스트에 없는 서비스 자리에 Mockito 목을 빈으로 넣어요.'
      - p: '`@WebMvcTest`는 컨트롤러와 그 주변(예외를 응답으로 바꾸는 `@ControllerAdvice`, 필터, JSON 변환기)만 띄워요. 서비스와 리포지토리는 **없어요**. 컨트롤러가 서비스를 주입받아야 하니 `@MockitoBean`으로 목을 넣어요. 앞 레슨의 스텁처럼 `given`으로 "없는 회원" 상황을 만들고, `MockMvc`로 서버 없이 요청을 흉내 내요.'
      - ci:
          key: web-404
          label: 실제 결과 보기
          source: WebSliceTest.webSliceUsesMockService
          code: webMvc
      - ci:
          key: web-beans
          label: 떠 있는 빈 보기
          source: WebSliceTest.webSliceUsesMockService
      - p: '서비스는 목, 리포지토리와 DB 연결은 없고, 빈은 120개 남짓이에요. 이 테스트가 확인하는 것은 **웹 계층의 일**이에요. URL과 메서드가 맞게 이어졌는지, 요청 JSON이 객체로 바뀌는지, 입력 검증이 400을 내는지, 예외가 맞는 상태 코드가 되는지예요. 회원을 찾는 로직은 목이 대신하니 확인하지 않아요.'
      - h3: '@DataJpaTest: JPA만'
      - code: dataJpa
      - p: '`@DataJpaTest`는 엔티티, 리포지토리, `EntityManager`와 DB 연결만 띄워요. 컨트롤러와 서비스는 없어요. 쿼리 메서드가 맞는 행을 고르는지, 매핑이 맞는지, 어떤 SQL이 나가는지를 확인해요.'
      - ci:
          key: jpa-beans
          label: 떠 있는 빈 보기
          source: DataJpaSliceTest.duplicateWithoutFlushPasses
      - ul:
          - '**테스트마다 롤백해요.** `@DataJpaTest`에는 `@Transactional`이 들어 있어서 테스트마다 트랜잭션을 열고 끝나면 되돌려요. 질문 3에서 이것이 만드는 차이를 봐요.'
          - '**DB를 바꿔요.** 기본으로 설정의 DB 대신 메모리 안의 내장 DB(H2 같은)로 바꿔 띄워요. 이 레슨의 테스트는 `@AutoConfigureTestDatabase(replace = NONE)`으로 그러지 않게 하고 PostgreSQL 컨테이너를 써요. 이유는 통합 테스트와 Testcontainers 레슨에서 봐요.'
      - p: '확인하려는 것마다 맞는 테스트를 골라 보세요.'
      - widget:
          kind: classify
          categories: [단위 테스트, '@WebMvcTest', '@DataJpaTest', '@SpringBootTest']
          items:
            - text: '할인 금액 계산 클래스가 경계값에서 맞는 값을 내는지'
              answer: 1
              explain: '다른 빈을 쓰지 않으니 스프링 없이 객체를 만들어 확인해요.'
            - text: '없는 회원을 조회하면 404와 에러 메시지가 나가는지'
              answer: 2
              explain: '예외를 상태 코드로 바꾸는 웹 계층의 일이에요. 서비스는 목으로 넣어요.'
            - text: '`findByEmail` 쿼리 메서드가 맞는 회원을 고르고 어떤 SQL을 보내는지'
              answer: 3
              explain: '리포지토리와 매핑, SQL은 JPA 슬라이스로 확인해요.'
            - text: '가입 요청부터 저장, 환영 메일 발송까지 빈들이 맞게 이어졌는지'
              answer: 4
              explain: '여러 계층이 함께 도는 흐름은 컨텍스트 전체로 확인해요.'
      - more:
          summary: '더 알아보기: 그 밖의 슬라이스'
          body:
            - p: '`@JsonTest`는 JSON 직렬화 설정만, `@RestClientTest`는 바깥 API를 부르는 클라이언트와 가짜 서버만, `@JdbcTest`는 `JdbcTemplate`과 DB 연결만 띄워요([스프링 부트 문서](link:bootTesting)).'
      - quiz:
          q: '`@WebMvcTest(MemberController.class)`에서 `@MockitoBean` 없이 `MemberService`를 쓰려 하면 어떻게 될까요?'
          options:
            - 진짜 MemberService가 주입된다
            - 컨텍스트가 뜨지 않는다. 서비스 빈이 없다
            - 서비스 자리에 null이 들어간다
          answer: 2
          explain: '웹 계층의 빈만 띄워서 서비스가 없어요. 컨트롤러가 주입받을 빈이 없으니 컨텍스트가 실패해요.'
      - next: '`@DataJpaTest`는 테스트마다 롤백한다고 했어요. 테스트 하나가 통째로 트랜잭션 하나라면, 운영과 무엇이 달라질까요?'
    recall: '`@WebMvcTest`는 컨트롤러와 `@ControllerAdvice`, 필터, JSON 변환기 같은 웹 계층의 빈만 띄워서, 서비스는 `@MockitoBean`으로 목을 넣고 `MockMvc`로 요청을 흉내 내요. `@DataJpaTest`는 엔티티, 리포지토리, `EntityManager`만 띄우고 기본으로 내장 DB를 쓰며 테스트마다 롤백해요. 컨텍스트가 작아 빠르고 그 계층의 일만 확인해요.'
  - id: q3
    title: 테스트에 @Transactional을 붙이면 무엇이 달라지나요?
    conclusion:
      lead: '테스트가 끝나면 롤백돼서 데이터가 남지 않아요. 대신 테스트 전체가 트랜잭션 하나라서 운영과 다르게 동작할 수 있어요.'
      sub: '서비스의 트랜잭션이 테스트의 트랜잭션에 합류해 지연 로딩이 성공하고, 커밋하지 않으니 flush 때 나는 오류를 못 봐요.'
    says:
      - '테스트 메서드에 `@Transactional`을 붙이면 스프링의 테스트 지원이 메서드 전에 트랜잭션을 열고 끝나면 롤백한다. 저장한 회원이 테스트가 끝난 뒤 DB에 없는 것을 보인다'
      - '예측의 답을 밝힌다. 서비스의 `@Transactional`은 이미 열린 트랜잭션에 합류한다(S11의 기본 전파). `find`가 끝나도 트랜잭션은 테스트가 끝날 때까지 열려 있고, 영속성 컨텍스트도 열려 있다. 지연 로딩은 실제 값이 필요할 때 SELECT를 보내는 방식인데, 컨텍스트가 열려 있으니 성공한다. `@Transactional`을 뗀 같은 테스트는 `LazyInitializationException`으로 실패한다. 두 결과를 실제 출력으로 보인다'
      - '코드 flush. 이메일에 유니크 제약이 있다. 같은 이메일로 두 번 `save`해도 IDENTITY가 아닌 전략이면 INSERT가 커밋 때까지 미뤄진다(P2의 쓰기 지연). 롤백으로 끝나면 INSERT가 나가지 않아 테스트가 통과한다. `em.flush()`를 부르면 제약 위반이 난다. 테스트로 둘을 보인다'
      - '고치는 법: 지연 로딩과 커밋 시점이 중요한 테스트는 테스트에 `@Transactional`을 붙이지 않고 데이터를 직접 지운다. 붙인 테스트에서는 확인 전에 `flush()`와 `clear()`를 부른다'
      - '더 알아보기: 서비스가 `REQUIRES_NEW`로 연 트랜잭션이나 다른 스레드(`@Async`, `RANDOM_PORT`의 서버 스레드)에서 한 일은 테스트의 트랜잭션 밖이라 롤백되지 않고 남는다'
    widget:
      kind: toggle
      note: '같은 테스트에서 테스트의 `@Transactional`을 켜고 끄며 결과를 비교한다. 켜면 지연 로딩 성공, 중복 이메일 통과, 테스트 뒤 데이터 없음. 끄면 `LazyInitializationException`, 중복 이메일에서 제약 위반, 테스트 뒤 데이터 남음. 각 장면에 실제 출력을 둔다'
    asks:
      - '본문의 예시: 테스트의 `@Transactional`을 떼면 코드 predict는 어떻게 되나 (`LazyInitializationException`으로 실패한다. `find`가 끝날 때 트랜잭션과 영속성 컨텍스트가 닫힌다)'
      - '옮긴 상황: `@Transactional`을 붙인 `@DataJpaTest`에서 `name` 열이 `nullable = false`인 상품을 이름 없이 `persist`만 하고 검증 없이 끝났다. 시퀀스 전략이다. 테스트는 통과하나 (통과한다. flush 전에 롤백되어 INSERT가 나가지 않는다)'
    body:
      - p: '테스트 메서드나 클래스에 `@Transactional`을 붙이면, 스프링의 테스트 지원이 테스트 메서드 전에 트랜잭션을 열고 **끝나면 롤백**해요. 테스트가 넣은 데이터가 남지 않으니 다음 테스트가 깨끗한 DB에서 시작해요. `@DataJpaTest`는 이것이 기본으로 들어 있어요. 테스트 1, 2가 저장한 회원을 테스트 3에서 세어 봤어요.'
      - ci:
          key: rollback
          label: 실제 출력 보기
          source: DataJpaSliceTest.previousTestRolledBack
      - p: '편리하지만, 테스트 하나가 통째로 **트랜잭션 하나**가 된다는 점이 운영과 달라요. 두 가지를 봐요.'
      - h3: 운영에서는 실패할 지연 로딩이 통과해요
      - code: member
      - p: '회원의 팀은 **지연 로딩**이에요. 회원을 읽을 때 팀은 빈 껍데기(프록시)로 두고, 팀의 값이 처음 필요할 때 SELECT를 보내요. 그 SELECT는 영속성 컨텍스트가 열려 있을 때만 보낼 수 있어요. `find`는 읽기 전용 트랜잭션으로 회원을 읽고 끝나요.'
      - code: service
      - p: '예측의 답이에요. {{predict-result}} 테스트에 `@Transactional`이 있을 때와 없을 때를 돌려 봤어요.'
      - widget:
          kind: toggle
          layout: [selector, duo, verdict]
          selector:
            label: 테스트 클래스에
            options:
              - {value: tx, label: '@Transactional 있음'}
              - {value: notx, label: '@Transactional 없음'}
          scenes:
            tx:
              duo:
                - label: 트랜잭션
                  rows: [{k: 테스트, v: 열림 (끝날 때 롤백)}, {k: service.find, v: 테스트의 트랜잭션에 합류, mark: changed}, {k: find가 끝난 뒤, v: 아직 열림}]
                - label: 결과
                  rows: [{k: getTeam().getName(), v: 'A팀 (SELECT가 나감)'}, {k: 테스트, v: 통과}]
              verdict: '테스트가 연 트랜잭션이 끝까지 열려 있어서 지연 로딩이 성공해요.'
            notx:
              duo:
                - label: 트랜잭션
                  rows: [{k: 테스트, v: 없음}, {k: service.find, v: 새 트랜잭션을 열고 닫음}, {k: find가 끝난 뒤, v: 닫힘, mark: bad}]
                - label: 결과
                  rows: [{k: getTeam().getName(), v: LazyInitializationException, mark: bad}, {k: 테스트, v: 실패}]
              verdict: '운영의 컨트롤러와 같아요. find가 끝나면 세션이 닫혀 팀을 읽지 못해요.'
      - ci:
          key: lazy-tx
          label: '@Transactional 있을 때의 실제 출력'
          source: LazyLoadingTest.lazyLoadingSucceeds
          code: predict
      - ci:
          key: lazy-no-tx
          label: '@Transactional 없을 때의 실제 출력'
          source: LazyLoadingTest.lazyLoadingFails
      - p: '서비스의 `@Transactional`은 이미 열린 트랜잭션이 있으면 **새로 열지 않고 합류**해요(트랜잭션 전파와 롤백 규칙 레슨의 기본 전파). 테스트가 트랜잭션을 먼저 열었으니 `find`는 거기에 합류하고, `find`가 끝나도 트랜잭션과 영속성 컨텍스트는 테스트가 끝날 때까지 열려 있어요. 그래서 지연 로딩이 성공해요. 운영의 컨트롤러는 트랜잭션 밖에서 부르니 `find`가 끝나면 닫혀 있어요. **테스트는 통과했는데 운영에서 실패**하는 이유예요.'
      - h3: 커밋 때 나는 오류를 못 봐요
      - p: '이메일에 유니크 제약이 있어요. 같은 이메일로 두 번 저장하는 테스트를 `@DataJpaTest`로 돌렸어요.'
      - code: noFlush
      - ci:
          key: no-flush
          label: 실제 결과 보기
          source: DataJpaSliceTest.duplicateWithoutFlushPasses
      - p: '**통과했어요.** id를 시퀀스로 만드는 엔티티는 `save`할 때 INSERT를 바로 보내지 않고, 모아 두었다가 flush(보통 커밋 직전)에 보내요(영속성 컨텍스트 레슨의 쓰기 지연). 그런데 테스트는 커밋하지 않고 롤백으로 끝나니 INSERT가 한 번도 나가지 않았고, DB는 제약 위반을 볼 일이 없었어요. `flush()`를 부르면 달라요.'
      - code: flush
        notes:
          - mark: flush()
            as: code
            text: '모아 둔 INSERT를 지금 DB로 보내요.'
      - ci:
          key: flush
          label: 실제 결과 보기
          source: DataJpaSliceTest.duplicateWithFlushFails
      - h3: 고치는 법
      - ul:
          - '**지연 로딩, 커밋 시점이 중요한 테스트**는 테스트에 `@Transactional`을 붙이지 않아요. 대신 테스트가 끝나면 데이터를 직접 지워요(실무 구역).'
          - '**`@Transactional`을 붙인 테스트**에서는 확인하기 전에 `em.flush()`로 SQL을 보내고 `em.clear()`로 영속성 컨텍스트를 비워요. 그래야 DB가 거절할 것을 거절하고, 다시 읽을 때 DB에서 새로 읽어요.'
      - more:
          summary: '더 알아보기: 롤백되지 않는 것'
          body:
            - p: '테스트의 트랜잭션 밖에서 한 일은 롤백되지 않아요. 서비스가 `REQUIRES_NEW`로 새로 연 트랜잭션, `@Async`나 `RANDOM_PORT`의 서버 스레드처럼 다른 스레드에서 한 일이 그래요. 트랜잭션은 스레드에 묶여 있어서 다른 스레드는 테스트의 트랜잭션을 모르기 때문이에요([스프링 문서](link:testTx)). 이런 데이터는 직접 지워야 해요.'
      - quiz:
          q: '`@Transactional`이 붙은 테스트에서 회원을 미리 저장해 두고 `service.find(id)`로 읽은 뒤 지연 로딩인 팀의 이름을 읽었어요. 어떻게 될까요?'
          options:
            - 'LazyInitializationException이 난다'
            - 성공한다. 테스트의 트랜잭션에 합류해 아직 열려 있다
            - 팀은 null이다
          answer: 2
          explain: '서비스가 테스트의 트랜잭션에 합류해서, `find`가 끝나도 영속성 컨텍스트가 테스트 끝까지 열려 있어요.'
      - next: '테스트마다 컨텍스트를 띄운다면 테스트가 200개일 때 200번 띄울까요?'
    recall: '테스트에 `@Transactional`을 붙이면 테스트가 끝날 때 롤백돼서 데이터가 남지 않아요. 대신 테스트 전체가 트랜잭션 하나라서, 서비스의 트랜잭션이 거기에 합류해 영속성 컨텍스트가 끝까지 열려 있어요. 그래서 운영에서는 실패할 지연 로딩이 성공하고, 커밋하지 않으니 flush 때 나는 제약 위반을 못 봐요. 그런 테스트는 트랜잭션을 떼고 데이터를 지우거나, flush와 clear를 불러 확인해요.'
  - id: q4
    title: 스프링 테스트가 많아지면 왜 느려지나요?
    conclusion:
      lead: '스프링은 설정이 같은 테스트끼리 컨텍스트를 한 번만 만들어 다시 쓰는데, 설정이 조금이라도 다르면 컨텍스트를 새로 띄우기 때문이에요.'
      sub: '테스트마다 다른 `@MockitoBean`이나 프로퍼티를 두면 그만큼 컨텍스트가 늘어요. 공통 설정을 모아 같은 컨텍스트를 쓰게 해요.'
    says:
      - '테스트 컨텍스트 캐시: 한 JVM 안에서 설정(설정 클래스, 프로파일, 프로퍼티, 목 빈 목록)이 같은 테스트 클래스는 이미 만든 컨텍스트를 다시 쓴다. 두 번째 클래스는 띄우는 시간이 0에 가깝다'
      - '코드 mockitoBeanMix. 두 클래스의 `@MockitoBean`이 달라 설정이 다르다. 컨텍스트가 두 번 뜬다. 같은 테스트 클래스 셋을 돌려 컨텍스트가 만들어진 횟수를 센다: 같은 설정 둘과 다른 `@MockitoBean` 하나면 두 번이다. 실제 출력을 보인다'
      - '`@DirtiesContext`는 그 테스트가 끝난 뒤 캐시된 컨텍스트를 버린다. 다음 테스트가 새로 띄운다. 꼭 필요한 곳(컨텍스트의 상태를 바꾸는 테스트)에만 쓴다'
      - '줄이는 법: 자주 쓰는 목 빈을 한 부모 클래스나 설정에 모은다. 슬라이스와 단위 테스트로 내릴 수 있는 것은 내린다'
    asks:
      - '본문의 예시: 설정이 같은 `@SpringBootTest` 클래스 5개를 한 번에 돌리면 컨텍스트는 몇 번 뜨나 (한 번. 나머지는 캐시를 쓴다)'
      - '옮긴 상황: 테스트 클래스 10개가 모두 `@SpringBootTest`인데, 각자 다른 빈 하나씩을 `@MockitoBean`으로 바꿨다. 컨텍스트는 몇 번 뜨나 (10번. 설정이 모두 달라 캐시를 쓰지 못한다)'
    body:
      - p: '컨텍스트를 테스트 클래스마다 새로 띄운다면 `@SpringBootTest` 200개는 몇 분이 걸려요. 그래서 스프링은 **테스트 컨텍스트 캐시**를 둬요. 한 번 띄운 컨텍스트를 설정을 열쇠로 기억해 두고, 같은 설정의 테스트 클래스가 오면 그것을 다시 써요. 열쇠에는 설정 클래스, 활성 프로파일, 테스트 프로퍼티, `@MockitoBean` 목록이 들어가요([스프링 문서](link:ctxCache)).'
      - p: '테스트 클래스 셋을 돌려 컨텍스트가 몇 번 만들어지는지 셌어요. 둘은 같은 빈을, 하나는 다른 빈을 `@MockitoBean`으로 바꿨어요.'
      - ci:
          key: cache
          label: 실제 출력 보기
          source: ContextCacheTest.contextIsCachedBySameConfiguration
          code: mockitoBeanMix
      - p: '`OrderTest2`는 `OrderTest`와 설정이 같아서 이미 만든 컨텍스트를 다시 썼어요. `CouponTest`는 목으로 바꾼 빈이 달라 **설정이 다르니** 컨텍스트를 새로 만들었어요. 목 빈은 컨텍스트 안의 빈을 바꾸는 것이라, 다른 목을 쓰는 테스트와 같은 컨텍스트를 나눌 수 없어요.'
      - p: '테스트 클래스 10개가 각자 다른 빈 하나씩을 `@MockitoBean`으로 바꾸면 컨텍스트도 10번 떠요. 테스트가 많아질수록 느려지는 가장 흔한 이유예요.'
      - ul:
          - '**`@DirtiesContext`**는 그 테스트가 끝난 뒤 캐시된 컨텍스트를 버려요. 다음 테스트는 새로 띄워요. 컨텍스트의 상태를 바꾸는 테스트에만 써요.'
          - '**줄이는 법:** 자주 쓰는 목 빈을 공통 부모 클래스에 모아 같은 설정을 쓰게 하고(실무 구역), 단위 테스트나 슬라이스로 내릴 수 있는 테스트는 내려요.'
      - quiz:
          q: '설정이 같은 `@SpringBootTest` 클래스 5개를 한 번에 돌렸어요. 컨텍스트는 몇 번 만들어질까요?'
          options:
            - 5번
            - 한 번
            - 0번
          answer: 2
          explain: '설정이 같으면 처음 만든 컨텍스트를 캐시에서 꺼내 다시 써요.'
    recall: '스프링은 설정 클래스, 프로파일, 프로퍼티, `@MockitoBean` 목록을 열쇠로 컨텍스트를 캐시해서, 설정이 같은 테스트 클래스끼리는 한 번 띄운 컨텍스트를 다시 써요. 설정이 조금이라도 다르면 새로 띄우니, 테스트마다 다른 목 빈을 두면 컨텍스트가 그만큼 늘어 느려져요. `@DirtiesContext`도 캐시를 버려요. 목 빈을 공통 부모에 모으고, 단위 테스트와 슬라이스로 내려서 줄여요.'
practice:
  title: 실무에서는 이렇게 써요
  says:
    - '테스트 비율: 대부분은 단위 테스트(T2), 계층마다의 슬라이스 테스트, 가입부터 응답까지 이어 보는 `@SpringBootTest` 몇 개. 느린 테스트를 적게 둬야 고칠 때마다 다 돌릴 수 있다'
    - '`@MockitoBean`은 스프링 프레임워크 6.2(부트 3.4)부터의 이름이다. 그 전의 `@MockBean`은 부트 3.4에서 지원 중단됐다. 새 코드는 `@MockitoBean`을 쓴다 (스프링 부트 문서 근거)'
    - '흔한 실수 하나: 코드 predict처럼 테스트에 `@Transactional`을 붙이고 지연 로딩을 확인해 통과시킨다. 운영의 컨트롤러는 트랜잭션 밖에서 연관을 읽다가 실패한다. 고친 코드: 그 테스트에서 `@Transactional`을 떼고 `@AfterEach`에서 데이터를 지우거나, 서비스가 필요한 연관을 fetch join으로 읽게 고친다. 질문 3의 테스트가 근거다'
    - '흔한 실수 둘: 테스트마다 다른 빈을 `@MockitoBean`으로 바꿔 컨텍스트가 수십 번 뜬다. 고친 코드: 목 빈을 공통 부모 클래스에 모은다. 질문 4의 테스트가 근거다'
  body:
    - p: '프로젝트의 테스트는 보통 이렇게 섞어요. 대부분은 스프링 없는 **단위 테스트**로, 계층의 일은 **슬라이스 테스트**로, 가입부터 응답까지 이어지는 흐름은 **`@SpringBootTest` 몇 개**로 확인해요. 느린 테스트가 적어야 고칠 때마다 전부 돌릴 수 있어요.'
    - p: '목 빈은 `@MockitoBean`으로 써요. 스프링 프레임워크 6.2(스프링 부트 3.4)에 들어온 이름이고, 그 전에 쓰던 스프링 부트의 `@MockBean`은 3.4에서 지원 중단됐어요. 오래된 코드에서 `@MockBean`을 보면 같은 일을 하는 옛 이름이에요([스프링 부트 3.4 릴리스 노트](link:boot34)). 이 구역의 이름 이야기는 테스트가 아니라 문서가 근거예요.'
    - h3: '흔한 실수: 테스트의 @Transactional로 지연 로딩을 통과시킨다'
    - p: '질문 3의 테스트처럼 `@Transactional`을 붙인 테스트에서 연관을 읽어 통과시키면, 운영의 컨트롤러가 같은 코드로 실패해요. 고치는 길은 둘이에요. 테스트에서 `@Transactional`을 떼고 데이터를 직접 지워 운영처럼 돌게 하거나,'
    - code: noTx
    - p: '서비스가 필요한 연관을 트랜잭션 안에서 함께 읽게 고쳐요. fetch join은 회원과 팀을 SELECT 한 번으로 함께 읽어요(JPA N+1 문제 레슨).'
    - code: fetchJoin
    - h3: '흔한 실수: 테스트마다 다른 목 빈'
    - p: '질문 4에서 본 대로 `@MockitoBean`이 다르면 컨텍스트가 새로 떠요. 자주 바꾸는 바깥 경계(결제, 메일)를 공통 부모 클래스에 모아 두면 테스트 클래스들이 같은 설정을 써서 컨텍스트 하나를 나눠 써요.'
    - code: baseClass
      notes:
        - mark: abstract class IntegrationTest
          as: code
          text: '목 빈 목록이 모두 같아서 상속한 테스트들이 컨텍스트 하나를 함께 써요.'
interview:
  question: '@SpringBootTest와 슬라이스 테스트의 차이, 테스트에 @Transactional을 붙일 때 주의할 점을 설명해 주세요'
  model:
    - label: 정의
      text: '@SpringBootTest는 애플리케이션 컨텍스트 전체를 띄워 운영에 가깝게 확인하고, @WebMvcTest와 @DataJpaTest 같은 슬라이스 테스트는 웹 계층이나 JPA 계층의 빈만 띄워 그 계층의 일만 빠르게 확인합니다. 슬라이스에 없는 빈은 @MockitoBean으로 넣습니다.'
    - label: 원리
      text: 스프링은 설정이 같은 테스트끼리 컨텍스트를 캐시해 다시 쓰고, 설정이나 목 빈이 다르면 새로 띄웁니다. 테스트에 @Transactional을 붙이면 테스트가 끝날 때 롤백되고, 서비스의 트랜잭션은 테스트의 트랜잭션에 합류합니다.
    - label: 주의할 점
      text: 그래서 테스트에서는 영속성 컨텍스트가 끝까지 열려 있어 운영에서 실패할 지연 로딩이 성공하고, 커밋하지 않아 flush 때의 제약 위반을 못 봅니다. 그런 테스트는 트랜잭션을 떼고 데이터를 지우거나 flush와 clear를 부릅니다. 목 빈을 테스트마다 다르게 두면 컨텍스트가 늘어 느려집니다.
    - label: 경험
      text: '(내 프로젝트로 채우기) 예: 테스트는 통과했는데 운영에서 LazyInitializationException이 나서 보니 테스트에 @Transactional이 있었고, 테스트에서 떼고 fetch join으로 고쳤습니다.'
verified: 이 레슨의 출력은 짐작이 아니라 스프링 부트 3.5와 PostgreSQL 16 컨테이너에서 테스트를 돌려 받은 값이에요. 컨텍스트가 만들어진 횟수는 JUnit의 EngineTestKit으로 안쪽 테스트 클래스 셋을 돌려 셌어요. 코드가 바뀔 때마다 테스트([springtest 패키지](link:test))가 다시 돌아요.
footer: '근거: `@SpringBootTest`와 슬라이스 테스트는 [스프링 부트 문서](link:bootTesting), 컨텍스트 캐시는 [스프링 프레임워크 문서](link:ctxCache), 테스트의 트랜잭션은 [테스트 트랜잭션 문서](link:testTx), `@MockitoBean`과 `@MockBean`은 [스프링 부트 3.4 릴리스 노트](link:boot34). 결과는 스프링 부트 3.5와 PostgreSQL 16에서 테스트로 확인했어요. 오류는 [GitHub 이슈](https://github.com/wanja727/dev-lessons/issues)로 알려 주세요.'
claims:
  - claim: '`@SpringBootTest`의 컨텍스트에는 컨트롤러, 서비스, 리포지토리가 모두 있고 빈이 270개 넘게 있다. `@WebMvcTest`에는 서비스가 목으로만 있고 리포지토리와 DataSource가 없다'
    how: '`getBeanDefinitionCount()`와 `getBeanNamesForType`을 확인한다. 설정 클래스를 테스트 클래스 안에 둬 다른 레슨의 빈이 섞이지 않게 한다'
    test: FullContextTest.fullContextHasEverything, WebSliceTest.webSliceUsesMockService
  - claim: '`@WebMvcTest`에서 목 서비스가 던진 예외가 `@ControllerAdvice`를 거쳐 404가 된다'
    how: '`MockMvc`로 요청하고 상태 코드와 본문을 남긴다'
    test: WebSliceTest.webSliceUsesMockService
  - claim: '테스트에 `@Transactional`이 있으면 트랜잭션 밖에서 읽은 지연 로딩이 성공하고, 없으면 `LazyInitializationException`이 난다'
    how: '회원은 `@BeforeTransaction`에서 미리 커밋해 두고 두 `@Nested` 클래스로 비교한다. PostgreSQL 컨테이너를 쓴다'
    test: LazyLoadingTest
  - claim: '유니크 제약을 어기는 두 번째 저장이 flush 없이 롤백되면 테스트가 통과하고, `flush()`를 부르면 제약 위반이 난다'
    how: '시퀀스 전략의 엔티티로 `@DataJpaTest`에서 확인한다'
    test: DataJpaSliceTest
  - claim: '`@Transactional` 테스트에서 저장한 행은 테스트 뒤에 DB에 없다'
    how: '다음 테스트에서 `JdbcTemplate`으로 센다. 순서는 `@TestMethodOrder`로 정한다'
    test: DataJpaSliceTest.previousTestRolledBack
  - claim: '설정이 같은 테스트 클래스 둘은 컨텍스트를 한 번 만들고, `@MockitoBean`이 다른 클래스는 컨텍스트를 새로 만든다'
    how: '`EngineTestKit`으로 안쪽 테스트 클래스 셋을 돌리고 빈의 생성자가 불린 횟수를 센다. 안쪽 클래스는 시스템 프로퍼티가 있을 때만 돈다'
    test: ContextCacheTest.contextIsCachedBySameConfiguration
sources:
  - '`@SpringBootTest`, 슬라이스 테스트, `@MockitoBean`: 스프링 부트 문서 Testing https://docs.spring.io/spring-boot/reference/testing/spring-boot-applications.html'
  - '테스트 컨텍스트 캐시와 캐시 키: 스프링 프레임워크 문서 https://docs.spring.io/spring-framework/reference/testing/testcontext-framework/ctx-management/caching.html'
  - '테스트의 트랜잭션은 기본으로 롤백된다: https://docs.spring.io/spring-framework/reference/testing/testcontext-framework/tx.html'
  - '`@MockBean`이 지원 중단되고 `@MockitoBean`을 쓴다: 스프링 부트 3.4 릴리스 노트 https://github.com/spring-projects/spring-boot/wiki/Spring-Boot-3.4-Release-Notes'
