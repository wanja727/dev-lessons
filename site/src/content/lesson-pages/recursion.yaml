# 재귀 (설계서)
# 자료 파일의 칸은 docs/lesson-data-format.md에 있다.
stage: design
title: 재귀
unit: 자료구조와 알고리즘
roadmap: K5
type: 자바 실행
prerequisites:
  - {slug: stack-and-queue, title: 스택과 큐}
  - {slug: jvm-memory, title: JVM 메모리 구조}
assume: '자바 21(OpenJDK). 스택은 마지막에 넣은 것을 먼저 꺼낸다는 것(스택과 큐 레슨). 메서드를 부르면 스레드의 스택에 프레임이 쌓이고, 너무 깊으면 `StackOverflowError`가 난다는 것(JVM 메모리 구조 레슨).'
example: '쇼핑몰의 카테고리 트리. "전자제품" 아래 "컴퓨터", 그 아래 "노트북"처럼 카테고리가 하위 카테고리를 가져요. 한 카테고리 아래에 있는 카테고리의 수를 재귀로 세고, 같은 일을 반복문과 스택으로도 해요. 실무 구역에서는 부모를 가리키는 카테고리 엔티티와 잘못 들어간 순환 데이터로 옮겨요.'
intro:
  - '카테고리 아래에 하위 카테고리가 몇 겹 있을지 모르는 화면을 만들어요. 반복문을 몇 겹 써야 할지 정할 수가 없어요. "자기 아래를 센 다음, 하위 카테고리마다 같은 일을 시킨다"고 쓰면 깊이와 상관없이 한 메서드로 끝나요. 이것이 재귀예요.'
  - '자바 개발자는 트리 모양의 데이터를 자주 만나요. 카테고리, 댓글과 대댓글, 조직도, JSON 문서가 그래요. 재귀로 쓰면 짧지만, 끝나는 조건을 빠뜨리거나 데이터가 순환하면 `StackOverflowError`로 서버의 요청이 실패해요. 같은 계산을 수백만 번 되풀이하는 재귀도 있어요.'
  - '이 레슨에서는 재귀 호출이 끝나는 조건과 호출 스택이 쌓이는 모양을 따라가고, 호출 횟수를 세어 재귀가 빠를 때와 느릴 때를 확인해요.'
covers:
  - topic: '재귀는 메서드가 자기 자신을 부르는 것이다. 큰 문제를 같은 모양의 작은 문제로 나눠 푼다'
    where: '질문 1'
  - topic: '끝나는 조건(기저 조건): 더 나누지 않고 바로 답하는 경우. 호출마다 끝나는 조건에 가까워져야 한다'
    where: '질문 1'
  - topic: '끝나는 조건이 없거나 가까워지지 않으면 StackOverflowError가 난다'
    where: '질문 1. 에러가 나는 원리는 JVM 메모리 구조(J14)'
  - topic: '재귀 호출은 호출 스택에 프레임을 쌓는다. 호출마다 지역 변수가 따로 있다. 끝나는 조건에 닿은 뒤 쌓인 반대 순서로 돌아오며 결과를 합친다'
    where: '질문 2'
  - topic: '재귀의 깊이가 스택이 견디는 깊이다. 깊이가 데이터 크기에 비례하면 큰 입력에서 터진다'
    where: '질문 2'
  - topic: '자바는 꼬리 재귀를 최적화하지 않는다'
    where: '질문 2의 더 알아보기'
  - topic: '모든 재귀는 반복문과 직접 만든 스택으로 바꿀 수 있다. 직접 만든 스택은 힙에 있어 깊이 제한이 없다'
    where: '질문 3'
  - topic: '재귀가 맞는 곳: 트리처럼 자기와 같은 모양을 품은 데이터, 나눠서 푸는 알고리즘(병합 정렬, 깊이 우선 탐색)'
    where: '질문 3. 정렬(K6), 그래프와 탐색(K11)'
  - topic: '같은 인자로 같은 호출을 되풀이하는 재귀는 호출 수가 지수로 는다. 피보나치'
    where: '질문 4'
  - topic: '결과를 저장해 두면(메모이제이션) 호출 수가 n에 비례하게 준다'
    where: '질문 4. 이 생각을 넓힌 것은 그리디와 동적 계획법(K12)'
  - topic: '재귀의 시간 복잡도: 호출 횟수 × 호출 하나의 일'
    where: '질문 4'
  - topic: '스프링에서 재귀를 만나는 곳: 부모를 가리키는 엔티티의 트리, 잘못 들어간 순환 데이터, 양방향 연관의 toString과 JSON 변환'
    where: '실무에서는. toString의 경우는 JVM 메모리 구조(J14)'
  - topic: 'DB에서 트리를 한 번에 읽는 재귀 쿼리(WITH RECURSIVE)'
    where: '실무에서는에 한 줄. 자세히는 다루지 않는다'
codes:
  predict: |-
    static int sum(int n) {
      if (n == 0) return 0;
      return n + sum(n - 1);
    }

    sum(100_000);
  category: |-
    record Category(String name,
                    List<Category> children) {}

    static int count(Category c) {
      int total = 1;
      for (Category child : c.children()) {
        total += count(child);
      }
      return total;
    }
  noBase: |-
    static int sumWrong(int n) {
      return n + sumWrong(n - 1);
    }
  iterative: |-
    static int countIter(Category root) {
      Deque<Category> st = new ArrayDeque<>();
      st.push(root);
      int total = 0;
      while (!st.isEmpty()) {
        Category c = st.pop();
        total++;
        c.children().forEach(st::push);
      }
      return total;
    }
  fib: |-
    static long fib(int n) {
      if (n < 2) return n;
      return fib(n - 1) + fib(n - 2);
    }
  fibMemo: |-
    static long fib(int n, long[] memo) {
      if (n < 2) return n;
      if (memo[n] != 0) return memo[n];
      memo[n] = fib(n - 1, memo)
          + fib(n - 2, memo);
      return memo[n];
    }
  entity: |-
    @Entity
    class Category {
      @Id Long id;
      String name;
      @ManyToOne
      Category parent;
    }
  depthOf: |-
    int depth(Category c) {
      if (c.getParent() == null) return 0;
      return 1 + depth(c.getParent());
    }
predict:
  text: '코드 predict의 `sum`은 끝나는 조건(`n == 0`)을 가진 재귀예요. 기본 설정의 JVM에서 `sum(100_000)`을 부르면 어떻게 될까요? 보기: 5000050000이 나온다, 끝나지 않고 영원히 돈다, `StackOverflowError`가 난다.'
  answer: '`StackOverflowError`가 날 가능성이 크다. 끝나는 조건이 있어도 10만 겹의 호출을 쌓아야 닿는다. 기본 스택이 견디는 깊이는 환경에 따라 수천에서 수만이다. 질문 2에서 밝힌다. 테스트에서 실제로 나는지 확인하고, 나지 않는 환경이면 문제의 숫자를 바꾼다.'
questions:
  - id: q1
    title: 재귀 함수는 어떻게 끝나나요?
    conclusion:
      lead: '더 나누지 않고 바로 답을 돌려주는 끝나는 조건에 닿아서 끝나요.'
      sub: '그래서 호출할 때마다 문제가 작아져 끝나는 조건에 가까워져야 해요. 그렇지 않으면 호출이 끝없이 쌓여 `StackOverflowError`가 나요.'
    says:
      - '재귀는 메서드가 자기 자신을 부르는 것이다. 코드 category의 `count`는 "나 하나에, 하위 카테고리마다 센 수를 더한다"고 쓴다. 하위 카테고리를 세는 일도 같은 모양이라 같은 메서드에 맡긴다'
      - '재귀에는 두 부분이 있다. 끝나는 조건은 바로 답하는 경우다. 코드 predict에서 `n == 0`이면 0이다. 나머지 경우는 더 작은 문제로 자기를 부른다. `sum(n - 1)`은 `sum(n)`보다 한 칸 작다'
      - '`count`의 끝나는 조건은 눈에 띄지 않는다. 하위 카테고리가 없으면 반복문이 돌지 않아 1을 돌려준다. 그것이 끝나는 조건이다'
      - '코드 noBase는 끝나는 조건이 없다. n이 음수가 돼도 계속 부른다. `StackOverflowError`가 난다. 끝나는 조건이 있어도 가까워지지 않으면 같다: `sum(-1)`은 `n == 0`을 지나쳐 계속 내려간다'
      - '재귀를 쓸 때 먼저 적을 것 두 가지: 언제 바로 답하나, 호출마다 무엇이 작아지나'
    asks:
      - '본문의 예시: 하위 카테고리가 없는 카테고리 하나로 코드 category의 `count`를 부르면 무엇을 돌려주고, 자기 자신을 몇 번 부르나 (1을 돌려주고, 부르지 않는다)'
      - '옮긴 상황: `int pow(int b, int e) { return b * pow(b, e - 1); }`로 거듭제곱을 구하려 했다. `pow(2, 3)`은 어떻게 되고, 무엇을 더해야 하나 (`StackOverflowError`. `if (e == 0) return 1;`)'
  - id: q2
    title: 재귀 호출이 쌓일 때 스택에서는 무슨 일이 일어나나요?
    conclusion:
      lead: '호출마다 그 호출의 지역 변수를 담은 프레임이 스택에 쌓이고, 끝나는 조건에 닿은 뒤 쌓인 반대 순서로 하나씩 돌아오며 결과를 합쳐요.'
      sub: '쌓이는 깊이에는 한도가 있어서, 깊이가 입력 크기만큼 자라는 재귀는 큰 입력에서 `StackOverflowError`가 나요.'
    says:
      - '`sum(3)`을 따라간다. `sum(3)`이 `sum(2)`를, `sum(2)`가 `sum(1)`을, `sum(1)`이 `sum(0)`을 부른다. 이때 스택에는 네 프레임이 있고 각자 자기 `n`을 가진다. `sum(0)`이 0을 돌려주면 `sum(1)`이 1 + 0을, `sum(2)`가 2 + 1을, `sum(3)`이 3 + 3을 돌려준다. 늦게 부른 것이 먼저 끝난다. 스택과 큐(K3)의 스택이다'
      - '예측의 답을 밝힌다. `sum(100_000)`은 끝나는 조건에 닿기 전에 프레임 10만 개를 쌓아야 한다. 기본 스택이 그만큼 견디지 못하면 `StackOverflowError`다. 실제로 몇 겹에서 났는지 테스트로 센 값을 보인다. 숫자는 환경마다 다르다'
      - '재귀의 깊이가 무엇에 비례하는지 본다. `sum(n)`은 n에 비례한다. 카테고리의 `count`는 카테고리 수가 아니라 트리의 가장 깊은 겹 수에 비례한다. 카테고리가 1만 개여도 다섯 겹이면 프레임은 다섯 개 남짓이다'
      - '깊이가 입력만큼 자랄 수 있는 곳(긴 연결 리스트, 사용자가 만드는 깊이)에는 재귀를 쓰지 않거나 깊이를 제한한다. `-Xss`로 스택을 키우는 것은 근본 해결이 아니다'
      - '더 알아보기: 자기를 부르는 것이 메서드의 마지막 일인 꼬리 재귀를 반복문으로 바꿔 스택을 쌓지 않는 언어가 있다. 자바 컴파일러와 HotSpot은 이 최적화를 하지 않는다. 꼬리 재귀로 써도 깊이만큼 쌓인다'
    widget:
      kind: steps
      note: '`sum(3)`을 한 단계씩 실행한다. 왼쪽은 스택(아래부터 `sum(3)`, `sum(2)`, ...의 프레임과 각자의 `n`), 오른쪽은 지금 실행 중인 줄. 내려가는 단계 넷, 돌아오는 단계 넷. 돌아올 때 프레임마다 돌려준 값을 적고 프레임을 지운다'
    asks:
      - '본문의 예시: `sum(3)`에서 `sum(0)`이 실행되는 순간 스택에 쌓인 `sum`의 프레임은 몇 개이고, 가장 먼저 끝나는 호출은 무엇인가 (4개, `sum(0)`)'
      - '옮긴 상황: 카테고리 2천 개가 세 겹으로 이루어진 트리에서 `count(root)`를 부른다. 가장 깊을 때 스택에 쌓인 `count`의 프레임은 몇 개인가 (3개. 깊이는 카테고리 수가 아니라 겹 수를 따른다)'
  - id: q3
    title: 재귀는 언제 쓰고, 반복문으로 바꿀 수 있나요?
    conclusion:
      lead: '트리처럼 자기와 같은 모양을 품은 데이터를 다룰 때 써요. 모든 재귀는 반복문과 직접 만든 스택으로 바꿀 수 있어요.'
      sub: '직접 만든 스택은 힙에 있어서 호출 스택의 깊이 제한을 받지 않아요. 대신 코드가 길어져요.'
    says:
      - '카테고리 아래에는 카테고리가 있다. 이렇게 부분이 전체와 같은 모양인 데이터는 재귀로 쓰면 데이터의 모양과 코드의 모양이 같아진다. 댓글과 대댓글, 조직도, 폴더, JSON이 그렇다'
      - '나눠서 푸는 알고리즘도 재귀로 쓴다. 병합 정렬(K6)은 절반씩 나눠 정렬하고 합친다. 깊이 우선 탐색(K11)은 이웃마다 같은 탐색을 시킨다'
      - '코드 iterative는 코드 category를 반복문으로 바꾼 것이다. JVM이 대신 쌓던 프레임을 `ArrayDeque`에 직접 쌓는다. 같은 트리에서 둘의 결과가 같다'
      - '반복문 버전은 스택이 힙에 있어 깊이 10만의 트리도 센다. 같은 트리로 재귀 버전은 `StackOverflowError`, 반복문 버전은 정상 결과를 내는 것을 테스트로 보인다'
      - '`sum`처럼 하나만 부르는 재귀는 스택도 필요 없이 `for` 한 겹이 된다'
      - '고르는 기준: 깊이가 작게 정해져 있으면(카테고리 다섯 겹) 읽기 쉬운 재귀, 깊이를 알 수 없거나 매우 깊을 수 있으면 반복문'
    asks:
      - '본문의 예시: 코드 iterative에서 `Deque`가 하는 일은 재귀 버전의 무엇을 대신하나 (JVM의 호출 스택에 쌓이던 프레임. 아직 셀 카테고리를 기억한다)'
      - '옮긴 상황: 사용자가 답글에 답글을 끝없이 달 수 있는 게시판에서 한 글의 답글 수를 센다. 재귀와 반복문 가운데 무엇이 안전하고 왜 그런가 (반복문과 직접 만든 스택. 깊이에 한도가 없어 재귀는 `StackOverflowError`가 날 수 있다)'
  - id: q4
    title: 재귀가 아주 느려지는 경우는 언제인가요?
    conclusion:
      lead: '같은 인자로 같은 호출을 되풀이할 때예요. 피보나치를 그대로 재귀로 쓰면 호출 수가 n이 하나 늘 때마다 약 1.6배씩 늘어요.'
      sub: '한 번 계산한 결과를 저장해 두고 다시 쓰면(메모이제이션) 인자마다 한 번만 계산해서 호출 수가 n에 비례하게 줄어요.'
    says:
      - '재귀의 시간 복잡도는 호출 횟수에 호출 하나의 일을 곱한 것이다. `sum(n)`은 n번 부르고 호출마다 덧셈 하나라 O(n)이다. `count`는 카테고리마다 한 번 불러 O(카테고리 수)다'
      - '코드 fib. `fib(5)`는 `fib(4)`와 `fib(3)`을 부르고, `fib(4)`도 `fib(3)`을 부른다. 같은 `fib(3)`을 두 번 계산한다. 아래로 갈수록 겹치는 호출이 불어난다. `fib(5)`의 호출을 나무 모양으로 그려 `fib(2)`가 세 번 나오는 것을 보인다'
      - '호출 수를 센다. `fib(20)`, `fib(30)`, `fib(40)`의 호출 수와 걸린 시간을 실측값으로 보인다. n이 10 늘 때 호출 수가 100배 넘게 는다'
      - '코드 fibMemo. 계산한 값을 배열에 둔다. 같은 n이 다시 오면 계산하지 않고 꺼낸다. `fib(40)`의 호출 수가 79번(2n - 1)으로 준다'
      - '메모이제이션은 "같은 부분 문제를 다시 풀지 않는다"는 생각이다. 이 생각을 재귀 없이 표를 채우는 방식까지 넓힌 것이 동적 계획법이다. 그리디와 동적 계획법(K12)에서 다룬다'
      - '카테고리의 `count`는 느려지지 않는다. 카테고리마다 한 번씩만 부르기 때문이다. 같은 인자로 다시 부르는지가 갈림길이다'
    asks:
      - '본문의 예시: 코드 fib로 `fib(5)`를 부르면 `fib(3)`은 몇 번 불리나 (2번)'
      - '옮긴 상황: 격자의 왼쪽 위에서 오른쪽 아래까지 오른쪽과 아래로만 가는 길의 수를 `paths(r, c) = paths(r - 1, c) + paths(r, c - 1)`로 구한다. 이 재귀가 느린 이유와 고치는 방법은 무엇인가 (같은 `(r, c)`를 여러 번 계산한다. 계산한 값을 저장해 다시 쓴다)'
      - '실무 구역: 코드 depthOf에서 데이터가 잘못 들어가 카테고리 A의 부모가 B, B의 부모가 A다. A의 `depth`를 구하면 어떻게 되나 (`StackOverflowError`. 부모를 따라가는 호출이 끝나지 않는다)'
practice:
  says:
    - '부모를 가리키는 엔티티(코드 entity)로 카테고리 트리를 담는 것이 흔하다. 화면에 "전자제품 > 컴퓨터 > 노트북"을 그리려고 코드 depthOf처럼 부모를 따라 올라간다. 끝나는 조건은 부모가 null인 최상위다'
    - '흔한 실수: 관리 화면에서 카테고리를 옮기다 A의 부모를 B로, B의 부모를 A로 만든다. 데이터에 순환이 생기면 끝나는 조건(부모가 null)에 영원히 닿지 않아 그 카테고리를 그리는 요청마다 `StackOverflowError`가 난다. 고친 코드: 방문한 id를 `Set`에 담으며 올라가고, 이미 본 id를 다시 만나면 예외를 던진다. 저장할 때도 새 부모의 조상에 자기가 없는지 확인한다. 순수 자바의 카테고리 객체로 두 코드를 돌려 에러와 고친 뒤의 예외 메시지를 테스트로 남긴다'
    - '같은 순환이 양방향 연관의 `toString`과 JSON 변환에서도 생긴다. 부모가 자식 목록을, 자식이 부모를 출력하면 서로를 끝없이 부른다. `toString`의 경우는 JVM 메모리 구조(J14)에서 보았다'
    - '트리를 통째로 읽어야 하면 부모를 따라 쿼리를 여러 번 보내는 대신, 표준 SQL의 재귀 쿼리(`WITH RECURSIVE`)로 한 번에 읽는 방법도 있다. 이 레슨에서는 이름만 소개한다 (PostgreSQL 공식 문서 근거)'
claims:
  - claim: '코드 category의 `count`는 예제 트리의 카테고리 수를 돌려주고, 코드 iterative도 같은 값을 돌려준다'
    how: '예제 트리를 만들어 두 메서드의 결과를 비교한다'
  - claim: '코드 noBase와 `sum(-1)`은 `StackOverflowError`를 던진다'
    how: '에러를 잡아 확인한다'
  - claim: '기본 설정에서 `sum(100_000)`은 `StackOverflowError`를 던진다'
    how: '에러를 잡고, 나지 않으면 테스트가 실패하게 해서 레슨의 숫자를 고친다. 에러가 난 깊이를 `CiOutput`에 남긴다'
  - claim: '`sum(0)`이 실행되는 순간 스택에 `sum` 프레임이 4개다'
    how: '`sum(0)`에서 `Thread.currentThread().getStackTrace()`를 읽어 센다'
  - claim: '깊이 10만의 트리에서 재귀 버전은 `StackOverflowError`, 반복문 버전은 정상 결과를 낸다'
    how: '한 줄로 이어진 카테고리 10만 개를 만들어 두 메서드를 부른다'
  - claim: '`fib(5)`에서 `fib(3)`은 2번 불리고, `fib(20)`, `fib(30)`의 호출 수는 n이 10 늘 때 100배 넘게 는다'
    how: '호출 카운터로 센다. 정확한 호출 수를 `CiOutput`에 남긴다'
  - claim: '코드 fibMemo로 `fib(40)`을 구하면 호출 수가 79번이고 값은 102334155다'
    how: '호출 카운터로 세고 값을 비교한다'
  - claim: '부모가 서로를 가리키는 카테고리에서 `depth`는 `StackOverflowError`를 던지고, 방문한 id를 담는 버전은 순환을 알리는 예외를 던진다'
    how: '순수 자바 객체로 순환을 만들어 두 메서드를 부른다'
sources:
  - '프레임과 `StackOverflowError`가 나는 조건: JVM 명세 2.5.2 https://docs.oracle.com/javase/specs/jvms/se21/html/jvms-2.html#jvms-2.5.2'
  - '`-Xss`: `java` 명령 문서 https://docs.oracle.com/en/java/javase/21/docs/specs/man/java.html'
  - '재귀 쿼리 `WITH RECURSIVE`: PostgreSQL 문서 https://www.postgresql.org/docs/current/queries-with.html'
