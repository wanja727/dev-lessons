# 재귀
# 자료 파일의 칸은 docs/lesson-data-format.md에 있다. 문제는 content/questions/recursion.yaml에 있다.
title: 재귀
description: 재귀 함수가 어떻게 끝나는지, 호출이 쌓일 때 스택에서 무슨 일이 일어나는지, 언제 쓰고 반복문으로 바꿀 수 있는지, 아주 느려지는 경우는 언제인지. 네 가지 질문에 스스로 답할 수 있게, 쇼핑몰의 카테고리 트리를 재귀로 세며 배우는 대화형 레슨.
unit: 자료구조와 알고리즘
minutes: 20
roadmap: K5
type: 자바 실행
prerequisites:
  - {slug: stack-and-queue, title: 스택과 큐}
  - {slug: jvm-memory, title: JVM 메모리 구조}
assume: '자바 21(OpenJDK). 스택은 마지막에 넣은 것을 먼저 꺼낸다는 것(스택과 큐 레슨). 메서드를 부르면 스레드의 스택에 프레임이 쌓이고, 너무 깊으면 `StackOverflowError`가 난다는 것(JVM 메모리 구조 레슨).'
example: '쇼핑몰의 카테고리 트리. "전자제품" 아래 "컴퓨터", 그 아래 "노트북"처럼 카테고리가 하위 카테고리를 가져요. 한 카테고리 아래에 있는 카테고리의 수를 재귀로 세고, 같은 일을 반복문과 스택으로도 해요. 실무 구역에서는 부모를 가리키는 카테고리 엔티티와 잘못 들어간 순환 데이터로 옮겨요.'
intro:
  - '카테고리 아래에 하위 카테고리가 몇 겹 있을지 모르는 화면을 만들어요. 반복문을 몇 겹 써야 할지 정할 수가 없어요. "자기 아래를 센 다음, 하위 카테고리마다 같은 일을 시킨다"고 쓰면 깊이와 상관없이 한 메서드로 끝나요. 이것이 재귀예요.'
  - '자바 개발자는 트리 모양의 데이터를 자주 만나요. 카테고리, 댓글과 대댓글, 조직도, JSON 문서가 그래요. 재귀로 쓰면 짧지만, 끝나는 조건을 빠뜨리거나 데이터가 순환하면 `StackOverflowError`로 서버의 요청이 실패해요. 같은 계산을 수백만 번 되풀이하는 재귀도 있어요.'
  - '이 레슨에서는 재귀 호출이 끝나는 조건과 호출 스택이 쌓이는 모양을 따라가고, 호출 횟수를 세어 재귀가 빠를 때와 느릴 때를 확인해요.'
covers:
  - topic: '재귀는 메서드가 자기 자신을 부르는 것이다. 큰 문제를 같은 모양의 작은 문제로 나눠 푼다'
    where: '질문 1'
  - topic: '끝나는 조건(기저 조건): 더 나누지 않고 바로 답하는 경우. 호출마다 끝나는 조건에 가까워져야 한다'
    where: '질문 1'
  - topic: '끝나는 조건이 없거나 가까워지지 않으면 StackOverflowError가 난다'
    where: '질문 1. 에러가 나는 원리는 JVM 메모리 구조(J14)'
  - topic: '재귀 호출은 호출 스택에 프레임을 쌓는다. 호출마다 지역 변수가 따로 있다. 끝나는 조건에 닿은 뒤 쌓인 반대 순서로 돌아오며 결과를 합친다'
    where: '질문 2'
  - topic: '재귀의 깊이가 스택이 견디는 깊이다. 깊이가 데이터 크기에 비례하면 큰 입력에서 터진다'
    where: '질문 2'
  - topic: '자바는 꼬리 재귀를 최적화하지 않는다'
    where: '질문 2의 더 알아보기'
  - topic: '모든 재귀는 반복문과 직접 만든 스택으로 바꿀 수 있다. 직접 만든 스택은 힙에 있어 깊이 제한이 없다'
    where: '질문 3'
  - topic: '재귀가 맞는 곳: 트리처럼 자기와 같은 모양을 품은 데이터, 나눠서 푸는 알고리즘(병합 정렬, 깊이 우선 탐색)'
    where: '질문 3. 정렬(K6), 그래프와 탐색(K11)'
  - topic: '같은 인자로 같은 호출을 되풀이하는 재귀는 호출 수가 지수로 는다. 피보나치'
    where: '질문 4'
  - topic: '결과를 저장해 두면(메모이제이션) 호출 수가 n에 비례하게 준다'
    where: '질문 4. 이 생각을 넓힌 것은 그리디와 동적 계획법(K12)'
  - topic: '재귀의 시간 복잡도: 호출 횟수 × 호출 하나의 일'
    where: '질문 4'
  - topic: '스프링에서 재귀를 만나는 곳: 부모를 가리키는 엔티티의 트리, 잘못 들어간 순환 데이터, 양방향 연관의 toString과 JSON 변환'
    where: '실무에서는. toString의 경우는 JVM 메모리 구조(J14)'
  - topic: 'DB에서 트리를 한 번에 읽는 재귀 쿼리(WITH RECURSIVE)'
    where: '실무에서는에 한 줄. 자세히는 다루지 않는다'
codes:
  predict: |-
    static int sum(int n) {
      if (n == 0) return 0;
      return n + sum(n - 1);
    }

    sum(100_000);
  sumParts: |-
    static int sum(int n) {
      [[if (n == 0) return 0;]]
      return n + [[sum(n - 1)]];
    }
  category: |-
    record Category(String name,
                    List<Category> children) {}

    static int count(Category c) {
      int total = 1;
      for (Category child : c.children()) {
        total += [[count(child)]];
      }
      return total;
    }
  countRun: |-
    // 전자제품
    //   컴퓨터 (노트북, 데스크톱)
    //   휴대폰 (스마트폰)
    //   TV
    count(electronics);
    countIter(electronics);
    count(tv);
  noBase: |-
    static int sumWrong(int n) {
      return n + [[sumWrong(n - 1)]];
    }
  iterative: |-
    static int countIter(Category root) {
      Deque<Category> st = new ArrayDeque<>();
      [[st.push(root)]];
      int total = 0;
      while (!st.isEmpty()) {
        Category c = st.pop();
        total++;
        c.children().forEach([[st::push]]);
      }
      return total;
    }
  deepRun: |-
    // c1 > c2 > c3 > ... > c100000
    count(c1);
    countIter(c1);
  fib: |-
    static long fib(int n) {
      if (n < 2) return n;
      return [[fib(n - 1) + fib(n - 2)]];
    }
  fibTree: |-
    fib(5)
    ├ fib(4)
    │ ├ fib(3)
    │ │ ├ [[fib(2)]]
    │ │ └ fib(1)
    │ └ [[fib(2)]]
    └ fib(3)
      ├ [[fib(2)]]
      └ fib(1)
  fibRun: |-
    // 호출마다 calls++ 하며 센다
    fib(20); fib(30); fib(40);
  fibMemo: |-
    static long fib(int n, long[] memo) {
      if (n < 2) return n;
      [[if (memo[n] != 0) return memo[n];]]
      memo[n] = fib(n - 1, memo)
          + fib(n - 2, memo);
      return memo[n];
    }
  memoRun: |-
    fib(40, new long[41]);
  entity: |-
    @Entity
    class Category {
      @Id Long id;
      String name;
      @ManyToOne
      [[Category parent]];
    }
  depthOf: |-
    int depth(Category c) {
      [[if (c.getParent() == null) return 0;]]
      return 1 + depth(c.getParent());
    }
  depthSafe: |-
    int depth(Category c) {
      Set<Long> seen = new HashSet<>();
      int d = 0;
      for (Category p = c;
           p.getParent() != null;
           p = p.getParent()) {
        if ([[!seen.add(p.getId())]]) {
          throw new IllegalStateException(
              "카테고리 순환: id " + p.getId());
        }
        d++;
      }
      return d;
    }
  cycleRun: |-
    // 노트북 > 컴퓨터 > 전자제품
    depth(laptop);
    // 잘못 들어간 데이터
    a.setParent(b);
    b.setParent(a);
    depth(a);
links:
  test: https://github.com/wanja727/dev-lessons/blob/main/verification/src/test/java/lab/devlessons/recursion/RecursionTest.java
  jvms: https://docs.oracle.com/javase/specs/jvms/se21/html/jvms-2.html#jvms-2.5.2
