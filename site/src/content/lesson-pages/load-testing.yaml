# 부하 테스트
# 자료 파일의 칸은 docs/lesson-data-format.md에 있다. 문제는 content/questions/load-testing.yaml에 있다.
title: 부하 테스트
description: 부하 테스트로 알아내는 것, 사용자를 늘릴 때 처리량과 응답 시간이 바뀌는 모양, 병목을 찾는 법, 믿을 수 있게 재는 법. 네 가지 질문에 스스로 답할 수 있게 스레드를 줄인 상품 조회 서버로 배우는 대화형 레슨.
unit: 테스트와 운영
minutes: 20
roadmap: T9
type: 동작 확인
prerequisites:
  - {slug: logging-monitoring, title: 로그와 모니터링}
  - {slug: thread-pool, title: 스레드 풀}
assume: '스프링 부트 3.5, 내장 톰캣. 요청마다 톰캣 스레드 하나가 처리한다는 것(서블릿과 톰캣 레슨), 스레드 풀이 꽉 차면 일이 큐에서 기다린다는 것(스레드 풀 레슨), 응답 시간은 백분위로 본다는 것(로그와 모니터링 레슨).'
example: '상품 조회 API `GET /products/1`. 안에서 외부 재고 API를 부르느라 100ms를 쓴다. 톰캣 스레드 수를 작게 둔 서버에 동시 사용자를 늘려 가며 요청을 보내 처리량과 응답 시간이 어떻게 바뀌는지 잰다.'
intro:
  - '오픈 이벤트 날, 평소에는 50ms 걸리던 API가 갑자기 5초씩 걸리고 결국 타임아웃이 나요. CPU는 30%밖에 안 쓰는데요. 미리 "이 서버가 몇 명까지 버티는가"를 재 봤다면 이벤트 전에 알았을 거예요.'
  - '부하 테스트는 운영에 내기 전에 서버에 많은 요청을 보내 한계와 병목을 찾는 일이에요. 백엔드 개발자는 목표(초당 몇 건을 p99 몇 ms 안에)를 정하고, 사용자를 늘려 가며 처리량이 더 늘지 않는 지점을 찾고, 그때 무엇이 먼저 찼는지(스레드, 커넥션, 외부 API)를 지표로 봐요.'
  - '이 레슨에서는 톰캣 스레드를 일부러 적게 둔 스프링 서버에 자바로 동시 요청을 보내, 처리량이 멈추는 지점, 그 뒤로 응답 시간만 늘어나는 모습, 스레드 수를 바꿨을 때의 차이를 실제로 재요.'
covers:
  - topic: '부하 테스트의 목적: 목표 처리량과 응답 시간을 지키는지, 어디서 한계에 닿는지, 무엇이 병목인지'
    where: '질문 1'
  - topic: '처리량(초당 요청 수, TPS/RPS)과 응답 시간(지연), 동시 사용자 수의 관계. 리틀의 법칙(동시 요청 수 = 처리량 × 응답 시간)'
    where: '질문 2'
  - topic: '동시 사용자를 늘리면 처리량은 어느 지점까지 늘다가 멈추고, 그 뒤로는 응답 시간만 길어진다(포화)'
    where: '질문 2'
  - topic: '포화 뒤의 요청은 톰캣의 작업 큐와 접속 대기열에서 기다린다. 기다린 시간도 응답 시간이다'
    where: '질문 3. 톰캣의 스레드와 큐는 서블릿과 톰캣(S1)'
  - topic: '병목 찾기: 처리량이 멈출 때 먼저 찬 자원(톰캣 스레드, 커넥션 풀, 외부 API, CPU)을 지표로 본다. CPU가 놀고 있는데 느리면 무언가를 기다리는 것이다'
    where: '질문 3'
  - topic: '스레드 수를 늘리면 기다리는 일(I/O)에는 처리량이 늘지만, 다음 병목(커넥션 풀, 외부 API)으로 옮겨 갈 뿐이다'
    where: '질문 3. 풀 크기 정하기는 스레드 풀과 커넥션 풀 크기(A11)'
  - topic: '부하 테스트의 종류: 부하(목표만큼), 스트레스(한계를 넘겨), 내구(오래), 스파이크(갑자기)'
    where: '질문 4'
  - topic: '부하 테스트를 믿을 수 있게: 운영과 비슷한 환경과 데이터, 워밍업 뒤에 재기, 부하를 만드는 쪽이 먼저 병목이 되지 않게'
    where: '질문 4'
  - topic: '닫힌 모델(사용자 수 고정)과 열린 모델(도착률 고정)의 차이. 닫힌 모델은 서버가 느려지면 요청도 줄어 문제를 감춘다'
    where: '질문 4의 더 알아보기'
  - topic: 'k6, JMeter, nGrinder, Gatling 같은 도구로 시나리오를 쓰고 결과를 읽기'
    where: '실무에서는 (k6 스크립트 예. 문서 근거)'
  - topic: '타임아웃과 서킷 브레이커로 느린 외부 API가 스레드를 다 잡지 않게 하기'
    where: '다루지 않음: 타임아웃, 재시도, 서킷 브레이커(A10)'
links:
  test: https://github.com/wanja727/dev-lessons/blob/main/verification/src/test/java/lab/devlessons/loadtest/LoadTestingTest.java
  little: https://en.wikipedia.org/wiki/Little%27s_law
  bootProps: https://docs.spring.io/spring-boot/appendix/application-properties/index.html#appendix.application-properties.server
  k6Thresholds: https://grafana.com/docs/k6/latest/using-k6/thresholds/
  k6Open: https://grafana.com/docs/k6/latest/using-k6/scenarios/concepts/open-vs-closed/
codes:
  api: |-
    @GetMapping("/products/{id}")
    String find(@PathVariable Long id)
        throws InterruptedException {
      Thread.sleep(100); // 외부 재고 API
      return "펜";
    }
  threads: |-
    server:
      tomcat:
        threads:
          max: 10
  loadRun: |-
    // 사용자 N명이 3초 동안 쉬지 않고
    for (int u = 0; u < users; u++) {
      virtualThread(() -> {
        while (시간이 남음) {
          http.send(GET /products/1);
          걸린 시간을 기록;
        }
      });
    }
  little: |-
    서버 안의 요청 수 = 처리량 × 응답 시간
    10개 = 100건/초 × 0.1초
  tomcatProps: |-
    server:
      tomcat:
        threads:
          max: 200        # 기본값
        accept-count: 100 # 기본값
        max-connections: 8192
  k6: |-
    import http from 'k6/http';
    export const options = {
      stages: [
        { duration: '1m', target: 50 },
        { duration: '3m', target: 50 },
      ],
      thresholds: {
        http_req_duration: ['p(99)<300'],
      },
    };
    export default function () {
      http.get('http://host/products/1');
    }
predict:
  title: 사용자가 다섯 배면 처리량도 다섯 배일까요?
  text: '톰캣 스레드는 최대 10개이고, 상품 조회는 외부 API 때문에 요청마다 100ms가 걸려요. 동시 사용자 50명이 쉬지 않고 요청을 보내요. 처리량(초당 처리 건수)은 얼마쯤일까요? 모르는 게 정상이니 감으로 골라 보세요. 답은 질문 2에 나와요.'
  code: api
  label: 내 예측
  options:
    - {value: '100', label: 초당 약 100건}
    - {value: '500', label: 초당 약 500건}
    - {value: '1000', label: 초당 약 1000건}
  answer: '100'
  storageKey: load-predict
  wrong: 예측은 "{label}"이었어요. 틀린 예측이 더 오래 남으니 괜찮아요.
questions:
  - id: q1
    title: 부하 테스트는 무엇을 알아내려고 하나요?
    conclusion:
      lead: '서버가 목표한 양의 요청을 목표한 응답 시간 안에 처리하는지, 어디서 한계에 닿는지, 그때 무엇이 먼저 차는지를 알아내요.'
      sub: '"빠른가"가 아니라 "초당 몇 건을 p99 몇 ms 안에"처럼 숫자로 목표를 정해야 통과와 실패를 가를 수 있어요.'
    says:
      - '부하 테스트 없이 운영에 내면 한계는 사용자가 가장 많을 때(이벤트) 처음 드러난다'
      - '목표의 모양: 처리량(초당 요청 수)과 응답 시간의 백분위(T7). 예: 초당 200건을 p99 300ms 안에'
      - '알아낼 것 셋: 목표를 지키는가, 한계(처리량이 더 늘지 않는 지점)는 어디인가, 그때 먼저 찬 자원(병목)은 무엇인가'
      - '단위 테스트와 통합 테스트(T2, T4)는 맞게 동작하는지를, 부하 테스트는 많이 올 때도 버티는지를 본다'
    asks:
      - '본문의 예시: "주문 API가 빨라야 한다"는 부하 테스트의 목표로 충분한가 (아니다. 초당 몇 건을 p99 몇 ms 안에처럼 숫자로 정해야 통과와 실패를 가를 수 있다)'
      - '옮긴 상황: 모든 단위 테스트와 통합 테스트가 통과한 서버가 이벤트 날 느려졌다. 미리 무엇을 했어야 하나 (예상 사용자만큼 부하를 보내 처리량과 응답 시간을 재는 부하 테스트)'
    body:
      - p: '단위 테스트와 통합 테스트(앞 레슨들)는 코드가 **맞게** 동작하는지를 봐요. 요청이 한 번에 하나씩 올 때 맞으면 통과예요. 그런데 서버는 요청 수백 개를 동시에 받아요. 많이 올 때도 **버티는지**는 따로 재야 해요. 그것이 **부하 테스트**예요. 재지 않고 내보내면 한계는 사용자가 가장 많은 날(오픈 이벤트) 처음 드러나요.'
      - p: '부하 테스트로 알아낼 것은 셋이에요.'
      - ol:
          - '**목표를 지키는가.** 목표는 숫자로 정해요. "빨라야 한다"는 통과와 실패를 가를 수 없어요. "초당 200건을 p99 300ms 안에"처럼 처리량과 응답 시간의 백분위(로그와 모니터링 레슨)로 적어요.'
          - '**한계는 어디인가.** 사용자를 늘려 가면 처리량이 더 늘지 않는 지점이 있어요(질문 2).'
          - '**무엇이 병목인가.** 한계에서 가장 먼저 꽉 찬 자원이에요(질문 3).'
      - p: '용어 둘을 정리해요. **처리량**은 서버가 1초에 끝내는 요청 수(TPS, RPS)이고, **응답 시간**(지연)은 요청 하나가 보내진 뒤 응답이 오기까지 걸린 시간이에요.'
      - quiz:
          q: '"주문 API가 빨라야 한다"는 부하 테스트의 목표로 충분할까요?'
          options:
            - 충분하다
            - '부족하다. "초당 몇 건을 p99 몇 ms 안에"처럼 숫자로 정해야 한다'
            - 평균 응답 시간만 정하면 된다
          answer: 2
          explain: '숫자로 정해야 재고 나서 통과와 실패를 가를 수 있어요. 응답 시간은 백분위로 정해요.'
      - next: '목표를 정했으면 사용자를 늘려 가며 재 봐요. 사용자가 늘면 처리량은 계속 늘까요?'
    recall: '부하 테스트는 서버가 목표한 처리량을 목표한 응답 시간 안에 처리하는지, 처리량이 더 늘지 않는 한계가 어디인지, 그때 먼저 찬 자원(병목)이 무엇인지 알아내요. 목표는 "초당 200건을 p99 300ms 안에"처럼 처리량과 백분위의 숫자로 정해요. 단위, 통합 테스트는 맞는지를, 부하 테스트는 많이 와도 버티는지를 봐요.'
  - id: q2
    title: 사용자를 늘리면 처리량과 응답 시간은 어떻게 바뀌나요?
    conclusion:
      lead: '처리량은 어느 지점까지 늘다가 멈추고, 그 뒤로는 응답 시간만 길어져요. 그 지점이 서버의 한계예요.'
      sub: '동시에 처리할 수 있는 수가 정해져 있어서, 그보다 많이 오면 처리되지 않고 기다리는 시간이 응답 시간에 더해지기 때문이에요.'
    says:
      - '예측의 답. 톰캣 스레드 10개, 요청마다 100ms인 서버에 동시 사용자 1, 5, 10, 20, 50명으로 요청을 보낸다. 처리량은 10명까지 늘어 초당 100건 가까이에서 멈추고, 그 뒤로 평균과 p99 응답 시간이 사용자 수에 비례해 길어진다. 실제 측정값을 표로 보인다'
      - '리틀의 법칙: 서버 안의 동시 요청 수 = 처리량 × 응답 시간. 스레드 10개, 0.1초면 처리량의 한계는 100건/초다. 측정값과 맞춰 본다'
      - '한계를 넘긴 요청은 실패하지 않고 기다린다. 그래서 오류는 없는데 느려지기만 한다. 기다림이 클라이언트의 타임아웃을 넘으면 그제야 실패가 된다'
    widget:
      kind: toggle
      note: '동시 사용자 수(1, 5, 10, 20, 50)를 고르면 측정한 처리량과 평균, p99 응답 시간을 보인다. 10명 넘어서 처리량은 그대로이고 응답 시간만 늘어나는 것을 강조한다. 숫자는 테스트의 실제 값'
    asks:
      - '본문의 예시: 스레드 10개, 요청마다 100ms인 서버에 동시 사용자를 20명에서 50명으로 늘렸다. 처리량과 응답 시간은 (처리량은 초당 100건 가까이 그대로, 응답 시간은 늘어난다)'
      - '옮긴 상황: 리틀의 법칙으로, 응답 시간이 0.2초인 API가 초당 300건을 처리하려면 서버 안에 동시에 몇 건이 있어야 하나 (60건)'
    body:
      - p: '톰캣 스레드를 일부러 10개로 줄인 서버를 띄웠어요. 상품 조회는 외부 재고 API를 기다리느라 요청마다 100ms가 걸려요.'
      - code: api
      - code: threads
      - p: '자바의 가상 스레드로 "사용자" N명을 만들고, 사용자마다 3초 동안 응답을 받자마자 다음 요청을 보냈어요. 사용자 수를 1명부터 50명까지 늘리며 처리량과 응답 시간을 쟀어요.'
      - ci:
          key: saturation
          label: 실제 측정값 보기
          source: LoadTestingTest.throughputSaturates
          code: loadRun
      - p: '예측의 답이에요. {{predict-result}} 사용자 10명까지는 처리량이 사용자 수에 비례해 늘었어요. 그런데 10명에서 초당 90건 남짓에 닿은 뒤로는 20명, 50명으로 늘려도 **처리량은 그대로**예요. 대신 **응답 시간만** 110ms, 210ms, 500ms로 길어졌어요. 이렇게 처리량이 더 늘지 않는 상태를 **포화**라고 해요. 이 서버의 한계는 초당 약 100건이에요.'
      - p: '사용자 수를 골라 보세요. 숫자는 위 측정값이에요.'
      - widget:
          kind: toggle
          layout: [selector, duo, verdict]
          selector:
            label: 동시 사용자
            options:
              - {value: u5, label: 5명}
              - {value: u10, label: 10명}
              - {value: u20, label: 20명}
              - {value: u50, label: 50명}
          scenes:
            u5:
              duo:
                - label: 처리량
                  rows: [{k: 초당, v: 약 46건}]
                - label: 응답 시간
                  rows: [{k: 평균, v: 약 110 ms}, {k: p99, v: 약 120 ms}]
              verdict: '스레드가 남아서 사용자를 늘리는 만큼 처리량이 늘어요.'
            u10:
              duo:
                - label: 처리량
                  rows: [{k: 초당, v: 약 91건, mark: changed}]
                - label: 응답 시간
                  rows: [{k: 평균, v: 약 110 ms}, {k: p99, v: 약 130 ms}]
              verdict: '스레드 10개가 다 찼어요. 여기가 한계예요.'
            u20:
              duo:
                - label: 처리량
                  rows: [{k: 초당, v: 약 91건 (그대로)}]
                - label: 응답 시간
                  rows: [{k: 평균, v: 약 210 ms, mark: bad}, {k: p99, v: 약 300 ms, mark: bad}]
              verdict: '처리량은 그대로이고, 남는 요청은 기다려서 응답 시간만 늘었어요.'
            u50:
              duo:
                - label: 처리량
                  rows: [{k: 초당, v: 약 92건 (그대로)}]
                - label: 응답 시간
                  rows: [{k: 평균, v: 약 500 ms, mark: bad}, {k: p99, v: 약 660 ms, mark: bad}]
              verdict: '사용자가 다섯 배인데 처리량은 같고 응답 시간이 다섯 배예요.'
      - h3: 리틀의 법칙
      - p: '이 숫자들은 간단한 관계로 맞아떨어져요. **리틀의 법칙**이에요([설명](link:little)).'
      - code: little
      - p: '서버 안에서 동시에 처리할 수 있는 요청은 스레드 수인 10개예요. 요청 하나가 0.1초 걸리니, 1초에 끝낼 수 있는 요청은 10 ÷ 0.1 = **100건**이 한계예요. 사용자가 50명이면 서버 안팎에 요청 50개가 있는데 처리량이 100건으로 묶여 있으니, 응답 시간은 50 ÷ 100 = 0.5초가 돼요. 측정값의 평균 500ms와 같아요.'
      - p: '눈여겨볼 점은 **오류가 하나도 없었다**는 거예요. 한계를 넘긴 요청은 실패하지 않고 기다려요. 그래서 서버는 "멀쩡한데 느린" 모습이 돼요. 기다리는 시간이 클라이언트의 타임아웃을 넘으면 그제야 실패가 쌓여요. 인트로의 이벤트 날이 그랬어요.'
      - quiz:
          q: '스레드 10개, 요청마다 100ms인 서버에 동시 사용자를 20명에서 50명으로 늘렸어요. 처리량과 응답 시간은 어떻게 될까요?'
          options:
            - 처리량이 2.5배가 된다
            - 처리량은 초당 100건 가까이 그대로이고, 응답 시간이 길어진다
            - 둘 다 그대로다
          answer: 2
          explain: '스레드 10개가 0.1초씩 쓰니 초당 100건이 한계예요. 남는 요청은 기다려서 응답 시간만 늘어요.'
      - next: '한계가 스레드 10개 때문이라는 것은 어떻게 알았을까요? 실제 서버에서는 무엇을 보고 병목을 찾을까요?'
    recall: '사용자를 늘리면 처리량은 서버가 동시에 처리할 수 있는 만큼까지 늘다가 멈추고(포화), 그 뒤로는 남는 요청이 기다려서 응답 시간만 길어져요. 리틀의 법칙(서버 안의 요청 수 = 처리량 × 응답 시간)으로, 스레드 10개에 요청마다 0.1초면 한계는 초당 100건이고 50명이면 응답 시간이 0.5초예요. 오류 없이 느려지다가 타임아웃을 넘으면 실패가 돼요.'
  - id: q3
    title: 한계에 닿았을 때 병목은 어떻게 찾나요?
    conclusion:
      lead: '처리량이 멈춘 그때 가장 먼저 꽉 찬 자원을 지표로 찾아요. CPU가 노는데 느리면 무언가를 기다리고 있는 거예요.'
      sub: '병목을 넓히면 처리량이 늘지만, 다음으로 좁은 곳에서 다시 멈춰요. 병목은 없애는 것이 아니라 옮겨 가는 거예요.'
    says:
      - '예제의 서버는 CPU를 거의 안 쓴다. 스레드 10개가 모두 외부 API를 기다리며 잠들어 있다. 톰캣의 바쁜 스레드 수(지표)가 최대치에 붙어 있는 것을 측정 중에 읽어 보인다'
      - '스레드를 10개에서 50개로 늘리면 같은 부하에서 처리량이 늘고 응답 시간이 준다. 측정값을 비교한다'
      - '하지만 실제 서버라면 다음 병목이 나타난다: DB 커넥션 풀(D6), 외부 API의 한도, CPU. 스레드만 늘리면 커넥션을 기다리는 스레드가 늘 뿐이다(A11)'
      - '병목 후보의 지표: 톰캣 바쁜 스레드, 커넥션 풀의 대기 수(`hikaricp.connections.pending`), CPU, GC 시간. 처리량이 멈춘 시각에 무엇이 최대에 붙었는지 본다(T7)'
    asks:
      - '본문의 예시: 처리량이 멈췄는데 CPU는 20%다. 톰캣의 바쁜 스레드 수가 최대치에 붙어 있다. 병목은 (톰캣 스레드. 모두 무언가를 기다리고 있다)'
      - '옮긴 상황: 톰캣 스레드를 200개로 늘렸더니 처리량은 그대로이고 커넥션 풀의 대기 수가 치솟았다. 무슨 일인가 (병목이 커넥션 풀로 옮겨 갔다. 스레드가 커넥션을 기다린다)'
    body:
      - p: '질문 2의 서버는 CPU를 거의 쓰지 않아요. 요청마다 100ms 동안 외부 API를 기다리며 잠들어 있을 뿐이에요. 그런데도 한계에 닿았어요. 그때 무엇이 꽉 찼는지 봐야 해요. 사용자 50명으로 재는 도중에 톰캣의 바쁜 작업 스레드 수를 읽었어요. 위 측정값의 마지막 줄이에요: **10개 가운데 10개**가 바빴어요.'
      - p: '스레드가 모두 기다리는 일에 묶여 있으니, 새 요청은 빈 스레드가 날 때까지 톰캣의 대기열에서 기다렸어요. CPU가 노는데 느리면 이렇게 **무언가를 기다리는** 거예요. 병목은 톰캣 스레드예요. 스레드를 50개로 늘리고 같은 50명으로 다시 쟀어요.'
      - ci:
          key: threads
          label: 실제 측정값 보기
          source: LoadTestingTest.throughputSaturates
      - p: '처리량이 초당 90건 남짓에서 **450건**으로 다섯 배가 됐고, 응답 시간은 다시 110ms로 돌아왔어요. 병목을 넓혔더니 처리량이 늘었어요.'
      - h3: 병목은 옮겨 가요
      - p: '실제 서버라면 여기서 끝나지 않아요. 요청이 외부 API 대신 DB를 쓴다면 스레드 50개가 커넥션 풀(DB 커넥션과 커넥션 풀 레슨)의 커넥션 10개를 두고 기다리게 돼요. 이번에는 커넥션 풀이 병목이에요. 스레드만 200개로 늘리면 커넥션을 기다리는 스레드가 늘 뿐 처리량은 그대로예요(스레드 풀과 커넥션 풀 크기 레슨). 병목은 없애는 것이 아니라 다음 좁은 곳으로 **옮겨 가요**.'
      - table:
          head: [병목 후보, 볼 지표, 꽉 찬 모습]
          rows:
            - [톰캣 스레드, '바쁜 스레드 수 (`tomcat.threads.busy`)', 최대치에 붙어 있어요]
            - [DB 커넥션 풀, '대기 수 (`hikaricp.connections.pending`)', 0보다 커져요]
            - [CPU, 사용률, 100%에 가까워요]
            - [GC, 'GC 멈춤 시간 (`jvm.gc.pause`)', 처리량이 멈춘 때 같이 튀어요]
            - [외부 API, 그 호출의 응답 시간, 혼자 길어져요]
      - p: '처리량이 멈춘 시각에 이 가운데 무엇이 먼저 끝에 닿았는지를 로그와 모니터링 레슨의 지표로 봐요. 표의 지표 이름은 스프링 부트 액추에이터가 쓰는 이름이에요.'
      - quiz:
          q: '처리량이 멈췄는데 CPU는 20%이고, 톰캣의 바쁜 스레드 수가 최대치에 붙어 있어요. 병목은 무엇일까요?'
          options:
            - CPU
            - 톰캣 스레드. 모두 무언가를 기다리고 있다
            - 병목이 없다
          answer: 2
          explain: 'CPU가 노는데 스레드가 다 찼으면, 스레드들이 무언가(외부 호출, DB)를 기다리고 있어요.'
      - next: '이렇게 잰 숫자를 믿으려면 무엇을 지켜야 할까요?'
    recall: '처리량이 멈춘 시각에 가장 먼저 꽉 찬 자원이 병목이에요. 톰캣 바쁜 스레드, 커넥션 풀 대기 수, CPU, GC 멈춤, 외부 API의 응답 시간을 지표로 봐요. CPU가 노는데 스레드가 다 찼으면 무언가를 기다리는 거예요. 병목을 넓히면(스레드 10개를 50개로) 처리량이 늘지만, 다음으로 좁은 곳(커넥션 풀)에서 다시 멈춰요.'
  - id: q4
    title: 부하 테스트를 믿을 수 있게 하려면 무엇을 지켜야 하나요?
    conclusion:
      lead: '운영과 비슷한 환경과 데이터로, 워밍업을 마친 뒤, 부하를 만드는 쪽이 먼저 한계에 닿지 않게 재요.'
      sub: '목적에 따라 목표만큼(부하), 한계를 넘겨(스트레스), 오래(내구), 갑자기(스파이크) 보내는 방식을 골라요.'
    says:
      - '종류: 부하 테스트(목표만큼 보내 지키는지), 스트레스 테스트(한계를 넘겨 어떻게 무너지는지), 내구 테스트(몇 시간 보내 메모리가 새는지), 스파이크 테스트(갑자기 몰릴 때)'
      - '워밍업: 처음 몇 초의 요청은 JIT 전이라 느리다(T6 더 알아보기). 측정 첫 구간을 버리고 잰 값과 버리지 않은 값을 비교해 보인다'
      - '부하를 만드는 쪽도 자원을 쓴다. 클라이언트의 스레드나 CPU가 먼저 차면 서버의 한계가 아니라 클라이언트의 한계를 잰다'
      - '데이터: 테이블에 10건 있을 때와 1000만 건 있을 때 쿼리 시간이 다르다. 운영과 비슷한 양의 데이터로 잰다'
      - '더 알아보기: 닫힌 모델은 사용자 N명이 응답을 받아야 다음 요청을 보낸다. 서버가 느려지면 보내는 양도 줄어 문제가 작게 보인다. 실제 사용자는 서버가 느리다고 덜 오지 않는다. 도착률을 고정하는 열린 모델이 이것을 드러낸다'
    asks:
      - '본문의 예시: 서버를 띄운 직후부터 10초 동안 잰 평균 응답 시간이, 1분 뒤부터 잰 값보다 컸다. 왜인가 (처음 구간은 JIT 전이라 느리다. 워밍업 뒤부터 잰다)'
      - '옮긴 상황: 노트북 한 대로 부하를 보냈는데 노트북의 CPU가 100%였고 서버는 30%였다. 이 결과를 서버의 한계로 봐도 되나 (안 된다. 부하를 만드는 쪽이 먼저 한계에 닿았다)'
    body:
      - p: '목적에 따라 보내는 방식이 달라요.'
      - table:
          head: [종류, 보내는 방식, 알아내는 것]
          rows:
            - [부하 테스트, 목표한 양만큼, 목표를 지키는가]
            - [스트레스 테스트, 한계를 넘겨, '어디서 어떻게 무너지는가. 넘긴 뒤 회복하는가']
            - [내구 테스트, 보통 양을 몇 시간, '메모리가 새거나 커넥션이 쌓이는가(스레드 덤프와 힙 덤프 레슨)']
            - [스파이크 테스트, 갑자기 몰리게, '선착순 이벤트처럼 순간에 몰릴 때 버티는가']
      - h3: 워밍업 뒤에 재요
      - p: '서버를 띄운 직후의 요청은 느려요. CI/CD와 무중단 배포 레슨에서 본 대로 JVM이 클래스를 처음 읽고 JIT가 아직 코드를 기계어로 바꾸지 않았기 때문이에요. 질문 2의 측정 전에 따로 잰 워밍업 구간이에요.'
      - ci:
          key: warmup
          label: 실제 측정값 보기
          source: LoadTestingTest.throughputSaturates
      - p: '처음 0.5초 안의 요청은 400ms를 넘은 것도 있는데, 1초 뒤부터는 중앙값이 110ms예요. 처음 구간을 섞어 재면 서버가 실제보다 느려 보여요. 그래서 측정 전에 워밍업 구간을 두고 그 결과는 버려요. 질문 2의 표도 워밍업 뒤에 잰 값이에요.'
      - h3: 부하를 만드는 쪽이 먼저 지치지 않게
      - p: '부하를 만드는 프로그램도 CPU와 스레드, 네트워크를 써요. 노트북 한 대로 보냈더니 노트북의 CPU가 100%이고 서버는 30%라면, 잰 것은 서버의 한계가 아니라 **노트북의 한계**예요. 부하를 만드는 쪽의 자원도 함께 보고, 모자라면 여러 대로 나눠 보내요.'
      - h3: 운영과 비슷하게
      - p: '테이블에 10건 있을 때와 1000만 건 있을 때 같은 쿼리의 시간이 달라요(인덱스와 실행계획 레슨). 서버 사양, DB의 데이터 양, 외부 API의 응답 시간을 운영과 비슷하게 둬야 숫자가 운영에서도 맞아요.'
      - more:
          summary: '더 알아보기: 닫힌 모델과 열린 모델'
          body:
            - p: '이 레슨의 측정은 **닫힌 모델**이에요. 사용자 N명이 응답을 받아야 다음 요청을 보내요. 서버가 느려지면 보내는 양도 줄어서, 문제가 실제보다 작게 보여요. 실제 사용자는 서버가 느리다고 덜 오지 않아요. 초당 몇 건을 보낼지(도착률)를 고정하는 **열린 모델**로 재면, 한계를 넘는 순간 대기열이 끝없이 길어지는 모습이 드러나요([k6 문서](link:k6Open)).'
      - quiz:
          q: '노트북 한 대로 부하를 보냈더니 노트북 CPU는 100%, 서버 CPU는 30%였어요. 이 결과를 서버의 한계로 봐도 될까요?'
          options:
            - 된다
            - 안 된다. 부하를 만드는 쪽이 먼저 한계에 닿았다
            - 서버의 CPU가 30%이니 서버가 문제다
          answer: 2
          explain: '부하를 만드는 쪽이 지치면 서버가 아니라 그쪽의 한계를 재요. 그쪽 자원도 함께 봐요.'
    recall: '목적에 따라 부하(목표만큼), 스트레스(한계를 넘겨), 내구(오래), 스파이크(갑자기) 테스트를 골라요. 서버를 띄운 직후는 JIT 전이라 느리니 워밍업 구간을 두고 버려요. 부하를 만드는 쪽의 CPU와 스레드가 먼저 차면 서버가 아니라 그쪽의 한계를 재요. 서버 사양과 데이터 양을 운영과 비슷하게 둬요.'
practice:
  title: 실무에서는 이렇게 써요
  says:
    - 'k6 스크립트 예: 단계별로 사용자를 늘리고(`stages`), 통과 기준(`thresholds`)으로 p99를 건다. CI에 넣으면 기준을 넘을 때 실패한다 (k6 문서 근거. 도구를 설치하지 않으므로 테스트로 돌리지 않는다고 밝힌다)'
    - '톰캣 스레드 수(`server.tomcat.threads.max`, 기본 200), 접속 대기열(`server.tomcat.accept-count`, 기본 100), 최대 연결 수(`server.tomcat.max-connections`)의 뜻 (스프링 부트 문서 근거, 스레드 수의 효과는 질문 3의 테스트)'
    - '흔한 실수 하나: 평균 응답 시간만 보고 통과시킨다. 질문 2의 표처럼 p99가 몇 배다. 기준을 백분위로 건다'
    - '흔한 실수 둘: 로컬 PC에서 서버와 부하 도구를 함께 돌려 잰다. 둘이 CPU를 나눠 써서 숫자가 운영과 다르다. 운영과 같은 사양의 서버와 따로 떨어진 부하 머신을 쓴다'
  body:
    - p: '실무에서는 직접 자바로 짜지 않고 부하 테스트 도구로 시나리오를 써요. k6는 자바스크립트로 시나리오를 쓰는 도구예요. 아래 스크립트는 1분 동안 사용자를 50명까지 늘리고 3분 동안 유지하면서, p99가 300ms를 넘으면 실패로 판정해요([k6 문서](link:k6Thresholds)). 이 저장소는 k6를 설치하지 않아서 이 스크립트는 돌려 보지 않았고, 문서가 근거예요.'
    - code: k6
    - p: '통과 기준(`thresholds`)을 두면 결과가 통과와 실패로 나와서 CI에 넣을 수 있어요. 질문 1의 "숫자로 정한 목표"가 이 한 줄이에요. JMeter, nGrinder, Gatling도 같은 일을 해요.'
    - h3: 톰캣의 설정
    - code: tomcatProps
    - p: '`threads.max`는 요청을 처리하는 작업 스레드의 최대 수(기본 200), `accept-count`는 스레드가 모두 바쁠 때 연결을 받아 둘 대기열의 길이(기본 100), `max-connections`는 동시에 열어 둘 연결의 최대 수예요([스프링 부트 설정 문서](link:bootProps)). 스레드 수를 바꾸면 처리량이 어떻게 바뀌는지는 질문 3의 측정이 근거예요. 질문 3대로 스레드를 늘리기 전에 그다음 병목(커넥션 풀)부터 봐요.'
    - h3: '흔한 실수: 평균으로 통과시킨다'
    - p: '로그와 모니터링 레슨에서 본 대로 평균은 느린 요청을 숨겨요. 통과 기준은 p95, p99로 걸어요.'
    - h3: '흔한 실수: 한 PC에서 서버와 도구를 함께 돌린다'
    - p: '서버와 부하 도구가 CPU를 나눠 써서, 질문 4의 "부하를 만드는 쪽이 먼저 지치는" 일이 생기고 숫자가 운영과 달라요. 운영과 같은 사양의 서버를 두고, 부하는 떨어진 다른 머신에서 보내요.'
interview:
  question: '부하 테스트를 어떻게 하고, 결과로 무엇을 알아내는지 설명해 주세요'
  model:
    - label: 정의
      text: 부하 테스트는 서버에 많은 요청을 보내 목표한 처리량을 목표한 응답 시간 안에 처리하는지, 한계가 어디인지, 병목이 무엇인지 알아내는 테스트입니다. 목표는 초당 몇 건을 p99 몇 ms 안에처럼 숫자로 정합니다.
    - label: 원리
      text: 사용자를 늘리면 처리량은 동시에 처리할 수 있는 만큼까지 늘다가 멈추고, 그 뒤로는 기다리는 시간 때문에 응답 시간만 늘어납니다. 리틀의 법칙으로 서버 안의 요청 수는 처리량 곱하기 응답 시간입니다. 한계에서 가장 먼저 찬 자원(스레드, 커넥션 풀, CPU)이 병목입니다.
    - label: 주의할 점
      text: 워밍업 뒤에 재고, 부하를 만드는 쪽이 먼저 지치지 않게 하고, 운영과 비슷한 데이터와 사양으로 잽니다. 병목을 넓히면 다음 병목으로 옮겨 갈 뿐이라 스레드만 늘리면 커넥션을 기다리게 됩니다. 평균이 아니라 백분위로 판정합니다.
    - label: 경험
      text: '(내 프로젝트로 채우기) 예: 이벤트 전에 k6로 재 보니 초당 300건에서 처리량이 멈췄고, CPU는 낮고 커넥션 풀 대기가 늘어 커넥션을 오래 잡는 쿼리를 고쳤습니다.'
verified: '처리량과 응답 시간, 바쁜 스레드 수, 워밍업은 스프링 부트 3.5의 내장 톰캣을 스레드 10개와 50개로 띄우고 가상 스레드로 요청을 보내 실제로 쟀어요. 시간은 실행할 때마다 조금씩 달라요. k6와 톰캣 설정의 뜻은 공식 문서가 근거예요. 코드가 바뀔 때마다 테스트([LoadTestingTest](link:test))가 다시 돌아요.'
footer: '근거: 리틀의 법칙은 [Little (1961)과 그 설명](link:little), 톰캣 설정은 [스프링 부트 설정 문서](link:bootProps), k6의 통과 기준은 [k6 문서](link:k6Thresholds), 닫힌 모델과 열린 모델은 [k6 문서](link:k6Open). 오류는 [GitHub 이슈](https://github.com/wanja727/dev-lessons/issues)로 알려 주세요.'
claims:
  - claim: '톰캣 스레드 10개, 요청마다 100ms인 서버의 처리량은 동시 사용자 10명 근처에서 초당 100건 가까이로 멈추고, 그 뒤로 응답 시간만 늘어난다'
    how: '`server.tomcat.threads.max=10`인 서버를 띄우고, 가상 스레드로 동시 사용자 N명이 3초 동안 요청을 보내 처리량, 평균, p99를 잰다. 단정은 "50명의 처리량이 10명의 1.3배를 넘지 않는다", "50명의 p99와 평균이 더 크다"처럼 흔들림에 견디게 한다'
    test: LoadTestingTest.throughputSaturates
  - claim: '같은 부하에서 스레드를 50개로 늘리면 처리량이 늘고 응답 시간이 준다'
    how: '같은 방법으로 스레드 수만 바꿔 잰다. 처리량이 두 배를 넘는 것만 단정한다'
    test: LoadTestingTest.throughputSaturates
  - claim: '측정 중 톰캣의 바쁜 스레드 수가 최대치(10)에 붙어 있다'
    how: '톰캣 작업 스레드 풀의 `getActiveCount`를 측정 중에 읽는다'
    test: LoadTestingTest.throughputSaturates
  - claim: '서버를 띄운 직후의 첫 구간은 워밍업 뒤 구간보다 응답 시간이 길다'
    how: '처음 0.5초의 최댓값과 1초 뒤의 p50을 비교한다'
    test: LoadTestingTest.throughputSaturates
sources:
  - '리틀의 법칙: Little, J. D. C. (1961), A Proof for the Queuing Formula L = λW https://doi.org/10.1287/opre.9.3.383'
  - '톰캣 스레드와 대기열 설정: 스프링 부트 공통 설정 https://docs.spring.io/spring-boot/appendix/application-properties/index.html#appendix.application-properties.server'
  - 'k6의 단계와 통과 기준: https://grafana.com/docs/k6/latest/using-k6/thresholds/'
  - '열린 모델과 닫힌 모델: k6 문서 https://grafana.com/docs/k6/latest/using-k6/scenarios/concepts/open-vs-closed/'
