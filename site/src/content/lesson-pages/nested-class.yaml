# 중첩 클래스와 익명 클래스
# 자료 파일의 칸은 docs/lesson-data-format.md에 있다. 문제는 content/questions/nested-class.yaml에 있다.
title: 중첩 클래스와 익명 클래스
description: 클래스 안에 클래스를 선언하는 네 가지 방법, 내부 클래스와 static 중첩 클래스의 차이, 내부 클래스가 바깥 객체를 붙잡을 때 생기는 문제, 익명 클래스와 람다의 차이. 네 가지 질문에 스스로 답할 수 있게, 주문과 주문 상품과 리스너로 배우는 대화형 레슨.
unit: 자바 언어
minutes: 20
roadmap: J16
type: 자바 실행
prerequisites:
  - {slug: inheritance-polymorphism, title: 상속과 다형성}
  - {slug: lambda, title: 람다와 함수형 인터페이스}
assume: '자바 21(OpenJDK의 javac). static이 붙은 것은 객체가 아니라 클래스에 딸려 있다는 것(static과 초기화 순서 레슨). 람다는 함수형 인터페이스의 구현이고 지역 변수를 잡을 때 사실상 final이어야 한다는 것(람다와 함수형 인터페이스 레슨). 닿을 수 있는 객체는 치워지지 않는다는 것(가비지 컬렉션 레슨).'
example: '주문 `Order`와 그 안에 선언한 주문 상품 `Item`, 그리고 주문이 바뀔 때 불리는 리스너. `Item`을 static으로 선언할 때와 아닐 때, 리스너를 익명 클래스로 쓸 때와 람다로 쓸 때를 견줘요. 실무 구역에서는 요청 DTO 안에 선언한 클래스로 옮겨요.'
intro:
  - '주문 요청 DTO 안에 상품 한 줄을 나타내는 클래스를 선언했어요. 컴파일은 됐는데, 요청이 오면 Jackson이 "내부 클래스의 객체를 만들 수 없다"는 예외를 던지고 서버가 500으로 답해요. 클래스 선언 앞에 `static` 한 단어가 빠져 있었어요.'
  - '클래스 안에 클래스를 선언하는 코드는 스프링 프로젝트에 흔해요. 응답 DTO 안의 작은 DTO, 빌더, `@Configuration` 안의 설정 클래스, 테스트의 `@Nested`가 그래요. `static`을 붙이느냐에 따라 그 클래스의 객체가 바깥 객체를 붙잡는지가 갈리고, 프레임워크가 그 객체를 만들 수 있는지도 갈려요.'
  - '이 레슨에서는 내부 클래스의 객체가 바깥 객체의 참조를 숨겨서 가진다는 것을 코드를 돌려 확인하고, 익명 클래스와 람다가 겉은 비슷해도 무엇이 다른지 봐요.'
covers:
  - topic: '클래스 안에 선언하는 네 가지: static 중첩 클래스, 내부 클래스, 지역 클래스, 익명 클래스'
    where: '질문 1'
  - topic: '중첩해서 선언하는 이유: 한 클래스에서만 쓰는 타입을 그 안에 두고, 바깥의 private 멤버에 닿는다'
    where: '질문 1'
  - topic: '컴파일하면 Outer$Inner.class처럼 따로 클래스 파일이 생긴다. 중첩된 record, enum, 인터페이스는 언제나 static이다'
    where: '질문 1의 더 알아보기'
  - topic: '내부 클래스의 객체는 바깥 객체가 있어야 만들어지고, 바깥 객체의 참조를 가진다. 그래서 바깥의 인스턴스 필드를 바로 쓴다'
    where: '질문 2'
  - topic: 'static 중첩 클래스의 객체는 바깥 객체 없이 만들어지고 바깥의 인스턴스 필드를 쓸 수 없다'
    where: '질문 2'
  - topic: '바깥 객체가 필요 없으면 static으로 선언한다'
    where: '질문 2'
  - topic: '내부 클래스의 객체가 오래 살면 바깥 객체도 치워지지 않는다(메모리 누수)'
    where: '질문 3'
  - topic: '자바 18부터 javac는 바깥 객체를 쓰지 않는 내부 클래스에 참조를 넣지 않는다'
    where: '질문 3의 더 알아보기'
  - topic: '익명 클래스: 이름 없이 선언과 동시에 객체를 만든다. 인터페이스나 클래스를 그 자리에서 구현한다'
    where: '질문 4'
  - topic: '익명 클래스와 람다의 차이: this가 가리키는 것, 변수 이름을 가릴 수 있는가, 메서드가 여럿인 타입도 되는가, 필드를 가질 수 있는가'
    where: '질문 4'
  - topic: '지역 변수를 잡을 때의 사실상 final 규칙은 둘이 같다'
    where: '질문 4'
  - topic: '스프링에서: DTO 안의 중첩 클래스와 Jackson, 중첩된 record'
    where: '실무에서는'
  - topic: '이중 중괄호 초기화가 익명 클래스를 만든다는 것'
    where: '실무에서는'
  - topic: 'JUnit의 @Nested가 내부 클래스인 이유, @Configuration 안의 static 클래스'
    where: '실무에서는의 더 알아보기. 테스트 구조는 단위 테스트와 테스트 더블(T2)'
  - topic: 'static 중첩 클래스로 만드는 빌더'
    where: '다루지 않음: 빌더 패턴(O10)'
  - topic: 'static 중첩 클래스로 초기화를 미루는 싱글톤'
    where: '다루지 않음: 싱글톤 패턴(O11)'
  - topic: '람다의 문법과 함수형 인터페이스'
    where: '다루지 않음: 람다와 함수형 인터페이스(J12)'
  - topic: '닿을 수 있는 객체와 메모리 누수의 원리'
    where: '다루지 않음: 가비지 컬렉션(J15)'
codes:
  predict: |-
    class Order {
      String name = "주문";

      void run() {
        Runnable a = new Runnable() {
          String name = "익명";
          public void run() {
            print(this.name);
          }
        };
        Runnable b = () -> print(this.name);

        a.run();
        b.run();
      }
    }
  four: |-
    class Order {
      static class Line { }   // static 중첩
      class Item { }          // 내부 클래스

      void run() {
        class Step { }        // 지역 클래스
        Runnable r =
            new Runnable() {  // 익명 클래스
              public void run() { }
            };
      }
    }
  inner: |-
    class Order {
      private int total = 10000;

      class Item {
        int share() { return [[total]] / 2; }
      }

      static class Line {
        // total을 쓸 수 없다
      }
    }

    Order order = new Order();
    Order.Item item = [[order.new Item()]];
    Order.Line line = new Order.Line();
  fieldsRun: |-
    Order.Item.class.getDeclaredFields();
    Order.Line.class.getDeclaredFields();
  newOutside: |-
    // Order 밖, 바깥 객체가 없는 곳
    static void make() {
      new Order.Item();
      new Order.Line();
    }
  teamMember: |-
    class Team {
      String name;

      static class Member {
        String label() {
          return [[name]];
        }
      }
    }
  listener: |-
    class Order {
      byte[] data = new byte[10_000_000];

      class Watcher implements Runnable {
        public void run() {
          print([[data]].length);
        }
      }
    }

    static List<Runnable> watchers =
        new ArrayList<>();

    Order order = new Order();
    watchers.add(order.new Watcher());
    order = null;
  listenerFixed: |-
    class Order {
      byte[] data = new byte[10_000_000];

      [[static]] class Watcher
          implements Runnable {
        private final int size;
        Watcher(int size) {
          this.size = size;
        }
        public void run() { print(size); }
      }
    }

    watchers.add(
        new Order.Watcher(order.data.length));
    order = null;
  listenerRun: |-
    // 두 방법으로 각각 등록하고
    // order = null 뒤 GC를 요청한다
  outerThis: |-
    Runnable a = new Runnable() {
      String name = "익명";
      public void run() {
        print([[Order.this.name]]);
      }
    };
  shadow: |-
    int count = 1;

    // 람다
    Runnable r1 = () -> {
      int count = 2;
    };

    // 익명 클래스
    Runnable r2 = new Runnable() {
      public void run() {
        int count = 2;
      }
    };
  dtoInner: |-
    class OrderRequest {
      public List<Line> lines;

      class Line {
        public String name;
        public int qty;
      }
    }
  dtoRun: |-
    POST /orders
    {"lines":[{"name":"펜","qty":2}]}
  dtoFixed: |-
    record OrderRequest(List<Line> lines) {
      record Line(String name, int qty) { }
    }

    // 클래스로 둔다면
    class OrderRequest {
      public List<Line> lines;

      [[static]] class Line { ... }
    }
  doubleBrace: |-
    Map<String, Integer> m =
        new HashMap<String, Integer>() [[{{]]
          put("A", 1);
        }};
  mapOf: |-
    Map<String, Integer> m = Map.of("A", 1);
  nestedTest: |-
    class OrderServiceTest {
      OrderService service = new OrderService();

      [[@Nested]]
      class 결제한_주문은 {
        @Test
        void 취소할_수_있다() {
          // 바깥의 service를 쓴다
        }
      }
    }
