# CI/CD와 무중단 배포
# 자료 파일의 칸은 docs/lesson-data-format.md에 있다. 문제는 content/questions/ci-cd-deploy.yaml에 있다.
title: CI/CD와 무중단 배포
description: CI가 자동으로 확인하는 것, CD가 자동으로 하는 것, 서버를 멈추지 않고 새 버전으로 바꾸는 방법, 서버를 끌 때 처리 중이던 요청, 두 버전이 함께 도는 동안 지킬 것. 다섯 가지 질문에 스스로 답할 수 있게 주문 서버와 이 저장소의 워크플로로 배우는 대화형 레슨.
unit: 테스트와 운영
minutes: 25
roadmap: T6
type: 개념 설명
prerequisites:
  - {slug: git-branch-merge, title: Git 브랜치와 병합}
  - {slug: docker-container, title: 도커와 컨테이너}
  - {slug: testcontainers, title: 통합 테스트와 Testcontainers}
assume: '스프링 부트 3.5, 깃허브 액션. 브랜치와 PR(Git 브랜치와 병합 레슨), 이미지와 컨테이너(도커와 컨테이너 레슨), 테스트를 자동으로 돌릴 수 있다는 것(통합 테스트와 Testcontainers 레슨). 로드 밸런서는 질문 3에서 한 문장으로 설명해요.'
example: '주문 서버 `order-api`. 서버 두 대가 로드 밸런서 뒤에 있고, `main`에 합치면 깃허브 액션이 테스트하고 이미지를 만들어 배포해요. 이 저장소 자신의 `.github/workflows`도 예로 써요.'
intro:
  - '금요일 오후에 배포하려고 서버에 접속해 `git pull`, 빌드, 재시작을 손으로 하다가 빌드가 깨진 걸 늦게 알았어요. 서버를 재시작하는 30초 동안 결제 요청이 502로 실패했고요. 사람 손으로 하는 배포는 빠뜨리고, 멈추고, 되돌리기 어려워요.'
  - 'CI/CD는 코드를 합칠 때마다 빌드와 테스트를 자동으로 돌리고(CI), 통과한 것을 자동으로 배포하는 것(CD)이에요. 백엔드 개발자는 워크플로 파일을 쓰고, 테스트가 실패하면 합치지 않고, 배포하는 동안에도 요청이 끊기지 않게 서버를 바꾸는 방법을 골라요. 스프링 서버가 처리하던 요청을 마치고 꺼지게 하는 설정도 개발자 몫이에요.'
  - '이 레슨에서는 이 저장소의 실제 워크플로를 읽고, 스프링 부트 서버를 처리 중인 요청이 있는 채로 꺼 보며 "그냥 끄기"와 "우아하게 끄기"의 차이를 실제로 돌려서 확인해요. 배포 방식 자체는 도구마다 달라서 공식 문서를 근거로 설명해요.'
covers:
  - topic: 'CI(지속적 통합): 코드를 합칠 때마다 자동으로 빌드하고 테스트해, `main`이 늘 돌아가는 상태를 지킨다. 실패하면 합치지 않는다'
    where: '질문 1'
  - topic: '깃허브 액션의 워크플로: 이벤트(`on: push`, `pull_request`), 잡, 단계, 실행기(`runs-on`). 경로 필터'
    where: '질문 1'
  - topic: 'CI에서 테스트를 돌리면 "제 PC에서는 됐는데"가 없어진다. 깨끗한 환경에서 매번 처음부터 돈다'
    where: '질문 1'
  - topic: 'CD: 지속적 전달(배포할 수 있는 결과물을 자동으로 만들고, 배포는 사람이 누른다)과 지속적 배포(통과하면 운영까지 자동)'
    where: '질문 2'
  - topic: '빌드 결과물(jar, 이미지)은 한 번 만들고 그것을 검증 환경과 운영에 똑같이 배포한다. 환경마다 다른 것은 설정으로 넘긴다'
    where: '질문 2'
  - topic: '잡의 의존(`needs`)으로 테스트가 통과해야 배포가 돌게 한다. 비밀 값은 저장소의 시크릿으로 넘긴다'
    where: '질문 2'
  - topic: '서버를 그냥 내리고 올리면 그동안 요청이 실패한다. 로드 밸런서 뒤의 서버를 하나씩 바꾸면 멈추지 않는다'
    where: '질문 3'
  - topic: '롤링 배포, 블루그린 배포, 카나리 배포의 동작과 장단점(자원, 되돌리는 속도, 옛 버전과 새 버전이 함께 도는지)'
    where: '질문 3'
  - topic: '서버를 끌 때 처리 중인 요청: 스프링 부트의 우아한 종료(`server.shutdown=graceful`, 3.4부터 기본)는 새 요청을 받지 않고 처리 중인 요청을 끝낸 뒤 꺼진다. 기다리는 한도는 `spring.lifecycle.timeout-per-shutdown-phase`'
    where: '질문 4'
  - topic: '로드 밸런서가 요청을 보내도 되는지 묻는 헬스 체크와 준비 상태(readiness), 액추에이터의 `/actuator/health/readiness`'
    where: '질문 4'
  - topic: '배포 직후 JVM이 클래스를 처음 읽고 JIT가 컴파일하기 전이라 첫 요청들이 느리다. 워밍업을 마친 뒤 트래픽을 받게 한다'
    where: '질문 4의 더 알아보기 (자바 언어 과정의 자바 프로그램이 실행되는 과정(J1)이 넘긴 항목)'
  - topic: '롤링과 블루그린에서는 옛 버전과 새 버전이 함께 돈다. DB 스키마와 API를 두 버전이 다 받게 바꾼다(늘리고, 옮기고, 줄이기)'
    where: '질문 5'
  - topic: '문제가 생기면 옛 이미지로 되돌린다(롤백). 되돌릴 수 있으려면 DB 변경도 옛 버전과 맞아야 한다'
    where: '질문 5'
  - topic: '기능 플래그로 배포와 기능 공개를 떼어 놓기'
    where: '질문 5의 더 알아보기'
  - topic: '테이블을 고치는 마이그레이션 도구(Flyway)와 큰 테이블을 멈추지 않고 고치는 법'
    where: '다루지 않음: 스키마 변경과 마이그레이션(D16)'
  - topic: '컨테이너 여러 대를 관리하는 쿠버네티스의 롤링 업데이트와 프로브'
    where: '질문 4에서 이름만 든다. 사용법은 다루지 않음: 특정 도구의 사용법은 로드맵의 "다루지 않는 것"'
  - topic: '배포 뒤에 지표와 로그로 이상을 알아채기'
    where: '다루지 않음: 로그와 모니터링(T7)'
links:
  test: https://github.com/wanja727/dev-lessons/blob/main/verification/src/test/java/lab/devlessons/cicd/GracefulShutdownTest.java
