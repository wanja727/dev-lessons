  fowlerCd: https://martinfowler.com/bliki/ContinuousDelivery.html
  ghSyntax: https://docs.github.com/en/actions/writing-workflows/workflow-syntax-for-github-actions
  blueGreen: https://martinfowler.com/bliki/BlueGreenDeployment.html
  canary: https://martinfowler.com/bliki/CanaryRelease.html
