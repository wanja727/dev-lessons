# 동적 쿼리
# 자료 파일의 칸은 docs/lesson-data-format.md에 있다. 문제는 content/questions/dynamic-query.yaml에 있다.
title: 동적 쿼리
description: 조건이 바뀌는 조회를 JPQL 문자열로 만들면 무엇이 문제인지, Specification은 동적 쿼리를 어떻게 만드는지, Querydsl은 무엇이 다른지, 무엇으로 만들지. 네 가지 질문에 스스로 답할 수 있게, 선택 조건이 셋인 상품 검색을 세 방법으로 만들어 보는 대화형 레슨.
unit: JPA
minutes: 15
roadmap: P11
type: 동작 확인
prerequisites:
  - {slug: jpa-basics, title: ORM과 JPA}
assume: '스프링 부트 3.5, Hibernate 6.6, PostgreSQL 16. JPQL과 메서드 이름 쿼리(ORM과 JPA 레슨), 람다(람다 레슨). SQL 인젝션이 무엇인지(웹 보안 기초 레슨).'
example: '상품 검색 화면. 이름, 최소 가격, 카테고리 조건이 모두 선택이다. 들어온 조건만 WHERE에 넣는 조회를 세 방법으로 만들어 나간 SQL을 견준다.'
intro:
  - '상품 검색 화면에 조건이 셋 있어요. 이름만 넣을 때, 가격만 넣을 때, 셋 다 넣을 때마다 메서드를 만들면 여덟 개가 필요해요. 그래서 JPQL 문자열을 if문으로 이어 붙였더니, 빈칸 하나를 빠뜨려 `whereprice` 같은 쿼리가 나갔어요.'
  - '조건에 따라 모양이 바뀌는 쿼리를 동적 쿼리라고 해요. 스프링 개발자는 JPQL 문자열, Criteria API와 스프링 데이터의 Specification, Querydsl 가운데 하나로 만들어요. 면접에서는 "동적 쿼리는 어떻게 만드나요"와 "Querydsl을 왜 쓰나요"를 물어요.'
  - '이 레슨에서는 같은 검색을 세 방법으로 만들고, 조건 조합마다 나간 SQL과 컴파일러가 잡아 주는 실수를 견줘요.'
covers:
  - topic: '조건이 선택이면 메서드 이름 쿼리는 조합마다 메서드가 필요하다. 동적 쿼리는 들어온 조건만 WHERE에 넣는다'
    where: '질문 1'
  - topic: 'JPQL 문자열을 이어 붙이면 빈칸과 and를 손으로 맞춰야 하고, 실수는 실행할 때 드러난다'
    where: '질문 1'
  - topic: '값을 문자열에 직접 이으면 인젝션이 된다. 값은 늘 파라미터로 넘긴다'
    where: '질문 1. 원리는 웹 보안 기초(N10)'
  - topic: 'Criteria API는 JPA 표준으로 쿼리를 객체로 만든다. 스프링 데이터의 Specification이 조건 하나를 람다로 감싸 and로 잇게 한다'
    where: '질문 2'
  - topic: 'null 조건은 건너뛰는 Specification을 만들면 조합을 메서드 하나로 처리한다'
    where: '질문 2'
  - topic: 'Querydsl은 엔티티에서 만든 Q 클래스로 쿼리를 자바 코드로 쓴다. 필드 이름의 오타가 컴파일 오류가 된다'
    where: '질문 3'
  - topic: 'Querydsl의 BooleanBuilder나 null을 무시하는 where로 조건을 고른다'
    where: '질문 3'
  - topic: 'Querydsl은 빌드에 코드 생성 설정이 필요하다'
    where: '실무에서는'
  - topic: '고르는 기준: 조건이 적으면 JPQL과 메서드 이름 쿼리, 조합이 많으면 Specification이나 Querydsl'
    where: '질문 4'
  - topic: '페이징과 정렬을 함께 쓰기'
    where: '다루지 않음: 페이지네이션(D8)'
links:
  test: https://github.com/wanja727/dev-lessons/blob/main/verification/src/test/java/lab/devlessons/dynamicquery/DynamicQueryTest.java
  specs: https://docs.spring.io/spring-data/jpa/reference/jpa/specifications.html
  querydsl: http://querydsl.com/static/querydsl/latest/reference/html/
codes:
  injection: |-
    String jpql = "select p from Product p"
        + " where p.name = '" + name + "'";

    // name이 x' or '1'='1 이면
    // where p.name = 'x' or '1'='1'
  specs: |-
    Specification<Product> spec =
        Specification.allOf(
            nameIs(name),
            priceAtLeast(minPrice),
            categoryIs(category));
    List<Product> result =
        repository.findAll(spec);
  repo: |-
    public interface ProductRepository
        extends JpaRepository<Product, Long>,
            [[JpaSpecificationExecutor]]<Product> {
    }
  querydsl: |-
    List<Product> result = query
        .selectFrom(product)
        .where(nameEq(name),
            priceGoe(minPrice),
            categoryEq(category))
        .fetch();

    BooleanExpression priceGoe(Integer min) {
      return min == null ? null
          : product.price.goe(min);
    }
  gradle: |-
    def qd = 'com.querydsl'
    def jp = 'jakarta.persistence'

    dependencies {
      implementation
        "$qd:querydsl-jpa:5.1.0:jakarta"
      annotationProcessor
        "$qd:querydsl-apt:5.1.0:jakarta"
      annotationProcessor
        "$jp:jakarta.persistence-api"
    }
  factory: |-
    @Bean
    JPAQueryFactory jpaQueryFactory(
        EntityManager em) {
      return new JPAQueryFactory(em);
    }
  predict: |-
    String jpql = "select p from Product p";
    if (name != null) {
      jpql += " where p.name = :name";
    }
    if (minPrice != null) {
      jpql += " and p.price >= :min";
    }
  spec: |-
    static Specification<Product> nameIs(
        String name) {
      return (root, q, cb) -> name == null
          ? null
          : cb.equal(root.get("name"), name);
    }
predict:
  title: 이 JPQL은 제대로 돌아갈까요?
  text: '조건이 있을 때만 JPQL을 이어 붙여요. 이름은 비우고 최소 가격만 10000으로 넣었어요. 이 쿼리는 어떻게 될까요? 답은 질문 1에 나와요.'
  code: predict
  label: 내 예측
  options:
    - {value: ok, label: 가격 조건만 붙어 잘 돈다}
    - {value: broken, label: 쿼리가 깨져 실행할 때 오류가 난다}
    - {value: all, label: 조건 없이 모든 상품을 가져온다}
  answer: broken
  storageKey: dq-predict
  wrong: 예측은 "{label}"였어요. 틀린 예측이 더 오래 남으니 괜찮아요.
questions:
  - id: q1
    title: 조건이 바뀌는 조회를 JPQL 문자열로 만들면 무엇이 문제인가요?
    conclusion:
      lead: '조합마다 `where`와 `and`, 빈칸을 손으로 맞춰야 해서 실수하기 쉽고, 실수는 실행해야 드러나요.'
      sub: '값까지 문자열에 이으면 SQL 인젝션이 돼요. 값은 늘 파라미터로 넘겨요.'
    says:
      - '조건 셋이 모두 선택이면 조합이 8가지다. 메서드 이름 쿼리로는 메서드 8개가 필요하다'
      - '코드 predict에 가격만 넣으면 `select p from Product p and p.price >= :min`이 된다. 실행하면 Hibernate가 구문 오류를 던진다. 테스트로 보인다'
      - '`where 1=1`을 앞에 두는 꼼수가 있지만 순서와 빈칸은 여전히 손으로 맞춘다'
      - '`" where p.name = ''" + name + "''"`처럼 값을 이으면 입력이 쿼리가 된다. 따옴표가 든 이름으로 조건이 풀리는 것을 테스트로 보인다. 파라미터로 넘기면 값으로만 쓰인다'
    asks:
      - '본문의 예시: 코드 predict에 이름만 넣으면 쿼리는 정상인가 (정상이다. where가 붙는다)'
      - '옮긴 상황: 검색어를 `"... where p.name like ''%" + keyword + "%''"`로 이었다. 무엇이 위험한가 (검색어에 따옴표와 조건을 넣어 쿼리를 바꿀 수 있다. 파라미터로 넘긴다)'
    body:
      - p: '상품 검색에 이름, 최소 가격, 카테고리 조건이 있고 모두 선택이에요. 조합은 2 × 2 × 2 = 8가지예요. [메서드 이름 쿼리](lesson:jpa-basics)로는 `findByName`, `findByPriceGreaterThanEqual`, `findByNameAndCategory`처럼 조합마다 메서드가 필요해요. 이렇게 들어온 조건에 따라 모양이 바뀌는 쿼리를 **동적 쿼리**라고 해요.'
      - p: '가장 먼저 떠오르는 방법은 JPQL 문자열을 if문으로 이어 붙이는 거예요. 처음 예측한 코드가 그래요.'
      - ci:
          key: concat
          label: 실제 결과 보기
          source: DynamicQueryTest.concatenatedJpqlBreaks
          code: predict
      - p: '쿼리가 **깨졌어요**. {{predict-result}} 이름이 없으니 `where`가 붙지 않았는데, 가격 조건이 `and`로 이어졌어요. Hibernate가 JPQL을 읽다가 구문 오류를 던졌어요.'
      - p: '조합마다 `where`, `and`, 빈칸을 손으로 맞춰야 해요. 앞에 `where 1=1`을 두는 꼼수도 있지만, 순서와 빈칸은 여전히 손으로 맞추고, **실수는 그 조합으로 실행해 봐야** 드러나요.'
      - h3: 값까지 이으면 더 위험해요
      - code: injection
      - ci:
          key: injection
          label: 실제 결과 보기
          source: DynamicQueryTest.injection
      - p: '이름 자리에 따옴표가 든 입력을 넣었더니 조건이 풀려 **모든 상품**이 나왔어요. 입력이 쿼리의 일부가 됐거든요. JPQL도 SQL처럼 인젝션이 돼요. 같은 입력을 파라미터(`:name`)로 넘기면 값으로만 쓰여서 0개예요. 값은 늘 파라미터로 넘겨요. 원리는 웹 보안 기초 레슨(N10)에서 다뤄요.'
      - quiz:
          q: '처음 코드에 이름만 넣고 최소 가격은 비웠어요. 만들어지는 JPQL은?'
          options:
            - '`... where p.name = :name` (정상)'
            - '`... and p.price >= :min` (깨짐)'
            - '`...` (조건 없음)'
          answer: 1
          explain: '이름이 있어서 `where`가 붙고, 가격은 비어 `and`가 붙지 않아요. 이 조합만 시험했다면 문제를 못 찾아요.'
      - next: '손으로 이어 붙이지 않고 조건을 하나씩 조립할 수는 없을까요?'
    recall: '조합마다 `where`와 `and`, 빈칸을 손으로 맞춰야 해서 실수하기 쉽고, 실수는 그 조합으로 실행해야 드러나요. 이름 없이 가격만 넣으면 `where` 없이 `and`가 붙어 구문 오류가 났어요. 값까지 문자열에 이으면 따옴표가 든 입력이 조건을 풀어 버리는 인젝션이 돼서, 값은 늘 파라미터로 넘겨요.'
  - id: q2
    title: Specification은 동적 쿼리를 어떻게 만드나요?
    conclusion:
      lead: '조건 하나를 Specification 하나로 만들고, 들어온 것만 `and`로 이어요.'
      sub: '조건 값이 null이면 null을 돌려주는 Specification은 스프링 데이터가 건너뛰어서, 메서드 하나로 모든 조합을 처리해요.'
    says:
      - 'Criteria API는 JPA 표준으로 쿼리를 객체로 만든다. Specification은 그중 WHERE 조건 하나를 `(root, query, cb) -> Predicate` 람다로 감싼다(람다 레슨)'
      - '코드 spec. 이름, 최소 가격, 카테고리 Specification 셋을 `where(...).and(...)`로 잇고 `findAll(spec)`을 부른다. 리포지토리는 `JpaSpecificationExecutor`를 상속한다'
      - '조합 넷(조건 없음, 이름만, 가격만, 셋 다)에서 나간 SQL을 실제 출력으로 보인다. 들어온 조건만 WHERE에 있다'
      - '`root.get("name")`은 문자열이라 필드 이름 오타가 실행할 때 드러난다'
    widget:
      kind: toggle
      note: '조건 셋을 켜고 끄면 나가는 SQL의 WHERE 절이 바뀐다. 테스트에서 얻은 SQL 넷을 장면으로 둔다'
    asks:
      - '본문의 예시: 이름은 null, 최소 가격은 10000, 카테고리는 null로 검색했다. WHERE 절에 들어가는 조건은 (가격 조건 하나)'
      - '옮긴 상황: 회원 검색에 이메일, 등급, 가입일 조건이 있고 모두 선택이다. Specification으로 만들 때 메서드와 Specification은 각각 몇 개인가 (조회 메서드 1개, Specification 3개)'
    body:
      - p: 'JPA에는 쿼리를 문자열 대신 객체로 조립하는 표준 API가 있어요. **Criteria API**예요. 스프링 데이터의 **Specification**은 그중 WHERE 조건 하나를 람다 하나로 감싸요.'
      - code: spec
        notes:
          - mark: 'name == null'
            as: code
            text: '조건 값이 없으면 null을 돌려줘요. null 조건은 WHERE에서 빠져요.'
      - p: '`root`는 조회하는 엔티티, `cb`는 조건을 만드는 도구예요. 람다는 [람다](lesson:lambda)에서 배운 그대로예요. 리포지토리는 `JpaSpecificationExecutor`를 상속하면 `findAll(spec)`을 받아요.'
      - code: repo
      - code: specs
      - p: '`allOf`는 Specification들을 `and`로 이어요. 메서드 하나에 조건 셋을 그대로 넘기고, 조합 넷으로 돌려 나간 WHERE 절을 봤어요.'
      - ci:
          key: spec
          label: 실제 WHERE 절 보기
          source: DynamicQueryTest.specificationCombinations
      - widget:
          kind: toggle
          layout: [selector, log, verdict]
          selector:
            label: 들어온 조건
            options:
              - {value: none, label: 없음}
              - {value: name, label: 이름만}
              - {value: price, label: 가격만}
              - {value: all, label: 셋 다}
          scenes:
            none:
              log: ['select ... from product']
              verdict: '조건이 모두 null이라 WHERE가 없어요.'
            name:
              log: ['select ... from product where name=?']
              verdict: '이름 조건만 들어갔어요.'
            price:
              log: ['select ... from product where price>=?']
              verdict: '처음 코드가 깨졌던 조합도 그대로 돌아요.'
            all:
              log: ['select ... from product where name=? and price>=? and category=?']
              verdict: '셋이 `and`로 이어졌어요. 빈칸과 순서는 Hibernate가 맞춰요.'
      - p: '들어온 조건만 WHERE에 들어가고, `and`와 빈칸은 Hibernate가 맞춰요. 조합이 8가지여도 조회 메서드는 하나, Specification은 조건 수만큼 셋이에요.'
      - callout: '**필드 이름은 여전히 문자열이에요.** `root.get("price")`의 `"price"`를 잘못 쓰거나 필드 이름을 바꾸면 컴파일은 되고, 그 조건으로 실행할 때 오류가 나요.'
      - quiz:
          q: '이름은 null, 최소 가격은 10000, 카테고리는 null로 위 검색을 불렀어요. WHERE 절에 들어가는 조건은?'
          options:
            - 셋 다
            - 가격 하나
            - 없음
          answer: 2
          explain: 'null 조건을 돌려준 Specification은 빠지고, 가격 조건만 남아요.'
      - next: 'Specification은 조합을 해결했지만 필드 이름이 문자열이었어요. 필드 이름까지 컴파일러가 확인하게 할 수는 없을까요?'
    recall: '조건 하나를 Specification 하나로 만들고, `allOf`나 `and`로 이어 `findAll(spec)`에 넘겨요. 조건 값이 null이면 null을 돌려주는 Specification은 WHERE에서 빠져서, 메서드 하나로 모든 조합을 처리해요. 다만 `root.get("price")`처럼 필드 이름이 문자열이라 오타는 실행할 때 드러나요.'
  - id: q3
    title: Querydsl은 무엇이 다른가요?
    conclusion:
      lead: '엔티티로 만든 Q 클래스를 써서 쿼리를 자바 코드로 쓰고, 필드 이름의 오타를 컴파일러가 잡아요.'
      sub: '조건 값이 null이면 그 조건을 빼는 메서드를 만들어 `where`에 나열하면, 들어온 것만 WHERE에 들어가요.'
    says:
      - 'Querydsl은 빌드할 때 `Product`에서 `QProduct`를 만든다. `product.name.eq(name)`처럼 필드가 자바 필드라 오타면 컴파일되지 않는다'
      - '`queryFactory.selectFrom(product).where(nameEq(name), priceGoe(min))`. `where`는 null 조건을 무시한다. 조합마다 나간 SQL을 보인다'
      - 'Querydsl도 결국 JPQL을 만들고 Hibernate가 SQL로 바꾼다'
    asks:
      - '본문의 예시: `where(nameEq(null), priceGoe(10000))`의 WHERE 절은 (가격 조건 하나)'
      - '옮긴 상황: 엔티티 필드 `price`를 `salePrice`로 바꿨다. Specification의 `root.get("price")`와 Querydsl의 `product.price` 가운데 컴파일할 때 드러나는 것은 (Querydsl)'
    body:
      - p: '**Querydsl**은 쿼리를 자바 코드로 쓰는 라이브러리예요. 빌드할 때 엔티티 `Product`를 보고 `QProduct`라는 클래스를 만들어요. `QProduct`에는 엔티티의 필드마다 같은 이름의 필드가 있어요.'
      - code: querydsl
        notes:
          - mark: product.price.goe(min)
            as: code
            text: '`price`가 문자열이 아니라 `QProduct`의 필드예요. 이름이 틀리면 컴파일되지 않아요. `goe`는 크거나 같다(greater or equal)예요.'
      - p: '`where`에 조건을 나열하면 null인 조건은 무시해요. 그래서 조건 메서드가 값이 없을 때 null을 돌려주게 만들면, Specification처럼 들어온 조건만 WHERE에 들어가요.'
      - ci:
          key: querydsl
          label: 실제 SQL 보기
          source: DynamicQueryTest.querydslIgnoresNull
      - p: '가격 조건만 들어갔어요. Querydsl도 결국 JPQL을 만들고, Hibernate가 그것을 SQL로 바꿔요.'
      - muted: '이 저장소의 검증 테스트는 다른 레슨의 빌드를 건드리지 않으려고 코드 생성(주석 처리기)을 켜지 않았어요. 주석 처리기가 만들 `QProduct`와 같은 모양의 클래스를 테스트에 손으로 두고 돌렸어요. 실무에서는 빌드가 만들어요(실무 구역).'
      - quiz:
          q: '엔티티 필드 `price`를 `salePrice`로 바꿨어요. Specification의 `root.get("price")`와 Querydsl의 `product.price` 가운데 컴파일할 때 드러나는 것은?'
          options:
            - Specification
            - Querydsl
            - 둘 다
          answer: 2
          explain: 'Querydsl의 Q 클래스가 다시 만들어지며 `price` 필드가 사라져서 컴파일 오류가 나요. Specification은 문자열이라 실행할 때 드러나요.'
      - next: '방법이 셋이에요. 언제 무엇을 쓸까요?'
    recall: '엔티티로 만든 Q 클래스를 써서 쿼리를 자바 코드로 쓰고, 필드 이름이 Q 클래스의 필드라 오타를 컴파일러가 잡아요. `where`는 null 조건을 무시해서, 값이 없으면 null을 돌려주는 조건 메서드를 나열하면 들어온 것만 WHERE에 들어가요. 결국 JPQL을 만들고 Hibernate가 SQL로 바꿔요.'
  - id: q4
    title: 동적 쿼리는 무엇으로 만들까요?
    conclusion:
      lead: '조건이 고정이면 메서드 이름 쿼리나 JPQL, 선택 조건의 조합이 많으면 Specification이나 Querydsl을 써요.'
      sub: 'Querydsl은 타입 안전하고 읽기 쉽지만 빌드 설정이 더 들고, Specification은 스프링 데이터만으로 되지만 필드를 문자열로 써요.'
    says:
      - '세 방법을 표로 견준다: 오타가 드러나는 때, 추가 설정, 읽기 쉬움'
      - 'JPQL 문자열 이어 붙이기는 쓰지 않는다'
    widget:
      kind: classify
      note: '상황을 보고 메서드 이름 쿼리, JPQL, Specification, Querydsl 가운데 고른다'
    asks:
      - '본문의 예시: 조건이 이메일 하나로 고정인 조회는 무엇으로 만드나 (메서드 이름 쿼리)'
      - '옮긴 상황: 관리자 화면에 선택 조건이 7개이고 팀이 컴파일 시점 검사를 원한다. 무엇을 고르나 (Querydsl)'
    body:
      - table:
          head: [방법, 필드 이름 오타가 드러나는 때, 더 필요한 것, 맞는 곳]
          rows:
            - [메서드 이름 쿼리, 앱이 뜰 때, 없음, 조건이 고정인 조회]
            - ['JPQL(`@Query`)', 앱이 뜰 때, 없음, 조건이 고정이고 조인이나 정렬이 있는 조회]
            - [JPQL 문자열 이어 붙이기, 그 조합으로 실행할 때, 없음, 쓰지 않는다]
            - [Specification, 그 조건으로 실행할 때, 없음 (스프링 데이터), 선택 조건이 몇 개인 검색]
            - [Querydsl, 컴파일할 때, 라이브러리와 코드 생성 설정, 선택 조건이 많은 검색 화면]
      - p: '조건이 고정이면 동적 쿼리가 필요 없어요. 메서드 이름 쿼리나 `@Query`로 충분해요. 선택 조건의 조합이 많을 때 Specification이나 Querydsl을 써요. 스프링 데이터만으로 되는 Specification으로 시작하고, 검색 화면이 많고 팀이 컴파일 시점 검사를 원하면 Querydsl을 더하는 것도 방법이에요.'
      - widget:
          kind: classify
          categories:
            - 메서드 이름 쿼리
            - Specification이나 Querydsl
          items:
            - text: 이메일로 회원 하나 찾기
              answer: 1
              explain: 조건이 고정이에요. findByEmail이면 돼요.
            - text: 관리자 주문 검색 (기간, 상태, 회원, 금액 범위가 모두 선택)
              answer: 2
              explain: 선택 조건이 넷이라 조합이 16가지예요.
            - text: 카테고리별 상품 목록
              answer: 1
              explain: 조건이 하나로 고정이에요.
            - text: 상품 검색 (이름, 가격, 카테고리, 재고 여부가 선택)
              answer: 2
              explain: 들어온 조건만 WHERE에 넣어야 해요.
      - quiz:
          q: '관리자 화면에 선택 조건이 7개이고 팀이 필드 이름 오타를 컴파일할 때 잡기를 원해요. 무엇을 고를까요?'
          options:
            - JPQL 문자열 이어 붙이기
            - Specification
            - Querydsl
          answer: 3
          explain: 'Querydsl은 Q 클래스의 필드로 쿼리를 써서 오타가 컴파일 오류가 돼요.'
    recall: '조건이 고정이면 메서드 이름 쿼리나 JPQL을 쓰고, 선택 조건의 조합이 많으면 Specification이나 Querydsl을 써요. Specification은 스프링 데이터만으로 되지만 필드 이름이 문자열이고, Querydsl은 오타를 컴파일러가 잡지만 라이브러리와 코드 생성 설정이 더 들어요. JPQL 문자열 이어 붙이기는 쓰지 않아요.'
practice:
  title: 프로젝트에 넣을 때는 이렇게 해요
  body:
    - h3: Querydsl 설정
    - code: gradle
    - p: '`querydsl-jpa`의 `jakarta` 분류자는 스프링 부트 3의 `jakarta.persistence`용이에요. `querydsl-apt`는 컴파일할 때 엔티티를 읽어 Q 클래스를 만드는 주석 처리기예요. `JPAQueryFactory`는 빈으로 하나 두고 리포지토리에서 주입받아요.'
    - code: factory
    - p: 'Querydsl 5의 원래 저장소는 새 릴리스가 드물어요. 새 프로젝트에서는 커뮤니티가 이어 관리하는 갈래(OpenFeign의 querydsl)를 쓰기도 해요. 이 단락은 테스트가 아니라 [Querydsl 문서](link:querydsl)와 저장소의 릴리스 기록이 근거예요.'
    - h3: '흔한 실수: 검색어를 쿼리에 이어 붙이기'
    - p: '"빨리 만들자"며 질문 1처럼 검색어를 JPQL 문자열에 값째 이어 붙여요. 조합에 따라 쿼리가 깨지고, 따옴표가 든 검색어로 조건이 풀려요. 고친 코드는 질문 2의 Specification이나 질문 3의 Querydsl이에요. 둘 다 값을 파라미터로 넘겨요(나간 SQL의 `?`).'
    - p: 'Specification을 만들 때 스프링 데이터 3.5에서는 `Specification.where(...)`가 없어질 예정이라 경고가 나요. `allOf`나 `and`로 이어요.'
    - muted: '근거: Specification은 [Spring Data JPA 문서](link:specs), Querydsl은 [Querydsl 문서](link:querydsl). 깨진 쿼리, 인젝션, 조합마다의 WHERE 절은 테스트로 확인했어요.'
  says:
    - 'Querydsl 설정: `querydsl-jpa`의 jakarta 분류자와 `querydsl-apt` 주석 처리기를 build.gradle에 더하고 `JPAQueryFactory`를 빈으로 둔다. 검증 프로젝트는 다른 레슨의 빌드를 건드리지 않으려고 `querydsl-jpa`만 테스트 의존성으로 넣고, 주석 처리기가 만들 Q 클래스는 같은 모양으로 손으로 두었다. 본문에 그렇게 밝힌다'
    - '흔한 실수: 검색 조건을 JPQL 문자열에 값째 이어 붙인다(질문 1). 고친 코드는 Specification이나 Querydsl. 테스트로 보인다'
    - 'Querydsl 5의 원래 저장소는 갱신이 느리다. 문서와 릴리스 노트를 근거로 짧게 적는다'
claims:
  - claim: '이어 붙인 JPQL에 가격만 넣으면 구문 오류다'
    how: '`em.createQuery`의 예외를 본다'
  - claim: '값을 이은 JPQL에 따옴표가 든 입력을 넣으면 조건이 풀린다'
    how: '`'' or ''1''=''1`류의 입력으로 행 수를 센다'
  - claim: 'Specification 조합 넷의 WHERE 절이 들어온 조건만 가진다'
    how: '`SqlCapture`'
  - claim: 'Querydsl의 where는 null 조건을 무시한다'
    how: 'Querydsl을 testImplementation으로 넣고 같은 조합을 돌린다'
sources:
  - 'Specification: Spring Data JPA 문서 https://docs.spring.io/spring-data/jpa/reference/jpa/specifications.html'
  - 'Criteria API: Jakarta Persistence 3.1 명세 6장 https://jakarta.ee/specifications/persistence/3.1/jakarta-persistence-spec-3.1.html'
  - 'Querydsl: http://querydsl.com/static/querydsl/latest/reference/html/'
interview:
  question: 동적 쿼리는 어떻게 만들고, Querydsl은 왜 쓰나요?
  model:
    - label: 정의
      text: 동적 쿼리는 들어온 조건에 따라 WHERE 절이 바뀌는 쿼리입니다. 검색 조건이 모두 선택이면 조합마다 메서드를 만들 수 없어서 조건을 조립하는 방법이 필요합니다.
    - label: 원리
      text: JPQL 문자열을 이어 붙이면 where와 and를 손으로 맞춰야 해 깨지기 쉽고, 값을 이으면 인젝션이 됩니다. Specification은 조건 하나를 Criteria API 람다로 만들어 null인 조건을 빼고 and로 잇습니다. Querydsl은 엔티티로 만든 Q 클래스로 쿼리를 자바 코드로 쓰고, where가 null 조건을 무시합니다.
    - label: 주의할 점
      text: Specification은 필드 이름이 문자열이라 오타가 실행할 때 드러나고, Querydsl은 컴파일할 때 잡지만 코드 생성 설정이 필요합니다. 조건이 고정이면 메서드 이름 쿼리나 JPQL로 충분합니다.
    - label: 경험
      text: '(내 프로젝트로 채우기) 예: 관리자 주문 검색의 if문 JPQL을 Querydsl로 바꿔 조건 조합의 버그와 필드 이름 오타를 없앴습니다.'
verified: 이 레슨의 SQL과 결과는 짐작이 아니라 스프링 부트 3.5, Hibernate 6.6, Querydsl 5.1로 PostgreSQL 16 컨테이너에서 실제로 조회한 값이에요. 코드가 바뀔 때마다 테스트([DynamicQueryTest](link:test))가 다시 돌아요.
footer: '근거: Specification은 [Spring Data JPA 문서](link:specs), Querydsl은 [Querydsl 문서](link:querydsl). 결과는 테스트로 확인했어요. 오류는 [GitHub 이슈](https://github.com/wanja727/dev-lessons/issues)로 알려 주세요.'
