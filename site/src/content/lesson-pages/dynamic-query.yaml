# 동적 쿼리 (설계서)
# 자료 파일의 칸은 docs/lesson-data-format.md에 있다.
stage: design
title: 동적 쿼리
unit: JPA
roadmap: P11
type: 동작 확인
prerequisites:
  - {slug: jpa-basics, title: ORM과 JPA}
assume: '스프링 부트 3.5, Hibernate 6.6, PostgreSQL 16. JPQL과 메서드 이름 쿼리(ORM과 JPA 레슨), 람다(람다 레슨). SQL 인젝션이 무엇인지(웹 보안 기초 레슨).'
example: '상품 검색 화면. 이름, 최소 가격, 카테고리 조건이 모두 선택이다. 들어온 조건만 WHERE에 넣는 조회를 세 방법으로 만들어 나간 SQL을 견준다.'
intro:
  - '상품 검색 화면에 조건이 셋 있어요. 이름만 넣을 때, 가격만 넣을 때, 셋 다 넣을 때마다 메서드를 만들면 여덟 개가 필요해요. 그래서 JPQL 문자열을 if문으로 이어 붙였더니, 빈칸 하나를 빠뜨려 `whereprice` 같은 쿼리가 나갔어요.'
  - '조건에 따라 모양이 바뀌는 쿼리를 동적 쿼리라고 해요. 스프링 개발자는 JPQL 문자열, Criteria API와 스프링 데이터의 Specification, Querydsl 가운데 하나로 만들어요. 면접에서는 "동적 쿼리는 어떻게 만드나요"와 "Querydsl을 왜 쓰나요"를 물어요.'
  - '이 레슨에서는 같은 검색을 세 방법으로 만들고, 조건 조합마다 나간 SQL과 컴파일러가 잡아 주는 실수를 견줘요.'
covers:
  - topic: '조건이 선택이면 메서드 이름 쿼리는 조합마다 메서드가 필요하다. 동적 쿼리는 들어온 조건만 WHERE에 넣는다'
    where: '질문 1'
  - topic: 'JPQL 문자열을 이어 붙이면 빈칸과 and를 손으로 맞춰야 하고, 실수는 실행할 때 드러난다'
    where: '질문 1'
  - topic: '값을 문자열에 직접 이으면 인젝션이 된다. 값은 늘 파라미터로 넘긴다'
    where: '질문 1. 원리는 웹 보안 기초(N10)'
  - topic: 'Criteria API는 JPA 표준으로 쿼리를 객체로 만든다. 스프링 데이터의 Specification이 조건 하나를 람다로 감싸 and로 잇게 한다'
    where: '질문 2'
  - topic: 'null 조건은 건너뛰는 Specification을 만들면 조합을 메서드 하나로 처리한다'
    where: '질문 2'
  - topic: 'Querydsl은 엔티티에서 만든 Q 클래스로 쿼리를 자바 코드로 쓴다. 필드 이름의 오타가 컴파일 오류가 된다'
    where: '질문 3'
  - topic: 'Querydsl의 BooleanBuilder나 null을 무시하는 where로 조건을 고른다'
    where: '질문 3'
  - topic: 'Querydsl은 빌드에 코드 생성 설정이 필요하다'
    where: '실무에서는'
  - topic: '고르는 기준: 조건이 적으면 JPQL과 메서드 이름 쿼리, 조합이 많으면 Specification이나 Querydsl'
    where: '질문 4'
  - topic: '페이징과 정렬을 함께 쓰기'
    where: '다루지 않음: 페이지네이션(D8)'
codes:
  predict: |-
    String jpql = "select p from Product p";
    if (name != null) {
      jpql += " where p.name = :name";
    }
    if (minPrice != null) {
      jpql += " and p.price >= :min";
    }
  spec: |-
    static Specification<Product> nameIs(
        String name) {
      return (root, q, cb) -> name == null
          ? null
          : cb.equal(root.get("name"), name);
    }
predict:
  text: '코드 predict는 조건이 있을 때만 JPQL을 이어 붙여요. 이름은 비우고 최소 가격만 10000으로 넣으면 어떤 JPQL이 될까요? 보기: 가격 조건만 붙은 정상 쿼리, `where` 없이 `and`로 시작하는 깨진 쿼리, 조건 없는 전체 조회.'
  answer: '`where` 없이 `and`로 시작하는 깨진 쿼리. 이어 붙이는 방식은 조합마다 앞뒤를 손으로 맞춰야 한다. 질문 1에서 밝힌다.'
questions:
  - id: q1
    title: 조건이 바뀌는 조회를 JPQL 문자열로 만들면 무엇이 문제인가요?
    conclusion:
      lead: '조합마다 `where`와 `and`, 빈칸을 손으로 맞춰야 해서 실수하기 쉽고, 실수는 실행해야 드러나요.'
      sub: '값까지 문자열에 이으면 SQL 인젝션이 돼요. 값은 늘 파라미터로 넘겨요.'
    says:
      - '조건 셋이 모두 선택이면 조합이 8가지다. 메서드 이름 쿼리로는 메서드 8개가 필요하다'
      - '코드 predict에 가격만 넣으면 `select p from Product p and p.price >= :min`이 된다. 실행하면 Hibernate가 구문 오류를 던진다. 테스트로 보인다'
      - '`where 1=1`을 앞에 두는 꼼수가 있지만 순서와 빈칸은 여전히 손으로 맞춘다'
      - '`" where p.name = ''" + name + "''"`처럼 값을 이으면 입력이 쿼리가 된다. 따옴표가 든 이름으로 조건이 풀리는 것을 테스트로 보인다. 파라미터로 넘기면 값으로만 쓰인다'
    asks:
      - '본문의 예시: 코드 predict에 이름만 넣으면 쿼리는 정상인가 (정상이다. where가 붙는다)'
      - '옮긴 상황: 검색어를 `"... where p.name like ''%" + keyword + "%''"`로 이었다. 무엇이 위험한가 (검색어에 따옴표와 조건을 넣어 쿼리를 바꿀 수 있다. 파라미터로 넘긴다)'
  - id: q2
    title: Specification은 동적 쿼리를 어떻게 만드나요?
    conclusion:
      lead: '조건 하나를 Specification 하나로 만들고, 들어온 것만 `and`로 이어요.'
      sub: '조건 값이 null이면 null을 돌려주는 Specification은 스프링 데이터가 건너뛰어서, 메서드 하나로 모든 조합을 처리해요.'
    says:
      - 'Criteria API는 JPA 표준으로 쿼리를 객체로 만든다. Specification은 그중 WHERE 조건 하나를 `(root, query, cb) -> Predicate` 람다로 감싼다(람다 레슨)'
      - '코드 spec. 이름, 최소 가격, 카테고리 Specification 셋을 `where(...).and(...)`로 잇고 `findAll(spec)`을 부른다. 리포지토리는 `JpaSpecificationExecutor`를 상속한다'
      - '조합 넷(조건 없음, 이름만, 가격만, 셋 다)에서 나간 SQL을 실제 출력으로 보인다. 들어온 조건만 WHERE에 있다'
      - '`root.get("name")`은 문자열이라 필드 이름 오타가 실행할 때 드러난다'
    widget:
      kind: toggle
      note: '조건 셋을 켜고 끄면 나가는 SQL의 WHERE 절이 바뀐다. 테스트에서 얻은 SQL 넷을 장면으로 둔다'
    asks:
      - '본문의 예시: 이름은 null, 최소 가격은 10000, 카테고리는 null로 검색했다. WHERE 절에 들어가는 조건은 (가격 조건 하나)'
      - '옮긴 상황: 회원 검색에 이메일, 등급, 가입일 조건이 있고 모두 선택이다. Specification으로 만들 때 메서드와 Specification은 각각 몇 개인가 (조회 메서드 1개, Specification 3개)'
  - id: q3
    title: Querydsl은 무엇이 다른가요?
    conclusion:
      lead: '엔티티로 만든 Q 클래스를 써서 쿼리를 자바 코드로 쓰고, 필드 이름의 오타를 컴파일러가 잡아요.'
      sub: '조건 값이 null이면 그 조건을 빼는 메서드를 만들어 `where`에 나열하면, 들어온 것만 WHERE에 들어가요.'
    says:
      - 'Querydsl은 빌드할 때 `Product`에서 `QProduct`를 만든다. `product.name.eq(name)`처럼 필드가 자바 필드라 오타면 컴파일되지 않는다'
      - '`queryFactory.selectFrom(product).where(nameEq(name), priceGoe(min))`. `where`는 null 조건을 무시한다. 조합마다 나간 SQL을 보인다'
      - 'Querydsl도 결국 JPQL을 만들고 Hibernate가 SQL로 바꾼다'
    asks:
      - '본문의 예시: `where(nameEq(null), priceGoe(10000))`의 WHERE 절은 (가격 조건 하나)'
      - '옮긴 상황: 엔티티 필드 `price`를 `salePrice`로 바꿨다. Specification의 `root.get("price")`와 Querydsl의 `product.price` 가운데 컴파일할 때 드러나는 것은 (Querydsl)'
  - id: q4
    title: 동적 쿼리는 무엇으로 만들까요?
    conclusion:
      lead: '조건이 고정이면 메서드 이름 쿼리나 JPQL, 선택 조건의 조합이 많으면 Specification이나 Querydsl을 써요.'
      sub: 'Querydsl은 타입 안전하고 읽기 쉽지만 빌드 설정이 더 들고, Specification은 스프링 데이터만으로 되지만 필드를 문자열로 써요.'
    says:
      - '세 방법을 표로 견준다: 오타가 드러나는 때, 추가 설정, 읽기 쉬움'
      - 'JPQL 문자열 이어 붙이기는 쓰지 않는다'
    widget:
      kind: classify
      note: '상황을 보고 메서드 이름 쿼리, JPQL, Specification, Querydsl 가운데 고른다'
    asks:
      - '본문의 예시: 조건이 이메일 하나로 고정인 조회는 무엇으로 만드나 (메서드 이름 쿼리)'
      - '옮긴 상황: 관리자 화면에 선택 조건이 7개이고 팀이 컴파일 시점 검사를 원한다. 무엇을 고르나 (Querydsl)'
practice:
  says:
    - 'Querydsl 설정: `querydsl-jpa`의 jakarta 분류자와 `querydsl-apt` 주석 처리기를 build.gradle에 더하고 `JPAQueryFactory`를 빈으로 둔다. 검증 프로젝트에 실제로 넣어 돌린다'
    - '흔한 실수: 검색 조건을 JPQL 문자열에 값째 이어 붙인다(질문 1). 고친 코드는 Specification이나 Querydsl. 테스트로 보인다'
    - 'Querydsl 5의 원래 저장소는 갱신이 느리다. 문서와 릴리스 노트를 근거로 짧게 적는다'
claims:
  - claim: '이어 붙인 JPQL에 가격만 넣으면 구문 오류다'
    how: '`em.createQuery`의 예외를 본다'
  - claim: '값을 이은 JPQL에 따옴표가 든 입력을 넣으면 조건이 풀린다'
    how: '`'' or ''1''=''1`류의 입력으로 행 수를 센다'
  - claim: 'Specification 조합 넷의 WHERE 절이 들어온 조건만 가진다'
    how: '`SqlCapture`'
  - claim: 'Querydsl의 where는 null 조건을 무시한다'
    how: 'Querydsl을 testImplementation으로 넣고 같은 조합을 돌린다'
sources:
  - 'Specification: Spring Data JPA 문서 https://docs.spring.io/spring-data/jpa/reference/jpa/specifications.html'
  - 'Criteria API: Jakarta Persistence 3.1 명세 6장 https://jakarta.ee/specifications/persistence/3.1/jakarta-persistence-spec-3.1.html'
  - 'Querydsl: http://querydsl.com/static/querydsl/latest/reference/html/'
