# 서버를 늘리는 방법
# 자료 파일의 칸은 docs/lesson-data-format.md에 있다. 문제는 content/questions/scale-out.yaml에 있다.
title: 서버를 늘리는 방법
description: 스케일 업과 스케일 아웃, 로드 밸런서가 요청을 나누는 방식, 서버를 두 대로 늘리면 로그인이 풀리는 이유와 푸는 방법, 서버 메모리에 두면 안 되는 것. 스프링 서버 두 대와 라운드 로빈 로드 밸런서를 직접 띄워 확인하는 대화형 레슨.
unit: 시스템 설계와 아키텍처
minutes: 20
roadmap: A3
type: 동작 확인
prerequisites:
  - {slug: cookie-session-token, title: 쿠키, 세션, 토큰}
assume: '스프링 부트 3.5, 자바 21, Redis 7. 로그인한 사용자를 세션 id 쿠키로 알아보고, 세션은 서버 메모리에 있다는 것(쿠키, 세션, 토큰 레슨). Redis는 메모리에 키와 값을 두는 저장소라는 것만 알면 돼요. Redis는 A5에서 자세히 다뤄요.'
example: '로그인이 필요한 쇼핑몰 API 서버를 한 대에서 두 대로 늘린다. 앞의 로드 밸런서가 요청을 번갈아 보낸다. 로그인 세션, 서버 메모리의 카운터, 매일 도는 정산 작업이 어떻게 되는지 본다.'
intro:
  - '이벤트 날 서버가 버거워서 한 대를 더 띄웠어요. 그런데 사용자들이 "로그인했는데 새로고침하면 로그아웃돼요"라고 해요. 같은 코드를 두 대에 띄웠을 뿐인데요.'
  - '스프링 개발자가 짠 코드는 결국 서버 여러 대에서 돌아요. 그래서 "이 값을 서버 메모리에 둬도 되나"를 늘 정해야 해요. 세션, 캐시, 업로드한 파일, 스케줄러가 모두 이 질문을 받아요. 면접에서는 "스케일 업과 스케일 아웃", "세션 불일치를 어떻게 푸나요"로 물어요.'
  - '이 레슨에서는 작은 스프링 서버 두 대와 번갈아 보내는 로드 밸런서를 만들어, 서버 메모리의 세션이 어떻게 사라지는지 보고 Redis에 세션을 두면 어떻게 풀리는지 확인해요.'
covers:
  - topic: '스케일 업은 서버 한 대의 CPU와 메모리를 키우고, 스케일 아웃은 같은 서버를 여러 대로 늘린다'
    where: '질문 1'
  - topic: '스케일 업은 코드를 고칠 일이 없지만 한계가 있고 한 대가 죽으면 서비스가 멈춘다. 스케일 아웃은 한 대가 죽어도 버티고 계속 늘릴 수 있지만 서버 사이에 상태를 나눠야 한다'
    where: '질문 1'
  - topic: '로드 밸런서는 여러 서버 앞에서 요청을 나눠 준다. 라운드 로빈, 가장 적게 연결된 서버 같은 방식이 있다'
    where: '질문 2'
  - topic: '로드 밸런서는 헬스 체크로 죽은 서버를 빼고 보낸다'
    where: '질문 2'
  - topic: 'L4 로드 밸런서는 IP와 포트로, L7 로드 밸런서는 HTTP 내용(경로, 헤더)으로 나눈다'
    where: '질문 2의 더 알아보기'
  - topic: '서버 메모리의 세션은 그 서버에만 있다. 다른 서버로 간 요청은 로그인하지 않은 것으로 보인다'
    where: '질문 3'
  - topic: '세션 문제를 푸는 세 방법: 스티키 세션, 세션 저장소(Redis)를 함께 쓰기, 토큰처럼 서버가 상태를 갖지 않기'
    where: '질문 3'
  - topic: '스티키 세션은 그 서버가 죽으면 세션을 잃고 부하가 고르지 않다'
    where: '질문 3'
  - topic: '무상태(stateless) 서버: 요청에 필요한 상태를 서버 메모리가 아니라 요청이나 공유 저장소에 둔다. 그래야 아무 서버나 받아도 된다'
    where: '질문 4'
  - topic: '세션 말고도 서버 메모리에 두면 어긋나는 것: 로컬 캐시, 메모리 카운터, 로컬 디스크에 저장한 업로드 파일'
    where: '질문 4'
  - topic: '@Scheduled 작업은 서버마다 돈다. 두 대면 정산이 두 번 돈다'
    where: '질문 4'
  - topic: '스프링 세션(Spring Session Data Redis)으로 코드를 고치지 않고 세션을 Redis에 두는 설정'
    where: '실무에서는'
  - topic: 'DB는 여러 서버가 함께 쓰므로 서버를 늘리면 DB와 커넥션 풀이 다음 병목이 된다'
    where: '실무에서는. 풀 크기는 스레드 풀과 커넥션 풀 크기(A11), DB를 늘리는 것은 DB 복제와 샤딩(A15)'
  - topic: '자주 읽는 값을 서버 앞에 두기'
    where: '다루지 않음: 캐시 전략과 무효화(A4)'
  - topic: '여러 서버에서 한 번만 실행되게 하는 락'
    where: '다루지 않음: 분산 락(A12)'
codes:
  predict: |-
    @PostMapping("/login")
    String login(HttpSession session) {
      session.setAttribute("user", "minji");
      return "ok";
    }
    @GetMapping("/me")
    String me(HttpSession session) {
      Object u =
          session.getAttribute("user");
      return u == null ? "guest" : (String) u;
    }
  predictMark: |-
    @GetMapping("/me")
    String me([[HttpSession session]]) {
      Object u =
          session.getAttribute("user");
      return u == null ? "guest" : (String) u;
    }
  readOnly: |-
    @GetMapping("/me")
    String me(HttpServletRequest req) {
      HttpSession s =
          req.[[getSession(false)]];
      ...
    }
  counter: |-
    private final AtomicLong views =
        new AtomicLong();
    @PostMapping("/views")
    long view() {
      return views.incrementAndGet();
    }
  redisSession: |-
    String sid = UUID.randomUUID()
        .toString();
    redis.setex("session:" + sid,
        1800, "minji");
    res.addHeader("Set-Cookie",
        "SID=" + sid + "; Path=/");
  redisMe: |-
    @GetMapping("/me")
    String me(@CookieValue("SID")
        String sid) {
      String u =
          redis.get("session:" + sid);
      return u == null ? "guest" : u;
    }
  scheduled: |-
    @Scheduled(cron = "0 0 0 * * *")
    void settle() {
      settlementService.run();
    }
  springSession: |-
    // build.gradle
    implementation 'org.springframework⤷
    .session:spring-session-data-redis'

    # application.yml
    spring:
      data:
        redis:
          host: redis.internal
          port: 6379
  guarded: |-
    @Component
    @ConditionalOnProperty(
        name = "app.scheduling.enabled",
        havingValue = "true")
    class SettlementJob {
      @Scheduled(cron = "0 0 0 * * *")
      void settle() { ... }
    }
  poolMath: |-
    서버 1대: 풀 10개 → DB 연결 10개
    서버 4대: 풀 10개 → DB 연결 40개
    서버 20대: 풀 10개 → DB 연결 200개
links:
  test: https://github.com/wanja727/dev-lessons/blob/main/verification/src/test/java/lab/devlessons/scaleout/ScaleOutTest.java
  nginx: https://nginx.org/en/docs/http/load_balancing.html
  springSession: https://docs.spring.io/spring-session/reference/guides/boot-redis.html
  servletSession: https://jakarta.ee/specifications/servlet/6.0/apidocs/jakarta.servlet/jakarta/servlet/http/HttpServletRequest.html#getSession(boolean)
predict:
  title: 서버를 두 대로 늘리면?
  text: '코드 predict를 서버 두 대에 띄우고, 로드 밸런서가 요청을 서버 1, 서버 2 순서로 번갈아 보내요. 사용자가 `POST /login`을 보낸 뒤 `GET /me`를 두 번 보내요. 두 번의 `/me`는 각각 무엇을 받을까요? 답은 질문 3에 나와요.'
  code: predict
  label: 내 예측
  options:
    - value: mm
      label: minji와 minji
    - value: gm
      label: guest와 minji
    - value: gg
      label: guest와 guest
  answer: gg
  storageKey: scale-out-predict
  wrong: 예측은 "{label}"이었어요. 틀린 예측이 더 오래 남으니 괜찮아요.
questions:
  - id: q1
    title: 서버가 버거우면 어떤 방법으로 늘리나요?
    conclusion:
      lead: '한 대를 더 크게 만드는 스케일 업과, 같은 서버를 여러 대로 늘리는 스케일 아웃이 있어요.'
      sub: '스케일 업은 코드를 고칠 일이 없지만 한계와 비용이 크고 한 대가 죽으면 멈춰요. 스케일 아웃은 계속 늘리고 한 대가 죽어도 버티지만, 서버들이 상태를 나눠 가져야 해요.'
    says:
      - '스케일 업(수직 확장): CPU, 메모리를 큰 것으로 바꾼다. 같은 코드가 그대로 빨라진다. 살 수 있는 가장 큰 서버가 한계이고, 크기가 두 배면 값은 두 배보다 비싸지기 쉽다'
      - '스케일 아웃(수평 확장): 같은 서버를 여러 대 띄우고 앞에서 요청을 나눈다. 한 대가 죽어도 나머지가 받는다(가용성). 대신 한 서버의 메모리에만 있는 것이 문제가 된다'
      - '두 방법을 표로 비교한다: 코드 변경, 한계, 장애에 버티는 정도, 비용'
      - '웹 서버(스프링 애플리케이션)는 스케일 아웃이 쉽고, DB는 데이터를 나눠야 해서 어렵다. 그래서 보통 애플리케이션은 늘리고 DB는 키운다. DB를 나누는 것은 A15'
    asks:
      - '본문의 예시: 쇼핑몰 API 서버 한 대를 메모리 두 배인 서버로 바꿨다. 이 방법의 이름과, 이 서버가 죽었을 때 서비스는 (스케일 업. 서비스가 멈춘다)'
      - '옮긴 상황: 서버 4대가 요청을 나눠 받다가 1대가 죽었다. 로드 밸런서가 죽은 서버를 빼면 서비스는 어떻게 되나 (나머지 3대가 받는다. 처리량이 줄 뿐 멈추지 않는다)'
    body:
      - p: '서버가 버거울 때 고르는 길은 두 가지예요.'
      - ul:
          - '**스케일 업**(수직 확장): 서버 한 대를 CPU와 메모리가 더 큰 것으로 바꿔요. 위로 키운다고 해서 수직이에요.'
          - '**스케일 아웃**(수평 확장): 같은 서버를 여러 대 띄우고 앞에서 요청을 나눠 줘요. 옆으로 늘린다고 해서 수평이에요.'
      - table:
          head: [ '', 스케일 업, 스케일 아웃]
          rows:
            - ['코드', '고칠 일이 없다', '서버 메모리에 둔 상태를 옮겨야 한다 (질문 3, 4)']
            - ['한계', '살 수 있는 가장 큰 서버', '대수를 계속 늘릴 수 있다']
            - ['한 대가 죽으면', '서비스가 멈춘다', '나머지가 받는다']
            - ['비용', '큰 서버일수록 값이 가파르게 오른다', '작은 서버를 여러 대']
      - p: '스케일 업은 가장 쉬운 첫걸음이에요. 같은 코드가 그대로 빨라지니까요. 하지만 한 대뿐이라 그 서버가 죽거나 배포하느라 내려가면 서비스가 멈춰요. 그래서 서비스가 커지면 스케일 아웃으로 가요. 여러 대가 있으면 하나가 죽어도 서비스가 이어져요. 이것을 **가용성**이 높다고 해요.'
      - p: '스프링 애플리케이션 같은 웹 서버는 같은 코드를 여러 대 띄우면 되니 스케일 아웃이 쉬워요. DB는 데이터를 여러 대에 나눠 담아야 해서 훨씬 어려워요. 그래서 보통 애플리케이션 서버는 늘리고 DB는 키워요. DB를 늘리는 이야기는 심화 레슨 "DB 복제와 샤딩"에서 다뤄요.'
      - quiz:
          q: '서버 4대가 요청을 나눠 받다가 1대가 죽었어요. 앞에서 죽은 서버를 빼고 보내면 서비스는 어떻게 되나요?'
          options:
            - '서비스가 멈춘다'
            - '나머지 3대가 받는다. 처리할 수 있는 양만 줄어든다'
            - '죽은 서버가 살아날 때까지 모든 요청이 기다린다'
          answer: 2
          explain: '스케일 아웃의 장점이에요. 남은 서버가 요청을 받아요. 한 대짜리 스케일 업이었다면 멈췄을 거예요.'
      - next: '서버가 여러 대면 누가 요청을 나눠 줄까요?'
    recall: '서버 한 대를 더 큰 CPU와 메모리로 바꾸는 스케일 업과, 같은 서버를 여러 대 띄우고 앞에서 요청을 나누는 스케일 아웃이 있어요. 스케일 업은 코드를 고칠 일이 없지만 살 수 있는 가장 큰 서버가 한계이고 한 대가 죽으면 멈춰요. 스케일 아웃은 계속 늘리고 한 대가 죽어도 나머지가 받지만, 서버 메모리에 둔 상태를 공유 저장소로 옮겨야 해요.'
  - id: q2
    title: 로드 밸런서는 요청을 어떻게 나눠 주나요?
    conclusion:
      lead: '여러 서버 앞에 서서 정해진 방식으로 서버를 골라 요청을 넘기고, 헬스 체크로 죽은 서버는 빼요.'
      sub: '라운드 로빈은 차례로 돌아가며, 가장 적은 연결 방식은 지금 일이 적은 서버로 보내요. 사용자는 로드 밸런서 주소 하나만 알아요.'
    says:
      - '클라이언트는 로드 밸런서의 주소로 요청한다. 로드 밸런서가 뒤의 서버 하나를 골라 넘기고 응답을 돌려준다'
      - '라운드 로빈: 서버 1, 2, 1, 2 순서. 요청마다 일의 크기가 비슷하면 고르다. 가장 적은 연결: 처리 중인 요청이 적은 서버로. 요청마다 걸리는 시간이 다르면 낫다'
      - '헬스 체크: 로드 밸런서가 서버마다 `/actuator/health` 같은 주소를 주기적으로 부른다. 응답이 없으면 그 서버로 보내지 않는다'
      - '테스트의 로드 밸런서는 라운드 로빈으로 두 서버에 번갈아 보내는 작은 자바 코드다. 이것으로 질문 3과 4를 돌린다'
      - '더 알아보기: L4 로드 밸런서는 IP와 포트만 보고 나눈다. L7은 HTTP를 열어 경로(`/api`, `/images`)나 쿠키로 나눌 수 있다. Nginx와 클라우드의 애플리케이션 로드 밸런서가 L7이다'
    asks:
      - '본문의 예시: 서버 두 대에 라운드 로빈으로 요청 5개를 보내면 서버 1과 서버 2가 받는 수는 (3개와 2개)'
      - '옮긴 상황: 대부분 10ms인데 가끔 3초 걸리는 리포트 요청이 섞인다. 라운드 로빈과 가장 적은 연결 가운데 느린 요청 뒤에 줄 서는 요청이 적은 쪽은 (가장 적은 연결)'
    body:
      - p: '**로드 밸런서**는 여러 서버 앞에 서서 요청을 나눠 주는 서버예요. 사용자는 로드 밸런서의 주소 하나만 알고, 뒤에 서버가 몇 대인지 몰라요.'
      - prewrap: '사용자 → 로드 밸런서 → 서버 1 / 서버 2 / 서버 3'
      - p: '누구에게 보낼지 고르는 방식이 여럿 있어요([Nginx 문서](link:nginx)).'
      - table:
          head: [방식, 고르는 법, 맞는 경우]
          rows:
            - ['라운드 로빈', '서버 1, 2, 3, 1, 2, 3 차례로', '요청마다 일의 크기가 비슷할 때']
            - ['가장 적은 연결', '지금 처리 중인 요청이 가장 적은 서버로', '요청마다 걸리는 시간이 들쭉날쭉할 때']
            - ['IP 해시', '사용자 IP로 늘 같은 서버로', '같은 사용자를 같은 서버에 붙일 때 (질문 3의 스티키 세션)']
      - p: '라운드 로빈은 단순해서 가장 많이 써요. 다만 가끔 3초 걸리는 요청이 섞이면, 그 서버가 바빠도 차례가 오면 또 요청을 받아 뒤에 줄이 생겨요. 가장 적은 연결은 바쁜 서버를 피해 가요.'
      - p: '로드 밸런서는 **헬스 체크**도 해요. 몇 초마다 서버의 상태 주소(스프링 부트라면 액추에이터의 `/actuator/health`)를 불러 보고, 답이 없으면 그 서버로 보내지 않아요. 질문 1에서 "한 대가 죽어도 나머지가 받는다"가 이렇게 일어나요.'
      - p: '이 레슨의 테스트에서는 서버 1, 서버 2에 번갈아 보내는 라운드 로빈 로드 밸런서를 자바 코드 몇 줄로 만들었어요. 브라우저처럼 받은 쿠키를 들고 다니다 다음 요청에 붙여요. 다음 질문은 이것으로 돌려요.'
      - more:
          summary: L4와 L7 로드 밸런서
          body:
            - p: '**L4** 로드 밸런서는 네트워크 계층에서 IP와 포트만 보고 나눠요. HTTP 내용을 열지 않아서 빨라요.'
            - p: '**L7** 로드 밸런서는 HTTP 요청을 열어 경로(`/api`는 API 서버로, `/images`는 이미지 서버로)나 헤더, 쿠키로 나눌 수 있어요. Nginx와 클라우드의 애플리케이션 로드 밸런서가 L7이에요. 계층은 네트워크 과정의 OSI 7계층 레슨에서 다뤄요.'
      - quiz:
          q: '서버 두 대에 라운드 로빈으로 요청 5개를 보내면, 서버 1과 서버 2는 각각 몇 개를 받나요?'
          options:
            - '3개와 2개'
            - '5개와 0개'
            - '2개와 3개'
          answer: 1
          explain: '서버 1, 2, 1, 2, 1 순서로 보내요. 서버 1이 3개, 서버 2가 2개예요.'
      - next: '같은 사용자의 요청이 이번엔 서버 1로, 다음엔 서버 2로 가요. 로그인 세션은 어떻게 될까요?'
    recall: '로드 밸런서는 여러 서버 앞에서 사용자의 요청을 받아 정해진 방식으로 서버 하나를 골라 넘겨요. 라운드 로빈은 차례로, 가장 적은 연결은 처리 중인 요청이 적은 서버로, IP 해시는 같은 사용자를 같은 서버로 보내요. 헬스 체크로 서버의 상태 주소를 주기적으로 불러 답이 없는 서버는 빼요. 사용자는 로드 밸런서 주소 하나만 알아요.'
  - id: q3
    title: 서버를 두 대로 늘리면 로그인이 왜 풀리나요?
    conclusion:
      lead: '세션이 로그인을 처리한 서버의 메모리에만 있어서, 다른 서버로 간 요청은 그 세션을 찾지 못해요.'
      sub: '그 서버가 새 세션을 만들어 쿠키까지 덮어쓰면 원래 서버로 돌아가도 로그인이 풀려 있어요. 같은 서버로만 보내는 스티키 세션, 세션을 Redis 같은 공유 저장소에 두기, 서버가 세션을 갖지 않는 토큰 방식으로 풀어요.'
    says:
      - '코드 predict를 두 서버에 띄우고 로드 밸런서로 `/login`, `/me`, `/me`를 보낸다. 결과는 guest, guest다. 예측의 답을 밝힌다. 실제 출력을 보인다'
      - '이유 하나: `HttpSession`은 톰캣이 그 서버의 메모리에 둔다. 세션 id 쿠키는 브라우저가 보내지만, 서버 2의 메모리에는 그 id의 세션이 없다'
      - '이유 둘(테스트에서 찾음): 컨트롤러가 `HttpSession`을 인자로 받으면 세션이 없을 때 새로 만든다. 서버 2가 새 세션 id를 `Set-Cookie`로 보내 브라우저의 쿠키를 덮어쓴다. 그래서 서버 1로 돌아가도 그 쿠키의 세션이 없다. `getSession(false)`로 읽기만 하면 guest, minji다'
      - '스티키 세션: 로드 밸런서가 쿠키를 보고 같은 사용자를 늘 같은 서버로 보낸다. 고치기 쉽지만 그 서버가 죽으면 세션을 잃고, 오래 머무는 사용자가 많은 서버에 부하가 몰린다'
      - '세션 저장소: 세션을 Redis에 두고 두 서버가 함께 읽는다. 코드 redisSession처럼 세션 id를 키로 사용자를 넣는다. 같은 요청 순서에서 minji, minji가 나오는 것을 보인다'
      - '토큰: 서버가 서명한 토큰(JWT)을 클라이언트가 들고 다닌다. 서버는 저장할 것이 없다. N7에서 다뤘다'
    widget:
      kind: toggle
      note: '세션을 어디에 두는지(서버 메모리, 스티키 세션, Redis) 고르고 실행을 누르면 /login, /me, /me 요청이 어느 서버로 가서 무엇을 받는지 로그로 보인다. 스티키 세션에서는 서버 1을 내리는 단계를 더해 세션을 잃는 것을 보인다'
    asks:
      - '본문의 예시: 세션을 Redis에 두고 서버 두 대를 라운드 로빈으로 돌린다. 서버 1에서 로그인한 뒤 서버 2로 간 `/me`는 무엇을 받나 (minji. 두 서버가 같은 Redis를 읽는다)'
      - '옮긴 상황: 스티키 세션으로 운영하다 서버 1을 배포하려고 내렸다. 서버 1에 붙어 있던 사용자의 다음 요청은 (서버 2로 가고 세션이 없어 다시 로그인해야 한다)'
    body:
      - p: '처음 예측의 코드를 두 서버에 띄우고, 라운드 로빈 로드 밸런서로 `/login`, `/me`, `/me`를 차례로 보냈어요.'
      - ci:
          key: memory
          label: 실제 결과 보기
          source: ScaleOutTest.memorySessionIsLostOnOtherServer
      - p: '답은 **guest와 guest**예요. {{predict-result}} 로그인은 서버 1에서 했는데, 두 번째 `/me`가 서버 1로 돌아갔는데도 guest예요. 두 가지가 겹쳤어요.'
      - h3: 하나. 세션은 그 서버의 메모리에 있어요
      - p: '`HttpSession`은 톰캣이 **그 서버의 메모리**에 둬요. 브라우저는 세션 id 쿠키(`JSESSIONID`)를 보내지만, 서버 2의 메모리에는 그 id의 세션이 없어요. 그래서 첫 `/me`는 guest예요.'
      - h3: 둘. 서버 2가 쿠키를 덮어써요
      - code: predictMark
        notes:
          - mark: HttpSession session
            as: code
            text: '컨트롤러가 `HttpSession`을 인자로 받으면, 세션이 없을 때 스프링이 **새로 만들어** 넘겨요. 서버 2는 새 세션 id를 `Set-Cookie`로 보내요.'
      - p: '로그를 보면 첫 `/me`에 "새 쿠키"가 붙어 있어요. 브라우저는 서버 1의 세션 id를 버리고 서버 2가 준 id로 바꿔요. 그다음 서버 1로 간 요청은 서버 2의 id를 들고 가니, 서버 1도 그 세션을 몰라요. **로그인이 아예 풀린 거예요.**'
      - p: '세션을 새로 만들지 않고 읽기만 하면(`getSession(false)`, [서블릿 API](link:servletSession)) 쿠키가 덮이지 않아서 guest, minji가 나와요. 그래도 요청의 절반이 로그아웃처럼 보이는 것은 같아요. 어느 쪽이든 서버 메모리의 세션으로는 안 돼요.'
      - code: readOnly
      - ci:
          key: readonly
          label: 실제 결과 보기
          source: ScaleOutTest.readOnlySessionKeepsCookie
      - h3: 푸는 방법 셋
      - ul:
          - '**스티키 세션:** 로드 밸런서가 같은 사용자를 늘 같은 서버로 보내요. 코드를 고칠 일이 없지만, 그 서버가 죽거나 배포로 내려가면 그 서버의 세션이 모두 사라져요. 오래 머무는 사용자가 몰린 서버만 바빠지기도 해요.'
          - '**세션 저장소:** 세션을 서버 메모리가 아니라 Redis처럼 모든 서버가 함께 보는 곳에 둬요. 어느 서버로 가도 같은 세션을 읽어요.'
          - '**토큰:** 서버가 서명한 토큰(JWT)을 클라이언트가 들고 다녀요. 서버는 저장할 것이 없어서 어느 서버든 서명만 확인하면 돼요. [쿠키, 세션, 토큰](lesson:cookie-session-token) 레슨에서 다뤘어요.'
      - p: '세션 저장소를 직접 만들어 봤어요. 로그인하면 세션 id를 만들어 Redis에 사용자를 넣고, `/me`는 쿠키의 id로 Redis를 읽어요.'
      - code: redisSession
      - code: redisMe
      - ci:
          key: redis
          label: 실제 결과 보기
          source: ScaleOutTest.redisSessionIsShared
      - p: '세 방식을 골라 실행해 보세요.'
      - widget:
          kind: toggle
          layout: [selector, buttons, log, verdict]
          selector:
            label: 세션을 두는 곳
            options:
              - {value: memory, label: 서버 메모리}
              - {value: sticky, label: 스티키 세션}
              - {value: redis, label: Redis}
          run: {label: 요청 보내기}
          initial:
            log:
              - {note: '요청 보내기를 누르면 /login, /me, /me가 차례로 나가요.'}
          scenes:
            memory:
              log:
                - 'POST /login → 서버 1: ok (새 쿠키 A)'
                - 'GET /me → 서버 2: guest (세션 A가 없음, 새 쿠키 B)'
                - 'GET /me → 서버 1: guest (세션 B가 없음, 새 쿠키 C)'
              verdict: '서버 2가 새 세션을 만들어 쿠키를 덮어써서 로그인이 아예 풀려요.'
            sticky:
              log:
                - 'POST /login → 서버 1: ok (새 쿠키 A)'
                - 'GET /me → 서버 1: minji (쿠키 A는 늘 서버 1로)'
                - 'GET /me → 서버 1: minji'
                - {note: '서버 1을 배포하려고 내림'}
                - 'GET /me → 서버 2: guest (세션 A가 없음)'
              verdict: '평소엔 되지만, 붙어 있던 서버가 내려가면 그 서버의 세션은 모두 사라져요.'
            redis:
              log:
                - 'POST /login → 서버 1: ok (Redis에 세션 저장)'
                - 'GET /me → 서버 2: minji (Redis에서 읽음)'
                - 'GET /me → 서버 1: minji (Redis에서 읽음)'
              verdict: '두 서버가 같은 Redis를 읽어서 어느 서버로 가도 로그인이 이어져요.'
      - quiz:
          q: '스티키 세션으로 운영하다 서버 1을 배포하려고 내렸어요. 서버 1에 붙어 있던 사용자의 다음 요청은 어떻게 되나요?'
          options:
            - '서버 2로 가고 로그인이 이어진다'
            - '서버 2로 가고 세션이 없어 다시 로그인해야 한다'
            - '서버 1이 다시 뜰 때까지 기다린다'
          answer: 2
          explain: '세션은 서버 1의 메모리에만 있었어요. 서버 1이 내려가면 그 세션은 사라져요.'
      - next: '세션은 공유 저장소로 옮겼어요. 서버 메모리에 둔 것이 세션뿐일까요?'
    recall: '`HttpSession`의 세션은 로그인을 처리한 서버의 메모리에만 있어서, 다른 서버로 간 요청은 세션을 찾지 못해요. 컨트롤러가 `HttpSession`을 받으면 그 서버가 새 세션을 만들어 쿠키까지 덮어써서, 원래 서버로 돌아가도 로그인이 풀려요. 같은 사용자를 같은 서버로 보내는 스티키 세션(그 서버가 죽으면 세션을 잃음), 세션을 Redis 같은 공유 저장소에 두기, 서버가 상태를 갖지 않는 토큰으로 풀어요.'
  - id: q4
    title: 세션 말고도 서버 메모리에 두면 안 되는 것은 무엇인가요?
    conclusion:
      lead: '서버마다 따로 가지면 어긋나는 상태는 모두 그래요. 메모리 카운터, 로컬 캐시, 로컬 디스크의 파일, 그리고 서버마다 도는 스케줄러가 그래요.'
      sub: '아무 서버가 받아도 같은 답을 하게 상태를 공유 저장소(DB, Redis, 파일 저장소)에 두는 서버를 무상태 서버라고 해요.'
    says:
      - '코드 counter를 두 서버에 띄우고 조회수를 네 번 올린다. 서버마다 2씩이라 응답은 1, 1, 2, 2다. 실제 조회수 4는 어디에도 없다. 실제 출력을 보인다'
      - '로컬 캐시: 서버 1의 캐시를 지워도 서버 2의 캐시는 옛 값을 준다. 캐시를 어떻게 맞추는지는 A4'
      - '업로드 파일: 서버 1의 디스크에 저장한 이미지를 서버 2로 간 요청은 찾지 못한다. 파일은 공유 파일 저장소(S3 같은 객체 저장소)에 둔다'
      - '`@Scheduled`는 서버마다 돈다. 매일 0시 정산이 서버 두 대에서 두 번 돈다. 두 서버를 띄워 스케줄 작업이 두 번 실행된 것을 센다. 한 번만 돌게 하는 방법은 분산 락(A12)이나 스케줄 전용 서버 하나'
      - '무상태 서버의 정의와, 그래서 스케일 아웃이 쉬워진다는 것으로 정리한다'
    asks:
      - '본문의 예시: 코드 counter를 서버 세 대에 띄우고 라운드 로빈으로 조회수를 여섯 번 올렸다. 마지막 응답은 (2. 서버마다 두 번씩)'
      - '옮긴 상황: 매시 정각에 쿠폰 만료 메일을 보내는 `@Scheduled` 메서드가 있다. 서버를 세 대로 늘리면 회원 한 명은 메일을 몇 통 받나 (세 통)'
      - '실무 구역: 스프링 세션 Redis를 넣고 `@EnableRedisHttpSession`을 켰다. 컨트롤러가 `HttpSession`에 넣는 코드는 고쳐야 하나 (아니다. 같은 `HttpSession`이 Redis에 저장된다)'
    body:
      - p: '조회수를 서버 메모리의 `AtomicLong`으로 세는 코드를 두 서버에 띄우고 네 번 올려 봤어요.'
      - code: counter
      - ci:
          key: counter
          label: 실제 결과 보기
          source: ScaleOutTest.memoryCounterDiverges
      - p: '조회수는 네 번 올랐는데 응답은 1, 1, 2, 2예요. 서버마다 따로 세니 **실제 값 4는 어디에도 없어요.** 세션과 같은 문제예요. 같은 모양의 함정이 몇 가지 더 있어요.'
      - table:
          head: [서버 메모리에 둔 것, 생기는 일, 둘 곳]
          rows:
            - ['메모리 카운터', '서버마다 따로 센다', 'DB나 Redis의 `INCR`']
            - ['로컬 캐시', '서버 1에서 지워도 서버 2는 옛 값을 준다', 'Redis 같은 원격 캐시 ([캐시 전략과 무효화](lesson:cache-strategy))']
            - ['로컬 디스크의 업로드 파일', '서버 2로 간 요청이 파일을 찾지 못한다', '공유 파일 저장소 (S3 같은 객체 저장소)']
            - ['`@Scheduled` 작업', '서버마다 돈다', '한 서버에서만 켜기, 분산 락']
      - h3: 스케줄 작업은 서버마다 돌아요
      - p: '매일 0시에 정산하는 `@Scheduled` 메서드가 있으면 서버 두 대가 **각자** 0시에 돌려요. 정산이 두 번 되고, 고객에게 알림이 두 통 가요.'
      - code: scheduled
      - p: '100ms마다 도는 작업을 서버 두 대에 1초 동안 띄워 실행 횟수를 Redis에 셌어요. 한 대면 10번쯤이어야 해요.'
      - ci:
          key: scheduled
          label: 실제 결과 보기
          source: ScaleOutTest.scheduledRunsOnEveryServer
      - p: '그냥 두면 20번쯤, 한 서버에서만 켜면 10번쯤이에요. 한 서버에서만 켜는 설정은 실무 구역에서 봐요. 여러 서버가 서로 확인해서 하나만 돌게 하는 방법(분산 락)은 심화 레슨 "분산 락"에서 다뤄요.'
      - h3: 무상태 서버
      - p: '정리하면, 아무 서버가 받아도 같은 답을 하려면 요청에 필요한 상태를 **서버 메모리가 아니라 요청 자체나 공유 저장소**에 둬야 해요. 이런 서버를 **무상태**(stateless) 서버라고 해요. 무상태 서버는 몇 대를 더 띄우든, 어느 서버가 죽든 상관없어서 스케일 아웃이 쉬워요.'
      - quiz:
          q: '매시 정각에 쿠폰 만료 안내 메일을 보내는 `@Scheduled` 메서드가 있어요. 서버를 세 대로 늘리면 회원 한 명은 매시 메일을 몇 통 받나요?'
          options:
            - '한 통'
            - '세 통'
            - '서버 수와 상관없이 정해지지 않는다'
          answer: 2
          explain: '`@Scheduled`는 서버마다 돌아요. 세 서버가 각자 보내니 세 통이에요.'
      - next: '원리는 여기까지예요. 이제 스프링에서 세션을 Redis로 옮기는 설정과, 스케줄 작업을 한 서버에서만 켜는 코드를 볼게요.'
    recall: '서버마다 따로 가지면 어긋나는 상태는 모두 서버 메모리에 두면 안 돼요. 메모리 카운터는 서버마다 따로 세고, 로컬 캐시는 서버마다 옛 값이 남고, 로컬 디스크의 업로드 파일은 다른 서버가 찾지 못해요. `@Scheduled` 작업은 서버마다 돌아서 정산이 대수만큼 돌아요. 상태를 DB, Redis, 공유 파일 저장소에 두어 아무 서버가 받아도 같은 답을 하는 서버를 무상태 서버라고 해요.'
practice:
  title: 스프링에서 서버를 늘릴 때
  says:
    - '스프링 세션: `spring-session-data-redis` 의존성과 `spring.session.store-type`(부트 3에서는 의존성만으로 켜진다), Redis 주소 설정. 컨트롤러의 `HttpSession` 코드는 그대로이고 세션이 Redis의 해시로 저장된다. 의존성을 검증 프로젝트에 더하지 않으므로 스프링 세션 문서가 근거라고 밝힌다'
    - '세션에 넣는 객체는 Redis에 쓰려고 직렬화된다. `Serializable`이 아닌 객체를 넣으면 저장할 때 실패한다(문서 근거)'
    - '흔한 실수: 서버를 늘리면서 `@Scheduled` 정산을 그대로 둔다. 고친 코드: 스케줄 작업을 한 서버에서만 켜는 설정(`app.scheduling.enabled`와 `@ConditionalOnProperty`)이나 분산 락(A12). 설정으로 켜고 끄는 것은 테스트로 보인다'
    - '서버를 늘리면 DB 커넥션 수도 서버 수만큼 늘어난다. 서버마다 풀이 10개면 4대에 40개다. DB의 최대 연결 수를 넘지 않는지 본다. 풀 크기는 A11'
  body:
    - h3: 세션을 Redis로 옮기는 설정
    - p: '질문 3에서는 세션 저장소를 직접 만들었지만, 스프링에서는 **스프링 세션**을 써요. 의존성을 넣고 Redis 주소만 적으면, 컨트롤러가 쓰던 `HttpSession` 코드를 한 줄도 고치지 않고 세션이 Redis에 저장돼요. 스프링 부트 3에서는 의존성이 있으면 자동으로 켜져요([스프링 세션 문서](link:springSession)).'
    - code: springSession
    - p: '이 설정은 검증 프로젝트에 넣지 않아서 테스트가 아니라 공식 문서가 근거예요. 세션에 넣는 객체는 Redis에 쓰려고 직렬화되니 `Serializable`이어야 해요. 그렇지 않은 객체를 넣으면 세션을 저장할 때 오류가 나요.'
    - h3: 흔한 실수 하나
    - p: '서버를 늘리면서 `@Scheduled` 정산을 그대로 두는 거예요. 질문 4에서 본 것처럼 정산이 서버 수만큼 돌아요. 가장 간단한 고친 코드는 설정 값이 켜진 서버에서만 스케줄 빈을 만드는 거예요.'
    - code: guarded
      notes:
        - mark: '@ConditionalOnProperty('
          as: anno
          text: '`app.scheduling.enabled=true`인 서버에서만 이 빈이 생겨요. 서버 한 대의 설정에만 true를 줘요.'
    - p: '질문 4의 테스트에서 서버 1에만 true를 줬더니 실행이 한 대만큼(10번쯤)으로 줄었어요. 다만 그 한 대가 죽으면 정산이 돌지 않으니, 서버들이 서로 확인하는 분산 락을 쓰는 곳도 많아요.'
    - h3: 다음 병목은 DB
    - p: '애플리케이션 서버는 늘려도 DB는 대개 한 대예요. 서버마다 커넥션 풀이 있으니 서버를 늘리면 DB가 받는 연결도 늘어요.'
    - code: poolMath
    - p: 'DB의 최대 연결 수(PostgreSQL의 기본값은 100)를 넘으면 새 연결이 거절돼요. 서버를 늘릴 때는 풀 크기와 DB의 한도를 함께 봐요. 풀 크기를 정하는 법은 심화 레슨 "스레드 풀과 커넥션 풀 크기"에서 다뤄요.'
interview:
  question: 서버를 여러 대로 늘리면 무엇이 문제가 되고, 어떻게 푸나요?
  model:
    - label: 정의
      text: 서버를 늘리는 방법은 한 대를 키우는 스케일 업과 같은 서버를 여러 대 띄우는 스케일 아웃이 있고, 스케일 아웃에서는 로드 밸런서가 라운드 로빈이나 가장 적은 연결 같은 방식으로 요청을 나누고 헬스 체크로 죽은 서버를 뺍니다.
    - label: 원리
      text: 스케일 아웃에서는 서버 메모리에 둔 상태가 서버마다 따로라 어긋납니다. HttpSession은 로그인한 서버의 메모리에만 있어서 다른 서버로 간 요청은 로그인하지 않은 것으로 보이고, 그 서버가 새 세션을 만들어 쿠키를 덮어쓰면 로그인이 아예 풀립니다.
    - label: 해결과 주의할 점
      text: 스티키 세션은 쉽지만 그 서버가 죽으면 세션을 잃습니다. 세션은 Redis 같은 공유 저장소(스프링 세션)에 두거나 토큰으로 바꿉니다. 메모리 카운터, 로컬 캐시, 로컬 디스크의 파일도 공유 저장소로 옮기고, @Scheduled는 서버마다 도니 한 서버에서만 켭니다. 서버가 늘면 DB 연결도 늘어 다음 병목이 됩니다.
    - label: 경험
      text: '(내 프로젝트로 채우기) 예: 서버를 두 대로 늘린 뒤 로그인이 풀리는 문의가 와서 스프링 세션 Redis로 세션을 옮기고, 정산 스케줄을 한 서버에서만 켜게 했습니다.'
verified: 세션, 카운터, 스케줄 작업의 결과는 스프링 부트 3.5 서버 두 대와 Redis 7에서 코드를 돌려 받은 값이에요. 코드가 바뀔 때마다 테스트([ScaleOutTest](link:test))가 다시 돌아요.
footer: '근거: 로드 밸런싱 방식은 [Nginx 문서](link:nginx), `getSession(false)`는 [서블릿 API](link:servletSession), 스프링 세션 설정은 [스프링 세션 문서](link:springSession). 결과는 테스트로 확인했어요. 오류는 [GitHub 이슈](https://github.com/wanja727/dev-lessons/issues)로 알려 주세요.'
claims:
  - claim: '서버 메모리 세션으로 두 서버를 라운드 로빈으로 돌리면 /login 뒤의 /me 두 번이 guest, guest다'
    how: '`MiniWeb` 두 개와 라운드 로빈으로 보내는 작은 클라이언트. 쿠키를 들고 다닌다. 설계 때는 guest, minji로 예상했으나, 서버 2가 `HttpSession` 인자 때문에 새 세션을 만들어 쿠키를 덮어써서 guest, guest였다. 예측의 답과 질문 3을 고쳤다'
    test: ScaleOutTest.memorySessionIsLostOnOtherServer
  - claim: '`/me`가 `getSession(false)`로 읽기만 하면 guest, minji다'
    how: '같은 구성. 설계 뒤에 더한 주장'
    test: ScaleOutTest.readOnlySessionKeepsCookie
  - claim: '세션을 Redis에 두면 같은 순서에서 minji, minji다'
    how: 'Redis 컨테이너에 세션 id와 사용자를 넣고 두 서버가 읽는다'
    test: ScaleOutTest.redisSessionIsShared
  - claim: '서버 메모리 카운터는 서버마다 따로 센다'
    how: '같은 구성으로 조회수를 네 번 올린다. 1, 1, 2, 2'
    test: ScaleOutTest.memoryCounterDiverges
  - claim: '`@Scheduled` 작업은 서버마다 실행되고, 설정 값으로 한 서버에서만 켜면 한 서버만 돈다'
    how: '스케줄을 켠 작은 컨텍스트 두 개를 띄우고 공유 카운터(Redis INCR)로 실행 횟수를 센다'
    test: ScaleOutTest.scheduledRunsOnEveryServer
sources:
  - '스프링 세션 Redis: https://docs.spring.io/spring-session/reference/guides/boot-redis.html'
  - '스케일 업과 스케일 아웃, 로드 밸런서의 방식: Nginx 로드 밸런싱 문서 https://nginx.org/en/docs/http/load_balancing.html'
