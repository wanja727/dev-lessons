# 서버를 늘리는 방법 (설계서)
# 자료 파일의 칸은 docs/lesson-data-format.md에 있다.
stage: design
title: 서버를 늘리는 방법
unit: 시스템 설계와 아키텍처
roadmap: A3
type: 동작 확인
prerequisites:
  - {slug: cookie-session-token, title: 쿠키, 세션, 토큰}
assume: '스프링 부트 3.5, 자바 21, Redis 7. 로그인한 사용자를 세션 id 쿠키로 알아보고, 세션은 서버 메모리에 있다는 것(쿠키, 세션, 토큰 레슨). Redis는 메모리에 키와 값을 두는 저장소라는 것만 알면 돼요. Redis는 A5에서 자세히 다뤄요.'
example: '로그인이 필요한 쇼핑몰 API 서버를 한 대에서 두 대로 늘린다. 앞의 로드 밸런서가 요청을 번갈아 보낸다. 로그인 세션, 서버 메모리의 카운터, 매일 도는 정산 작업이 어떻게 되는지 본다.'
intro:
  - '이벤트 날 서버가 버거워서 한 대를 더 띄웠어요. 그런데 사용자들이 "로그인했는데 새로고침하면 로그아웃돼요"라고 해요. 같은 코드를 두 대에 띄웠을 뿐인데요.'
  - '스프링 개발자가 짠 코드는 결국 서버 여러 대에서 돌아요. 그래서 "이 값을 서버 메모리에 둬도 되나"를 늘 정해야 해요. 세션, 캐시, 업로드한 파일, 스케줄러가 모두 이 질문을 받아요. 면접에서는 "스케일 업과 스케일 아웃", "세션 불일치를 어떻게 푸나요"로 물어요.'
  - '이 레슨에서는 작은 스프링 서버 두 대와 번갈아 보내는 로드 밸런서를 만들어, 서버 메모리의 세션이 어떻게 사라지는지 보고 Redis에 세션을 두면 어떻게 풀리는지 확인해요.'
covers:
  - topic: '스케일 업은 서버 한 대의 CPU와 메모리를 키우고, 스케일 아웃은 같은 서버를 여러 대로 늘린다'
    where: '질문 1'
  - topic: '스케일 업은 코드를 고칠 일이 없지만 한계가 있고 한 대가 죽으면 서비스가 멈춘다. 스케일 아웃은 한 대가 죽어도 버티고 계속 늘릴 수 있지만 서버 사이에 상태를 나눠야 한다'
    where: '질문 1'
  - topic: '로드 밸런서는 여러 서버 앞에서 요청을 나눠 준다. 라운드 로빈, 가장 적게 연결된 서버 같은 방식이 있다'
    where: '질문 2'
  - topic: '로드 밸런서는 헬스 체크로 죽은 서버를 빼고 보낸다'
    where: '질문 2'
  - topic: 'L4 로드 밸런서는 IP와 포트로, L7 로드 밸런서는 HTTP 내용(경로, 헤더)으로 나눈다'
    where: '질문 2의 더 알아보기'
  - topic: '서버 메모리의 세션은 그 서버에만 있다. 다른 서버로 간 요청은 로그인하지 않은 것으로 보인다'
    where: '질문 3'
  - topic: '세션 문제를 푸는 세 방법: 스티키 세션, 세션 저장소(Redis)를 함께 쓰기, 토큰처럼 서버가 상태를 갖지 않기'
    where: '질문 3'
  - topic: '스티키 세션은 그 서버가 죽으면 세션을 잃고 부하가 고르지 않다'
    where: '질문 3'
  - topic: '무상태(stateless) 서버: 요청에 필요한 상태를 서버 메모리가 아니라 요청이나 공유 저장소에 둔다. 그래야 아무 서버나 받아도 된다'
    where: '질문 4'
  - topic: '세션 말고도 서버 메모리에 두면 어긋나는 것: 로컬 캐시, 메모리 카운터, 로컬 디스크에 저장한 업로드 파일'
    where: '질문 4'
  - topic: '@Scheduled 작업은 서버마다 돈다. 두 대면 정산이 두 번 돈다'
    where: '질문 4'
  - topic: '스프링 세션(Spring Session Data Redis)으로 코드를 고치지 않고 세션을 Redis에 두는 설정'
    where: '실무에서는'
  - topic: 'DB는 여러 서버가 함께 쓰므로 서버를 늘리면 DB와 커넥션 풀이 다음 병목이 된다'
    where: '실무에서는. 풀 크기는 스레드 풀과 커넥션 풀 크기(A11), DB를 늘리는 것은 DB 복제와 샤딩(A15)'
  - topic: '자주 읽는 값을 서버 앞에 두기'
    where: '다루지 않음: 캐시 전략과 무효화(A4)'
  - topic: '여러 서버에서 한 번만 실행되게 하는 락'
    where: '다루지 않음: 분산 락(A12)'
codes:
  predict: |-
    @PostMapping("/login")
    String login(HttpSession session) {
      session.setAttribute("user", "minji");
      return "ok";
    }
    @GetMapping("/me")
    String me(HttpSession session) {
      Object u =
          session.getAttribute("user");
      return u == null ? "guest" : (String) u;
    }
  counter: |-
    private final AtomicLong views =
        new AtomicLong();
    @PostMapping("/views")
    long view() {
      return views.incrementAndGet();
    }
  redisSession: |-
    String sid = UUID.randomUUID()
        .toString();
    redis.setex("session:" + sid,
        1800, "minji");
predict:
  text: '코드 predict를 서버 두 대에 띄우고, 로드 밸런서가 요청을 서버 1, 서버 2 순서로 번갈아 보내요. 사용자가 `POST /login`을 보낸 뒤 `GET /me`를 두 번 보내요. 두 번의 `/me`는 각각 무엇을 받을까요? 보기: minji와 minji, guest와 minji, guest와 guest.'
  answer: 'guest와 minji. 로그인은 서버 1에서, 첫 /me는 서버 2로 가서 세션이 없고, 둘째 /me는 서버 1로 가서 세션이 있다. 질문 3에서 밝힌다.'
questions:
  - id: q1
    title: 서버가 버거우면 어떤 방법으로 늘리나요?
    conclusion:
      lead: '한 대를 더 크게 만드는 스케일 업과, 같은 서버를 여러 대로 늘리는 스케일 아웃이 있어요.'
      sub: '스케일 업은 코드를 고칠 일이 없지만 한계와 비용이 크고 한 대가 죽으면 멈춰요. 스케일 아웃은 계속 늘리고 한 대가 죽어도 버티지만, 서버들이 상태를 나눠 가져야 해요.'
    says:
      - '스케일 업(수직 확장): CPU, 메모리를 큰 것으로 바꾼다. 같은 코드가 그대로 빨라진다. 살 수 있는 가장 큰 서버가 한계이고, 크기가 두 배면 값은 두 배보다 비싸지기 쉽다'
      - '스케일 아웃(수평 확장): 같은 서버를 여러 대 띄우고 앞에서 요청을 나눈다. 한 대가 죽어도 나머지가 받는다(가용성). 대신 한 서버의 메모리에만 있는 것이 문제가 된다'
      - '두 방법을 표로 비교한다: 코드 변경, 한계, 장애에 버티는 정도, 비용'
      - '웹 서버(스프링 애플리케이션)는 스케일 아웃이 쉽고, DB는 데이터를 나눠야 해서 어렵다. 그래서 보통 애플리케이션은 늘리고 DB는 키운다. DB를 나누는 것은 A15'
    asks:
      - '본문의 예시: 쇼핑몰 API 서버 한 대를 메모리 두 배인 서버로 바꿨다. 이 방법의 이름과, 이 서버가 죽었을 때 서비스는 (스케일 업. 서비스가 멈춘다)'
      - '옮긴 상황: 서버 4대가 요청을 나눠 받다가 1대가 죽었다. 로드 밸런서가 죽은 서버를 빼면 서비스는 어떻게 되나 (나머지 3대가 받는다. 처리량이 줄 뿐 멈추지 않는다)'
  - id: q2
    title: 로드 밸런서는 요청을 어떻게 나눠 주나요?
    conclusion:
      lead: '여러 서버 앞에 서서 정해진 방식으로 서버를 골라 요청을 넘기고, 헬스 체크로 죽은 서버는 빼요.'
      sub: '라운드 로빈은 차례로 돌아가며, 가장 적은 연결 방식은 지금 일이 적은 서버로 보내요. 사용자는 로드 밸런서 주소 하나만 알아요.'
    says:
      - '클라이언트는 로드 밸런서의 주소로 요청한다. 로드 밸런서가 뒤의 서버 하나를 골라 넘기고 응답을 돌려준다'
      - '라운드 로빈: 서버 1, 2, 1, 2 순서. 요청마다 일의 크기가 비슷하면 고르다. 가장 적은 연결: 처리 중인 요청이 적은 서버로. 요청마다 걸리는 시간이 다르면 낫다'
      - '헬스 체크: 로드 밸런서가 서버마다 `/actuator/health` 같은 주소를 주기적으로 부른다. 응답이 없으면 그 서버로 보내지 않는다'
      - '테스트의 로드 밸런서는 라운드 로빈으로 두 서버에 번갈아 보내는 작은 자바 코드다. 이것으로 질문 3과 4를 돌린다'
      - '더 알아보기: L4 로드 밸런서는 IP와 포트만 보고 나눈다. L7은 HTTP를 열어 경로(`/api`, `/images`)나 쿠키로 나눌 수 있다. Nginx와 클라우드의 애플리케이션 로드 밸런서가 L7이다'
    asks:
      - '본문의 예시: 서버 두 대에 라운드 로빈으로 요청 5개를 보내면 서버 1과 서버 2가 받는 수는 (3개와 2개)'
      - '옮긴 상황: 대부분 10ms인데 가끔 3초 걸리는 리포트 요청이 섞인다. 라운드 로빈과 가장 적은 연결 가운데 느린 요청 뒤에 줄 서는 요청이 적은 쪽은 (가장 적은 연결)'
  - id: q3
    title: 서버를 두 대로 늘리면 로그인이 왜 풀리나요?
    conclusion:
      lead: '세션이 로그인을 처리한 서버의 메모리에만 있어서, 다른 서버로 간 요청은 그 세션을 찾지 못해요.'
      sub: '같은 서버로만 보내는 스티키 세션, 세션을 Redis 같은 공유 저장소에 두기, 서버가 세션을 갖지 않는 토큰 방식으로 풀어요.'
    says:
      - '코드 predict를 두 서버에 띄우고 로드 밸런서로 `/login`, `/me`, `/me`를 보낸다. 결과는 minji가 아니라 guest, minji다. 예측의 답을 밝힌다. 실제 출력을 보인다'
      - '이유: `HttpSession`은 톰캣이 그 서버의 메모리에 둔다. 세션 id 쿠키는 브라우저가 보내지만, 서버 2의 메모리에는 그 id의 세션이 없다'
      - '스티키 세션: 로드 밸런서가 쿠키를 보고 같은 사용자를 늘 같은 서버로 보낸다. 고치기 쉽지만 그 서버가 죽으면 세션을 잃고, 오래 머무는 사용자가 많은 서버에 부하가 몰린다'
      - '세션 저장소: 세션을 Redis에 두고 두 서버가 함께 읽는다. 코드 redisSession처럼 세션 id를 키로 사용자를 넣는다. 같은 요청 순서에서 minji, minji가 나오는 것을 보인다'
      - '토큰: 서버가 서명한 토큰(JWT)을 클라이언트가 들고 다닌다. 서버는 저장할 것이 없다. N7에서 다뤘다'
    widget:
      kind: toggle
      note: '세션을 어디에 두는지(서버 메모리, 스티키 세션, Redis) 고르고 실행을 누르면 /login, /me, /me 요청이 어느 서버로 가서 무엇을 받는지 로그로 보인다. 스티키 세션에서는 서버 1을 내리는 단계를 더해 세션을 잃는 것을 보인다'
    asks:
      - '본문의 예시: 세션을 Redis에 두고 서버 두 대를 라운드 로빈으로 돌린다. 서버 1에서 로그인한 뒤 서버 2로 간 `/me`는 무엇을 받나 (minji. 두 서버가 같은 Redis를 읽는다)'
      - '옮긴 상황: 스티키 세션으로 운영하다 서버 1을 배포하려고 내렸다. 서버 1에 붙어 있던 사용자의 다음 요청은 (서버 2로 가고 세션이 없어 다시 로그인해야 한다)'
  - id: q4
    title: 세션 말고도 서버 메모리에 두면 안 되는 것은 무엇인가요?
    conclusion:
      lead: '서버마다 따로 가지면 어긋나는 상태는 모두 그래요. 메모리 카운터, 로컬 캐시, 로컬 디스크의 파일, 그리고 서버마다 도는 스케줄러가 그래요.'
      sub: '아무 서버가 받아도 같은 답을 하게 상태를 공유 저장소(DB, Redis, 파일 저장소)에 두는 서버를 무상태 서버라고 해요.'
    says:
      - '코드 counter를 두 서버에 띄우고 조회수를 네 번 올린다. 서버마다 2씩이라 응답은 1, 1, 2, 2다. 실제 조회수 4는 어디에도 없다. 실제 출력을 보인다'
      - '로컬 캐시: 서버 1의 캐시를 지워도 서버 2의 캐시는 옛 값을 준다. 캐시를 어떻게 맞추는지는 A4'
      - '업로드 파일: 서버 1의 디스크에 저장한 이미지를 서버 2로 간 요청은 찾지 못한다. 파일은 공유 파일 저장소(S3 같은 객체 저장소)에 둔다'
      - '`@Scheduled`는 서버마다 돈다. 매일 0시 정산이 서버 두 대에서 두 번 돈다. 두 서버를 띄워 스케줄 작업이 두 번 실행된 것을 센다. 한 번만 돌게 하는 방법은 분산 락(A12)이나 스케줄 전용 서버 하나'
      - '무상태 서버의 정의와, 그래서 스케일 아웃이 쉬워진다는 것으로 정리한다'
    asks:
      - '본문의 예시: 코드 counter를 서버 세 대에 띄우고 라운드 로빈으로 조회수를 여섯 번 올렸다. 마지막 응답은 (2. 서버마다 두 번씩)'
      - '옮긴 상황: 매시 정각에 쿠폰 만료 메일을 보내는 `@Scheduled` 메서드가 있다. 서버를 세 대로 늘리면 회원 한 명은 메일을 몇 통 받나 (세 통)'
      - '실무 구역: 스프링 세션 Redis를 넣고 `@EnableRedisHttpSession`을 켰다. 컨트롤러가 `HttpSession`에 넣는 코드는 고쳐야 하나 (아니다. 같은 `HttpSession`이 Redis에 저장된다)'
practice:
  says:
    - '스프링 세션: `spring-session-data-redis` 의존성과 `spring.session.store-type`(부트 3에서는 의존성만으로 켜진다), Redis 주소 설정. 컨트롤러의 `HttpSession` 코드는 그대로이고 세션이 Redis의 해시로 저장된다. 의존성을 검증 프로젝트에 더하지 않으므로 스프링 세션 문서가 근거라고 밝힌다'
    - '세션에 넣는 객체는 Redis에 쓰려고 직렬화된다. `Serializable`이 아닌 객체를 넣으면 저장할 때 실패한다(문서 근거)'
    - '흔한 실수: 서버를 늘리면서 `@Scheduled` 정산을 그대로 둔다. 고친 코드: 스케줄 작업을 한 서버에서만 켜는 설정(`app.scheduling.enabled`와 `@ConditionalOnProperty`)이나 분산 락(A12). 설정으로 켜고 끄는 것은 테스트로 보인다'
    - '서버를 늘리면 DB 커넥션 수도 서버 수만큼 늘어난다. 서버마다 풀이 10개면 4대에 40개다. DB의 최대 연결 수를 넘지 않는지 본다. 풀 크기는 A11'
claims:
  - claim: '서버 메모리 세션으로 두 서버를 라운드 로빈으로 돌리면 /login 뒤의 /me 두 번이 guest, minji다'
    how: '`MiniWeb` 두 개와 라운드 로빈으로 보내는 작은 클라이언트. 쿠키를 들고 다닌다'
  - claim: '세션을 Redis에 두면 같은 순서에서 minji, minji다'
    how: 'Redis 컨테이너에 세션 id와 사용자를 넣고 두 서버가 읽는다'
  - claim: '서버 메모리 카운터는 서버마다 따로 센다'
    how: '같은 구성으로 조회수를 네 번 올린다'
  - claim: '`@Scheduled` 작업은 서버마다 실행된다'
    how: '스케줄을 켠 작은 앱 두 개를 띄우고 공유 카운터(Redis INCR)로 실행 횟수를 센다'
  - claim: '설정 값으로 한 서버에서만 스케줄을 켜면 실행은 한 서버에서만 일어난다'
    how: '`@ConditionalOnProperty`로 한쪽만 켜고 센다'
sources:
  - '스프링 세션 Redis: https://docs.spring.io/spring-session/reference/guides/boot-redis.html'
  - '스케일 업과 스케일 아웃, 로드 밸런서의 방식: Nginx 로드 밸런싱 문서 https://nginx.org/en/docs/http/load_balancing.html'
