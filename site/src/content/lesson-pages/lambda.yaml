predict:
  title: 합계를 내는 람다는 어떻게 될까요?
  text: '`orders`에는 10000원짜리 주문 둘이 들어 있어요. 람다로 금액을 더해 합계를 내려고 해요. 어떻게 될까요? 모르는 게 정상이니 감으로 골라 보세요. 답은 질문 3에 나와요.'
  code: predict
  label: 내 예측
  options:
    - value: sum
      label: 20000을 출력한다
    - value: zero
      label: 0을 출력한다
    - value: compile
      label: 컴파일 오류
  answer: compile
  storageKey: lam-predict
  wrong: 예측은 "{label}"이었어요. 틀린 예측이 더 오래 남으니 괜찮아요.
questions:
  - id: q1
    title: 람다는 무엇이고 함수형 인터페이스와 어떤 관계인가요?
    conclusion:
      lead: '람다는 추상 메서드가 하나뿐인 인터페이스(함수형 인터페이스)의 구현을, 그 메서드의 매개변수와 본문만 써서 만드는 문법이에요.'
      sub: '메서드가 하나뿐이라서 이름을 쓰지 않아도 컴파일러가 어느 메서드의 구현인지 알아요.'
    says:
      - '`Predicate<Order>`는 `boolean test(Order o)` 하나를 가진 인터페이스다. "주문을 받아 맞는지 아닌지를 답하는 것"을 나타낸다'
      - '코드 three. 같은 조건을 세 가지로 쓴다. 클래스를 만들어 구현하기, 익명 클래스, 람다. 셋 다 `Predicate<Order>` 타입의 변수에 담기고 `test(order)`를 부르면 같은 결과가 나온다'
      - '람다 `o -> o.getPrice() >= 10000`에서 `o`가 `test`의 매개변수이고 화살표 뒤가 본문이다. 매개변수의 타입은 컴파일러가 `Predicate<Order>`를 보고 안다. 본문이 식 하나면 중괄호와 `return`을 생략한다'
      - '람다만 따로 놓고는 타입을 알 수 없다. 받는 쪽의 타입이 정한다. 같은 `o -> o.getPrice() >= 10000`이 `Predicate<Order>`에도 `Function<Order, Boolean>`에도 담긴다'
      - '추상 메서드가 둘 이상인 인터페이스는 람다로 구현할 수 없다. 어느 메서드의 본문인지 정할 수 없다. `@FunctionalInterface`를 붙이면 메서드가 하나가 아닐 때 컴파일러가 알려 준다'
      - '직접 만든 인터페이스도 메서드가 하나면 람다로 구현할 수 있다. J7의 `Notifier`가 그렇다'
      - '더 알아보기: 람다는 익명 클래스를 짧게 쓴 것처럼 보이지만 컴파일된 모습은 다르다. 클래스 파일이 따로 생기지 않고 실행 중에 만들어진다'
    asks:
      - '본문의 예시: 코드 three의 `p3`에 대해 금액이 5000인 주문으로 `p3.test(order)`를 부르면 결과는 무엇인가 (false)'
      - '옮긴 상황: `interface Validator { boolean validate(Order o); String name(); }`에 `Validator v = o -> o.getPrice() > 0;`을 쓰면 어떻게 되나 (컴파일 오류. 추상 메서드가 둘이라 함수형 인터페이스가 아니다)'
    body:
      - p: '"금액이 10000원 이상인 주문인가"를 판단하는 것을 만들어요. 자바에는 이런 일을 위한 인터페이스 `Predicate<T>`가 있어요. 메서드는 `boolean test(T t)` 하나예요. 이것을 세 가지로 구현할 수 있어요.'
      - code: three
        notes:
          - mark: o -> o.getPrice() >= 10000
            as: code
            text: '화살표 왼쪽 `o`가 `test`의 매개변수, 오른쪽이 본문이에요. 본문이 식 하나라서 중괄호와 `return`을 생략했어요.'
      - ci:
          key: three
          label: 세 가지의 실제 결과 보기
          source: LambdaTest.threeWaysSameResult
          code: threeRun
      - p: '셋은 같은 일을 해요. 세 번째가 **람다**예요. 인터페이스의 메서드 하나를 구현하는 데 필요한 것, 곧 매개변수와 본문만 남기고 나머지를 지운 모양이에요. 상속과 다형성 레슨에서 본 "인터페이스를 구현한 객체"를 아주 짧게 만드는 문법이에요.'
      - h3: 메서드가 하나여야 해요
      - p: '람다에는 메서드 이름이 없어요. 그래도 컴파일러가 어느 메서드의 구현인지 아는 것은 **추상 메서드가 하나뿐**이기 때문이에요. 이런 인터페이스를 **함수형 인터페이스**라고 해요. 메서드가 둘이면 어떻게 될까요?'
      - code: notFunctional
      - ci:
          key: not-functional
          label: 컴파일 결과 보기
          source: LambdaTest.notFunctional
      - ul:
          - '**람다의 타입은 받는 쪽이 정해요.** 같은 `o -> o.getPrice() >= 10000`이 `Predicate<Order>`에도 `Function<Order, Boolean>`에도 담겨요. 매개변수 `o`의 타입도 받는 쪽을 보고 컴파일러가 알아내요.'
          - '**내가 만든 인터페이스도 메서드가 하나면 람다로 구현돼요.** 인터페이스에 `@FunctionalInterface`를 붙이면 메서드가 하나가 아닐 때 컴파일러가 알려 줘요.'
      - more:
          summary: '더 알아보기: 람다는 익명 클래스가 아니에요'
          body:
            - p: '람다는 익명 클래스를 짧게 쓴 것처럼 보이지만 컴파일된 모습이 달라요. 익명 클래스는 `Shop$1.class` 같은 클래스 파일이 따로 생기지만, 람다는 실행 중에 JVM이 구현 객체를 만들어요. 안에서 `this`가 가리키는 것도 달라서, 질문 3의 더 알아보기에서 짧게 봐요.'
      - quiz:
          q: '`interface Validator { boolean validate(Order o); String name(); }`에 `Validator v = o -> o.getPrice() > 0;`을 쓰면?'
          options:
            - 컴파일되고 validate가 구현된다
            - 컴파일 오류. 추상 메서드가 둘이라 함수형 인터페이스가 아니다
            - 컴파일되고 두 메서드 모두 같은 본문을 쓴다
          answer: 2
          explain: '람다는 추상 메서드 하나의 구현이에요. 메서드가 둘이면 어느 것의 본문인지 정할 수 없어요.'
      - next: '람다를 변수에 담거나 메서드에 넘기면, 그 본문은 언제 실행될까요?'
    recall: '람다는 추상 메서드가 하나뿐인 인터페이스(함수형 인터페이스)의 구현을, 매개변수와 본문만 써서 만드는 문법이에요. 클래스로 구현한 것, 익명 클래스와 같은 일을 해요. 메서드가 하나라서 이름 없이도 컴파일러가 어느 메서드인지 알고, 람다의 타입은 받는 쪽의 인터페이스가 정해요. 메서드가 둘인 인터페이스에는 쓸 수 없어요.'
  - id: q2
    title: 람다를 받은 쪽은 그것을 어떻게 쓰고, 람다는 언제 실행되나요?
    conclusion:
      lead: '받은 쪽이 인터페이스의 메서드를 부르는 순간에 람다의 본문이 실행돼요. 람다를 쓴 줄에서는 실행되지 않아요.'
      sub: '그래서 받은 쪽이 한 번도 부르지 않으면 본문은 실행되지 않고, 여러 번 부르면 여러 번 실행돼요.'
    says:
      - '표준 함수형 인터페이스 넷과 부르는 메서드. `Function<T, R>`은 받아서 바꿔 돌려준다(`apply`). `Predicate<T>`는 받아서 맞는지 답한다(`test`). `Supplier<T>`는 받지 않고 만들어 준다(`get`). `Consumer<T>`는 받아서 쓰고 돌려주지 않는다(`accept`)'
      - '오래된 것 둘. `Runnable`은 받지도 돌려주지도 않는다(`run`). `Comparator<T>`는 둘을 받아 순서를 답한다(`compare`)'
      - '람다를 넘긴다는 것은 값이 아니라 "할 일"을 넘기는 것이다. `orders.removeIf(o -> o.getPrice() < 1000)`에서 `removeIf`는 주문마다 `test`를 불러 지울지 정한다. 주문이 다섯이면 본문이 다섯 번 실행된다'
      - '코드 lazy. "람다를 정의함"이 먼저 출력된다. 람다를 변수에 담는 줄에서는 본문이 실행되지 않는다. `s.get()`을 부를 때마다 "주문 만드는 중"이 출력되고 새 주문이 만들어진다'
      - '이 성질로 "필요할 때만 계산하기"를 만든다. 값 대신 `Supplier`를 받으면 받은 쪽이 필요할 때만 `get()`을 부른다. `Optional`의 `orElseGet`이 이렇게 동작하고 J13에서 다룬다'
      - '더 알아보기: 인자가 둘이면 `BiFunction`, 같은 타입을 받아 같은 타입을 돌려주면 `UnaryOperator`, 박싱을 피하려면 `IntPredicate` 같은 기본형용이 있다. `f.andThen(g)`, `p.and(q)`, `p.negate()`, `comparator.thenComparing(...)`으로 람다를 이어 붙인다'
    asks:
      - '본문의 예시: 코드 lazy에서 "주문 만드는 중"은 몇 번 출력되고, "람다를 정의함"보다 먼저 출력되나 나중에 출력되나 (두 번 출력되고, 둘 다 "람다를 정의함"보다 나중이다)'
      - '옮긴 상황: `static void runIf(boolean flag, Runnable r) { if (flag) r.run(); }`에 `runIf(false, () -> print("실행"))`을 부르면 "실행"이 출력되나 (출력되지 않는다. `run()`이 불리지 않았다)'
    body:
      - p: '자바는 자주 쓰는 함수형 인터페이스를 미리 만들어 뒀어요. 이름과 메서드만 알면 API를 읽을 수 있어요.'
      - table:
          head: [인터페이스, 하는 일, 부르는 메서드]
          rows:
            - ['`Function<T, R>`', 'T를 받아 R로 바꿔 돌려줌', '`apply`']
            - ['`Predicate<T>`', 'T를 받아 맞는지 답함', '`test`']
            - ['`Supplier<T>`', '받지 않고 T를 만들어 줌', '`get`']
            - ['`Consumer<T>`', 'T를 받아 쓰고 돌려주지 않음', '`accept`']
            - ['`Runnable`', '받지도 돌려주지도 않음', '`run`']
            - ['`Comparator<T>`', 'T 둘을 받아 순서를 답함', '`compare`']
      - h3: 람다는 "할 일"이에요
      - p: '람다를 넘기는 것은 값을 넘기는 것이 아니라 **할 일을 넘기는 것**이에요. 받은 쪽이 그 인터페이스의 메서드를 **부를 때마다** 본문이 실행돼요. 아래 코드의 출력 순서를 예상해 보고 열어 보세요.'
      - ci:
          key: lazy
          label: 실제 출력 보기
          source: LambdaTest.lazy
          code: lazy
      - ul:
          - '**람다를 변수에 담는 줄에서는 아무것도 실행되지 않아요.** 그래서 "람다를 정의함"이 먼저예요.'
          - '**`get()`을 부를 때마다 실행돼요.** 두 번 불렀으니 두 번, 그리고 주문도 두 개 만들어져요.'
          - '**받은 쪽이 한 번도 부르지 않으면 실행되지 않아요.** `orders.removeIf(o -> ...)`는 주문마다 `test`를 불러서, 주문이 다섯이면 본문이 다섯 번 실행돼요.'
      - p: '이 성질로 "필요할 때만 계산하기"를 만들어요. 값 대신 `Supplier`를 받으면 받은 쪽이 정말 필요할 때만 `get()`을 불러요. `Optional`의 `orElseGet`이 이렇게 동작하고, 스트림과 Optional 레슨에서 그 차이가 만드는 버그를 봐요.'
      - more:
          summary: '더 알아보기: 그 밖의 인터페이스와 이어 붙이기'
          body:
            - ul:
                - '인자가 둘이면 `BiFunction`, `BiConsumer`. 같은 타입을 받아 같은 타입을 돌려주면 `UnaryOperator`. 박싱을 피하려면 `IntPredicate`, `ToIntFunction` 같은 기본형용이 있어요.'
                - '`f.andThen(g)`, `p.and(q)`, `p.negate()`, `comparator.thenComparing(...)`으로 람다를 이어 붙여요.'
      - quiz:
          q: '`static void runIf(boolean flag, Runnable r) { if (flag) r.run(); }`에 `runIf(false, () -> print("실행"))`을 부르면?'
          options:
            - '"실행"이 출력된다'
            - '아무것도 출력되지 않는다'
            - 컴파일 오류
          answer: 2
          explain: 'flag가 false라 `r.run()`이 불리지 않아요. 람다는 넘긴 것만으로는 실행되지 않아요.'
      - next: '람다는 나중에 실행된다고 했어요. 그러면 람다 안에서 바깥의 지역 변수를 쓰면, 나중에 실행될 때 그 변수는 어떻게 될까요?'
    recall: '받은 쪽이 인터페이스의 메서드(`test`, `apply`, `get` 등)를 부르는 순간에 람다의 본문이 실행돼요. 람다를 쓴 줄에서는 실행되지 않아요. 그래서 한 번도 안 불리면 실행되지 않고, 여러 번 불리면 여러 번 실행돼요. 람다를 넘긴다는 것은 값이 아니라 할 일을 넘기는 것이에요.'
  - id: q3
    title: 람다 안에서 바깥의 변수를 쓸 때 어떤 규칙이 있나요?
    conclusion:
      lead: '바깥의 지역 변수는 값이 한 번 정해진 뒤 바뀌지 않을 때만(사실상 final) 쓸 수 있어요.'
      sub: '람다는 변수 자체가 아니라 그 시점의 값을 복사해 가져가기 때문에, 어느 쪽에서든 바뀌면 둘이 어긋나요.'
    says:
      - '`int min = 10000; Predicate<Order> p = o -> o.getPrice() >= min;`은 된다. 람다가 `min`을 쓴다. 이것을 변수를 잡는다(capture)고 한다'
      - '`min`에 값을 한 번만 대입했으므로 `final`을 쓰지 않아도 사실상 final이다. 람다 앞이든 뒤든 `min = 20000;`을 한 줄 넣으면 람다가 컴파일되지 않는다'
      - '코드 predict. `total += ...`은 람다 안에서 바깥 변수를 바꾸는 것이라 컴파일 오류다. 예측의 답을 밝힌다'
      - '이유. 람다는 질문 2에서 본 대로 나중에, 다른 메서드에서, 때로는 다른 스레드에서 실행된다. 그때 지역 변수 `min`은 이미 사라졌을 수 있다. 그래서 람다는 만들어질 때 `min`의 값을 복사해 간다(J2에서 본 값 복사). 복사본과 원본이 따로 바뀌면 같은 이름이 다른 값을 뜻하게 되므로 자바는 바꾸는 것 자체를 막는다'
      - '막는 것은 변수의 재대입뿐이다. 변수가 가리키는 객체는 바꿀 수 있다. `List<Order> result = new ArrayList<>(); orders.forEach(o -> result.add(o));`는 된다. `result`가 가리키는 리스트는 그대로이고 리스트의 내용이 바뀐다'
      - '필드는 지역 변수가 아니라서 이 규칙을 받지 않는다. 람다 안에서 `this.count++`는 컴파일된다. 다만 여러 스레드가 함께 쓰는 객체의 필드를 람다에서 바꾸면 C3의 문제가 생긴다'
      - '더 알아보기: 람다 안의 `this`는 람다를 쓴 메서드의 객체다. 익명 클래스 안의 `this`는 익명 클래스의 객체다. 이 차이는 J16에서 다룬다'
    widget:
      kind: classify
      note: '코드 조각을 "컴파일된다"와 "컴파일 오류" 가운데 고른다. 항목: 한 번만 대입한 `min`을 람다에서 읽기(된다), 람다 뒤에서 `min = 20000` 재대입(오류), 람다 안에서 `total += price`(오류), 람다 안에서 바깥 리스트에 `add`(된다), 람다 안에서 필드 `this.count++`(된다), for 문의 `int i`를 람다에서 읽기(오류), 향상된 for 문의 `Order o`를 람다에서 읽기(된다)'
    asks:
      - '본문의 예시: `int min = 10000; Predicate<Order> p = o -> o.getPrice() >= min; min = 20000;`을 컴파일하면 어떻게 되나 (컴파일 오류. `min`이 사실상 final이 아니게 됐다)'
      - '옮긴 상황: `List<String> names = new ArrayList<>(); orders.forEach(o -> names.add(o.getName()));`을 컴파일하고 실행하면 어떻게 되나. 조건: `orders`에 주문이 셋 있다 (컴파일되고 `names`에 이름 셋이 들어간다. 변수를 재대입하지 않았다)'
      - '실무 구역: 서비스 메서드 안에서 `int total = 0; orders.forEach(o -> total += o.getPrice());`를 `int total = orders.stream().mapToInt(Order::getPrice).sum();`으로 바꿨다. 주문 금액이 10000, 20000일 때 `total`은 얼마이고 컴파일은 되나 (컴파일되고 30000이다)'
    body:
      - p: '람다는 바깥의 지역 변수를 쓸 수 있어요. 이것을 변수를 **잡는다**(capture)고 해요.'
      - code: captureOk
        notes:
          - mark: min
            as: code
            text: '바깥 메서드의 지역 변수예요. 람다가 이 값을 써요.'
      - p: '단, 조건이 있어요. 처음 예측한 코드의 답은 **컴파일 오류**예요. {{predict-result}}'
      - ci:
          key: predict
          label: 컴파일 결과 보기
          source: LambdaTest.predict
          code: predict
      - p: '람다가 잡는 지역 변수는 **final이거나 사실상 final**이어야 해요. 사실상 final은 `final`이라고 쓰지 않았어도 값을 한 번만 대입하고 다시 바꾸지 않은 변수예요. `total += ...`은 바깥 변수를 바꾸니 안 돼요. 람다 앞이든 뒤든 `min = 20000;` 한 줄만 넣어도 `min`을 잡은 람다가 컴파일되지 않아요.'
      - h3: 왜 막을까요
      - ol:
          - '질문 2에서 본 대로 람다는 **나중에** 실행돼요. 다른 메서드에서, 때로는 다른 스레드에서요.'
          - '그때 그 지역 변수는 이미 사라졌을 수 있어요. 지역 변수는 메서드가 끝나면 사라지니까요.'
          - '그래서 람다는 만들어질 때 **변수의 값을 복사해 가요.** 값과 참조 레슨의 "메서드에 넘길 때 값이 복사된다"와 같은 일이에요.'
          - '복사본과 원본이 따로 바뀔 수 있다면 같은 이름이 서로 다른 값을 뜻하게 돼요. 자바는 그 혼란을 막으려고 **바꾸는 것 자체를** 막아요.'
      - h3: 막는 것은 재대입뿐이에요
      - p: '변수에 다시 대입하는 것만 막을 뿐, 변수가 **가리키는 객체**는 바꿀 수 있어요. 일곱 조각이 컴파일될지 골라 보세요. 모두 어떤 클래스의 인스턴스 메서드 안에 있고, 그 클래스에는 `int count` 필드가 있어요.'
      - widget:
          kind: classify
          categories: [컴파일된다, 컴파일 오류]
          items:
            - text: '`int min = 10000;` 다음 줄에 `Predicate<Integer> p = o -> o >= min;`'
              answer: 1
              explain: '`min`을 한 번만 대입해서 사실상 final이에요.'
            - text: '위 두 줄 뒤에 `min = 20000;`'
              answer: 2
              explain: '다시 대입해서 사실상 final이 아니게 됐어요. 람다 쪽에서 오류가 나요.'
            - text: '`int total = 0;` 다음 줄에 `orders.forEach(o -> total += o);`'
              answer: 2
              explain: '람다 안에서 바깥 지역 변수에 대입해요.'
            - text: '`List<Integer> result = new ArrayList<>();` 다음 줄에 `orders.forEach(o -> result.add(o));`'
              answer: 1
              explain: '`result`에는 다시 대입하지 않아요. 가리키는 리스트의 내용만 바뀌어요.'
            - text: '`orders.forEach(o -> this.count++);`'
              answer: 1
              explain: '필드는 지역 변수가 아니라서 이 규칙을 받지 않아요.'
            - text: '`for (int i = 0; i < 3; i++) { Runnable r = () -> System.out.println(i); }`'
              answer: 2
              explain: '`i`는 돌 때마다 `i++`로 다시 대입되는 하나의 변수예요.'
            - text: '`for (Integer o : orders) { Runnable r = () -> System.out.println(o); }`'
              answer: 1
              explain: '향상된 for 문의 `o`는 돌 때마다 새로 생기는 변수라 사실상 final이에요.'
      - ci:
          key: capture
          label: 일곱 조각을 실제로 컴파일한 결과 보기
          source: LambdaTest.captureRules
          code: captureRun
      - muted: '필드는 람다 안에서 바꿀 수 있지만, 여러 스레드가 함께 쓰는 객체의 필드를 람다에서 바꾸면 값이 틀어질 수 있어요. 경쟁 상태와 동기화 레슨에서 다뤄요.'
      - more:
          summary: '더 알아보기: 람다 안의 this'
          body:
            - p: '람다 안의 `this`는 람다를 쓴 메서드의 객체예요. 람다는 새 객체의 문맥을 만들지 않으니까요. 익명 클래스 안의 `this`는 그 익명 클래스의 객체예요. 이 차이가 만드는 결과는 중첩 클래스와 익명 클래스 레슨에서 다뤄요.'
      - quiz:
          q: '`int min = 10000; Predicate<Order> p = o -> o.getPrice() >= min; min = 20000;`을 컴파일하면?'
          options:
            - 컴파일되고 p는 20000을 기준으로 판단한다
            - 컴파일되고 p는 10000을 기준으로 판단한다
            - 컴파일 오류
          answer: 3
          explain: '`min`을 다시 대입해서 사실상 final이 아니에요. 그런 변수는 람다가 잡을 수 없어요.'
      - next: '람다의 본문이 이미 있는 메서드를 부르기만 할 때가 많아요. 더 짧게 쓸 수는 없을까요?'
    recall: '바깥의 지역 변수는 한 번 대입한 뒤 바뀌지 않을 때(사실상 final)만 쓸 수 있어요. 람다는 나중에 실행되므로 만들어질 때 변수의 값을 복사해 가고, 복사본과 원본이 어긋나지 않게 자바가 재대입을 막아요. 막는 것은 재대입뿐이라 변수가 가리키는 리스트에 `add`하는 것과 필드를 바꾸는 것은 돼요.'
  - id: q4
    title: 메서드 참조는 무엇인가요?
    conclusion:
      lead: '이미 있는 메서드를 부르기만 하는 람다를 `클래스::메서드`로 더 짧게 쓴 것이에요.'
      sub: '`o -> o.getPrice()`와 `Order::getPrice`는 같은 일을 하고, 인자를 어디에 넘길지는 컴파일러가 채워요.'
    says:
      - '람다의 본문이 메서드 호출 하나뿐이면 메서드 참조로 쓸 수 있다. 새 문법이 아니라 람다를 줄인 것이다'
      - '코드 refs의 네 가지를 같은 일을 하는 람다와 나란히 놓는다. static 메서드 `Integer::parseInt`는 `s -> Integer.parseInt(s)`. 특정 객체의 메서드 `name::length`는 `() -> name.length()`. 임의 객체의 메서드 `Order::getPrice`는 `o -> o.getPrice()`로, 첫 인자가 메서드를 부를 대상이 된다. 생성자 `ArrayList::new`는 `() -> new ArrayList<>()`'
      - '`Order::getPrice`와 `name::length`는 모양이 비슷하지만 다르다. 앞은 클래스 이름이라 대상이 인자로 들어오고, 뒤는 변수 이름이라 대상이 이미 정해져 있다'
      - '정렬에서 자주 쓴다. `orders.sort(Comparator.comparing(Order::getPrice))`는 "주문에서 금액을 꺼내는 방법"을 넘기면 그것으로 비교하는 `Comparator`를 만들어 준다. `.reversed()`와 `.thenComparing(Order::getId)`를 이어 쓴다'
      - '람다가 더 읽기 쉬우면 람다를 쓴다. 인자를 가공하거나 순서를 바꿔 넘겨야 하면 메서드 참조로 쓸 수 없다'
    asks:
      - '본문의 예시: `Function<Order, Integer> c = Order::getPrice;`와 같은 일을 하는 람다는 무엇인가. 보기: `() -> Order.getPrice()`, `o -> o.getPrice()`, `o -> Order.getPrice(o)` (`o -> o.getPrice()`)'
      - '옮긴 상황: 금액이 3000, 1000, 2000인 주문 리스트에 `orders.sort(Comparator.comparing(Order::getPrice).reversed());`를 실행한 뒤 첫 주문의 금액은 얼마인가 (3000)'
    body:
      - p: '람다의 본문이 **이미 있는 메서드를 부르기만** 한다면 `클래스::메서드`로 줄여 쓸 수 있어요. 이것이 **메서드 참조**예요. 새 기능이 아니라 람다를 짧게 쓴 거예요. 네 가지 모양이 있어요.'
      - code: refs
      - table:
          head: [메서드 참조, 같은 람다, 종류]
          rows:
            - ['`Integer::parseInt`', '`s -> Integer.parseInt(s)`', static 메서드]
            - ['`name::length`', '`() -> name.length()`', 특정 객체의 메서드]
            - ['`Order::getPrice`', '`o -> o.getPrice()`', 임의 객체의 메서드]
            - ['`ArrayList::new`', '`() -> new ArrayList<>()`', 생성자]
      - ci:
          key: refs
          label: 네 메서드 참조의 실제 결과 보기
          source: LambdaTest.methodReferences
      - p: '셋째와 둘째가 헷갈려요. `Order::getPrice`는 **클래스 이름**이라 메서드를 부를 대상(어느 주문인지)이 인자로 들어와요. `name::length`는 **변수 이름**이라 대상이 이미 `name`으로 정해져 있어요.'
      - h3: 정렬에서 가장 많이 써요
      - p: '`Comparator.comparing`에 "주문에서 금액을 꺼내는 방법"을 넘기면, 그것으로 비교하는 `Comparator`를 만들어 줘요.'
      - ci:
          key: sort
          label: 실제 정렬 결과 보기
          source: LambdaTest.comparator
          code: sortRun
      - p: '`.reversed()`로 순서를 뒤집고, `.thenComparing(Order::getId)`로 금액이 같을 때의 기준을 이어요. 다만 인자를 가공하거나 순서를 바꿔 넘겨야 하면 메서드 참조로 쓸 수 없어요. 그럴 때나 람다가 더 읽기 쉬울 때는 람다를 써요.'
      - muted: '`Comparator`와 `Comparable`(객체가 스스로 정한 자연 순서)의 차이는 정렬 레슨에서 다뤄요.'
      - quiz:
          q: '`Function<Order, Integer> c = Order::getPrice;`와 같은 일을 하는 람다는?'
          options:
            - '`() -> Order.getPrice()`'
            - '`o -> o.getPrice()`'
            - '`o -> Order.getPrice(o)`'
          answer: 2
          explain: '클래스 이름으로 쓴 인스턴스 메서드 참조는 첫 인자가 메서드를 부를 대상이 돼요.'
    recall: '메서드 참조는 이미 있는 메서드를 부르기만 하는 람다를 `클래스::메서드`로 짧게 쓴 것이에요. static 메서드(`Integer::parseInt`), 특정 객체의 메서드(`name::length`), 임의 객체의 메서드(`Order::getPrice`, 첫 인자가 대상), 생성자(`ArrayList::new`) 네 가지가 있어요. 정렬에서 `Comparator.comparing(Order::getPrice)`처럼 많이 써요.'
practice:
  title: 스프링에서는 이렇게 만나요
  says:
    - '스프링이 람다를 받는 자리 셋을 코드로 보인다. `transactionTemplate.execute(status -> orderRepository.save(order))`는 "트랜잭션 안에서 할 일"을 넘긴다. `jdbcTemplate.query(sql, (rs, rowNum) -> new OrderRow(rs.getLong("id"), rs.getInt("price")))`는 "행 하나를 객체로 바꾸는 방법"을 넘긴다. `@Bean ApplicationRunner init() { return args -> ...; }`는 "시작한 뒤 할 일"을 넘긴다. 셋 다 질문 2대로 스프링이 필요한 순간에 부른다 (각 인터페이스의 추상 메서드가 하나라는 것은 스프링 공식 API 문서 근거. `JdbcTemplate`의 행 변환은 이미 있는 PostgreSQL 컨테이너 설정으로 돌려 행마다 한 번씩 불리는 것을 확인하는 테스트)'
    - '정렬 기준. `orders.sort(Comparator.comparing(Order::getCreatedAt).reversed())`와 `.thenComparing(Order::getId)` (순수 자바 테스트)'
    - '흔한 실수: 람다 안에서 바깥 지역 변수에 누적한다(코드 predict). 컴파일 오류를 피하려고 `int[] total = {0}`이나 `AtomicInteger`로 감싸는 코드를 자주 본다. 컴파일은 되지만 질문 3의 규칙을 돌아간 것이고, 병렬로 돌리면 틀린 값이 나온다. 고친 코드: 결과를 돌려받는다. `orders.stream().mapToInt(Order::getPrice).sum()`. 스트림은 J13에서 다룬다 (컴파일 오류는 테스트 안에서 컴파일러를 돌려 확인하고, 고친 코드의 결과는 순수 자바 테스트)'
    - '람다 안의 체크 예외. `paths.forEach(p -> Files.delete(p))`는 컴파일되지 않는다. `Consumer`의 `accept`에 `throws IOException`이 없기 때문이다. for 문으로 쓰거나, 람다 안에서 잡아 원인을 붙인 언체크 예외로 다시 던진다(J10의 질문 4) (컴파일 오류는 테스트 안에서 컴파일러를 돌려 확인한다)'
    - '`@Transactional`과 견줘 `TransactionTemplate`을 언제 쓰는지는 S10에 넘긴다는 한 줄'
  body:
    - p: '스프링에도 "할 일"을 받는 API가 많아요. 받는 쪽이 필요한 순간에 부른다는 질문 2의 규칙 그대로예요. `JdbcTemplate`의 행 변환은 PostgreSQL 컨테이너로 확인했고, 나머지 둘은 스프링 문서가 근거예요.'
    - h3: 스프링이 람다를 받는 자리
    - code: template
      notes:
        - mark: status -> orderRepository.save(order)
          as: code
          text: '"트랜잭션 안에서 할 일"이에요. 스프링이 트랜잭션을 연 뒤 이 람다를 부르고, 끝나면 커밋해요.'
    - code: rowMapper
      notes:
        - mark: '(rs, rowNum) -> new OrderRow('
          as: code
          text: '"행 하나를 객체로 바꾸는 방법"이에요. 매개변수가 둘인 함수형 인터페이스 `RowMapper`의 구현이에요.'
    - ci:
        key: jdbc
        label: 람다가 불린 실제 횟수 보기
        source: LambdaJdbcTest.rowMapperCalledPerRow
        code: jdbcRun
    - p: '행이 셋이면 람다가 세 번 불려요. 질문 2의 `removeIf`와 같아요.'
    - code: runner
      notes:
        - mark: args -> cache.loadAll()
          as: code
          text: '"애플리케이션이 시작한 뒤 할 일"이에요. 스프링이 시작을 마친 뒤 한 번 불러요.'
    - muted: '`@Transactional`을 두고 `TransactionTemplate`을 언제 쓰는지는 @Transactional 동작 원리 레슨에서 다뤄요. 근거: [스프링 문서의 프로그래밍 방식 트랜잭션](link:txTemplate).'
    - h3: '흔한 실수: 컴파일 오류를 돌아가는 누적'
    - p: '질문 3의 컴파일 오류를 피하려고 이렇게 고치는 코드를 자주 봐요.'
    - code: accumulateBad
    - p: '`total` 변수는 다시 대입하지 않으니 컴파일은 돼요. 하지만 규칙을 돌아간 것일 뿐, 람다가 바깥 상태를 바꾸는 것은 그대로예요. 병렬로 돌리면 여러 스레드가 같은 칸을 동시에 고쳐 틀린 값이 나와요. 람다로 계산할 때는 **결과를 돌려받아요.**'
    - code: accumulateFixed
    - ci:
        key: sum
        label: 실제 결과 보기
        source: LambdaTest.streamSum
    - p: '스트림이 무엇인지는 바로 다음 레슨인 스트림과 Optional에서 다뤄요.'
    - h3: 람다 안의 체크 예외
    - code: checkedBad
      notes:
        - mark: Files.delete(p)
          as: code
          text: '`IOException`을 던질 수 있는 메서드예요.'
    - ci:
        key: checked
        label: 컴파일 결과 보기
        source: LambdaTest.checkedInLambda
    - p: '`forEach`가 받는 `Consumer`의 `accept`에는 `throws IOException`이 없어서, 람다 안에서 체크 예외를 밖으로 던질 수 없어요(예외 레슨). for 문으로 쓰거나, 람다 안에서 잡아 원인을 붙인 언체크 예외로 다시 던져요.'
    - code: checkedFixed
    - h3: 정렬 기준
    - code: sortSpring
    - p: '최신 주문부터, 같은 시각이면 id 순서로 정렬해요. 질문 4의 `Comparator.comparing`을 이어 쓴 모양이에요.'
interview:
  question: 람다와 함수형 인터페이스를 설명해 주세요
  model:
    - label: 정의
      text: 함수형 인터페이스는 추상 메서드가 하나뿐인 인터페이스이고, 람다는 그 메서드 하나의 구현을 매개변수와 본문만 써서 만드는 문법입니다. 메서드 참조는 이미 있는 메서드를 부르기만 하는 람다를 줄여 쓴 것입니다.
    - label: 원리
      text: 람다를 넘긴다는 것은 할 일을 넘기는 것이라, 받은 쪽이 인터페이스의 메서드를 부르는 순간에 본문이 실행됩니다. 람다는 나중에 실행되므로 잡은 지역 변수의 값을 복사해 가고, 그래서 그 변수는 사실상 final이어야 합니다.
    - label: 주의할 점
      text: 람다 안에서 바깥 지역 변수에 누적하는 것은 컴파일되지 않고, 배열이나 AtomicInteger로 돌아가도 바깥 상태를 바꾸는 것은 그대로라 결과를 돌려받는 방식으로 씁니다. 표준 함수형 인터페이스는 체크 예외를 선언하지 않아 람다 안에서 체크 예외를 던질 수 없습니다.
    - label: 경험
      text: '(내 프로젝트로 채우기) 예: JdbcTemplate의 RowMapper와 Comparator.comparing을 람다와 메서드 참조로 써서 행 변환과 정렬 기준을 짧게 표현했습니다.'
verified: 이 레슨의 결과는 짐작이 아니라 자바 21에서 코드를 돌리고, 컴파일되는지는 테스트 안에서 javac를 돌려 확인한 값이에요. JdbcTemplate은 PostgreSQL 16 컨테이너로 확인했어요. 코드가 바뀔 때마다 테스트([LambdaTest](link:test), [LambdaJdbcTest](link:jdbcTest))가 다시 돌아요.
footer: '근거: 함수형 인터페이스는 자바 언어 명세 9.8([링크](link:jlsFunctional)), 람다와 사실상 final은 15.27([링크](link:jlsLambda)), 메서드 참조는 15.13([링크](link:jlsRef)), 표준 함수형 인터페이스는 java.util.function 패키지 문서([링크](link:functionPkg)). 결과는 OpenJDK 21에서 테스트로 확인했어요. 오류는 [GitHub 이슈](https://github.com/wanja727/dev-lessons/issues)로 알려 주세요.'
claims:
  - claim: '클래스 구현, 익명 클래스, 람다로 만든 세 `Predicate`가 같은 주문에 같은 결과를 준다'
    how: '금액이 5000과 15000인 주문으로 셋을 부른다'
    test: LambdaTest.threeWaysSameResult
  - claim: '추상 메서드가 둘인 인터페이스에 람다를 대입하면 컴파일되지 않는다'
    how: '`JavaSource`로 컴파일한다'
    test: LambdaTest.notFunctional
  - claim: '코드 lazy의 출력 순서는 "람다를 정의함", "주문 만드는 중", "주문 만드는 중"이다'
    how: '출력 대신 리스트에 기록해 순서를 본다'
    test: LambdaTest.lazy
  - claim: '`removeIf`에 넘긴 람다는 원소마다 한 번 실행된다'
    how: '원소 다섯 개로 호출 횟수를 센다'
    test: LambdaTest.calledPerElement
  - claim: '코드 predict는 컴파일되지 않는다'
    how: '`JavaSource`로 컴파일한다'
    test: LambdaTest.predict
  - claim: '위젯의 일곱 조각이 적힌 대로 컴파일되거나 컴파일되지 않는다'
    how: '`JavaSource`로 조각마다 컴파일한다'
    test: LambdaTest.captureRules
  - claim: '코드 refs의 네 메서드 참조가 나란히 적은 람다와 같은 결과를 준다'
    how: '같은 인자로 양쪽을 불러 결과를 비교한다'
    test: LambdaTest.methodReferences
  - claim: '`Comparator.comparing(Order::getPrice).reversed()`로 정렬하면 금액이 큰 주문이 앞에 온다'
    how: '금액이 3000, 1000, 2000인 리스트를 정렬해 순서를 본다'
    test: LambdaTest.comparator
  - claim: '`Consumer` 람다 안에서 체크 예외를 던지는 메서드를 그대로 부르면 컴파일되지 않는다'
    how: '`JavaSource`로 컴파일한다'
    test: LambdaTest.checkedInLambda
  - claim: '`JdbcTemplate.query`에 넘긴 람다는 결과 행마다 한 번씩 불린다'
    how: 'PostgreSQL 컨테이너에 행 셋을 넣고, 람다 안에서 호출 횟수를 세어 3인지 본다'
    test: LambdaJdbcTest.rowMapperCalledPerRow
sources:
  - '함수형 인터페이스: 자바 언어 명세 9.8 https://docs.oracle.com/javase/specs/jls/se21/html/jls-9.html#jls-9.8'
  - '람다 식과 사실상 final: 자바 언어 명세 15.27, 4.12.4 https://docs.oracle.com/javase/specs/jls/se21/html/jls-15.html#jls-15.27'
  - '메서드 참조: 자바 언어 명세 15.13 https://docs.oracle.com/javase/specs/jls/se21/html/jls-15.html#jls-15.13'
  - '표준 함수형 인터페이스: `java.util.function` 패키지 문서 https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/function/package-summary.html'
  - '`Comparator.comparing`: API 문서 https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/Comparator.html'
  - '`TransactionTemplate`: 스프링 프레임워크 문서 https://docs.spring.io/spring-framework/reference/data-access/transaction/programmatic.html'
  - '`RowMapper`: 스프링 프레임워크 API 문서 https://docs.spring.io/spring-framework/docs/current/javadoc-api/org/springframework/jdbc/core/RowMapper.html'
