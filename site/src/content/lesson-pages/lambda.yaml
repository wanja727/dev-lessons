# 람다와 함수형 인터페이스
# 자료 파일의 칸은 docs/lesson-data-format.md에 있다. 문제는 content/questions/lambda.yaml에 있다.
title: 람다와 함수형 인터페이스
description: 람다가 무엇이고 함수형 인터페이스와 어떤 관계인지, 람다는 언제 실행되는지, 바깥의 변수를 쓸 때의 규칙, 메서드 참조. 네 가지 질문에 스스로 답할 수 있게, 주문 목록을 고르고 정렬하는 코드로 배우는 대화형 레슨.
unit: 자바 언어
minutes: 20
roadmap: J12
type: 자바 실행
prerequisites:
  - {slug: inheritance-polymorphism, title: 상속과 다형성}
assume: '자바 21. 인터페이스를 구현한 클래스를 만들어 인터페이스 타입의 변수에 담아 본 것(상속과 다형성 레슨). 변수에는 값이나 참조가 들어 있다는 것(값과 참조 레슨).'
example: '주문의 목록 `List<Order>`(필드는 `price`와 `name`). "어떤 주문을 고를지"와 "무엇으로 정렬할지"를 람다로 넘겨요. 실무 구역에서는 스프링이 람다를 받는 자리(`TransactionTemplate`, `JdbcTemplate`, 정렬)로 옮겨요.'
intro:
  - '주문 금액의 합계를 내려고 `orders.forEach(o -> total += o.getPrice())`라고 썼더니 컴파일이 안 돼요. 오류 메시지는 람다 안에서 쓰는 지역 변수는 final이거나 사실상 final이어야 한다고 해요. for 문에서는 되던 일이에요.'
  - '요즘 자바와 스프링의 API는 "무엇을 할지"를 인자로 받아요. 스트림의 `filter`와 `map`, `Optional`의 `orElseGet`, `TransactionTemplate`의 `execute`, `JdbcTemplate`의 행 변환이 모두 람다를 받아요. 람다가 무엇이고 언제 실행되는지를 모르면 이 API들을 읽을 수 없어요.'
  - '이 레슨에서는 람다가 인터페이스 구현을 짧게 쓴 것임을 같은 코드를 세 가지로 써서 확인하고, 람다가 실행되는 시점과 바깥 변수를 쓸 때의 규칙을 코드를 돌려 봐요.'
covers:
  - topic: '함수형 인터페이스는 추상 메서드가 하나인 인터페이스다. @FunctionalInterface'
    where: '질문 1'
  - topic: '람다는 그 메서드 하나의 구현을 짧게 쓴 것이다. 클래스로 구현한 것, 익명 클래스, 람다가 같은 일을 한다'
    where: '질문 1'
  - topic: '람다의 타입은 받는 쪽의 인터페이스가 정한다. 문법(매개변수 타입 생략, 식 하나일 때 중괄호와 return 생략)'
    where: '질문 1'
  - topic: '자주 쓰는 표준 함수형 인터페이스: Function, Predicate, Supplier, Consumer, 그리고 Runnable과 Comparator'
    where: '질문 2'
  - topic: '람다는 정의할 때가 아니라 받은 쪽이 메서드를 부를 때 실행된다. 한 번도 안 불릴 수도, 여러 번 불릴 수도 있다'
    where: '질문 2'
  - topic: '람다 이어 붙이기(andThen, and, negate, thenComparing), BiFunction과 UnaryOperator, 기본형용 인터페이스'
    where: '질문 2의 더 알아보기'
  - topic: '람다가 잡는 지역 변수는 사실상 final이어야 한다. 값이 복사되기 때문이다'
    where: '질문 3'
  - topic: '잡은 변수가 가리키는 객체의 상태와 필드는 바꿀 수 있다'
    where: '질문 3'
  - topic: '람다 안의 this는 람다를 쓴 바깥 객체다'
    where: '질문 3의 더 알아보기. 익명 클래스와의 차이는 중첩 클래스와 익명 클래스(J16)'
  - topic: '메서드 참조 네 가지: static 메서드, 특정 객체의 메서드, 임의 객체의 메서드, 생성자'
    where: '질문 4'
  - topic: 'Comparator.comparing으로 정렬 기준 만들기'
    where: '질문 4, 실무에서는'
  - topic: '람다 안에서 체크 예외를 던지면 컴파일되지 않는 이유'
    where: '실무에서는'
  - topic: '스프링이 람다를 받는 자리: TransactionTemplate, JdbcTemplate의 RowMapper, ApplicationRunner'
    where: '실무에서는. 트랜잭션의 동작은 @Transactional 동작 원리(S10)'
  - topic: '람다는 익명 클래스의 객체로 컴파일되지 않는다(invokedynamic)'
    where: '질문 1의 더 알아보기'
  - topic: '람다를 받는 스트림의 연산들'
    where: '다루지 않음: 스트림과 Optional(J13)'
  - topic: '다른 스레드에서 실행할 일을 Runnable과 Callable로 넘기기'
    where: '다루지 않음: 스레드 풀(C7)'
  - topic: '바뀌는 부분을 인터페이스로 빼서 넘기는 설계'
    where: '다루지 않음: 전략 패턴(O7)'
  - topic: '자연 순서를 정하는 Comparable과 Comparator의 비교'
    where: '다루지 않음: 정렬(K6)'
codes:
  predict: |-
    int total = 0;
    orders.forEach(o ->
        total += o.getPrice());
    System.out.println(total);
  three: |-
    // 1. 클래스로 구현
    class ExpensiveFilter
        implements Predicate<Order> {
      public boolean test(Order o) {
        return o.getPrice() >= 10000;
      }
    }

    // 2. 익명 클래스
    Predicate<Order> p2 = new Predicate<>() {
      public boolean test(Order o) {
        return o.getPrice() >= 10000;
      }
    };

    // 3. 람다
    Predicate<Order> p3 =
        [[o -> o.getPrice() >= 10000]];
  threeRun: |-
    // 금액이 5000과 15000인 주문으로
    // 세 Predicate의 test를 부른다
  notFunctional: |-
    interface Validator {
      boolean validate(Object o);
      String name();
    }

    Validator v = o -> o != null;
  lazy: |-
    Supplier<Order> s = () -> {
      print("주문 만드는 중");
      return new Order(0);
    };
    print("람다를 정의함");
    s.get();
    s.get();
  captureOk: |-
    int min = 10000;
    Predicate<Order> p =
        o -> o.getPrice() >= [[min]];
  captureRun: |-
    // 각 조각을 C 클래스의 인스턴스
    // 메서드 안에 넣어 컴파일한다
  refs: |-
    Function<String, Integer> a =
        Integer::parseInt;
    Supplier<Integer> b = name::length;
    Function<Order, Integer> c =
        Order::getPrice;
    Supplier<List<Order>> d = ArrayList::new;
  sortRun: |-
    // 금액 3000, 1000, 2000
    orders.sort(Comparator
        .comparing(Order::getPrice)
        .reversed());
  template: |-
    transactionTemplate.execute(
        [[status -> orderRepository.save(order)]]);
  rowMapper: |-
    List<OrderRow> rows = jdbcTemplate.query(
        "select id, price from orders",
        [[(rs, rowNum) -> new OrderRow(]]
            rs.getLong("id"),
            rs.getInt("price")));
  jdbcRun: |-
    // 행 3개가 든 테이블에서 위 쿼리를 돌리고
    // 람다가 불린 횟수를 센다
  runner: |-
    @Bean
    ApplicationRunner warmUp(
        CacheService cache) {
      return [[args -> cache.loadAll()]];
    }
  sortSpring: |-
    orders.sort(Comparator
        .comparing(Order::getCreatedAt)
        .reversed()
        .thenComparing(Order::getId));
  accumulateBad: |-
    int[] total = {0};
    orders.forEach(o ->
        total[0] += o.getPrice());
  accumulateFixed: |-
    int total = orders.stream()
        .mapToInt(Order::getPrice)
        .sum();
  checkedBad: |-
    paths.forEach(p -> [[Files.delete(p)]]);
  checkedFixed: |-
    for (Path p : paths) {
      Files.delete(p);
    }
