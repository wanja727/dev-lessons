# 자바 프로그램이 실행되는 과정
# 자료 파일의 칸은 docs/lesson-data-format.md에 있다. 문제는 content/questions/java-execution.yaml에 있다.
title: 자바 프로그램이 실행되는 과정
description: 자바 소스가 바이트코드가 되어 JVM에서 실행되기까지, JVM과 JRE와 JDK의 차이, 클래스가 읽히는 때, JIT 때문에 켠 직후가 느린 이유. 네 가지 질문에 스스로 답할 수 있게, 직접 컴파일한 클래스 파일과 실행 결과로 배우는 대화형 레슨.
unit: 자바 언어
minutes: 20
roadmap: J1
type: 개념 설명
prerequisites: []
assume: '자바 21(OpenJDK, HotSpot). `main` 메서드가 있는 클래스를 한 번 만들어 실행해 본 것. IDE의 실행 버튼만 눌러 봤어도 돼요.'
example: '주문 금액을 출력하는 `OrderApp.java` 하나. 이 파일을 `javac`로 컴파일하고 `java`로 실행하면서 중간에 생기는 것을 하나씩 열어 봐요. 실무 구역에서는 같은 과정을 스프링 부트의 실행 가능한 jar로 옮겨요.'
intro:
  - '내 컴퓨터에서 잘 돌던 서버를 배포했더니 `UnsupportedClassVersionError`로 켜지지도 않아요. 어떤 날은 `ClassNotFoundException`이 나오고, 배포 직후의 첫 요청들만 유난히 느려요. 셋 다 자바 코드가 실행되기까지 거치는 단계를 알면 어디서 난 문제인지 바로 짚을 수 있어요.'
  - '스프링 개발자는 IDE의 실행 버튼과 `./gradlew bootJar` 뒤에 가려진 이 과정을 직접 다루게 돼요. 빌드할 자바 버전과 서버에 깔 자바 버전을 정하고, 도커 이미지에 JDK를 넣을지 정하고, 의존성이 jar에 들어갔는지 확인하는 일이 모두 여기에 속해요.'
  - '이 레슨에서는 자바 파일 하나를 직접 컴파일해서 `.class` 파일의 앞부분을 읽어 보고, 클래스가 언제 누구에 의해 읽히는지 코드를 돌려 확인해요.'
covers:
  - topic: '소스(.java)를 javac가 바이트코드(.class)로 바꾸고, JVM이 그 바이트코드를 실행한다'
    where: '질문 1'
  - topic: '한 번 컴파일한 .class가 운영체제마다 그대로 도는 이유. JVM은 운영체제마다 따로 있다'
    where: '질문 1'
  - topic: '.class 파일의 앞머리: 매직 넘버 CAFEBABE와 클래스 파일 버전(자바 21은 65)'
    where: '질문 1'
  - topic: 'javap로 바이트코드를 들여다보기'
    where: '질문 1의 더 알아보기'
  - topic: 'JVM, JRE, JDK가 각각 무엇을 담고 있나. 자바 11부터 JRE를 따로 내려받지 않는다'
    where: '질문 2'
  - topic: '자바 버전과 LTS(8, 11, 17, 21), 낮은 버전의 JVM은 높은 버전의 클래스 파일을 거부한다'
    where: '질문 2, 실무에서는'
  - topic: '클래스 로딩: 클래스는 처음 쓰일 때 읽힌다. 로딩, 링크(검증, 준비, 해석), 초기화의 세 단계'
    where: '질문 3'
  - topic: '클래스 로더 세 가지(부트스트랩, 플랫폼, 애플리케이션)와 부모에게 먼저 묻는 규칙'
    where: '질문 3'
  - topic: '클래스패스, ClassNotFoundException과 NoClassDefFoundError의 차이'
    where: '질문 3, 실무에서는'
  - topic: '인터프리터와 JIT 컴파일러: 자주 도는 코드만 기계어로 바꾼다. 처음에는 느리고 점점 빨라진다'
    where: '질문 4'
  - topic: 'jar 파일과 java -jar, main 메서드가 시작점이라는 것'
    where: '실무에서는'
  - topic: '스프링 부트의 실행 가능한 jar 구조(BOOT-INF/classes, BOOT-INF/lib)와 Gradle의 자바 버전 설정(toolchain)'
    where: '실무에서는'
  - topic: 'GraalVM 네이티브 이미지처럼 미리 기계어로 만들어 두는 방식'
    where: '질문 4의 더 알아보기'
  - topic: '초기화 단계에서 static 필드와 static 블록이 실행되는 순서'
    where: '다루지 않음: static과 초기화 순서(J5)'
  - topic: 'JVM이 실행 중에 쓰는 메모리 영역(스택, 힙, 메서드 영역)'
    where: '다루지 않음: JVM 메모리 구조(J14)'
  - topic: '가비지 컬렉션'
    where: '다루지 않음: 가비지 컬렉션(J15)'
  - topic: '실행 중에 클래스 정보를 읽는 리플렉션'
    where: '다루지 않음: 리플렉션과 어노테이션(J17)'
codes:
  orderApp: |-
    public class OrderApp {
      public static void main(String[] args) {
        int price = 12000;
        System.out.println("주문 " + price);
      }
    }
  commands: |-
    $ javac OrderApp.java
    $ ls
    OrderApp.class  OrderApp.java
    $ java OrderApp
  headerRun: |-
    $ javac OrderApp.java
    # OrderApp.class의 처음 8바이트를
    # 16진수로 읽는다
  coupon: |-
    class Coupon {
      static {
        print("Coupon 읽음");
      }
    }

    print("시작");
    Coupon c = null;
    print("변수 선언 뒤");
    [[new Coupon()]];
    print("new 뒤");
  loaderRun: |-
    print(String.class.getClassLoader());
    print(JavaExecutionTest.class
        .getClassLoader());
  notFoundRun: |-
    Class.forName("lab.shop.Coupon");
  versionRun: |-
    # 주 버전을 66(자바 22)으로 바꾼
    # OrderApp.class를 [[자바 21]]에서 읽는다
  warmupRun: |-
    // 같은 계산을 2만 번씩 다섯 묶음
    for (int b = 1; b <= 5; b++) {
      long start = System.nanoTime();
      for (int i = 0; i < 20_000; i++) {
        discount(10_000 + i, i % 30);
      }
      print(b + " " + 걸린 시간);
    }
    # 기본 옵션과 [[-Xint]]로 한 번씩 돌린다
  bootJar: |-
    $ ./gradlew bootJar
    $ jar tf build/libs/shop.jar
    META-INF/MANIFEST.MF
    org/springframework/boot/loader/...
    [[BOOT-INF/classes/]]shop/OrderApp.class
    [[BOOT-INF/lib/]]spring-web-6.2.x.jar
    ...
    $ java -jar build/libs/shop.jar
  toolchain: |-
    java {
      toolchain {
        languageVersion =
            JavaLanguageVersion.of([[21]])
      }
    }
  dockerBad: |-
    FROM eclipse-temurin:[[17]]-jre
    COPY build/libs/shop.jar app.jar
    ENTRYPOINT ["java", "-jar", "app.jar"]
  dockerFixed: |-
    FROM eclipse-temurin:[[21]]-jre
    COPY build/libs/shop.jar app.jar
    ENTRYPOINT ["java", "-jar", "app.jar"]
  versionLog: |-
    Exception in thread "main" java.lang.⤷
    UnsupportedClassVersionError: shop/OrderApp ⤶
    has been compiled by a more recent ⤶
    version of the Java Runtime ⤶
    (class file version [[65.0]]), this ⤶
    version of the Java Runtime only recognizes ⤶
    class file versions up to [[61.0]]
