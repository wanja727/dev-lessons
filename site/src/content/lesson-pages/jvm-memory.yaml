# JVM 메모리 구조
# 자료 파일의 칸은 docs/lesson-data-format.md에 있다. 문제는 content/questions/jvm-memory.yaml에 있다.
title: JVM 메모리 구조
description: JVM이 메모리를 어떤 영역으로 나눠 쓰는지, 메서드를 부르면 스택에서 무슨 일이 생기는지, 객체는 어디에 놓이는지, OutOfMemoryError와 StackOverflowError는 무엇이 다른지. 네 가지 질문에 스스로 답할 수 있게, 두 에러를 일부러 일으켜 보며 배우는 대화형 레슨.
unit: 자바 언어
minutes: 22
roadmap: J14
type: 개념 설명
prerequisites:
  - {slug: java-execution, title: 자바 프로그램이 실행되는 과정}
  - {slug: value-and-reference, title: 값과 참조}
assume: '자바 21(OpenJDK, HotSpot). JVM이 클래스를 읽어 실행한다는 것(자바 프로그램이 실행되는 과정 레슨). 참조형 변수에는 객체가 아니라 참조가 들어 있다는 것(값과 참조 레슨).'
example: '주문을 만드는 `createOrder` 메서드와 자기 자신을 부르는 `dive` 메서드. 메서드를 부르고 객체를 만들 때 스택과 힙에 무엇이 생기고 사라지는지 따라가요. 실무 구역에서는 스프링 부트 서버의 메모리 설정과 엔티티의 `toString`으로 옮겨요.'
intro:
  - '서버 로그에 `java.lang.OutOfMemoryError: Java heap space`가 찍히고 요청이 실패해요. 다른 날에는 `StackOverflowError`가 같은 줄을 수백 번 되풀이한 스택 트레이스와 함께 나와요. 둘 다 메모리가 모자라다는 뜻이지만 모자란 곳이 다르고 고치는 방법도 달라요.'
  - '스프링 개발자는 JVM의 메모리를 숫자로 정하게 돼요. 서버를 띄울 때 힙을 얼마로 줄지, 컨테이너의 메모리 한도를 얼마로 잡을지, 톰캣의 스레드를 몇 개까지 둘지가 서로 물려 있어요. 어느 영역에 무엇이 놓이는지를 알아야 이 숫자들을 읽을 수 있어요.'
  - '이 레슨에서는 메서드 호출과 객체 생성을 한 줄씩 따라가며 스택과 힙의 변화를 보고, 두 에러를 일부러 일으켜 어느 영역이 찼을 때 무엇이 나는지 확인해요.'
covers:
  - topic: 'JVM이 실행 중에 쓰는 메모리 영역: 힙, 스레드마다 있는 스택, 메서드 영역'
    where: '질문 1'
  - topic: '힙은 모든 스레드가 함께 쓰고, 스택은 스레드마다 따로 있다'
    where: '질문 1. 스레드가 무엇을 공유하는지는 프로세스와 스레드(C1)'
  - topic: '메서드 영역에는 클래스의 정보가 놓인다. HotSpot에서는 메타스페이스다'
    where: '질문 1'
  - topic: 'PC 레지스터와 네이티브 메서드 스택'
    where: '질문 1의 더 알아보기'
  - topic: '메서드를 부르면 스택에 프레임이 쌓이고 끝나면 사라진다. 프레임에 지역 변수와 매개변수가 있다'
    where: '질문 2'
  - topic: '재귀가 끝나지 않으면 StackOverflowError. 스레드마다 스택이 따로라서 한 스레드의 일이다'
    where: '질문 2'
  - topic: 'new로 만든 객체는 힙에 놓인다. 지역 변수에는 참조만 있다. 객체의 필드는 기본형이어도 객체와 함께 힙에 있다'
    where: '질문 3'
  - topic: '메서드가 끝나면 프레임의 참조는 사라지고 객체는 힙에 남는다. 누가 치우는가'
    where: '질문 3. 치우는 방법은 가비지 컬렉션(J15)'
  - topic: 'static 필드는 프레임이 아니라 클래스에 딸려 있어서 메서드가 끝나도 남는다. 문자열 상수 풀은 힙에 있다'
    where: '질문 3'
  - topic: 'HotSpot에서 static 필드의 값이 놓이는 곳, 탈출 분석으로 객체가 힙에 놓이지 않는 최적화'
    where: '질문 3의 더 알아보기'
  - topic: 'OutOfMemoryError: 닿을 수 있는 객체로 힙이 가득 찼을 때. StackOverflowError와의 차이'
    where: '질문 4'
  - topic: '힙이 아닌 곳의 OutOfMemoryError: Metaspace, 스레드를 더 만들 수 없을 때'
    where: '질문 4의 더 알아보기'
  - topic: '메모리 설정: -Xms, -Xmx, -Xss, 기본 최대 힙은 메모리의 4분의 1'
    where: '질문 4, 실무에서는'
  - topic: '컨테이너에서: 힙 말고도 메모리를 쓰는 곳이 있다(메타스페이스, 스레드 스택). MaxRAMPercentage'
    where: '실무에서는. 컨테이너는 도커와 컨테이너(T5)'
  - topic: '스프링에서 두 에러를 만나는 코드: 양방향 연관의 toString, 전체를 한 번에 읽는 조회'
    where: '실무에서는. 나눠서 읽는 방법은 페이지네이션(D8)'
  - topic: '닿을 수 없는 객체를 찾아 치우는 방법과 세대'
    where: '다루지 않음: 가비지 컬렉션(J15)'
  - topic: '클래스가 읽히는 과정과 클래스 로더'
    where: '다루지 않음: 자바 프로그램이 실행되는 과정(J1)'
  - topic: '재귀와 끝나는 조건'
    where: '다루지 않음: 재귀(K5)'
  - topic: '힙 덤프로 무엇이 메모리를 차지하는지 찾기'
    where: '다루지 않음: 스레드 덤프와 힙 덤프(T10)'
  - topic: '운영체제의 가상 메모리'
    where: '다루지 않음: 가상 메모리(C10)'
codes:
  predict: |-
    static int depth = 0;

    static void dive() {
      depth++;
      dive();
    }

    dive();
  create: |-
    static Order createOrder(int price) {
      int tax = price / 10;
      Order order = new Order(price + tax);
      return order;
    }

    public static void main(String[] args) {
      Order o = createOrder(10000);
      System.out.println(o.price);
    }
  perThreadRun: |-
    // 스레드 A
    dive();
    // 스레드 A가 끝난 뒤, 스레드 B
    createOrder(10000);
  sumRun: |-
    static int sum(int n) {
      if (n == 0) return 0;
      return n + sum(n - 1);
    }

    sum(3);
    // n이 0일 때 스택의 sum 프레임을 센다
  heapFill: |-
    List<byte[]> list = new ArrayList<>();
    while (true) {
      list.add(new byte[1024 * 1024]);
    }
  heapRun: |-
    // 1. 코드 heapFill (리스트에 담음)
    // 2. 같은 1MB 배열을 1024번 만들되
    //    리스트에 담지 않음
    $ java -Xmx64m ...
  maxRun: |-
    $ java -Xmx256m ...
    Runtime.getRuntime().maxMemory();
  toStringLoop: |-
    class Member {
      List<Order> orders = new ArrayList<>();
      public String toString() {
        return "Member(orders=" + [[orders]] + ")";
      }
    }
    class Order {
      Member member;
      public String toString() {
        return "Order(member=" + [[member]] + ")";
      }
    }
  toStringFixed: |-
    @Entity
    class Order {
      @Id Long id;
      @ManyToOne Member member;

      @Override
      public String toString() {
        return "Order(id=" + [[id]] + ")";
      }
    }
  toStringRun: |-
    member.orders.add(order);
    order.member = member;
    log.info("{}", member);
  lombok: |-
    @Entity
    @ToString
    class Order {
      @ManyToOne
      [[@ToString.Exclude]]
      private Member member;
    }
  jvmOptions: |-
    # 크기를 직접 줄 때
    java -Xms512m -Xmx512m -jar app.jar

    # 컨테이너에서 비율로 줄 때
    java -XX:MaxRAMPercentage=75 \
      -jar app.jar
  findAll: |-
    // 행이 늘면 언젠가 힙을 넘는다
    List<Order> all = orderRepository
        [[.findAll()]];
  heapDump: |-
    java -Xmx512m \
      -XX:+HeapDumpOnOutOfMemoryError \
      -XX:HeapDumpPath=/dumps \
      -jar app.jar
