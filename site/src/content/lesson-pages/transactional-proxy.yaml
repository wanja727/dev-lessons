# @Transactional 동작 원리 (설계서)
# 자료 파일의 칸은 docs/lesson-data-format.md에 있다.
# 예전 레슨 site/src/pages/lessons/transactional-proxy.astro와 transaction/TransactionalProxyTest, SelfInvocationTest를 재료로 다시 쓴다.
stage: design
title: '@Transactional 동작 원리'
unit: 스프링
roadmap: S10
type: 동작 확인
prerequisites:
  - {slug: aop-audit, title: AOP}
  - {slug: tx-basics, title: 트랜잭션 기초}
assume: '자바 21, 스프링 부트 3.5, PostgreSQL 16. 트랜잭션이 커넥션 하나에서 자동 커밋을 끄고 커밋이나 롤백으로 끝난다는 것(트랜잭션 기초 레슨). 스프링이 빈을 CGLIB 프록시로 바꿔 메서드 앞뒤에 코드를 끼워 넣고, 같은 클래스 안의 호출과 `final` 메서드에는 걸지 못한다는 것(AOP 레슨). 커넥션 풀(DB 커넥션과 커넥션 풀 레슨)은 알면 좋아요.'
example: '주문을 저장하고 포인트 100을 적립하는 `OrderService.placeOrder`. 적립 메서드 `addPoint`에만 `@Transactional`을 붙였다가, 같은 클래스 안에서 부를 때와 다른 빈으로 나눌 때를 비교한다.'
intro:
  - '주문이 저장됐는데 포인트가 쌓이지 않았다는 문의가 와요. 로그에는 예외가 없어요. `addPoint` 메서드에 `@Transactional`이 분명히 붙어 있는데, 같은 클래스의 `placeOrder`에서 부른 탓에 트랜잭션이 열리지 않았어요.'
  - '`@Transactional`은 스프링 개발자가 가장 많이 쓰는 어노테이션이에요. 붙이기만 하면 메서드가 트랜잭션 안에서 돌고 예외가 나면 롤백돼요. 그 일을 하는 것은 메서드가 아니라 빈 앞에 선 프록시예요. 프록시가 언제 커넥션을 잡고 언제 커밋하는지 알아야, 어노테이션이 붙어 있는데도 트랜잭션이 없는 경우를 알아볼 수 있어요.'
  - '이 레슨에서는 메서드 안에서 트랜잭션이 열려 있는지 직접 물어보고, 내부 호출, `private` 메서드, 다른 빈으로 나눈 경우를 DB에 남은 행으로 확인해요.'
covers:
  - topic: '`@Transactional`이 붙은 빈은 프록시로 바뀐다. 프록시의 트랜잭션 어드바이스(`TransactionInterceptor`)가 메서드 전에 트랜잭션을 시작하고, 정상으로 끝나면 커밋, 예외면 롤백한다'
    where: '질문 1'
  - topic: '트랜잭션을 시작한다는 것: 트랜잭션 매니저가 풀에서 커넥션을 빌려 자동 커밋을 끄고, 그 커넥션을 지금 스레드에 묶어 둔다'
    where: '질문 1'
  - topic: '같은 스레드의 리포지토리와 `JdbcTemplate`은 스레드에 묶인 그 커넥션을 쓴다. 그래서 메서드 안의 여러 SQL이 한 트랜잭션이 된다'
    where: '질문 1'
  - topic: '메서드 안에서 트랜잭션이 열렸는지는 `TransactionSynchronizationManager.isActualTransactionActive()`로 확인한다'
    where: '질문 1'
  - topic: '같은 클래스 안의 호출(`this.addPoint()`)은 프록시를 거치지 않아 `@Transactional`이 없는 것과 같다. 예외도 경고도 없다'
    where: '질문 2'
  - topic: '내부 호출을 고치는 법: 호출하는 바깥 메서드에 `@Transactional`, 또는 다른 빈으로 나누기'
    where: '질문 2'
  - topic: '나눈 위치에 따라 트랜잭션의 범위가 달라진다. 바깥에 붙이면 주문과 적립이 하나로 묶이고, 적립만 다른 빈이면 주문은 이미 커밋된 뒤 적립만 롤백된다'
    where: '질문 2'
  - topic: '`private` 메서드, `final` 메서드에는 걸리지 않는다. 스프링 6.0부터 CGLIB 프록시에서는 `protected`와 패키지 접근 메서드에도 걸린다'
    where: '질문 3. 원리는 AOP(S9)'
  - topic: '클래스에 붙이면 그 클래스의 모든 public 메서드에 걸린다. 메서드에 붙인 것이 클래스의 것보다 먼저다'
    where: '질문 3'
  - topic: '`@Transactional`이 없는 메서드의 리포지토리 호출은 각 리포지토리 메서드가 스스로 트랜잭션을 연다(Spring Data JPA의 기본). 그래서 저장 두 번은 따로 커밋된다'
    where: '질문 3'
  - topic: '`TransactionTemplate`은 프록시 없이 코드로 트랜잭션 범위를 정한다. 메서드의 일부만 묶거나 내부 호출을 피할 때 쓴다'
    where: '질문 4'
  - topic: '`readOnly = true`, `timeout`'
    where: '실무에서는'
  - topic: '트랜잭션 안에서 외부 API를 부르면 그동안 커넥션을 잡고 있다'
    where: '실무에서는. 커넥션 풀은 DB 커넥션과 커넥션 풀(D6)'
  - topic: '이미 트랜잭션이 있을 때 합류하는지 새로 여는지(전파), 어떤 예외에 롤백하는지'
    where: '다루지 않음: 트랜잭션 전파와 롤백 규칙(S11)'
  - topic: '테스트의 `@Transactional`이 테스트 끝에 롤백하는 것'
    where: '다루지 않음: 스프링 테스트(T3)'
codes:
  predict: |-
    @Service
    public class OrderService {

      public void placeOrder(Order o) {
        orders.save(o);
        this.addPoint(o.userId(), 100);
      }

      @Transactional
      public void addPoint(long userId,
          int amount) {
        Point p = points.findByUserId(userId);
        p.add(amount);
      }
    }
  probe: |-
    @Transactional
    public boolean annotated() {
      return TransactionSynchronizationManager
          .isActualTransactionActive();
    }
  interceptor: |-
    // TransactionInterceptor가 하는 일
    TransactionStatus tx =
        txManager.getTransaction(def);
    try {
      Object result = target.method();
      txManager.commit(tx);
      return result;
    } catch (RuntimeException e) {
      txManager.rollback(tx);
      throw e;
    }
  outer: |-
    @Transactional
    public void placeOrder(Order o) {
      orders.save(o);
      this.addPoint(o.userId(), 100);
    }
  split: |-
    @Service
    public class OrderService {
      private final PointService pointService;

      public void placeOrder(Order o) {
        orders.save(o);
        pointService.addPoint(
            o.userId(), 100);
      }
    }
  template: |-
    public void placeOrder(Order o) {
      validate(o);
      tx.executeWithoutResult(s -> {
        orders.save(o);
        addPoint(o.userId(), 100);
      });
      notifyUser(o);
    }
  external: |-
    @Transactional
    public void pay(Order o) {
      orders.markPaying(o.id());
      pgClient.approve(o);
      orders.markPaid(o.id());
    }
predict:
  text: '코드 predict의 `placeOrder`를 컨트롤러에서 불러요. `placeOrder`에는 `@Transactional`이 없고 `addPoint`에만 있어요. `p.add(amount)`는 엔티티의 값만 바꾸고 `save`를 부르지 않아요(변경 감지에 맡김). 끝난 뒤 DB는 어떨까요? 보기: 주문 저장, 포인트 100, 주문 저장, 포인트 그대로, 둘 다 없음, 예외.'
  answer: '주문 저장, 포인트 그대로. `this.addPoint`는 프록시를 거치지 않아 트랜잭션이 없고, 트랜잭션이 없으니 바꾼 값을 커밋할 때 반영하는 변경 감지가 일어나지 않는다. 예외도 나지 않는다. 질문 2에서 밝힌다.'
questions:
  - id: q1
    title: '@Transactional을 붙이면 누가 트랜잭션을 여닫나요?'
    conclusion:
      lead: '빈 앞에 선 프록시가 메서드를 부르기 전에 트랜잭션을 시작하고, 정상으로 끝나면 커밋, 예외가 나면 롤백해요.'
      sub: '시작할 때 풀에서 커넥션을 빌려 자동 커밋을 끄고 지금 스레드에 묶어 둬요. 메서드 안의 리포지토리들이 그 커넥션을 함께 써서 하나의 트랜잭션이 돼요.'
    says:
      - '`@Transactional`이 붙은 `OrderService`를 주입받아 클래스 이름을 찍는다. CGLIB 프록시다(S9와 같은 방식). 테스트로 보인다'
      - '프록시 안의 트랜잭션 어드바이스(`TransactionInterceptor`)가 하는 일을 코드 interceptor로 줄여 보인다. D5에서 JDBC로 손수 쓴 `setAutoCommit(false)`, `commit`, `rollback`을 이 어드바이스가 대신 한다'
      - '트랜잭션 매니저가 커넥션을 빌리면 그 커넥션을 지금 스레드에 묶어 둔다(`ThreadLocal`, S1에서 본 요청 스레드). 메서드 안의 리포지토리와 `JdbcTemplate`은 새 커넥션을 빌리지 않고 묶인 것을 쓴다. 그래서 SQL 여러 개가 한 트랜잭션이다. 메서드 안의 두 SQL이 같은 커넥션(같은 백엔드 pid)으로 나간 것을 실제 출력으로 보인다'
      - '코드 probe로 메서드 안에서 트랜잭션이 열렸는지 직접 묻는다. `@Transactional`이 있으면 `true`, 없으면 `false`다. 질문 2와 3에서 이 방법으로 확인한다'
      - '런타임 예외가 나면 메서드 안의 모든 변경이 롤백된다. 주문 저장 뒤 적립에서 예외가 난 경우 주문도 남지 않는 것을 보인다. 어떤 예외에 롤백하는지는 S11에서 자세히 본다'
    widget:
      kind: steps
      note: '컨트롤러, 프록시, 트랜잭션 매니저, 커넥션 풀, 원래 `OrderService`, DB를 놓고 `@Transactional placeOrder` 호출을 한 단계씩 따라간다: 프록시가 받음, 매니저가 풀에서 커넥션을 빌려 자동 커밋 끔, 스레드에 묶음, 원래 메서드의 SQL 두 개가 그 커넥션으로, 커밋, 커넥션 반납. 시나리오 선택 "중간에 예외"는 커밋 대신 롤백으로 간다'
    asks:
      - '본문의 예시: 코드 probe의 `annotated()`를 밖에서 부르면 무엇을 돌려주나 (`true`)'
      - '옮긴 상황: `@Transactional` 메서드 안에서 `JdbcTemplate`으로 UPDATE 두 번을 하고 두 번째 다음에 런타임 예외가 났다. 첫 UPDATE는 DB에 남나 (남지 않는다. 같은 커넥션의 한 트랜잭션이라 함께 롤백된다)'
  - id: q2
    title: 같은 클래스 안에서 부르면 왜 트랜잭션이 빠지나요?
    conclusion:
      lead: '`this.addPoint()`는 프록시가 아니라 원래 객체의 메서드를 바로 불러서, 트랜잭션을 여는 코드가 실행되지 않기 때문이에요.'
      sub: '바깥 메서드에 `@Transactional`을 붙이거나 다른 빈으로 나눠서 프록시를 거치게 고쳐요. 어느 쪽이냐에 따라 트랜잭션이 묶이는 범위가 달라요.'
    says:
      - '코드 predict를 돌린다. 주문은 있고 포인트는 0이다. 예측의 답을 밝힌다. 예외가 없어서 로그로는 알 수 없다'
      - '원인은 S9의 내부 호출과 같다(O12 질문 4가 동적 프록시로 먼저 보였다). 프록시를 거쳐 들어온 것은 `placeOrder`인데 거기에는 `@Transactional`이 없다. 그 안의 `this`는 원래 객체라 `addPoint`의 어노테이션은 읽히지 않는다. 코드 probe로도 확인한다: 내부 호출한 메서드 안에서 `false`'
      - '포인트가 그대로인 이유: JPA는 트랜잭션을 커밋할 때 바뀐 엔티티를 찾아 UPDATE를 보낸다(변경 감지). 트랜잭션이 없으니 커밋도 없고 UPDATE도 없다. 변경 감지 자체는 P2에서 다룬다'
      - '고치는 법 하나: 코드 outer처럼 `placeOrder`에 붙인다. 주문과 적립이 한 트랜잭션이라 적립이 실패하면 주문도 롤백된다'
      - '고치는 법 둘: 코드 split처럼 `addPoint`를 `PointService` 빈으로 옮긴다. 프록시를 거쳐 포인트가 쌓인다. 그런데 `placeOrder`에는 트랜잭션이 없어 주문은 `save`가 끝날 때 이미 커밋된다. 적립이 실패하면 주문만 남는다. 둘의 결과를 실패 상황에서 비교한 실제 결과를 보인다'
      - '무엇을 고를지는 요구로 정한다. 주문과 적립이 함께여야 하면 바깥에, 적립 실패가 주문을 막으면 안 되면 나눈다(그때도 바깥에 트랜잭션을 두고 전파로 나누는 법은 S11)'
    widget:
      kind: compare
      note: '두 칸은 "바깥에 @Transactional"과 "PointService로 나눔". 버튼으로 "정상", "적립에서 예외"를 고른다. 칸마다 열린 트랜잭션 수와 끝난 뒤 주문 행과 포인트 값을 결과 줄에 보인다. 적립 예외에서 왼쪽은 둘 다 없음, 오른쪽은 주문만 남음'
    asks:
      - '본문의 예시: 코드 outer의 `placeOrder`에서 `addPoint`가 런타임 예외를 던지면 주문 행은 남나 (남지 않는다. 한 트랜잭션이라 함께 롤백된다)'
      - '옮긴 상황: `MemberService.join`(어노테이션 없음)이 회원을 저장한 뒤 같은 클래스의 `@Transactional sendWelcomeCoupon`을 부른다. 쿠폰 저장에서 런타임 예외가 나면 회원 행은 남나 (남는다. 회원 저장은 이미 따로 커밋됐고 쿠폰 메서드에는 트랜잭션도 없다)'
  - id: q3
    title: '@Transactional은 어디에 붙여야 걸리나요?'
    conclusion:
      lead: '프록시를 거쳐 밖에서 부르는, 오버라이딩할 수 있는 메서드에 붙여야 걸려요. `private`과 `final` 메서드에는 붙여도 걸리지 않아요.'
      sub: '클래스에 붙이면 모든 public 메서드에 걸리고 메서드에 붙인 설정이 먼저예요. 어노테이션이 없는 메서드에서는 리포지토리 메서드가 저마다 따로 트랜잭션을 열어요.'
    says:
      - '`private` 메서드에 `@Transactional`을 붙이고 같은 클래스의 public 메서드에서 부른다. 내부 호출이기도 하고 오버라이딩할 수도 없다. 트랜잭션이 없다. `final` public 메서드를 밖에서 불러도 없다. 코드 probe로 보인다(S9의 원리)'
      - '`protected`와 패키지 접근 메서드는 스프링 6.0부터 CGLIB 프록시에서 걸린다. 밖(같은 패키지의 다른 빈)에서 부르면 `true`다. 예전 글에서 "public에만 걸린다"고 한 것은 5.x까지의 설명이다. 테스트 결과로 단정한다'
      - '클래스에 `@Transactional(readOnly = true)`를 붙이고 쓰기 메서드에만 `@Transactional`을 붙이는 모양이 흔하다. 메서드의 것이 클래스의 것을 덮는다'
      - '어노테이션이 없는 메서드에서 `orders.save` 두 번을 부르면, `save`마다 리포지토리가 스스로 트랜잭션을 열고 커밋한다(Spring Data JPA의 `SimpleJpaRepository`에 `@Transactional`이 붙어 있다). 두 번째에서 실패해도 첫 번째는 남는다. 테스트로 보인다'
    asks:
      - '본문의 예시: `OrderService`의 `private void savePoint()`에 `@Transactional`을 붙이고 public `placeOrder`(어노테이션 없음)에서 부른다. `savePoint` 안에 트랜잭션이 있나 (없다)'
      - '옮긴 상황: 클래스에 `@Transactional(readOnly = true)`, `update` 메서드에 `@Transactional`이 붙어 있다. `update` 안의 트랜잭션은 읽기 전용인가 (아니다. 메서드에 붙인 것이 먼저다)'
  - id: q4
    title: 프록시 없이 트랜잭션을 열 수도 있나요?
    conclusion:
      lead: '네. `TransactionTemplate`에 람다를 넘기면 그 람다만 트랜잭션 안에서 돌아요.'
      sub: '어노테이션은 메서드 전체를 묶지만 `TransactionTemplate`은 코드로 범위를 정해서, 메서드의 일부만 묶거나 같은 클래스 안에서도 트랜잭션을 열 수 있어요.'
    says:
      - '코드 template처럼 검증과 알림은 밖에, 저장과 적립만 안에 둔다. 람다 안에서 코드 probe와 같은 질문을 하면 `true`, 밖에서는 `false`다. 테스트로 보인다'
      - '`TransactionTemplate`은 스프링 부트가 자동 설정으로 빈을 만들어 둔다(S4). 생성자로 받으면 된다'
      - '안에서 런타임 예외가 나면 롤백하고 예외를 다시 던진다. 람다에 넘어온 `TransactionStatus`의 `setRollbackOnly()`로 예외 없이 롤백할 수도 있다'
      - '같은 클래스 안에서도 쓸 수 있어서 내부 호출 문제가 없다. 프록시 없이 트랜잭션 매니저를 직접 부르기 때문이다'
      - '언제 무엇을 쓰나: 대부분은 어노테이션. 범위를 메서드의 일부로 좁혀야 할 때(외부 호출을 트랜잭션 밖에 두기, 실무에서는), 한 메서드에서 트랜잭션을 여러 번 나눠 열 때 `TransactionTemplate`. 람다로 넘기는 이유는 J12에서 본 "바뀌는 부분을 함수로 넘기기"다'
    asks:
      - '본문의 예시: 코드 template의 `notifyUser`에서 예외가 나면 주문 행은 남나 (남는다. 람다가 끝날 때 이미 커밋됐다)'
      - '옮긴 상황: `@Transactional`이 없는 `ReportService.run` 안에서 `tx.execute(s -> { ... })`를 세 번 부른다. 트랜잭션은 몇 번 열리고, 두 번째 람다가 실패하면 첫 번째의 변경은 남나 (세 번. 남는다)'
practice:
  says:
    - '흔한 실수 하나: 코드 external처럼 트랜잭션 안에서 외부 결제 API를 부른다. API가 5초 걸리면 그동안 DB 커넥션을 쥐고 있고, 요청이 몰리면 풀이 바닥난다(D6). 결제는 승인됐는데 뒤의 UPDATE가 실패해 롤백되면 DB에는 결제 기록이 없다. 고친 코드: `TransactionTemplate`으로 앞뒤 DB 작업만 묶고 외부 호출은 밖에 둔다. 커넥션을 잡고 있던 시간을 두 경우로 잰 결과를 테스트로 남긴다'
    - '흔한 실수 둘: 이 레슨의 내부 호출. 고친 코드는 질문 2. 코드 리뷰에서 `this.`로 부른 `@Transactional` 메서드를 찾는 습관을 적는다'
    - '읽기만 하는 메서드는 `@Transactional(readOnly = true)`. JPA는 읽기 전용이면 변경 감지를 위한 스냅샷을 만들지 않는다. 효과는 P 과정에서 다룬다고 적는다(스프링 프레임워크 문서 근거)'
    - '트랜잭션 로그를 켜는 법: `logging.level.org.springframework.transaction.interceptor=TRACE`면 프록시가 트랜잭션을 열고 닫을 때마다 로그를 남긴다. 내부 호출을 의심할 때 이 로그가 없으면 트랜잭션이 안 열린 것이다. 로그 한 줄을 실제 출력으로 보인다'
claims:
  - claim: '`@Transactional` 빈은 CGLIB 프록시다'
    how: '`AopUtils.isCglibProxy`'
    test: 'transaction/TransactionalProxyTest#beanIsProxy'
  - claim: '프록시를 거쳐 부른 메서드 안에서는 트랜잭션이 열려 있고, 어노테이션이 없거나 내부 호출이면 없다'
    how: '`isActualTransactionActive`'
    test: 'transaction/TransactionalProxyTest#externalCallHasTransaction, noAnnotationNoTransaction, internalCallHasNoTransaction'
  - claim: '내부 호출이면 주문은 저장되고 포인트는 그대로이며 예외가 없다'
    how: 'DB의 행을 본다'
    test: 'transaction/SelfInvocationTest#selfInvocationLosesPoint'
  - claim: '바깥에 붙이면 적립 실패 때 주문도 롤백되고, 빈을 나누면 주문은 남는다'
    how: 'DB의 행을 본다'
    test: 'transaction/TransactionalProxyTest#runtimeExceptionRollsBackWholeBoundary, splitBeansSplitTransactions'
  - claim: '한 `@Transactional` 메서드 안의 두 SQL은 같은 커넥션(같은 `pg_backend_pid()`)으로 나간다'
    how: '`JdbcTemplate`으로 `select pg_backend_pid()`를 두 번 부른다'
  - claim: '`private` 메서드와 `final` 메서드에는 트랜잭션이 없고, `protected`와 패키지 접근 메서드는 밖에서 부르면 있다(스프링 6.x)'
    how: '`isActualTransactionActive`'
  - claim: '메서드의 `@Transactional`이 클래스의 `readOnly = true`를 덮는다'
    how: '`TransactionSynchronizationManager.isCurrentTransactionReadOnly()`'
  - claim: '어노테이션 없는 메서드의 `save` 두 번은 따로 커밋되어 두 번째가 실패해도 첫 번째가 남는다'
    how: 'DB의 행'
  - claim: '`TransactionTemplate` 람다 안에서만 트랜잭션이 열리고, 람다가 끝나면 커밋되어 뒤에서 예외가 나도 남는다'
    how: '`isActualTransactionActive`와 DB의 행'
    test: 'transaction/TransactionalProxyTest#transactionTemplateOpensTransaction'
  - claim: '트랜잭션 안에서 느린 외부 호출을 하면 그 시간만큼 커넥션을 잡고 있고, 밖으로 빼면 줄어든다'
    how: '`Thread.sleep`으로 외부 호출을 흉내 내고, 히카리 풀의 활성 커넥션 수를 그 사이에 읽는다'
sources:
  - '선언적 트랜잭션과 프록시: 스프링 프레임워크 문서 https://docs.spring.io/spring-framework/reference/data-access/transaction/declarative/tx-decl-explained.html'
  - '`@Transactional`의 설정과 메서드 접근 범위(6.0부터 protected, 패키지 접근): https://docs.spring.io/spring-framework/reference/data-access/transaction/declarative/annotations.html'
  - '`TransactionTemplate`: https://docs.spring.io/spring-framework/reference/data-access/transaction/programmatic.html'
  - 'Spring Data JPA 리포지토리 메서드의 기본 트랜잭션: https://docs.spring.io/spring-data/jpa/reference/jpa/transactions.html'
