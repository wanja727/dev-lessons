# 스프링 빈과 의존성 주입 (설계서)
# 자료 파일의 칸은 docs/lesson-data-format.md에 있다.
# 예전 레슨 site/src/pages/lessons/spring-beans.astro와 그 검증 테스트(beans/SpringBeansTest)를 재료로 다시 쓴다.
stage: design
title: 스프링 빈과 의존성 주입
unit: 스프링
roadmap: S2
type: 동작 확인
prerequisites:
  - {slug: dip-di, title: 의존 역전 원칙과 의존성 주입}
assume: '자바 21, 스프링 부트 3.5(스프링 프레임워크 6.2). 인터페이스에 기대고 구현은 밖에서 넣어 준다는 의존성 주입의 생각(의존 역전 원칙 레슨). 어노테이션이 클래스에 붙은 표시라는 것(상속과 다형성, 리플렉션과 어노테이션 레슨). 서블릿과 톰캣 레슨은 몰라도 돼요.'
example: '커피 주문 서비스. `CoffeeController`가 `CoffeeService`를, `CoffeeService`가 `CoffeeMenuRepository`와 `NoticeSender`(문자로 알림)를 쓴다. 알림을 문자와 메일 두 가지로 늘리며 같은 타입의 빈이 둘일 때를 본다.'
intro:
  - '스프링 프로젝트를 처음 열면 `new`가 거의 보이지 않아요. 컨트롤러는 서비스를 생성자로 받기만 하고, 그 서비스는 누가 만드는지 코드에 없어요. 그러다 알림 구현을 하나 더 만든 날, 앱이 "빈이 둘이라 고를 수 없다"며 뜨지 않아요.'
  - '스프링 컨테이너가 객체를 대신 만들고 서로 이어 줘요. 스프링 개발자는 클래스마다 무엇을 받을지만 적고, 어떤 구현을 넣을지는 컨테이너의 규칙에 맡겨요. 그 규칙(스캔 범위, 타입으로 찾기, 여럿일 때 고르기)을 알아야 뜨지 않는 앱을 고칠 수 있어요.'
  - '이 레슨에서는 컨테이너가 객체를 만드는 순서를 출력으로 보고, 같은 타입의 빈이 둘일 때 나는 에러와 고치는 방법 세 가지를 돌려 봐요.'
covers:
  - topic: '스프링 컨테이너(`ApplicationContext`)는 객체를 만들고 필요한 객체를 넣어 이어 준다. 컨테이너가 관리하는 객체를 빈이라 한다. 객체를 만드는 일을 내 코드가 아니라 컨테이너가 하는 것을 제어의 역전이라 한다'
    where: '질문 1'
  - topic: '컴포넌트 스캔: `@SpringBootApplication`이 붙은 클래스의 패키지와 그 아래에서 `@Component`(`@Service`, `@Repository`, `@Controller` 포함)가 붙은 클래스를 찾아 빈으로 만든다. 패키지 밖의 클래스는 빈이 되지 않는다'
    where: '질문 1'
  - topic: '`@Configuration` 클래스의 `@Bean` 메서드로 빈을 직접 만든다. 내가 고칠 수 없는 라이브러리 클래스를 빈으로 만들 때 쓴다'
    where: '질문 1과 실무에서는'
  - topic: '컨테이너는 의존하는 빈을 먼저 만들고 그것을 넣어 다음 빈을 만든다'
    where: '질문 1'
  - topic: '주입 방법 셋: 생성자, 세터, 필드. 생성자가 하나면 `@Autowired`를 생략한다'
    where: '질문 2'
  - topic: '생성자 주입을 쓰는 이유: 필드를 `final`로 둔다, 스프링 없이 `new`로 가짜를 넣어 테스트한다, 빠진 의존성은 앱을 띄울 때 바로 실패한다'
    where: '질문 2'
  - topic: '`new`로 직접 만든 객체는 컨테이너가 모르므로 주입이 일어나지 않는다'
    where: '질문 2'
  - topic: '순환 참조: A가 B를, B가 A를 생성자로 받으면 앱이 뜨지 않는다. 스프링 부트 2.6부터 필드 주입의 순환 참조도 기본으로 막는다'
    where: '질문 2의 더 알아보기'
  - topic: '주입은 타입으로 찾는다. 같은 타입의 빈이 둘이면 `NoUniqueBeanDefinitionException`으로 앱이 뜨지 않는다. 하나도 없으면 `NoSuchBeanDefinitionException`'
    where: '질문 3'
  - topic: '구현이 여럿일 때 고르는 규칙: `@Primary`, `@Qualifier`, 매개변수 이름이 빈 이름과 같을 때. 모두 받으려면 `List<NoticeSender>`'
    where: '질문 3'
  - topic: '빈은 기본으로 싱글톤이다. 컨테이너에서 몇 번 꺼내도 같은 객체다'
    where: '질문 4'
  - topic: '`@Configuration` 클래스는 CGLIB으로 감싸져서 `@Bean` 메서드를 여러 번 불러도 같은 빈을 돌려준다'
    where: '질문 4의 더 알아보기. 프록시는 AOP(S9)'
  - topic: '싱글톤 빈에 바뀌는 상태를 두면 생기는 일, 프로토타입 스코프'
    where: '다루지 않음: 빈의 생명주기와 스코프(S3)'
  - topic: '스프링 부트가 자동으로 만드는 빈(`ObjectMapper`, `DataSource`)'
    where: '다루지 않음: 스프링 부트의 자동 설정(S4)'
  - topic: '컨테이너가 어노테이션을 읽는 방법(리플렉션)'
    where: '다루지 않음: 리플렉션과 어노테이션(J17)'
codes:
  predict: |-
    public interface NoticeSender {
      String send(String to, String msg);
    }

    @Component
    class SmsNoticeSender
        implements NoticeSender { ... }

    @Component
    class MailNoticeSender
        implements NoticeSender { ... }

    @Service
    class CoffeeService {
      CoffeeService(NoticeSender sender) {
        ...
      }
    }
  service: |-
    @Service
    public class CoffeeService {
      private final CoffeeMenuRepository menu;
      private final NoticeSender sender;

      public CoffeeService(
          CoffeeMenuRepository menu,
          NoticeSender sender) {
        this.menu = menu;
        this.sender = sender;
      }
    }
  field: |-
    @Service
    public class FieldInjectedService {
      @Autowired
      private NoticeSender sender;
    }
  primary: |-
    @Component
    @Primary
    class SmsNoticeSender
        implements NoticeSender { ... }
  qualifier: |-
    CoffeeService(
        @Qualifier("mailNoticeSender")
        NoticeSender sender) { ... }
  bean: |-
    @Configuration
    class ClockConfig {
      @Bean
      Clock clock() {
        return Clock.systemDefaultZone();
      }
    }
predict:
  text: '코드 predict처럼 `NoticeSender`를 구현한 `@Component`가 둘이고, `CoffeeService`는 생성자로 `NoticeSender` 하나를 받아요. 앱을 띄우면 어떻게 될까요? 보기: 먼저 만든 `SmsNoticeSender`가 들어간다, 둘 중 아무거나 들어간다, 앱이 뜨지 않는다, `CoffeeService`에 null이 들어간다.'
  answer: '앱이 뜨지 않는다. 같은 타입의 빈이 둘이라 고를 수 없어 `NoUniqueBeanDefinitionException`이 난다. 질문 3에서 밝힌다.'
questions:
  - id: q1
    title: 스프링 컨테이너는 무엇을 하나요?
    conclusion:
      lead: '클래스를 찾아 객체(빈)를 대신 만들고, 각 객체가 필요로 하는 다른 객체를 넣어 이어 줘요.'
      sub: '`@Component`가 붙은 클래스를 스캔으로 찾고, 의존하는 빈을 먼저 만든 뒤 그것을 생성자에 넣어 다음 빈을 만들어요.'
    says:
      - '예제의 네 클래스를 보인다. 어디에도 `new CoffeeService(...)`가 없다. 그래도 앱을 띄우면 컨트롤러에 서비스가 들어가 있다. 컨테이너가 만들어 넣었기 때문이다'
      - '컨테이너(`ApplicationContext`)가 관리하는 객체를 빈이라 한다. 객체를 만들고 잇는 일을 내 코드가 아니라 컨테이너가 하는 것을 제어의 역전(IoC)이라 하고, 필요한 객체를 밖에서 넣어 주는 것을 의존성 주입(DI)이라 한다. O5에서 손으로 하던 조립을 컨테이너가 한다'
      - '컨테이너가 빈을 찾는 법: `@SpringBootApplication`이 붙은 클래스의 패키지와 그 아래를 스캔해 `@Component`가 붙은 클래스를 찾는다. `@Service`, `@Repository`, `@Controller`는 안에 `@Component`가 붙은 어노테이션이라 같이 찾힌다(J17에서 본 메타 어노테이션). 이 패키지 밖에 둔 클래스는 빈이 되지 않는다'
      - '컨테이너가 빈을 만드는 순서: `CoffeeService`를 만들려면 생성자에 `CoffeeMenuRepository`와 `NoticeSender`가 있어야 하니 그 둘을 먼저 만든다. 생성자마다 한 줄씩 찍은 출력을 실제 출력으로 보인다'
      - '고칠 수 없는 클래스(라이브러리의 `Clock`)는 `@Component`를 붙일 수 없다. `@Configuration` 클래스에 `@Bean` 메서드를 두면 그 메서드가 돌려준 객체가 빈이 된다(코드 bean)'
    asks:
      - '본문의 예시: `CoffeeService`가 생성자로 `CoffeeMenuRepository`를 받는다. 컨테이너는 둘 중 무엇을 먼저 만드나 (`CoffeeMenuRepository`)'
      - '옮긴 상황: `@SpringBootApplication`이 `com.shop` 패키지에 있다. `@Service`가 붙은 `com.shop.order.OrderService`와 `com.common.MailSender`는 빈이 되나 (`OrderService`만 된다. `com.common`은 스캔 범위 밖이다)'
  - id: q2
    title: 왜 생성자로 주입받나요?
    conclusion:
      lead: '필드를 `final`로 둘 수 있고, 스프링 없이 `new`로 가짜 객체를 넣어 테스트할 수 있고, 빠진 것이 있으면 앱이 뜰 때 바로 알려 주기 때문이에요.'
      sub: '필드 주입은 컨테이너만 값을 넣을 수 있어서, `new`로 만든 객체에서는 그 필드가 null로 남아요.'
    says:
      - '주입 방법은 셋이다. 생성자(코드 service), 세터, 필드(코드 field). 생성자가 하나뿐이면 `@Autowired`를 붙이지 않아도 그 생성자로 주입한다'
      - '필드 주입의 문제: 컨테이너가 리플렉션으로 private 필드에 값을 넣는다. 테스트에서 `new FieldInjectedService()`로 만들면 `sender`가 null이다. 테스트로 보인다'
      - '생성자 주입은 스프링 없이도 `new CoffeeService(new CoffeeMenuRepository(), 가짜)`로 만들 수 있다. 가짜 `NoticeSender`를 람다로 넣고 결과를 확인하는 테스트를 보인다'
      - '`final`이라 한 번 넣은 뒤 바뀌지 않고, 받아야 할 빈이 없으면 앱이 뜨는 순간 `NoSuchBeanDefinitionException`으로 실패한다. 필드 주입도 시작할 때 실패하지만, 빈이 아닌 객체에서는 null로 남아 쓰는 순간에야 `NullPointerException`이 난다'
      - '더 알아보기: 순환 참조. `A`가 `B`를, `B`가 `A`를 생성자로 받으면 어느 쪽도 먼저 만들 수 없어 앱이 뜨지 않는다. 에러 메시지에 순환이 그려진다. 스프링 부트 2.6부터는 필드 주입이어도 기본으로 막는다. 순환은 설계를 고칠 신호다'
    asks:
      - '본문의 예시: 코드 field의 클래스를 테스트에서 `new FieldInjectedService()`로 만들고 `sender.send(...)`를 부르면 어떻게 되나 (`NullPointerException`. 컨테이너가 만든 객체가 아니라 주입되지 않았다)'
      - '옮긴 상황: `PaymentService`가 생성자로 `PgClient`를 받는데, `PgClient` 구현에 `@Component`를 붙이지 않았다. 앱은 언제 실패하나 (앱을 띄울 때 `NoSuchBeanDefinitionException`으로 실패한다)'
  - id: q3
    title: 같은 타입의 빈이 둘이면 무엇이 들어가나요?
    conclusion:
      lead: '스프링은 아무거나 고르지 않고 앱을 띄우지 않아요. 무엇을 넣을지 `@Primary`나 `@Qualifier`로 알려 줘야 해요.'
      sub: '주입은 타입으로 찾고, 후보가 여럿이면 `@Primary`, `@Qualifier`, 매개변수 이름 순서로 하나를 골라요. 모두 받고 싶으면 `List`로 받아요.'
    says:
      - '코드 predict를 띄운다. `NoUniqueBeanDefinitionException`이 나고 메시지에 두 빈의 이름이 나온다. 예측의 답을 밝힌다. 실제 메시지를 보인다'
      - '빈의 이름은 따로 주지 않으면 클래스 이름의 첫 글자를 소문자로 바꾼 것이다(`smsNoticeSender`)'
      - '고치는 법 하나: 기본으로 쓸 구현에 `@Primary`(코드 primary). 다른 곳에서 특별히 고르지 않으면 이것이 들어간다'
      - '고치는 법 둘: 받는 쪽에서 `@Qualifier("mailNoticeSender")`로 이름을 적는다(코드 qualifier). `@Primary`보다 먼저 본다'
      - '고치는 법 셋: 매개변수 이름을 빈 이름과 같게 `NoticeSender mailNoticeSender`로 쓴다. 이름이 바뀌면 조용히 깨지니 앞의 둘을 권한다'
      - '둘 다 쓰고 싶으면 `List<NoticeSender>`로 받는다. 구현 둘이 모두 들어온다. 알림을 문자와 메일로 모두 보내는 예'
    widget:
      kind: toggle
      note: '받는 쪽 코드를 고르는 버튼 넷: 아무것도 없음, `@Primary`를 문자 쪽에, `@Qualifier("mailNoticeSender")`, `List<NoticeSender>`로 받기. 고를 때마다 앱이 뜨는지와 `CoffeeService`에 들어간 것(에러 메시지, SmsNoticeSender, MailNoticeSender, 둘 다)을 보인다'
    asks:
      - '본문의 예시: `SmsNoticeSender`에 `@Primary`가 있고, `CoffeeService`가 `@Qualifier("mailNoticeSender") NoticeSender sender`로 받는다. 무엇이 들어가나 (`MailNoticeSender`. `@Qualifier`가 먼저다)'
      - '옮긴 상황: 결제 대행사 클라이언트 `PgClient`의 구현이 `TossPgClient`와 `KakaoPgClient` 둘이고 아무 표시도 없다. 정산 서비스가 `List<PgClient>`로 받으면 앱이 뜨나, 무엇이 들어가나 (뜬다. 둘 다 들어간다)'
  - id: q4
    title: 빈은 몇 개 만들어지나요?
    conclusion:
      lead: '따로 정하지 않으면 빈은 하나만 만들어지고, 그것을 받는 모든 곳에 같은 객체가 들어가요.'
      sub: '이것을 싱글톤 스코프라고 해요. 컨테이너에서 몇 번 꺼내도, 어느 클래스가 받아도 같은 객체예요.'
    says:
      - '`context.getBean(CoffeeService.class)`를 두 번 부르면 같은 객체다. 컨트롤러가 받은 서비스와 다른 곳이 받은 서비스도 같은 객체다. 테스트로 보인다'
      - '컨테이너가 만든 빈 목록과 스코프를 출력해 실제 출력으로 보인다. 모두 `singleton`이다'
      - '하나만 만드는 이유: 요청마다 서비스와 리포지토리를 새로 만들 필요가 없다. 이 객체들은 요청마다 달라지는 값을 가지지 않기 때문이다. 바뀌는 값을 두면 생기는 문제는 S3에서 본다'
      - '더 알아보기: `@Configuration` 클래스는 스프링이 하위 클래스(CGLIB 프록시)로 감싼다. 그래서 한 `@Bean` 메서드에서 다른 `@Bean` 메서드를 불러도 새 객체가 아니라 이미 만든 빈을 돌려준다. `@Configuration(proxyBeanMethods = false)`이면 감싸지 않아 부를 때마다 새 객체다. 둘을 비교한 테스트를 보인다. 프록시는 S9에서 다룬다'
    asks:
      - '본문의 예시: `CoffeeController`와 `OrderReportService`가 둘 다 `CoffeeService`를 생성자로 받는다. 두 곳에 들어간 객체는 같은가 (같다. 싱글톤이다)'
      - '옮긴 상황: `@Configuration` 클래스에서 `@Bean Clock clock()`을 두고, 다른 `@Bean` 메서드 둘이 `clock()`을 불러 쓴다. `Clock` 객체는 몇 개인가 (하나. `@Configuration`이 감싸서 이미 만든 빈을 돌려준다)'
practice:
  says:
    - '프로젝트에 그대로 들어갈 모양: 생성자가 하나인 `@Service`(코드 service), 라이브러리 객체는 `@Bean`(코드 bean). `Clock`을 빈으로 두면 테스트에서 고정된 시각을 넣을 수 있다는 것까지 테스트로 보인다'
    - '흔한 실수 하나: 필드 주입을 쓰고 단위 테스트에서 `new`로 만들어 `NullPointerException`을 만난다. 고친 코드: 생성자 주입으로 바꾸고 테스트에서 가짜를 넣는다(질문 2를 가리킨다)'
    - '흔한 실수 둘: 새 패키지 `com.common`에 공통 클래스를 만들었는데 주입이 안 된다. `@SpringBootApplication`보다 위나 옆 패키지라 스캔 밖이다. 고치는 법: 클래스를 메인 클래스의 패키지 아래로 옮긴다. `@ComponentScan`으로 범위를 넓힐 수도 있지만 자동 설정의 스캔 규칙과 겹쳐 권하지 않는다(스프링 부트 문서 근거)'
    - '롬복을 쓰는 팀은 `@RequiredArgsConstructor`로 `final` 필드의 생성자를 만든다고 한 줄 적는다(이 저장소는 롬복을 쓰지 않아 확인하지 않는다)'
claims:
  - claim: '컨테이너는 `CoffeeMenuRepository`와 `SmsNoticeSender`를 `CoffeeService`보다 먼저, `CoffeeService`를 `CoffeeController`보다 먼저 만든다'
    how: '생성자에서 남긴 기록의 순서를 본다'
    test: 'beans/SpringBeansTest#creationOrder'
  - claim: '`new`로 만든 필드 주입 객체의 필드는 null이다'
    how: '컨테이너가 만든 것과 비교한다'
    test: 'beans/SpringBeansTest#newObjectIsNotInjected'
  - claim: '생성자 주입은 스프링 없이 가짜를 넣어 쓸 수 있다'
    how: '`new`로 만들어 결과를 본다'
    test: 'beans/SpringBeansTest#constructorInjectionWithoutSpring'
  - claim: '같은 타입의 `@Component`가 둘이고 하나를 받으면 `NoUniqueBeanDefinitionException`으로 컨텍스트가 뜨지 않는다'
    how: '`AnnotationConfigApplicationContext`로 작은 컨텍스트를 띄워 예외와 메시지를 본다. 레슨 패키지 안의 클래스만 등록해 다른 테스트에 영향을 주지 않는다'
  - claim: '`@Primary`, `@Qualifier`, 매개변수 이름, `List`로 받을 때 들어가는 빈이 각각 다르다. `@Qualifier`가 `@Primary`보다 먼저다'
    how: '같은 작은 컨텍스트에서 경우마다 들어간 객체의 클래스를 본다'
  - claim: '받아야 할 빈이 없으면 `NoSuchBeanDefinitionException`(원인)으로 뜨지 않고, 생성자 순환이면 순환 예외로 뜨지 않는다'
    how: '작은 컨텍스트에서 원인 예외를 본다'
  - claim: '스캔 범위 밖 패키지의 `@Component`는 빈이 되지 않는다'
    how: '`AnnotationConfigApplicationContext`에 패키지 하나만 스캔시키고 다른 패키지의 클래스를 찾는다'
  - claim: '싱글톤 빈은 몇 번 꺼내도 같은 객체다. `@Configuration`은 `@Bean` 메서드를 여러 번 불러도 같은 객체를, `proxyBeanMethods = false`면 다른 객체를 준다'
    how: '작은 컨텍스트에서 비교한다'
sources:
  - 'IoC 컨테이너와 빈, 의존성 주입: 스프링 프레임워크 문서 https://docs.spring.io/spring-framework/reference/core/beans/introduction.html'
  - '생성자 주입을 권하는 이유: https://docs.spring.io/spring-framework/reference/core/beans/dependencies/factory-collaborators.html'
  - '`@Primary`와 `@Qualifier`: https://docs.spring.io/spring-framework/reference/core/beans/annotation-config/autowired-qualifiers.html'
  - '`@SpringBootApplication`의 스캔 범위와 코드 위치: 스프링 부트 문서 https://docs.spring.io/spring-boot/reference/using/structuring-your-code.html'
  - '순환 참조를 기본으로 막는 것: 스프링 부트 2.6 릴리스 노트 https://github.com/spring-projects/spring-boot/wiki/Spring-Boot-2.6-Release-Notes'
