# 스프링 빈과 의존성 주입
# 자료 파일의 칸은 docs/lesson-data-format.md에 있다. 문제는 content/questions/spring-beans.yaml에 있다.
# 예전 레슨 site/src/pages/lessons/spring-beans.astro와 그 검증 테스트(beans/SpringBeansTest)를 재료로 다시 썼다.
title: 스프링 빈과 의존성 주입
description: 스프링 컨테이너가 하는 일, 생성자로 주입받는 이유, 같은 타입의 빈이 둘일 때 고르는 규칙, 빈이 하나만 만들어진다는 것. 네 가지 질문에 스스로 답할 수 있게 작은 컨테이너를 띄워 만드는 순서와 에러를 직접 보는 대화형 레슨.
unit: 스프링
minutes: 20
roadmap: S2
type: 동작 확인
prerequisites:
  - {slug: dip-di, title: 의존 역전 원칙과 의존성 주입}
assume: '자바 21, 스프링 부트 3.5(스프링 프레임워크 6.2). 인터페이스에 기대고 구현은 밖에서 넣어 준다는 의존성 주입의 생각(의존 역전 원칙 레슨). 어노테이션이 클래스에 붙은 표시라는 것(상속과 다형성, 리플렉션과 어노테이션 레슨). 서블릿과 톰캣 레슨은 몰라도 돼요.'
example: '커피 주문 서비스. `CoffeeController`가 `CoffeeService`를, `CoffeeService`가 `CoffeeMenuRepository`와 `NoticeSender`(문자로 알림)를 쓴다. 알림을 문자와 메일 두 가지로 늘리며 같은 타입의 빈이 둘일 때를 본다.'
intro:
  - '스프링 프로젝트를 처음 열면 `new`가 거의 보이지 않아요. 컨트롤러는 서비스를 생성자로 받기만 하고, 그 서비스는 누가 만드는지 코드에 없어요. 그러다 알림 구현을 하나 더 만든 날, 앱이 "빈이 둘이라 고를 수 없다"며 뜨지 않아요.'
  - '스프링 컨테이너가 객체를 대신 만들고 서로 이어 줘요. 스프링 개발자는 클래스마다 무엇을 받을지만 적고, 어떤 구현을 넣을지는 컨테이너의 규칙에 맡겨요. 그 규칙(스캔 범위, 타입으로 찾기, 여럿일 때 고르기)을 알아야 뜨지 않는 앱을 고칠 수 있어요.'
  - '이 레슨에서는 컨테이너가 객체를 만드는 순서를 출력으로 보고, 같은 타입의 빈이 둘일 때 나는 에러와 고치는 방법 세 가지를 돌려 봐요.'
covers:
  - topic: '스프링 컨테이너(`ApplicationContext`)는 객체를 만들고 필요한 객체를 넣어 이어 준다. 컨테이너가 관리하는 객체를 빈이라 한다. 객체를 만드는 일을 내 코드가 아니라 컨테이너가 하는 것을 제어의 역전이라 한다'
    where: '질문 1'
  - topic: '컴포넌트 스캔: `@SpringBootApplication`이 붙은 클래스의 패키지와 그 아래에서 `@Component`(`@Service`, `@Repository`, `@Controller` 포함)가 붙은 클래스를 찾아 빈으로 만든다. 패키지 밖의 클래스는 빈이 되지 않는다'
    where: '질문 1'
  - topic: '`@Configuration` 클래스의 `@Bean` 메서드로 빈을 직접 만든다. 내가 고칠 수 없는 라이브러리 클래스를 빈으로 만들 때 쓴다'
    where: '질문 1과 실무에서는'
  - topic: '컨테이너는 의존하는 빈을 먼저 만들고 그것을 넣어 다음 빈을 만든다'
    where: '질문 1'
  - topic: '주입 방법 셋: 생성자, 세터, 필드. 생성자가 하나면 `@Autowired`를 생략한다'
    where: '질문 2'
  - topic: '생성자 주입을 쓰는 이유: 필드를 `final`로 둔다, 스프링 없이 `new`로 가짜를 넣어 테스트한다, 빠진 의존성은 앱을 띄울 때 바로 실패한다'
    where: '질문 2'
  - topic: '`new`로 직접 만든 객체는 컨테이너가 모르므로 주입이 일어나지 않는다'
    where: '질문 2'
  - topic: '순환 참조: A가 B를, B가 A를 생성자로 받으면 앱이 뜨지 않는다. 스프링 부트 2.6부터 필드 주입의 순환 참조도 기본으로 막는다'
    where: '질문 2의 더 알아보기'
  - topic: '주입은 타입으로 찾는다. 같은 타입의 빈이 둘이면 `NoUniqueBeanDefinitionException`으로 앱이 뜨지 않는다. 하나도 없으면 `NoSuchBeanDefinitionException`'
    where: '질문 3'
  - topic: '구현이 여럿일 때 고르는 규칙: `@Primary`, `@Qualifier`, 매개변수 이름이 빈 이름과 같을 때. 모두 받으려면 `List<NoticeSender>`'
    where: '질문 3'
  - topic: '빈은 기본으로 싱글톤이다. 컨테이너에서 몇 번 꺼내도 같은 객체다'
    where: '질문 4'
  - topic: '`@Configuration` 클래스는 CGLIB으로 감싸져서 `@Bean` 메서드를 여러 번 불러도 같은 빈을 돌려준다'
    where: '질문 4의 더 알아보기. 프록시는 AOP(S9)'
  - topic: '싱글톤 빈에 바뀌는 상태를 두면 생기는 일, 프로토타입 스코프'
    where: '다루지 않음: 빈의 생명주기와 스코프(S3)'
  - topic: '스프링 부트가 자동으로 만드는 빈(`ObjectMapper`, `DataSource`)'
    where: '다루지 않음: 스프링 부트의 자동 설정(S4)'
  - topic: '컨테이너가 어노테이션을 읽는 방법(리플렉션)'
    where: '다루지 않음: 리플렉션과 어노테이션(J17)'
links:
  test: https://github.com/wanja727/dev-lessons/blob/main/verification/src/test/java/lab/devlessons/springbeans/SpringBeansLessonTest.java
  ioc: https://docs.spring.io/spring-framework/reference/core/beans/introduction.html
  di: https://docs.spring.io/spring-framework/reference/core/beans/dependencies/factory-collaborators.html
  qualifiers: https://docs.spring.io/spring-framework/reference/core/beans/annotation-config/autowired-qualifiers.html
  structuring: https://docs.spring.io/spring-boot/reference/using/structuring-your-code.html
  boot26: https://github.com/spring-projects/spring-boot/wiki/Spring-Boot-2.6-Release-Notes
codes:
  predict: |-
    public interface NoticeSender {
      String send(String to, String msg);
    }

    @Component
    class SmsNoticeSender
        implements NoticeSender { ... }

    @Component
    class MailNoticeSender
        implements NoticeSender { ... }

    @Service
    class CoffeeService {
      CoffeeService(NoticeSender sender) {
        ...
      }
    }
  service: |-
    @Service
    public class CoffeeService {
      private final CoffeeMenuRepository menu;
      private final NoticeSender sender;

      public [[CoffeeService(]]
          [[CoffeeMenuRepository menu,]]
          [[NoticeSender sender)]] {
        this.menu = menu;
        this.sender = sender;
      }
    }
  layers: |-
    @Controller
    class CoffeeController {
      CoffeeController(CoffeeService s) {}
    }

    @Service
    class CoffeeService {
      CoffeeService(
          CoffeeMenuRepository menu,
          NoticeSender sender) {}
    }

    @Repository
    class CoffeeMenuRepository {}

    @Component
    class SmsNoticeSender
        implements NoticeSender {}
  field: |-
    @Service
    public class FieldInjectedService {
      [[@Autowired]]
      private NoticeSender sender;
    }
  fake: |-
    NoticeSender fake = (to, msg) ->
        "가짜:" + to + ":" + msg;
    CoffeeService service = new CoffeeService(
        new CoffeeMenuRepository(), fake);

    service.order("kim", "latte");
    // "가짜:kim:latte 5000원 주문 완료"
  primary: |-
    @Component
    [[@Primary]]
    class SmsNoticeSender
        implements NoticeSender { ... }
  qualifier: |-
    CoffeeService(
        [[@Qualifier("mailNoticeSender")]]
        NoticeSender sender) { ... }
  list: |-
    @Service
    class NoticeService {
      private final List<NoticeSender> all;

      NoticeService(
          [[List<NoticeSender> all]]) {
        this.all = all;
      }
    }
  bean: |-
    @Configuration
    class ClockConfig {
      [[@Bean]]
      Clock clock() {
        return Clock.systemDefaultZone();
      }
    }
  configCall: |-
    @Configuration
    class ClockConfig {
      @Bean Clock clock() { ... }

      @Bean Report daily() {
        return new Report([[clock()]]);
      }

      @Bean Report weekly() {
        return new Report([[clock()]]);
      }
    }
  clockUse: |-
    @Service
    class CouponService {
      private final Clock clock;

      CouponService(Clock clock) {
        this.clock = clock;
      }

      boolean expired(Coupon c) {
        return c.until().isBefore(
            LocalDate.now(clock));
      }
    }
predict:
  title: 알림 구현이 둘이 되면 어떻게 될까요?
  text: '`NoticeSender`를 구현한 `@Component`가 둘이고, `CoffeeService`는 생성자로 `NoticeSender` 하나를 받아요. 앱을 띄우면 어떻게 될까요? 답은 질문 3에 나와요.'
  code: predict
  label: 내 예측
  options:
    - {value: a, label: 먼저 만든 SmsNoticeSender가 들어간다}
    - {value: b, label: 둘 가운데 아무거나 들어간다}
    - {value: c, label: 앱이 뜨지 않는다}
    - {value: d, label: CoffeeService에 null이 들어간다}
  answer: c
  storageKey: sb-predict
  wrong: 예측은 "{label}"이었어요. 틀린 예측이 더 오래 남으니 괜찮아요.
questions:
  - id: q1
    title: 스프링 컨테이너는 무엇을 하나요?
    conclusion:
      lead: '클래스를 찾아 객체(빈)를 대신 만들고, 각 객체가 필요로 하는 다른 객체를 넣어 이어 줘요.'
      sub: '`@Component`가 붙은 클래스를 스캔으로 찾고, 의존하는 빈을 먼저 만든 뒤 그것을 생성자에 넣어 다음 빈을 만들어요.'
    says:
      - '예제의 네 클래스를 보인다. 어디에도 `new CoffeeService(...)`가 없다. 그래도 앱을 띄우면 컨트롤러에 서비스가 들어가 있다. 컨테이너가 만들어 넣었기 때문이다'
      - '컨테이너(`ApplicationContext`)가 관리하는 객체를 빈이라 한다. 객체를 만들고 잇는 일을 내 코드가 아니라 컨테이너가 하는 것을 제어의 역전(IoC)이라 하고, 필요한 객체를 밖에서 넣어 주는 것을 의존성 주입(DI)이라 한다. O5에서 손으로 하던 조립을 컨테이너가 한다'
      - '컨테이너가 빈을 찾는 법: `@SpringBootApplication`이 붙은 클래스의 패키지와 그 아래를 스캔해 `@Component`가 붙은 클래스를 찾는다. `@Service`, `@Repository`, `@Controller`는 안에 `@Component`가 붙은 어노테이션이라 같이 찾힌다(J17에서 본 메타 어노테이션). 이 패키지 밖에 둔 클래스는 빈이 되지 않는다'
      - '컨테이너가 빈을 만드는 순서: `CoffeeService`를 만들려면 생성자에 `CoffeeMenuRepository`와 `NoticeSender`가 있어야 하니 그 둘을 먼저 만든다. 생성자마다 한 줄씩 찍은 출력을 실제 출력으로 보인다'
      - '고칠 수 없는 클래스(라이브러리의 `Clock`)는 `@Component`를 붙일 수 없다. `@Configuration` 클래스에 `@Bean` 메서드를 두면 그 메서드가 돌려준 객체가 빈이 된다(코드 bean)'
    asks:
      - '본문의 예시: `CoffeeService`가 생성자로 `CoffeeMenuRepository`를 받는다. 컨테이너는 둘 중 무엇을 먼저 만드나 (`CoffeeMenuRepository`)'
      - '옮긴 상황: `@SpringBootApplication`이 `com.shop` 패키지에 있다. `@Service`가 붙은 `com.shop.order.OrderService`와 `com.common.MailSender`는 빈이 되나 (`OrderService`만 된다. `com.common`은 스캔 범위 밖이다)'
    body:
      - p: '예제의 네 클래스예요. 컨트롤러는 서비스를, 서비스는 메뉴 리포지토리와 알림 발송기를 생성자로 받아요. 어디에도 `new CoffeeService(...)`가 없어요.'
      - code: layers
      - p: '그런데 앱을 띄우면 컨트롤러 안에 서비스가 들어 있어요. 누군가 대신 만들어 넣은 거예요. 그 누군가가 **스프링 컨테이너**(`ApplicationContext`)예요. 컨테이너가 만들고 관리하는 객체를 **빈**이라고 불러요.'
      - p: '[의존 역전 원칙과 의존성 주입](lesson:dip-di) 레슨에서는 `main`에서 객체를 직접 만들고 생성자로 넘겨 조립했어요. 그 조립을 컨테이너가 해요. 객체를 만들고 잇는 일을 내 코드가 아니라 컨테이너가 맡는 것을 **제어의 역전**(IoC), 필요한 객체를 밖에서 넣어 주는 것을 **의존성 주입**(DI)이라고 해요.'
      - h3: 무엇을 빈으로 만드나요
      - p: '컨테이너는 `@SpringBootApplication`이 붙은 클래스의 **패키지와 그 아래**를 뒤져서 `@Component`가 붙은 클래스를 찾아요. 이것을 **컴포넌트 스캔**이라고 해요. `@Service`, `@Repository`, `@Controller`는 안쪽에 `@Component`가 붙은 어노테이션이라 함께 찾혀요. 이름은 역할을 알려 줄 뿐 컨테이너에게는 같은 표시예요.'
      - p: '스캔 범위 밖에 둔 클래스는 `@Component`가 붙어 있어도 빈이 되지 않아요. 패키지 하나만 스캔하게 해서 확인했어요.'
      - ci:
          key: scan
          label: 실제 결과 보기
          source: SpringBeansLessonTest.scanRange
      - h3: 받을 것을 먼저 만들어요
      - p: '생성자마다 "생성" 한 줄을 남기게 하고 컨테이너를 띄웠어요.'
      - ci:
          key: creation
          label: 실제 출력 보기
          source: SpringBeansLessonTest.creationOrder
      - p: '`CoffeeService`를 만들려면 생성자에 넣을 `CoffeeMenuRepository`와 `NoticeSender`가 있어야 해요. 그래서 컨테이너는 그 둘을 먼저 만들고, 그것을 넣어 서비스를 만들고, 서비스를 넣어 컨트롤러를 만들어요. 컨트롤러에 들어간 서비스는 컨테이너가 가진 바로 그 빈이에요.'
      - h3: 고칠 수 없는 클래스는 @Bean으로
      - p: '자바의 `Clock`처럼 라이브러리 클래스에는 `@Component`를 붙일 수 없어요. 이때는 `@Configuration` 클래스에 `@Bean` 메서드를 둬요. 메서드가 돌려준 객체가 빈이 돼요.'
      - code: bean
        notes:
          - mark: '@Bean'
            as: anno
            text: '이 메서드의 반환 값을 빈으로 등록해요. 빈 이름은 메서드 이름 `clock`이에요.'
      - quiz:
          q: '`@SpringBootApplication`이 `com.shop`에 있어요. `com.shop.order.OrderService`(`@Service`)와 `com.common.MailSender`(`@Component`) 가운데 빈이 되는 것은?'
          options:
            - 둘 다
            - '`OrderService`만'
            - '`MailSender`만'
          answer: 2
          explain: '스캔은 `com.shop`과 그 아래만 봐요. `com.common`은 범위 밖이라 `@Component`가 있어도 빈이 되지 않아요.'
      - next: '컨테이너는 생성자로 객체를 넣어 줬어요. 필드에 `@Autowired`를 붙여도 넣어 주는데, 왜 생성자를 쓸까요?'
    recall: '스프링 컨테이너는 @SpringBootApplication의 패키지와 그 아래를 스캔해 @Component(그리고 @Service, @Repository, @Controller)가 붙은 클래스를 빈으로 만들고, 받을 빈을 먼저 만든 뒤 생성자에 넣어 다음 빈을 만들어요. 객체를 만들고 잇는 일을 컨테이너가 맡는 것이 제어의 역전, 밖에서 넣어 주는 것이 의존성 주입이에요. 라이브러리 클래스는 @Configuration의 @Bean 메서드로 빈을 만들어요.'
  - id: q2
    title: 왜 생성자로 주입받나요?
    conclusion:
      lead: '필드를 `final`로 둘 수 있고, 스프링 없이 `new`로 가짜 객체를 넣어 테스트할 수 있고, 빠진 것이 있으면 앱이 뜰 때 바로 알려 주기 때문이에요.'
      sub: '필드 주입은 컨테이너만 값을 넣을 수 있어서, `new`로 만든 객체에서는 그 필드가 null로 남아요.'
    says:
      - '주입 방법은 셋이다. 생성자(코드 service), 세터, 필드(코드 field). 생성자가 하나뿐이면 `@Autowired`를 붙이지 않아도 그 생성자로 주입한다'
      - '필드 주입의 문제: 컨테이너가 리플렉션으로 private 필드에 값을 넣는다. 테스트에서 `new FieldInjectedService()`로 만들면 `sender`가 null이다. 테스트로 보인다'
      - '생성자 주입은 스프링 없이도 `new CoffeeService(new CoffeeMenuRepository(), 가짜)`로 만들 수 있다. 가짜 `NoticeSender`를 람다로 넣고 결과를 확인하는 테스트를 보인다'
      - '`final`이라 한 번 넣은 뒤 바뀌지 않고, 받아야 할 빈이 없으면 앱이 뜨는 순간 `NoSuchBeanDefinitionException`으로 실패한다. 필드 주입도 시작할 때 실패하지만, 빈이 아닌 객체에서는 null로 남아 쓰는 순간에야 `NullPointerException`이 난다'
      - '더 알아보기: 순환 참조. `A`가 `B`를, `B`가 `A`를 생성자로 받으면 어느 쪽도 먼저 만들 수 없어 앱이 뜨지 않는다. 에러 메시지에 순환이 그려진다. 스프링 부트 2.6부터는 필드 주입이어도 기본으로 막는다. 순환은 설계를 고칠 신호다'
    asks:
      - '본문의 예시: 코드 field의 클래스를 테스트에서 `new FieldInjectedService()`로 만들고 `sender.send(...)`를 부르면 어떻게 되나 (`NullPointerException`. 컨테이너가 만든 객체가 아니라 주입되지 않았다)'
      - '옮긴 상황: `PaymentService`가 생성자로 `PgClient`를 받는데, `PgClient` 구현에 `@Component`를 붙이지 않았다. 앱은 언제 실패하나 (앱을 띄울 때 `NoSuchBeanDefinitionException`으로 실패한다)'
    body:
      - p: '컨테이너가 빈을 넣어 주는 방법은 세 가지예요. **생성자**의 매개변수로, **세터** 메서드로, **필드**에 직접. 질문 1의 서비스는 생성자로 받았어요.'
      - code: service
        notes:
          - mark: 'CoffeeService('
            as: code
            text: '생성자가 하나뿐이면 `@Autowired`를 붙이지 않아도 컨테이너가 이 생성자로 넣어 줘요.'
      - p: '필드 주입은 이렇게 생겼어요. 코드가 짧아 보여요.'
      - code: field
        notes:
          - mark: '@Autowired'
            as: anno
            text: '컨테이너가 객체를 만든 뒤 리플렉션으로 이 private 필드에 값을 넣어요.'
      - h3: 필드 주입은 컨테이너만 할 수 있어요
      - p: '같은 클래스를 컨테이너가 만든 것과, 테스트에서 `new`로 만든 것을 비교했어요.'
      - ci:
          key: field
          label: 실제 결과 보기
          source: SpringBeansLessonTest.newObjectIsNotInjected
      - p: '`new`로 만든 객체는 컨테이너가 몰라요. private 필드를 채울 방법이 없어서 `sender`는 null이고, `send`를 부르는 순간 `NullPointerException`이 나요. 단위 테스트를 쓰려면 스프링을 띄우거나 리플렉션으로 필드를 채워야 해요.'
      - h3: 생성자 주입은 스프링 없이도 쓸 수 있어요
      - code: fake
      - p: '생성자에 가짜 알림을 람다로 넣었어요. 스프링을 띄우지 않고 1밀리초 만에 서비스의 동작을 확인해요. 테스트로 돌린 결과도 주석과 같아요.'
      - p: '장점을 정리하면 셋이에요.'
      - ul:
          - '**`final`로 둘 수 있어요.** 한 번 받은 뒤 바뀌지 않아요.'
          - '**스프링 없이 테스트할 수 있어요.** 가짜를 생성자로 넣으면 돼요.'
          - '**빠진 것을 앱이 뜰 때 알려 줘요.** 받아야 할 빈이 없으면 컨테이너가 이 객체를 만들지 못하고 바로 실패해요.'
      - p: '셋째를 확인했어요. `NoticeSender` 구현 없이 `CoffeeService`를 띄웠어요.'
      - ci:
          key: missing
          label: 실제 에러 보기
          source: SpringBeansLessonTest.missingAndCircular
      - p: '앱이 뜨는 순간 "`NoticeSender` 빈이 하나도 없다"고 알려 줘요. 요청이 들어온 뒤에 터지는 것보다 훨씬 낫죠. 스프링 문서도 꼭 필요한 의존성은 생성자로 받으라고 권해요([근거](link:di)).'
      - more:
          summary: '더 알아보기: A와 B가 서로를 생성자로 받으면'
          body:
            - p: '`A`를 만들려면 `B`가 있어야 하고, `B`를 만들려면 `A`가 있어야 해요. 어느 쪽도 먼저 만들 수 없어서 앱이 뜨지 않아요(`BeanCurrentlyInCreationException`). 에러 메시지에 순환이 그림으로 나와요.'
            - p: '스프링 부트 2.6부터는 필드 주입이어도 순환을 기본으로 막아요([릴리스 노트](link:boot26)). 순환은 두 클래스가 한 일을 나눠 가진 신호라서, 설정으로 풀기보다 공통 부분을 새 클래스로 빼는 편이 나아요.'
      - quiz:
          q: '필드 주입을 쓴 `FieldInjectedService`를 테스트에서 `new FieldInjectedService()`로 만들고 `sender.send("kim", "hi")`를 부르면?'
          options:
            - 컨테이너가 알아서 넣어 줘서 잘 된다
            - '`NullPointerException`이 난다'
            - 컴파일 오류가 난다
          answer: 2
          explain: '`new`로 만든 객체는 컨테이너가 몰라서 `@Autowired` 필드가 채워지지 않아요. null인 `sender`를 부르니 예외가 나요.'
      - next: '생성자는 `NoticeSender` 타입을 받아요. 그런데 `NoticeSender`를 구현한 빈이 둘이면 어느 것이 들어갈까요?'
    recall: '주입은 생성자, 세터, 필드로 하고, 생성자가 하나면 @Autowired를 생략해요. 생성자로 받으면 필드를 final로 둘 수 있고, 스프링 없이 new로 가짜를 넣어 테스트할 수 있고, 받을 빈이 없으면 앱이 뜰 때 NoSuchBeanDefinitionException으로 바로 알려 줘요. 필드 주입은 컨테이너만 채울 수 있어서 new로 만든 객체에서는 null이에요.'
  - id: q3
    title: 같은 타입의 빈이 둘이면 무엇이 들어가나요?
    conclusion:
      lead: '스프링은 아무거나 고르지 않고 앱을 띄우지 않아요. 무엇을 넣을지 `@Primary`나 `@Qualifier`로 알려 줘야 해요.'
      sub: '주입은 타입으로 찾고, 후보가 여럿이면 `@Qualifier`, `@Primary`, 매개변수 이름 순서로 하나를 골라요. 모두 받고 싶으면 `List`로 받아요.'
    says:
      - '코드 predict를 띄운다. `NoUniqueBeanDefinitionException`이 나고 메시지에 두 빈의 이름이 나온다. 예측의 답을 밝힌다. 실제 메시지를 보인다'
      - '빈의 이름은 따로 주지 않으면 클래스 이름의 첫 글자를 소문자로 바꾼 것이다(`smsNoticeSender`)'
      - '고치는 법 하나: 기본으로 쓸 구현에 `@Primary`(코드 primary). 다른 곳에서 특별히 고르지 않으면 이것이 들어간다'
      - '고치는 법 둘: 받는 쪽에서 `@Qualifier("mailNoticeSender")`로 이름을 적는다(코드 qualifier). `@Primary`보다 먼저 본다'
      - '고치는 법 셋: 매개변수 이름을 빈 이름과 같게 `NoticeSender mailNoticeSender`로 쓴다. 이름이 바뀌면 조용히 깨지니 앞의 둘을 권한다'
      - '둘 다 쓰고 싶으면 `List<NoticeSender>`로 받는다. 구현 둘이 모두 들어온다. 알림을 문자와 메일로 모두 보내는 예'
    widget:
      kind: toggle
      note: '받는 쪽 코드를 고르는 버튼 넷: 아무것도 없음, `@Primary`를 문자 쪽에, `@Qualifier("mailNoticeSender")`, `List<NoticeSender>`로 받기. 고를 때마다 앱이 뜨는지와 `CoffeeService`에 들어간 것(에러 메시지, SmsNoticeSender, MailNoticeSender, 둘 다)을 보인다'
    asks:
      - '본문의 예시: `SmsNoticeSender`에 `@Primary`가 있고, `CoffeeService`가 `@Qualifier("mailNoticeSender") NoticeSender sender`로 받는다. 무엇이 들어가나 (`MailNoticeSender`. `@Qualifier`가 먼저다)'
      - '옮긴 상황: 결제 대행사 클라이언트 `PgClient`의 구현이 `TossPgClient`와 `KakaoPgClient` 둘이고 아무 표시도 없다. 정산 서비스가 `List<PgClient>`로 받으면 앱이 뜨나, 무엇이 들어가나 (뜬다. 둘 다 들어간다)'
    body:
      - p: '컨테이너는 생성자의 매개변수를 **타입으로** 찾아요. `NoticeSender` 타입의 빈이 하나면 그것을 넣어요. 예측의 코드처럼 둘이면 어떻게 될까요?'
      - ci:
          key: no-unique
          label: 실제 에러 보기
          source: SpringBeansLessonTest.twoCandidatesFail
          code: predict
      - p: '**앱이 뜨지 않아요.** {{predict-result}} "하나를 기대했는데 둘을 찾았다"며 두 빈의 이름을 알려 줘요. 빈 이름은 따로 주지 않으면 클래스 이름의 첫 글자를 소문자로 바꾼 것(`smsNoticeSender`)이에요. 스프링은 먼저 만든 것이나 아무거나 고르지 않아요. 잘못 고르면 문자 대신 메일이 나가는 조용한 버그가 되니까요.'
      - h3: 어느 것을 넣을지 알려 주는 방법
      - p: '방법을 하나씩 골라 보세요.'
      - widget:
          kind: toggle
          layout: [selector, duo, verdict]
          selector:
            label: 받는 쪽과 구현 쪽의 표시
            options:
              - {value: none, label: 아무 표시 없음}
              - {value: primary, label: '문자 쪽에 @Primary'}
              - {value: qualifier, label: '@Qualifier("mailNoticeSender")'}
              - {value: list, label: 'List<NoticeSender>로 받기'}
          scenes:
            none:
              duo:
                - {label: 앱, rows: [{k: 시작, v: 실패, mark: bad}]}
                - {label: 들어간 것, text: 'NoUniqueBeanDefinitionException'}
              verdict: '후보가 둘인데 고를 근거가 없어서 앱이 뜨지 않아요.'
            primary:
              duo:
                - {label: 앱, rows: [{k: 시작, v: 성공, mark: changed}]}
                - {label: 들어간 것, rows: [{k: sender, v: SmsNoticeSender, mark: changed}]}
              verdict: '`@Primary`가 붙은 빈이 기본으로 들어가요. 다른 곳에서 따로 고르지 않는 한 이것이에요.'
            qualifier:
              duo:
                - {label: 앱, rows: [{k: 시작, v: 성공, mark: changed}]}
                - {label: 들어간 것, rows: [{k: sender, v: MailNoticeSender, mark: changed}]}
              verdict: '받는 쪽이 이름으로 골랐어요. 문자 쪽에 `@Primary`가 있어도 `@Qualifier`가 먼저예요.'
            list:
              duo:
                - {label: 앱, rows: [{k: 시작, v: 성공, mark: changed}]}
                - {label: 들어간 것, rows: [{k: all, v: 'SmsNoticeSender, MailNoticeSender', mark: changed}]}
              verdict: '하나를 고르지 않고 후보를 모두 받아요. 알림을 문자와 메일로 모두 보낼 때 써요.'
      - p: '네 경우를 실제로 띄운 결과예요.'
      - ci:
          key: choose
          label: 실제 결과 보기
          source: SpringBeansLessonTest.choosingRules
      - code: primary
        notes:
          - mark: '@Primary'
            as: anno
            text: '"따로 고르지 않으면 나를 넣어 줘"라는 표시예요. 구현 쪽에 붙여요.'
      - code: qualifier
        notes:
          - mark: '@Qualifier("mailNoticeSender")'
            as: anno
            text: '받는 쪽이 빈 이름으로 골라요. `@Primary`보다 먼저 봐요.'
      - code: list
        notes:
          - mark: 'List<NoticeSender> all'
            as: code
            text: '그 타입의 빈을 모두 담아 줘요. 하나도 없으면 앱이 뜨지 않아요.'
      - p: '표시가 없을 때 하나 더 보는 것이 있어요. **매개변수 이름**이 빈 이름과 같으면(`NoticeSender mailNoticeSender`) 그 빈을 넣어요. 테스트에서도 그렇게 들어갔어요. 하지만 이름을 바꾸는 순간 조용히 깨지니 `@Primary`나 `@Qualifier`로 드러내는 편이 나아요([근거](link:qualifiers)).'
      - quiz:
          q: '`SmsNoticeSender`에 `@Primary`가 있고, 서비스가 `@Qualifier("mailNoticeSender") NoticeSender sender`로 받아요. 무엇이 들어갈까요?'
          options:
            - '`SmsNoticeSender`'
            - '`MailNoticeSender`'
            - 앱이 뜨지 않는다
          answer: 2
          explain: '받는 쪽이 `@Qualifier`로 이름을 정하면 그것이 먼저예요. `@Primary`는 따로 고르지 않을 때의 기본값이에요.'
      - next: '서비스는 컨트롤러에도 들어가고 다른 서비스에도 들어가요. 그 둘은 같은 객체일까요?'
    recall: '주입은 타입으로 찾고, 같은 타입의 빈이 둘이면 아무거나 고르지 않고 NoUniqueBeanDefinitionException으로 앱이 뜨지 않아요. 구현 쪽에 @Primary를 붙이면 기본으로 그것이, 받는 쪽에 @Qualifier("빈 이름")를 적으면 그것이 먼저 들어가요. 매개변수 이름이 빈 이름과 같아도 고르지만 깨지기 쉬워요. 모두 받으려면 List로 받아요.'
  - id: q4
    title: 빈은 몇 개 만들어지나요?
    conclusion:
      lead: '따로 정하지 않으면 빈은 하나만 만들어지고, 그것을 받는 모든 곳에 같은 객체가 들어가요.'
      sub: '이것을 싱글톤 스코프라고 해요. 컨테이너에서 몇 번 꺼내도, 어느 클래스가 받아도 같은 객체예요.'
    says:
      - '`context.getBean(CoffeeService.class)`를 두 번 부르면 같은 객체다. 컨트롤러가 받은 서비스와 다른 곳이 받은 서비스도 같은 객체다. 테스트로 보인다'
      - '컨테이너가 만든 빈 목록과 스코프를 출력해 실제 출력으로 보인다. 모두 `singleton`이다'
      - '하나만 만드는 이유: 요청마다 서비스와 리포지토리를 새로 만들 필요가 없다. 이 객체들은 요청마다 달라지는 값을 가지지 않기 때문이다. 바뀌는 값을 두면 생기는 문제는 S3에서 본다'
      - '더 알아보기: `@Configuration` 클래스는 스프링이 하위 클래스(CGLIB 프록시)로 감싼다. 그래서 한 `@Bean` 메서드에서 다른 `@Bean` 메서드를 불러도 새 객체가 아니라 이미 만든 빈을 돌려준다. `@Configuration(proxyBeanMethods = false)`이면 감싸지 않아 부를 때마다 새 객체다. 둘을 비교한 테스트를 보인다. 프록시는 S9에서 다룬다'
    asks:
      - '본문의 예시: `CoffeeController`와 `OrderReportService`가 둘 다 `CoffeeService`를 생성자로 받는다. 두 곳에 들어간 객체는 같은가 (같다. 싱글톤이다)'
      - '옮긴 상황: `@Configuration` 클래스에서 `@Bean Clock clock()`을 두고, 다른 `@Bean` 메서드 둘이 `clock()`을 불러 쓴다. `Clock` 객체는 몇 개인가 (하나. `@Configuration`이 감싸서 이미 만든 빈을 돌려준다)'
    body:
      - p: '컨테이너에서 `CoffeeService`를 두 번 꺼내면 **같은 객체**예요. 컨트롤러에 들어간 서비스와, 다른 서비스에 들어간 서비스도 같은 객체예요. 컨테이너가 만든 빈 목록과 스코프를 출력했어요.'
      - ci:
          key: scopes
          label: 실제 출력 보기
          source: SpringBeansLessonTest.singletonAndConfiguration
      - p: '모두 `singleton`이에요. 빈은 따로 정하지 않으면 컨테이너에 **하나만** 만들어져요. 이것을 **싱글톤 스코프**라고 해요.'
      - p: '하나면 충분한 이유가 있어요. 서비스와 리포지토리는 요청마다 달라지는 값을 갖지 않아요. 받은 빈들을 `final` 필드에 들고 메서드를 부를 뿐이에요. 요청마다 새로 만들면 만드는 시간과 메모리만 들어요.'
      - p: '대신 하나뿐이라서, 여러 요청이 같은 객체를 **동시에** 써요. 빈의 필드에 요청마다 바뀌는 값을 두면 섞여요. [서블릿과 톰캣](lesson:servlet-tomcat)의 서블릿과 같은 문제예요. 실제로 섞이는 것과 다른 스코프는 [빈의 생명주기와 스코프](lesson:bean-lifecycle-scope) 레슨에서 봐요.'
      - more:
          summary: '더 알아보기: @Bean 메서드를 두 번 부르면'
          body:
            - code: configCall
              notes:
                - mark: 'clock()'
                  as: code
                  text: '평범한 자바라면 부를 때마다 새 `Clock`이에요.'
            - p: '`daily`와 `weekly`가 각각 `clock()`을 불렀는데, 둘이 받은 `Clock`은 같은 객체예요. 스프링이 `@Configuration` 클래스를 하위 클래스(CGLIB 프록시)로 감싸서, `clock()` 호출을 가로채 이미 만든 빈을 돌려주기 때문이에요. 프록시는 [AOP](lesson:aop-audit) 레슨에서 다뤄요.'
            - ci:
                key: config
                label: 실제 결과 보기
                source: SpringBeansLessonTest.singletonAndConfiguration
            - p: '`@Configuration(proxyBeanMethods = false)`로 감싸지 않게 하면 부를 때마다 새 객체예요. 스프링 부트의 자동 설정 클래스들은 시작을 빠르게 하려고 이렇게 쓰고, `@Bean` 메서드끼리 부르지 않고 매개변수로 받아요.'
      - quiz:
          q: '`CoffeeController`와 `OrderReportService`가 둘 다 생성자로 `CoffeeService`를 받아요. 두 곳에 들어간 객체는?'
          options:
            - 같은 객체다
            - 받을 때마다 새로 만든 다른 객체다
            - 먼저 받은 쪽만 진짜이고 다른 쪽은 null이다
          answer: 1
          explain: '빈은 기본으로 싱글톤이라 컨테이너에 하나뿐이에요. 받는 곳마다 같은 객체가 들어가요.'
    recall: '빈은 따로 정하지 않으면 싱글톤이라 컨테이너에 하나만 만들어지고, 받는 모든 곳에 같은 객체가 들어가요. 서비스와 리포지토리는 요청마다 바뀌는 값을 갖지 않아서 하나면 돼요. 대신 여러 요청이 같은 객체를 동시에 쓰니 필드에 바뀌는 값을 두면 안 돼요. @Configuration은 CGLIB로 감싸져 @Bean 메서드를 여러 번 불러도 같은 빈을 돌려줘요.'
practice:
  title: 스프링 프로젝트에서는 이렇게 써요
  says:
    - '프로젝트에 그대로 들어갈 모양: 생성자가 하나인 `@Service`(코드 service), 라이브러리 객체는 `@Bean`(코드 bean). `Clock`을 빈으로 두면 테스트에서 고정된 시각을 넣을 수 있다는 것까지 테스트로 보인다'
    - '흔한 실수 하나: 필드 주입을 쓰고 단위 테스트에서 `new`로 만들어 `NullPointerException`을 만난다. 고친 코드: 생성자 주입으로 바꾸고 테스트에서 가짜를 넣는다(질문 2를 가리킨다)'
    - '흔한 실수 둘: 새 패키지 `com.common`에 공통 클래스를 만들었는데 주입이 안 된다. `@SpringBootApplication`보다 위나 옆 패키지라 스캔 밖이다. 고치는 법: 클래스를 메인 클래스의 패키지 아래로 옮긴다. `@ComponentScan`으로 범위를 넓힐 수도 있지만 자동 설정의 스캔 규칙과 겹쳐 권하지 않는다(스프링 부트 문서 근거)'
    - '롬복을 쓰는 팀은 `@RequiredArgsConstructor`로 `final` 필드의 생성자를 만든다고 한 줄 적는다(이 저장소는 롬복을 쓰지 않아 확인하지 않는다)'
  body:
    - h3: 서비스는 생성자 하나, 라이브러리 객체는 @Bean
    - p: '질문의 코드가 그대로 프로젝트의 모양이에요. 서비스는 `final` 필드와 생성자 하나로 받고, `@Autowired`는 붙이지 않아요. 롬복을 쓰는 팀은 `@RequiredArgsConstructor`로 그 생성자를 만들기도 해요(이 저장소는 롬복을 쓰지 않아서 확인하지 않았어요).'
    - p: '`Clock`처럼 라이브러리 객체를 빈으로 두면 좋은 점이 하나 더 있어요. 시간을 쓰는 서비스가 `LocalDate.now()` 대신 받은 `Clock`을 쓰면, 테스트에서 고정된 시각을 넣을 수 있어요.'
    - code: clockUse
    - p: '테스트에서는 `Clock.fixed(...)`로 만든 시계를 생성자에 넣어요. "쿠폰이 오늘 만료되는가"를 날짜에 상관없이 늘 같은 결과로 확인할 수 있어요. 이것도 테스트로 확인했어요.'
    - h3: '흔한 실수 1: 필드 주입과 new'
    - p: '필드 주입을 쓴 서비스를 단위 테스트에서 `new`로 만들고 `NullPointerException`을 만나요. 질문 2에서 본 그대로예요. 생성자 주입으로 바꾸고 테스트에서 가짜를 넣어요.'
    - h3: '흔한 실수 2: 스캔 범위 밖의 패키지'
    - p: '메인 클래스가 `com.shop.ShopApplication`인데 공통 클래스를 `com.common`에 만들었어요. 주입하려는 곳에서 `NoSuchBeanDefinitionException`이 나요. `com.common`은 `com.shop`의 아래가 아니라 스캔 밖이에요(질문 1).'
    - p: '클래스를 `com.shop` 아래로 옮기는 것이 가장 간단해요. 스프링 부트 문서는 메인 클래스를 다른 클래스들보다 위의 패키지(루트 패키지)에 두라고 권해요. `@ComponentScan`으로 범위를 따로 넓힐 수도 있지만, 그러면 `@SpringBootApplication`이 정한 스캔 설정을 덮어써서 생각지 못한 클래스가 빠지거나 들어오기도 해요([근거](link:structuring)).'
interview:
  question: 스프링의 의존성 주입은 어떻게 동작하나요?
  model:
    - label: 정의
      text: 스프링 컨테이너가 객체(빈)를 대신 만들고, 각 객체가 필요로 하는 다른 빈을 넣어 줍니다. 객체를 만들고 잇는 일을 컨테이너가 맡는 것이 제어의 역전이고, 밖에서 넣어 주는 것이 의존성 주입입니다.
    - label: 원리
      text: '@SpringBootApplication의 패키지 아래를 스캔해 @Component가 붙은 클래스를 빈으로 등록하고, 받을 빈을 먼저 만들어 생성자에 넣습니다. 주입은 타입으로 찾고, 후보가 여럿이면 @Qualifier, @Primary 순서로 고르며 고를 수 없으면 앱이 뜨지 않습니다. 빈은 기본으로 싱글톤입니다.'
    - label: 주의할 점
      text: 생성자 주입을 씁니다. final로 둘 수 있고 스프링 없이 가짜를 넣어 테스트할 수 있으며 빠진 의존성을 시작할 때 알려 줍니다. 필드 주입은 new로 만들면 null이고, 스캔 범위 밖의 클래스는 빈이 되지 않습니다.
    - label: 경험
      text: '(내 프로젝트로 채우기) 예: 알림 구현을 하나 더 만들었다가 앱이 뜨지 않아, 기본 구현에 @Primary를 붙이고 특별한 곳에서만 @Qualifier로 골랐습니다.'
verified: 이 레슨의 순서와 에러 메시지는 짐작이 아니라 스프링 프레임워크 6.2의 컨테이너를 띄워 받은 값이에요. 코드가 바뀔 때마다 테스트([SpringBeansLessonTest](link:test))가 다시 돌아요.
footer: '근거: 컨테이너와 빈은 스프링 프레임워크 문서([링크](link:ioc)), 생성자 주입을 권하는 이유는 의존성 주입 장([링크](link:di)), `@Primary`와 `@Qualifier`는 [링크](link:qualifiers), 스캔 범위는 스프링 부트 문서([링크](link:structuring)). 결과는 OpenJDK 21에서 테스트로 확인했어요. 오류는 [GitHub 이슈](https://github.com/wanja727/dev-lessons/issues)로 알려 주세요.'
claims:
  - claim: '컨테이너는 `CoffeeMenuRepository`와 `SmsNoticeSender`를 `CoffeeService`보다 먼저, `CoffeeService`를 `CoffeeController`보다 먼저 만든다'
    how: '생성자에서 남긴 기록의 순서를 본다'
    test: SpringBeansLessonTest.creationOrder
  - claim: '`new`로 만든 필드 주입 객체의 필드는 null이다'
    how: '컨테이너가 만든 것과 비교한다'
    test: SpringBeansLessonTest.newObjectIsNotInjected
  - claim: '생성자 주입은 스프링 없이 가짜를 넣어 쓸 수 있다'
    how: '`new`로 만들어 결과를 본다'
    test: SpringBeansLessonTest.constructorInjectionWithoutSpring
  - claim: '같은 타입의 `@Component`가 둘이고 하나를 받으면 `NoUniqueBeanDefinitionException`으로 컨텍스트가 뜨지 않는다'
    how: '`AnnotationConfigApplicationContext`로 작은 컨텍스트를 띄워 예외와 메시지를 본다. 중첩 클래스는 빈 이름에 바깥 클래스 이름이 붙어서 `@Component("smsNoticeSender")`처럼 최상위 클래스일 때의 이름을 적었다'
    test: SpringBeansLessonTest.twoCandidatesFail
  - claim: '`@Primary`, `@Qualifier`, 매개변수 이름, `List`로 받을 때 들어가는 빈이 각각 다르다. `@Qualifier`가 `@Primary`보다 먼저다'
    how: '같은 작은 컨텍스트에서 경우마다 들어간 객체의 클래스를 본다'
    test: SpringBeansLessonTest.choosingRules
  - claim: '받아야 할 빈이 없으면 `NoSuchBeanDefinitionException`(원인)으로 뜨지 않고, 생성자 순환이면 순환 예외로 뜨지 않는다'
    how: '작은 컨텍스트에서 원인 예외를 본다'
    test: SpringBeansLessonTest.missingAndCircular
  - claim: '스캔 범위 밖 패키지의 `@Component`는 빈이 되지 않는다'
    how: '`AnnotationConfigApplicationContext`에 패키지 하나만 스캔시키고 다른 패키지의 클래스를 찾는다'
    test: SpringBeansLessonTest.scanRange
  - claim: '싱글톤 빈은 몇 번 꺼내도 같은 객체다. `@Configuration`은 `@Bean` 메서드를 여러 번 불러도 같은 객체를, `proxyBeanMethods = false`면 다른 객체를 준다'
    how: '작은 컨텍스트에서 비교한다'
    test: SpringBeansLessonTest.singletonAndConfiguration
sources:
  - 'IoC 컨테이너와 빈, 의존성 주입: 스프링 프레임워크 문서 https://docs.spring.io/spring-framework/reference/core/beans/introduction.html'
  - '생성자 주입을 권하는 이유: https://docs.spring.io/spring-framework/reference/core/beans/dependencies/factory-collaborators.html'
  - '`@Primary`와 `@Qualifier`: https://docs.spring.io/spring-framework/reference/core/beans/annotation-config/autowired-qualifiers.html'
  - '`@SpringBootApplication`의 스캔 범위와 코드 위치: 스프링 부트 문서 https://docs.spring.io/spring-boot/reference/using/structuring-your-code.html'
  - '순환 참조를 기본으로 막는 것: 스프링 부트 2.6 릴리스 노트 https://github.com/spring-projects/spring-boot/wiki/Spring-Boot-2.6-Release-Notes'
