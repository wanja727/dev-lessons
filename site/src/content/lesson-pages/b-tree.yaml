# B-트리 (설계서)
# 자료 파일의 칸은 docs/lesson-data-format.md에 있다.
stage: design
title: B-트리
unit: 자료구조와 알고리즘
roadmap: K13
type: 자바 실행
prerequisites:
  - {slug: binary-search-tree, title: 이진 탐색 트리}
assume: '자바 21(OpenJDK), PostgreSQL 16. 이진 탐색 트리는 정렬된 채로 넣고 찾으며, 균형이 깨지면 깊어진다는 것(이진 탐색 트리 레슨). O(log n)이 뜻하는 것(시간 복잡도 레슨). SQL의 `create index`를 써 본 것.'
example: '주문 번호 100만 개를 담는 색인. 같은 키를 이진 탐색 트리와, 노드 하나에 키를 수백 개 담는 B-트리(자바로 만든 작은 구현)에 넣고 찾으며 거치는 노드 수를 세요. 그다음 PostgreSQL의 실제 인덱스를 열어 높이와 페이지 수를 봐요. 실무 구역에서는 긴 문자열 열에 만든 인덱스로 옮겨요.'
intro:
  - '주문 테이블이 1억 행이 되어도 `where id = ?` 조회는 여전히 1밀리초 안팎이에요. 이진 탐색 트리였다면 키 하나를 찾는 데 노드를 27개 거쳐야 하고, 그 노드들이 디스크에 흩어져 있으면 디스크를 27번 읽어요. DB는 같은 일을 디스크 서너 번 읽기로 끝내요.'
  - '자바와 스프링 개발자는 인덱스를 매일 만들지만 그 안을 볼 일은 드물어요. 그래도 인덱스가 왜 몇 번만 읽고 끝나는지, 키가 길면 왜 인덱스가 커지는지, 범위 조회가 왜 빠른지는 B-트리의 모양에서 나와요. 면접에서 "DB 인덱스는 왜 이진 탐색 트리가 아니라 B-트리를 쓰나요"를 묻는 것도 이 모양을 아는지 보려는 거예요.'
  - '이 레슨에서는 같은 키를 이진 탐색 트리와 B-트리에 넣어 찾을 때 거치는 노드 수를 세고, PostgreSQL 인덱스의 높이와 한 번 찾을 때 읽는 페이지 수를 실제로 확인해요.'
covers:
  - topic: '디스크와 메모리의 차이: DB는 데이터를 페이지(PostgreSQL은 8KB) 단위로 읽는다. 노드 하나를 읽는 일이 페이지 하나를 읽는 일이다'
    where: '질문 1'
  - topic: '이진 탐색 트리는 노드 하나에 키 하나라서 높이가 log₂ n이다. 100만 개면 20겹, 1억 개면 27겹. 겹마다 페이지 하나를 읽는다'
    where: '질문 1'
  - topic: 'B-트리는 노드 하나(페이지 하나)에 키를 수백 개 담고 자식을 수백 개 가진다. 높이가 log_m n이라 1억 개도 서너 겹이다'
    where: '질문 2'
  - topic: '노드 안에서는 정렬된 키를 이진 탐색으로 찾는다. 메모리 안의 일이라 빠르다'
    where: '질문 2'
  - topic: '위쪽 겹은 자주 읽혀서 메모리(버퍼)에 남아 있다. 실제로 디스크에서 읽는 것은 아래쪽 한두 페이지다'
    where: '질문 2'
  - topic: 'B-트리는 모든 잎이 같은 깊이에 있다. 넣을 때 노드가 가득 차면 가운데에서 둘로 나누고 가운데 키를 부모로 올린다. 뿌리가 나뉘면 트리가 위로 한 겹 자란다'
    where: '질문 3'
  - topic: '정렬된 순서로 넣어도 한쪽으로 길어지지 않는다. 이진 탐색 트리와 다른 점이다'
    where: '질문 3'
  - topic: '지울 때 노드가 너무 비면 이웃과 합치거나 빌려 온다'
    where: '질문 3의 더 알아보기'
  - topic: 'B+트리: 값(행의 위치)은 잎에만 두고 안쪽 노드에는 길잡이 키만 둔다. 잎끼리 옆으로 이어져 있다. DB 인덱스는 대개 이 모양이다'
    where: '질문 4'
  - topic: '범위 조회는 시작 키의 잎을 찾은 뒤 옆 잎으로 이어 읽는다. 위로 다시 올라가지 않는다'
    where: '질문 4'
  - topic: 'PostgreSQL의 기본 인덱스는 B+트리 모양의 btree다. 높이는 pageinspect의 bt_metap으로, 읽은 페이지 수는 EXPLAIN (ANALYZE, BUFFERS)로 본다'
    where: '질문 2, 질문 4, 실무에서는'
  - topic: '키가 길면 한 페이지에 담기는 키가 줄어 인덱스가 커지고 깊어진다'
    where: '실무에서는'
  - topic: '인덱스를 쓰는 조건, 실행계획, 복합 인덱스, 인덱스가 쓰기에 주는 비용'
    where: '다루지 않음: 인덱스와 실행계획(D7)'
  - topic: '무작위 UUID 기본 키가 인덱스 페이지를 쪼개는 문제'
    where: '다루지 않음: 유일한 ID 만들기(A17)'
  - topic: '메모리 안의 균형 트리(레드 블랙 트리)와 TreeMap'
    where: '다루지 않음: 이진 탐색 트리(K8)'
codes:
  predict: |-
    -- 주문 100만 건, id에 기본 키 인덱스
    explain (analyze, buffers)
    select * from bt_orders
    where id = 765432;
    -- 인덱스에서 읽은 페이지는 몇 개?
  node: |-
    class Node {
      long[] keys;      // 정렬된 키 수백 개
      Node[] children;  // 자식은 키 수 + 1
      Node next;        // 잎일 때 오른쪽 잎
    }
  find: |-
    Node n = root;
    while (!n.isLeaf()) {
      int i = upperBound(n.keys, key);
      n = n.children[i];
    }
    return contains(n.keys, key);
  bstFind: |-
    Node n = root;
    while (n != null && n.key != key) {
      n = key < n.key ? n.left : n.right;
    }
  meta: |-
    create extension pageinspect;
    select level, root
    from bt_metap('bt_orders_pkey');
  range: |-
    select * from bt_orders
    where id between 500000 and 500099;
  longKey: |-
    create index on bt_events (url);
    -- url은 200자 남짓
predict:
  text: '코드 predict는 주문 100만 건에서 기본 키로 한 건을 찾아요. 이진 탐색 트리였다면 20겹을 내려가요. PostgreSQL 인덱스에서 읽은 페이지는 몇 개일까요? 보기: 1개, 3개쯤, 20개쯤, 100개 넘게.'
  answer: '3개쯤. 한 페이지에 키가 수백 개라 100만 개도 세 겹이다. 질문 2에서 밝힌다. 정확한 수는 테스트로 본다'
questions:
  - id: q1
    title: 이진 탐색 트리를 디스크에 두면 왜 느린가요?
    conclusion:
      lead: '노드 하나에 키가 하나라서 트리가 깊고, 겹마다 디스크의 페이지를 하나씩 읽어야 하기 때문이에요.'
      sub: '키 100만 개면 20겹, 1억 개면 27겹이에요. 디스크 읽기는 메모리 읽기보다 천 배 넘게 느려서, 비교 횟수가 아니라 읽는 페이지 수가 시간을 정해요.'
    says:
      - 'DB는 데이터를 디스크에 두고 페이지라는 덩어리로 읽는다. PostgreSQL의 페이지는 8KB다(`block_size`). 키 하나만 필요해도 그 키가 든 페이지 하나를 통째로 읽는다'
      - '메모리 읽기는 수십 나노초, SSD 읽기는 수십에서 수백 마이크로초, 하드디스크는 수 밀리초다. 디스크를 한 번 읽는 동안 메모리에서는 비교를 수천 번 할 수 있다. 숫자는 장비마다 달라 자릿수만 말한다'
      - '이진 탐색 트리(K8)는 노드 하나에 키 하나다. 키 100만 개를 균형 있게 담아도 높이가 log₂ 100만 = 20이다. 노드가 디스크에 흩어져 있으면 한 번 찾을 때 페이지를 20번 읽는다. 자바로 만든 균형 이진 탐색 트리에서 거친 노드 수를 세어 보인다'
      - '그러면 노드 하나에 키를 많이 담아 겹 수를 줄이면 된다. 한 페이지(8KB)에는 8바이트 키와 자식 위치를 수백 개 담을 수 있다. 이것이 B-트리의 생각이다'
    asks:
      - '본문의 예시: 키 100만 개를 균형 이진 탐색 트리에 담았다. 키 하나를 찾을 때 거치는 노드는 많아야 몇 개쯤인가 (20개쯤. log₂ 100만)'
      - '옮긴 상황: 노드를 하나 읽을 때마다 디스크를 한 번 읽는 저장소에서, 같은 키 1천만 개를 높이 24의 트리와 높이 3의 트리로 담았다. 찾는 시간을 주로 정하는 것은 무엇이고 어느 쪽이 빠른가 (읽는 노드 수. 높이 3)'
  - id: q2
    title: B-트리는 어떻게 디스크를 덜 읽나요?
    conclusion:
      lead: '노드 하나에 정렬된 키를 수백 개 담아서, 한 번 읽을 때 갈 길을 수백 갈래로 나누기 때문이에요.'
      sub: '그래서 높이가 log₂ n이 아니라 log_m n이에요. 키가 1억 개여도 서너 겹이고, 위쪽 겹은 메모리에 남아 있어 실제로 디스크에서 읽는 것은 한두 페이지예요.'
    says:
      - '코드 node. B-트리의 노드는 정렬된 키 배열과, 키 수보다 하나 많은 자식을 가진다. 키 k1, k2 사이의 자식에는 그 사이 값만 있다. 이진 탐색 트리의 왼쪽과 오른쪽을 수백 갈래로 넓힌 것이다'
      - '코드 find. 뿌리에서 시작해 노드 안의 키를 이진 탐색으로 보고 들어갈 자식을 고른다. 노드 안의 탐색은 이미 읽은 페이지 안의 일이라 메모리 속도다. 디스크 읽기는 겹마다 한 번이다'
      - '높이. 노드마다 자식이 m개면 높이 h의 트리는 m^h개의 키를 담는다. m이 300이면 두 겹이 9만, 세 겹이 2700만, 네 겹이 81억이다. 자바로 만든 B-트리(노드당 키 최대 255개)에 키 100만 개를 넣고 높이와 찾을 때 거친 노드 수를 이진 탐색 트리와 나란히 보인다'
      - '실제 DB. PostgreSQL에 주문 100만 건을 넣고 pageinspect의 `bt_metap`으로 기본 키 인덱스의 높이(level)를 본다. 예측의 답을 밝힌다: `EXPLAIN (ANALYZE, BUFFERS)`의 인덱스 노드에서 읽은 페이지 수가 겹 수만큼이다. 실제 출력을 보인다'
      - '위쪽 겹은 모든 조회가 지나가서 DB의 버퍼(메모리)에 남아 있다. `shared hit`은 메모리에서, `read`는 디스크에서 읽은 페이지다. 그래서 큰 테이블에서도 디스크를 읽는 것은 아래쪽 한두 페이지인 경우가 많다'
    widget:
      kind: toggle
      note: '키의 수를 1천, 100만, 1억 가운데 고르면 두 칸에 이진 탐색 트리의 높이(log₂ n: 10, 20, 27)와 노드당 자식 300개인 B-트리의 높이(2, 3, 4)를 보이고, 한 번 찾을 때 읽는 페이지 수를 막대로 보인다. 한 줄 정리에 "디스크를 몇 번 덜 읽는가"를 적는다. 숫자는 계산값이고 100만은 테스트의 실측과 맞춘다'
    asks:
      - '본문의 예시: 노드마다 자식이 300개인 B-트리에 키 2700만 개를 담으면 높이는 얼마쯤인가 (3겹. 300³ = 2700만)'
      - '옮긴 상황: `EXPLAIN (ANALYZE, BUFFERS)`의 인덱스 조회에 `Buffers: shared hit=3 read=1`이 나왔다. 디스크에서 읽은 페이지는 몇 개이고 나머지는 어디서 읽었나 (1개. 3개는 메모리의 버퍼에서)'
  - id: q3
    title: 키를 넣을 때 B-트리는 어떻게 균형을 지키나요?
    conclusion:
      lead: '노드가 가득 차면 가운데에서 둘로 나누고 가운데 키를 부모로 올려요. 뿌리가 나뉠 때만 트리가 위로 한 겹 자라요.'
      sub: '그래서 모든 잎이 늘 같은 깊이에 있어요. 정렬된 순서로 넣어도 이진 탐색 트리처럼 한쪽으로 길어지지 않아요.'
    says:
      - '넣기는 찾기와 같은 길로 잎까지 내려가 그 잎의 정렬된 자리에 키를 끼운다'
      - '잎이 가득 차면 나눈다. 키를 반씩 두 노드로 나누고, 가운데 키(B+트리에서는 오른쪽 노드의 첫 키)를 부모에 끼운다. 부모도 가득 차면 같은 일을 위로 되풀이한다'
      - '뿌리가 나뉘면 새 뿌리가 생겨 높이가 하나 는다. 트리는 아래로가 아니라 위로 자란다. 그래서 모든 잎은 언제나 같은 깊이다'
      - '노드당 키 3개인 작은 B-트리에 1부터 10까지 차례로 넣으며 나뉘는 순간을 한 단계씩 본다. 위젯으로 보인다'
      - '이진 탐색 트리에 1부터 차례로 넣으면 한 줄로 길어져 높이가 n이 된다(K8). 같은 순서로 B-트리에 100만 개를 넣어도 높이가 3인 것을 테스트로 보인다'
      - '더 알아보기: 지워서 노드가 반보다 비면 이웃 노드에서 키를 빌려 오거나 이웃과 합친다. 합쳐서 뿌리의 자식이 하나가 되면 높이가 준다. PostgreSQL은 비어 버린 페이지를 나중에 VACUUM이 정리한다'
    widget:
      kind: steps
      note: '노드당 키 최대 3개인 B+트리에 1부터 7까지 넣는다. 단계마다 트리를 겹별 줄로 그린다(뿌리 줄, 잎 줄). 넷째 키에서 잎이 [1 2]와 [3 4]로 나뉘고 3이 부모로 올라가 새 뿌리가 생기는 단계, 여섯째 키에서 다시 잎이 나뉘어 뿌리에 키가 하나 더 느는 단계를 강조한다. 아래 줄에 높이와 나뉜 횟수를 센다'
    asks:
      - '본문의 예시: 노드당 키 최대 3개인 B+트리에 1, 2, 3을 넣은 뒤 4를 넣으면 무슨 일이 일어나나 (잎이 둘로 나뉘고 키 하나가 새 뿌리로 올라가 높이가 2가 된다)'
      - '옮긴 상황: 자동 증가 번호처럼 늘 커지는 키를 B-트리와 균형을 맞추지 않는 이진 탐색 트리에 각각 100만 개 넣었다. 두 트리의 높이는 각각 어떻게 되나 (B-트리는 서너 겹, 이진 탐색 트리는 100만 겹)'
  - id: q4
    title: B+트리는 무엇이 다르고, 범위 조회에 왜 좋은가요?
    conclusion:
      lead: '값은 잎에만 두고 잎끼리 옆으로 이어 둬서, 범위 조회는 시작 잎을 한 번 찾은 뒤 옆 잎을 따라 읽기만 하면 돼요.'
      sub: '안쪽 노드에는 길잡이 키만 있어 한 페이지에 더 많이 담기고 트리가 더 낮아져요. DB의 인덱스는 대개 이 모양이에요.'
    says:
      - 'B-트리는 안쪽 노드에도 값(행의 위치)을 둔다. B+트리는 값을 잎에만 두고 안쪽 노드에는 어느 자식으로 갈지 정하는 키만 둔다. 같은 페이지에 길잡이를 더 많이 담을 수 있다'
      - '잎은 정렬된 순서로 옆 잎을 가리킨다(코드 node의 `next`). `between 500000 and 500099`는 500000이 든 잎을 찾은 뒤 `next`를 따라가며 500099를 넘을 때 멈춘다. 위로 다시 올라가지 않는다'
      - '자바 구현에서 범위 조회가 거친 노드 수를 센다: 뿌리에서 잎까지 겹 수만큼, 그다음 옆 잎 몇 개다. 이진 탐색 트리로 같은 범위를 중위 순회하면 위아래를 오가며 훨씬 많은 노드를 지난다'
      - 'PostgreSQL에서 같은 범위 조회의 `EXPLAIN (ANALYZE, BUFFERS)`를 본다. 100행을 읽는데 인덱스에서 읽은 페이지는 겹 수에 잎 한두 개를 더한 정도다. 실제 출력을 보인다'
      - '`ORDER BY id`를 인덱스가 따로 정렬하지 않고 처리할 수 있는 것도 잎이 이미 정렬된 채 이어져 있어서다. 언제 그렇게 되는지는 인덱스와 실행계획(D7)에서 다룬다'
      - 'PostgreSQL의 btree는 Lehman과 Yao의 B-트리 변형으로, 값은 잎에 있고 잎과 안쪽 노드 모두 오른쪽 이웃을 가리킨다(PostgreSQL 문서 근거)'
    asks:
      - '본문의 예시: 높이 3의 B+트리에서 이어진 키 100개를 범위로 읽는다. 한 잎에 키가 300개쯤 든다면 읽는 노드는 대략 몇 개인가 (3개나 4개. 뿌리에서 잎까지 3개, 범위가 잎 경계를 넘으면 옆 잎 하나 더)'
      - '옮긴 상황: 잎끼리 이어져 있지 않은 B-트리에서 범위 조회를 하면 무엇이 더 드나 (잎 하나를 다 읽을 때마다 부모로 올라가 다음 잎을 찾아 내려가야 한다)'
practice:
  says:
    - '인덱스의 크기와 높이를 보는 법. `pg_relation_size(''인덱스이름'')`은 바이트, `bt_metap(''인덱스이름'')`의 `level`은 뿌리의 높이(잎이 0)다. 한 건을 찾을 때 읽은 페이지는 `EXPLAIN (ANALYZE, BUFFERS)`의 `Buffers`에서 본다. pageinspect는 확장이라 `create extension`이 필요하고 운영 DB에서는 권한을 확인한다 (PostgreSQL 문서 근거, 테스트로 출력 확인)'
    - '흔한 실수: 200자 남짓의 URL 같은 긴 문자열 열에 그대로 인덱스를 만든다. 키가 길면 한 페이지에 담기는 키가 줄어 같은 행 수에서 인덱스가 몇 배 커지고 겹이 늘 수 있다. 같은 100만 행으로 `bigint` 키 인덱스와 긴 문자열 인덱스의 크기와 높이를 테스트로 비교한다. 고친 방법: 같은지만 보면 되는 긴 값은 짧은 해시 값(예: `bigint`로 만든 해시)을 따로 열로 두고 그 열에 인덱스를 만든 뒤, 찾은 행에서 원래 값을 한 번 더 비교한다. 두 인덱스의 크기를 나란히 보인다'
    - '스프링 데이터 JPA에서 인덱스는 보통 마이그레이션 SQL(Flyway)로 만들고, 엔티티의 `@Table(indexes = @Index(columnList = "url_hash"))`는 스키마를 자동으로 만들 때만 쓰인다 (자카르타 퍼시스턴스 문서 근거)'
    - '무작위 UUID 기본 키는 B-트리의 아무 잎에나 들어가 페이지를 자주 나눈다. 유일한 ID 만들기(A17)에서 다룬다'
claims:
  - claim: '키 100만 개를 균형 이진 탐색 트리에 담으면 높이가 20이고, 찾을 때 거치는 노드가 20개 이하다'
    how: '정렬된 키로 균형 이진 탐색 트리를 만들고 여러 키를 찾으며 거친 노드 수의 최댓값을 센다'
  - claim: '노드당 키 최대 255개인 B+트리에 키 100만 개를 넣으면 높이가 3이고, 찾을 때 거치는 노드가 3개다'
    how: '자바로 만든 B+트리에 넣고 찾으며 노드 수를 센다'
  - claim: '노드당 키 최대 3개인 B+트리에 1부터 넣으면 4에서 첫 분할과 함께 높이가 2가 되고, 정렬된 순서로 100만 개를 넣어도 높이가 log만큼만 자란다'
    how: '분할 횟수와 높이를 넣을 때마다 기록해 위젯의 단계와 맞춘다'
  - claim: 'B+트리의 범위 조회는 뿌리에서 잎까지 겹 수와 옆 잎 몇 개만 거친다'
    how: '`between` 범위를 찾으며 거친 노드 수를 센다'
  - claim: 'PostgreSQL 16에서 100만 행 기본 키 인덱스의 `bt_metap` level은 2(세 겹)이고, 한 건 조회의 인덱스 노드에서 읽은 페이지는 세 개다'
    how: 'Testcontainers PostgreSQL에 넣고 pageinspect와 `EXPLAIN (ANALYZE, BUFFERS)`를 본다. 값이 다르면 레슨의 숫자를 고친다'
  - claim: '100행 범위 조회의 인덱스 페이지 읽기는 겹 수에 잎 한두 개를 더한 정도다'
    how: '같은 방법으로 `Buffers`를 본다'
  - claim: '같은 100만 행에서 긴 문자열 키 인덱스가 `bigint` 키 인덱스보다 몇 배 크고 level이 같거나 높다'
    how: '`pg_relation_size`와 `bt_metap`을 비교한다'
sources:
  - 'PostgreSQL의 btree 구현(Lehman과 Yao의 변형, 잎과 오른쪽 이웃): PostgreSQL 문서 https://www.postgresql.org/docs/16/btree.html'
  - '페이지 크기 8KB와 페이지 구조: PostgreSQL 문서 https://www.postgresql.org/docs/16/storage-page-layout.html'
  - 'pageinspect의 bt_metap: PostgreSQL 문서 https://www.postgresql.org/docs/16/pageinspect.html'
  - 'EXPLAIN의 BUFFERS: PostgreSQL 문서 https://www.postgresql.org/docs/16/sql-explain.html'
  - '`@Index`: 자카르타 퍼시스턴스 API 문서 https://jakarta.ee/specifications/persistence/3.1/apidocs/jakarta.persistence/jakarta/persistence/index'
