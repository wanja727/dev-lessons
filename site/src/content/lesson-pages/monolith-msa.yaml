# 모놀리스와 마이크로서비스 (설계서)
# 자료 파일의 칸은 docs/lesson-data-format.md에 있다.
stage: design
title: 모놀리스와 마이크로서비스
unit: 시스템 설계와 아키텍처
roadmap: A9
type: 개념 설명
prerequisites:
  - {slug: layered-architecture, title: 계층형 아키텍처}
  - {slug: kafka-basics, title: 메시지 큐}
assume: '스프링 부트 3.5, 자바 21, PostgreSQL 16. 컨트롤러, 서비스, 리포지토리로 나눈 구조(계층형 아키텍처 레슨). 메시지 큐로 일을 떼어 놓으면 결과가 조금 뒤에 맞춰진다는 것(메시지 큐 레슨). 트랜잭션의 커밋과 롤백.'
example: '쇼핑몰의 주문과 재고. 한 애플리케이션 안에서 주문 서비스가 재고 서비스를 메서드로 부르는 구조(모놀리스)와, 주문 서버가 재고 서버를 HTTP로 부르는 구조(마이크로서비스)를 나란히 놓고 같은 주문을 처리한다.'
intro:
  - '"우리도 마이크로서비스로 가자"는 말에 서비스를 다섯 개로 나눴어요. 그런데 주문 하나를 고치려면 세 팀의 배포 일정을 맞춰야 하고, 재고 서버가 느린 날에는 주문 서버까지 줄줄이 느려져요. 한 프로젝트일 때는 없던 일이에요.'
  - '스프링 부트 프로젝트 하나로 시작한 서비스가 커지면, 나눌지 말지와 어디서 나눌지를 정하는 날이 와요. 면접에서도 "MSA의 장단점", "모놀리스가 나쁜가요"를 자주 묻고, 지원하는 회사가 어느 쪽인지에 따라 하는 일이 달라져요.'
  - '이 레슨에서는 같은 주문 처리를 메서드 호출과 HTTP 호출로 각각 돌려서, 호출 시간, 한쪽이 실패했을 때 되돌릴 수 있는지, 한쪽이 죽었을 때 다른 쪽이 어떻게 되는지를 비교해요.'
covers:
  - topic: '모놀리스는 모든 기능을 한 애플리케이션으로 만들어 한 번에 배포한다. 마이크로서비스는 기능별로 따로 배포하는 작은 서비스들로 나누고 네트워크로 부른다'
    where: '질문 1'
  - topic: '모놀리스의 장점: 호출이 메서드라 빠르고 실패가 적다, 트랜잭션 하나로 묶인다, 배포와 운영이 단순하다'
    where: '질문 1'
  - topic: '모놀리스가 커지면: 한 줄을 고쳐도 전체를 배포한다, 한 기능의 부하 때문에 전체를 늘린다, 팀이 많으면 서로의 코드를 건드린다'
    where: '질문 1'
  - topic: '마이크로서비스로 얻는 것: 서비스별로 따로 배포하고 따로 늘린다, 팀이 서비스를 하나씩 맡는다, 한 서비스의 장애를 가둘 수 있다'
    where: '질문 2'
  - topic: '잃는 것 하나: 네트워크 호출은 느리고 실패할 수 있다. 상대가 죽거나 느리면 부르는 쪽도 영향받는다'
    where: '질문 2'
  - topic: '잃는 것 둘: 서비스마다 DB가 따로라 트랜잭션 하나로 묶을 수 없다. 한쪽만 성공한 상태를 다뤄야 한다'
    where: '질문 3'
  - topic: '서비스마다 자기 DB를 갖는다(공유 DB는 서비스를 다시 묶는다)'
    where: '질문 3'
  - topic: '어긋남을 다루는 방법: 보상 트랜잭션, 메시지로 나중에 맞추기'
    where: '질문 3. 자세한 것은 분산 트랜잭션과 사가(A19), 트랜잭셔널 아웃박스(A18)'
  - topic: '모듈러 모놀리스: 배포는 하나로 두고 코드 안에서 모듈의 경계를 지킨다. 모듈은 다른 모듈의 공개된 API만 부르고 테이블을 함께 쓰지 않는다'
    where: '질문 4'
  - topic: '언제 나누나: 팀과 배포가 서로를 막을 때, 한 기능만 따로 늘려야 할 때. 처음부터 나누지 않는다'
    where: '질문 4'
  - topic: '경계를 어디에 긋나: 함께 바뀌는 것은 함께 둔다. 애그리거트와 업무 단위가 기준이 된다'
    where: '질문 4. 애그리거트는 도메인 모델과 트랜잭션 스크립트(A2)'
  - topic: '서비스 사이 호출 방법: 동기(HTTP)와 비동기(메시지)'
    where: '질문 2'
  - topic: '스프링에서 다른 서비스를 부르는 코드(RestClient)와 타임아웃'
    where: '실무에서는'
  - topic: '장애가 번지는 것을 막는 타임아웃, 재시도, 서킷 브레이커'
    where: '다루지 않음: 타임아웃, 재시도, 서킷 브레이커(A10)'
  - topic: 'API 게이트웨이와 서비스 찾기(service discovery)'
    where: '질문 2의 더 알아보기'
codes:
  predict: |-
    @Transactional
    void order(long itemId, int qty) {
      orders.save(new Order(itemId, qty));
      stockClient.decrease(itemId, qty);
      payment.approve(itemId, qty);
    }
  local: |-
    @Transactional
    void order(long itemId, int qty) {
      orders.save(new Order(itemId, qty));
      stockService.decrease(itemId, qty);
    }
  remote: |-
    void decrease(long itemId, int qty) {
      rest.post()
          .uri("/stock/{id}/decrease", itemId)
          .body(Map.of("qty", qty))
          .retrieve()
          .toBodilessEntity();
    }
  restClient: |-
    RestClient rest = RestClient.builder()
        .baseUrl("http://stock-service")
        .requestFactory(factory)
        .build();
predict:
  text: '코드 predict에서 `stockClient`는 재고 서버를 HTTP로 불러요. 재고는 재고 서버의 DB에서 줄었어요. 그다음 `payment.approve`가 예외를 던져 주문 서버의 트랜잭션이 롤백돼요. 재고 서버의 재고는 어떻게 될까요? 보기: 함께 되돌아간다, 줄어든 채로 남는다, 재고 서버가 알아서 기다렸다가 되돌린다.'
  answer: '줄어든 채로 남는다. 재고 서버는 자기 DB에 이미 커밋했고, 주문 서버의 롤백은 다른 서버의 DB에 닿지 않는다. 질문 3에서 밝힌다.'
questions:
  - id: q1
    title: 모놀리스는 무엇이고, 커지면 무엇이 힘들어지나요?
    conclusion:
      lead: '모든 기능을 한 애플리케이션으로 만들어 한 번에 배포하는 구조예요. 호출이 빠르고 트랜잭션이 하나라 단순하지만, 커질수록 배포와 늘리기가 통째로 묶여요.'
      sub: '한 줄을 고쳐도 전체를 다시 배포하고, 한 기능만 바빠도 전체를 늘리고, 여러 팀이 한 코드에서 서로를 건드려요.'
    says:
      - '모놀리스(monolith)는 "한 덩어리"라는 뜻이다. 주문, 재고, 회원, 결제가 한 스프링 부트 애플리케이션에 있고 DB 하나를 쓴다. 대부분의 서비스가 이렇게 시작한다'
      - '코드 local: 주문 서비스가 재고 서비스를 메서드로 부른다. 같은 JVM 안의 호출이라 빠르고, `@Transactional` 하나로 주문 저장과 재고 차감이 함께 커밋되거나 함께 롤백된다. 재고 차감 뒤 예외가 나면 둘 다 롤백되는 것을 테스트로 보인다'
      - '커지면 생기는 일: 빌드와 테스트가 오래 걸린다. 알림 기능 한 줄을 고쳐도 주문까지 함께 배포한다. 검색만 바쁜데 전체를 여러 대로 늘린다. 한 모듈의 메모리 누수가 전체를 멈춘다'
      - '이것들은 크기와 팀 수의 문제다. 작은 팀의 작은 서비스에서는 모놀리스가 가장 빠르게 만들고 운영하는 구조다'
    asks:
      - '본문의 예시: 모놀리스의 `@Transactional` 메서드에서 주문을 저장하고 재고를 줄인 뒤 예외가 났다. 주문과 재고는 (둘 다 롤백된다)'
      - '옮긴 상황: 개발자 4명이 만드는 사내 예약 서비스. 하루 요청 1만 건, 기능은 예약과 회원 두 가지다. 모놀리스로 둘 때 힘든 점이 크게 드러나나 (아니다. 배포와 늘리기가 묶여도 문제될 크기가 아니다)'
  - id: q2
    title: 마이크로서비스로 나누면 무엇을 얻고 무엇을 잃나요?
    conclusion:
      lead: '서비스마다 따로 배포하고 따로 늘리며 팀이 하나씩 맡을 수 있게 되지만, 메서드 호출이 네트워크 호출이 되어 느리고 실패할 수 있게 돼요.'
      sub: '상대 서비스가 느리거나 죽으면 부르는 쪽도 기다리거나 실패해요. 그래서 타임아웃을 두고, 결과를 바로 몰라도 되는 일은 메시지로 넘겨요.'
    says:
      - '마이크로서비스는 기능별로 나눈 작은 서비스들이다. 주문 서버, 재고 서버가 따로 배포되고 각자 DB를 가진다. 서로 HTTP나 메시지로 대화한다'
      - '얻는 것: 재고 서버만 고쳐서 재고 서버만 배포한다. 주문이 바쁘면 주문 서버만 늘린다. 팀이 서비스를 맡아 다른 팀의 일정에 묶이지 않는다'
      - '같은 재고 차감을 코드 remote처럼 HTTP로 부르면 메서드 호출보다 몇십 배에서 몇백 배 느리다. 같은 컴퓨터 안에서도 그렇다. 두 방식의 호출 1,000번 시간을 실제 출력으로 보인다'
      - '재고 서버를 끄면 주문 서버의 HTTP 호출이 실패하고 주문도 실패한다. 재고 서버가 응답을 3초 늦게 하면 주문 서버의 요청도 3초씩 걸린다. 테스트로 보인다. 이렇게 번지는 것을 막는 방법은 A10'
      - '호출 방식 둘: 결과가 바로 필요하면 HTTP(동기), 조금 뒤에 해도 되면 메시지(비동기, A8)'
      - '더 알아보기: 서비스가 많아지면 클라이언트가 서비스마다 주소를 알 수 없어 앞에 API 게이트웨이를 둔다. 서비스의 서버가 늘고 줄 때 주소를 찾아 주는 서비스 찾기(service discovery)도 쓴다'
    widget:
      kind: toggle
      note: '재고를 메서드로 부를 때와 HTTP로 부를 때를 고르고, 정상, 재고 서버 느림(3초), 재고 서버 꺼짐 가운데 하나로 실행한다. 로그에 주문 요청의 응답 시간과 성공 여부가 나온다'
    asks:
      - '본문의 예시: 주문 서버가 재고 서버를 HTTP로 부르는데 재고 서버가 꺼져 있다. 타임아웃과 다른 대책이 없으면 주문 요청은 (실패한다)'
      - '옮긴 상황: 상품 상세 페이지 서버가 리뷰 서버를 HTTP로 불러 리뷰를 붙인다. 리뷰 서버가 응답을 5초 늦게 하면 상세 페이지는 어떻게 되나 (상세 페이지도 5초 넘게 걸린다)'
  - id: q3
    title: 서비스를 나누면 트랜잭션은 어떻게 되나요?
    conclusion:
      lead: '서비스마다 DB가 따로라 트랜잭션 하나로 묶을 수 없어요. 한쪽은 커밋되고 다른 쪽은 실패한 상태가 생길 수 있어요.'
      sub: '그래서 실패하면 앞서 성공한 일을 취소하는 요청(보상)을 보내거나, 메시지로 나중에 맞추는 방법을 써요. 모놀리스에서는 롤백 한 번이면 되던 일이에요.'
    says:
      - '코드 predict를 돌린다. 재고 서버는 자기 트랜잭션으로 재고를 줄이고 커밋했다. 주문 서버가 결제 실패로 롤백해도 재고 서버의 DB에는 닿지 않는다. 재고가 줄어든 채로 남는 것을 테스트로 보인다. 예측의 답을 밝힌다'
      - '`@Transactional`은 그 서버가 연 DB 연결 하나의 트랜잭션이다. 다른 서버의 DB는 다른 연결이다'
      - '고치는 방법 하나: 결제가 실패하면 재고 서버에 "재고 되돌리기"를 요청한다(보상 트랜잭션). 보상도 실패할 수 있어 다시 시도해야 한다. A19에서 다룬다'
      - '고치는 방법 둘: 주문 저장과 함께 "주문 생성" 메시지를 남기고, 재고 서버가 메시지를 받아 줄인다. 잠시 어긋나도 결국 맞춰진다(결과적 일관성). 저장과 메시지가 어긋나지 않게 하는 방법은 A18'
      - '서비스마다 자기 DB를 갖는 이유: 두 서비스가 같은 테이블을 함께 쓰면 테이블을 바꿀 때 두 서비스를 함께 배포해야 해서 나눈 의미가 사라진다'
    asks:
      - '본문의 예시: 주문 서버가 재고 서버를 HTTP로 불러 재고를 줄인 뒤, 주문 저장에서 예외가 나 롤백했다. 재고 서버의 재고는 (줄어든 채로 남는다)'
      - '옮긴 상황: 회원 서버와 포인트 서버가 나뉘어 있다. 탈퇴할 때 회원 서버가 회원을 지우고 포인트 서버에 포인트 삭제를 요청했는데 포인트 서버가 실패했다. 한 트랜잭션처럼 되돌릴 수 있나 (없다. 회원 삭제는 이미 커밋됐다. 포인트 삭제를 다시 시도하거나 보상을 설계한다)'
  - id: q4
    title: 언제 나누고, 나누지 않는다면 무엇을 지키나요?
    conclusion:
      lead: '팀과 배포가 서로를 막거나 한 기능만 따로 늘려야 할 때 나눠요. 그 전에는 한 애플리케이션 안에서 모듈의 경계를 지키는 모듈러 모놀리스로 둬요.'
      sub: '모듈은 다른 모듈의 공개된 서비스만 부르고 남의 테이블을 직접 읽지 않아요. 경계가 지켜져 있으면 나중에 그 모듈을 떼어 내기 쉬워요.'
    says:
      - '처음부터 나누면 경계를 잘못 긋기 쉽다. 자주 함께 바뀌는 둘을 다른 서비스에 두면 매번 두 서비스를 함께 고치고 배포한다'
      - '나눌 신호: 여러 팀이 같은 코드와 배포 일정에 막힌다, 한 기능만 부하가 커서 따로 늘려야 한다, 한 기능의 장애가 전체를 멈춘다'
      - '모듈러 모놀리스: 배포는 하나인데 패키지를 `order`, `stock`처럼 모듈로 나누고, 다른 모듈은 공개한 서비스 인터페이스로만 부른다. 다른 모듈의 리포지토리나 엔티티를 직접 쓰지 않는다'
      - '경계를 긋는 기준: 함께 바뀌고 한 트랜잭션에서 지켜야 하는 것은 같은 모듈에 둔다. A2의 애그리거트가 단위가 된다'
      - '정리 표: 모놀리스, 모듈러 모놀리스, 마이크로서비스의 배포, 트랜잭션, 호출, 운영 비용'
    widget:
      kind: classify
      note: '상황마다 모놀리스로 두기, 모듈러 모놀리스, 서비스로 떼기 가운데 고른다. 예: 3명이 만드는 첫 서비스, 50명 다섯 팀이 한 저장소에서 배포 충돌을 겪는 서비스, 이미지 변환만 CPU를 많이 쓰는 서비스, 기능은 많지만 팀이 하나인 서비스'
    asks:
      - '본문의 예시: 모듈러 모놀리스에서 주문 모듈이 재고 모듈의 `StockRepository`를 직접 주입받아 쓴다. 무엇을 어겼나 (모듈의 경계. 재고 모듈의 공개 서비스로 불러야 한다)'
      - '옮긴 상황: 동영상 서비스에서 업로드한 영상을 변환하는 기능만 CPU를 많이 써서, 변환이 몰리면 재생 API까지 느려진다. 나눌 신호인가 (그렇다. 그 기능만 따로 늘려야 한다)'
practice:
  says:
    - '다른 서비스를 HTTP로 부르는 스프링 코드: 스프링 6.1부터 있는 `RestClient`. 코드 restClient처럼 `baseUrl`과 요청 팩토리를 정하고, `post().uri(...).body(...).retrieve()`로 부른다. 테스트에서 `MiniWeb`으로 띄운 재고 서버를 부른다'
    - '흔한 실수: 타임아웃을 정하지 않는다. `RestClient`의 기본 요청 팩토리는 JDK의 `HttpURLConnection`을 쓰고 기본 읽기 타임아웃이 없다(0, 끝없이 기다림). 재고 서버가 응답하지 않으면 주문 서버의 요청 스레드가 묶인다. 고친 코드: `SimpleClientHttpRequestFactory`에 `setConnectTimeout`, `setReadTimeout`을 준다. 응답이 늦은 서버에서 타임아웃 예외가 나는 것을 테스트로 보인다'
    - '흔한 실수 둘: 모듈러 모놀리스에서 다른 모듈의 엔티티를 연관관계(`@ManyToOne`)로 직접 잇는다. 모듈을 떼어 낼 때 끊기 어렵다. 다른 모듈은 id로 가리킨다(A2)'
claims:
  - claim: '같은 애플리케이션 안에서 `@Transactional`로 주문과 재고를 바꾸다 예외가 나면 둘 다 롤백된다'
    how: 'PostgreSQL 컨테이너와 `@SpringBootTest`(테스트에 트랜잭션 없음)'
  - claim: '재고를 HTTP로 부르는 서버가 자기 DB에 커밋한 뒤 주문 서버가 롤백해도 재고는 줄어든 채 남는다'
    how: '`MiniWeb`으로 재고 서버를 띄우고 재고를 메모리나 별도 테이블에 둔다'
  - claim: 'HTTP 호출은 메서드 호출보다 몇십 배 이상 느리다'
    how: '각각 1,000번 부른 시간을 잰다. 배수는 단정하지 않고 실측을 보인다'
  - claim: '재고 서버가 꺼져 있으면 호출이 예외로 실패하고, 응답이 늦으면 부르는 쪽도 그만큼 늦다'
    how: '`MiniWeb`을 닫은 뒤 부르기, 일부러 늦게 답하는 컨트롤러'
  - claim: '읽기 타임아웃을 준 `RestClient`는 늦은 응답에서 타임아웃 예외를 던진다'
    how: '`SimpleClientHttpRequestFactory.setReadTimeout`'
sources:
  - '마이크로서비스의 정의: Martin Fowler와 James Lewis https://martinfowler.com/articles/microservices.html'
  - '모놀리스를 먼저: https://martinfowler.com/bliki/MonolithFirst.html'
  - '스프링 RestClient: https://docs.spring.io/spring-framework/reference/integration/rest-clients.html'
