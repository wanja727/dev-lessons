# 격리 수준과 이상 현상
# 자료 파일의 칸은 docs/lesson-data-format.md에 있다.
# 예전 레슨 site/src/pages/lessons/isolation-level.astro와 isolation/IsolationLevelTest.java를 재료로 다시 쓴다.
title: 격리 수준과 이상 현상
description: 동시에 도는 트랜잭션이 서로 무엇을 볼 수 있는지, 격리 수준 네 가지가 각각 무엇을 막는지, 기본값 READ COMMITTED와 REPEATABLE READ에서 무엇이 보이고 무엇이 실패하는지, 갱신 손실은 격리 수준으로 막히는지. 다섯 가지 질문에 스스로 답할 수 있게 연결 두 개로 문장 순서를 맞춰 실행하며 배우는 대화형 레슨.
minutes: 25
unit: DB
roadmap: D9
type: 동작 확인
prerequisites:
  - {slug: tx-basics, title: 트랜잭션 기초}
assume: 'PostgreSQL 16. 커밋과 롤백, 커밋 전 변경은 다른 연결에 보이지 않는다는 것, ACID의 I(트랜잭션 기초 레슨).'
example: '계좌 테이블 `account(owner, balance)`와 쿠폰 테이블. 트랜잭션 A와 B를 연결 두 개로 열고, 한 문장씩 번갈아 실행해 A가 무엇을 보는지 확인해요.'
intro:
  - '정산 작업이 같은 트랜잭션 안에서 잔액을 두 번 읽었는데 값이 달라서, 합계가 맞지 않는 보고서가 나왔어요. 다른 날에는 두 요청이 같은 잔액을 동시에 고쳐서 하나의 수정이 사라졌어요. 둘 다 트랜잭션 안에서 일어났어요.'
  - '트랜잭션 기초에서 "커밋 전 변경은 남에게 보이지 않는다"를 봤어요. 그러면 커밋된 변경은 언제부터 보일까요? 그 답이 격리 수준이고, DB마다 기본값이 달라요. 스프링의 `@Transactional(isolation = ...)`으로 바꿀 수 있지만, 바꾸면 무엇을 얻고 무엇을 내주는지 알아야 해요.'
  - '이 레슨에서는 PostgreSQL에 연결 두 개를 열고 문장 순서를 맞춰 실행해, 격리 수준마다 어떤 이상 현상이 보이고 막히는지 실제로 확인해요.'
covers:
  - topic: '격리 수준은 동시에 도는 트랜잭션이 서로의 변경을 얼마나 보는지 정한다. 높을수록 덜 보고, 대신 실패하거나 기다리는 일이 는다'
    where: '질문 1'
  - topic: '이상 현상 셋: Dirty Read(커밋 전 값을 읽음), Non-Repeatable Read(같은 행을 다시 읽으면 값이 다름), Phantom Read(같은 조건으로 다시 세면 행이 늘거나 줆)'
    where: '질문 1'
  - topic: 'SQL 표준의 네 격리 수준(READ UNCOMMITTED, READ COMMITTED, REPEATABLE READ, SERIALIZABLE)과 각각 허용하는 이상 현상'
    where: '질문 2'
  - topic: 'PostgreSQL은 READ UNCOMMITTED를 READ COMMITTED로 다룬다(Dirty Read가 없다). REPEATABLE READ에서 Phantom Read도 막는다. 표준과 다르다'
    where: '질문 2'
  - topic: 'PostgreSQL의 기본은 READ COMMITTED다. 문장마다 그 순간 커밋된 값을 본다. MySQL InnoDB의 기본은 REPEATABLE READ다'
    where: '질문 3'
  - topic: 'REPEATABLE READ는 트랜잭션의 첫 문장 때의 스냅샷을 끝까지 본다'
    where: '질문 4. 스냅샷을 만드는 원리는 MVCC(D13)'
  - topic: 'REPEATABLE READ에서 다른 트랜잭션이 먼저 고친 행을 고치려 하면 직렬화 오류(40001)로 실패한다. 앱이 트랜잭션을 다시 시도해야 한다'
    where: '질문 4'
  - topic: '갱신 손실(읽고 계산해서 쓰기)은 READ COMMITTED에서 막히지 않는다'
    where: '질문 5. 락으로 막는 법은 낙관적 락과 비관적 락(D10)'
  - topic: '원자적 UPDATE(balance = balance + n)는 READ COMMITTED에서도 정확하다. 뒤 트랜잭션은 앞 트랜잭션의 커밋을 기다렸다가 최신 값에 더한다'
    where: '질문 5'
  - topic: 'SERIALIZABLE은 한 줄로 차례로 실행한 것과 같은 결과만 허용하고, 아니면 40001로 실패시킨다'
    where: '질문 2의 더 알아보기'
  - topic: '쓰기 치우침(write skew): 서로 다른 행을 읽고 고쳐 규칙이 깨지는 것. REPEATABLE READ로 막히지 않고 SERIALIZABLE로 막힌다'
    where: '질문 4의 더 알아보기'
  - topic: '스프링 @Transactional(isolation = ...)과 읽기 전용 트랜잭션, 직렬화 오류를 다시 시도하는 코드'
    where: '실무에서는'
  - topic: '복제 DB에서 읽을 때 늦게 보이는 것'
    where: '다루지 않음: DB 복제와 샤딩(A15)'
links:
  test: https://github.com/wanja727/dev-lessons/blob/main/verification/src/test/java/lab/devlessons/isolation/IsolationLessonTest.java
  oldTest: https://github.com/wanja727/dev-lessons/blob/main/verification/src/test/java/lab/devlessons/isolation/IsolationLevelTest.java
  iso: https://www.postgresql.org/docs/16/transaction-iso.html
  mysql: https://dev.mysql.com/doc/refman/8.0/en/innodb-transaction-isolation-levels.html
  springTx: https://docs.spring.io/spring-framework/reference/data-access/transaction/declarative/annotations.html
codes:
  predict: |-
    -- 둘 다 READ COMMITTED
    -- kim의 잔액은 100

    A: begin;
    A: select balance from account
        where owner = 'kim'; -- 100
    B: begin;
    B: update account
          set balance = 50
        where owner = 'kim';
    B: commit;
    A: select balance from account
        where owner = 'kim'; -- ?
  rr: |-
    A: [[begin isolation level]]
       [[repeatable read;]]
    A: select balance ...; -- 100
    B: update ... set balance = 50;
    B: commit;
    A: select balance ...; -- 100
  lostUpdate: |-
    A: select balance ...; -- 100
    B: select balance ...; -- 100
    A: update ... set balance = 150;
    A: commit;
    B: update ... set balance = 130;
    B: commit;  -- 결과 130
  atomic: |-
    update account
       set balance = [[balance + 50]]
     where owner = 'kim';
  spring: |-
    @Transactional(isolation =
        Isolation.REPEATABLE_READ)
    public Report monthlyReport() {
      long total = repo.sumBalance();
      List<Account> rows = repo.findAll();
      return new Report(total, rows);
    }
  phantom: |-
    A: select count(*) from coupon
        where amount > 1000; -- 1
    B: insert into coupon
       values (3, 3000);
    B: commit;
    A: select count(*) from coupon
        where amount > 1000; -- ?
  retry: |-
    for (int i = 1; ; i++) {
      try {
        return reportService.monthly();
      } catch (
          CannotAcquireLockException e) {
        if (i == 3) throw e;
      }
    }
predict:
  title: 같은 트랜잭션에서 두 번 읽으면?
  text: 'A가 kim의 잔액 100을 읽은 뒤, B가 50으로 바꾸고 커밋해요. A는 아직 같은 트랜잭션 안이에요. 둘 다 PostgreSQL의 기본 격리 수준이에요. A가 두 번째로 읽은 값은 얼마일까요? 답은 질문 3에 나와요.'
  code: predict
  label: 내 예측
  options:
    - {value: '100', label: '100'}
    - {value: '50', label: '50'}
    - {value: error, label: 오류가 난다}
  answer: '50'
  storageKey: iso-predict
  wrong: 예측은 "{label}"이었어요. 틀린 예측이 더 오래 남으니 괜찮아요.
questions:
  - id: q1
    title: 동시에 도는 트랜잭션은 서로 무엇을 볼 수 있나요?
    conclusion:
      lead: '격리가 약하면 남의 트랜잭션이 바꾼 값이 내 트랜잭션 중간에 보이고, 그것이 세 가지 이상 현상으로 나타나요.'
      sub: '커밋 전 값을 읽는 Dirty Read, 같은 행을 다시 읽으면 값이 다른 Non-Repeatable Read, 같은 조건으로 다시 세면 행 수가 다른 Phantom Read예요.'
    says:
      - '트랜잭션 기초의 ACID에서 I(격리)는 "동시에 돌아도 서로 끼어들지 않는 것"이었다. 완전히 막으면 차례로 줄 서야 해서 느리다. 그래서 DB는 얼마나 막을지 고르게 하고, 그 단계가 격리 수준이다'
      - 'Dirty Read: B가 커밋하지 않은 값을 A가 읽는다. B가 롤백하면 A는 있지도 않은 값으로 일한 것이다'
      - 'Non-Repeatable Read: A가 같은 행을 두 번 읽는 사이에 B가 고치고 커밋해서 두 값이 다르다'
      - 'Phantom Read: A가 `where amount > 1000`으로 두 번 세는 사이에 B가 조건에 맞는 행을 넣고 커밋해서 두 수가 다르다. 행 하나의 값이 아니라 조건에 맞는 행의 집합이 바뀐다'
      - '세 현상을 시간 순서 그림 하나씩으로 보인다. A와 B의 줄을 나란히 놓고 문장을 번갈아 둔다'
    widget:
      kind: steps
      note: 'selector로 세 이상 현상 가운데 하나를 고르고, A와 B의 문장을 한 단계씩 실행한다. 단계마다 A가 본 값과 DB에 커밋된 값을 duo로 보인다. 마지막 단계에서 A의 두 번 읽은 값이 다르면 산호색'
    asks:
      - '본문의 예시: A가 `count(*) where amount > 1000`을 두 번 하는 사이에 B가 조건에 맞는 주문을 넣고 커밋해 수가 달라졌다. 어떤 이상 현상인가 (Phantom Read)'
      - '옮긴 상황: 재고 화면이 B가 아직 커밋하지 않은 "재고 0"을 읽어 품절로 보였는데 B는 롤백했다. 어떤 이상 현상인가 (Dirty Read)'
    body:
      - p: '[트랜잭션 기초](lesson:tx-basics)의 ACID에서 I(격리)는 "동시에 돌아도 서로 끼어들지 않는 것"이었어요. 완전히 막으려면 트랜잭션들이 한 줄로 차례를 기다려야 해서 느려요. 그래서 DB는 **얼마나 막을지 고르게** 하고, 그 단계를 **격리 수준**이라고 해요.'
      - p: '격리가 약하면 내 트랜잭션 중간에 남의 변경이 보여요. 그 모양에 따라 세 가지 이름이 있어요.'
      - table:
          head: [이상 현상, 무엇이 보이나]
          rows:
            - ['Dirty Read', '남이 아직 커밋하지 않은 값을 읽어요. 그쪽이 롤백하면 없던 값으로 일한 셈이에요']
            - ['Non-Repeatable Read', '같은 행을 두 번 읽는 사이에 남이 고치고 커밋해서 두 값이 달라요']
            - ['Phantom Read', '같은 조건으로 두 번 세는 사이에 남이 맞는 행을 넣고 커밋해서 행 수가 달라요']
      - p: '이 레슨에서는 연결 두 개로 트랜잭션 A와 B를 열고, 문장을 정해진 순서로 번갈아 실행해요. 아래에서 세 현상을 한 단계씩 넘겨 보세요. 격리가 가장 약할 때(표준의 READ UNCOMMITTED) 생길 수 있는 모습이에요.'
      - widget:
          kind: steps
          layout: [selector, duo, buttons, log, verdict]
          selector:
            label: 이상 현상
            options:
              - {value: dirty, label: Dirty Read}
              - {value: nonrepeat, label: Non-Repeatable Read}
              - {value: phantom, label: Phantom Read}
          initial:
            duo:
              - {label: A가 본 값, text: 아직 없음, state: dim}
              - {label: DB에 커밋된 값, rows: [{k: kim 잔액, v: '100'}, {k: '1000원 넘는 쿠폰', v: '1개'}]}
          scenarios:
            dirty:
              - log: 'B: update 잔액 = 999 (커밋 전)'
                duo: [{label: A가 본 값, text: 아직 없음, state: dim}, {label: DB에 커밋된 값, rows: [{k: kim 잔액, v: '100'}]}]
              - log: 'A: select 잔액'
                duo: [{label: A가 본 값, rows: [{k: 첫 읽기, v: '999', mark: bad}]}, {label: DB에 커밋된 값, rows: [{k: kim 잔액, v: '100'}]}]
              - log: 'B: rollback'
                duo: [{label: A가 본 값, rows: [{k: 첫 읽기, v: '999', mark: bad}]}, {label: DB에 커밋된 값, rows: [{k: kim 잔액, v: '100'}]}]
                verdict: 'A는 한 번도 커밋된 적 없는 999로 일했어요.'
            nonrepeat:
              - log: 'A: select 잔액 → 100'
                duo: [{label: A가 본 값, rows: [{k: 첫 읽기, v: '100'}]}, {label: DB에 커밋된 값, rows: [{k: kim 잔액, v: '100'}]}]
              - log: 'B: update 잔액 = 50, commit'
                duo: [{label: A가 본 값, rows: [{k: 첫 읽기, v: '100'}]}, {label: DB에 커밋된 값, rows: [{k: kim 잔액, v: '50', mark: changed}]}]
              - log: 'A: select 잔액 → 50'
                duo: [{label: A가 본 값, rows: [{k: 첫 읽기, v: '100'}, {k: 둘째 읽기, v: '50', mark: bad}]}, {label: DB에 커밋된 값, rows: [{k: kim 잔액, v: '50'}]}]
                verdict: '한 트랜잭션 안에서 같은 행의 값이 바뀌어 보였어요.'
            phantom:
              - log: 'A: count(1000원 넘는 쿠폰) → 1'
                duo: [{label: A가 본 값, rows: [{k: 첫 count, v: '1'}]}, {label: DB에 커밋된 값, rows: [{k: '1000원 넘는 쿠폰', v: '1개'}]}]
              - log: 'B: insert 3000원 쿠폰, commit'
                duo: [{label: A가 본 값, rows: [{k: 첫 count, v: '1'}]}, {label: DB에 커밋된 값, rows: [{k: '1000원 넘는 쿠폰', v: '2개', mark: changed}]}]
              - log: 'A: count(1000원 넘는 쿠폰) → 2'
                duo: [{label: A가 본 값, rows: [{k: 첫 count, v: '1'}, {k: 둘째 count, v: '2', mark: bad}]}, {label: DB에 커밋된 값, rows: [{k: '1000원 넘는 쿠폰', v: '2개'}]}]
                verdict: '행 하나의 값이 아니라, 조건에 맞는 행의 집합이 바뀌었어요.'
      - quiz:
          q: '재고 화면이 B가 아직 커밋하지 않은 "재고 0"을 읽어 품절로 보였는데, B는 롤백했어요. 어떤 이상 현상인가요?'
          options:
            - 'Dirty Read'
            - 'Non-Repeatable Read'
            - 'Phantom Read'
          answer: 1
          explain: '커밋되지 않은 값을 읽은 것이 Dirty Read예요. B가 롤백해서 재고 0은 한 번도 확정된 적이 없어요.'
      - next: '세 현상을 격리 수준이 하나씩 막아요. 어떤 수준이 무엇을 막을까요?'
    recall: '격리가 약하면 남의 트랜잭션이 바꾼 값이 내 트랜잭션 중간에 보여요. 커밋 전 값을 읽는 Dirty Read, 같은 행을 다시 읽으면 값이 다른 Non-Repeatable Read, 같은 조건으로 다시 세면 행 수가 다른 Phantom Read가 있어요. 격리 수준은 이것을 얼마나 막을지 고르는 단계예요.'
  - id: q2
    title: 격리 수준 네 가지는 각각 무엇을 막나요?
    conclusion:
      lead: 'SQL 표준은 READ UNCOMMITTED, READ COMMITTED, REPEATABLE READ, SERIALIZABLE 순으로 이상 현상을 하나씩 더 막아요.'
      sub: '하지만 실제 DB는 표준보다 더 막기도 해요. PostgreSQL은 Dirty Read를 어느 수준에서도 허용하지 않고, REPEATABLE READ에서 Phantom Read까지 막아요.'
    says:
      - '표준의 표: READ UNCOMMITTED는 셋 다 허용, READ COMMITTED는 Dirty만 막음, REPEATABLE READ는 Phantom만 허용, SERIALIZABLE은 셋 다 막음'
      - 'PostgreSQL의 표를 옆에 둔다. READ UNCOMMITTED로 열어도 READ COMMITTED처럼 동작한다. B의 커밋 전 값을 A가 읽지 못하는 것을 실제로 보인다'
      - 'PostgreSQL의 REPEATABLE READ에서 B가 조건에 맞는 행을 넣고 커밋해도 A의 `count(*)`는 그대로다. 표준은 허용하지만 PostgreSQL은 막는다. 실제로 보인다'
      - '그래서 "격리 수준 X는 Y를 막는다"는 DB와 버전을 붙여서 말한다'
      - '더 알아보기: SERIALIZABLE은 트랜잭션들을 한 줄로 차례로 돌린 것과 같은 결과만 남기고, 그렇게 설명할 수 없으면 한쪽을 40001로 실패시킨다. 가장 안전하고 다시 시도가 가장 잦다'
    widget:
      kind: classify
      note: '상황(이상 현상) 여러 개를 "PostgreSQL READ COMMITTED에서 생긴다"와 "생기지 않는다"로 나눈다. 예: 커밋 전 값 읽기, 같은 행 다시 읽기, 같은 조건 다시 세기, 원자적 UPDATE 두 개의 결과'
    asks:
      - '본문의 예시: PostgreSQL에서 `begin isolation level read uncommitted`로 연 A는 B의 커밋 전 값을 읽을 수 있나 (없다. READ COMMITTED처럼 동작한다)'
      - '옮긴 상황: SQL 표준의 REPEATABLE READ에서 허용되는 이상 현상은 무엇인가 (Phantom Read)'
    body:
      - p: 'SQL 표준은 격리 수준 네 가지를 정하고, 수준마다 허용하는 이상 현상을 정했어요. 아래로 갈수록 더 막아요.'
      - table:
          head: [격리 수준, Dirty Read, Non-Repeatable Read, Phantom Read]
          rows:
            - ['READ UNCOMMITTED', '생김', '생김', '생김']
            - ['READ COMMITTED', '막음', '생김', '생김']
            - ['REPEATABLE READ', '막음', '막음', '생김']
            - ['SERIALIZABLE', '막음', '막음', '막음']
      - p: '그런데 표준은 "적어도 이만큼은 막아라"는 최소한이에요. 실제 DB는 더 막기도 해요. PostgreSQL은 두 군데가 달라요.'
      - ul:
          - '**READ UNCOMMITTED로 열어도 READ COMMITTED처럼 동작해요.** Dirty Read가 어느 수준에서도 없어요.'
          - '**REPEATABLE READ에서 Phantom Read도 막아요.**'
      - ci:
          key: dirty
          label: READ UNCOMMITTED로 연 A의 실제 결과
          source: IsolationLessonTest.noDirtyRead
      - ci:
          key: phantom
          label: Phantom Read의 실제 결과
          source: IsolationLessonTest.phantom
          code: phantom
      - p: 'READ COMMITTED에서는 다시 센 수가 늘었고, REPEATABLE READ에서는 그대로였어요. 표준이라면 REPEATABLE READ도 늘 수 있지만 PostgreSQL은 막았어요.'
      - callout: '"격리 수준 X는 Y를 막는다"는 **DB와 버전을 붙여서** 말해요. 같은 이름이라도 DB마다 막는 것이 달라요.'
      - more:
          summary: '더 알아보기: SERIALIZABLE'
          body:
            - p: 'SERIALIZABLE은 트랜잭션들을 한 줄로 차례로 돌린 것과 같은 결과만 남겨요. 그렇게 설명할 수 없는 결과가 생기려 하면 한쪽을 40001 오류로 실패시켜요. 가장 안전하지만 실패와 다시 시도가 가장 잦아요. 질문 4의 더 알아보기에서 한 예를 봐요.'
      - quiz:
          q: 'SQL 표준의 REPEATABLE READ에서 허용되는 이상 현상은 무엇인가요?'
          options:
            - 'Dirty Read'
            - 'Non-Repeatable Read'
            - 'Phantom Read'
          answer: 3
          explain: '표준의 REPEATABLE READ는 Dirty Read와 Non-Repeatable Read를 막고 Phantom Read는 허용해요. PostgreSQL은 이것까지 막아요.'
      - next: '그러면 아무것도 지정하지 않았을 때, 우리 코드는 어느 수준에서 돌고 무엇이 보일까요?'
    recall: 'SQL 표준은 READ UNCOMMITTED, READ COMMITTED, REPEATABLE READ, SERIALIZABLE 순으로 Dirty Read, Non-Repeatable Read, Phantom Read를 하나씩 더 막아요. 표준은 최소한이라 실제 DB는 더 막기도 해요. PostgreSQL은 Dirty Read를 어느 수준에서도 허용하지 않고, REPEATABLE READ에서 Phantom Read까지 막아요.'
  - id: q3
    title: 기본값인 READ COMMITTED에서는 무엇이 보이나요?
    conclusion:
      lead: 'READ COMMITTED는 문장을 실행하는 순간까지 커밋된 값을 봐요. 그래서 같은 트랜잭션 안에서도 문장마다 다른 값을 볼 수 있어요.'
      sub: 'PostgreSQL과 오라클의 기본값이에요. 커밋 전 값은 안 보이지만, Non-Repeatable Read와 Phantom Read는 생겨요.'
    says:
      - 'PostgreSQL의 기본 격리 수준을 `show transaction_isolation`으로 보인다'
      - '예측의 답을 밝힌다. 코드 predict에서 A의 두 번째 읽기는 50이다. A의 각 문장은 그 문장이 시작할 때의 스냅샷을 본다. 실제 출력을 보인다'
      - '같은 순서로 B가 행을 넣고 커밋하면 A의 두 번째 `count(*)`가 하나 늘어난다. Phantom Read다'
      - '대부분의 요청은 이것으로 충분하다. 문장 하나 안에서는 일관된 값을 보고, 커밋된 최신 값을 읽는다. 문제는 한 트랜잭션에서 여러 번 읽고 그 값들이 서로 맞아야 할 때다(정산, 보고서)'
      - 'MySQL InnoDB의 기본은 REPEATABLE READ다. 같은 스프링 코드를 다른 DB에서 돌리면 보이는 값이 다를 수 있다(MySQL 문서 근거)'
    asks:
      - '본문의 예시: READ COMMITTED에서 A가 쿠폰 수를 센 뒤 B가 쿠폰을 넣고 커밋했다. A가 같은 트랜잭션에서 다시 세면 (하나 늘어난 수. Phantom Read)'
      - '옮긴 상황: 월말 보고서가 한 트랜잭션에서 "전체 잔액 합계"를 구한 뒤 "계좌별 잔액 목록"을 읽는다. READ COMMITTED에서 그 사이 이체가 커밋되면 생길 수 있는 일은 (목록의 합이 먼저 구한 합계와 다르다)'
    body:
      - p: 'PostgreSQL의 기본 격리 수준은 **READ COMMITTED**예요(예전 테스트 [IsolationLevelTest](link:oldTest)가 `show default_transaction_isolation`으로 확인해요). 처음 예측의 코드를 실제로 돌렸어요.'
      - ci:
          key: read-committed
          label: 실제 결과 보기
          source: IsolationLessonTest.readCommittedVsRepeatableRead
          code: predict
      - p: '답은 **50**이에요. {{predict-result}} READ COMMITTED는 **문장을 실행하는 순간까지 커밋된 값**을 봐요. A의 두 번째 SELECT가 시작할 때 B는 이미 커밋했으니 50이 보여요. 같은 트랜잭션 안에서 같은 행의 값이 바뀌었어요. Non-Repeatable Read예요. 질문 2에서 본 것처럼 Phantom Read도 생겨요.'
      - p: '대부분의 요청은 이것으로 충분해요. 문장 하나 안에서는 일관된 값을 보고, 커밋된 최신 값을 읽어요. 문제는 **한 트랜잭션에서 여러 번 읽고, 그 값들이 서로 맞아야 할 때**예요. 월말 정산이 합계를 먼저 구하고 목록을 나중에 읽는 사이에 이체가 커밋되면, 목록의 합이 합계와 달라져요.'
      - callout: '**MySQL(InnoDB)의 기본은 REPEATABLE READ예요.** 같은 스프링 코드라도 DB를 바꾸면 보이는 값이 달라질 수 있어요([MySQL 문서](link:mysql)).'
      - quiz:
          q: 'READ COMMITTED에서 A가 쿠폰 수를 센 뒤 B가 조건에 맞는 쿠폰을 넣고 커밋했어요. A가 같은 트랜잭션에서 다시 세면?'
          options:
            - '처음과 같은 수'
            - '하나 늘어난 수'
            - '오류가 난다'
          answer: 2
          explain: 'READ COMMITTED는 문장마다 그 순간까지 커밋된 값을 봐서 B가 넣은 쿠폰이 보여요. Phantom Read예요.'
      - next: '같은 트랜잭션 안에서 처음 본 값을 계속 보고 싶으면 격리 수준을 올리면 돼요. 대신 무엇이 생길까요?'
    recall: 'READ COMMITTED는 문장을 실행하는 순간까지 커밋된 값을 봐요. 그래서 같은 트랜잭션 안에서도 문장마다 다른 값을 볼 수 있어요. PostgreSQL과 오라클의 기본값이고, 커밋 전 값은 안 보이지만 Non-Repeatable Read와 Phantom Read는 생겨요. MySQL InnoDB의 기본은 REPEATABLE READ예요.'
  - id: q4
    title: REPEATABLE READ는 무엇을 막고, 대신 무엇이 생기나요?
    conclusion:
      lead: 'REPEATABLE READ는 트랜잭션의 첫 문장 때 만든 스냅샷을 끝까지 봐서, 다른 트랜잭션이 그 뒤에 커밋한 변경이 보이지 않아요.'
      sub: '대신 남이 먼저 고치고 커밋한 행을 내가 고치려 하면 PostgreSQL은 직렬화 오류(40001)로 실패시켜요. 앱은 트랜잭션을 처음부터 다시 시도해야 해요.'
    says:
      - '코드 rr은 코드 predict를 REPEATABLE READ로 연 것이다. A의 두 번째 읽기도 100이다. 실제 출력을 보인다'
      - '스냅샷은 "그 순간까지 커밋된 것만 보이는 사진"이다. 트랜잭션 시작 때가 아니라 첫 문장을 실행할 때 찍는다. 스냅샷을 어떻게 만드는지는 MVCC(D13)'
      - 'A가 스냅샷의 100을 보고 kim의 행을 고치려 하는데, B가 그 행을 이미 고쳐 커밋했다. A가 고치면 B의 수정을 모르고 덮어쓴다. PostgreSQL은 이것을 막으려고 A의 UPDATE를 `could not serialize access due to concurrent update`(40001)로 실패시킨다. 실제 오류를 보인다'
      - '그래서 REPEATABLE READ 이상을 쓰면 40001을 받았을 때 트랜잭션 전체를 다시 시도하는 코드가 함께 있어야 한다(실무에서는)'
      - '더 알아보기: 쓰기 치우침. 당직 의사 둘이 "당직이 2명 이상이면 나는 빠진다"를 동시에 실행해 둘 다 빠진다. 서로 다른 행을 고쳐서 REPEATABLE READ로는 막히지 않는다. SERIALIZABLE로 돌리면 한쪽이 40001로 실패한다. 실제로 보인다'
    asks:
      - '본문의 예시: REPEATABLE READ의 A가 kim의 잔액 100을 읽은 뒤 B가 kim의 잔액을 고치고 커밋했다. A가 kim의 행을 UPDATE하면 (40001 직렬화 오류로 실패한다)'
      - '옮긴 상황: 보고서 트랜잭션을 REPEATABLE READ로 바꿨다. 이 트랜잭션은 읽기만 한다. 직렬화 오류를 걱정해야 하나 (읽기만 하면 40001이 나지 않는다. 다른 행을 고치는 트랜잭션이 따로 실패할 일도 없다)'
    body:
      - p: '같은 순서를 A만 REPEATABLE READ로 열어 다시 돌렸어요.'
      - ci:
          key: repeatable-read
          label: 실제 결과 보기
          source: IsolationLessonTest.readCommittedVsRepeatableRead
          code: rr
      - p: 'A의 두 번째 읽기도 **100**이에요. REPEATABLE READ는 트랜잭션의 **첫 문장을 실행할 때 스냅샷**을 찍고, 끝까지 그 스냅샷을 봐요. 스냅샷은 "그 순간까지 커밋된 것만 보이는 사진"이에요. DB가 이것을 어떻게 만드는지는 심화 레슨 MVCC(D13)에서 다뤄요.'
      - h3: '대가: 직렬화 오류'
      - p: '이번에는 A가 100을 본 뒤, 이미 B가 고치고 커밋한 그 행을 A도 고치려 해요.'
      - ci:
          key: serialization
          label: 실제 결과 보기
          source: IsolationLessonTest.serializationFailure
      - p: 'A는 스냅샷의 100을 보고 있어요. 그대로 고치게 두면 B의 수정을 모르고 덮어쓰게 돼요. 그래서 PostgreSQL은 A의 UPDATE를 **40001 오류**(`could not serialize access due to concurrent update`)로 실패시켜요.'
      - callout: '**REPEATABLE READ 이상을 쓰면 40001을 받았을 때 트랜잭션 전체를 처음부터 다시 시도하는 코드가 함께 있어야 해요.** 실무 구역에서 봐요. 읽기만 하는 트랜잭션은 40001이 나지 않아요.'
      - more:
          summary: '더 알아보기: REPEATABLE READ로도 막지 못하는 쓰기 치우침'
          body:
            - p: '당직 의사 alice와 bob이 "당직이 2명 이상이면 나는 빠진다"를 동시에 실행해요. 둘 다 2명을 보고, 각자 **자기 행만** 고쳐요. 서로 다른 행이라 REPEATABLE READ의 직렬화 오류에 걸리지 않아요.'
            - ci:
                key: write-skew
                label: 두 격리 수준의 실제 결과
                source: IsolationLessonTest.writeSkew
            - p: 'REPEATABLE READ에서는 당직이 0명이 됐어요. 이것을 **쓰기 치우침**이라고 해요. SERIALIZABLE은 "차례로 돌렸다면 이렇게 될 수 없다"를 알아채고 bob을 40001로 실패시켰어요.'
      - quiz:
          q: 'REPEATABLE READ의 A가 kim의 잔액을 읽은 뒤, B가 kim의 잔액을 고치고 커밋했어요. A가 kim의 행을 UPDATE하면?'
          options:
            - 'A의 스냅샷 값에 더해 성공한다'
            - '40001 직렬화 오류로 실패한다'
            - 'B가 커밋할 때까지 기다린 뒤 성공한다'
          answer: 2
          explain: 'A의 스냅샷 뒤에 B가 고친 행을 A가 고치려 하면, B의 수정을 덮어쓰지 않게 PostgreSQL이 40001로 실패시켜요.'
      - next: '격리 수준을 올리면 같은 값을 계속 봐요. 그러면 두 요청이 같은 값을 고칠 때의 문제도 막아 줄까요?'
    recall: 'REPEATABLE READ는 트랜잭션의 첫 문장 때 찍은 스냅샷을 끝까지 봐서, 다른 트랜잭션이 그 뒤에 커밋한 변경이 보이지 않아요. 대신 남이 먼저 고치고 커밋한 행을 내가 고치려 하면 PostgreSQL은 40001 직렬화 오류로 실패시켜요. 그래서 트랜잭션 전체를 다시 시도하는 코드가 함께 있어야 해요.'
  - id: q5
    title: 갱신 손실은 격리 수준으로 막히나요?
    conclusion:
      lead: 'READ COMMITTED에서 "읽고, 앱에서 계산하고, 쓰기"를 하면 두 수정 가운데 하나가 사라져요. 격리 수준의 기본값은 이것을 막지 않아요.'
      sub: '`balance = balance + 50`처럼 계산을 UPDATE 안에서 하면 READ COMMITTED에서도 맞아요. 앱에서 계산해야 하면 락(D10)을 써요.'
    says:
      - '코드 lostUpdate: A와 B가 둘 다 100을 읽고, A는 +50으로 150을, B는 +30으로 130을 쓴다. 결과는 180이 아니라 130이다. A의 수정이 사라졌다. 실제 출력을 보인다'
      - '코드 atomic처럼 계산을 UPDATE 안에서 하면 B의 UPDATE는 A가 잡은 행 락 때문에 A의 커밋을 기다린다. A가 커밋하면 B는 그 행을 다시 읽어 최신 값에 더한다. 결과 180이다. 실제 출력을 보인다'
      - '같은 원자적 UPDATE도 REPEATABLE READ에서는 A가 커밋한 뒤 B가 40001로 실패한다. 다시 시도해야 한다. 실제 오류를 보인다'
      - '앱에서 계산해야 하는 경우(할인 규칙, 외부 API 결과)에는 원자적 UPDATE로 바꿀 수 없다. 이때 쓰는 것이 낙관적 락과 비관적 락이다(D10)'
    asks:
      - '본문의 예시: READ COMMITTED에서 A와 B가 동시에 `update account set balance = balance + 50`을 실행하고 각자 커밋한다. 처음 잔액이 100이면 결과는 (200)'
      - '옮긴 상황: 조회수를 `select views` → 자바에서 +1 → `update ... set views = ?`로 올린다. 동시에 요청 10개가 오면 (10보다 적게 오를 수 있다. 갱신 손실. `set views = views + 1`로 고친다)'
    body:
      - p: 'A와 B가 둘 다 잔액 100을 읽어요. A는 앱에서 50을 더해 150을 쓰고, B는 30을 더해 130을 써요. 둘 다 READ COMMITTED예요.'
      - code: lostUpdate
      - ci:
          key: lost-update
          label: 두 방법의 실제 결과
          source: IsolationLessonTest.lostUpdateVsAtomic
      - p: '첫 줄을 보세요. 180이어야 하는데 **130**이에요. A의 +50이 사라졌어요. 이것을 **갱신 손실**이라고 해요. 오류도 경고도 없어요. 기본 격리 수준은 이것을 막지 않아요.'
      - p: '둘째 줄은 계산을 UPDATE 안에서 한 경우예요.'
      - code: atomic
        notes:
          - mark: balance + 50
            as: code
            text: 'DB가 행의 지금 값에서 더해요. 앱이 읽은 값을 쓰지 않아요.'
      - p: 'UPDATE는 고친 행을 커밋까지 잠가요. 그래서 B의 UPDATE는 **A가 커밋할 때까지 기다렸다가**, 커밋된 최신 값(150)을 다시 읽어 30을 더해요. 결과는 **180**이에요. 위 결과에서 B가 기다린 시간이 보여요. 이렇게 읽기와 계산과 쓰기를 한 문장으로 하는 것을 **원자적 UPDATE**라고 해요.'
      - p: '같은 원자적 UPDATE도 REPEATABLE READ에서는 A가 커밋한 뒤 B가 40001로 실패해요(질문 4와 같은 이유). 다시 시도해야 해요.'
      - p: '계산을 앱에서 해야 하는 경우도 있어요. 할인 규칙을 적용하거나, 외부 결제 결과로 상태를 바꿀 때예요. 그때는 한 문장으로 바꿀 수 없어서 락을 써요. [낙관적 락과 비관적 락](lesson:locking)에서 다뤄요.'
      - quiz:
          q: '조회수를 `select views` → 자바에서 +1 → `update ... set views = ?`로 올려요. READ COMMITTED에서 동시에 요청 10개가 오면?'
          options:
            - '정확히 10 오른다'
            - '10보다 적게 오를 수 있다'
            - '오류가 난다'
          answer: 2
          explain: '같은 값을 읽은 요청들이 같은 값을 써서 서로의 +1을 덮어써요. 갱신 손실이에요. `set views = views + 1`로 고쳐요.'
    recall: 'READ COMMITTED에서 "읽고, 앱에서 계산하고, 쓰기"를 하면 두 수정 가운데 하나가 사라지는 갱신 손실이 생기고, 기본 격리 수준은 이것을 막지 않아요. balance = balance + 50처럼 계산을 UPDATE 안에서 하면 행 락 때문에 뒤 트랜잭션이 기다렸다가 최신 값에 더해서 맞아요. 앱에서 계산해야 하면 락을 써요.'
practice:
  says:
    - '스프링에서는 코드 spring처럼 `@Transactional(isolation = Isolation.REPEATABLE_READ)`로 트랜잭션마다 격리 수준을 정한다. 기본값 `Isolation.DEFAULT`는 DB의 기본값을 쓴다. 테스트로 그 트랜잭션 안에서 `show transaction_isolation`을 읽어 보인다'
    - '보고서처럼 읽기만 하는 트랜잭션에 `readOnly = true`를 함께 쓰면 PostgreSQL에 읽기 전용으로 열려 실수로 쓰는 것을 막는다(스프링 문서 근거)'
    - '흔한 실수: 격리 수준을 REPEATABLE READ로 올리고 다시 시도 코드를 두지 않는다. 동시 수정이 있으면 사용자가 오류를 받는다. 스프링은 40001을 `CannotAcquireLockException`(또는 `ConcurrencyFailureException`의 하위 예외)로 바꾼다. 테스트로 예외 클래스를 확인하고, 다시 시도하는 고친 코드를 보인다'
    - '격리 수준은 연결마다 정해진다. 커넥션 풀에서 꺼낸 연결에 스프링이 격리 수준을 바꿨다가 돌려줄 때 되돌린다(D6의 풀)'
  title: 스프링에서는 이렇게 써요
  body:
    - p: '스프링에서는 트랜잭션마다 격리 수준을 정해요. 기본값 `Isolation.DEFAULT`는 DB의 기본값(PostgreSQL은 READ COMMITTED)을 써요.'
    - code: spring
      notes:
        - mark: 'Isolation.REPEATABLE_READ)'
          as: code
          text: '이 메서드의 트랜잭션만 REPEATABLE READ로 열어요. 합계와 목록을 같은 스냅샷에서 읽어 서로 맞아요.'
    - p: '스프링이 정말 연결의 격리 수준을 바꾸는지, 40001이 어떤 예외로 오는지 같은 설정의 `TransactionTemplate`으로 확인했어요.'
    - ci:
        key: spring
        label: 실제 결과 보기
        source: IsolationLessonTest.springIsolation
    - p: '트랜잭션 안에서만 REPEATABLE READ이고, 끝나면 연결이 원래대로 돌아가요. 커넥션 풀의 연결을 빌려 바꿨다가 돌려줄 때 되돌리는 거예요([DB 커넥션과 커넥션 풀](lesson:connection-pool)).'
    - p: '보고서처럼 읽기만 하는 트랜잭션에는 `readOnly = true`를 함께 쓰면 PostgreSQL에 읽기 전용 트랜잭션으로 열려, 실수로 쓰는 문장을 막아요.'
    - h3: '흔한 실수: 격리 수준만 올리고 다시 시도는 없음'
    - p: '격리 수준을 REPEATABLE READ로 올리고 끝내면, 동시에 같은 행을 고치는 요청이 있을 때 사용자가 오류 화면을 봐요. 스프링은 40001을 `CannotAcquireLockException`으로 바꿔 던져요. 트랜잭션 **바깥**에서 잡아 처음부터 다시 실행해요. 트랜잭션 안에서 잡으면 이미 실패한 트랜잭션이라 소용이 없어요.'
    - code: retry
      notes:
        - mark: CannotAcquireLockException
          as: code
          text: '`ConcurrencyFailureException`의 하위 예외예요. 상위 클래스로 잡아도 돼요.'
    - muted: '근거: `isolation`과 `readOnly`는 [스프링 문서](link:springTx). 연결의 격리 수준과 예외 클래스는 테스트로 확인했어요.'
interview:
  question: 트랜잭션 격리 수준과 이상 현상을 설명해 주세요
  model:
    - label: 정의
      text: 격리 수준은 동시에 도는 트랜잭션이 서로의 변경을 얼마나 보는지 정합니다. 이상 현상에는 커밋 전 값을 읽는 Dirty Read, 같은 행을 다시 읽으면 값이 다른 Non-Repeatable Read, 같은 조건의 행 수가 달라지는 Phantom Read가 있고, 표준은 READ UNCOMMITTED부터 SERIALIZABLE까지 하나씩 더 막습니다.
    - label: 원리
      text: PostgreSQL의 기본인 READ COMMITTED는 문장마다 그 순간 커밋된 값을 보고, REPEATABLE READ는 첫 문장 때의 스냅샷을 끝까지 봅니다. PostgreSQL은 Dirty Read를 허용하지 않고 REPEATABLE READ에서 Phantom Read도 막아 표준보다 엄격합니다.
    - label: 주의할 점
      text: 격리 수준을 올리면 동시 수정이 40001 직렬화 오류로 실패하니 트랜잭션 전체를 다시 시도해야 합니다. 읽고 계산해서 쓰는 갱신 손실은 기본 수준에서 막히지 않으므로 원자적 UPDATE나 락으로 막습니다. DB마다 기본값이 달라 MySQL InnoDB는 REPEATABLE READ입니다.
    - label: 경험
      text: '(내 프로젝트로 채우기) 예: 월말 보고서의 합계와 목록이 가끔 맞지 않는 문제를 REPEATABLE READ와 readOnly로 고쳤습니다.'
verified: 이 레슨의 결과는 짐작이 아니라 PostgreSQL 16 컨테이너에 연결 두 개를 열고 문장 순서를 맞춰 실행해 받은 값이에요. 스프링 쪽은 스프링 부트 3.5의 `TransactionTemplate`으로 확인했어요. 코드가 바뀔 때마다 테스트([IsolationLessonTest](link:test), [IsolationLevelTest](link:oldTest))가 다시 돌아요.
footer: '근거: 격리 수준과 이상 현상, PostgreSQL이 표준과 다른 점은 [PostgreSQL 16 문서](link:iso), MySQL의 기본값은 [MySQL 문서](link:mysql), 스프링의 격리 수준 설정은 [스프링 문서](link:springTx). 결과는 PostgreSQL 16에서 테스트로 확인했어요. 오류는 [GitHub 이슈](https://github.com/wanja727/dev-lessons/issues)로 알려 주세요.'
claims:
  - claim: 'PostgreSQL의 기본 격리 수준은 READ COMMITTED'
    how: '`show transaction_isolation`'
    test: 'IsolationLevelTest'
  - claim: 'READ UNCOMMITTED로 열어도 커밋 전 값은 보이지 않는다'
    how: '연결 두 개로 순서를 맞춰 실행한다'
    test: 'IsolationLevelTest'
  - claim: 'READ COMMITTED는 Non-Repeatable Read와 Phantom Read가 생긴다'
    how: '같은 방법'
    test: 'IsolationLevelTest'
  - claim: 'REPEATABLE READ는 첫 스냅샷을 계속 보고 Phantom Read도 막는다'
    how: '같은 방법'
    test: 'IsolationLevelTest'
  - claim: '읽고 계산해서 쓰면 READ COMMITTED에서 갱신 손실이 생기고, 원자적 UPDATE는 정확하다'
    how: '같은 방법'
    test: 'IsolationLevelTest'
  - claim: 'REPEATABLE READ에서 먼저 커밋된 행을 UPDATE하면 40001로 실패한다'
    how: 'SQLState를 본다'
    test: 'IsolationLevelTest'
  - claim: '쓰기 치우침은 REPEATABLE READ에서 생기고 SERIALIZABLE에서 40001로 막힌다'
    how: '당직 예제를 두 연결로 실행한다. 새로 더한다'
  - claim: '스프링의 `@Transactional(isolation)`이 연결의 격리 수준을 바꾸고, 40001은 스프링 예외로 바뀐다'
    how: '`TransactionTemplate`에 격리 수준을 주고 `show transaction_isolation`과 예외 클래스를 본다. 새로 더한다'
sources:
