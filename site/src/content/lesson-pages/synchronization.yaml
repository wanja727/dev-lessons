# 경쟁 상태와 동기화
# 자료 파일의 칸은 docs/lesson-data-format.md에 있다. 문제는 content/questions/synchronization.yaml에 있다.
title: 경쟁 상태와 동기화
description: 경쟁 상태는 무엇이고 어떤 코드에서 생기는지, 원자성과 가시성은 무엇이고 volatile은 어느 것을 막는지, synchronized와 AtomicInteger는 어떻게 막는지. 같은 카운터를 네 가지로 바꿔 두 스레드로 100만 번씩 올려 보며 배우는 대화형 레슨.
unit: 운영체제와 동시성
minutes: 22
roadmap: C3
type: 자바 실행
prerequisites:
  - {slug: process-and-thread, title: 프로세스와 스레드}
assume: '자바 21(OpenJDK). 스레드는 힙과 static 필드를 함께 쓰고, `count++`가 겹치면 갱신이 사라진다는 것(프로세스와 스레드 레슨).'
example: '방문 수를 세는 `Counter`의 `count++`와, 작업을 멈추라고 알리는 `running` 플래그. 같은 카운터를 아무것도 없이, `volatile`로, `synchronized`로, `AtomicInteger`로 바꿔 가며 두 스레드로 돌려요. 실무 구역에서는 싱글톤 서비스의 필드와 서버 여러 대로 옮겨요.'
intro:
  - '쿠폰 발급 수를 서비스의 필드로 세고 있었어요. 값이 가끔 틀린다는 말에 필드에 `volatile`을 붙였는데 여전히 틀려요. 다른 팀원은 메서드에 `synchronized`를 붙이자고 하고, 또 다른 팀원은 `AtomicInteger`를 쓰자고 해요.'
  - '여러 스레드가 함께 쓰는 값을 다룰 때 자바는 도구를 여러 개 줘요. 도구마다 막는 문제가 달라서, 문제를 원자성과 가시성 둘로 나눠 보면 무엇을 써야 할지 정해져요. 면접에서 "`volatile`과 `synchronized`의 차이"를 묻는 것도 이 구분이에요.'
  - '이 레슨에서는 같은 카운터를 네 가지로 바꿔 두 스레드로 100만 번씩 올려 보고, 다른 스레드가 바꾼 플래그를 읽는 문제를 돌려 보며 도구마다 무엇을 막는지 확인해요.'
covers:
  - topic: '경쟁 상태: 결과가 스레드의 실행 순서에 따라 달라지는 상황. 임계 영역: 함께 쓰는 값을 고치는 코드 구간'
    where: '질문 1'
  - topic: '읽고-고치고-쓰기(count++)와 확인하고-행동하기(if 없으면 넣기)가 대표적인 경쟁 상태다'
    where: '질문 1'
  - topic: 'static 필드와 람다에서 바꾸는 필드를 여러 스레드가 고치면 같은 문제가 생긴다'
    where: '질문 1. J5, J12에서 받은 항목'
  - topic: '원자성: 연산이 중간에 끼어들 수 없게 한 덩어리로 실행되는 것'
    where: '질문 2'
  - topic: '가시성: 한 스레드가 쓴 값을 다른 스레드가 언제 보는가. CPU 캐시와 컴파일러 최적화 때문에 못 볼 수 있다'
    where: '질문 2'
  - topic: 'volatile은 가시성만 보장하고 원자성은 보장하지 않는다. 플래그 하나를 알리는 데 맞다'
    where: '질문 2'
  - topic: 'happens-before: 자바 메모리 모델이 "앞의 쓰기를 뒤의 읽기가 본다"고 약속하는 관계'
    where: '질문 2의 더 알아보기'
  - topic: '이중 검사 잠금(double-checked locking)으로 싱글톤을 만들 때 instance 필드에 volatile이 필요한 이유'
    where: '질문 3의 더 알아보기. O11에서 받은 항목'
  - topic: 'synchronized: 같은 락(모니터)을 잡은 스레드 하나만 들어간다. 원자성과 가시성을 함께 준다'
    where: '질문 3'
  - topic: '락 객체가 다르면 아무것도 막지 못한다. 인스턴스 메서드는 this, static 메서드는 클래스 객체가 락이다'
    where: '질문 3'
  - topic: 'synchronized는 재진입할 수 있다'
    where: '질문 3의 더 알아보기'
  - topic: 'StringBuffer는 메서드가 synchronized이고 StringBuilder는 아니다'
    where: '질문 3. J4에서 받은 항목'
  - topic: '원자적 연산: AtomicInteger와 CAS(compareAndSet). 락 없이 기대한 값일 때만 바꾸고 실패하면 다시 한다'
    where: '질문 4'
  - topic: '값 하나는 Atomic, 여러 값을 함께 바꾸거나 여러 줄을 묶으려면 synchronized'
    where: '질문 4'
  - topic: '많은 스레드가 하나를 세면 LongAdder'
    where: '질문 4의 더 알아보기'
  - topic: 'synchronized는 JVM 하나 안에서만 막는다. 서버가 여러 대면 DB나 분산 락이 필요하다'
    where: '실무에서는. 재고는 동시 요청에서 재고 지키기(A7), 분산 락(A12)'
  - topic: 'ReentrantLock, 세마포어'
    where: '다루지 않음: 뮤텍스와 세마포어(C4)'
  - topic: '락을 여러 개 잡을 때 서로 기다리는 문제'
    where: '다루지 않음: 데드락(C5)'
  - topic: 'ConcurrentHashMap, 불변 객체, ThreadLocal'
    where: '다루지 않음: 스레드에 안전한 객체(C6)'
codes:
  predict: |-
    static volatile int count = 0;

    Runnable inc = () -> {
      for (int i = 0; i < 1_000_000; i++)
        count++;
    };
    // 스레드 둘이 inc를 실행하고
    // 둘 다 끝난 뒤 count를 출력한다
  checkThenAct: |-
    if (!issued.contains(userId)) {
      issued.add(userId);
      couponCount++;
    }
  flag: |-
    static volatile boolean running = true;

    // 일하는 스레드
    while (running) {
      work();
    }

    // main 스레드
    running = false;
  syncCounter: |-
    class Counter {
      private int count = 0;

      synchronized void inc() {
        count++;
      }
    }
  wrongLock: |-
    void inc() {
      synchronized ([[new Object()]]) {
        count++;
      }
    }
  atomic: |-
    AtomicInteger count =
        new AtomicInteger();

    count.incrementAndGet();
  cas: |-
    int old, next;
    do {
      old = count.get();
      next = old + 1;
    } while (!count.compareAndSet(old, next));
  serviceCounter: |-
    @Service
    class CouponService {
      private int issued = 0;

      void issue() {
        issued++;
      }
    }
  serviceFixed: |-
    @Service
    class CouponService {
      private final AtomicLong issued =
          new AtomicLong();

      void issue() {
        issued.[[incrementAndGet()]];
      }
    }
