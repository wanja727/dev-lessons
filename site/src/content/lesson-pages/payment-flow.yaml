# 결제 시스템 흐름
# 자료 파일의 칸은 docs/lesson-data-format.md에 있다. 문제는 content/questions/payment-flow.yaml에 있다.
# 심화 레슨. 설계 칸과 본문을 한 번에 썼다 (이번 작업의 설계 승인은 사용자가 미리 맡겼다)
title: 결제 시스템 흐름
description: 카드 결제가 준비, 승인, 매입, 정산을 거치는 흐름과 상태, 승인 응답이 타임아웃일 때의 망 취소, 부분 취소의 한도와 동시 요청, 우리 기록과 PG 내역을 맞추는 대사. 가짜 PG로 결제를 흘려 보는 대화형 레슨.
unit: 시스템 설계와 아키텍처
minutes: 25
roadmap: A20
type: 동작 확인
prerequisites:
  - {slug: idempotency, title: 멱등성과 중복 요청 방지}
  - {slug: resilience, title: '타임아웃, 재시도, 서킷 브레이커'}
  - {slug: saga, title: 분산 트랜잭션과 사가}
assume: '스프링 부트 3.5, PostgreSQL 16. 멱등 키(멱등성과 중복 요청 방지 레슨), 타임아웃은 모름이라는 것(타임아웃, 재시도, 서킷 브레이커 레슨), 보상 트랜잭션(분산 트랜잭션과 사가 레슨), 조건부 UPDATE(동시 요청에서 재고 지키기 레슨). 금액을 double로 다루면 안 되는 이유는 숫자 타입의 한계 레슨에서 다뤘어요.'
example: '쇼핑몰의 카드 결제. 우리 서버가 PG(결제 대행사)에 승인과 매입, 취소를 요청한다. PG는 응답을 늦출 수 있는 가짜다. 결제 10,000원을 승인하고, 일부를 취소하고, 하루가 끝나면 PG 내역과 맞춰 본다.'
intro:
  - '고객이 결제 실패 안내를 받았는데 카드사 앱에는 승인 문자가 와 있어요. 고객센터에 "돈만 빠져나갔다"는 문의가 들어와요. 우리 서버는 PG 응답을 기다리다 타임아웃이 나서 실패로 처리했는데, PG에서는 승인이 끝나 있었어요.'
  - '결제는 한 번의 API 호출이 아니라 상태가 여러 번 바뀌는 흐름이에요. 승인하고, 상품을 보내면 매입하고, 일부를 취소하고, 다음 날 정산 내역과 맞춰 봐요. 커머스와 핀테크의 경력 면접에서 "결제 흐름을 설명해 보세요", "승인과 매입의 차이"를 물어요.'
  - '이 레슨에서는 가짜 PG로 결제를 흘려 보며, 타임아웃을 실패로 단정하면 무엇이 남는지, 망 취소로 어떻게 맞추는지, 부분 취소 두 건이 동시에 오면 어떻게 되는지, 대사가 무엇을 찾아내는지 확인해요.'
covers:
  - topic: '카드 결제의 단계: 준비(주문과 금액 저장), 승인(카드 한도를 잡음), 매입(실제로 청구), 정산(PG가 수수료를 떼고 입금)'
    where: '질문 1'
  - topic: '결제 상태 전이: READY → APPROVED → CAPTURED → (부분) CANCELED. 승인 전에는 매입할 수 없고 매입은 승인 금액을 넘을 수 없다'
    where: '질문 1'
  - topic: '금액은 원 단위 long이나 BigDecimal로 다룬다. double은 오차가 생긴다'
    where: '질문 1. 원리는 숫자 타입의 한계(J19)'
  - topic: '승인 응답이 타임아웃이면 결과를 모른다. 실패로 단정하면 PG에는 승인이 남아 고객 돈이 묶인다'
    where: '질문 2'
  - topic: '망 취소: 결과를 모르는 승인을 바로 취소 요청해 양쪽을 결제 없음으로 맞춘다. 또는 PG에 결과를 조회한다'
    where: '질문 2'
  - topic: '승인 요청에도 주문 번호 같은 멱등 키를 넘겨 재시도에 두 번 승인되지 않게 한다'
    where: '질문 2. 멱등 키는 A6'
  - topic: '부분 취소: 누적 취소액이 결제 금액을 넘을 수 없다'
    where: '질문 3'
  - topic: '부분 취소 두 건이 동시에 오면 조건부 UPDATE로 하나만 통과시킨다'
    where: '질문 3. 원리는 동시 요청에서 재고 지키기(A7)'
  - topic: '대사: 우리 기록과 PG 거래 내역을 주문 번호로 맞춰 금액 차이와 한쪽에만 있는 거래를 찾는다'
    where: '질문 4'
  - topic: '대사에서 찾은 어긋남은 사람이 확인하거나 정해진 규칙으로 고친다'
    where: '질문 4'
  - topic: '결제 상태 테이블과 상태 전이를 조건부 UPDATE로 지키는 코드'
    where: '실무에서는'
  - topic: '여러 서비스에 걸친 주문, 결제, 재고의 보상'
    where: '다루지 않음: 분산 트랜잭션과 사가(A19)'
codes:
  predict: |-
    // PG 응답 500ms, 우리 타임아웃 200ms
    try {
      pg.approve(orderId, 10_000);
      markApproved(orderId);
    } catch (Timeout e) {
      markFailed(orderId);
    }
    // 고객 카드는 어떻게 됐나?
  flow: |-
    READY → APPROVED  (승인)
    APPROVED → CAPTURED  (매입)
    APPROVED → CANCELED  (승인 취소)
    CAPTURED → 부분, 전체 취소
    READY → CAPTURED  (불가)
  netCancel: |-
    try {
      pg.approve(orderId, amount);
      transition(orderId, READY, APPROVED);
    } catch (Timeout e) {
      transition(orderId, READY, UNKNOWN);
      [[pg.netCancel(orderId);]]
      transition(orderId, UNKNOWN, CANCELED);
    }
  partialSql: |-
    update payment
    set canceled_amount =
        canceled_amount + :cancel
    where order_id = :orderId
      and [[canceled_amount + :cancel]]
          [[<= amount]]
  transitionSql: |-
    update payment
    set status = :to
    where order_id = :orderId
      and [[status = :from]]
  reconcile: |-
    for (String id : union(ours, pg)) {
      Row o = ours.get(id);
      Row p = pg.get(id);
      if (o == null) report(id, "PG에만");
      else if (p == null) report(id, "우리만");
      else if (o.amount() != p.amount())
        report(id, "금액 다름");
    }
  doubleMoney: |-
    [[double]] total = 0;
    for (int i = 0; i < 10; i++) {
      total += 0.1; // 10원을 0.1만원으로
    }
    // total == 1.0 ?
  appCancel: |-
    Payment p = payments.find(orderId);
    if (p.getCanceled() + cancel
        > p.getAmount()) {
      throw new OverCancel();
    }
    [[p.setCanceled(p.getCanceled()]]
        [[+ cancel);]]
links:
  test: https://github.com/wanja727/dev-lessons/blob/main/verification/src/test/java/lab/devlessons/payment/PaymentFlowTest.java
  tossFlow: https://docs.tosspayments.com/resources/glossary/card-payment
  stripeHold: https://docs.stripe.com/payments/place-a-hold-on-a-payment-method
  bigDecimal: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/math/BigDecimal.html
predict:
  title: 타임아웃을 실패로 처리하면?
  text: 'PG가 승인에 500ms 걸리는데 우리 서버는 200ms에 타임아웃을 두고, 타임아웃이면 결제를 실패로 저장해요. 끝난 뒤 우리 DB와 PG의 결제 상태는 각각 무엇일까요? 답은 질문 2에 나와요.'
  code: predict
  label: 내 예측
  options:
    - value: bothfail
      label: 우리 FAILED, PG 실패
    - value: orphan
      label: 우리 FAILED, PG APPROVED
    - value: bothok
      label: 우리 APPROVED, PG APPROVED
  answer: orphan
  storageKey: payment-predict
  wrong: 예측은 "{label}"이었어요. 틀린 예측이 더 오래 남으니 괜찮아요.
questions:
  - id: q1
    title: 카드 결제는 어떤 단계를 거치나요?
    conclusion:
      lead: '준비, 승인, 매입, 정산을 거쳐요. 승인은 카드 한도를 잡아 두는 것이고, 매입이 실제로 청구하는 것이에요.'
      sub: '각 단계는 결제 상태로 남고, 정해진 순서로만 바뀌어요. 승인 전에는 매입할 수 없고, 매입은 승인 금액을 넘을 수 없어요.'
    says:
      - '네 단계와 각 단계에서 돈이 어디 있는지'
      - '상태 전이와 테스트: 승인 전 매입 거절, 승인 금액 초과 매입 거절'
      - '금액은 원 단위 long이나 BigDecimal. double은 오차(J19)'
    asks:
      - '본문의 예시: 승인만 하고 매입하지 않은 결제의 고객 카드는 (한도가 잡혀 있지만 청구되지는 않았다)'
      - '옮긴 상황: 10,000원 승인된 결제를 12,000원으로 매입하려 한다 (거절된다. 매입은 승인 금액을 넘을 수 없다)'
    body:
      - table:
          head: [단계, 하는 일, 돈은 어디에]
          rows:
            - ['준비', '우리 DB에 주문 번호와 금액을 저장한다 (READY)', '아직 움직이지 않음']
            - ['승인', 'PG가 카드사에 물어 한도를 잡는다 (APPROVED)', '고객 카드 한도가 줄어듦. 청구는 아직']
            - ['매입', '상품을 보내는 등 확정되면 실제로 청구한다 (CAPTURED)', '고객에게 청구됨']
            - ['정산', 'PG가 수수료를 떼고 우리에게 입금한다', '우리 계좌로']
      - p: '승인과 매입을 한 번에 처리하는 결제도 많지만, 승인과 매입은 뜻이 달라요([토스페이먼츠 카드 결제 용어](link:tossFlow), [Stripe의 승인 후 나중 청구 문서](link:stripeHold)).'
      - p: '단계는 **결제 상태**로 남고, 정해진 순서로만 바뀌어요.'
      - code: flow
      - p: '테스트에서 승인 전에 매입하려 하니 거절됐고, 10,000원 승인에 12,000원 매입도 거절됐어요. 상태를 바꿀 때마다 "지금 이 상태일 때만"이라는 조건을 거는 방법은 실무 구역에서 봐요.'
      - h3: 금액은 정수로
      - p: '금액을 `double`로 다루면 0.1을 열 번 더해도 1.0이 되지 않는 오차가 생겨요([숫자 타입의 한계](lesson:number-limits)). 원화는 원 단위 `long`으로, 소수점이 있는 통화는 `BigDecimal`로 다뤄요([BigDecimal 문서](link:bigDecimal)). 이 레슨의 금액은 모두 원 단위 `long`이에요.'
      - quiz:
          q: '10,000원이 승인된 결제를 12,000원으로 매입하려 해요. 어떻게 되나요?'
          options:
            - '12,000원이 청구된다'
            - '거절된다. 매입은 승인 금액을 넘을 수 없다'
            - '10,000원만 청구되고 나머지는 다음 날 청구된다'
          answer: 2
          explain: '승인은 잡아 둔 한도예요. 그보다 많이 청구할 수 없어요. 테스트에서도 거절됐어요.'
      - next: '승인 요청을 보냈는데 응답이 오지 않으면 결제는 어떤 상태일까요?'
    recall: '카드 결제는 준비(주문과 금액 저장), 승인(카드 한도를 잡음), 매입(실제로 청구), 정산(PG가 수수료를 떼고 입금)을 거쳐요. 각 단계는 READY, APPROVED, CAPTURED, CANCELED 같은 결제 상태로 남고 정해진 순서로만 바뀌어서, 승인 전에는 매입할 수 없고 매입은 승인 금액을 넘을 수 없어요. 금액은 원 단위 long이나 BigDecimal로 다뤄요.'
  - id: q2
    title: 승인 응답이 오지 않으면 어떻게 하나요?
    conclusion:
      lead: '실패로 단정하지 않아요. 결과를 모르는 승인을 바로 취소(망 취소)하거나 PG에 결과를 물어 양쪽을 맞춰요.'
      sub: '실패로 단정하면 우리는 결제 실패인데 PG에는 승인이 남아 고객 돈이 묶여요. 승인 요청에는 주문 번호를 멱등 키로 넘겨 재시도에 두 번 승인되지 않게 해요.'
    says:
      - '타임아웃을 실패로: 우리 FAILED, PG APPROVED. 대사에서 드러난다. 예측의 답'
      - '망 취소: READY → UNKNOWN → CANCELED, PG CANCELED. 어긋남 0건'
      - '승인 재시도에는 멱등 키'
    widget:
      kind: toggle
      note: '타임아웃을 실패로 처리, 망 취소 두 방식을 고르면 우리 DB와 PG의 상태가 나란히 보인다'
    asks:
      - '본문의 예시: 승인 타임아웃을 실패로 처리했다. 우리와 PG의 상태는 (우리 FAILED, PG APPROVED)'
      - '옮긴 상황: 승인 응답이 타임아웃이라 망 취소를 보냈다. 끝난 뒤 대사의 어긋남은 (없다. 양쪽 모두 결제 없음)'
    body:
      - p: '처음 예측의 코드를 돌렸어요.'
      - ci:
          key: orphan
          label: 실제 결과 보기
          source: PaymentFlowTest.timeoutAsFailureLeavesOrphanApproval
          code: predict
      - p: '답은 **우리 FAILED, PG APPROVED**예요. {{predict-result}} 타임아웃은 실패가 아니라 **모름**이에요([타임아웃, 재시도, 서킷 브레이커](lesson:resilience)). PG는 승인을 끝냈고, 우리만 기다리지 않았어요. 고객에게는 "결제 실패"라고 안내했는데 카드 한도는 잡혀 있어요. 도입부의 "돈만 빠져나갔다" 문의가 이것이에요.'
      - h3: 망 취소
      - p: '결과를 모르면 **양쪽을 확실한 상태로 맞춰요.** 가장 흔한 방법은 그 승인을 바로 취소 요청하는 **망 취소**예요. 승인이 됐든 안 됐든 취소하면 양쪽 모두 "결제 없음"이 돼요. 우리 DB에는 결과를 모르는 동안 UNKNOWN을 두어, 그 사이에 실패로도 성공으로도 단정하지 않아요.'
      - code: netCancel
        notes:
          - mark: pg.netCancel(orderId);
            as: code
            text: '결과를 모르는 승인을 바로 취소해요. 사가의 보상과 같은 생각이에요([분산 트랜잭션과 사가](lesson:saga)).'
      - ci:
          key: net-cancel
          label: 실제 결과 보기
          source: PaymentFlowTest.netCancelOnTimeout
      - p: '양쪽 모두 CANCELED가 되어 대사에서 어긋남이 0건이에요. 고객에게는 "결제가 완료되지 않았어요, 다시 시도해 주세요"라고 안내해요. 망 취소 대신 PG에 주문 번호로 결과를 **조회**해서 승인됐으면 이어 가는 방법도 있어요.'
      - p: '다시 승인을 시도할 때는 주문 번호를 **멱등 키**로 넘겨요. PG가 같은 주문 번호의 승인을 두 번 하지 않게요([멱등성과 중복 요청 방지](lesson:idempotency)).'
      - widget:
          kind: toggle
          layout: [selector, duo, verdict]
          selector:
            label: 승인 타임아웃을 다루는 방식
            options:
              - {value: fail, label: 실패로 처리}
              - {value: cancel, label: 망 취소}
          scenes:
            fail:
              duo:
                - {label: 우리 DB, rows: [{k: 상태, v: FAILED}]}
                - {label: PG, rows: [{k: 상태, v: APPROVED, mark: bad}]}
              verdict: '고객 카드 한도가 잡힌 채 남아요. 대사에서 어긋남이 드러나요.'
            cancel:
              duo:
                - {label: 우리 DB, rows: [{k: 상태, v: 'READY → UNKNOWN → CANCELED', mark: changed}]}
                - {label: PG, rows: [{k: 상태, v: CANCELED, mark: changed}]}
              verdict: '양쪽 모두 결제 없음으로 맞춰져요.'
      - quiz:
          q: '승인 응답이 타임아웃이라 망 취소를 보냈고 성공했어요. 그날 대사에서 이 주문은 어떻게 나오나요?'
          options:
            - 'PG에만 승인이 있다'
            - '어긋남이 없다. 양쪽 모두 취소다'
            - '우리에게만 승인이 있다'
          answer: 2
          explain: '망 취소로 PG도 CANCELED, 우리도 CANCELED가 됐어요. 테스트에서도 어긋남 0건이었어요.'
      - next: '결제가 끝난 뒤에도 일부를 취소하는 일이 생겨요. 부분 취소는 무엇을 지켜야 할까요?'
    recall: '승인 응답이 타임아웃이면 결과를 모르는 거라 실패로 단정하지 않아요. 실패로 처리하면 우리는 FAILED인데 PG에는 APPROVED가 남아 고객 한도가 묶여요. 결과를 모르는 동안 UNKNOWN을 두고, 그 승인을 바로 취소하는 망 취소로 양쪽을 결제 없음으로 맞추거나, PG에 결과를 조회해요. 다시 승인할 때는 주문 번호를 멱등 키로 넘겨요.'
  - id: q3
    title: 부분 취소는 무엇을 지켜야 하나요?
    conclusion:
      lead: '누적 취소액이 결제 금액을 넘지 않아야 하고, 부분 취소 두 건이 동시에 와도 그 한도가 지켜져야 해요.'
      sub: '확인하고 더하는 일을 조건부 UPDATE 한 문장으로 해서, 6,000원 취소 두 건이 동시에 와도 하나만 통과시켜요.'
    says:
      - '3,000 + 7,000은 되고 1원 더는 거절'
      - '6,000 + 6,000 동시: 하나만 성공, 누적 6,000. 조건부 UPDATE'
    asks:
      - '본문의 예시: 10,000원 결제에 3,000원, 7,000원을 차례로 부분 취소한 뒤 1원을 더 취소하면 (거절된다)'
      - '옮긴 상황: 10,000원 결제에 6,000원 부분 취소 두 건이 동시에 왔다. 조건부 UPDATE라면 (하나만 성공한다)'
    body:
      - p: '10,000원 결제에서 상품 일부를 반품하면 일부만 취소해요. 지킬 것은 하나예요. **누적 취소액이 결제 금액을 넘으면 안 돼요.** 테스트에서 3,000원, 7,000원을 차례로 취소하니 되고, 1원을 더 취소하니 거절됐어요.'
      - p: '고객이 반품 버튼을 두 번 누르거나 관리자와 고객이 동시에 취소하면 두 건이 동시에 와요. 확인하고 더하는 일을 애플리케이션에서 따로 하면 [동시 요청에서 재고 지키기](lesson:stock-concurrency)의 초과 판매처럼 둘 다 통과할 수 있어요. 그래서 판단을 UPDATE 문 안에 넣어요.'
      - code: partialSql
        notes:
          - mark: canceled_amount + :cancel
            as: code
            text: '더한 결과가 결제 금액 이하일 때만 바꿔요. 바뀐 행이 0이면 한도를 넘은 취소예요.'
      - ci:
          key: partial-cancel
          label: 실제 결과 보기
          source: PaymentFlowTest.concurrentPartialCancels
      - p: '6,000원 두 건이 동시에 와서 하나만 성공했고, 누적 취소액은 6,000원이에요. DB가 행을 바꾸는 동안 다른 UPDATE는 기다렸다가 바뀐 값으로 조건을 다시 따지기 때문이에요.'
      - quiz:
          q: '10,000원 결제에 6,000원 부분 취소 두 건이 동시에 왔어요. 조건부 UPDATE로 처리하면?'
          options:
            - '둘 다 성공해 12,000원이 취소된다'
            - '하나만 성공하고 누적 취소액은 6,000원이다'
            - '둘 다 실패한다'
          answer: 2
          explain: '두 번째 UPDATE는 첫 번째가 바꾼 값으로 조건을 따져 12,000 > 10,000이라 바꾸지 않아요.'
      - next: '이렇게 조심해도 우리 기록과 PG 내역이 어긋날 수 있어요. 어떻게 찾아낼까요?'
    recall: '부분 취소는 누적 취소액이 결제 금액을 넘으면 안 돼요. 10,000원에 3,000원과 7,000원은 되고 1원 더는 거절돼요. 두 건이 동시에 오면 애플리케이션에서 확인하고 더하는 코드는 둘 다 통과시킬 수 있으니, "더한 값이 결제 금액 이하일 때만"이라는 조건을 UPDATE 문에 넣어요. 그러면 6,000원 두 건이 동시에 와도 하나만 성공해요.'
  - id: q4
    title: 대사는 무엇을 맞추나요?
    conclusion:
      lead: '우리 결제 기록과 PG가 주는 거래 내역을 주문 번호로 맞춰, 금액이 다른 거래와 한쪽에만 있는 거래를 찾아요.'
      sub: '타임아웃, 서버 장애, 버그로 생긴 어긋남은 결국 대사에서 드러나요. 찾은 것은 사람이 확인하거나 정해진 규칙으로 고쳐요.'
    says:
      - '우리 3건, PG 3건: 금액 다름 1, 우리에게만 1, PG에만 1'
      - '어긋남의 원인과 고치는 방법'
    asks:
      - '본문의 예시: PG에는 APPROVED로 있는데 우리 기록에는 없는 주문을 대사가 찾았다. 가장 흔한 원인은 (승인 타임아웃을 실패로 처리했거나 저장 전에 서버가 죽었다)'
      - '옮긴 상황: 대사에서 금액이 PG 4,500원, 우리 5,000원으로 다른 주문이 나왔다. 무엇을 의심하나 (부분 취소나 할인이 한쪽에만 반영됐다)'
    body:
      - p: '아무리 조심해도 어긋남은 생겨요. 승인 직후 서버가 죽거나, 부분 취소가 한쪽에만 반영되거나, 버그가 있어요. 그래서 하루가 끝나면 PG가 주는 거래 내역 파일(또는 API)을 우리 기록과 **주문 번호로 맞춰 봐요.** 이것이 **대사**예요.'
      - code: reconcile
      - ci:
          key: reconcile
          label: 실제 결과 보기
          source: PaymentFlowTest.reconciliationFindsDifferences
      - table:
          head: [어긋남, 흔한 원인, 고치는 방법]
          rows:
            - ['금액이 다름', '부분 취소나 할인이 한쪽에만 반영됨', '취소 내역을 맞추고 한쪽을 고침']
            - ['우리에게만 있음', '우리는 매입으로 기록했는데 PG 요청이 실패함', 'PG에 다시 요청하거나 우리 기록을 취소']
            - ['PG에만 있음', '승인 타임아웃을 실패로 처리, 저장 전 서버 장애', 'PG 승인을 취소하거나 우리 기록을 만듦']
      - p: '어떤 것은 정해진 규칙으로 자동으로 고치고(PG에만 있는 승인은 취소), 판단이 필요한 것은 사람이 확인해요. 질문 2와 3에서 본 장치들이 어긋남을 줄이고, 대사가 그래도 남은 것을 잡아요.'
      - quiz:
          q: '대사에서 PG에는 APPROVED로 있는데 우리 기록에는 없는 주문이 나왔어요. 가장 흔한 원인은?'
          options:
            - '고객이 결제를 두 번 눌렀다'
            - '승인 타임아웃을 실패로 처리했거나, 승인 뒤 저장 전에 서버가 죽었다'
            - 'PG가 잘못 승인했다'
          answer: 2
          explain: 'PG는 승인했는데 우리가 그 결과를 남기지 못한 경우예요. 질문 2의 예측과 같은 모양이에요.'
      - next: '원리는 여기까지예요. 이제 결제 상태를 바꾸는 코드와 흔한 실수를 볼게요.'
    recall: '대사는 우리 결제 기록과 PG가 주는 거래 내역을 주문 번호로 맞춰, 금액이 다른 거래, 우리에게만 있는 거래, PG에만 있는 거래를 찾는 일이에요. 타임아웃을 실패로 처리하거나 저장 전에 서버가 죽거나 부분 취소가 한쪽에만 반영되면 어긋나요. 찾은 것은 정해진 규칙으로 자동으로 고치거나 사람이 확인해요.'
practice:
  title: 결제 상태를 코드로 지킬 때
  says:
    - '상태 전이를 조건부 UPDATE로: where status = :from'
    - '흔한 실수: 부분 취소를 애플리케이션에서 읽고 더하고 쓴다. 금액을 double로 다룬다'
  body:
    - p: '결제 상태는 정해진 순서로만 바뀌어야 해요(질문 1). 상태를 바꿀 때 "지금 이 상태일 때만"을 UPDATE 문에 넣으면, 두 요청이 동시에 와도 한쪽만 바꿔요.'
    - code: transitionSql
      notes:
        - mark: status = :from
          as: code
          text: 'READY일 때만 APPROVED로 바꿔요. 바뀐 행이 0이면 이미 다른 상태라 잘못된 전이예요.'
    - p: '테스트의 `transition`이 이 방식이고, 승인 전에 매입하려는 요청은 바뀐 행이 0이라 거절됐어요.'
    - h3: 흔한 실수 하나
    - code: appCancel
      notes:
        - mark: p.setCanceled(p.getCanceled()
          as: code
          text: '읽고, 확인하고, 더해서 써요. 두 요청이 동시에 같은 값을 읽으면 둘 다 확인을 통과해요.'
    - p: '질문 3의 동시 부분 취소가 이 코드에서 뚫려요. 고친 코드는 판단을 UPDATE에 넣은 `partialSql`이에요.'
    - h3: 흔한 실수 둘
    - code: doubleMoney
      notes:
        - mark: double
          as: code
          text: '0.1을 열 번 더하면 0.9999999999999999가 돼요. 금액에 쓰면 1원 차이가 대사에서 어긋남으로 나와요.'
    - p: '원화는 원 단위 `long`으로 저장하고 계산해요. 소수점이 있는 통화나 비율 계산이 필요하면 `BigDecimal`을 쓰고 반올림 방식을 정해요([숫자 타입의 한계](lesson:number-limits)).'
interview:
  question: 결제 시스템의 흐름과 주의할 점을 설명해 주세요.
  model:
    - label: 흐름
      text: 준비에서 주문과 금액을 저장하고, 승인에서 카드 한도를 잡고, 매입에서 실제로 청구하고, 정산에서 PG가 수수료를 떼고 입금합니다. 각 단계를 결제 상태로 남기고 정해진 순서로만 바꿉니다.
    - label: 타임아웃
      text: 승인 응답이 타임아웃이면 결과를 모르는 것이라 실패로 단정하지 않습니다. 실패로 처리하면 PG에 승인이 남아 고객 돈이 묶이니, 망 취소로 양쪽을 결제 없음으로 맞추거나 PG에 결과를 조회합니다. 재승인에는 주문 번호를 멱등 키로 넘깁니다.
    - label: 취소와 대사
      text: 부분 취소는 누적 취소액이 결제 금액을 넘지 않게 조건부 UPDATE로 지켜 동시 요청에도 하나만 통과시킵니다. 하루가 끝나면 PG 내역과 주문 번호로 대사해 금액 차이와 한쪽에만 있는 거래를 찾아 고칩니다. 금액은 원 단위 long이나 BigDecimal로 다룹니다.
    - label: 경험
      text: '(내 프로젝트로 채우기) 예: 승인 타임아웃을 실패로 처리해 생기던 "돈만 빠져나갔다" 문의를 망 취소와 UNKNOWN 상태를 넣어 없앴습니다.'
verified: 상태 전이, 승인 타임아웃의 두 처리, 부분 취소의 한도와 동시 요청, 대사 결과는 스프링 부트 3.5, PostgreSQL 16과 가짜 PG로 받은 값이에요. 코드가 바뀔 때마다 테스트([PaymentFlowTest](link:test))가 다시 돌아요.
footer: '근거: 결제 흐름의 단계는 [토스페이먼츠 카드 결제 용어](link:tossFlow)와 [Stripe 문서](link:stripeHold), `BigDecimal`은 [API 문서](link:bigDecimal). 결과는 가짜 PG로 테스트해 확인했어요. 실제 PG마다 용어와 API는 조금씩 달라요. 오류는 [GitHub 이슈](https://github.com/wanja727/dev-lessons/issues)로 알려 주세요.'
claims:
  - claim: '준비 → 승인 → 매입. 매입은 승인 금액을 넘을 수 없고 승인 전에는 매입할 수 없다'
    how: '가짜 PG와 결제 테이블'
    test: PaymentFlowTest.approveThenCapture
  - claim: '승인 타임아웃을 실패로 처리하면 우리 FAILED, PG APPROVED가 되고 대사에서 드러난다'
    how: 'PG 500ms, 타임아웃 200ms'
    test: PaymentFlowTest.timeoutAsFailureLeavesOrphanApproval
  - claim: '망 취소로 양쪽을 CANCELED로 맞추면 대사의 어긋남이 0건이다'
    how: '같은 구성'
    test: PaymentFlowTest.netCancelOnTimeout
  - claim: '누적 취소액은 결제 금액을 넘을 수 없고, 동시 부분 취소는 하나만 성공한다'
    how: '조건부 UPDATE'
    test: 'PaymentFlowTest.partialCancels, concurrentPartialCancels'
  - claim: '대사가 금액 차이와 한쪽에만 있는 거래를 찾는다'
    how: '우리 기록 3건과 PG 내역 3건'
    test: PaymentFlowTest.reconciliationFindsDifferences
sources:
  - '카드 결제(승인, 매입): https://docs.tosspayments.com/resources/glossary/card-payment'
  - '승인 후 나중 청구: https://docs.stripe.com/payments/place-a-hold-on-a-payment-method'
  - 'BigDecimal: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/math/BigDecimal.html'
