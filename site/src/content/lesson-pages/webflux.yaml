# 웹플럭스 (설계서)
# 자료 파일의 칸은 docs/lesson-data-format.md에 있다.
stage: design
title: 웹플럭스
unit: 스프링
roadmap: S16
type: 동작 확인
prerequisites:
  - {slug: spring-mvc-flow, title: 스프링 MVC 요청 흐름}
  - {slug: sync-async-blocking, title: 동기와 비동기, 블로킹과 논블로킹}
assume: '자바 21, 스프링 부트 3.5(리액터 3.7, 네티). 스프링 MVC가 요청 하나를 톰캣 스레드 하나로 처리하고, 스레드가 모두 바쁘면 요청이 기다린다는 것(서블릿과 톰캣, 스프링 MVC 요청 흐름 레슨). 블로킹과 논블로킹의 차이(동기와 비동기 레슨).'
example: '상품 상세 API가 외부 재고 서버(1초 걸림)를 부른다. 같은 일을 스프링 MVC와 웹플럭스로 만들어, 스레드 수를 적게 두고 요청 100개를 동시에 보낸다.'
intro:
  - '외부 API를 기다리는 요청이 많아 톰캣 스레드 200개가 모두 묶이는 일이 잦아요. 스레드를 늘리자니 메모리가 아깝고, 누군가 "웹플럭스로 바꾸면 된다"고 해요. 바꿨더니 이번에는 JDBC 호출 하나가 서버 전체를 멈춰 세워요.'
  - '웹플럭스는 요청마다 스레드를 쓰지 않고, 적은 이벤트 루프 스레드가 기다리는 동안 다른 요청을 처리하는 방식이에요. 기다림이 많은 일에는 강하지만, 중간에 블로킹 코드가 하나라도 있으면 그 스레드가 멈춰 모든 요청이 멈춰요. 언제 맞고 언제 맞지 않는지 알아야 고를 수 있어요.'
  - '이 레슨에서는 같은 일을 두 방식으로 만들어 요청을 처리한 스레드 이름과 걸린 시간을 비교하고, 웹플럭스에 블로킹 호출을 넣었을 때 무슨 일이 생기는지 봐요.'
covers:
  - topic: '웹플럭스는 네티 위에서 적은 수의 이벤트 루프 스레드로 요청을 처리한다. 기다리는 동안 스레드를 놓아준다'
    where: '질문 1'
  - topic: '`Mono`(0~1개)와 `Flux`(0~N개)는 나중에 올 값을 나타내고, 구독할 때 실행된다'
    where: '질문 1'
  - topic: '`WebClient`로 외부를 논블로킹으로 부른다'
    where: '질문 2'
  - topic: '스레드 몇 개로 기다리는 요청 수백 개를 처리할 수 있다. MVC는 같은 조건에서 스레드 수만큼만 동시에 처리한다'
    where: '질문 2'
  - topic: '이벤트 루프에서 블로킹 호출(`Thread.sleep`, JDBC, `RestTemplate`)을 하면 그 스레드의 모든 요청이 멈춘다'
    where: '질문 3'
  - topic: '블로킹이 꼭 필요하면 `subscribeOn(Schedulers.boundedElastic())`로 따로 돌린다'
    where: '질문 3'
  - topic: '언제 무엇을 고르나: CPU를 많이 쓰는 일, JPA와 JDBC 중심의 서비스는 MVC. 외부 호출과 스트리밍이 많은 게이트웨이류는 웹플럭스. 가상 스레드라는 다른 선택지'
    where: '질문 4'
  - topic: 'R2DBC'
    where: '질문 4에서 이름만'
  - topic: '가상 스레드의 원리'
    where: '다루지 않음: 가상 스레드(C12)'
codes:
  predict: |-
    @GetMapping("/products/{id}")
    Mono<Product> product(
        @PathVariable long id) {
      return webClient.get()
          .uri("/stock/{id}", id)  // 1초
          .retrieve()
          .bodyToMono(Product.class);
    }
    // 이벤트 루프 스레드 2개,
    // 요청 100개를 동시에
predict:
  text: '코드 predict를 이벤트 루프 스레드 2개로 띄우고 요청 100개를 동시에 보내요. 외부 재고 서버는 1초 걸려요. 100개가 모두 응답할 때까지 대략 얼마 걸릴까요? 보기: 약 1초, 약 50초, 약 100초.'
  answer: '약 1초. 기다리는 동안 스레드를 놓아주니 두 스레드가 100개를 함께 기다린다. 질문 2에서 밝힌다.'
questions:
  - id: q1
    title: 웹플럭스는 요청을 어떤 스레드로 처리하나요?
    conclusion:
      lead: '요청마다 스레드를 쓰지 않고, CPU 수만큼의 이벤트 루프 스레드가 여러 요청을 번갈아 처리해요.'
      sub: '`Mono`와 `Flux`로 "나중에 올 값"을 돌려주고, 값이 오면 이어서 처리해요.'
    says:
      - '같은 컨트롤러를 MVC와 웹플럭스로 띄워 처리한 스레드 이름을 비교한다(`http-nio-...-exec` 대 `reactor-http-nio-N`)'
      - '`Mono`, `Flux`의 뜻과 구독할 때 실행된다는 것'
    asks:
      - '본문의 예시: 웹플럭스 컨트롤러가 찍은 스레드 이름은 어떤 모양인가 (reactor-http-nio-N)'
      - '옮긴 상황: `Mono`를 만들기만 하고 구독하지 않으면 안의 외부 호출이 실행되나 (실행되지 않는다)'
  - id: q2
    title: 적은 스레드로 어떻게 많은 요청을 기다리나요?
    conclusion:
      lead: '외부 응답을 기다리는 동안 스레드를 붙잡지 않고 놓아줘서, 그 스레드가 다른 요청을 처리해요.'
      sub: '그래서 기다림이 많은 일에서는 스레드 몇 개로 수백 개의 요청을 동시에 기다릴 수 있어요.'
    says:
      - '코드 predict를 돌려 100개가 약 1초에 끝나는 것을 보인다. 예측의 답을 밝힌다'
      - '같은 일을 MVC(스레드 2개, RestClient)로 하면 약 50초 걸리는 것을 비교한다(S1의 질문 3)'
    asks:
      - '본문의 예시: 같은 조건에서 MVC(톰캣 스레드 2개)로 바꾸면 100개는 대략 얼마 걸리나 (약 50초)'
      - '옮긴 상황: 외부 호출이 없고 CPU 계산만 0.1초씩 하는 요청 100개라면 웹플럭스가 이벤트 루프 2개로 훨씬 빨라지나 (아니다. 기다림이 없어 놓아줄 시간이 없다)'
  - id: q3
    title: 웹플럭스에서 블로킹 코드를 부르면 어떻게 되나요?
    conclusion:
      lead: '그 이벤트 루프 스레드가 멈춰서, 그 스레드가 맡은 모든 요청이 함께 멈춰요.'
      sub: '블로킹이 꼭 필요하면 `Schedulers.boundedElastic()` 같은 따로 마련한 스레드에서 돌려요.'
    says:
      - '컨트롤러 안에 `Thread.sleep(1000)`을 넣고 요청 10개를 보내 걸린 시간을 보인다'
      - '`subscribeOn(Schedulers.boundedElastic())`로 옮기면 다시 함께 기다린다'
      - 'JDBC, JPA, `RestTemplate`이 블로킹이라는 것'
    asks:
      - '본문의 예시: 이벤트 루프 2개인 웹플럭스 앱의 컨트롤러에서 `Thread.sleep(1000)`을 하고 요청 10개를 보내면 대략 얼마 걸리나 (약 5초)'
      - '옮긴 상황: 웹플럭스 컨트롤러에서 JPA 리포지토리로 조회한다. 어떤 문제가 생길 수 있나 (이벤트 루프가 DB를 기다리며 멈춘다)'
  - id: q4
    title: MVC와 웹플럭스는 언제 무엇을 고르나요?
    conclusion:
      lead: 'JPA와 JDBC 중심의 일반 서비스는 MVC를, 외부 호출과 스트리밍이 많은 게이트웨이류는 웹플럭스를 골라요.'
      sub: '웹플럭스는 끝까지 논블로킹이어야 이점이 있어요. 기다림 때문에 스레드가 모자란 MVC는 가상 스레드라는 다른 선택지도 있어요.'
    says:
      - '표: 일의 성격(CPU, DB, 외부 호출, 스트리밍)마다 고르는 쪽과 이유'
      - 'R2DBC는 이름만, 가상 스레드는 C12로'
    asks:
      - '본문의 예시: JPA로 주문을 저장하는 일반 쇼핑몰 API는 무엇이 맞나 (MVC)'
      - '옮긴 상황: 여러 외부 서비스를 동시에 부르고 결과를 합쳐 돌려주는 API 게이트웨이는 (웹플럭스가 맞는 편이다)'
practice:
  says:
    - '웹플럭스 스타터와 MVC 스타터를 함께 넣으면 MVC로 뜬다(스프링 부트 문서). `WebClient`만 쓰려고 웹플럭스 스타터를 넣는 경우가 그렇다'
    - '흔한 실수: 웹플럭스 컨트롤러에서 JPA를 그대로 부른다. 고친 코드: boundedElastic으로 옮기거나 MVC를 쓴다'
    - '블로킹 호출을 찾는 도구(BlockHound)를 이름만 적는다'
claims:
  - claim: '웹플럭스 컨트롤러는 reactor-http-nio 스레드에서 돈다'
    how: '`spring-boot-starter-webflux`를 testImplementation으로 넣고 작은 리액티브 앱을 띄운다. 다른 테스트의 MVC에 영향이 없는지 확인한다'
  - claim: '이벤트 루프 2개로 1초 걸리는 외부 호출 요청 100개가 약 1초에 끝난다'
    how: '`WebClient`로 느린 서버를 부르고 시간을 잰다. 범위로 단정한다'
  - claim: '이벤트 루프에서 `Thread.sleep`을 하면 요청이 차례로 처리되고, `boundedElastic`으로 옮기면 함께 기다린다'
    how: '시간을 잰다'
  - claim: 'MVC와 웹플럭스 스타터를 함께 넣으면 MVC로 뜬다'
    how: '`WebApplicationType`을 확인한다'
sources:
  - '스프링 웹플럭스: https://docs.spring.io/spring-framework/reference/web/webflux.html'
  - '스프링 부트의 웹 앱 종류 결정: https://docs.spring.io/spring-boot/reference/web/reactive.html'
  - '리액터 스케줄러: https://projectreactor.io/docs/core/release/reference/coreFeatures/schedulers.html'
