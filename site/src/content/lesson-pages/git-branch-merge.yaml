# Git 브랜치와 병합 (설계서)
# 자료 파일의 칸은 docs/lesson-data-format.md에 있다.
stage: design
title: Git 브랜치와 병합
unit: 테스트와 운영
roadmap: T1
type: 동작 확인
prerequisites: []
assume: 'Git 2.40 이상. `git add`, `git commit`, `git push`로 커밋을 올려 본 적이 있다는 것. 커밋이 무엇인지는 질문 1에서 한 번 설명해요.'
example: '쇼핑몰 저장소의 `main`에서 `feature/coupon` 브랜치를 따서 쿠폰 기능을 만드는 동안, 동료가 `main`에 배송비 수정을 올려요. 두 줄기를 merge와 rebase로 합쳐 보고, 같은 줄을 고쳐 충돌을 일으켜 풀어 봐요.'
intro:
  - '쿠폰 기능을 이틀 만들고 `main`에 합치려는데 "CONFLICT (content): Merge conflict in OrderService.java"가 떠요. 동료는 "rebase해서 올려 주세요"라고 하고, 다른 동료는 "force push 하지 마세요"라고 해요. 둘 다 맞는 말인데 왜 그런지 모르면 명령을 외워서 칠 수밖에 없어요.'
  - '백엔드 개발자는 매일 브랜치를 따고 합쳐요. 코드 리뷰, CI, 배포가 모두 브랜치와 병합 위에서 돌아가요. 팀이 merge 커밋을 남길지 rebase로 한 줄로 만들지, 브랜치를 얼마나 오래 둘지를 정하고, 개발자는 그 규칙대로 충돌을 풀어야 해요.'
  - '이 레슨에서는 테스트 안에서 임시 저장소를 만들고 `git` 명령을 실제로 돌려요. 브랜치 파일 안에 무엇이 있는지, merge와 rebase 뒤에 커밋이 몇 개 생기고 해시가 어떻게 바뀌는지, 충돌이 난 파일이 어떤 모양인지를 출력으로 확인해요.'
covers:
  - topic: '커밋은 파일 전체의 스냅숏과 부모 커밋을 가리키는 기록이다. 해시로 이름 붙는다'
    where: '질문 1'
  - topic: '브랜치는 커밋 하나를 가리키는 이름이다. `.git/refs/heads/<이름>` 파일에 커밋 해시 한 줄이 들어 있다. 그래서 만드는 비용이 거의 없다'
    where: '질문 1'
  - topic: 'HEAD는 지금 작업 중인 브랜치를 가리킨다. 커밋하면 HEAD가 가리키는 브랜치가 새 커밋으로 움직인다'
    where: '질문 1'
  - topic: 'fast-forward 병합: 합칠 쪽이 앞서 있기만 하면 브랜치 이름을 앞으로 옮길 뿐 새 커밋이 없다'
    where: '질문 2'
  - topic: '3-way 병합: 두 줄기가 갈라졌으면 공통 조상, 내 쪽, 상대 쪽 셋을 비교해 부모가 둘인 병합 커밋을 만든다'
    where: '질문 2'
  - topic: '`--no-ff`로 fast-forward가 가능해도 병합 커밋을 남기기, squash merge로 커밋 하나로 합치기'
    where: '질문 2의 더 알아보기'
  - topic: 'rebase는 내 커밋들을 상대 브랜치 끝에 하나씩 다시 적용해 새 커밋을 만든다. 내용이 같아도 해시가 바뀐다. 기록이 한 줄이 된다'
    where: '질문 3'
  - topic: '이미 push해서 남이 받은 커밋을 rebase하면 안 된다. 원격과 기록이 갈라져 force push가 필요하고, 남의 커밋을 지울 수 있다'
    where: '질문 3'
  - topic: '`git pull`은 fetch 다음 merge이고 `--rebase`면 fetch 다음 rebase다'
    where: '질문 3'
  - topic: '충돌은 두 쪽이 같은 줄(또는 붙어 있는 줄)을 다르게 고쳤을 때 생긴다. 다른 줄을 고쳤으면 Git이 알아서 합친다'
    where: '질문 4'
  - topic: '충돌 표시(`<<<<<<<`, `=======`, `>>>>>>>`)를 읽고, 남길 내용으로 고친 뒤 `git add`와 커밋(또는 `rebase --continue`)으로 마친다. `--abort`로 되돌린다'
    where: '질문 4'
  - topic: 'Git은 줄 단위로 합칠 뿐 코드의 뜻을 모른다. 충돌 없이 합쳐져도 컴파일이나 테스트가 깨질 수 있다'
    where: '질문 4'
  - topic: '브랜치 전략: Git flow(develop, release, hotfix 브랜치), GitHub flow(main과 짧은 기능 브랜치, PR), 트렁크 기반 개발(main에 자주 작게 합침)'
    where: '질문 5'
  - topic: '브랜치를 오래 둘수록 충돌이 커진다. 작게 자주 합치는 것이 충돌을 줄이는 가장 쉬운 방법이다'
    where: '질문 5'
  - topic: '올린 커밋을 되돌릴 때는 기록을 지우는 reset이 아니라 되돌리는 커밋을 새로 만드는 revert를 쓴다'
    where: '실무에서는'
  - topic: 'force push가 필요할 때는 `--force-with-lease`로 남이 올린 커밋을 덮지 않게 한다'
    where: '실무에서는'
  - topic: 'PR(풀 리퀘스트)과 코드 리뷰, 브랜치 보호 규칙'
    where: '질문 5'
  - topic: '`.gitignore`로 빌드 결과물과 비밀 값을 올리지 않기'
    where: '실무에서는'
  - topic: 'cherry-pick, stash, reflog로 잃은 커밋 찾기'
    where: '질문 3의 더 알아보기 (reflog만). 나머지는 다루지 않음: 명령 사용법이라 꺼내 볼 원리가 적다'
  - topic: 'PR마다 테스트를 돌리고 main에 합친 것을 배포하는 흐름'
    where: '다루지 않음: CI/CD와 무중단 배포(T6)'
codes:
  predict: |-
    git switch -c feature/coupon
    # 커밋 2개 (쿠폰 기능)
    git switch main
    # 동료의 커밋 1개 (배송비)
    git merge feature/coupon
    git log --oneline | wc -l
  refs: |-
    $ cat .git/HEAD
    ref: refs/heads/main
    $ cat .git/refs/heads/feature/coupon
    3f2a9c1e...
  ffMerge: |-
    git switch main
    git merge feature/coupon
    # Fast-forward
  rebase: |-
    git switch feature/coupon
    git rebase main
  conflict: |-
    <<<<<<< HEAD
    int fee = 3000;
    =======
    int fee = 2500;
    >>>>>>> feature/coupon
  revert: |-
    git revert 3f2a9c1
    git push
  forceLease: |-
    git push --force-with-lease
predict:
  text: '코드 predict처럼 `main`에 커밋이 1개 있는 상태에서 `feature/coupon`을 따서 커밋 2개를 하고, 그사이 `main`에 커밋 1개가 더 올라왔어요. `main`에서 `git merge feature/coupon`을 하면 `main`의 기록(`git log`)에 커밋이 몇 개 보일까요? 보기: 3개, 4개, 5개.'
  answer: '5개. 처음 1개, 동료 1개, 쿠폰 2개에 두 부모를 잇는 병합 커밋 1개가 더해진다. 질문 2에서 밝힌다.'
questions:
  - id: q1
    title: 브랜치는 무엇인가요?
    conclusion:
      lead: '브랜치는 커밋 하나를 가리키는 이름이에요. 파일 하나에 커밋 해시 한 줄이 들어 있을 뿐이에요.'
      sub: '그래서 브랜치를 만드는 데는 파일을 복사하지 않고, 커밋하면 지금 브랜치(HEAD가 가리키는 것)가 새 커밋으로 한 칸 움직여요.'
    says:
      - '커밋은 그 순간 파일 전체의 스냅숏과 부모 커밋의 해시를 담은 기록이다. 커밋들은 부모를 따라 거꾸로 이어진다'
      - '코드 refs. 테스트로 만든 저장소에서 `.git/refs/heads/feature/coupon` 파일을 열면 40자 해시 한 줄이다. `git rev-parse feature/coupon`의 값과 같다. 실제 출력을 보인다'
      - '`.git/HEAD`에는 `ref: refs/heads/main`이 들어 있다. HEAD는 지금 브랜치를 가리키는 이름이다. `git switch`는 이 파일을 바꾸고 작업 폴더를 그 커밋의 스냅숏으로 바꾼다'
      - '커밋하면 새 커밋의 부모는 지금 브랜치가 가리키던 커밋이고, 브랜치 파일의 해시가 새 커밋으로 바뀐다. 다른 브랜치 파일은 그대로다'
      - '브랜치를 지워도 커밋은 남는다. 이름표만 떼는 것이다'
    asks:
      - '본문의 예시: `feature/coupon`에서 커밋을 하나 더 하면 `.git/refs/heads/main` 파일의 내용은 바뀌나 (바뀌지 않는다. 지금 브랜치의 파일만 바뀐다)'
      - '옮긴 상황: 저장소 크기가 2GB다. 브랜치를 새로 하나 만들면 디스크를 얼마쯤 더 쓰나 (해시 한 줄짜리 파일 하나. 파일을 복사하지 않는다)'
  - id: q2
    title: merge는 두 브랜치를 어떻게 합치나요?
    conclusion:
      lead: '한쪽만 앞서 있으면 이름표를 앞으로 옮기고(fast-forward), 두 쪽이 갈라졌으면 부모가 둘인 병합 커밋을 새로 만들어요.'
      sub: '병합 커밋을 만들 때는 공통 조상과 두 끝을 비교해서, 각자 바꾼 부분을 모두 담아요.'
    says:
      - '`main`이 그동안 움직이지 않았으면 `feature/coupon`은 `main`의 앞에 줄지어 있다. 코드 ffMerge처럼 합치면 `main` 이름표가 쿠폰의 마지막 커밋으로 옮겨질 뿐 새 커밋이 없다. 출력에 "Fast-forward"가 나온다'
      - '동료가 `main`에 커밋을 올렸으면 두 줄기가 갈라졌다. 이때 Git은 공통 조상, `main`의 끝, 쿠폰의 끝 셋을 비교한다(3-way 병합). 공통 조상에서 각자 바꾼 것을 함께 담은 새 커밋을 만들고, 그 커밋의 부모는 둘이다'
      - '예측의 답을 밝힌다. `git log --oneline`에 커밋 5개, `git cat-file -p HEAD`에 `parent` 줄이 둘이다. 실제 출력을 보인다'
      - '병합 커밋은 "언제 이 기능이 합쳐졌나"를 기록으로 남긴다. 대신 기록이 갈래로 보인다'
      - '더 알아보기: `git merge --no-ff`는 fast-forward가 되는 상황에서도 병합 커밋을 만든다. `git merge --squash`는 쿠폰의 커밋들을 하나로 뭉친 변경만 가져오고, 부모가 하나인 보통 커밋으로 남는다. 깃허브의 PR 병합 버튼 세 가지(merge, squash, rebase)가 이것에 대응한다'
    widget:
      kind: toggle
      note: '같은 출발점(`main` 1개, 쿠폰 2개)에서 "동료 커밋 없음"과 "동료 커밋 1개"를 고르면 merge 뒤의 커밋 그래프를 보인다. 앞의 것은 이름표만 옮겨지고, 뒤의 것은 부모가 둘인 커밋이 생긴다. 각 장면에 실제 `git log --graph --oneline` 출력을 함께 둔다'
    asks:
      - '본문의 예시: 동료의 커밋이 없을 때 `main`에서 `git merge feature/coupon`을 하면 커밋이 새로 생기나 (생기지 않는다. fast-forward)'
      - '옮긴 상황: 병합 커밋 M을 `git cat-file -p M`으로 열었다. `parent` 줄은 몇 개이고 각각 무엇인가 (둘. 병합 전 `main`의 끝과 합친 브랜치의 끝)'
  - id: q3
    title: rebase는 merge와 무엇이 다른가요?
    conclusion:
      lead: 'rebase는 내 커밋들을 상대 브랜치의 끝에 하나씩 다시 적용해 새 커밋으로 만들어요. 내용이 같아도 해시가 바뀌어요.'
      sub: '그래서 기록이 한 줄로 깔끔해지지만, 이미 push해서 남이 받은 커밋을 rebase하면 원격과 기록이 갈라져요.'
    says:
      - '코드 rebase. `feature/coupon`에서 `git rebase main`을 하면 공통 조상 뒤의 쿠폰 커밋 2개를 떼어 내, 동료 커밋 뒤에 차례로 다시 적용한다. 그다음 `main`에서 merge하면 fast-forward가 되어 병합 커밋 없이 한 줄이 된다'
      - '다시 적용한 커밋은 부모가 달라졌으므로 해시가 다르다. rebase 전과 후의 쿠폰 커밋 해시를 실제 출력으로 비교한다. 메시지와 바뀐 내용은 같다'
      - '이미 원격에 올린 브랜치를 rebase하면 원격의 옛 커밋과 내 새 커밋이 갈라진다. 그냥 `git push`는 거절된다(non-fast-forward). 테스트로 원격 저장소를 만들어 거절 메시지를 보인다'
      - '여기서 `--force`로 밀면 원격의 기록이 내 것으로 바뀐다. 그사이 동료가 그 브랜치에 올린 커밋은 원격에서 사라진다. 그래서 "남과 함께 쓰는 브랜치는 rebase하지 않는다"가 규칙이다'
      - '`git pull`은 fetch 다음 merge다. 내 커밋과 원격 커밋이 갈라져 있으면 병합 커밋이 생긴다. `git pull --rebase`는 내 커밋을 원격 끝에 다시 적용해 한 줄로 만든다. 아직 올리지 않은 내 커밋만 바뀌므로 안전하다'
      - '더 알아보기: rebase 전의 커밋은 지워지지 않고 남아 있다. `git reflog`로 HEAD가 지나온 커밋을 찾아 되돌릴 수 있다'
    asks:
      - '본문의 예시: 쿠폰 커밋 2개를 `main` 위로 rebase했다. 쿠폰 커밋의 해시는 rebase 전과 같은가 (다르다. 부모가 바뀌어 새 커밋이 된다)'
      - '옮긴 상황: 동료와 함께 쓰는 `release/1.2` 브랜치를 로컬에서 rebase한 뒤 `git push`를 했다. 무슨 일이 생기나 (거절된다. 원격과 기록이 갈라졌다. force로 밀면 동료 커밋이 사라질 수 있다)'
      - '실무 구역: 이미 `main`에 올라간 잘못된 커밋을 되돌리려 한다. `git reset --hard`와 force push, `git revert` 가운데 무엇을 쓰나 (revert. 되돌리는 커밋을 새로 만들어 남의 기록을 건드리지 않는다)'
  - id: q4
    title: 충돌은 언제 생기고 어떻게 푸나요?
    conclusion:
      lead: '두 쪽이 같은 줄을 서로 다르게 고쳤을 때 생겨요. Git은 어느 쪽이 맞는지 모르니, 두 내용을 표시해 두고 사람에게 고르게 해요.'
      sub: '파일을 남길 내용으로 고치고 `git add` 뒤 커밋하면 병합이 끝나요. 다른 줄을 고쳤으면 충돌 없이 합쳐지지만, 코드의 뜻까지 맞는다는 보장은 없어요.'
    says:
      - '`OrderService.java`의 배송비 줄을 동료는 3000으로, 나는 2500으로 바꿨다. merge하면 "CONFLICT"가 나고 병합이 멈춘다. `git status`에 "both modified"가 나온다. 실제 출력을 보인다'
      - '코드 conflict. 충돌한 파일에는 `<<<<<<< HEAD`부터 `=======`까지 지금 브랜치의 내용, 그 뒤부터 `>>>>>>>`까지 합치려는 브랜치의 내용이 들어간다. 표시 줄을 지우고 남길 내용으로 고친다'
      - '고친 파일을 `git add`하고 `git commit`하면 병합 커밋이 생긴다. rebase 중이면 `git rebase --continue`로 다음 커밋으로 넘어간다. 그만두려면 `git merge --abort`나 `git rebase --abort`로 시작 전으로 돌아간다'
      - '같은 파일이라도 동료는 배송비 줄을, 나는 맨 아래 쿠폰 메서드를 고쳤으면 충돌 없이 둘 다 담긴다. 실제 출력을 보인다'
      - 'Git은 줄을 비교할 뿐 코드를 이해하지 않는다. 동료가 메서드 이름을 바꾸고 나는 다른 파일에서 옛 이름을 불렀으면 충돌 없이 합쳐지고 컴파일이 깨진다. 그래서 합친 뒤에 테스트를 돌린다(T6의 CI가 이 일을 한다)'
    widget:
      kind: classify
      note: '두 브랜치가 고친 곳의 짝을 보고 "충돌 없이 합쳐짐", "충돌", "충돌은 없지만 깨짐"으로 고른다. 같은 줄의 다른 값, 서로 다른 메서드, 한쪽은 이름 바꾸기와 다른 쪽은 옛 이름 호출, 한쪽은 줄 삭제와 다른 쪽은 그 줄 수정 같은 상황을 둔다. 각 답은 테스트로 돌린 결과와 같아야 한다'
    asks:
      - '본문의 예시: 충돌 표시에서 `<<<<<<< HEAD`와 `=======` 사이에 있는 것은 누구의 내용인가 (merge를 실행한 지금 브랜치의 내용)'
      - '옮긴 상황: 한 브랜치는 `Coupon.java`의 10번째 줄을, 다른 브랜치는 같은 파일의 80번째 줄을 고쳤다. merge하면 충돌이 나나 (나지 않는다. 떨어진 다른 줄이라 Git이 둘 다 담는다)'
  - id: q5
    title: 팀은 브랜치를 어떻게 나눠 쓰나요?
    conclusion:
      lead: '요즘 웹 서비스 팀은 `main` 하나를 두고 짧게 사는 기능 브랜치를 자주 합치는 방식을 많이 써요.'
      sub: '브랜치가 오래 살수록 `main`과 멀어져 충돌이 커지기 때문이에요. 여러 버전을 따로 유지해야 하는 제품은 릴리스 브랜치를 두는 Git flow가 맞기도 해요.'
    says:
      - 'Git flow: `main`, `develop`, 기능, 릴리스, 핫픽스 브랜치를 둔다. 배포 버전을 정해서 내보내는 제품(설치형 소프트웨어, 앱)에 맞는다. 브랜치가 많고 오래 산다'
      - 'GitHub flow: `main`은 언제나 배포할 수 있는 상태다. 기능마다 짧은 브랜치를 따서 PR(풀 리퀘스트)로 리뷰받고 `main`에 합친 뒤 배포한다. PR은 "이 브랜치를 합쳐 달라"는 요청이고, 리뷰와 CI 결과가 그 위에 모인다'
      - '트렁크 기반 개발: 모두가 `main`(트렁크)에 하루에 한 번 이상 작게 합친다. 덜 된 기능은 설정 값(기능 플래그)으로 꺼 둔다'
      - '같은 충돌도 하루 만에 합치면 줄 몇 개, 한 달 뒤에 합치면 파일 수십 개가 된다. 테스트로 `main`이 커밋 N개 앞서 간 뒤 합칠 때 충돌한 파일 수를 세어 비교하지 않고, 원리로 설명한다(질문 4의 "같은 줄")'
      - '`main`은 브랜치 보호 규칙으로 지킨다: 직접 push 금지, 리뷰 승인과 CI 통과가 있어야 병합. 깃허브 문서를 근거로 단다'
    widget:
      kind: classify
      note: '팀 상황(웹 서비스를 하루 여러 번 배포, 모바일 앱을 2주마다 스토어에 출시하며 옛 버전에 핫픽스, 혼자 하는 사이드 프로젝트)을 보고 Git flow, GitHub flow, 트렁크 기반 가운데 맞는 것을 고른다'
    asks:
      - '본문의 예시: GitHub flow에서 `main` 브랜치는 어떤 상태여야 하나 (언제든 배포할 수 있는 상태)'
      - '옮긴 상황: 쿠폰 브랜치를 3주째 합치지 않고 있다. 그사이 `main`에 커밋 120개가 올라왔다. 합칠 때 생길 일과 줄이는 방법은 (충돌이 커진다. 작게 나눠 자주 합치거나 `main`을 자주 받아 둔다)'
practice:
  says:
    - '이 저장소의 실제 방식을 예로 든다: 혼자 개발해서 `main` 하나로 관리하고, 세션마다 워크트리 브랜치에서 일한 뒤 `git rebase origin/main` 다음 `git push origin HEAD:main`으로 올린다(CLAUDE.md "올리는 방식"). 올리기 전에 rebase하니 기록이 한 줄이다'
    - '흔한 실수 하나: 이미 올린 잘못된 커밋을 `git reset --hard HEAD~1`과 `git push --force`로 지운다. 동료가 그 커밋을 받았으면 다음 pull에서 다시 살아나거나 동료의 커밋이 지워진다. 고친 코드: 코드 revert. 되돌리는 커밋을 새로 만들어 기록을 지우지 않는다. 테스트에서 revert 뒤 커밋이 하나 늘고 파일이 원래대로인 것을 보인다'
    - '흔한 실수 둘: 내 기능 브랜치를 rebase한 뒤 `--force`로 민다. 리뷰어가 그 브랜치에 커밋을 올렸으면 사라진다. 고친 코드: 코드 forceLease. 원격이 내가 마지막으로 본 상태일 때만 덮어쓴다. 테스트로 원격에 남의 커밋이 생긴 뒤 `--force-with-lease`가 거절되는 것을 보인다'
    - '`.gitignore`에 `build/`, `.gradle/`, `*.env`를 둔다. 이미 커밋한 파일은 `.gitignore`에 넣어도 계속 추적된다. `git rm --cached`로 뺀다. 비밀 값을 한 번 올렸으면 기록에 남으므로 값을 바꾼다'
claims:
  - claim: '브랜치 파일 `.git/refs/heads/<이름>`의 내용은 커밋 해시 한 줄이고 `git rev-parse`의 값과 같다. `.git/HEAD`는 `ref: refs/heads/main`이다'
    how: '테스트가 임시 폴더에 `git init`을 하고 `ProcessBuilder`로 `git` 명령을 돌린다. 브랜치를 만든 직후 refs 파일을 읽는다. `git pack-refs`가 돌기 전이라 파일이 있다'
  - claim: '갈라지지 않은 브랜치를 merge하면 "Fast-forward"가 나오고 커밋 수가 그대로다'
    how: '`git log --oneline | wc -l`에 해당하는 수를 merge 전후로 센다'
  - claim: '갈라진 브랜치를 merge하면 커밋이 5개가 되고 HEAD 커밋의 `parent` 줄이 둘이다'
    how: '`git cat-file -p HEAD`의 출력을 남긴다'
  - claim: 'rebase 뒤 쿠폰 커밋 2개의 해시가 모두 바뀌고 메시지는 같다. 그 뒤 merge는 fast-forward다'
    how: 'rebase 전후의 `git log --format=%H %s`를 비교한다'
  - claim: '원격에 올린 브랜치를 rebase한 뒤 그냥 push하면 거절되고, 원격에 남의 커밋이 생긴 뒤에는 `--force-with-lease`도 거절된다'
    how: '`git init --bare`로 원격을 만들고 두 클론으로 두 사람을 흉내 낸다. 거절 메시지를 남긴다'
  - claim: '같은 줄을 다르게 고치면 충돌하고 파일에 충돌 표시가 들어간다. 떨어진 다른 줄을 고치면 충돌 없이 합쳐진다'
    how: '두 경우의 merge 종료 코드, `git status --short`, 파일 내용을 남긴다'
  - claim: '한쪽이 메서드 이름을 바꾸고 다른 쪽이 다른 파일에서 옛 이름을 부르면 충돌 없이 합쳐지고 컴파일이 실패한다'
    how: '합친 결과의 자바 파일을 `JavaSource`로 컴파일해 오류를 본다'
  - claim: '`git revert`는 커밋을 하나 더 만들고 파일을 되돌린 커밋 전으로 돌린다'
    how: 'revert 전후의 커밋 수와 파일 내용을 비교한다'
sources:
  - '커밋, 브랜치, HEAD의 정의: Pro Git 3.1 https://git-scm.com/book/en/v2/Git-Branching-Branches-in-a-Nutshell'
  - 'fast-forward와 3-way 병합: git-merge 문서 https://git-scm.com/docs/git-merge'
  - 'rebase와 공유 브랜치를 rebase하지 말라는 것: Pro Git 3.6 https://git-scm.com/book/en/v2/Git-Branching-Rebasing'
  - '`--force-with-lease`: git-push 문서 https://git-scm.com/docs/git-push'
  - 'GitHub flow와 브랜치 보호 규칙: https://docs.github.com/en/get-started/using-github/github-flow , https://docs.github.com/en/repositories/configuring-branches-and-merges-in-your-repository/managing-protected-branches/about-protected-branches'
  - '트렁크 기반 개발: https://trunkbaseddevelopment.com/'
