# Git 브랜치와 병합
# 자료 파일의 칸은 docs/lesson-data-format.md에 있다. 문제는 content/questions/git-branch-merge.yaml에 있다.
title: Git 브랜치와 병합
description: 브랜치가 무엇인지, merge가 두 줄기를 합치는 두 가지 방법, rebase가 merge와 다른 점, 충돌이 생기는 때와 푸는 법, 팀의 브랜치 전략. 다섯 가지 질문에 스스로 답할 수 있게 쇼핑몰 저장소의 쿠폰 브랜치로 배우는 대화형 레슨.
unit: 테스트와 운영
minutes: 20
roadmap: T1
type: 동작 확인
prerequisites: []
assume: 'Git 2.40 이상. `git add`, `git commit`, `git push`로 커밋을 올려 본 적이 있다는 것. 커밋이 무엇인지는 질문 1에서 한 번 설명해요.'
example: '쇼핑몰 저장소의 `main`에서 `feature/coupon` 브랜치를 따서 쿠폰 기능을 만드는 동안, 동료가 `main`에 배송비 수정을 올려요. 두 줄기를 merge와 rebase로 합쳐 보고, 같은 줄을 고쳐 충돌을 일으켜 풀어 봐요.'
intro:
  - '쿠폰 기능을 이틀 만들고 `main`에 합치려는데 "CONFLICT (content): Merge conflict in OrderService.java"가 떠요. 동료는 "rebase해서 올려 주세요"라고 하고, 다른 동료는 "force push 하지 마세요"라고 해요. 둘 다 맞는 말인데 왜 그런지 모르면 명령을 외워서 칠 수밖에 없어요.'
  - '백엔드 개발자는 매일 브랜치를 따고 합쳐요. 코드 리뷰, CI, 배포가 모두 브랜치와 병합 위에서 돌아가요. 팀이 병합 커밋을 남길지 rebase로 한 줄로 만들지, 브랜치를 얼마나 오래 둘지를 정하고, 개발자는 그 규칙대로 충돌을 풀어야 해요.'
  - '이 레슨에서는 테스트 안에서 임시 저장소를 만들고 `git` 명령을 실제로 돌려요. 브랜치 파일 안에 무엇이 있는지, merge와 rebase 뒤에 커밋이 몇 개 생기고 해시가 어떻게 바뀌는지, 충돌이 난 파일이 어떤 모양인지를 출력으로 확인해요.'
covers:
  - topic: '커밋은 파일 전체의 스냅숏과 부모 커밋을 가리키는 기록이다. 해시로 이름 붙는다'
    where: '질문 1'
  - topic: '브랜치는 커밋 하나를 가리키는 이름이다. `.git/refs/heads/<이름>` 파일에 커밋 해시 한 줄이 들어 있다. 그래서 만드는 비용이 거의 없다'
    where: '질문 1'
  - topic: 'HEAD는 지금 작업 중인 브랜치를 가리킨다. 커밋하면 HEAD가 가리키는 브랜치가 새 커밋으로 움직인다'
    where: '질문 1'
  - topic: 'fast-forward 병합: 합칠 쪽이 앞서 있기만 하면 브랜치 이름을 앞으로 옮길 뿐 새 커밋이 없다'
    where: '질문 2'
  - topic: '3-way 병합: 두 줄기가 갈라졌으면 공통 조상, 내 쪽, 상대 쪽 셋을 비교해 부모가 둘인 병합 커밋을 만든다'
    where: '질문 2'
  - topic: '`--no-ff`로 fast-forward가 가능해도 병합 커밋을 남기기, squash merge로 커밋 하나로 합치기'
    where: '질문 2의 더 알아보기'
  - topic: 'rebase는 내 커밋들을 상대 브랜치 끝에 하나씩 다시 적용해 새 커밋을 만든다. 내용이 같아도 해시가 바뀐다. 기록이 한 줄이 된다'
    where: '질문 3'
  - topic: '이미 push해서 남이 받은 커밋을 rebase하면 안 된다. 원격과 기록이 갈라져 force push가 필요하고, 남의 커밋을 지울 수 있다'
    where: '질문 3'
  - topic: '`git pull`은 fetch 다음 merge이고 `--rebase`면 fetch 다음 rebase다'
    where: '질문 3'
  - topic: '충돌은 두 쪽이 같은 줄(또는 붙어 있는 줄)을 다르게 고쳤을 때 생긴다. 다른 줄을 고쳤으면 Git이 알아서 합친다'
    where: '질문 4'
  - topic: '충돌 표시(`<<<<<<<`, `=======`, `>>>>>>>`)를 읽고, 남길 내용으로 고친 뒤 `git add`와 커밋(또는 `rebase --continue`)으로 마친다. `--abort`로 되돌린다'
    where: '질문 4'
  - topic: 'Git은 줄 단위로 합칠 뿐 코드의 뜻을 모른다. 충돌 없이 합쳐져도 컴파일이나 테스트가 깨질 수 있다'
    where: '질문 4'
  - topic: '브랜치 전략: Git flow(develop, release, hotfix 브랜치), GitHub flow(main과 짧은 기능 브랜치, PR), 트렁크 기반 개발(main에 자주 작게 합침)'
    where: '질문 5'
  - topic: '브랜치를 오래 둘수록 충돌이 커진다. 작게 자주 합치는 것이 충돌을 줄이는 가장 쉬운 방법이다'
    where: '질문 5'
  - topic: '올린 커밋을 되돌릴 때는 기록을 지우는 reset이 아니라 되돌리는 커밋을 새로 만드는 revert를 쓴다'
    where: '실무에서는'
  - topic: 'force push가 필요할 때는 `--force-with-lease`로 남이 올린 커밋을 덮지 않게 한다'
    where: '실무에서는'
  - topic: 'PR(풀 리퀘스트)과 코드 리뷰, 브랜치 보호 규칙'
    where: '질문 5'
  - topic: '`.gitignore`로 빌드 결과물과 비밀 값을 올리지 않기'
    where: '실무에서는'
  - topic: 'cherry-pick, stash, reflog로 잃은 커밋 찾기'
    where: '질문 3의 더 알아보기 (reflog만). 나머지는 다루지 않음: 명령 사용법이라 꺼내 볼 원리가 적다'
  - topic: 'PR마다 테스트를 돌리고 main에 합친 것을 배포하는 흐름'
    where: '다루지 않음: CI/CD와 무중단 배포(T6)'
links:
  test: https://github.com/wanja727/dev-lessons/blob/main/verification/src/test/java/lab/devlessons/gitbranch/GitBranchMergeTest.java
  proGitBranch: https://git-scm.com/book/en/v2/Git-Branching-Branches-in-a-Nutshell
  proGitRebase: https://git-scm.com/book/en/v2/Git-Branching-Rebasing
  gitMerge: https://git-scm.com/docs/git-merge
  gitPush: https://git-scm.com/docs/git-push
  githubFlow: https://docs.github.com/en/get-started/using-github/github-flow
  protected: https://docs.github.com/en/repositories/configuring-branches-and-merges-in-your-repository/managing-protected-branches/about-protected-branches
  trunk: https://trunkbaseddevelopment.com/
codes:
  predict: |-
    git switch -c feature/coupon
    # 쿠폰 커밋 2개
    git switch main
    # 동료의 배송비 커밋 1개
    git merge feature/coupon
    git log --oneline | wc -l
  refsRun: |-
    git init -b main
    # 첫 커밋
    git branch feature/coupon
    cat .git/HEAD
    cat .git/refs/heads/feature/coupon
    git rev-parse feature/coupon

    git switch feature/coupon
    # 쿠폰 커밋 1개
  ffMerge: |-
    git switch main
    # main은 그사이 그대로
    git merge feature/coupon
  merge3: |-
    git switch main
    # 동료의 배송비 커밋이 있음
    git merge --no-edit feature/coupon
    git cat-file -p HEAD
  rebase: |-
    git switch feature/coupon
    git [[rebase main]]
    git switch main
    git merge feature/coupon
  pushRun: |-
    git fetch
    git rebase origin/main
    git push origin feature/coupon

    # 그사이 동료가 feature/coupon에 커밋
    git push --force-with-lease ⤶
      origin feature/coupon
  pull: |-
    git pull           # fetch + merge
    git pull --rebase  # fetch + rebase
  conflictRun: |-
    # main: fee = 3000
    # feature/coupon: fee = 2500
    git merge feature/coupon
    git status --short
    cat OrderService.java
  conflict: |-
    [[<<<<<<< HEAD]]
    int fee = 3000;
    [[=======]]
    int fee = 2500;
    [[>>>>>>> feature/coupon]]
  resolve: |-
    # 남길 내용으로 고친 뒤
    git add OrderService.java
    git commit --no-edit

    # 그만두고 시작 전으로
    git merge --abort
  apartRun: |-
    # main: fee 줄을 고침
    # feature/coupon: 맨 아래 줄을 고침
    git merge --no-edit feature/coupon
  semanticRun: |-
    # main: Price.total을
    #   withShipping으로 이름 바꿈
    # feature/coupon: Coupon.java에서
    #   Price.total(p)를 부름
    git merge --no-edit feature/coupon
    javac Price.java Coupon.java
  revert: |-
    git [[revert]] 12b0e0d
    git push
  revertRun: |-
    # "배송비 0원 (실수)"를 되돌린다
    git revert --no-edit 12b0e0d
    git log --format=%s
  forceLease: |-
    git push [[--force-with-lease]]
  gitignore: |-
    build/
    .gradle/
    .idea/
    *.env
predict:
  title: 합친 뒤 커밋은 몇 개일까요?
  text: '`main`에 커밋이 1개 있을 때 `feature/coupon`을 따서 커밋 2개를 했어요. 그사이 동료가 `main`에 커밋 1개를 올렸어요. `main`에서 `git merge feature/coupon`을 하면 `main`의 기록에 커밋이 몇 개 보일까요? 모르는 게 정상이니 감으로 골라 보세요. 답은 질문 2에 나와요.'
  code: predict
  label: 내 예측
  options:
    - {value: '3', label: 3개}
    - {value: '4', label: 4개}
    - {value: '5', label: 5개}
  answer: '5'
  storageKey: git-predict
  wrong: 예측은 "{label}"이었어요. 틀린 예측이 더 오래 남으니 괜찮아요.
questions:
  - id: q1
    title: 브랜치는 무엇인가요?
    conclusion:
      lead: '브랜치는 커밋 하나를 가리키는 이름이에요. 파일 하나에 커밋 해시 한 줄이 들어 있을 뿐이에요.'
      sub: '그래서 브랜치를 만드는 데는 파일을 복사하지 않고, 커밋하면 지금 브랜치(HEAD가 가리키는 것)가 새 커밋으로 한 칸 움직여요.'
    says:
      - '커밋은 그 순간 파일 전체의 스냅숏과 부모 커밋의 해시를 담은 기록이다. 커밋들은 부모를 따라 거꾸로 이어진다'
      - '코드 refs. 테스트로 만든 저장소에서 `.git/refs/heads/feature/coupon` 파일을 열면 40자 해시 한 줄이다. `git rev-parse feature/coupon`의 값과 같다. 실제 출력을 보인다'
      - '`.git/HEAD`에는 `ref: refs/heads/main`이 들어 있다. HEAD는 지금 브랜치를 가리키는 이름이다. `git switch`는 이 파일을 바꾸고 작업 폴더를 그 커밋의 스냅숏으로 바꾼다'
      - '커밋하면 새 커밋의 부모는 지금 브랜치가 가리키던 커밋이고, 브랜치 파일의 해시가 새 커밋으로 바뀐다. 다른 브랜치 파일은 그대로다'
      - '브랜치를 지워도 커밋은 남는다. 이름표만 떼는 것이다'
    asks:
      - '본문의 예시: `feature/coupon`에서 커밋을 하나 더 하면 `.git/refs/heads/main` 파일의 내용은 바뀌나 (바뀌지 않는다. 지금 브랜치의 파일만 바뀐다)'
      - '옮긴 상황: 저장소 크기가 2GB다. 브랜치를 새로 하나 만들면 디스크를 얼마쯤 더 쓰나 (해시 한 줄짜리 파일 하나. 파일을 복사하지 않는다)'
    body:
      - p: '브랜치를 알려면 커밋부터 봐야 해요. **커밋**은 그 순간 저장소의 파일 전체를 찍어 둔 스냅숏이에요. 스냅숏과 함께 "바로 앞 커밋(부모)이 무엇인지"를 기록해요. 커밋마다 내용으로 계산한 40자 해시가 이름으로 붙어요. 커밋들은 부모를 따라 거꾸로 이어진 줄이 돼요.'
      - p: '그럼 브랜치는 무엇일까요? 테스트에서 저장소를 하나 만들고, 첫 커밋 뒤에 `feature/coupon` 브랜치를 만들어 `.git` 폴더 안을 열어 봤어요.'
      - ci:
          key: refs
          label: 실제 출력 보기
          source: GitBranchMergeTest.branchIsAFileWithAHash
          code: refsRun
      - p: '`feature/coupon` 브랜치의 정체는 `.git/refs/heads/feature/coupon` 파일이고, 안에는 **커밋 해시 한 줄**만 있어요. 브랜치는 커밋을 가리키는 이름표예요. 그래서 저장소가 아무리 커도 브랜치를 만드는 데는 이 파일 하나면 돼요.'
      - ul:
          - '**HEAD**는 "지금 어느 브랜치에서 일하나"를 가리키는 이름이에요. `.git/HEAD`에 `ref: refs/heads/main`처럼 브랜치가 적혀 있어요. `git switch`는 이 파일을 바꾸고, 작업 폴더의 파일을 그 브랜치가 가리키는 커밋의 스냅숏으로 바꿔요.'
          - '**커밋하면** 새 커밋의 부모는 지금 브랜치가 가리키던 커밋이 되고, 지금 브랜치의 파일만 새 해시로 바뀌어요. 위 출력에서 `feature/coupon`의 해시는 바뀌었고 `main`은 그대로예요.'
          - '**브랜치를 지워도** 커밋은 남아요. 이름표만 떼는 거예요.'
      - quiz:
          q: '`feature/coupon`에서 커밋을 하나 더 했어요. `.git/refs/heads/main` 파일의 내용은 어떻게 될까요?'
          options:
            - 새 커밋의 해시로 바뀐다
            - 그대로다
            - 파일이 지워진다
          answer: 2
          explain: '커밋하면 HEAD가 가리키는 지금 브랜치의 파일만 새 커밋으로 바뀌어요.'
      - next: '브랜치가 이름표라면, 두 브랜치를 "합친다"는 것은 이름표와 커밋에 무슨 일을 하는 걸까요?'
    recall: '브랜치는 커밋 하나를 가리키는 이름표예요. `.git/refs/heads/` 아래 파일에 커밋 해시 한 줄이 들어 있을 뿐이라 만드는 비용이 거의 없어요. HEAD는 지금 브랜치를 가리키고, 커밋하면 지금 브랜치의 해시만 새 커밋으로 바뀌어요. 커밋은 스냅숏과 부모를 담은 기록이에요.'
  - id: q2
    title: merge는 두 브랜치를 어떻게 합치나요?
    conclusion:
      lead: '한쪽만 앞서 있으면 이름표를 앞으로 옮기고(fast-forward), 두 쪽이 갈라졌으면 부모가 둘인 병합 커밋을 새로 만들어요.'
      sub: '병합 커밋을 만들 때는 공통 조상과 두 끝을 비교해서, 각자 바꾼 부분을 모두 담아요.'
    says:
      - '`main`이 그동안 움직이지 않았으면 `feature/coupon`은 `main`의 앞에 줄지어 있다. 코드 ffMerge처럼 합치면 `main` 이름표가 쿠폰의 마지막 커밋으로 옮겨질 뿐 새 커밋이 없다. 출력에 "Fast-forward"가 나온다'
      - '동료가 `main`에 커밋을 올렸으면 두 줄기가 갈라졌다. 이때 Git은 공통 조상, `main`의 끝, 쿠폰의 끝 셋을 비교한다(3-way 병합). 공통 조상에서 각자 바꾼 것을 함께 담은 새 커밋을 만들고, 그 커밋의 부모는 둘이다'
      - '예측의 답을 밝힌다. `git log --oneline`에 커밋 5개, `git cat-file -p HEAD`에 `parent` 줄이 둘이다. 실제 출력을 보인다'
      - '병합 커밋은 "언제 이 기능이 합쳐졌나"를 기록으로 남긴다. 대신 기록이 갈래로 보인다'
      - '더 알아보기: `git merge --no-ff`는 fast-forward가 되는 상황에서도 병합 커밋을 만든다. `git merge --squash`는 쿠폰의 커밋들을 하나로 뭉친 변경만 가져오고, 부모가 하나인 보통 커밋으로 남는다. 깃허브의 PR 병합 버튼 세 가지(merge, squash, rebase)가 이것에 대응한다'
    widget:
      kind: toggle
      note: '같은 출발점(`main` 1개, 쿠폰 2개)에서 "동료 커밋 없음"과 "동료 커밋 1개"를 고르면 merge 뒤의 커밋 그래프를 보인다. 앞의 것은 이름표만 옮겨지고, 뒤의 것은 부모가 둘인 커밋이 생긴다. 각 장면에 실제 `git log --graph --oneline` 출력을 함께 둔다'
    asks:
      - '본문의 예시: 동료의 커밋이 없을 때 `main`에서 `git merge feature/coupon`을 하면 커밋이 새로 생기나 (생기지 않는다. fast-forward)'
      - '옮긴 상황: 병합 커밋 M을 `git cat-file -p M`으로 열었다. `parent` 줄은 몇 개이고 각각 무엇인가 (둘. 병합 전 `main`의 끝과 합친 브랜치의 끝)'
    body:
      - p: 'merge는 상황에 따라 두 가지로 움직여요. 그사이 `main`에 커밋이 올라왔는지가 갈라요.'
      - h3: 'main이 그대로였으면: fast-forward'
      - p: '쿠폰 커밋 2개를 하는 동안 `main`이 움직이지 않았으면, 쿠폰 브랜치는 `main` 바로 앞에 줄지어 있어요. 이때 합치는 일은 `main` 이름표를 쿠폰의 마지막 커밋으로 **앞으로 옮기는 것**뿐이에요.'
      - ci:
          key: ff
          label: 실제 출력 보기
          source: GitBranchMergeTest.fastForward
          code: ffMerge
      - p: '"Fast-forward"가 나오고 기록은 한 줄 그대로 3개예요. 새 커밋은 없어요.'
      - h3: '두 줄기가 갈라졌으면: 병합 커밋'
      - p: '동료가 그사이 `main`에 배송비 커밋을 올렸으면 이름표만 옮겨서는 동료의 커밋을 잃어요. 이때 Git은 셋을 비교해요. **두 줄기가 갈라진 공통 조상**(첫 커밋), `main`의 끝, 쿠폰의 끝이에요. 그래서 3-way 병합이라고 불러요. 공통 조상에서 각자 바꾼 것을 모두 담은 새 커밋을 만들고, 그 커밋의 **부모는 둘**이에요.'
      - p: '두 경우를 골라 보세요.'
      - widget:
          kind: toggle
          layout: [selector, duo, log, verdict]
          selector:
            label: 쿠폰을 만드는 동안 main은
            options:
              - {value: ff, label: 그대로였다}
              - {value: merge, label: '동료 커밋 1개가 올라왔다'}
          scenes:
            ff:
              duo:
                - label: 합치기 전
                  rows: [{k: main, v: 첫 커밋}, {k: feature/coupon, v: 쿠폰 할인율}]
                - label: 합친 뒤
                  rows: [{k: main, v: '쿠폰 할인율 (이름표만 옮김)', mark: changed}, {k: 새 커밋, v: 없음}]
              log:
                - '* 쿠폰 할인율'
                - '* 쿠폰 클래스'
                - '* 첫 커밋'
              verdict: 'fast-forward. 커밋은 3개 그대로이고 기록은 한 줄이에요.'
            merge:
              duo:
                - label: 합치기 전
                  rows: [{k: main, v: 배송비 수정}, {k: feature/coupon, v: 쿠폰 할인율}]
                - label: 합친 뒤
                  rows: [{k: main, v: 병합 커밋, mark: changed}, {k: 병합 커밋의 부모, v: '배송비 수정, 쿠폰 할인율', mark: changed}]
              log:
                - "*   Merge branch 'feature/coupon'"
                - '|\'
                - '| * 쿠폰 할인율'
                - '| * 쿠폰 클래스'
                - '* | 배송비 수정'
                - '|/'
                - '* 첫 커밋'
              verdict: '병합 커밋이 하나 생겨 커밋은 5개예요. 기록이 갈래로 남아요.'
      - p: '예측의 답이에요. {{predict-result}} 처음 1개, 동료 1개, 쿠폰 2개에 **병합 커밋 1개**가 더해져 5개예요. 병합 커밋을 열어 보면 `parent` 줄이 둘이에요.'
      - ci:
          key: merge
          label: 실제 출력 보기
          source: GitBranchMergeTest.threeWayMerge
          code: merge3
      - p: '첫 `parent`는 병합 전 `main`의 끝(배송비 수정), 둘째는 합친 브랜치의 끝(쿠폰 할인율)이에요. 병합 커밋은 "이 기능이 언제 합쳐졌나"를 기록에 남겨요. 대신 기록이 갈래로 보여서, 브랜치가 많으면 읽기 어려워져요.'
      - more:
          summary: '더 알아보기: --no-ff와 squash merge'
          body:
            - p: '`git merge --no-ff`는 fast-forward가 되는 상황에서도 병합 커밋을 만들어요. 기능 단위로 합친 시점을 꼭 남기고 싶을 때 써요.'
            - p: '`git merge --squash`는 쿠폰의 커밋들을 하나로 뭉친 변경만 가져와요. 그 뒤 커밋하면 부모가 하나인 보통 커밋이 돼요. 깃허브의 PR 병합 버튼 세 가지(Create a merge commit, Squash and merge, Rebase and merge)가 각각 병합 커밋, squash, 다음 질문의 rebase에 해당해요([git-merge 문서](link:gitMerge)).'
      - quiz:
          q: '병합 커밋 M을 `git cat-file -p M`으로 열었어요. `parent` 줄은 몇 개일까요?'
          options:
            - '1개. 합친 브랜치의 끝'
            - '2개. 병합 전 main의 끝과 합친 브랜치의 끝'
            - '3개. 공통 조상과 두 끝'
          answer: 2
          explain: '공통 조상은 비교할 때만 쓰고, 병합 커밋의 부모는 두 줄기의 끝이에요.'
      - next: '병합 커밋 때문에 기록이 갈래로 보이는 게 싫다면, 커밋을 한 줄로 이어 붙일 수는 없을까요?'
    recall: '`main`이 그동안 움직이지 않았으면 fast-forward로 `main` 이름표를 앞으로 옮길 뿐 새 커밋이 없어요. 두 줄기가 갈라졌으면 공통 조상과 두 끝을 비교하는 3-way 병합으로, 양쪽 변경을 담고 부모가 둘인 병합 커밋을 만들어요. 그래서 갈라진 쿠폰 브랜치를 합치면 커밋이 하나 늘어요.'
  - id: q3
    title: rebase는 merge와 무엇이 다른가요?
    conclusion:
      lead: 'rebase는 내 커밋들을 상대 브랜치의 끝에 하나씩 다시 적용해 새 커밋으로 만들어요. 내용이 같아도 해시가 바뀌어요.'
      sub: '그래서 기록이 한 줄로 깔끔해지지만, 이미 push해서 남이 받은 커밋을 rebase하면 원격과 기록이 갈라져요.'
    says:
      - '코드 rebase. `feature/coupon`에서 `git rebase main`을 하면 공통 조상 뒤의 쿠폰 커밋 2개를 떼어 내, 동료 커밋 뒤에 차례로 다시 적용한다. 그다음 `main`에서 merge하면 fast-forward가 되어 병합 커밋 없이 한 줄이 된다'
      - '다시 적용한 커밋은 부모가 달라졌으므로 해시가 다르다. rebase 전과 후의 쿠폰 커밋 해시를 실제 출력으로 비교한다. 메시지와 바뀐 내용은 같다'
      - '이미 원격에 올린 브랜치를 rebase하면 원격의 옛 커밋과 내 새 커밋이 갈라진다. 그냥 `git push`는 거절된다(non-fast-forward). 테스트로 원격 저장소를 만들어 거절 메시지를 보인다'
      - '여기서 `--force`로 밀면 원격의 기록이 내 것으로 바뀐다. 그사이 동료가 그 브랜치에 올린 커밋은 원격에서 사라진다. 그래서 "남과 함께 쓰는 브랜치는 rebase하지 않는다"가 규칙이다'
      - '`git pull`은 fetch 다음 merge다. 내 커밋과 원격 커밋이 갈라져 있으면 병합 커밋이 생긴다. `git pull --rebase`는 내 커밋을 원격 끝에 다시 적용해 한 줄로 만든다. 아직 올리지 않은 내 커밋만 바뀌므로 안전하다'
      - '더 알아보기: rebase 전의 커밋은 지워지지 않고 남아 있다. `git reflog`로 HEAD가 지나온 커밋을 찾아 되돌릴 수 있다'
    asks:
      - '본문의 예시: 쿠폰 커밋 2개를 `main` 위로 rebase했다. 쿠폰 커밋의 해시는 rebase 전과 같은가 (다르다. 부모가 바뀌어 새 커밋이 된다)'
      - '옮긴 상황: 동료와 함께 쓰는 `release/1.2` 브랜치를 로컬에서 rebase한 뒤 `git push`를 했다. 무슨 일이 생기나 (거절된다. 원격과 기록이 갈라졌다. force로 밀면 동료 커밋이 사라질 수 있다)'
      - '실무 구역: 이미 `main`에 올라간 잘못된 커밋을 되돌리려 한다. `git reset --hard`와 force push, `git revert` 가운데 무엇을 쓰나 (revert. 되돌리는 커밋을 새로 만들어 남의 기록을 건드리지 않는다)'
    body:
      - p: '같은 상황(동료 커밋 1개, 쿠폰 커밋 2개)에서 merge 대신 rebase를 해 봤어요.'
      - code: rebase
        notes:
          - mark: rebase main
            as: code
            text: '쿠폰 커밋들을 떼어 내 `main`의 끝에 하나씩 다시 적용해요.'
      - p: '`git rebase main`은 공통 조상 뒤에 있는 쿠폰 커밋 2개를 떼어 내서, 동료의 배송비 커밋 뒤에 **차례로 다시 적용**해요. 그러면 쿠폰 브랜치가 `main` 바로 앞에 줄지어 서니, 이어서 `main`에서 merge하면 질문 2의 fast-forward가 돼요.'
      - ci:
          key: rebase
          label: 실제 출력 보기
          source: GitBranchMergeTest.rebaseMakesNewCommits
          code: rebase
      - p: '두 가지를 보세요. 기록이 병합 커밋 없이 **한 줄로 4개**예요. 그리고 쿠폰 커밋의 **해시가 모두 바뀌었어요**. 메시지와 바뀐 내용은 같지만, 부모가 첫 커밋에서 배송비 커밋으로 달라졌으니 다른 커밋이에요. rebase는 커밋을 옮기는 게 아니라 **새로 만드는** 거예요.'
      - h3: 이미 올린 커밋을 rebase하면
      - p: '해시가 바뀌는 게 문제가 되는 때가 있어요. 쿠폰 브랜치를 이미 원격에 올렸고, 그 뒤에 rebase했다고 해 봐요. 원격에는 옛 쿠폰 커밋이, 내 쪽에는 새 쿠폰 커밋이 있어요. 원격 저장소와 두 사람의 클론을 테스트로 만들어 돌려 봤어요.'
      - ci:
          key: push-rejected
          label: 실제 출력 보기
          source: GitBranchMergeTest.pushAfterRebaseIsRejected
          code: pushRun
      - p: '그냥 `git push`는 **거절**돼요(non-fast-forward). 원격의 쿠폰 커밋이 내 기록에 없으니, 받아들이면 원격의 커밋이 사라지기 때문이에요. 여기서 `git push --force`로 밀면 원격의 기록이 내 것으로 바뀌어요. 그사이 동료가 이 브랜치에 커밋을 올렸다면 그 커밋은 원격에서 사라져요.'
      - callout: '**규칙: 남과 함께 쓰는 브랜치는 rebase하지 않아요.** 아직 올리지 않은 내 커밋이나, 나만 쓰는 브랜치에만 rebase를 써요([Pro Git 3.6](link:proGitRebase)).'
      - p: '매일 쓰는 `git pull`도 같은 갈림이 있어요.'
      - code: pull
      - p: '내 커밋과 원격 커밋이 갈라져 있을 때 `git pull`은 병합 커밋을 만들고, `git pull --rebase`는 **아직 올리지 않은 내 커밋**을 원격의 끝에 다시 적용해요. 바뀌는 것이 내 커밋뿐이라 안전하고, 기록이 한 줄로 남아요.'
      - table:
          head: ['', merge, rebase]
          rows:
            - [기록, 갈래와 병합 커밋이 남아요, 한 줄이에요]
            - [내 커밋의 해시, 그대로예요, 새 커밋이라 바뀌어요]
            - [이미 올린 브랜치, 그대로 push돼요, push가 거절되고 force가 필요해요]
            - [쓰는 곳, 함께 쓰는 브랜치를 합칠 때, 올리기 전 내 브랜치를 최신으로 맞출 때]
      - more:
          summary: '더 알아보기: rebase 전의 커밋은 어디로 갔나요'
          body:
            - p: 'rebase 전의 커밋은 지워지지 않고 저장소에 남아 있어요. 가리키는 이름표만 없어요. `git reflog`는 HEAD가 지나온 커밋을 차례로 보여 줘서, 잘못 rebase했을 때 그 해시로 돌아갈 수 있어요.'
      - quiz:
          q: '동료와 함께 쓰는 `release/1.2` 브랜치를 로컬에서 rebase하고 `git push`를 했어요. 어떻게 될까요?'
          options:
            - 그대로 올라간다
            - '거절된다. 원격과 기록이 갈라졌다'
            - 원격이 자동으로 merge한다
          answer: 2
          explain: 'rebase로 커밋을 새로 만들어 원격의 커밋이 내 기록에 없어요. force로 밀면 동료의 커밋이 사라질 수 있어요.'
      - next: 'merge든 rebase든 두 쪽의 변경을 합쳐요. 그런데 두 쪽이 같은 곳을 고쳤으면 Git은 어느 쪽을 남길까요?'
    recall: 'rebase는 내 커밋들을 상대 브랜치의 끝에 하나씩 다시 적용해 새 커밋으로 만들어요. 부모가 바뀌니 해시가 바뀌고, 기록은 병합 커밋 없이 한 줄이 돼요. 그래서 이미 push한 브랜치를 rebase하면 원격과 기록이 갈라져 push가 거절되고, force로 밀면 남의 커밋을 지울 수 있어요. rebase는 아직 올리지 않은 내 커밋에만 써요.'
  - id: q4
    title: 충돌은 언제 생기고 어떻게 푸나요?
    conclusion:
      lead: '두 쪽이 같은 줄을 서로 다르게 고쳤을 때 생겨요. Git은 어느 쪽이 맞는지 모르니, 두 내용을 표시해 두고 사람에게 고르게 해요.'
      sub: '파일을 남길 내용으로 고치고 `git add` 뒤 커밋하면 병합이 끝나요. 다른 줄을 고쳤으면 충돌 없이 합쳐지지만, 코드의 뜻까지 맞는다는 보장은 없어요.'
    says:
      - '`OrderService.java`의 배송비 줄을 동료는 3000으로, 나는 2500으로 바꿨다. merge하면 "CONFLICT"가 나고 병합이 멈춘다. `git status`에 "both modified"가 나온다. 실제 출력을 보인다'
      - '코드 conflict. 충돌한 파일에는 `<<<<<<< HEAD`부터 `=======`까지 지금 브랜치의 내용, 그 뒤부터 `>>>>>>>`까지 합치려는 브랜치의 내용이 들어간다. 표시 줄을 지우고 남길 내용으로 고친다'
      - '고친 파일을 `git add`하고 `git commit`하면 병합 커밋이 생긴다. rebase 중이면 `git rebase --continue`로 다음 커밋으로 넘어간다. 그만두려면 `git merge --abort`나 `git rebase --abort`로 시작 전으로 돌아간다'
      - '같은 파일이라도 동료는 배송비 줄을, 나는 맨 아래 쿠폰 메서드를 고쳤으면 충돌 없이 둘 다 담긴다. 실제 출력을 보인다'
      - 'Git은 줄을 비교할 뿐 코드를 이해하지 않는다. 동료가 메서드 이름을 바꾸고 나는 다른 파일에서 옛 이름을 불렀으면 충돌 없이 합쳐지고 컴파일이 깨진다. 그래서 합친 뒤에 테스트를 돌린다(T6의 CI가 이 일을 한다)'
    widget:
      kind: classify
      note: '두 브랜치가 고친 곳의 짝을 보고 "충돌 없이 합쳐짐", "충돌", "충돌은 없지만 깨짐"으로 고른다. 같은 줄의 다른 값, 서로 다른 메서드, 한쪽은 이름 바꾸기와 다른 쪽은 옛 이름 호출, 한쪽은 줄 삭제와 다른 쪽은 그 줄 수정 같은 상황을 둔다. 각 답은 테스트로 돌린 결과와 같아야 한다'
    asks:
      - '본문의 예시: 충돌 표시에서 `<<<<<<< HEAD`와 `=======` 사이에 있는 것은 누구의 내용인가 (merge를 실행한 지금 브랜치의 내용)'
      - '옮긴 상황: 한 브랜치는 `Coupon.java`의 10번째 줄을, 다른 브랜치는 같은 파일의 80번째 줄을 고쳤다. merge하면 충돌이 나나 (나지 않는다. 떨어진 다른 줄이라 Git이 둘 다 담는다)'
    body:
      - p: '동료는 `main`에서 배송비를 3000원으로, 나는 쿠폰 브랜치에서 같은 줄을 2500원으로 바꿨어요. 그리고 merge했어요.'
      - ci:
          key: conflict
          label: 실제 출력 보기
          source: GitBranchMergeTest.conflictOnlyOnSameLines
          code: conflictRun
      - p: '"CONFLICT"가 나고 병합이 멈췄어요. `git status --short`의 `UU`는 양쪽이 다 고쳤다(both modified)는 표시예요. 공통 조상의 3500에서 한쪽은 3000, 다른 쪽은 2500으로 바꿨으니, Git은 어느 쪽이 맞는지 알 수 없어요. 그래서 **두 내용을 파일에 함께 적어 두고** 사람에게 맡겨요.'
      - code: conflict
        notes:
          - mark: <<<<<<< HEAD
            as: code
            text: '여기부터 `=======`까지는 지금 브랜치(merge를 실행한 `main`)의 내용이에요.'
          - mark: '>>>>>>> feature/coupon'
            as: code
            text: '`=======`부터 여기까지는 합치려는 브랜치의 내용이에요.'
      - p: '푸는 법은 세 단계예요. 표시 줄 셋을 지우고 **남길 내용으로 고친다**(한쪽을 고르거나 둘을 섞는다). 고친 파일을 `git add`한다. 커밋해서 병합을 마친다. rebase 중에 충돌했으면 커밋 대신 `git rebase --continue`로 다음 커밋으로 넘어가요.'
      - code: resolve
      - p: '어떻게 고칠지 모르겠으면 `--abort`로 merge나 rebase를 시작하기 전으로 돌아갈 수 있어요.'
      - h3: 다른 줄이면 충돌하지 않아요
      - p: '같은 파일이어도 동료는 배송비 줄을, 나는 맨 아래 줄을 고쳤으면 어떨까요?'
      - ci:
          key: no-conflict
          label: 실제 출력 보기
          source: GitBranchMergeTest.conflictOnlyOnSameLines
          code: apartRun
      - p: '충돌 없이 둘 다 담겼어요. Git은 **줄 단위로** 비교해서, 공통 조상에서 한쪽만 바꾼 곳은 그 변경을 그대로 가져와요. 충돌은 같은 줄이나 바로 붙어 있는 줄을 양쪽이 다르게 바꿨을 때만 생겨요. 한쪽이 줄을 지우고 다른 쪽이 그 줄을 고친 경우도 같은 줄을 다르게 바꾼 것이라 충돌해요.'
      - h3: 충돌이 없다고 맞는 것은 아니에요
      - p: 'Git은 줄을 비교할 뿐 코드를 이해하지 않아요. 동료가 `main`에서 메서드 이름을 바꾸고, 나는 쿠폰 브랜치의 다른 파일에서 옛 이름을 불렀어요.'
      - ci:
          key: semantic
          label: 실제 출력 보기
          source: GitBranchMergeTest.cleanMergeCanBreakCompile
          code: semanticRun
      - p: 'merge는 충돌 없이 끝났는데 **컴파일이 깨졌어요**. 서로 다른 파일을 고쳤으니 Git이 보기엔 아무 문제가 없어요. 그래서 합친 뒤에는 꼭 빌드와 테스트를 돌려요. CI/CD와 무중단 배포 레슨의 CI가 PR마다 이 일을 자동으로 해요.'
      - p: '두 브랜치가 고친 곳을 보고 합친 결과를 골라 보세요.'
      - widget:
          kind: classify
          categories:
            - 충돌 없이 합쳐짐
            - 충돌
            - 충돌은 없지만 깨짐
          items:
            - text: '`main`은 배송비 줄을 3000으로, 쿠폰 브랜치는 같은 줄을 2500으로 고쳤어요.'
              answer: 2
              explain: '같은 줄을 서로 다르게 바꿔서 Git이 고를 수 없어요.'
            - text: '`main`은 배송비 줄을, 쿠폰 브랜치는 같은 파일의 맨 아래 줄을 고쳤어요.'
              answer: 1
              explain: '떨어진 다른 줄이라 Git이 두 변경을 모두 담아요.'
            - text: '`main`은 `Price.total`의 이름을 `withShipping`으로 바꿨고, 쿠폰 브랜치는 `Coupon.java`에서 `Price.total`을 불러요.'
              answer: 3
              explain: '서로 다른 파일이라 충돌은 없지만, 합친 코드는 없는 메서드를 불러 컴파일이 깨져요.'
            - text: '`main`은 배송비 줄을 3000으로 고쳤고, 쿠폰 브랜치는 그 줄을 지웠어요.'
              answer: 2
              explain: '한쪽은 고치고 한쪽은 지웠으니 같은 줄을 다르게 바꾼 거예요. 충돌해요.'
      - quiz:
          q: '충돌한 파일에서 `<<<<<<< HEAD`와 `=======` 사이에 있는 것은 누구의 내용일까요?'
          options:
            - merge를 실행한 지금 브랜치의 내용
            - 합치려는 브랜치의 내용
            - 공통 조상의 내용
          answer: 1
          explain: 'HEAD는 지금 브랜치예요. `=======` 아래가 합치려는 브랜치의 내용이에요.'
      - next: '충돌은 같은 줄을 오래 따로 고칠수록 잦아져요. 그럼 팀은 브랜치를 어떻게 나눠 써야 충돌이 줄까요?'
    recall: '두 쪽이 같은 줄이나 붙은 줄을 서로 다르게 고쳤을 때 충돌이 생겨요. Git은 `<<<<<<< HEAD`부터 `=======`까지 지금 브랜치의 내용, 그 아래 `>>>>>>>`까지 합치려는 브랜치의 내용을 파일에 적어 두고 멈춰요. 남길 내용으로 고치고 `git add` 뒤 커밋(rebase면 `--continue`)하면 끝나고, `--abort`로 그만둬요. 다른 줄은 알아서 합쳐지지만 코드의 뜻은 모르니 합친 뒤 테스트를 돌려요.'
  - id: q5
    title: 팀은 브랜치를 어떻게 나눠 쓰나요?
    conclusion:
      lead: '요즘 웹 서비스 팀은 `main` 하나를 두고 짧게 사는 기능 브랜치를 자주 합치는 방식을 많이 써요.'
      sub: '브랜치가 오래 살수록 `main`과 멀어져 충돌이 커지기 때문이에요. 여러 버전을 따로 유지해야 하는 제품은 릴리스 브랜치를 두는 Git flow가 맞기도 해요.'
    says:
      - 'Git flow: `main`, `develop`, 기능, 릴리스, 핫픽스 브랜치를 둔다. 배포 버전을 정해서 내보내는 제품(설치형 소프트웨어, 앱)에 맞는다. 브랜치가 많고 오래 산다'
      - 'GitHub flow: `main`은 언제나 배포할 수 있는 상태다. 기능마다 짧은 브랜치를 따서 PR(풀 리퀘스트)로 리뷰받고 `main`에 합친 뒤 배포한다. PR은 "이 브랜치를 합쳐 달라"는 요청이고, 리뷰와 CI 결과가 그 위에 모인다'
      - '트렁크 기반 개발: 모두가 `main`(트렁크)에 하루에 한 번 이상 작게 합친다. 덜 된 기능은 설정 값(기능 플래그)으로 꺼 둔다'
      - '브랜치가 오래 살면 그사이 `main`에 쌓인 변경과 같은 줄을 고칠 일이 많아져 충돌이 커진다(질문 4의 "같은 줄"). 작게 자주 합치는 것이 충돌을 줄이는 가장 쉬운 방법이다. 이것은 테스트가 아니라 원리로 설명한다'
      - '`main`은 브랜치 보호 규칙으로 지킨다: 직접 push 금지, 리뷰 승인과 CI 통과가 있어야 병합. 깃허브 문서를 근거로 단다'
    widget:
      kind: classify
      note: '팀 상황(웹 서비스를 하루 여러 번 배포, 모바일 앱을 2주마다 스토어에 출시하며 옛 버전에 핫픽스, 혼자 하는 사이드 프로젝트)을 보고 Git flow, GitHub flow, 트렁크 기반 가운데 맞는 것을 고른다'
    asks:
      - '본문의 예시: GitHub flow에서 `main` 브랜치는 어떤 상태여야 하나 (언제든 배포할 수 있는 상태)'
      - '옮긴 상황: 쿠폰 브랜치를 3주째 합치지 않고 있다. 그사이 `main`에 커밋 120개가 올라왔다. 합칠 때 생길 일과 줄이는 방법은 (충돌이 커진다. 작게 나눠 자주 합치거나 `main`을 자주 받아 둔다)'
    body:
      - p: '브랜치를 어떻게 나눠 쓸지 정한 팀의 약속을 **브랜치 전략**이라고 해요. 많이 쓰는 셋이 있어요. 이 질문은 테스트가 아니라 각 방식의 공식 설명을 근거로 해요.'
      - table:
          head: [전략, 브랜치, 맞는 곳]
          rows:
            - ['Git flow', '`main`, `develop`, 기능, 릴리스, 핫픽스. 많고 오래 살아요', '버전을 정해서 내보내고 옛 버전도 고쳐야 하는 제품(앱, 설치형 소프트웨어)']
            - ['GitHub flow', '`main`과 짧은 기능 브랜치. PR로 리뷰받고 합친 뒤 배포해요', '하루에도 여러 번 배포하는 웹 서비스']
            - ['트렁크 기반 개발', '모두 `main`에 하루 한 번 이상 작게 합쳐요. 덜 된 기능은 설정 값으로 꺼 둬요', '배포가 아주 잦고 테스트 자동화가 갖춰진 팀']
      - p: '[GitHub flow](link:githubFlow)에서 **PR(풀 리퀘스트)**은 "이 브랜치를 `main`에 합쳐 달라"는 요청이에요. 동료의 리뷰와 CI의 테스트 결과가 PR 위에 모이고, 통과하면 합쳐요. 그래서 `main`은 **언제든 배포할 수 있는 상태**로 남아요.'
      - p: '요즘 웹 서비스 팀이 짧은 브랜치를 선호하는 이유는 질문 4에 있어요. 충돌은 같은 줄을 따로 고칠 때 생기는데, 브랜치가 오래 살수록 그사이 `main`에 쌓인 변경과 같은 줄을 고칠 일이 많아져요. 하루 만에 합치면 줄 몇 개로 끝날 충돌이 한 달 뒤에는 파일 수십 개가 돼요. [트렁크 기반 개발](link:trunk)은 이것을 끝까지 밀어붙여 "합치지 않은 채 오래 두지 않는다"를 규칙으로 삼아요.'
      - p: '`main`은 [브랜치 보호 규칙](link:protected)으로 지켜요. 직접 push를 막고, 리뷰 승인과 CI 통과가 있어야 PR을 합칠 수 있게 해요.'
      - p: '상황마다 맞는 전략을 골라 보세요.'
      - widget:
          kind: classify
          categories:
            - Git flow
            - GitHub flow
            - 트렁크 기반 개발
          items:
            - text: '모바일 앱을 2주마다 스토어에 내고, 이미 낸 버전 1.4에도 급한 수정을 따로 내보내야 해요.'
              answer: 1
              explain: '버전마다 릴리스 브랜치와 핫픽스 브랜치를 두는 Git flow가 맞아요.'
            - text: '웹 서비스를 하루에 몇 번씩 배포하고, 기능마다 PR로 리뷰를 받아요.'
              answer: 2
              explain: '`main`을 늘 배포할 수 있게 두고 짧은 기능 브랜치를 PR로 합치는 방식이에요.'
            - text: '모두가 하루에 여러 번 `main`에 직접 작게 합치고, 덜 된 기능은 설정 값으로 꺼 둬요.'
              answer: 3
              explain: '기능 브랜치를 거의 두지 않고 트렁크에 바로 합치는 방식이에요.'
      - quiz:
          q: 'GitHub flow에서 `main` 브랜치는 어떤 상태여야 할까요?'
          options:
            - 다음 릴리스를 모으는 중이라 깨져 있어도 된다
            - 언제든 배포할 수 있는 상태
            - 배포가 끝난 커밋만 모은다
          answer: 2
          explain: '기능은 짧은 브랜치에서 만들고, 리뷰와 CI를 통과한 것만 `main`에 합쳐요.'
    recall: '요즘 웹 서비스 팀은 `main` 하나를 언제든 배포할 수 있게 두고, 짧은 기능 브랜치를 PR로 리뷰받아 자주 합치는 GitHub flow나, 모두 `main`에 작게 자주 합치는 트렁크 기반 개발을 많이 써요. 브랜치가 오래 살수록 같은 줄을 따로 고칠 일이 늘어 충돌이 커지기 때문이에요. 버전을 정해 내보내고 옛 버전도 고쳐야 하는 제품은 릴리스와 핫픽스 브랜치를 두는 Git flow가 맞아요.'
practice:
  title: 실무에서는 이렇게 써요
  says:
    - '이 저장소의 실제 방식을 예로 든다: 혼자 개발해서 `main` 하나로 관리하고, 세션마다 워크트리 브랜치에서 일한 뒤 `git rebase origin/main` 다음 `git push origin HEAD:main`으로 올린다(CLAUDE.md "올리는 방식"). 올리기 전에 rebase하니 기록이 한 줄이다'
    - '흔한 실수 하나: 이미 올린 잘못된 커밋을 `git reset --hard HEAD~1`과 `git push --force`로 지운다. 동료가 그 커밋을 받았으면 다음 pull에서 다시 살아나거나 동료의 커밋이 지워진다. 고친 코드: 코드 revert. 되돌리는 커밋을 새로 만들어 기록을 지우지 않는다. 테스트에서 revert 뒤 커밋이 하나 늘고 파일이 원래대로인 것을 보인다'
    - '흔한 실수 둘: 내 기능 브랜치를 rebase한 뒤 `--force`로 민다. 리뷰어가 그 브랜치에 커밋을 올렸으면 사라진다. 고친 코드: 코드 forceLease. 원격이 내가 마지막으로 본 상태일 때만 덮어쓴다. 테스트로 원격에 남의 커밋이 생긴 뒤 `--force-with-lease`가 거절되는 것을 보인다'
    - '`.gitignore`에 `build/`, `.gradle/`, `*.env`를 둔다. 이미 커밋한 파일은 `.gitignore`에 넣어도 계속 추적된다. `git rm --cached`로 뺀다. 비밀 값을 한 번 올렸으면 기록에 남으므로 값을 바꾼다'
  body:
    - p: '이 레슨이 들어 있는 저장소도 이 원리로 돌아가요. 혼자 개발하는 저장소라 `main` 하나로 관리하고, 작업마다 따로 만든 브랜치에서 일한 뒤 `git rebase origin/main`으로 최신 `main` 위에 내 커밋을 다시 적용하고 `git push origin HEAD:main`으로 올려요. 올리기 전에 rebase하니 병합 커밋 없이 기록이 한 줄이고, 아직 올리지 않은 내 커밋만 바뀌니 안전해요(질문 3).'
    - h3: '흔한 실수: 올린 커밋을 reset과 force push로 지운다'
    - p: '배송비를 0원으로 바꾼 실수 커밋을 `main`에 올렸어요. `git reset --hard HEAD~1`과 `git push --force`로 지우면 원격의 기록이 바뀌어요. 그 커밋을 이미 받은 동료가 다음에 push하면 실수 커밋이 다시 살아나거나, 동료가 그사이 올린 커밋이 사라져요. 질문 3에서 본 "남과 함께 쓰는 브랜치의 기록을 바꾸는 일"이에요.'
    - p: '고친 방법은 **revert**예요. 실수 커밋의 변경을 거꾸로 적용한 커밋을 새로 만들어요. 기록을 지우지 않으니 그냥 push돼요.'
    - code: revert
      notes:
        - mark: revert
          as: code
          text: '지우지 않고, 되돌리는 커밋을 하나 더 만들어요.'
    - ci:
        key: revert
        label: 실제 출력 보기
        source: GitBranchMergeTest.revertAddsACommit
        code: revertRun
    - p: '커밋이 3개로 하나 늘었고 파일은 실수 전의 3000원으로 돌아왔어요. 실수와 되돌림이 모두 기록에 남아서, 나중에 무슨 일이 있었는지도 알 수 있어요.'
    - h3: '흔한 실수: rebase한 내 브랜치를 --force로 민다'
    - p: '내 기능 브랜치를 PR에 올린 뒤 `main`을 받아 rebase했어요. 질문 3대로 그냥 push는 거절되니 force가 필요해요. 그런데 그사이 리뷰어가 이 브랜치에 커밋을 올렸다면 `--force`는 그 커밋을 지워요. **`--force-with-lease`**를 쓰면 원격이 내가 마지막으로 받아 본 상태일 때만 덮어써요.'
    - code: forceLease
      notes:
        - mark: --force-with-lease
          as: code
          text: '원격이 내가 마지막으로 본 상태와 다르면 거절해요.'
    - p: '질문 3의 실제 출력 아래쪽이 이 경우예요. 동료가 커밋을 올린 뒤라서 `--force-with-lease`가 "stale info"로 거절했어요. 이때는 `git fetch`로 동료의 커밋을 받아 다시 rebase한 뒤 올려요([git-push 문서](link:gitPush)).'
    - h3: '.gitignore로 올리지 않을 것을 정해요'
    - code: gitignore
    - p: '빌드 결과물, IDE 설정, 비밀 값이 든 파일은 `.gitignore`에 적어 추적하지 않아요. 이미 커밋한 파일은 `.gitignore`에 넣어도 계속 추적되니 `git rm --cached 파일`로 추적에서 빼요. 비밀번호나 토큰을 한 번 커밋했다면 지워도 기록에 남아 있으니, 그 값 자체를 새로 바꿔요.'
interview:
  question: 'merge와 rebase의 차이를 설명하고, 충돌은 언제 생기는지 말해 주세요'
  model:
    - label: 정의
      text: 브랜치는 커밋 하나를 가리키는 이름입니다. merge는 두 줄기를 합치는데, 한쪽만 앞서 있으면 이름을 앞으로 옮기는 fast-forward를 하고, 갈라졌으면 공통 조상과 두 끝을 비교해 부모가 둘인 병합 커밋을 만듭니다. rebase는 내 커밋들을 상대 브랜치 끝에 하나씩 다시 적용해 새 커밋으로 만듭니다.
    - label: 원리
      text: rebase는 부모가 바뀌니 해시가 바뀌고 기록이 한 줄이 됩니다. 충돌은 두 쪽이 같은 줄을 다르게 고쳤을 때 생기고, Git이 두 내용을 표시해 두면 사람이 고른 뒤 add와 커밋으로 마칩니다.
    - label: 주의할 점
      text: 이미 push해서 남이 받은 커밋을 rebase하면 원격과 기록이 갈라져 force push가 필요하고 남의 커밋을 지울 수 있습니다. 그래서 rebase는 올리기 전 내 커밋에만 쓰고, 올린 커밋은 revert로 되돌리며, force가 필요하면 force-with-lease를 씁니다. 충돌이 없어도 코드의 뜻은 깨질 수 있어 합친 뒤 테스트를 돌립니다.
    - label: 경험
      text: '(내 프로젝트로 채우기) 예: 기능 브랜치를 오래 두었다가 충돌이 커져서, 이후로는 작게 나눠 하루 안에 PR을 합치고 올리기 전에 pull --rebase로 맞췄습니다.'
verified: 이 레슨의 출력은 짐작이 아니라 테스트가 임시 저장소를 만들어 `git` 명령을 실제로 돌려 받은 값이에요. 커밋 해시는 실행할 때마다 달라요. 코드가 바뀔 때마다 테스트([GitBranchMergeTest](link:test))가 다시 돌아요.
footer: '근거: 커밋과 브랜치는 [Pro Git 3.1](link:proGitBranch), rebase와 공유 브랜치의 규칙은 [Pro Git 3.6](link:proGitRebase), 병합 방식은 [git-merge 문서](link:gitMerge), `--force-with-lease`는 [git-push 문서](link:gitPush), 브랜치 전략은 [GitHub flow](link:githubFlow)와 [트렁크 기반 개발](link:trunk). 결과는 Git 2.4x에서 테스트로 확인했어요. 오류는 [GitHub 이슈](https://github.com/wanja727/dev-lessons/issues)로 알려 주세요.'
claims:
  - claim: '브랜치 파일 `.git/refs/heads/<이름>`의 내용은 커밋 해시 한 줄이고 `git rev-parse`의 값과 같다. `.git/HEAD`는 `ref: refs/heads/main`이다'
    how: '테스트가 임시 폴더에 `git init`을 하고 `ProcessBuilder`로 `git` 명령을 돌린다. 브랜치를 만든 직후 refs 파일을 읽는다'
    test: GitBranchMergeTest.branchIsAFileWithAHash
  - claim: '갈라지지 않은 브랜치를 merge하면 "Fast-forward"가 나오고 커밋 수가 그대로다'
    how: '`git rev-list --count`로 merge 전후를 센다'
    test: GitBranchMergeTest.fastForward
  - claim: '갈라진 브랜치를 merge하면 커밋이 5개가 되고 HEAD 커밋의 `parent` 줄이 둘이다'
    how: '`git cat-file -p HEAD`의 출력을 남긴다'
    test: GitBranchMergeTest.threeWayMerge
  - claim: 'rebase 뒤 쿠폰 커밋 2개의 해시가 모두 바뀌고 메시지는 같다. 그 뒤 merge는 fast-forward다'
    how: 'rebase 전후의 `git log --format=%h %s`를 비교한다'
    test: GitBranchMergeTest.rebaseMakesNewCommits
  - claim: '원격에 올린 브랜치를 rebase한 뒤 그냥 push하면 non-fast-forward로 거절되고, 원격에 남의 커밋이 생긴 뒤에는 `--force-with-lease`도 stale info로 거절된다'
    how: '`git init --bare`로 원격을 만들고 두 클론으로 두 사람을 흉내 낸다'
    test: GitBranchMergeTest.pushAfterRebaseIsRejected
  - claim: '같은 줄을 다르게 고치거나 한쪽이 지운 줄을 다른 쪽이 고치면 충돌하고, 떨어진 다른 줄을 고치면 충돌 없이 합쳐진다'
    how: '세 경우의 merge 종료 코드, `git status --short`, 파일 내용을 남긴다'
    test: GitBranchMergeTest.conflictOnlyOnSameLines
  - claim: '한쪽이 메서드 이름을 바꾸고 다른 쪽이 다른 파일에서 옛 이름을 부르면 충돌 없이 합쳐지고 컴파일이 실패한다'
    how: '합친 결과의 자바 파일을 `JavaSource`로 컴파일한다'
    test: GitBranchMergeTest.cleanMergeCanBreakCompile
  - claim: '`git revert`는 커밋을 하나 더 만들고 파일을 되돌린 커밋 전으로 돌린다'
    how: 'revert 전후의 커밋 수와 파일 내용을 비교한다'
    test: GitBranchMergeTest.revertAddsACommit
sources:
  - '커밋, 브랜치, HEAD의 정의: Pro Git 3.1 https://git-scm.com/book/en/v2/Git-Branching-Branches-in-a-Nutshell'
  - 'fast-forward와 3-way 병합: git-merge 문서 https://git-scm.com/docs/git-merge'
  - 'rebase와 공유 브랜치를 rebase하지 말라는 것: Pro Git 3.6 https://git-scm.com/book/en/v2/Git-Branching-Rebasing'
  - '`--force-with-lease`: git-push 문서 https://git-scm.com/docs/git-push'
  - 'GitHub flow와 브랜치 보호 규칙: https://docs.github.com/en/get-started/using-github/github-flow , https://docs.github.com/en/repositories/configuring-branches-and-merges-in-your-repository/managing-protected-branches/about-protected-branches'
  - '트렁크 기반 개발: https://trunkbaseddevelopment.com/'
