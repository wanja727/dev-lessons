# 다대다와 매핑 테이블
# 자료 파일의 칸은 docs/lesson-data-format.md에 있다. 문제는 content/questions/many-to-many-table.yaml에 있다.
# N:M이 왜 매핑 테이블이 되는지는 테이블 관계 설계(D17, table-relationships)의 질문 5가 맡는다. 이 레슨은 그 매핑 테이블을 어떻게 만드는지 다룬다.
title: 다대다와 매핑 테이블
description: 매핑 테이블에 같은 쌍이 두 번 들어가면 무슨 일이 생기는지, 기본 키를 복합 키로 둘지 따로 id를 둘지, 양쪽 방향 조회에 인덱스를 어떻게 두는지, 가입일과 역할은 어디에 두는지, 부모를 지울 때 매핑 행은 어떻게 하는지. 다섯 가지 질문에 스스로 답할 수 있게 회원과 스터디의 매핑 테이블로 배우는 대화형 레슨.
unit: DB
minutes: 25
roadmap: D18
type: 설계
prerequisites:
  - slug: table-relationships
    title: 테이블 관계 설계
  - slug: index-explain
    title: 인덱스와 실행계획
assume: 'PostgreSQL 16. N:M을 매핑 테이블로 푸는 이유([테이블 관계 설계](lesson:table-relationships) 질문 5), 복합 인덱스의 열 순서와 EXPLAIN 읽기([인덱스와 실행계획](lesson:index-explain)), ON DELETE의 세 가지 규칙([키와 제약 조건](lesson:keys-constraints) 질문 2). 실무 구역은 JPA의 `@ManyToOne`을 한 번 본 정도면 돼요.'
example: '스터디 서비스의 회원(`member`)과 스터디(`study`), 그 사이의 매핑 테이블 `study_member(member_id, study_id)`. kim은 자바 스터디와 SQL 스터디에, lee는 자바 스터디에 있어요. 키, 인덱스, 열, 삭제 규칙을 하나씩 바꿔 가며 들어가는 데이터와 실행계획을 봐요.'
intro:
  - '스터디 가입 버튼을 빠르게 두 번 누른 kim이 멤버 목록에 두 번 나와요. 스터디 정원은 10명인데 9명만 들어왔는데도 "정원이 찼어요"가 떠요. 또 다른 날에는 "이 스터디의 회원" 화면만 유난히 느려요. "kim의 스터디" 화면은 빠른데요.'
  - 'N:M을 매핑 테이블로 풀기로 한 다음에도 정할 것이 남아 있어요. 기본 키, 같은 쌍을 막는 제약, 어느 방향으로 찾을지에 맞춘 인덱스, 가입일 같은 열, 회원이나 스터디를 지울 때의 규칙이에요. JPA의 `@ManyToMany`는 이 테이블을 감춰 주지만, 감춘 테이블은 이 가운데 몇 가지를 기본값으로 정해 버려요.'
  - '이 레슨에서는 PostgreSQL에 매핑 테이블을 여러 모양으로 만들어 같은 쌍을 두 번 넣고, 10만 행에서 양쪽 방향의 실행계획을 비교하고, 부모를 지워 남는 행을 봐요. 마지막에 하이버네이트가 `@ManyToMany`로 실제로 보내는 SQL을 봐요.'
covers:
  - topic: '매핑 테이블은 두 외래 키를 갖고, 행 하나가 짝 하나다'
    where: '질문 1. 왜 매핑 테이블인지는 테이블 관계 설계(D17) 질문 5'
  - topic: '같은 쌍이 두 행이면 인원 수(count)와 조인 결과가 부풀어 오른다. 외래 키는 이것을 막지 않는다'
    where: '질문 1'
  - topic: '같은 쌍은 (member_id, study_id)의 복합 기본 키나 UNIQUE로 DB가 막는다. 앱의 사전 확인은 동시 요청을 못 막는다'
    where: '질문 1. 동시 요청은 키와 제약 조건(D1) 질문 4'
  - topic: '기본 키를 복합 키로 두면 그 자체로 같은 쌍을 막고 인덱스가 하나다. 따로 id를 두면 (member_id, study_id)에 UNIQUE를 따로 걸어야 하고 인덱스가 둘이다'
    where: '질문 2'
  - topic: '복합 기본 키를 다른 테이블이 가리키려면 외래 키도 두 열이다. 따로 id를 두면 한 열이다'
    where: '질문 2'
  - topic: 'JPA에서 복합 키는 `@IdClass`나 `@EmbeddedId`가 필요하다'
    where: '질문 2'
  - topic: '어느 쪽을 고르나: 다른 테이블이 가리키지 않는 순수한 연결은 복합 키, 엔티티로 다루며 다른 테이블이 가리키면 id와 UNIQUE'
    where: '질문 2'
  - topic: '복합 키 (member_id, study_id)의 인덱스는 member_id로 찾을 때만 쓰인다. study_id로 찾으면 Seq Scan이라 (study_id, member_id) 인덱스를 더한다'
    where: '질문 3. 열 순서의 원리는 인덱스와 실행계획(D7) 질문 3'
  - topic: '두 열을 다 담은 인덱스는 테이블을 읽지 않는다(Index Only Scan). 둘째 인덱스는 study_id 외래 키의 인덱스도 겸한다'
    where: '질문 3'
  - topic: '같은 테이블끼리의 N:M(팔로우)도 양쪽 방향 인덱스가 필요하다'
    where: '질문 3의 더 알아보기'
  - topic: '가입일, 역할처럼 짝에 딸린 값은 매핑 테이블의 열이다. 회원이나 스터디에 두면 스터디마다 다른 값을 담을 수 없다'
    where: '질문 4'
  - topic: '속성이 생긴 매핑 테이블은 엔티티로 보고 이름을 붙인다(멤버십, 수강)'
    where: '질문 4'
  - topic: '탈퇴와 재가입 기록을 남기면 같은 쌍이 다시 생긴다. 복합 기본 키는 재가입을 막고, 부분 유니크 인덱스(`where left_at is null`)는 활동 중인 짝만 하나로 막는다'
    where: '질문 4'
  - topic: '역할 값은 CHECK로 정한 값만 받게 한다'
    where: '질문 4. CHECK는 키와 제약 조건(D1) 질문 3'
  - topic: '짝만 뜻하는 매핑 행은 양쪽 외래 키에 ON DELETE CASCADE를 걸어 부모와 함께 지운다. 상대 엔티티는 지워지지 않는다'
    where: '질문 5'
  - topic: '매핑 행이 남겨야 할 기록(성적, 주문 항목)이면 기본(NO ACTION)으로 부모 삭제를 막고, 부모는 지우지 않고 상태로 표시한다'
    where: '질문 5'
  - topic: '키 열에 ON DELETE SET NULL은 NOT NULL 위반(23502)으로 실패한다'
    where: '질문 5'
  - topic: '`@ManyToMany`의 매핑 테이블에는 열을 더할 수 없다. List로 두면 매핑 테이블에 기본 키가 없어 같은 쌍이 들어가고, 하나를 빼면 그 회원의 행을 모두 지우고 다시 넣는다. Set이면 기본 키가 있고 한 행만 지운다'
    where: '실무에서는'
  - topic: '연결 엔티티(`@ManyToOne` 둘)와 마이그레이션의 UNIQUE, 반대 방향 인덱스, CASCADE'
    where: '실무에서는'
  - topic: '버튼 두 번에도 오류 없이 한 번만 넣기: `on conflict do nothing`'
    where: '실무에서는'
  - topic: '연결 엔티티를 목록으로 꺼낼 때 쿼리가 늘어나는 문제'
    where: '다루지 않음: JPA N+1 문제(P5)'
  - topic: '실행계획으로 느린 쿼리를 찾고 고치는 과정'
    where: '다루지 않음: 느린 쿼리 고치기(D14)'
links:
  test: https://github.com/wanja727/dev-lessons/blob/main/verification/src/test/java/lab/devlessons/manytomany/ManyToManyTableTest.java
  constraints: https://www.postgresql.org/docs/16/ddl-constraints.html
  multicolumn: https://www.postgresql.org/docs/16/indexes-multicolumn.html
  indexonly: https://www.postgresql.org/docs/16/indexes-index-only-scans.html
  partial: https://www.postgresql.org/docs/16/indexes-partial.html
  insert: https://www.postgresql.org/docs/16/sql-insert.html
  jpa: https://jakarta.ee/specifications/persistence/3.1/jakarta-persistence-spec-3.1.html
  hibernate: https://docs.hibernate.org/orm/6.6/userguide/html_single/
codes:
  predict: |-
    -- 기본 키도 UNIQUE도 없는 매핑 테이블
    insert into study_member
    values (1, 1),  -- kim, 자바
           (1, 1),  -- kim이 한 번 더 누름
           (2, 1);  -- lee, 자바

    select count(*) from study_member
     where study_id = 1;
  pk: |-
    create table study_member (
      member_id bigint not null
        references member(id),
      study_id bigint not null
        references study(id),
      [[primary key (member_id, study_id)]]
    );
  surrogate: |-
    create table study_member (
      [[id bigint generated always]]
         [[as identity primary key]],
      member_id bigint not null
        references member(id),
      study_id bigint not null
        references study(id),
      unique (member_id, study_id)
    );
  attendance: |-
    create table attendance (
      id bigint primary key,
      member_id bigint not null,
      study_id bigint not null,
      attended_on date not null,
      [[foreign key (member_id, study_id)]]
        references study_member
          (member_id, study_id)
    );
  byMember: |-
    -- 회원 42의 스터디
    select study_id from study_member
     where member_id = 42;
  byStudy: |-
    -- 스터디 42의 회원
    select member_id from study_member
     where study_id = 42;
  reverseIndex: |-
    create index study_member_study_idx
      on study_member ([[study_id, member_id]]);
  follow: |-
    create table follow (
      follower_id bigint not null
        references member(id),
      followee_id bigint not null
        references member(id),
      primary key
        (follower_id, followee_id)
    );
    -- 나를 팔로우하는 사람
    create index follow_followee_idx
      on follow (followee_id, follower_id);
  roleOnMember: |-
    alter table member
      add column [[role]] text;
    -- kim은 자바 스터디의 LEADER,
    -- SQL 스터디의 MEMBER인데?
  attrs: |-
    create table study_member (
      member_id bigint not null
        references member(id),
      study_id bigint not null
        references study(id),
      [[role text not null]]
        check (role in
          ('LEADER', 'MEMBER')),
      [[joined_at date not null]],
      primary key (member_id, study_id)
    );
  history: |-
    create table study_member (
      id bigint generated always
         as identity primary key,
      member_id bigint not null
        references member(id),
      study_id bigint not null
        references study(id),
      role text not null,
      joined_at date not null,
      [[left_at date]]
    );
    create unique index
        study_member_active
      on study_member
        (member_id, study_id)
      [[where left_at is null]];
  cascade: |-
    create table study_member (
      member_id bigint not null
        references member(id)
        [[on delete cascade]],
      study_id bigint not null
        references study(id)
        [[on delete cascade]],
      primary key (member_id, study_id)
    );
  enrollment: |-
    create table enrollment (
      member_id bigint not null
        references member(id),
      study_id bigint not null
        references study(id),
      [[grade text]],
      primary key (member_id, study_id)
    );
  setNull: |-
    member_id bigint
      references member(id)
      [[on delete set null]],
  manyToMany: |-
    @Entity
    class Member {
      @ManyToMany
      @JoinTable(name = "member_study",
        joinColumns = @JoinColumn(
          name = "member_id"),
        inverseJoinColumns = @JoinColumn(
          name = "study_id"))
      [[List<Study>]] studies =
          new ArrayList<>();
    }
  removeOne: |-
    Member kim = em.find(Member.class, 1L);
    kim.getStudies().remove(0);
  entity: |-
    @Entity
    @Table(name = "study_member",
      uniqueConstraints =
        @UniqueConstraint(columnNames =
          {"member_id", "study_id"}))
    class StudyMember {
      @Id @GeneratedValue(
          strategy = IDENTITY)
      Long id;

      [[@ManyToOne]](fetch = LAZY)
      @JoinColumn(name = "member_id")
      Member member;

      [[@ManyToOne]](fetch = LAZY)
      @JoinColumn(name = "study_id")
      Study study;

      String role;
      LocalDate joinedAt;
    }
  migration: |-
    -- V2__create_study_member.sql
    create table study_member (
      id bigint generated always
         as identity primary key,
      member_id bigint not null
         references member(id)
         on delete cascade,
      study_id bigint not null
         references study(id)
         on delete cascade,
      role text not null,
      joined_at date not null,
      [[unique (member_id, study_id)]]
    );
    [[create index study_member_study_idx]]
      on study_member (study_id, member_id);
  join: |-
    jdbc.update("""
        insert into study_member
          (member_id, study_id)
        values (?, ?)
        [[on conflict (member_id, study_id)]]
          [[do nothing]]""",
        memberId, studyId);
predict:
  title: 버튼을 두 번 누르면 인원은 몇 명?
  text: '매핑 테이블 `study_member`에 기본 키도 UNIQUE도 없어요. kim이 자바 스터디 가입 버튼을 두 번 눌렀고, lee도 가입했어요. 자바 스터디의 인원을 세면 얼마가 나올까요? 감으로 골라 보세요. 답은 질문 1에 나와요.'
  code: predict
  label: 내 예측
  options:
    - value: two
      label: 2명
    - value: three
      label: 3명
    - value: error
      label: 둘째 insert가 실패해서 2명
  answer: three
  storageKey: mtm-predict
  wrong: 예측은 "{label}"이었어요. 틀린 예측이 더 오래 남으니 괜찮아요.
questions:
  - id: q1
    title: 매핑 테이블에 같은 쌍이 두 번 들어가면 무슨 일이 생기나요?
    conclusion:
      lead: '같은 회원이 같은 스터디에 두 행으로 남아서, 인원 수와 조인 결과가 실제보다 부풀어요.'
      sub: '외래 키는 "가리키는 회원과 스터디가 있나"만 보고 짝이 겹치는지는 보지 않아요. (member_id, study_id)에 기본 키나 UNIQUE를 걸어야 DB가 둘째 행을 막아요.'
    says:
      - '예측의 답을 밝힌다. 키 없는 매핑 테이블에 (1, 1), (1, 1), (2, 1)을 넣으면 자바 스터디 인원 count(*)가 3이다. 회원 목록을 조인하면 kim이 두 번 나온다. 실제 출력을 보인다'
      - '외래 키는 둘 다 지켜졌다. 회원 1도, 스터디 1도 있다. 외래 키는 가리키는 대상이 있는지만 보고 짝이 겹치는지는 보지 않는다'
      - '매핑 테이블에서 한 짝은 한 사실이다. 같은 사실이 두 행이면 count, 정원 검사, 조인한 목록이 모두 틀린다. 조인으로 행이 늘어나는 것(D2 질문 3)과 겹치면 합계가 더 부푼다'
      - '`primary key (member_id, study_id)`를 걸면 둘째 (1, 1)은 23505로 실패한다. 두 열의 조합에 거는 제약이라 kim의 다른 스터디, 자바 스터디의 다른 회원은 들어간다'
      - '앱이 "이미 가입했나"를 먼저 확인해도 동시에 온 두 요청은 둘 다 통과한다(D1 질문 4). 끝까지 막는 것은 이 제약이다'
    asks:
      - '본문의 예시: 키 없는 매핑 테이블에 kim이 자바 스터디에 두 번, lee가 한 번 들어갔을 때 자바 스터디의 count(*) (3)'
      - '옮긴 상황: 게시글 태그 매핑 `post_tag(post_id, tag_id)`에 제약이 없어 (10, 3)이 두 번 들어갔다. 태그 3이 붙은 글 수를 count(*)로 세면 실제 글 수보다 (하나 많다. count(distinct post_id)로 가리지 말고 제약으로 막는다)'
    body:
      - p: '레슨 전체에서 쓰는 매핑 테이블이에요. 행 하나가 "이 회원이 이 스터디에 있다"는 짝 하나예요. 처음 예측처럼 기본 키도 UNIQUE도 없는 테이블에 kim을 두 번, lee를 한 번 넣었어요.'
      - ci:
          key: dup
          label: 실제 결과 보기
          source: ManyToManyTableTest.duplicatePair
          code: predict
      - p: '자바 스터디의 인원은 **3명으로 세어져요.** {{predict-result}} 회원 목록을 조인하면 kim이 두 번 나와요. 도입부의 "9명인데 정원이 찼다"가 이렇게 생겨요.'
      - p: '외래 키는 둘 다 지켜졌어요. 회원 1도 있고 스터디 1도 있어요. **외래 키는 가리키는 대상이 있는지만 보고, 짝이 겹치는지는 보지 않아요.** 매핑 테이블에서 한 짝은 한 사실이라, 같은 사실이 두 행이면 개수를 세는 곳이 모두 틀려요. 여기에 [조인](lesson:sql-join)으로 행이 늘어나는 것까지 겹치면 합계는 더 부풀어요.'
      - h3: 짝에 제약을 걸어요
      - code: pk
        notes:
          - mark: primary key (member_id, study_id)
            as: code
            text: '두 열의 **조합**이 겹치지 않아요. 둘째 (1, 1)은 23505로 실패해요. kim의 SQL 스터디 (1, 2), 자바 스터디의 lee (2, 1)은 들어가요.'
      - p: '위 실제 결과의 마지막 줄이 이 테이블에 kim을 한 번 더 넣은 결과예요. 앱이 "이미 가입했나"를 먼저 확인해도 이 제약은 둬요. 동시에 온 두 요청은 앱의 확인을 둘 다 통과하거든요([키와 제약 조건](lesson:keys-constraints) 질문 4).'
      - quiz:
          q: '게시글 태그 매핑 `post_tag(post_id, tag_id)`에 제약이 없어 (10, 3)이 두 번 들어갔어요. 태그 3이 붙은 글은 실제로 4개예요. `select count(*) from post_tag where tag_id = 3`의 결과는?'
          options:
            - '4'
            - '5'
            - '두 번째 insert가 외래 키 위반이라 4'
          answer: 2
          explain: '같은 짝이 두 행이라 count(*)가 하나 더 세요. 외래 키는 글 10과 태그 3이 있는지만 봐서 둘째 행을 막지 않아요.'
      - next: '짝에 제약을 거는 방법은 둘이에요. (member_id, study_id)를 기본 키로 둘 수도, 따로 id를 기본 키로 둘 수도 있어요. 무엇이 달라질까요?'
    recall: '매핑 테이블에 같은 짝이 두 번 들어가면 같은 사실이 두 행이 되어 인원 수, 정원 검사, 조인한 목록이 모두 부풀어요. 외래 키는 가리키는 회원과 스터디가 있는지만 보고 짝이 겹치는지는 보지 않아요. (member_id, study_id)에 기본 키나 UNIQUE를 걸어 DB가 막게 하고, 앱의 사전 확인은 동시 요청을 못 막으니 제약을 꼭 둬요.'
  - id: q2
    title: 기본 키는 (member_id, study_id)로 둘까요, 따로 id를 둘까요?
    conclusion:
      lead: '둘 다 되지만, 따로 id를 두면 (member_id, study_id)에 UNIQUE를 꼭 함께 걸어야 같은 쌍을 막아요.'
      sub: '다른 테이블이 가리키지 않는 순수한 연결이면 복합 기본 키가 간단하고 빈틈이 없어요. 매핑 행을 엔티티로 다루고 다른 테이블이 그 행을 가리키면 id와 UNIQUE가 편해요.'
    says:
      - '따로 id를 기본 키로 두고 UNIQUE를 빼면(흔한 실수) 같은 쌍이 그대로 들어간다. id는 행마다 새 번호라 짝이 겹쳐도 겹치지 않는다. UNIQUE를 걸면 23505로 막는다. 실제 출력을 보인다'
      - '인덱스 수: 복합 기본 키는 인덱스 하나가 중복 막기와 member_id 쪽 조회를 함께 한다. id와 UNIQUE는 인덱스가 둘이라 넣을 때마다 둘을 고친다. pg_indexes로 보인다'
      - '다른 테이블이 매핑 행을 가리킬 때: 출석 기록이 "어느 멤버십의 출석인지" 가리키려면 복합 키는 외래 키도 두 열이어야 한다. 한 열만 가리키면 42830 오류다. id를 두면 한 열이다'
      - 'JPA에서 복합 키는 `@IdClass`나 `@EmbeddedId`로 키 클래스를 따로 만든다(Jakarta Persistence 명세). id를 두면 `@Id` 하나다'
      - '고르는 기준을 표로 정리한다. 질문 4의 재가입 기록처럼 같은 쌍이 다시 생겨야 하면 복합 기본 키로는 담을 수 없다'
    asks:
      - '본문의 예시: 매핑 테이블에 `id` 기본 키만 두고 (member_id, study_id)에 UNIQUE가 없을 때 같은 쌍을 두 번 넣으면 (둘 다 들어간다)'
      - '옮긴 상황: 수강 테이블 `enrollment(student_id, course_id)`가 복합 기본 키다. 과제 제출 테이블이 수강 하나를 외래 키로 가리키려면 (두 열 `(student_id, course_id)`을 함께 가리켜야 한다)'
    body:
      - p: '질문 1은 (member_id, study_id)를 기본 키로 뒀어요. 많이 쓰는 다른 모양은 일련번호 `id`를 기본 키로 두는 거예요.'
      - code: surrogate
        notes:
          - mark: id bigint generated always
            as: code
            text: '행마다 새 번호예요. 짝이 겹쳐도 id는 겹치지 않아서, **기본 키는 같은 쌍을 막지 못해요.** 막는 것은 아래의 `unique`예요.'
      - p: '흔한 실수는 id만 두고 `unique`를 빼는 거예요. 같은 쌍을 두 번 넣어 봤어요.'
      - ci:
          key: surrogate
          label: 실제 결과 보기
          source: ManyToManyTableTest.surrogateIdNeedsUnique
      - p: 'UNIQUE가 없으면 **질문 1의 문제가 그대로** 생겨요. 결과의 아래쪽은 두 테이블의 인덱스예요. 복합 기본 키는 인덱스 하나가 중복 막기와 조회를 함께 하고, id와 UNIQUE는 인덱스가 둘이라 행을 넣을 때마다 둘을 고쳐요.'
      - h3: 다른 테이블이 이 행을 가리킬 때
      - p: '출석 기록이 "어느 멤버십의 출석인지"를 가리켜야 한다고 해 봐요. 복합 기본 키를 가리키는 외래 키는 **두 열을 함께** 가리켜야 해요.'
      - code: attendance
      - ci:
          key: reference
          label: 실제 결과 보기
          source: ManyToManyTableTest.compositeKeyReference
      - p: '`member_id` 한 열만 가리키면 42830 오류예요. 그 열 하나로는 행이 하나로 정해지지 않으니까요. id를 두면 출석 기록에는 `study_member_id` 한 열이면 돼요. JPA도 비슷해요. 복합 키는 `@IdClass`나 `@EmbeddedId`로 키 클래스를 따로 만들고, id를 두면 `@Id` 하나예요([Jakarta Persistence 명세](link:jpa)).'
      - table:
          head: [기준, '복합 기본 키', '따로 id + UNIQUE']
          rows:
            - ['같은 쌍 막기', '기본 키가 막아요', 'UNIQUE를 따로 걸어야 해요']
            - ['인덱스', '하나', '둘']
            - ['다른 테이블이 가리킬 때', '외래 키 두 열', '외래 키 한 열']
            - ['JPA', '키 클래스가 필요해요', '`@Id` 하나']
            - ['같은 쌍이 다시 생기는 기록', '담을 수 없어요 (질문 4)', '부분 유니크로 담아요']
      - p: '**다른 테이블이 가리키지 않는 순수한 연결**(게시글 태그, 좋아요)은 복합 기본 키가 간단하고 빈틈이 없어요. 매핑 행에 열이 생기고, 다른 테이블이 가리키고, JPA 엔티티로 다룬다면 id를 두고 UNIQUE를 함께 걸어요. 어느 쪽이든 **짝에 제약이 있어야 한다는 것은 같아요.**'
      - quiz:
          q: '매핑 테이블에 `id bigint generated always as identity primary key`와 두 외래 키만 있어요. kim을 자바 스터디에 두 번 넣으면 어떻게 되나요?'
          options:
            - '둘째 insert가 기본 키 위반(23505)으로 실패한다'
            - '둘 다 들어간다'
            - '둘째 insert가 외래 키 위반(23503)으로 실패한다'
          answer: 2
          explain: 'id는 행마다 새 번호라 겹치지 않아요. 짝이 겹치는 것을 막으려면 (member_id, study_id)에 UNIQUE가 따로 있어야 해요.'
      - next: '복합 키든 UNIQUE든 (member_id, study_id) 순서의 인덱스가 하나 생겼어요. 이 인덱스로 "스터디의 회원"도 빨리 찾을 수 있을까요?'
    recall: '둘 다 되지만 따로 id를 두면 id는 행마다 새 번호라 같은 쌍을 막지 못해서, (member_id, study_id)에 UNIQUE를 꼭 함께 걸어야 해요. 복합 기본 키는 인덱스 하나로 중복 막기와 조회를 하고, id 방식은 인덱스가 둘이에요. 다른 테이블이 매핑 행을 가리키면 복합 키는 외래 키가 두 열, id는 한 열이에요. 순수한 연결은 복합 키, 엔티티로 다루는 매핑 행은 id와 UNIQUE를 흔히 골라요.'
  - id: q3
    title: 양쪽 방향으로 찾으려면 인덱스를 어떻게 두나요?
    conclusion:
      lead: '(member_id, study_id) 인덱스는 member_id로 찾을 때만 빠르고, study_id로 찾으려면 (study_id, member_id) 인덱스를 하나 더 둬요.'
      sub: '복합 인덱스는 첫 열로 정렬돼 있어서, 둘째 열 study_id가 같은 항목은 인덱스 곳곳에 흩어져 있어요. 두 방향 모두 자주 찾으니 순서를 뒤집은 인덱스가 둘째로 필요해요.'
    says:
      - '"kim의 스터디"(where member_id)와 "스터디의 회원"(where study_id)은 둘 다 자주 쓰는 조회다. 매핑 행 10만 개(회원 2만 명, 스터디 2천 개)에서 두 쿼리의 실행계획을 본다'
      - 'member_id로 찾으면 기본 키 인덱스로 Index Only Scan, study_id로 찾으면 Seq Scan이다. 실제 출력을 보인다'
      - '이유는 복합 인덱스의 정렬(D7 질문 3)이다. 위젯에서 짝 여섯 개를 (member_id, study_id) 순서로 놓으면 스터디 1의 짝은 첫째, 셋째, 다섯째에 흩어진다. (study_id, member_id) 순서로 놓으면 앞의 셋에 붙어 있다'
      - '(study_id, member_id) 인덱스를 더하면 study_id로도 Index Only Scan이다. 두 열을 다 담고 있어 테이블을 읽지 않는다. 이 인덱스는 study_id 외래 키의 인덱스도 겸한다'
      - '따로 id를 둔 매핑 테이블도 같다. UNIQUE (member_id, study_id)가 한쪽을 맡고, study_id 쪽 인덱스를 따로 만든다'
      - '더 알아보기: 같은 테이블끼리의 N:M(팔로우)도 "내가 팔로우하는 사람"과 "나를 팔로우하는 사람" 두 방향이라 인덱스가 둘이다'
    widget:
      kind: toggle
      note: '짝 여섯 개를 고른 인덱스의 순서로 늘어놓는다. "회원 2의 스터디"는 기본 키 인덱스에서 붙어 있고, "스터디 1의 회원"은 기본 키 인덱스에서 흩어져 있고, 둘째 인덱스에서는 붙어 있다'
    asks:
      - '본문의 예시: 기본 키 (member_id, study_id)만 있는 매핑 테이블에서 `where study_id = 42`의 실행계획 (Seq Scan)'
      - '옮긴 상황: 팔로우 `follow(follower_id, followee_id)` 기본 키만 있을 때 "나를 팔로우하는 사람"을 빨리 찾으려고 더할 인덱스 (`(followee_id, follower_id)`)'
    body:
      - p: '매핑 테이블은 두 방향으로 읽어요. "kim의 스터디"와 "자바 스터디의 회원"이요. 회원 2만 명과 스터디 2천 개 사이에 짝 10만 개를 넣고, 기본 키 (member_id, study_id)만 둔 채 두 쿼리를 EXPLAIN했어요.'
      - code: byMember
      - code: byStudy
      - ci:
          key: explain
          label: 실제 실행계획 보기
          source: ManyToManyTableTest.bothDirectionIndexes
      - p: '결과의 위쪽 두 개를 봐요. 회원으로 찾으면 기본 키 인덱스를 써요. **스터디로 찾으면 Seq Scan**이에요. 짝 10만 개를 다 읽고 스터디 42의 짝 50개만 남겨요. 도입부의 "이 스터디의 회원 화면만 느리다"가 이것이에요.'
      - h3: 인덱스 안의 순서를 봐요
      - p: '복합 인덱스는 **첫 열로 정렬하고, 첫 열이 같은 것끼리 둘째 열로 정렬해요**([인덱스와 실행계획](lesson:index-explain) 질문 3). 짝 여섯 개를 인덱스에 늘어놓아 봤어요. 찾는 것을 바꿔 보세요.'
      - widget:
          kind: toggle
          layout: [selector, duo, verdict]
          selector:
            label: 찾는 것
            options:
              - {value: member, label: 회원 2의 스터디}
              - {value: study, label: 스터디 1의 회원}
              - {value: reverse, label: '스터디 1의 회원 (인덱스 둘)'}
          scenes:
            member:
              duo:
                - label: '기본 키 (member_id, study_id)'
                  state: active
                  rows:
                    - {k: '1', v: '(1, 1)'}
                    - {k: '2', v: '(1, 2)'}
                    - {k: '3', v: '(2, 1)', mark: changed}
                    - {k: '4', v: '(2, 3)', mark: changed}
                    - {k: '5', v: '(3, 1)'}
                    - {k: '6', v: '(3, 2)'}
                - {label: '(study_id, member_id)', state: dim, text: 없음}
              verdict: 'member_id가 2인 짝은 셋째와 넷째에 붙어 있어요. 인덱스에서 그 자리로 바로 가서 두 개만 읽어요.'
            study:
              duo:
                - label: '기본 키 (member_id, study_id)'
                  state: active
                  rows:
                    - {k: '1', v: '(1, 1)', mark: bad}
                    - {k: '2', v: '(1, 2)'}
                    - {k: '3', v: '(2, 1)', mark: bad}
                    - {k: '4', v: '(2, 3)'}
                    - {k: '5', v: '(3, 1)', mark: bad}
                    - {k: '6', v: '(3, 2)'}
                - {label: '(study_id, member_id)', state: dim, text: 없음}
              verdict: 'study_id가 1인 짝은 첫째, 셋째, 다섯째에 흩어져 있어요. 범위를 좁힐 수 없어서 PostgreSQL 16은 테이블 전체를 읽어요(Seq Scan).'
            reverse:
              duo:
                - {label: '기본 키 (member_id, study_id)', state: dim, text: 이 조회에는 쓰지 않아요}
                - label: '(study_id, member_id)'
                  state: active
                  rows:
                    - {k: '1', v: '(1, 1)', mark: changed}
                    - {k: '2', v: '(1, 2)', mark: changed}
                    - {k: '3', v: '(1, 3)', mark: changed}
                    - {k: '4', v: '(2, 1)'}
                    - {k: '5', v: '(2, 3)'}
                    - {k: '6', v: '(3, 2)'}
              verdict: '이 인덱스는 study_id로 먼저 정렬돼서 스터디 1의 짝이 앞의 셋에 붙어 있어요. 둘째 값이 바로 회원 id예요.'
      - p: '두 방향 모두 자주 찾으니 **순서를 뒤집은 인덱스를 하나 더** 둬요.'
      - code: reverseIndex
        notes:
          - mark: study_id, member_id
            as: code
            text: 'study_id가 앞이에요. 둘째 열에 member_id까지 담아서, 회원 id만 필요한 조회는 테이블을 읽지 않아요.'
      - p: '위 실제 실행계획의 마지막이 이 인덱스를 더한 뒤예요. 스터디로 찾아도 **Index Only Scan**이에요. 인덱스에 두 열이 다 있어서 테이블을 읽지 않았어요([Index Only Scan 문서](link:indexonly)). 이 인덱스는 `study_id` 외래 키의 인덱스도 겸해요. 스터디를 지울 때 DB가 "이 스터디를 가리키는 짝"을 찾는 데도 쓰여요.'
      - p: '따로 id를 둔 매핑 테이블도 같아요. UNIQUE (member_id, study_id)가 회원 쪽을 맡고, 스터디 쪽 인덱스는 따로 만들어요.'
      - more:
          summary: '더 알아보기: 팔로우처럼 같은 테이블끼리의 N:M'
          body:
            - p: '팔로우는 회원과 회원의 N:M이에요. 두 열이 모두 회원을 가리켜요. "내가 팔로우하는 사람"은 기본 키 (follower_id, followee_id)가 맡고, "나를 팔로우하는 사람"은 순서를 뒤집은 인덱스가 맡아요.'
            - code: follow
      - quiz:
          q: '팔로우 테이블의 기본 키가 `(follower_id, followee_id)`예요. "나를 팔로우하는 사람" 목록(`where followee_id = ?`)을 빨리 찾으려면 무엇을 더하나요?'
          options:
            - '`(follower_id)` 인덱스'
            - '`(followee_id, follower_id)` 인덱스'
            - '없다. 기본 키 인덱스에 followee_id가 있으니 그대로 빠르다'
          answer: 2
          explain: '기본 키 인덱스는 follower_id로 먼저 정렬돼서 followee_id가 같은 항목이 흩어져 있어요. followee_id가 앞인 인덱스가 필요해요.'
      - next: '키와 인덱스를 정했어요. 그런데 "kim이 자바 스터디에 언제 들어왔고, 무슨 역할인지"는 어디에 적어야 할까요?'
    recall: '복합 인덱스는 첫 열로 정렬돼 있어서 (member_id, study_id) 인덱스는 member_id로 찾을 때만 범위를 좁혀요. study_id가 같은 짝은 인덱스 곳곳에 흩어져 있어 study_id로 찾으면 Seq Scan이에요. 그래서 (study_id, member_id) 인덱스를 하나 더 둬요. 두 열을 다 담아 Index Only Scan이 되고, study_id 외래 키의 인덱스도 겸해요.'
  - id: q4
    title: 가입일이나 역할은 어디에 두나요?
    conclusion:
      lead: '짝에 딸린 값이라 매핑 테이블의 열로 둬요. 회원이나 스터디 테이블에 두면 스터디마다 다른 값을 담을 수 없어요.'
      sub: '열이 생긴 매핑 테이블은 멤버십이라는 엔티티예요. 탈퇴와 재가입 기록까지 남기면 같은 짝이 다시 생기므로, 복합 기본 키 대신 id와 부분 유니크 인덱스로 활동 중인 짝만 하나로 막아요.'
    says:
      - '"kim의 역할"은 회원의 사실이 아니라 "kim이 자바 스터디에서"의 사실이다. 회원 테이블에 `role`을 두면(코드 roleOnMember) 자바 스터디의 LEADER와 SQL 스터디의 MEMBER를 함께 담을 수 없다. 스터디에 두면 스터디의 회원마다 다른 값을 담을 수 없다'
      - '그래서 짝 하나에 하나인 값은 매핑 테이블의 열이다(코드 attrs). 역할은 CHECK로 정한 값만 받게 한다'
      - '열이 생긴 매핑 테이블은 단순한 연결이 아니라 엔티티다. "멤버십", "수강", "주문 항목"처럼 이름을 붙인다'
      - '탈퇴한 뒤 다시 가입할 수 있고 그 기록을 남기면 같은 짝이 두 행이 된다. 복합 기본 키는 재가입을 23505로 막는다. id와 `left_at`을 두고 `where left_at is null` 부분 유니크 인덱스를 걸면 활동 중인 짝은 하나만, 지난 기록은 여럿 둘 수 있다. 실제 출력을 보인다'
    asks:
      - '본문의 예시: kim이 자바 스터디에서는 LEADER, SQL 스터디에서는 MEMBER다. `role`을 두는 곳 (매핑 테이블 `study_member`)'
      - '옮긴 상황: 주문과 상품의 N:M에서 "주문한 수량"을 두는 곳 (주문 항목 매핑 테이블. 상품이나 주문에 두면 주문마다, 상품마다 다른 수량을 담을 수 없다)'
    body:
      - p: 'kim은 자바 스터디의 리더이고 SQL 스터디에서는 그냥 멤버예요. 이 역할을 회원 테이블에 넣어 볼까요?'
      - code: roleOnMember
      - p: '칸이 하나라 두 값을 함께 담을 수 없어요. 스터디 테이블에 두어도 마찬가지예요. 스터디 하나에 회원이 여럿인데 칸은 하나예요. **역할은 회원의 사실도 스터디의 사실도 아니고, "kim이 자바 스터디에서"라는 짝의 사실이에요.** 가입일도 같아요.'
      - p: '짝 하나에 값 하나인 자리는 매핑 테이블의 행이에요.'
      - code: attrs
        notes:
          - mark: role text not null
            as: code
            text: '짝마다 하나예요. kim의 두 행에 LEADER와 MEMBER가 따로 들어가요. 정한 값만 받도록 CHECK를 걸었어요([키와 제약 조건](lesson:keys-constraints) 질문 3).'
          - mark: joined_at date not null
            as: code
            text: '가입일도 짝의 사실이에요.'
      - p: '열이 생긴 매핑 테이블은 더 이상 "두 테이블을 잇는 줄"이 아니라 그 자체로 엔티티예요. 그래서 이름을 붙여 불러요. 회원과 스터디 사이는 **멤버십**, 학생과 강의 사이는 수강, 주문과 상품 사이는 주문 항목이에요.'
      - h3: 탈퇴와 재가입 기록을 남기면
      - p: '탈퇴한 kim이 몇 달 뒤 다시 가입할 수 있고, 지난 기록도 남겨야 한다고 해 봐요. 그러면 (kim, 자바 스터디) 짝이 두 행이 돼요. 복합 기본 키로는 담을 수 없어요. 그래서 id를 기본 키로 두고, **활동 중인 짝만** 하나가 되게 막아요.'
      - code: history
        notes:
          - mark: where left_at is null
            as: code
            text: '**부분 유니크 인덱스**예요. 조건에 맞는 행, 곧 아직 탈퇴하지 않은 행끼리만 겹치는지 봐요. 탈퇴한 기록은 여럿 있어도 돼요([부분 인덱스 문서](link:partial)).'
      - ci:
          key: rejoin
          label: 실제 결과 보기
          source: ManyToManyTableTest.rejoinHistory
      - p: '복합 기본 키는 재가입을 23505로 막았어요. 부분 유니크 인덱스는 활동 중에 한 번 더 가입하는 것은 막고, 탈퇴 처리한 뒤의 재가입은 받았어요. 질문 2의 표에서 "같은 쌍이 다시 생기는 기록"이 이 경우예요.'
      - quiz:
          q: '주문과 상품은 N:M이에요. "이 주문에서 이 상품을 몇 개 샀는지(수량)"는 어디에 두나요?'
          options:
            - '상품 테이블의 `qty` 열'
            - '주문 테이블의 `qty` 열'
            - '주문 항목(주문과 상품의 매핑 테이블)의 `qty` 열'
          answer: 3
          explain: '수량은 주문 하나와 상품 하나의 짝에 딸린 값이에요. 상품에 두면 주문마다, 주문에 두면 상품마다 다른 수량을 담을 수 없어요.'
      - next: '매핑 행이 기록을 담기 시작했어요. 그러면 회원이나 스터디를 지울 때 이 행들은 어떻게 해야 할까요?'
    recall: '가입일과 역할은 회원이나 스터디의 사실이 아니라 짝의 사실이라 매핑 테이블의 열로 둬요. 회원 테이블에 두면 칸 하나에 스터디마다 다른 값을 담을 수 없어요. 열이 생긴 매핑 테이블은 멤버십이라는 엔티티예요. 탈퇴와 재가입 기록을 남기면 같은 짝이 다시 생기므로, id를 기본 키로 두고 `where left_at is null` 부분 유니크 인덱스로 활동 중인 짝만 하나로 막아요.'
  - id: q5
    title: 회원이나 스터디를 지우면 매핑 행은 어떻게 하나요?
    conclusion:
      lead: '짝만 뜻하는 매핑 행은 양쪽 외래 키에 ON DELETE CASCADE를 걸어 부모와 함께 지우고, 남겨야 할 기록을 담은 매핑 행은 기본(NO ACTION)으로 부모 삭제를 막아요.'
      sub: 'CASCADE는 매핑 행만 지우고 상대 엔티티는 그대로 둬요. SET NULL은 쓰지 않아요. 키의 일부인 열은 NULL이 될 수 없어서 23502로 실패해요.'
    says:
      - '스터디가 없어지면 "kim이 그 스터디에 있다"는 사실도 없어진다. 짝만 뜻하는 매핑 행은 부모와 함께 지우는 것이 맞다. 양쪽에 `on delete cascade`를 걸고 자바 스터디를 지우면 그 스터디의 짝만 지워지고 회원 셋은 남는다. 실제 출력을 보인다'
      - '매핑 행이 남겨야 할 기록이면 다르다. 수강 기록과 성적, 주문 항목은 상품이나 강의가 없어져도 남아야 한다. 기본(NO ACTION)으로 두면 부모 삭제가 23503으로 실패한다. 이때 부모는 지우지 않고 판매 종료나 폐강처럼 상태로 표시한다'
      - 'SET NULL: 복합 기본 키의 열은 NOT NULL이라 부모를 지우면 23502로 실패한다. id 방식에서 NULL을 허용해도 "누구와 무엇의 짝"인지 모르는 행이 남아 뜻이 없다'
      - '양쪽 외래 키의 규칙은 따로 정한다. 회원 탈퇴는 표시만 하고 스터디 삭제만 지울 수도 있다'
    asks:
      - '본문의 예시: 양쪽 외래 키가 `on delete cascade`인 `study_member`에서 자바 스터디를 지우면 회원 테이블의 행은 (그대로 남는다. 자바 스터디의 짝만 지워진다)'
      - '옮긴 상황: 주문 항목이 상품을 가리킨다. 판매를 끝낸 상품을 지울 때 주문 항목의 외래 키 규칙 (CASCADE를 쓰지 않는다. 기본으로 막고 상품은 상태로 표시한다)'
    body:
      - p: '자바 스터디가 문을 닫아 지운다고 해 봐요. 그 스터디의 짝 "kim이 자바 스터디에 있다", "lee가 자바 스터디에 있다"도 더는 사실이 아니에요. **짝만 뜻하는 매핑 행은 부모와 함께 지우는 것이 맞아요.**'
      - code: cascade
      - p: '자바 스터디를 지워 봤어요. 아래 결과에는 같은 데이터로 다른 규칙을 돌린 결과도 함께 있어요.'
      - ci:
          key: on-delete
          label: 실제 결과 보기
          source: ManyToManyTableTest.onDelete
      - p: '첫 묶음을 봐요. 자바 스터디의 짝 둘만 지워지고 kim의 SQL 스터디 짝 (1, 2)는 남았어요. **회원 셋도 그대로예요.** CASCADE는 지운 부모를 가리키는 행, 곧 매핑 행만 지워요. 매핑 테이블을 넘어 반대편 엔티티까지 가지 않아요.'
      - h3: 매핑 행이 기록이면 막아요
      - p: '매핑 행이 남겨야 할 기록을 담으면 이야기가 달라요. 수강 기록과 성적, 주문 항목은 강의나 상품이 없어져도 남아야 해요. 이런 테이블은 기본(NO ACTION)으로 둬요.'
      - code: enrollment
      - p: '결과의 둘째 묶음이 이 경우예요. 성적이 남은 스터디를 지우려 하면 23503으로 막아요. 이때는 부모를 지우지 않고 "폐강", "판매 종료"처럼 상태로 표시해요.'
      - h3: SET NULL은 쓰지 않아요
      - code: setNull
      - p: '결과의 셋째 묶음이에요. 기본 키의 열은 NOT NULL이라, 부모를 지울 때 NULL로 바꾸려다 **23502로 실패해요.** id 방식에서 NULL을 허용해도 "누구와 어느 스터디의 짝"인지 모르는 행이 남아 뜻이 없어요.'
      - p: '양쪽 외래 키의 규칙은 따로 정해요. 회원은 탈퇴 표시만 하고 지우지 않는 서비스라면, 회원 쪽 규칙은 기본으로 두고 스터디 쪽만 CASCADE로 둘 수 있어요.'
      - quiz:
          q: '주문 항목이 상품을 외래 키로 가리켜요. 판매를 끝낸 상품을 지우려 할 때, 주문 항목의 외래 키 규칙으로 알맞은 것은?'
          options:
            - 'ON DELETE CASCADE로 그 상품의 주문 항목도 지운다'
            - 'ON DELETE SET NULL로 상품만 끊는다'
            - '기본(NO ACTION)으로 막고, 상품은 지우지 않고 판매 종료로 표시한다'
          answer: 3
          explain: '주문 항목은 지난 주문의 기록이라 남아야 해요. CASCADE는 기록을 지우고, SET NULL은 무엇을 샀는지 모르는 행을 남겨요.'
    recall: '짝만 뜻하는 매핑 행은 부모가 없어지면 사실이 아니게 되니 양쪽 외래 키에 ON DELETE CASCADE를 걸어 함께 지워요. CASCADE는 매핑 행만 지우고 반대편 엔티티는 남겨요. 성적이나 주문 항목처럼 남겨야 할 기록이면 기본(NO ACTION)으로 부모 삭제를 막고 부모는 상태로 표시해요. 키 열의 SET NULL은 NOT NULL 위반으로 실패해서 쓰지 않아요.'
practice:
  says:
    - '`@ManyToMany`는 매핑 테이블을 감추지만 그 테이블에 열(가입일, 역할)을 더할 수 없다(Jakarta Persistence 명세)'
    - '흔한 실수: `@ManyToMany`를 List로 둔다. 하이버네이트 6.6이 만든 매핑 테이블에는 기본 키가 없어 같은 쌍이 들어가고(질문 1), 스터디 하나를 빼면 그 회원의 행을 모두 지우고 남은 것을 다시 넣는다. Set이면 (member_id, study_id) 기본 키가 생기고 한 행만 지운다. 두 경우 모두 반대 방향 인덱스는 없다(질문 3). 테스트로 SQL과 인덱스를 보인다'
    - '고친 것: 연결 엔티티 `StudyMember`에 `@ManyToOne` 둘과 열을 두고, 마이그레이션에 UNIQUE, 반대 방향 인덱스, CASCADE를 적는다. 같은 쌍 저장은 UNIQUE 위반, 하나를 빼면 그 행 하나만 지운다. 테스트로 보인다'
    - '가입 버튼 두 번: `on conflict (member_id, study_id) do nothing`이면 둘째 insert는 오류 없이 0행이다. 테스트로 보인다'
  title: 엔티티와 저장 코드에서는 이렇게 써요
  body:
    - p: 'JPA의 `@ManyToMany`는 매핑 테이블을 엔티티 없이 감춰 줘요. 대신 그 테이블에 가입일이나 역할 같은 열을 더할 수 없어요([Jakarta Persistence 명세](link:jpa)). 질문 4에서 본 것처럼 매핑 테이블에는 곧 열이 생기니, 실무에서는 대개 연결 엔티티로 풀어요. 그 전에 `@ManyToMany`가 실제로 무엇을 하는지 봐요.'
    - h3: '흔한 실수: @ManyToMany를 List로'
    - code: manyToMany
      notes:
        - mark: List<Study>
          as: code
          text: '순서도 중복도 있는 목록이에요. 하이버네이트는 이 매핑 테이블의 행 하나를 가리킬 방법이 없다고 보고 다뤄요.'
    - p: 'kim을 스터디 셋에 넣고, 그 가운데 하나를 빼 봤어요. 같은 매핑을 Set으로 둔 것과 비교했어요.'
    - code: removeOne
    - ci:
        key: list-vs-set
        label: 하이버네이트 6.6이 보낸 SQL 보기
        source: ManyToManyTableTest.manyToManyListVersusSet
    - p: 'List로 둔 매핑 테이블에는 **기본 키가 없어요.** 같은 스터디를 한 번 더 넣자 같은 쌍이 그대로 들어갔어요(질문 1). 하나를 빼자 **kim의 행을 모두 지우고 남은 둘을 다시 넣었어요.** 스터디가 100개인 회원이면 하나를 빼려고 100행을 지우고 99행을 넣어요. Set으로 두면 (member_id, study_id) 기본 키가 생기고 그 행 하나만 지워요. 어느 쪽이든 (study_id, member_id) 인덱스는 없어요(질문 3).'
    - h3: '고친 것: 연결 엔티티'
    - p: '매핑 테이블을 엔티티로 올리고, 양쪽에 `@ManyToOne`을 둬요. 질문 2의 "따로 id + UNIQUE" 모양이에요.'
    - code: entity
      notes:
        - mark: '@ManyToOne'
          as: anno
          text: '매핑 행 하나에 회원 하나, 스터디 하나예요. N:M을 1:N 둘로 푼 것을 그대로 옮겼어요. 양방향이 필요하면 [연관관계 매핑](lesson:association-owner)처럼 `mappedBy`를 더해요.'
    - p: '운영 테이블은 마이그레이션으로 만들어요. 엔티티의 `@UniqueConstraint`도 `@Column(unique = true)`처럼 테이블을 만들 때만 쓰이니([키와 제약 조건](lesson:keys-constraints) 실무 구역), 제약과 인덱스와 삭제 규칙은 이 SQL에 적어요.'
    - code: migration
      notes:
        - mark: unique (member_id, study_id)
          as: code
          text: '같은 쌍을 막아요(질문 1, 2). 회원 쪽 조회 인덱스도 겸해요.'
        - mark: create index study_member_study_idx
          as: code
          text: '스터디 쪽 조회와 `study_id` 외래 키를 위한 인덱스예요(질문 3).'
    - ci:
        key: entity
        label: 연결 엔티티로 실제로 돌린 결과 보기
        source: ManyToManyTableTest.connectionEntity
    - p: '같은 쌍을 두 번 저장하면 UNIQUE가 막고, 멤버십 하나를 빼면 그 행 하나만 지워요.'
    - h3: 가입 버튼을 두 번 눌러도 오류 없이
    - p: 'UNIQUE가 있으면 둘째 가입은 예외가 돼요. 이미 가입한 사람에게 오류를 보일 일이 아니라면, 겹칠 때 아무것도 하지 않게 넣을 수 있어요.'
    - code: join
      notes:
        - mark: on conflict (member_id, study_id)
          as: code
          text: '이 두 열의 제약에 걸리면 넣지 않고 넘어가요([INSERT 문서](link:insert)). 오류가 나지 않고, 바뀐 행 수가 0이에요.'
    - ci:
        key: on-conflict
        label: 실제 결과 보기
        source: ManyToManyTableTest.onConflictDoNothing
    - muted: '근거: `@ManyToMany`의 매핑 테이블과 복합 키는 [Jakarta Persistence 3.1 명세](link:jpa)와 [하이버네이트 6.6 사용자 가이드](link:hibernate), `on conflict`는 [PostgreSQL 16 문서](link:insert). 하이버네이트가 보낸 SQL과 만든 인덱스는 테스트로 확인했어요.'
interview:
  question: 다대다 관계를 테이블로 어떻게 설계하고, 매핑 테이블에서는 무엇을 신경 쓰나요?
  model:
    - label: 정의
      text: 다대다는 두 외래 키를 가진 매핑 테이블로 풀고, 그 행 하나가 짝 하나를 뜻합니다. 외래 키는 가리키는 대상이 있는지만 보므로 같은 짝이 두 번 들어가지 않게 (a_id, b_id)에 기본 키나 UNIQUE를 겁니다.
    - label: 원리
      text: 기본 키는 순수한 연결이면 (a_id, b_id) 복합 키, 다른 테이블이 가리키는 엔티티면 따로 id를 두고 UNIQUE를 함께 겁니다. 복합 인덱스는 첫 열로 정렬되므로 (a_id, b_id) 인덱스는 한 방향만 빠르고, 반대 방향에는 (b_id, a_id) 인덱스를 더합니다.
    - label: 주의할 점
      text: 가입일과 역할은 짝의 사실이라 매핑 테이블에 둡니다. 재가입 이력을 남기면 같은 짝이 다시 생기므로 부분 유니크 인덱스로 활동 중인 짝만 막습니다. 짝만 뜻하는 행은 ON DELETE CASCADE, 기록을 담은 행은 삭제를 막습니다. JPA의 @ManyToMany는 열을 더할 수 없고 List로 두면 기본 키 없이 전부 지우고 다시 넣으므로 연결 엔티티로 풉니다.
    - label: 경험
      text: '(내 프로젝트로 채우기) 예: 스터디 가입을 두 번 누르면 멤버가 두 번 보이는 문제를 매핑 테이블의 UNIQUE와 on conflict do nothing으로 고쳤습니다.'
verified: 이 레슨의 결과는 짐작이 아니라 PostgreSQL 16 컨테이너에서 SQL을 실행하고, 실무 구역은 스프링 부트 3.5와 하이버네이트 6.6으로 돌려 받은 값이에요. 코드가 바뀔 때마다 테스트([ManyToManyTableTest](link:test))가 다시 돌아요.
footer: '근거: 제약은 [PostgreSQL 16 문서](link:constraints), 복합 인덱스는 [다중 열 인덱스 문서](link:multicolumn), 부분 유니크 인덱스는 [부분 인덱스 문서](link:partial), JPA 매핑은 [Jakarta Persistence 3.1 명세](link:jpa). 결과는 PostgreSQL 16과 스프링 부트 3.5에서 테스트로 확인했어요. 오류는 [GitHub 이슈](https://github.com/wanja727/dev-lessons/issues)로 알려 주세요.'
claims:
  - claim: '키 없는 매핑 테이블에 같은 쌍을 두 번 넣으면 count(*)가 3이고 조인 목록에 kim이 두 번 나온다. 복합 기본 키면 23505'
    how: '키 없는 테이블과 복합 기본 키 테이블에 같은 쌍을 넣는다'
    test: ManyToManyTableTest.duplicatePair
  - claim: 'id만 기본 키인 매핑 테이블은 같은 쌍이 들어가고, UNIQUE를 걸면 23505다. 복합 기본 키는 인덱스 하나, id와 UNIQUE는 둘이다'
    how: '같은 쌍을 넣고 pg_indexes를 읽는다'
    test: ManyToManyTableTest.surrogateIdNeedsUnique
  - claim: '복합 기본 키를 한 열로 가리키는 외래 키는 42830이다'
    how: '두 열과 한 열로 외래 키를 만든다'
    test: ManyToManyTableTest.compositeKeyReference
  - claim: '짝 10만 개에서 기본 키 (member_id, study_id)만 있으면 study_id 조회는 Seq Scan이고, (study_id, member_id) 인덱스를 더하면 Index Only Scan이다'
    how: 'EXPLAIN (costs off)를 인덱스를 더하기 전후로 본다'
    test: ManyToManyTableTest.bothDirectionIndexes
  - claim: '복합 기본 키는 재가입을 막고, where left_at is null 부분 유니크 인덱스는 활동 중인 짝 둘만 막는다'
    how: '탈퇴 처리 전후로 같은 짝을 넣는다'
    test: ManyToManyTableTest.rejoinHistory
  - claim: 'CASCADE 매핑은 스터디 삭제 때 그 짝만 지우고 회원은 남는다. NO ACTION 수강 기록은 23503, 키 열의 SET NULL은 23502'
    how: '세 테이블에서 부모를 지운다'
    test: ManyToManyTableTest.onDelete
  - claim: 'on conflict do nothing은 같은 쌍의 둘째 insert를 0행으로 넘긴다'
    how: 'JdbcTemplate.update의 반환값을 본다'
    test: ManyToManyTableTest.onConflictDoNothing
  - claim: '하이버네이트 6.6에서 @ManyToMany List의 매핑 테이블에는 기본 키가 없고 하나를 빼면 delete 1번과 insert 2번, Set은 기본 키가 있고 delete 1번이다'
    how: 'SqlCapture로 SQL을 모으고 pg_indexes를 읽는다'
    test: ManyToManyTableTest.manyToManyListVersusSet
  - claim: '연결 엔티티는 같은 쌍 저장이 UNIQUE 위반이고, 하나를 지우면 delete 1번이다'
    how: '같은 쌍을 두 번 persist하고 하나를 remove한다'
    test: ManyToManyTableTest.connectionEntity
sources:
  - '제약과 외래 키의 삭제 규칙: PostgreSQL 16 문서 https://www.postgresql.org/docs/16/ddl-constraints.html'
  - '복합 인덱스: https://www.postgresql.org/docs/16/indexes-multicolumn.html, Index Only Scan: https://www.postgresql.org/docs/16/indexes-index-only-scans.html'
  - '부분 인덱스: https://www.postgresql.org/docs/16/indexes-partial.html'
  - 'on conflict: https://www.postgresql.org/docs/16/sql-insert.html'
  - '@ManyToMany와 복합 키(@IdClass, @EmbeddedId): Jakarta Persistence 3.1 명세 https://jakarta.ee/specifications/persistence/3.1/jakarta-persistence-spec-3.1.html'
