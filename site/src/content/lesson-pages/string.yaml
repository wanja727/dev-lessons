# String
# 자료 파일의 칸은 docs/lesson-data-format.md에 있다. 문제는 content/questions/string.yaml에 있다.
title: String
description: String이 불변이라는 것과 그렇게 만든 이유, 리터럴이 저장되는 문자열 상수 풀, 문자열을 ==로 비교하면 틀리는 때, 이어 붙일 때 조심할 것. 네 가지 질문에 스스로 답할 수 있게, 주문 상태 "PAID"를 여러 방법으로 만들어 비교하며 배우는 대화형 레슨.
unit: 자바 언어
minutes: 20
roadmap: J4
type: 자바 실행
prerequisites:
  - {slug: value-and-reference, title: 값과 참조}
assume: '자바 21. `String`은 참조형이고 `==`는 같은 객체인지를, `equals`는 글자가 같은지를 본다는 것(값과 참조 레슨).'
example: '주문 상태를 나타내는 문자열 `"PAID"`. 리터럴로 쓴 것, `new String`으로 만든 것, 실행 중에 이어 붙여 만든 것을 서로 비교해요. 실무 구역에서는 요청으로 받은 상태 문자열과 로그 메시지로 옮겨요.'
intro:
  - '`if (status == "PAID")`로 쓴 코드가 테스트에서는 통과했어요. 테스트가 `"PAID"`를 리터럴로 넘겼기 때문이에요. 운영에서는 요청에서 읽은 문자열이 들어왔고, 결제된 주문이 전부 "결제 안 됨"으로 처리됐어요.'
  - '서버가 다루는 데이터의 대부분은 문자열이에요. 요청 파라미터, JSON, SQL, 로그가 다 문자열이에요. 그래서 `String`이 어떻게 저장되고 비교되는지, 이어 붙일 때 객체가 몇 개 생기는지는 스프링 개발자가 매일 쓰는 지식이고 면접의 단골 질문이에요.'
  - '이 레슨에서는 문자열을 만드는 방법에 따라 `==`의 결과가 달라지는 것을 돌려서 확인하고, 그 이유인 불변과 문자열 상수 풀을 차례로 봐요.'
covers:
  - topic: 'String은 불변이다. 값을 바꾸는 것처럼 보이는 메서드는 새 객체를 돌려준다'
    where: '질문 1'
  - topic: '불변으로 만든 이유: 여러 곳이 같은 객체를 안심하고 함께 쓴다(풀, 맵의 키, 스레드), hashCode를 한 번 계산해 둔다'
    where: '질문 1'
  - topic: '문자열 리터럴과 문자열 상수 풀. 같은 리터럴은 같은 객체다'
    where: '질문 2'
  - topic: 'new String은 풀과 상관없이 새 객체를 만든다. intern()'
    where: '질문 2'
  - topic: '문자열의 ==가 틀리는 때: 실행 중에 만들어진 문자열. 컴파일할 때 정해지는 상수식은 풀에 들어간다'
    where: '질문 3'
  - topic: '문자열은 equals로 비교한다. null일 수 있으면 리터럴 쪽에서 부른다. equalsIgnoreCase'
    where: '질문 3'
  - topic: '+로 이어 붙이면 새 문자열이 만들어진다. 반복문에서 누적하면 돌 때마다 전체를 복사한다'
    where: '질문 4'
  - topic: 'StringBuilder는 가변이라 같은 객체에 덧붙인다. StringBuffer는 메서드가 동기화된 것'
    where: '질문 4'
  - topic: '한 줄의 + 연결은 컴파일러가 처리하므로 StringBuilder로 바꿀 필요가 없다. String.join, formatted, 텍스트 블록'
    where: '질문 4의 더 알아보기'
  - topic: 'length()가 세는 것과 글자 인코딩(UTF-16 단위, getBytes의 기본 문자셋은 자바 18부터 UTF-8)'
    where: '질문 1의 더 알아보기'
  - topic: '빈 문자열과 공백 문자열: isEmpty와 isBlank'
    where: '실무에서는'
  - topic: '요청으로 받은 문자열을 비교하는 코드'
    where: '실무에서는'
  - topic: '로그 메시지를 +로 만들 때와 {}로 넘길 때'
    where: '실무에서는'
  - topic: 'SQL을 문자열로 이어 붙이면 생기는 SQL 인젝션'
    where: '다루지 않음: 웹 보안 기초(N10)'
  - topic: '불변 객체를 직접 만드는 방법'
    where: '다루지 않음: 불변 객체(J9)'
  - topic: 'hashCode와 HashMap의 키'
    where: '다루지 않음: equals와 hashCode(J6)'
  - topic: '문자열 상수 풀이 놓이는 메모리 영역'
    where: '다루지 않음: JVM 메모리 구조(J14)'
  - topic: '상태처럼 정해진 값을 문자열 대신 enum으로 다루는 것'
    where: '다루지 않음: enum(J8)'
codes:
  predict: |-
    String a = "PAID";
    String b = "PAID";
    String c = new String("PAID");

    System.out.println(a == b);
    System.out.println(a == c);
    System.out.println(a.equals(c));
  immutableRun: |-
    String s = "paid";
    [[s.toUpperCase()]];
    print(s);

    String s = "A";
    String t = s;
    s = s + "B";
    print(s);
    print(t);
  internRun: |-
    String a = "PAID";
    String c = new String("PAID");
    print(a == [[c.intern()]]);
  runtime: |-
    String a = "PAID";
    String half = "PA";
    final String finalHalf = "PA";

    String d = [[half + "ID"]];
    String e = "PA" + "ID";
    String f = finalHalf + "ID";
  loop: |-
    String csv = "";
    for (String id : ids) {
      [[csv += id + ","]];
    }
  builder: |-
    StringBuilder sb = new StringBuilder();
    for (String id : ids) {
      sb.[[append(id)]].append(',');
    }
    String csv = sb.toString();
  loopRun: |-
    // 같은 ids로 두 메서드를 돌려
    // 걸린 시간을 잰다
    withPlus(ids);     // 코드 loop
    withBuilder(ids);  // 코드 builder
  controllerBad: |-
    @GetMapping("/orders")
    List<Order> orders(
        @RequestParam String status) {
      if (status [[==]] "PAID") {
        return orderService.paid();
      }
      return List.of();
    }
  controllerFixed: |-
    if ([["PAID".equals(status)]]) {
      return orderService.paid();
    }
  requestRun: |-
    // 요청 본문의 바이트에서 읽은 "PAID"
    String status = new String(bytes, UTF_8);
  logBad: |-
    log.debug([["주문 " + order]]);
  logFixed: |-
    log.debug("주문 {}", [[order]]);
  logRun: |-
    // 로그 수준을 INFO로 두고
    log.debug("주문 " + order);
    log.debug("주문 {}", order);
  blank: |-
    "".isEmpty()      // true
    "  ".isEmpty()    // false
    "  ".isBlank()    // true
