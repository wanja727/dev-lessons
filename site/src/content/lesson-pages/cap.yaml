# CAP 정리와 결과적 일관성
# 자료 파일의 칸은 docs/lesson-data-format.md에 있다. 문제는 content/questions/cap.yaml에 있다.
# 심화 레슨. 설계 칸과 본문을 한 번에 썼다 (이번 작업의 설계 승인은 사용자가 미리 맡겼다)
title: CAP 정리와 결과적 일관성
description: 네트워크가 갈라졌을 때 분산 저장소가 일관성과 가용성 가운데 하나를 골라야 하는 이유, 일관성을 고르면 생기는 거절, 가용성을 고르면 생기는 엇갈림과 결과적 일관성, 정족수 읽기와 쓰기. 복제본 세 개짜리 저장소 모형으로 분할을 일으켜 보는 대화형 레슨.
unit: 시스템 설계와 아키텍처
minutes: 20
roadmap: A16
type: 개념 설명
prerequisites:
  - {slug: replication-sharding, title: DB 복제와 샤딩}
assume: '자바 21. 원본의 변경이 복제본에 늦게 닿는 복제 지연(DB 복제와 샤딩 레슨). 메시지 큐로 떼어 놓으면 결과가 조금 뒤에 맞춰진다는 것(메시지 큐 레슨). 이 레슨의 실험은 실제 DB가 아니라 원리를 보이는 작은 모형이에요.'
example: '회원 닉네임을 복제본 세 개(A, B, C)에 나눠 든 저장소. 데이터센터 사이의 네트워크가 끊겨 C가 따로 떨어진 상황에서 닉네임을 쓰고 읽는다.'
intro:
  - '데이터센터 두 곳에 DB를 두고 서로 복제하는데, 그 사이의 회선이 끊겼어요. 한쪽에서 닉네임을 바꾸고 다른 쪽에서 읽으면 옛 닉네임이 보여요. 아니면 아예 "지금은 쓸 수 없어요"가 나오기도 해요. 어느 쪽이 맞을까요?'
  - '분산 시스템을 쓰는 스프링 개발자는 이 질문을 피할 수 없어요. Redis 복제, 카프카, 여러 지역의 DB가 모두 네트워크가 끊기면 둘 가운데 하나를 골라요. 기능마다 "잠깐 틀려도 되는가, 잠깐 멈춰도 되는가"를 정해야 하고, 면접에서는 "CAP 정리를 설명해 보세요", "결과적 일관성이 뭔가요"로 물어요.'
  - '이 레슨에서는 복제본 세 개짜리 작은 저장소 모형에 분할을 일으켜, 일관성을 고르면 무엇이 거절되고, 가용성을 고르면 무엇이 엇갈리고 나중에 어떻게 맞춰지는지, 정족수가 왜 최신 값을 읽게 하는지 확인해요.'
covers:
  - topic: 'CAP: 일관성(C, 모두가 같은 최신 값을 본다), 가용성(A, 살아 있는 노드는 늘 응답한다), 분할 내성(P, 네트워크가 갈라져도 동작한다)'
    where: '질문 1'
  - topic: '분산 시스템에서 네트워크 분할은 피할 수 없으니, 분할이 생겼을 때 일관성과 가용성 가운데 하나를 고른다는 뜻이다'
    where: '질문 1'
  - topic: '일관성을 고르면(CP) 최신 값을 보장할 수 없는 쪽은 쓰기와 읽기를 거절한다'
    where: '질문 2'
  - topic: '가용성을 고르면(AP) 양쪽이 모두 응답하지만 서로 다른 값을 보고, 분할이 풀리면 맞춘다'
    where: '질문 3'
  - topic: '결과적 일관성: 새 쓰기가 없으면 결국 모든 복제본이 같은 값이 된다. 맞추는 동안 충돌이 생긴다'
    where: '질문 3'
  - topic: '충돌 해결: 마지막 쓰기 승리는 한쪽 쓰기를 잃는다'
    where: '질문 3'
  - topic: '정족수: N개 복제본에 W개 쓰고 R개 읽을 때, R + W > N이면 읽기가 최신 쓰기와 겹친다'
    where: '질문 4'
  - topic: '기능마다 고른다: 잔액, 재고는 일관성, 좋아요 수, 조회수는 가용성'
    where: '질문 4'
  - topic: '분할이 없을 때도 지연과 일관성 사이에서 고른다(PACELC)'
    where: '질문 4의 더 알아보기'
  - topic: '결과적으로 맞춰지는 값으로 돈을 판단하는 실수'
    where: '실무에서는'
codes:
  predict: |-
    // 분할: {A, B} | {C}
    // 정족수 W=2: 두 곳 이상에 써야 성공
    cluster.quorumWrite("C", "준호3", 2);
    // C에서의 쓰기는 어떻게 될까?
  cp: |-
    boolean quorumWrite(String via,
        String value, int w) {
      List<String> targets =
          reachableFrom(via);
      if (targets.size() < w) {
        [[return false;]] // 거절
      }
      ...
    }
  ap: |-
    void localWrite(String via,
        String value) {
      // 닿는 쪽에만 쓰고 늘 성공
      for (String t : reachableFrom(via)) {
        replicas.put(t, new Versioned(
            value, ++clock));
      }
    }
  lww: |-
    void antiEntropy() {
      Versioned newest = [[가장 큰 버전]];
      for (String r : all) {
        replicas.put(r, newest);
      }
    }
  quorum: |-
    N = 3 (복제본 수)
    W = 쓰기를 확인받을 수
    R = 읽을 복제본 수
    R + W > N → 읽은 것 가운데
                최신 쓰기가 반드시 있다
  badBalance: |-
    @Transactional(readOnly = true)
    public boolean canWithdraw(Long id,
        long amount) {
      // 복제본(결과적 일관성)에서 읽음
      return [[accounts.balance(id)]]
          >= amount;
    }
links:
  test: https://github.com/wanja727/dev-lessons/blob/main/verification/src/test/java/lab/devlessons/cap/CapTest.java
  brewer: https://www.infoq.com/articles/cap-twelve-years-later-how-the-rules-have-changed/
  dynamo: https://www.allthingsdistributed.com/files/amazon-dynamo-sosp2007.pdf
  cassandra: https://cassandra.apache.org/doc/latest/cassandra/architecture/dynamo.html
predict:
  title: 떨어진 쪽에서 쓰면?
  text: '복제본 A, B, C 가운데 C가 네트워크 분할로 떨어져 나갔어요. 이 저장소는 두 곳 이상에 써야 성공하는 정족수 쓰기(W=2)를 해요. C에서 닉네임을 쓰면 어떻게 될까요? 답은 질문 2에 나와요.'
  code: predict
  label: 내 예측
  options:
    - value: ok
      label: 성공한다
    - value: reject
      label: 거절된다
    - value: later
      label: 성공하고 나중에 A, B에 옮겨진다
  answer: reject
  storageKey: cap-predict
  wrong: 예측은 "{label}"이었어요. 틀린 예측이 더 오래 남으니 괜찮아요.
questions:
  - id: q1
    title: CAP 정리는 무엇을 말하나요?
    conclusion:
      lead: '네트워크가 갈라지면, 분산 저장소는 모두가 같은 최신 값을 보는 일관성과 살아 있는 노드가 늘 응답하는 가용성 가운데 하나만 지킬 수 있다는 거예요.'
      sub: '분산 시스템에서 네트워크 분할은 언젠가 일어나니 피할 수 없어요. 그래서 "셋 가운데 둘을 고른다"가 아니라 "분할이 생기면 C와 A 가운데 무엇을 지킬지 고른다"는 뜻이에요.'
    says:
      - 'C, A, P의 뜻'
      - '분할이 없으면 정족수로 최신 값을 읽는다'
      - '분할이 생기면 고른다'
    asks:
      - '본문의 예시: 분할이 생긴 동안 소수 쪽 노드가 응답하면서 최신 값도 보장하려면 무엇이 필요한가 (다수 쪽과 통신. 분할 중에는 불가능해 C와 A 가운데 하나를 포기한다)'
      - '옮긴 상황: "우리 DB는 CA를 고른 분산 DB예요"라는 설명의 문제는 (분산 시스템에서 분할은 피할 수 없어 P를 버릴 수 없다)'
    body:
      - p: 'CAP 정리는 복제된 데이터를 가진 분산 시스템의 세 성질을 다뤄요([에릭 브루어의 글](link:brewer)).'
      - ul:
          - '**일관성(Consistency):** 어느 노드에서 읽어도 가장 최근에 쓴 값을 본다.'
          - '**가용성(Availability):** 살아 있는 노드는 요청에 늘 응답한다(오류가 아니라 답을 준다).'
          - '**분할 내성(Partition tolerance):** 노드 사이의 네트워크가 끊겨도 시스템이 동작한다.'
      - p: '네트워크가 멀쩡할 때는 셋 다 지킬 수 있어요. 복제본 세 개에 정족수로 쓰고 읽어 봤어요.'
      - ci:
          key: normal
          label: 실제 결과 보기
          source: CapTest.noPartition
      - p: '문제는 **네트워크가 갈라졌을 때**예요. 떨어져 나간 노드가 요청을 받으면, 다른 쪽의 최신 쓰기를 알 방법이 없어요. 그때 할 수 있는 일은 둘뿐이에요. 모르는 채로 답하거나(가용성), 답하지 않거나(일관성).'
      - p: '여러 서버, 여러 데이터센터를 쓰는 한 네트워크 분할은 언젠가 일어나요. 그래서 P는 고르는 대상이 아니에요. CAP는 "분할이 생기면 **C와 A 가운데 무엇을 지킬지** 정해야 한다"는 말이에요.'
      - quiz:
          q: '"우리는 CA를 고른 분산 DB라 분할에도 일관성과 가용성을 모두 지켜요"라는 설명에서 틀린 곳은?'
          options:
            - '틀린 곳이 없다'
            - '분산 시스템에서 분할은 피할 수 없어, 분할이 생기면 C와 A 가운데 하나를 포기해야 한다'
            - 'CAP에는 A가 없다'
          answer: 2
          explain: '분할은 고를 수 있는 것이 아니라 일어나는 일이에요. 일어났을 때 C와 A를 함께 지킬 수는 없어요.'
      - next: '분할이 생겼을 때 일관성을 고르면 무엇을 포기할까요?'
    recall: 'CAP 정리는 분산 저장소가 네트워크 분할이 생기면, 어느 노드에서 읽어도 최신 값을 보는 일관성(C)과 살아 있는 노드가 늘 응답하는 가용성(A)을 함께 지킬 수 없다는 거예요. 여러 서버를 쓰는 한 분할(P)은 언젠가 일어나니 피할 수 없어서, "셋 가운데 둘"이 아니라 "분할이 생기면 C와 A 가운데 무엇을 지킬지 고른다"는 뜻이에요.'
  - id: q2
    title: 일관성을 고르면 무엇을 포기하나요?
    conclusion:
      lead: '최신 값을 보장할 수 없는 쪽은 요청을 거절해요. 틀린 값을 주느니 답하지 않는 거예요.'
      sub: '정족수(다수)에 닿는 쪽은 계속 쓰고 읽어요. 떨어진 소수 쪽은 분할이 풀릴 때까지 쓰기와 읽기를 거절해요.'
    says:
      - '분할 {A, B} | {C}, W=2, R=2: A 성공, C 쓰기와 읽기 거절. 예측의 답'
      - '은행 잔액 같은 데이터'
    asks:
      - '본문의 예시: 분할 {A, B} | {C}, 정족수 W=2. C에서의 쓰기는 (거절된다)'
      - '옮긴 상황: 같은 구조에서 B에서 읽으면 (최신 값을 읽는다. A, B 두 곳에 닿는다)'
    body:
      - p: '일관성을 고른 저장소는 **다수**(정족수)에 닿아야 쓰고 읽어요. 복제본 세 개라면 두 개예요.'
      - code: cp
      - p: 'C가 떨어져 나간 상황에서 처음 예측을 돌려 봤어요.'
      - ci:
          key: cp
          label: 실제 결과 보기
          source: CapTest.consistencyChoice
          code: predict
      - p: '답은 **거절된다**예요. {{predict-result}} C는 혼자라 두 곳에 쓸 수 없어 거절했고, 읽기도 최신 값을 보장할 수 없어 거절했어요. A, B 쪽은 둘이 닿아 계속 쓰고 읽었어요. 그래서 C에 붙은 사용자에게는 "지금은 이용할 수 없어요"가 나가요. **가용성을 포기**한 거예요.'
      - p: '은행 잔액, 재고, 좌석처럼 **잠깐이라도 틀리면 사고가 나는** 데이터는 이쪽을 골라요. 잠깐 멈추는 것이 틀린 잔액으로 돈을 내주는 것보다 나아요.'
      - quiz:
          q: '분할 {A, B} | {C}, 정족수 W=2, R=2인 저장소에서 B에서 읽으면?'
          options:
            - '거절된다'
            - 'A, B에 닿으니 최신 값을 읽는다'
            - 'C의 옛 값을 읽는다'
          answer: 2
          explain: 'B는 A와 닿아 두 곳을 읽을 수 있어요. 다수 쪽은 계속 일해요.'
      - next: '반대로 가용성을 고르면 어떻게 될까요?'
    recall: '일관성을 고르면 다수(정족수)에 닿는 쪽만 쓰고 읽고, 최신 값을 보장할 수 없는 소수 쪽은 쓰기와 읽기를 거절해요. 분할 {A, B} | {C}에서 정족수 2라면 A, B는 계속 일하고 C는 거절해서 C의 사용자는 이용할 수 없어요. 틀린 값을 주느니 답하지 않는 선택이라, 잔액이나 재고처럼 잠깐이라도 틀리면 안 되는 데이터에 맞아요.'
  - id: q3
    title: 가용성을 고르면 무엇이 생기나요?
    conclusion:
      lead: '양쪽이 모두 응답하지만 서로 다른 값을 봐요. 분할이 풀리면 복제본들이 서로 맞춰 결국 같은 값이 되는데, 이것을 결과적 일관성이라고 해요.'
      sub: '맞추는 동안 양쪽에서 쓴 값이 부딪혀요. 버전이 큰 쪽이 이기는 "마지막 쓰기 승리"로 맞추면 한쪽의 쓰기는 사라져요.'
    says:
      - '분할 중 A에 준호2, C에 준호3. 서로 다른 값'
      - '풀리고 맞춘 뒤 모두 준호3, 준호2는 사라짐'
      - '결과적 일관성의 정의'
    widget:
      kind: steps
      note: '분할 → A에 준호2, C에 준호3 → 양쪽이 다른 값 → 분할 풀림 → 맞추기 → 모두 준호3'
    asks:
      - '본문의 예시: 분할 중 A에 준호2, C에 준호3을 쓰고, 풀린 뒤 마지막 쓰기 승리로 맞췄다. 남는 값은 (준호3. 준호2는 사라진다)'
      - '옮긴 상황: 좋아요 수를 가용성 우선 저장소에 둔다. 분할 중 양쪽에서 좋아요가 눌렸고 마지막 쓰기 승리로 덮어쓰면 (한쪽에서 누른 좋아요가 사라진다. 더하기로 합치는 방식이 필요하다)'
    body:
      - p: '가용성을 고른 저장소는 **닿는 쪽에만 쓰고 늘 성공**이라고 답해요.'
      - code: ap
      - p: '분할 중 A와 C에서 각각 닉네임을 썼어요.'
      - ci:
          key: ap
          label: 실제 결과 보기
          source: CapTest.availabilityChoice
      - p: '두 쓰기 모두 성공했고, 분할 중에는 A에서 준호2, C에서 준호3이 보였어요. 같은 회원의 닉네임이 어디서 읽느냐에 따라 달라요. 분할이 풀리자 복제본들이 서로 맞춰 셋 다 같은 값이 됐어요. 이렇게 **새 쓰기가 없으면 결국 모든 복제본이 같아지는** 성질을 **결과적 일관성**이라고 해요.'
      - h3: 맞출 때의 충돌
      - code: lww
      - p: '버전이 큰 쪽이 이기는 **마지막 쓰기 승리**로 맞추니 준호3이 남고 **준호2는 사라졌어요.** 닉네임이면 괜찮을 수 있지만, 장바구니에 담은 상품이나 좋아요 수라면 한쪽에서 한 일이 사라져요. 그래서 장바구니는 양쪽을 합치고, 좋아요 수는 더하는 식으로 데이터에 맞는 합치는 방법을 따로 두기도 해요([다이나모 논문](link:dynamo)).'
      - widget:
          kind: steps
          layout: [duo, log, buttons, verdict]
          initial:
            duo:
              - {label: 'A, B 쪽', rows: [{k: 닉네임, v: 준호}]}
              - {label: C 쪽, rows: [{k: 닉네임, v: 준호}]}
          scenarios:
            default:
              - log: '네트워크 분할: {A, B} | {C}'
                duo:
                  - {label: 'A, B 쪽', rows: [{k: 닉네임, v: 준호}]}
                  - {label: C 쪽, rows: [{k: 닉네임, v: 준호}]}
              - log: 'A에서 준호2로, C에서 준호3으로 씀 (둘 다 성공)'
                duo:
                  - {label: 'A, B 쪽', rows: [{k: 닉네임, v: 준호2, mark: changed}]}
                  - {label: C 쪽, rows: [{k: 닉네임, v: 준호3, mark: changed}]}
              - log: '분할 중에는 어디서 읽느냐에 따라 다름'
                duo:
                  - {label: 'A, B 쪽', rows: [{k: 닉네임, v: 준호2, mark: bad}]}
                  - {label: C 쪽, rows: [{k: 닉네임, v: 준호3, mark: bad}]}
              - log: '분할이 풀림 → 마지막 쓰기 승리로 맞춤'
                duo:
                  - {label: 'A, B 쪽', rows: [{k: 닉네임, v: 준호3, mark: changed}]}
                  - {label: C 쪽, rows: [{k: 닉네임, v: 준호3}]}
                verdict: '결국 같아졌지만(결과적 일관성) 준호2라는 쓰기는 사라졌어요.'
      - quiz:
          q: '좋아요 수를 가용성 우선 저장소에 둬요. 분할 중 양쪽에서 좋아요가 3개, 2개 눌렸고, 풀린 뒤 마지막 쓰기 승리로 맞추면 어떻게 되나요?'
          options:
            - '좋아요가 5개로 합쳐진다'
            - '한쪽에서 누른 좋아요가 사라진다. 더하기로 합치는 방식이 필요하다'
            - '좋아요가 0이 된다'
          answer: 2
          explain: '마지막 쓰기 승리는 한쪽 값을 버려요. 카운터는 양쪽의 증가분을 더하는 방식으로 합쳐요.'
      - next: '일관성과 가용성 사이에서 조금씩 조절하는 방법은 없을까요?'
    recall: '가용성을 고르면 닿는 쪽에만 쓰고 늘 응답해서, 분할 중에는 같은 데이터가 어디서 읽느냐에 따라 달라요. 분할이 풀리면 복제본들이 서로 맞춰 새 쓰기가 없으면 결국 모두 같아지는데, 이것이 결과적 일관성이에요. 맞출 때 양쪽의 쓰기가 부딪히고, 마지막 쓰기 승리로 맞추면 한쪽 쓰기가 사라져요. 장바구니나 카운터는 합치거나 더하는 방법을 따로 둬요.'
  - id: q4
    title: 정족수는 무엇이고, 기능마다 어떻게 고르나요?
    conclusion:
      lead: 'N개 복제본 가운데 W개에 쓰고 R개를 읽을 때, R + W > N이면 읽은 것 가운데 최신 쓰기가 반드시 있어요. W와 R을 조절해 일관성과 가용성, 속도 사이를 고르는 거예요.'
      sub: '시스템 전체가 아니라 기능마다 골라요. 잔액과 재고는 일관성을, 좋아요 수와 조회수는 가용성을 골라요.'
    says:
      - 'N=3, W=1, R=1: 옛 값. R=3: 최신'
      - '기능마다 고르기'
      - '더 알아보기: PACELC'
    asks:
      - '본문의 예시: N=3에서 A에만 쓰고(W=1) C 하나만 읽으면(R=1) (옛 값을 읽을 수 있다. R + W = 2 <= 3)'
      - '옮긴 상황: N=5, W=3이다. 최신 값을 보장하려면 R은 최소 몇인가 (3. R + W > 5)'
    body:
      - p: '카산드라 같은 저장소는 쓰기와 읽기마다 몇 개의 복제본에게 확인받을지 정하게 해요([카산드라 문서](link:cassandra)).'
      - code: quorum
      - p: 'R + W > N이면 읽은 복제본들과 쓴 복제본들이 **적어도 하나는 겹쳐요**. 그 겹친 하나가 최신 값을 갖고 있으니 버전이 가장 큰 것을 고르면 최신 값이에요. 일부러 겹치지 않게 해 봤어요.'
      - ci:
          key: quorum
          label: 실제 결과 보기
          source: CapTest.quorumOverlap
      - p: 'A에만 썼을 때(W=1) C 하나만 읽으면(R=1) 옛 값이었고, 셋 다 읽으면(R=3) 최신 값이었어요. W와 R을 크게 하면 일관성이 강해지는 대신 더 많은 복제본에 닿아야 해서 느려지고 분할에 약해져요. 작게 하면 그 반대예요.'
      - h3: 기능마다 고른다
      - table:
          head: [기능, 고르는 쪽, 이유]
          rows:
            - ['계좌 잔액, 재고, 좌석', '일관성', '잠깐이라도 틀리면 돈이 나가거나 초과 판매']
            - ['좋아요 수, 조회수', '가용성', '잠깐 틀려도 괜찮고, 멈추면 불편이 더 크다']
            - ['닉네임, 프로필', '대개 가용성', '조금 늦게 맞춰져도 된다. 내 화면은 원본에서 읽는다']
      - more:
          summary: 분할이 없을 때도 고른다 (PACELC)
          body:
            - p: 'CAP는 분할이 생겼을 때의 이야기예요. 분할이 없을 때도 복제본 모두를 기다리면 일관성은 좋지만 느리고, 하나만 확인하면 빠르지만 옛 값을 볼 수 있어요. 그래서 "분할이면 A와 C, 아니면(Else) 지연(Latency)과 C"를 고른다는 PACELC라는 정리도 있어요. [DB 복제와 샤딩](lesson:replication-sharding)의 동기 복제와 비동기 복제가 이 선택이에요.'
      - quiz:
          q: '복제본 N=5, 쓰기를 W=3에게 확인받아요. 읽기가 늘 최신 값을 보장하려면 R은 최소 얼마인가요?'
          options:
            - '2'
            - '3'
            - '5'
          answer: 2
          explain: 'R + W > N이어야 해서 R + 3 > 5, R은 3 이상이에요.'
      - next: '원리는 여기까지예요. 이제 스프링 서비스에서 이 선택이 드러나는 흔한 실수를 볼게요.'
    recall: 'N개 복제본 가운데 W개에 쓰고 R개를 읽을 때 R + W > N이면 읽은 복제본과 쓴 복제본이 적어도 하나 겹쳐, 버전이 가장 큰 값이 최신 값이에요. W와 R을 키우면 일관성이 강해지고 느려지며 분할에 약해져요. 시스템 전체가 아니라 기능마다 골라서, 잔액과 재고와 좌석은 일관성을, 좋아요 수와 조회수는 가용성을 골라요.'
practice:
  title: 스프링 서비스에서 만나는 CAP
  says:
    - '돈을 판단하는 읽기는 원본에서. 결과적 일관성인 복제본과 캐시로 판단하는 실수'
  body:
    - p: '스프링 개발자가 CAP를 직접 고르는 일은 드물지만, 그 선택은 곳곳에 이미 들어 있어요. 비동기 복제본, Redis 캐시와 복제, 메시지 큐로 나중에 맞춰지는 데이터가 모두 **결과적 일관성**이에요. 그래서 "이 값으로 무엇을 판단하나"를 봐요.'
    - h3: 흔한 실수 하나
    - code: badBalance
      notes:
        - mark: accounts.balance(id)
          as: code
          text: 'readOnly라 복제본에서 읽어요. 방금 다른 출금이 있었다면 복제본은 아직 옛 잔액이에요.'
    - p: '잔액이 남은 줄 알고 출금을 허락하면 잔액보다 많이 나가요. 화면에 보여 주는 잔액은 조금 늦어도 되지만, **돈을 내주는 판단**은 일관성이 보장되는 곳에서 해요. 고친 모양은 출금 자체를 원본 DB에서 조건부 UPDATE로 하는 거예요(`balance >= amount`일 때만 줄이기, [동시 요청에서 재고 지키기](lesson:stock-concurrency)와 같은 방법). 캐시에 둔 잔액이나 재고로 판단하는 것도 같은 실수예요([캐시 전략과 무효화](lesson:cache-strategy)).'
interview:
  question: CAP 정리와 결과적 일관성을 설명해 주세요.
  model:
    - label: 정의
      text: CAP 정리는 분산 저장소가 네트워크 분할이 생기면 모든 노드가 최신 값을 보는 일관성과 살아 있는 노드가 늘 응답하는 가용성을 함께 지킬 수 없다는 것입니다. 분할은 피할 수 없으니 분할이 생기면 둘 가운데 하나를 고릅니다.
    - label: 원리
      text: 일관성을 고르면 정족수에 닿지 못하는 쪽은 요청을 거절합니다. 가용성을 고르면 양쪽이 응답하지만 서로 다른 값을 보고, 분할이 풀리면 맞춰 결국 같아지는 결과적 일관성이 됩니다. 맞출 때 마지막 쓰기 승리는 한쪽 쓰기를 잃습니다. R + W > N인 정족수는 최신 쓰기와 겹치게 합니다.
    - label: 고르기
      text: 잔액, 재고처럼 틀리면 안 되는 것은 일관성을, 좋아요 수처럼 잠깐 틀려도 되는 것은 가용성을 고릅니다. 복제본이나 캐시 같은 결과적 일관성의 값으로 돈을 판단하지 않고, 원본에서 조건부 UPDATE로 판단합니다.
    - label: 경험
      text: '(내 프로젝트로 채우기) 예: 복제본에서 읽은 잔액으로 출금을 허락하던 코드를 원본의 조건부 UPDATE로 바꿨습니다.'
verified: 분할 중의 거절, 엇갈린 값과 맞춘 뒤의 값, 정족수의 결과는 자바 21로 만든 복제본 세 개짜리 저장소 모형에서 받은 값이에요. 실제 DB가 아니라 원리를 보이는 모형이에요. 코드가 바뀔 때마다 테스트([CapTest](link:test))가 다시 돌아요.
footer: '근거: CAP 정리는 [에릭 브루어의 글](link:brewer), 결과적 일관성과 충돌 합치기는 [다이나모 논문](link:dynamo), 정족수는 [카산드라 문서](link:cassandra). 결과는 모형으로 테스트해 확인했어요. 오류는 [GitHub 이슈](https://github.com/wanja727/dev-lessons/issues)로 알려 주세요.'
claims:
  - claim: '분할이 없으면 정족수 W=2, R=2로 최신 값을 읽는다'
    how: '복제본 3개짜리 모형'
    test: CapTest.noPartition
  - claim: '분할 중 정족수를 고르면 소수 쪽은 쓰기와 읽기를 거절하고 다수 쪽은 계속 일한다'
    how: '같은 모형'
    test: CapTest.consistencyChoice
  - claim: '가용성을 고르면 분할 중 값이 엇갈리고, 풀린 뒤 마지막 쓰기 승리로 맞추면 한쪽 쓰기를 잃는다'
    how: '같은 모형'
    test: CapTest.availabilityChoice
  - claim: 'R + W <= N이면 옛 값을, R + W > N이면 최신 값을 읽는다'
    how: '같은 모형'
    test: CapTest.quorumOverlap
sources:
  - 'CAP 정리: https://www.infoq.com/articles/cap-twelve-years-later-how-the-rules-have-changed/'
  - '다이나모: https://www.allthingsdistributed.com/files/amazon-dynamo-sosp2007.pdf'
  - '카산드라의 정족수: https://cassandra.apache.org/doc/latest/cassandra/architecture/dynamo.html'
