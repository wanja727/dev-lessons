# OSI 7계층과 TCP/IP 4계층 (설계서)
# 자료 파일의 칸은 docs/lesson-data-format.md에 있다.
stage: design
title: OSI 7계층과 TCP/IP 4계층
unit: 네트워크와 웹
roadmap: N2
type: 개념 설명
prerequisites:
  - {slug: url-to-response, title: 브라우저에 주소를 입력하면}
assume: '주소를 입력하면 DNS, TCP 연결, HTTP 요청 순서로 진행된다는 것(브라우저에 주소를 입력하면 레슨). 자바 21. 계층의 아래쪽(전선, 전파)은 테스트로 돌릴 수 없어서 RFC와 표준 문서를 근거로 적어요.'
example: 'N1에서 보낸 `GET /products/7` 요청 하나가 서버까지 가는 길. 테스트에서는 같은 HTTP 글을 TCP와 유닉스 도메인 소켓 두 통로로 보내 보고, 소켓의 주소와 포트를 들여다봐요.'
intro:
  - '"OSI 7계층을 설명해 보세요"는 외워서 답하기 쉬운 만큼, 왜 나눴는지 물으면 막히는 질문이에요. 실무에서는 "L4 로드 밸런서", "L7에서 막혔다"처럼 계층 번호가 일상어로 나와요.'
  - '스프링 개발자가 쓰는 코드는 맨 위 계층(HTTP)에 있어요. 그 아래 TCP, IP, 이더넷은 OS와 장비가 맡아서 코드에 드러나지 않아요. 그래도 장애가 나면 예외 이름(`UnknownHostException`, `Connection refused`, `SSLHandshakeException`)이 어느 계층에서 일이 멈췄는지 말해 줘요.'
  - '이 레슨에서는 같은 HTTP 요청을 다른 통로로 보내 봐서 계층이 서로를 모르고도 일하는 것을 확인하고, 소켓의 주소와 포트로 계층마다 무엇을 구별하는지 봐요.'
covers:
  - {topic: '계층을 나누는 이유: 각 계층은 바로 아래 계층이 주는 기능만 쓰고, 한 계층을 바꿔도 다른 계층은 그대로다', where: 질문 1}
  - {topic: 'TCP/IP 4계층: 응용, 전송, 인터넷, 링크(네트워크 접근)', where: 질문 2}
  - {topic: '응용 계층: HTTP, DNS처럼 프로그램끼리의 약속', where: 질문 2}
  - {topic: '전송 계층: TCP와 UDP. 포트로 한 컴퓨터 안의 프로그램을 구별한다', where: '질문 2. 자세한 것은 TCP와 UDP(N3)'}
  - {topic: '인터넷 계층: IP. IP 주소로 컴퓨터를 구별하고, 라우터가 목적지까지 길을 찾는다', where: 질문 2}
  - {topic: '링크 계층: 바로 옆 장비까지 보낸다. 이더넷과 와이파이, MAC 주소', where: 질문 2}
  - {topic: '연결 하나는 (출발 IP, 출발 포트, 도착 IP, 도착 포트)로 구별된다', where: 질문 2}
  - {topic: '캡슐화: 내려가며 계층마다 헤더를 붙이고, 받는 쪽은 올라가며 뗀다. 프로그램은 헤더를 보지 못한다', where: 질문 3}
  - {topic: '계층마다 데이터를 부르는 이름: 세그먼트, 패킷, 프레임', where: 질문 3의 더 알아보기}
  - {topic: '한 번에 보낼 수 있는 크기(MTU)가 있어서 큰 데이터는 나뉘어 간다', where: 질문 3}
  - {topic: 'OSI 7계층과 TCP/IP 4계층의 대응. OSI는 설명하는 틀이고 인터넷은 TCP/IP로 움직인다', where: 질문 4}
  - {topic: 'OSI의 표현 계층과 세션 계층이 하는 일, TLS를 어디에 두는지', where: 질문 4}
  - {topic: '장비와 계층: 스위치(L2), 라우터(L3), L4 로드 밸런서, L7 로드 밸런서', where: 질문 4와 실무에서는}
  - {topic: '예외 이름으로 어느 계층에서 멈췄는지 읽기', where: 실무에서는}
  - {topic: 'TCP가 신뢰성을 지키는 방법', where: '다루지 않음: TCP와 UDP(N3)'}
  - {topic: 'TLS', where: '다루지 않음: HTTPS와 TLS(N6)'}
  - {topic: '로드 밸런서로 서버를 늘리는 설계', where: '다루지 않음: 서버를 늘리는 방법(A3)'}
  - {topic: 'IP 주소 체계, 서브넷, NAT', where: '다루지 않음: 백엔드 개발자가 직접 다룰 일이 적어 로드맵에 두지 않는다'}
codes:
  request: |-
    GET /products/7 HTTP/1.1
    Host: localhost
    Connection: close

  tcpSocket: |-
    Socket s = new Socket(
        "127.0.0.1", 8080);
  unixSocket: |-
    SocketChannel ch = SocketChannel.open(
        UnixDomainSocketAddress.of(path));
  fourTuple: |-
    s.getLocalAddress();  // 출발 IP
    s.getLocalPort();     // 출발 포트
    s.getInetAddress();   // 도착 IP
    s.getPort();          // 도착 포트
predict:
  text: '코드 request를 한 번은 TCP 소켓(127.0.0.1의 포트)으로, 한 번은 같은 컴퓨터 안의 파일 경로로 여는 유닉스 도메인 소켓으로 보냈어요. 받는 쪽은 두 통로에서 같은 코드로 요청을 읽어 응답해요. 두 응답은 어떨까요? 보기: 같다, 유닉스 소켓은 IP 주소가 없어서 HTTP를 쓸 수 없다, 유닉스 소켓 쪽은 요청을 다시 써야 한다.'
  answer: '같다. HTTP는 아래 통로가 바이트를 순서대로 날라 주기만 하면 되고, 그 통로가 TCP인지는 모른다. 질문 1에서 밝힌다.'
questions:
  - id: q1
    title: 네트워크는 왜 계층을 나누나요?
    conclusion:
      lead: '각 계층이 바로 아래 계층이 해 주는 일만 믿고 자기 일만 하게 하려고요. 그래서 한 계층을 바꿔도 위아래는 고치지 않아요.'
      sub: 'HTTP는 바이트가 순서대로 도착한다는 것만 믿고, 그 바이트가 와이파이로 갔는지 광케이블로 갔는지 몰라요.'
    says:
      - '요청 하나를 보내려면 할 일이 많다. 어느 프로그램에게 줄지, 어느 컴퓨터로 갈지, 바로 옆 장비에 어떻게 전할지, 빠진 것을 어떻게 다시 보낼지. 한 덩어리로 만들면 하나를 바꿀 때 전부 고쳐야 한다'
      - '계층으로 나누면 각 계층은 아래 계층이 주는 기능(예: 바이트를 순서대로 날라 줌)만 쓴다. 아래가 어떻게 하는지는 모른다'
      - '같은 HTTP 요청 글을 TCP 소켓과 유닉스 도메인 소켓으로 보내 같은 응답을 받는다. 예측의 답을 밝힌다. 유닉스 도메인 소켓은 같은 컴퓨터 안에서 IP 없이 파일 경로로 여는 통로다'
      - '덕분에 와이파이가 LTE로 바뀌어도, IPv4가 IPv6로 바뀌어도 브라우저와 스프링 코드는 그대로다'
    asks:
      - '본문의 예시: 같은 HTTP 요청을 TCP 소켓과 유닉스 도메인 소켓으로 보낼 때 요청 글에서 바꿔야 하는 것은 (없다)'
      - '옮긴 상황: 회사 와이파이에서 휴대폰 핫스팟으로 바꿔도 스프링 서버의 컨트롤러 코드를 고칠 필요가 없는 이유 (HTTP는 아래 계층이 무엇인지 모르고 바이트가 순서대로 온다는 것만 믿는다)'
  - id: q2
    title: TCP/IP 4계층은 각각 무엇을 하나요?
    conclusion:
      lead: '응용 계층은 프로그램끼리의 약속(HTTP), 전송 계층은 어느 프로그램인지(포트), 인터넷 계층은 어느 컴퓨터인지(IP 주소)와 가는 길, 링크 계층은 바로 옆 장비까지 전하는 일을 해요.'
      sub: '그래서 연결 하나는 출발 IP와 포트, 도착 IP와 포트 네 값으로 구별돼요.'
    says:
      - '표 하나로 네 계층, 하는 일, 구별하는 값, 예(HTTP와 DNS, TCP와 UDP, IP, 이더넷과 와이파이)를 정리한다'
      - '인터넷 계층: IP 주소로 목적지 컴퓨터를 정한다. 중간의 라우터들이 주소를 보고 다음 장비를 골라 넘긴다. 끝까지 가는 길을 한 장비가 다 알지 않는다'
      - '링크 계층: 같은 네트워크 안에서 바로 옆 장비까지만 보낸다. 이더넷과 와이파이의 장비는 MAC 주소로 구별한다'
      - '전송 계층: 한 컴퓨터에 프로그램이 여럿이라 포트로 구별한다. 같은 IP에 포트가 다른 서버 둘을 띄우고 각각 다른 응답을 받는 것을 보인다'
      - '연결은 네 값으로 구별한다(코드 fourTuple). 같은 서버, 같은 포트로 연결 둘을 열면 도착은 같고 출발 포트가 다르다. 실제 출력을 보인다'
    asks:
      - '본문의 예시: 한 컴퓨터에서 8080 포트와 8081 포트로 서버 둘이 떠 있다. 요청이 둘 중 어느 서버로 갈지 정하는 값은 어느 계층의 무엇인가 (전송 계층의 포트)'
      - '옮긴 상황: 브라우저가 같은 서버의 443번 포트로 연결을 둘 열었다. 서버는 두 연결을 무엇으로 구별하나 (클라이언트 쪽 포트가 다르다)'
  - id: q3
    title: 데이터는 계층을 지나며 어떻게 바뀌나요?
    conclusion:
      lead: '보내는 쪽은 내려가며 계층마다 자기 헤더를 앞에 붙이고, 받는 쪽은 올라가며 하나씩 떼어 내요.'
      sub: '그래서 프로그램은 상대 프로그램이 보낸 바이트만 받고, 그 앞에 붙었던 TCP, IP 헤더는 보지 못해요.'
    says:
      - 'HTTP 요청 글이 TCP 헤더(포트, 순서 번호), IP 헤더(IP 주소), 이더넷 헤더(MAC 주소)에 차례로 싸이는 모습을 단계로 보인다. 이것을 캡슐화라고 한다'
      - '받는 쪽은 반대로 이더넷 헤더를 보고 떼고, IP 헤더를 보고 떼고, TCP 헤더를 보고 떼어 HTTP 글만 프로그램에 준다. 자바의 소켓이 읽은 바이트에는 헤더가 없다'
      - '한 번에 실을 수 있는 크기(MTU, 이더넷은 보통 1500바이트)가 있어서 큰 데이터는 여러 조각으로 나뉘어 간다. 1MB를 한 번에 써도 받는 쪽은 여러 번에 나눠 읽는다. 읽은 횟수를 실제 출력으로 보인다'
      - '헤더 크기는 표준이 정한다. TCP와 IPv4는 옵션이 없으면 20바이트씩, 이더넷은 14바이트다 (RFC 근거)'
      - '더 알아보기: 계층마다 데이터를 부르는 이름이 있다. TCP는 세그먼트, IP는 패킷, 링크는 프레임'
    widget:
      kind: steps
      note: 'HTTP 요청 글에서 시작해 "TCP 헤더 붙이기", "IP 헤더 붙이기", "이더넷 헤더 붙이기"를 누를 때마다 앞에 상자가 하나씩 붙는다. 이어서 받는 쪽에서 하나씩 떼어 HTTP 글만 남는 단계까지 간다'
    asks:
      - '본문의 예시: 서버의 자바 코드가 소켓에서 읽은 바이트에 들어 있는 것은 (보기: HTTP 요청 글만, TCP 헤더와 HTTP 글, 이더넷부터 HTTP까지 모든 헤더)'
      - '옮긴 상황: 1MB 파일을 `write` 한 번으로 보냈다. 받는 쪽이 `read` 한 번에 1MB를 다 받는다고 믿고 짠 코드는 왜 틀릴 수 있나 (작은 조각으로 나뉘어 와서 여러 번 읽어야 할 수 있다)'
  - id: q4
    title: OSI 7계층과 TCP/IP 4계층은 어떻게 맞춰 보나요?
    conclusion:
      lead: 'OSI의 응용, 표현, 세션 세 계층이 TCP/IP의 응용 계층 하나에, OSI의 데이터 링크와 물리 두 계층이 링크 계층 하나에 해당하고, 전송과 네트워크는 하나씩 맞아요.'
      sub: 'OSI는 설명할 때 쓰는 틀이고, 인터넷은 TCP/IP로 움직여요. 그래도 "L4", "L7" 같은 번호는 OSI 번호로 불러요.'
    says:
      - '두 모델을 나란히 놓은 표를 보인다. OSI 7(응용), 6(표현), 5(세션)는 TCP/IP 응용, 4(전송)는 전송, 3(네트워크)은 인터넷, 2(데이터 링크)와 1(물리)은 링크다'
      - '표현 계층은 데이터의 모양(인코딩, 압축, 암호화), 세션 계층은 대화의 시작과 끝을 맡는다고 정의되어 있다. 인터넷에서는 HTTP나 TLS 같은 응용 쪽 프로토콜이 이 일을 함께 한다. TLS를 어느 한 계층에 딱 맞추기 어려운 이유다'
      - '장비를 계층 번호로 부른다. 스위치는 MAC 주소를 보는 L2, 라우터는 IP 주소를 보는 L3, L4 로드 밸런서는 IP와 포트까지, L7 로드 밸런서는 HTTP의 경로와 헤더까지 본다'
    widget:
      kind: classify
      note: '항목(HTTP, DNS, TCP, UDP, IP, 라우터, 스위치, MAC 주소, 포트, 경로 /api로 나누는 로드 밸런서)을 TCP/IP 4계층 가운데 하나로 고른다. 고르면 OSI 번호와 함께 설명을 보여 준다'
    asks:
      - '본문의 예시: OSI 7계층의 네트워크 계층(3)은 TCP/IP 4계층의 어느 계층인가 (인터넷 계층)'
      - '옮긴 상황: `/api`로 오는 요청은 API 서버로, `/images`로 오는 요청은 이미지 서버로 보내는 로드 밸런서는 L4인가 L7인가 (L7. HTTP의 경로를 봐야 한다)'
practice:
  says:
    - '스프링 개발자의 코드는 응용 계층에 있다. 계층이 드러나는 곳은 오류다. 예외 이름으로 어느 계층에서 멈췄는지 읽는다'
    - '`UnknownHostException`: 이름을 주소로 못 바꿈(응용 계층의 DNS). `ConnectException: Connection refused`: 그 컴퓨터에는 갔지만 그 포트에 프로그램이 없음(전송 계층). `NoRouteToHostException`이나 연결 시간 초과: 그 컴퓨터까지 길이 없거나 막힘(인터넷 계층 쪽). HTTP 502, 504: 연결은 됐고 중간의 프록시가 답함(응용 계층). 앞의 둘을 테스트로 만든다'
    - '흔한 실수: `Connection refused`를 보고 네트워크(방화벽)를 의심한다. refused는 상대 컴퓨터가 "그 포트에는 아무도 없다"고 답한 것이라, 대개 서버가 안 떠 있거나 포트를 잘못 적은 것이다. 방화벽이 버리면 답이 없어서 시간 초과가 된다'
    - '로드 밸런서의 L4와 L7: L4는 연결을 나눠 주고 HTTP를 보지 않는다. L7은 HTTP를 읽어 경로로 나누고, 원래 클라이언트 IP를 `X-Forwarded-For` 헤더로 넘긴다. 스프링에서 `request.getRemoteAddr()`가 로드 밸런서의 IP를 주는 이유다 (문서 근거)'
claims:
  - claim: '같은 HTTP 요청 글을 TCP 소켓과 유닉스 도메인 소켓으로 보내면 같은 응답 글을 받는다'
    how: '요청 글을 읽어 응답 글을 쓰는 작은 처리기를 두 통로에 붙인다'
  - claim: '같은 IP에서 포트가 다른 서버 둘은 각자 다른 응답을 준다'
    how: 'MiniWeb 둘을 띄운다'
  - claim: '같은 서버 포트로 연 연결 둘은 출발 포트만 다르다'
    how: 'Socket 둘의 local/remote 주소와 포트를 출력한다'
  - claim: '소켓에서 읽은 바이트는 보낸 바이트와 같고 헤더가 없다'
    how: '보낸 바이트와 받은 바이트를 비교한다'
  - claim: '1MB를 한 번에 쓰면 받는 쪽은 여러 번 나눠 읽는다'
    how: '읽은 횟수를 센다. 1번보다 많다는 것만 단정한다'
  - claim: '없는 이름은 `UnknownHostException`, 아무도 듣지 않는 포트는 `ConnectException`(Connection refused)이다'
    how: '`.invalid` 이름과 닫은 포트로 연결한다'
