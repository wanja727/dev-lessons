predict:
  title: setter가 없는데 주문이 바뀔까요?
  text: '`Order`는 클래스도 필드도 `final`이고 setter가 없어요. 주문을 만든 뒤에 바깥의 `cart`에 "마우스"를 추가했어요. 마지막 줄은 무엇을 출력할까요? 모르는 게 정상이니 감으로 골라 보세요. 답은 질문 2에 나와요.'
  code: predict
  label: 내 예측
  options:
    - value: one
      label: '1'
    - value: two
      label: '2'
    - value: error
      label: 예외가 난다
  answer: two
  storageKey: imm-predict
  wrong: 예측은 "{label}"이었어요. 틀린 예측이 더 오래 남으니 괜찮아요.
questions:
  - id: q1
    title: 불변 객체는 무엇이고 왜 쓰나요?
    conclusion:
      lead: '만들어진 뒤에 상태가 바뀌지 않는 객체예요. 바뀌지 않으니 누구에게 넘겨도, 어디에 넣어 둬도 안전해요.'
      sub: '값을 바꾸고 싶으면 그 객체를 고치지 않고, 바뀐 값을 가진 새 객체를 만들어요.'
    says:
      - 'J2에서 본 대로 객체를 넘기면 받은 쪽과 준 쪽이 같은 객체를 가리킨다. 한쪽이 고치면 다른 쪽에 보인다. 가변 객체는 넘길 때마다 "저쪽이 고치면 어쩌지"를 따져야 한다'
      - '불변 객체는 고칠 방법이 없으므로 그 걱정이 사라진다. 캐시에 넣어 두기, 여러 요청이 함께 쓰기, `HashMap`의 키로 쓰기(J6의 질문 5), 여러 스레드가 동시에 읽기가 모두 안전하다'
      - '바꾸는 것은 새 객체를 만드는 것이다. `Money`의 `plus`는 자기를 고치지 않고 합계를 가진 새 `Money`를 돌려준다. `String`의 메서드들이 이렇게 동작한다(J4)'
      - '자바의 불변 클래스: `String`, `Integer` 같은 래퍼, `LocalDate`, `BigDecimal`. `date.plusDays(1)`의 결과를 받지 않으면 아무 일도 일어나지 않는 것이 같은 이유다'
      - '치르는 값: 바꿀 때마다 객체가 새로 생긴다. 값이 자주 바뀌는 큰 객체에는 맞지 않는다. 그래서 JPA 엔티티처럼 상태가 변하는 것이 본질인 객체는 가변으로 둔다'
    asks:
      - '본문의 예시: `LocalDate d = LocalDate.of(2026, 1, 31); d.plusDays(1); System.out.println(d);`의 출력은 무엇인가 (2026-01-31. `plusDays`는 새 객체를 돌려주고 `d`는 그대로다)'
      - '옮긴 상황: 불변인 `Money a = new Money(1000); Money b = a; b = b.plus(500);`을 실행한 뒤 `a`의 금액은 얼마인가. 조건: `plus`는 새 `Money`를 돌려준다 (1000)'
    body:
      - p: '값과 참조 레슨에서 본 대로, 객체를 넘기면 준 쪽과 받은 쪽이 **같은 객체**를 가리켜요. 한쪽이 고치면 다른 쪽에 보여요. 그래서 고칠 수 있는 객체(가변 객체)를 넘길 때는 "받은 쪽이 고치면 어쩌지"를 늘 따져야 해요.'
      - p: '**불변 객체**는 만들어진 뒤에 상태가 바뀌지 않는 객체예요. 고칠 방법이 없으니 그 걱정이 사라져요.'
      - ul:
          - '**어디에 넘겨도 안전해요.** 캐시에 넣어 두거나 여러 요청이 함께 써도 누가 바꿀 일이 없어요.'
          - '**맵의 키로 안전해요.** 키로 넣은 뒤 값이 바뀌어 못 찾는 일(equals와 hashCode 레슨)이 생길 수 없어요.'
          - '**여러 스레드가 동시에 읽어도 돼요.** 아무도 쓰지 않으니까요. 자세한 것은 스레드에 안전한 객체 레슨에서 다뤄요.'
      - h3: 바꾸려면 새 객체를 만들어요
      - p: '금액을 더하고 싶으면 자기를 고치지 않고 **합계를 가진 새 객체를 돌려줘요.**'
      - code: money
        notes:
          - mark: new Money(amount + more,
            as: code
            text: '`a`의 필드는 건드리지 않아요. 새 객체를 만들어 돌려줘요.'
      - p: 'String 레슨에서 본 `toUpperCase`가 이렇게 동작했어요. 자바에는 이런 불변 클래스가 많아요. `String`, `Integer` 같은 래퍼, 날짜의 `LocalDate`, 돈의 `BigDecimal`이 그래요. `date.plusDays(1);`만 쓰고 결과를 받지 않으면 아무 일도 일어나지 않는 이유가 이거예요.'
      - p: '치르는 값도 있어요. 바꿀 때마다 객체가 새로 생겨요. 상태가 계속 변하는 것이 본질인 객체, 예를 들어 JPA 엔티티는 가변으로 둬요. 실무 구역에서 다시 봐요.'
      - quiz:
          q: '`LocalDate d = LocalDate.of(2026, 1, 31); d.plusDays(1); System.out.println(d);`의 출력은?'
          options:
            - 2026-02-01
            - 2026-01-31
            - 컴파일 오류
          answer: 2
          explain: '`LocalDate`는 불변이에요. `plusDays`는 새 날짜를 돌려줄 뿐 `d`를 바꾸지 않아요. 결과를 받지 않았으니 `d`는 그대로예요.'
      - next: '그러면 내 클래스를 불변으로 만들려면 필드에 `final`을 붙이면 될까요?'
    recall: '만들어진 뒤에 상태가 바뀌지 않는 객체예요. 바꾸고 싶으면 새 객체를 만들어요. 고칠 방법이 없으니 누구에게 넘겨도, 캐시나 맵의 키로 써도, 여러 스레드가 함께 읽어도 안전해요. `String`, 래퍼, `LocalDate`, `BigDecimal`이 불변이에요. 바꿀 때마다 객체가 생기는 것이 치르는 값이에요.'
  - id: q2
    title: 'final을 붙이면 불변이 되나요?'
    conclusion:
      lead: '아니요. `final`은 그 변수에 다시 대입하는 것만 막고, 변수가 가리키는 객체가 바뀌는 것은 막지 않아요.'
      sub: '`final` 필드가 가변 객체를 가리키면, 그 객체를 함께 가리키는 누구든 내용을 바꿀 수 있어요.'
    says:
      - '`final List<String> items = new ArrayList<>();` 뒤에 `items = new ArrayList<>();`는 컴파일 오류이고 `items.add("키보드");`는 된다. 변수에 든 참조는 못 바꾸고, 참조가 가리키는 리스트는 바꿀 수 있다'
      - '코드 predict. `this.items = items`는 참조를 복사한다(J2). 필드 `items`와 바깥의 `cart`가 같은 `ArrayList`를 가리킨다. `cart.add("마우스")`는 그 하나뿐인 리스트를 고치므로 주문의 상품이 둘이 된다. 예측의 답을 밝힌다'
      - '`final`과 setter 없음은 불변의 필요한 조건이지 충분한 조건이 아니다. 필드가 기본형이나 불변 객체(`String`, `Long`)만 가리키면 그것으로 충분하다. 가변 객체(리스트, 배열, `Date`)를 가리키면 질문 3이 필요하다'
      - '불변 클래스의 나머지 조건: 필드를 `private`으로 두어 바깥에서 직접 닿지 못하게 한다. 클래스를 `final`로 두어 자식 클래스가 가변 필드를 더하거나 메서드를 오버라이딩해 약속을 깨지 못하게 한다'
    asks:
      - '본문의 예시: `final List<String> items = new ArrayList<>();` 다음에 `items.add("A");`와 `items = List.of("A");`를 쓰면 각각 어떻게 되나 (첫째는 컴파일되고 실행된다. 둘째는 컴파일 오류다)'
      - '옮긴 상황: `final int[] scores = {1, 2, 3}; scores[0] = 9;`를 실행한 뒤 `scores[0]`은 얼마인가 (9. `final`은 배열의 칸을 바꾸는 것을 막지 않는다)'
    body:
      - p: '`final`이 막는 것은 **변수에 다시 대입하는 것** 하나예요. 변수가 가리키는 객체의 내용은 막지 않아요.'
      - ci:
          key: final
          label: 실제 결과 보기
          source: ImmutableObjectTest.finalIsNotImmutable
          code: finalRun
      - p: '`final` 배열의 칸도, `final` 리스트의 원소도 바꿀 수 있어요. 막힌 것은 `items`에 다른 리스트를 대입한 마지막 줄뿐이에요. 변수에 든 **참조는 고정**되지만, 참조가 가리키는 **객체는 가변 그대로**예요.'
      - h3: 그래서 처음 예측한 주문이 바뀌어요
      - p: '답은 **2**예요. {{predict-result}}'
      - code: predictMarked
        notes:
          - mark: this.items = items
            as: code
            text: '리스트를 복사하지 않고 참조만 복사해요. 필드와 바깥의 `cart`가 **같은 리스트**를 가리켜요.'
          - mark: cart.add("마우스")
            as: code
            text: '그 하나뿐인 리스트에 더해요. 주문 안의 리스트도 같은 리스트라 바뀌어요.'
      - ci:
          key: predict
          label: 실제 출력 보기
          source: ImmutableObjectTest.predict
          code: predict
      - p: '클래스도 필드도 `final`이고 setter도 없는데 주문이 바뀌었어요. 도입부의 사고가 이거예요. 응답 객체는 setter가 없었지만 안의 리스트를 다른 곳과 함께 가리키고 있었어요.'
      - h3: 불변 클래스의 조건
      - table:
          head: [조건, 막는 것]
          rows:
            - ['필드를 `private final`로', '바깥에서 필드에 닿는 것, 다시 대입하는 것']
            - [setter를 두지 않음, 메서드로 상태를 바꾸는 것]
            - ['클래스를 `final`로', '자식 클래스가 가변 필드를 더하거나 메서드를 오버라이딩해 약속을 깨는 것']
            - [가변 객체는 복사해서 가짐, '바깥과 같은 객체를 함께 가리키는 것. 다음 질문']
      - p: '필드가 기본형이나 불변 객체(`String`, `Long`, `LocalDate`)만 가리키면 위의 세 줄로 충분해요. 리스트, 배열 같은 가변 객체를 가리키면 마지막 줄이 필요해요.'
      - quiz:
          q: '`final int[] scores = {1, 2, 3}; scores[0] = 9;`를 실행한 뒤 `scores[0]`은?'
          options:
            - '1'
            - '9'
            - 컴파일 오류
          answer: 2
          explain: '`final`은 `scores`에 다른 배열을 대입하는 것만 막아요. 배열의 칸을 바꾸는 것은 막지 않아요.'
      - next: '필드가 리스트를 가리킬 때는 어떻게 해야 바깥과 함께 가리키지 않을까요?'
    recall: '아니요. `final`은 변수에 다시 대입하는 것만 막고, 가리키는 객체의 내용이 바뀌는 것은 막지 않아요. 그래서 `final` 필드가 넘겨받은 리스트를 그대로 가리키면 바깥에서 그 리스트를 고칠 때 객체도 바뀌어요. 불변 클래스는 `private final` 필드, setter 없음, `final` 클래스에 더해 가변 객체를 복사해서 가져야 해요.'
  - id: q3
    title: 필드가 리스트 같은 가변 객체를 가리킬 때는 어떻게 지키나요?
    conclusion:
      lead: '받을 때 복사해서 가지고, 내줄 때도 바깥에서 고칠 수 없는 것으로 내줘요.'
      sub: '바깥과 같은 객체를 함께 가리키지 않게 하는 것이고, 이것을 방어적 복사라고 해요.'
    says:
      - '들어오는 길. 코드 copied처럼 생성자에서 `List.copyOf(items)`로 복사해 필드에 넣는다. 이제 바깥의 `cart`를 고쳐도 주문의 리스트는 다른 객체라 그대로다. 예측의 코드를 고쳐 돌리면 1이 나온다'
      - '나가는 길. `getItems()`가 필드를 그대로 돌려주면 받은 쪽이 `order.getItems().add("모니터")`로 고칠 수 있다. `List.copyOf`가 만든 리스트는 고칠 수 없는 리스트라서 `add`를 부르면 `UnsupportedOperationException`이 난다. 그래서 필드가 `List.copyOf`의 결과면 그대로 내줘도 된다'
      - '필드를 `new ArrayList<>(items)`로 복사했다면 getter에서 다시 복사하거나 `Collections.unmodifiableList(items)`로 감싸 내준다'
      - '`Collections.unmodifiableList(원본)`은 복사본이 아니라 원본을 비추는 창이다. 창으로는 못 고치지만 원본을 고치면 창에 보인다. 생성자에서 이것으로 받으면 `cart.add`가 여전히 주문을 바꾼다. 받을 때는 `List.copyOf`를 쓴다'
      - '`List.of("A", "B")`는 처음부터 고칠 수 없는 리스트를 만든다'
      - '얕은 복사. `List.copyOf`는 리스트만 새로 만들고 안의 원소는 같은 객체를 가리킨다. 원소가 `String`처럼 불변이면 문제없다. 원소가 가변 객체면 원소의 필드는 여전히 바깥에서 바뀐다. 원소까지 새로 만드는 것이 깊은 복사이고, 원소를 불변으로 만드는 쪽이 더 쉽다'
    widget:
      kind: toggle
      note: '지키는 방법 셋 가운데 하나를 고른다: "그대로 받고 그대로 내줌", "받을 때 unmodifiableList로 감쌈", "받을 때 List.copyOf". 실행 버튼을 누르면 같은 두 동작(바깥의 `cart.add("마우스")`, `order.getItems().add("모니터")`)을 차례로 한 결과를 두 칸으로 보여 준다. 왼쪽 칸은 바깥의 `cart`, 오른쪽 칸은 주문 안의 리스트이고, 주문이 바뀐 줄은 문제로 표시한다. 한 줄 정리에 "주문이 바뀌었는가"를 적는다'
    asks:
      - '본문의 예시: 생성자를 코드 copied로 바꾼 뒤 코드 predict를 다시 실행하면 마지막 줄의 출력은 무엇인가 (1)'
      - '옮긴 상황: `List<String> src = new ArrayList<>(List.of("A")); List<String> view = Collections.unmodifiableList(src); List<String> copy = List.copyOf(src); src.add("B");`를 실행한 뒤 `view.size()`와 `copy.size()`는 각각 얼마인가 (2와 1)'
      - '실무 구역: `record OrderResponse(long id, List<String> items) {}`에 간결한 생성자가 없다. 엔티티의 `ArrayList`를 그대로 넘겨 응답을 만든 뒤 `response.items().add("모니터")`를 실행하면 어떻게 되나 (추가된다. 엔티티의 리스트도 같은 객체라 함께 바뀐다)'
    body:
      - p: '바깥과 같은 리스트를 함께 가리키지 않으면 돼요. 길은 둘이에요. **들어오는 길**(생성자)과 **나가는 길**(getter).'
      - code: copied
        notes:
          - mark: List.copyOf(items)
            as: code
            text: '받은 리스트의 원소를 담은 **새 리스트**를 만들어요. 이 리스트는 고칠 수 없어요.'
      - p: '이렇게 받으면 바깥의 `cart`와 주문의 필드는 다른 리스트예요. 예측의 코드를 이 생성자로 돌리면 1이 나와요. 그리고 `List.copyOf`가 만든 리스트는 **고칠 수 없는 리스트**라서, getter로 그대로 내줘도 받은 쪽이 `add`를 부르면 `UnsupportedOperationException`이 나요. 들어오는 길과 나가는 길을 한 줄로 함께 막았어요.'
      - h3: 세 가지 방법을 견줘 봐요
      - p: '같은 두 동작을 해 봐요. 바깥의 `cart`에 "마우스"를 더하고, 주문이 내준 리스트에 "모니터"를 더해요. 방법을 골라 실행해 보세요.'
      - widget:
          kind: toggle
          layout: [selector, buttons, duo, verdict]
          selector:
            label: 주문이 리스트를 받는 방법
            options:
              - {value: plain, label: 그대로 받음}
              - {value: view, label: unmodifiableList로 감쌈}
              - {value: copy, label: List.copyOf로 복사}
          run: {label: 두 동작 실행}
          initial:
            duo:
              - {label: 바깥의 cart, state: dim, text: '[키보드]'}
              - {label: 주문 안의 리스트, state: dim, text: '[키보드]'}
          scenes:
            plain:
              duo:
                - label: 바깥의 cart
                  rows: [{k: 원소, v: '[키보드, 마우스, 모니터]'}]
                - label: 주문 안의 리스트
                  rows: [{k: 원소, v: '[키보드, 마우스, 모니터]', mark: bad}]
              verdict: '같은 리스트라서 바깥의 add도, getter로 받은 쪽의 add도 주문을 바꿨어요.'
            view:
              duo:
                - label: 바깥의 cart
                  rows: [{k: 원소, v: '[키보드, 마우스]'}]
                - label: 주문 안의 리스트
                  rows: [{k: 원소, v: '[키보드, 마우스]', mark: bad}, {k: 모니터 add, v: UnsupportedOperationException}]
              verdict: 'getter로 받은 쪽은 막았지만, 원본을 비추는 창이라 바깥의 add가 주문에 보여요.'
            copy:
              duo:
                - label: 바깥의 cart
                  rows: [{k: 원소, v: '[키보드, 마우스]'}]
                - label: 주문 안의 리스트
                  rows: [{k: 원소, v: '[키보드]', mark: changed}, {k: 모니터 add, v: UnsupportedOperationException}]
              verdict: '받을 때 복사해서 바깥과 다른 리스트이고, 고칠 수 없는 리스트라 내줘도 안전해요. 주문이 바뀌지 않았어요.'
      - ci:
          key: three-ways
          label: 세 방법을 실제로 돌린 결과 보기
          source: ImmutableObjectTest.threeWays
      - h3: unmodifiableList는 복사본이 아니에요
      - p: '`Collections.unmodifiableList(원본)`은 **원본을 비추는 창**이에요. 창으로는 고칠 수 없지만 원본이 바뀌면 창에 그대로 보여요.'
      - ci:
          key: view-copy
          label: 실제 결과 보기
          source: ImmutableObjectTest.viewVersusCopy
          code: viewRun
      - p: '그래서 **받을 때는 `List.copyOf`**를 써요. `unmodifiableList`는 필드를 `new ArrayList<>(...)`로 복사해 가지고 있을 때, 내줄 때 감싸는 용도로 써요. 처음부터 고칠 수 없는 리스트가 필요하면 `List.of("A", "B")`로 만들어요.'
      - more:
          summary: '더 알아보기: 얕은 복사와 깊은 복사'
          body:
            - p: '`List.copyOf`는 **리스트만** 새로 만들어요. 안의 원소는 원래 리스트와 같은 객체를 가리켜요(얕은 복사). 원소가 `String`처럼 불변이면 문제없어요. 원소가 가변 객체라면 원소의 필드는 여전히 바깥에서 바뀌어요. 원소까지 새로 만드는 깊은 복사를 하거나, 원소 자체를 불변으로 만들어요. 보통 원소를 불변으로 만드는 쪽이 쉬워요.'
      - quiz:
          q: '`src = new ArrayList<>(List.of("A"))`로 `view = Collections.unmodifiableList(src)`와 `copy = List.copyOf(src)`를 만든 뒤 `src.add("B")`를 했어요. `view.size()`와 `copy.size()`는?'
          options:
            - 1과 1
            - 2와 1
            - 2와 2
          answer: 2
          explain: '`view`는 원본을 비추는 창이라 원본에 더한 것이 보여요. `copy`는 만들 때 복사한 다른 리스트라 그대로예요.'
      - next: '복사하는 생성자, 고칠 수 없는 getter, `final` 필드, `equals`까지 매번 쓰려니 길어요. record는 이 가운데 무엇을 대신 해 줄까요?'
    recall: '받을 때 `List.copyOf`로 복사해서 가지고, 내줄 때도 바깥에서 고칠 수 없는 것으로 내줘요. 이것이 방어적 복사예요. `List.copyOf`의 결과는 고칠 수 없는 리스트라 그대로 내줘도 돼요. `Collections.unmodifiableList`는 원본을 비추는 창이라 받을 때 쓰면 원본의 변경이 그대로 보여요. 복사는 얕아서 원소가 가변이면 원소는 여전히 함께 써요.'
  - id: q4
    title: record는 무엇을 대신 만들어 주고, 무엇은 해 주지 않나요?
    conclusion:
      lead: 'record는 `private final` 필드, 생성자, 접근자, `equals`와 `hashCode`와 `toString`을 선언 한 줄로 만들어 줘요.'
      sub: '필드에 다시 대입하는 것만 막아 주므로, 구성 요소가 리스트 같은 가변 객체면 복사는 직접 해야 해요.'
    says:
      - '`record Money(long amount, String currency) {}` 한 줄이 만드는 것: `private final` 필드 둘, 둘을 받는 생성자, `amount()`와 `currency()` 접근자(이름에 get이 붙지 않는다), 모든 구성 요소를 비교하는 `equals`와 그것에 맞는 `hashCode`, `toString`'
      - 'setter는 없고 필드는 `final`이다. 값을 바꾸려면 새 record를 만든다'
      - '`new Money(1000, "KRW").equals(new Money(1000, "KRW"))`는 true다. J6에서 직접 쓰던 `equals`와 `hashCode`를 구성 요소 전체로 만들어 준다'
      - 'record도 질문 2의 한계를 그대로 가진다. `record OrderResponse(long id, List<String> items)`의 `items`는 넘겨받은 리스트를 그대로 가리킨다. 바깥에서 그 리스트를 고치면 record가 바뀐다'
      - '코드 record. 간결한 생성자(괄호 없는 생성자)에서 `items = List.copyOf(items)`로 복사한다. 여기에 검증도 둔다(`if (amount < 0) throw ...`). 본문이 끝나면 필드에 대입된다'
      - '더 알아보기: record는 다른 클래스를 상속할 수 없고 상속받을 수도 없다. 구성 요소 말고 인스턴스 필드를 더할 수 없다. 인터페이스 구현과 메서드 추가는 된다'
    asks:
      - '본문의 예시: `record Money(long amount, String currency) {}`로 `new Money(1000, "KRW") == new Money(1000, "KRW")`와 `new Money(1000, "KRW").equals(new Money(1000, "KRW"))`를 실행한 결과는 무엇인가 (false와 true)'
      - '옮긴 상황: `record Point(int x, int y) {}`의 객체 `p`에 대해 `p.x = 5;`와 `p.getX()`와 `p.x()` 가운데 컴파일되는 것은 무엇인가 (`p.x()`만 된다. 필드는 final이고 접근자 이름에는 get이 없다)'
    body:
      - p: '`record`는 자바 16부터 쓰는, 값을 담는 클래스를 짧게 선언하는 방법이에요. `record Money(long amount, String currency) {}` 한 줄이 이것들을 만들어요.'
      - ul:
          - '`private final` 필드 둘 (`amount`, `currency`)'
          - '둘을 받는 생성자'
          - '접근자 `amount()`, `currency()`. 이름에 `get`이 붙지 않아요'
          - '모든 구성 요소를 비교하는 `equals`, 그것에 맞는 `hashCode`, 읽기 좋은 `toString`'
      - p: 'setter는 없어요. 값을 바꾸려면 질문 1의 `plus`처럼 새 record를 만들어요.'
      - ci:
          key: record
          label: 실제 출력 보기
          source: ImmutableObjectTest.recordEquality
          code: recordRun
      - p: '`==`는 객체가 둘이라 false지만 `equals`는 구성 요소가 같아서 true예요. equals와 hashCode 레슨에서 손으로 쓰던 두 메서드를 record가 구성 요소 전체로 만들어 줘요.'
      - h3: record가 해 주지 않는 것
      - p: 'record의 필드도 그냥 `final`이에요. 질문 2의 한계가 그대로 있어요. 구성 요소가 리스트면 넘겨받은 리스트를 **그대로** 가리켜요. 그래서 **간결한 생성자**에서 직접 복사해요.'
      - code: record
        notes:
          - mark: List.copyOf(items)
            as: code
            text: '괄호 없는 생성자(간결한 생성자)에서 매개변수 `items`를 복사본으로 바꿔요. 본문이 끝나면 이 값이 필드에 들어가요. 금액이 음수인지 같은 검증도 여기에 둬요.'
      - more:
          summary: '더 알아보기: record의 제약'
          body:
            - p: 'record는 다른 클래스를 상속할 수 없고, 다른 클래스가 record를 상속할 수도 없어요. 구성 요소 말고 인스턴스 필드를 더할 수 없어요. 인터페이스를 구현하거나 메서드를 더하는 것은 돼요. `p.x = 5`나 `p.getX()`는 컴파일되지 않고 `p.x()`만 돼요. 테스트로 확인했어요.'
      - quiz:
          q: '`record Point(int x, int y) {}`의 객체 `p`에 대해 컴파일되는 것은?'
          options:
            - '`p.x = 5;`'
            - '`p.getX()`'
            - '`p.x()`'
          answer: 3
          explain: '필드는 `final`이라 대입할 수 없고, 접근자 이름은 구성 요소 이름 그대로 `x()`예요.'
    recall: 'record는 `private final` 필드, 생성자, 구성 요소 이름의 접근자, 구성 요소 전체를 비교하는 `equals`와 `hashCode`, `toString`을 선언 한 줄로 만들어 줘요. setter는 없어요. 하지만 필드에 다시 대입하는 것만 막으므로, 구성 요소가 리스트 같은 가변 객체면 간결한 생성자에서 `List.copyOf`로 직접 복사해야 해요.'
practice:
  title: 스프링에서는 이렇게 써요
  says:
    - '요청과 응답 DTO를 record로 쓴다. `record OrderRequest(Long productId, Integer quantity) {}`를 `@RequestBody`로 받고 `record OrderResponse(Long id, String status, List<String> items)`를 돌려준다. Jackson이 record의 생성자로 만들고 접근자로 읽는다 (Jackson `ObjectMapper`로 JSON을 record로 읽고 다시 쓰는 테스트)'
    - '흔한 실수: record 응답에 엔티티의 컬렉션을 그대로 넘긴다. `new OrderResponse(order.getId(), ..., order.getItemNames())`. 응답과 엔티티가 같은 리스트를 가리킨다. 응답을 캐시에 두거나 다른 곳에서 가공하면 엔티티까지 바뀐다. 고친 코드: 코드 record의 간결한 생성자로 `List.copyOf`. 고치기 전과 뒤에 `response.items().add(...)`를 돌려 결과를 붙인다 (순수 자바 테스트)'
    - '설정 값을 record로 받는다. `@ConfigurationProperties("pay") record PayProperties(String url, Duration timeout) {}`. 스프링 부트 3은 record의 생성자로 값을 넣어 준다. 실행 중에 누가 설정 값을 바꿀 수 없다 (스프링 부트의 `ApplicationContextRunner`로 속성을 주고 바인딩된 값을 읽는 테스트. 생성자 바인딩의 규칙은 공식 문서 근거)'
    - 'JPA 엔티티는 record로 만들 수 없다. 엔티티는 인자 없는 생성자가 있어야 하고 `final` 클래스가 아니어야 한다. 엔티티는 가변으로 두되 setter를 열어 두지 않고 `order.cancel()`처럼 의미 있는 메서드로만 바꾸고, 컬렉션 getter는 고칠 수 없는 것으로 내준다. 금액이나 주소 같은 값은 불변 객체로 만들어 엔티티에 넣을 수 있고 그것은 P10에서 다룬다 (자카르타 퍼시스턴스 명세 근거)'
    - 'J2의 실무 구역에서 본 "싱글톤 빈이 리스트를 그대로 돌려주는 실수"가 `List.copyOf`로 막히는 이유가 질문 3이라는 한 줄'
  body:
    - p: '스프링 코드에서 불변으로 두기 좋은 것은 요청과 응답 DTO, 설정 값이에요. 반대로 엔티티는 가변이 본질이에요. DTO는 Jackson으로, 설정 값은 스프링 부트의 설정 바인딩으로 확인했고, 엔티티의 조건은 명세가 근거예요.'
    - h3: 요청과 응답 DTO는 record로
    - code: dto
    - ci:
        key: jackson
        label: Jackson이 record를 읽고 쓴 실제 결과 보기
        source: ImmutableObjectTest.jacksonRecord
        code: jacksonRun
    - p: 'Jackson은 record의 생성자로 객체를 만들고 접근자로 값을 읽어요. setter가 없어도 돼요. 컨트롤러가 받은 요청 객체를 서비스가 몰래 고칠 일도 없어요.'
    - h3: '흔한 실수: 엔티티의 컬렉션을 응답에 그대로'
    - code: responseBad
      notes:
        - mark: order.getItemNames()
          as: code
          text: '엔티티가 가진 리스트를 그대로 넘겨요. 응답과 엔티티가 같은 리스트를 가리켜요.'
    - ci:
        key: record-list
        label: 고치기 전과 뒤의 실제 결과 보기
        source: ImmutableObjectTest.recordWithList
        code: responseRun
    - p: '간결한 생성자가 없으면 응답을 가공한 것이 엔티티의 리스트까지 바꿔요. 응답을 캐시에 넣어 두고 여러 요청이 함께 쓰면 도입부의 사고가 돼요. 질문 4의 간결한 생성자에서 `List.copyOf`로 받으면 응답은 고칠 수 없는 별도 리스트를 가져요. 값과 참조 레슨의 "싱글톤 빈이 리스트를 그대로 돌려주는 실수"가 `List.copyOf`로 막히는 이유도 질문 3이에요.'
    - h3: 설정 값도 record로
    - code: properties
      notes:
        - mark: '@ConfigurationProperties("pay")'
          as: anno
          text: '`pay.`로 시작하는 설정을 이 record의 구성 요소에 넣어요. 스프링 부트 3은 record의 생성자로 넣어 줘요.'
    - code: yml
    - ci:
        key: config
        label: 바인딩된 실제 값 보기
        source: ImmutableObjectTest.configurationPropertiesRecord
    - p: '설정 값이 불변이라 실행 중에 어떤 빈도 결제 서버 주소를 바꿀 수 없어요. `3s` 같은 글자가 `Duration`으로 바뀌는 것도 스프링 부트가 해 줘요. 설정을 어디서 어떤 순서로 읽는지는 설정과 프로파일 레슨에서 다뤄요.'
    - muted: '근거: [스프링 부트 문서의 생성자 바인딩](link:bootProps).'
    - h3: 엔티티는 record로 만들 수 없어요
    - p: 'JPA 엔티티는 인자 없는 생성자가 있어야 하고 `final` 클래스가 아니어야 해요. JPA가 객체를 먼저 만들고 필드를 채우며, 지연 로딩을 위해 자식 클래스(프록시)를 만들기 때문이에요. record는 둘 다 안 돼요. 그래서 엔티티는 가변으로 두되 **아무나 고치지 못하게** 만들어요.'
    - code: entity
      notes:
        - mark: cancel()
          as: code
          text: 'setter 대신 "주문을 취소한다"처럼 뜻이 있는 메서드로만 상태를 바꿔요. 규칙(취소할 수 있는 상태인지)도 여기서 확인해요.'
        - mark: Collections.unmodifiableList
          as: code
          text: '컬렉션은 고칠 수 없는 창으로 내줘요. 질문 3의 나가는 길이에요.'
    - muted: '금액이나 주소처럼 작은 값을 불변 객체로 만들어 엔티티 안에 넣는 방법(`@Embeddable`)은 상속 매핑과 값 타입 레슨에서 다뤄요. 근거: [자카르타 퍼시스턴스 명세의 엔티티 클래스](link:jpaEntity).'
interview:
  question: 불변 객체를 어떻게 만들고 왜 쓰나요?
  model:
    - label: 정의
      text: 불변 객체는 만든 뒤 상태가 바뀌지 않는 객체이고, 바꾸려면 새 객체를 만듭니다. String, 래퍼, LocalDate, BigDecimal이 그렇습니다.
    - label: 원리
      text: 필드를 private final로 두고, setter를 없애고, 클래스를 final로 둡니다. final은 재대입만 막으므로 필드가 리스트 같은 가변 객체를 가리키면 생성자에서 List.copyOf로 복사해 받고 고칠 수 없는 것으로 내줍니다. record는 private final 필드, 생성자, 접근자, equals와 hashCode를 만들어 주지만 가변 구성 요소의 복사는 간결한 생성자에서 직접 해야 합니다.
    - label: 주의할 점
      text: 불변이면 넘겨도, 캐시나 맵의 키로 써도, 여러 스레드가 읽어도 안전하지만 바꿀 때마다 객체가 생깁니다. Collections.unmodifiableList는 원본을 비추는 뷰라 받을 때 쓰면 원본의 변경이 보입니다. JPA 엔티티는 record로 만들 수 없어 가변으로 두되 의미 있는 메서드로만 바꿉니다.
    - label: 경험
      text: '(내 프로젝트로 채우기) 예: 응답 DTO에 엔티티의 리스트를 그대로 넘겼다가 응답을 가공하면서 엔티티가 바뀌는 버그를 겪고, record의 간결한 생성자에서 List.copyOf로 복사하게 고쳤습니다.'
verified: 이 레슨의 출력은 짐작이 아니라 자바 21에서 코드를 돌려 받은 값이에요. DTO는 Jackson으로, 설정 값은 스프링 부트 3.5의 설정 바인딩으로 확인했어요. 코드가 바뀔 때마다 테스트([ImmutableObjectTest](link:test))가 다시 돌아요.
footer: '근거: final 변수는 자바 언어 명세 4.12.4([링크](link:jlsFinal)), record는 8.10([링크](link:jlsRecord)), 고칠 수 없는 리스트는 List API 문서([링크](link:listApi)), 설정의 생성자 바인딩은 스프링 부트 문서, 엔티티 클래스의 조건은 자카르타 퍼시스턴스 명세. 결과는 OpenJDK 21에서 테스트로 확인했어요. 오류는 [GitHub 이슈](https://github.com/wanja727/dev-lessons/issues)로 알려 주세요.'
claims:
  - claim: '코드 predict의 출력은 2이고, 생성자에서 `List.copyOf`로 받으면 1이다'
    how: '두 클래스를 돌린다'
    test: ImmutableObjectTest.predict
  - claim: '`List.copyOf`가 만든 리스트에 `add`를 부르면 `UnsupportedOperationException`이 난다'
    how: '그대로 돌려 예외의 타입을 본다'
    test: ImmutableObjectTest.copyOfIsUnmodifiable
  - claim: '`Collections.unmodifiableList`로 감싼 리스트는 원본에 더한 원소가 보이고, `List.copyOf`로 만든 리스트는 보이지 않는다'
    how: '원본에 원소를 더한 뒤 두 리스트의 크기를 본다'
    test: ImmutableObjectTest.viewVersusCopy
  - claim: '세 방법에 같은 두 동작을 하면 주문 안의 리스트는 [키보드, 마우스, 모니터], [키보드, 마우스], [키보드]가 된다'
    how: '세 클래스로 돌린다. 위젯의 값과 맞춘다'
    test: ImmutableObjectTest.threeWays
  - claim: '`final` 배열과 `final` 리스트는 내용을 바꿀 수 있고, 다시 대입하면 컴파일되지 않는다'
    how: '칸을 바꾸고 원소를 더한 뒤 읽는다. 재대입은 `JavaSource`로 컴파일한다'
    test: ImmutableObjectTest.finalIsNotImmutable
  - claim: '`LocalDate.plusDays`의 결과를 받지 않으면 원래 날짜는 그대로다'
    how: '그대로 돌린다'
    test: ImmutableObjectTest.localDateIsImmutable
  - claim: 'record는 구성 요소가 같으면 `equals`가 true이고 `hashCode`가 같다. `==`는 false다'
    how: '`Money` record 둘로 확인한다'
    test: ImmutableObjectTest.recordEquality
  - claim: 'record의 필드에 대입하는 코드와 `getX()`는 컴파일되지 않고 `x()`는 된다'
    how: '`JavaSource`로 세 소스를 컴파일한다'
    test: ImmutableObjectTest.recordAccessors
  - claim: '간결한 생성자가 없는 record의 리스트 구성 요소는 넘겨받은 리스트와 같은 객체이고, 간결한 생성자에서 `List.copyOf`를 하면 다른 객체다'
    how: 'record의 리스트를 고친 뒤 넘긴 리스트를 읽는다'
    test: ImmutableObjectTest.recordWithList
  - claim: 'Jackson은 record를 JSON에서 만들고 JSON으로 쓴다 (스프링 부트 3.5의 Jackson)'
    how: '`ObjectMapper`로 읽고 쓴다'
    test: ImmutableObjectTest.jacksonRecord
  - claim: '`@ConfigurationProperties`가 붙은 record에 속성 값이 생성자로 들어온다 (스프링 부트 3.5)'
    how: '`ApplicationContextRunner`에 `pay.url`과 `pay.timeout`을 주고 빈의 값을 읽는다'
    test: ImmutableObjectTest.configurationPropertiesRecord
sources:
  - '`final` 변수: 자바 언어 명세 4.12.4 https://docs.oracle.com/javase/specs/jls/se21/html/jls-4.html#jls-4.12.4'
  - 'record: 자바 언어 명세 8.10 https://docs.oracle.com/javase/specs/jls/se21/html/jls-8.html#jls-8.10'
  - '`List.copyOf`와 고칠 수 없는 리스트: `List` API 문서 https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/List.html#unmodifiable'
  - '`Collections.unmodifiableList`는 뷰다: API 문서 https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/Collections.html#unmodifiableList(java.util.List)'
  - '`@ConfigurationProperties`의 생성자 바인딩: 스프링 부트 문서 https://docs.spring.io/spring-boot/reference/features/external-config.html#features.external-config.typesafe-configuration-properties.constructor-binding'
  - '엔티티 클래스의 조건(인자 없는 생성자, final이 아닐 것): 자카르타 퍼시스턴스 명세 2.1 https://jakarta.ee/specifications/persistence/3.1/jakarta-persistence-spec-3.1.html#a18'
