# 선착순 이벤트 설계
# 자료 파일의 칸은 docs/lesson-data-format.md에 있다. 문제는 content/questions/first-come-event.yaml에 있다.
# 심화 레슨. 설계 칸과 본문을 한 번에 썼다 (이번 작업의 설계 승인은 사용자가 미리 맡겼다)
title: 선착순 이벤트 설계
description: 오픈 순간 몰리는 요청을 DB 앞에서 받는 방법, 수량과 중복 참여를 Redis 한 번의 실행으로 판정하는 이유, 당첨자를 대기열로 넘겨 DB에 천천히 저장하는 구조, 앞에서 막아 둘 것들. 쿠폰 100장에 요청 600건을 보내 보는 대화형 레슨.
unit: 시스템 설계와 아키텍처
minutes: 20
roadmap: A14
type: 설계
prerequisites:
  - {slug: stock-concurrency, title: 동시 요청에서 재고 지키기}
  - {slug: kafka-basics, title: 메시지 큐}
  - {slug: rate-limit, title: 요청 수 제한}
assume: 'Redis 7. 재고를 조건부 UPDATE, 락, Redis Lua로 지키는 법(동시 요청에서 재고 지키기 레슨). 큐로 일을 떼어 놓는 법(메시지 큐 레슨). 요청 수 제한과 429(요청 수 제한 레슨).'
example: '0시 정각에 여는 선착순 쿠폰 100장. 사용자 500명이 몰리고 그 가운데 100명은 버튼을 두 번 누른다. Redis에서 당첨을 판정하고, 당첨자는 대기열에 넣어 워커가 DB에 쿠폰을 저장한다.'
intro:
  - '0시 정각 선착순 쿠폰을 열자마자 DB 커넥션이 바닥나 이벤트 페이지와 상관없는 주문까지 멈췄어요. 겨우 살아나니 쿠폰은 120장이 나갔고, 한 사람이 두 장을 받은 경우도 있었어요.'
  - '선착순 이벤트는 평소의 수십 배 요청이 몇 초 안에 한 지점에 몰려요. 그동안 배운 것들, 재고 지키기와 Redis와 메시지 큐와 요청 수 제한을 한꺼번에 써야 하는 문제라 시스템 설계 면접의 단골이에요.'
  - '이 레슨에서는 쿠폰 100장에 요청 600건을 보내, 참여 확인과 수량 차감을 따로 하면 두 번 누른 사용자가 두 번 당첨되는 것과, Redis Lua 한 번으로 판정하면 정확히 100명이 한 번씩 당첨되는 것을 확인하고, 당첨자를 대기열로 넘겨 저장하는 구조를 봐요.'
covers:
  - topic: '선착순 이벤트는 몇 초에 요청이 몰려, DB에서 바로 판정하면 커넥션과 락이 바닥나 다른 기능까지 멈춘다'
    where: '질문 1'
  - topic: '판정을 메모리 저장소(Redis)에서 하고, DB는 당첨자만 받게 한다'
    where: '질문 1'
  - topic: '수량과 중복 참여를 함께 판정해야 한다. 확인과 기록을 따로 하면 두 번 누른 사용자가 두 번 당첨된다'
    where: '질문 2'
  - topic: 'Lua 하나로 참여 확인, 수량 차감, 참여 기록, 대기열 넣기를 한 번에 실행한다'
    where: '질문 2. Lua의 원자성은 Redis(A5)'
  - topic: '당첨자를 대기열(Redis List나 메시지 큐)에 넣고 워커가 정해진 속도로 꺼내 DB에 저장한다. 응답은 당첨 여부만 빨리 준다'
    where: '질문 3. 큐는 메시지 큐(A8)'
  - topic: 'DB에도 (회원, 이벤트) 유니크 제약을 마지막 방어선으로 둔다'
    where: '질문 3'
  - topic: '앞에서 막아 둘 것: 사용자별 요청 수 제한, 오픈 전 요청 거절, 품절 뒤에는 Redis까지 가지 않게'
    where: '질문 4. 요청 수 제한은 A13'
  - topic: '대기열 페이지(대기 번호를 주고 순서대로 들여보내기)'
    where: '질문 4의 더 알아보기'
  - topic: 'Redis가 죽으면 판정이 멈춘다. 이벤트 전에 수량과 참여 기록을 어디서 되살릴지 정해 둔다'
    where: '실무에서는'
codes:
  predict: |-
    if (redis.sismember(users, uid)) {
      return ALREADY;
    }
    long left = redis.decr(stockKey);
    if (left < 0) return SOLD_OUT;
    redis.sadd(users, uid);
    redis.rpush(queue, uid);
    // 같은 사용자가 두 번 눌러
    // 두 요청이 동시에 오면?
  enter: |-
    if redis.call('SISMEMBER', KEYS[2],
        ARGV[1]) == 1 then return -2 end
    local left = tonumber(
        redis.call('GET', KEYS[1]))
    if left <= 0 then return -1 end
    redis.call('SADD', KEYS[2], ARGV[1])
    redis.call('RPUSH', KEYS[3], ARGV[1])
    return redis.call('DECR', KEYS[1])
  worker: |-
    @Scheduled(fixedDelay = 200)
    public void issue() {
      List<String> batch =
          redis.lpop(queue, 20);
      if (batch == null) return;
      couponRepository.saveAll(
          toCoupons(batch));
    }
  unique: |-
    create table coupon_issue (
      event_id bigint not null,
      member_id bigint not null,
      issued_at timestamptz not null,
      [[unique (event_id, member_id)]]
    );
  soldOutFlag: |-
    if (soldOutFlag.get()) {
      return SOLD_OUT; // Redis까지 안 감
    }
    long r = enter(uid);
    if (r == -1) soldOutFlag.set(true);
  dbDirect: |-
    @Transactional
    public void enter(long eventId,
        long memberId) {
      Event e = events.findForUpdate(eventId);
      if (e.getLeft() <= 0) throw ...;
      e.decrease();
      issues.save(new Issue(e, memberId));
    }
links:
  test: https://github.com/wanja727/dev-lessons/blob/main/verification/src/test/java/lab/devlessons/firstcome/FirstComeEventTest.java
  redisEval: https://redis.io/docs/latest/develop/interact/programmability/eval-intro/
  redisList: https://redis.io/docs/latest/develop/data-types/lists/
predict:
  title: 두 번 누르면?
  text: '코드 predict는 참여했는지 확인하고, 수량을 줄이고, 참여를 기록해요. 같은 사용자가 버튼을 두 번 눌러 두 요청이 동시에 확인을 지났어요. 이 사용자는 몇 번 당첨될까요? 답은 질문 2에 나와요.'
  code: predict
  label: 내 예측
  options:
    - value: '1'
      label: 1번
    - value: '2'
      label: 2번
    - value: '0'
      label: 0번
  answer: '2'
  storageKey: firstcome-predict
  wrong: 예측은 "{label}"이었어요. 틀린 예측이 더 오래 남으니 괜찮아요.
questions:
  - id: q1
    title: 몰리는 요청을 왜 DB에서 바로 판정하지 않나요?
    conclusion:
      lead: '몇 초 사이에 평소의 수십 배가 한 행에 몰려, DB에서 락을 잡고 판정하면 커넥션이 바닥나 다른 기능까지 멈추기 때문이에요.'
      sub: '그래서 당첨 판정은 메모리에서 빠르게 하는 Redis에서 하고, DB는 당첨된 사람만, 정해진 속도로 받게 해요.'
    says:
      - 'DB 직접: 한 행의 락과 커넥션'
      - 'Redis 판정 + DB는 당첨자만'
    asks:
      - '본문의 예시: 쿠폰 100장 이벤트에 요청 600건이 왔다. DB에 저장해야 하는 것은 (당첨된 100건)'
      - '옮긴 상황: 이벤트를 DB의 SELECT FOR UPDATE로 판정했다. 오픈 순간 요청 1만 건이 같은 행을 기다리면 (커넥션이 락 대기로 묶여 다른 기능도 느려지거나 멈춘다)'
    body:
      - p: '평소의 재고 차감은 [동시 요청에서 재고 지키기](lesson:stock-concurrency)의 조건부 UPDATE나 락으로 충분했어요. 선착순 이벤트는 달라요. 몇 초 사이에 평소의 수십 배 요청이 **한 행**(이벤트의 남은 수량)에 몰려요.'
      - code: dbDirect
      - p: '이 코드로 1만 건을 받으면 모두 같은 행의 락 앞에 줄을 서고, 줄을 서는 동안 DB 커넥션을 쥐어요. 커넥션 풀이 바닥나면 이벤트와 상관없는 주문과 조회까지 커넥션을 못 얻어 멈춰요([스레드 풀과 커넥션 풀 크기](lesson:pool-sizing)).'
      - p: '그래서 판정을 DB 앞으로 옮겨요. **당첨 판정은 Redis**에서 메모리로 빠르게 하고, **DB에는 당첨된 사람만** 정해진 속도로 넣어요. 600건이 와도 DB가 받는 것은 100건이고, 그것도 한꺼번이 아니에요(질문 3).'
      - quiz:
          q: '쿠폰 100장 이벤트에 요청 600건이 왔고 판정은 Redis에서 해요. DB에 저장해야 하는 것은 몇 건인가요?'
          options:
            - '600건'
            - '100건. 당첨자만'
            - '500건'
          answer: 2
          explain: '떨어진 요청은 Redis에서 끝나요. DB는 당첨된 100건만 받아요.'
      - next: 'Redis에서 판정할 때 지킬 것은 수량만이 아니에요. 한 사람이 두 번 누르면요?'
    recall: '선착순 이벤트는 몇 초 사이에 평소의 수십 배 요청이 이벤트의 남은 수량이라는 한 행에 몰려요. DB에서 락을 잡고 판정하면 모두 그 행의 락을 기다리며 커넥션을 쥐어, 풀이 바닥나고 다른 기능까지 멈춰요. 그래서 당첨 판정은 메모리에서 빠르게 하는 Redis로 옮기고, DB에는 당첨된 사람만 정해진 속도로 넣어요.'
  - id: q2
    title: 수량과 중복 참여는 어떻게 함께 판정하나요?
    conclusion:
      lead: '참여 확인, 수량 차감, 참여 기록, 대기열 넣기를 Lua 스크립트 하나로 한 번에 실행해요.'
      sub: '따로 하면 같은 사용자의 두 요청이 동시에 "아직 참여 안 함"을 보고 둘 다 당첨돼요. 수량만 지켜서는 한 사람에게 두 장이 가요.'
    says:
      - '따로: user:7 대기열에 2번. Lua: 1번. 예측의 답'
      - '600건 rush: Lua로 당첨 100, 서로 다른 100명, 남은 수량 0'
    widget:
      kind: toggle
      note: '확인과 기록을 따로, Lua 하나로를 고르면 같은 사용자의 두 요청이 Redis에서 어떤 순서로 실행되는지 로그로 보인다'
    asks:
      - '본문의 예시: 확인과 기록을 따로 하는 코드에서 user:7의 두 요청이 동시에 확인을 지났다. 대기열의 user:7은 (2번)'
      - '옮긴 상황: 수량 차감만 Lua로 하고 참여 확인은 그 전에 SISMEMBER로 따로 한다. 두 번 누른 사용자는 (두 번 당첨될 수 있다. 확인과 기록 사이에 틈이 있다)'
    body:
      - p: '처음 예측의 코드는 수량은 `DECR` 한 번으로 줄여요. 그런데 "이미 참여했나"를 확인하는 것과 "참여했다"고 기록하는 것이 **따로**예요. 같은 사용자의 두 요청이 동시에 와서 둘 다 확인을 지나게 맞춰 봤어요.'
      - ci:
          key: double-click
          label: 실제 결과 보기
          source: FirstComeEventTest.doubleClick
          code: predict
      - p: '답은 **2번**이에요. {{predict-result}} 따로 하는 코드는 두 요청 모두 "참여 안 함"을 보고 둘 다 수량을 줄여 대기열에 두 번 들어갔어요. [멱등성과 중복 요청 방지](lesson:idempotency)의 "먼저 조회하고 저장"과 같은 틈이에요.'
      - p: '그래서 네 가지를 **Lua 하나로** 묶어요. Redis는 스크립트를 명령 하나처럼 실행해서 사이에 끼어들 틈이 없어요([Redis 문서](link:redisEval)).'
      - code: enter
      - p: '같은 두 요청을 Lua로 보내면 하나는 당첨, 하나는 "이미 참여"(-2)였어요. 쿠폰 100장에 사용자 500명, 그 가운데 100명이 두 번 눌러 600건을 보내 봤어요.'
      - ci:
          key: rush
          label: 실제 결과 보기
          source: FirstComeEventTest.atomicEntry
      - p: '정확히 100명이 한 번씩 당첨됐고 남은 수량은 0에서 멈췄어요. 두 번 누른 요청은 중복으로, 늦은 요청은 품절로 거절됐어요.'
      - widget:
          kind: toggle
          layout: [selector, log, verdict]
          selector:
            label: 판정 방식
            options:
              - {value: separate, label: 확인과 기록을 따로}
              - {value: lua, label: Lua 하나로}
          scenes:
            separate:
              log:
                - '요청 1: SISMEMBER user:7 → 없음'
                - '요청 2: SISMEMBER user:7 → 없음'
                - '요청 1: DECR → 99, SADD, RPUSH'
                - '요청 2: DECR → 98, SADD, RPUSH'
              verdict: 'user:7이 두 장을 받았어요. 확인과 기록 사이에 틈이 있었어요.'
            lua:
              log:
                - '요청 1: 스크립트 (확인 → 없음, DECR 99, SADD, RPUSH)'
                - '요청 2: 스크립트 (확인 → 있음) → -2'
              verdict: '스크립트가 하나씩 통째로 실행돼 두 번째 요청은 이미 참여로 거절돼요.'
      - quiz:
          q: '수량 차감은 Lua로 하지만, 그 전에 `SISMEMBER`로 참여 여부를 따로 확인해요. 두 번 누른 사용자는 어떻게 될 수 있나요?'
          options:
            - '한 번만 당첨된다'
            - '두 번 당첨될 수 있다. 확인과 기록 사이에 틈이 있다'
            - '두 요청 모두 거절된다'
          answer: 2
          explain: '확인이 스크립트 밖에 있으면 두 요청이 동시에 확인을 지날 수 있어요. 확인, 차감, 기록을 한 스크립트에 넣어요.'
      - next: '당첨 판정은 끝났어요. 당첨자의 쿠폰은 언제, 어떻게 DB에 저장할까요?'
    recall: '참여 확인(SISMEMBER), 수량 차감, 참여 기록(SADD), 대기열 넣기를 Lua 스크립트 하나로 한 번에 실행해요. 따로 하면 같은 사용자의 두 요청이 동시에 "아직 참여 안 함"을 보고 둘 다 수량을 줄여 두 번 당첨돼요. Lua로 묶으니 요청 600건에도 정확히 100명이 한 번씩 당첨되고 수량은 0에서 멈췄어요.'
  - id: q3
    title: 당첨자는 어떻게 DB에 저장하나요?
    conclusion:
      lead: '당첨자를 대기열에 넣고 바로 "당첨"이라 응답한 뒤, 워커가 대기열에서 정해진 수만큼 꺼내 DB에 저장해요.'
      sub: 'DB는 몰린 순간과 상관없이 자기 속도로 받아요. DB에는 (이벤트, 회원) 유니크 제약을 마지막 방어선으로 둬요.'
    says:
      - '대기열 100건을 20건씩 5번'
      - '응답은 당첨 여부만, 발급은 조금 뒤'
      - '유니크 제약'
    asks:
      - '본문의 예시: 대기열의 당첨자 100명을 워커가 20명씩 꺼내 저장하면 몇 번 꺼내나 (5번)'
      - '옮긴 상황: 워커가 저장 중에 Redis가 같은 사용자를 두 번 대기열에 넣는 버그가 생겼다. 두 번째 저장을 막는 것은 (DB의 (이벤트, 회원) 유니크 제약)'
    body:
      - p: '판정 스크립트는 당첨자를 대기열(Redis List)에도 넣었어요. 사용자에게는 바로 "당첨"이라고 응답하고, 쿠폰을 DB에 만드는 일은 **워커**가 대기열에서 꺼내 해요.'
      - code: worker
      - ci:
          key: queue
          label: 실제 결과 보기
          source: FirstComeEventTest.queueDrainsInOrder
      - p: '워커는 0.2초마다 20건씩 꺼내 저장해요. 몇 초 사이에 몰린 요청과 상관없이 **DB는 자기 속도로** 받아요. 대기열은 넣은 순서대로 나와 당첨 순서도 지켜져요([Redis List](link:redisList)). 이 구조는 [메시지 큐](lesson:kafka-basics)의 "몰리는 요청을 큐에 쌓아 두고 천천히"와 같아요. 규모가 크면 Redis List 대신 카프카 같은 메시지 큐를 써요.'
      - p: '쿠폰이 사용자 화면에 보이기까지는 조금 걸려요. 응답에서 "당첨, 쿠폰함에 곧 들어가요"처럼 알려 줘요.'
      - p: '그리고 **DB에도 마지막 방어선**을 둬요. 버그나 재시도로 같은 사용자가 두 번 저장되려 해도 유니크 제약이 막아요([분산 락](lesson:distributed-lock)에서 본 "정확성은 DB가").'
      - code: unique
      - quiz:
          q: '대기열의 당첨자 100명을 워커가 0.2초마다 20명씩 꺼내 DB에 저장해요. 모두 저장하는 데 몇 번 꺼내나요?'
          options:
            - '1번'
            - '5번'
            - '100번'
          answer: 2
          explain: '100명을 20명씩이니 5번이에요. 테스트에서도 5번에 100건이 저장됐어요.'
      - next: 'Redis까지 오는 요청 자체를 줄일 수도 있어요. 앞에서 무엇을 막아 둘까요?'
    recall: '판정 스크립트가 당첨자를 대기열에 넣으면 사용자에게는 바로 당첨이라 응답하고, 워커가 대기열에서 정해진 수만큼 꺼내 DB에 쿠폰을 저장해요. DB는 몰린 순간과 상관없이 자기 속도로 받고, 대기열은 당첨 순서를 지켜요. 규모가 크면 메시지 큐를 쓰고, DB에는 (이벤트, 회원) 유니크 제약을 마지막 방어선으로 둬요.'
  - id: q4
    title: Redis까지 오기 전에 무엇을 막아 두나요?
    conclusion:
      lead: '사용자마다 요청 수를 제한하고, 오픈 전 요청은 거절하고, 품절이 확인되면 서버 메모리의 표시로 Redis까지 가지 않게 해요.'
      sub: '판정에 쓰는 Redis도 한 대라 몰리면 느려져요. 앞에서 걸러 낼수록 판정이 빨라요.'
    says:
      - '요청 수 제한(A13), 오픈 전 거절, 품절 표시'
      - '더 알아보기: 대기열 페이지'
    asks:
      - '본문의 예시: 품절이 확인된 뒤에도 요청마다 Redis에 스크립트를 보낸다. 줄이는 방법은 (서버 메모리에 품절 표시를 두고 Redis까지 보내지 않는다)'
      - '옮긴 상황: 매크로로 한 사용자가 1초에 수백 번 누른다. 막는 장치는 (사용자별 요청 수 제한)'
    body:
      - p: '판정을 Redis로 옮겨도 Redis 한 대가 모든 요청을 받아요. 앞에서 걸러 낼수록 판정이 빨라요.'
      - ul:
          - '**사용자별 요청 수 제한:** 매크로로 1초에 수백 번 누르는 사용자를 [요청 수 제한](lesson:rate-limit)으로 막아요. 정상 사용자의 두세 번은 통과하고 Lua가 중복으로 걸러요.'
          - '**오픈 전 거절:** 0시 전 요청은 서버에서 바로 거절해요. Redis까지 갈 필요가 없어요.'
          - '**품절 표시:** 한 번 품절(-1)이 나오면 그 서버의 메모리에 표시해 두고, 이후 요청은 Redis에 보내지 않고 바로 품절로 답해요.'
      - code: soldOutFlag
      - more:
          summary: 대기열 페이지
          body:
            - p: '규모가 아주 크면 이벤트 페이지 앞에 **대기열 페이지**를 두기도 해요. 들어온 순서로 대기 번호를 주고, 서버가 감당할 만큼씩 들여보내요. 콘서트 예매에서 보는 "앞에 1,234명"이 이것이에요. 들어온 사람만 판정까지 가니 판정 서버는 일정한 양만 받아요.'
      - quiz:
          q: '이미 품절이 확인된 뒤에도 요청마다 Redis에 판정 스크립트를 보내고 있어요. Redis의 부하를 줄이는 방법은?'
          options:
            - 'Redis를 더 큰 서버로 바꾼다'
            - '서버 메모리에 품절 표시를 두고 이후 요청은 Redis까지 보내지 않는다'
            - '스크립트를 두 번 보낸다'
          answer: 2
          explain: '품절은 되돌아오지 않는 상태라 서버가 기억해 두면 돼요. 앞에서 걸러 낼수록 판정이 빨라요.'
      - next: '원리는 여기까지예요. 이제 운영에서 챙길 것을 볼게요.'
    recall: '판정하는 Redis도 한 대라 몰리면 느려지니 앞에서 걸러요. 매크로처럼 과하게 누르는 사용자는 사용자별 요청 수 제한으로 막고, 오픈 전 요청은 서버에서 바로 거절하고, 한 번 품절이 나오면 서버 메모리에 표시해 이후 요청은 Redis까지 보내지 않고 품절로 답해요. 규모가 아주 크면 대기 번호를 주고 들여보내는 대기열 페이지를 둬요.'
practice:
  title: 선착순 이벤트를 운영할 때
  says:
    - '이벤트 전 Redis에 수량을 채우고, Redis가 죽었을 때 되살릴 곳을 정한다'
    - '흔한 실수: DB에 직접 판정한다'
  body:
    - h3: 이벤트 전에 준비할 것
    - ul:
        - '**수량을 채워 둬요.** 오픈 전에 DB의 이벤트 수량을 Redis에 `SET`으로 옮겨요.'
        - '**Redis가 죽으면?** 판정이 멈춰요. 참여 기록(Set)과 대기열이 사라지면 DB의 발급 기록으로 되살려요. 이벤트 중에는 Redis를 복제해 두고, 되살리는 순서를 미리 연습해요([Redis](lesson:redis-ranking)의 "원본은 DB에").'
        - '**워커가 따라가는지 봐요.** 대기열 길이를 지표로 보고, 쌓이기만 하면 워커를 늘려요.'
    - h3: 흔한 실수 하나
    - p: '질문 1의 `dbDirect`처럼 이벤트 행을 `SELECT ... FOR UPDATE`로 잠그고 판정하는 거예요. 평소에는 잘 되다가 오픈 순간 모든 요청이 그 행 앞에 줄을 서고, 커넥션 풀이 바닥나 사이트 전체가 느려져요. 고친 구조는 이 레슨의 것이에요. 판정은 Redis Lua로, 저장은 대기열과 워커로, DB에는 유니크 제약을 마지막 방어선으로 둬요.'
interview:
  question: 선착순 쿠폰 이벤트를 설계해 보세요.
  model:
    - label: 판정
      text: 몇 초에 요청이 한 행에 몰리니 DB에서 판정하지 않고 Redis에서 합니다. 참여 확인, 수량 차감, 참여 기록, 대기열 넣기를 Lua 스크립트 하나로 묶어, 두 번 누른 사용자도 한 번만 당첨되고 수량은 0에서 멈추게 합니다.
    - label: 저장
      text: 당첨자는 대기열에 넣고 바로 당첨이라 응답하며, 워커가 정해진 속도로 꺼내 DB에 저장합니다. 규모가 크면 메시지 큐를 쓰고, DB에는 (이벤트, 회원) 유니크 제약을 마지막 방어선으로 둡니다.
    - label: 앞단
      text: 사용자별 요청 수 제한으로 매크로를 막고, 오픈 전 요청은 바로 거절하고, 품절 뒤에는 서버 메모리 표시로 Redis까지 가지 않게 합니다. 규모가 아주 크면 대기열 페이지를 둡니다. Redis가 죽었을 때 DB에서 되살리는 순서를 준비합니다.
    - label: 경험
      text: '(내 프로젝트로 채우기) 예: DB 락으로 판정하던 선착순 이벤트에서 커넥션이 바닥나, 판정을 Redis Lua로 옮기고 당첨자를 대기열로 넘겨 저장하게 바꿨습니다.'
verified: 두 번 누른 요청의 결과, 요청 600건의 당첨 결과, 대기열에서 꺼낸 결과는 Redis 7에 연결을 따로 가진 스레드로 요청을 보내 받은 값이에요. 코드가 바뀔 때마다 테스트([FirstComeEventTest](link:test))가 다시 돌아요.
footer: '근거: 스크립트의 원자성은 [Redis 문서](link:redisEval), List는 [Redis 문서](link:redisList). 결과는 테스트로 확인했어요. 오류는 [GitHub 이슈](https://github.com/wanja727/dev-lessons/issues)로 알려 주세요.'
claims:
  - claim: '확인과 기록을 따로 하면 동시에 온 같은 사용자의 두 요청이 둘 다 당첨되고, Lua는 한 번만'
    how: '배리어로 두 요청이 확인을 지난 뒤 진행하게 맞춘다. 설계 때는 600건 속에서 저절로 겹치기를 기대했으나 같은 사용자의 두 요청이 같은 스레드에 들어가 겹치지 않아, 두 요청만 따로 맞춰 재현했다'
    test: FirstComeEventTest.doubleClick
  - claim: 'Lua로 판정하면 요청 600건에 100명이 한 번씩 당첨되고 수량은 0에서 멈춘다'
    how: '연결을 따로 가진 스레드 50개'
    test: FirstComeEventTest.atomicEntry
  - claim: '대기열 100건을 워커가 20건씩 5번에 꺼낸다'
    how: 'LPOP count'
    test: FirstComeEventTest.queueDrainsInOrder
sources:
  - 'Redis 스크립트: https://redis.io/docs/latest/develop/interact/programmability/eval-intro/'
  - 'Redis List: https://redis.io/docs/latest/develop/data-types/lists/'
