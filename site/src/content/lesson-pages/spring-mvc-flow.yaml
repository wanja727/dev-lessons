# 스프링 MVC 요청 흐름
# 자료 파일의 칸은 docs/lesson-data-format.md에 있다. 문제는 content/questions/spring-mvc-flow.yaml에 있다.
title: 스프링 MVC 요청 흐름
description: 요청이 컨트롤러 메서드를 찾아가는 길, 메서드의 인자를 채우는 일, 반환한 객체가 응답 본문이 되는 길. 세 가지 질문에 스스로 답할 수 있게 단계마다 일부러 실패하는 요청을 보내 어느 단계에서 어떤 상태 코드가 나오는지 보는 대화형 레슨.
unit: 스프링
minutes: 18
roadmap: S6
type: 동작 확인
prerequisites:
  - {slug: spring-beans, title: 스프링 빈과 의존성 주입}
  - {slug: servlet-tomcat, title: 서블릿과 톰캣}
assume: '자바 21, 스프링 부트 3.5. 톰캣이 요청을 `DispatcherServlet` 하나에 넘긴다는 것(서블릿과 톰캣 레슨). 컨트롤러도 빈이라는 것(스프링 빈과 의존성 주입 레슨). HTTP의 메서드, 경로, 쿼리 문자열, 헤더, 본문, 상태 코드(HTTP 요청과 응답 레슨). JSON 모양은 알고 있다고 봐요.'
example: '주문 API `OrderController` 하나. `GET /orders/{id}`, `GET /orders?status=PAID`, `POST /orders`(JSON 본문)를 두고 요청이 메서드에 닿기까지와 반환 값이 응답이 되기까지를 따라간다.'
intro:
  - '컨트롤러에 `@GetMapping("/orders/{id}")`를 쓰고 `/orders/abc`를 부르니 컨트롤러 코드는 한 줄도 돌지 않았는데 400이 와요. 같은 객체를 돌려주는데 어떤 요청에는 JSON이, 어떤 요청에는 406이 와요. 컨트롤러 앞뒤에서 스프링이 하는 일을 모르면 이런 응답이 어디서 왔는지 찾을 수 없어요.'
  - '스프링 MVC에서 개발자는 메서드 하나에 어노테이션을 붙이고 자바 객체를 받고 돌려줘요. 그 사이의 일, 즉 어느 메서드를 부를지 고르기, 문자열을 `long`과 객체로 바꾸기, 반환 값을 JSON으로 쓰기는 `DispatcherServlet`과 그 협력자들이 해요. 어느 단계가 무엇을 하는지 알면 에러 응답을 보고 어느 단계에서 멈췄는지 알 수 있어요.'
  - '이 레슨에서는 작은 웹 앱을 띄워 등록된 요청 매핑 목록을 보고, 단계마다 일부러 실패하는 요청을 보내 어느 단계에서 어떤 상태 코드가 나오는지 확인해요.'
covers:
  - topic: '`DispatcherServlet`이 요청을 받아 핸들러 매핑으로 부를 메서드를 찾고, 핸들러 어댑터로 그 메서드를 부르고, 반환 값을 응답으로 바꾼다'
    where: '질문 1'
  - topic: '`@RequestMapping` 계열(`@GetMapping` 등)은 앱이 뜰 때 메서드와 경로의 표로 등록된다(`RequestMappingHandlerMapping`). 요청마다 이 표에서 찾는다'
    where: '질문 1'
  - topic: '경로가 없으면 404, 경로는 있는데 메서드가 다르면 405'
    where: '질문 1'
  - topic: '메서드의 인자는 인자 리졸버가 채운다: `@PathVariable`, `@RequestParam`, `@RequestBody`, `HttpServletRequest`'
    where: '질문 2'
  - topic: '문자열을 `long`이나 enum으로 바꾸지 못하면 컨트롤러 전에 400이 난다'
    where: '질문 2'
  - topic: '`@RequestBody`는 메시지 컨버터(잭슨)가 본문 JSON을 객체로 바꾼다. JSON에 없는 필드는 null이나 기본값이 되고, 모르는 필드는 기본으로 무시한다(스프링 부트 설정)'
    where: '질문 2'
  - topic: '`@RequestParam`은 기본으로 꼭 있어야 하고 없으면 400. `required = false`나 `defaultValue`'
    where: '질문 2의 더 알아보기'
  - topic: '`@RestController`(`@ResponseBody`)의 반환 값은 메시지 컨버터가 본문에 쓴다. `String`은 글자 그대로(text/plain), 객체는 JSON'
    where: '질문 3'
  - topic: '어느 컨버터를 쓸지는 반환 타입과 요청의 `Accept` 헤더로 고른다. 만들 수 없는 형식을 원하면 406'
    where: '질문 3'
  - topic: '`ResponseEntity`로 상태 코드와 헤더를 정한다'
    where: '질문 3과 실무에서는'
  - topic: '`@Controller`가 돌려준 문자열은 뷰 이름이다. JSON API는 `@RestController`'
    where: '질문 3의 더 알아보기'
  - topic: '요청과 응답의 중간에 끼는 필터와 인터셉터'
    where: '다루지 않음: 필터와 인터셉터(S7)'
  - topic: '컨트롤러에서 난 예외가 응답이 되는 길과 입력 검증'
    where: '다루지 않음: 예외 처리와 검증(S8)'
  - topic: 'REST API의 경로와 상태 코드를 고르는 법'
    where: '다루지 않음: REST API 설계(N5)'
links:
  test: https://github.com/wanja727/dev-lessons/blob/main/verification/src/test/java/lab/devlessons/mvcflow/MvcFlowTest.java
  special: https://docs.spring.io/spring-framework/reference/web/webmvc/mvc-servlet/special-bean-types.html
  arguments: https://docs.spring.io/spring-framework/reference/web/webmvc/mvc-controller/ann-methods/arguments.html
  converters: https://docs.spring.io/spring-framework/reference/web/webmvc/message-converters.html
  bootJson: https://docs.spring.io/spring-boot/reference/features/json.html
codes:
  predict: |-
    @RestController
    class OrderController {
      @GetMapping("/orders/{id}")
      Order find(@PathVariable long id) {
        log("컨트롤러 실행 id=" + id);
        return orders.find(id);
      }
    }
    // GET /orders/abc
  controller: |-
    @RestController
    @RequestMapping("/orders")
    class OrderController {

      @GetMapping("/{id}")
      Order find([[@PathVariable]] long id) {
        return orders.find(id);
      }

      @GetMapping
      List<Order> list(
          [[@RequestParam]] OrderStatus status) {
        return orders.findBy(status);
      }

      @PostMapping
      Order create(
          [[@RequestBody]] CreateOrder req) {
        return orders.create(req);
      }
    }
  request: |-
    POST /orders HTTP/1.1
    Content-Type: application/json

    {"menu":"latte","quantity":2}
  entity: |-
    @PostMapping
    ResponseEntity<Order> create(
        @RequestBody CreateOrder req) {
      Order o = orders.create(req);
      return [[ResponseEntity]]
          [[.created(URI.create(]]
              [["/orders/" + o.id()))]]
          .body(o);
    }
  text: |-
    @GetMapping("/ping")
    String ping() {
      return "pong";
    }
  createOrder: |-
    public record CreateOrder(
        String menu, int quantity) {
    }
  entityBody: |-
    @PostMapping
    Order create(
        @RequestBody [[OrderEntity]] req) {
      return orders.save(req);
    }
  optionalParam: |-
    @GetMapping
    List<Order> list(
        @RequestParam(defaultValue = "PAID")
        OrderStatus status) { ... }
predict:
  title: 컨트롤러는 불릴까요?
  text: '코드 predict의 컨트롤러에 `GET /orders/abc`를 보내요. 메서드는 첫 줄에서 로그를 남겨요. 어떻게 될까요? 답은 질문 2에 나와요.'
  code: predict
  label: 내 예측
  options:
    - {value: a, label: '로그가 남고 500'}
    - {value: b, label: '로그가 남지 않고 400'}
    - {value: c, label: '로그가 남지 않고 404'}
    - {value: d, label: '로그가 남고 id=0으로 조회'}
  answer: b
  storageKey: mf-predict
  wrong: 예측은 "{label}"이었어요. 틀린 예측이 더 오래 남으니 괜찮아요.
questions:
  - id: q1
    title: 요청은 어떻게 컨트롤러 메서드를 찾아가나요?
    conclusion:
      lead: '`DispatcherServlet`이 앱이 뜰 때 만들어 둔 "경로와 메서드의 표"에서 요청에 맞는 메서드를 찾아 불러요.'
      sub: '표에 경로가 없으면 404, 경로는 있는데 HTTP 메서드가 다르면 405를 돌려주고 컨트롤러는 부르지 않아요.'
    says:
      - '전체 흐름을 한 번 그린다: 톰캣 → `DispatcherServlet` → 핸들러 매핑(어느 메서드?) → 핸들러 어댑터(인자를 채워 부르기) → 컨트롤러 → 반환 값 처리(메시지 컨버터) → 응답'
      - '앱이 뜰 때 `RequestMappingHandlerMapping`이 `@RestController`의 `@GetMapping` 등을 읽어 표를 만든다. 코드 controller의 앱에서 이 표를 꺼내 출력한다. `{GET [/orders/{id}]}` 같은 줄이 나온다. 실제 출력을 보인다'
      - '요청이 오면 경로, HTTP 메서드, (필요하면) 헤더로 표에서 하나를 고른다. `/orders/{id}`의 `{id}` 자리는 아무 글자나 받는다'
      - '`GET /payments`처럼 표에 없는 경로는 404, `PUT /orders/1`처럼 경로는 있지만 메서드가 다르면 405다. 두 응답을 실제 출력으로 보인다'
      - '핸들러 어댑터는 고른 메서드를 실제로 부르는 역할이다. 인자를 채우는 일과 반환 값을 쓰는 일을 맡은 협력자들을 부른다(질문 2, 3)'
    widget:
      kind: steps
      note: '`POST /orders` 요청 하나를 단계마다 따라간다: 톰캣이 `DispatcherServlet`에 넘김, 핸들러 매핑이 표에서 `create`를 찾음, 인자 리졸버가 본문 JSON을 `CreateOrder`로 바꿈, 컨트롤러 실행, 메시지 컨버터가 `Order`를 JSON으로 씀, 응답. 선택 버튼으로 `GET /payments`(매핑 단계에서 404), `GET /orders/abc`(인자 단계에서 400) 시나리오를 고르면 멈추는 단계가 바뀐다'
    asks:
      - '본문의 예시: 코드 controller에 `PUT /orders/1`을 보내면 몇이 오나 (405. 경로는 있고 PUT 메서드가 없다)'
      - '옮긴 상황: 회원 API에 `@GetMapping("/members/{id}")`만 있다. `GET /members/7/orders`를 보내면 몇이 오나 (404. 표에 그 경로가 없다)'
    body:
      - p: '[서블릿과 톰캣](lesson:servlet-tomcat) 레슨에서 톰캣이 모든 요청을 `DispatcherServlet` 하나에 넘긴다고 했어요. 그 안에서 요청은 이 길을 지나요.'
      - widget:
          kind: steps
          layout: [selector, log, buttons, verdict]
          selector:
            label: 보낸 요청
            options:
              - {value: ok, label: 'POST /orders'}
              - {value: nf, label: 'GET /payments'}
              - {value: bad, label: 'GET /orders/abc'}
          scenarios:
            ok:
              - log: '톰캣 → DispatcherServlet에 넘김'
              - log: '핸들러 매핑: 표에서 POST /orders → OrderController.create 찾음'
              - log: '인자 리졸버: 본문 JSON을 CreateOrder로 바꿈'
              - log: '핸들러 어댑터: create(req) 실행'
              - log: '메시지 컨버터: 돌려준 Order를 JSON으로 씀'
              - log: '응답 201'
                verdict: '여섯 단계를 모두 지나 응답이 나가요.'
            nf:
              - log: '톰캣 → DispatcherServlet에 넘김'
              - log: '핸들러 매핑: 표에 /payments가 없음'
              - log: '응답 404 (컨트롤러는 불리지 않음)'
                verdict: '매핑 단계에서 멈췄어요.'
            bad:
              - log: '톰캣 → DispatcherServlet에 넘김'
              - log: '핸들러 매핑: GET /orders/{id} → OrderController.find 찾음'
              - log: '인자 리졸버: "abc"를 long으로 바꾸지 못함'
              - log: '응답 400 (컨트롤러는 불리지 않음)'
                verdict: '메서드는 찾았지만 인자를 채우는 단계에서 멈췄어요.'
      - h3: 경로와 메서드의 표
      - code: controller
      - p: '앱이 뜰 때 `RequestMappingHandlerMapping`이라는 빈이 모든 `@RestController`의 `@GetMapping`, `@PostMapping`을 읽어 **표**를 만들어요. 이 레슨의 앱에서 그 표를 꺼냈어요.'
      - ci:
          key: mappings
          label: 실제 표 보기
          source: MvcFlowTest.mappingTable
      - p: '요청이 오면 이 표에서 경로와 HTTP 메서드가 맞는 줄을 찾아요. `/orders/{id}`의 `{id}` 자리는 아무 글자나 받아요. 이렇게 부를 메서드를 찾는 역할을 **핸들러 매핑**, 찾은 메서드를 실제로 부르는 역할을 **핸들러 어댑터**라고 해요([근거](link:special)).'
      - h3: 표에서 못 찾으면
      - ci:
          key: 404-405
          label: 실제 응답 보기
          source: MvcFlowTest.notFoundAndMethodNotAllowed
      - p: '`/payments`는 표에 아예 없어서 **404**예요. `/orders/1`은 경로는 있지만 PUT 메서드가 없어서 **405**예요. 405 응답의 `Allow` 헤더가 이 경로에서 되는 메서드를 알려 줘요. 둘 다 컨트롤러 코드는 한 줄도 돌지 않아요.'
      - quiz:
          q: '회원 API에 `@GetMapping("/members/{id}")`만 있어요. `DELETE /members/7`을 보내면?'
          options:
            - '404'
            - '405'
            - '400'
          answer: 2
          explain: '경로 `/members/{id}`는 표에 있지만 DELETE 메서드가 없어요. 경로가 아예 없을 때가 404예요.'
      - next: '메서드를 찾았어요. 그런데 경로의 `abc`는 문자열인데 메서드는 `long`을 받아요. 누가 바꿔 줄까요?'
    recall: 'DispatcherServlet은 앱이 뜰 때 RequestMappingHandlerMapping이 @GetMapping 등을 읽어 만든 경로와 메서드의 표에서 요청에 맞는 메서드를 찾고(핸들러 매핑), 핸들러 어댑터로 인자를 채워 불러요. 경로가 표에 없으면 404, 경로는 있지만 HTTP 메서드가 다르면 405이고, 둘 다 컨트롤러는 불리지 않아요.'
  - id: q2
    title: 메서드의 인자는 누가 어떻게 채우나요?
    conclusion:
      lead: '인자마다 맞는 리졸버가 요청에서 값을 꺼내 인자의 타입으로 바꿔 넣어요. 바꾸지 못하면 컨트롤러를 부르기 전에 400으로 끝나요.'
      sub: '`@PathVariable`과 `@RequestParam`은 문자열을 `long`, enum으로 바꾸고, `@RequestBody`는 메시지 컨버터(잭슨)가 본문 JSON을 객체로 바꿔요.'
    says:
      - '코드 predict를 보낸다. 로그가 남지 않고 400이다. 예측의 답을 밝힌다. 응답 본문에 어떤 단계에서 무엇이 실패했는지 나오는 것을 실제 출력으로 보인다'
      - '인자의 어노테이션마다 리졸버가 있다. `@PathVariable`은 경로의 `{id}` 자리, `@RequestParam`은 쿼리 문자열, `@RequestBody`는 본문, `HttpServletRequest`는 요청 객체 그대로'
      - '경로와 쿼리의 값은 모두 문자열이다. 타입 변환이 `"7"`을 `7L`로, `"PAID"`를 `OrderStatus.PAID`로 바꾼다. `status=paid`처럼 enum 이름과 대소문자가 다르면 바꾸지 못해 400이다'
      - '`@RequestBody`는 `Content-Type: application/json`인 본문을 잭슨이 객체로 바꾼다(코드 request). JSON에 `quantity`가 없으면 그 필드는 0이다. 모르는 필드 `coupon`은 스프링 부트의 기본 설정에서 무시된다. 실제 출력을 보인다'
      - 'JSON 문법이 틀리면 400이다. 바꾸는 단계에서 실패하므로 컨트롤러는 불리지 않는다'
      - '더 알아보기: `@RequestParam`은 기본으로 꼭 있어야 해서 `?status`가 빠지면 400이다. `required = false`면 null, `defaultValue = "PAID"`면 그 값이 들어간다'
    asks:
      - '본문의 예시: 코드 controller에 `GET /orders?status=paid`를 보내면 몇이 오나. `OrderStatus`에는 `PAID`가 있다 (400. 대소문자가 달라 enum으로 바꾸지 못한다)'
      - '옮긴 상황: `record SignUp(String email, int age)`를 `@RequestBody`로 받는다. 본문이 `{"email":"a@b.com"}`이면 `age`는 무엇이 되나 (0)'
    body:
      - p: '예측의 요청을 보내고, 컨트롤러가 몇 번 불렸는지 셌어요.'
      - ci:
          key: type-mismatch
          label: 실제 응답 보기
          source: MvcFlowTest.typeMismatchBeforeController
          code: predict
      - p: '**400이고 컨트롤러는 불리지 않았어요.** {{predict-result}} 경로는 표에 있으니 404가 아니에요. 메서드를 부르려면 `long id`를 채워야 하는데, `"abc"`를 `long`으로 바꾸지 못해 그 자리에서 멈췄어요. 응답 본문에 어느 인자를 무엇으로 바꾸다 실패했는지 나와요.'
      - h3: 인자마다 리졸버가 있어요
      - table:
          head: [인자, 어디서 꺼내나]
          rows:
            - ['`@PathVariable long id`', '경로의 `{id}` 자리']
            - ['`@RequestParam OrderStatus status`', '쿼리 문자열 `?status=PAID`']
            - ['`@RequestBody CreateOrder req`', '요청 본문(JSON)']
            - ['`HttpServletRequest request`', '요청 객체 그대로']
      - p: '이 꺼내는 일을 하는 것을 **인자 리졸버**라고 해요. 핸들러 어댑터가 메서드를 부르기 전에 인자마다 맞는 리졸버를 불러요([근거](link:arguments)).'
      - h3: 문자열을 타입으로 바꿔요
      - p: '경로와 쿼리 문자열의 값은 모두 문자열이에요. 리졸버가 인자의 타입에 맞게 바꿔요. `"7"`은 `7L`로, `"PAID"`는 `OrderStatus.PAID`로. enum은 이름이 정확히 같아야 해요.'
      - ci:
          key: enum-param
          label: 실제 응답 보기
          source: MvcFlowTest.enumParam
      - p: '`paid`는 대소문자가 달라 enum으로 바꾸지 못해 400이에요. `status`가 아예 없어도 400이에요. `@RequestParam`은 기본으로 꼭 있어야 하는 값이기 때문이에요.'
      - h3: 본문 JSON은 잭슨이 바꿔요
      - code: request
      - p: '`@RequestBody`는 본문을 객체로 바꿔요. 이 일은 **메시지 컨버터**가 해요. `Content-Type: application/json`이면 잭슨 컨버터가 JSON을 `CreateOrder`로 바꿔요. JSON에 필드가 빠지거나 모르는 필드가 있으면 어떻게 될까요?'
      - code: createOrder
      - ci:
          key: body
          label: 실제 결과 보기
          source: MvcFlowTest.requestBodyBinding
      - p: '빠진 `quantity`는 int의 기본값 **0**이에요. 모르는 필드 `coupon`은 조용히 무시돼요. 스프링 부트가 잭슨의 "모르는 필드면 실패" 설정을 꺼 두었기 때문이에요([근거](link:bootJson)). JSON 문법이 틀리면 바꾸는 단계에서 실패해 400이에요.'
      - more:
          summary: '더 알아보기: 쿼리 값을 꼭 받지 않으려면'
          body:
            - code: optionalParam
            - p: '`defaultValue`를 주면 값이 없을 때 그 값이 들어가요. `required = false`면 null이 들어가요. 빈 값이 0이 되는 것이 싫으면 `int` 대신 `Integer`로 받아 null을 구분해요.'
      - quiz:
          q: '`record SignUp(String email, int age)`를 `@RequestBody`로 받아요. 본문이 `{"email":"a@b.com"}`이면 `age`는?'
          options:
            - '0'
            - 'null'
            - 400 응답
          answer: 1
          explain: 'JSON에 없는 int 필드는 기본값 0이 들어가요. 빠진 것을 막으려면 검증이 필요해요. 예외 처리와 검증 레슨에서 다뤄요.'
      - next: '인자를 채워 메서드를 불렀어요. 메서드가 돌려준 `Order` 객체는 어떻게 JSON이 될까요?'
    recall: '핸들러 어댑터가 메서드를 부르기 전에 인자마다 리졸버가 값을 꺼내 타입을 바꿔 넣어요. @PathVariable은 경로, @RequestParam은 쿼리 문자열, @RequestBody는 본문이고, 본문 JSON은 메시지 컨버터(잭슨)가 객체로 바꿔요. 바꾸지 못하면(abc를 long으로, paid를 enum으로, 잘린 JSON) 컨트롤러를 부르기 전에 400이에요. JSON에 없는 int 필드는 0, 모르는 필드는 무시돼요.'
  - id: q3
    title: 반환한 객체는 어떻게 응답 본문이 되나요?
    conclusion:
      lead: '메시지 컨버터가 반환 값을 본문에 써요. 어느 컨버터를 쓸지는 반환 타입과 요청의 `Accept` 헤더로 골라요.'
      sub: '객체는 잭슨이 JSON으로, `String`은 글자 그대로 써요. 요청이 원하는 형식을 만들 수 없으면 406이에요. 상태 코드와 헤더는 `ResponseEntity`로 정해요.'
    says:
      - '`@RestController`는 `@Controller`와 `@ResponseBody`를 합친 것이다. 모든 메서드의 반환 값을 뷰가 아니라 본문으로 쓴다'
      - '스프링 부트 웹 앱에 등록된 메시지 컨버터 목록을 출력한다. 문자열용, JSON용(잭슨) 등이 순서대로 있다. 실제 출력을 보인다'
      - '반환 타입이 `Order`면 JSON 컨버터가 `Content-Type: application/json`으로 쓴다. 코드 text처럼 `String`이면 문자열 컨버터가 `text/plain`으로 `pong`을 쓴다. JSON 따옴표가 붙지 않는다. 두 응답의 헤더와 본문을 보인다'
      - '요청이 `Accept: application/xml`을 보내면 그 형식으로 쓸 컨버터가 없어서 406(Not Acceptable)이다'
      - '상태 코드를 바꾸려면 코드 entity처럼 `ResponseEntity`를 돌려준다. `201 Created`와 `Location` 헤더를 보인다. 아무것도 정하지 않으면 200이다'
      - '더 알아보기: `@Controller`의 메서드가 돌려준 `String`은 본문이 아니라 뷰(HTML 템플릿)의 이름이다. JSON API를 만들다 `@ResponseBody`를 빠뜨리면 뷰를 찾다 실패한다'
    asks:
      - '본문의 예시: 코드 text의 `/ping`을 부른 응답의 본문과 `Content-Type`은 무엇인가 (`pong`, `text/plain`)'
      - '옮긴 상황: `@RestController`의 메서드가 `List<Order>`를 돌려준다. 클라이언트가 `Accept: text/csv`만 보낸다. 몇이 오나 (406. CSV 컨버터가 없다)'
      - '실무 구역: 코드 entity의 응답 상태 코드와 `Location` 헤더는 무엇인가 (201, `/orders/{새 id}`)'
    body:
      - p: '`@RestController`는 `@Controller`와 `@ResponseBody`를 합친 어노테이션이에요. "모든 메서드의 반환 값을 **응답 본문**으로 써라"는 뜻이에요. 본문에 쓰는 일도 질문 2의 **메시지 컨버터**가 해요. 이 앱에 등록된 컨버터를 순서대로 출력했어요.'
      - ci:
          key: converters
          label: 실제 목록 보기
          source: MvcFlowTest.messageConverters
      - p: '반환 값의 타입과 요청이 원하는 형식(`Accept` 헤더)을 보고, 목록에서 쓸 수 있는 첫 컨버터를 골라요([근거](link:converters)).'
      - h3: String과 객체는 다르게 나가요
      - code: text
      - ci:
          key: string-object
          label: 실제 응답 보기
          source: MvcFlowTest.stringVersusObject
      - p: '`String`은 문자열 컨버터가 `text/plain`으로 **글자 그대로** 써요. JSON 따옴표가 붙지 않아요. `Order` 객체는 잭슨 컨버터가 `application/json`으로 써요. 컨트롤러가 돌려준 것은 자바 객체인데 JSON이 나가는 이유가 이거예요.'
      - h3: 원하는 형식을 만들 수 없으면 406
      - ci:
          key: '406'
          label: 실제 응답 보기
          source: MvcFlowTest.notAcceptable
      - p: '요청이 XML이나 CSV만 받겠다고 하면, 그 형식으로 `Order`를 쓸 컨버터가 없어서 **406**(Not Acceptable)이에요. 목록에 XML용 컨버터(`Jaxb2RootElementHttpMessageConverter`)가 있지만, 그 컨버터는 `@XmlRootElement`가 붙은 클래스만 써요. `Accept`를 보내지 않거나 `*/*`면 JSON이 나가요.'
      - h3: 상태 코드와 헤더는 ResponseEntity로
      - code: entity
        notes:
          - mark: ResponseEntity
            as: code
            text: '본문과 함께 상태 코드와 헤더를 정할 수 있는 반환 타입이에요.'
      - ci:
          key: created
          label: 실제 응답 보기
          source: MvcFlowTest.created
      - p: '아무것도 정하지 않으면 200이에요. 새로 만든 자원은 `201 Created`와 그 주소를 담은 `Location` 헤더로 알려 줘요. 어떤 상태 코드를 고를지는 [REST API 설계](lesson:rest-api) 레슨에서 다뤄요.'
      - more:
          summary: '더 알아보기: @Controller가 돌려준 문자열'
          body:
            - p: '`@ResponseBody` 없는 `@Controller`의 메서드가 `"orders"`를 돌려주면, 스프링은 그것을 본문이 아니라 **뷰 이름**으로 봐요. `orders.html` 같은 템플릿을 찾아 HTML을 만들어요. JSON API를 만들다 `@RestController` 대신 `@Controller`를 쓰면 뷰를 찾다 실패해요.'
      - quiz:
          q: '`@RestController`의 메서드가 `List<Order>`를 돌려줘요. 클라이언트가 `Accept: text/csv`만 보내면?'
          options:
            - 'JSON으로 200'
            - '406'
            - 'CSV로 200'
          answer: 2
          explain: '요청이 원하는 CSV로 쓸 컨버터가 없어서 406이에요.'
    recall: '@RestController의 반환 값은 메시지 컨버터가 응답 본문에 써요. 반환 타입과 Accept 헤더로 컨버터를 골라서, String은 text/plain으로 글자 그대로, 객체는 잭슨이 application/json으로 써요. 원하는 형식을 만들 컨버터가 없으면 406이에요. 상태 코드와 헤더는 ResponseEntity로 정하고, 정하지 않으면 200이에요.'
practice:
  title: 스프링에서는 이렇게 써요
  says:
    - '실제 프로젝트의 컨트롤러 모양: 클래스에 `@RequestMapping("/orders")`, 메서드에 `@GetMapping`, 요청 본문은 record, 만들 때는 `ResponseEntity.created`. 코드 controller와 entity를 합친 모양으로 보인다'
    - '흔한 실수: 엔티티를 그대로 `@RequestBody`로 받는다. 클라이언트가 보낸 `id`나 `status` 같은 필드까지 잭슨이 채운다. 고친 코드: 받을 필드만 가진 요청 record를 따로 둔다. JSON에 `"status":"PAID"`를 넣어 보내면 엔티티에는 들어가고 요청 record에는 들어가지 않는 것을 테스트로 보인다'
    - '응답을 보고 어느 단계에서 멈췄는지 고르는 표: 404와 405는 매핑, 400은 인자 바꾸기, 406은 응답 형식 고르기, 500은 대개 컨트롤러 안. 예외를 응답으로 바꾸는 법은 S8로 넘긴다'
  body:
    - h3: 요청 본문은 받을 것만 가진 record로
    - p: '질문의 코드처럼 클래스에 공통 경로 `@RequestMapping("/orders")`를 두고, 메서드마다 `@GetMapping`, `@PostMapping`을 붙여요. 요청 본문은 받을 필드만 가진 record(`CreateOrder`)로 받고, 만들 때는 `ResponseEntity.created`로 201을 돌려줘요.'
    - h3: '흔한 실수: 엔티티를 그대로 @RequestBody로'
    - code: entityBody
      notes:
        - mark: OrderEntity
          as: code
          text: 'DB에 저장하는 클래스예요. `id`와 `status` 필드에도 세터가 있어요.'
    - p: '클라이언트가 `id`와 `status`까지 넣어 보냈어요.'
    - ci:
        key: entity
        label: 실제 결과 보기
        source: MvcFlowTest.entityAsRequestBody
    - p: '엔티티로 받으면 잭슨이 세터가 있는 모든 필드를 채워서, 클라이언트가 정한 `id`와 `PAID` 상태가 그대로 들어가요. 결제하지 않은 주문을 결제된 것으로 만들 수 있어요. 요청 record에는 `menu`와 `quantity`만 있어서 나머지는 들어갈 자리가 없어요. 요청마다 받을 것만 가진 record를 둬요.'
    - h3: 응답 코드로 멈춘 단계 찾기
    - table:
        head: [응답, 멈춘 단계, 볼 곳]
        rows:
          - ['404', '핸들러 매핑. 경로가 표에 없다', '경로 오타, 클래스의 `@RequestMapping`']
          - ['405', '핸들러 매핑. 메서드가 다르다', '`@GetMapping`인지 `@PostMapping`인지']
          - ['400', '인자 바꾸기', '타입, enum 이름, 빠진 `@RequestParam`, JSON 문법']
          - ['406', '응답 형식 고르기', '요청의 `Accept`']
          - ['500', '대개 컨트롤러 안', '서버 로그의 예외']
    - p: '500과 예외를 원하는 응답으로 바꾸는 법은 [예외 처리와 검증](lesson:exception-validation) 레슨에서 다뤄요. 요청이 컨트롤러에 닿기 전후에 끼는 필터와 인터셉터는 [필터와 인터셉터](lesson:filter-interceptor) 레슨에서 봐요.'
interview:
  question: 스프링 MVC에서 요청이 컨트롤러에 닿고 응답이 나가기까지를 설명해 주세요
  model:
    - label: 정의
      text: 톰캣이 요청을 DispatcherServlet에 넘기면, 핸들러 매핑이 부를 메서드를 찾고, 핸들러 어댑터가 인자를 채워 메서드를 부르고, 반환 값을 메시지 컨버터가 응답 본문에 씁니다.
    - label: 원리
      text: 앱이 뜰 때 @GetMapping 등을 읽어 경로와 메서드의 표를 만들고 요청마다 이 표에서 찾습니다. 인자는 리졸버가 경로, 쿼리, 본문에서 꺼내 타입을 바꾸고, 본문 JSON과 반환 객체는 잭슨 컨버터가 바꿉니다. 컨버터는 반환 타입과 Accept 헤더로 고릅니다.
    - label: 주의할 점
      text: 경로가 없으면 404, 메서드가 다르면 405, 인자를 바꾸지 못하면 컨트롤러 전에 400, 원하는 형식이 없으면 406입니다. 요청 본문은 엔티티가 아니라 받을 필드만 가진 record로 받습니다.
    - label: 경험
      text: '(내 프로젝트로 채우기) 예: enum 쿼리 값의 대소문자가 달라 400이 나던 것을 응답 본문의 메시지로 찾아 고쳤습니다.'
verified: 이 레슨의 표와 응답은 짐작이 아니라 스프링 부트 3.5의 작은 웹 앱에 요청을 보내 받은 값이에요. 코드가 바뀔 때마다 테스트([MvcFlowTest](link:test))가 다시 돌아요.
footer: '근거: `DispatcherServlet`의 협력자는 스프링 프레임워크 문서([링크](link:special)), 메서드 인자는 [링크](link:arguments), 메시지 컨버터는 [링크](link:converters), 잭슨의 기본 설정은 스프링 부트 문서([링크](link:bootJson)). 결과는 OpenJDK 21에서 테스트로 확인했어요. 오류는 [GitHub 이슈](https://github.com/wanja727/dev-lessons/issues)로 알려 주세요.'
claims:
  - claim: '`RequestMappingHandlerMapping`의 표에 컨트롤러의 경로와 메서드가 있다'
    how: '`MiniWeb`으로 띄우고 `getHandlerMethods()`를 출력한다'
    test: MvcFlowTest.mappingTable
  - claim: '없는 경로는 404, 메서드가 다르면 405'
    how: '`MiniWeb.exchange`로 PUT을 보낸다'
    test: MvcFlowTest.notFoundAndMethodNotAllowed
  - claim: '`GET /orders/abc`는 컨트롤러를 부르지 않고 400이다'
    how: '컨트롤러가 불린 횟수를 세고 응답을 본다'
    test: MvcFlowTest.typeMismatchBeforeController
  - claim: '`status=paid`는 400, `status=PAID`는 200, 빠지면 400'
    how: '요청을 보낸다'
    test: MvcFlowTest.enumParam
  - claim: '본문 JSON에 없는 `int` 필드는 0, 모르는 필드는 무시되고 200, 잘린 JSON은 400'
    how: '받은 객체를 그대로 돌려준다'
    test: MvcFlowTest.requestBodyBinding
  - claim: '등록된 메시지 컨버터에 문자열용과 잭슨 JSON용이 있다'
    how: '`RequestMappingHandlerAdapter.getMessageConverters()`'
    test: MvcFlowTest.messageConverters
  - claim: '`String` 반환은 `text/plain`이고 따옴표 없이, 객체 반환은 `application/json`'
    how: '응답 헤더와 본문을 읽는다'
    test: MvcFlowTest.stringVersusObject
  - claim: '`Accept: application/xml`이나 `text/csv`면 406'
    how: '헤더를 준 요청. XML 컨버터가 목록에 있지만 `@XmlRootElement` 없는 record는 쓰지 못한다'
    test: MvcFlowTest.notAcceptable
  - claim: '`ResponseEntity.created`는 201과 `Location` 헤더'
    how: '응답을 읽는다'
    test: MvcFlowTest.created
  - claim: '엔티티를 `@RequestBody`로 받으면 클라이언트가 보낸 `id`와 `status`가 들어가고, 요청 record에는 들어가지 않는다'
    how: '두 메서드가 받은 객체를 돌려준다'
    test: MvcFlowTest.entityAsRequestBody
sources:
