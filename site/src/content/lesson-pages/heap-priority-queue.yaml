# 힙과 우선순위 큐
# 자료 파일의 칸은 docs/lesson-data-format.md에 있다. 문제는 content/questions/heap-priority-queue.yaml에 있다.
title: 힙과 우선순위 큐
description: 우선순위 큐가 가장 작은 것을 어떻게 바로 꺼내는지, 넣고 꺼낼 때 힙이 어떻게 규칙을 지키는지, PriorityQueue를 출력하면 왜 정렬되어 있지 않은지, 상위 k개를 구할 때 힙이 왜 나은지. 네 가지 질문에 스스로 답할 수 있게 배송 작업 대기열로 배우는 대화형 레슨.
unit: 자료구조와 알고리즘
minutes: 20
roadmap: K9
type: 자바 실행
prerequisites:
  - {slug: binary-search-tree, title: 이진 탐색 트리}
assume: '자바 21(OpenJDK). 트리와 높이, O(log n)(이진 탐색 트리 레슨). 큐는 먼저 넣은 것을 먼저 꺼낸다는 것(스택과 큐 레슨). `Comparator`로 순서를 정하는 법(정렬 레슨).'
example: '배송 작업 대기열. 작업마다 마감 시각이 있고, 마감이 가장 이른 작업부터 처리해요. `PriorityQueue`에 작업을 넣고 꺼내면서 안쪽 배열이 어떻게 바뀌는지 봐요. 실무 구역에서는 큐 안에 든 작업의 마감 시각을 바꾸는 코드로 옮겨요.'
intro:
  - '작업 대기열에 들어온 순서가 아니라 급한 순서로 꺼내야 할 때가 있어요. 마감이 이른 배송, 등급이 높은 고객의 문의, 실행 시각이 된 예약 작업이 그래요. 매번 전체를 정렬하면 작업이 하나 들어올 때마다 O(n log n)이 들어요.'
  - '자바 개발자는 이것을 `PriorityQueue`로 만나요. 스레드 풀의 예약 실행(`ScheduledThreadPoolExecutor`)도 안에서 같은 구조로 다음에 실행할 작업을 골라요. "가장 큰 것 k개 구하기"도 이 구조로 풀어요. 그런데 `PriorityQueue`를 출력하면 정렬되어 있지 않아서 당황하게 돼요.'
  - '이 레슨에서는 `PriorityQueue`의 안쪽 배열을 들여다보며 넣고 꺼낼 때 원소가 몇 칸 움직이는지 세고, 출력 순서와 꺼내는 순서가 왜 다른지 확인해요.'
covers:
  - topic: '우선순위 큐는 넣은 순서와 상관없이 우선순위가 가장 높은(가장 작은) 것을 먼저 꺼내는 큐다'
    where: '질문 1'
  - topic: '힙은 부모가 자식보다 작거나 같다는 규칙만 지키는 트리다. 가장 작은 값이 늘 뿌리에 있다. 형제끼리나 다른 가지끼리는 순서가 없다'
    where: '질문 1'
  - topic: '힙은 위에서부터 왼쪽부터 빈틈없이 채운 완전 이진 트리라서 배열에 담는다. i번 칸의 자식은 2i + 1과 2i + 2, 부모는 (i - 1) / 2'
    where: '질문 1'
  - topic: 'peek은 O(1)이다'
    where: '질문 1'
  - topic: '넣기(offer): 맨 끝에 넣고 부모보다 작으면 자리를 바꾸며 올린다. 높이만큼이라 O(log n)'
    where: '질문 2'
  - topic: '꺼내기(poll): 뿌리를 꺼내고 맨 끝 원소를 뿌리에 올린 뒤 더 작은 자식과 바꾸며 내린다. O(log n)'
    where: '질문 2'
  - topic: '완전 이진 트리라 높이가 늘 log₂ n 남짓이다. 이진 탐색 트리처럼 치우치지 않는다'
    where: '질문 2'
  - topic: 'PriorityQueue의 반복자와 toString은 배열 순서라 정렬된 순서가 아니다. 정렬된 순서가 필요하면 poll을 되풀이한다'
    where: '질문 3'
  - topic: '힙은 가장 작은 것만 빨리 찾는다. 임의의 원소를 찾거나 지우는 contains와 remove(Object)는 O(n)이다'
    where: '질문 3'
  - topic: 'PriorityQueue는 작은 것이 먼저다. 큰 것부터 꺼내려면 Comparator.reverseOrder()나 뒤집은 Comparator를 준다'
    where: '질문 3'
  - topic: '같은 우선순위 사이의 순서는 정해지지 않는다(안정이 아니다)'
    where: '질문 3'
  - topic: '상위 k개: 크기 k의 최소 힙을 유지하면 O(n log k)다. 전체를 정렬하는 O(n log n)보다 적고 메모리도 k만 쓴다'
    where: '질문 4'
  - topic: '힙 정렬과 배열 전체를 힙으로 만드는 O(n)'
    where: '질문 4의 더 알아보기'
  - topic: '큐에 든 객체의 우선순위를 바꾸면 힙의 규칙이 깨진다. 꺼내서 바꾸고 다시 넣는다'
    where: '실무에서는'
  - topic: '예약 실행을 하는 ScheduledThreadPoolExecutor의 작업 큐가 힙이다'
    where: '실무에서는'
  - topic: '여러 스레드가 함께 쓰는 우선순위 큐(PriorityBlockingQueue)'
    where: '다루지 않음: 스레드 풀(C7)'
  - topic: '다익스트라에서 우선순위 큐를 쓰는 방법'
    where: '다루지 않음: 최단 경로(K14)'
codes:
  predict: |-
    Queue<Integer> pq = new PriorityQueue<>();
    pq.offer(5);
    pq.offer(1);
    pq.offer(4);
    pq.offer(2);
    pq.offer(3);
    System.out.println(pq);
    System.out.println(pq.poll());
  heapTree: |2-
          1
        /   \
       2     4
      / \
     5   3
  index: |-
    int left = 2 * i + 1;
    int right = 2 * i + 2;
    int parent = (i - 1) / 2;
  task: |-
    record Task(String name,
                LocalTime deadline) {}

    Queue<Task> tasks = new PriorityQueue<>(
        Comparator.comparing(
            [[Task::deadline]]));
  offerCode: |-
    a[size] = x;
    int i = size++;
    while (i > 0 && [[a[(i - 1) / 2] > a[i]]]) {
      swap(i, (i - 1) / 2);
      i = (i - 1) / 2;
    }
  swapRun: |-
    // 같은 방식으로 짠 힙에
    // 원소 100만 개를 넣고 1천 번 꺼내며
    // 한 번에 자리를 바꾼 횟수를 센다
  drain: |-
    while (!pq.isEmpty()) {
      System.out.print(pq.poll() + " ");
    }
  reverse: |-
    Queue<Integer> scores = new PriorityQueue<>(
        [[Comparator.reverseOrder()]]);
  tie: |-
    record Task(String name,
                LocalTime deadline,
                long seq) {}

    Comparator.comparing(Task::deadline)
        [[.thenComparingLong(Task::seq)]]
  topK: |-
    Queue<Integer> top = new PriorityQueue<>();
    for (int score : scores) {
      top.offer(score);
      if ([[top.size() > k]]) {
        top.poll();
      }
    }
  mutable: |-
    class Job {
      String name;
      int priority;
    }

    Queue<Job> jobs = new PriorityQueue<>(
        Comparator.comparingInt(
            (Job j) -> j.priority));
    // ... a(5), b(3), c(8)을 넣은 뒤
    [[c.priority = 1]];
    System.out.println(jobs.poll().name);
  mutableFixed: |-
    jobs.[[remove(c)]];
    c.priority = 1;
    jobs.[[offer(c)]];
    System.out.println(jobs.poll().name);
  scheduled: |-
    @Scheduled(fixedDelay = 10_000)
    void retryFailedDeliveries() {
      // 10초마다 실패한 배송을 다시 보낸다
    }
  schedulerProp: |-
    spring:
      task:
        scheduling:
          pool:
            size: 4
