  stpe: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/concurrent/ScheduledThreadPoolExecutor.html
  boot: https://docs.spring.io/spring-boot/reference/features/task-execution-and-scheduling.html
predict:
  title: 출력과 꺼내기
  text: '코드 predict는 5, 1, 4, 2, 3을 `PriorityQueue`에 넣고, 큐를 출력한 뒤 하나를 꺼내요. 두 줄의 출력은 무엇일까요? 답은 질문 3에 나와요.'
  code: predict
  label: 내 예측
  options:
    - value: sorted
      label: '[1, 2, 3, 4, 5]와 1'
    - value: heap
      label: '[1, 2, 4, 5, 3]와 1'
    - value: insert
      label: '[5, 1, 4, 2, 3]와 5'
  answer: heap
  storageKey: heap-predict
  wrong: 예측은 "{label}"이었어요. 틀린 예측이 더 오래 남으니 괜찮아요.
questions:
  - id: q1
    title: 우선순위 큐는 가장 작은 것을 어떻게 바로 꺼내나요?
    conclusion:
      lead: '부모가 늘 자식보다 작거나 같은 트리, 힙에 담아서 가장 작은 값이 늘 맨 위(뿌리)에 있게 해요.'
      sub: '힙은 빈틈없이 채운 트리라서 배열 하나에 담아요. 뿌리는 0번 칸이라 가장 작은 값을 보는 `peek`은 O(1)이에요.'
    says:
      - '우선순위 큐는 넣은 순서와 상관없이 우선순위가 가장 높은 것을 먼저 꺼낸다. 자바의 `PriorityQueue`는 가장 작은 것이 가장 높다'
      - '힙의 규칙은 하나다. 어느 노드든 자식보다 작거나 같다. 그래서 뿌리가 가장 작다. 이진 탐색 트리(K8)와 달리 왼쪽과 오른쪽 사이에는 순서가 없다. 정렬을 다 하지 않고 "가장 작은 것"만 지킨다'
      - '힙은 위층부터, 한 층 안에서는 왼쪽부터 빈틈없이 채운다(완전 이진 트리). 그래서 층 순서대로 배열에 담으면 빈칸이 없다. 코드 index처럼 i번 칸의 자식과 부모를 계산으로 찾는다. 노드에 참조를 두지 않는다'
      - '`PriorityQueue`도 안에 배열 하나를 가진다. `peek`은 0번 칸을 읽는다'
      - '배송 작업(코드 task). 마감 시각으로 비교하는 `Comparator`를 주면 마감이 가장 이른 작업이 뿌리에 있다'
    asks:
      - '본문의 예시: 힙을 담은 배열에서 3번 칸 원소의 부모와 자식은 몇 번 칸인가 (부모 1번, 자식 7번과 8번)'
      - '옮긴 상황: 배열 `[2, 5, 3, 9, 6]`는 힙의 규칙을 지키나. 지키면 `peek`은 무엇인가 (지킨다. 2)'
    body:
      - p: '**우선순위 큐**는 넣은 순서와 상관없이 우선순위가 가장 높은 것을 먼저 꺼내는 큐예요. 자바의 `PriorityQueue`는 **가장 작은 것**이 가장 높아요. 배송 작업이라면 마감 시각으로 비교하게 해서, 마감이 가장 이른 작업을 먼저 꺼내요.'
      - code: task
        notes:
          - mark: Task::deadline
            as: code
            text: '마감 시각이 이른 것이 "작은 것"이에요. 그래서 마감이 가장 이른 작업이 먼저 나와요.'
      - h3: 힙은 부모가 자식보다 작다는 것만 지켜요
      - p: '`PriorityQueue`는 원소를 **힙**에 담아요([API 문서](link:pq)). 힙의 규칙은 하나예요. **어느 노드든 자식보다 작거나 같아요.** 그러면 가장 작은 값은 늘 맨 위, 뿌리에 있어요. 예측의 다섯 수를 넣은 힙이 이 모양이에요.'
      - code: heapTree
      - p: '이진 탐색 트리와 다른 점이 있어요. 이진 탐색 트리는 왼쪽은 작고 오른쪽은 크다는 **전체 순서**를 지켰어요. 힙은 **부모와 자식 사이만** 봐요. 위 그림에서 왼쪽의 5가 오른쪽의 4보다 커도 괜찮아요. 정렬을 다 하지 않고 "가장 작은 것이 맨 위"만 지키니 할 일이 적어요.'
      - h3: 빈틈없이 채우니 배열에 담아요
      - p: '힙은 위층부터, 한 층 안에서는 왼쪽부터 **빈틈없이** 채워요. 이런 트리를 완전 이진 트리라고 해요. 그래서 층 순서대로 배열에 담으면 빈칸이 없어요. 위 그림은 배열 `[1, 2, 4, 5, 3]`이에요.'
      - code: index
      - p: '노드에 자식을 가리키는 참조를 두지 않고, i번 칸의 자식과 부모를 계산으로 찾아요. 1번 칸(2)의 자식은 3번 칸(5)과 4번 칸(3)이에요. `PriorityQueue`도 안에 이런 배열 하나를 가져요. 가장 작은 값을 보는 `peek`은 0번 칸을 읽을 뿐이라 **O(1)**이에요.'
      - quiz:
          q: '힙을 담은 배열에서 3번 칸 원소의 부모는 몇 번 칸일까요?'
          options:
            - '1번'
            - '2번'
            - '6번'
          answer: 1
          explain: '부모는 `(i - 1) / 2`예요. `(3 - 1) / 2`는 1이에요. 3번 칸의 자식은 7번과 8번 칸이에요.'
      - next: '가장 작은 것이 맨 위에 있으려면, 넣고 꺼낼 때마다 무언가를 해야 해요. 무엇을 할까요?'
    recall: '부모가 늘 자식보다 작거나 같은 트리, 힙에 담아서 가장 작은 값이 늘 뿌리에 있게 해요. 형제끼리는 순서를 지키지 않아요. 힙은 위층부터 왼쪽부터 빈틈없이 채워서 배열 하나에 담고, i번 칸의 자식은 2i + 1과 2i + 2, 부모는 (i - 1) / 2예요. 뿌리는 0번 칸이라 `peek`은 O(1)이에요.'
  - id: q2
    title: 넣고 꺼낼 때 힙은 어떻게 규칙을 지키나요?
    conclusion:
      lead: '넣을 때는 맨 끝에 두고 부모보다 작은 동안 위로 올리고, 꺼낼 때는 맨 끝 원소를 뿌리로 옮긴 뒤 더 작은 자식과 바꾸며 아래로 내려요.'
      sub: '움직이는 칸 수가 트리의 높이를 넘지 않고, 빈틈없이 채운 트리의 높이는 log₂ n 남짓이라 둘 다 O(log n)이에요.'
    says:
      - '넣기. 새 원소를 배열의 맨 끝(트리의 맨 아래 가장 오른쪽)에 둔다. 부모보다 작으면 부모와 자리를 바꾼다. 부모보다 크거나 같아지거나 뿌리에 닿으면 멈춘다. 코드 predict의 다섯 번을 한 단계씩 따라간다'
      - '꺼내기. 뿌리(가장 작은 값)를 꺼낸다. 맨 끝 원소를 뿌리로 옮긴다. 두 자식 가운데 더 작은 쪽보다 크면 그 자식과 바꾼다. 자식이 없거나 둘보다 작거나 같아지면 멈춘다'
      - '더 작은 자식과 바꾸는 이유. 큰 자식과 바꾸면 그 큰 자식이 부모가 되어 작은 자식보다 커지고 규칙이 깨진다'
      - '높이. 빈틈없이 채우므로 원소 100만 개의 힙은 20층이다. 이진 탐색 트리처럼 넣는 순서 때문에 치우치지 않는다. 넣기와 꺼내기에서 자리를 바꾼 횟수를 세어, 100만 개에서도 20번을 넘지 않는 것을 보인다(테스트에서는 최대 19번)'
      - '정렬된 리스트로 우선순위 큐를 만들면 꺼내기는 O(1)이지만 넣을 때 자리를 찾아 밀어야 해 O(n)이다. 힙은 둘 다 O(log n)으로 맞춘다'
    widget:
      kind: steps
      note: '위에는 트리 그림, 아래에는 같은 내용의 배열을 둔다. 코드 predict의 offer 다섯 번(5, 1, 4, 2, 3)을 한 단계씩 실행하고, 올라가며 자리를 바꾸는 원소를 강조한다. 이어서 poll 한 번: 뿌리 1을 꺼내고, 맨 끝 원소를 뿌리로 옮기고, 더 작은 자식과 바꾸며 내려간다. 배열의 숫자는 검증 테스트가 읽은 실제 배열과 같아야 한다'
    asks:
      - '본문의 예시: 힙 배열 `[1, 2, 4, 5, 3]`에 0을 넣으면 0은 몇 번 자리를 바꾸고 어디에 놓이나 (2번. 4와 바꾸고 1과 바꿔 0번 칸)'
      - '옮긴 상황: 원소 1천 개가 든 힙에서 `poll` 한 번에 자리를 바꾸는 횟수는 최대 몇 번 남짓인가 (9번 남짓. 높이가 10층 남짓이다)'
    body:
      - p: '넣기는 **아래에서 위로**, 꺼내기는 **위에서 아래로** 한 줄만 고쳐요.'
      - ul:
          - '**넣기(`offer`):** 새 원소를 배열의 맨 끝, 트리의 맨 아래 가장 오른쪽에 둬요. 부모보다 작으면 부모와 자리를 바꾸고, 다시 새 부모와 비교해요. 부모보다 크거나 같아지거나 뿌리에 닿으면 멈춰요.'
          - '**꺼내기(`poll`):** 뿌리를 꺼내요. 빈 뿌리에 맨 끝 원소를 옮겨요. 두 자식 가운데 **더 작은 쪽**보다 크면 그 자식과 바꾸고, 다시 아래와 비교해요.'
      - p: '코드 predict를 한 단계씩 실행해 보세요. 숫자는 테스트가 `PriorityQueue`에서 읽은 실제 배열과 같아요.'
      - widget:
          kind: steps
          layout: [duo, log, buttons, verdict]
          initial:
            duo:
              - {label: 트리(층마다), state: dim, text: 비어 있음}
              - {label: 배열, state: dim, text: '[]'}
          scenarios:
            default:
              - log: 'offer(5): 비어 있어 뿌리가 됨'
                duo:
                  - label: 트리(층마다)
                    rows: [{k: 1층, v: '5', mark: changed}]
                  - label: 배열
                    rows: [{k: 칸, v: '[5]'}]
              - log: 'offer(1): 1번 칸에 두고, 부모 5보다 작아 바꿈'
                duo:
                  - label: 트리(층마다)
                    rows: [{k: 1층, v: '1', mark: changed}, {k: 2층, v: '5', mark: changed}]
                  - label: 배열
                    rows: [{k: 칸, v: '[1, 5]'}, {k: 자리 바꿈, v: '1번'}]
              - log: 'offer(4): 2번 칸에 두고, 부모 1보다 커서 멈춤'
                duo:
                  - label: 트리(층마다)
                    rows: [{k: 1층, v: '1'}, {k: 2층, v: '5, 4', mark: changed}]
                  - label: 배열
                    rows: [{k: 칸, v: '[1, 5, 4]'}, {k: 자리 바꿈, v: '0번'}]
              - log: 'offer(2): 3번 칸에 두고, 부모 5보다 작아 바꿈. 새 부모 1보다 커서 멈춤'
                duo:
                  - label: 트리(층마다)
                    rows: [{k: 1층, v: '1'}, {k: 2층, v: '2, 4', mark: changed}, {k: 3층, v: '5', mark: changed}]
                  - label: 배열
                    rows: [{k: 칸, v: '[1, 2, 4, 5]'}, {k: 자리 바꿈, v: '1번'}]
              - log: 'offer(3): 4번 칸에 두고, 부모 2보다 커서 멈춤'
                duo:
                  - label: 트리(층마다)
                    rows: [{k: 1층, v: '1'}, {k: 2층, v: '2, 4'}, {k: 3층, v: '5, 3', mark: changed}]
                  - label: 배열
                    rows: [{k: 칸, v: '[1, 2, 4, 5, 3]'}, {k: 자리 바꿈, v: '0번'}]
              - log: 'poll(): 뿌리 1을 꺼내고, 맨 끝 3을 뿌리로 옮김'
                duo:
                  - label: 트리(층마다)
                    rows: [{k: 1층, v: '3', mark: bad}, {k: 2층, v: '2, 4'}, {k: 3층, v: '5'}]
                  - label: 배열
                    rows: [{k: 꺼낸 값, v: '1', mark: changed}, {k: 칸, v: '[3, 2, 4, 5]'}]
              - log: '자식 2와 4 가운데 작은 2보다 3이 커서 바꿈. 3의 자식 5보다 작아 멈춤'
                duo:
                  - label: 트리(층마다)
                    rows: [{k: 1층, v: '2', mark: changed}, {k: 2층, v: '3, 4', mark: changed}, {k: 3층, v: '5'}]
                  - label: 배열
                    rows: [{k: 칸, v: '[2, 3, 4, 5]'}, {k: 자리 바꿈, v: '1번'}]
                verdict: '꺼낸 것은 가장 작은 1이에요. 맨 끝을 뿌리로 올리고 내려 보내니, 다음으로 작은 2가 다시 뿌리에 왔어요.'
      - ci:
          key: steps
          label: PriorityQueue의 실제 배열 보기
          source: HeapPriorityQueueTest.predict
      - p: '내려갈 때 **더 작은 자식**과 바꾸는 이유가 있어요. 3을 큰 자식 4와 바꾸면 4가 부모가 되어 작은 자식 2보다 커져요. 규칙이 깨져요.'
      - h3: 움직이는 칸은 높이를 넘지 않아요
      - p: '넣기는 맨 아래에서 뿌리까지, 꺼내기는 뿌리에서 맨 아래까지 한 줄만 움직여요. 자리를 바꾸는 횟수는 **트리의 높이**를 넘지 않아요. 넣기를 코드로 쓰면 이래요.'
      - code: offerCode
        notes:
          - mark: a[(i - 1) / 2] > a[i]
            as: code
            text: '부모가 더 크면 바꾸고 한 층 올라가요. 부모가 작거나 같아지면 멈춰요.'
      - p: '힙은 빈틈없이 채우니까 **넣는 순서와 상관없이** 높이가 늘 log₂ n 남짓이에요. 이진 탐색 트리처럼 한쪽으로 치우치지 않아요. 같은 방식으로 짠 힙에서 세어 봤어요.'
      - ci:
          key: swaps
          label: 실제로 센 자리 바꿈 보기
          source: HeapPriorityQueueTest.swapsBoundedByHeight
          code: swapRun
      - p: '100만 개에서도 한 번에 최대 19번이에요. 작아지는 순서로 넣어 매번 뿌리까지 올라가도 마찬가지예요. 그래서 `offer`와 `poll`은 **O(log n)**이에요. 정렬된 리스트로 우선순위 큐를 만들면 꺼내기는 O(1)이지만 넣을 때 자리를 찾아 밀어야 해서 O(n)이에요. 힙은 둘 다 O(log n)으로 맞춰요.'
      - quiz:
          q: '힙 배열 `[1, 2, 4, 5, 3]`에 0을 넣으면 0은 자리를 몇 번 바꿀까요?'
          options:
            - '0번'
            - '2번'
            - '5번'
          answer: 2
          explain: '0은 5번 칸에 들어가요. 부모인 2번 칸의 4보다 작아 바꾸고, 다시 부모인 0번 칸의 1보다 작아 바꿔 뿌리가 돼요. 높이 3인 트리라 두 번이면 뿌리예요.'
      - next: '힙은 맨 위만 가장 작고 나머지는 정렬되어 있지 않아요. 그러면 큐를 출력하면 무엇이 보일까요?'
    recall: '넣을 때는 배열의 맨 끝에 두고 부모보다 작은 동안 부모와 바꾸며 올려요. 꺼낼 때는 뿌리를 꺼내고 맨 끝 원소를 뿌리로 옮긴 뒤, 두 자식 가운데 더 작은 쪽과 바꾸며 내려요. 움직임은 높이를 넘지 않고, 빈틈없이 채운 트리라 높이가 늘 log₂ n 남짓이니 둘 다 O(log n)이에요.'
  - id: q3
    title: PriorityQueue를 출력하면 왜 정렬되어 있지 않나요?
    conclusion:
      lead: '출력과 반복자는 안쪽 배열을 칸 순서대로 보여 주는데, 힙은 가장 작은 것이 맨 앞이라는 것만 지키고 나머지는 정렬하지 않기 때문이에요.'
      sub: '정렬된 순서는 `poll`을 되풀이해야 나와요. 힙은 가장 작은 것만 빠르니, 특정 원소를 찾거나 지우는 `contains`와 `remove(Object)`는 O(n)이에요.'
    says:
      - '예측의 답을 밝힌다. 출력은 힙 배열 그대로다. 첫 칸이 가장 작은 1인 것만 약속되어 있다. 꺼낸 것은 1이다'
      - '`for (int x : pq)`, `pq.toString()`, `pq.stream()`은 배열 순서다. API 문서에 순서를 약속하지 않는다고 적혀 있다. 정렬된 순서가 필요하면 `while (!pq.isEmpty()) pq.poll()`로 꺼낸다. 남은 것을 꺼낸 순서 1, 2, 3, 4, 5를 보인다'
      - '`contains(x)`와 `remove(x)`는 배열을 처음부터 훑는다. 형제끼리 순서가 없으니 이진 탐색처럼 좁힐 수 없다'
      - '큰 것부터 꺼내려면 `new PriorityQueue<>(Comparator.reverseOrder())`처럼 뒤집은 기준을 준다'
      - '같은 마감 시각의 작업 둘은 넣은 순서대로 나온다는 약속이 없다. 순서가 필요하면 넣은 순번을 함께 담아 두 번째 기준으로 비교한다'
    asks:
      - '본문의 예시: 코드 predict의 큐를 `for`로 돌며 출력한 순서는 꺼내는 순서와 같은가 (아니다. 배열 순서이고 첫 원소만 가장 작다는 약속이 있다)'
      - '옮긴 상황: 점수가 가장 높은 회원부터 꺼내려고 `new PriorityQueue<Integer>()`에 점수를 넣었다. 처음 꺼내는 것은 무엇이고 어떻게 고치나 (가장 낮은 점수. `Comparator.reverseOrder()`를 준다)'
    body:
      - p: '처음 예측의 답은 **`[1, 2, 4, 5, 3]`와 1**이에요. {{predict-result}}'
      - ci:
          key: predict
          label: 실제 출력 보기
          source: HeapPriorityQueueTest.predict
          code: predict
      - p: '`System.out.println(pq)`는 안쪽 **배열을 칸 순서대로** 보여 줘요. 질문 2에서 본 힙 배열 그대로예요. 힙이 약속하는 것은 "첫 칸이 가장 작다"뿐이라 1이 맨 앞인 것만 맞고 나머지는 정렬되어 있지 않아요. `for`로 돌기, `stream()`, `toArray()`도 같은 배열 순서예요. [API 문서](link:pq)도 이 순서를 약속하지 않는다고 적어요.'
      - p: '**정렬된 순서는 `poll`을 되풀이해야 나와요.** 꺼낼 때마다 다음으로 작은 값이 뿌리로 올라오니까요.'
      - code: drain
      - ci:
          key: drain
          label: 출력과 꺼낸 순서 비교하기
          source: HeapPriorityQueueTest.predict
      - h3: 가장 작은 것만 빨라요
      - p: '힙은 가장 작은 것을 꺼내는 데 맞춘 구조예요. 특정 원소가 있는지 보는 `contains(x)`와 그 원소를 지우는 `remove(x)`는 배열을 처음부터 훑어서 **O(n)**이에요. 형제끼리 순서가 없으니 이진 탐색처럼 범위를 좁힐 수 없어요.'
      - table:
          head: [연산, 비용]
          rows:
            - ['`peek()`', 'O(1)']
            - ['`offer(x)`, `poll()`', 'O(log n)']
            - ['`contains(x)`, `remove(x)`', 'O(n)']
            - ['`for`, `toString()`', '배열 순서. 정렬되지 않음']
      - h3: 큰 것부터, 같은 것끼리는
      - p: '`PriorityQueue`는 작은 것이 먼저예요. 점수가 높은 회원부터 꺼내려면 기준을 뒤집어 줘요.'
      - code: reverse
        notes:
          - mark: Comparator.reverseOrder()
            as: code
            text: '큰 값을 "작은 것"으로 보게 뒤집어요. 70, 95, 82를 넣으면 95가 먼저 나와요.'
      - p: '마감 시각이 같은 작업 둘은 **넣은 순서대로 나온다는 약속이 없어요.** 힙이 자리를 바꾸며 섞이기 때문이에요. 먼저 들어온 작업이 먼저 나와야 하면 넣은 순번을 함께 담아 두 번째 기준으로 비교해요.'
      - code: tie
        notes:
          - mark: .thenComparingLong(Task::seq)
            as: code
            text: '마감이 같으면 순번이 작은 것, 곧 먼저 넣은 것이 먼저예요.'
      - quiz:
          q: '점수가 가장 높은 회원부터 꺼내려고 `new PriorityQueue<Integer>()`에 70, 95, 82를 넣었어요. 처음 `poll()`하면 무엇이 나올까요?'
          options:
            - '95'
            - '70'
            - '82'
          answer: 2
          explain: '`PriorityQueue`는 작은 것이 먼저라 70이 나와요. 높은 점수부터 꺼내려면 `Comparator.reverseOrder()`를 줘요.'
      - next: '힙은 가장 작은 것을 빨리 버리는 데도 써요. 100만 개에서 가장 큰 10개만 구할 때 그게 어떻게 도움이 될까요?'
    recall: '출력과 반복자는 안쪽 배열을 칸 순서대로 보여 주는데, 힙은 첫 칸이 가장 작다는 것만 지켜서 나머지가 정렬되어 있지 않아요. 정렬된 순서는 `poll`을 되풀이해야 나와요. 가장 작은 것만 빠르고 `contains`와 `remove(x)`는 O(n)이에요. 큰 것부터는 `Comparator.reverseOrder()`를 주고, 같은 우선순위의 순서는 약속하지 않으니 순번을 두 번째 기준으로 둬요.'
  - id: q4
    title: 상위 k개를 구할 때 힙은 왜 정렬보다 나은가요?
    conclusion:
      lead: '크기 k인 최소 힙만 유지하면 되어서, 원소 n개를 O(n log k)에 훑고 메모리는 k개만 써요.'
      sub: '힙의 뿌리는 지금까지의 상위 k개 가운데 가장 작은 값이라, 새 값이 그보다 작으면 바로 버리고 크면 뿌리를 빼고 넣어요.'
    says:
      - '코드 topK. 점수 100만 개에서 상위 10개를 구한다. 작은 것이 먼저인 힙에 넣고 크기가 k를 넘으면 가장 작은 것을 뺀다. 끝나면 힙에 가장 큰 k개가 남는다'
      - '비용. 원소마다 넣고 빼기가 O(log k)다. 전체 O(n log k)다. k가 10이면 log k는 4 남짓이라 거의 O(n)이다. 전부 정렬하면 O(n log n)이고 n개를 다 담아야 한다'
      - '같은 점수로 정렬해 앞의 10개를 자른 결과와 같은 것을 테스트로 보인다. 걸린 시간도 실측값으로 나란히 둔다'
      - '최소 힙을 쓰는 것이 핵심이다. 상위 k개를 남기려면 "지금 남긴 것 가운데 가장 작은 것"을 빨리 버려야 하기 때문이다'
      - '더 알아보기: 힙에서 하나씩 꺼내면 정렬이 된다. 힙 정렬이고 O(n log n)이며 더 쓰는 메모리가 없다. 배열 전체를 한 번에 힙으로 만드는 것은 하나씩 넣는 것보다 빠른 O(n)이다. `new PriorityQueue<>(collection)`이 이렇게 만든다'
    asks:
      - '본문의 예시: 코드 topK에서 k가 3이고 점수가 7, 2, 9, 4, 8 순서로 오면, 끝났을 때 큐에 남는 점수는 무엇인가 (7, 8, 9)'
      - '옮긴 상황: 상품 1천만 개 가운데 가장 싼 상품 5개를 구한다. 크기 5의 힙은 작은 것이 먼저인 것과 큰 것이 먼저인 것 가운데 무엇을 써야 하나 (큰 것이 먼저인 힙. 남긴 다섯 개 가운데 가장 비싼 것을 빨리 버려야 한다)'
      - '실무 구역: 코드 mutable에서 c의 `priority`를 1로 바꾼 뒤 `poll`하면 무엇이 나오나 (b. c는 바꾸기 전의 자리에 그대로 있어 뿌리가 아니다)'
    body:
      - p: '점수 100만 개에서 가장 높은 10개를 구해요. 전부 정렬하고 앞의 10개를 자르면 O(n log n)이고 100만 개를 모두 들고 있어야 해요. 힙으로는 이렇게 해요.'
      - code: topK
        notes:
          - mark: top.size() > k
            as: code
            text: '힙이 k개를 넘으면 가장 작은 것을 버려요. 끝까지 훑으면 가장 큰 k개만 남아요.'
      - p: '**작은 것이 먼저인 힙**을 쓰는 것이 핵심이에요. 뿌리는 지금까지 남긴 k개 가운데 **가장 작은 값**, 곧 "상위 k개에 들기 위한 문턱"이에요. 새 값이 문턱보다 작으면 넣었다가 바로 빠지고, 크면 문턱을 밀어내고 들어가요.'
      - p: '원소마다 크기 k인 힙에 넣고 빼니 O(log k)이고, 전체는 **O(n log k)**예요. k가 10이면 log k는 4 남짓이라 거의 한 번 훑는 비용이에요. 메모리도 k개만 써요. 같은 점수로 두 방법을 돌려 봤어요.'
      - ci:
          key: topk
          label: 실제 결과와 걸린 시간 보기
          source: HeapPriorityQueueTest.topK
      - p: '결과는 같고 힙이 몇 배 빨랐어요. 걸린 시간은 실행하는 기계에 따라 달라요.'
      - p: '반대로 **가장 작은 k개**를 구하려면 큰 것이 먼저인 힙(`Comparator.reverseOrder()`)을 써요. 남긴 k개 가운데 가장 큰 것을 빨리 버려야 하니까요.'
      - more:
          summary: '더 알아보기: 힙 정렬과 한 번에 힙 만들기'
          body:
            - ul:
                - '힙에서 하나씩 모두 꺼내면 정렬된 순서가 나와요. 이것이 **힙 정렬**이에요. O(n log n)이고, 배열 안에서 자리만 바꿔 더 쓰는 메모리가 없어요.'
                - '배열 전체를 한 번에 힙으로 만드는 것은 하나씩 넣는 O(n log n)보다 빠른 **O(n)**이에요. 아래층의 노드는 내려갈 칸이 적어서 합이 n에 비례해요. `new PriorityQueue<>(collection)`이 이렇게 만들어요.'
      - quiz:
          q: '코드 topK에서 k가 3이고 점수가 7, 2, 9, 4, 8 순서로 와요. 끝났을 때 큐에 남는 점수는?'
          options:
            - '2, 4, 7'
            - '7, 8, 9'
            - '7, 2, 9'
          answer: 2
          explain: '7, 2, 9를 넣고 4를 넣으면 크기가 4라 가장 작은 2를 빼요. 8을 넣으면 가장 작은 4를 빼요. 가장 큰 세 개 7, 8, 9가 남아요.'
    recall: '크기 k인 최소 힙만 유지해요. 뿌리는 지금까지 남긴 k개 가운데 가장 작은 값이라, 새 값을 넣고 k개를 넘으면 뿌리를 빼요. 원소마다 O(log k)라 전체 O(n log k)이고 메모리는 k개만 써요. 전부 정렬하는 O(n log n)보다 적어요. 가장 작은 k개는 큰 것이 먼저인 힙으로 구해요.'
practice:
  title: 실무에서는 이렇게 만나요
  says:
    - '스레드 풀의 예약 실행. `ScheduledThreadPoolExecutor`는 "10초 뒤에 실행", "1분마다 실행" 같은 작업을 실행할 시각 순으로 담는 큐를 가진다. 큐의 맨 앞이 가장 이른 작업인 것과 스프링의 `ThreadPoolTaskScheduler`가 안에 이 실행기를 둔 것을 테스트로 확인한다. 큐가 힙이라는 것은 API 문서가 아니라 OpenJDK 21의 구현(`DelayedWorkQueue`)이다. 스프링 부트가 `@Scheduled`에 스레드 하나짜리 `ThreadPoolTaskScheduler`를 만든다는 것은 스프링 부트 문서 근거'
    - '흔한 실수: 큐에 넣은 뒤 객체의 우선순위 필드를 바꾼다(코드 mutable). 힙은 넣을 때와 꺼낼 때만 규칙을 맞춘다. 필드가 바뀐 것을 알 방법이 없어 그 원소는 옛 자리에 남는다. c를 가장 급하게 바꿨는데 b가 먼저 나온다. 고친 코드: `jobs.remove(c)`로 꺼내고, 바꾸고, `jobs.offer(c)`로 다시 넣는다. `remove(Object)`는 O(n)이다. 자주 바꾼다면 우선순위를 불변으로 두고 새 객체를 넣는다. 고치기 전후의 출력을 테스트로 남긴다'
    - '같은 이유로 `TreeSet`이나 `HashMap`의 키도 넣은 뒤 비교에 쓰는 필드를 바꾸면 안 된다(J6, K8). 컬렉션은 넣을 때 자리를 정하고 나중에 바뀐 것을 모른다'
  body:
    - h3: '@Scheduled 뒤의 우선순위 큐'
    - p: '스프링에서 주기적인 작업은 `@Scheduled`로 써요. 스프링 부트는 이 작업들을 돌릴 `ThreadPoolTaskScheduler`를 만들고, 기본으로 **스레드 하나**를 써요([스프링 부트 문서](link:boot)).'
    - code: scheduled
    - p: '`ThreadPoolTaskScheduler` 안에는 자바의 `ScheduledThreadPoolExecutor`가 있고, 그 실행기는 작업을 **실행할 시각 순으로** 담는 큐를 가져요. 30초, 10초, 20초 뒤의 작업을 차례로 넣고 큐의 맨 앞을 봤어요.'
    - ci:
        key: scheduled
        label: 실제 결과 보기
        source: HeapPriorityQueueTest.scheduledQueue
    - p: '나중에 넣은 10초짜리가 맨 앞이에요. 실행기는 맨 앞 작업의 시각이 될 때까지 기다렸다가 꺼내요. 이 큐(`DelayedWorkQueue`)는 OpenJDK 21의 구현에서 이 레슨의 힙과 같은 배열 힙이에요. [API 문서](link:stpe)는 구현을 약속하지 않아서, 여기서는 순서만 테스트로 확인했어요.'
    - p: '스레드가 하나라 작업 하나가 오래 걸리면 다음 작업은 시각이 되어도 기다려요. 작업이 여럿이면 스레드 수를 늘려요.'
    - code: schedulerProp
    - h3: '흔한 실수: 큐에 든 객체의 우선순위를 바꾸기'
    - p: '작업 a(5), b(3), c(8)을 넣은 뒤, c가 급해져 우선순위를 1로 바꿨어요. 다음에 꺼내는 것은 c일까요?'
    - code: mutable
      notes:
        - mark: c.priority = 1
          as: code
          text: '큐는 이 변경을 몰라요. 힙은 `offer`와 `poll` 때만 자리를 맞추니, c는 8일 때의 자리에 그대로 있어요.'
    - code: mutableFixed
      notes:
        - mark: remove(c)
          as: code
          text: '먼저 꺼내요. `remove(Object)`는 배열을 훑어서 O(n)이에요.'
        - mark: offer(c)
          as: code
          text: '바꾼 뒤 다시 넣으면 새 우선순위로 올라가 자리를 찾아요.'
    - ci:
        key: mutable
        label: 고치기 전후의 실제 결과 보기
        source: HeapPriorityQueueTest.mutablePriority
    - p: '고치기 전에는 b가 나왔어요. 우선순위를 자주 바꾼다면 필드를 고치지 말고, 우선순위를 불변으로 둔 새 객체를 넣고 옛것은 꺼낼 때 건너뛰는 방법도 써요.'
    - muted: '같은 이유로 `TreeSet`의 원소나 `HashMap`의 키도 넣은 뒤 비교나 `hashCode`에 쓰는 필드를 바꾸면 안 돼요(equals와 hashCode 레슨, 이진 탐색 트리 레슨). 컬렉션은 넣을 때 자리를 정하고, 나중에 바뀐 것은 몰라요.'
interview:
  question: 우선순위 큐는 어떻게 동작하고, 언제 쓰나요?
  model:
    - label: 정의
      text: 넣은 순서와 상관없이 우선순위가 가장 높은 것을 먼저 꺼내는 큐입니다. 자바의 PriorityQueue는 힙으로 만들어져 가장 작은 것이 먼저 나옵니다.
    - label: 원리
      text: 힙은 부모가 자식보다 작거나 같다는 규칙만 지키는 완전 이진 트리라 배열에 담고, 가장 작은 값이 0번 칸에 있습니다. 넣을 때는 끝에 두고 올리고, 꺼낼 때는 끝 원소를 뿌리로 옮겨 내리므로 둘 다 O(log n), peek은 O(1)입니다.
    - label: 주의할 점
      text: 출력이나 반복자는 배열 순서라 정렬되어 있지 않고, contains와 remove(Object)는 O(n)입니다. 큐에 든 객체의 우선순위 필드를 바꾸면 자리가 갱신되지 않으니 꺼내서 바꾸고 다시 넣습니다. 상위 k개는 크기 k의 최소 힙으로 O(n log k)에 구합니다.
    - label: 경험
      text: '(내 프로젝트로 채우기) 예: 랭킹 상위 100명을 전체 정렬하던 배치를 크기 100의 힙으로 바꿔 메모리와 시간을 줄였습니다.'
verified: 이 레슨의 배열과 자리 바꿈 횟수, 걸린 시간은 짐작이 아니라 자바 21에서 `PriorityQueue`와 같은 방식으로 짠 힙을 돌려 받은 값이에요. 코드가 바뀔 때마다 테스트([HeapPriorityQueueTest](link:test))가 다시 돌아요.
footer: '근거: `PriorityQueue`가 힙이라는 것, 반복자가 순서를 약속하지 않는다는 것, 연산의 비용은 [API 문서](link:pq), 예약 실행기는 [ScheduledThreadPoolExecutor API 문서](link:stpe), 스프링 부트의 스케줄러 기본값은 [스프링 부트 문서](link:boot). 결과는 OpenJDK 21과 스프링 6.2에서 테스트로 확인했어요. 오류는 [GitHub 이슈](https://github.com/wanja727/dev-lessons/issues)로 알려 주세요.'
claims:
  - claim: '코드 predict의 첫 줄은 힙 배열이고 첫 원소는 1이며, 둘째 줄은 1이다'
    how: '실행해 출력을 본다. 배열은 [1, 2, 4, 5, 3]이라 설계 때의 보기와 같았다. poll 뒤에는 [2, 3, 4, 5]'
    test: HeapPriorityQueueTest.predict
  - claim: '[1, 2, 4, 5, 3]에 0을 넣으면 자리를 두 번 바꿔 0번 칸에 간다'
    how: '직접 짠 힙으로 자리 바꿈을 센다'
    test: HeapPriorityQueueTest.offerZero
  - claim: '`PriorityQueue`의 안쪽 배열은 언제나 `a[(i - 1) / 2] <= a[i]`를 지킨다'
    how: '무작위로 넣고 꺼내기를 되풀이하며 `toArray()`로 규칙을 검사한다'
    test: HeapPriorityQueueTest.heapInvariant
  - claim: '원소 100만 개의 힙에서 넣기와 꺼내기 한 번의 자리 바꿈은 20번을 넘지 않는다'
    how: '같은 알고리즘의 힙을 직접 짜서 센다. 최대 19번. `PriorityQueue`의 poll 한 번 비교는 최대 38번'
    test: HeapPriorityQueueTest.swapsBoundedByHeight
  - claim: '남은 원소를 `poll`로 꺼내면 1, 2, 3, 4, 5 순서다'
    how: '꺼낸 순서를 모은다'
    test: HeapPriorityQueueTest.predict
  - claim: '`Comparator.reverseOrder()`를 주면 가장 큰 것이 먼저 나온다'
    how: '같은 값으로 꺼낸 순서를 본다'
    test: HeapPriorityQueueTest.reverse
  - claim: '코드 topK는 정렬한 뒤 앞의 k개를 자른 결과와 같은 원소를 남긴다'
    how: '무작위 점수 100만 개로 두 결과를 비교하고 걸린 시간을 남긴다'
    test: HeapPriorityQueueTest.topK
  - claim: '코드 mutable은 b를 출력하고, 꺼내서 바꾸고 다시 넣으면 c를 출력한다'
    how: '두 코드를 실행한다'
    test: HeapPriorityQueueTest.mutablePriority
  - claim: '`ScheduledThreadPoolExecutor`의 큐는 실행 시각이 가장 이른 작업을 맨 앞에 두고, 스프링의 `ThreadPoolTaskScheduler`는 안에 이 실행기를 둔다'
    how: '30초, 10초, 20초 작업을 넣고 큐의 맨 앞을 본다. 설계 때 "API 문서가 힙이라고 적는다"고 했지만 API 문서에는 없어서, 힙은 OpenJDK의 구현이라고 고쳐 적었다'
    test: HeapPriorityQueueTest.scheduledQueue
sources:
  - '`PriorityQueue`의 순서, 반복자가 순서를 약속하지 않는다는 것, 연산의 비용: API 문서 https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/PriorityQueue.html'
  - '`ScheduledThreadPoolExecutor`: API 문서 https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/concurrent/ScheduledThreadPoolExecutor.html'
  - '스프링 부트의 `ThreadPoolTaskScheduler` 기본값: 스프링 부트 문서 https://docs.spring.io/spring-boot/reference/features/task-execution-and-scheduling.html'
