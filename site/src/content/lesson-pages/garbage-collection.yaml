predict:
  title: 서로를 가리키는 두 객체는 치워질까요?
  text: '두 주문 객체는 `partner` 필드로 서로를 가리켜요. 마지막 두 줄에서 변수 `a`와 `b`에 null을 넣었어요. 이 두 객체를 가비지 컬렉터가 치울 수 있을까요? 모르는 게 정상이니 감으로 골라 보세요. 답은 질문 1에 나와요.'
  code: predict
  label: 내 예측
  options:
    - value: cannot
      label: 서로를 가리키고 있어서 치울 수 없다
    - value: can
      label: 둘 다 치울 수 있다
    - value: one
      label: 하나만 치울 수 있다
  answer: can
  storageKey: gc-predict
  wrong: 예측은 "{label}"이었어요. 틀린 예측이 더 오래 남으니 괜찮아요.
questions:
  - id: q1
    title: 가비지 컬렉터는 어떤 객체를 치우나요?
    conclusion:
      lead: '프로그램이 더는 닿을 수 없는 객체를 치워요.'
      sub: '실행 중인 메서드의 지역 변수와 static 필드에서 출발해 참조를 따라갔을 때 닿지 않는 객체가 그 대상이에요.'
    says:
      - '출발점을 GC 루트라고 한다. 대표적인 것이 각 스레드의 스택에 있는 지역 변수와 매개변수, 그리고 static 필드다. J14에서 본 스택과 메서드 영역 쪽에서 힙으로 들어가는 참조들이다'
      - '루트에서 참조를 따라가며 만나는 객체에 표시한다. 그 객체의 필드가 가리키는 객체도 따라간다. 표시되지 않은 객체가 닿을 수 없는 객체이고 치울 대상이다'
      - '코드 roots. `handle()`이 끝나면 프레임이 사라진다. `temp`가 가리키던 객체는 닿을 길이 없어져 치울 대상이 된다. `saved`가 가리키던 객체는 static 필드 `history`의 리스트에서 닿으므로 남는다'
      - '코드 predict. 참조의 개수를 세는 방식이라면 두 객체는 서로가 하나씩 가리키고 있어 영원히 치워지지 않는다. 자바는 그렇게 하지 않는다. `a`와 `b`가 null이 된 뒤 루트에서 두 객체로 가는 길이 없으므로 둘 다 치울 대상이다. 예측의 답을 밝힌다'
      - '확인하는 방법. 객체를 약한 참조(`WeakReference`)로 따로 지켜본다. 약한 참조는 닿을 수 있는지 계산에 들어가지 않는다. GC가 돈 뒤 약한 참조가 비었으면 그 객체는 치워진 것이다. 서로를 가리키는 두 객체와 static 리스트에 든 객체로 돌려 본다'
      - '객체가 닿을 수 없게 되는 때: 메서드가 끝나 지역 변수가 사라질 때, 변수에 다른 것이나 null을 대입할 때, 컬렉션에서 뺄 때. 지역 변수에 일부러 null을 넣을 필요는 거의 없다. 메서드가 끝나면 사라진다'
      - '치우는 시점은 JVM이 정한다. 닿을 수 없게 된 순간에 바로 치워지지 않는다'
      - '더 알아보기: `System.gc()`는 "치워 달라"는 요청이고 JVM이 따를 의무가 없다. 운영 코드에서 부르지 않는다. 객체가 치워질 때 불리던 `finalize`는 쓰지 않게 됐다. 자원은 J10의 try-with-resources로 닫는다'
    asks:
      - '본문의 예시: 코드 roots의 `handle()`을 한 번 부르고 끝난 뒤, `temp`가 가리키던 객체와 `saved`가 가리키던 객체 가운데 치울 대상은 무엇인가 (`temp`가 가리키던 객체만. `saved`의 객체는 static 리스트에서 닿는다)'
      - '옮긴 상황: 노드 셋이 A는 B를, B는 C를, C는 A를 가리키는 고리를 이룬다. 지역 변수 `head`가 A를 가리키고 있다가 `head = null;`이 됐고, 이 노드들을 가리키는 다른 변수는 없다. 치울 대상은 몇 개인가 (셋 다. 루트에서 닿는 길이 없다)'
    body:
      - p: '가비지 컬렉터는 프로그램이 **더는 닿을 수 없는** 객체를 치워요. 닿을 수 있는지는 출발점에서 참조를 따라가 봐서 정해요.'
      - ul:
          - '**출발점(GC 루트).** 각 스레드의 스택에 있는 지역 변수와 매개변수, 그리고 static 필드가 대표예요. JVM 메모리 구조 레슨에서 본 스택과 메서드 영역 쪽에서 힙으로 들어가는 참조들이에요.'
          - '**따라가며 표시.** 루트가 가리키는 객체에 표시하고, 그 객체의 필드가 가리키는 객체도 따라가 표시해요. 끝까지 따라간 뒤 표시되지 않은 객체가 치울 대상이에요.'
      - code: roots
        notes:
          - mark: temp
            as: code
            text: '`handle()`의 프레임에만 있어요. 메서드가 끝나면 이 객체로 가는 길이 사라져요.'
          - mark: history.add(saved);
            as: code
            text: 'static 필드의 리스트가 가리켜요. 메서드가 끝나도 루트에서 닿아요.'
      - p: '`handle()`을 부르고 끝난 뒤 두 객체를 약한 참조(`WeakReference`)로 지켜봤어요. 약한 참조는 닿을 수 있는지 계산에 들어가지 않아서, GC 뒤에 약한 참조가 비었으면 그 객체는 치워진 거예요.'
      - ci:
          key: roots
          label: 실제 결과 보기
          source: GarbageCollectionTest.rootsDecide
          code: rootsRun
      - h3: 서로를 가리켜도 치워져요
      - p: '처음 예측의 답은 **둘 다 치울 수 있다**예요. {{predict-result}}'
      - ci:
          key: predict
          label: 실제 결과 보기
          source: GarbageCollectionTest.cycleCollected
          code: predict
      - p: '가비지 컬렉터가 "몇 개가 가리키는가"를 세는 방식이라면, 두 객체는 서로가 하나씩 가리키고 있어 영원히 남았을 거예요. 자바는 그렇게 하지 않고 **루트에서 닿는 길**이 있는지만 봐요. `a`와 `b`가 null이 된 뒤 루트에서 두 객체로 가는 길이 없으니 둘 다 치울 대상이에요.'
      - h3: 객체가 닿을 수 없게 되는 때
      - ul:
          - '메서드가 끝나 지역 변수가 사라질 때. 그래서 지역 변수에 일부러 null을 넣을 필요는 거의 없어요.'
          - '변수에 다른 객체나 null을 대입할 때.'
          - '컬렉션에서 뺄 때.'
      - p: '닿을 수 없게 된 순간에 바로 치워지지는 않아요. **언제 치울지는 JVM이 정해요.**'
      - muted: '위의 결과는 HotSpot에서 `System.gc()`를 거듭 요청하며 확인한 거예요. 명세는 `System.gc()`가 곧바로 치운다고 보장하지 않아요.'
      - more:
          summary: '더 알아보기: System.gc()와 finalize'
          body:
            - p: '`System.gc()`는 "치워 달라"는 **요청**이고, JVM이 따를 의무가 없어요([API 문서](link:systemGc)). 운영 코드에서는 부르지 않아요. 객체가 치워질 때 불리던 `finalize`는 언제 불릴지 알 수 없어서 쓰지 않게 됐고 없애는 중이에요([JEP 421](link:jep421)). 파일이나 연결 같은 자원은 예외 레슨의 try-with-resources로 닫아요.'
      - quiz:
          q: '노드 셋이 A→B→C→A로 고리를 이뤄요. 지역 변수 `head`가 A를 가리키다가 `head = null;`이 됐고, 다른 변수는 이 노드들을 가리키지 않아요. 치울 대상은 몇 개일까요?'
          options:
            - 0개. 고리라서 서로 가리킨다
            - 1개. A만
            - 3개. 셋 다
          answer: 3
          explain: '루트에서 A, B, C로 가는 길이 없어요. 서로 가리키는 것은 상관없어요.'
      - next: '가비지 컬렉터가 힙의 모든 객체를 매번 따라가 본다면 힙이 클수록 오래 걸리겠죠. JVM은 이 일을 어떻게 줄일까요?'
    recall: '프로그램이 더는 닿을 수 없는 객체를 치워요. 스택의 지역 변수와 static 필드 같은 GC 루트에서 참조를 따라가 닿지 않는 객체가 대상이에요. 몇 개가 가리키는지를 세지 않아서, 서로를 가리키는 객체들도 루트에서 닿지 않으면 치워져요. 언제 치울지는 JVM이 정하고 `System.gc()`는 요청일 뿐이에요.'
  - id: q2
    title: 힙을 왜 세대로 나눠서 치우나요?
    conclusion:
      lead: '대부분의 객체는 만들어지고 금방 쓸모없어지기 때문에, 새 객체가 모인 좁은 곳만 자주 치우면 적은 일로 많은 공간을 되찾을 수 있어요.'
      sub: '새 객체는 젊은 세대에 놓이고, 여러 번의 수집에서 살아남은 객체만 늙은 세대로 옮겨져요.'
    says:
      - '요청 하나를 처리하며 만든 DTO, 문자열, 리스트는 응답을 보내고 나면 대부분 닿을 수 없다. 반대로 스프링의 빈이나 캐시에 든 객체는 서버가 꺼질 때까지 산다. 수명이 둘로 갈린다'
      - '힙 전체를 매번 훑으면 오래 사는 객체를 볼 때마다 다시 확인하는 낭비가 생긴다. 그래서 나눈다. 새 객체는 젊은 세대(young)에, 오래 산 객체는 늙은 세대(old)에 둔다'
      - '젊은 세대는 에덴과 서바이버로 나뉜다. `new`는 에덴에 놓는다. 에덴이 차면 젊은 세대만 치우는 수집이 돈다(마이너 GC). 살아 있는 객체만 서바이버로 복사하고 에덴을 통째로 비운다. 살아 있는 것이 적어서 빨리 끝난다'
      - '객체는 수집에서 살아남을 때마다 나이를 먹는다. 나이가 기준을 넘으면 늙은 세대로 옮겨진다(승격)'
      - '늙은 세대가 차면 더 큰 수집이 돈다. 힙 전체를 대상으로 하는 수집을 풀 GC라고 하고 훨씬 오래 걸린다'
      - '살아 있는 객체를 한쪽으로 옮기면 빈 곳이 한 덩어리로 모인다. 그래서 다음 `new`가 빈자리를 찾아다니지 않고 바로 놓인다. 자바에서 객체를 만드는 것이 싼 이유다'
      - '실제로 본다. 금방 버리는 객체를 많이 만든 뒤 JVM이 알려 주는 수집 횟수를 읽으면 젊은 세대의 수집 횟수가 늘어 있다. GC 로그 한 줄을 붙이고 읽는다'
    widget:
      kind: steps
      note: '두 칸에 "젊은 세대(에덴, 서바이버)"와 "늙은 세대"를 둔다. 단계: 요청 처리로 에덴에 객체 여섯이 생김(그 가운데 하나는 캐시에 넣어 계속 닿음), 에덴이 참, 마이너 GC로 닿는 하나만 서바이버로 옮겨지고 에덴이 비워짐, 다음 요청들로 에덴이 다시 참, 마이너 GC를 거듭하며 그 객체의 나이가 오름, 기준을 넘어 늙은 세대로 승격. 로그에는 단계마다 "치운 객체 수"와 "옮긴 객체 수"를 적는다. 숫자는 설명을 위한 것이고 실제 크기가 아니라는 말을 위젯 위에 적는다'
    asks:
      - '본문의 예시: 에덴에 객체 여섯이 있고 그 가운데 하나만 닿을 수 있다. 마이너 GC가 돈 직후 에덴과 서바이버에 있는 객체는 각각 몇 개인가 (에덴 0개, 서바이버 1개)'
      - '옮긴 상황: 요청마다 응답 DTO를 만들어 보내고 버리는 서버와, 요청마다 만든 객체를 static 리스트에 담아 두는 서버가 있다. 시간이 지날수록 늙은 세대의 사용량이 계속 오르는 쪽은 어느 것인가 (static 리스트에 담는 서버. 살아남은 객체가 승격되어 쌓인다)'
    body:
      - p: '서버가 만드는 객체는 수명이 둘로 갈려요.'
      - ul:
          - '**금방 죽는 것.** 요청 하나를 처리하며 만든 DTO, 문자열, 리스트는 응답을 보내고 나면 대부분 닿을 수 없어요.'
          - '**오래 사는 것.** 스프링의 빈이나 캐시에 든 객체는 서버가 꺼질 때까지 살아요.'
      - p: '힙 전체를 매번 훑으면 오래 사는 객체를 볼 때마다 다시 확인하는 낭비가 생겨요. 그래서 힙을 나눠요. 새 객체는 **젊은 세대**에, 오래 산 객체는 **늙은 세대**에 둬요.'
      - table:
          head: [구역, 놓이는 것, 치우는 수집]
          rows:
            - ['젊은 세대의 에덴', '`new`로 막 만든 객체', '에덴이 차면 젊은 세대만 치워요(마이너 GC). 자주, 빨리 끝나요']
            - ['젊은 세대의 서바이버', '마이너 GC에서 살아남은 객체', '살아남을 때마다 나이를 먹어요']
            - ['늙은 세대', '나이가 기준을 넘어 옮겨진(승격된) 객체', '차면 더 큰 수집이 돌아요. 힙 전체를 치우는 풀 GC는 훨씬 오래 걸려요']
      - p: '아래에서 한 단계씩 넘기며 객체가 어디로 옮겨지는지 보세요.'
      - muted: '객체 수와 나이는 설명을 위한 숫자예요. 실제 크기나 기준값이 아니에요.'
      - widget:
          kind: steps
          layout: [duo, log, buttons, verdict]
          initial:
            duo:
              - {label: '젊은 세대(에덴, 서바이버)', state: dim, text: 비어 있음}
              - {label: 늙은 세대, state: dim, text: 비어 있음}
          scenarios:
            default:
              - log: '요청 처리 → 에덴에 객체 6개가 생김. 그 가운데 하나는 캐시에 넣음'
                duo:
                  - label: '젊은 세대(에덴, 서바이버)'
                    rows: [{k: 에덴, v: 'DTO, 문자열, 리스트 … 6개', mark: changed}, {k: 서바이버, v: 비어 있음}]
                  - {label: 늙은 세대, text: 비어 있음}
              - log: '에덴이 가득 참 → 마이너 GC. 루트에서 닿는 것은 캐시의 객체 하나뿐'
                duo:
                  - label: '젊은 세대(에덴, 서바이버)'
                    rows: [{k: 에덴, v: '6개 (닿는 것 1개)', mark: bad}, {k: 서바이버, v: 비어 있음}]
                  - {label: 늙은 세대, text: 비어 있음}
              - log: '닿는 1개만 서바이버로 복사하고 에덴을 통째로 비움 (치운 객체 5, 옮긴 객체 1)'
                duo:
                  - label: '젊은 세대(에덴, 서바이버)'
                    rows: [{k: 에덴, v: 비어 있음, mark: changed}, {k: 서바이버, v: '캐시 객체 (나이 1)', mark: changed}]
                  - {label: 늙은 세대, text: 비어 있음}
              - log: '다음 요청들로 에덴이 다시 참 → 마이너 GC (치운 객체 6, 옮긴 객체 1)'
                duo:
                  - label: '젊은 세대(에덴, 서바이버)'
                    rows: [{k: 에덴, v: 비어 있음}, {k: 서바이버, v: '캐시 객체 (나이 2)', mark: changed}]
                  - {label: 늙은 세대, text: 비어 있음}
              - log: '마이너 GC를 거듭함. 캐시 객체는 매번 살아남아 나이를 먹음'
                duo:
                  - label: '젊은 세대(에덴, 서바이버)'
                    rows: [{k: 에덴, v: 비어 있음}, {k: 서바이버, v: '캐시 객체 (나이가 기준에 닿음)', mark: changed}]
                  - {label: 늙은 세대, text: 비어 있음}
              - log: '나이가 기준을 넘음 → 늙은 세대로 승격 (옮긴 객체 1)'
                duo:
                  - label: '젊은 세대(에덴, 서바이버)'
                    rows: [{k: 에덴, v: 비어 있음}, {k: 서바이버, v: 비어 있음}]
                  - label: 늙은 세대
                    rows: [{k: 캐시 객체, v: 승격됨, mark: changed}]
                verdict: '금방 죽는 객체는 에덴에서 한 번에 치워지고, 오래 사는 객체만 늙은 세대로 갔어요. 늙은 세대는 드물게 치워요.'
      - ul:
          - '**마이너 GC는 살아 있는 것만 옮겨요.** 에덴에 객체가 아무리 많아도 살아 있는 것이 적으면 옮길 것이 적어서 빨리 끝나요. 죽은 객체는 하나하나 지우지 않고 에덴을 통째로 비워요.'
          - '**빈 곳이 한 덩어리로 모여요.** 살아 있는 객체를 한쪽으로 옮기니 다음 `new`가 빈자리를 찾아다니지 않고 바로 놓여요. 자바에서 객체를 만드는 것이 싼 이유예요.'
      - h3: 실제로 세어 봐요
      - p: 'JVM은 수집기마다 몇 번 돌았는지 알려 줘요. 1KB 배열을 200만 개(약 2GB) 만들고 바로 버리는 코드를 64MB 힙에서 돌리고, 앞뒤로 횟수를 읽었어요.'
      - code: countRead
      - ci:
          key: young-count
          label: 실제 횟수 보기
          source: GarbageCollectionTest.youngCollections
          code: churnRun
      - p: '젊은 세대의 수집(`G1 Young Generation`)만 수십 번 돌았고, 늙은 세대의 수집은 돌지 않았어요. 2GB를 만들었지만 모두 금방 버려서 젊은 세대에서 끝났어요. 횟수는 환경마다 달라요.'
      - quiz:
          q: '에덴에 객체 여섯이 있고 그 가운데 하나만 닿을 수 있어요. 마이너 GC가 돈 직후 에덴과 서바이버에는 각각 몇 개가 있을까요?'
          options:
            - 에덴 5개, 서바이버 1개
            - 에덴 0개, 서바이버 1개
            - 에덴 1개, 서바이버 0개
          answer: 2
          explain: '닿는 하나만 서바이버로 옮기고 에덴은 통째로 비워요.'
      - next: '수집이 객체를 옮기는 동안 애플리케이션이 그 객체의 필드를 바꾸면 어떻게 될까요?'
    recall: '대부분의 객체는 금방 쓸모없어져서, 새 객체가 모인 젊은 세대만 자주 치우면 적은 일로 많은 공간을 되찾아요. `new`는 에덴에 놓고, 에덴이 차면 마이너 GC가 살아 있는 것만 서바이버로 옮기고 에덴을 비워요. 여러 번 살아남은 객체는 늙은 세대로 승격되고, 늙은 세대는 드물게 더 큰 수집으로 치워요.'
  - id: q3
    title: 가비지 컬렉터가 일하는 동안 애플리케이션은 어떻게 되나요?
    conclusion:
      lead: '수집의 일부 구간에서는 애플리케이션의 모든 스레드가 멈춰요. 이것을 stop-the-world라고 해요.'
      sub: '멈춘 동안에는 요청을 처리하지 못하므로, 수집기는 멈추는 시간을 줄일지 전체 처리량을 높일지에 따라 여러 종류가 있어요.'
    says:
      - '객체를 옮기거나 표시하는 동안 애플리케이션이 참조를 바꾸면 계산이 틀어진다. 그래서 JVM은 애플리케이션 스레드를 모두 세우고 일하는 구간을 둔다'
      - '그 구간에 걸린 요청은 그만큼 늦게 응답한다. 평소 10ms에 끝나던 요청이 가끔 수백 ms가 걸리는 이유 가운데 하나다. 힙이 크고 살아 있는 객체가 많을수록 한 번의 수집이 길어질 수 있다'
      - '수집기의 종류와 우선하는 것. Serial은 스레드 하나로 치운다. 작은 힙에 맞다. Parallel은 여러 스레드로 치워 전체 처리량을 높인다. G1은 힙을 작은 구역들로 나눠 멈추는 시간의 목표를 맞추려 한다. ZGC는 대부분의 일을 애플리케이션과 동시에 해서 멈추는 시간을 아주 짧게 한다'
      - '자바 21의 기본은 G1이다. `-XX:+UseZGC`처럼 옵션으로 바꾼다. G1의 멈춤 목표는 기본 200ms이고 `-XX:MaxGCPauseMillis`로 정한다. 목표이지 보장이 아니다'
      - '다만 JVM은 기계가 작다고 판단하면 G1 대신 Serial을 고른다. CPU가 2개 미만이거나 메모리가 약 2GB 미만일 때다. CPU 1개짜리 작은 컨테이너에서 이 일이 생긴다'
      - '지금 어느 수집기가 도는지는 JVM에게 물어볼 수 있다. 수집기의 이름을 출력하는 코드를 돌려 결과를 붙인다'
      - '세대별 수집(질문 2)은 이 수집기들이 함께 쓰는 생각이다. 무엇을 치울지(질문 1)도 같다. 다른 것은 언제, 몇 개의 스레드로, 얼마나 멈추고 하느냐다'
    asks:
      - '본문의 예시: 자바 21을 CPU 8개, 메모리 16GB인 서버에서 GC 옵션 없이 실행했다. 쓰이는 수집기는 무엇인가 (G1)'
      - '옮긴 상황: 평소 응답 시간이 10ms인 서버에서 300ms의 stop-the-world 수집이 한 번 일어났다. 그 구간이 시작될 때 처리 중이던 요청의 응답 시간은 어떻게 되나 (멈춘 시간만큼 늘어난다. 300ms 넘게 걸린다)'
    body:
      - p: '수집기가 객체를 옮기거나 표시하는 동안 애플리케이션이 참조를 바꾸면 계산이 틀어져요. 방금 "닿지 않는다"고 본 객체를 애플리케이션이 다시 가리킬 수도 있으니까요. 그래서 JVM은 **애플리케이션의 스레드를 모두 세우고** 일하는 구간을 둬요. 이것을 **stop-the-world**라고 해요.'
      - p: '그 구간에 걸린 요청은 멈춘 시간만큼 늦게 응답해요. 평소 10ms에 끝나던 요청이 가끔 수백 ms 걸린다면 GC가 그 이유 가운데 하나일 수 있어요. 힙이 크고 살아 있는 객체가 많을수록 한 번의 수집이 길어질 수 있어요.'
      - h3: 수집기는 무엇을 우선하느냐로 갈려요
      - table:
          head: [수집기, 어떻게 치우나, 우선하는 것]
          rows:
            - [Serial, 스레드 하나로 치워요, '작은 힙. 기계가 작을 때']
            - [Parallel, 여러 스레드로 치워요, 전체 처리량]
            - [G1, '힙을 작은 구역들로 나눠, 치울 것이 많은 구역부터 치워요', '멈추는 시간의 목표(기본 200ms)를 맞추는 것']
            - [ZGC, 대부분의 일을 애플리케이션과 동시에 해요, 아주 짧은 멈춤]
      - p: '자바 21의 기본은 **G1**이에요. `-XX:+UseZGC`처럼 옵션으로 바꿔요. G1의 멈춤 목표는 `-XX:MaxGCPauseMillis`로 정하는데, 목표이지 보장은 아니에요.'
      - p: '다만 JVM은 기계가 작다고 판단하면 G1 대신 **Serial**을 골라요. CPU가 2개 미만이거나 메모리가 약 2GB 미만일 때예요. CPU 1개짜리 작은 컨테이너에서 이 일이 생겨요.'
      - muted: '근거: [사용할 수 있는 수집기](link:collectors), [기계의 크기에 따른 선택](link:ergonomics), [G1](link:g1).'
      - h3: 지금 무엇이 도는지 확인해요
      - p: '`-Xlog:gc`를 켜면 로그의 첫 줄에 쓰이는 수집기가 나와요. 옵션을 바꿔 가며 JVM을 띄워 봤어요.'
      - ci:
          key: collector
          label: 세 JVM의 첫 줄 보기
          source: GarbageCollectionTest.collectorChoice
          code: collectorRun
      - p: '옵션으로 정하면 그 수집기가 쓰이고, 옵션이 없으면 JVM이 기계를 보고 골라요. 이 페이지를 배포한 CI의 기계는 작지 않아서 G1이 골라졌어요.'
      - p: '세대별 수집(질문 2)과 무엇을 치울지(질문 1)는 이 수집기들이 함께 쓰는 생각이에요. 다른 것은 **언제, 몇 개의 스레드로, 얼마나 멈추고** 하느냐예요.'
      - quiz:
          q: '평소 응답 시간이 10ms인 서버에서 300ms짜리 stop-the-world 수집이 한 번 일어났어요. 그 구간이 시작될 때 처리 중이던 요청은 어떻게 될까요?'
          options:
            - 영향이 없다. GC는 다른 스레드에서 돈다
            - 멈춘 시간만큼 늘어나 300ms 넘게 걸린다
            - 요청이 실패한다
          answer: 2
          explain: 'stop-the-world 동안에는 애플리케이션의 모든 스레드가 멈춰요. 요청은 실패하지 않고 그만큼 늦어져요.'
      - next: '가비지 컬렉터는 닿을 수 없는 객체를 치워요. 그러면 다시는 쓰지 않는데 어딘가에서 계속 가리키고 있는 객체는 어떻게 될까요?'
    recall: '수집의 일부 구간에서는 애플리케이션의 모든 스레드가 멈춰요(stop-the-world). 그동안 요청은 처리되지 못하고 그만큼 늦게 응답해요. 수집기는 무엇을 우선하느냐로 갈려요. Serial은 스레드 하나, Parallel은 처리량, G1은 멈춤 목표, ZGC는 아주 짧은 멈춤이에요. 자바 21의 기본은 G1이지만 기계가 작으면 Serial이 골라져요.'
  - id: q4
    title: 가비지 컬렉터가 있는데 왜 메모리 누수가 생기나요?
    conclusion:
      lead: '더는 쓰지 않는 객체를 어딘가에서 계속 가리키고 있으면, 가비지 컬렉터가 보기에는 닿을 수 있는 객체라서 치우지 못해요.'
      sub: '가비지 컬렉터는 "쓰이는가"가 아니라 "닿을 수 있는가"만 알아요.'
    says:
      - '질문 1의 기준을 뒤집어 본다. 닿을 수 없으면 치운다. 그러니 닿을 수 있으면 다시는 쓰지 않을 객체라도 치우지 않는다. 자바의 메모리 누수는 이것이다'
      - '오래 사는 것이 붙잡을 때 생긴다. 대표가 static 필드다. static 컬렉션에 넣고 빼지 않으면 그 객체들은 프로그램이 끝날 때까지 닿을 수 있다(J5)'
      - '코드 leak. 맵을 캐시로 쓴다. 넣기만 하고 빼는 코드가 없다. 키의 종류가 정해져 있으면(통화 코드 몇 개) 괜찮다. 키가 요청마다 달라지면(사용자 번호, 검색어, 시각이 들어간 문자열) 맵이 끝없이 커진다'
      - '다른 자리들. 스레드 풀의 스레드에 `ThreadLocal`로 넣고 지우지 않은 값(스레드가 재사용되어 사라지지 않는다), 등록하고 빼지 않은 리스너와 콜백, 닫지 않은 자원이 붙잡은 버퍼'
      - '누수의 모양. 살아남은 객체는 늙은 세대로 간다(질문 2). 정상인 서버는 큰 수집이 돌면 늙은 세대의 사용량이 뚝 떨어진다. 새는 서버는 수집 뒤의 바닥이 돌 때마다 조금씩 높아진다. 끝에는 J14의 `OutOfMemoryError`다'
      - '확인한다. 코드 leak에 서로 다른 키를 계속 넣으며 맵의 크기를 본다. 그리고 넣은 값 하나를 약한 참조로 지켜봐서 GC 뒤에도 남아 있는 것을 본다'
      - '고치는 방향: 넣는 곳마다 빼는 곳이 있는지 본다. 캐시에는 최대 크기와 만료 시간을 둔다'
      - '더 알아보기: 약한 참조만 남은 객체는 치워진다. `WeakHashMap`은 키가 다른 곳에서 닿지 않게 되면 그 항목을 지운다. 캐시를 직접 만들기보다 캐시 라이브러리를 쓰는 것이 낫다'
    asks:
      - '본문의 예시: 코드 leak의 `get`을 서로 다른 키 100만 개로 한 번씩 불렀다. 그 뒤 어떤 키도 다시 쓰지 않는다. GC가 돈 뒤 맵에 남은 항목은 몇 개인가. 조건: `RateCache` 객체는 static 필드에서 닿는다 (100만 개. 맵이 모두 가리키고 있다)'
      - '옮긴 상황: `static final List<byte[]> buffers = new ArrayList<>();`에 1MB 배열을 요청마다 하나씩 `add`하고 빼지 않는다. 어느 요청도 예전 배열을 읽지 않는다. 이 배열들은 치울 대상인가 (아니다. static 리스트에서 닿는다. 쓰이지 않지만 닿을 수 있다)'
      - '실무 구역: `@Component`인 `SearchCache` 빈이 `Map<String, Result>` 필드에 검색어마다 결과를 `put`하고 지우지 않는다. 검색어의 종류에는 끝이 없다. 서버를 오래 켜 두면 큰 수집 뒤의 늙은 세대 사용량은 어떻게 되나 (돌 때마다 높아진다. 싱글톤 빈이 맵을, 맵이 모든 결과를 가리킨다)'
    body:
      - p: '질문 1의 기준을 뒤집어 봐요. 닿을 수 없으면 치워요. 그러니 **닿을 수 있으면, 다시는 쓰지 않을 객체라도 치우지 않아요.** 가비지 컬렉터는 "쓰이는가"를 모르고 "닿을 수 있는가"만 알아요. 자바의 메모리 누수는 이거예요.'
      - p: '누수는 **오래 사는 것이 붙잡을 때** 생겨요. 대표가 static 필드예요. static 컬렉션에 넣고 빼지 않으면, 그 객체들은 프로그램이 끝날 때까지 루트에서 닿아요.'
      - h3: 넣기만 하는 캐시
      - code: leak
        notes:
          - mark: computeIfAbsent
            as: code
            text: '없는 키면 읽어 와서 넣어요. 빼는 코드는 어디에도 없어요.'
      - p: '키의 종류가 정해져 있으면(통화 코드 몇 개) 괜찮아요. 키가 **요청마다 달라지면**(사용자 번호, 검색어, 시각이 들어간 문자열) 맵이 끝없이 커져요. 서로 다른 키 10만 개를 넣고, 맨 처음 넣은 값을 약한 참조로 지켜봤어요.'
      - ci:
          key: leak
          label: 실제 결과 보기
          source: GarbageCollectionTest.leakingMap
          code: leakRun
      - p: '맵에 넣지 않은 값은 같은 GC에서 치워졌는데, `"user-0"`의 값은 다시는 쓰지 않는데도 남았어요. `RateCache`가 static 필드에서 닿고, 맵이 그 값을 가리키니까요.'
      - h3: 다른 자리들
      - ul:
          - '스레드 풀의 스레드에 `ThreadLocal`로 넣고 지우지 않은 값. 스레드가 재사용되어 사라지지 않아요.'
          - '등록하고 빼지 않은 리스너와 콜백.'
          - '닫지 않은 자원이 붙잡은 버퍼.'
      - h3: 누수의 모양
      - p: '살아남은 객체는 늙은 세대로 가요(질문 2). 정상인 서버는 큰 수집이 돌면 늙은 세대의 사용량이 뚝 떨어져요. **새는 서버는 수집 뒤의 바닥이 돌 때마다 조금씩 높아져요.** 그 끝에 JVM 메모리 구조 레슨의 `OutOfMemoryError`가 있어요. 배포하고 며칠 뒤에 죽고 다시 켜면 괜찮은 서버가 이 모양이에요.'
      - p: '고치는 방향은 둘이에요. 넣는 곳마다 **빼는 곳**이 있는지 보고, 캐시에는 **최대 크기와 만료 시간**을 둬요. 스프링에서 고친 코드는 실무 구역에서 봐요.'
      - more:
          summary: '더 알아보기: 약한 참조와 WeakHashMap'
          body:
            - p: '약한 참조만 남은 객체는 치워져요([java.lang.ref](link:ref)). 이 레슨의 테스트도 그 성질로 "치워졌는지"를 봤어요. `WeakHashMap`은 키가 다른 곳에서 닿지 않게 되면 그 항목을 지워요. 다만 문자열 키는 다른 곳에서 계속 닿는 경우가 많아 생각대로 지워지지 않을 수 있어서, 캐시는 직접 만들기보다 캐시 라이브러리를 쓰는 것이 나아요.'
      - quiz:
          q: '`static final List<byte[]> buffers`에 1MB 배열을 요청마다 하나씩 `add`하고 빼지 않아요. 어느 요청도 예전 배열을 읽지 않아요. 이 배열들을 가비지 컬렉터가 치울까요?'
          options:
            - 치운다. 아무도 읽지 않는다
            - 치우지 않는다. static 리스트에서 닿는다
            - 늙은 세대로 가면 치운다
          answer: 2
          explain: '가비지 컬렉터는 읽는지가 아니라 닿는지를 봐요. static 리스트가 모두 가리키니 끝까지 남아요.'
    recall: '더는 쓰지 않는 객체를 어딘가에서 계속 가리키고 있으면, 가비지 컬렉터가 보기에는 닿을 수 있는 객체라서 치우지 못해요. static 컬렉션, 넣기만 하는 캐시 맵, 지우지 않은 `ThreadLocal`, 빼지 않은 리스너가 흔한 자리예요. 새는 서버는 큰 수집 뒤의 사용량이 돌 때마다 높아져요. 빼는 곳을 두고, 캐시에는 크기와 만료를 둬요.'
practice:
  title: 스프링 서버에서는 이렇게 만나요
  says:
    - '스프링에서 누수가 생기는 자리. 싱글톤 빈은 서버가 꺼질 때까지 살고 스프링 컨테이너가 가리키고 있다. 그래서 빈의 필드가 가리키는 컬렉션은 static 컬렉션과 똑같이 끝까지 닿는다. `@Component class SearchCache { private final Map<String, Result> cache = new HashMap<>(); }`가 코드 leak의 스프링 모습이다'
    - '흔한 실수: 빈의 필드에 `HashMap`을 두고 캐시로 쓴다. 넣기만 하고 지우지 않는다. 고친 코드: 크기와 만료가 있는 캐시를 쓴다. `Caffeine.newBuilder().maximumSize(10_000).expireAfterWrite(Duration.ofMinutes(10)).build()`. 스프링의 `@Cacheable`과 함께 쓰는 법과 무엇을 캐시할지는 A4에 넘긴다. 여러 요청이 동시에 쓰는 `HashMap`은 그 자체로도 안전하지 않고 그것은 C6에서 다룬다 (새는 쪽은 서로 다른 키를 넣으며 크기가 계속 느는 것과 값이 GC 뒤에도 남는 것을 순수 자바 테스트로 확인한다. Caffeine의 설정은 공식 문서 근거이고, `verification`에 의존성이 있으면 최대 크기를 넘지 않는 것을 테스트로 확인한다)'
    - '`ThreadLocal`. 톰캣의 스레드는 요청이 끝나도 사라지지 않고 다음 요청에 다시 쓰인다. 요청 처리 중에 `ThreadLocal`에 넣은 값은 `finally`에서 `remove()`해야 한다. 자세한 것은 C6'
    - 'GC 로그 보기. `java -Xlog:gc -jar app.jar`로 켠다. 실제 로그 한 줄(`Pause Young (Normal) (G1 Evacuation Pause) 24M->4M(256M) 3.2ms` 꼴)을 붙이고 읽는다. 수집의 종류, 수집 전의 사용량, 수집 뒤의 사용량, 힙의 크기, 멈춘 시간이다. 누수는 "수집 뒤의 사용량"이 계속 오르는 것으로 보인다 (자식 JVM을 `-Xlog:gc`로 띄워 받은 실제 출력을 붙이는 테스트. 숫자는 환경마다 달라서 모양만 단정한다)'
    - '운영에서 보기. 스프링 부트 액추에이터의 `/actuator/metrics/jvm.gc.pause`와 `/actuator/metrics/jvm.memory.used`가 멈춘 시간과 사용량을 준다. 모아서 그래프로 보는 것은 T7 (스프링 부트 공식 문서 근거)'
    - '작은 컨테이너의 수집기. CPU 한도가 1인 컨테이너에서는 질문 3대로 Serial이 골라질 수 있다. 응답 시간이 중요하면 `-XX:+UseG1GC`로 직접 정한다. 지금 무엇이 도는지는 시작 로그(`-Xlog:gc`의 첫 줄 `Using G1` 또는 `Using Serial`)로 확인한다 (HotSpot 공식 문서 근거. 첫 줄은 위의 자식 JVM 출력으로 확인한다)'
  body:
    - p: '질문 넷은 스프링 부트 서버에서 캐시를 만들 때와 응답 시간이 튈 때 만나요. 누수와 GC 로그는 테스트로 확인했고, 액추에이터와 수집기 선택은 공식 문서가 근거예요.'
    - h3: '흔한 실수: 빈의 필드에 둔 HashMap 캐시'
    - p: '싱글톤 빈은 서버가 꺼질 때까지 살고, 스프링 컨테이너가 가리키고 있어요. 그래서 **빈의 필드가 가리키는 컬렉션은 static 컬렉션과 똑같이 끝까지 닿아요.** 질문 4의 `RateCache`를 스프링으로 옮기면 이 모습이에요.'
    - code: searchCache
    - p: '검색어의 종류에는 끝이 없어요. 서버를 오래 켜 둘수록 맵이 모든 검색 결과를 붙잡고, 큰 수집 뒤의 사용량이 돌 때마다 높아져요. 여러 요청이 동시에 `HashMap`에 쓰는 것은 그 자체로도 안전하지 않은데, 그것은 스레드에 안전한 객체 레슨에서 다뤄요.'
    - p: '고친 코드는 **크기와 만료가 있는 캐시**예요. Caffeine으로 만들면 이래요.'
    - code: caffeine
      notes:
        - mark: .maximumSize(10_000)
          as: code
          text: '항목이 이 수를 넘으면 덜 쓰인 것부터 빼요.'
        - mark: .expireAfterWrite(
          as: code
          text: '넣고 10분이 지난 항목은 빼요. 근거: [Caffeine의 제거 규칙](link:caffeine).'
    - ci:
        key: bounded
        label: 서로 다른 키 10만 개를 넣은 실제 결과 보기
        source: GarbageCollectionTest.boundedCache
        code: caffeineRun
    - p: '키를 10만 개 넣어도 1만 개를 넘지 않았어요. 앞의 `HashMap`은 10만 개를 모두 붙잡았어요. 스프링의 `@Cacheable`과 함께 쓰는 법과 무엇을 캐시할지는 캐시 전략과 무효화 레슨에서 다뤄요.'
    - muted: '`cleanUp()`은 테스트에서 빼는 일을 바로 끝내려고 불렀어요. Caffeine은 빼는 일을 조금 뒤에 몰아서 해요.'
    - h3: ThreadLocal은 finally에서 지워요
    - p: '톰캣의 스레드는 요청이 끝나도 사라지지 않고 다음 요청에 다시 쓰여요. 요청 처리 중에 `ThreadLocal`에 넣은 값을 지우지 않으면, 스레드가 그 값을 계속 붙잡아요. 다음 요청이 앞 사람의 값을 보는 문제도 생겨요.'
    - code: threadLocal
      notes:
        - mark: CURRENT_USER.remove();
          as: code
          text: '요청이 실패해도 지워지게 `finally`에 둬요.'
    - muted: '자세한 것은 스레드에 안전한 객체 레슨에서 다뤄요.'
    - h3: GC 로그를 읽어요
    - p: '`-Xlog:gc`를 켜면 수집이 돌 때마다 한 줄씩 남아요. 64MB 힙에서 금방 버리는 배열을 많이 만들며 받은 실제 로그예요.'
    - ci:
        key: gc-log
        label: 실제 GC 로그 보기
        source: GarbageCollectionTest.gcLogLine
        code: gcLogRun
    - p: '`GC(0)`으로 시작하는 줄을 쪼개 읽으면 이래요.'
    - table:
        head: [부분, 뜻]
        rows:
          - ['`GC(0)`', '몇 번째 수집인가']
          - ['`Pause Young (Normal)`', '젊은 세대를 치우며 애플리케이션을 멈춘 수집(질문 2, 3)']
          - ['`(G1 Evacuation Pause)`', '왜 돌았나. 에덴이 차서 살아 있는 것을 옮겼어요']
          - ['`23M->1M`', '수집 전 사용량 → 수집 뒤 사용량']
          - ['`(64M)`', '지금 힙의 크기']
          - ['마지막 `ms`', '멈춘 시간']
    - p: '누수는 **수집 뒤 사용량**(`->` 오른쪽)이 수집을 거듭할수록 계속 오르는 것으로 보여요. 멈춘 시간은 응답 시간이 튀는 때와 맞춰 봐요. 운영 서버에서는 로그를 파일로 남겨요.'
    - code: gcOption
    - muted: '숫자는 환경마다 달라요. 테스트는 줄의 모양만 확인해요. 근거: [java 명령 문서](link:javaCmd)의 -Xlog.'
    - h3: 운영에서는 지표로 봐요
    - p: '스프링 부트 액추에이터를 켜면 `/actuator/metrics/jvm.gc.pause`가 멈춘 시간을, `/actuator/metrics/jvm.memory.used`가 영역별 사용량을 줘요([액추에이터 지표](link:actuator)). 이것을 모아 그래프로 보는 것은 로그와 모니터링 레슨에서 다뤄요.'
    - h3: 작은 컨테이너의 수집기
    - p: 'CPU 한도가 1인 컨테이너에서는 질문 3대로 JVM이 **Serial**을 고를 수 있어요. 스레드 하나로 치우니 힙이 커지면 멈춤이 길어져요. 응답 시간이 중요하면 `-XX:+UseG1GC`로 직접 정하고, 시작 로그의 첫 줄(`Using G1`, `Using Serial`)로 확인해요.'
interview:
  question: 가비지 컬렉션이 어떻게 동작하고, 자바에서 메모리 누수는 왜 생기는지 설명해 주세요
  model:
    - label: 정의
      text: 가비지 컬렉터는 프로그램이 더는 닿을 수 없는 객체를 찾아 힙에서 치웁니다. 스택의 지역 변수와 static 필드 같은 GC 루트에서 참조를 따라가 닿지 않는 객체가 대상이라, 서로를 가리키는 객체도 루트에서 닿지 않으면 치워집니다.
    - label: 원리
      text: 대부분의 객체는 금방 죽기 때문에 힙을 젊은 세대와 늙은 세대로 나눕니다. 에덴이 차면 마이너 GC가 살아 있는 것만 서바이버로 옮기고, 여러 번 살아남은 객체는 늙은 세대로 승격됩니다. 수집의 일부 구간에서는 애플리케이션 스레드가 모두 멈추고, 자바 21의 기본 수집기인 G1은 멈춤 시간의 목표를 맞추려 합니다.
    - label: 주의할 점
      text: 가비지 컬렉터는 쓰이는지가 아니라 닿는지만 봅니다. 그래서 static 컬렉션이나 싱글톤 빈의 맵에 넣기만 하면 쓰지 않는 객체가 끝까지 남아 누수가 됩니다. 캐시에는 크기와 만료를 두고, ThreadLocal은 finally에서 지웁니다.
    - label: 경험
      text: '(내 프로젝트로 채우기) 예: 빈의 HashMap 캐시가 검색어마다 커져서 GC 로그의 수집 뒤 사용량이 계속 올랐고, maximumSize와 만료가 있는 Caffeine 캐시로 바꿨습니다.'
verified: 이 레슨의 결과는 짐작이 아니라 자바 21에서 코드를 돌려 받은 값이에요. 객체가 치워졌는지는 약한 참조로 보고, 수집기와 GC 로그는 옵션을 준 JVM을 따로 띄워 확인했어요. 코드가 바뀔 때마다 테스트([GarbageCollectionTest](link:test))가 다시 돌아요.
footer: '근거: 수집기의 종류와 기본 수집기는 HotSpot 튜닝 가이드([링크](link:collectors)), 기계의 크기에 따른 선택은 Ergonomics([링크](link:ergonomics)), 세대는 Garbage Collector Implementation([링크](link:gcImpl)), 약한 참조는 java.lang.ref 문서, -Xlog는 java 명령 문서, 액추에이터 지표는 스프링 부트 문서, 캐시의 제거 규칙은 Caffeine 문서. 결과는 OpenJDK 21(HotSpot)에서 테스트로 확인했어요. 오류는 [GitHub 이슈](https://github.com/wanja727/dev-lessons/issues)로 알려 주세요.'
claims:
  - claim: '서로를 가리키는 두 객체는 그것을 가리키던 변수가 사라지면 치워진다 (HotSpot)'
    how: '두 객체를 메서드 안에서 만들어 서로 가리키게 하고 `WeakReference`만 반환한다. `System.gc()`를 부르며 약한 참조가 비워질 때까지 정해진 시간 동안 기다린다. `System.gc()`는 명세상 보장이 없으므로 본문에 HotSpot에서 확인했다고 적는다'
    test: GarbageCollectionTest.cycleCollected
  - claim: '메서드가 끝나면 지역 변수만 가리키던 객체는 치워지고, static 리스트에 든 객체는 GC 뒤에도 남는다'
    how: '코드 roots를 돌린 뒤 같은 방법으로 기다려 `temp`의 약한 참조는 비고 `saved`의 약한 참조는 비지 않았는지 본다'
    test: GarbageCollectionTest.rootsDecide
  - claim: '금방 버리는 객체를 많이 만들면 젊은 세대의 수집 횟수가 늘어난다'
    how: '`-XX:+UseG1GC -Xmx64m` 자식 JVM에서 `ManagementFactory.getGarbageCollectorMXBeans()`의 이름과 횟수를 만들기 전과 뒤에 읽어 `CiOutput`에 남긴다. 늘었는지만 단정한다'
    test: GarbageCollectionTest.youngCollections
  - claim: '옵션 없이 띄운 JVM의 수집기 이름을 읽을 수 있고, `-XX:+UseSerialGC`와 `-XX:+UseG1GC`로 띄우면 각각 그 수집기가 쓰인다'
    how: '`ChildJvm`으로 자식 JVM을 옵션별로 띄워 `-Xlog:gc`의 `Using` 줄을 읽는다. 옵션 없는 쪽은 CI 기계의 CPU와 메모리에 따라 달라지므로 값을 단정하지 않고 기록만 한다'
    test: GarbageCollectionTest.collectorChoice
  - claim: '`-Xlog:gc` 로그에는 수집 전 사용량, 수집 뒤 사용량, 힙 크기, 걸린 시간이 한 줄에 나온다'
    how: '64MB 힙의 자식 JVM에서 객체를 많이 만들어 로그를 받고 줄의 모양을 정규식으로 확인한다. 한 줄을 `CiOutput`에 남긴다'
    test: GarbageCollectionTest.gcLogLine
  - claim: '지우지 않는 맵에 서로 다른 키를 넣으면 크기가 넣은 수만큼 늘고, 그 값은 GC 뒤에도 남는다'
    how: '코드 leak에 키 10만 개를 넣어 크기를 보고, 값 하나의 약한 참조가 GC 뒤에도 비지 않았는지 본다. 맵에 넣지 않은 값은 같은 GC에서 치워지는 것을 함께 본다'
    test: GarbageCollectionTest.leakingMap
  - claim: '`maximumSize`를 준 Caffeine 캐시는 서로 다른 키를 그보다 많이 넣어도 그 크기를 넘지 않는다'
    how: '`maximumSize(10_000)` 캐시에 키 10만 개를 넣고 `cleanUp()` 뒤 `estimatedSize()`를 본다'
    test: GarbageCollectionTest.boundedCache
  - claim: '자바 21의 기본 수집기는 G1이고, CPU가 2개 미만이거나 메모리가 약 2GB 미만이면 Serial이 골라진다'
    how: '공식 문서를 근거로 적는다. 테스트로 단정하지 않는다'
sources:
  - '수집기의 종류와 고르는 기준, 기본 수집기: HotSpot 가비지 컬렉션 튜닝 가이드 https://docs.oracle.com/en/java/javase/21/gctuning/available-collectors.html'
  - '기계의 크기에 따라 수집기를 고르는 것: 같은 가이드의 Ergonomics https://docs.oracle.com/en/java/javase/21/gctuning/ergonomics1.html'
  - '세대와 젊은 세대의 수집: 같은 가이드의 Garbage Collector Implementation https://docs.oracle.com/en/java/javase/21/gctuning/garbage-collector-implementation1.html'
  - 'G1의 구역과 멈춤 목표: 같은 가이드의 G1 https://docs.oracle.com/en/java/javase/21/gctuning/garbage-first-g1-garbage-collector1.html'
  - '닿을 수 있는 정도와 약한 참조: `java.lang.ref` 패키지 문서 https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/lang/ref/package-summary.html'
  - '`System.gc()`는 보장이 없다: API 문서 https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/lang/System.html#gc()'
  - '`finalize`를 없애 가는 것: JEP 421 https://openjdk.org/jeps/421'
  - '`-Xlog:gc`: `java` 명령 문서 https://docs.oracle.com/en/java/javase/21/docs/specs/man/java.html'
  - '액추에이터의 JVM 지표: 스프링 부트 문서 https://docs.spring.io/spring-boot/reference/actuator/metrics.html'
  - 'Caffeine의 크기와 만료: https://github.com/ben-manes/caffeine/wiki/Eviction'
