# 가비지 컬렉션
# 자료 파일의 칸은 docs/lesson-data-format.md에 있다. 문제는 content/questions/garbage-collection.yaml에 있다.
title: 가비지 컬렉션
description: 가비지 컬렉터가 어떤 객체를 치우는지, 힙을 왜 세대로 나눠 치우는지, 치우는 동안 애플리케이션은 어떻게 되는지, 가비지 컬렉터가 있는데 왜 메모리가 새는지. 네 가지 질문에 스스로 답할 수 있게, 서로를 가리키는 주문과 끝없이 커지는 캐시로 배우는 대화형 레슨.
unit: 자바 언어
minutes: 22
roadmap: J15
type: 개념 설명
prerequisites:
  - {slug: jvm-memory, title: JVM 메모리 구조}
assume: '자바 21(OpenJDK, HotSpot), JVM 옵션은 기본값. 객체는 힙에 놓이고 지역 변수에는 참조가 있으며, 가리키고 있는 객체로 힙이 차면 `OutOfMemoryError`가 난다는 것(JVM 메모리 구조 레슨).'
example: '서로를 가리키는 주문 객체 둘, 그리고 환율을 담아 두는 `RateCache`(안에 `Map` 하나). 어떤 객체가 치워지고 어떤 객체가 끝까지 남는지 봐요. 실무 구역에서는 `RateCache`를 스프링의 싱글톤 빈으로 두고 GC 로그를 읽어요.'
intro:
  - '배포하고 며칠이 지나면 서버의 메모리 사용량이 조금씩 올라가다가 `OutOfMemoryError`로 죽어요. 다시 켜면 며칠은 괜찮아요. 자바는 가비지 컬렉터가 메모리를 알아서 치워 준다고 배웠는데 왜 메모리가 새는 걸까요?'
  - '가비지 컬렉터는 개발자가 메모리를 직접 돌려주지 않게 해 주지만 일을 공짜로 하지는 않아요. 치우는 동안 요청 처리가 잠깐 멈추고, 치울 수 없는 객체는 끝까지 남아요. 스프링 개발자는 응답 시간이 가끔 튀는 이유를 GC 로그에서 읽고, 싱글톤 빈이 붙잡고 있는 객체가 없는지 살펴야 해요.'
  - '이 레슨에서는 가비지 컬렉터가 치울 객체를 고르는 기준을 코드를 돌려 확인하고, 그 기준 때문에 생기는 메모리 누수를 직접 만들어 봐요.'
covers:
  - topic: '가비지 컬렉터는 닿을 수 없는 객체를 치운다. 닿을 수 있는지는 GC 루트(스택의 지역 변수, static 필드 등)에서 참조를 따라가 정한다'
    where: '질문 1'
  - topic: '참조 횟수를 세는 방식이 아니다. 서로를 가리키는 객체들도 루트에서 닿지 않으면 치워진다'
    where: '질문 1'
  - topic: '객체가 닿을 수 없게 되는 때: 메서드가 끝날 때, 변수에 다른 것을 대입할 때, 컬렉션에서 뺄 때'
    where: '질문 1'
  - topic: 'System.gc()는 요청일 뿐이고 언제 치울지는 JVM이 정한다. finalize는 쓰지 않는다'
    where: '질문 1의 더 알아보기'
  - topic: '세대별 수집: 대부분의 객체는 금방 죽는다. 젊은 세대(에덴, 서바이버)와 늙은 세대'
    where: '질문 2'
  - topic: '젊은 세대만 치우는 수집(마이너 GC)과 살아남은 객체의 승격, 힙 전체를 치우는 수집(풀 GC)'
    where: '질문 2'
  - topic: '살아남은 객체를 옮겨 빈 곳을 모으는 것(복사와 압축)'
    where: '질문 2'
  - topic: 'GC가 도는 동안 애플리케이션 스레드가 멈춘다(stop-the-world). 응답 시간에 주는 영향'
    where: '질문 3'
  - topic: '수집기의 종류와 무엇을 우선하는지: Serial, Parallel, G1, ZGC. 자바 21의 기본은 G1'
    where: '질문 3'
  - topic: 'CPU와 메모리가 작은 환경에서는 JVM이 Serial을 고른다'
    where: '질문 3, 실무에서는'
  - topic: '자바의 메모리 누수: 쓰지 않는데 닿을 수 있는 객체. static 컬렉션, 끝없이 커지는 캐시 맵, 지우지 않은 ThreadLocal, 빼지 않은 리스너'
    where: '질문 4'
  - topic: '누수의 모양: GC를 해도 늙은 세대의 사용량이 줄지 않고 계속 오른다'
    where: '질문 4, 실무에서는'
  - topic: '약한 참조와 WeakHashMap'
    where: '질문 4의 더 알아보기'
  - topic: 'GC 로그 켜고 읽기(-Xlog:gc), 액추에이터의 GC 지표'
    where: '실무에서는. 지표를 모아 보는 것은 로그와 모니터링(T7)'
  - topic: '싱글톤 빈의 맵으로 만든 캐시가 새는 것과 크기와 만료가 있는 캐시'
    where: '실무에서는. 캐시의 전략은 캐시 전략과 무효화(A4)'
  - topic: '스레드 풀에서 ThreadLocal을 지우지 않으면 생기는 일'
    where: '실무에서는에서 한 줄. 자세한 것은 스레드에 안전한 객체(C6)'
  - topic: '힙의 크기 설정과 OutOfMemoryError'
    where: '다루지 않음: JVM 메모리 구조(J14)'
  - topic: '힙 덤프로 누수의 원인 객체를 찾기, GC 튜닝'
    where: '다루지 않음: 스레드 덤프와 힙 덤프(T10)'
  - topic: 'static 필드가 클래스에 딸려 있다는 것'
    where: '다루지 않음: static과 초기화 순서(J5)'
codes:
  predict: |-
    Order a = new Order();
    Order b = new Order();
    a.partner = b;
    b.partner = a;

    a = null;
    b = null;
  roots: |-
    static List<Order> history =
        new ArrayList<>();

    static void handle() {
      Order [[temp]] = new Order();
      Order saved = new Order();
      [[history.add(saved);]]
    }
  rootsRun: |-
    handle();
    // 끝난 뒤 GC를 요청하고
    // 두 객체가 남았는지 본다
  churnRun: |-
    // java -XX:+UseG1GC -Xmx64m
    static volatile Object sink;

    for (int i = 0; i < 2_000_000; i++) {
      sink = new byte[1024];
    }
    // 앞뒤로 수집기별 횟수를 읽는다
  countRead: |-
    for (var gc : ManagementFactory
        .getGarbageCollectorMXBeans()) {
      gc.getName();
      gc.getCollectionCount();
    }
  collectorRun: |-
    $ java -XX:+UseSerialGC -Xlog:gc ...
    $ java -XX:+UseG1GC -Xlog:gc ...
    $ java -Xlog:gc ...
    // 로그의 첫 줄 "Using ..."을 본다
  leak: |-
    class RateCache {
      private final Map<String, Rate> cache =
          new HashMap<>();

      Rate get(String key) {
        return cache.[[computeIfAbsent]](
            key, k -> load(k));
      }
    }
  leakRun: |-
    for (int i = 0; i < 100_000; i++) {
      rateCache.get("user-" + i);
    }
    // 그 뒤 어떤 키도 다시 쓰지 않는다
  searchCache: |-
    @Component
    class SearchCache {
      private final Map<String, Result>
          cache = new HashMap<>();

      Result find(String query) {
        return cache.computeIfAbsent(
            query, q -> search(q));
      }
    }
  caffeine: |-
    private final Cache<String, Result>
        cache = Caffeine.newBuilder()
            [[.maximumSize(10_000)]]
            [[.expireAfterWrite(]]
                Duration.ofMinutes(10))
            .build();

    Result find(String query) {
      return cache.get(
          query, q -> search(q));
    }
  caffeineRun: |-
    // maximumSize(10_000)로 만든 캐시
    for (int i = 0; i < 100_000; i++) {
      cache.get("user-" + i, k -> load(k));
    }
    cache.cleanUp();
  threadLocal: |-
    try {
      CURRENT_USER.set(user);
      chain.doFilter(request, response);
    } finally {
      [[CURRENT_USER.remove();]]
    }
  gcLogRun: |-
    $ java -XX:+UseG1GC -Xmx64m \
        -Xlog:gc ...
    // 금방 버리는 배열을 많이 만든다
  gcOption: |-
    # GC 로그를 파일로 남긴다
    java -Xlog:gc:file=gc.log \
      -jar app.jar

    # 수집기를 직접 정한다
    java -XX:+UseG1GC -jar app.jar
