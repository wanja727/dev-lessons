# 이진 탐색
# 자료 파일의 칸은 docs/lesson-data-format.md에 있다. 문제는 content/questions/binary-search.yaml에 있다.
title: 이진 탐색
description: 이진 탐색이 어떻게 범위를 줄이는지, 언제 쓸 수 있는지, 못 찾으면 자바가 무엇을 돌려주는지, 직접 짜면 어디서 틀리는지. 네 가지 질문에 스스로 답할 수 있게, 배송비 구간표와 주문 번호 100만 개로 직접 세어 보며 배우는 대화형 레슨.
unit: 자료구조와 알고리즘
minutes: 20
roadmap: K7
type: 자바 실행
prerequisites:
  - {slug: sorting, title: 정렬}
  - {slug: number-limits, title: 숫자 타입의 한계}
assume: '자바 21(OpenJDK). O(log n)의 모양(시간 복잡도 레슨). `Comparator`로 정렬 기준을 정하는 법(정렬 레슨). int를 넘는 덧셈이 음수가 된다는 것(숫자 타입의 한계 레슨).'
example: '배송비 구간표. 주문 금액의 경계값(0원, 1만 원, 3만 원, 5만 원 ...)이 정렬된 배열에 있고, 주문 금액이 어느 구간인지 찾아요. 정렬된 주문 번호 100만 개에서 번호 하나를 찾는 비교 횟수도 세요. 실무 구역에서는 정렬되지 않은 리스트에 `Collections.binarySearch`를 부른 코드로 옮겨요.'
intro:
  - '정렬된 주문 번호 100만 개에서 번호 하나를 찾는 데 처음부터 하나씩 보면 최악에 100만 번 비교해요. 가운데를 보고 절반을 버리는 일을 되풀이하면 20번이면 끝나요. 사전을 펼쳐 단어를 찾는 방법과 같아요.'
  - '자바 개발자는 이진 탐색을 직접 짜기보다 `Arrays.binarySearch`, `Collections.binarySearch`를 부르거나, 이진 탐색으로 동작하는 `TreeMap`과 DB 인덱스를 써요. 그래도 이진 탐색이 무엇을 전제로 하는지 모르면, 정렬되지 않은 데이터에 부르고 틀린 답을 받아요. 직접 짜면 경계에서 끝나지 않거나 오버플로가 나기 쉬워 면접의 단골 문제이기도 해요.'
  - '이 레슨에서는 이진 탐색의 비교 횟수를 직접 세고, 찾지 못했을 때 자바가 돌려주는 음수의 뜻을 읽고, 직접 짠 코드가 틀리는 경계 두 곳을 확인해요.'
covers:
  - topic: '이진 탐색은 정렬된 범위의 가운데 값과 비교해 찾는 값이 없는 절반을 버린다. 비교가 최악 log₂ n번 남짓이라 O(log n)이다'
    where: '질문 1'
  - topic: 'n이 100만이면 20번, 10억이면 30번. n이 두 배가 되면 비교는 한 번 는다'
    where: '질문 1'
  - topic: '쓸 수 있는 조건 하나: 데이터가 찾는 기준으로 정렬되어 있어야 한다. 정렬되지 않았으면 틀린 답이 나오고 예외는 나지 않는다'
    where: '질문 2'
  - topic: '쓸 수 있는 조건 둘: 가운데를 바로 읽을 수 있어야 한다(임의 접근). 배열과 ArrayList는 되고 LinkedList는 가운데까지 따라가야 한다'
    where: '질문 2. 임의 접근은 배열과 연결 리스트(K2)'
  - topic: '정렬에 O(n log n)이 들므로, 한 번만 찾을 거면 정렬하지 않고 처음부터 보는 O(n)이 낫다. 여러 번 찾을 때 정렬해 둔다'
    where: '질문 2'
  - topic: '정렬한 기준과 찾는 기준이 같아야 한다. Comparator로 정렬했으면 같은 Comparator를 넘긴다'
    where: '질문 2'
  - topic: 'Arrays.binarySearch와 Collections.binarySearch는 찾으면 위치를, 못 찾으면 -(넣을 위치) - 1을 돌려준다'
    where: '질문 3'
  - topic: '넣을 위치로 "이 값 이상인 첫 칸"을 얻는다. 구간 찾기에 쓴다'
    where: '질문 3'
  - topic: '같은 값이 여럿이면 어느 것의 위치가 나올지 약속하지 않는다. 첫 번째가 필요하면 직접 짜거나 TreeMap을 쓴다'
    where: '질문 3'
  - topic: '직접 짤 때의 경계: low와 high의 뜻(닫힌 범위인지 반쯤 열린 범위인지)에 맞는 반복 조건과 갱신. 어긋나면 끝나지 않거나 마지막 원소를 놓친다'
    where: '질문 4'
  - topic: '가운데를 (low + high) / 2로 구하면 둘의 합이 int를 넘을 때 음수가 된다. low + (high - low) / 2나 (low + high) >>> 1로 구한다'
    where: '질문 4. 오버플로의 원리는 숫자 타입의 한계(J19)'
  - topic: '정렬되지 않은 리스트에 Collections.binarySearch를 부르는 실수'
    where: '실무에서는'
  - topic: '구간 찾기는 TreeMap.floorEntry로도 한다'
    where: '실무에서는. TreeMap은 이진 탐색 트리(K8)'
  - topic: 'DB 인덱스가 정렬된 구조에서 같은 생각으로 찾는다는 것'
    where: '실무에서는에 한 줄. 인덱스는 인덱스와 실행계획(D7)'
  - topic: '답의 범위에서 이진 탐색하기(조건을 만족하는 가장 작은 값 찾기)'
    where: '질문 4의 더 알아보기'
codes:
  predict: |-
    int[] ids = new int[1_000_000];
    for (int i = 0; i < ids.length; i++) {
      ids[i] = i * 2;
    }
    // 홀수 1_234_567을 찾을 때 비교는 몇 번?
  search: |-
    static int find(int[] a, int key) {
      int low = 0;
      int high = a.length - 1;
      while (low <= high) {
        int mid = (low + high) >>> 1;
        if (a[mid] < key) low = mid + 1;
        else if (a[mid] > key) high = mid - 1;
        else return mid;
      }
      return -1;
    }
  searchLoop: |-
    static int find(int[] a, int key) {
      int low = 0;
      int high = a.length - 1;
      while ([[low <= high]]) {
        int mid = (low + high) >>> 1;
        if (a[mid] < key) [[low = mid + 1]];
        else if (a[mid] > key) high = mid - 1;
        else return mid;
      }
      return -1;
    }
  fee: |-
    int[] bounds = {0, 10_000, 30_000, 50_000};
    int[] fees = {3000, 2500, 1000, 0};

    int i = Arrays.binarySearch(bounds, 27_000);
    // i는?
  feeRun: |-
    binarySearch(bounds, 27_000)
    binarySearch(bounds, 30_000)
    binarySearch(bounds, 60_000)
  section: |-
    static int section(int[] b, int amount) {
      int i = Arrays.binarySearch(b, amount);
      if (i >= 0) return i;
      int p = [[-(i + 1)]];
      return p - 1;
    }
  dup: |-
    int[] a = {1, 2, 2, 2, 2, 2, 3};
    Arrays.binarySearch(a, 2);
  unsortedArr: |-
    int[] a = {9, 2, 7, 4, 5};
    Arrays.binarySearch(a, 9);
  byComparator: |-
    orders.sort(byAmount);

    Collections.binarySearch(
        orders, key, [[byId]]);
    Collections.binarySearch(
        orders, key, [[byAmount]]);
  buggy: |-
    int low = 0;
    int high = a.length - 1;
    while ([[low < high]]) {
      int mid = (low + high) / 2;
      if (a[mid] < key) low = mid + 1;
      else if (a[mid] > key) high = mid - 1;
      else return mid;
    }
    return -1;
  buggyRun: |-
    buggy(new int[] {5}, 5);
    buggy(new int[] {1, 3, 5, 7}, 7);
  mid: |-
    int low = 1_500_000_000;
    int high = 1_600_000_000;

    [[(low + high) / 2]]
    (low + high) >>> 1
    low + (high - low) / 2
  unsorted: |-
    List<String> codes = new ArrayList<>(
        List.of("C10", "A20", "B30"));
    int i = Collections.binarySearch(
        codes, "C10");
  insert: |-
    int i = Collections.binarySearch(
        codes, code);
    if (i < 0) {
      codes.add([[-(i + 1)]], code);
    }
  floor: |-
    TreeMap<Integer, Integer> fee =
        new TreeMap<>(Map.of(
            0, 3000, 10_000, 2500,
            30_000, 1000, 50_000, 0));
    int f = fee.[[floorEntry]](27_000)
        .getValue();
  answerRange: |-
    long low = 1, high = 1_000_000;
    while (low < high) {
      long mid = (low + high) >>> 1;
      if (ok(mid)) high = mid;
      else low = mid + 1;
    }
    // low: ok가 참인 가장 작은 값
links:
  test: https://github.com/wanja727/dev-lessons/blob/main/verification/src/test/java/lab/devlessons/binarysearch/BinarySearchTest.java
  arrays: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/Arrays.html#binarySearch(int%5B%5D,int)
  collections: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/Collections.html#binarySearch(java.util.List,T)
  treeMap: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/TreeMap.html
predict:
  title: 100만 개에서 하나를 찾으려면?
  text: '코드 predict는 0부터 짝수 100만 개를 정렬된 배열에 담아요. 이진 탐색으로 배열에 없는 홀수 1_234_567을 찾으면, 가운데 값과 비교하는 일을 몇 번쯤 할까요? 답은 질문 1에 나와요.'
  code: predict
  label: 내 예측
  options:
    - value: twenty
      label: 약 20번
    - value: thousand
      label: 약 1천 번
    - value: half
      label: 약 50만 번
    - value: million
      label: 100만 번
  answer: twenty
  storageKey: bs-predict
  wrong: 예측은 "{label}"이었어요. 틀린 예측이 더 오래 남으니 괜찮아요.
questions:
  - id: q1
    title: 이진 탐색은 어떻게 찾을 범위를 줄이나요?
    conclusion:
      lead: '정렬된 범위의 가운데 값과 비교해서, 찾는 값이 있을 수 없는 절반을 통째로 버려요.'
      sub: '비교할 때마다 범위가 절반이 되니 최악에도 log₂ n번 남짓이에요. 100만 개면 20번, 10억 개면 30번이에요.'
    says:
      - '코드 search. 찾을 범위는 `low`부터 `high`까지다. 가운데 `mid`의 값이 찾는 값보다 작으면, 정렬되어 있으니 `mid`와 그 왼쪽은 모두 작다. 오른쪽 절반만 남긴다. 크면 왼쪽 절반만 남긴다. 같으면 찾았다'
      - '범위가 비면(`low > high`) 없는 것이다'
      - '예측의 답을 밝힌다. 100만 → 50만 → 25만 → ... 스무 번이면 1 아래로 내려간다. 2²⁰이 104만 8576이기 때문이다. 비교 횟수를 세어 보인다(테스트로 센 값은 20번). 처음부터 하나씩 보는 탐색은 같은 값에 100만 번 비교한다'
      - 'n이 두 배가 되면 비교는 한 번 는다. K1의 코드 halving과 같은 O(log n)이다. 10억 개여도 30번이다'
    widget:
      kind: steps
      note: '정렬된 16칸 배열 [3, 7, 12, 18, 21, 25, 30, 34, 37, 41, 46, 52, 58, 63, 70, 77]에서 37을 찾는다. 단계마다 남은 범위를 밝게, 버린 범위를 흐리게, `low`, `mid`, `high`에 표시를 둔다. 단계: mid=7(34<37, 오른쪽), mid=11(52>37, 왼쪽), mid=9(41>37, 왼쪽), mid=8(37, 찾음). 비교 4번을 센다. 시나리오를 하나 더 둔다: 없는 값 38을 찾아 범위가 비는 것'
    asks:
      - '본문의 예시: 정렬된 원소 1천 개에서 이진 탐색으로 없는 값을 찾으면 가운데 값과의 비교는 최대 몇 번 남짓인가 (10번. 2¹⁰은 1024)'
      - '옮긴 상황: 원소 100만 개에서 이진 탐색이 최대 20번 비교한다. 원소가 400만 개로 늘면 최대 몇 번 남짓인가 (22번. 두 배마다 한 번 는다)'
    body:
      - p: '찾을 범위를 `low`부터 `high`까지로 잡고, 그 가운데 `mid`의 값을 봐요. 코드는 이게 전부예요.'
      - code: search
      - p: '`a[mid]`가 찾는 값보다 작으면, 배열이 정렬되어 있으니 `mid`와 그 왼쪽은 **모두** 작아요. 볼 필요가 없으니 `low`를 `mid + 1`로 옮겨 오른쪽 절반만 남겨요. 크면 반대로 왼쪽 절반만 남겨요. 같으면 찾았어요. `low`가 `high`를 지나쳐 범위가 비면 없는 거예요.'
      - p: '16칸 배열에서 한 단계씩 넘겨 보세요. 비교할 때마다 남은 칸이 절반으로 줄어요.'
      - widget:
          kind: steps
          layout: [selector, duo, log, buttons, verdict]
          selector:
            label: 찾는 값
            options:
              - {value: hit, label: '37 (있음)'}
              - {value: miss, label: '38 (없음)'}
          initial:
            duo:
              - {label: 남은 범위, state: dim, text: '[3, 7, 12, 18, 21, 25, 30, 34, 37, 41, 46, 52, 58, 63, 70, 77] 16칸'}
              - {label: 비교, state: dim, text: '0번'}
          scenarios:
            hit:
              - log: 'low=0, high=15, mid=7: a[7]=34 < 37 → 오른쪽 절반'
                duo:
                  - label: 남은 범위
                    rows: [{k: 'low=8, high=15', v: '[37, 41, 46, 52, 58, 63, 70, 77] 8칸', mark: changed}]
                  - label: 비교
                    rows: [{k: 횟수, v: '1번'}]
              - log: 'mid=11: a[11]=52 > 37 → 왼쪽 절반'
                duo:
                  - label: 남은 범위
                    rows: [{k: 'low=8, high=10', v: '[37, 41, 46] 3칸', mark: changed}]
                  - label: 비교
                    rows: [{k: 횟수, v: '2번'}]
              - log: 'mid=9: a[9]=41 > 37 → 왼쪽 절반'
                duo:
                  - label: 남은 범위
                    rows: [{k: 'low=8, high=8', v: '[37] 1칸', mark: changed}]
                  - label: 비교
                    rows: [{k: 횟수, v: '3번'}]
              - log: 'mid=8: a[8]=37 = 37 → 찾음'
                duo:
                  - label: 남은 범위
                    rows: [{k: 결과, v: '위치 8', mark: changed}]
                  - label: 비교
                    rows: [{k: 횟수, v: '4번'}]
                verdict: '16칸에서 비교 4번이에요. 16 → 8 → 3 → 1로 줄었어요. 처음부터 보면 아홉 번째 칸까지 9번 비교해요.'
            miss:
              - log: 'low=0, high=15, mid=7: a[7]=34 < 38 → 오른쪽 절반'
                duo:
                  - label: 남은 범위
                    rows: [{k: 'low=8, high=15', v: '[37, 41, 46, 52, 58, 63, 70, 77] 8칸', mark: changed}]
                  - label: 비교
                    rows: [{k: 횟수, v: '1번'}]
              - log: 'mid=11: a[11]=52 > 38 → 왼쪽 절반'
                duo:
                  - label: 남은 범위
                    rows: [{k: 'low=8, high=10', v: '[37, 41, 46] 3칸', mark: changed}]
                  - label: 비교
                    rows: [{k: 횟수, v: '2번'}]
              - log: 'mid=9: a[9]=41 > 38 → 왼쪽 절반'
                duo:
                  - label: 남은 범위
                    rows: [{k: 'low=8, high=8', v: '[37] 1칸', mark: changed}]
                  - label: 비교
                    rows: [{k: 횟수, v: '3번'}]
              - log: 'mid=8: a[8]=37 < 38 → low=9. low > high라 범위가 빔'
                duo:
                  - label: 남은 범위
                    rows: [{k: 'low=9, high=8', v: '비었음', mark: bad}]
                  - label: 비교
                    rows: [{k: 횟수, v: '4번'}]
                verdict: '없는 값도 비교 4번이면 알 수 있어요. 범위가 비면 그 값은 배열에 없어요.'
      - p: '처음 예측의 답은 **약 20번**이에요. {{predict-result}} 100만 개를 절반씩 줄이면 50만, 25만, 12만 5천 ... 스무 번이면 1보다 작아져요. 2를 스무 번 곱하면 104만 8576이라서예요. 테스트로 직접 센 값이에요.'
      - ci:
          key: predict
          label: 실제로 센 비교 횟수 보기
          source: BinarySearchTest.comparisons
          code: predict
      - p: '처음부터 하나씩 보면 없는 값을 확인하는 데 100만 번이 들어요. 이진 탐색은 **n이 두 배가 되어도 비교가 한 번만 늘어요.** 원소가 400만 개면 22번, 10억 개여도 30번이에요. 시간 복잡도 레슨에서 본 O(log n)이 이 모양이에요.'
      - quiz:
          q: '정렬된 원소 1천 개에서 이진 탐색으로 없는 값을 찾으면 비교는 최대 몇 번 남짓일까요?'
          options:
            - '10번'
            - '100번'
            - '500번'
          answer: 1
          explain: '2를 열 번 곱하면 1024라서, 1천 개는 열 번 절반으로 나누면 1 아래로 내려가요. 테스트로 세어도 10번이었어요.'
      - next: '절반을 버리는 근거는 "정렬되어 있다"였어요. 그러면 이진 탐색은 언제나 쓸 수 있을까요?'
    recall: '정렬된 범위의 가운데 값과 비교해서, 찾는 값이 있을 수 없는 절반을 통째로 버려요. 비교할 때마다 범위가 절반이 되니 최악에도 log₂ n번 남짓이에요. 100만 개면 20번, 10억 개면 30번이고, n이 두 배가 되면 비교는 한 번 늘어요. 범위가 비면 없는 값이에요.'
  - id: q2
    title: 이진 탐색은 언제 쓸 수 있나요?
    conclusion:
      lead: '데이터가 찾는 기준으로 정렬되어 있고, 가운데 원소를 바로 읽을 수 있을 때만 써요.'
      sub: '정렬되지 않은 데이터에 쓰면 예외 없이 틀린 답이 나와요. 정렬에는 O(n log n)이 드니, 여러 번 찾을 때 정렬해 두는 값어치가 있어요.'
    says:
      - '정렬이 필요한 이유. 절반을 버리는 근거가 "가운데보다 작으면 왼쪽은 모두 작다"였다. 정렬되지 않았으면 이 근거가 없다. 정렬되지 않은 배열 `{9, 2, 7, 4, 5}`에서 있는 값 9를 찾아도 -6이 나오는 예를 보인다. 예외는 나지 않는다'
      - '`Arrays.binarySearch`의 API 문서도 정렬되지 않은 배열의 결과는 정해지지 않았다고 적는다. 검사하지 않는다'
      - '찾는 기준으로 정렬되어 있어야 한다. 주문을 금액 순으로 정렬해 두고 id로 이진 탐색하면 틀린다. `Comparator`로 정렬했다면 `Collections.binarySearch(list, key, 같은 Comparator)`로 찾는다'
      - '가운데를 바로 읽어야 하는 이유. `ArrayList`와 배열은 `get(mid)`가 O(1)이다(K2). `LinkedList`는 가운데까지 따라가야 한다. `Collections.binarySearch`는 `LinkedList`를 받으면 비교는 log n번이지만 노드를 따라가는 데 O(n)이 든다'
      - '한 번 찾을 거면 정렬하지 않는다. 정렬 O(n log n) + 찾기 O(log n)은 처음부터 보는 O(n)보다 크다. 같은 데이터에서 여러 번 찾을 때 정렬 한 번의 비용을 나눠 갖는다'
    asks:
      - '본문의 예시: `int[] a = {9, 2, 7, 4, 5};`에 `Arrays.binarySearch(a, 9)`를 불렀다. 결과에 대해 맞는 것은 무엇인가 (믿을 수 없다. 정렬되지 않은 배열의 결과는 정해지지 않았고 예외도 나지 않는다)'
      - '옮긴 상황: 정렬되지 않은 회원 1만 명에서 이메일 하나를 딱 한 번 찾는다. 정렬한 뒤 이진 탐색하는 것과 처음부터 하나씩 보는 것 가운데 무엇이 빠른가 (처음부터 하나씩 보는 것. 정렬에만 O(n log n)이 든다)'
    body:
      - p: '조건은 두 가지예요. **찾는 기준으로 정렬되어 있을 것**, **가운데를 바로 읽을 수 있을 것.**'
      - h3: 정렬되어 있지 않으면 틀린 답이 나와요
      - p: '절반을 버리는 근거는 "가운데보다 작으면 왼쪽은 모두 작다"였어요. 정렬되어 있지 않으면 이 근거가 없어요. 9가 분명히 들어 있는 배열에서 9를 찾아 봤어요.'
      - ci:
          key: unsorted
          label: 실제 결과 보기
          source: BinarySearchTest.unsorted
          code: unsortedArr
      - p: '-6은 "없다"는 뜻이에요(음수의 뜻은 질문 3에서 봐요). 가운데 7보다 9가 크니 오른쪽만 봤는데, 9는 맨 왼쪽에 있었어요. **예외는 나지 않아요.** `Arrays.binarySearch`의 [API 문서](link:arrays)도 정렬되지 않은 배열의 결과는 정해지지 않았다고 적고, 정렬되어 있는지 검사하지 않아요. 검사하려면 n개를 다 봐야 해서 이진 탐색을 쓰는 의미가 없어지기 때문이에요.'
      - h3: 찾는 기준으로 정렬되어 있어야 해요
      - p: '정렬은 되어 있어도 **기준이 다르면** 같은 일이 생겨요. 주문을 금액 순으로 정렬해 두고 id로 찾으면 틀린 답이 나와요.'
      - code: byComparator
        notes:
          - mark: byId
            as: code
            text: '금액 순으로 놓인 리스트를 id 순인 것처럼 반으로 나눠요. 있는 주문도 음수가 나와요.'
          - mark: byAmount
            as: code
            text: '정렬한 `Comparator`와 같은 것을 넘기면 맞게 찾아요.'
      - h3: 가운데를 바로 읽어야 해요
      - p: '배열과 `ArrayList`는 `get(mid)`가 한 번에 그 칸으로 가요(O(1), 배열과 연결 리스트 레슨). `LinkedList`는 앞에서부터 노드를 따라가야 가운데에 닿아요. `Collections.binarySearch`에 `LinkedList`를 넘기면 비교는 log n번이지만, 노드를 따라가는 데 O(n)이 들어서 처음부터 보는 것보다 나을 게 없어요. 원소 10만 개의 `LinkedList`에서 세어 보니 비교는 17번이었고, 따라가는 일은 [API 문서](link:collections)에 O(n)으로 적혀 있어요.'
      - h3: 한 번 찾을 거면 정렬하지 않아요
      - p: '정렬되지 않은 데이터를 이진 탐색하려면 먼저 정렬해야 하고, 정렬에는 O(n log n)이 들어요. 딱 한 번 찾을 거면 처음부터 보는 O(n)이 더 싸요. **같은 데이터에서 여러 번 찾을 때** 정렬 한 번의 비용을 나눠 가져서 값어치가 생겨요.'
      - table:
          head: [상황, 고를 것]
          rows:
            - ['정렬되지 않은 데이터에서 한 번 찾기', '처음부터 보기 O(n)']
            - ['같은 데이터에서 여러 번 찾기', '한 번 정렬하고 이진 탐색 O(log n)씩']
            - ['정렬된 배열이나 `ArrayList`', '이진 탐색']
            - ['`LinkedList`', '이진 탐색의 이득이 없음']
      - quiz:
          q: '정렬되지 않은 회원 1만 명에서 이메일 하나를 딱 한 번 찾아요. 무엇이 빠를까요?'
          options:
            - '정렬한 뒤 이진 탐색'
            - '처음부터 하나씩 보기'
            - '둘이 같다'
          answer: 2
          explain: '정렬에만 O(n log n)이 들어서 처음부터 보는 O(n)보다 커요. 정렬은 여러 번 찾을 때 값어치가 있어요.'
      - next: '이진 탐색이 값을 못 찾았을 때 그냥 -1을 돌려주면 될 텐데, 자바는 -6 같은 수를 돌려줬어요. 이 수에는 무슨 뜻이 있을까요?'
    recall: '데이터가 찾는 기준으로 정렬되어 있고 가운데를 바로 읽을 수 있을 때만 써요. 정렬되지 않은 데이터에 쓰면 예외 없이 틀린 답이 나오고, 다른 기준으로 정렬했어도 그래요. `Comparator`로 정렬했으면 같은 것을 넘겨요. `LinkedList`는 가운데까지 따라가는 데 O(n)이 들어 이득이 없어요. 정렬에 O(n log n)이 드니 한 번만 찾을 거면 처음부터 봐요.'
  - id: q3
    title: 찾는 값이 없으면 자바의 binarySearch는 무엇을 돌려주나요?
    conclusion:
      lead: '그 값이 들어가야 할 자리를 음수로 바꾼 `-(넣을 위치) - 1`을 돌려줘요.'
      sub: '그래서 음수면 없다는 뜻이고, 거꾸로 계산하면 "이 값보다 큰 첫 칸"을 알 수 있어요. 이것으로 값이 속한 구간을 찾아요.'
    says:
      - '`Arrays.binarySearch`는 찾으면 그 위치(0 이상)를 돌려준다. 못 찾으면 그 값을 넣어도 정렬이 유지되는 위치 p를 구해 `-p - 1`을 돌려준다. 1을 빼는 이유는 p가 0일 때도 음수가 되게 하려는 것이다'
      - '코드 fee. 27,000원은 경계값 배열에 없다. 넣을 위치는 2(30,000 앞)라서 -3이 나온다. `-(i + 1)`로 넣을 위치 2를 되찾고, 그 앞 칸 1이 27,000이 속한 구간이다. 배송비는 2,500원이다'
      - '경계값과 똑같은 30,000원이면 2가 나온다. 찾은 경우와 못 찾은 경우를 나눠 구간 번호를 구하는 코드를 보인다'
      - '같은 값이 여럿이면 그 가운데 어느 것의 위치가 나올지 약속하지 않는다. 같은 값이 다섯 개인 배열에서 나온 위치를 보인다(테스트에서는 첫 번째 1이 아니라 3). 첫 번째 위치가 필요하면 질문 4의 방식으로 직접 짜거나, 같은 값을 두지 않는 `TreeMap`을 쓴다'
    asks:
      - '본문의 예시: 코드 fee의 `bounds`에서 `Arrays.binarySearch(bounds, 60_000)`의 결과는 무엇인가 (-5. 넣을 위치가 4다)'
      - '옮긴 상황: 정렬된 배열 `{10, 20, 30}`에서 `Arrays.binarySearch`가 -1을 돌려줬다. 찾은 값은 무엇보다 작은가 (10. 넣을 위치가 0이라 맨 앞이다)'
      - '실무 구역: 코드 unsorted의 결과로 맞는 것은 무엇인가 (음수. "C10"이 있는데도 못 찾는다. 리스트가 정렬되어 있지 않다)'
    body:
      - p: '배송비 구간표예요. 0원 이상은 3,000원, 1만 원 이상은 2,500원, 3만 원 이상은 1,000원, 5만 원 이상은 무료예요. 27,000원 주문은 경계값 배열에 없어요. 무엇이 나올까요?'
      - code: fee
      - ci:
          key: fee
          label: 실제 결과 보기
          source: BinarySearchTest.insertionPoint
          code: feeRun
      - p: '규칙은 이래요. **찾으면 그 위치**(0 이상)를 돌려줘요. **못 찾으면** 그 값을 넣어도 정렬이 유지되는 자리, 즉 **넣을 위치** p를 구해서 `-p - 1`을 돌려줘요.'
      - ul:
          - '27,000은 30,000 앞, 위치 2에 들어가야 해요. 그래서 `-2 - 1` = **-3**이에요.'
          - '30,000은 있으니 그 위치 **2**예요.'
          - '60,000은 맨 끝, 위치 4에 들어가야 해서 **-5**예요.'
      - p: '1을 빼는 이유는 넣을 위치가 0일 때 때문이에요. `-0`은 0이라 "위치 0에서 찾았다"와 구별되지 않아요. 1을 더 빼서 못 찾으면 언제나 음수가 되게 했어요.'
      - h3: 넣을 위치로 구간을 찾아요
      - p: '넣을 위치 p는 "이 값보다 큰 첫 칸"이에요. 그러니 그 앞 칸 `p - 1`이 이 값이 속한 구간이에요.'
      - code: section
        notes:
          - mark: '-(i + 1)'
            as: code
            text: '`-p - 1`을 거꾸로 풀어 넣을 위치 p를 되찾아요. 27,000이면 p는 2, 구간은 1, 배송비는 2,500원이에요.'
      - p: '경계값과 똑같은 30,000원은 찾은 경우라 위치 2가 바로 구간이에요. 두 경우를 나눠야 하는 이유예요.'
      - h3: 같은 값이 여럿이면
      - p: '같은 값이 다섯 개 있으면 그 가운데 **어느 것의 위치가 나올지 약속하지 않아요.** 가운데에서 먼저 만난 것을 돌려줘요.'
      - ci:
          key: dup
          label: 실제 결과 보기
          source: BinarySearchTest.duplicates
          code: dup
      - p: '첫 번째 2는 위치 1인데 3이 나왔어요. 첫 번째 위치가 필요하면 질문 4의 방식으로 직접 짜거나(같은 값을 만나도 왼쪽을 계속 보기), 같은 키를 두지 않는 `TreeMap`을 써요.'
      - quiz:
          q: '정렬된 배열 `{10, 20, 30}`에서 `Arrays.binarySearch`가 -1을 돌려줬어요. 찾은 값에 대해 맞는 것은?'
          options:
            - '10보다 작다'
            - '10과 20 사이다'
            - '30보다 크다'
          answer: 1
          explain: '-1 = -0 - 1이라 넣을 위치가 0, 맨 앞이에요. 첫 원소 10보다 작은 값이에요.'
      - next: '라이브러리는 이렇게 잘 동작해요. 그러면 직접 짜면 어디서 틀리기 쉬울까요?'
    recall: '찾으면 그 위치를, 못 찾으면 그 값이 들어가야 할 넣을 위치 p를 써서 `-p - 1`을 돌려줘요. 1을 빼는 것은 p가 0일 때도 음수가 되게 하려는 거예요. `-(i + 1)`로 넣을 위치를 되찾으면 "이 값보다 큰 첫 칸"이라, 그 앞 칸이 값이 속한 구간이에요. 같은 값이 여럿이면 어느 위치가 나올지 약속하지 않아요.'
  - id: q4
    title: 이진 탐색을 직접 짜면 어디서 틀리기 쉽나요?
    conclusion:
      lead: '범위의 경계와 가운데를 구하는 계산이에요. 반복 조건과 범위를 줄이는 방식이 맞지 않으면 끝나지 않거나 마지막 원소를 놓쳐요.'
      sub: '가운데를 `(low + high) / 2`로 구하면 둘의 합이 int를 넘을 때 음수가 돼요. `(low + high) >>> 1`이나 `low + (high - low) / 2`로 구해요.'
    says:
      - '`low`와 `high`의 뜻을 먼저 정한다. 코드 search는 둘 다 찾을 범위에 들어간다(닫힌 범위). 그래서 `low <= high`인 동안 돌고, 버릴 때 `mid`를 빼서 `mid + 1`, `mid - 1`로 줄인다'
      - '코드 buggy는 닫힌 범위로 시작했지만 `low < high`로 돈다. 범위에 원소 하나가 남으면(`low == high`) 확인하지 않고 끝난다. 원소가 하나뿐인 배열이나 맨 끝의 원소를 못 찾는다. 찾지 못하는 입력을 테스트로 보인다'
      - '반대로 `high = mid`처럼 `mid`를 빼지 않고 줄이면 범위가 더 줄지 않아 끝나지 않는 경우가 생긴다. 뜻에 맞춰 조건과 갱신을 함께 고친다'
      - '가운데의 오버플로. `low`와 `high`가 각각 10억을 넘으면 `low + high`가 int의 최댓값(약 21억)을 넘어 음수가 되고(J19), 배열을 음수 위치로 읽어 `ArrayIndexOutOfBoundsException`이 난다. 배열을 그렇게 크게 만들기는 어려워서, 같은 계산을 숫자 범위에 대고 보인다. `(low + high) >>> 1`은 넘친 비트를 부호 없는 수로 읽어 바른 값을 낸다. 자바의 `Arrays.binarySearch`도 이 식을 쓴다'
      - '더 알아보기: 이진 탐색은 정렬된 배열만이 아니라 "어느 값부터 조건이 참이 되는가"를 찾는 데도 쓴다. 조건이 거짓, 거짓, 참, 참처럼 한 번만 바뀌면 그 경계를 같은 방식으로 찾는다'
    asks:
      - '본문의 예시: 코드 buggy로 `{5}`에서 5를 찾으면 무엇을 돌려주나 (-1. 반복 조건 `low < high`가 처음부터 거짓이다)'
      - '옮긴 상황: `low`가 1,500,000,000이고 `high`가 1,600,000,000이다. `int mid = (low + high) / 2;`의 결과는 양수인가 (아니다. 합이 int를 넘어 음수가 된다)'
    body:
      - p: '이진 탐색은 생각은 쉬운데 바르게 짜기는 어렵기로 유명해요. 틀리는 곳은 두 군데예요. **범위의 경계**와 **가운데의 계산.**'
      - h3: 경계는 low와 high의 뜻에서 나와요
      - p: '먼저 `low`와 `high`가 무엇을 뜻하는지 정해요. 코드 search는 **둘 다 찾을 범위에 들어가요**(닫힌 범위). 그 뜻에서 나머지가 따라 나와요.'
      - code: searchLoop
        notes:
          - mark: low <= high
            as: code
            text: '`low == high`여도 원소 하나가 남은 범위라 확인해야 해요. 그래서 `<=`예요.'
          - mark: low = mid + 1
            as: code
            text: '`mid`는 방금 봤으니 범위에서 빼요. 빼야 범위가 반드시 줄어서 끝나요.'
      - p: '뜻과 코드가 어긋나면 틀려요. 코드 buggy는 닫힌 범위로 시작했는데 `low < high`로 돌아요.'
      - code: buggy
        notes:
          - mark: low < high
            as: code
            text: '원소 하나가 남으면(`low == high`) 확인하지 않고 끝나요.'
      - ci:
          key: buggy
          label: 두 코드에 같은 입력을 넣은 결과 보기
          source: BinarySearchTest.boundary
          code: buggyRun
      - p: '원소가 하나뿐인 배열과 맨 끝 원소를 못 찾았어요. 반대로 고친다고 `high = mid`처럼 `mid`를 빼지 않고 줄이면, 범위가 더 줄지 않는 경우가 생겨 **끝나지 않아요.** 조건과 갱신은 한쪽만 고치지 말고 `low`와 `high`의 뜻에 맞춰 함께 고쳐요.'
      - h3: 가운데를 구하다 넘쳐요
      - p: '`(low + high) / 2`는 맞아 보여요. 그런데 `low`와 `high`가 각각 15억, 16억이면 합 31억이 `int`의 최댓값(약 21억)을 넘어요. 숫자 타입의 한계 레슨에서 본 **오버플로**예요.'
      - ci:
          key: mid
          label: 세 식의 실제 값 보기
          source: BinarySearchTest.midOverflow
          code: mid
      - p: '음수가 된 `mid`로 배열을 읽으면 `ArrayIndexOutOfBoundsException`이 나요. 원소가 10억 개 넘는 배열은 만들기 어려워서 숫자로 보였지만, 큰 범위를 다루면 실제로 생겨요. 자바 라이브러리에서도 오래 남아 있던 버그예요.'
      - ul:
          - '**`low + (high - low) / 2`**: 차이를 먼저 구해서 넘치지 않아요.'
          - '**`(low + high) >>> 1`**: 넘친 합을 부호 없는 수로 읽고 오른쪽으로 한 칸 밀어 바른 값을 내요. 자바의 `Arrays.binarySearch`가 쓰는 식이에요.'
      - more:
          summary: '더 알아보기: 배열이 아니라 답의 범위에서 찾기'
          body:
            - p: '이진 탐색은 "어느 값부터 조건이 참이 되는가"를 찾는 데도 써요. 조건이 거짓, 거짓, 참, 참처럼 한 번만 바뀌면 그 경계를 같은 방식으로 찾아요. 예를 들어 "하루에 몇 개씩 처리해야 기한 안에 끝나는가"의 가장 작은 값이에요.'
            - code: answerRange
            - p: '여기서는 `high`가 "참인 쪽"을 뜻해서 `high = mid`로 줄이고 `low < high`로 돌아요. 뜻이 다르니 조건과 갱신도 달라요. 이 방식은 같은 값이 여럿일 때 첫 번째 위치를 찾는 데도 써요.'
      - quiz:
          q: '코드 buggy로 원소 하나짜리 배열 `{5}`에서 5를 찾으면 무엇을 돌려줄까요?'
          options:
            - '0'
            - '-1'
            - '끝나지 않는다'
          answer: 2
          explain: '`low`와 `high`가 처음부터 둘 다 0이라 `low < high`가 거짓이에요. 반복을 한 번도 돌지 않고 -1을 돌려줘요.'
    recall: '범위의 경계와 가운데 계산이에요. `low`와 `high`가 닫힌 범위면 `low <= high`로 돌고 `mid + 1`, `mid - 1`로 줄여요. `low < high`로 돌면 원소 하나 남은 범위를 놓치고, `mid`를 빼지 않으면 끝나지 않을 수 있어요. 가운데를 `(low + high) / 2`로 구하면 합이 int를 넘어 음수가 되니 `(low + high) >>> 1`이나 `low + (high - low) / 2`로 구해요.'
practice:
  title: 실무에서는 이렇게 만나요
  says:
    - '구간 찾기는 이진 탐색의 흔한 쓰임이다. 배송비, 등급 기준, 세율 구간처럼 정렬된 경계값에서 값이 속한 구간을 찾는다. 질문 3의 계산을 직접 해도 되지만, 코드 floor처럼 `TreeMap.floorEntry`가 "이 값 이하인 가장 큰 키"를 바로 준다. 같은 입력으로 두 방식의 결과를 비교한다. `TreeMap`은 이진 탐색 트리(K8)에서 다룬다'
    - '흔한 실수: 코드 unsorted처럼 정렬하지 않은 리스트에 `Collections.binarySearch`를 부른다. 대개 리스트가 처음에는 정렬되어 있다가, 누군가 중간에 원소를 `add`하면서 정렬이 깨진다. 결과는 틀리고 예외는 없다. 고친 코드: 넣을 때 정렬을 지키거나(`binarySearch`의 넣을 위치에 `add(p, x)`), 찾기 전에 정렬하거나, 처음부터 정렬을 지키는 `TreeSet`을 쓴다. 고치기 전후의 결과를 테스트로 남긴다'
    - '같은 생각은 DB에도 있다. 인덱스는 값을 정렬된 구조로 들고 있어서 조건에 맞는 행을 처음부터 보지 않고 찾는다. 인덱스와 실행계획(D7)에서 다룬다'
  body:
    - p: '자바와 스프링 개발자가 이진 탐색을 직접 짤 일은 드물어요. 대신 이진 탐색을 쓰는 API를 부르고, 그 전제를 지키는 쪽이 일이에요.'
    - h3: 구간 찾기는 TreeMap으로도
    - p: '배송비, 회원 등급 기준, 세율 구간처럼 경계값에서 구간을 찾는 일은 흔해요. 질문 3의 계산을 직접 해도 되지만, `TreeMap`이 같은 일을 한 줄로 해요.'
    - code: floor
      notes:
        - mark: floorEntry
          as: code
          text: '"이 키 이하인 가장 큰 키"의 항목을 돌려줘요. 27,000원이면 키 10,000의 항목, 배송비 2,500원이에요. 질문 3의 `section`과 같은 답이에요.'
    - ci:
        key: floor
        label: 실제 결과 보기
        source: BinarySearchTest.floorEntry
    - p: '경계값과 같은 30,000원도 따로 나누지 않고 맞게 줘요. `TreeMap`이 어떻게 정렬을 지키며 찾는지는 [이진 탐색 트리](lesson:binary-search-tree) 레슨에서 봐요.'
    - h3: '흔한 실수: 정렬이 깨진 리스트에 binarySearch'
    - p: '처음에는 정렬된 코드 목록이었는데, 누군가 새 코드를 끝에 `add`해서 정렬이 깨졌어요. 있는 "C10"을 찾아요.'
    - code: unsorted
    - ci:
        key: unsorted
        label: 정렬 전후의 실제 결과 보기
        source: BinarySearchTest.unsorted
    - p: '정렬 전에는 있는 값을 못 찾았고(-4) **예외도 없었어요.** 질문 2의 이유 그대로예요. 고치는 방법은 셋이에요.'
    - ul:
        - '**넣을 때 정렬을 지켜요.** 넣을 위치에 넣으면 정렬이 깨지지 않아요.'
        - '**찾기 전에 정렬해요.** 넣는 일이 드물고 찾는 일이 많을 때요.'
        - '**처음부터 정렬을 지키는 `TreeSet`, `TreeMap`을 써요.** 넣고 찾는 일이 섞일 때요.'
    - code: insert
      notes:
        - mark: '-(i + 1)'
          as: code
          text: '못 찾았을 때의 음수에서 넣을 위치를 되찾아 그 자리에 넣어요. 테스트에서 넣은 뒤에도 "C10"을 바르게 찾았어요.'
    - h3: DB 인덱스도 같은 생각이에요
    - p: 'DB의 인덱스는 열의 값을 정렬된 구조로 들고 있어서, `WHERE id = ?`에 맞는 행을 처음부터 보지 않고 찾아요. 정렬해 두고 절반씩 버리는 생각이 같아요. [인덱스와 실행계획](lesson:index-explain) 레슨에서 다뤄요.'
interview:
  question: 이진 탐색은 어떻게 동작하고, 쓸 때 무엇을 조심해야 하나요?
  model:
    - label: 정의
      text: 정렬된 데이터에서 가운데 값과 비교해, 찾는 값이 있을 수 없는 절반을 버리는 일을 되풀이해 찾는 방법입니다. 비교할 때마다 범위가 절반이 되어 O(log n)이고, 100만 개에서 20번 남짓 비교합니다.
    - label: 원리
      text: 정렬되어 있어서 가운데보다 작으면 왼쪽이 모두 작다는 것이 절반을 버리는 근거입니다. 그래서 찾는 기준으로 정렬되어 있고 가운데를 O(1)에 읽을 수 있는 배열이나 ArrayList에서만 씁니다. 자바의 binarySearch는 못 찾으면 -(넣을 위치) - 1을 돌려줘 구간 찾기에도 씁니다.
    - label: 주의할 점
      text: 정렬되지 않은 데이터에 부르면 예외 없이 틀린 답이 나옵니다. 정렬에 O(n log n)이 드니 한 번만 찾을 거면 처음부터 봅니다. 직접 짤 때는 low와 high의 뜻에 맞춰 반복 조건과 갱신을 정하고, 가운데는 오버플로가 없게 (low + high) >>> 1로 구합니다.
    - label: 경험
      text: '(내 프로젝트로 채우기) 예: 배송비 구간을 if 문으로 늘어놓던 코드를 경계값 배열과 TreeMap.floorEntry로 바꿔 구간을 더하기 쉽게 했습니다.'
verified: 이 레슨의 비교 횟수와 반환값은 짐작이 아니라 자바 21에서 코드를 돌려 받은 값이에요. 코드가 바뀔 때마다 테스트([BinarySearchTest](link:test))가 다시 돌아요.
footer: '근거: `Arrays.binarySearch`의 반환값과 정렬되지 않은 배열의 결과는 [API 문서](link:arrays), `LinkedList`처럼 임의 접근이 아닌 리스트에서 하는 일은 [Collections API 문서](link:collections), `floorEntry`는 [TreeMap API 문서](link:treeMap). 결과는 OpenJDK 21에서 테스트로 확인했어요. 오류는 [GitHub 이슈](https://github.com/wanja727/dev-lessons/issues)로 알려 주세요.'
claims:
  - claim: '정렬된 원소 100만 개에서 없는 값을 찾으면 코드 search의 반복은 20번 안팎이다'
    how: '반복 카운터로 센다. 설계 때 고른 1_234_568은 짝수라 배열에 있어서, 없는 값 1_234_567로 바꿨다. 20번이었다. 1천 개는 10번, 400만 개는 22번'
    test: BinarySearchTest.comparisons
  - claim: '정렬되지 않은 배열에서 있는 값을 `Arrays.binarySearch`로 찾아도 음수가 나올 수 있고 예외는 나지 않는다'
    how: '`{9, 2, 7, 4, 5}`에서 9를 찾으면 -6'
    test: BinarySearchTest.unsorted
  - claim: '금액 순으로 정렬한 리스트를 id 기준으로 찾으면 있는 것도 음수, 같은 Comparator로 찾으면 맞다'
    how: '주문 다섯 개로 돌린다'
    test: BinarySearchTest.sameComparator
  - claim: '`LinkedList`에도 `Collections.binarySearch`의 비교는 log n번이다'
    how: '세는 Comparator로 원소 10만 개를 찾는다. 17번'
    test: BinarySearchTest.linkedListComparisons
  - claim: '코드 fee에서 27,000은 -3, 30,000은 2, 60,000은 -5다'
    how: '실행해 본다'
    test: BinarySearchTest.insertionPoint
  - claim: '같은 값이 다섯 개인 배열에서 첫 번째가 아닌 위치가 나온다'
    how: '`{1, 2, 2, 2, 2, 2, 3}`에서 2를 찾으면 3'
    test: BinarySearchTest.duplicates
  - claim: '코드 buggy는 원소 하나짜리 배열과 맨 끝 원소를 찾지 못하고, 코드 search는 찾는다'
    how: '같은 입력으로 두 메서드를 부른다'
    test: BinarySearchTest.boundary
  - claim: '`(1_500_000_000 + 1_600_000_000) / 2`는 음수이고 `>>> 1`로 구하면 1,550,000,000이다'
    how: '두 식을 계산한다'
    test: BinarySearchTest.midOverflow
  - claim: '`TreeMap.floorEntry(27_000)`은 10,000 구간을 돌려줘 배송비 2,500원이다'
    how: '코드 floor를 실행한다'
    test: BinarySearchTest.floorEntry
  - claim: '코드 unsorted는 정렬한 뒤에는 바른 위치를 돌려준다. 넣을 위치에 넣으면 정렬이 유지된다'
    how: '정렬 전후의 결과를 비교한다. 설계 때 찾던 "B30"은 정렬되지 않은 리스트에서도 우연히 찾아져서, 못 찾는 "C10"으로 바꿨다'
    test: BinarySearchTest.unsorted
sources:
  - '`Arrays.binarySearch`의 반환값과 정렬되지 않은 배열의 결과: API 문서 https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/Arrays.html'
  - '`Collections.binarySearch`가 임의 접근이 아닌 리스트에서 하는 일: API 문서 https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/Collections.html'
  - '`TreeMap.floorEntry`: API 문서 https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/TreeMap.html'
