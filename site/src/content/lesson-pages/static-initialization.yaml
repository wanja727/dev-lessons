# static과 초기화 순서
# 자료 파일의 칸은 docs/lesson-data-format.md에 있다. 문제는 content/questions/static-initialization.yaml에 있다.
title: static과 초기화 순서
description: static이 붙은 것은 무엇에 딸려 있는지, static 필드와 static 블록은 언제 실행되는지, 객체를 만들 때 부모와 자식이 어떤 순서로 초기화되는지. 세 가지 질문에 스스로 답할 수 있게, 단계마다 출력을 넣은 쿠폰 클래스를 돌려 보며 배우는 대화형 레슨.
unit: 자바 언어
minutes: 18
roadmap: J5
type: 자바 실행
prerequisites:
  - {slug: value-and-reference, title: 값과 참조}
assume: '자바 21. 클래스에 필드와 생성자를 만들고 `extends`로 상속해 본 것. 필드는 값을 주지 않으면 0이나 null로 시작한다는 것(값과 참조 레슨).'
example: '쿠폰 `Coupon`과 그것을 상속한 `VipCoupon`. static 필드, static 블록, 필드 초기화, 생성자에 출력을 한 줄씩 넣고 `new VipCoupon()`을 두 번 불러 출력의 순서를 봐요. 실무 구역에서는 같은 순서를 스프링 빈의 생성과 주입으로 옮겨요.'
intro:
  - '서비스 클래스의 생성자에서 주입받은 리포지토리를 썼더니 `NullPointerException`으로 서버가 켜지지 않아요. 필드에 `@Autowired`는 분명히 붙어 있어요. 옆자리 동료는 주입받는 필드에 `static`을 붙였다가 언제나 null인 것을 보고 있어요.'
  - '둘 다 "무엇이 언제 만들어지고 채워지는가"의 문제예요. 스프링은 자바가 객체를 만드는 순서를 바꾸지 못하고 그 위에서 일해요. 그래서 static이 무엇에 딸린 것인지, 클래스와 객체가 어떤 순서로 초기화되는지를 알아야 스프링의 주입 순서도 읽혀요.'
  - '이 레슨에서는 초기화의 각 단계에 출력을 넣은 코드를 돌려서 순서를 직접 확인하고, 마지막에 같은 순서를 스프링 빈에서 봐요.'
covers:
  - topic: 'static 필드는 클래스에 하나이고 모든 객체가 함께 쓴다. 인스턴스 필드는 객체마다 있다'
    where: '질문 1'
  - topic: 'static 메서드에는 this가 없어서 인스턴스 필드와 인스턴스 메서드를 바로 쓸 수 없다. main이 static인 이유'
    where: '질문 1'
  - topic: 'static의 쓰임: 상수(static final), 상태 없는 유틸 메서드, 객체를 만들어 주는 static 메서드'
    where: '질문 1, 실무에서는'
  - topic: '클래스 초기화: 클래스가 처음 쓰일 때 한 번, static 필드의 대입과 static 블록이 위에서 아래로 실행된다'
    where: '질문 2'
  - topic: '클래스 초기화를 일으키는 것(new, static 메서드 호출, 상수가 아닌 static 필드 접근)과 일으키지 않는 것(컴파일 시점 상수 읽기)'
    where: '질문 2'
  - topic: '아직 대입되지 않은 static 필드를 먼저 읽으면 기본값이 보인다'
    where: '질문 2'
  - topic: '객체 초기화: 필드 초기화와 인스턴스 블록이 위에서 아래로, 그다음 생성자 본문'
    where: '질문 3'
  - topic: '상속이 있을 때의 전체 순서: 부모 static, 자식 static, 부모 인스턴스와 생성자, 자식 인스턴스와 생성자'
    where: '질문 3'
  - topic: '바뀌는 static 상태가 위험한 이유: 모든 곳이 함께 쓰고 테스트끼리 영향을 준다'
    where: '질문 1, 실무에서는'
  - topic: '스프링 빈에서의 순서: 생성자가 끝난 뒤에 필드 주입이 일어난다. 생성자 주입을 쓰는 이유 가운데 하나'
    where: '실무에서는. 빈의 생명주기 전체와 @PostConstruct는 빈의 생명주기와 스코프(S3)'
  - topic: '스프링은 static 필드에 주입하지 않는다'
    where: '실무에서는'
  - topic: '생성자에서 오버라이딩된 메서드를 부르면 자식의 필드가 아직 초기화되지 않은 것이 보인다'
    where: '다루지 않음: 상속과 다형성(J7)'
  - topic: 'static 메서드는 오버라이딩되지 않는다'
    where: '다루지 않음: 상속과 다형성(J7)'
  - topic: '클래스가 읽히는 과정(로딩, 링크)과 클래스 로더'
    where: '다루지 않음: 자바 프로그램이 실행되는 과정(J1)'
  - topic: 'static 필드가 놓이는 메모리 영역'
    where: '다루지 않음: JVM 메모리 구조(J14)'
  - topic: 'static 컬렉션에 쌓인 객체가 수거되지 않는 메모리 누수'
    where: '다루지 않음: 가비지 컬렉션(J15)'
  - topic: 'static 필드를 여러 스레드가 동시에 바꿀 때의 문제'
    where: '다루지 않음: 경쟁 상태와 동기화(C3)'
  - topic: 'static으로 만드는 싱글톤과 초기화를 미루는 기법'
    where: '다루지 않음: 싱글톤 패턴(O11)'
  - topic: 'static 중첩 클래스'
    where: '다루지 않음: 중첩 클래스와 익명 클래스(J16)'
codes:
  predict: |-
    class Coupon {
      static { print("1 Coupon static"); }
      int rate = init("2 Coupon 필드");
      Coupon() { print("3 Coupon 생성자"); }
    }

    class VipCoupon extends Coupon {
      static { print("4 Vip static"); }
      int bonus = init("5 Vip 필드");
      VipCoupon() { print("6 Vip 생성자"); }
    }

    new VipCoupon();
    new VipCoupon();
  counter: |-
    class Coupon {
      [[static int issued = 0]];
      int number;

      Coupon() {
        issued++;
        number = issued;
      }
    }

    Coupon a = new Coupon();
    Coupon b = new Coupon();
    Coupon c = new Coupon();
  staticMethod: |-
    class Cart {
      int total;
      static int tax() {
        return [[total]] / 10;
      }
    }
  trigger: |-
    class Rates {
      static final int MAX = 50;
      static { print("Rates 초기화"); }
      static int max() { return MAX; }
    }

    print("상수 읽기: " + [[Rates.MAX]]);
    Rates r = null;
    print("변수 선언");
    print("static 메서드: " + [[Rates.max()]]);
  forward: |-
    class Config {
      static Config INSTANCE = [[new Config()]];
      static int timeout = 30;
      int copied;

      Config() { copied = [[timeout]]; }
    }

    System.out.println(Config.INSTANCE.copied);
  fieldInjection: |-
    @Service
    class OrderService {
      [[@Autowired]]
      private OrderRepository repo;
      private final long countAtStart;

      OrderService() {
        countAtStart = [[repo.count()]];
      }
    }
  constructorInjection: |-
    @Service
    class OrderService {
      private final OrderRepository repo;
      private final long countAtStart;

      OrderService([[OrderRepository repo]]) {
        this.repo = repo;
        countAtStart = repo.count();
      }
    }
  staticAutowired: |-
    @Service
    class OrderService {
      @Autowired
      private [[static]] OrderRepository repo;
    }
  constants: |-
    private static final int MAX_RETRY = 3;

    @Value("${pay.url}")
    private String payUrl;  // static이 아니다
