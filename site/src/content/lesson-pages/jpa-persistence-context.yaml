# 영속성 컨텍스트
# 자료 파일의 칸은 docs/lesson-data-format.md에 있다. 문제는 content/questions/jpa-persistence-context.yaml에 있다.
title: 영속성 컨텍스트
description: 영속성 컨텍스트가 무엇이고 언제 생기는지, 같은 id를 두 번 조회하면 왜 SELECT가 한 번인지, INSERT는 언제 어떤 순서로 나가는지, save() 없이 왜 UPDATE가 나가는지, 트랜잭션 밖에서 바꾼 값은 왜 저장되지 않는지. 다섯 가지 질문에 스스로 답할 수 있게, 책 제목을 바꾸며 나간 SQL을 세는 대화형 레슨.
unit: JPA
minutes: 25
roadmap: P2
type: 동작 확인
prerequisites:
  - {slug: jpa-basics, title: ORM과 JPA}
assume: '스프링 부트 3.5, Hibernate 6.6, PostgreSQL 16. 엔티티와 리포지토리(ORM과 JPA 레슨), `@Transactional`이 메서드를 트랜잭션으로 감싸고 끝나면 커밋한다는 것(트랜잭션 기초 레슨), 변수에 객체가 아니라 객체를 가리키는 참조가 들어 있다는 것(값과 참조 레슨).'
example: '책 `Book`(제목)의 제목을 바꾸는 서비스 메서드. 같은 책을 두 번 조회하고, 새 책을 넣고, 제목을 바꾸면서 SQL이 언제 몇 번 나가는지 센다.'
intro:
  - '책 제목을 바꾸는 서비스 메서드에서 `save()`를 깜빡했는데 DB에는 바뀐 제목이 들어가 있어요. 반대로 컨트롤러에서 제목을 바꾸고 `save()`를 부르지 않았더니 아무 일도 없어요. 둘의 차이는 그 객체가 영속성 컨텍스트 안에 있었는지예요.'
  - 'JPA로 수정 기능을 만드는 스프링 개발자는 거의 모두 변경 감지에 기대요. 언제 SQL이 나가는지, 어떤 객체의 변경이 저장되는지 모르면 저장돼야 할 값이 사라지거나 바뀌면 안 되는 값이 저장돼요. 면접에서 JPA 질문의 첫째가 "영속성 컨텍스트가 무엇인가요"예요.'
  - '이 레슨에서는 트랜잭션 하나 안에서 조회, 저장, 수정을 하며 나간 SQL을 세어, 1차 캐시, 쓰기 지연, 변경 감지가 실제로 일어나는 순간을 확인해요.'
covers:
  - topic: '영속성 컨텍스트는 엔티티를 id로 담아 두는 작업 공간이다. `EntityManager`가 그것을 다룬다. 스프링에서는 트랜잭션 하나에 하나가 생기고 트랜잭션이 끝나면 닫힌다'
    where: '질문 1'
  - topic: '엔티티의 상태: 비영속(new만 함), 영속(컨텍스트가 관리), 준영속(컨텍스트가 닫혔거나 detach), 삭제(remove)'
    where: '질문 1'
  - topic: '1차 캐시: 같은 id를 두 번 `find`하면 SELECT는 1번이고 같은 객체를 돌려준다'
    where: '질문 2'
  - topic: '같은 트랜잭션 안에서 같은 id의 엔티티는 늘 같은 객체다(==가 참)'
    where: '질문 2'
  - topic: 'JPQL은 1차 캐시를 먼저 보지 않고 늘 SQL을 보낸다. 그래도 이미 컨텍스트에 있는 엔티티는 그 객체를 돌려준다'
    where: '질문 2'
  - topic: '1차 캐시는 트랜잭션 하나의 것이라 요청 사이에 데이터를 아끼는 캐시가 아니다'
    where: '질문 2. 여러 요청이 함께 쓰는 캐시는 다루지 않음: 캐시 전략(A4)'
  - topic: '쓰기 지연: `persist`한 엔티티의 INSERT를 바로 보내지 않고 모아 두었다가 flush 때 보낸다'
    where: '질문 3'
  - topic: 'flush가 일어나는 때: 트랜잭션 커밋 직전, JPQL 실행 직전, `em.flush()`. flush는 SQL을 보내는 것이지 커밋이 아니다'
    where: '질문 3'
  - topic: 'flush는 코드에 적은 순서가 아니라 INSERT, UPDATE, DELETE 순서로 SQL을 보낸다. 그래서 유니크 값이 같은 행을 지우고 다시 넣으면 INSERT가 먼저 나가 23505로 실패한다. remove 뒤에 flush하거나 있는 행을 고쳐서 피한다'
    where: '질문 3'
  - topic: 'IDENTITY 전략은 id를 INSERT해야 알 수 있어서 `persist` 즉시 INSERT가 나간다'
    where: '질문 3의 더 알아보기. 자세한 차이는 다루지 않음: 식별자 생성 전략(P9)'
  - topic: '변경 감지: 조회할 때 찍어 둔 스냅샷과 flush 때의 값을 비교해 바뀐 엔티티의 UPDATE를 만든다. `save()`를 부르지 않아도 된다'
    where: '질문 4'
  - topic: '변경 감지가 되는 이유는 내가 바꾼 객체와 컨텍스트가 담은 객체가 같은 객체를 가리키기 때문이다'
    where: '질문 4 (자바 과정 J2에서 넘겨받음)'
  - topic: '값이 그대로면 UPDATE도 없다. 기본 UPDATE는 바뀐 컬럼만이 아니라 모든 컬럼을 쓴다'
    where: '질문 4'
  - topic: '준영속 엔티티는 바꿔도 반영되지 않는다. 트랜잭션 밖에서 바꾼 값이 그렇다'
    where: '질문 5'
  - topic: '`@Transactional(readOnly = true)`에서는 변경 감지를 하지 않는다'
    where: '질문 5'
  - topic: '준영속 엔티티를 다시 반영하는 `merge`와 그 위험(모든 필드를 덮어씀)'
    where: '질문 5의 더 알아보기'
  - topic: '`save()`는 새 엔티티면 `persist`, id가 있으면 `merge`를 부른다'
    where: '실무에서는'
  - topic: '한 번에 많은 행을 고치는 쿼리가 1차 캐시와 어긋나는 것'
    where: '다루지 않음: 벌크 연산과 영속성 컨텍스트(P8)'
  - topic: '영속성 컨텍스트를 요청 끝까지 여는 설정'
    where: '다루지 않음: OSIV(P6)'
  - topic: '`@Transactional`이 프록시로 트랜잭션을 여는 원리, 내부 호출'
    where: '다루지 않음: @Transactional 동작 원리(S10)'
links:
  test: https://github.com/wanja727/dev-lessons/blob/main/verification/src/test/java/lab/devlessons/persistencecontext/PersistenceContextTest.java
  scopeTest: https://github.com/wanja727/dev-lessons/blob/main/verification/src/test/java/lab/devlessons/persistencecontext/PersistenceContextScopeTest.java
  spec: https://jakarta.ee/specifications/persistence/3.1/jakarta-persistence-spec-3.1.html
  save: https://docs.spring.io/spring-data/jpa/reference/jpa/entity-persistence.html
  flushTest: https://github.com/wanja727/dev-lessons/blob/main/verification/src/test/java/lab/devlessons/persistencecontext/FlushOrderTest.java
  flushOrder: https://docs.hibernate.org/orm/6.6/userguide/html_single/#flushing-order
codes:
  states: |-
    Book b = new Book("새 책"); // 비영속
    em.persist(b);              // 영속
    em.detach(b);               // 준영속
    Book c = em.find(Book.class, id);
    em.remove(c);               // 삭제
  findTwice: |-
    Book a = em.find(Book.class, id);
    Book b = em.find(Book.class, id);
    System.out.println(a == b);
  jpqlRun: |-
    Book a = em.find(Book.class, id);
    Book b = em.createQuery(
        "select b from Book b"
        + " where b.id = :id", Book.class)
      .setParameter("id", id)
      .getSingleResult();
  dirtyRun: |-
    Book book = em.find(Book.class, id);
    book.changeTitle("JPA 입문 2판");
    em.flush();
  readOnly: |-
    @Transactional([[readOnly = true]])
    public void renameInReadOnly(Long id,
        String title) {
      repository.findById(id).orElseThrow()
          .changeTitle(title);
    }
  predict: |-
    @Transactional
    public void rename(Long id) {
      Book a = repository
          .findById(id).orElseThrow();
      Book b = repository
          .findById(id).orElseThrow();
      b.changeTitle("JPA 입문 2판");
    }
  writeBehind: |-
    em.persist(new Book("새 책 1"));
    em.persist(new Book("새 책 2"));
    em.persist(new Book("새 책 3"));
    // 여기까지 INSERT는 몇 번?
    em.flush();
  flushOrder: |-
    em.remove(old);
    keep.changeTitle("스프링 핵심 2판");
    em.persist(
        new IsbnBook("978-2", "새 책"));
    em.flush();
  reinsert: |-
    // old의 isbn은 978-1
    em.remove(old);
    em.persist(
        new IsbnBook([["978-1"]], "다시 등록"));
    em.flush();
  reinsertFixed: |-
    em.remove(old);
    [[em.flush();]]
    em.persist(
        new IsbnBook("978-1", "다시 등록"));
    em.flush();
  service: |-
    @Service
    public class BookService {
      @Transactional
      public void rename(Long id,
          String title) {
        Book book = repository
            .findById(id).orElseThrow();
        book.changeTitle(title);
      }
    }
  mistake: |-
    // 컨트롤러: 트랜잭션이 없다
    @PatchMapping("/books/{id}")
    void rename(@PathVariable Long id,
        @RequestParam String title) {
      Book book = bookService.find(id);
      book.changeTitle(title);
    }
predict:
  title: SQL은 몇 번, 제목은 바뀔까요?
  text: '같은 id의 책을 두 번 조회하고, 두 번째로 받은 객체의 제목을 바꿔요. `save()`는 부르지 않아요. 이 메서드가 끝날 때까지 나간 SELECT와 UPDATE는 몇 번일까요? 모르는 게 정상이니 감으로 골라 보세요. 답은 질문 2와 4에 나와요.'
  code: predict
  label: 내 예측
  options:
    - {value: s2u0, label: SELECT 2번과 UPDATE 0번}
    - {value: s2u1, label: SELECT 2번과 UPDATE 1번}
    - {value: s1u0, label: SELECT 1번과 UPDATE 0번}
    - {value: s1u1, label: SELECT 1번과 UPDATE 1번}
  answer: s1u1
  storageKey: pc-predict
  wrong: 예측은 "{label}"이었어요. 틀린 예측이 더 오래 남으니 괜찮아요.
questions:
  - id: q1
    title: 영속성 컨텍스트는 무엇이고 언제 생기나요?
    conclusion:
      lead: '엔티티를 id로 담아 두는 작업 공간이고, 스프링에서는 트랜잭션이 시작될 때 생겨서 끝날 때 닫혀요.'
      sub: '이 공간에 담긴 엔티티를 영속 상태라고 해요. 공간이 닫히면 그 엔티티는 준영속이 되어, 더는 JPA가 지켜보지 않아요.'
    says:
      - '영속성 컨텍스트는 `EntityManager`가 가진 맵이라고 보면 된다. 키는 엔티티 타입과 id, 값은 엔티티 객체다. 리포지토리의 `findById`, `save`도 안에서 `EntityManager`를 부른다'
      - '스프링에서는 `@Transactional`이 붙은 메서드가 시작될 때 컨텍스트가 생기고 끝날 때 닫힌다. 그래서 같은 트랜잭션 안의 리포지토리 호출들은 같은 컨텍스트를 함께 쓴다'
      - '엔티티의 네 상태를 그림으로 둔다: 비영속(`new`만 함), 영속(`persist`나 조회로 컨텍스트에 들어감), 준영속(컨텍스트가 닫히거나 `detach`), 삭제(`remove`). 상태마다 JPA가 하는 일이 다르다는 것만 이 질문에서 말한다'
      - '아래 질문 셋(1차 캐시, 쓰기 지연, 변경 감지)이 모두 영속 상태의 엔티티에만 일어난다'
    asks:
      - '본문의 예시: `@Transactional` 메서드 안에서 `findById`로 받은 `Book`은 네 상태 가운데 무엇인가 (영속. 컨텍스트가 관리한다)'
      - '옮긴 상황: `Member m = new Member("kim");`만 하고 `save`를 부르지 않았다. 이 객체의 상태와, 이 객체의 값을 바꿨을 때 DB에 반영되는지는 (비영속이고 반영되지 않는다. 컨텍스트에 들어간 적이 없다)'
    body:
      - p: '**영속성 컨텍스트**는 엔티티를 담아 두는 작업 공간이에요. 엔티티 타입과 id를 키로, 엔티티 객체를 값으로 담는 맵이라고 보면 돼요. 이 공간을 다루는 것이 JPA의 `EntityManager`이고, 리포지토리의 `findById`와 `save`도 안에서 `EntityManager`를 불러요.'
      - p: '스프링에서는 **트랜잭션이 시작될 때** 영속성 컨텍스트가 생기고 **트랜잭션이 끝날 때** 닫혀요. 그래서 `@Transactional` 메서드 하나 안에서 부른 리포지토리 메서드들은 같은 공간을 함께 써요. 메서드가 끝나면 공간도 사라져요.'
      - h3: 엔티티의 네 상태
      - p: '같은 엔티티 객체라도 이 공간에 들어 있는지에 따라 JPA가 다르게 대해요.'
      - code: states
      - table:
          head: [상태, 언제, JPA가 하는 일]
          rows:
            - [비영속, '`new`로 만들기만 함', 아무것도 모른다]
            - [영속, '`persist`하거나 조회로 들어옴', 지켜본다. 아래 질문 셋이 모두 여기서 일어난다]
            - [준영속, '`detach`, 또는 공간이 닫힘', 더는 지켜보지 않는다 (질문 5)]
            - [삭제, '`remove`', flush 때 DELETE를 보낸다]
      - p: '이 레슨의 나머지 질문 셋, **1차 캐시**와 **쓰기 지연**과 **변경 감지**는 모두 영속 상태의 엔티티에만 일어나요.'
      - quiz:
          q: '`Member m = new Member("kim");`만 하고 `save`를 부르지 않았어요. 이 객체는 어느 상태일까요?'
          options:
            - 비영속
            - 영속
            - 준영속
          answer: 1
          explain: '`new`로 만들기만 해서 영속성 컨텍스트에 들어간 적이 없어요. 값을 바꿔도 JPA는 몰라요.'
      - next: '영속 상태의 엔티티에는 무슨 일이 일어날까요? 처음 예측한 코드의 두 번 조회부터 봐요.'
    recall: '엔티티를 id로 담아 두는 작업 공간이고, `EntityManager`가 다뤄요. 스프링에서는 트랜잭션이 시작될 때 생겨서 끝날 때 닫혀요. 공간에 담긴 엔티티가 영속 상태이고, `new`만 한 것은 비영속, 공간이 닫히거나 떼어 낸 것은 준영속이에요. 1차 캐시, 쓰기 지연, 변경 감지는 영속 상태에만 일어나요.'
  - id: q2
    title: 같은 id를 두 번 조회하면 왜 SELECT가 한 번인가요?
    conclusion:
      lead: '첫 조회의 결과를 영속성 컨텍스트에 담아 두고, 두 번째는 DB에 가지 않고 거기서 꺼내기 때문이에요.'
      sub: '이것을 1차 캐시라고 해요. 같은 객체를 돌려주니 같은 트랜잭션 안에서 같은 id의 엔티티는 `==`로 비교해도 같아요.'
    says:
      - '`find`는 먼저 1차 캐시를 본다. 있으면 그 객체를 돌려주고, 없으면 SELECT를 보내 결과를 담은 뒤 돌려준다. 같은 id로 두 번 `find`한 테스트의 SELECT 수(1)와 `a == b`(true)를 실제 출력으로 보인다'
      - '예측의 첫 부분(SELECT 1번)을 밝힌다'
      - 'JPQL은 다르다. `select b from Book b where b.id = :id`는 1차 캐시를 보지 않고 SQL을 보낸다. 조건에 맞는 행이 몇 개인지 DB에 물어야 알기 때문이다. 그래도 결과의 id가 이미 컨텍스트에 있으면 새 객체를 만들지 않고 있던 객체를 돌려준다. SELECT 2번과 같은 객체임을 테스트로 보인다'
      - '`em.clear()`로 컨텍스트를 비우면 다시 SELECT한다'
      - '1차 캐시는 트랜잭션 하나 동안만 있다. 요청 두 개가 같은 책을 조회하면 SELECT는 두 번이다. 요청 사이에 아끼는 캐시는 A4에서 다룬다'
    widget:
      kind: steps
      note: '코드 predict를 한 줄씩 실행한다. 왼쪽에는 영속성 컨텍스트(1차 캐시와 스냅샷), 오른쪽에는 나간 SQL을 둔다. 첫 `findById`에서 SELECT가 나가고 캐시에 Book#1이 생긴다. 둘째 `findById`는 SQL 없이 같은 객체. `changeTitle`은 객체만 바뀌고 SQL 없음. 커밋에서 스냅샷과 비교해 UPDATE가 나간다. 질문 3과 4에서도 이 위젯을 가리킨다'
    asks:
      - '본문의 예시: 한 트랜잭션에서 `em.find(Book.class, 1L)`을 두 번 하고 사이에 `em.clear()`를 했다. SELECT는 몇 번인가 (2번. 비운 뒤에는 캐시에 없다)'
      - '옮긴 상황: 한 트랜잭션에서 `memberRepository.findById(7L)`을 한 뒤 JPQL `select m from Member m where m.id = 7`을 실행했다. SELECT 수와 두 결과를 `==`로 비교한 값은 (SELECT 2번, true. JPQL은 늘 SQL을 보내지만 이미 있는 엔티티는 같은 객체를 돌려준다)'
    body:
      - p: '처음 예측한 코드예요. 같은 id로 두 번 조회했어요.'
      - code: predict
      - p: '`find`는 먼저 영속성 컨텍스트를 봐요. 없으면 SELECT를 보내 결과를 담은 뒤 돌려주고, 있으면 DB에 가지 않고 담아 둔 객체를 돌려줘요. 이것을 **1차 캐시**라고 해요. 같은 일을 `EntityManager`로 직접 해 봤어요.'
      - ci:
          key: find-twice
          label: 실제 출력 보기
          source: PersistenceContextTest.findTwice
          code: findTwice
      - p: 'SELECT는 1번이고, 두 변수는 **같은 객체**예요(`a == b`가 true). 그래서 같은 트랜잭션 안에서 같은 id의 엔티티는 늘 같은 객체예요. 예측의 앞부분, SELECT 1번이 여기서 나와요.'
      - p: '아래에서 코드를 한 줄씩 실행해 보세요. 왼쪽은 영속성 컨텍스트, 오른쪽은 나간 SQL이에요. 지금은 둘째 줄까지 보고, 나머지는 질문 4에서 다시 봐요.'
      - widget:
          kind: steps
          layout: [duo, buttons, log, verdict]
          buttons: each
          initial:
            duo:
              - {label: 영속성 컨텍스트, state: dim, text: 비어 있음}
              - {label: 스냅샷, state: dim, text: 없음}
          scenarios:
            default:
              - label: 'a = findById(1)'
                log: 'select ... from book where id=?'
                duo:
                  - {label: 영속성 컨텍스트, rows: [{k: 'Book#1', v: 'JPA 입문', mark: changed}]}
                  - {label: 스냅샷, rows: [{k: 'Book#1', v: 'JPA 입문', mark: changed}]}
              - label: 'b = findById(1)'
                log: {note: '-- SQL 없음. 1차 캐시의 Book#1을 그대로 돌려줌 (a == b)'}
                duo:
                  - {label: 영속성 컨텍스트, rows: [{k: 'Book#1', v: 'JPA 입문'}]}
                  - {label: 스냅샷, rows: [{k: 'Book#1', v: 'JPA 입문'}]}
              - label: 'b.changeTitle(...)'
                log: {note: '-- SQL 없음. 객체의 필드만 바뀜'}
                duo:
                  - {label: 영속성 컨텍스트, rows: [{k: 'Book#1', v: 'JPA 입문 2판', mark: changed}]}
                  - {label: 스냅샷, rows: [{k: 'Book#1', v: 'JPA 입문'}]}
              - label: 커밋 (flush)
                log: 'update book set author=?,title=? where id=?'
                duo:
                  - {label: 영속성 컨텍스트, rows: [{k: 'Book#1', v: 'JPA 입문 2판'}]}
                  - {label: 스냅샷, rows: [{k: 'Book#1', v: 'JPA 입문', mark: bad}]}
                verdict: '스냅샷과 지금 값이 달라서 UPDATE가 나갔어요. SELECT 1번, UPDATE 1번이에요.'
      - h3: JPQL은 캐시를 먼저 보지 않아요
      - p: 'id로 찾는 `find`와 달리, JPQL은 1차 캐시를 보지 않고 **늘 SQL을 보내요**. 조건에 맞는 행이 몇 개인지는 DB에 물어야 알 수 있기 때문이에요. 그래도 돌아온 행의 id가 이미 공간에 있으면 새 객체를 만들지 않고 있던 객체를 돌려줘요.'
      - ci:
          key: jpql
          label: 실제 출력 보기
          source: PersistenceContextTest.jpqlAlwaysQueries
          code: jpqlRun
      - p: '`em.clear()`로 공간을 비운 뒤에 `find`하면 다시 SELECT해요. 담아 둔 것이 없으니까요.'
      - callout: '**1차 캐시는 트랜잭션 하나의 것이에요.** 요청 두 개가 같은 책을 조회하면 SELECT는 두 번이에요. 여러 요청이 함께 쓰는 캐시는 [캐시 전략](lesson:cache-strategy)에서 다뤄요.'
      - quiz:
          q: '한 트랜잭션에서 `em.find(Book.class, 1L)`을 하고, `em.clear()`를 한 뒤, 다시 `em.find(Book.class, 1L)`을 했어요. SELECT는 몇 번일까요?'
          options:
            - 1번
            - 2번
            - 0번
          answer: 2
          explain: '`clear()`가 영속성 컨텍스트를 비워서, 둘째 `find`는 캐시에서 찾지 못하고 다시 SELECT해요.'
      - next: '조회는 미뤄 두었다 꺼내 썼어요. 저장은 어떨까요? `persist`하면 INSERT가 바로 나갈까요?'
    recall: '첫 조회의 결과를 영속성 컨텍스트에 담아 두고, 두 번째 `find`는 DB에 가지 않고 거기서 꺼내기 때문이에요. 이것이 1차 캐시예요. 같은 객체를 돌려주니 같은 트랜잭션에서 같은 id의 엔티티는 `==`로도 같아요. JPQL은 캐시를 보지 않고 늘 SQL을 보내지만, 이미 있는 엔티티는 같은 객체를 돌려줘요.'
  - id: q3
    title: persist한 엔티티의 INSERT는 언제, 어떤 순서로 나가나요?
    conclusion:
      lead: '바로 나가지 않고 모아 두었다가 flush할 때 한꺼번에 나가요. 순서는 코드에 적은 순서가 아니라 INSERT, UPDATE, DELETE 순서예요.'
      sub: 'flush는 트랜잭션이 커밋되기 직전, JPQL을 실행하기 직전, `flush()`를 부를 때 일어나요. 이것을 쓰기 지연이라고 해요.'
    says:
      - '코드 writeBehind. `persist` 세 번 뒤 INSERT는 0번, `flush` 뒤 3번이다. 테스트의 수를 실제 출력으로 보인다'
      - 'flush는 모아 둔 SQL을 DB에 보내는 일이다. 커밋이 아니다. flush한 뒤에 롤백하면 INSERT도 없던 일이 된다'
      - 'JPQL을 실행하기 직전에도 flush한다. 아직 보내지 않은 INSERT가 있으면 JPQL이 그 행을 못 보기 때문이다. 나간 순서가 INSERT 다음 SELECT인 것을 테스트로 보인다'
      - '모아서 보내면 같은 SQL을 묶어 보내는 JDBC 배치를 쓸 수 있다는 것을 한 줄로 적는다(설정은 P9)'
      - 'flush는 모아 둔 SQL을 코드의 순서가 아니라 종류별로 INSERT, UPDATE, DELETE 순서로 보낸다(Hibernate 문서의 Flush operation order). 코드 flushOrder는 remove, changeTitle, persist 순서인데 나간 SQL은 INSERT, UPDATE, DELETE다. 테스트로 보인다'
      - '그래서 유니크 제약이 있는 값(ISBN)이 같은 행을 지우고 같은 값으로 새로 넣으면, INSERT가 DELETE보다 먼저 나가서 옛 행과 겹쳐 23505로 실패한다(코드 reinsert). 테스트로 보인다'
      - '피하는 법 둘: remove 뒤에 `em.flush()`를 불러 DELETE를 먼저 보낸다(코드 reinsertFixed, 테스트로 보인다). 같은 책이라면 지우고 넣지 말고 있는 행의 값을 고친다(질문 4의 변경 감지)'
      - '더 알아보기: `@GeneratedValue(strategy = IDENTITY)`는 DB가 INSERT할 때 id를 만든다. 영속 상태가 되려면 id가 있어야 하므로 `persist` 즉시 INSERT가 나간다. 테스트로 보인다. 자세한 것은 P9'
    asks:
      - '본문의 예시: SEQUENCE 전략인 `Book`을 `persist`하고, 이어서 `select b from Book b`를 실행했다. INSERT와 SELECT 가운데 먼저 나간 것은 (INSERT. JPQL 실행 전에 자동으로 flush한다)'
      - '옮긴 상황: 트랜잭션 안에서 SEQUENCE 전략인 주문 3개를 `persist`하고 `em.flush()`를 부른 뒤 예외가 나서 롤백됐다. DB에 주문은 몇 개 남나 (0개. flush는 SQL을 보냈을 뿐 커밋이 아니다)'
      - '옮긴 상황: 카테고리 코드(`code`, UNIQUE)를 고치는 기능을 "옛 카테고리를 `remove`하고 같은 코드로 새 카테고리를 `persist`"로 만들었다. 커밋할 때 어떻게 되나 (INSERT가 먼저 나가 23505로 실패한다)'
    body:
      - p: '`Book`은 id를 DB 시퀀스에서 미리 받아 오는 SEQUENCE 전략이에요. 새 책 셋을 `persist`하고 세어 봤어요.'
      - ci:
          key: write-behind
          label: 실제 출력 보기
          source: PersistenceContextTest.writeBehind
          code: writeBehind
      - p: '`persist` 세 번 뒤에도 INSERT는 0번이에요. 영속성 컨텍스트가 INSERT를 모아 두었다가 **flush**할 때 한꺼번에 보냈어요. 이것을 **쓰기 지연**이라고 해요.'
      - p: '**flush**는 모아 둔 SQL을 DB에 보내는 일이에요. 세 때에 일어나요.'
      - ol:
          - '트랜잭션이 **커밋되기 직전**. 스프링의 `@Transactional` 메서드가 끝날 때예요'
          - '**JPQL을 실행하기 직전**. 아직 보내지 않은 INSERT가 있으면 JPQL이 그 행을 보지 못하니까요. 새 책을 `persist`한 뒤 `select b from Book b`를 실행하면 INSERT가 SELECT보다 먼저 나가요'
          - '`em.flush()`를 직접 부를 때'
      - callout: '**flush는 커밋이 아니에요.** SQL을 보냈을 뿐 트랜잭션은 아직 열려 있어요. flush한 뒤에 롤백하면 INSERT도 없던 일이 돼요. 책 셋을 flush한 뒤 롤백했더니 책의 수가 그대로였어요.'
      - p: '모아서 보내기 때문에, 같은 모양의 INSERT를 한 번에 묶어 보내는 JDBC 배치도 쓸 수 있어요. 설정은 식별자 생성 전략 레슨(P9)에서 봐요.'
      - h3: flush는 정해진 순서로 보내요
      - p: '모아 둔 SQL은 코드에 적은 순서대로 나가지 않아요. Hibernate는 종류별로 모아 **INSERT, UPDATE, DELETE 순서**로 보내요([Hibernate 문서](link:flushOrder)). ISBN이 겹치면 안 되는 책 `IsbnBook`으로 지우기, 고치기, 넣기를 차례로 하고 flush했어요.'
      - ci:
          key: flush-order
          label: 실제 출력 보기
          source: FlushOrderTest.flushOrder
          code: flushOrder
      - p: '코드에서는 지우기가 먼저인데 DELETE가 마지막에 나갔어요. 대부분은 순서가 바뀌어도 결과가 같아서 몰라도 돼요. 문제는 **유니크 제약**이 있을 때예요.'
      - p: '잘못 등록한 책(ISBN 978-1)을 지우고 같은 ISBN으로 다시 넣었어요.'
      - ci:
          key: delete-then-insert
          label: 실제 출력 보기
          source: FlushOrderTest.deleteThenInsertSameUniqueValue
          code: reinsert
      - p: 'INSERT가 먼저 나가서, 아직 지워지지 않은 옛 행과 ISBN이 겹쳤어요. 그래서 유니크 위반(**23505**)으로 실패했어요. 코드만 보면 지운 뒤에 넣었으니 이상해 보이지만, flush의 순서로 보면 당연한 결과예요.'
      - p: '피하는 법은 둘이에요. 하나는 지운 뒤 `em.flush()`를 불러 DELETE를 먼저 보내는 거예요.'
      - ci:
          key: flush-after-remove
          label: 실제 출력 보기
          source: FlushOrderTest.flushAfterRemove
          code: reinsertFixed
      - p: '더 나은 방법은 지우고 넣지 않는 거예요. 같은 책의 제목이나 분류를 바꾸려는 것이면, 있는 행을 조회해 값을 고쳐요. 질문 4의 변경 감지가 UPDATE 하나로 처리해요.'
      - more:
          summary: '더 알아보기: IDENTITY는 바로 INSERT해요'
          body:
            - p: '`@GeneratedValue(strategy = IDENTITY)`는 DB가 INSERT할 때 id를 만들어요. 영속 상태가 되려면 id가 있어야 하니, Hibernate는 `persist`하는 순간 INSERT를 보내 id를 받아 와요. 같은 테스트에서 IDENTITY 엔티티는 `persist` 한 번에 INSERT 1번이 바로 나갔어요. 그래서 IDENTITY에서는 INSERT의 쓰기 지연이 없어요.'
      - quiz:
          q: 'SEQUENCE 전략인 `Book`을 `persist`하고, 이어서 JPQL `select b from Book b`를 실행했어요. 먼저 나가는 SQL은 무엇일까요?'
          options:
            - SELECT
            - INSERT
            - INSERT는 커밋 때까지 나가지 않는다
          answer: 2
          explain: 'JPQL을 실행하기 직전에 자동으로 flush해서, 모아 둔 INSERT를 먼저 보내요.'
      - next: '저장도 미뤘다 보내요. 그러면 처음 코드처럼 `save()`조차 부르지 않았는데 UPDATE는 누가 만들었을까요?'
    recall: '바로 나가지 않고 영속성 컨텍스트가 모아 두었다가 flush할 때 한꺼번에 나가요. 이것이 쓰기 지연이에요. flush는 커밋 직전, JPQL 실행 직전, `flush()`를 부를 때 일어나요. flush는 SQL을 보내는 것이지 커밋이 아니라서 그 뒤에 롤백하면 없던 일이 돼요. 순서는 코드와 상관없이 INSERT, UPDATE, DELETE라서, 유니크 값이 같은 행을 지우고 다시 넣으면 INSERT가 먼저 나가 실패해요. IDENTITY 전략은 id를 받으려고 `persist` 즉시 INSERT해요.'
  - id: q4
    title: save()를 부르지 않았는데 왜 UPDATE가 나가나요?
    conclusion:
      lead: 'JPA가 조회할 때 찍어 둔 스냅샷과 flush할 때의 값을 비교해서, 바뀐 엔티티의 UPDATE를 직접 만들기 때문이에요.'
      sub: '내가 바꾼 객체가 영속성 컨텍스트가 담고 있는 바로 그 객체라서 변경이 보여요. 이것을 변경 감지라고 해요.'
    says:
      - '조회할 때 엔티티와 함께 그때의 값 복사본(스냅샷)을 담는다. flush 때 엔티티마다 지금 값과 스냅샷을 비교한다. 다르면 UPDATE를 만든다. 예측의 둘째 부분(UPDATE 1번)을 밝힌다'
      - '`findById`가 돌려준 `book` 변수와 컨텍스트의 맵이 같은 객체를 가리킨다(값과 참조 레슨). 그래서 `book.changeTitle`은 컨텍스트가 담은 객체를 바꾼 것이고, flush 때 비교에서 보인다'
      - '값을 바꾸지 않았으면 UPDATE도 없다. 테스트로 0번을 보인다'
      - '나간 UPDATE를 실제 출력으로 보인다. 바꾼 것은 제목뿐이어도 기본 UPDATE는 모든 컬럼을 쓴다. 문장이 늘 같아서 다시 쓰기 쉽다. 바뀐 컬럼만 쓰려면 Hibernate의 `@DynamicUpdate`가 있다'
    asks:
      - '본문의 예시: `@Transactional` 메서드에서 책을 조회해 제목을 "A"로 바꾼 뒤 다시 원래 제목으로 되돌렸다. 커밋 때 UPDATE는 나가나 (나가지 않는다. flush 때의 값이 스냅샷과 같다)'
      - '옮긴 상황: 회원 엔티티에 이름, 이메일, 등급 컬럼이 있다. 트랜잭션 안에서 등급만 바꿨다. 기본 설정에서 나가는 UPDATE의 SET 절에 들어가는 컬럼은 (이름, 이메일, 등급 셋 다. 기본 UPDATE는 모든 컬럼을 쓴다)'
    body:
      - p: '영속성 컨텍스트는 엔티티를 담을 때 그때의 값을 복사한 **스냅샷**도 함께 담아요. flush할 때 엔티티마다 지금 값과 스냅샷을 비교하고, 다르면 UPDATE를 만들어요. 이것을 **변경 감지**라고 해요. 질문 2의 위젯 마지막 단계가 그 순간이에요.'
      - ci:
          key: dirty
          label: 실제 출력 보기
          source: PersistenceContextTest.dirtyChecking
          code: dirtyRun
      - p: '`save()` 없이 UPDATE가 1번 나갔어요. 처음 예측의 답은 **SELECT 1번과 UPDATE 1번**이에요. {{predict-result}}'
      - h3: 왜 바꾼 것이 보일까요
      - p: '`findById`가 돌려준 `book` 변수에는 객체가 아니라 객체를 가리키는 참조가 들어 있어요([값과 참조](lesson:value-and-reference)). 영속성 컨텍스트의 맵도 **같은 객체**를 가리켜요. 그래서 `book.changeTitle(...)`은 컨텍스트가 담은 바로 그 객체를 바꾼 것이고, flush 때 비교에서 보여요. 복사본을 바꿨다면 JPA는 몰랐을 거예요.'
      - p: '값을 바꾸지 않았으면 UPDATE도 없어요. 조회만 하고 flush했을 때 UPDATE는 0번이었어요. 바꿨다가 원래 값으로 되돌려도 flush 때의 값이 스냅샷과 같으니 0번이에요.'
      - h3: UPDATE는 모든 컬럼을 써요
      - p: '위 출력의 UPDATE를 다시 보세요. 바꾼 것은 제목뿐인데 `set author=?,title=?`로 저자 컬럼도 써요. Hibernate의 기본 UPDATE는 엔티티마다 문장이 하나로 정해져 있어서 모든 컬럼을 써요. 바뀐 컬럼만 쓰게 하려면 엔티티에 Hibernate의 `@DynamicUpdate`를 붙여요. 컬럼이 아주 많은 테이블이 아니면 기본값으로 둬요.'
      - quiz:
          q: '`@Transactional` 메서드에서 책을 조회해 제목을 "A"로 바꾼 뒤, 다시 원래 제목으로 되돌렸어요. 커밋 때 UPDATE는 나갈까요?'
          options:
            - 나간다. 값을 두 번 바꿨다
            - 나가지 않는다. flush 때의 값이 스냅샷과 같다
            - 두 번 나간다
          answer: 2
          explain: '변경 감지는 바꾼 횟수가 아니라 flush 때의 값과 스냅샷을 비교해요. 같으면 UPDATE가 없어요.'
      - next: '변경 감지는 영속 상태 엔티티를 지켜봐요. 그러면 트랜잭션이 끝난 뒤에 바꾼 엔티티는 어떻게 될까요?'
    recall: '조회할 때 찍어 둔 스냅샷과 flush할 때의 값을 비교해서, 바뀐 엔티티의 UPDATE를 JPA가 직접 만들기 때문이에요. 내가 바꾼 객체가 영속성 컨텍스트가 담고 있는 바로 그 객체라서 변경이 보여요. 값이 그대로면 UPDATE도 없고, 기본 UPDATE는 바꾸지 않은 컬럼까지 모든 컬럼을 써요.'
  - id: q5
    title: 트랜잭션 밖에서 바꾼 값은 왜 저장되지 않나요?
    conclusion:
      lead: '트랜잭션이 끝나면 영속성 컨텍스트가 닫혀서, 그 엔티티를 지켜보는 쪽이 없기 때문이에요.'
      sub: '컨텍스트 밖의 엔티티를 준영속이라고 해요. 준영속 엔티티는 바꿔도 비교할 스냅샷이 없고 flush도 없어요. `readOnly = true` 트랜잭션도 변경 감지를 하지 않아요.'
    says:
      - '서비스의 `@Transactional(readOnly = true) find`가 돌려준 엔티티를 밖에서 바꾸면 DB는 그대로다. 테스트로 보인다'
      - '`em.detach(book)`도 같다. 같은 트랜잭션 안이라도 떼어 낸 엔티티의 변경은 반영되지 않는다'
      - '`readOnly = true`면 스프링이 Hibernate에 읽기 전용이라고 알려 스냅샷을 찍지 않고 flush도 하지 않는다. 그래서 바꿔도 반영되지 않는다. 테스트로 보인다. 스냅샷이 없어 메모리를 덜 쓰는 것이 이 설정의 쓸모다'
      - '반영하려면 트랜잭션 안에서 id로 다시 조회해 바꾼다. 질문 4의 방법이다'
      - '더 알아보기: `merge`는 준영속 객체의 값을 영속 엔티티에 모든 필드째 복사한다. 화면에서 받은 객체에 빈 필드가 있으면 그 필드도 null로 덮어쓴다. 그래서 수정은 다시 조회해서 바꾸는 쪽을 쓴다'
    asks:
      - '본문의 예시: `@Transactional(readOnly = true)` 메서드 안에서 책 제목을 바꿨다. 메서드가 끝난 뒤 DB의 제목은 (그대로다. 읽기 전용이면 변경 감지를 하지 않는다)'
      - '옮긴 상황: 스케줄러가 트랜잭션 없이 `memberService.findAll()`로 받은 회원들의 등급을 바꾼 뒤 끝났다. `findAll`은 `@Transactional(readOnly = true)`다. 등급은 저장되나 (저장되지 않는다. 받은 회원들은 준영속이다)'
    body:
      - p: '서비스의 `@Transactional(readOnly = true) find`가 돌려준 책을 밖에서 바꿨어요. 다시 읽어 보면 DB의 제목은 그대로예요. 메서드가 끝나며 영속성 컨텍스트가 닫혀서, 그 책은 **준영속**이 됐기 때문이에요. 비교할 스냅샷도, flush할 곳도 없어요.'
      - p: '같은 트랜잭션 안이라도 `em.detach(book)`으로 떼어 낸 엔티티는 같아요. 바꾸고 flush해도 UPDATE는 0번이에요.'
      - h3: readOnly 트랜잭션
      - code: readOnly
        notes:
          - mark: readOnly = true
            as: code
            text: '스프링이 Hibernate에 읽기 전용이라고 알려요. 스냅샷을 찍지 않고 flush도 하지 않아요.'
      - p: '`readOnly = true` 안에서는 영속 상태라도 바꾼 값이 저장되지 않아요. 테스트에서도 제목이 그대로였어요. 스냅샷을 찍지 않으니 메모리를 덜 쓰는 것이 이 설정을 쓰는 이유예요. 조회만 하는 서비스 메서드에 붙여요.'
      - p: '반영하려면 트랜잭션 안에서 id로 다시 조회해 바꿔요. 질문 4의 방법이에요.'
      - more:
          summary: '더 알아보기: merge는 왜 피할까요'
          body:
            - p: '`em.merge(detached)`는 준영속 객체의 값을 영속 엔티티에 **모든 필드째** 복사해요. 화면에서 제목만 받아 만든 객체를 merge하면, 비어 있던 저자 필드도 null로 덮어써요. 그래서 수정은 다시 조회해서 바꾸는 쪽을 써요.'
      - quiz:
          q: '스케줄러가 트랜잭션 없이 `memberService.findAll()`로 받은 회원들의 등급을 바꾼 뒤 끝났어요. `findAll`은 `@Transactional(readOnly = true)`예요. 등급은 저장될까요?'
          options:
            - 저장된다
            - 저장되지 않는다
            - 첫 회원만 저장된다
          answer: 2
          explain: '`findAll`이 끝나며 영속성 컨텍스트가 닫혀서 받은 회원들은 준영속이에요. 바꿔도 지켜보는 쪽이 없어요.'
    recall: '트랜잭션이 끝나면 영속성 컨텍스트가 닫혀서 그 엔티티를 지켜보는 쪽이 없기 때문이에요. 이런 엔티티를 준영속이라고 해요. 비교할 스냅샷도 flush도 없으니 바꿔도 반영되지 않아요. `readOnly = true` 트랜잭션은 스냅샷을 찍지 않아서 안에서 바꿔도 반영되지 않아요. 고치려면 트랜잭션 안에서 다시 조회해 바꿔요.'
practice:
  title: 스프링 서비스에서는 이렇게 써요
  body:
    - p: '수정 기능은 서비스의 `@Transactional` 메서드에서 조회하고 바꾸는 것으로 끝나요.'
    - code: service
    - p: '`save()`를 다시 부르지 않아요. 불러도 이미 영속 상태라 아무 일도 하지 않아요. 커밋 직전의 flush가 변경 감지로 UPDATE를 보내요.'
    - h3: save()는 무엇을 부를까요
    - p: 'Spring Data JPA의 `save()`는 새 엔티티면 `persist`를, id가 있는 엔티티면 `merge`를 불러요. 그래서 화면에서 받아 만든 객체를 `save()`하면 질문 5의 더 알아보기에서 본 merge의 덮어쓰기가 일어나요. 새로 만들 때만 `save()`를 쓰고, 고칠 때는 조회해서 바꿔요.'
    - h3: '흔한 실수: 트랜잭션 밖에서 바꾸기'
    - code: mistake
    - p: '컨트롤러에는 트랜잭션이 없어요. `bookService.find`가 끝나며 영속성 컨텍스트가 닫혔으니 `book`은 준영속이에요. 제목을 바꿔도 저장되지 않고 **예외도 나지 않아서** 놓치기 쉬워요. 테스트에서도 트랜잭션이 끝난 뒤 바꾼 제목은 DB에 없었어요.'
    - p: '고친 코드는 바꾸는 일을 서비스의 `@Transactional` 메서드로 옮기는 거예요. 위의 `rename`을 부르면 돼요.'
    - muted: '근거: `save()`가 persist와 merge를 고르는 기준은 [Spring Data JPA 문서](link:save). 저장되는지는 테스트로 확인했어요.'
  says:
    - '수정 서비스의 모양은 코드 service다. 트랜잭션 안에서 조회하고 바꾸면 끝이다. `save()`를 다시 부를 필요가 없다. 불러도 이미 영속 상태라 아무 일도 하지 않는다'
    - '`save()`는 id가 없는 새 엔티티면 `persist`를, id가 있으면 `merge`를 부른다(Spring Data JPA 문서 근거). 그래서 화면에서 받은 객체를 `save()`하면 merge의 덮어쓰기가 일어난다'
    - '흔한 실수: 코드 mistake처럼 트랜잭션이 없는 컨트롤러에서 조회한 엔티티를 바꾼다. 아무것도 저장되지 않고 예외도 없다. 고친 코드: 바꾸는 일을 서비스의 `@Transactional` 메서드로 옮긴다(코드 service). 테스트(트랜잭션이 끝난 뒤 바꾼 값)로 확인한다'
    - '조회만 하는 서비스 메서드에는 `readOnly = true`를 붙인다. 스냅샷을 찍지 않는다'
claims:
  - claim: '같은 id로 두 번 `find`하면 SELECT는 1번이고 같은 객체다'
    how: '`@DataJpaTest`에서 `SqlCapture`로 센다'
    test: 'PersistenceContextTest.findTwice'
  - claim: 'JPQL은 늘 SQL을 보내지만 이미 있는 엔티티는 같은 객체를 돌려준다'
    how: '같은 방법'
    test: 'PersistenceContextTest.jpqlAlwaysQueries'
  - claim: '`clear()` 뒤에 `find`하면 다시 SELECT한다'
    how: '같은 방법'
    test: 'PersistenceContextTest.clearThenFind'
  - claim: 'SEQUENCE 전략에서 `persist` 세 번 뒤 INSERT 0번, `flush` 뒤 3번'
    how: '같은 방법'
    test: 'PersistenceContextTest.writeBehind'
  - claim: 'IDENTITY 전략은 `persist` 즉시 INSERT'
    how: '같은 방법'
    test: 'PersistenceContextTest.identityInsertsImmediately'
  - claim: 'JPQL 전에 자동 flush해서 INSERT가 SELECT보다 먼저 나간다'
    how: '나간 순서를 본다'
    test: 'PersistenceContextTest.autoFlushBeforeJpql'
  - claim: 'flush는 코드의 순서와 상관없이 INSERT, UPDATE, DELETE 순서로 보낸다'
    how: '나간 SQL의 종류와 순서를 본다'
    test: 'FlushOrderTest.flushOrder'
  - claim: '유니크 값이 같은 행을 remove하고 persist하면 INSERT가 먼저 나가 23505로 실패하고, remove 뒤에 flush하면 성공한다'
    how: '같은 방법과 오류의 SQLState'
    test: 'FlushOrderTest.deleteThenInsertSameUniqueValue, flushAfterRemove'
  - claim: '값을 바꾸면 `save()` 없이 UPDATE 1번, 바꾸지 않으면 0번'
    how: '같은 방법'
    test: 'PersistenceContextTest.dirtyChecking, noChangeNoUpdate'
  - claim: '기본 UPDATE는 바꾸지 않은 컬럼도 SET에 넣는다'
    how: '나간 UPDATE 문을 실제 출력으로 남긴다. 컬럼이 둘 이상인 엔티티가 필요하다'
  - claim: 'flush한 뒤 롤백하면 INSERT한 행이 남지 않는다'
    how: '`TransactionTemplate`에서 flush 뒤 `setRollbackOnly`, 밖에서 행 수를 센다'
  - claim: '준영속(detach, 트랜잭션이 끝난 뒤) 엔티티의 변경은 반영되지 않는다'
    how: '같은 방법과 `@SpringBootTest`'
    test: 'PersistenceContextTest.detachedChangeIgnored, PersistenceContextScopeTest.changeAfterTransactionIgnored'
  - claim: '`readOnly = true` 트랜잭션에서는 바꿔도 반영되지 않는다'
    how: '`@SpringBootTest`에서 서비스를 부른다'
    test: 'PersistenceContextScopeTest.readOnlySkipsDirtyChecking'
sources:
  - '영속성 컨텍스트와 엔티티 상태, flush 시점: Jakarta Persistence 3.1 명세 3장 https://jakarta.ee/specifications/persistence/3.1/jakarta-persistence-spec-3.1.html'
  - '`save()`가 persist와 merge를 고르는 기준: Spring Data JPA 문서 https://docs.spring.io/spring-data/jpa/reference/jpa/entity-persistence.html'
  - '`@DynamicUpdate`: Hibernate 6.6 문서 https://docs.hibernate.org/orm/6.6/userguide/html_single/'
  - 'flush가 SQL을 보내는 순서: Hibernate 6.6 문서의 Flush operation order https://docs.hibernate.org/orm/6.6/userguide/html_single/#flushing-order'
interview:
  question: 영속성 컨텍스트가 무엇이고, 어떤 이점이 있나요?
  model:
    - label: 정의
      text: 엔티티를 id로 담아 두고 관리하는 작업 공간입니다. EntityManager가 다루고, 스프링에서는 트랜잭션 하나에 하나가 생겨 트랜잭션이 끝나면 닫힙니다.
    - label: 원리
      text: 같은 id를 다시 조회하면 1차 캐시에서 같은 객체를 돌려줘 SELECT가 한 번이고, persist한 엔티티의 INSERT는 모아 두었다가 flush 때 보냅니다. 조회할 때 스냅샷을 찍어 flush 때 비교하므로 save를 부르지 않아도 바뀐 엔티티의 UPDATE가 나갑니다.
    - label: 주의할 점
      text: 트랜잭션이 끝난 준영속 엔티티는 바꿔도 반영되지 않고 예외도 없습니다. readOnly 트랜잭션은 스냅샷을 찍지 않아 변경이 반영되지 않습니다. JPQL은 1차 캐시를 보지 않고 늘 SQL을 보내며, 그 전에 자동으로 flush합니다. flush는 INSERT, UPDATE, DELETE 순서로 보내서, 유니크 값이 같은 행을 지우고 다시 넣으면 INSERT가 먼저 나가 실패합니다. IDENTITY 전략은 persist 즉시 INSERT합니다.
    - label: 경험
      text: '(내 프로젝트로 채우기) 예: 컨트롤러에서 엔티티를 바꿨는데 저장되지 않는 문제를, 바꾸는 일을 서비스의 트랜잭션 메서드로 옮겨 고쳤습니다.'
verified: 이 레슨의 SQL과 출력은 짐작이 아니라 스프링 부트 3.5와 Hibernate 6.6으로 PostgreSQL 16 컨테이너에 실제로 보내고 받은 값이에요. 코드가 바뀔 때마다 테스트([PersistenceContextTest](link:test), [PersistenceContextScopeTest](link:scopeTest), [FlushOrderTest](link:flushTest))가 다시 돌아요.
footer: '근거: 영속성 컨텍스트와 엔티티 상태, flush 시점은 [Jakarta Persistence 3.1 명세](link:spec) 3장, flush가 SQL을 보내는 순서는 [Hibernate 6.6 문서](link:flushOrder), `save()`의 동작은 [Spring Data JPA 문서](link:save). SQL은 Hibernate 6.6과 PostgreSQL 16에서 테스트로 확인했어요. 오류는 [GitHub 이슈](https://github.com/wanja727/dev-lessons/issues)로 알려 주세요.'
