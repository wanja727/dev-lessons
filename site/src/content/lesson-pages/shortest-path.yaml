# 최단 경로 (설계서)
# 자료 파일의 칸은 docs/lesson-data-format.md에 있다.
stage: design
title: 최단 경로
unit: 자료구조와 알고리즘
roadmap: K14
type: 자바 실행
prerequisites:
  - {slug: graph-search, title: 그래프와 탐색}
  - {slug: heap-priority-queue, title: 힙과 우선순위 큐}
assume: '자바 21(OpenJDK). 그래프를 인접 리스트로 담고 너비 우선 탐색으로 가중치 없는 최단 거리를 구하는 것(그래프와 탐색 레슨). `PriorityQueue`는 가장 작은 것을 O(log n)에 꺼낸다는 것(힙과 우선순위 큐 레슨).'
example: '물류 센터 다섯 곳(A~E)과 센터 사이 도로의 이동 시간(분). A에서 각 센터까지 가장 빨리 가는 시간을 구해요. 너비 우선 탐색으로는 왜 틀리는지 보고, 다익스트라가 거리를 확정하는 순서를 따라가요. 실무 구역에서는 배송 경로를 계산하는 서비스 코드로 옮겨요.'
intro:
  - '배송 앱이 물류 센터 A에서 D까지 "도로 두 개만 거치는 길"을 골랐는데, 도로 세 개를 거치는 다른 길이 더 빨랐어요. 거치는 도로 수가 적은 길과 시간이 가장 짧은 길은 다를 수 있어요.'
  - '지도 앱의 길 찾기, 네트워크 장비의 경로 고르기, 서비스 사이 호출의 지연이 가장 작은 경로가 모두 가중치가 있는 최단 경로 문제예요. 자바 개발자가 지도 엔진을 짤 일은 드물지만, 창고 사이 배송 시간이나 작업 흐름의 비용처럼 작은 그래프는 직접 계산하기도 해요. 면접에서는 "다익스트라는 어떻게 동작하고 왜 음수 가중치에서 안 되나"를 물어요.'
  - '이 레슨에서는 다섯 센터의 도로망에서 너비 우선 탐색과 다익스트라의 답을 비교하고, 우선순위 큐에서 꺼내는 순서와 거리가 바뀌는 순간을 실제로 출력해 봐요.'
covers:
  - topic: '가중치 그래프: 선마다 비용(시간, 거리)이 있다. 최단 경로는 거치는 선의 수가 아니라 비용의 합이 가장 작은 길이다'
    where: '질문 1'
  - topic: '너비 우선 탐색은 선의 수가 가장 적은 길을 찾는다. 비용이 다르면 그 길이 가장 싸다는 보장이 없다'
    where: '질문 1. 너비 우선 탐색은 그래프와 탐색(K11)'
  - topic: '다익스트라: 시작점에서의 거리표를 두고, 아직 확정하지 않은 점 가운데 거리가 가장 작은 점을 확정한 뒤 그 이웃의 거리를 줄인다(완화)'
    where: '질문 2'
  - topic: '이전 점(prev)을 기록해 두면 최단 경로 자체를 거꾸로 따라가 복원한다'
    where: '질문 2'
  - topic: '가장 가까운 점을 확정해도 되는 이유: 비용이 음수가 아니면 다른 길로 돌아와도 더 짧아질 수 없다. 그리디 선택이다'
    where: '질문 3. 그리디는 그리디와 동적 계획법(K12)'
  - topic: '음수 가중치가 있으면 확정한 거리가 나중에 더 짧아질 수 있어 틀린다. 그때는 벨만 포드를 쓴다'
    where: '질문 3. 벨만 포드는 더 알아보기'
  - topic: '가장 작은 점을 매번 배열에서 찾으면 O(V²)이다. 우선순위 큐로 꺼내면 O((V + E) log V)다'
    where: '질문 4'
  - topic: '자바의 PriorityQueue에는 우선순위를 줄이는 연산이 없다. 거리가 줄면 새로 넣고, 꺼냈을 때 이미 확정된 점이면 건너뛴다'
    where: '질문 4'
  - topic: '방문 표시는 꺼낼 때 한다. 너비 우선 탐색처럼 넣을 때 하면 틀린 답이 나온다'
    where: '질문 4, 실무에서는'
  - topic: '도착점 하나만 필요하면 그 점을 꺼낸 순간 멈춰도 된다'
    where: '질문 4의 더 알아보기'
  - topic: '서버 코드에서 만나는 곳: 창고 사이 배송 시간, 작업 흐름의 비용. 큰 도로망은 지도 서비스나 그래프 DB에 맡긴다'
    where: '실무에서는'
  - topic: '모든 점 쌍의 최단 거리(플로이드 워셜), A* 탐색'
    where: '질문 4의 더 알아보기에 이름만'
  - topic: '힙이 가장 작은 것을 꺼내는 방법'
    where: '다루지 않음: 힙과 우선순위 큐(K9)'
codes:
  predict: |-
    // 센터 사이 도로와 이동 시간(분)
    A-B 4   A-C 1   C-B 2
    B-D 1   C-D 5   D-E 3
    // A에서 D까지 가장 빠른 시간은?
  bfsDistance: |-
    // 선의 수로 센 거리 (그래프와 탐색 레슨)
    dist.put(next, dist.get(cur) + 1);
  dijkstra: |-
    dist.put(start, 0);
    pq.add(new Entry(start, 0));
    while (!pq.isEmpty()) {
      Entry e = pq.poll();
      if (!done.add(e.node())) continue;
      for (Edge ed : graph.get(e.node())) {
        int nd = e.dist() + ed.minutes();
        if (nd < dist.getOrDefault(
            ed.to(), Integer.MAX_VALUE)) {
          dist.put(ed.to(), nd);
          prev.put(ed.to(), e.node());
          pq.add(new Entry(ed.to(), nd));
        }
      }
    }
  path: |-
    List<String> path = new ArrayList<>();
    for (String at = "D"; at != null;
         at = prev.get(at)) {
      path.add(0, at);
    }
  negative: |-
    // 방향이 있는 도로
    A→B 2   A→C 3   C→B -2
  markOnPush: |-
    if (done.add(ed.to())) {
      pq.add(new Entry(ed.to(), nd));
    }
predict:
  text: '코드 predict의 도로망에서 A에서 D까지 가장 빨리 가는 시간은 몇 분일까요? 보기: 5분(A-B-D), 6분(A-C-D), 4분, 3분.'
  answer: '4분. A-C-B-D로 1 + 2 + 1이다. 도로 수가 가장 적은 길(두 개)은 5분이라 더 느리다. 질문 1에서 밝힌다'
questions:
  - id: q1
    title: 가중치가 있으면 왜 너비 우선 탐색으로 최단 경로를 못 구하나요?
    conclusion:
      lead: '너비 우선 탐색은 거치는 선의 수가 가장 적은 길을 찾는데, 선마다 비용이 다르면 그 길이 가장 싸다는 보장이 없기 때문이에요.'
      sub: '가중치 그래프의 최단 경로는 선의 수가 아니라 비용의 합이 가장 작은 길이에요.'
    says:
      - '가중치 그래프는 선마다 비용이 붙은 그래프다. 코드 predict의 숫자가 도로마다의 이동 시간이다. 인접 리스트에 이웃과 함께 비용을 담는다'
      - '너비 우선 탐색(K11)은 시작점에서 선 하나, 둘, 셋 떨어진 점을 차례로 본다(코드 bfsDistance). 선의 수로 센 거리는 정확하다. A에서 D는 선 두 개다'
      - '하지만 선 두 개인 길 A-B-D는 5분, A-C-D는 6분이고, 선 세 개인 A-C-B-D는 4분이다. 예측의 답을 밝힌다. 거치는 길이 많아도 더 빠를 수 있다'
      - '너비 우선 탐색이 맞는 것은 모든 선의 비용이 같을 때뿐이다. 비용이 다르면 "지금까지 가장 싼 곳"부터 넓혀 가야 한다. 그것이 다익스트라다'
    asks:
      - '본문의 예시: 코드 predict의 도로망에서 너비 우선 탐색이 처음 D에 닿는 길은 선 몇 개이고, 그 길의 이동 시간은 가장 짧은가 (선 2개. 아니다. 5분이나 6분이고 가장 짧은 것은 4분)'
      - '옮긴 상황: 지하철 노선도에서 "환승이 가장 적은 길"과 "시간이 가장 짧은 길"을 구하려 한다. 각각 무엇으로 구하나 (환승은 모든 선의 비용이 같으니 너비 우선 탐색, 시간은 역 사이 시간이 다르니 다익스트라)'
  - id: q2
    title: 다익스트라는 어떤 순서로 최단 거리를 구하나요?
    conclusion:
      lead: '아직 확정하지 않은 점 가운데 지금 거리가 가장 작은 점을 하나씩 확정하고, 그 점을 거쳐 이웃으로 가는 길이 더 짧으면 이웃의 거리를 줄여요.'
      sub: '이웃의 거리를 줄이는 일을 완화라고 해요. 줄일 때 어디서 왔는지(prev)를 적어 두면 최단 경로도 거꾸로 따라가 복원해요.'
    says:
      - '거리표를 만든다. 시작점 A는 0, 나머지는 아직 모른다(무한대)'
      - '확정하지 않은 점 가운데 거리가 가장 작은 점을 고른다. 처음에는 A다. A를 확정하고 이웃 B와 C의 거리를 4와 1로 적는다'
      - '다음으로 가장 작은 C(1)를 확정한다. C를 거쳐 B로 가면 1 + 2 = 3이라 4보다 짧다. B를 3으로 줄인다. 이것이 완화다. D는 1 + 5 = 6으로 적는다'
      - 'B(3)를 확정한다. B를 거쳐 D로 가면 3 + 1 = 4라 6에서 4로 줄인다. D(4)를 확정하고 E를 7로 적는다. E(7)를 확정하고 끝낸다. 최종 거리: A 0, C 1, B 3, D 4, E 7. 테스트로 확정하는 순서와 거리를 출력해 보인다'
      - '코드 dijkstra와 코드 path. 거리를 줄일 때 `prev`에 어디서 왔는지 적는다. D에서 prev를 거꾸로 따라가면 D, B, C, A이고 뒤집으면 A-C-B-D다'
    widget:
      kind: steps
      note: '코드 predict의 도로망으로 다익스트라를 한 단계씩 실행한다. 왼쪽은 거리표(A~E, 확정한 점은 굵게, 이번 단계에 줄어든 값은 강조), 오른쪽은 이번 단계에 확정한 점과 줄인 이웃. 단계: A 확정, C 확정(B 4→3, D 6), B 확정(D 6→4), D 확정(E 7), E 확정. 마지막 단계에 prev로 복원한 경로 A-C-B-D를 보인다'
    asks:
      - '본문의 예시: 코드 predict의 도로망에서 다익스트라가 점을 확정하는 순서는 무엇인가 (A, C, B, D, E)'
      - '옮긴 상황: 다익스트라를 돌린 뒤 prev가 {B: C, C: A, D: B, E: D}였다. A에서 E까지의 최단 경로는 무엇인가 (A-C-B-D-E)'
  - id: q3
    title: 가장 가까운 점부터 확정해도 되는 이유는 무엇이고, 음수 가중치에서는 왜 틀리나요?
    conclusion:
      lead: '비용이 음수가 아니면, 아직 확정하지 않은 다른 점을 거쳐 돌아오는 길은 지금 가장 가까운 점의 거리보다 짧아질 수 없기 때문이에요.'
      sub: '음수 비용이 있으면 멀리 돌아온 길이 더 짧아질 수 있어서, 이미 확정한 거리가 틀려요. 그때는 벨만 포드를 써요.'
    says:
      - '확정하는 순간을 본다. 확정하지 않은 점 가운데 가장 작은 거리가 d인 점 X를 고른다. X로 가는 다른 길은 확정하지 않은 어떤 점 Y를 거쳐야 한다. Y의 거리는 이미 d 이상이고 비용은 음수가 아니니 Y에서 X로 오는 길은 d보다 작을 수 없다. 그래서 X의 거리는 d로 끝이다'
      - '지금 가장 좋아 보이는 것을 고르고 되돌아보지 않는 방식이라 그리디다. 그리디가 맞으려면 이런 근거가 있어야 한다(K12)'
      - '음수 가중치의 반례(코드 negative). 방향이 있는 도로 A→B 2, A→C 3, C→B -2. 다익스트라는 B(2)를 C(3)보다 먼저 확정한다. 하지만 A→C→B는 3 - 2 = 1로 더 짧다. 테스트로 다익스트라가 2를 내는 것을 보인다'
      - '돈을 돌려받는 구간처럼 음수 비용이 있는 문제에는 벨만 포드를 쓴다. 모든 선의 완화를 점의 수 - 1번 되풀이해서 O(V × E)다. 같은 반례에서 1을 낸다. 더 알아보기로 둔다'
      - '시간, 거리, 요금처럼 서버에서 다루는 비용은 대부분 음수가 아니다. 그래서 다익스트라가 기본이다'
    asks:
      - '본문의 예시: 코드 negative의 도로망에서 다익스트라는 B까지의 거리를 얼마로 내고, 실제 최단 거리는 얼마인가 (2, 1)'
      - '옮긴 상황: 모든 선의 비용이 0 이상인 그래프에서 다익스트라가 점 X를 거리 10으로 확정했다. 그 뒤에 X로 가는 9분짜리 길이 발견될 수 있나 (없다. 확정하지 않은 점의 거리가 모두 10 이상이고 비용은 음수가 아니다)'
  - id: q4
    title: 우선순위 큐로 다익스트라를 어떻게 빠르게 만드나요?
    conclusion:
      lead: '가장 거리가 작은 점을 매번 배열 전체에서 찾지 않고, 우선순위 큐에서 O(log V)에 꺼내요. 그래서 O(V²)이 O((V + E) log V)가 돼요.'
      sub: '자바의 `PriorityQueue`는 들어 있는 값의 우선순위를 줄일 수 없어서, 거리가 줄면 새로 넣고 꺼냈을 때 이미 확정한 점이면 건너뛰어요. 확정 표시는 넣을 때가 아니라 꺼낼 때 해요.'
    says:
      - '가장 작은 점을 매번 배열에서 찾으면 한 번에 V번 보고 그 일을 V번 하니 O(V²)이다. 점이 1만 개면 1억 번 본다'
      - '우선순위 큐(K9)에 (점, 거리)를 넣으면 가장 작은 것을 O(log V)에 꺼낸다. 선마다 한 번씩 넣을 수 있으니 전체는 O((V + E) log V)다. 도로처럼 선이 점의 몇 배 정도인 그래프에서 훨씬 빠르다. 점 2만 개, 선 10만 개의 무작위 그래프로 두 방법의 답이 같고 걸린 시간이 다른 것을 실측값으로 보인다'
      - '`PriorityQueue`에는 들어 있는 원소의 우선순위를 줄이는 연산이 없다. 그래서 B의 거리가 4에서 3으로 줄면 (B, 3)을 새로 넣는다. 큐에는 (B, 4)도 남는다. 나중에 (B, 4)를 꺼내면 B는 이미 확정했으니 건너뛴다(코드 dijkstra의 `continue`). 이것을 게으른 삭제라고 한다'
      - '확정 표시(`done`)는 꺼낼 때 한다. 너비 우선 탐색(K11)은 넣을 때 표시했지만, 다익스트라에서 넣을 때 표시하면 처음 발견한 거리로 넣은 항목만 큐에 남아 C를 거친 더 짧은 길을 퍼뜨리지 못한다. 코드 markOnPush로 D를 5로 내는 것을 보인다'
      - '더 알아보기: 도착점 하나만 필요하면 그 점을 꺼낸 순간 멈춰도 된다. 모든 점 쌍의 거리는 플로이드 워셜(O(V³)), 지도처럼 목적지 방향을 어림할 수 있으면 A* 탐색을 쓴다. 이름만 소개한다'
    asks:
      - '본문의 예시: 코드 dijkstra에서 B의 거리가 4에서 3으로 줄어 (B, 3)을 넣었다. 나중에 큐에서 (B, 4)를 꺼내면 어떻게 되나 (B는 이미 확정했으니 건너뛴다)'
      - '옮긴 상황: 점 10만 개, 선 30만 개의 도로망에서 가장 작은 점을 배열에서 찾는 다익스트라와 우선순위 큐를 쓰는 다익스트라의 시간 복잡도는 각각 무엇인가 (O(V²)과 O((V + E) log V))'
      - '실무 구역: 코드 markOnPush처럼 넣을 때 확정 표시를 하는 다익스트라를 코드 predict의 도로망에 돌리면 D까지의 거리는 얼마로 나오나 (5. B를 처음 발견한 거리 4로 큐에 넣은 채 굳혀서, C를 거쳐 3으로 줄어든 B를 다시 넣지 못한다)'
practice:
  says:
    - '서버 코드에서는 창고 사이 배송 시간, 결재 흐름의 단계 비용처럼 작은 그래프를 메모리에 올려 계산한다. 도로 표(`route` 테이블: from, to, minutes)를 읽어 `Map<String, List<Edge>>`를 만들고 서비스 메서드에서 다익스트라를 돌리는 코드를 보인다. 도로가 바뀌지 않으면 그래프를 한 번 만들어 빈 필드에 두고 요청마다 계산만 한다'
    - '흔한 실수: 그래프와 탐색 레슨에서 배운 "방문 표시는 넣을 때"를 다익스트라에 그대로 쓴다(코드 markOnPush). 테스트 데이터가 단순하면 답이 맞아 보이다가, 짧은 길이 나중에 발견되는 도로망에서 더 느린 경로를 낸다. 고친 코드: 꺼낼 때 확정하고 이미 확정한 점은 건너뛴다(코드 dijkstra). 두 코드를 코드 predict의 도로망에 돌려 D까지 5분과 4분을 내는 것을 테스트로 남긴다'
    - '거리를 `int`로 두고 무한대를 `Integer.MAX_VALUE`로 표시했다면, 무한대에 비용을 더하는 계산을 하지 않게 한다. 더하면 넘쳐서 음수가 된다(J19). 코드 dijkstra는 꺼낸 점(거리가 정해진 점)에서만 더해서 안전하다'
    - '도시 전체의 도로망처럼 점이 수백만 개면 직접 계산하지 않고 지도 서비스의 길 찾기 API나 그래프 DB의 최단 경로 기능을 쓴다. 이 레슨에서는 이름만 소개한다'
claims:
  - claim: '코드 predict의 도로망에서 너비 우선 탐색이 찾는 D까지의 길은 선 2개이고 그 길은 4분보다 길며, 다익스트라는 4분(A-C-B-D)을 낸다'
    how: '두 탐색을 돌려 선의 수, 이동 시간, 경로를 비교한다'
  - claim: '다익스트라가 확정하는 순서는 A, C, B, D, E이고 최종 거리는 A 0, C 1, B 3, D 4, E 7이다'
    how: '확정할 때마다 기록해 위젯의 단계와 맞춘다'
  - claim: 'prev를 거꾸로 따라가면 A-C-B-D와 A-C-B-D-E가 나온다'
    how: '경로 복원 코드를 돌린다'
  - claim: '코드 negative에서 다익스트라는 B를 2로, 벨만 포드는 1로 낸다'
    how: '두 알고리즘을 같은 그래프에 돌린다'
  - claim: '점 2만 개, 선 10만 개의 무작위 그래프에서 배열 다익스트라와 우선순위 큐 다익스트라의 거리표가 같고, 우선순위 큐 쪽이 훨씬 빨리 끝난다'
    how: '두 방법의 결과를 비교하고 걸린 시간을 `CiOutput`에 남긴다. 배수는 단정하지 않는다'
  - claim: '거리가 줄어 다시 넣은 점은 큐에서 낡은 항목으로 한 번 더 나오고 건너뛰어진다'
    how: '건너뛴 횟수를 센다'
  - claim: '넣을 때 확정 표시를 하는 코드는 코드 predict의 도로망에서 D까지 5를 낸다'
    how: '코드 markOnPush를 넣은 버전을 돌린다'
sources:
  - 'E. W. Dijkstra, A note on two problems in connexion with graphs (1959): Numerische Mathematik 1. 원문 대신 알고리즘의 정의만 따른다'
  - '`PriorityQueue`의 연산과 비용(offer와 poll은 O(log n), remove(Object)는 O(n)): API 문서 https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/PriorityQueue.html'
