footer: '근거: `computeIfAbsent`의 함수가 맵을 고치면 안 된다는 것은 [Map API 문서](link:map), `HashMap`이 그것을 알아채 예외를 던진다는 것은 [HashMap API 문서](link:hashMap), `ConcurrentHashMap`의 같은 제약은 [ConcurrentHashMap API 문서](link:chm), `@Cacheable`은 [스프링 문서](link:cacheable). 결과는 OpenJDK 21에서 테스트로 확인했어요. 오류는 [GitHub 이슈](https://github.com/wanja727/dev-lessons/issues)로 알려 주세요.'
