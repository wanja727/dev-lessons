# 그리디와 동적 계획법 (설계서)
# 자료 파일의 칸은 docs/lesson-data-format.md에 있다.
stage: design
title: 그리디와 동적 계획법
unit: 자료구조와 알고리즘
roadmap: K12
type: 자바 실행
prerequisites:
  - {slug: recursion, title: 재귀}
assume: '자바 21(OpenJDK). 같은 인자로 같은 호출을 되풀이하는 재귀가 느리고, 결과를 저장하면 빨라진다는 것(재귀 레슨의 피보나치). 시간 복잡도의 표기(시간 복잡도 레슨).'
example: '거스름돈과 포인트 결제. 동전(또는 포인트 상품권)의 단위가 주어지면 금액을 가장 적은 개수로 만들어요. 우리 동전 단위(500, 100, 50, 10원)에서는 큰 것부터 고르면 되지만, 단위가 1, 3, 4라면 그렇지 않아요. 같은 문제를 동적 계획법으로 풀어 비교해요. 실무 구역에서는 `HashMap.computeIfAbsent`로 메모이제이션을 쓰다 나는 예외로 옮겨요.'
intro:
  - '포인트 상품권을 1천, 3천, 4천 포인트 단위로 발행한다고 해요. 6천 포인트를 가장 적은 장수로 주려고 큰 것부터 고르면 4천 하나와 1천 둘, 세 장이에요. 그런데 3천 두 장이면 두 장으로 끝나요. 매 순간 가장 좋아 보이는 것을 고르는 방법이 언제 맞고 언제 틀리는지 알아야 해요.'
  - '자바 개발자가 이 알고리즘을 서비스 코드에 직접 짜는 일은 많지 않아요. 그래도 같은 계산을 다시 하지 않으려고 결과를 저장해 두는 생각은 캐시, 배치의 중간 결과, 할인 조합 계산에 그대로 쓰여요. 면접과 코딩 테스트에서는 "그리디로 풀 수 있는가", "점화식을 세울 수 있는가"를 묻는 문제가 자주 나와요.'
  - '이 레슨에서는 같은 거스름돈 문제를 그리디와 동적 계획법으로 풀어 답이 갈리는 경우를 찾고, 결과를 저장했을 때 계산 횟수가 얼마나 줄어드는지 세요.'
covers:
  - topic: '그리디: 매 단계에서 지금 가장 좋아 보이는 것을 고르고 다시 돌아보지 않는다'
    where: '질문 1'
  - topic: '그리디가 맞는 경우: 우리 동전처럼 큰 단위가 작은 단위의 배수일 때 거스름돈, 끝나는 시각이 이른 회의부터 고르는 회의실 배정'
    where: '질문 1'
  - topic: '그리디는 빠르다. 정렬 한 번과 한 번 훑기면 끝나는 경우가 많다'
    where: '질문 1'
  - topic: '그리디가 틀리는 경우: 단위가 1, 3, 4일 때 6. 지금의 좋은 선택이 나중의 더 좋은 선택을 막는다'
    where: '질문 2'
  - topic: '그리디가 맞는지는 증명하거나 반례를 찾아 확인한다. 몇 개의 예에서 맞았다고 맞는 것이 아니다'
    where: '질문 2'
  - topic: '모든 경우를 다 해 보면(완전 탐색) 늘 맞지만 경우의 수가 지수로 는다'
    where: '질문 2'
  - topic: '동적 계획법: 큰 문제의 답을 작은 문제의 답으로 나타내는 식(점화식)을 세우고, 작은 문제의 답을 한 번씩만 계산해 저장해 두고 쓴다'
    where: '질문 3'
  - topic: '위에서 아래로(재귀와 메모이제이션)와 아래에서 위로(작은 것부터 표를 채우는 반복문). 아래에서 위로는 재귀 깊이의 걱정이 없다'
    where: '질문 3'
  - topic: '거스름돈의 점화식: 금액 m의 최소 개수는 단위 c마다 (m - c의 최소 개수 + 1) 가운데 가장 작은 것'
    where: '질문 3'
  - topic: '동적 계획법의 비용은 부분 문제의 수 × 부분 문제 하나의 일. 거스름돈은 O(금액 × 단위 수)'
    where: '질문 3'
  - topic: '동적 계획법을 쓸 수 있는 조건 둘: 같은 부분 문제가 여러 번 나온다(겹치는 부분 문제), 큰 문제의 최적이 작은 문제의 최적으로 이루어진다(최적 부분 구조)'
    where: '질문 4'
  - topic: '부분 문제가 겹치지 않으면 저장할 이유가 없다. 나눠서 푸는 병합 정렬은 동적 계획법이 아니다'
    where: '질문 4'
  - topic: '그리디와 동적 계획법을 가르는 질문: 지금 선택이 남은 문제를 망치지 않는가'
    where: '질문 4'
  - topic: '배낭 문제(물건을 쪼갤 수 있으면 그리디, 없으면 동적 계획법)'
    where: '질문 4의 더 알아보기'
  - topic: 'HashMap.computeIfAbsent 안에서 같은 맵을 고치는 재귀 메모이제이션은 자바 9부터 ConcurrentModificationException을 던진다'
    where: '실무에서는'
  - topic: '서비스에서 같은 계산을 다시 하지 않는 것은 캐시다'
    where: '실무에서는에 한 줄. 캐시 전략과 무효화(A4)'
  - topic: '최단 경로의 다익스트라가 그리디라는 것'
    where: '다루지 않음: 최단 경로(K14)'
codes:
  predict: |-
    // 큰 단위부터 고른다
    int greedy(int[] units, int amount) {
      int count = 0;
      for (int u : units) { // 큰 것부터
        count += amount / u;
        amount %= u;
      }
      return count;
    }

    greedy(new int[]{4, 3, 1}, 6);
  meetings: |-
    record Meeting(int start, int end) {}

    meetings.sort(Comparator.comparingInt(
        Meeting::end));
    int lastEnd = 0;
    int count = 0;
    for (Meeting m : meetings) {
      if (m.start() >= lastEnd) {
        count++;
        lastEnd = m.end();
      }
    }
  bruteForce: |-
    int best(int[] units, int amount) {
      if (amount == 0) return 0;
      int min = Integer.MAX_VALUE;
      for (int u : units) {
        if (u <= amount) {
          int r = best(units, amount - u);
          if (r != Integer.MAX_VALUE) {
            min = Math.min(min, r + 1);
          }
        }
      }
      return min;
    }
  table: |-
    static final int NONE = Integer.MAX_VALUE;

    int minCoins(int[] units, int amount) {
      int[] dp = new int[amount + 1];
      Arrays.fill(dp, NONE);
      dp[0] = 0;
      for (int m = 1; m <= amount; m++) {
        for (int u : units) {
          if (u <= m && dp[m - u] != NONE) {
            dp[m] = Math.min(dp[m],
                dp[m - u] + 1);
          }
        }
      }
      return dp[amount];
    }
  computeMemo: |-
    Map<Integer, Long> memo = new HashMap<>();

    long fib(int n) {
      if (n < 2) return n;
      return memo.computeIfAbsent(n,
          k -> fib(k - 1) + fib(k - 2));
    }
  fixedMemo: |-
    long fib(int n) {
      if (n < 2) return n;
      Long hit = memo.get(n);
      if (hit != null) return hit;
      long v = fib(n - 1) + fib(n - 2);
      memo.put(n, v);
      return v;
    }
predict:
  text: '코드 predict는 단위를 큰 것부터 골라 6을 만들어요. 단위는 4, 3, 1이에요. 돌려주는 개수는 얼마이고, 그것이 가장 적은 개수일까요? 보기: 2개이고 가장 적다, 3개이고 가장 적다, 3개이지만 2개로도 만들 수 있다.'
  answer: '3개이지만 2개로도 만들 수 있다. 4를 먼저 고르면 남은 2를 1 두 개로 채워 3개다. 3 두 개면 2개다. 질문 2에서 밝힌다.'
questions:
  - id: q1
    title: 그리디는 어떻게 답을 고르나요?
    conclusion:
      lead: '단계마다 지금 가장 좋아 보이는 것 하나를 고르고, 고른 것을 다시 돌아보지 않아요.'
      sub: '그래서 아주 빨라요. 우리 동전의 거스름돈이나 끝나는 시각이 이른 회의부터 고르는 회의실 배정처럼, 지금의 좋은 선택이 나중을 망치지 않는 문제에서는 이것으로 가장 좋은 답이 나와요.'
    says:
      - '거스름돈 3,760원을 500, 100, 50, 10원으로 준다. 가장 큰 500원을 되는 만큼(7개) 주고, 남은 260원에 100원(2개), 50원(1개), 10원(1개). 11개다. 코드 predict의 함수에 우리 동전 단위를 넣어 돌린 결과다'
      - '이것이 가장 적은 개수인 이유. 우리 동전은 큰 단위가 작은 단위의 배수다(500은 100의 5배, 100은 50의 2배). 작은 동전 여러 개로 낸 금액은 언제나 큰 동전으로 바꿔 개수를 줄일 수 있다. 그러니 큰 것을 될 수 있는 만큼 쓰는 것이 손해가 아니다'
      - '회의실 배정(코드 meetings). 회의실 하나에 겹치지 않게 가장 많은 회의를 넣는다. 끝나는 시각이 이른 회의부터 고른다. 일찍 끝날수록 남은 시간이 많아 나머지 회의를 넣을 자리가 가장 넓게 남는다. 예제 회의 목록으로 고른 회의를 보인다'
      - '비용. 거스름돈은 단위 수만큼, 회의실은 정렬 O(n log n)에 한 번 훑기 O(n)이다'
      - '그리디의 모양: 정렬하거나 가장 좋은 것을 고르는 기준을 정하고, 한 번 지나가며 고른다'
    asks:
      - '본문의 예시: 우리 동전 단위로 1,280원을 그리디로 거슬러 주면 동전은 모두 몇 개인가 (8개. 500원 2개, 100원 2개, 50원 1개, 10원 3개)'
      - '옮긴 상황: 회의 (1~4시), (3~5시), (0~6시), (5~7시), (8~9시), (5~9시)를 회의실 하나에 겹치지 않게 넣는다. 끝나는 시각이 이른 것부터 고르면 몇 개가 들어가나 (3개. 1~4시, 5~7시, 8~9시)'
  - id: q2
    title: 그리디가 틀리는 경우는 언제인가요?
    conclusion:
      lead: '지금 가장 좋아 보이는 선택이 남은 문제를 더 나쁘게 만들 때예요. 단위가 1, 3, 4일 때 6을 만들면 그리디는 3개를 고르지만 답은 3 두 개, 2개예요.'
      sub: '그래서 그리디는 맞는다는 근거가 있을 때만 써요. 몇 가지 예에서 맞았다고 늘 맞는 것은 아니고, 반례 하나면 틀린 방법이에요.'
    says:
      - '예측의 답을 밝힌다. 4를 고르면 남은 2는 1 두 개로만 채운다. 4를 고른 순간 3을 두 번 쓰는 길이 막혔다. 지금의 좋은 선택이 나중의 더 좋은 선택을 막는다'
      - '단위 1, 3, 4는 큰 단위가 작은 단위의 배수가 아니다. 질문 1의 근거가 없다'
      - '맞는지 확인하는 방법. 모든 경우를 해 보는 코드(코드 bruteForce)와 그리디를 금액 1부터 100까지 견주어 처음 다른 금액을 찾는다. 단위 1, 3, 4에서는 6이 처음이다. 우리 동전 단위로는 다른 금액이 없다. 반례 찾기를 테스트로 보인다'
      - '코드 bruteForce는 늘 맞지만 느리다. 금액이 1 늘 때마다 단위 수만큼 갈래가 나뉘어 호출이 지수로 는다. 금액 30, 40에서의 호출 수를 센다. K5의 피보나치와 같은 모양이다'
    asks:
      - '본문의 예시: 단위가 1, 3, 4일 때 그리디로 8을 만들면 몇 개이고, 가장 적은 개수와 같은가 (2개. 4 두 개. 같다)'
      - '옮긴 상황: 동전 단위가 1, 5, 6원인 나라에서 10원을 그리디로 거슬러 주면 몇 개이고, 가장 적은 개수는 몇 개인가 (5개(6, 1, 1, 1, 1), 2개(5, 5))'
  - id: q3
    title: 동적 계획법은 어떻게 같은 계산을 다시 하지 않나요?
    conclusion:
      lead: '큰 문제의 답을 작은 문제의 답으로 나타내는 식을 세우고, 작은 문제의 답을 한 번씩만 계산해 저장해 두고 꺼내 써요.'
      sub: '거스름돈에서는 "금액 m의 최소 개수 = 단위 c마다 (m - c의 최소 개수 + 1) 가운데 가장 작은 것"이에요. 0원부터 목표 금액까지 표를 한 칸씩 채우면 O(금액 × 단위 수)에 끝나요.'
    says:
      - '코드 bruteForce가 느린 이유는 같은 금액을 여러 번 풀기 때문이다. 6을 풀 때 2는 6-4에서도, 6-3-1에서도, 6-1-1-1-1에서도 다시 푼다. 금액 m의 답은 금액이 같으면 늘 같다. 한 번 풀어 저장하면 된다'
      - '점화식. `best(m) = min(best(m - c) + 1)`, c는 m 이하인 단위. 끝나는 조건은 `best(0) = 0`이다. 큰 금액의 답이 작은 금액의 답으로 정해진다'
      - '위에서 아래로. 코드 bruteForce에 저장할 배열을 더하면 K5의 `fibMemo`와 같은 메모이제이션이다. 재귀는 그대로 두고 계산한 금액을 다시 풀지 않는다'
      - '아래에서 위로. 코드 table. 0원부터 목표 금액까지 차례로 채운다. m을 채울 때 필요한 `dp[m - c]`는 이미 채워져 있다. 재귀가 없어 큰 금액에서도 스택 걱정이 없다. 단위 1, 3, 4로 0~6의 표를 그려 보인다: 0, 1, 2, 1, 1, 2, 2'
      - '비용. 칸이 금액 + 1개이고 칸마다 단위 수만큼 본다. 금액 1만, 단위 4개면 4만 번이다. 코드 bruteForce의 호출 수와 나란히 센 값을 보인다'
      - '답이 몇 개인지만 아니라 무엇을 골랐는지도 필요하면, 칸마다 마지막에 고른 단위를 함께 저장하고 뒤에서부터 따라간다'
    widget:
      kind: steps
      note: '단위 1, 3, 4로 금액 0~6의 표를 한 칸씩 채운다. 단계마다 지금 채우는 칸 m을 강조하고, 후보 `dp[m - 1] + 1`, `dp[m - 3] + 1`, `dp[m - 4] + 1`을 화살표로 이은 칸에서 보인 뒤 가장 작은 값을 적는다. 마지막 칸 6에서 후보 3(6-1), 2(6-3), 3(6-4) 가운데 2가 골라지는 것을 본다'
    asks:
      - '본문의 예시: 코드 table에서 단위가 1, 3, 4일 때 `dp[7]`은 얼마인가 (2. 3과 4)'
      - '옮긴 상황: 계단을 한 번에 1칸이나 2칸 오른다. n칸을 오르는 방법의 수 `ways(n)`을 작은 문제로 나타내는 식은 무엇인가 (`ways(n) = ways(n - 1) + ways(n - 2)`. 마지막 걸음이 1칸이거나 2칸이다)'
  - id: q4
    title: 어떤 문제에 그리디를, 어떤 문제에 동적 계획법을 쓰나요?
    conclusion:
      lead: '지금의 선택이 남은 문제를 망치지 않는다는 근거가 있으면 그리디를, 그렇지 않지만 같은 부분 문제가 되풀이되면 동적 계획법을 써요.'
      sub: '동적 계획법이 통하려면 두 가지가 필요해요. 같은 부분 문제가 여러 번 나와야 하고, 큰 문제의 가장 좋은 답이 작은 문제의 가장 좋은 답으로 이루어져야 해요.'
    says:
      - '겹치는 부분 문제. 거스름돈은 같은 금액이 여러 갈래에서 다시 나온다. 피보나치도 그렇다. 병합 정렬(K6)은 나눈 두 절반이 겹치지 않아 저장해도 다시 쓸 일이 없다. 나눠서 푸는 것이지 동적 계획법이 아니다'
      - '최적 부분 구조. 6을 2개로 만드는 가장 좋은 답에서 3 하나를 빼면 3을 만드는 가장 좋은 답(1개)이 남는다. 큰 답 안에 작은 답이 들어 있다. 이것이 점화식을 세울 수 있는 이유다'
      - '그리디는 여기에 하나를 더 요구한다. 가장 좋은 답이 지금 가장 좋아 보이는 선택을 언제나 포함해야 한다. 우리 동전과 회의실 배정은 그렇고, 단위 1, 3, 4는 아니다'
      - '고르는 순서. 그리디의 근거가 있는지 먼저 본다. 없으면 점화식을 세운다. 둘 다 안 되면 모든 경우를 보되 줄일 수 있는지 본다'
      - '더 알아보기: 무게 한도가 있는 가방에 값이 가장 크게 물건을 담는 문제(배낭 문제). 물건을 쪼갤 수 있으면 무게당 값이 큰 것부터 담는 그리디가 맞다. 쪼갤 수 없으면 그리디가 틀리는 반례가 있고 동적 계획법으로 푼다'
    asks:
      - '본문의 예시: 동전 단위 1, 3, 4로 금액을 만드는 문제에서 그리디가 아니라 동적 계획법을 써야 하는 이유는 무엇인가 (가장 좋은 답이 가장 큰 단위를 고르는 선택을 늘 포함하지 않는다. 6에서 4를 고르면 틀린다)'
      - '옮긴 상황: 정수 배열을 병합 정렬로 정렬할 때 나눈 절반의 결과를 표에 저장해 두면 빨라지나 (아니다. 두 절반이 겹치지 않아 같은 부분 문제가 다시 나오지 않는다)'
      - '실무 구역: 코드 computeMemo로 `fib(30)`을 부르면 어떻게 되나 (자바 9부터 `ConcurrentModificationException`. `computeIfAbsent`의 함수 안에서 같은 맵에 값을 넣는다)'
practice:
  says:
    - '서비스 코드에서 이 생각을 가장 많이 쓰는 곳은 캐시다. 같은 인자로 같은 결과가 나오는 비싼 계산(외부 API 조회, 무거운 집계)의 결과를 저장해 두고 다시 쓴다. 스프링의 `@Cacheable`이 메서드 단위의 메모이제이션이다. 바뀌는 데이터를 언제 지울지는 캐시 전략과 무효화(A4)에서 다룬다'
    - '흔한 실수: 메모이제이션을 짧게 쓰려고 코드 computeMemo처럼 `HashMap.computeIfAbsent`에 재귀를 넣는다. 함수 안에서 `fib(k - 1)`이 같은 맵에 값을 넣는다. `computeIfAbsent`는 함수가 맵을 고치는 것을 허용하지 않고, 자바 9부터 `HashMap`은 이것을 알아채 `ConcurrentModificationException`을 던진다. n이 2면 함수 안에서 맵을 고치지 않아 지나가고, 3부터 터진다. 고친 코드: 코드 fixedMemo처럼 `get`으로 보고, 계산하고, `put`한다. 또는 코드 table처럼 아래에서 위로 채운다. 세 코드의 결과를 테스트로 남긴다'
    - '`ConcurrentHashMap.computeIfAbsent`에 같은 일을 하면 예외 대신 멈춰 버리거나 `IllegalStateException`을 던질 수 있다. 어느 맵이든 `compute` 계열 함수 안에서 같은 맵을 고치지 않는다 (자바 API 문서 근거)'
claims:
  - claim: '코드 predict는 6에 3을 돌려주고, 단위 500, 100, 50, 10에 3,760원이면 11, 1,280원이면 8을 돌려준다'
    how: '실행해 본다'
  - claim: '예제 회의 목록과 질문 2의 옮긴 상황 회의 목록에서 끝나는 시각이 이른 것부터 고르면 각각 정해진 수가 들어간다'
    how: '코드 meetings를 돌려 고른 회의를 남긴다. 옮긴 상황은 3개다'
  - claim: '단위 1, 3, 4에서 그리디와 완전 탐색이 처음 갈리는 금액은 6이고, 우리 동전 단위는 10원 단위 1,000원까지 갈리지 않는다'
    how: '두 함수를 금액마다 비교한다'
  - claim: '단위 1, 5, 6에서 10은 그리디 5개, 완전 탐색 2개다'
    how: '두 함수를 부른다'
  - claim: '코드 bruteForce의 호출 수는 금액이 커질수록 지수로 늘고, 코드 table의 칸 계산 수는 금액 × 단위 수다'
    how: '호출과 계산을 센다. 금액 30과 40의 호출 수를 `CiOutput`에 남긴다'
  - claim: '코드 table은 단위 1, 3, 4에서 0~7에 0, 1, 2, 1, 1, 2, 2, 2를 채운다'
    how: '`dp` 배열을 본다'
  - claim: '코드 computeMemo는 `fib(30)`에서 `ConcurrentModificationException`을 던지고, 코드 fixedMemo는 832040을 돌려준다'
    how: '두 코드를 부른다. 예외가 나는 가장 작은 n도 `CiOutput`에 남긴다'
sources:
  - '`HashMap.computeIfAbsent`가 함수 안의 수정을 알아채면 `ConcurrentModificationException`을 던진다는 것: API 문서 https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/HashMap.html'
  - '`Map.computeIfAbsent`의 함수가 맵을 고치면 안 된다는 것: API 문서 https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/Map.html'
  - '`ConcurrentHashMap.computeIfAbsent`의 같은 제약: API 문서 https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/concurrent/ConcurrentHashMap.html'
  - '`@Cacheable`: 스프링 문서 https://docs.spring.io/spring-framework/reference/integration/cache/annotations.html'
