# 그리디와 동적 계획법
# 자료 파일의 칸은 docs/lesson-data-format.md에 있다. 문제는 content/questions/greedy-and-dp.yaml에 있다.
title: 그리디와 동적 계획법
description: 그리디가 어떻게 답을 고르는지, 그리디가 틀리는 경우는 언제인지, 동적 계획법은 어떻게 같은 계산을 다시 하지 않는지, 어떤 문제에 무엇을 쓰는지. 네 가지 질문에 스스로 답할 수 있게 거스름돈과 포인트 상품권으로 직접 세어 보며 배우는 대화형 레슨.
unit: 자료구조와 알고리즘
minutes: 20
roadmap: K12
type: 자바 실행
prerequisites:
  - {slug: recursion, title: 재귀}
assume: '자바 21(OpenJDK). 같은 인자로 같은 호출을 되풀이하는 재귀가 느리고, 결과를 저장하면 빨라진다는 것(재귀 레슨의 피보나치). 시간 복잡도의 표기(시간 복잡도 레슨).'
example: '거스름돈과 포인트 결제. 동전(또는 포인트 상품권)의 단위가 주어지면 금액을 가장 적은 개수로 만들어요. 우리 동전 단위(500, 100, 50, 10원)에서는 큰 것부터 고르면 되지만, 단위가 1, 3, 4라면 그렇지 않아요. 같은 문제를 동적 계획법으로 풀어 비교해요. 실무 구역에서는 `HashMap.computeIfAbsent`로 메모이제이션을 쓰다 나는 예외로 옮겨요.'
intro:
  - '포인트 상품권을 1천, 3천, 4천 포인트 단위로 발행한다고 해요. 6천 포인트를 가장 적은 장수로 주려고 큰 것부터 고르면 4천 하나와 1천 둘, 세 장이에요. 그런데 3천 두 장이면 두 장으로 끝나요. 매 순간 가장 좋아 보이는 것을 고르는 방법이 언제 맞고 언제 틀리는지 알아야 해요.'
  - '자바 개발자가 이 알고리즘을 서비스 코드에 직접 짜는 일은 많지 않아요. 그래도 같은 계산을 다시 하지 않으려고 결과를 저장해 두는 생각은 캐시, 배치의 중간 결과, 할인 조합 계산에 그대로 쓰여요. 면접과 코딩 테스트에서는 "그리디로 풀 수 있는가", "점화식을 세울 수 있는가"를 묻는 문제가 자주 나와요.'
  - '이 레슨에서는 같은 거스름돈 문제를 그리디와 동적 계획법으로 풀어 답이 갈리는 경우를 찾고, 결과를 저장했을 때 계산 횟수가 얼마나 줄어드는지 세요.'
covers:
  - topic: '그리디: 매 단계에서 지금 가장 좋아 보이는 것을 고르고 다시 돌아보지 않는다'
    where: '질문 1'
  - topic: '그리디가 맞는 경우: 우리 동전처럼 큰 단위가 작은 단위의 배수일 때 거스름돈, 끝나는 시각이 이른 회의부터 고르는 회의실 배정'
    where: '질문 1'
  - topic: '그리디는 빠르다. 정렬 한 번과 한 번 훑기면 끝나는 경우가 많다'
    where: '질문 1'
  - topic: '그리디가 틀리는 경우: 단위가 1, 3, 4일 때 6. 지금의 좋은 선택이 나중의 더 좋은 선택을 막는다'
    where: '질문 2'
  - topic: '그리디가 맞는지는 증명하거나 반례를 찾아 확인한다. 몇 개의 예에서 맞았다고 맞는 것이 아니다'
    where: '질문 2'
  - topic: '모든 경우를 다 해 보면(완전 탐색) 늘 맞지만 경우의 수가 지수로 는다'
    where: '질문 2'
  - topic: '동적 계획법: 큰 문제의 답을 작은 문제의 답으로 나타내는 식(점화식)을 세우고, 작은 문제의 답을 한 번씩만 계산해 저장해 두고 쓴다'
    where: '질문 3'
  - topic: '위에서 아래로(재귀와 메모이제이션)와 아래에서 위로(작은 것부터 표를 채우는 반복문). 아래에서 위로는 재귀 깊이의 걱정이 없다'
    where: '질문 3'
  - topic: '거스름돈의 점화식: 금액 m의 최소 개수는 단위 c마다 (m - c의 최소 개수 + 1) 가운데 가장 작은 것'
    where: '질문 3'
  - topic: '동적 계획법의 비용은 부분 문제의 수 × 부분 문제 하나의 일. 거스름돈은 O(금액 × 단위 수)'
    where: '질문 3'
  - topic: '동적 계획법을 쓸 수 있는 조건 둘: 같은 부분 문제가 여러 번 나온다(겹치는 부분 문제), 큰 문제의 최적이 작은 문제의 최적으로 이루어진다(최적 부분 구조)'
    where: '질문 4'
  - topic: '부분 문제가 겹치지 않으면 저장할 이유가 없다. 나눠서 푸는 병합 정렬은 동적 계획법이 아니다'
    where: '질문 4'
  - topic: '그리디와 동적 계획법을 가르는 질문: 지금 선택이 남은 문제를 망치지 않는가'
    where: '질문 4'
  - topic: '배낭 문제(물건을 쪼갤 수 있으면 그리디, 없으면 동적 계획법)'
    where: '질문 4의 더 알아보기'
  - topic: 'HashMap.computeIfAbsent 안에서 같은 맵을 고치는 재귀 메모이제이션은 자바 9부터 ConcurrentModificationException을 던진다'
    where: '실무에서는'
  - topic: '서비스에서 같은 계산을 다시 하지 않는 것은 캐시다'
    where: '실무에서는에 한 줄. 캐시 전략과 무효화(A4)'
  - topic: '최단 경로의 다익스트라가 그리디라는 것'
    where: '다루지 않음: 최단 경로(K14)'
codes:
  predict: |-
    // 큰 단위부터 고른다
    int greedy(int[] units, int amount) {
      int count = 0;
      for (int u : units) { // 큰 것부터
        count += amount / u;
        amount %= u;
      }
      return count;
    }

    greedy(new int[]{4, 3, 1}, 6);
  wonRun: |-
    int[] won = {500, 100, 50, 10};
    greedy(won, 3760);
    greedy(won, 1280);
  meetings: |-
    record Meeting(int start, int end) {}

    meetings.sort(Comparator.comparingInt(
        [[Meeting::end]]));
    int lastEnd = 0;
    int count = 0;
    for (Meeting m : meetings) {
      if (m.start() >= lastEnd) {
        count++;
        lastEnd = m.end();
      }
    }
  bruteForce: |-
    int best(int[] units, int amount) {
      if (amount == 0) return 0;
      int min = Integer.MAX_VALUE;
      for (int u : units) {
        if (u <= amount) {
          int r = [[best(units, amount - u)]];
          if (r != Integer.MAX_VALUE) {
            min = Math.min(min, r + 1);
          }
        }
      }
      return min;
    }
  counterRun: |-
    // 금액 1부터 100까지 greedy와
    // 가장 적은 개수를 견준다
  recurrence: |-
    best(0) = 0
    best(m) = min( best(m - c) + 1 )
              c는 m 이하인 단위
  table: |-
    static final int NONE = Integer.MAX_VALUE;

    int minCoins(int[] units, int amount) {
      int[] dp = new int[amount + 1];
      Arrays.fill(dp, NONE);
      dp[0] = 0;
      for (int m = 1; m <= amount; m++) {
        for (int u : units) {
          if (u <= m && dp[m - u] != NONE) {
            dp[m] = Math.min(dp[m],
                [[dp[m - u] + 1]]);
          }
        }
      }
      return dp[amount];
    }
  memoBest: |-
    int[] memo = new int[amount + 1];
    // best를 부르기 전에
    if (memo[amount] != 0) {
      return memo[amount];
    }
    // ... 계산한 뒤
    memo[amount] = min;
  costRun: |-
    // 단위 1, 3, 4로 호출과 칸 계산을 센다
  computeMemo: |-
    Map<Integer, Long> memo = new HashMap<>();

    long fib(int n) {
      if (n < 2) return n;
      return memo.[[computeIfAbsent]](n,
          k -> fib(k - 1) + fib(k - 2));
    }
  fixedMemo: |-
    long fib(int n) {
      if (n < 2) return n;
      Long hit = memo.get(n);
      if (hit != null) return hit;
      long v = fib(n - 1) + fib(n - 2);
      [[memo.put(n, v)]];
      return v;
    }
  cacheable: |-
    @Cacheable("shippingFee")
    public int fee(String region, int weight) {
      return feeApi.call(region, weight);
    }
