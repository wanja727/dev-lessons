sources:
  - '`HashMap.computeIfAbsent`가 함수 안의 수정을 알아채면 `ConcurrentModificationException`을 던진다는 것: API 문서 https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/HashMap.html'
  - '`Map.computeIfAbsent`의 함수가 맵을 고치면 안 된다는 것: API 문서 https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/Map.html'
  - '`ConcurrentHashMap.computeIfAbsent`의 같은 제약: API 문서 https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/concurrent/ConcurrentHashMap.html'
  - '`@Cacheable`: 스프링 문서 https://docs.spring.io/spring-framework/reference/integration/cache/annotations.html'
