predict:
  title: 큰 것부터 고르면?
  text: '코드 predict는 단위를 큰 것부터 골라 6을 만들어요. 단위는 4, 3, 1이에요. 돌려주는 개수는 얼마이고, 그것이 가장 적은 개수일까요? 답은 질문 2에 나와요.'
  code: predict
  label: 내 예측
  options:
    - value: two
      label: 2개이고 가장 적다
    - value: threeBest
      label: 3개이고 가장 적다
    - value: threeNot
      label: 3개이지만 2개로도 만들 수 있다
  answer: threeNot
  storageKey: dp-predict
  wrong: 예측은 "{label}"이었어요. 틀린 예측이 더 오래 남으니 괜찮아요.
questions:
  - id: q1
    title: 그리디는 어떻게 답을 고르나요?
    conclusion:
      lead: '단계마다 지금 가장 좋아 보이는 것 하나를 고르고, 고른 것을 다시 돌아보지 않아요.'
      sub: '그래서 아주 빨라요. 우리 동전의 거스름돈이나 끝나는 시각이 이른 회의부터 고르는 회의실 배정처럼, 지금의 좋은 선택이 나중을 망치지 않는 문제에서는 이것으로 가장 좋은 답이 나와요.'
    says:
      - '거스름돈 3,760원을 500, 100, 50, 10원으로 준다. 가장 큰 500원을 되는 만큼(7개) 주고, 남은 260원에 100원(2개), 50원(1개), 10원(1개). 11개다. 코드 predict의 함수에 우리 동전 단위를 넣어 돌린 결과다'
      - '이것이 가장 적은 개수인 이유. 우리 동전은 큰 단위가 작은 단위의 배수다(500은 100의 5배, 100은 50의 2배). 작은 동전 여러 개로 낸 금액은 언제나 큰 동전으로 바꿔 개수를 줄일 수 있다. 그러니 큰 것을 될 수 있는 만큼 쓰는 것이 손해가 아니다'
      - '회의실 배정(코드 meetings). 회의실 하나에 겹치지 않게 가장 많은 회의를 넣는다. 끝나는 시각이 이른 회의부터 고른다. 일찍 끝날수록 남은 시간이 많아 나머지 회의를 넣을 자리가 가장 넓게 남는다. 예제 회의 여섯 개로 고른 회의 넷을 보인다'
      - '비용. 거스름돈은 단위 수만큼, 회의실은 정렬 O(n log n)에 한 번 훑기 O(n)이다'
      - '그리디의 모양: 정렬하거나 가장 좋은 것을 고르는 기준을 정하고, 한 번 지나가며 고른다'
    asks:
      - '본문의 예시: 우리 동전 단위로 1,280원을 그리디로 거슬러 주면 동전은 모두 몇 개인가 (8개. 500원 2개, 100원 2개, 50원 1개, 10원 3개)'
      - '옮긴 상황: 회의 (1~4시), (3~5시), (0~6시), (5~7시), (8~9시), (5~9시)를 회의실 하나에 겹치지 않게 넣는다. 끝나는 시각이 이른 것부터 고르면 몇 개가 들어가나 (3개. 1~4시, 5~7시, 8~9시)'
    body:
      - p: '**그리디**는 단계마다 지금 가장 좋아 보이는 것 하나를 고르고, 고른 것은 다시 돌아보지 않는 방법이에요. 거스름돈이라면 "가장 큰 동전을 될 수 있는 만큼"이에요. 코드 predict의 `greedy`에 우리 동전 단위를 넣어 봤어요.'
      - ci:
          key: won
          label: 실제 결과 보기
          source: GreedyAndDpTest.greedyCounts
          code: wonRun
      - p: '3,760원은 500원 7개, 100원 2개, 50원 1개, 10원 1개로 11개예요. 이것이 정말 가장 적은 개수일까요? 우리 동전은 **큰 단위가 작은 단위의 배수**예요. 500은 100의 5배, 100은 50의 2배, 50은 10의 5배예요. 작은 동전 여러 개로 낸 금액은 언제나 큰 동전 하나로 바꿔 개수를 줄일 수 있어요. 그러니 큰 동전을 될 수 있는 만큼 쓰는 것이 손해가 아니에요. 10원부터 1,000원까지 모든 금액에서 가장 적은 개수와 같은 것도 테스트로 확인했어요(질문 2).'
      - h3: 회의실 배정
      - p: '회의실 하나에 겹치지 않게 회의를 가장 많이 넣어요. **끝나는 시각이 이른 회의부터** 골라요.'
      - code: meetings
        notes:
          - mark: Meeting::end
            as: code
            text: '끝나는 시각으로 정렬해요. 일찍 끝나는 회의를 고를수록 남은 시간이 가장 넓게 남아서, 나머지 회의를 넣을 자리를 해치지 않아요.'
      - ci:
          key: meetings
          label: 실제로 고른 회의 보기
          source: GreedyAndDpTest.meetings
      - p: '9~12시처럼 길게 자리를 차지하는 회의를 건너뛰고 넷을 넣었어요. 비용은 정렬 O(n log n)과 한 번 훑기 O(n)이에요. 거스름돈은 단위 수만큼만 돌아요. 그리디는 대개 이렇게 **기준을 정해 정렬하고 한 번 지나가며 고르는** 모양이라 빨라요.'
      - quiz:
          q: '우리 동전 단위(500, 100, 50, 10원)로 1,280원을 그리디로 거슬러 주면 동전은 모두 몇 개일까요?'
          options:
            - '6개'
            - '8개'
            - '11개'
          answer: 2
          explain: '500원 2개(1,000원), 100원 2개(200원), 50원 1개, 10원 3개로 8개예요. 테스트로 돌려도 8이었어요.'
      - next: '그리디가 우리 동전에서 맞은 근거는 "큰 단위가 작은 단위의 배수"였어요. 그 근거가 없으면 어떻게 될까요?'
    recall: '단계마다 지금 가장 좋아 보이는 것 하나를 고르고 다시 돌아보지 않아요. 우리 동전은 큰 단위가 작은 단위의 배수라 큰 동전을 될 수 있는 만큼 쓰는 것이 손해가 아니고, 회의실은 끝나는 시각이 이른 회의부터 고르면 남은 자리가 가장 넓어요. 정렬 한 번과 한 번 훑기로 끝나서 빨라요.'
  - id: q2
    title: 그리디가 틀리는 경우는 언제인가요?
    conclusion:
      lead: '지금 가장 좋아 보이는 선택이 남은 문제를 더 나쁘게 만들 때예요. 단위가 1, 3, 4일 때 6을 만들면 그리디는 3개를 고르지만 답은 3 두 개, 2개예요.'
      sub: '그래서 그리디는 맞는다는 근거가 있을 때만 써요. 몇 가지 예에서 맞았다고 늘 맞는 것은 아니고, 반례 하나면 틀린 방법이에요.'
    says:
      - '예측의 답을 밝힌다. 4를 고르면 남은 2는 1 두 개로만 채운다. 4를 고른 순간 3을 두 번 쓰는 길이 막혔다. 지금의 좋은 선택이 나중의 더 좋은 선택을 막는다'
      - '단위 1, 3, 4는 큰 단위가 작은 단위의 배수가 아니다. 질문 1의 근거가 없다'
      - '맞는지 확인하는 방법. 가장 적은 개수와 그리디를 금액 1부터 100까지 견주어 처음 다른 금액을 찾는다. 단위 1, 3, 4에서는 6이 처음이다. 우리 동전 단위로는 10원부터 1,000원까지 다른 금액이 없다. 반례 찾기를 테스트로 보인다. 금액이 큰 쪽은 완전 탐색이 너무 느려서, 질문 3의 표로 구한 가장 적은 개수와 견줬다'
      - '코드 bruteForce는 늘 맞지만 느리다. 금액이 1 늘 때마다 단위 수만큼 갈래가 나뉘어 호출이 지수로 는다. 금액 20, 30에서의 호출 수를 센다(2만 736번, 255만 408번). K5의 피보나치와 같은 모양이다'
    asks:
      - '본문의 예시: 단위가 1, 3, 4일 때 그리디로 8을 만들면 몇 개이고, 가장 적은 개수와 같은가 (2개. 4 두 개. 같다)'
      - '옮긴 상황: 동전 단위가 1, 5, 6원인 나라에서 10원을 그리디로 거슬러 주면 몇 개이고, 가장 적은 개수는 몇 개인가 (5개(6, 1, 1, 1, 1), 2개(5, 5))'
    body:
      - p: '처음 예측의 답은 **3개이지만 2개로도 만들 수 있다**예요. {{predict-result}}'
      - ci:
          key: predict
          label: 실제 결과 보기
          source: GreedyAndDpTest.greedyCounts
          code: predict
      - p: '그리디는 가장 큰 4를 먼저 골라요. 남은 2는 1 두 개로만 채울 수 있어 3개예요. 하지만 3 두 개면 2개예요. **4를 고른 순간 3을 두 번 쓰는 길이 막혔어요.** 지금 좋아 보이는 선택이 나중의 더 좋은 선택을 막았어요.'
      - p: '단위 1, 3, 4는 4가 3의 배수가 아니에요. 질문 1에서 그리디가 맞았던 근거가 여기에는 없어요.'
      - h3: 반례를 찾아 확인해요
      - p: '그리디가 맞는지 보려면 증명하거나 **반례를 찾아요.** 모든 경우를 다 해 보는 코드는 늘 맞는 답을 줘요.'
      - code: bruteForce
        notes:
          - mark: best(units, amount - u)
            as: code
            text: '단위마다 하나를 쓰고 남은 금액을 다시 풀어 봐요. 모든 갈래를 다 보니 늘 가장 적은 개수가 나와요.'
      - p: '금액 1부터 100까지 그리디와 가장 적은 개수를 견줬어요.'
      - ci:
          key: counter
          label: 실제로 찾은 반례 보기
          source: GreedyAndDpTest.counterExample
          code: counterRun
      - p: '단위 1, 3, 4에서는 1부터 5까지 맞다가 6에서 처음 틀렸어요. **몇 개의 예에서 맞았다고 늘 맞는 것은 아니에요.** 반례 하나면 틀린 방법이에요. 우리 동전은 1,000원까지 한 번도 다르지 않았어요.'
      - h3: 다 해 보면 늘 맞지만 느려요
      - p: '코드 bruteForce는 금액이 1 늘 때마다 단위 수만큼 갈래가 나뉘어요. 호출이 지수로 늘어요.'
      - ci:
          key: cost
          label: 실제로 센 호출 수 보기
          source: GreedyAndDpTest.costs
          code: costRun
      - p: '금액 20에서 2만 번, 30에서 255만 번이에요. 금액이 10 늘 때 100배 넘게 늘었어요. 재귀 레슨의 피보나치와 같은 모양이에요. 표로 푼 줄(칸 계산 90번)은 질문 3에서 봐요.'
      - quiz:
          q: '동전 단위가 1, 5, 6원인 나라에서 10원을 그리디로 거슬러 주면 몇 개일까요?'
          options:
            - '2개. 가장 적다'
            - '5개. 가장 적은 개수는 2개다'
            - '5개. 가장 적다'
          answer: 2
          explain: '그리디는 6을 먼저 골라 남은 4를 1 네 개로 채워 5개예요. 5 두 개면 2개예요. 6이 5의 배수가 아니라 그리디의 근거가 없어요.'
      - next: '다 해 보면 맞지만 느렸어요. 같은 금액을 여러 번 푸는 것이 문제라면, 한 번만 풀면 어떨까요?'
    recall: '지금 가장 좋아 보이는 선택이 남은 문제를 더 나쁘게 만들 때 틀려요. 단위 1, 3, 4로 6을 만들면 그리디는 4를 먼저 골라 3개지만, 3 두 개면 2개예요. 단위가 서로 배수가 아니라 근거가 없어요. 그리디는 증명하거나 반례를 찾아 확인하고, 모든 경우를 다 해 보는 방법은 늘 맞지만 호출이 지수로 늘어요.'
  - id: q3
    title: 동적 계획법은 어떻게 같은 계산을 다시 하지 않나요?
    conclusion:
      lead: '큰 문제의 답을 작은 문제의 답으로 나타내는 식을 세우고, 작은 문제의 답을 한 번씩만 계산해 저장해 두고 꺼내 써요.'
      sub: '거스름돈에서는 "금액 m의 최소 개수 = 단위 c마다 (m - c의 최소 개수 + 1) 가운데 가장 작은 것"이에요. 0원부터 목표 금액까지 표를 한 칸씩 채우면 O(금액 × 단위 수)에 끝나요.'
    says:
      - '코드 bruteForce가 느린 이유는 같은 금액을 여러 번 풀기 때문이다. 6을 풀 때 2는 6-4에서도, 6-3-1에서도, 6-1-1-1-1에서도 다시 푼다. 금액 m의 답은 금액이 같으면 늘 같다. 한 번 풀어 저장하면 된다'
      - '점화식. `best(m) = min(best(m - c) + 1)`, c는 m 이하인 단위. 끝나는 조건은 `best(0) = 0`이다. 큰 금액의 답이 작은 금액의 답으로 정해진다'
      - '위에서 아래로. 코드 bruteForce에 저장할 배열을 더하면 K5의 `fibMemo`와 같은 메모이제이션이다. 재귀는 그대로 두고 계산한 금액을 다시 풀지 않는다'
      - '아래에서 위로. 코드 table. 0원부터 목표 금액까지 차례로 채운다. m을 채울 때 필요한 `dp[m - c]`는 이미 채워져 있다. 재귀가 없어 큰 금액에서도 스택 걱정이 없다. 단위 1, 3, 4로 0~6의 표를 그려 보인다: 0, 1, 2, 1, 1, 2, 2'
      - '비용. 칸이 금액 + 1개이고 칸마다 단위 수만큼 본다. 금액 1만, 단위 3개면 3만 번이다. 코드 bruteForce의 호출 수와 나란히 센 값을 보인다'
      - '답이 몇 개인지만 아니라 무엇을 골랐는지도 필요하면, 칸마다 마지막에 고른 단위를 함께 저장하고 뒤에서부터 따라간다'
    widget:
      kind: steps
      note: '단위 1, 3, 4로 금액 0~6의 표를 한 칸씩 채운다. 단계마다 지금 채우는 칸 m을 강조하고, 후보 `dp[m - 1] + 1`, `dp[m - 3] + 1`, `dp[m - 4] + 1`을 화살표로 이은 칸에서 보인 뒤 가장 작은 값을 적는다. 마지막 칸 6에서 후보 3(6-1), 2(6-3), 3(6-4) 가운데 2가 골라지는 것을 본다'
    asks:
      - '본문의 예시: 코드 table에서 단위가 1, 3, 4일 때 `dp[7]`은 얼마인가 (2. 3과 4)'
      - '옮긴 상황: 계단을 한 번에 1칸이나 2칸 오른다. n칸을 오르는 방법의 수 `ways(n)`을 작은 문제로 나타내는 식은 무엇인가 (`ways(n) = ways(n - 1) + ways(n - 2)`. 마지막 걸음이 1칸이거나 2칸이다)'
    body:
      - p: '코드 bruteForce가 느린 이유는 **같은 금액을 여러 번 풀기** 때문이에요. 6을 풀면 2를 6-4에서도, 6-3-1에서도, 6-1-1-1-1에서도 다시 풀어요. 그런데 금액 2의 답은 어디서 물어도 같아요. 한 번만 풀어 저장해 두면 돼요. 이것이 **동적 계획법**이에요.'
      - h3: 큰 답을 작은 답으로 나타내요
      - p: '먼저 큰 문제의 답을 작은 문제의 답으로 나타내는 식, **점화식**을 세워요. 금액 m을 만드는 마지막 동전이 c라면, 나머지 m - c를 가장 적게 만들고 1개를 더한 것이에요. 마지막 동전이 무엇이든 될 수 있으니 그 가운데 가장 작은 것을 골라요.'
      - code: recurrence
      - p: '이 식을 그대로 재귀로 쓴 것이 코드 bruteForce였어요. 같은 금액을 다시 풀지 않게 하는 방법은 둘이에요.'
      - ul:
          - '**위에서 아래로(메모이제이션):** 재귀는 그대로 두고, 계산한 금액의 답을 배열에 저장해 다음에는 꺼내 써요. 재귀 레슨의 `fibMemo`와 같아요.'
          - '**아래에서 위로(표 채우기):** 0원부터 목표 금액까지 작은 것부터 차례로 표를 채워요.'
      - code: memoBest
      - h3: 작은 금액부터 표를 채워요
      - code: table
        notes:
          - mark: dp[m - u] + 1
            as: code
            text: 'm을 채울 때 필요한 `dp[m - u]`는 m보다 작은 칸이라 이미 채워져 있어요. 재귀가 없어서 금액이 커도 호출 스택 걱정이 없어요.'
      - p: '단위 1, 3, 4로 표를 한 칸씩 채워 보세요.'
      - widget:
          kind: steps
          layout: [duo, log, buttons, verdict]
          initial:
            duo:
              - {label: '표 dp[0..6]', state: dim, text: 'dp[0] = 0, 나머지는 비어 있음'}
              - {label: 지금 칸의 후보, state: dim, text: 아직 없음}
          scenarios:
            default:
              - log: 'm = 1: 쓸 수 있는 단위는 1뿐. dp[0] + 1 = 1'
                duo:
                  - label: '표 dp[0..6]'
                    rows: [{k: 칸, v: '0, 1, _, _, _, _, _', mark: changed}]
                  - label: 지금 칸의 후보
                    rows: [{k: '1을 쓰면', v: 'dp[0] + 1 = 1'}]
              - log: 'm = 2: 1을 쓰면 dp[1] + 1 = 2'
                duo:
                  - label: '표 dp[0..6]'
                    rows: [{k: 칸, v: '0, 1, 2, _, _, _, _', mark: changed}]
                  - label: 지금 칸의 후보
                    rows: [{k: '1을 쓰면', v: 'dp[1] + 1 = 2'}]
              - log: 'm = 3: 후보 dp[2] + 1 = 3, dp[0] + 1 = 1. 가장 작은 1'
                duo:
                  - label: '표 dp[0..6]'
                    rows: [{k: 칸, v: '0, 1, 2, 1, _, _, _', mark: changed}]
                  - label: 지금 칸의 후보
                    rows: [{k: '1을 쓰면', v: 'dp[2] + 1 = 3'}, {k: '3을 쓰면', v: 'dp[0] + 1 = 1', mark: changed}]
              - log: 'm = 4: 후보 dp[3] + 1 = 2, dp[1] + 1 = 2, dp[0] + 1 = 1. 가장 작은 1'
                duo:
                  - label: '표 dp[0..6]'
                    rows: [{k: 칸, v: '0, 1, 2, 1, 1, _, _', mark: changed}]
                  - label: 지금 칸의 후보
                    rows: [{k: '1을 쓰면', v: 'dp[3] + 1 = 2'}, {k: '3을 쓰면', v: 'dp[1] + 1 = 2'}, {k: '4를 쓰면', v: 'dp[0] + 1 = 1', mark: changed}]
              - log: 'm = 5: 후보 dp[4] + 1 = 2, dp[2] + 1 = 3, dp[1] + 1 = 2. 가장 작은 2'
                duo:
                  - label: '표 dp[0..6]'
                    rows: [{k: 칸, v: '0, 1, 2, 1, 1, 2, _', mark: changed}]
                  - label: 지금 칸의 후보
                    rows: [{k: '1을 쓰면', v: 'dp[4] + 1 = 2', mark: changed}, {k: '3을 쓰면', v: 'dp[2] + 1 = 3'}, {k: '4를 쓰면', v: 'dp[1] + 1 = 2'}]
              - log: 'm = 6: 후보 dp[5] + 1 = 3, dp[3] + 1 = 2, dp[2] + 1 = 3. 가장 작은 2'
                duo:
                  - label: '표 dp[0..6]'
                    rows: [{k: 칸, v: '0, 1, 2, 1, 1, 2, 2', mark: changed}]
                  - label: 지금 칸의 후보
                    rows: [{k: '1을 쓰면', v: 'dp[5] + 1 = 3'}, {k: '3을 쓰면', v: 'dp[3] + 1 = 2', mark: changed}, {k: '4를 쓰면', v: 'dp[2] + 1 = 3', mark: bad}]
                verdict: '6은 2개예요. 그리디가 고른 "4를 쓰면"은 3이라 후보에서 졌어요. 표는 모든 마지막 동전을 견줘서 그리디가 놓친 3 두 개를 찾았어요.'
      - ci:
          key: table
          label: 테스트가 채운 실제 표 보기
          source: GreedyAndDpTest.tableValues
      - h3: 한 번씩만 계산해요
      - p: '칸이 금액 + 1개이고 칸마다 단위 수만큼 봐요. 비용은 **O(금액 × 단위 수)**예요. 질문 2에서 센 값과 나란히 보면, 금액 30에서 완전 탐색은 255만 번 불렸고 표는 90번 계산했어요. 금액 1만도 3만 번이에요.'
      - p: '몇 개인지만이 아니라 무엇을 골랐는지도 필요하면, 칸마다 "마지막에 쓴 단위"를 함께 저장해 두고 목표 금액에서부터 거꾸로 따라가요. 6은 3을 썼고, 남은 3도 3을 썼어요.'
      - quiz:
          q: '코드 table에서 단위가 1, 3, 4일 때 `dp[7]`은 얼마일까요?'
          options:
            - '1'
            - '2'
            - '3'
          answer: 2
          explain: '후보는 `dp[6] + 1 = 3`, `dp[4] + 1 = 2`, `dp[3] + 1 = 2`예요. 가장 작은 2, 곧 3과 4 하나씩이에요. 테스트의 표도 2였어요.'
      - next: '거스름돈은 표로 풀렸어요. 그러면 어떤 문제든 표로 풀 수 있을까요? 그리디로 충분한 문제는 어떻게 알아볼까요?'
    recall: '큰 문제의 답을 작은 문제의 답으로 나타내는 점화식을 세우고, 작은 문제의 답을 한 번씩만 계산해 저장해 두고 꺼내 써요. 거스름돈은 `best(m) = min(best(m - c) + 1)`이에요. 재귀에 저장을 더하는 위에서 아래로, 0원부터 표를 채우는 아래에서 위로가 있고, 표는 재귀 깊이 걱정이 없어요. 비용은 O(금액 × 단위 수)라 금액 30에서 255만 번이 90번이 됐어요.'
  - id: q4
    title: 어떤 문제에 그리디를, 어떤 문제에 동적 계획법을 쓰나요?
    conclusion:
      lead: '지금의 선택이 남은 문제를 망치지 않는다는 근거가 있으면 그리디를, 그렇지 않지만 같은 부분 문제가 되풀이되면 동적 계획법을 써요.'
      sub: '동적 계획법이 통하려면 두 가지가 필요해요. 같은 부분 문제가 여러 번 나와야 하고, 큰 문제의 가장 좋은 답이 작은 문제의 가장 좋은 답으로 이루어져야 해요.'
    says:
      - '겹치는 부분 문제. 거스름돈은 같은 금액이 여러 갈래에서 다시 나온다. 피보나치도 그렇다. 병합 정렬(K6)은 나눈 두 절반이 겹치지 않아 저장해도 다시 쓸 일이 없다. 나눠서 푸는 것이지 동적 계획법이 아니다'
      - '최적 부분 구조. 6을 2개로 만드는 가장 좋은 답에서 3 하나를 빼면 3을 만드는 가장 좋은 답(1개)이 남는다. 큰 답 안에 작은 답이 들어 있다. 이것이 점화식을 세울 수 있는 이유다'
      - '그리디는 여기에 하나를 더 요구한다. 가장 좋은 답이 지금 가장 좋아 보이는 선택을 언제나 포함해야 한다. 우리 동전과 회의실 배정은 그렇고, 단위 1, 3, 4는 아니다'
      - '고르는 순서. 그리디의 근거가 있는지 먼저 본다. 없으면 점화식을 세운다. 둘 다 안 되면 모든 경우를 보되 줄일 수 있는지 본다'
      - '더 알아보기: 무게 한도가 있는 가방에 값이 가장 크게 물건을 담는 문제(배낭 문제). 물건을 쪼갤 수 있으면 무게당 값이 큰 것부터 담는 그리디가 맞다. 쪼갤 수 없으면 그리디가 틀리는 반례가 있고 동적 계획법으로 푼다'
    asks:
      - '본문의 예시: 동전 단위 1, 3, 4로 금액을 만드는 문제에서 그리디가 아니라 동적 계획법을 써야 하는 이유는 무엇인가 (가장 좋은 답이 가장 큰 단위를 고르는 선택을 늘 포함하지 않는다. 6에서 4를 고르면 틀린다)'
      - '옮긴 상황: 정수 배열을 병합 정렬로 정렬할 때 나눈 절반의 결과를 표에 저장해 두면 빨라지나 (아니다. 두 절반이 겹치지 않아 같은 부분 문제가 다시 나오지 않는다)'
      - '실무 구역: 코드 computeMemo로 `fib(30)`을 부르면 어떻게 되나 (자바 9부터 `ConcurrentModificationException`. `computeIfAbsent`의 함수 안에서 같은 맵에 값을 넣는다)'
    body:
      - p: '동적 계획법이 통하려면 두 가지가 있어야 해요.'
      - ul:
          - '**겹치는 부분 문제:** 같은 작은 문제가 여러 번 나와요. 거스름돈은 같은 금액이 여러 갈래에서 다시 나오고, 피보나치도 그래요. 그래야 저장해 둔 답을 다시 쓸 일이 생겨요.'
          - '**최적 부분 구조:** 큰 문제의 가장 좋은 답 안에 작은 문제의 가장 좋은 답이 들어 있어요. 6을 2개(3, 3)로 만드는 답에서 3 하나를 빼면, 3을 1개로 만드는 가장 좋은 답이 남아요. 그래서 점화식을 세울 수 있어요.'
      - p: '나눠서 푼다고 다 동적 계획법은 아니에요. 병합 정렬(정렬 레슨)은 배열을 둘로 나눠 각각 정렬하는데, **두 절반이 겹치지 않아요.** 같은 부분 문제가 다시 나오지 않으니 저장해 둬도 다시 쓸 일이 없어요.'
      - h3: 그리디는 하나를 더 요구해요
      - p: '그리디는 여기에 한 가지가 더 있어야 해요. **가장 좋은 답이 지금 가장 좋아 보이는 선택을 언제나 포함해야 해요.** 우리 동전에서는 가장 큰 동전을 쓰는 답이 언제나 가장 좋은 답 가운데 있고, 회의실에서는 가장 일찍 끝나는 회의를 넣는 답이 언제나 있어요. 단위 1, 3, 4로 6을 만들 때는 가장 큰 4를 쓴 답이 가장 좋은 답이 아니었어요.'
      - table:
          head: [물어볼 것, 그렇다면]
          rows:
            - ['지금 가장 좋은 선택이 남은 문제를 망치지 않는다는 근거가 있나', '그리디. 빠르다']
            - ['근거는 없지만 같은 부분 문제가 되풀이되고 점화식을 세울 수 있나', '동적 계획법']
            - ['둘 다 아니다', '모든 경우를 보되 줄일 방법을 찾는다']
      - more:
          summary: '더 알아보기: 배낭 문제'
          body:
            - p: '무게 한도가 있는 가방에 값이 가장 크게 물건을 담는 문제예요. 물건을 **쪼갤 수 있으면**(가루, 액체) 무게당 값이 큰 것부터 담는 그리디가 맞아요. 쪼갤 수 **없으면** 무게당 값이 큰 물건을 먼저 담는 바람에 가방에 빈자리가 남아 손해를 보는 반례가 있어서, 무게를 칸으로 하는 표로 동적 계획법을 써요.'
      - quiz:
          q: '정수 배열을 병합 정렬할 때, 나눈 절반의 정렬 결과를 표에 저장해 두면 빨라질까요?'
          options:
            - '빨라진다. 동적 계획법이 된다'
            - '빨라지지 않는다. 두 절반이 겹치지 않아 같은 부분 문제가 다시 나오지 않는다'
            - '빨라지지 않는다. 정렬은 그리디라서'
          answer: 2
          explain: '동적 계획법은 같은 부분 문제가 여러 번 나와야 저장한 답을 다시 써요. 병합 정렬의 두 절반은 겹치지 않아서 저장해 둬도 다시 꺼낼 일이 없어요.'
    recall: '지금의 선택이 남은 문제를 망치지 않는다는 근거가 있으면 그리디를, 근거는 없지만 같은 부분 문제가 되풀이되고 점화식을 세울 수 있으면 동적 계획법을 써요. 동적 계획법에는 겹치는 부분 문제와 최적 부분 구조가 필요하고, 그리디는 가장 좋은 답이 지금의 가장 좋은 선택을 늘 포함해야 해요. 병합 정렬은 부분 문제가 겹치지 않아 동적 계획법이 아니에요.'
practice:
  title: 실무에서는 이렇게 만나요
  says:
    - '서비스 코드에서 이 생각을 가장 많이 쓰는 곳은 캐시다. 같은 인자로 같은 결과가 나오는 비싼 계산(외부 API 조회, 무거운 집계)의 결과를 저장해 두고 다시 쓴다. 스프링의 `@Cacheable`이 메서드 단위의 메모이제이션이다. 바뀌는 데이터를 언제 지울지는 캐시 전략과 무효화(A4)에서 다룬다'
    - '흔한 실수: 메모이제이션을 짧게 쓰려고 코드 computeMemo처럼 `HashMap.computeIfAbsent`에 재귀를 넣는다. 함수 안에서 `fib(k - 1)`이 같은 맵에 값을 넣는다. `computeIfAbsent`는 함수가 맵을 고치는 것을 허용하지 않고, 자바 9부터 `HashMap`은 이것을 알아채 `ConcurrentModificationException`을 던진다. n이 2면 함수 안에서 맵을 고치지 않아 지나가고, 3부터 터진다. 고친 코드: 코드 fixedMemo처럼 `get`으로 보고, 계산하고, `put`한다. 또는 코드 table처럼 아래에서 위로 채운다. 세 코드의 결과를 테스트로 남긴다'
    - '`ConcurrentHashMap.computeIfAbsent`에 같은 일을 하면 예외 대신 멈춰 버리거나 `IllegalStateException`을 던질 수 있다. 어느 맵이든 `compute` 계열 함수 안에서 같은 맵을 고치지 않는다 (자바 API 문서 근거)'
  body:
    - h3: 같은 계산을 다시 하지 않기는 캐시예요
    - p: '서비스 코드에서 이 생각을 가장 많이 쓰는 곳은 **캐시**예요. 같은 인자면 같은 결과가 나오는 비싼 계산, 예를 들어 외부 배송비 API 조회의 결과를 저장해 두고 다시 써요. 스프링의 `@Cacheable`이 메서드 단위의 메모이제이션이에요([스프링 문서](link:cacheable)).'
    - code: cacheable
    - p: '다만 서비스의 데이터는 바뀌어요. 금액 m의 최소 개수는 영원히 같지만 배송비는 내일 바뀔 수 있어요. 언제 지울지는 캐시 전략과 무효화 레슨에서 다뤄요.'
    - h3: '흔한 실수: computeIfAbsent 안의 재귀'
    - p: '메모이제이션을 한 줄로 쓰고 싶어서 `computeIfAbsent`에 재귀를 넣었어요.'
    - code: computeMemo
      notes:
        - mark: computeIfAbsent
          as: code
          text: '없을 때만 함수를 불러 값을 넣어요. 그런데 함수 안의 `fib(k - 1)`이 다시 `computeIfAbsent`를 불러 **같은 맵에 값을 넣어요.**'
    - ci:
        key: compute
        label: 세 코드의 실제 결과 보기
        source: GreedyAndDpTest.computeIfAbsentMemo
    - p: '`ConcurrentModificationException`이에요. [Map API 문서](link:map)는 이 함수 안에서 맵을 고치지 말라고 적고, [HashMap API 문서](link:hashMap)는 그것을 알아채면 이 예외를 던진다고 적어요. 자바 9부터 그렇게 바뀌었어요. `fib(2)`는 함수 안에서 `fib(1)`, `fib(0)`만 불러 맵을 고치지 않으니 지나가고, `fib(3)`부터 터져요. 작은 값으로만 시험하면 놓치기 쉬워요.'
    - code: fixedMemo
      notes:
        - mark: memo.put(n, v)
          as: code
          text: '`get`으로 보고, 없으면 계산하고, 그다음에 `put`해요. 맵을 고치는 것이 다른 맵 호출 안이 아니라서 괜찮아요. 질문 3의 표처럼 아래에서 위로 채워도 돼요.'
    - muted: '`ConcurrentHashMap.computeIfAbsent`에 같은 일을 하면 예외 대신 멈춰 버리거나 `IllegalStateException`을 던질 수 있어요([ConcurrentHashMap API 문서](link:chm)). 어느 맵이든 `compute` 계열 함수 안에서 같은 맵을 고치지 않아요. 이것은 문서가 근거이고 테스트로 돌리지 않았어요.'
interview:
  question: 그리디와 동적 계획법은 어떻게 다르고, 각각 언제 쓰나요?
  model:
    - label: 정의
      text: 그리디는 단계마다 지금 가장 좋아 보이는 것을 고르고 다시 돌아보지 않는 방법이고, 동적 계획법은 큰 문제의 답을 작은 문제의 답으로 나타내는 점화식을 세워 작은 문제의 답을 한 번씩만 계산해 저장하고 다시 쓰는 방법입니다.
    - label: 원리
      text: 그리디는 가장 좋은 답이 지금의 가장 좋은 선택을 늘 포함할 때만 맞습니다. 우리 동전처럼 단위가 서로 배수면 맞지만, 단위가 1, 3, 4일 때 6은 그리디가 3개, 답이 2개입니다. 동적 계획법은 겹치는 부분 문제와 최적 부분 구조가 있을 때 쓰고, 거스름돈은 O(금액 × 단위 수)로 풉니다.
    - label: 주의할 점
      text: 그리디는 몇 개의 예가 아니라 증명이나 반례 찾기로 확인합니다. 메모이제이션을 HashMap.computeIfAbsent 안의 재귀로 쓰면 자바 9부터 ConcurrentModificationException이 나니 get과 put으로 쓰거나 아래에서 위로 표를 채웁니다.
    - label: 경험
      text: '(내 프로젝트로 채우기) 예: 포인트 상품권 단위가 바뀐 뒤 큰 것부터 고르던 지급 로직이 장수를 더 쓰는 것을 발견해 표로 푸는 방식으로 바꿨습니다.'
