# 스프링 배치 (설계서)
# 자료 파일의 칸은 docs/lesson-data-format.md에 있다.
# 예전 레슨 site/src/pages/lessons/spring-batch.astro와 batch/SpringBatchTest를 재료로 다시 쓴다.
stage: design
title: 스프링 배치
unit: 스프링
roadmap: S15
type: 동작 확인
prerequisites:
  - {slug: tx-propagation, title: 트랜잭션 전파와 롤백 규칙}
assume: '자바 21, 스프링 부트 3.5(스프링 배치 5.2), PostgreSQL 16. 트랜잭션은 커밋 단위로 함께 성공하고 함께 실패한다는 것(트랜잭션 기초, 트랜잭션 전파와 롤백 규칙 레슨). 대량 데이터를 한 번에 읽지 않고 나눠 읽는다는 것(DB 과정)은 알면 좋아요.'
example: '거래처에서 받은 주문 25건(실무에서는 수십만 건)을 읽어 검증하고 주문 테이블에 저장하는 가져오기 Job. 청크 크기 10으로 돌리다 17번째에서 실패하고, 다시 시작한다.'
intro:
  - '밤마다 거래처 주문 30만 건을 가져오는 작업이 있어요. 한 트랜잭션으로 돌렸더니 29만 번째에서 실패해 전부 롤백되고, 다시 처음부터 돌려야 해요. 건마다 커밋했더니 이번에는 너무 느리고, 실패한 곳에서 이어 가려면 어디까지 했는지 직접 적어 둬야 해요.'
  - '스프링 배치는 대량 처리를 읽기, 처리, 쓰기로 나누고, 정한 개수(청크)마다 커밋하며, 어디까지 커밋했는지 메타데이터 테이블에 남겨 실패한 곳부터 다시 시작하게 해 주는 도구예요. 정산, 집계, 데이터 이관처럼 사용자의 요청과 상관없이 도는 일을 맡는 백엔드 개발자가 써요.'
  - '이 레슨에서는 청크 크기 10으로 25건을 돌려 쓰기가 몇 번 불리는지 세고, 중간에 실패시킨 뒤 같은 파라미터로 다시 시작해 어디부터 읽는지 확인해요.'
covers:
  - topic: 'Job, Step, 청크 지향 처리: `ItemReader`, `ItemProcessor`, `ItemWriter`'
    where: '질문 1'
  - topic: '청크 크기만큼 읽고 처리한 뒤 한 번에 쓰고 커밋한다. 청크 하나가 트랜잭션 하나다'
    where: '질문 1'
  - topic: '실패하면 실패한 청크만 롤백되고 앞의 청크는 커밋되어 남는다'
    where: '질문 2'
  - topic: '`JobRepository`가 메타데이터 테이블(`BATCH_JOB_INSTANCE`, `BATCH_JOB_EXECUTION`, `BATCH_STEP_EXECUTION`)에 진행 상황을 남긴다. 같은 파라미터의 실패한 `JobInstance`를 다시 실행하면 마지막 커밋 지점 다음부터 읽는다'
    where: '질문 2'
  - topic: '완료된 `JobInstance`는 같은 파라미터로 다시 실행할 수 없다. 날짜 같은 파라미터로 구분한다'
    where: '질문 3'
  - topic: 'skip과 retry: 잘못된 데이터는 건너뛰고(`skipLimit`), 일시적 오류는 다시 시도한다'
    where: '질문 3'
  - topic: '청크 크기를 고르는 기준: 클수록 커밋이 적어 빠르지만 실패 때 다시 하는 양과 메모리가 커진다'
    where: '실무에서는'
  - topic: '`spring.batch.job.enabled`, 스케줄러(cron)로 띄우기'
    where: '실무에서는'
  - topic: '대량 DML을 나눠서 하는 원리'
    where: '다루지 않음: 대량 DML 안전하게 하기(D15)'
codes:
  predict: |-
    @Bean
    Step importStep(JobRepository repo,
        PlatformTransactionManager tx) {
      return new StepBuilder("import", repo)
          .<Line, Order>chunk(10, tx)
          .reader(reader())
          .processor(processor())
          .writer(writer())
          .build();
    }
    // 25건을 읽는다
predict:
  text: '코드 predict의 Step이 25건을 처리해요. writer는 몇 번, 몇 건씩 불릴까요? 보기: 25번 1건씩, 1번 25건, 3번 10건 10건 5건, 2번 10건 15건.'
  answer: '3번, 10건 10건 5건. 청크 크기만큼 모아 한 번에 쓰고 커밋한다. 질문 1에서 밝힌다.'
questions:
  - id: q1
    title: 스프링 배치는 대량 데이터를 어떤 단위로 처리하나요?
    conclusion:
      lead: '청크 단위예요. 청크 크기만큼 읽고 처리한 뒤 한 번에 쓰고, 그 청크를 한 트랜잭션으로 커밋해요.'
      sub: '건마다 커밋하는 것보다 빠르고, 전체를 한 트랜잭션으로 하는 것보다 실패 때 잃는 것이 적어요.'
    says:
      - 'Job, Step, reader, processor, writer의 관계를 그림으로 보인다'
      - '코드 predict를 돌려 writer 호출을 기록한 실제 출력을 보인다(예전 테스트)'
      - '청크마다 트랜잭션이 하나라는 것을 커밋 횟수로 보인다'
    widget:
      kind: steps
      note: '25건을 청크 10으로 처리하는 과정을 한 단계씩: 10건 읽기, 처리, 쓰기, 커밋, 다음 10건, 마지막 5건'
    asks:
      - '본문의 예시: 청크 크기 10으로 25건이면 커밋은 몇 번인가 (3번)'
      - '옮긴 상황: 청크 크기 100으로 1,050건이면 writer는 몇 번 불리고 마지막엔 몇 건인가 (11번, 50건)'
  - id: q2
    title: 중간에 실패하면 어디부터 다시 하나요?
    conclusion:
      lead: '실패한 청크만 롤백되고, 다시 실행하면 마지막으로 커밋한 청크 다음부터 읽어요.'
      sub: '`JobRepository`가 메타데이터 테이블에 어디까지 커밋했는지 남겨 두기 때문이에요.'
    says:
      - '17번째에서 실패시키면 1~10은 남고 11~20은 롤백된다(예전 테스트)'
      - '같은 파라미터로 다시 실행하면 11번부터 읽어 15건만 처리하고 중복 없이 25건이 된다(예전 테스트)'
      - '메타데이터 테이블에서 읽은 수와 커밋한 수를 출력한다'
    asks:
      - '본문의 예시: 청크 10으로 돌다 17번째에서 실패하면 DB에 남는 주문은 몇 건인가 (10건)'
      - '옮긴 상황: 청크 100, 3,250번째에서 실패한 뒤 같은 파라미터로 다시 실행하면 몇 번째부터 읽나 (3,201번째)'
  - id: q3
    title: 잘못된 데이터와 이미 끝난 Job은 어떻게 다루나요?
    conclusion:
      lead: '잘못된 데이터는 skip으로 건너뛰고, 이미 완료된 Job은 같은 파라미터로 다시 돌릴 수 없어서 날짜 같은 파라미터로 구분해요.'
      sub: '일시적 오류는 retry로 다시 시도해요.'
    says:
      - 'skip 설정으로 7, 14, 21번을 건너뛰고 22건을 저장하며 Job은 성공한다(예전 테스트)'
      - '완료된 JobInstance를 같은 파라미터로 실행하면 예외(예전 테스트)'
      - '날짜 파라미터로 매일 새 JobInstance를 만든다'
    asks:
      - '본문의 예시: skipLimit 5로 잘못된 데이터 3건이 섞인 25건을 돌리면 몇 건이 저장되고 Job은 성공하나 (22건, 성공)'
      - '옮긴 상황: 어제 성공한 정산 Job을 같은 날짜 파라미터로 다시 실행하면 (실행되지 않는다. 이미 완료된 JobInstance다)'
practice:
  says:
    - '실무 모양: `spring.batch.job.enabled=false`로 두고 스케줄러가 날짜 파라미터를 붙여 띄운다. 청크 크기는 100~1,000 사이에서 재 보고 고른다'
    - '흔한 실수: 전체를 한 트랜잭션으로 돌리다 마지막에 실패해 처음부터 다시 한다. 또는 reader가 전체를 메모리에 올린다'
    - '흔한 실수 둘: 실패한 Job을 파라미터를 바꿔 다시 돌려 처음부터 중복으로 처리한다'
claims:
  - claim: '청크 10으로 25건이면 writer는 10, 10, 5건씩 세 번 불린다'
    how: '예전 테스트'
    test: 'batch/SpringBatchTest'
  - claim: '17번째에서 실패하면 첫 청크는 남고 실패한 청크는 롤백되며, 같은 파라미터로 다시 실행하면 11번부터 읽는다'
    how: '예전 테스트'
    test: 'batch/SpringBatchTest'
  - claim: '완료된 JobInstance는 같은 파라미터로 다시 실행할 수 없고, skip은 잘못된 데이터를 건너뛴다'
    how: '예전 테스트'
    test: 'batch/SpringBatchTest'
  - claim: '메타데이터 테이블의 읽은 수와 커밋 수'
    how: '`BATCH_STEP_EXECUTION`을 조회해 출력한다'
sources:
  - '스프링 배치 문서(청크 지향 처리, 재시작): https://docs.spring.io/spring-batch/reference/step/chunk-oriented-processing.html'
  - '스프링 부트의 배치 설정: https://docs.spring.io/spring-boot/how-to/batch.html'
