# 스택과 큐
# 자료 파일의 칸은 docs/lesson-data-format.md에 있다. 문제는 content/questions/stack-and-queue.yaml에 있다.
title: 스택과 큐
description: 스택과 큐가 꺼내는 순서가 어떻게 다른지, 자바에서는 무엇으로 쓰는지, ArrayDeque는 맨 앞에서 빼도 왜 느려지지 않는지. 세 가지 질문에 스스로 답할 수 있게, 주문 번호를 스택과 큐에 넣고 꺼내며 배우는 대화형 레슨.
unit: 자료구조와 알고리즘
minutes: 20
roadmap: K3
type: 자바 실행
prerequisites:
  - {slug: array-and-linked-list, title: 배열과 연결 리스트}
assume: '자바 21(OpenJDK). `ArrayList`가 안에 배열을 가지고 맨 앞에서 빼면 원소를 모두 당긴다는 것(배열과 연결 리스트 레슨).'
example: '주문 처리 대기열과 화면의 "뒤로 가기" 기록. 같은 순서로 넣은 주문 번호를 스택과 큐에서 꺼내 순서를 비교해요. 실무 구역에서는 스레드 풀의 작업 큐와, 한 `Deque`에 `push`와 `offer`를 섞어 쓴 코드로 옮겨요.'
intro:
  - '주문이 몰리면 서버는 바로 처리하지 못한 주문을 어딘가에 줄 세워 둬요. 먼저 온 주문을 먼저 처리해야 공평해요. 반대로 화면의 "뒤로 가기"는 가장 최근에 본 화면부터 돌아가야 해요. 줄을 세우는 순서가 다를 뿐 둘 다 "넣고 꺼내는" 일이에요.'
  - '자바 개발자는 이 두 순서를 매일 만나요. 메서드 호출이 쌓이는 호출 스택, 스레드 풀이 작업을 쌓아 두는 작업 큐, 톰캣이 연결을 기다리게 하는 대기열이 그래요. 자바에는 `Stack` 클래스가 있지만 지금은 쓰지 말라고 문서에 적혀 있어요. 무엇을 대신 쓰는지 알아야 해요.'
  - '이 레슨에서는 같은 순서로 넣은 값을 스택과 큐에서 꺼내 비교하고, `ArrayDeque`가 맨 앞에서 빼도 원소를 당기지 않는 이유를 들여다봐요.'
covers:
  - topic: '스택은 마지막에 넣은 것을 먼저 꺼낸다(LIFO). 큐는 먼저 넣은 것을 먼저 꺼낸다(FIFO)'
    where: '질문 1'
  - topic: '스택의 쓰임: 메서드 호출 스택, 되돌리기, 괄호 짝 맞추기. 큐의 쓰임: 순서대로 처리할 작업, 너비 우선 탐색'
    where: '질문 1. 호출 스택은 JVM 메모리 구조(J14), 너비 우선 탐색은 그래프와 탐색(K11)'
  - topic: '자바에서 스택과 큐는 Deque 인터페이스로 쓴다. 구현은 보통 ArrayDeque'
    where: '질문 2'
  - topic: 'Stack 클래스는 오래된 것이다. Vector를 상속해 모든 메서드가 동기화되고, 중간 원소를 건드리는 메서드도 열려 있다. API 문서가 Deque를 쓰라고 한다'
    where: '질문 2'
  - topic: 'Deque의 메서드: 스택으로는 push, pop, peek. 큐로는 offer, poll, peek. 앞과 뒤 어느 쪽에서 넣고 빼는지'
    where: '질문 2'
  - topic: '실패할 때 예외를 던지는 메서드(add, remove, element)와 특별한 값을 돌려주는 메서드(offer, poll, peek). 빈 큐에서 poll은 null, remove는 NoSuchElementException'
    where: '질문 2'
  - topic: 'ArrayDeque에는 null을 넣을 수 없다'
    where: '질문 2의 더 알아보기'
  - topic: 'ArrayDeque는 원형 배열이다. 맨 앞의 위치를 기억해 두고 옮기기만 해서, 앞에서 빼도 원소를 당기지 않는다. 양쪽 끝의 넣고 빼기가 O(1)이다'
    where: '질문 3'
  - topic: 'ArrayList.remove(0)으로 큐를 만들면 꺼낼 때마다 O(n)이다'
    where: '질문 3'
  - topic: 'LinkedList도 Deque를 구현하지만 노드마다 객체를 만든다. ArrayDeque가 보통 더 빠르다'
    where: '질문 3'
  - topic: '스레드 풀의 작업 큐, 크기 제한이 없는 큐에 작업이 쌓이면'
    where: '실무에서는. 큐가 찼을 때의 거절과 BlockingQueue는 스레드 풀(C7)'
  - topic: '한 Deque에 push와 offer를 섞으면 순서가 꼬인다'
    where: '실무에서는'
  - topic: '여러 스레드가 함께 쓰는 큐'
    where: '다루지 않음: 스레드 풀(C7), 스레드에 안전한 객체(C6)'
  - topic: '우선순위가 높은 것을 먼저 꺼내는 큐'
    where: '다루지 않음: 힙과 우선순위 큐(K9)'
codes:
  predict: |-
    Deque<Integer> stack = new ArrayDeque<>();
    Deque<Integer> queue = new ArrayDeque<>();
    for (int no = 1; no <= 3; no++) {
      stack.push(no);
      queue.offer(no);
    }
    System.out.println(stack.pop());
    System.out.println(queue.poll());
  brackets: |-
    boolean balanced(String s) {
      Deque<Character> st = new ArrayDeque<>();
      for (char c : s.toCharArray()) {
        if (c == '(') [[st.push(c)]];
        else if (c == ')') {
          if (st.isEmpty()) return false;
          [[st.pop()]];
        }
      }
      return st.isEmpty();
    }
  bracketsRun: |-
    balanced("(())");
    balanced("(()");
    balanced("())");
  emptyRun: |-
    Deque<Integer> d = new ArrayDeque<>();
    d.poll();  d.peek();
    d.pop();   d.remove();
    d.offer(null);
  queueOnly: |-
    [[Queue]]<Order> waiting =
        new ArrayDeque<>();
    waiting.offer(order);
    Order next = waiting.poll();
  listQueue: |-
    List<Integer> q = new ArrayList<>();
    // 꺼낼 때
    int first = [[q.remove(0)]];
  ringRun: |-
    // 안쪽 배열의 길이가 8이 되게 만든다
    Deque<Integer> d = new ArrayDeque<>(7);
    // offer 1~5, poll 두 번,
    // offer 6~8, offer 9
  drainRun: |-
    while (!q.isEmpty()) {
      q.remove(0);  // ArrayList
    }
    while (!d.isEmpty()) {
      d.poll();     // ArrayDeque
    }
  mixed: |-
    Deque<String> history = new ArrayDeque<>();
    history.[[offer]]("홈");
    history.[[offer]]("상품 목록");
    history.[[offer]]("상품 상세");
    // 뒤로 가기
    System.out.println(history.pop());
  mixedFixed: |-
    Deque<String> history = new ArrayDeque<>();
    history.[[push]]("홈");
    history.[[push]]("상품 목록");
    history.[[push]]("상품 상세");
    // 뒤로 가기
    System.out.println(history.pop());
  executor: |-
    ExecutorService pool =
        Executors.[[newFixedThreadPool(4)]];
    pool.submit(() -> sendMail(order));
