  semaphore: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/concurrent/Semaphore.html
  bulkhead: https://resilience4j.readme.io/docs/bulkhead
predict:
  title: 허가 3개, 스레드 10개
  text: '허가 3개인 세마포어 앞에 스레드 10개를 한꺼번에 보내요. 결제 API 호출은 200ms 걸려요. 같은 순간에 결제 API를 부르고 있는 스레드는 최대 몇 개일까요? 답은 질문 3에 나와요.'
  code: predict
  label: 내 예측
  options:
    - value: one
      label: 1개
    - value: three
      label: 3개
    - value: ten
      label: 10개
  answer: three
  storageKey: mutex-semaphore-predict
  wrong: 예측은 "{label}"이었어요. 틀린 예측이 더 오래 남으니 괜찮아요.
questions:
  - id: q1
    title: 뮤텍스는 무엇이고 자바에서는 무엇으로 쓰나요?
    conclusion:
      lead: '한 번에 하나만 임계 영역에 들어가게 하는 락이에요. 잡은 스레드가 주인이고, 주인만 풀 수 있어요.'
      sub: '자바에서는 `synchronized`와 `ReentrantLock`이 뮤텍스예요. `ReentrantLock`은 `lock()`과 `unlock()`을 직접 부르니 `unlock()`을 꼭 `finally`에 둬요.'
    says:
      - '뮤텍스(mutual exclusion)는 "서로 배제"다. 임계 영역(C3)에 한 스레드만 들어가게 한다. C3의 `synchronized`가 자바에 들어 있는 뮤텍스다'
      - '코드 lock. `ReentrantLock`은 같은 일을 객체로 한다. 토큰을 새로 받는 동안 다른 스레드가 같이 받지 않게 막는다. 두 스레드가 10만 번씩 lock 안에서 세면 정확히 20만이다'
      - '`synchronized`는 블록을 벗어나면 자동으로 풀린다. `ReentrantLock`은 직접 `unlock()`을 불러야 하므로 반드시 `finally`에 둔다. 예외가 나서 풀지 못하면 다른 스레드는 영원히 기다린다'
      - '주인: 락을 잡은 스레드만 풀 수 있다. 다른 스레드가 `unlock()`을 부르면 `IllegalMonitorStateException`이다. 테스트로 보인다'
      - '이름의 "재진입(Reentrant)": 잡은 스레드가 다시 `lock()`을 불러도 멈추지 않고, 부른 만큼 `unlock()`해야 풀린다'
    asks:
      - '본문의 예시: 코드 lock에서 `fetchNewToken()`이 예외를 던졌다. `unlock()`이 `finally`에 없다면 다음에 `refreshToken()`을 부르는 스레드는 어떻게 되나 (영원히 기다린다. 락이 풀리지 않았다)'
      - '옮긴 상황: 스레드 A가 `lock.lock()`으로 잡은 락을 스레드 B가 `lock.unlock()`으로 풀려고 한다. 결과는 (`IllegalMonitorStateException`. 주인만 풀 수 있다)'
    body:
      - p: '**뮤텍스**(mutual exclusion, 서로 배제)는 임계 영역에 한 번에 한 스레드만 들어가게 하는 락이에요. 경쟁 상태와 동기화 레슨의 `synchronized`가 자바에 들어 있는 뮤텍스예요. 같은 일을 객체로 하는 것이 `ReentrantLock`이에요.'
      - code: lock
        notes:
          - mark: lock.lock()
            as: code
            text: '락을 잡아요. 다른 스레드가 잡고 있으면 풀릴 때까지 기다려요.'
          - mark: lock.unlock()
            as: code
            text: '꼭 `finally`에서 풀어요. 예외가 나도 풀려야 다음 스레드가 들어와요.'
      - ci:
          key: lock
          label: 두 스레드로 센 실제 결과 보기
          source: MutexSemaphoreTest.lockIsExact
      - p: '`synchronized`는 블록을 벗어나면 저절로 풀려요. `ReentrantLock`은 직접 `unlock()`을 불러야 해서 **`finally`가 빠지면** 예외가 난 순간 락이 영원히 잠긴 채 남고, 다음 스레드는 끝없이 기다려요.'
      - h3: 주인만 풀 수 있어요
      - p: '뮤텍스에는 **주인**이 있어요. 락을 잡은 스레드만 풀 수 있어요.'
      - ci:
          key: owner
          label: 다른 스레드가 풀려고 한 결과 보기
          source: MutexSemaphoreTest.onlyOwnerUnlocks
      - muted: '이름의 "재진입(Reentrant)"은 잡은 스레드가 다시 `lock()`을 불러도 멈추지 않는다는 뜻이에요. 부른 만큼 `unlock()`해야 풀려요.'
      - quiz:
          q: '`lock.lock()` 뒤의 코드에서 예외가 났는데 `unlock()`이 `finally`에 없어요. 다음에 `lock()`을 부르는 다른 스레드는?'
          options:
            - 바로 들어간다. 예외가 나면 저절로 풀린다
            - 영원히 기다린다. 락이 풀리지 않았다
            - IllegalMonitorStateException이 난다
          answer: 2
          explain: '`ReentrantLock`은 직접 풀어야 해요. 예외로 `unlock()`을 건너뛰면 락이 잡힌 채로 남아요.'
      - next: '`synchronized`로도 되는데 `ReentrantLock`을 따로 쓰는 이유는 무엇일까요?'
    recall: '뮤텍스는 한 번에 하나만 임계 영역에 들어가게 하는 락이고, 잡은 스레드가 주인이라 주인만 풀 수 있어요. 자바에서는 `synchronized`와 `ReentrantLock`이 뮤텍스예요. `ReentrantLock`은 `lock()`과 `unlock()`을 직접 부르니 `unlock()`을 꼭 `finally`에 둬요.'
  - id: q2
    title: ReentrantLock은 synchronized로 못 하는 무엇을 하나요?
    conclusion:
      lead: '기다리지 않고 바로 포기하거나 정한 시간만 기다리는 `tryLock`, 기다리는 중에 인터럽트로 깨우는 `lockInterruptibly`, 온 순서대로 주는 공정 모드를 써요.'
      sub: '`synchronized`는 락이 풀릴 때까지 끝없이 기다리는 것 하나뿐이에요. 이런 기능이 필요 없으면 더 짧은 `synchronized`를 써요.'
    says:
      - '`tryLock()`은 락이 비어 있으면 잡고 true, 아니면 기다리지 않고 false를 돌려준다. 코드 tryLock처럼 시간을 주면 그만큼만 기다린다. 다른 스레드가 잡고 있는 동안 `tryLock(100ms)`는 100ms 남짓 뒤에 false다. 테스트로 보인다'
      - '쓰임: 이미 다른 스레드가 토큰을 새로 받고 있으면 기다리지 않고 지금 토큰을 쓴다. 기다림이 길어져 요청 스레드가 묶이는 것을 막는다'
      - '`lockInterruptibly()`는 기다리는 동안 다른 스레드가 `interrupt()`하면 `InterruptedException`을 던지고 기다림을 그만둔다. `synchronized`에서 기다리는 스레드는 인터럽트로 깨울 수 없다'
      - '`new ReentrantLock(true)`는 공정 모드다. 오래 기다린 스레드에게 먼저 준다. 기본은 공정하지 않고, 그쪽이 처리량이 높다'
      - '고르는 기준: 위 기능이 필요하면 `ReentrantLock`, 아니면 `synchronized`'
      - '더 알아보기: 락을 잡은 채 "큐가 비지 않을 때까지" 같은 조건을 기다리려면 `Condition`의 `await()`와 `signal()`을 쓴다. `synchronized`에서는 `wait()`와 `notify()`가 같은 일을 한다. 읽기는 여럿이 함께, 쓰기는 혼자 하게 하려면 `ReentrantReadWriteLock`을 쓴다'
    asks:
      - '본문의 예시: 스레드 A가 락을 잡고 1초 동안 일하는 중에 스레드 B가 `tryLock(100, MILLISECONDS)`를 불렀다. B가 받는 값과 걸리는 시간은 (false, 100ms 남짓)'
      - '옮긴 상황: 캐시를 다시 채우는 일은 한 스레드만 하고, 나머지 스레드는 기다리지 말고 지난 값을 바로 돌려줘야 한다. 무엇을 쓰나. 보기: synchronized, tryLock(), lock() (tryLock(). 잡지 못하면 바로 다른 길로 간다)'
    body:
      - p: '`synchronized`가 할 수 있는 것은 "풀릴 때까지 끝없이 기다리기" 하나예요. `ReentrantLock`은 기다리는 방법을 고를 수 있어요.'
      - code: tryLock
      - p: '다른 스레드가 락을 잡고 있는 동안 두 가지 `tryLock`을 불러 봤어요.'
      - ci:
          key: try-lock
          label: 실제 결과와 걸린 시간 보기
          source: MutexSemaphoreTest.tryLockGivesUp
      - table:
          head: [메서드, 하는 일]
          rows:
            - ['`tryLock()`', '비어 있으면 잡고 true, 아니면 **기다리지 않고** false']
            - ['`tryLock(시간)`', '그 시간만큼만 기다리고, 못 잡으면 false']
            - ['`lockInterruptibly()`', '기다리는 중에 다른 스레드가 `interrupt()`하면 `InterruptedException`으로 기다림을 그만둬요. `synchronized`에서 기다리는 스레드는 인터럽트로 깨울 수 없어요']
            - ['`new ReentrantLock(true)`', '공정 모드. 오래 기다린 스레드에게 먼저 줘요. 기본은 공정하지 않고, 그쪽이 처리량이 높아요']
      - p: '쓰임: 이미 다른 스레드가 토큰을 새로 받고 있으면 **기다리지 않고** 지금 토큰을 써요. 기다림이 길어져 요청 스레드가 줄줄이 묶이는 것을 막아요. 이런 기능이 필요 없으면 더 짧고 실수할 일이 적은 `synchronized`를 써요.'
      - more:
          summary: '더 알아보기: 조건을 기다리기와 읽기 쓰기 락'
          body:
            - p: '락을 잡은 채 "큐가 비지 않을 때까지" 같은 조건을 기다리려면 `Condition`의 `await()`와 `signal()`을 써요([Lock 문서](link:lockApi)). `synchronized`에서는 `wait()`와 `notify()`가 같은 일을 해요. 읽기는 여럿이 함께, 쓰기는 혼자 하게 하려면 `ReentrantReadWriteLock`을 써요. 직접 쓸 일보다 이것들로 만든 `BlockingQueue`를 쓸 일이 많아요(스레드 풀 레슨).'
      - quiz:
          q: '스레드 A가 락을 잡고 1초 동안 일하는 중에 스레드 B가 `tryLock(100, MILLISECONDS)`를 불렀어요. B가 받는 값과 걸리는 시간은?'
          options:
            - true, 1초쯤
            - false, 100ms쯤
            - false, 바로
          answer: 2
          explain: '정한 100ms만큼 기다렸다가 못 잡으면 false를 돌려줘요. 실제로 잰 값도 100ms 남짓이었어요.'
      - next: '뮤텍스는 한 번에 하나예요. 결제사가 "동시에 3건까지"를 허락한다면 하나씩만 보내기에는 아까워요.'
    recall: '`tryLock()`으로 기다리지 않고 바로 포기하거나 `tryLock(시간)`으로 정한 시간만 기다리고, `lockInterruptibly()`로 기다리는 중에 인터럽트로 깨우고, 공정 모드로 온 순서대로 줘요. `synchronized`는 끝없이 기다리는 것 하나뿐이라, 이런 기능이 필요 없으면 더 짧은 `synchronized`를 써요.'
  - id: q3
    title: 세마포어는 무엇이고 뮤텍스와 무엇이 다른가요?
    conclusion:
      lead: '허가 N개를 나눠 주어 한 번에 N개까지만 들어가게 하는 도구예요. 들어갈 때 `acquire()`로 하나 받고 나올 때 `release()`로 돌려줘요.'
      sub: '뮤텍스와 달리 주인이 없어서 받은 스레드가 아니어도 돌려줄 수 있어요. 그래서 "값을 지키는 락"보다 "자원의 동시 사용 수를 세는 계수기"에 가까워요.'
    says:
      - '세마포어는 허가의 수를 센다. `acquire()`는 허가가 남아 있으면 하나 줄이고 들어가고, 0이면 누가 돌려줄 때까지 기다린다. `release()`는 하나 늘리고 기다리는 스레드를 깨운다'
      - '예측의 답을 밝힌다. 코드 predict에서 스레드 10개 가운데 결제 API를 부르는 중인 스레드는 최대 3개다. 호출 안에서 지금 몇 개가 안에 있는지 세어 가장 큰 값을 보인다. 200ms 호출 10개가 세 개씩 나가서 약 0.8초(네 묶음)에 끝난다'
      - '주인이 없다: 스레드 A가 받은 허가를 스레드 B가 돌려줘도 된다. 테스트로 보인다. 그래서 허가 1개인 세마포어는 "한 번에 하나"는 같지만 주인 검사가 없어 뮤텍스와 같지 않다'
      - '조심: `release()`를 받지도 않고 부르면 허가가 처음보다 늘어난다. 세마포어는 막지 않는다'
      - '`tryAcquire()`와 `tryAcquire(시간)`은 tryLock과 같은 방식이다. 허가가 없으면 바로 또는 정한 시간 뒤에 false다'
    asks:
      - '본문의 예시: 허가 3개인 세마포어에 200ms 걸리는 호출 9개를 동시에 보냈다. 모두 끝나는 데 대략 얼마나 걸리나 (600ms쯤. 세 개씩 세 묶음)'
      - '옮긴 상황: 허가 2개인 세마포어에서 어떤 스레드도 `acquire()`하지 않았는데 한 스레드가 `release()`를 한 번 불렀다. 지금 동시에 들어갈 수 있는 수는 (3개. 세마포어에는 주인 검사가 없어 허가가 늘어난다)'
    body:
      - p: '**세마포어**는 허가(permit)의 수를 세요. `acquire()`는 허가가 남아 있으면 하나 줄이고 들어가고, 0이면 누가 돌려줄 때까지 기다려요. `release()`는 하나 늘리고 기다리는 스레드를 깨워요.'
      - code: semaphore
      - p: '처음 예측의 답은 **3개**예요. {{predict-result}} 허가 3개인 세마포어 앞에 스레드 10개를 한꺼번에 보내고, 안에 지금 몇 개가 있는지 세어 가장 큰 값을 남겼어요.'
      - ci:
          key: predict
          label: 실제 결과 보기
          source: MutexSemaphoreTest.semaphoreLimits
          code: predict
      - p: '넷째 스레드부터는 앞의 셋 가운데 하나가 돌려줄 때까지 기다려요. 200ms 호출 10개가 세 개씩 네 묶음(3, 3, 3, 1)으로 나가서, 200ms × 4 = 0.8초보다 빨리 끝날 수 없어요.'
      - h3: 세마포어에는 주인이 없어요
      - ci:
          key: no-owner
          label: 다른 스레드가 돌려준 결과 보기
          source: MutexSemaphoreTest.semaphoreHasNoOwner
      - ul:
          - '스레드 A가 받은 허가를 스레드 B가 돌려줘도 돼요. 뮤텍스였다면 예외예요.'
          - '받지도 않고 `release()`를 부르면 허가가 처음보다 **늘어나요.** 세마포어는 막지 않아요.'
          - '그래서 허가 1개인 세마포어는 "한 번에 하나"는 같지만, 주인 검사가 없어 뮤텍스와 같지 않아요.'
      - muted: '`tryAcquire()`와 `tryAcquire(시간)`은 `tryLock`과 같은 방식이에요. 허가가 없으면 바로, 또는 정한 시간 뒤에 false예요([Semaphore 문서](link:semaphore)).'
      - quiz:
          q: '허가 3개인 세마포어에 200ms 걸리는 호출 9개를 동시에 보냈어요. 모두 끝나는 데 대략 얼마나 걸릴까요?'
          options:
            - 200ms쯤
            - 600ms쯤
            - 1.8초쯤
          answer: 2
          explain: '세 개씩 세 묶음이라 200ms × 3이에요.'
      - next: '한 번에 하나만 들여보내는 뮤텍스와 N개까지 들여보내는 세마포어. 어디에 무엇을 쓸까요?'
    recall: '허가 N개를 나눠 주어 한 번에 N개까지만 들어가게 하는 도구예요. 들어갈 때 `acquire()`로 하나 받고 나올 때 `release()`로 돌려줘요. 뮤텍스와 달리 주인이 없어서 받은 스레드가 아니어도 돌려줄 수 있고, 받지 않고 돌려주면 허가가 늘어나요. 값을 지키는 락보다 동시 사용 수를 세는 계수기에 가까워요.'
  - id: q4
    title: 뮤텍스와 세마포어는 각각 언제 쓰나요?
    conclusion:
      lead: '함께 쓰는 값을 고치는 구간은 뮤텍스로 한 번에 하나만, 개수가 정해진 자원을 나눠 쓰는 곳은 세마포어로 N개까지만 들여보내요.'
      sub: '세마포어로 감싼 안쪽에서 함께 쓰는 값을 고친다면 그 값은 여전히 뮤텍스가 필요해요. 세 스레드가 동시에 들어와 있기 때문이에요.'
    says:
      - '뮤텍스: 카운터, 잔액, 토큰 갱신처럼 값을 읽고 고치는 구간. 둘이 동시에 들어오면 틀어진다'
      - '세마포어: 외부 API의 동시 호출 수, 무거운 작업의 동시 실행 수, 한정된 연결. 동시에 여럿 들어와도 되지만 너무 많으면 안 된다'
      - '세마포어 안쪽은 임계 영역이 아니다. 허가 3개면 세 스레드가 동시에 안에 있으니, 안에서 함께 쓰는 카운터를 `++`하면 C3의 문제가 그대로다'
      - '이미 이 모양을 한 도구가 많다. 커넥션 풀은 연결 수만큼의 허가를 가진 세마포어처럼 동작한다(D6). 스레드 풀의 크기도 동시에 실행하는 수를 정한다(C7)'
    widget:
      kind: classify
      note: '상황마다 뮤텍스, 세마포어, 둘 다 필요 없음을 고른다. 항목: 토큰을 한 스레드만 새로 받기, 결제사 동시 호출 3건 제한, 재고 차감, 리포트 생성은 동시에 2개까지, 요청마다 새로 만든 지역 리스트에 넣기'
    asks:
      - '본문의 예시: 허가 3개인 세마포어 안에서 함께 쓰는 `int calls`를 `calls++`한다. `calls`는 정확한가 (정확하지 않을 수 있다. 안에 세 스레드가 동시에 있다)'
      - '옮긴 상황: PDF 생성이 메모리를 많이 써서 서버에서 동시에 2개까지만 돌게 하고 싶다. 무엇을 쓰나 (허가 2개인 세마포어)'
      - '실무 구역: 코드 leak의 `pay()`에서 결제 API가 예외를 세 번 던졌다(허가 3개). 다음 `pay()`는 어떻게 되나 (영원히 기다린다. 예외로 release를 건너뛰어 허가가 0이 됐다)'
    body:
      - widget:
          kind: classify
          categories: [뮤텍스, 세마포어, 둘 다 필요 없음]
          items:
            - {text: '토큰이 만료되면 한 스레드만 새로 받는다', answer: 1, explain: '값(토큰)을 고치는 구간이라 한 번에 하나만 들어가야 해요.'}
            - {text: '결제사 API를 동시에 3건까지만 부른다', answer: 2, explain: '동시에 여럿 들어가도 되지만 3을 넘으면 안 돼요.'}
            - {text: '메모리를 많이 쓰는 PDF 생성은 동시에 2개까지만 돌린다', answer: 2, explain: '자원의 동시 사용 수를 세는 일이에요.'}
            - {text: '재고 수를 읽고 하나 줄여 쓴다 (JVM 안의 값)', answer: 1, explain: '읽고-고치고-쓰기라 한 번에 하나만 해야 해요.'}
            - {text: '요청마다 메서드 안에서 새로 만든 리스트에 값을 넣는다', answer: 3, explain: '지역에서 만든 객체는 그 스레드만 봐요. 함께 쓰는 것이 없어요.'}
      - ul:
          - '**뮤텍스:** 카운터, 잔액, 토큰 갱신처럼 **값을 읽고 고치는 구간**이에요. 둘이 동시에 들어오면 틀어져요.'
          - '**세마포어:** 외부 API의 동시 호출 수, 무거운 작업의 동시 실행 수처럼 **개수가 정해진 자원**이에요. 여럿 들어와도 되지만 너무 많으면 안 돼요.'
      - callout: '세마포어로 감싼 안쪽은 임계 영역이 **아니에요.** 허가 3개면 세 스레드가 동시에 안에 있어요. 안에서 함께 쓰는 카운터를 `++`하면 경쟁 상태가 그대로 생겨요. 그 값은 따로 뮤텍스나 Atomic으로 지켜요.'
      - muted: '이미 이 모양을 한 도구가 많아요. 커넥션 풀은 연결 수만큼 허가를 가진 세마포어처럼 동작하고(DB 커넥션과 커넥션 풀 레슨), 스레드 풀의 크기도 동시에 실행하는 수를 정해요(스레드 풀 레슨).'
      - quiz:
          q: '허가 3개인 세마포어 안에서 함께 쓰는 `int calls`를 `calls++`해요. `calls`는 정확할까요?'
          options:
            - 정확하다. 세마포어가 지킨다
            - 정확하지 않을 수 있다. 안에 세 스레드가 동시에 있다
            - 컴파일 오류
          answer: 2
          explain: '세마포어는 수만 셀 뿐, 안에 들어온 세 스레드가 같은 값을 고치는 것은 막지 않아요.'
    recall: '함께 쓰는 값을 고치는 구간은 뮤텍스로 한 번에 하나만, 개수가 정해진 자원을 나눠 쓰는 곳은 세마포어로 N개까지만 들여보내요. 세마포어로 감싼 안쪽에서 함께 쓰는 값을 고친다면 그 값은 여전히 뮤텍스가 필요해요. 여러 스레드가 동시에 들어와 있기 때문이에요.'
practice:
  says:
    - '스프링 서비스에서 결제사의 동시 호출 제한을 지키는 코드: 빈의 필드에 `new Semaphore(3)`을 두고, `tryAcquire(1, SECONDS)`로 잠깐만 기다린 뒤 못 받으면 "잠시 뒤 다시"로 답한다. 무한히 기다리면 요청 스레드가 묶인다(C2의 톰캣 스레드)'
    - '흔한 실수: 코드 leak처럼 `release()`를 `finally`에 두지 않는다. 예외가 날 때마다 허가가 하나씩 사라지다가 0이 되면 모든 호출이 멈춘다. 고친 코드: 코드 semaphore의 try-finally. 예외를 세 번 낸 뒤 남은 허가가 0인 것과, 고친 뒤 3인 것을 테스트로 비교한다'
    - '직접 만들기 전에: Resilience4j의 벌크헤드(`SemaphoreBulkhead`)가 같은 일을 설정으로 한다(Resilience4j 문서 근거, A10)'
    - '세마포어와 락은 JVM 하나 안에서만 센다. 서버가 세 대면 동시 호출은 9건이 될 수 있다. 서버 전체의 제한은 A12, A13'
  body:
    - p: '스프링 서비스에서 세마포어는 **외부 시스템을 지키는 데** 자주 써요. 아래 코드와 실수는 테스트로 돌렸고, 라이브러리는 공식 문서가 근거예요.'
    - h3: 결제사의 동시 호출 제한 지키기
    - code: springLimiter
      notes:
        - mark: tryAcquire(1, SECONDS)
          as: code
          text: '1초만 기다려요. 무한히 기다리면 톰캣의 요청 스레드가 묶여요(컨텍스트 스위칭 레슨).'
    - p: '허가를 못 받으면 예외로 바로 답해서 클라이언트가 잠시 뒤 다시 시도하게 해요. 빈은 싱글톤이라 이 세마포어 하나를 모든 요청 스레드가 함께 써요.'
    - h3: '흔한 실수: release를 finally에 두지 않기'
    - code: leak
    - p: '결제 API가 예외를 던지면 `release()`를 건너뛰어요. 허가가 하나씩 사라지다가 0이 되면 모든 호출이 멈춰요. 예외를 세 번 낸 뒤 남은 허가를 비교했어요.'
    - ci:
        key: leak
        label: 고치기 전과 뒤의 실제 결과 보기
        source: MutexSemaphoreTest.permitLeak
    - p: '고친 코드는 질문 3의 `try-finally` 모양이에요. `acquire()`가 성공한 **다음 줄**에서 `try`를 열어야 해요. `acquire()`를 `try` 안에 넣으면, 받지 못하고 예외가 났을 때도 `finally`가 `release()`를 불러 허가가 늘어나요.'
    - h3: 직접 만들기 전에
    - ul:
        - 'Resilience4j의 벌크헤드(`SemaphoreBulkhead`)가 같은 일을 설정으로 해요. 동시 호출 수와 기다리는 시간을 정해요([Resilience4j 문서](link:bulkhead)). 타임아웃, 재시도, 서킷 브레이커 레슨에서 다뤄요.'
        - '세마포어와 락은 **JVM 하나 안에서만** 세요. 서버가 세 대면 동시 호출은 9건이 될 수 있어요. 서버 전체의 제한은 분산 락, 요청 수 제한 레슨에서 다뤄요.'
interview:
  question: 뮤텍스와 세마포어의 차이를 설명해 주세요
  model:
    - label: 정의
      text: 뮤텍스는 임계 영역에 한 번에 한 스레드만 들어가게 하는 락이고, 세마포어는 허가 N개를 나눠 주어 한 번에 N개까지 들어가게 하는 계수기입니다.
    - label: 원리
      text: 뮤텍스는 잡은 스레드가 주인이라 주인만 풀 수 있고, 자바에서는 synchronized와 ReentrantLock입니다. 세마포어는 acquire로 허가를 받고 release로 돌려주며 주인이 없어 다른 스레드가 돌려줄 수도 있습니다.
    - label: 주의할 점
      text: 값을 고치는 구간은 뮤텍스, 외부 API의 동시 호출 수처럼 개수가 정해진 자원은 세마포어를 씁니다. 세마포어 안쪽은 여러 스레드가 함께 있어 값은 따로 지켜야 하고, unlock과 release는 finally에 둬야 예외로 락이나 허가가 새지 않습니다. ReentrantLock의 tryLock으로 기다리는 시간에 끝을 줄 수 있습니다.
    - label: 경험
      text: '(내 프로젝트로 채우기) 예: 결제사의 동시 호출 제한을 Semaphore와 tryAcquire로 지키고, 넘치면 잠시 뒤 다시 시도하라고 답했습니다.'
verified: 이 레슨의 결과는 짐작이 아니라 자바 21에서 코드를 돌려 받은 값이에요. 기다리는 순서가 중요한 것은 래치로 다른 스레드가 먼저 잡은 것을 확인한 뒤에 봤어요. 코드가 바뀔 때마다 테스트([MutexSemaphoreTest](link:test))가 다시 돌아요.
footer: '근거: ReentrantLock은 API 문서([링크](link:reentrantLock)), tryLock과 lockInterruptibly와 Condition은 Lock API 문서, 세마포어와 주인이 없다는 것은 Semaphore API 문서([링크](link:semaphore)), 벌크헤드는 Resilience4j 문서. 결과는 OpenJDK 21에서 테스트로 확인했어요. 오류는 [GitHub 이슈](https://github.com/wanja727/dev-lessons/issues)로 알려 주세요.'
claims:
  - claim: '두 스레드가 ReentrantLock 안에서 10만 번씩 세면 정확히 20만이다'
    how: 'lock과 unlock을 try-finally로 감싼다'
    test: MutexSemaphoreTest.lockIsExact
  - claim: '주인이 아닌 스레드의 unlock은 IllegalMonitorStateException이다'
    how: '한 스레드가 잡고 다른 스레드가 푼다'
    test: MutexSemaphoreTest.onlyOwnerUnlocks
  - claim: '다른 스레드가 락을 잡고 있으면 tryLock()은 바로 false이고, tryLock(100ms)는 100ms 남짓 기다린 뒤 false다'
    how: '래치로 한 스레드가 잡은 것을 확인하고 시간을 잰다. 90ms 이상인지만 단정한다'
    test: MutexSemaphoreTest.tryLockGivesUp
  - claim: 'lockInterruptibly로 기다리는 스레드는 interrupt하면 InterruptedException으로 기다림을 그만둔다'
    how: '잡힌 락을 기다리게 하고 interrupt한다'
    test: MutexSemaphoreTest.lockInterruptibly
  - claim: '허가 3개인 세마포어에 스레드 10개를 보내면 동시에 안에 있는 수는 최대 3이다'
    how: '안에서 지금 수를 AtomicInteger로 세어 최대값을 남긴다. 시작을 래치로 맞춰 3인지 본다. 모두 끝나는 데 790ms 이상인지도 본다'
    test: MutexSemaphoreTest.semaphoreLimits
  - claim: '다른 스레드가 받은 허가를 돌려줄 수 있고, 받지 않고 release하면 허가가 처음보다 늘어난다'
    how: 'availablePermits를 본다'
    test: MutexSemaphoreTest.semaphoreHasNoOwner
  - claim: 'acquire 뒤 예외로 release를 건너뛰면 허가가 줄어들고, try-finally면 그대로다'
    how: '예외를 던지는 호출을 세 번 하고 availablePermits를 비교한다'
    test: MutexSemaphoreTest.permitLeak
sources:
  - '`ReentrantLock`: API 문서 https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/concurrent/locks/ReentrantLock.html'
  - '`Lock`의 tryLock, lockInterruptibly, Condition: API 문서 https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/concurrent/locks/Lock.html'
  - '`Semaphore`와 주인이 없다는 것: API 문서 https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/concurrent/Semaphore.html'
  - '벌크헤드: Resilience4j 문서 https://resilience4j.readme.io/docs/bulkhead'
