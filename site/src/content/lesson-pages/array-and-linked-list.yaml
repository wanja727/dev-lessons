# 배열과 연결 리스트
# 자료 파일의 칸은 docs/lesson-data-format.md에 있다. 문제는 content/questions/array-and-linked-list.yaml에 있다.
title: 배열과 연결 리스트
description: ArrayList가 크기가 정해진 배열로 어떻게 늘어나는지, 중간에 넣으면 ArrayList와 LinkedList가 각각 무엇을 하는지, LinkedList는 언제 더 빠른지. 세 가지 질문에 스스로 답할 수 있게, 대기 번호표 목록에 넣고 읽으며 안에서 움직이는 것을 세어 보는 대화형 레슨.
unit: 자료구조와 알고리즘
minutes: 20
roadmap: K2
type: 자바 실행
prerequisites:
  - {slug: time-complexity, title: 시간 복잡도}
assume: '자바 21(OpenJDK). O(1)과 O(n)이 뜻하는 것(시간 복잡도 레슨). 변수에 객체의 참조가 들어 있다는 것(값과 참조 레슨).'
example: '대기 번호표 목록. 손님의 번호를 리스트에 담고, 뒤에 넣고, 중간에 끼워 넣고, `i`번째를 읽어요. 같은 일을 `ArrayList`와 `LinkedList`에 시켜 안에서 움직이는 것을 세요. 실무 구역에서는 크기를 미리 아는 리스트와 `LinkedList`의 `get(i)` 반복으로 옮겨요.'
intro:
  - '"`LinkedList`는 넣고 빼는 게 빠르니까 자주 고치는 목록에 써라." 이 말을 믿고 `LinkedList`로 바꿨더니 화면이 더 느려지는 일이 있어요. 넣고 빼는 것 말고도 그 자리를 찾아가는 시간이 들기 때문이에요.'
  - '자바 개발자가 가장 많이 쓰는 컬렉션이 `ArrayList`예요. JPA가 돌려주는 조회 결과도, 스트림의 `toList()`도 대개 리스트예요. 리스트 안에서 무엇이 움직이는지 알면 언제 빠르고 언제 느린지 설명할 수 있고, 면접의 단골 질문인 "`ArrayList`와 `LinkedList`의 차이"에 답할 수 있어요.'
  - '이 레슨에서는 `ArrayList`의 안쪽 배열이 커지는 순간을 들여다보고, 중간에 넣을 때 밀리는 칸 수와 `LinkedList`가 노드를 따라가는 횟수를 세서 비교해요.'
covers:
  - topic: '배열은 같은 크기의 칸이 메모리에 이어 붙어 있다. 그래서 i번째 칸을 계산 한 번으로 찾는다(O(1)). 크기는 만들 때 정해지고 바꿀 수 없다'
    where: '질문 1'
  - topic: 'ArrayList는 안에 배열을 하나 가진다. 배열이 차면 1.5배 큰 배열을 새로 만들어 모두 복사한다'
    where: '질문 1'
  - topic: '처음 add할 때 크기 10의 배열이 생긴다. size와 용량(capacity)은 다르다'
    where: '질문 1'
  - topic: '복사가 가끔이라 뒤에 넣는 add는 분할 상환 O(1)이다'
    where: '질문 1. 분할 상환의 뜻은 시간 복잡도(K1)'
  - topic: '중간에 넣거나 빼면 뒤의 원소를 한 칸씩 민다. O(n)이고, 앞쪽일수록 많이 민다'
    where: '질문 2'
  - topic: '연결 리스트는 노드마다 값과 앞뒤 노드의 참조를 가진다. 자바의 LinkedList는 양쪽으로 이어진 리스트다'
    where: '질문 2'
  - topic: 'LinkedList는 넣고 빼는 것 자체는 참조 몇 개를 바꾸는 O(1)이지만, 그 자리까지 가는 데 O(n)이 든다. get(i)도 O(n)이다'
    where: '질문 2'
  - topic: '맨 앞과 맨 뒤에서 넣고 빼는 것은 LinkedList가 O(1), ArrayList는 맨 앞이 O(n)이다'
    where: '질문 3'
  - topic: 'LinkedList는 노드마다 객체 하나와 참조 둘을 더 써서 메모리를 더 쓰고, 노드가 메모리에 흩어져 있어 CPU 캐시를 덜 탄다. 그래서 대부분의 경우 ArrayList가 빠르다'
    where: '질문 3'
  - topic: '반복자로 돌면서 지우기는 LinkedList가 O(1)이다'
    where: '질문 3의 더 알아보기'
  - topic: '크기를 알면 new ArrayList<>(n)으로 처음부터 넉넉한 배열을 준다'
    where: '실무에서는'
  - topic: 'LinkedList를 for (int i...)와 get(i)로 돌면 O(n²)이 된다'
    where: '실무에서는'
  - topic: 'Arrays.asList는 크기를 바꿀 수 없고, List.of는 아무것도 바꿀 수 없다'
    where: '다루지 않음: 불변 객체(J9). Arrays.asList의 add가 던지는 예외는 실무에서는'
  - topic: '맨 앞에서 빼는 일이 잦으면 쓰는 ArrayDeque'
    where: '다루지 않음: 스택과 큐(K3)'
  - topic: '돌면서 지울 때의 ConcurrentModificationException'
    where: '다루지 않음: 컬렉션 고르기(K10)'
