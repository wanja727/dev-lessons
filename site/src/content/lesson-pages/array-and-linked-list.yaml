# 배열과 연결 리스트 (설계서)
# 자료 파일의 칸은 docs/lesson-data-format.md에 있다.
stage: design
title: 배열과 연결 리스트
unit: 자료구조와 알고리즘
roadmap: K2
type: 자바 실행
prerequisites:
  - {slug: time-complexity, title: 시간 복잡도}
assume: '자바 21(OpenJDK). O(1)과 O(n)이 뜻하는 것(시간 복잡도 레슨). 변수에 객체의 참조가 들어 있다는 것(값과 참조 레슨).'
example: '대기 번호표 목록. 손님의 번호를 리스트에 담고, 뒤에 넣고, 중간에 끼워 넣고, `i`번째를 읽어요. 같은 일을 `ArrayList`와 `LinkedList`에 시켜 안에서 움직이는 것을 세요. 실무 구역에서는 크기를 미리 아는 리스트와 `LinkedList`의 `get(i)` 반복으로 옮겨요.'
intro:
  - '"`LinkedList`는 넣고 빼는 게 빠르니까 자주 고치는 목록에 써라." 이 말을 믿고 `LinkedList`로 바꿨더니 화면이 더 느려지는 일이 있어요. 넣고 빼는 것 말고도 그 자리를 찾아가는 시간이 들기 때문이에요.'
  - '자바 개발자가 가장 많이 쓰는 컬렉션이 `ArrayList`예요. JPA가 돌려주는 조회 결과도, 스트림의 `toList()`도 대개 리스트예요. 리스트 안에서 무엇이 움직이는지 알면 언제 빠르고 언제 느린지 설명할 수 있고, 면접의 단골 질문인 "`ArrayList`와 `LinkedList`의 차이"에 답할 수 있어요.'
  - '이 레슨에서는 `ArrayList`의 안쪽 배열이 커지는 순간을 들여다보고, 중간에 넣을 때 밀리는 칸 수와 `LinkedList`가 노드를 따라가는 횟수를 세서 비교해요.'
covers:
  - topic: '배열은 같은 크기의 칸이 메모리에 이어 붙어 있다. 그래서 i번째 칸을 계산 한 번으로 찾는다(O(1)). 크기는 만들 때 정해지고 바꿀 수 없다'
    where: '질문 1'
  - topic: 'ArrayList는 안에 배열을 하나 가진다. 배열이 차면 1.5배 큰 배열을 새로 만들어 모두 복사한다'
    where: '질문 1'
  - topic: '처음 add할 때 크기 10의 배열이 생긴다. size와 용량(capacity)은 다르다'
    where: '질문 1'
  - topic: '복사가 가끔이라 뒤에 넣는 add는 분할 상환 O(1)이다'
    where: '질문 1. 분할 상환의 뜻은 시간 복잡도(K1)'
  - topic: '중간에 넣거나 빼면 뒤의 원소를 한 칸씩 민다. O(n)이고, 앞쪽일수록 많이 민다'
    where: '질문 2'
  - topic: '연결 리스트는 노드마다 값과 앞뒤 노드의 참조를 가진다. 자바의 LinkedList는 양쪽으로 이어진 리스트다'
    where: '질문 2'
  - topic: 'LinkedList는 넣고 빼는 것 자체는 참조 몇 개를 바꾸는 O(1)이지만, 그 자리까지 가는 데 O(n)이 든다. get(i)도 O(n)이다'
    where: '질문 2'
  - topic: '맨 앞과 맨 뒤에서 넣고 빼는 것은 LinkedList가 O(1), ArrayList는 맨 앞이 O(n)이다'
    where: '질문 3'
  - topic: 'LinkedList는 노드마다 객체 하나와 참조 둘을 더 써서 메모리를 더 쓰고, 노드가 메모리에 흩어져 있어 CPU 캐시를 덜 탄다. 그래서 대부분의 경우 ArrayList가 빠르다'
    where: '질문 3'
  - topic: '반복자로 돌면서 지우기는 LinkedList가 O(1)이다'
    where: '질문 3의 더 알아보기'
  - topic: '크기를 알면 new ArrayList<>(n)으로 처음부터 넉넉한 배열을 준다'
    where: '실무에서는'
  - topic: 'LinkedList를 for (int i...)와 get(i)로 돌면 O(n²)이 된다'
    where: '실무에서는'
  - topic: 'Arrays.asList는 크기를 바꿀 수 없고, List.of는 아무것도 바꿀 수 없다'
    where: '다루지 않음: 불변 객체(J9). Arrays.asList의 add가 던지는 예외는 실무에서는'
  - topic: '맨 앞에서 빼는 일이 잦으면 쓰는 ArrayDeque'
    where: '다루지 않음: 스택과 큐(K3)'
  - topic: '돌면서 지울 때의 ConcurrentModificationException'
    where: '다루지 않음: 컬렉션 고르기(K10)'
codes:
  predict: |-
    List<Integer> list = new ArrayList<>();
    for (int i = 1; i <= 11; i++) {
      list.add(i);
    }
    // 안쪽 배열의 길이는?
  insert: |-
    List<Integer> tickets =
        new ArrayList<>(List.of(1, 2, 3, 4, 5));
    tickets.add(1, 99);
    System.out.println(tickets);
  node: |-
    class Node {
      int value;
      Node prev;
      Node next;
    }
  getLoop: |-
    List<Long> ids = repository.findIds();
    for (int i = 0; i < ids.size(); i++) {
      process(ids.get(i));
    }
  presize: |-
    List<OrderDto> result =
        new ArrayList<>(orders.size());
    for (Order o : orders) {
      result.add(OrderDto.from(o));
    }
predict:
  text: '코드 predict는 빈 `ArrayList`에 숫자 11개를 넣어요. 다 넣은 뒤 `ArrayList`가 안에 가진 배열의 길이는 얼마일까요? 보기: 11, 15, 16, 20.'
  answer: '15. 처음 넣을 때 길이 10의 배열이 생기고, 열한 번째를 넣을 때 1.5배인 15의 배열로 옮긴다. 질문 1에서 밝힌다.'
questions:
  - id: q1
    title: ArrayList는 크기가 정해진 배열로 어떻게 계속 늘어나나요?
    conclusion:
      lead: '안쪽 배열이 차면 1.5배 큰 배열을 새로 만들고 원소를 모두 옮겨요.'
      sub: '옮기는 일은 가끔만 일어나서, 뒤에 넣는 `add`는 평균으로 보면 O(1)이에요.'
    says:
      - '배열은 같은 크기의 칸이 메모리에 이어 붙어 있다. `i`번째 칸의 위치는 "시작 위치 + i × 칸 크기"로 한 번에 계산한다. 그래서 `get(i)`가 O(1)이다. 대신 만들 때 정한 길이를 바꿀 수 없다'
      - '`ArrayList`는 이 배열 하나와, 몇 칸을 쓰고 있는지(`size`)를 가진다. 배열의 길이를 용량이라고 한다. `size`가 3이어도 용량은 10일 수 있다'
      - '코드 predict를 따라간다. 처음 `add`에서 길이 10의 배열이 생긴다. 열 개를 넣으면 꽉 찬다. 열한 번째에서 길이 15(10 + 10의 절반)의 새 배열을 만들고 열 개를 옮긴 뒤 넣는다. 예측의 답을 밝힌다. 안쪽 배열의 길이는 리플렉션으로 읽어 실제 출력으로 보인다'
      - '옮기는 일은 O(n)이지만, 다음 옮기기까지 그 절반만큼은 그냥 넣는다. 넣은 횟수 전체로 나누면 한 번에 드는 비용은 상수다(분할 상환 O(1), K1)'
      - '1부터 100만까지 넣는 동안 배열을 새로 만든 횟수를 센다. 100만 번 넣는 동안 서른 번 남짓이다'
    widget:
      kind: steps
      note: '빈 `ArrayList`에 1부터 11까지 넣는다. 위 줄은 안쪽 배열의 칸(빈 칸은 흐리게), 아래 줄에 size와 용량을 보인다. 단계: 처음 add로 10칸 생김, 10까지 채움, 11을 넣을 때 15칸 배열이 새로 생기고 10개가 옮겨짐(옮긴 칸 강조), 11이 들어감'
    asks:
      - '본문의 예시: 코드 predict에서 숫자를 16개 넣으면 안쪽 배열의 길이는 얼마인가 (22. 15가 차서 15 + 7로 늘어난다)'
      - '옮긴 상황: `new ArrayList<>(100)`으로 만든 리스트에 원소 100개를 넣었다. 그동안 배열을 새로 만들어 옮긴 횟수는 몇 번인가 (0번. 처음부터 용량이 100이다)'
  - id: q2
    title: 중간에 넣으면 ArrayList와 LinkedList는 각각 무엇을 하나요?
    conclusion:
      lead: '`ArrayList`는 그 뒤의 원소를 모두 한 칸씩 밀고, `LinkedList`는 그 자리까지 노드를 따라간 뒤 참조 몇 개만 바꿔요.'
      sub: '그래서 둘 다 O(n)이에요. `ArrayList`는 미는 데, `LinkedList`는 찾아가는 데 시간이 들어요.'
    says:
      - '코드 insert. 다섯 칸 리스트의 1번 자리에 99를 넣는다. 1번부터 끝까지 네 원소가 한 칸씩 뒤로 밀린 뒤 99가 들어간다. 출력은 `[1, 99, 2, 3, 4, 5]`다. 맨 앞에 넣으면 전부 밀리고 맨 뒤에 넣으면 하나도 밀리지 않는다'
      - '`remove(i)`는 반대로 뒤의 원소를 한 칸씩 당긴다'
      - '연결 리스트는 코드 node 같은 노드를 참조로 잇는다. 노드는 메모리 아무 데나 있어도 된다. 자바의 `LinkedList`는 앞과 뒤를 모두 가리키는 양쪽 연결 리스트이고, 맨 앞과 맨 뒤 노드를 기억한다'
      - '`LinkedList`에서 `add(1, 99)`는 새 노드를 만들고 앞뒤 노드의 참조 넷을 바꾼다. 밀리는 원소가 없다. 하지만 그 자리를 찾으려면 맨 앞(또는 가까운 쪽 끝)에서 노드를 하나씩 따라가야 한다. 배열처럼 위치를 계산할 수 없기 때문이다'
      - '`LinkedList.get(i)`도 같은 이유로 O(n)이다. 가운데 원소를 읽으려면 n/2개의 노드를 지난다'
      - '정리 표: 연산마다 `ArrayList`와 `LinkedList`의 복잡도. get(i), 맨 뒤에 넣기, 맨 앞에 넣기, 가운데 넣기'
    asks:
      - '본문의 예시: 원소 1천 개가 든 `ArrayList`에서 `add(0, x)`를 하면 몇 개의 원소가 자리를 옮기나 (1천 개)'
      - '옮긴 상황: 원소 1천 개가 든 `LinkedList`에서 `get(500)`을 부른다. 이 연산이 O(1)이 아닌 이유는 무엇인가 (노드가 이어 붙어 있지 않아 위치를 계산할 수 없고, 끝에서부터 노드를 따라가야 한다)'
  - id: q3
    title: 그러면 LinkedList는 언제 더 빠른가요?
    conclusion:
      lead: '맨 앞에서 넣고 빼는 일이 많을 때예요. 그 밖의 대부분은 `ArrayList`가 더 빨라요.'
      sub: '`LinkedList`는 노드마다 객체를 하나씩 더 만들고 노드가 메모리에 흩어져 있어서, 같은 O(n)이라도 따라가는 데 더 오래 걸려요.'
    says:
      - '맨 앞에 넣기를 1만 번 하는 시간을 둘로 잰다. `ArrayList`는 넣을 때마다 전부 밀어서 O(n²)이고 `LinkedList`는 O(n)이다. 실측값을 보인다'
      - '반대로 끝까지 차례로 읽기, 맨 뒤에 넣기, `get(i)`는 `ArrayList`가 같거나 빠르다. 실측값을 같은 표에 둔다'
      - '복잡도가 같아도 시간이 다른 이유. CPU는 메모리를 읽을 때 근처 칸까지 함께 가져와 둔다(캐시). 배열은 다음 원소가 바로 옆이라 이미 가져와 있다. `LinkedList`의 노드는 흩어져 있어 매번 새로 가져온다. 이 레슨에서는 이 정도로만 말하고 단정하지 않는다'
      - '메모리도 다르다. `LinkedList`는 원소마다 노드 객체를 하나 더 만들고, 노드는 값 말고도 참조 둘을 가진다'
      - '맨 앞에서 넣고 빼는 일이 많다면 `LinkedList`보다 `ArrayDeque`가 낫다. 이유는 스택과 큐(K3)에서 다룬다. 그래서 실무에서 `LinkedList`를 고를 일은 드물다'
      - '더 알아보기: 반복자(`Iterator`)로 돌면서 지금 원소를 지우는 것은 `LinkedList`가 O(1)이다. 이미 그 노드에 와 있기 때문이다. `ArrayList`는 뒤를 당겨야 해서 O(n)이다'
    asks:
      - '본문의 예시: 리스트의 맨 앞에 원소를 넣는 일을 10만 번 한다. `ArrayList`와 `LinkedList` 가운데 어느 쪽이 빠르고, 왜 그런가 (`LinkedList`. `ArrayList`는 넣을 때마다 모든 원소를 민다)'
      - '옮긴 상황: 조회한 상품 1만 개를 리스트에 차례로 담고, 화면에 그리며 처음부터 끝까지 한 번 읽는다. 어느 리스트가 맞나 (`ArrayList`. 뒤에 넣기와 차례로 읽기는 `ArrayList`가 같거나 빠르고 메모리도 덜 쓴다)'
      - '실무 구역: 코드 getLoop의 `ids`가 `LinkedList`이고 원소가 n개다. 이 반복의 시간 복잡도는 무엇인가 (O(n²). `get(i)`가 매번 O(n)이다)'
practice:
  says:
    - '크기를 미리 알면 용량을 준다. 코드 presize처럼 엔티티를 DTO로 바꿀 때 결과의 크기는 입력과 같다. `new ArrayList<>(orders.size())`로 만들면 배열을 다시 만들지 않는다. 스트림의 `toList()`를 써도 된다. 다시 만든 횟수를 리플렉션으로 세어 0인 것을 보인다'
    - '흔한 실수: 코드 getLoop처럼 인덱스로 리스트를 돈다. `ArrayList`면 괜찮지만 어떤 구현이 올지 모르는 `List`를 받는 메서드에서는 `LinkedList`가 올 수 있다. 그러면 `get(i)`가 매번 앞에서부터 따라가 O(n²)이 된다. 고친 코드: 향상된 `for`(`for (Long id : ids)`)로 돈다. 반복자를 쓰므로 어느 리스트든 O(n)이다. 원소 1만 개의 `LinkedList`로 두 방법의 걸린 시간을 실측값으로 보인다'
    - '`Arrays.asList(1, 2, 3)`가 돌려주는 리스트는 배열을 감싼 것이라 크기를 바꿀 수 없다. `add`를 부르면 `UnsupportedOperationException`이 난다. 바꿀 수 없는 리스트들의 차이는 불변 객체(J9)에서 다룬다'
claims:
  - claim: '빈 `ArrayList`에 11개를 넣으면 안쪽 배열의 길이는 15이고, 16개를 넣으면 22다'
    how: '`ChildJvm`으로 `--add-opens java.base/java.util=ALL-UNNAMED`를 준 자식 JVM에서 `elementData`의 길이를 리플렉션으로 읽는다'
  - claim: '1부터 100만까지 넣는 동안 안쪽 배열은 서른 번 남짓 새로 만들어진다'
    how: '같은 방법으로 넣을 때마다 배열의 길이가 바뀌는 순간을 센다'
  - claim: '`new ArrayList<>(100)`에 100개를 넣으면 배열을 새로 만들지 않는다'
    how: '같은 방법으로 길이가 100에서 바뀌지 않는 것을 본다'
  - claim: '코드 insert는 `[1, 99, 2, 3, 4, 5]`를 출력한다'
    how: '실행해 출력을 본다'
  - claim: '맨 앞에 넣기는 `LinkedList`가 빠르고, 차례로 읽기와 `get(i)`는 `ArrayList`가 같거나 빠르다'
    how: '각 연산의 걸린 시간을 `CiOutput`에 남긴다. 어느 쪽이 빠른지만 보고 배수는 단정하지 않는다'
  - claim: '`LinkedList`를 `get(i)`로 돌면 향상된 `for`보다 훨씬 오래 걸린다'
    how: '원소 1만 개로 두 반복의 걸린 시간을 남긴다'
  - claim: '`Arrays.asList`가 돌려준 리스트에 `add`하면 `UnsupportedOperationException`이 난다'
    how: '예외를 잡아 본다'
sources:
  - '`ArrayList`의 용량과 분할 상환 상수 시간의 `add`: API 문서 https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/ArrayList.html'
  - '`LinkedList`가 양쪽 연결 리스트이고 인덱스 연산은 가까운 끝에서 따라간다는 것: API 문서 https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/LinkedList.html'
  - '배열의 길이가 만들 때 정해진다는 것: 자바 언어 명세 10장 https://docs.oracle.com/javase/specs/jls/se21/html/jls-10.html'
