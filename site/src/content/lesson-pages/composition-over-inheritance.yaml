# 상속보다 조합
# 자료 파일의 칸은 docs/lesson-data-format.md에 있다. 문제는 content/questions/composition-over-inheritance.yaml에 있다.
# 설계서는 2026-11-25에 썼고, 사용자가 이번 작업의 설계서 승인을 미리 맡겼다. 설계 때 채운 칸(says, widget, asks, claims, sources)은 남겨 둔다.
title: 상속보다 조합
description: 상속으로 재사용하면 왜 부모의 내부에 묶이는지, 부모의 메서드를 모두 물려받는 것이 무엇을 깨는지, 조합으로 바꾸면 무엇이 달라지는지, 그래도 상속을 쓰는 때는 언제인지. 네 가지 질문에 스스로 답할 수 있게 장바구니의 적립 포인트 세기로 배우는 대화형 레슨.
minutes: 20
unit: 객체지향 설계와 패턴
roadmap: O6
type: 설계
prerequisites:
  - {slug: lsp-isp, title: 리스코프 치환과 인터페이스 분리 원칙}
assume: '자바 21. 클래스 상속, 오버라이딩, `super`(상속과 다형성 레슨). 자식이 부모 자리에서 약속을 지켜야 한다는 것(리스코프 치환과 인터페이스 분리 원칙 레슨).'
example: '쇼핑몰의 장바구니 `Cart`(상품을 하나씩 넣는 `add`, 여럿을 한 번에 넣는 `addAll`). 담은 상품 수만큼 적립 예정 포인트를 세는 `PointCart`를 상속으로 만들었다가 숫자가 두 배로 나오고, 부모를 고치자 또 틀리는 것을 봐요. 같은 기능을 조합으로 다시 만들어요. JDK의 `Stack`도 함께 봐요.'
intro:
  - '장바구니에 상품 세 개를 한 번에 담았는데 적립 예정 포인트가 여섯 개 몫으로 나왔어요. 자식 클래스는 잘못이 없어 보였어요. 원인은 부모 클래스의 `addAll`이 안에서 `add`를 부르고 있었다는, 부모의 내부 구현이었어요. 몇 달 뒤 누군가 부모의 `addAll`을 빠르게 고치자 이번에는 포인트가 0으로 나왔어요.'
  - '코드를 재사용하려고 `extends`를 쓰는 일은 흔해요. 공통 기능을 `BaseService`에 두고 서비스들이 상속하는 식이에요. 그런데 상속은 부모의 public 메서드를 모두 물려받고, 부모가 자기 메서드를 어떻게 부르는지까지 자식이 알아야 하는 강한 결합이에요. 그래서 "상속보다 조합"이 면접의 단골 질문이에요.'
  - '이 레슨에서는 같은 장바구니를 상속과 조합 두 방식으로 만들고, 부모 클래스를 한 줄 고쳤을 때 어느 쪽이 깨지는지 테스트로 확인해요.'
covers:
  - topic: '상속으로 재사용하면 자식이 부모의 내부 구현(자기 메서드를 어떻게 부르는지)에 기대게 된다'
    where: '질문 1'
  - topic: '취약한 부모 클래스 문제: 부모를 고치면 자식 코드는 그대로인데 동작이 깨진다'
    where: '질문 1'
  - topic: '부모의 public 메서드를 모두 물려받아서 원치 않는 메서드까지 열린다. JDK의 Stack이 Vector를 상속해 중간에 넣을 수 있는 예'
    where: '질문 2'
  - topic: '물려받은 메서드가 자식의 규칙을 깬다. 리스코프 치환 원칙과의 관계'
    where: '질문 2'
  - topic: '조합: 상속 대신 필드로 갖고 필요한 메서드만 위임한다'
    where: '질문 3'
  - topic: '조합은 부모의 public 약속에만 기대서 부모의 내부가 바뀌어도 깨지지 않는다'
    where: '질문 3'
  - topic: '조합은 실행 중에 갖는 객체를 바꿀 수 있다. 인터페이스로 받으면 여러 구현과 함께 쓴다'
    where: '질문 3'
  - topic: '상속을 써도 되는 때: 진짜 is-a 관계이고, 부모가 상속을 위해 설계되고 문서화되었을 때'
    where: '질문 4'
  - topic: '상속을 막는 final 클래스, 상속을 위한 설계(오버라이드할 메서드가 내부에서 불리는지 문서에 적기)'
    where: '질문 4'
  - topic: '조합의 비용: 위임 코드를 써야 한다'
    where: '질문 4'
  - topic: '스프링에서: 공통 기능을 BaseService 상속 대신 주입받는 컴포넌트로 두기, Stack 대신 ArrayDeque'
    where: '실무에서는'
  - topic: '인터페이스 구현(타입 상속)과 클래스 상속(구현 상속)의 차이'
    where: '질문 1의 더 알아보기'
  - topic: '상속으로 뼈대를 두는 템플릿 메서드 패턴'
    where: '다루지 않음: 템플릿 메서드 패턴(O8)'
  - topic: '같은 인터페이스로 감싸 기능을 덧붙이는 데코레이터'
    where: '다루지 않음: 프록시와 데코레이터 패턴(O12)'
links:
  test: https://github.com/wanja727/dev-lessons/blob/main/verification/src/test/java/lab/devlessons/composition/CompositionTest.java
  stackApi: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/Stack.html
  jlsFinal: https://docs.oracle.com/javase/specs/jls/se21/html/jls-8.html#jls-8.1.1.2
codes:
  cart: |-
    class Cart {
      private final List<Item> items =
          new ArrayList<>();

      void add(Item item) {
        items.add(item);
      }

      void addAll(List<Item> list) {
        for (Item i : list) {
          [[add(i)]];
        }
      }
    }
  pointCart: |-
    class PointCart extends Cart {
      private int count = 0;

      @Override
      void add(Item item) {
        count++;
        super.add(item);
      }

      @Override
      void addAll(List<Item> list) {
        count += list.size();
        super.addAll(list);
      }
    }
  cartFast: |-
    void addAll(List<Item> list) {
      items.addAll(list);
    }
  stack: |-
    Stack<String> stack = new Stack<>();
    stack.push("A");
    stack.push("B");
    stack.add(0, "X");
    stack.pop();
    stack.pop();
    stack.pop();
  composed: |-
    class PointCart {
      private final Cart cart;
      private int count = 0;

      PointCart(Cart cart) {
        this.cart = cart;
      }

      void add(Item item) {
        count++;
        cart.add(item);
      }

      void addAll(List<Item> list) {
        count += list.size();
        cart.addAll(list);
      }
    }
  # 여기부터는 본문 단계에서 더한 코드다
  pointCartMark: |-
    class PointCart extends Cart {
      private int count = 0;

      @Override
      void add(Item item) {
        [[count++]];
        super.add(item);
      }

      @Override
      void addAll(List<Item> list) {
        [[count += list.size()]];
        super.addAll(list);
      }
    }
  stackMark: |-
    Stack<String> stack = new Stack<>();
    stack.push("A");
    stack.push("B");
    [[stack.add(0, "X")]];
    stack.pop();
    stack.pop();
    stack.pop();
  composedMark: |-
    class PointCart {
      private final [[Cart cart]];
      private int count = 0;

      PointCart(Cart cart) {
        this.cart = cart;
      }

      void add(Item item) {
        count++;
        [[cart.add(item)]];
      }

      void addAll(List<Item> list) {
        count += list.size();
        [[cart.addAll(list)]];
      }
    }
  finalCart: |-
    public [[final]] class Cart {
      ...
    }
  baseService: |-
    class OrderService extends BaseService {
      void order() {
        Member m = currentMember();
        log("주문 " + m.id());
      }
    }
  helper: |-
    @Component
    class CurrentMember {
      Member get() {...}
    }

    @Service
    class OrderService {
      private final CurrentMember current;

      OrderService(CurrentMember current) {
        this.current = current;
      }
    }
  deque: |-
    Deque<String> deque =
        new ArrayDeque<>();
    deque.push("A");
    deque.push("B");
    deque.pop();
    deque.pop();

    deque.add(0, "X");
predict:
  title: 세 개를 한 번에 담으면 몇 개로 셀까요?
  text: '장바구니 `Cart`의 `addAll`은 안에서 `add`를 하나씩 불러요. 담은 상품 수를 세려고 `PointCart`가 `Cart`를 상속해서 `add`와 `addAll`을 모두 오버라이딩했어요. 상품 세 개를 `addAll`로 한 번에 넣으면 `count`는 얼마일까요? 모르는 게 정상이니 감으로 골라 보세요. 답은 질문 1에 나와요.'
  code: pointCart
  label: 내 예측 (count)
  options:
    - value: c3
      label: '3'
    - value: c6
      label: '6'
    - value: c0
      label: '0'
  answer: c6
  storageKey: composition-predict
  wrong: '"{label}"로 예측했어요. 틀린 예측이 더 오래 남으니 괜찮아요.'
questions:
  - id: q1
    title: 상속으로 코드를 재사용하면 어떤 문제가 생기나요?
    conclusion:
      lead: '자식이 부모의 내부 구현에 기대게 돼요. 부모가 자기 메서드를 어떻게 부르는지에 따라 자식의 결과가 달라져요.'
      sub: '그래서 부모를 고치면 자식 코드는 한 줄도 안 바뀌었는데 동작이 깨져요. 이것을 취약한 부모 클래스 문제라고 해요.'
    says:
      - '예측의 답을 밝힌다. 상품 세 개를 `addAll`하면 `count`는 6이다. 부모 `Cart.addAll`이 안에서 `add(i)`를 부르고, 오버라이딩 때문에 자식의 `add`가 불려 한 번 더 센다'
      - '자식을 쓴 사람은 부모의 `addAll`이 `add`를 부른다는 것을 알아야 맞게 짤 수 있다. 이것은 부모의 공개 약속이 아니라 내부 구현이다'
      - '그럼 자식의 `addAll`에서 세는 줄을 지우면 될까? 그러면 3이 맞게 나온다. 그런데 부모가 코드 cartFast처럼 `items.addAll(list)`로 바뀌면 `add`가 불리지 않아 0이 된다. 자식 코드는 그대로인데 결과가 바뀐다'
      - '취약한 부모 클래스 문제: 부모 클래스의 내부를 고치면 그것을 상속한 클래스가 깨진다. 부모를 고치는 사람은 어떤 자식이 있는지 모르기 쉽다'
      - '더 알아보기: 인터페이스를 구현하는 것은 타입만 물려받아서 이 문제가 없다. 문제는 구현까지 물려받는 클래스 상속에서 생긴다'
    widget:
      kind: steps
      note: '`pointCart.addAll([A, B, C])`를 한 단계씩 실행한다. 단계마다 지금 실행 중인 메서드(자식 addAll, 부모 addAll, 자식 add, 부모 add)와 count 값을 보여 준다. 시나리오를 "부모가 add를 부를 때"와 "부모가 items.addAll로 바뀐 뒤(자식에서 세는 줄을 지운 경우)"로 고른다. 마지막 count가 6과 0으로 나온다'
    asks:
      - '본문의 예시: 코드 pointCart에 `add`로 하나, `addAll`로 둘을 넣으면 `count`는 (1 + 2 + 2 = 5)'
      - '옮긴 상황: 부모 `Logger`의 `logAll(list)`가 안에서 `log(msg)`를 부른다. 자식 `CountingLogger`가 `log`와 `logAll`을 모두 오버라이딩해 센다. `logAll`로 메시지 4개를 넣으면 몇이 세어지나 (8)'
    body:
      - p: '부모 `Cart`는 이렇게 생겼어요. `addAll`이 상품마다 `add`를 불러요.'
      - code: cart
        notes:
          - mark: add(i)
            as: code
            text: '부모가 자기 메서드를 불러요. 그런데 자식이 `add`를 오버라이딩했다면 여기서 불리는 것은 자식의 `add`예요.'
      - code: pointCartMark
        notes:
          - mark: count += list.size()
            as: code
            text: '여기서 3을 더하고, 부모의 `addAll`로 넘어가요.'
          - mark: count++
            as: code
            text: '부모의 `addAll`이 부른 `add`가 이것이라, 상품마다 1을 또 더해요.'
      - p: '아래에서 한 단계씩 실행해 보세요.'
      - widget:
          kind: steps
          layout: [selector, duo, buttons, log, verdict]
          selector:
            label: 경우
            options:
              - {value: both, label: 둘 다 셀 때}
              - {value: changed, label: 세는 줄을 지우고 부모가 바뀐 뒤}
          initial:
            duo:
              - {label: 지금 실행 중, text: 'pointCart.addAll([A, B, C])', state: dim}
              - {label: count, text: '0', state: dim}
          scenarios:
            both:
              - log: '자식 addAll: count += 3'
                duo: [{label: 지금 실행 중, text: 'PointCart.addAll'}, {label: count, rows: [{k: count, v: '3', mark: changed}]}]
              - log: '부모 addAll: for 문에서 add(A)를 부른다'
                duo: [{label: 지금 실행 중, text: 'Cart.addAll'}, {label: count, rows: [{k: count, v: '3'}]}]
              - log: '자식 add(A): count++'
                duo: [{label: 지금 실행 중, text: 'PointCart.add (오버라이딩)'}, {label: count, rows: [{k: count, v: '4', mark: bad}]}]
              - log: '자식 add(B), add(C): count++ 두 번'
                duo: [{label: 지금 실행 중, text: 'PointCart.add'}, {label: count, rows: [{k: count, v: '6', mark: bad}]}]
                verdict: '부모가 안에서 add를 부른다는 내부 구현 때문에 두 번 셌어요.'
            changed:
              - log: '자식은 add에서만 센다. 부모 addAll은 items.addAll(list)로 바뀌었다'
                duo: [{label: 지금 실행 중, text: 'Cart.addAll (자식이 오버라이딩하지 않음)'}, {label: count, rows: [{k: count, v: '0'}]}]
              - log: '부모 addAll: items.addAll([A, B, C]). add는 불리지 않는다'
                duo: [{label: 지금 실행 중, text: 'ArrayList.addAll'}, {label: count, rows: [{k: count, v: '0', mark: bad}]}]
                verdict: '자식 코드는 한 줄도 안 바뀌었는데 0이 나와요.'
      - ci:
          key: inherit
          label: 실제로 돌린 결과 보기
          source: CompositionTest.inheritanceDependsOnParentInternals
      - p: '처음에 예측한 답은 **6**이에요. 자식의 `addAll`이 3을 더하고, 부모의 `addAll`이 부른 `add`가 자식의 것이라 3을 또 더해요. {{predict-result}}'
      - p: '그럼 자식의 `addAll`에서 세는 줄을 지우면 될까요? 그러면 3이 맞게 나와요. 그런데 누군가 부모를 빠르게 하려고 `addAll`을 `items.addAll(list)`로 바꾸면 `add`가 불리지 않아 **0**이 나와요.'
      - code: cartFast
      - p: '자식을 맞게 짜려면 "부모의 `addAll`이 안에서 `add`를 부르는가"를 알아야 해요. 이것은 부모가 밖에 약속한 것이 아니라 **내부 구현**이에요. 그래서 부모의 내부를 고치면 자식 코드는 그대로인데 동작이 깨져요. 이것을 **취약한 부모 클래스 문제**라고 해요. 부모를 고치는 사람은 어떤 자식이 있는지 모르기 쉬워요.'
      - more:
          summary: 인터페이스를 구현하는 것도 같은 문제가 있나요?
          body:
            - p: '아니요. 인터페이스 구현은 타입(메서드 목록)만 물려받고 구현 코드는 물려받지 않아요. 문제는 구현까지 물려받는 **클래스 상속**에서 생겨요. 객체지향의 네 가지 특징 레슨에서 쓴 상속이 인터페이스 구현이었던 이유예요.'
      - quiz:
          q: '부모 `Logger`의 `logAll(list)`가 안에서 `log(msg)`를 불러요. 자식 `CountingLogger`가 `log`와 `logAll`을 모두 오버라이딩해서 메시지 수를 세요. `logAll`로 메시지 4개를 넣으면 몇이 세어질까요?'
          options:
            - '4'
            - '8'
            - '0'
          answer: 2
          explain: '자식의 `logAll`이 4를 더하고, 부모의 `logAll`이 부른 `log`가 자식의 것이라 4를 또 더해요.'
      - next: '부모의 내부에 묶이는 것 말고, 상속이 만드는 문제가 또 있을까요?'
    recall: '자식이 부모의 내부 구현에 기대게 돼요. 부모 `Cart.addAll`이 안에서 `add`를 부르면, 두 메서드를 오버라이딩해 센 자식은 세 개를 넣고 6을 세요. 세는 줄을 지워 맞춰 놓아도, 부모가 `items.addAll`로 바뀌면 자식 코드는 그대로인데 0이 나와요. 부모를 고치면 자식이 깨지는 이 문제를 취약한 부모 클래스 문제라고 해요.'
  - id: q2
    title: 부모의 메서드를 모두 물려받으면 무엇이 문제인가요?
    conclusion:
      lead: '자식에게 맞지 않는 메서드까지 열려서, 자식의 규칙을 깨는 호출을 막을 수 없어요.'
      sub: 'JDK의 `Stack`은 `Vector`를 상속해서 `add(0, x)`로 맨 아래에 끼워 넣을 수 있어요. 스택의 "마지막에 넣은 것이 먼저 나온다"가 깨져요.'
    says:
      - '`Stack`은 `Vector`를 상속한다. 그래서 `push`와 `pop`뿐 아니라 `Vector`의 `add(int, E)`, `remove(int)`, `get(int)`도 쓸 수 있다'
      - '코드 stack에서 A, B를 넣고 `add(0, "X")`로 맨 아래에 X를 넣은 뒤 셋을 꺼내면 B, A, X가 나온다. 넣은 순서의 반대(X, B, A)가 아니다'
      - '스택의 규칙은 `Stack`이 지켜야 하는데, 물려받은 메서드가 그 규칙을 건너뛰는 길을 낸다. 객체지향의 네 가지 특징에서 본 캡슐화가 깨진 것이다'
      - '부모 타입으로 쓰면 리스코프 치환 원칙 문제도 생긴다. `Vector`를 받는 코드는 아무 자리에나 넣어도 된다고 믿지만, 스택에서는 그러면 안 된다'
      - '`Stack`의 API 문서는 스택이 필요하면 `Deque`를 쓰라고 한다'
    asks:
      - '본문의 예시: 코드 stack에서 마지막 `pop()` 셋이 꺼내는 순서 (B, A, X)'
      - '옮긴 상황: `class Members extends ArrayList<Member>`로 회원 목록을 만들고 "같은 이메일은 두 번 넣지 않는다"를 `add`를 오버라이딩해 지켰다. `addAll`이나 `set(0, m)`은 오버라이딩하지 않았다. `set(0, 같은 이메일 회원)`을 하면 규칙이 지켜지나 (아니다. 물려받은 `set`은 검사하지 않는다)'
    body:
      - p: '클래스를 상속하면 부모의 **public 메서드를 모두** 물려받아요. 자식에게 맞지 않는 메서드도요. JDK에 그런 예가 있어요. `Stack`은 `Vector`를 상속해요.'
      - code: stackMark
        notes:
          - mark: stack.add(0, "X")
            as: code
            text: '`Vector`에서 물려받은 메서드예요. 맨 아래(0번 자리)에 끼워 넣어요.'
      - ci:
          key: stack
          label: 실제로 꺼낸 순서 보기
          source: CompositionTest.stackInheritsVector
      - p: '스택은 "마지막에 넣은 것이 먼저 나온다"는 규칙을 지켜야 해요. 그런데 물려받은 `add(int, E)`가 그 규칙을 건너뛰는 길을 냈어요. X는 가장 나중에 넣었는데 가장 나중에 나와요. [객체지향의 네 가지 특징](lesson:oop-four-pillars)에서 본 캡슐화가 깨진 거예요.'
      - p: '부모 타입으로 쓰면 [리스코프 치환 원칙](lesson:lsp-isp) 문제도 생겨요. `Vector`를 받는 코드는 아무 자리에나 넣어도 된다고 믿지만, 그 자리에 스택이 오면 스택의 규칙이 깨져요.'
      - p: '`Stack`의 API 문서도 스택이 필요하면 `Deque`를 쓰라고 해요([Stack API 문서](link:stackApi)).'
      - quiz:
          q: '`class Members extends ArrayList<Member>`를 만들고 "같은 이메일은 두 번 넣지 않는다"를 `add`를 오버라이딩해 지켰어요. `set`은 오버라이딩하지 않았어요. `members.set(0, 같은 이메일 회원)`을 하면 규칙이 지켜질까요?'
          options:
            - 지켜진다. add에서 검사한다
            - 지켜지지 않는다. 물려받은 set은 검사하지 않는다
          answer: 2
          explain: '자식이 오버라이딩하지 않은 메서드는 부모의 것이 그대로 쓰여요. `set`, `addAll`, `add(int, E)` 모두 규칙을 건너뛰는 길이에요.'
      - next: '부모를 상속하지 않고 그 기능을 쓰는 방법은 없을까요?'
    recall: '자식에게 맞지 않는 메서드까지 열려서, 자식의 규칙을 깨는 호출을 막을 수 없어요. `Stack`은 `Vector`를 상속해서 `add(0, x)`로 맨 아래에 끼워 넣을 수 있고, A, B를 넣고 X를 맨 아래에 넣으면 B, A, X 순서로 나와요. "마지막에 넣은 것이 먼저"라는 규칙이 깨져요.'
  - id: q3
    title: 조합으로 바꾸면 무엇이 달라지나요?
    conclusion:
      lead: '부모를 상속하지 않고 필드로 갖고, 필요한 메서드만 그 필드에게 넘겨요(위임). 그러면 부모의 공개 약속에만 기대요.'
      sub: '`Cart`의 `addAll`이 안에서 `add`를 부르든 안 부르든 조합한 `PointCart`의 `count`는 3이에요.'
    says:
      - '코드 composed는 `Cart`를 필드로 갖고 `add`와 `addAll`을 위임한다. `cart.addAll()`이 안에서 `cart.add()`를 불러도 그것은 `Cart`의 `add`라서 `PointCart`가 다시 세지 않는다'
      - '`Cart`를 코드 cartFast로 바꿔도 `count`는 3이다. 테스트로 `Cart` 두 버전에 상속판과 조합판을 각각 돌려 네 결과를 비교한다'
      - '조합한 클래스는 연 메서드만 밖에 보인다. `PointCart`에는 `Cart`의 다른 메서드가 열리지 않는다. 스택을 조합으로 만들면 `add(0, x)`가 없다'
      - '필드의 타입을 인터페이스로 두면 실행 중에 다른 구현을 넣을 수 있다. 상속은 컴파일할 때 부모가 정해진다'
      - '조합은 "has-a"(가지고 있다), 상속은 "is-a"(이다)다'
    widget:
      kind: compare
      note: '왼쪽 칸은 상속판 PointCart, 오른쪽 칸은 조합판 PointCart다. 버튼(Cart.addAll을 items.addAll로 바꾸기)을 고르면 양쪽 칸 아래에 `addAll([A, B, C])` 뒤의 count가 나온다. 바꾸기 전 상속판 6, 조합판 3. 바꾼 뒤 상속판(세는 줄을 지운 판) 0, 조합판 3. 양쪽 모두 PointCart 파일은 고치지 않았다고 표시한다'
    asks:
      - '본문의 예시: 코드 composed로 `addAll([A, B, C])`를 하면 `Cart`가 어느 버전이든 `count`는 (3)'
      - '옮긴 상황: 질문 2의 회원 목록을 `ArrayList`를 필드로 가진 `Members`로 바꾸고 `add`와 `size`만 열었다. 밖에서 `set(0, m)`을 부를 수 있나 (없다. 컴파일 오류)'
    body:
      - p: '**조합**은 부모를 상속하는 대신 **필드로 갖고**, 필요한 메서드만 그 필드에게 넘기는(위임하는) 방식이에요.'
      - code: composedMark
        notes:
          - mark: Cart cart
            as: code
            text: '상속하지 않고 필드로 가져요. "PointCart는 Cart다"가 아니라 "PointCart는 Cart를 가진다"예요.'
          - mark: cart.addAll(list)
            as: code
            text: '`Cart`의 `addAll`이 안에서 `add`를 불러도 그것은 `Cart`의 `add`예요. `PointCart`가 다시 세지 않아요.'
      - p: '`Cart`의 두 판(안에서 `add`를 부르는 판, `items.addAll`로 바꾼 판)에 조합판을 각각 돌려 봤어요.'
      - ci:
          key: composed
          label: 실제로 돌린 결과 보기
          source: CompositionTest.compositionIgnoresInternals
      - p: '어느 판이든 3이에요. 조합한 `PointCart`는 `Cart`의 **공개 약속**(`add`는 하나를, `addAll`은 여럿을 담는다)에만 기대고, `Cart`가 안에서 어떻게 일하는지는 몰라도 돼요.'
      - p: '아래에서 부모를 바꿔 보세요.'
      - widget:
          kind: compare
          layout: [sides, buttons, verdict]
          run: {label: Cart.addAll을 items.addAll로 바꾸기}
          sides:
            - label: 상속판 PointCart
              items:
                - {name: Cart, note: 부모}
                - {name: PointCart, note: extends Cart, add에서만 센다}
            - label: 조합판 PointCart
              items:
                - {name: Cart, note: 필드로 가진다}
                - {name: PointCart, note: add와 addAll에서 센다}
          initial:
            sides:
              - result: [{k: 'addAll([A, B, C]) 뒤 count', v: '3'}]
              - result: [{k: 'addAll([A, B, C]) 뒤 count', v: '3'}]
            verdict: 지금은 둘 다 3이에요.
          scenes:
            default:
              sides:
                - marks: [{name: Cart, tag: 고침}]
                  result: [{k: 'addAll([A, B, C]) 뒤 count', v: '0', mark: bad}, {k: PointCart 파일, v: 그대로}]
                - marks: [{name: Cart, tag: 고침}]
                  result: [{k: 'addAll([A, B, C]) 뒤 count', v: '3'}, {k: PointCart 파일, v: 그대로}]
              verdict: 부모의 내부만 바꿨는데 상속판만 틀려요.
      - h3: 열지 않은 메서드는 밖에 보이지 않아요
      - p: '조합한 클래스는 직접 연 메서드만 밖에 보여요. 질문 2의 회원 목록을 `ArrayList`를 필드로 갖는 `Members`로 바꾸고 `add`와 `size`만 열면, 밖에서 `set`을 부르는 코드는 컴파일되지 않아요. 규칙을 건너뛰는 길이 처음부터 없어요.'
      - p: '필드의 타입을 인터페이스로 두면 **실행 중에** 다른 구현을 넣을 수도 있어요. 상속은 컴파일할 때 부모가 정해져서 바꿀 수 없어요.'
      - quiz:
          q: '조합한 `PointCart`(Cart를 필드로 갖고 위임)에 `addAll([A, B, C])`를 하면, `Cart.addAll`이 안에서 `add`를 부르는 판과 `items.addAll`로 바꾼 판에서 `count`는 각각 얼마일까요?'
          options:
            - 6과 0
            - 3과 3
            - 3과 0
          answer: 2
          explain: '조합판은 `Cart`의 공개 메서드만 부르고, `Cart` 안에서 무엇을 부르든 다시 세지 않아요.'
      - next: '그러면 상속은 아예 쓰지 말아야 할까요?'
    recall: '부모를 상속하지 않고 필드로 갖고, 필요한 메서드만 그 필드에게 넘겨요(위임). 그러면 부모의 공개 약속에만 기대서, `Cart.addAll`이 안에서 `add`를 부르든 `items.addAll`로 바뀌든 조합한 `PointCart`의 `count`는 3이에요. 연 메서드만 밖에 보이고, 필드를 인터페이스로 두면 실행 중에 다른 구현을 넣을 수도 있어요.'
  - id: q4
    title: 그러면 상속은 언제 쓰나요?
    conclusion:
      lead: '자식이 정말 부모의 한 종류이고(is-a), 부모가 상속을 위해 설계되고 문서화되었을 때 써요.'
      sub: '그 밖에는 조합이 기본이에요. 조합의 비용은 위임 메서드를 직접 써야 한다는 것이에요.'
    says:
      - '상속을 써도 되는 조건 둘: 자식이 모든 자리에서 부모를 대신할 수 있다(리스코프 치환 원칙). 부모가 상속받을 것을 알고 만들어졌다'
      - '상속을 위해 설계한 부모는 오버라이드해도 되는 메서드를 정하고, 그 메서드가 부모 안에서 언제 불리는지 문서에 적는다. 다음 레슨들의 템플릿 메서드 패턴(O8)이 이 모양이다'
      - '상속을 위한 설계가 아니면 `final` 클래스로 막는다. `String`과 `Integer`는 `final`이다'
      - '조합의 비용: 열 메서드마다 위임 코드를 쓴다. 메서드가 많으면 길어진다. 그래도 부모의 내부에 묶이는 것보다 낫다'
      - '판단 질문: "자식이 부모의 모든 public 메서드를 그대로 열어도 괜찮은가?" 아니면 조합이다'
    asks:
      - '본문의 예시: `Cart`의 작성자가 `PointCart` 같은 상속을 막으려면 무엇을 하면 되나 (`final class Cart`)'
      - '옮긴 상황: 다음 가운데 클래스 상속이 맞는 경우는? 보기: `Stack`이 `Vector`를 재사용하려고 / 추상 클래스 `PaymentProcessor`가 "이 단계만 오버라이드하라"고 문서화한 것을 구현할 때 / 서비스들이 로깅 헬퍼를 쓰려고 `BaseService`를 상속할 때 (둘째)'
    body:
      - p: '상속을 써도 되는 조건은 둘이에요.'
      - ol:
          - '자식이 정말 부모의 한 종류라서 **모든 자리에서 부모를 대신할 수 있다**(리스코프 치환 원칙). `Stack`은 `Vector`의 자리를 대신할 수 없었어요.'
          - '부모가 **상속받을 것을 알고 만들어졌다.** 오버라이드해도 되는 메서드를 정하고, 그 메서드가 부모 안에서 언제 불리는지 문서에 적어 둔 부모예요.'
      - p: '두 번째 조건을 지킨 부모가 템플릿 메서드 패턴의 추상 클래스예요. "이 단계만 오버라이드하세요"라고 정해 두는 모양이고, 템플릿 메서드 패턴 레슨에서 다뤄요.'
      - p: '상속을 위해 만든 클래스가 아니라면 `final`로 막아요. `String`과 `Integer`가 `final` 클래스예요([자바 언어 명세 8.1.1.2](link:jlsFinal)).'
      - code: finalCart
      - h3: 조합의 비용
      - p: '조합은 열 메서드마다 위임 코드를 직접 써야 해요. 메서드가 많으면 길어져요. 그래도 부모의 내부에 묶여 언제 깨질지 모르는 것보다 나아요.'
      - callout: '**판단 질문: "자식이 부모의 모든 public 메서드를 그대로 열어도 괜찮은가?"** 아니라면 조합이에요.'
      - quiz:
          q: '다음 가운데 클래스 상속이 맞는 경우는 무엇일까요?'
          options:
            - Stack이 Vector의 저장 기능을 재사용하려고
            - 추상 클래스가 "이 단계만 오버라이드하라"고 문서화해 둔 것을 구현할 때
            - 서비스들이 로깅 헬퍼를 쓰려고 BaseService를 상속할 때
          answer: 2
          explain: '상속을 위해 설계되고 문서화된 부모를 구현하는 경우예요. 나머지는 재사용만을 위한 상속이라 조합이 나아요.'
    recall: '자식이 정말 부모의 한 종류라서 모든 자리에서 부모를 대신할 수 있고, 부모가 상속받을 것을 알고 만들어져 오버라이드할 메서드와 그 메서드가 불리는 때를 문서로 정해 두었을 때 써요. 그 밖에는 조합이 기본이고, 상속을 위한 클래스가 아니면 `final`로 막아요. 조합의 비용은 위임 메서드를 직접 써야 한다는 것이에요.'
practice:
  title: 공통 기능은 상속 대신 주입받으세요
  says:
    - '흔한 실수: 여러 서비스가 공통 헬퍼(현재 로그인 회원 꺼내기, 공통 로깅)를 쓰려고 `extends BaseService`를 한다. `BaseService`의 메서드가 바뀌면 모든 서비스가 영향을 받고, 자바는 클래스 상속이 하나뿐이라 다른 부모를 둘 수 없다. 고친 코드: 헬퍼를 `@Component`로 만들고 필요한 서비스가 생성자로 주입받는다. 주입은 의존 역전 원칙과 의존성 주입(O5)에서 본 것과 같다'
    - '`Stack` 대신 `ArrayDeque`를 `Deque` 타입으로 쓴다. `push`와 `pop`이 같고, 중간에 끼워 넣는 메서드가 없다. API 문서가 근거이고, 같은 순서로 넣고 꺼내 결과를 테스트로 확인한다'
  body:
    - p: '스프링 서비스에서 흔한 상속은 공통 헬퍼를 쓰려는 상속이에요. 현재 로그인한 회원 꺼내기, 공통 로그 남기기를 `BaseService`에 두고 서비스들이 상속해요.'
    - code: baseService
    - p: '이 코드는 질문 1과 2의 문제를 그대로 가져요. `BaseService`의 메서드가 바뀌면 모든 서비스가 영향을 받고, 서비스가 쓰지 않는 메서드까지 물려받아요. 자바는 클래스 상속이 하나뿐이라, 다른 부모가 필요해지면 둘 수도 없어요.'
    - p: '고친 코드는 헬퍼를 `@Component`로 만들고 필요한 서비스가 생성자로 받는 거예요. 의존 역전 원칙과 의존성 주입 레슨에서 본 주입과 같아요.'
    - code: helper
    - h3: Stack 대신 ArrayDeque
    - p: '스택이 필요하면 `Deque` 타입의 `ArrayDeque`를 써요. `push`와 `pop`이 같고, 중간에 끼워 넣는 메서드가 없어요.'
    - ci:
        key: deque
        label: 실제로 돌리고 컴파일한 결과 보기
        source: CompositionTest.dequeHasNoInsertAt
        code: deque
    - p: '`add(0, "X")`는 `Deque`에 없어서 컴파일되지 않아요. 스택의 규칙을 건너뛰는 길이 처음부터 막혀 있어요.'
interview:
  question: 상속보다 조합을 쓰라는 이유를 설명해 주세요
  model:
    - label: 정의
      text: 상속은 부모 클래스의 구현을 물려받는 것이고, 조합은 다른 객체를 필드로 갖고 필요한 메서드만 그 객체에 위임하는 것입니다.
    - label: 원리
      text: 상속한 자식은 부모가 자기 메서드를 어떻게 부르는지 같은 내부 구현에 기댑니다. 부모의 addAll이 안에서 add를 부르면 두 메서드를 오버라이딩해 센 자식은 두 번 세고, 부모를 고치면 자식 코드는 그대로인데 결과가 바뀝니다. 또 부모의 public 메서드를 모두 물려받아서, Stack이 Vector의 add(0, x)로 스택 규칙을 깨는 것처럼 자식의 규칙을 건너뛰는 길이 생깁니다. 조합은 부모의 공개 약속에만 기대고 연 메서드만 보여 줍니다.
    - label: 주의할 점
      text: 자식이 모든 자리에서 부모를 대신할 수 있고 부모가 상속을 위해 설계되고 문서화되었다면 상속을 씁니다. 그렇지 않은 클래스는 final로 막습니다. 조합은 위임 코드를 써야 하는 비용이 있습니다.
    - label: 경험
      text: '(내 프로젝트로 채우기) 예: 서비스들이 상속하던 BaseService의 헬퍼를 컴포넌트로 빼서 생성자로 주입받게 바꿨습니다.'
verified: '이 레슨의 count, 꺼낸 순서, 컴파일 오류는 짐작이 아니라 자바 21에서 코드를 돌리고 컴파일해 받은 값이에요. 코드가 바뀔 때마다 테스트([CompositionTest](link:test))가 다시 돌아요.'
footer: '근거: `Stack`과 `Deque` 권장은 [Stack API 문서](link:stackApi), final 클래스는 [자바 언어 명세 8.1.1.2](link:jlsFinal). 결과는 OpenJDK 21에서 테스트로 확인했어요. 오류는 [GitHub 이슈](https://github.com/wanja727/dev-lessons/issues)로 알려 주세요.'
claims:
  - claim: '코드 pointCart에 `addAll`로 셋을 넣으면 `count`는 6이다'
    how: '돌려서 확인한다'
    test: CompositionTest.inheritanceDependsOnParentInternals
  - claim: '자식에서 세는 줄을 지우고 부모를 코드 cartFast로 바꾸면 `count`는 0이다'
    how: '`Cart` 두 버전을 패키지로 나눠 돌린다'
    test: CompositionTest.inheritanceDependsOnParentInternals
  - claim: '코드 composed는 `Cart`의 두 버전 모두에서 3이다'
    how: '같은 두 패키지로 돌린다'
    test: CompositionTest.compositionIgnoresInternals
  - claim: '코드 stack의 `pop` 셋은 B, A, X 순서다'
    how: '돌려서 확인한다'
    test: CompositionTest.stackInheritsVector
  - claim: '`ArrayDeque`에 A, B를 `push`하면 B, A 순서로 나오고 `add(0, x)` 같은 메서드가 `Deque`에 없다'
    how: '돌리고 `JavaSource`로 `deque.add(0, "X")`를 컴파일해 오류를 본다'
    test: CompositionTest.dequeHasNoInsertAt
  - claim: '조합한 `Members`에서 `set`을 부르면 컴파일 오류다'
    how: '`JavaSource`로 컴파일한다'
    test: CompositionTest.composedMembersHidesSet
sources:
  - '`Stack`과 `Deque` 권장: API 문서 https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/Stack.html'
  - 'final 클래스: 자바 언어 명세 8.1.1.2 https://docs.oracle.com/javase/specs/jls/se21/html/jls-8.html#jls-8.1.1.2'
