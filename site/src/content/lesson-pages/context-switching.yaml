# 컨텍스트 스위칭 (설계서)
# 자료 파일의 칸은 docs/lesson-data-format.md에 있다.
stage: design
title: 컨텍스트 스위칭
unit: 운영체제와 동시성
roadmap: C2
type: 개념 설명
prerequisites:
  - {slug: process-and-thread, title: 프로세스와 스레드}
assume: '자바 21(OpenJDK). 스레드는 스택과 실행 위치를 따로 가진다는 것, `start()`와 `join()`(프로세스와 스레드 레슨). CPU 코어가 명령을 하나씩 실행한다는 것.'
example: '코어가 몇 개인 기계에서 일을 하는 스레드 여럿. 계산만 하는 일과 기다리기만 하는 일을 스레드 수를 바꿔 가며 돌려 시간을 재요. 실무 구역에서는 톰캣의 스레드 200개와 계산 작업용 풀의 크기로 옮겨요.'
intro:
  - '코어 4개짜리 서버에서 이미지 변환 작업이 느려서 스레드를 4개에서 100개로 늘렸어요. 그런데 빨라지기는커녕 조금 더 느려졌어요. 같은 서버의 톰캣은 스레드 200개로 요청을 잘 처리하고 있는데 말이에요.'
  - '자바 개발자는 스레드 수를 정하는 자리를 자주 만나요. 톰캣의 최대 스레드, `@Async`와 작업 풀의 크기, 배치의 병렬 수가 다 그래요. CPU가 스레드를 어떻게 번갈아 돌리는지, 바꿀 때 무엇을 치르는지를 알아야 숫자를 고를 근거가 생겨요.'
  - '이 레슨에서는 코어보다 많은 스레드가 어떻게 함께 진행되는지 보고, 스레드 둘이 서로에게 일을 넘기는 비용을 재고, 계산만 하는 일과 기다리는 일에서 스레드를 늘린 결과를 비교해요.'
covers:
  - topic: '코어 하나는 한 순간에 스레드 하나만 실행한다. 스케줄러가 짧은 시간(타임 슬라이스)씩 번갈아 실행해 동시에 도는 것처럼 보인다'
    where: '질문 1'
  - topic: '동시성(번갈아 진행)과 병렬성(여러 코어에서 정말로 함께 실행)의 차이'
    where: '질문 1'
  - topic: '`Runtime.availableProcessors()`로 코어 수를 읽는다'
    where: '질문 1'
  - topic: '스레드의 상태: 실행 중, 실행을 기다림, 무언가를 기다림(대기). 기다리는 스레드는 CPU를 쓰지 않는다'
    where: '질문 1'
  - topic: '컨텍스트 스위칭: 실행하던 스레드의 레지스터와 실행 위치를 저장하고 다음 스레드의 것을 불러오는 일. 커널(운영체제)이 한다'
    where: '질문 2'
  - topic: '언제 일어나나: 타임 슬라이스가 끝날 때, 입출력이나 락을 기다릴 때(스스로 내려놓음), 더 급한 스레드가 깨어날 때'
    where: '질문 2'
  - topic: '스레드 전환과 프로세스 전환: 프로세스를 바꾸면 메모리 주소 공간도 바꿔야 해서 더 비싸다'
    where: '질문 2. 주소 공간은 가상 메모리(C10)'
  - topic: '비용: 직접 비용(저장과 복원, 커널로 들어가기)과 간접 비용(캐시가 식음). 마이크로초 단위'
    where: '질문 3'
  - topic: '스레드 하나마다 스택 메모리를 쓴다'
    where: '질문 3. 크기는 JVM 메모리 구조(J14)'
  - topic: '계산만 하는 일(CPU 중심)은 코어 수보다 스레드를 늘려도 빨라지지 않는다. 기다리는 일(입출력 중심)은 기다리는 동안 다른 스레드가 코어를 쓰니 스레드를 늘리면 빨라진다'
    where: '질문 4'
  - topic: '스레드 수의 출발점: CPU 중심은 코어 수, 입출력 중심은 기다리는 비율만큼 더'
    where: '질문 4, 실무에서는. 크기를 정하는 법은 스레드 풀과 커넥션 풀 크기(A11)'
  - topic: '사용자 모드와 커널 모드, 시스템 콜의 비용'
    where: '다루지 않음: 사용자 모드와 커널 모드(C11)'
  - topic: '스케줄링 알고리즘(라운드 로빈, 우선순위)'
    where: '질문 1의 더 알아보기'
  - topic: '전환 없이 많은 기다림을 처리하는 방법'
    where: '다루지 않음: 동기와 비동기, 블로킹과 논블로킹(C9), 가상 스레드(C12)'
codes:
  predict: |-
    // 코어 4개인 기계
    // 계산만 하는 작업 8개
    var pool4 = Executors
        .newFixedThreadPool(4);
    var pool64 = Executors
        .newFixedThreadPool(64);
    // 같은 8개를 두 풀로 돌려 시간을 잰다
  cores: |-
    int cores = Runtime.getRuntime()
        .availableProcessors();
  pingPong: |-
    var ping = new SynchronousQueue<Integer>();
    var pong = new SynchronousQueue<Integer>();
    // 스레드 A: ping.put(i); pong.take();
    // 스레드 B: ping.take(); pong.put(i);
    // 10만 번 주고받는다
  cpuTask: |-
    long work() {
      long x = 0;
      for (int i = 0; i < 50_000_000; i++)
        x += i % 7;
      return x;
    }
  ioTask: |-
    void waitForDb() throws Exception {
      Thread.sleep(100);
    }
predict:
  text: '코어 4개인 기계에서 계산만 하는 작업 8개를, 스레드 4개짜리 풀과 64개짜리 풀로 각각 돌려요. 64개짜리 풀은 얼마나 빠를까요? 보기: 16배쯤 빠르다 / 거의 같거나 조금 느리다 / 2배쯤 빠르다'
  answer: '거의 같거나 조금 느리다. 코어가 4개라 한 순간에 4개만 실행된다. 질문 4에서 밝힌다.'
questions:
  - id: q1
    title: 코어보다 스레드가 많으면 어떻게 모두 실행되나요?
    conclusion:
      lead: '운영체제의 스케줄러가 스레드들을 아주 짧은 시간씩 번갈아 코어에 올려서, 모두 조금씩 진행되게 해요.'
      sub: '한 코어는 한 순간에 스레드 하나만 실행해요. 번갈아 진행하는 것이 동시성이고, 여러 코어에서 정말로 함께 실행하는 것이 병렬성이에요.'
    says:
      - '코드 cores로 이 기계의 코어 수를 읽는다. CI 기계의 값을 실제 출력으로 보인다'
      - '코어 하나는 한 순간에 스레드 하나의 명령만 실행한다. 스레드가 코어보다 많으면 스케줄러가 몇 밀리초 단위의 시간(타임 슬라이스)씩 번갈아 실행한다. 사람 눈에는 모두 동시에 도는 것처럼 보인다'
      - '코어 수의 네 배만큼 계산 스레드를 띄우고 잠깐 뒤에 각 스레드가 얼마나 진행했는지 본다. 모든 스레드가 0보다 크다. 번갈아 실행된 것이다'
      - '동시성(concurrency)은 여러 일이 번갈아 진행되는 것이고, 병렬성(parallelism)은 여러 코어에서 같은 순간에 실행되는 것이다. 코어가 하나여도 동시성은 있다'
      - '스레드의 상태는 크게 셋이다: 코어에서 실행 중, 실행할 준비가 되어 차례를 기다림, 무언가(입출력, 락, sleep)를 기다림. 셋째 상태의 스레드는 차례를 받지 않아 CPU를 쓰지 않는다. 자바의 `Thread.State`로 `RUNNABLE`, `WAITING`, `TIMED_WAITING`, `BLOCKED`가 보인다'
      - '더 알아보기: 차례를 정하는 방법(스케줄링)에는 돌아가며 같은 시간을 주는 라운드 로빈, 급한 것을 먼저 주는 우선순위 방식이 있다. 리눅스는 실행한 시간이 적은 스레드에 먼저 준다. 자바의 스레드 우선순위는 힌트일 뿐이다'
    asks:
      - '본문의 예시: 코어 2개인 기계에서 계산 스레드 8개를 띄웠다. 한 순간에 실제로 코어에서 실행되는 스레드는 최대 몇 개인가 (2개)'
      - '옮긴 상황: 스레드 200개 가운데 190개가 DB의 응답을 기다리는 중이다(코어 8개). CPU를 차지하려고 다투는 스레드는 대략 몇 개인가 (10개 이하. 기다리는 스레드는 차례를 받지 않는다)'
  - id: q2
    title: 컨텍스트 스위칭은 무엇을 바꾸고 언제 일어나나요?
    conclusion:
      lead: '코어에서 실행하던 스레드의 레지스터와 실행 위치를 저장하고, 다음 스레드의 것을 불러와 이어서 실행하는 일이에요.'
      sub: '타임 슬라이스가 끝날 때, 스레드가 입출력이나 락을 기다리며 코어를 내려놓을 때 일어나요. 프로세스를 바꿀 때는 메모리 주소 공간까지 바꿔서 더 비싸요.'
    says:
      - '스레드가 코어에서 실행되는 동안 코어의 레지스터에는 그 스레드의 계산 중인 값, 다음에 실행할 명령의 위치(PC), 스택의 꼭대기 위치가 들어 있다. 이것이 그 스레드의 문맥(context)이다'
      - '바꿀 때 커널이 하는 일: 지금 스레드의 레지스터를 메모리에 저장한다, 다음 스레드를 고른다, 그 스레드의 저장된 레지스터를 불러온다. 다음 스레드는 멈췄던 곳에서 이어서 실행한다'
      - '일어나는 때: 타임 슬라이스를 다 썼을 때(빼앗김), 스레드가 `sleep`, 입출력, 락, `take()`처럼 기다리는 일을 만나 스스로 내려놓을 때, 더 급한 스레드가 깨어날 때'
      - '같은 프로세스의 스레드끼리 바꾸면 메모리 공간은 그대로다. 다른 프로세스의 스레드로 바꾸면 주소 공간(어느 가상 주소가 어느 실제 메모리인지의 표)까지 바꿔서 더 비싸다(C10)'
    widget:
      kind: steps
      note: '코어 하나와 스레드 A, B. duo의 왼쪽은 코어의 레지스터(PC, 계산 값), 오른쪽은 메모리에 저장된 각 스레드의 문맥. 단계: A 실행 중(PC=12), 타임 슬라이스 끝, A의 문맥 저장, B의 문맥 불러오기(PC=40), B 실행, B가 입출력을 기다리며 내려놓음, A의 문맥 불러와 PC=12에서 이어 실행'
    asks:
      - '본문의 예시: 스레드 A가 코어에서 내려온 뒤 다시 올라오면 어디서부터 실행하나 (저장해 둔 실행 위치. 멈췄던 곳에서 이어서)'
      - '옮긴 상황: 스레드 A가 `Thread.sleep(1000)`을 불렀다. 타임 슬라이스가 남았어도 컨텍스트 스위칭이 일어나나 (일어난다. 기다리는 동안 코어를 내려놓는다)'
  - id: q3
    title: 컨텍스트 스위칭은 왜 비용이 드나요?
    conclusion:
      lead: '바꾸는 동안에는 아무도 일을 하지 않고, 바꾼 뒤에는 새 스레드의 데이터가 CPU 캐시에 없어 한동안 느리게 돌기 때문이에요.'
      sub: '한 번에 마이크로초 단위라 작아 보이지만, 스레드끼리 일을 자주 주고받으면 실제 일보다 전환에 시간을 더 쓰게 돼요.'
    says:
      - '직접 비용: 레지스터 저장과 복원, 커널로 들어가고 나오기, 다음 스레드 고르기. 이 동안 코어는 사용자의 코드를 실행하지 않는다'
      - '간접 비용: CPU 캐시에는 방금 돌던 스레드의 데이터가 있다. 새 스레드의 데이터는 메모리에서 다시 읽어야 해서 바꾼 직후 한동안 느리다'
      - '코드 pingPong. 스레드 둘이 값을 하나씩 주고받기를 10만 번 한다. 주고받을 때마다 한쪽이 기다리다 깨어나야 해서 전환이 생긴다. 같은 10만 번의 덧셈을 한 스레드에서 하는 시간과 나란히 보인다. 주고받기 한 번에 몇 마이크로초가 든다'
      - '스레드 하나는 스택 메모리도 쓴다(J14). 스레드가 많을수록 메모리도 쓰고 전환할 후보도 많아진다'
    asks:
      - '본문의 예시: 두 스레드가 값을 10만 번 주고받는 코드와, 한 스레드가 같은 일을 10만 번 하는 코드 가운데 어느 쪽이 느린가 (주고받는 쪽. 주고받을 때마다 전환이 생긴다)'
      - '옮긴 상황: 로그를 한 줄 쓸 때마다 다른 스레드에 넘기고 그 스레드가 끝나길 기다리는 코드가 있다. 한 줄의 로그가 아주 짧다면 무엇이 시간을 많이 차지하나 (스레드를 바꾸고 기다리는 비용. 일보다 전환이 크다)'
  - id: q4
    title: 스레드를 늘리면 늘 빨라지나요?
    conclusion:
      lead: '계산만 하는 일은 코어 수를 넘으면 더 빨라지지 않고, 기다리는 일이 많을 때만 스레드를 늘린 만큼 빨라져요.'
      sub: '기다리는 스레드는 코어를 쓰지 않아서 그동안 다른 스레드가 일할 수 있기 때문이에요. 계산만 하는 스레드를 코어보다 많이 두면 번갈아 돌며 전환 비용만 더해요.'
    says:
      - '예측의 답을 밝힌다. 코드 cpuTask 8개를 스레드 1개, 코어 수, 코어 수의 16배 풀로 돌린 시간을 보인다. 코어 수까지는 빨라지고 그 뒤로는 거의 그대로다'
      - '코드 ioTask(100ms 기다리기) 16개를 스레드 1개와 16개 풀로 돌린다. 1개면 1.6초, 16개면 0.1초 남짓이다. 기다리는 동안 코어를 쓰지 않아서 스레드 수만큼 함께 기다린다'
      - '서버의 요청 처리는 대개 DB와 외부 API를 기다리는 시간이 길다. 톰캣이 코어 수보다 훨씬 많은 200개 스레드를 두는 이유다'
      - '출발점: 계산 중심이면 코어 수(또는 하나 더), 기다리는 일이 섞이면 기다리는 비율만큼 늘린다. 정확한 값은 재 보고 정한다(A11)'
    widget:
      kind: toggle
      note: '고르기: 작업 종류(계산 8개, 100ms 기다리기 16개) × 스레드 수(1, 4, 64). 장면마다 코어 4개의 gantt 막대로 실행과 기다림을 보이고, 걸린 시간을 실제 측정값의 비율로 적는다'
    asks:
      - '본문의 예시: 코어 4개인 기계에서 계산만 하는 작업 8개를 스레드 64개 풀로 돌리면 스레드 4개 풀보다 얼마나 빠른가 (거의 같다. 한 순간에 4개만 실행된다)'
      - '옮긴 상황: 외부 API를 부르고 200ms 기다리는 작업 100개를 처리한다. 스레드 10개 풀과 100개 풀 가운데 어느 쪽이 빨리 끝나나. 외부 API는 동시 호출을 제한하지 않는다 (100개 풀. 기다리는 일은 스레드 수만큼 함께 기다린다)'
      - '실무 구역: 코어 8개 서버에서 이미지 크기를 바꾸는 계산 작업용 풀을 `newFixedThreadPool(200)`으로 만들었다. 무엇이 문제인가 (코어보다 훨씬 많아 빨라지지 않고 전환과 메모리만 늘어난다. 코어 수 정도로 둔다)'
practice:
  says:
    - '톰캣의 `server.tomcat.threads.max`는 기본 200이다. 요청 처리는 대개 DB와 외부 호출을 기다리는 일이라 코어보다 많이 둔다(스프링 부트 속성 목록 근거)'
    - '흔한 실수: 계산 중심 작업(이미지 변환, 암호화, 큰 JSON 파싱)용 풀을 크게 잡는다. 고친 코드: `Runtime.getRuntime().availableProcessors()`를 크기로 쓴다. 질문 4의 측정값을 근거로 든다'
    - '컨테이너에서 코어 수: JVM은 컨테이너의 CPU 제한을 읽어 `availableProcessors()`에 반영한다(자바 공식 문서 근거). CPU를 1개로 제한한 컨테이너에서 이 값은 1이다'
    - '로그와 도구에서 알아보는 법: 스레드 덤프에서 `RUNNABLE` 스레드가 코어보다 훨씬 많으면 차례를 다투고 있다. 리눅스의 `vmstat`의 `cs` 칸이 초당 전환 수다(T8, T10)'
claims:
  - claim: '`availableProcessors()`는 이 기계의 코어 수를 돌려준다'
    how: 'CI의 값을 `CiOutput`에 남긴다. 1 이상인지만 단정한다'
  - claim: '코어보다 많은 계산 스레드도 모두 조금씩 진행한다'
    how: '코어 수의 네 배만큼 스레드를 띄워 300ms 뒤 스레드마다 센 값이 모두 0보다 큰지 본다'
  - claim: '두 스레드가 값을 10만 번 주고받는 시간은 한 스레드가 같은 일을 하는 시간보다 길다'
    how: '`SynchronousQueue` 두 개로 주고받는 시간과 한 스레드의 반복 시간을 잰다. 비교만 단정하고 값은 남긴다'
  - claim: '기다리는 작업 16개는 스레드 16개 풀에서 스레드 1개 풀보다 5배 넘게 빨리 끝난다'
    how: '100ms sleep 작업 16개를 두 풀로 돌려 시간을 잰다'
  - claim: '계산 작업은 코어 수를 넘는 스레드에서 코어 수의 스레드보다 크게 빨라지지 않는다'
    how: '같은 계산 작업 8개를 코어 수와 코어 수의 16배 풀로 돌린다. 16배 풀이 1.5배 넘게 빠르지 않은지만 단정하고 값은 남긴다'
sources:
  - '스레드의 상태: `Thread.State` API 문서 https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/lang/Thread.State.html'
  - '`availableProcessors`와 컨테이너: API 문서 https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/lang/Runtime.html#availableProcessors() , java 명령 문서의 `-XX:ActiveProcessorCount` https://docs.oracle.com/en/java/javase/21/docs/specs/man/java.html'
  - '리눅스 스케줄러(CFS): 리눅스 커널 문서 https://docs.kernel.org/scheduler/sched-design-CFS.html'
  - '`server.tomcat.threads.max`: 스프링 부트 속성 목록 https://docs.spring.io/spring-boot/appendix/application-properties/index.html'
