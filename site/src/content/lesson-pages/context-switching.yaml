# 컨텍스트 스위칭
# 자료 파일의 칸은 docs/lesson-data-format.md에 있다. 문제는 content/questions/context-switching.yaml에 있다.
title: 컨텍스트 스위칭
description: 코어보다 많은 스레드는 어떻게 모두 실행되는지, 컨텍스트 스위칭은 무엇을 바꾸는지, 왜 비용이 드는지, 스레드를 늘리면 늘 빨라지는지. 스레드 수를 바꿔 가며 계산하는 일과 기다리는 일의 시간을 재 보며 배우는 대화형 레슨.
unit: 운영체제와 동시성
minutes: 18
roadmap: C2
type: 개념 설명
prerequisites:
  - {slug: process-and-thread, title: 프로세스와 스레드}
assume: '자바 21(OpenJDK). 스레드는 스택과 실행 위치를 따로 가진다는 것, `start()`와 `join()`(프로세스와 스레드 레슨). CPU 코어가 명령을 하나씩 실행한다는 것.'
example: '코어가 몇 개인 기계에서 일을 하는 스레드 여럿. 계산만 하는 일과 기다리기만 하는 일을 스레드 수를 바꿔 가며 돌려 시간을 재요. 실무 구역에서는 톰캣의 스레드 200개와 계산 작업용 풀의 크기로 옮겨요.'
intro:
  - '코어 4개짜리 서버에서 이미지 변환 작업이 느려서 스레드를 4개에서 100개로 늘렸어요. 그런데 빨라지기는커녕 조금 더 느려졌어요. 같은 서버의 톰캣은 스레드 200개로 요청을 잘 처리하고 있는데 말이에요.'
  - '자바 개발자는 스레드 수를 정하는 자리를 자주 만나요. 톰캣의 최대 스레드, `@Async`와 작업 풀의 크기, 배치의 병렬 수가 다 그래요. CPU가 스레드를 어떻게 번갈아 돌리는지, 바꿀 때 무엇을 치르는지를 알아야 숫자를 고를 근거가 생겨요.'
  - '이 레슨에서는 코어보다 많은 스레드가 어떻게 함께 진행되는지 보고, 스레드 둘이 서로에게 일을 넘기는 비용을 재고, 계산만 하는 일과 기다리는 일에서 스레드를 늘린 결과를 비교해요.'
covers:
  - topic: '코어 하나는 한 순간에 스레드 하나만 실행한다. 스케줄러가 짧은 시간(타임 슬라이스)씩 번갈아 실행해 동시에 도는 것처럼 보인다'
    where: '질문 1'
  - topic: '동시성(번갈아 진행)과 병렬성(여러 코어에서 정말로 함께 실행)의 차이'
    where: '질문 1'
  - topic: '`Runtime.availableProcessors()`로 코어 수를 읽는다'
    where: '질문 1'
  - topic: '스레드의 상태: 실행 중, 실행을 기다림, 무언가를 기다림(대기). 기다리는 스레드는 CPU를 쓰지 않는다'
    where: '질문 1'
  - topic: '컨텍스트 스위칭: 실행하던 스레드의 레지스터와 실행 위치를 저장하고 다음 스레드의 것을 불러오는 일. 커널(운영체제)이 한다'
    where: '질문 2'
  - topic: '언제 일어나나: 타임 슬라이스가 끝날 때, 입출력이나 락을 기다릴 때(스스로 내려놓음), 더 급한 스레드가 깨어날 때'
    where: '질문 2'
  - topic: '스레드 전환과 프로세스 전환: 프로세스를 바꾸면 메모리 주소 공간도 바꿔야 해서 더 비싸다'
    where: '질문 2. 주소 공간은 가상 메모리(C10)'
  - topic: '비용: 직접 비용(저장과 복원, 커널로 들어가기)과 간접 비용(캐시가 식음). 마이크로초 단위'
    where: '질문 3'
  - topic: '스레드 하나마다 스택 메모리를 쓴다'
    where: '질문 3. 크기는 JVM 메모리 구조(J14)'
  - topic: '계산만 하는 일(CPU 중심)은 코어 수보다 스레드를 늘려도 빨라지지 않는다. 기다리는 일(입출력 중심)은 기다리는 동안 다른 스레드가 코어를 쓰니 스레드를 늘리면 빨라진다'
    where: '질문 4'
  - topic: '스레드 수의 출발점: CPU 중심은 코어 수, 입출력 중심은 기다리는 비율만큼 더'
    where: '질문 4, 실무에서는. 크기를 정하는 법은 스레드 풀과 커넥션 풀 크기(A11)'
  - topic: '사용자 모드와 커널 모드, 시스템 콜의 비용'
    where: '다루지 않음: 사용자 모드와 커널 모드(C11)'
  - topic: '스케줄링 알고리즘(라운드 로빈, 우선순위)'
    where: '질문 1의 더 알아보기'
  - topic: '전환 없이 많은 기다림을 처리하는 방법'
    where: '다루지 않음: 동기와 비동기, 블로킹과 논블로킹(C9), 가상 스레드(C12)'
codes:
  predict: |-
    // 코어 4개인 기계
    // 계산만 하는 작업 8개
    var pool4 = Executors
        .newFixedThreadPool(4);
    var pool64 = Executors
        .newFixedThreadPool(64);
    // 같은 8개를 두 풀로 돌려 시간을 잰다
  cores: |-
    int cores = Runtime.getRuntime()
        .availableProcessors();
  pingPong: |-
    var ping = new SynchronousQueue<Integer>();
    var pong = new SynchronousQueue<Integer>();
    // 스레드 A: ping.put(i); pong.take();
    // 스레드 B: ping.take(); pong.put(i);
    // 10만 번 주고받는다
  cpuTask: |-
    long work() {
      long x = 0;
      for (int i = 0; i < 50_000_000; i++)
        x += i % 7;
      return x;
    }
  ioTask: |-
    void waitForDb() throws Exception {
      Thread.sleep(100);
    }
  fixedPool: |-
    // 계산 중심 작업용 풀
    int n = Runtime.getRuntime()
        .[[availableProcessors()]];
    var imagePool = Executors
        .newFixedThreadPool(n);
links:
  test: https://github.com/wanja727/dev-lessons/blob/main/verification/src/test/java/lab/devlessons/contextswitch/ContextSwitchingTest.java
  threadState: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/lang/Thread.State.html
  runtime: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/lang/Runtime.html#availableProcessors()
  javaCmd: https://docs.oracle.com/en/java/javase/21/docs/specs/man/java.html
  cfs: https://docs.kernel.org/scheduler/sched-design-CFS.html
  bootProps: https://docs.spring.io/spring-boot/appendix/application-properties/index.html
predict:
  title: 스레드를 16배로 늘리면
  text: '코어 4개인 기계에서 계산만 하는 작업 8개를 스레드 4개짜리 풀과 64개짜리 풀로 각각 돌려요. 64개짜리 풀은 얼마나 빠를까요? 답은 질문 4에 나와요.'
  code: predict
  label: 내 예측
  options:
    - value: x16
      label: 16배쯤 빠르다
    - value: x2
      label: 2배쯤 빠르다
    - value: same
      label: 거의 같다
  answer: same
  storageKey: context-switch-predict
  wrong: 예측은 "{label}"이었어요. 틀린 예측이 더 오래 남으니 괜찮아요.
questions:
  - id: q1
    title: 코어보다 스레드가 많으면 어떻게 모두 실행되나요?
    conclusion:
      lead: '운영체제의 스케줄러가 스레드들을 아주 짧은 시간씩 번갈아 코어에 올려서, 모두 조금씩 진행되게 해요.'
      sub: '한 코어는 한 순간에 스레드 하나만 실행해요. 번갈아 진행하는 것이 동시성이고, 여러 코어에서 정말로 함께 실행하는 것이 병렬성이에요.'
    says:
      - '코드 cores로 이 기계의 코어 수를 읽는다. CI 기계의 값을 실제 출력으로 보인다'
      - '코어 하나는 한 순간에 스레드 하나의 명령만 실행한다. 스레드가 코어보다 많으면 스케줄러가 몇 밀리초 단위의 시간(타임 슬라이스)씩 번갈아 실행한다. 사람 눈에는 모두 동시에 도는 것처럼 보인다'
      - '코어 수의 네 배만큼 계산 스레드를 띄우고 잠깐 뒤에 각 스레드가 얼마나 진행했는지 본다. 모든 스레드가 0보다 크다. 번갈아 실행된 것이다'
      - '동시성(concurrency)은 여러 일이 번갈아 진행되는 것이고, 병렬성(parallelism)은 여러 코어에서 같은 순간에 실행되는 것이다. 코어가 하나여도 동시성은 있다'
      - '스레드의 상태는 크게 셋이다: 코어에서 실행 중, 실행할 준비가 되어 차례를 기다림, 무언가(입출력, 락, sleep)를 기다림. 셋째 상태의 스레드는 차례를 받지 않아 CPU를 쓰지 않는다. 자바의 `Thread.State`로 `RUNNABLE`, `WAITING`, `TIMED_WAITING`, `BLOCKED`가 보인다'
      - '더 알아보기: 차례를 정하는 방법(스케줄링)에는 돌아가며 같은 시간을 주는 라운드 로빈, 급한 것을 먼저 주는 우선순위 방식이 있다. 리눅스는 실행한 시간이 적은 스레드에 먼저 준다. 자바의 스레드 우선순위는 힌트일 뿐이다'
    asks:
      - '본문의 예시: 코어 2개인 기계에서 계산 스레드 8개를 띄웠다. 한 순간에 실제로 코어에서 실행되는 스레드는 최대 몇 개인가 (2개)'
      - '옮긴 상황: 스레드 200개 가운데 190개가 DB의 응답을 기다리는 중이다(코어 8개). CPU를 차지하려고 다투는 스레드는 대략 몇 개인가 (10개 이하. 기다리는 스레드는 차례를 받지 않는다)'
    body:
      - p: '먼저 이 기계의 코어 수를 읽어 봐요.'
      - ci:
          key: cores
          label: CI 기계의 값 보기
          source: ContextSwitchingTest.cores
          code: cores
      - p: '**코어 하나는 한 순간에 스레드 하나의 명령만 실행해요.** 스레드가 코어보다 많으면 운영체제의 스케줄러가 몇 밀리초 단위의 짧은 시간(**타임 슬라이스**)씩 번갈아 코어에 올려요. 사람 눈에는 모두 동시에 도는 것처럼 보여요.'
      - p: '코어 수의 네 배만큼 계산만 하는 스레드를 함께 돌리고, 각 스레드가 몇 번 셌는지 봤어요.'
      - ci:
          key: progress
          label: 실제 결과 보기
          source: ContextSwitchingTest.allThreadsProgress
      - p: '가장 적게 센 스레드도 0보다 커요. 모든 스레드가 번갈아 조금씩 실행된 거예요.'
      - ul:
          - '**동시성(concurrency)**은 여러 일이 번갈아 진행되는 것이고, **병렬성(parallelism)**은 여러 코어에서 같은 순간에 실행되는 것이에요. 코어가 하나여도 동시성은 있어요.'
          - '스레드는 크게 세 상태예요: 코어에서 **실행 중**, 실행할 준비가 되어 **차례를 기다림**, 입출력이나 락이나 `sleep` 같은 **무언가를 기다림**. 셋째 상태의 스레드는 차례를 받지 않아 CPU를 쓰지 않아요.'
          - '자바의 `Thread.State`에서는 앞의 둘이 `RUNNABLE`, 셋째가 `WAITING`, `TIMED_WAITING`, `BLOCKED`로 보여요.'
      - more:
          summary: '더 알아보기: 차례를 정하는 방법'
          body:
            - p: '차례를 정하는 방법(스케줄링)에는 돌아가며 같은 시간을 주는 라운드 로빈, 급한 것을 먼저 주는 우선순위 방식이 있어요. 리눅스는 지금까지 실행한 시간이 적은 스레드에 먼저 줘요([CFS 문서](link:cfs)). 자바의 스레드 우선순위(`setPriority`)는 운영체제에 주는 힌트일 뿐이에요.'
      - quiz:
          q: '코어 2개인 기계에서 계산 스레드 8개를 띄웠어요. 한 순간에 실제로 코어에서 실행되는 스레드는 최대 몇 개일까요?'
          options:
            - 2개
            - 8개
            - 1개
          answer: 1
          explain: '코어 하나는 한 순간에 스레드 하나만 실행해요. 나머지 6개는 차례를 기다려요.'
      - next: '스케줄러가 스레드를 번갈아 올린다고 했어요. 바꿀 때 코어에서는 정확히 무슨 일이 생길까요?'
    recall: '운영체제의 스케줄러가 스레드들을 아주 짧은 시간씩 번갈아 코어에 올려서 모두 조금씩 진행되게 해요. 한 코어는 한 순간에 스레드 하나만 실행해요. 번갈아 진행하는 것이 동시성, 여러 코어에서 같은 순간에 실행하는 것이 병렬성이에요. 입출력이나 락을 기다리는 스레드는 차례를 받지 않아 CPU를 쓰지 않아요.'
  - id: q2
    title: 컨텍스트 스위칭은 무엇을 바꾸고 언제 일어나나요?
    conclusion:
      lead: '코어에서 실행하던 스레드의 레지스터와 실행 위치를 저장하고, 다음 스레드의 것을 불러와 이어서 실행하는 일이에요.'
      sub: '타임 슬라이스가 끝날 때, 스레드가 입출력이나 락을 기다리며 코어를 내려놓을 때 일어나요. 프로세스를 바꿀 때는 메모리 주소 공간까지 바꿔서 더 비싸요.'
    says:
      - '스레드가 코어에서 실행되는 동안 코어의 레지스터에는 그 스레드의 계산 중인 값, 다음에 실행할 명령의 위치(PC), 스택의 꼭대기 위치가 들어 있다. 이것이 그 스레드의 문맥(context)이다'
      - '바꿀 때 커널이 하는 일: 지금 스레드의 레지스터를 메모리에 저장한다, 다음 스레드를 고른다, 그 스레드의 저장된 레지스터를 불러온다. 다음 스레드는 멈췄던 곳에서 이어서 실행한다'
      - '일어나는 때: 타임 슬라이스를 다 썼을 때(빼앗김), 스레드가 `sleep`, 입출력, 락, `take()`처럼 기다리는 일을 만나 스스로 내려놓을 때, 더 급한 스레드가 깨어날 때'
      - '같은 프로세스의 스레드끼리 바꾸면 메모리 공간은 그대로다. 다른 프로세스의 스레드로 바꾸면 주소 공간(어느 가상 주소가 어느 실제 메모리인지의 표)까지 바꿔서 더 비싸다(C10)'
    widget:
      kind: steps
      note: '코어 하나와 스레드 A, B. duo의 왼쪽은 코어의 레지스터(PC, 계산 값), 오른쪽은 메모리에 저장된 각 스레드의 문맥. 단계: A 실행 중(PC=12), 타임 슬라이스 끝, A의 문맥 저장, B의 문맥 불러오기(PC=40), B 실행, B가 입출력을 기다리며 내려놓음, A의 문맥 불러와 PC=12에서 이어 실행'
    asks:
      - '본문의 예시: 스레드 A가 코어에서 내려온 뒤 다시 올라오면 어디서부터 실행하나 (저장해 둔 실행 위치. 멈췄던 곳에서 이어서)'
      - '옮긴 상황: 스레드 A가 `Thread.sleep(1000)`을 불렀다. 타임 슬라이스가 남았어도 컨텍스트 스위칭이 일어나나 (일어난다. 기다리는 동안 코어를 내려놓는다)'
    body:
      - p: '스레드가 코어에서 도는 동안 코어의 **레지스터**에는 그 스레드의 계산 중인 값, 다음에 실행할 명령의 위치(PC), 스택의 꼭대기 위치가 들어 있어요. 이것이 그 스레드의 **문맥(context)**이에요.'
      - p: '다른 스레드로 바꿀 때 운영체제의 커널은 세 가지를 해요.'
      - ol:
          - '지금 스레드의 레지스터를 메모리에 저장해요.'
          - '다음에 실행할 스레드를 골라요.'
          - '그 스레드의 저장된 레지스터를 코어에 불러와요. 그 스레드는 멈췄던 곳에서 이어서 실행돼요.'
      - widget:
          kind: steps
          layout: [duo, log, buttons, verdict]
          initial:
            duo:
              - {label: 코어의 레지스터, state: dim, text: 비어 있음}
              - {label: 메모리에 저장된 문맥, state: dim, text: 'A: 없음, B: PC=40'}
          scenarios:
            default:
              - log: 'A가 코어에서 실행 중'
                duo:
                  - {label: 코어의 레지스터, rows: [{k: 스레드, v: A}, {k: PC, v: '12', mark: changed}]}
                  - {label: 메모리에 저장된 문맥, rows: [{k: B, v: 'PC=40'}]}
              - log: 'A의 타임 슬라이스가 끝남 → A의 문맥을 저장'
                duo:
                  - {label: 코어의 레지스터, state: dim, text: 바꾸는 중}
                  - {label: 메모리에 저장된 문맥, rows: [{k: A, v: 'PC=12', mark: changed}, {k: B, v: 'PC=40'}]}
              - log: 'B의 문맥을 불러옴 → B가 PC=40부터 실행'
                duo:
                  - {label: 코어의 레지스터, rows: [{k: 스레드, v: B}, {k: PC, v: '40', mark: changed}]}
                  - {label: 메모리에 저장된 문맥, rows: [{k: A, v: 'PC=12'}]}
              - log: 'B가 DB 응답을 기다리며 코어를 내려놓음 → B의 문맥을 저장'
                duo:
                  - {label: 코어의 레지스터, state: dim, text: 바꾸는 중}
                  - {label: 메모리에 저장된 문맥, rows: [{k: A, v: 'PC=12'}, {k: B, v: 'PC=47 (기다림)', mark: changed}]}
              - log: 'A의 문맥을 불러옴 → A가 PC=12부터 이어서 실행'
                duo:
                  - {label: 코어의 레지스터, rows: [{k: 스레드, v: A}, {k: PC, v: '12', mark: changed}]}
                  - {label: 메모리에 저장된 문맥, rows: [{k: B, v: 'PC=47 (기다림)'}]}
                verdict: 'A는 멈췄던 PC=12에서 이어서 실행해요. 바꿀 때마다 저장하고 불러오는 일이 생겨요.'
      - p: '바꾸는 때는 세 가지예요.'
      - ul:
          - '**타임 슬라이스를 다 썼을 때.** 운영체제가 빼앗아요.'
          - '**스레드가 기다리는 일을 만났을 때.** `sleep`, 입출력, 락, 큐의 `take()`에서 스스로 코어를 내려놓아요. 타임 슬라이스가 남았어도요.'
          - '**더 급한 스레드가 깨어났을 때.**'
      - callout: '같은 프로세스의 스레드끼리 바꾸면 메모리 공간은 그대로예요. **다른 프로세스**의 스레드로 바꾸면 어느 주소가 어느 실제 메모리인지의 표(주소 공간)까지 바꿔야 해서 더 비싸요. 주소 공간은 가상 메모리 레슨에서 다뤄요.'
      - quiz:
          q: '스레드 A가 타임 슬라이스가 남은 채로 `Thread.sleep(1000)`을 불렀어요. 컨텍스트 스위칭이 일어날까요?'
          options:
            - 일어나지 않는다. 시간이 남았다
            - 일어난다. 기다리는 동안 코어를 내려놓는다
            - 1초 뒤에만 일어난다
          answer: 2
          explain: '기다리는 일을 만나면 스레드가 스스로 코어를 내려놓고, 다른 스레드가 올라와요.'
      - next: '바꿀 때마다 저장하고 불러오는 일이 생긴다고 했어요. 이 일은 얼마나 비쌀까요?'
    recall: '코어에서 실행하던 스레드의 레지스터와 실행 위치를 저장하고, 다음 스레드의 것을 불러와 이어서 실행하는 일이에요. 타임 슬라이스가 끝날 때, 스레드가 입출력이나 락을 기다리며 코어를 내려놓을 때, 급한 스레드가 깨어날 때 일어나요. 다른 프로세스로 바꾸면 주소 공간까지 바꿔서 더 비싸요.'
  - id: q3
    title: 컨텍스트 스위칭은 왜 비용이 드나요?
    conclusion:
      lead: '바꾸는 동안에는 아무도 일을 하지 않고, 바꾼 뒤에는 새 스레드의 데이터가 CPU 캐시에 없어 한동안 느리게 돌기 때문이에요.'
      sub: '한 번에 마이크로초 단위라 작아 보이지만, 스레드끼리 일을 자주 주고받으면 실제 일보다 전환에 시간을 더 쓰게 돼요.'
    says:
      - '직접 비용: 레지스터 저장과 복원, 커널로 들어가고 나오기, 다음 스레드 고르기. 이 동안 코어는 사용자의 코드를 실행하지 않는다'
      - '간접 비용: CPU 캐시에는 방금 돌던 스레드의 데이터가 있다. 새 스레드의 데이터는 메모리에서 다시 읽어야 해서 바꾼 직후 한동안 느리다'
      - '코드 pingPong. 스레드 둘이 값을 하나씩 주고받기를 10만 번 한다. 주고받을 때마다 한쪽이 기다리다 깨어나야 해서 전환이 생긴다. 같은 10만 번의 덧셈을 한 스레드에서 하는 시간과 나란히 보인다. 주고받기 한 번에 몇 마이크로초가 든다'
      - '스레드 하나는 스택 메모리도 쓴다(J14). 스레드가 많을수록 메모리도 쓰고 전환할 후보도 많아진다'
    asks:
      - '본문의 예시: 두 스레드가 값을 10만 번 주고받는 코드와, 한 스레드가 같은 일을 10만 번 하는 코드 가운데 어느 쪽이 느린가 (주고받는 쪽. 주고받을 때마다 전환이 생긴다)'
      - '옮긴 상황: 로그를 한 줄 쓸 때마다 다른 스레드에 넘기고 그 스레드가 끝나길 기다리는 코드가 있다. 한 줄의 로그가 아주 짧다면 무엇이 시간을 많이 차지하나 (스레드를 바꾸고 기다리는 비용. 일보다 전환이 크다)'
    body:
      - p: '비용은 두 가지예요.'
      - ul:
          - '**직접 비용.** 레지스터를 저장하고 불러오고, 커널로 들어갔다 나오고, 다음 스레드를 고르는 동안 코어는 우리 코드를 실행하지 않아요.'
          - '**간접 비용.** CPU 캐시에는 방금 돌던 스레드의 데이터가 들어 있어요. 새 스레드의 데이터는 메모리에서 다시 읽어야 해서, 바꾼 직후 한동안 느리게 돌아요.'
      - p: '스레드 둘이 값을 하나씩 주고받기를 10만 번 하게 했어요. 한쪽이 값을 넘기면 기다리던 다른 쪽이 깨어나야 해서 주고받을 때마다 전환이 생겨요. 같은 10만 번의 덧셈을 한 스레드에서 한 시간과 비교했어요.'
      - ci:
          key: ping-pong
          label: 실제로 잰 시간 보기
          source: ContextSwitchingTest.pingPongCostsMore
          code: pingPong
      - p: '한 스레드에서는 눈 깜짝할 일이, 스레드를 오가면 주고받기 한 번에 **마이크로초 단위**가 걸려요. 하나하나는 작지만, 아주 짧은 일을 스레드끼리 자주 넘기면 **일보다 전환에 시간을 더 써요.**'
      - muted: '스레드 하나는 스택 메모리도 써요(JVM 메모리 구조 레슨). 스레드가 많을수록 메모리도 쓰고 전환할 후보도 많아져요.'
      - quiz:
          q: '두 스레드가 값을 10만 번 주고받는 코드와, 한 스레드가 같은 계산을 10만 번 하는 코드 가운데 어느 쪽이 느릴까요?'
          options:
            - 주고받는 쪽
            - 한 스레드 쪽
            - 같다
          answer: 1
          explain: '주고받을 때마다 한쪽이 깨어나야 해서 컨텍스트 스위칭이 생겨요. 실제로 잰 값에서 주고받는 쪽이 훨씬 오래 걸렸어요.'
      - next: '전환에 비용이 든다면, 스레드를 많이 둘수록 손해일까요? 아니면 빨라질까요?'
    recall: '바꾸는 동안에는 레지스터를 저장하고 불러오고 커널을 오가느라 아무도 우리 일을 하지 않고, 바꾼 뒤에는 새 스레드의 데이터가 CPU 캐시에 없어 한동안 느리게 돌기 때문이에요. 한 번에 마이크로초 단위지만, 짧은 일을 스레드끼리 자주 넘기면 일보다 전환에 시간을 더 써요.'
  - id: q4
    title: 스레드를 늘리면 늘 빨라지나요?
    conclusion:
      lead: '계산만 하는 일은 코어 수를 넘으면 더 빨라지지 않고, 기다리는 일이 많을 때만 스레드를 늘린 만큼 빨라져요.'
      sub: '기다리는 스레드는 코어를 쓰지 않아서 그동안 다른 스레드가 일할 수 있기 때문이에요. 계산만 하는 스레드를 코어보다 많이 두면 번갈아 돌며 전환 비용만 더해요.'
    says:
      - '예측의 답을 밝힌다. 코드 cpuTask 8개를 스레드 1개, 코어 수, 코어 수의 16배 풀로 돌린 시간을 보인다. 코어 수까지는 빨라지고 그 뒤로는 거의 그대로다'
      - '코드 ioTask(100ms 기다리기) 16개를 스레드 1개와 16개 풀로 돌린다. 1개면 1.6초, 16개면 0.1초 남짓이다. 기다리는 동안 코어를 쓰지 않아서 스레드 수만큼 함께 기다린다'
      - '서버의 요청 처리는 대개 DB와 외부 API를 기다리는 시간이 길다. 톰캣이 코어 수보다 훨씬 많은 200개 스레드를 두는 이유다'
      - '출발점: 계산 중심이면 코어 수(또는 하나 더), 기다리는 일이 섞이면 기다리는 비율만큼 늘린다. 정확한 값은 재 보고 정한다(A11)'
    widget:
      kind: toggle
      note: '고르기: 작업 종류(계산 8개, 100ms 기다리기 16개) × 스레드 수(1, 4, 64). 장면마다 코어 4개의 gantt 막대로 실행과 기다림을 보이고, 걸린 시간을 실제 측정값의 비율로 적는다'
    asks:
      - '본문의 예시: 코어 4개인 기계에서 계산만 하는 작업 8개를 스레드 64개 풀로 돌리면 스레드 4개 풀보다 얼마나 빠른가 (거의 같다. 한 순간에 4개만 실행된다)'
      - '옮긴 상황: 외부 API를 부르고 200ms 기다리는 작업 100개를 처리한다. 스레드 10개 풀과 100개 풀 가운데 어느 쪽이 빨리 끝나나. 외부 API는 동시 호출을 제한하지 않는다 (100개 풀. 기다리는 일은 스레드 수만큼 함께 기다린다)'
      - '실무 구역: 코어 8개 서버에서 이미지 크기를 바꾸는 계산 작업용 풀을 `newFixedThreadPool(200)`으로 만들었다. 무엇이 문제인가 (코어보다 훨씬 많아 빨라지지 않고 전환과 메모리만 늘어난다. 코어 수 정도로 둔다)'
    body:
      - p: '처음 예측의 답은 **거의 같다**예요. {{predict-result}} 계산만 하는 작업 8개를 스레드 1개, 코어 수, 코어 수의 16배 풀로 돌려 시간을 쟀어요.'
      - ci:
          key: cpu
          label: 계산 작업의 실제 시간 보기
          source: ContextSwitchingTest.cpuTasksDoNotScalePastCores
          code: cpuTask
      - p: '코어 수까지는 빨라지지만, 그 뒤로는 스레드를 늘려도 그대로예요. 한 순간에 실행되는 것은 코어 수만큼뿐이라, 나머지 스레드는 번갈아 돌며 전환 비용만 더해요.'
      - p: '이번에는 100ms를 **기다리기만** 하는 작업 16개예요. DB나 외부 API의 응답을 기다리는 일과 같은 모양이에요.'
      - ci:
          key: io
          label: 기다리는 작업의 실제 시간 보기
          source: ContextSwitchingTest.waitingTasksScaleWithThreads
          code: ioTask
      - p: '스레드 1개면 1.6초, 16개면 0.1초 남짓이에요. **기다리는 스레드는 코어를 쓰지 않아서** 그동안 다른 스레드가 코어를 써요. 그래서 스레드 수만큼 함께 기다릴 수 있어요.'
      - widget:
          kind: toggle
          layout: [selector, legend, gantt, verdict]
          selector:
            label: 작업과 스레드 수 (코어 4개)
            options:
              - {value: cpu4, label: 계산 8개, 스레드 4개}
              - {value: cpu64, label: 계산 8개, 스레드 64개}
              - {value: io1, label: 기다림 4개, 스레드 1개}
              - {value: io4, label: 기다림 4개, 스레드 4개}
          legend:
            - {kind: hold, label: 코어에서 계산}
            - {kind: wait, label: 응답을 기다림 (코어를 쓰지 않음)}
          scenes:
            cpu4:
              gantt:
                total: 2
                axis: ['0', 작업 1개 시간, 작업 2개 시간]
                rows:
                  - {label: 코어 1, bars: [{kind: hold, from: 0, to: 1}, {kind: hold, from: 1, to: 2}]}
                  - {label: 코어 2, bars: [{kind: hold, from: 0, to: 1}, {kind: hold, from: 1, to: 2}]}
                  - {label: 코어 3, bars: [{kind: hold, from: 0, to: 1}, {kind: hold, from: 1, to: 2}]}
                  - {label: 코어 4, bars: [{kind: hold, from: 0, to: 1}, {kind: hold, from: 1, to: 2}]}
              verdict: '코어 넷이 작업을 둘씩 해서 작업 두 개 시간에 끝나요.'
            cpu64:
              gantt:
                total: 2
                axis: ['0', 작업 1개 시간, 작업 2개 시간]
                rows:
                  - {label: 코어 1, bars: [{kind: hold, from: 0, to: 2.0}]}
                  - {label: 코어 2, bars: [{kind: hold, from: 0, to: 2.0}]}
                  - {label: 코어 3, bars: [{kind: hold, from: 0, to: 2.0}]}
                  - {label: 코어 4, bars: [{kind: hold, from: 0, to: 2.0}]}
              verdict: '8개가 한꺼번에 시작하지만 코어는 넷이라 번갈아 돌아요. 끝나는 때는 같거나, 전환 비용만큼 조금 늦어요.'
            io1:
              gantt:
                total: 4
                axis: ['0', 기다림 2번, 기다림 4번]
                rows:
                  - {label: 스레드 1, bars: [{kind: wait, from: 0, to: 1}, {kind: wait, from: 1, to: 2}, {kind: wait, from: 2, to: 3}, {kind: wait, from: 3, to: 4}]}
              verdict: '하나씩 기다려서 기다림 네 번 시간이 걸려요. 그동안 코어는 놀아요.'
            io4:
              gantt:
                total: 4
                axis: ['0', 기다림 2번, 기다림 4번]
                rows:
                  - {label: 스레드 1, bars: [{kind: wait, from: 0, to: 1}]}
                  - {label: 스레드 2, bars: [{kind: wait, from: 0, to: 1}]}
                  - {label: 스레드 3, bars: [{kind: wait, from: 0, to: 1}]}
                  - {label: 스레드 4, bars: [{kind: wait, from: 0, to: 1}]}
              verdict: '넷이 함께 기다려서 기다림 한 번 시간에 끝나요. 기다리는 일은 스레드를 늘린 만큼 빨라져요.'
      - ul:
          - '서버의 요청 처리는 대개 DB와 외부 API를 **기다리는** 시간이 길어요. 톰캣이 코어 수보다 훨씬 많은 200개 스레드를 두는 이유예요.'
          - '출발점: 계산 중심이면 **코어 수**(또는 하나 더), 기다리는 일이 섞이면 기다리는 비율만큼 늘려요. 정확한 값은 재 보고 정해요. 스레드 풀과 커넥션 풀 크기 레슨에서 다뤄요.'
      - quiz:
          q: '외부 API를 부르고 200ms 기다리는 작업 100개를 처리해요(외부 API는 동시 호출을 막지 않아요). 스레드 10개 풀과 100개 풀 가운데 어느 쪽이 빨리 끝날까요?'
          options:
            - 10개 풀. 전환이 적다
            - 100개 풀. 기다림을 함께 한다
            - 같다. 코어 수가 같다
          answer: 2
          explain: '기다리는 스레드는 코어를 쓰지 않아요. 100개면 한 번에 100개가 함께 기다려 0.2초 남짓, 10개면 열 번 기다려 2초 남짓이에요.'
    recall: '계산만 하는 일은 코어 수를 넘으면 더 빨라지지 않고, 기다리는 일이 많을 때만 스레드를 늘린 만큼 빨라져요. 기다리는 스레드는 코어를 쓰지 않아 그동안 다른 스레드가 일할 수 있기 때문이에요. 계산 스레드를 코어보다 많이 두면 번갈아 돌며 전환 비용만 더해요.'
practice:
  says:
    - '톰캣의 `server.tomcat.threads.max`는 기본 200이다. 요청 처리는 대개 DB와 외부 호출을 기다리는 일이라 코어보다 많이 둔다(스프링 부트 속성 목록 근거)'
    - '흔한 실수: 계산 중심 작업(이미지 변환, 암호화, 큰 JSON 파싱)용 풀을 크게 잡는다. 고친 코드: `Runtime.getRuntime().availableProcessors()`를 크기로 쓴다. 질문 4의 측정값을 근거로 든다'
    - '컨테이너에서 코어 수: JVM은 컨테이너의 CPU 제한을 읽어 `availableProcessors()`에 반영한다(자바 공식 문서 근거). CPU를 1개로 제한한 컨테이너에서 이 값은 1이다'
    - '로그와 도구에서 알아보는 법: 스레드 덤프에서 `RUNNABLE` 스레드가 코어보다 훨씬 많으면 차례를 다투고 있다. 리눅스의 `vmstat`의 `cs` 칸이 초당 전환 수다(T8, T10)'
  body:
    - p: '운영체제와 가까운 주제라 코드보다 **설정값과 로그**로 만나요. 톰캣의 설정은 스프링 부트 문서, 컨테이너의 코어 수는 자바 문서가 근거이고, 시간은 질문 4의 테스트로 쟀어요.'
    - h3: 톰캣은 왜 200개인가요
    - p: '톰캣의 요청 처리 스레드 최대 수(`server.tomcat.threads.max`)는 기본 200이에요([스프링 부트 속성 목록](link:bootProps)). 요청 처리는 대개 DB와 외부 호출을 기다리는 일이라, 질문 4의 기다리는 작업처럼 코어보다 훨씬 많은 스레드가 도움이 돼요.'
    - h3: '흔한 실수: 계산 작업용 풀을 크게 잡기'
    - p: '이미지 변환, 암호화, 큰 JSON 파싱처럼 계산만 하는 작업의 풀을 "넉넉하게" 200으로 잡는 경우가 있어요. 질문 4의 측정처럼 코어 수를 넘으면 빨라지지 않고 전환과 스택 메모리만 늘어요.'
    - code: fixedPool
      notes:
        - mark: availableProcessors()
          as: code
          text: '계산 중심 작업은 코어 수로 시작해요.'
    - h3: 컨테이너에서의 코어 수
    - p: 'JVM은 컨테이너의 CPU 제한을 읽어 `availableProcessors()`에 반영해요. CPU를 1개로 제한한 컨테이너에서는 1이에요. 직접 정하려면 `-XX:ActiveProcessorCount`를 줘요([java 명령 문서](link:javaCmd)). 코어 수로 크기를 정한 풀과 공용 풀이 모두 이 값을 따라요.'
    - h3: 로그와 도구에서 알아보기
    - ul:
        - '스레드 덤프에서 `RUNNABLE` 스레드가 코어보다 훨씬 많으면 차례를 다투고 있어요. 스레드 덤프와 힙 덤프 레슨에서 다뤄요.'
        - '리눅스의 `vmstat 1`을 띄우면 `cs` 칸이 초당 컨텍스트 스위칭 수예요. 갑자기 크게 늘면 스레드가 너무 많거나 락을 다투는 신호예요(리눅스 기초 레슨).'
interview:
  question: 컨텍스트 스위칭이 무엇이고 왜 비용이 드는지 설명해 주세요
  model:
    - label: 정의
      text: CPU 코어가 실행하던 스레드의 레지스터와 실행 위치를 저장하고, 다른 스레드의 것을 불러와 이어서 실행하는 일입니다. 코어보다 스레드가 많을 때 운영체제가 짧은 시간씩 번갈아 실행하는 방법입니다.
    - label: 원리
      text: 타임 슬라이스가 끝나거나 스레드가 입출력이나 락을 기다릴 때 일어납니다. 바꾸는 동안 커널이 저장과 복원을 해서 우리 코드는 실행되지 않고, 바꾼 뒤에는 CPU 캐시가 식어 한동안 느립니다. 다른 프로세스로 바꾸면 주소 공간까지 바꿔 더 비쌉니다.
    - label: 주의할 점
      text: 계산 중심 작업은 코어 수를 넘게 스레드를 늘려도 빨라지지 않고 전환 비용만 늘어서 풀을 코어 수 정도로 둡니다. 기다리는 일이 많은 요청 처리는 기다리는 동안 코어를 쓰지 않으니 스레드를 코어보다 많이 둡니다.
    - label: 경험
      text: '(내 프로젝트로 채우기) 예: 이미지 변환 풀을 100개로 잡았다가 빨라지지 않아 코어 수로 줄였습니다.'
verified: 이 레슨의 시간은 짐작이 아니라 자바 21에서 코드를 돌려 잰 값이에요. 기계마다 숫자는 달라서 테스트는 크기의 비교만 확인해요. 코드가 바뀔 때마다 테스트([ContextSwitchingTest](link:test))가 다시 돌아요.
footer: '근거: 스레드의 상태는 Thread.State API 문서([링크](link:threadState)), 코어 수와 컨테이너는 Runtime API 문서([링크](link:runtime))와 java 명령 문서, 리눅스 스케줄러는 커널 문서, 톰캣 스레드 수는 스프링 부트 문서. 시간은 OpenJDK 21에서 테스트로 쟀어요. 오류는 [GitHub 이슈](https://github.com/wanja727/dev-lessons/issues)로 알려 주세요.'
claims:
  - claim: '`availableProcessors()`는 이 기계의 코어 수를 돌려준다'
    how: 'CI의 값을 `CiOutput`에 남긴다. 1 이상인지만 단정한다'
    test: ContextSwitchingTest.cores
  - claim: '코어보다 많은 계산 스레드도 모두 조금씩 진행한다'
    how: '코어 수의 네 배만큼 스레드를 띄워 스레드마다 센 값이 모두 0보다 커지는지 본다. 기계가 바빠도 흔들리지 않게 10초까지 기다린다'
    test: ContextSwitchingTest.allThreadsProgress
  - claim: '두 스레드가 값을 10만 번 주고받는 시간은 한 스레드가 같은 일을 하는 시간보다 길다'
    how: '`SynchronousQueue` 두 개로 주고받는 시간과 한 스레드의 반복 시간을 잰다. 비교만 단정하고 값은 남긴다'
    test: ContextSwitchingTest.pingPongCostsMore
  - claim: '기다리는 작업 16개는 스레드 1개 풀에서 1.6초 넘게 걸리고, 스레드 16개 풀에서는 그 절반도 안 걸린다'
    how: '100ms sleep 작업 16개를 두 풀로 돌려 시간을 잰다. 처음에는 5배로 단정했지만 바쁜 기계에서 흔들려 하한과 절반으로 바꿨다'
    test: ContextSwitchingTest.waitingTasksScaleWithThreads
  - claim: '계산 작업은 코어 수를 넘는 스레드에서 코어 수의 스레드보다 크게 빨라지지 않는다'
    how: '같은 계산 작업 8개를 코어 수와 코어 수의 16배 풀로 돌린다. 16배 풀이 1.5배 넘게 빠르지 않은지만 단정하고 값은 남긴다'
    test: ContextSwitchingTest.cpuTasksDoNotScalePastCores
sources:
  - '스레드의 상태: `Thread.State` API 문서 https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/lang/Thread.State.html'
  - '`availableProcessors`와 컨테이너: API 문서 https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/lang/Runtime.html#availableProcessors() , java 명령 문서의 `-XX:ActiveProcessorCount` https://docs.oracle.com/en/java/javase/21/docs/specs/man/java.html'
  - '리눅스 스케줄러(CFS): 리눅스 커널 문서 https://docs.kernel.org/scheduler/sched-design-CFS.html'
  - '`server.tomcat.threads.max`: 스프링 부트 속성 목록 https://docs.spring.io/spring-boot/appendix/application-properties/index.html'
