# 해시 테이블 (설계서)
# 자료 파일의 칸은 docs/lesson-data-format.md에 있다.
stage: design
title: 해시 테이블
unit: 자료구조와 알고리즘
roadmap: K4
type: 자바 실행
prerequisites:
  - {slug: time-complexity, title: 시간 복잡도}
  - {slug: equals-hashcode, title: equals와 hashCode}
assume: '자바 21(OpenJDK). `HashMap`은 `hashCode`로 찾을 곳을 좁히고 같은 값의 키에만 `equals`를 부른다는 것(equals와 hashCode 레슨). 배열은 i번째 칸을 O(1)에 읽는다는 것(배열과 연결 리스트 레슨). 비트 연산 `&`는 이 레슨에서 한 번 설명해요.'
example: '회원 이메일을 키로 등급을 담는 `HashMap<String, String>`. 키를 넣을 때 몇 번째 칸에 들어가는지 계산해 보고, 칸이 겹칠 때와 배열이 커질 때를 들여다봐요. 실무 구역에서는 크기를 미리 아는 맵과, 순서가 필요한 응답 JSON으로 옮겨요.'
intro:
  - '회원 100만 명 가운데 이메일 하나로 회원을 찾는 데, 리스트는 최악에 100만 번 비교하지만 `HashMap`은 몇 번이면 끝나요. 그런데 키의 `hashCode`를 잘못 만든 클래스를 키로 쓰면 `HashMap`도 리스트처럼 느려져요. 무엇이 빠르게 하고 무엇이 그것을 망치는지는 안을 봐야 알 수 있어요.'
  - '자바 개발자는 `HashMap`과 `HashSet`을 가장 많이 쓰는 자료구조로 손꼽아요. 캐시, 중복 제거, id로 묶기가 모두 해시 테이블이에요. 면접에서도 "HashMap은 어떻게 동작하나요", "충돌은 어떻게 처리하나요"를 거의 빠짐없이 물어요.'
  - '이 레슨에서는 리플렉션으로 `HashMap`의 안쪽 배열을 열어, 키가 들어가는 칸, 칸이 겹칠 때의 모양, 배열이 두 배로 커지는 순간을 실제로 확인해요.'
covers:
  - topic: '해시 테이블은 배열이다. 키의 해시 값으로 몇 번째 칸(버킷)에 둘지 계산해서, 찾을 때도 같은 계산으로 그 칸만 본다. 그래서 평균 O(1)이다'
    where: '질문 1'
  - topic: 'HashMap은 hashCode의 위쪽 비트를 아래로 섞은 뒤, 배열 길이에서 1을 뺀 값과 &로 칸 번호를 얻는다. 배열 길이는 늘 2의 거듭제곱이다'
    where: '질문 1'
  - topic: 'HashSet은 안에 HashMap을 가지고 원소를 키로 담는다'
    where: '질문 1'
  - topic: '서로 다른 키가 같은 칸에 가는 충돌은 피할 수 없다. 칸의 수가 키의 가짓수보다 적기 때문이다'
    where: '질문 2'
  - topic: 'HashMap은 한 칸에 든 키들을 연결 리스트로 잇고, 그 칸에서 equals로 하나씩 비교한다'
    where: '질문 2'
  - topic: '모든 키의 hashCode가 같으면 모든 키가 한 칸에 몰려 O(n)이 된다'
    where: '질문 2. 규약과 hashCode 만들기는 equals와 hashCode(J6)'
  - topic: '한 칸에 8개 넘게 몰리고 배열이 64칸 이상이면 그 칸을 트리로 바꿔 O(log n)으로 막는다. 키가 Comparable이면 더 잘 동작한다'
    where: '질문 2의 더 알아보기. 트리는 이진 탐색 트리(K8)'
  - topic: '부하율(load factor) 0.75: 원소 수가 배열 길이의 0.75배를 넘으면 배열을 두 배로 늘린다. 기본 길이 16이라 13번째에서 32가 된다'
    where: '질문 3'
  - topic: '배열을 늘리면 모든 키의 칸을 다시 정한다. 그 순간은 O(n)이지만 분할 상환 O(1)이다'
    where: '질문 3'
  - topic: '부하율이 낮으면 충돌이 줄고 메모리를 더 쓴다. 높으면 반대다'
    where: '질문 3'
  - topic: 'HashMap을 돌 때의 순서는 칸의 순서라서 넣은 순서와 상관없고, 배열이 커지면 바뀔 수 있다. 순서를 약속하지 않는다'
    where: '질문 4'
  - topic: 'LinkedHashMap은 넣은 순서를 지킨다. 키 순서가 필요하면 TreeMap'
    where: '질문 4. TreeMap은 이진 탐색 트리(K8)'
  - topic: '크기를 알 때 HashMap.newHashMap(n)으로 처음부터 넉넉하게 만든다. new HashMap<>(n)은 n개를 담는 크기가 아니다'
    where: '실무에서는'
  - topic: 'HashMap으로 만든 응답 JSON의 키 순서'
    where: '실무에서는'
  - topic: 'HashMap은 null 키 하나와 null 값을 받는다'
    where: '질문 1의 더 알아보기'
  - topic: '여러 스레드가 함께 쓰는 HashMap과 ConcurrentHashMap'
    where: '다루지 않음: 스레드에 안전한 객체(C6)'
  - topic: '키로 넣은 객체의 필드를 바꾸면 찾지 못한다'
    where: '다루지 않음: equals와 hashCode(J6)'
codes:
  predict: |-
    Map<String, String> grade =
        new HashMap<>();
    for (int i = 1; i <= 13; i++) {
      grade.put("user" + i + "@a.com",
          "BASIC");
    }
    // 안쪽 배열의 길이는?
  index: |-
    int h = key.hashCode();
    h = h ^ (h >>> 16);
    int index = h & (table.length - 1);
  badKey: |-
    record Email(String value) {
      @Override
      public int hashCode() {
        return 1;
      }
    }
  order: |-
    Map<String, Integer> m = new HashMap<>();
    m.put("banana", 1);
    m.put("apple", 2);
    m.put("cherry", 3);
    System.out.println(m.keySet());
  presize: |-
    Map<Long, Member> byId =
        HashMap.newHashMap(members.size());
  response: |-
    @GetMapping("/summary")
    Map<String, Object> summary() {
      Map<String, Object> body =
          new HashMap<>();
      body.put("total", 3);
      body.put("paid", 2);
      body.put("canceled", 1);
      return body;
    }
predict:
  text: '코드 predict는 빈 `HashMap`에 키 13개를 넣어요. `HashMap`의 안쪽 배열은 처음 넣을 때 길이 16으로 생겨요. 13개를 다 넣은 뒤 길이는 얼마일까요? 보기: 16, 24, 32, 64.'
  answer: '32. 원소 수가 길이의 0.75배인 12를 넘는 13번째에서 배열을 두 배로 늘린다. 질문 3에서 밝힌다.'
questions:
  - id: q1
    title: HashMap은 키로 값을 어떻게 한 번에 찾나요?
    conclusion:
      lead: '키의 해시 값으로 배열의 몇 번째 칸에 둘지 계산해서, 찾을 때도 같은 계산으로 그 칸 하나만 봐요.'
      sub: '칸 번호를 계산 한 번으로 얻고 배열은 i번째 칸을 O(1)에 읽으니, 평균 O(1)에 찾아요.'
    says:
      - '`HashMap`은 안에 배열을 가진다. 칸 하나를 버킷이라고 한다. `put`은 키로 칸 번호를 계산해 그 칸에 키와 값을 둔다. `get`은 같은 키로 같은 계산을 해서 그 칸만 본다. 다른 칸은 보지 않는다'
      - '칸 번호를 구하는 계산은 코드 index다. `hashCode`를 그대로 쓰지 않고 위쪽 16비트를 아래쪽에 섞는다(`^`). 그다음 배열 길이에서 1을 뺀 값과 `&`를 한다'
      - '`&`의 뜻을 한 번 설명한다. 길이가 16이면 `length - 1`은 2진수 `1111`이다. `h & 1111`은 `h`의 아래 4비트만 남겨 0부터 15 사이의 값이 된다. 길이가 늘 2의 거듭제곱이라서 나머지 연산 대신 이 계산을 쓴다'
      - '위쪽 비트를 섞는 이유. 길이가 16이면 아래 4비트만 쓰인다. 아래 비트가 비슷한 키들이 같은 칸에 몰리지 않게 위쪽 비트도 칸 번호에 반영한다'
      - '예제의 키 몇 개로 `hashCode`, 섞은 값, 칸 번호를 표로 계산하고, 리플렉션으로 읽은 실제 칸과 같은지 보인다'
      - '`HashSet`은 안에 `HashMap`을 하나 가지고 원소를 키로, 정해진 빈 객체를 값으로 담는다. 그래서 동작이 같다'
      - '더 알아보기: `HashMap`은 null 키를 하나 받는다. null의 해시 값은 0으로 보고 0번 칸에 둔다'
    asks:
      - '본문의 예시: 배열 길이가 16일 때, 섞은 해시 값이 2진수로 `...0110_1011`인 키는 몇 번 칸에 들어가나 (11번. 아래 4비트 `1011`)'
      - '옮긴 상황: 회원 100만 명을 리스트에 담고 이메일로 찾는 것과, 이메일을 키로 한 `HashMap`에서 찾는 것의 평균 비교 횟수는 각각 어느 정도인가 (리스트는 수십만 번, `HashMap`은 칸 하나의 키 몇 개)'
  - id: q2
    title: 서로 다른 키가 같은 칸에 가면 어떻게 되나요?
    conclusion:
      lead: '그 칸에 키들을 줄줄이 이어 두고, 찾을 때 그 줄에서 `equals`로 하나씩 비교해요.'
      sub: '그래서 한 칸에 많이 몰릴수록 느려져요. 모든 키의 `hashCode`가 같으면 한 칸에 다 몰려 리스트처럼 O(n)이 돼요.'
    says:
      - '충돌은 피할 수 없다. `hashCode`는 int라 가짓수가 40억이 넘지만 칸은 16개, 32개다. 다른 키가 같은 칸에 오는 일이 늘 생긴다'
      - '`HashMap`의 칸에는 노드가 하나 있고 노드는 다음 노드를 가리킨다(K2의 연결 리스트). 같은 칸에 오면 뒤에 붙인다. `get`은 그 칸의 노드를 따라가며 해시 값이 같은지 먼저 보고, 같으면 `equals`를 부른다(J6에서 본 순서)'
      - '코드 badKey. `hashCode`가 늘 1인 키 1만 개를 넣는다. 모두 한 칸에 간다. 없는 키를 `get`할 때 `equals`가 불린 횟수를 세고, 제대로 만든 `hashCode`의 키와 비교한다. 1만 개 대 몇 개다'
      - '`hashCode`는 다른 키에 되도록 다른 값을 주게 만든다. 만드는 방법은 J6에서 다뤘다. 이 레슨은 그렇게 하지 않았을 때 왜 느린지를 보인다'
      - '더 알아보기: 자바 8부터는 한 칸에 8개 넘게 몰리고 배열이 64칸 이상이면 그 칸의 연결 리스트를 트리로 바꾼다. 그 칸을 찾는 비용이 O(n)에서 O(log n)으로 준다. 배열이 64칸보다 작으면 트리 대신 배열을 늘린다. 칸의 노드 클래스 이름이 `TreeNode`로 바뀌는 것을 리플렉션으로 보인다. 트리는 K8에서 다룬다'
    widget:
      kind: steps
      note: '칸 8개짜리 배열에 키를 하나씩 넣는다. 키마다 칸 번호를 계산해 보이고 그 칸에 노드를 둔다. 셋째 키가 첫째 키와 같은 칸에 가서 노드가 이어지는 단계를 강조한다. 마지막 단계는 그 칸에서 셋째 키를 `get`할 때 해시 비교와 `equals`를 차례로 하는 것이다'
    asks:
      - '본문의 예시: 코드 badKey의 키 1만 개를 넣은 `HashMap`에서 없는 키를 `get`하면 `equals`는 몇 번쯤 불리나 (1만 번쯤. 모두 한 칸에 있다)'
      - '옮긴 상황: 상품 클래스의 `hashCode`를 `category.hashCode()`로 만들었고 카테고리는 3가지뿐이다. 상품 9만 개를 `HashSet`에 넣으면 칸 하나에 몇 개쯤 몰리고, `contains`는 평균 O(1)인가 (3만 개쯤. 아니다. 한 칸을 길게 따라가야 한다)'
  - id: q3
    title: 원소가 늘면 HashMap은 언제 배열을 늘리나요?
    conclusion:
      lead: '원소 수가 배열 길이의 0.75배를 넘으면 배열을 두 배로 늘리고, 모든 키의 칸을 다시 정해요.'
      sub: '0.75를 부하율이라고 해요. 칸에 비해 원소가 많아질수록 충돌이 잦아지니, 그 전에 칸을 늘려 칸마다 원소가 적게 유지되게 해요.'
    says:
      - '처음 `put`에서 길이 16의 배열이 생긴다. 늘리는 기준은 16 × 0.75 = 12다. 코드 predict에서 13번째 키를 넣으면 길이 32로 늘어난다. 예측의 답을 밝힌다. 리플렉션으로 넣을 때마다 읽은 길이를 실제 출력으로 보인다'
      - '배열을 늘리면 칸 번호 계산의 `length - 1`이 바뀐다. 그래서 모든 키를 새 배열의 칸으로 옮긴다. 길이가 두 배가 되면 각 키는 원래 칸 그대로이거나 "원래 칸 + 옛 길이"로 간다. 그 순간은 O(n)이지만 가끔이라 분할 상환 O(1)이다(K1)'
      - '부하율을 낮추면 일찍 늘려 충돌이 줄고 메모리를 더 쓴다. 높이면 반대다. 0.75는 둘 사이의 기본값이고 바꿀 일은 드물다'
      - '원소가 줄어도 배열은 줄지 않는다'
    asks:
      - '본문의 예시: 기본 설정의 빈 `HashMap`에 키를 25개 넣으면 안쪽 배열의 길이는 얼마인가 (64. 12를 넘을 때 32, 24를 넘을 때 64)'
      - '옮긴 상황: 부하율이 0.75이고 배열 길이가 64인 `HashMap`이 있다. 원소가 몇 개를 넘으면 배열이 128로 늘어나나 (48개)'
  - id: q4
    title: HashMap을 돌면 왜 넣은 순서와 다르게 나오나요?
    conclusion:
      lead: '`HashMap`은 칸의 순서대로 돌고, 칸은 넣은 순서가 아니라 해시 값으로 정해지기 때문이에요.'
      sub: '순서를 약속하지 않고 배열이 커지면 바뀔 수도 있어요. 넣은 순서가 필요하면 `LinkedHashMap`을, 키의 크기 순서가 필요하면 `TreeMap`을 써요.'
    says:
      - '코드 order를 돌린다. banana, apple, cherry로 넣었지만 출력 순서는 해시 값으로 정해진 칸 순서다. 실제 출력을 보인다'
      - '`keySet`, `values`, `entrySet`은 배열을 0번 칸부터 차례로 돈다. 그래서 같은 키들이라도 배열 길이가 바뀌면 순서가 바뀔 수 있다. 키를 많이 넣어 배열이 커진 뒤 같은 키들의 순서를 다시 출력해 다른 것을 보인다'
      - '자바 API 문서는 `HashMap`의 순서를 약속하지 않는다. 지금 순서에 기대는 코드는 자바 버전이나 원소 수가 바뀌면 깨진다'
      - '`LinkedHashMap`은 노드를 넣은 순서대로 한 줄로 더 잇는다. 같은 코드에서 `LinkedHashMap`으로 바꾸면 banana, apple, cherry 순서다. 찾는 비용은 `HashMap`과 같고 메모리를 조금 더 쓴다'
      - '키의 크기 순서(사전 순)가 필요하면 `TreeMap`이다. 트리라서 찾는 비용이 O(log n)이다. K8에서 다룬다'
    asks:
      - '본문의 예시: 코드 order의 `HashMap`을 `LinkedHashMap`으로 바꾸면 출력은 무엇인가 (`[banana, apple, cherry]`)'
      - '옮긴 상황: `HashMap`에 넣은 회원을 `values()`로 꺼내 화면에 가입 순서대로 보여 주려 한다. 이 코드가 가입 순서를 지킨다고 할 수 있나 (없다. `HashMap`은 순서를 약속하지 않는다. `LinkedHashMap`을 쓰거나 가입일로 정렬한다)'
      - '실무 구역: 코드 response가 돌려주는 JSON의 키 순서는 total, paid, canceled로 정해지나 (정해지지 않는다. `HashMap`의 순서를 따른다)'
practice:
  says:
    - '크기를 알면 처음부터 넉넉하게 만든다. 회원 1만 명을 id로 찾는 맵을 만들 때 배열이 16, 32, ..., 16384로 열 번 늘어난다. 코드 presize처럼 자바 19부터 있는 `HashMap.newHashMap(n)`을 쓰면 n개를 넣어도 늘지 않는 길이로 만든다. 늘어난 횟수를 리플렉션으로 세어 비교한다'
    - '흔한 실수 하나: `new HashMap<>(10000)`을 "1만 개를 담는 맵"으로 안다. 이 숫자는 배열의 처음 길이(2의 거듭제곱으로 올림한 16384)이고, 0.75를 곱한 12288개를 넘으면 늘어난다. 1만 개에는 맞지만 1만 3천 개면 늘어난다. `newHashMap`은 부하율을 계산해 준다 (자바 API 문서 근거, 길이는 테스트로 확인)'
    - '흔한 실수 둘: 코드 response처럼 응답 본문을 `HashMap`으로 만들고 클라이언트가 키 순서에 기대게 둔다. 스프링 MVC는 잭슨으로 맵을 JSON으로 바꾸고, 잭슨은 맵을 도는 순서대로 쓴다. 고친 코드: `LinkedHashMap`을 쓰거나 응답을 record로 만든다. record는 구성 요소를 선언한 순서로 나간다. 두 경우의 JSON을 `ObjectMapper`로 만들어 테스트로 남긴다'
    - 'JSON 객체의 키 순서는 원래 뜻이 없다. 그래도 사람이 읽는 응답과 테스트의 비교 문자열은 순서가 정해져 있는 편이 낫다'
claims:
  - claim: '키 몇 개의 칸 번호를 `(h ^ (h >>> 16)) & (length - 1)`로 계산한 값과 실제로 들어간 칸이 같다'
    how: '`ChildJvm`에 `--add-opens java.base/java.util=ALL-UNNAMED`를 주고 `table`을 리플렉션으로 읽어 키가 있는 칸을 찾는다'
  - claim: '빈 `HashMap`에 키를 넣으면 길이가 16에서 13번째에 32, 25번째에 64가 된다'
    how: '같은 방법으로 넣을 때마다 `table`의 길이를 읽는다'
  - claim: '`hashCode`가 늘 1인 키 1만 개를 넣은 맵에서 없는 키를 찾으면 `equals`가 키 수에 가까운 횟수로 불린다'
    how: '`equals`를 세는 키 클래스로 센다. 트리로 바뀐 경우를 피하려면 `Comparable`이 아닌 키를 쓰고 센 값을 남긴다. 횟수가 몇 번이 아니라 수천 번 이상인 것만 단정한다'
  - claim: '한 칸에 9개째를 넣을 때 배열이 64칸 이상이면 그 칸의 노드가 `TreeNode`가 된다'
    how: '같은 칸에 가는 키를 만들어 넣고 칸의 노드 클래스 이름을 읽는다'
  - claim: '같은 키들도 배열이 커진 뒤에는 `keySet` 순서가 달라질 수 있고, `LinkedHashMap`은 넣은 순서를 지킨다'
    how: '코드 order의 출력과, 키를 더 넣은 뒤의 순서, `LinkedHashMap`의 순서를 남긴다. 순서가 바뀌는 키는 테스트에서 찾아 고정한다'
  - claim: '`HashMap.newHashMap(10000)`에 1만 개를 넣으면 배열이 늘지 않고, `new HashMap<>()`은 열 번 늘어난다'
    how: '리플렉션으로 길이가 바뀐 횟수를 센다'
  - claim: '`LinkedHashMap`과 record로 만든 응답은 잭슨이 넣은 순서, 선언한 순서로 쓴다'
    how: '`ObjectMapper.writeValueAsString`의 결과를 본다'
sources:
  - '`HashMap`의 부하율 0.75, 기본 용량, 순서를 약속하지 않는다는 것, `newHashMap`: API 문서 https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/HashMap.html'
  - '`LinkedHashMap`이 넣은 순서를 지킨다는 것: API 문서 https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/LinkedHashMap.html'
  - '한 칸이 트리로 바뀌는 기준(TREEIFY_THRESHOLD 8, MIN_TREEIFY_CAPACITY 64): JEP 180 https://openjdk.org/jeps/180'
  - '`HashSet`이 안에 `HashMap`을 쓴다는 것: API 문서 https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/HashSet.html'
