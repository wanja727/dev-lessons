# 도메인 모델과 트랜잭션 스크립트
# 자료 파일의 칸은 docs/lesson-data-format.md에 있다. 문제는 content/questions/domain-model.yaml에 있다.
title: 도메인 모델과 트랜잭션 스크립트
description: 업무 로직을 서비스에 절차로 쓰는 트랜잭션 스크립트와 엔티티의 메서드에 두는 도메인 모델, 규칙이 엔티티에 있을 때 달라지는 것, 애그리거트와 경계, 고르는 기준. 같은 주문 취소를 두 방식으로 짜서 규칙을 빠뜨린 새 기능을 막는지 확인하는 대화형 레슨.
unit: 시스템 설계와 아키텍처
minutes: 20
roadmap: A2
type: 설계
prerequisites:
  - {slug: layered-architecture, title: 계층형 아키텍처}
  - {slug: jpa-persistence-context, title: 영속성 컨텍스트}
assume: '스프링 부트 3.5, Hibernate 6.6, PostgreSQL 16. 컨트롤러, 서비스, 리포지토리의 역할(계층형 아키텍처 레슨). 트랜잭션 안에서 엔티티의 필드를 바꾸면 커밋할 때 UPDATE가 나간다는 것(영속성 컨텍스트 레슨).'
example: '주문 취소. 주문(`Order`)과 주문 상품(`OrderLine`)이 있고, 배송이 시작된 주문은 취소할 수 없으며, 취소하면 상품의 재고를 되돌린다. 같은 규칙을 서비스에 쓴 코드와 엔티티에 쓴 코드로 비교한다.'
intro:
  - '"배송이 시작된 주문은 취소할 수 없다"는 규칙이 주문 취소 서비스에만 있었어요. 고객센터용 일괄 취소 기능을 다른 사람이 새로 만들면서 그 확인을 빠뜨렸고, 이미 출고된 주문이 취소되어 환불까지 나갔어요.'
  - '스프링으로 서비스를 짜면 업무 로직을 서비스 메서드에 쭉 적고 엔티티는 게터와 세터만 두기 쉬워요. 개발자는 규칙을 서비스에 둘지 엔티티에 둘지 매번 정하게 되고, 면접에서는 "도메인 모델 패턴", "애그리거트"라는 말로 물어요.'
  - '이 레슨에서는 같은 주문 취소를 두 방식으로 짜고, 규칙을 빠뜨린 새 기능을 더했을 때 어느 쪽이 막아 주는지 테스트로 돌려 봐요. 엔티티 메서드로 바꾼 값이 변경 감지로 UPDATE가 되는 것도 확인해요.'
covers:
  - topic: '트랜잭션 스크립트: 요청 하나를 처리하는 절차를 서비스 메서드에 위에서 아래로 쓴다. 엔티티는 값만 든다'
    where: '질문 1'
  - topic: '도메인 모델: 규칙을 그 데이터를 가진 객체(엔티티)의 메서드에 둔다. 서비스는 객체를 꺼내 메서드를 부르고 저장을 맡긴다'
    where: '질문 1'
  - topic: '트랜잭션 스크립트는 단순한 CRUD에서 짧고 읽기 쉽다. 규칙이 많아지면 같은 확인이 여러 서비스에 흩어져 빠뜨리기 쉽다'
    where: '질문 2'
  - topic: '도메인 모델에서는 상태를 바꾸는 길이 메서드 하나라서 규칙을 우회할 수 없다. 세터를 열어 두면 이 장점이 사라진다'
    where: '질문 2'
  - topic: 'JPA의 변경 감지 덕분에 엔티티 메서드가 필드만 바꿔도 UPDATE가 나간다. 그래서 도메인 모델이 JPA와 잘 맞는다'
    where: '질문 2'
  - topic: '엔티티 메서드는 DB나 외부 API 없이 단위 테스트로 확인할 수 있다'
    where: '질문 2'
  - topic: '애그리거트: 함께 바뀌어야 하는 객체 묶음과 그 입구(루트). 주문 상품은 주문을 통해서만 바꾼다'
    where: '질문 3'
  - topic: '애그리거트 하나를 한 트랜잭션으로 바꾸고, 다른 애그리거트는 id로 가리킨다'
    where: '질문 3'
  - topic: '애그리거트의 경계를 크게 잡으면 동시 수정 충돌이 늘고, 작게 잡으면 규칙을 지키기 어렵다'
    where: '질문 3의 더 알아보기. 동시 수정은 낙관적 락과 비관적 락(D10)'
  - topic: '어느 쪽을 고르나: 규칙이 적은 조회와 단순 저장은 스크립트로, 상태와 규칙이 많은 핵심 객체는 모델로. 한 프로젝트에서 섞어 쓴다'
    where: '질문 4'
  - topic: '서비스가 하는 일: 트랜잭션, 객체 꺼내기와 저장, 여러 애그리거트와 외부 시스템 잇기. 규칙 자체는 엔티티에'
    where: '질문 4'
  - topic: '엔티티의 세터를 닫고 의도가 드러나는 메서드 이름(cancel, changeAddress)을 쓴다. JPA는 기본 생성자가 필요해 protected로 둔다'
    where: '실무에서는'
  - topic: '도메인 이벤트로 애그리거트 사이를 잇기'
    where: '다루지 않음: 스프링 이벤트(S13)'
  - topic: '도메인을 바깥 기술에서 떼어 내는 구조'
    where: '다루지 않음: 헥사고날 아키텍처(A21)'
codes:
  predict: |-
    @Transactional
    void bulkCancel(List<Long> ids) {
      for (Long id : ids) {
        Order o = orders.findById(id)
            .orElseThrow();
        o.setStatus(CANCELED);
      }
    }
  predictMark: |-
    @Transactional
    void bulkCancel(List<Long> ids) {
      for (Long id : ids) {
        Order o = orders.findById(id)
            .orElseThrow();
        [[o.setStatus(CANCELED);]]
      }
    }
  script: |-
    @Transactional
    void cancel(Long orderId) {
      Order o = orders.findById(orderId)
          .orElseThrow();
      [[if (o.getStatus() == SHIPPED) {]]
        [[throw new CannotCancel();]]
      [[}]]
      o.setStatus(CANCELED);
      for (OrderLine l : o.getLines()) {
        Product p = l.getProduct();
        p.setStock(p.getStock()
            + l.getQuantity());
      }
    }
  model: |-
    public void cancel() {
      [[if (status == SHIPPED) {]]
        [[throw new CannotCancel();]]
      [[}]]
      status = CANCELED;
      lines.forEach(OrderLine::restock);
    }
  modelService: |-
    @Transactional
    void cancel(Long orderId) {
      orders.findById(orderId)
          .orElseThrow()
          [[.cancel()]];
    }
  unitTest: |-
    @Test
    void 배송된_주문은_취소할_수_없다() {
      Order order = new Order(1L);
      order.addLine(product, 1, 5_000);
      order.ship();
      assertThatThrownBy(order::cancel)
          .isInstanceOf(CannotCancel.class);
    }
  aggregate: |-
    public class Order {
      private Long memberId;
      private long totalPrice;
      @OneToMany(cascade = ALL,
          orphanRemoval = true)
      private List<OrderLine> lines;

      public void addLine(Product p,
          int qty, long price) {
        lines.add(
            new OrderLine(p, qty, price));
        [[totalPrice += price * qty;]]
      }
    }
  aggRun: |-
    order.addLine(a, 2, 5_000);
    order.addLine(b, 1, 3_000);
    order.getTotalPrice();   // 13000
    order.getLines().clear();
  withService: |-
    @Transactional
    void cancel(Long orderId) {
      Order order = orders
          .findById(orderId).orElseThrow();
      order.cancel();
      [[refundClient.refund(]]
          [[order.getPaymentId())]];
    }
  entityShape: |-
    @Entity
    @Getter
    @NoArgsConstructor(
        access = AccessLevel.PROTECTED)
    public class Order {
      ...
      public Order(Long memberId) { ... }
      public void addLine(...) { ... }
      public void cancel() { ... }
      public void changeAddress(
          Address to) { ... }
    }
  lombokData: |-
    @Entity
    [[@Data]]
    public class Order {
      private OrderStatus status;
      ...
    }
links:
  test: https://github.com/wanja727/dev-lessons/blob/main/verification/src/test/java/lab/devlessons/domainmodel/DomainModelTest.java
  script: https://martinfowler.com/eaaCatalog/transactionScript.html
  model: https://martinfowler.com/eaaCatalog/domainModel.html
  aggregate: https://martinfowler.com/bliki/DDD_Aggregate.html
  jpaSpec: https://jakarta.ee/specifications/persistence/3.1/jakarta-persistence-spec-3.1
  lombok: https://projectlombok.org/features/Data
predict:
  title: 새 기능이 규칙을 빠뜨리면?
  text: '주문 취소 규칙("배송된 주문은 취소 불가")이 주문 취소 서비스에 있어요. 다른 개발자가 일괄 취소 코드 predict를 새로 만들었어요. 배송된 주문의 id가 섞여 들어오면 어떻게 될까요? 답은 질문 2에 나와요.'
  code: predict
  label: 내 예측
  options:
    - value: canceled
      label: 배송된 주문도 취소된다
    - value: exception
      label: CannotCancel 예외가 난다
    - value: compile
      label: 컴파일 오류가 난다
  answer: canceled
  storageKey: domain-model-predict
  wrong: 예측은 "{label}"이었어요. 틀린 예측이 더 오래 남으니 괜찮아요.
questions:
  - id: q1
    title: 트랜잭션 스크립트와 도메인 모델은 로직을 어디에 두나요?
    conclusion:
      lead: '트랜잭션 스크립트는 서비스 메서드에 절차로 쓰고, 도메인 모델은 그 데이터를 가진 엔티티의 메서드에 둬요.'
      sub: '앞의 엔티티는 값만 들고 서비스가 다 하고, 뒤의 엔티티는 자기 규칙을 지키고 서비스는 엔티티를 꺼내 메서드를 불러요.'
    says:
      - '코드 script: 서비스가 상태를 읽어 확인하고, 세터로 바꾸고, 재고까지 계산한다. 이것이 트랜잭션 스크립트다'
      - '코드 model: 같은 규칙이 `Order.cancel()`에 있다. 서비스는 `findById` 뒤 `order.cancel()` 한 줄을 부른다'
      - '두 코드는 같은 일을 한다. 같은 데이터로 돌려 상태와 재고가 같아지는 것을 테스트로 보인다'
      - '이름의 뜻: 트랜잭션 스크립트는 요청(트랜잭션) 하나를 대본(스크립트)처럼 위에서 아래로 쓴다는 뜻이다. 도메인 모델은 업무 세계(도메인)를 객체로 옮긴다는 뜻이다'
    asks:
      - '본문의 예시: 코드 script에서 "배송된 주문은 취소 불가"라는 규칙은 어느 클래스에 있나 (서비스)'
      - '옮긴 상황: 포인트를 쓰는 기능에서 `MemberService.use`가 `member.getPoint()`를 읽어 비교하고 `member.setPoint(...)`로 줄인다. 이 코드는 두 방식 가운데 무엇이고, 도메인 모델로 바꾸면 어디에 무슨 메서드가 생기나 (트랜잭션 스크립트. `Member.usePoint(amount)`)'
    body:
      - p: '주문 취소를 서비스에 쓰면 이렇게 돼요. 주문을 꺼내고, 상태를 확인하고, 세터로 바꾸고, 재고를 되돌려요.'
      - code: script
        notes:
          - mark: 'if (o.getStatus() == SHIPPED) {'
            as: code
            text: '규칙이 **서비스**에 있어요. 엔티티 `Order`는 상태 값을 들고 있을 뿐, 그 값으로 무엇을 해도 되는지 몰라요.'
      - p: '요청 하나(트랜잭션)를 처리하는 절차를 대본(스크립트)처럼 위에서 아래로 쓴다고 해서 **트랜잭션 스크립트**라고 해요([마틴 파울러의 설명](link:script)). 엔티티는 게터와 세터로 값을 주고받고, 판단은 모두 서비스가 해요.'
      - p: '같은 규칙을 주문 엔티티 안에 두면 이렇게 돼요.'
      - code: model
        notes:
          - mark: 'if (status == SHIPPED) {'
            as: code
            text: '규칙이 **엔티티**에 있어요. 주문은 자기 상태를 보고 취소해도 되는지 스스로 정해요. 재고를 되돌리는 일도 주문 상품에게 시켜요.'
      - code: modelService
        notes:
          - mark: .cancel()
            as: code
            text: '서비스는 주문을 꺼내 `cancel()`을 부르기만 해요. 트랜잭션을 여는 것과 주문을 찾는 것이 서비스의 일이에요.'
      - p: '업무 세계(도메인)의 개념과 규칙을 객체로 옮긴다고 해서 **도메인 모델**이라고 해요([마틴 파울러의 설명](link:model)). 두 코드는 같은 일을 해요. 재고 10인 상품을 2개 산 주문을 두 방식으로 취소해 봤어요.'
      - ci:
          key: same
          label: 실제 결과 보기
          source: DomainModelTest.sameResult
      - p: '결과는 같아요. 다른 것은 **규칙이 어디에 있느냐**예요. 이 차이가 무엇을 바꾸는지는 다음 질문에서 봐요.'
      - quiz:
          q: '`MemberService.use`가 `member.getPoint()`로 포인트를 읽어 모자라면 예외를 던지고, `member.setPoint(...)`로 줄여요. 이 코드는 어느 방식인가요?'
          options:
            - '트랜잭션 스크립트'
            - '도메인 모델'
            - '둘 다 아니다'
          answer: 1
          explain: '판단과 계산이 서비스에 있고 회원 엔티티는 값만 들어요. 도메인 모델로 바꾸면 `Member.usePoint(amount)`가 규칙을 가져요.'
      - next: '결과가 같다면 규칙을 어디에 두든 상관없을까요? 주문을 취소하는 기능이 하나 더 생기면 어떻게 될까요?'
    recall: '트랜잭션 스크립트는 요청 하나의 절차를 서비스 메서드에 위에서 아래로 써요. 엔티티는 게터와 세터로 값만 들고, 상태 확인과 계산은 서비스가 해요. 도메인 모델은 규칙을 그 데이터를 가진 엔티티의 메서드(`order.cancel()`)에 두고, 서비스는 트랜잭션을 열고 엔티티를 꺼내 메서드를 불러요. 같은 일을 하지만 규칙이 있는 곳이 달라요.'
  - id: q2
    title: 규칙이 엔티티 안에 있으면 무엇이 달라지나요?
    conclusion:
      lead: '상태를 바꾸는 길이 그 메서드 하나뿐이라, 어느 서비스에서 바꾸든 규칙을 건너뛸 수 없어요.'
      sub: '트랜잭션 스크립트는 같은 확인을 서비스마다 다시 써야 해서 하나를 빠뜨리면 규칙이 깨져요. JPA의 변경 감지 덕분에 엔티티 메서드가 필드만 바꿔도 UPDATE가 나가요.'
    says:
      - '코드 predict를 돌리면 배송된 주문이 취소된다. 예측의 답을 밝힌다. 규칙은 `cancel` 서비스에만 있었고 `setStatus`가 열려 있었다'
      - '도메인 모델로 바꾸면 세터가 없고 `order.cancel()`만 있다. 일괄 취소도 `cancel()`을 불러야 하고, 배송된 주문에서 `CannotCancel`이 난다. 테스트로 보인다'
      - '엔티티 메서드는 필드만 바꾸고 저장을 부르지 않는다. 트랜잭션이 끝날 때 변경 감지가 UPDATE를 보낸다(P2). 나간 SQL을 실제 출력으로 보인다'
      - '`Order.cancel()`은 DB 없이 `new Order(...)`로 만들어 단위 테스트할 수 있다. 규칙을 확인하는 데 스프링도 DB도 필요 없다'
      - '트랜잭션 스크립트가 나쁜 것은 아니다. 규칙이 없는 저장과 조회에서는 더 짧다. 규칙이 같은 데이터에 여러 번 쓰일 때 흩어지는 것이 문제다'
    widget:
      kind: compare
      note: '왼쪽 트랜잭션 스크립트(서비스 셋: 취소, 일괄 취소, 관리자 취소), 오른쪽 도메인 모델(서비스 셋과 Order.cancel). 바뀐 요구를 고르면 고칠 곳이 강조된다. 요구: "결제 대기 주문도 취소 불가"를 더하기, 일괄 취소 기능 더하기'
    asks:
      - '본문의 예시: 도메인 모델로 만든 `Order`에서 일괄 취소가 배송된 주문의 `cancel()`을 부르면 어떻게 되나 (`CannotCancel` 예외. 규칙이 메서드 안에 있다)'
      - '옮긴 상황: 쿠폰의 "만료된 쿠폰은 쓸 수 없다"는 규칙이 주문 서비스와 선물 서비스 두 곳에 if문으로 있다. "회원 등급이 맞아야 쓸 수 있다"를 더하면 고칠 곳은 몇 곳이고, 규칙을 어디로 옮기면 한 곳이 되나 (두 곳. `Coupon.use()`로 옮긴다)'
      - '실무 구역: `Order`에 `@Setter`를 붙여 둔 채 `cancel()`을 더했다. 새 기능이 `setStatus(CANCELED)`를 부르면 규칙은 지켜지나 (아니다. 세터가 길을 열어 둔다)'
    body:
      - p: '처음 예측의 일괄 취소를 돌려 봤어요. 결제된 주문 하나와 배송된 주문 하나를 넣었어요.'
      - code: predictMark
        notes:
          - mark: o.setStatus(CANCELED);
            as: code
            text: '세터로 상태를 바로 바꿔요. 확인은 원래 취소 서비스에만 있었고, 이 코드를 짠 사람은 그 규칙을 몰랐어요.'
      - ci:
          key: bulk
          label: 실제 결과 보기
          source: DomainModelTest.bulkCancelSkipsRule
      - p: '예측의 답은 **배송된 주문도 취소된다**예요. {{predict-result}} 컴파일도 되고 예외도 없어요. 세터가 열려 있으니 규칙을 거치지 않고 상태를 바꾸는 길이 있었던 거예요.'
      - p: '트랜잭션 스크립트에서는 **주문의 상태를 바꾸는 서비스마다 같은 확인을 다시 써야** 해요. 취소, 일괄 취소, 관리자 취소가 있으면 세 곳이에요. 하나를 빠뜨리면 규칙이 깨지고, 규칙이 바뀌면 세 곳을 다 찾아 고쳐야 해요.'
      - p: '도메인 모델에서는 `Order`에 세터가 없어요. 상태를 바꾸는 길이 `cancel()` 하나라서, 일괄 취소를 짜는 사람도 `cancel()`을 불러야 해요. 배송된 주문에 부르면 규칙이 막아요.'
      - ci:
          key: reject
          label: 실제 결과 보기
          source: DomainModelTest.modelRejectsShipped
      - p: '이 확인에는 DB도 스프링도 필요 없었어요. 규칙이 엔티티 안에 있으니 `new`로 만들어 바로 시험해요. 실무 구역에서 이 테스트 코드를 봐요.'
      - p: '요구가 바뀌면 어디를 고치는지 골라 보세요.'
      - widget:
          kind: compare
          layout: [selector, sides, verdict]
          selector:
            label: 바뀐 요구
            options:
              - {value: rule, label: '"결제 대기 주문도 취소 불가" 더하기'}
              - {value: newfeature, label: 관리자 취소 기능 더하기}
          sides:
            - label: 트랜잭션 스크립트
              items:
                - {name: OrderService.cancel, note: 확인하고 setStatus}
                - {name: BulkCancelService, note: 확인하고 setStatus}
                - {name: Order, note: 게터와 세터}
            - label: 도메인 모델
              items:
                - {name: OrderService.cancel, note: order.cancel()}
                - {name: BulkCancelService, note: order.cancel()}
                - {name: Order.cancel, note: 확인하고 상태 바꾸기}
          scenes:
            rule:
              sides:
                - marks: [{name: OrderService.cancel, tag: 고침}, {name: BulkCancelService, tag: 고침}]
                  result: [{k: 고치는 곳, v: '확인이 있는 서비스 모두', mark: bad}]
                - marks: [{name: Order.cancel, tag: 고침}]
                  result: [{k: 고치는 곳, v: 'Order.cancel 한 곳'}]
              verdict: '규칙이 엔티티에 있으면 규칙을 바꿀 때 한 곳만 고쳐요.'
            newfeature:
              sides:
                - add: [{name: AdminCancelService, note: '확인을 또 써야 함', tag: 새로 만듦}]
                  result: [{k: 빠뜨리면, v: '배송된 주문이 취소됨', mark: bad}]
                - add: [{name: AdminCancelService, note: 'order.cancel()', tag: 새로 만듦}]
                  result: [{k: 빠뜨리면, v: '빠뜨릴 확인이 없음'}]
              verdict: '새 기능도 cancel()을 부를 수밖에 없어서 규칙을 건너뛸 수 없어요.'
      - h3: 저장은 누가 하나요
      - p: '`cancel()`은 필드만 바꾸고 `save`를 부르지 않아요. 그래도 DB가 바뀌어요. 트랜잭션 안에서 꺼낸 엔티티는 영속성 컨텍스트가 지켜보고 있다가, flush할 때 바뀐 필드를 UPDATE로 보내요([영속성 컨텍스트](lesson:jpa-persistence-context)의 변경 감지).'
      - ci:
          key: update
          label: 나간 SQL 보기
          source: DomainModelTest.dirtyCheckingSendsUpdate
      - p: '주문의 상태와 상품의 재고, 두 UPDATE가 나갔어요. 그래서 도메인 모델이 JPA와 잘 맞아요. 엔티티는 자기 일만 하고 저장은 JPA가 알아서 해요.'
      - quiz:
          q: '쿠폰의 "만료된 쿠폰은 쓸 수 없다"는 확인이 주문 서비스와 선물 서비스에 if 문으로 하나씩 있어요. "회원 등급이 맞아야 쓸 수 있다"를 더하려면 몇 곳을 고치나요?'
          options:
            - '한 곳'
            - '두 곳'
            - '쿠폰을 쓰는 화면 수만큼'
          answer: 2
          explain: '확인이 서비스마다 있어서 두 곳을 고쳐요. 규칙을 `Coupon.use()`로 옮기면 한 곳이 돼요.'
      - next: '주문 취소는 주문 상품의 재고도 되돌렸어요. 주문 상품은 주문과 따로 바꿔도 될까요? 객체를 어디까지 한 묶음으로 볼까요?'
    recall: '도메인 모델에서는 상태를 바꾸는 길이 엔티티의 메서드 하나라서, 어느 서비스에서 바꾸든 그 메서드를 거쳐 규칙을 건너뛸 수 없어요. 트랜잭션 스크립트는 상태를 바꾸는 서비스마다 같은 확인을 다시 써야 해서, 새 기능이 하나를 빠뜨리면 배송된 주문이 취소되는 일이 생겨요. 엔티티 메서드는 필드만 바꾸고, 저장은 JPA의 변경 감지가 UPDATE로 해요. 규칙은 DB 없이 단위 테스트로 확인해요.'
  - id: q3
    title: 애그리거트는 무엇이고 경계는 어떻게 정하나요?
    conclusion:
      lead: '함께 바뀌어야 규칙이 지켜지는 객체 묶음이고, 바깥은 묶음의 입구(루트)를 통해서만 안을 바꿔요.'
      sub: '주문과 주문 상품은 한 애그리거트라 주문 상품은 주문을 거쳐서만 바꿔요. 다른 애그리거트(회원, 상품)는 객체 대신 id로 가리키고, 한 트랜잭션에서는 애그리거트 하나를 바꾸는 것을 기본으로 해요.'
    says:
      - '규칙 "주문 금액은 주문 상품 금액의 합"을 지키려면 주문 상품을 더하고 뺄 때 주문이 알아야 한다. 그래서 `order.addLine(...)`만 열고 `OrderLine`의 수량을 밖에서 바꾸지 못하게 한다'
      - '루트는 묶음의 입구가 되는 엔티티(`Order`)다. 리포지토리도 루트에만 둔다(`OrderRepository`는 있고 `OrderLineRepository`는 없다)'
      - '주문은 회원을 `Member` 객체가 아니라 `memberId`로 가리킨다. 회원은 따로 바뀌는 다른 애그리거트라서다. 이렇게 하면 주문을 불러올 때 회원을 함께 불러오지 않는다'
      - '예제의 취소는 재고(상품 애그리거트)도 바꾼다. 한 트랜잭션에서 두 애그리거트를 바꾸는 것이다. 모놀리스에서 한 DB면 그렇게 하기도 하고, 나중에 떼어 놓을 때는 이벤트로 나눈다(S13, A9)'
      - '더 알아보기: 경계를 크게 잡으면(상품까지 주문에 넣으면) 다른 주문들이 같은 상품을 동시에 바꿀 때 충돌이 잦다. 작게 잡으면 묶음 사이의 규칙을 서비스가 맞춰야 한다'
    asks:
      - '본문의 예시: `OrderLine`의 수량을 `orderLine.setQuantity(5)`로 바로 바꾸면 깨질 수 있는 규칙은 (주문 금액이 주문 상품 금액의 합이라는 규칙)'
      - '옮긴 상황: 게시글과 댓글, 회원이 있다. 게시글이 삭제되면 댓글도 함께 지워진다. 회원은 따로 가입하고 탈퇴한다. 게시글 애그리거트에 넣을 것과 id로 가리킬 것은 (댓글은 넣고, 회원은 id로)'
    body:
      - p: '주문에는 규칙이 하나 더 있어요. **주문 금액은 주문 상품 금액의 합**이에요. 누가 주문 상품의 수량을 바꾸면 주문 금액도 함께 바뀌어야 해요.'
      - p: '주문 상품에 `setQuantity`가 열려 있으면 누군가 수량만 바꾸고 금액은 그대로 둘 수 있어요. 그래서 주문 상품은 **주문을 거쳐서만** 더하고 바꾸게 해요.'
      - code: aggregate
        notes:
          - mark: totalPrice += price * qty;
            as: code
            text: '주문 상품을 더하는 길이 `addLine` 하나라서, 더할 때마다 금액이 함께 바뀌어요.'
      - p: '이렇게 함께 바뀌어야 규칙이 지켜지는 객체 묶음을 **애그리거트**(aggregate)라고 하고, 묶음의 입구가 되는 엔티티를 **루트**라고 해요([마틴 파울러의 설명](link:aggregate)). 주문 애그리거트의 루트는 `Order`, 안에 `OrderLine`이 있어요.'
      - code: aggRun
      - p: '두 상품을 더하니 금액이 13,000원이 됐고, 주문 상품 목록은 꺼내서 지울 수 없어요(`UnsupportedOperationException`). 테스트에서 `OrderLine`에 게터 말고 공개된 메서드가 없는 것도 확인했어요.'
      - h3: 경계를 정하는 세 가지 약속
      - ul:
          - '**안은 루트를 거쳐서만 바꿔요.** 리포지토리도 루트에만 둬요. `OrderRepository`는 있고 `OrderLineRepository`는 없어요.'
          - '**다른 애그리거트는 id로 가리켜요.** 회원은 주문과 상관없이 가입하고 탈퇴하는 다른 묶음이라, 주문은 `Member` 객체 대신 `memberId`를 들어요. 주문을 불러올 때 회원까지 끌려오지 않아요.'
          - '**한 트랜잭션에서는 애그리거트 하나를 바꾸는 것이 기본이에요.**'
      - p: '예제의 취소는 상품의 재고까지 바꿨으니 셋째 약속을 어긴 셈이에요. 한 DB를 쓰는 모놀리스에서는 이렇게 한 트랜잭션에 묶기도 해요. 나중에 주문과 재고를 다른 서비스로 떼어 내면 한 트랜잭션으로 묶을 수 없어서, "주문이 취소됐다"는 이벤트를 보내 재고 쪽이 따로 처리해요([모놀리스와 마이크로서비스](lesson:monolith-msa)).'
      - more:
          summary: 묶음을 크게 잡으면 안 되나요?
          body:
            - p: '상품까지 주문 애그리거트에 넣으면 재고 규칙도 주문이 지킬 수 있어요. 대신 같은 상품을 산 주문들이 동시에 그 상품을 바꾸려 해서 충돌이 잦아져요. 락을 잡으면 서로를 기다리고요([낙관적 락과 비관적 락](lesson:locking)).'
            - p: '너무 작게 잡으면 묶음 사이의 규칙을 서비스가 맞춰야 해요. 그래서 "이 규칙을 지키려면 무엇이 함께 바뀌어야 하나"로 경계를 정해요.'
      - quiz:
          q: '게시글이 삭제되면 댓글도 함께 지워지고, 회원은 게시글과 상관없이 가입하고 탈퇴해요. 게시글 애그리거트를 어떻게 잡을까요?'
          options:
            - '댓글과 회원을 모두 게시글 안에 넣는다'
            - '댓글은 게시글 안에 넣고, 회원은 id로 가리킨다'
            - '댓글도 회원도 id로만 가리킨다'
          answer: 2
          explain: '댓글은 게시글과 함께 생기고 사라지니 한 묶음이에요. 회원은 따로 바뀌는 다른 애그리거트라 id로 가리켜요.'
      - next: '규칙을 엔티티에 모으는 장점을 봤어요. 그럼 모든 기능을 도메인 모델로 짜야 할까요?'
    recall: '애그리거트는 함께 바뀌어야 규칙이 지켜지는 객체 묶음이에요. 주문 금액이 주문 상품 금액의 합이라는 규칙을 지키려면 주문 상품은 루트인 주문을 거쳐서만(`addLine`) 더하고 바꿔요. 리포지토리는 루트에만 두고, 회원처럼 따로 바뀌는 다른 애그리거트는 객체 대신 id로 가리켜요. 한 트랜잭션에서는 애그리거트 하나를 바꾸는 것을 기본으로 해요.'
  - id: q4
    title: 두 방식 가운데 언제 무엇을 고르나요?
    conclusion:
      lead: '규칙이 적은 조회와 단순 저장은 트랜잭션 스크립트로, 상태가 바뀌고 규칙이 많은 핵심 객체는 도메인 모델로 짜요.'
      sub: '한 프로젝트에서 섞어 써요. 어느 쪽이든 서비스는 트랜잭션, 객체 꺼내기와 저장, 다른 시스템과 잇기를 맡아요.'
    says:
      - '공지사항 저장처럼 규칙이 없는 기능을 도메인 모델로 짜면 메서드 하나가 세터 하나와 같다. 얻는 것이 없다'
      - '주문, 결제, 회원 등급처럼 상태가 여러 단계로 바뀌고 단계마다 규칙이 있으면 도메인 모델이 규칙을 한 곳에 모은다'
      - '도메인 모델에서도 서비스는 없어지지 않는다. 서비스는 트랜잭션을 열고 엔티티를 꺼내고, 메일 보내기나 결제 API처럼 엔티티가 할 수 없는 일을 잇는다'
      - '흔한 오해: "엔티티에 로직을 넣으면 JPA 엔티티가 무거워진다". 엔티티 메서드는 필드만 다루므로 DB와 무관하고, 리포지토리나 외부 API를 엔티티에 넣지 않는다'
    widget:
      kind: classify
      note: '기능 설명을 보고 트랜잭션 스크립트와 도메인 모델 가운데 고른다. 예: 공지사항 등록, 주문 상태 바꾸기, 회원 목록 조회, 포인트 적립과 사용, 상품 설명 고치기, 쿠폰 발급과 사용'
    asks:
      - '본문의 예시: 서비스가 `orders.findById`로 주문을 꺼내 `order.cancel()`을 부르고, 그다음 환불 API를 부른다. 환불 API 호출은 엔티티와 서비스 가운데 어디에 두나 (서비스. 엔티티는 외부 시스템을 모른다)'
      - '옮긴 상황: FAQ 글을 등록하고 수정하는 관리자 기능. 규칙은 "제목은 비울 수 없다" 하나다. 두 방식 가운데 무엇이 알맞나 (트랜잭션 스크립트. 입력 검증으로 충분하다)'
    body:
      - p: '공지사항을 등록하는 기능을 생각해 봐요. 제목과 본문을 받아 저장하면 끝이에요. 이것을 도메인 모델로 짜면 `notice.changeTitle(title)`이 `this.title = title` 한 줄이에요. 세터와 다를 것이 없어요. **지킬 규칙이 없으면 도메인 모델로 얻는 것이 없어요.**'
      - p: '주문은 달라요. 결제, 배송, 취소, 반품으로 상태가 바뀌고 단계마다 할 수 있는 일이 정해져 있어요. 이런 규칙을 엔티티에 모으면 질문 2에서 본 것처럼 빠뜨릴 수 없게 돼요.'
      - table:
          head: [기능의 모양, 알맞은 방식]
          rows:
            - ['조회, 목록, 단순한 저장과 수정', '트랜잭션 스크립트']
            - ['상태가 여러 단계로 바뀌고 단계마다 규칙이 있음', '도메인 모델']
            - ['같은 데이터를 여러 기능이 바꿈', '도메인 모델']
      - p: '한 프로젝트에서 **섞어 써요.** 주문은 도메인 모델로, 공지사항과 통계 조회는 트랜잭션 스크립트로 짜는 식이에요.'
      - h3: 서비스는 여전히 일해요
      - p: '도메인 모델에서도 서비스는 남아요. 엔티티가 할 수 없는 일을 서비스가 해요.'
      - code: withService
        notes:
          - mark: refundClient.refund(
            as: code
            text: '환불 API처럼 바깥 시스템을 부르는 일은 서비스가 해요. 엔티티에 리포지토리나 외부 클라이언트를 넣지 않아요.'
      - ul:
          - '트랜잭션을 열고 닫기 (`@Transactional`)'
          - '리포지토리로 엔티티를 꺼내고 새 엔티티를 저장하기'
          - '메일, 결제 API처럼 바깥 시스템과 잇기, 여러 애그리거트를 차례로 부르기'
      - p: '"엔티티에 로직을 넣으면 무거워진다"는 걱정은 오해예요. 엔티티 메서드는 자기 필드만 다뤄서 DB와 상관없고, 그래서 가장 가볍게 테스트할 수 있는 코드가 돼요.'
      - p: '기능마다 골라 보세요.'
      - widget:
          kind: classify
          categories: [트랜잭션 스크립트, 도메인 모델]
          items:
            - {text: '공지사항 등록. 제목과 본문을 받아 저장한다', answer: 1, explain: '지킬 규칙이 없어요. 서비스에서 바로 저장하면 돼요.'}
            - {text: '주문 상태 바꾸기. 결제 뒤에만 배송, 배송 전에만 취소', answer: 2, explain: '상태마다 규칙이 있어요. Order의 메서드에 모아요.'}
            - {text: '회원 목록을 가입일 순으로 조회', answer: 1, explain: '조회는 바꿀 상태가 없어요.'}
            - {text: '포인트 적립과 사용. 잔액보다 많이 쓸 수 없다', answer: 2, explain: '여러 기능이 같은 잔액을 바꿔요. 규칙을 Point에 둬요.'}
            - {text: '상품 설명 고치기', answer: 1, explain: '값을 바꾸는 것뿐이에요.'}
            - {text: '쿠폰 사용. 만료와 회원 등급을 확인한다', answer: 2, explain: '주문과 선물 등 여러 곳에서 써요. Coupon.use()에 규칙을 모아요.'}
      - quiz:
          q: 'FAQ 글을 등록하고 고치는 관리자 기능이에요. 규칙은 "제목은 비울 수 없다" 하나예요. 어느 방식이 알맞나요?'
          options:
            - '트랜잭션 스크립트'
            - '도메인 모델'
            - '둘 다 맞지 않다'
          answer: 1
          explain: '입력 검증 하나로 충분해요. 상태와 규칙이 많지 않으면 서비스에서 바로 처리해요.'
      - next: '원리는 여기까지예요. 이제 JPA 엔티티를 도메인 모델로 만들 때의 실제 모양과 흔한 실수를 볼게요.'
    recall: '지킬 규칙이 적은 조회, 목록, 단순한 저장과 수정은 트랜잭션 스크립트로 짜요. 주문처럼 상태가 여러 단계로 바뀌고 단계마다 규칙이 있거나 여러 기능이 같은 데이터를 바꾸면 도메인 모델로 규칙을 엔티티에 모아요. 한 프로젝트에서 섞어 쓰고, 어느 쪽이든 서비스는 트랜잭션, 엔티티 꺼내기와 저장, 외부 시스템 호출을 맡아요.'
practice:
  title: JPA 엔티티를 도메인 모델로 만들 때
  says:
    - '스프링과 JPA에서 도메인 모델 엔티티의 모양: `@Setter` 없음, `protected` 기본 생성자(JPA가 쓴다), 의도가 드러나는 메서드(`cancel`, `addLine`), 생성 규칙은 정적 팩토리나 생성자에'
    - '서비스는 짧아진다: `@Transactional` 메서드에서 `findById`, `order.cancel()`. `save`를 다시 부르지 않아도 변경 감지가 UPDATE를 보낸다'
    - '흔한 실수: 엔티티에 `@Data`(롬복)를 붙인다. 모든 필드에 세터가 생겨 규칙을 우회하는 길이 열리고, 양방향 연관에서 `toString`과 `hashCode`가 서로를 불러 끝나지 않을 수 있다. 고친 코드: `@Getter`만 두고 바꾸는 메서드를 직접 쓴다. 롬복 동작은 롬복 문서가 근거다'
    - '엔티티 메서드의 단위 테스트를 보인다. 스프링 없이 `new Order(...)`로 만들고 `cancel()`을 부른다. 이 테스트가 몇 ms에 끝나는지 스프링 테스트와 비교한다'
  body:
    - h3: 엔티티의 모양
    - code: entityShape
    - ul:
        - '**세터를 두지 않아요.** 바꾸는 길은 `cancel`, `changeAddress`처럼 무엇을 하는지 이름에 드러나는 메서드예요.'
        - '**기본 생성자는 `protected`로 둬요.** JPA가 DB에서 읽은 행으로 객체를 만들 때 인자 없는 생성자를 쓰고, 명세가 `public`이나 `protected`를 요구해요([Jakarta Persistence 명세](link:jpaSpec) 2.1절). 다른 코드가 빈 주문을 만들지 못하게 `protected`로 막아요.'
        - '**만들 때의 규칙은 생성자에 둬요.** 회원 없는 주문을 만들 수 없게 `Order(Long memberId)`처럼 꼭 필요한 값을 받아요.'
    - p: '서비스는 질문 1의 `modelService`처럼 짧아져요. 꺼내서 메서드를 부르면 변경 감지가 UPDATE를 보내니 `save`를 다시 부르지 않아도 돼요.'
    - h3: 규칙은 단위 테스트로
    - code: unitTest
    - p: '스프링을 띄우지 않고 DB에도 닿지 않아서 몇 밀리초면 끝나요. 규칙이 많은 엔티티일수록 이런 테스트를 많이 둬요.'
    - h3: 흔한 실수 하나
    - code: lombokData
      notes:
        - mark: '@Data'
          as: anno
          text: '롬복의 `@Data`는 모든 필드에 게터와 **세터**, `equals`, `hashCode`, `toString`을 만들어요([롬복 문서](link:lombok)).'
    - p: '세터가 생기니 질문 2에서 본 우회 길이 다시 열려요. `toString`과 `hashCode`가 연관된 엔티티의 필드까지 부르면, 양방향 연관에서는 서로를 끝없이 불러 `StackOverflowError`가 나기도 해요. 고친 코드는 위의 엔티티 모양이에요. `@Getter`만 두고, 바꾸는 메서드는 직접 써요.'
interview:
  question: 트랜잭션 스크립트와 도메인 모델은 무엇이 다르고, 언제 무엇을 쓰나요?
  model:
    - label: 정의
      text: 트랜잭션 스크립트는 요청 하나의 절차를 서비스 메서드에 위에서 아래로 쓰고 엔티티는 값만 드는 방식입니다. 도메인 모델은 규칙을 그 데이터를 가진 엔티티의 메서드에 두고, 서비스는 엔티티를 꺼내 메서드를 부르는 방식입니다.
    - label: 원리
      text: 도메인 모델에서는 상태를 바꾸는 길이 엔티티의 메서드 하나라서 새 기능도 그 메서드를 거치고 규칙을 건너뛸 수 없습니다. JPA의 변경 감지로 필드만 바꿔도 UPDATE가 나갑니다. 함께 바뀌어야 하는 객체는 애그리거트로 묶어 루트를 거쳐서만 바꾸고, 다른 애그리거트는 id로 가리킵니다.
    - label: 트레이드오프
      text: 규칙이 없는 조회와 단순 저장은 트랜잭션 스크립트가 짧고 읽기 쉽습니다. 상태와 규칙이 많은 핵심 객체는 도메인 모델로 규칙을 모읍니다. 세터를 열어 두거나 @Data를 붙이면 도메인 모델의 장점이 사라집니다.
    - label: 경험
      text: '(내 프로젝트로 채우기) 예: 여러 서비스에 흩어진 주문 취소 확인을 Order.cancel()로 모으고 세터를 지워, 새 일괄 취소 기능이 규칙을 빠뜨리지 않게 했습니다.'
verified: 두 방식의 결과, 일괄 취소의 결과, 나간 UPDATE는 스프링 부트 3.5, Hibernate 6.6, PostgreSQL 16에서 코드를 돌려 받은 값이에요. 코드가 바뀔 때마다 테스트([DomainModelTest](link:test))가 다시 돌아요.
footer: '근거: 트랜잭션 스크립트, 도메인 모델, 애그리거트라는 이름은 마틴 파울러의 글([1](link:script), [2](link:model), [3](link:aggregate)), 기본 생성자는 [Jakarta Persistence 명세](link:jpaSpec), `@Data`는 [롬복 문서](link:lombok). 결과는 테스트로 확인했어요. 오류는 [GitHub 이슈](https://github.com/wanja727/dev-lessons/issues)로 알려 주세요.'
claims:
  - claim: '트랜잭션 스크립트와 도메인 모델로 짠 취소가 같은 데이터에서 같은 상태와 재고를 만든다'
    how: '`@DataJpaTest`와 PostgreSQL 컨테이너로 두 방식을 차례로 돌린다'
    test: DomainModelTest.sameResult
  - claim: '세터가 열린 엔티티로 짠 일괄 취소는 배송된 주문도 취소한다'
    how: '같은 테스트에서 상태를 확인한다'
    test: DomainModelTest.bulkCancelSkipsRule
  - claim: '도메인 모델의 `cancel()`은 배송된 주문에서 `CannotCancel`을 던진다'
    how: 'DB 없이 엔티티를 만들어 부른다'
    test: DomainModelTest.modelRejectsShipped
  - claim: '엔티티 메서드가 필드만 바꿔도 flush 때 UPDATE가 나간다'
    how: '`SqlCapture`로 나간 SQL을 센다. 주문과 상품, 두 UPDATE'
    test: DomainModelTest.dirtyCheckingSendsUpdate
  - claim: '주문 상품을 `order.addLine`으로 더하면 주문 금액이 함께 바뀌고, 주문 상품을 밖에서 바꿀 방법이 없다'
    how: '`OrderLine`에 게터 말고 공개된 메서드가 없는 것을 리플렉션으로 확인하고, 금액을 비교한다'
    test: DomainModelTest.aggregateRoot
sources:
  - '트랜잭션 스크립트와 도메인 모델이라는 이름: Martin Fowler의 설명 https://martinfowler.com/eaaCatalog/transactionScript.html , https://martinfowler.com/eaaCatalog/domainModel.html'
  - '애그리거트: https://martinfowler.com/bliki/DDD_Aggregate.html'
  - 'JPA 엔티티의 기본 생성자 요구: Jakarta Persistence 3.1 명세 2.1절 https://jakarta.ee/specifications/persistence/3.1/jakarta-persistence-spec-3.1'
