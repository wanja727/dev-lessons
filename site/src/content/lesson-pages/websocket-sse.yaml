# 웹소켓과 SSE
# 자료 파일의 칸은 docs/lesson-data-format.md에 있다. 문제는 content/questions/websocket-sse.yaml에 있다.
title: 웹소켓과 SSE
description: 서버가 먼저 알려야 할 때 HTTP가 왜 불편한지, SSE가 응답 하나로 이벤트를 흘려 보내는 법, 웹소켓이 양방향 연결을 여는 법, 무엇을 고르고 서버가 여러 대일 때 무엇을 더해야 하는지. 네 가지 질문에 스스로 답할 수 있게 만드는 대화형 레슨.
unit: 네트워크와 웹
minutes: 18
roadmap: N12
type: 개념 설명
prerequisites:
  - {slug: http-basics, title: HTTP 요청과 응답}
assume: 'HTTP 요청과 응답, 연결을 다시 쓰는 것과 chunked(HTTP 요청과 응답 레슨). 스프링 부트 3.5(톰캣 10.1). 브라우저의 EventSource와 WebSocket 객체는 테스트로 돌릴 수 없어서, 서버의 응답과 자바 HttpClient의 웹소켓으로 확인하고 브라우저의 동작은 HTML 명세와 RFC 6455를 근거로 적어요.'
example: '쇼핑몰의 주문 상태 알림. 주문이 "결제 완료, 배송 시작, 배송 완료"로 바뀔 때 사용자 화면에 바로 보여 주는 일이에요. 폴링, SSE, 웹소켓으로 차례로 만들어 봐요.'
intro:
  - '배달 앱의 "배달원이 출발했어요", 주식 앱의 가격, 채팅 메시지처럼 서버에서 일어난 일을 사용자 화면에 바로 보여 줘야 할 때가 있어요. 그런데 HTTP는 클라이언트가 물어야 서버가 답하는 구조예요. 서버는 어떻게 먼저 말을 걸까요?'
  - '스프링 개발자는 이때 폴링, SSE, 웹소켓 가운데 하나를 골라요. 고른 방식에 따라 서버가 붙잡는 연결의 수, 로드 밸런서의 시간 제한, 서버가 여러 대일 때의 메시지 전달이 달라져요. 면접에서는 "실시간 알림을 어떻게 만들겠어요?", "웹소켓과 SSE의 차이는요?"를 물어요.'
  - '이 레슨에서는 같은 주문 상태 알림을 폴링, SSE, 웹소켓으로 만들어 오가는 요청과 응답을 직접 보고, 무엇을 언제 고르는지 정리해요.'
covers:
  - {topic: 'HTTP는 클라이언트가 먼저 요청해야 서버가 답한다. 서버가 먼저 보낼 길이 없다', where: 질문 1}
  - {topic: '폴링: 정해진 간격으로 계속 묻는다. 헛된 요청이 많고 알림이 간격만큼 늦는다', where: 질문 1}
  - {topic: '롱 폴링: 바뀔 때까지 응답을 붙잡아 둔다', where: 질문 1의 더 알아보기}
  - {topic: 'SSE: 응답 하나를 열어 두고 text/event-stream으로 이벤트를 계속 쓴다. 서버에서 클라이언트로 한 방향', where: 질문 2}
  - {topic: 'SSE의 이벤트 모양(id, event, data, 빈 줄)과 브라우저 EventSource의 자동 재연결, Last-Event-ID', where: 질문 2}
  - {topic: '웹소켓: HTTP Upgrade 요청과 101로 시작해 같은 TCP 연결에서 양쪽이 아무 때나 보낸다', where: 질문 3}
  - {topic: 'Sec-WebSocket-Key와 Sec-WebSocket-Accept', where: 질문 3}
  - {topic: '고르는 기준: 방향(한쪽, 양쪽), 빈도, 브라우저와 프록시 지원', where: 질문 4}
  - {topic: '서버가 여러 대면 연결은 한 서버에 붙어 있어서, 다른 서버의 이벤트를 전하려면 Redis pub/sub 같은 중계가 필요하다', where: 질문 4}
  - {topic: '연결을 오래 붙잡으므로 서버 자원과 로드 밸런서의 쉬는 연결 시간 제한을 생각해야 한다', where: '질문 4, 실무에서는'}
  - {topic: '스프링 MVC의 SseEmitter와 시간 제한', where: 실무에서는}
  - {topic: '흔한 실수: SseEmitter의 시간 제한을 짧게(또는 기본값에) 두어 이벤트 전에 503으로 끝난다', where: 실무에서는}
  - {topic: '스프링의 웹소켓(spring-boot-starter-websocket, STOMP)', where: 실무에서는의 더 알아보기}
  - {topic: '메시지 브로커로 서버 사이에 이벤트 나누기', where: '다루지 않음: 메시지 큐(A 과정)'}
codes:
  pollRun: |-
    // 100ms마다 10번 묻는다
    for (int i = 0; i < 10; i++) {
      get("/orders/1/status");
      Thread.sleep(100);
    }
  sseController: |-
    @GetMapping(value = "/orders/1/events",
        produces = [[TEXT_EVENT_STREAM_VALUE]])
    SseEmitter events() {
      SseEmitter emitter =
          new SseEmitter([[10_000L]]);
      orderEvents.subscribe(e ->
          emitter.send(SseEmitter.event()
              .id(e.id())
              .name("status")
              .data(e.status())));
      return emitter;
    }
  sseRun: |-
    GET /orders/1/events HTTP/1.1
    Accept: text/event-stream
  eventSource: |-
    const es = new EventSource(
        "/orders/1/events");
    es.addEventListener("status", e => {
      show(e.data);
    });
  handshake: |-
    GET /ws/orders HTTP/1.1
    Host: localhost
    [[Upgrade: websocket]]
    Connection: Upgrade
    Sec-WebSocket-Key: dGhlIHNhbXBsZSBub25jZQ==
    Sec-WebSocket-Version: 13
  wsClient: |-
    WebSocket ws = HttpClient.newHttpClient()
        .newWebSocketBuilder()
        .buildAsync(URI.create(
          "ws://localhost:8080/ws/orders"),
          listener)
        .join();
    ws.sendText("배송지 바꿔 주세요", true);
  wsBrowser: |-
    const ws = new WebSocket(
        "wss://shop.com/ws/orders");
    ws.onmessage = e => show(e.data);
    ws.send("배송지 바꿔 주세요");
  timeoutMistake: |-
    SseEmitter emitter =
        new SseEmitter([[500L]]);
    // 첫 이벤트는 3초 뒤에 보낸다
  timeoutFixed: |-
    // 30분 동안 열어 두고
    SseEmitter emitter = new SseEmitter(
        Duration.ofMinutes(30).toMillis());
    // 20초마다 주석 한 줄로 살아 있음을 알린다
    emitter.send(SseEmitter.event()
        .comment("keep-alive"));
  wsGradle: |-
    implementation 'org.springframework.boot:⤷
    spring-boot-starter-websocket'
links:
  test: https://github.com/wanja727/dev-lessons/blob/main/verification/src/test/java/lab/devlessons/websocketsse/WebSocketSseTest.java
  htmlSse: https://html.spec.whatwg.org/multipage/server-sent-events.html
  rfc6455: https://www.rfc-editor.org/rfc/rfc6455.html
  springSse: https://docs.spring.io/spring-framework/reference/web/webmvc/mvc-ann-async.html#mvc-ann-async-sse
  springWs: https://docs.spring.io/spring-framework/reference/web/websocket.html
predict:
  title: 폴링은 얼마나 헛걸음할까요?
  text: '주문 상태를 100ms마다 10번 물었어요(1초 동안). 상태는 0.7초쯤에 "준비 중"에서 "배송 시작"으로 한 번 바뀌어요. 서버가 받은 요청 10번 가운데, 사용자가 새로 알아야 할 것(배송 시작)을 처음 알려 준 응답은 몇 번일까요? 모르는 게 정상이니 감으로 골라 보세요. 답은 질문 1에 나와요.'
  code: pollRun
  label: 내 예측
  options:
    - value: one
      label: 1번
    - value: half
      label: 5번쯤
    - value: ten
      label: 10번 모두
  answer: one
  storageKey: wss-predict
  wrong: 예측은 "{label}"이었어요. 틀린 예측이 더 오래 남으니 괜찮아요.
questions:
  - id: q1
    title: 서버가 먼저 알려야 할 때 HTTP는 왜 불편한가요?
    conclusion:
      lead: 'HTTP는 클라이언트가 물어야 서버가 답하는 구조라서, 서버에서 일이 생겨도 먼저 보낼 길이 없어요.'
      sub: '그래서 클라이언트가 계속 묻는 폴링을 쓰면, 바뀐 것이 없는 헛된 요청이 쌓이고 알림은 묻는 간격만큼 늦어요.'
    says:
      - 'HTTP는 요청 하나에 응답 하나다. 응답을 보낸 뒤 서버는 그 클라이언트에게 먼저 말을 걸 수 없다(HTTP 요청과 응답 레슨)'
      - '폴링: 클라이언트가 정해진 간격으로 계속 묻는다. 100ms마다 10번 물으면 서버는 요청 10번을 받는데 새 소식을 처음 알려 준 것은 1번이다. 예측의 답을 밝힌다'
      - '간격을 줄이면 빨리 알지만 요청이 늘고, 늘리면 요청은 줄지만 늦게 안다. 사용자 수만큼 곱해진다'
      - '더 알아보기: 롱 폴링은 서버가 바뀔 때까지 응답을 붙잡아 두었다가 바뀌면 답한다. 받으면 바로 다시 묻는다. 헛된 요청은 줄지만 매번 요청을 새로 보낸다'
    asks:
      - '본문의 예시: 100ms마다 10번 물었고 상태는 0.7초쯤 한 번 바뀌었다. 새 소식을 처음 알려 준 응답은 몇 번인가 (1번)'
      - '옮긴 상황: 사용자 1만 명이 5초마다 알림을 폴링하고 알림은 하루에 한두 번 온다. 서버가 받는 요청의 대부분은 무엇인가 (바뀐 것이 없는 헛된 요청. 초당 2천 번)'
    body:
      - p: '주문 상태가 "배송 시작"으로 바뀌면 사용자 화면에 바로 보여 주고 싶어요. 그런데 HTTP는 **클라이언트가 요청해야 서버가 응답하는** 구조예요. 응답을 보낸 뒤 서버는 그 사용자에게 먼저 말을 걸 방법이 없어요.'
      - p: 'HTTP만으로 할 수 있는 가장 쉬운 방법은 **폴링**이에요. 클라이언트가 정해진 간격으로 "바뀌었어요?"를 계속 물어요. 처음 예측한 대로 100ms마다 10번 물어 봤어요. 상태는 0.7초쯤에 바뀌어요.'
      - ci:
          key: polling
          label: 열 번의 응답 보기
          source: WebSocketSseTest.pollingWastesRequests
          code: pollRun
      - p: '서버는 요청을 10번 받았어요. 그 가운데 **새 소식을 처음 알려 준 응답은 1번**이에요. {{predict-result}} 그 앞의 응답은 "준비 중"을 되풀이했고, 그 뒤의 응답은 이미 안 것을 되풀이했어요. 그리고 상태는 0.7초쯤 바뀌었지만 사용자는 다음 폴링 때에야 알았어요.'
      - ul:
          - '**간격을 줄이면:** 빨리 알지만 헛된 요청이 늘어요.'
          - '**간격을 늘리면:** 요청은 줄지만 늦게 알아요.'
      - p: '이 손해는 사용자 수만큼 곱해져요. 1만 명이 5초마다 물으면 알림이 하루에 한 번 와도 서버는 초당 2천 번의 요청을 받아요.'
      - more:
          summary: '더 알아보기: 롱 폴링'
          body:
            - p: '**롱 폴링**은 서버가 바뀐 것이 생길 때까지 응답을 보내지 않고 붙잡아 두는 방식이에요. 바뀌면 그때 답하고, 클라이언트는 받자마자 다시 물어요. 헛된 요청과 늦음이 줄지만, 소식마다 요청과 응답을 새로 주고받아요. 다음 질문의 SSE는 응답 하나를 끝내지 않고 계속 써서 이것도 줄여요.'
      - quiz:
          q: '사용자 1만 명이 5초마다 새 알림을 폴링해요. 알림은 하루에 한두 번 와요. 서버가 받는 요청의 대부분은 무엇일까요?'
          options:
            - 새 알림을 전하는 요청
            - 바뀐 것이 없다는 답만 받는 헛된 요청
            - 로그인 요청
          answer: 2
          explain: 알림은 드문데 묻기는 계속해서 대부분이 헛걸음이에요. 1만 명이 5초마다 물으면 초당 2천 번이에요.
      - next: 클라이언트가 계속 묻지 않고, 서버가 일이 생길 때 보내게 할 수는 없을까요?
    recall: HTTP는 클라이언트가 물어야 서버가 답하는 구조라서 서버가 먼저 보낼 길이 없어요. 폴링으로 계속 물으면 바뀐 것이 없는 헛된 요청이 쌓이고 알림은 간격만큼 늦어요. 사용자 수만큼 곱해져요. 롱 폴링은 바뀔 때까지 응답을 붙잡아 줄이지만 소식마다 요청을 새로 보내요.
  - id: q2
    title: SSE는 어떻게 서버가 먼저 보내게 하나요?
    conclusion:
      lead: '클라이언트가 한 번 요청하면 서버가 응답을 끝내지 않고 열어 둔 채, 일이 생길 때마다 `text/event-stream` 형식의 이벤트를 이어 써요.'
      sub: '서버에서 클라이언트로 한 방향이에요. 브라우저의 EventSource는 끊기면 알아서 다시 연결하고, 마지막으로 받은 id를 Last-Event-ID로 알려요.'
    says:
      - 'SSE(Server-Sent Events)는 평범한 HTTP 요청으로 시작한다. 서버는 `Content-Type: text/event-stream`으로 답하고 응답을 닫지 않는다. 일이 생길 때마다 이벤트를 쓴다'
      - '이벤트는 `id:`, `event:`, `data:` 줄과 빈 줄 하나로 끝난다. 스프링의 SseEmitter로 세 이벤트를 보내고 클라이언트가 받은 시각과 줄을 실제 출력으로 보인다. 200ms 간격으로 하나씩 도착한다'
      - '한 방향이다. 클라이언트가 서버에 보낼 것은 평소처럼 다른 HTTP 요청으로 보낸다'
      - '브라우저는 `EventSource`로 받는다. 연결이 끊기면 알아서 다시 연결하고, 마지막으로 받은 id를 `Last-Event-ID` 헤더에 실어 이어 받게 한다 (HTML 명세 근거)'
    asks:
      - '본문의 예시: SSE 응답의 Content-Type은 (`text/event-stream`)'
      - '옮긴 상황: 채팅 앱에서 사용자가 보내는 메시지도 같은 SSE 연결로 서버에 보낼 수 있나 (없다. SSE는 서버에서 클라이언트로 한 방향이다. 보낼 것은 다른 HTTP 요청으로 보낸다)'
    body:
      - p: '**SSE**(Server-Sent Events)는 HTTP 응답 하나를 끝내지 않고 계속 쓰는 방식이에요. 클라이언트가 한 번 요청하면, 서버는 `Content-Type: text/event-stream`으로 답하고 응답을 닫지 않아요. 그리고 일이 생길 때마다 그 응답에 이벤트를 이어 써요. HTTP 요청과 응답 레슨의 chunked 응답이 끝나지 않고 계속되는 셈이에요.'
      - p: '스프링에서는 `SseEmitter`를 돌려줘요. 주문 상태 세 개를 0.2초 간격으로 보내는 서버에 요청하고, 줄이 도착한 시각을 함께 찍었어요.'
      - code: sseController
        notes:
          - mark: TEXT_EVENT_STREAM_VALUE
            as: code
            text: '`text/event-stream`이에요. 브라우저는 이것을 보고 이벤트로 읽어요.'
          - mark: 10_000L
            as: code
            text: 응답을 열어 둘 시간(밀리초)이에요. 실무 구역에서 다시 봐요.
      - ci:
          key: sse
          label: 받은 줄과 시각 보기
          source: WebSocketSseTest.serverSentEvents
          code: sseRun
      - p: '요청은 한 번이었어요. 그런데 이벤트는 약 0.2초 간격으로 따로따로 도착했어요. 서버가 응답을 끝내지 않고 열어 둔 채 이어 썼기 때문이에요. 이벤트 하나는 이런 줄들로 되어 있어요.'
      - ul:
          - '`id:` 이벤트의 번호'
          - '`event:` 이벤트의 이름. 브라우저에서 이 이름으로 받아요'
          - '`data:` 내용'
          - '빈 줄 하나가 이벤트의 끝이에요'
      - h3: 한 방향이고, 브라우저가 다시 연결해 줘요
      - p: 'SSE는 **서버에서 클라이언트로만** 가요. 사용자가 보낼 것은 평소처럼 다른 HTTP 요청(POST 등)으로 보내요. 알림, 진행 상황, 시세처럼 받기만 하면 되는 곳에 맞아요.'
      - p: '브라우저에서는 `EventSource`로 받아요.'
      - code: eventSource
      - p: '`EventSource`는 연결이 끊기면 **알아서 다시 연결**하고, 마지막으로 받은 `id`를 `Last-Event-ID` 헤더에 실어 보내요. 서버는 그 뒤의 이벤트부터 이어 보내면 돼요. 이 동작은 브라우저가 하는 일이라 테스트가 아니라 HTML 명세가 근거예요.'
      - quiz:
          q: 'SSE로 주문 알림을 받는 브라우저의 연결이 끊겼다가 다시 연결됐어요. 서버가 놓친 이벤트부터 이어 보내려면 무엇을 보면 될까요?'
          options:
            - 요청의 Last-Event-ID 헤더
            - 요청의 Cookie 헤더
            - 응답의 Content-Length
          answer: 1
          explain: EventSource는 마지막으로 받은 id를 Last-Event-ID에 실어 다시 연결해요.
      - next: SSE는 한 방향이었어요. 채팅처럼 양쪽이 아무 때나 보내야 하면 어떻게 할까요?
    recall: 클라이언트가 한 번 요청하면 서버가 text/event-stream으로 답하고 응답을 열어 둔 채, 일이 생길 때마다 id, event, data 줄과 빈 줄로 된 이벤트를 이어 써요. 서버에서 클라이언트로 한 방향이고, 브라우저의 EventSource는 끊기면 다시 연결하며 Last-Event-ID로 이어 받아요.
  - id: q3
    title: 웹소켓은 무엇이 다른가요?
    conclusion:
      lead: 'HTTP 요청으로 "웹소켓으로 바꾸자"(Upgrade)를 청하고, 서버가 101로 받아들이면 그 TCP 연결이 웹소켓이 돼요. 그 뒤로는 양쪽이 아무 때나 메시지를 보내요.'
      sub: '요청과 응답의 짝이 없어요. 서버가 먼저 보내도 되고, 클라이언트도 같은 연결로 보내요.'
    says:
      - '웹소켓은 HTTP 요청으로 시작한다. `Upgrade: websocket`, `Connection: Upgrade`, 무작위 `Sec-WebSocket-Key`를 보낸다. 서버는 `101 Switching Protocols`와 키로 계산한 `Sec-WebSocket-Accept`로 답한다. 그 뒤 그 TCP 연결은 HTTP가 아니라 웹소켓 프레임을 주고받는다'
      - 'RFC 6455의 예시 키로 톰캣에 핸드셰이크를 보내 101과 명세의 값과 같은 Accept를 받는 것을 실제 출력으로 보인다. Accept는 키에 정해진 문자열을 붙여 SHA-1과 Base64로 만든다. 웹소켓을 아는 서버인지 확인하는 장치다'
      - '연결이 열리면 서버가 요청 없이 먼저 보내고, 클라이언트가 같은 연결로 보내고, 서버가 답하는 것을 자바 HttpClient의 웹소켓으로 보인다'
      - '주소는 `ws://`, TLS 위에서는 `wss://`다(HTTPS와 TLS 레슨)'
    widget:
      kind: timeline
      note: '클라이언트와 서버 레인에 HTTP Upgrade 요청, 101 응답, (서버가 먼저) 배송 시작 메시지, (클라이언트) 배송지 변경 메시지, (서버) 답을 차례로 넘긴다. 위쪽 칸에 연결의 상태(HTTP, 웹소켓)를 둔다'
    asks:
      - '본문의 예시: 웹소켓 핸드셰이크에 서버가 받아들이면 돌려주는 상태 코드는 (101)'
      - '옮긴 상황: 웹소켓 연결이 열린 뒤 서버가 클라이언트에게 메시지를 보내려면 클라이언트의 요청을 기다려야 하나 (아니다. 양쪽이 아무 때나 보낸다)'
    body:
      - p: '**웹소켓**은 HTTP 연결을 다른 규칙으로 **바꿔서** 쓰는 방식이에요. 처음에는 평범한 HTTP 요청을 보내 "이 연결을 웹소켓으로 바꾸자"고 청해요.'
      - code: handshake
        notes:
          - mark: 'Upgrade: websocket'
            as: code
            text: 이 연결의 규칙을 웹소켓으로 바꾸자는 요청이에요.
      - p: '`Sec-WebSocket-Key`는 클라이언트가 만든 무작위 값이에요. 위 값은 웹소켓 명세(RFC 6455)에 실린 예시 키예요. 이 요청을 톰캣의 웹소켓 서버에 소켓으로 직접 보내 봤어요.'
      - ci:
          key: handshake
          label: 핸드셰이크 응답 보기
          source: WebSocketSseTest.upgradeHandshake
          code: handshake
      - p: '서버가 **101 Switching Protocols**로 받아들였어요. `Sec-WebSocket-Accept`는 받은 키에 명세가 정한 문자열을 붙여 SHA-1로 계산하고 Base64로 적은 값인데, 명세에 적힌 예시의 답과 똑같아요. 클라이언트는 이 값을 보고 상대가 웹소켓을 아는 서버라는 것을 확인해요.'
      - p: '101 뒤로 이 TCP 연결은 더는 HTTP가 아니에요. **웹소켓 프레임**을 주고받아요. 요청과 응답의 짝이 없어서, 양쪽이 아무 때나 보내요. 한 단계씩 넘겨 보세요.'
      - widget:
          kind: timeline
          layout: [duo, timeline, buttons, verdict]
          lanes: [클라이언트, 서버]
          initial:
            duo:
              - {label: 연결, text: 'TCP 연결 (HTTP)'}
              - {label: 누가 보낼 수 있나, text: '클라이언트가 요청해야 서버가 답함'}
          scenarios:
            default:
              - event:
                  dir: right
                  title: Upgrade 요청
                  text: |
                    GET /ws/orders HTTP/1.1
                    [[Upgrade: websocket]]
                    Sec-WebSocket-Key: dGhl...
              - event:
                  dir: left
                  title: 받아들임
                  text: |
                    [[HTTP/1.1 101]]
                    Sec-WebSocket-Accept: s3pP...
                  note: 이 응답을 끝으로 이 연결은 HTTP가 아니에요.
                duo:
                  - label: 연결
                    rows: [{k: 같은 TCP 연결, v: 웹소켓, mark: changed}]
                  - label: 누가 보낼 수 있나
                    rows: [{k: 양쪽, v: 아무 때나, mark: changed}]
              - event:
                  dir: left
                  title: 서버가 먼저
                  text: '주문 1 배송 시작'
                  note: 클라이언트가 묻지 않았는데 서버가 보내요.
              - event:
                  dir: right
                  title: 클라이언트가 보냄
                  text: '배송지 바꿔 주세요'
                  note: 같은 연결로 보내요. 새 HTTP 요청이 아니에요.
              - event:
                  dir: left
                  title: 서버의 답
                  text: '배송지 바꿔 주세요 받았어요'
                verdict: 101 뒤로는 한 연결에서 양쪽이 아무 때나 보내요. SSE와 달리 클라이언트도 같은 연결로 보내요.
      - p: 자바 `HttpClient`의 웹소켓으로 실제로 연결해 봤어요.
      - ci:
          key: websocket
          label: 주고받은 메시지 보기
          source: WebSocketSseTest.bothDirections
          code: wsClient
      - p: '연결이 열리자 서버가 요청 없이 먼저 보냈고, 클라이언트가 같은 연결로 보낸 메시지에 서버가 답했어요. 브라우저에서는 `WebSocket` 객체로 같은 일을 해요. TLS 위에서는 주소가 `wss://`예요.'
      - code: wsBrowser
      - quiz:
          q: '웹소켓 핸드셰이크 요청을 서버가 받아들이면 돌려주는 상태 코드는 무엇일까요?'
          options:
            - '200'
            - '101'
            - '302'
          answer: 2
          explain: 101 Switching Protocols예요. 그 뒤 같은 TCP 연결이 웹소켓으로 바뀌어요.
      - next: 폴링, SSE, 웹소켓 가운데 무엇을 골라야 할까요? 서버를 여러 대로 늘리면 무엇이 달라질까요?
    recall: HTTP 요청에 Upgrade websocket과 Sec-WebSocket-Key를 실어 바꾸자고 청하고, 서버가 101과 키로 계산한 Sec-WebSocket-Accept로 받아들이면 그 TCP 연결이 웹소켓이 돼요. 그 뒤로는 요청과 응답의 짝 없이 양쪽이 아무 때나 메시지를 보내요. 주소는 ws, TLS 위에서는 wss예요.
  - id: q4
    title: 무엇을 고르고, 서버가 여러 대면 무엇을 더해야 하나요?
    conclusion:
      lead: '받기만 하면 SSE, 양쪽이 자주 주고받으면 웹소켓, 드물게 확인해도 되면 폴링을 골라요.'
      sub: 'SSE와 웹소켓은 연결이 한 서버에 붙어 있어서, 서버가 여러 대면 다른 서버에서 생긴 이벤트를 그 연결이 있는 서버로 전하는 중계(Redis pub/sub 같은 것)가 필요해요.'
    says:
      - '고르는 기준 표: 방향(폴링과 SSE는 서버에서 받기, 웹소켓은 양쪽), 바탕(폴링과 SSE는 HTTP 그대로, 웹소켓은 Upgrade 뒤 다른 규칙), 다시 연결(SSE는 브라우저가 알아서, 웹소켓은 직접), 쓰는 곳(알림과 진행 상황은 SSE, 채팅과 게임은 웹소켓, 드문 확인은 폴링)'
      - 'SSE와 웹소켓은 연결을 오래 붙잡는다. 사용자 수만큼 연결이 열려 있다. 로드 밸런서는 쉬는 연결을 정해진 시간 뒤에 끊으니, 주기적으로 작은 메시지(하트비트)를 보낸다'
      - '서버가 여러 대면 kim의 연결은 서버 A에 붙어 있는데 주문 이벤트는 서버 B에서 생길 수 있다. B는 A의 연결에 쓸 수 없다. 모든 서버가 이벤트를 받아 자기 연결에 나눠 주는 중계(Redis pub/sub, 메시지 브로커)를 둔다. 쿠키, 세션, 토큰 레슨의 "세션은 저장한 서버만 찾는다"와 같은 문제다'
    widget:
      kind: compare
      note: 'SSE와 웹소켓 두 칸에 방향, 바탕 규칙, 다시 연결, 맞는 곳을 둔다. 상황(주문 상태 알림, 채팅, 서버가 두 대이고 이벤트가 다른 서버에서 생김)을 고르면 양쪽에서 무엇이 맞고 무엇을 더해야 하는지 강조한다'
    asks:
      - '본문의 예시: 서버 A에 SSE로 연결된 kim에게 서버 B에서 생긴 주문 이벤트를 전하려면 무엇이 필요한가 (서버들이 이벤트를 나누는 중계. Redis pub/sub 같은 것)'
      - '옮긴 상황: 여러 사람이 함께 쓰는 문서 편집기에서 각자의 입력을 서로에게 바로 보여 줘야 한다. 폴링, SSE, 웹소켓 가운데 가장 맞는 것은 (웹소켓. 양쪽이 자주 주고받는다)'
    body:
      - p: '세 방식을 나란히 놓으면 이래요.'
      - table:
          head: ['', 폴링, SSE, 웹소켓]
          rows:
            - ['방향', '클라이언트가 묻고 받음', '서버에서 클라이언트로', '양쪽 아무 때나']
            - ['바탕', 'HTTP 그대로', 'HTTP 그대로 (응답을 열어 둠)', 'HTTP Upgrade 뒤 다른 규칙']
            - ['다시 연결', '해당 없음', '브라우저가 알아서', '직접 짜야 함']
            - ['맞는 곳', '드물게 확인해도 될 때', '알림, 진행 상황, 시세', '채팅, 게임, 함께 편집']
      - p: '받기만 하면 되는 알림에는 **SSE**가 간단해요. HTTP 그대로라 프록시와 잘 맞고, 다시 연결도 브라우저가 해 줘요. 양쪽이 자주 주고받아야 하면 **웹소켓**이에요. 드물게 확인해도 되면 **폴링**이 가장 단순해요.'
      - h3: 연결을 오래 붙잡아요
      - p: 'SSE와 웹소켓은 사용자 수만큼 연결을 **열어 둔 채** 있어요. 서버의 자원도 그만큼 들고, 중간의 로드 밸런서나 프록시는 한동안 아무것도 오가지 않는 연결을 끊어요(흔히 60초). 그래서 몇십 초마다 작은 메시지(**하트비트**)를 보내 연결이 살아 있게 해요. 실무 구역에서 코드로 봐요.'
      - h3: 서버가 여러 대면
      - p: '서버를 두 대로 늘렸어요. kim의 SSE 연결은 서버 A에 붙어 있어요. 그런데 배송 시작을 처리한 요청은 서버 B로 갔어요. B는 A에 있는 kim의 연결에 쓸 수 없어요. 쿠키, 세션, 토큰 레슨에서 "세션은 저장한 서버만 찾는다"와 같은 문제예요.'
      - p: '그래서 **모든 서버가 이벤트를 함께 받는 중계**를 둬요. B가 "주문 1 배송 시작"을 Redis pub/sub 같은 곳에 알리면, 모든 서버가 받아 자기에게 붙은 연결 가운데 해당 사용자에게 보내요. 상황을 골라 비교해 보세요.'
      - widget:
          kind: compare
          layout: [selector, sides, verdict]
          selector:
            label: 만들 것
            options:
              - {value: notify, label: 주문 상태 알림}
              - {value: chat, label: 채팅}
              - {value: scale, label: 서버가 두 대이고 이벤트가 다른 서버에서 생김}
          sides:
            - label: SSE
              items:
                - {name: 방향, note: 서버에서 클라이언트로}
                - {name: 다시 연결, note: 브라우저가 알아서}
                - {name: 서버 사이 중계, note: 직접 둬야 함}
            - label: 웹소켓
              items:
                - {name: 방향, note: 양쪽 아무 때나}
                - {name: 다시 연결, note: 직접 짜야 함}
                - {name: 서버 사이 중계, note: 직접 둬야 함}
          scenes:
            notify:
              sides:
                - marks: [{name: 방향, tag: 딱 맞음}, {name: 다시 연결, tag: 편함}]
                  result: [{k: 고를 만한가, v: 맞음}]
                - marks: [{name: 다시 연결, tag: 할 일이 더 많음, mark: bad}]
                  result: [{k: 고를 만한가, v: 되지만 무거움}]
              verdict: 받기만 하는 알림은 SSE가 간단해요.
            chat:
              sides:
                - marks: [{name: 방향, tag: 보낼 때는 따로 POST, mark: bad}]
                  result: [{k: 고를 만한가, v: '되지만 어색함'}]
                - marks: [{name: 방향, tag: 딱 맞음}]
                  result: [{k: 고를 만한가, v: 맞음}]
              verdict: 양쪽이 자주 주고받으면 웹소켓이에요.
            scale:
              sides:
                - marks: [{name: 서버 사이 중계, tag: 필요, mark: bad}]
                - marks: [{name: 서버 사이 중계, tag: 필요, mark: bad}]
              verdict: 둘 다 연결이 한 서버에 붙어 있어요. 서버 사이에 이벤트를 나누는 중계(Redis pub/sub 등)가 있어야 해요.
      - quiz:
          q: '여러 사람이 함께 쓰는 문서 편집기에서 각자의 입력을 서로에게 바로 보여 줘야 해요. 가장 맞는 방식은 무엇일까요?'
          options:
            - 10초마다 폴링
            - SSE
            - 웹소켓
          answer: 3
          explain: 양쪽이 자주, 아무 때나 주고받아야 해서 웹소켓이 맞아요. SSE는 받기만 하고, 폴링은 늦어요.
    recall: 받기만 하면 SSE, 양쪽이 자주 주고받으면 웹소켓, 드물게 확인해도 되면 폴링을 골라요. SSE와 웹소켓은 연결을 오래 붙잡아서 하트비트로 로드 밸런서의 쉬는 연결 시간 제한을 피해요. 연결이 한 서버에 붙어 있으니 서버가 여러 대면 Redis pub/sub 같은 중계로 이벤트를 모든 서버에 나눠요.
practice:
  title: 스프링에서 SSE와 웹소켓
  says:
    - '스프링 MVC는 `SseEmitter`를 돌려주면 응답을 열어 두고, `send`로 이벤트를 쓴다(질문 2의 코드). 생성자의 값이 응답을 열어 둘 시간이다'
    - '흔한 실수: 시간 제한을 짧게 주거나 기본값(서버의 비동기 요청 시간 제한)에 맡기고 이벤트를 늦게 보낸다. 시간이 지나면 이벤트를 하나도 보내기 전이면 503으로 끝난다. 테스트로 보인다. 고친 코드는 시간을 넉넉히 주고 하트비트 주석을 주기적으로 보낸다'
    - '웹소켓은 `spring-boot-starter-websocket`으로 `WebSocketHandler`나 STOMP(`@MessageMapping`)를 쓴다. 이 레슨의 테스트는 의존성을 더하지 않고 톰캣의 자카르타 웹소켓을 직접 띄웠다 (스프링 문서 근거)'
  body:
    - p: '질문 2의 `SseEmitter` 코드가 스프링 MVC에서 SSE를 만드는 방법이에요. `send`로 이벤트를 쓰고, 끝낼 때 `complete()`를 불러요. 요청을 처리하던 스레드는 컨트롤러가 `SseEmitter`를 돌려준 뒤 풀로 돌아가고, 연결만 열려 있어요.'
    - h3: '흔한 실수: 시간 제한이 짧아요'
    - p: '`SseEmitter`의 생성자에 주는 값은 응답을 **열어 둘 시간**이에요. 값을 주지 않으면 서버의 비동기 요청 시간 제한을 따라요(`spring.mvc.async.request-timeout`, 정하지 않으면 톰캣의 기본값). 시간 제한을 0.5초로 두고 첫 이벤트를 3초 뒤에 보내 봤어요.'
    - code: timeoutMistake
      notes:
        - mark: 500L
          as: code
          text: 0.5초 뒤에 응답을 끝내요.
    - ci:
        key: sse-timeout
        label: 실제 결과 보기
        source: WebSocketSseTest.sseTimeoutEndsStream
        code: timeoutMistake
    - p: '1초쯤 뒤 **503**으로 끝났고, 이벤트는 하나도 받지 못했어요. 시간 제한이 지났는데 아직 아무것도 보내지 않았으면 스프링은 503(요청 시간 초과)으로 답해요. 이미 이벤트를 보냈다면 그 자리에서 연결이 끝나요. 브라우저의 `EventSource`는 다시 연결하겠지만, 그 사이 이벤트를 놓치거나 연결을 맺고 끊기를 되풀이해요.'
    - p: '고친 코드는 시간을 넉넉히 주고, 로드 밸런서가 쉬는 연결로 보고 끊지 않게 **하트비트**를 보내요(질문 4).'
    - code: timeoutFixed
    - p: 'SSE의 이벤트 가운데 `:`로 시작하는 줄은 주석이라 브라우저가 무시해요. 연결이 살아 있음만 알려요. 정해진 간격으로 보내는 일은 스케줄러로 해요.'
    - more:
        summary: '더 알아보기: 스프링의 웹소켓'
        body:
          - code: wsGradle
          - p: '스프링에서 웹소켓은 이 의존성을 더하고 `WebSocketHandler`를 등록하거나, 그 위의 메시지 규칙인 **STOMP**를 써서 `@MessageMapping`으로 받아요. STOMP는 "주문 1번 주제를 구독"처럼 주제별로 메시지를 나누고, 외부 브로커와 이어 질문 4의 서버 사이 중계도 맡길 수 있어요.'
          - muted: '이 레슨의 테스트는 다른 테스트에 자동 설정이 켜지지 않게 이 의존성을 더하지 않고, 톰캣의 자카르타 웹소켓을 직접 띄웠어요. 스프링의 웹소켓은 [스프링 문서](link:springWs)가 근거예요.'
    - muted: '근거: [스프링 문서의 SSE](link:springSse), [HTML 명세의 SSE](link:htmlSse), [RFC 6455](link:rfc6455). 시간 제한의 결과는 테스트로 확인했어요.'
interview:
  question: 실시간 알림을 만든다면 폴링, SSE, 웹소켓 가운데 무엇을 고르고 왜 그런가요?
  model:
    - label: 정의
      text: HTTP는 클라이언트가 물어야 서버가 답해서 서버가 먼저 보낼 수 없습니다. 폴링은 클라이언트가 계속 묻는 것, SSE는 응답 하나를 열어 두고 text/event-stream 이벤트를 이어 쓰는 것, 웹소켓은 HTTP Upgrade와 101로 연결을 바꿔 양쪽이 아무 때나 보내는 것입니다.
    - label: 원리
      text: 폴링은 헛된 요청이 많고 간격만큼 늦습니다. SSE는 서버에서 클라이언트로 한 방향이고 HTTP 그대로라 프록시와 잘 맞으며, 브라우저의 EventSource가 Last-Event-ID로 다시 연결합니다. 웹소켓은 Sec-WebSocket-Key와 Accept로 핸드셰이크한 뒤 프레임을 주고받습니다.
    - label: 주의할 점
      text: 받기만 하는 알림은 SSE, 채팅처럼 양쪽이 주고받으면 웹소켓을 고릅니다. 연결을 오래 붙잡으므로 시간 제한과 하트비트를 정하고, 서버가 여러 대면 연결이 한 서버에 붙어 있어서 Redis pub/sub 같은 중계로 이벤트를 나눕니다.
    - label: 경험
      text: '(내 프로젝트로 채우기) 예: 주문 상태 알림을 폴링에서 SSE로 바꿔 요청 수를 줄였고, 서버를 늘리면서 Redis pub/sub으로 이벤트를 나눴습니다.'
verified: 이 레슨의 응답은 짐작이 아니라, 스프링 부트 3.5(SseEmitter)와 톰캣 10.1의 자카르타 웹소켓을 띄우고 자바 21 HttpClient와 그 웹소켓으로 받은 값이에요. 브라우저의 EventSource와 다시 연결하기는 HTML 명세를 근거로 적었어요. 코드가 바뀔 때마다 테스트([WebSocketSseTest](link:test))가 다시 돌아요.
footer: '근거: SSE의 형식과 EventSource, Last-Event-ID는 HTML 명세, 웹소켓의 핸드셰이크와 Sec-WebSocket-Accept는 RFC 6455, SseEmitter와 비동기 요청 시간 제한, 스프링 웹소켓은 스프링 프레임워크 문서. 응답은 톰캣 10.1에서 테스트로 확인했어요. 오류는 [GitHub 이슈](https://github.com/wanja727/dev-lessons/issues)로 알려 주세요.'
claims:
  - claim: '100ms마다 10번 폴링하면 서버는 요청 10번을 받고, 상태가 바뀐 뒤의 응답은 일부다'
    how: 'MiniWeb 컨트롤러가 0.7초 뒤에 상태를 바꾸고 요청 수를 센다'
    test: WebSocketSseTest.pollingWastesRequests
  - claim: 'SseEmitter는 text/event-stream으로 id, event, data 줄과 빈 줄을 차례로 보내고, 이벤트는 보낸 시각에 맞춰 따로 도착한다'
    how: 'HttpClient의 ofLines로 받은 시각과 줄을 기록한다'
    test: WebSocketSseTest.serverSentEvents
  - claim: 'SseEmitter의 시간 제한이 첫 이벤트보다 짧으면 이벤트 없이 503으로 끝난다'
    how: 'new SseEmitter(500L)에 3초 뒤 이벤트를 보낸다'
    test: WebSocketSseTest.sseTimeoutEndsStream
  - claim: '웹소켓 Upgrade 요청에 톰캣은 101과 RFC 6455 예시와 같은 Sec-WebSocket-Accept로 답한다'
    how: '소켓으로 핸드셰이크를 보낸다'
    test: WebSocketSseTest.upgradeHandshake
  - claim: '웹소켓 연결이 열리면 서버가 먼저 보내고, 클라이언트가 같은 연결로 보낸 메시지에 서버가 답한다'
    how: '자바 HttpClient의 웹소켓으로 연결한다'
    test: WebSocketSseTest.bothDirections
sources:
  - 'SSE와 EventSource, Last-Event-ID: HTML 명세 https://html.spec.whatwg.org/multipage/server-sent-events.html'
  - '웹소켓 핸드셰이크와 Sec-WebSocket-Accept: RFC 6455 https://www.rfc-editor.org/rfc/rfc6455.html'
  - '스프링 MVC의 SseEmitter: https://docs.spring.io/spring-framework/reference/web/webmvc/mvc-ann-async.html#mvc-ann-async-sse'
