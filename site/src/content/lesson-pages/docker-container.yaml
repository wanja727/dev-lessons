# 도커와 컨테이너
# 자료 파일의 칸은 docs/lesson-data-format.md에 있다. 문제는 content/questions/docker-container.yaml에 있다.
title: 도커와 컨테이너
description: 컨테이너가 가상 머신과 다른 점, 이미지와 컨테이너의 차이, Dockerfile의 순서가 빌드 시간을 바꾸는 이유, 컨테이너에서 자바 앱의 메모리가 정해지는 방식. 네 가지 질문에 스스로 답할 수 있게 주문 서버를 컨테이너로 띄우며 배우는 대화형 레슨.
unit: 테스트와 운영
minutes: 20
roadmap: T5
type: 개념 설명
prerequisites:
  - {slug: process-and-thread, title: 프로세스와 스레드}
  - {slug: jvm-memory, title: JVM 메모리 구조}
assume: '도커 엔진 27 이상, 자바 21. 운영체제가 프로세스마다 메모리를 따로 준다는 것(프로세스와 스레드 레슨), JVM의 힙과 `-Xmx`(JVM 메모리 구조 레슨). 리눅스 명령(`ps`, `uname`)은 처음 나올 때 한 문장으로 설명해요.'
example: '스프링 부트로 만든 주문 서버 `order-api`를 도커 이미지로 만들어 띄워요. 같은 이미지로 컨테이너 둘을 띄워 보고, 메모리 한도를 주었을 때 JVM이 힙을 얼마로 잡는지 봐요.'
intro:
  - '"제 PC에서는 되는데요"라는 말을 없애려고 팀이 도커를 쓰기 시작했어요. 그런데 서버를 컨테이너로 옮긴 날, 메모리 1GB를 준 컨테이너가 아무 로그 없이 죽고 종료 코드 137만 남아요. 컨테이너를 가상 머신처럼 생각했다면 이유를 찾기 어려워요.'
  - '백엔드 개발자는 자기 서버를 이미지로 만들어 배포하고, 개발할 때는 DB와 Redis를 컨테이너로 띄워요. Dockerfile을 쓰고, 컨테이너에 메모리와 포트를 정해 주고, 컨테이너가 사라질 때 데이터가 어디로 가는지 알아야 해요.'
  - '이 레슨에서는 테스트 안에서 도커로 컨테이너를 띄우고 안을 들여다봐요. 컨테이너 안의 프로세스 목록과 커널 버전, 컨테이너를 지웠다 띄웠을 때 남는 파일, 메모리 한도에 따라 JVM이 잡는 힙 크기를 실제로 확인해요.'
covers:
  - topic: '컨테이너는 호스트 운영체제의 커널을 같이 쓰면서, 프로세스 목록, 파일 시스템, 네트워크를 따로 보게 격리한 프로세스다(리눅스의 네임스페이스)'
    where: '질문 1'
  - topic: '가상 머신은 하이퍼바이저 위에 운영체제 전체(커널 포함)를 따로 띄운다. 그래서 컨테이너가 더 가볍고 빨리 뜬다. 대신 격리는 가상 머신이 더 강하다'
    where: '질문 1'
  - topic: '컨테이너 안에서 앱은 PID 1이다. 그 프로세스가 끝나면 컨테이너도 끝난다'
    where: '질문 1'
  - topic: '맥과 윈도의 도커 데스크톱은 안에 리눅스 가상 머신을 하나 띄우고 그 위에서 컨테이너를 돌린다'
    where: '질문 1의 더 알아보기'
  - topic: '이미지는 실행에 필요한 파일과 설정을 담은 읽기 전용 틀이다. 컨테이너는 이미지 위에 쓰기 층을 얹어 실행한 것이다. 이미지 하나로 컨테이너를 여럿 띄운다'
    where: '질문 2'
  - topic: '컨테이너 안에서 바꾼 파일은 그 컨테이너의 쓰기 층에만 있다. 컨테이너를 지우면 사라진다. 남길 데이터는 볼륨에 둔다'
    where: '질문 2'
  - topic: '이미지는 레지스트리(도커 허브 등)에 올리고 내려받는다. 태그로 버전을 가린다'
    where: '질문 2'
  - topic: 'Dockerfile의 명령 하나가 층 하나를 만든다. 층은 캐시되어, 바뀐 층부터 아래만 다시 만든다'
    where: '질문 3'
  - topic: '자주 바뀌지 않는 것(의존성)을 먼저, 자주 바뀌는 것(소스)을 나중에 복사해야 캐시가 산다'
    where: '질문 3'
  - topic: '멀티 스테이지 빌드: 빌드에 쓴 JDK와 도구를 버리고 실행에 필요한 JRE와 jar만 최종 이미지에 남긴다'
    where: '질문 3'
  - topic: '컨테이너에 메모리 한도(cgroup)를 주면 넘을 때 커널이 프로세스를 죽인다. 종료 코드 137(SIGKILL)이고 `OOMKilled`가 true다'
    where: '질문 4'
  - topic: 'JVM은 컨테이너의 메모리 한도를 읽어 힙 최대 크기의 기본값을 정한다. 기본은 한도의 4분의 1이다. `-XX:MaxRAMPercentage`로 비율을 바꾼다'
    where: '질문 4 (자바 언어 과정의 JVM 메모리 구조(J14)가 넘긴 항목)'
  - topic: '힙 말고도 메타스페이스, 스레드 스택, 다이렉트 메모리가 있어서 `-Xmx`를 한도와 같게 주면 컨테이너가 죽는다'
    where: '질문 4'
  - topic: '포트 연결(`-p 8080:8080`), 환경 변수로 설정 넘기기(`-e SPRING_PROFILES_ACTIVE=prod`)'
    where: '실무에서는'
  - topic: '스프링 부트의 `bootBuildImage`와 층으로 나눈 jar'
    where: '실무에서는'
  - topic: '도커 컴포즈로 앱과 DB를 함께 띄우기'
    where: '실무에서는'
  - topic: '컨테이너 여러 대를 띄우고 관리하는 오케스트레이션(쿠버네티스)'
    where: '다루지 않음: CI/CD와 무중단 배포(T6)에서 롤링 배포를 맡는 도구로만 이름을 든다. 사용법은 로드맵의 "다루지 않는 것"(특정 클라우드와 도구의 사용법)'
  - topic: '테스트에서 컨테이너로 DB 띄우기'
    where: '다루지 않음: 통합 테스트와 Testcontainers(T4)'
links:
  test: https://github.com/wanja727/dev-lessons/blob/main/verification/src/test/java/lab/devlessons/docker/DockerContainerTest.java
  container: https://docs.docker.com/get-started/docker-concepts/the-basics/what-is-a-container/
  layers: https://docs.docker.com/get-started/docker-concepts/building-images/understanding-image-layers/
  cache: https://docs.docker.com/build/cache/
  multiStage: https://docs.docker.com/build/building/multi-stage/
  resources: https://docs.docker.com/engine/containers/resource_constraints/
  jdk8146115: https://bugs.openjdk.org/browse/JDK-8146115
  javaCmd: https://docs.oracle.com/en/java/javase/21/docs/specs/man/java.html
  bootImages: https://docs.spring.io/spring-boot/reference/packaging/container-images/index.html
  bootCompose: https://docs.spring.io/spring-boot/reference/features/dev-services.html
codes:
  predict: |-
    $ docker run --rm -m 512m \
        eclipse-temurin:21-jre \
        java -XX:+PrintFlagsFinal \
        -version | grep MaxHeapSize
  ps: |-
    $ docker run --rm alpine ps
  uname: |-
    $ docker run --rm alpine uname -r
  layerRun: |-
    # 같은 이미지로 컨테이너 A, B
    A$ echo 주문 > /tmp/order.log
    A$ cat /tmp/order.log
    B$ cat /tmp/order.log
    # A, B를 지우고 새 A
    새 A$ cat /tmp/order.log
  dockerfile: |-
    FROM eclipse-temurin:21-jdk AS build
    WORKDIR /app
    COPY gradlew settings.gradle ⤶
    build.gradle ./
    COPY gradle gradle
    [[RUN ./gradlew dependencies]]
    COPY src src
    RUN ./gradlew bootJar

    FROM eclipse-temurin:21-jre
    COPY --from=build ⤶
    /app/build/libs/app.jar app.jar
    ENTRYPOINT ["java", "-jar", "/app.jar"]
  badDockerfile: |-
    FROM eclipse-temurin:21-jdk
    WORKDIR /app
    [[COPY . .]]
    RUN ./gradlew bootJar
    ENTRYPOINT ["java", "-jar",
        "build/libs/app.jar"]
  cacheRun: |-
    # 의존성을 먼저 복사한 Dockerfile
    COPY deps.txt .
    RUN 의존성 내려받기
    COPY src.txt .
    RUN 빌드

    # 한 번에 복사한 Dockerfile
    COPY . .
    RUN 의존성 내려받기
    RUN 빌드

    # 둘 다 src.txt만 고쳐 다시 빌드
  heapRun: |-
    $ docker run --rm [-m 한도] \
        eclipse-temurin:21-jre \
        java [옵션] \
        -XX:+PrintFlagsFinal -version
  oomRun: |-
    $ docker run -m 32m alpine \
        sh -c "tail /dev/zero"
    $ docker inspect ...
  run: |-
    docker run -d -p 8080:8080 \
      -m 1g \
      -e SPRING_PROFILES_ACTIVE=prod \
      -e JAVA_TOOL_OPTIONS=⤷
    "-XX:MaxRAMPercentage=75" \
      order-api:1.4.0
  xmxBad: |-
    docker run -m 1g \
      -e JAVA_TOOL_OPTIONS="[[-Xmx1g]]" \
      order-api:1.4.0
  compose: |-
    services:
      db:
        image: postgres:16-alpine
        environment:
          POSTGRES_PASSWORD: secret
        ports: ["5432:5432"]
        volumes: [dbdata:/var/lib/⤷
    postgresql/data]
    volumes:
      dbdata:
  bootBuildImage: |-
    ./gradlew bootBuildImage \
      --imageName=order-api:1.4.0
predict:
  title: JVM은 힙을 얼마로 잡을까요?
  text: '메모리 한도 512MB를 준 컨테이너에서 `-Xmx` 없이 자바를 띄워요. JVM이 정하는 힙 최대 크기(`MaxHeapSize`)는 얼마쯤일까요? 도커가 도는 PC의 메모리는 16GB예요. 모르는 게 정상이니 감으로 골라 보세요. 답은 질문 4에 나와요.'
  code: predict
  label: 내 예측
  options:
    - {value: host, label: 'PC 메모리의 4분의 1인 4GB'}
    - {value: limit, label: '한도와 같은 512MB'}
    - {value: quarter, label: '한도의 4분의 1인 128MB'}
  answer: quarter
  storageKey: docker-predict
  wrong: 예측은 "{label}"이었어요. 틀린 예측이 더 오래 남으니 괜찮아요.
questions:
  - id: q1
    title: 컨테이너는 가상 머신과 무엇이 다른가요?
    conclusion:
      lead: '컨테이너는 호스트의 커널을 같이 쓰는 프로세스예요. 다만 다른 프로세스와 파일을 못 보게 격리해 둔 거예요.'
      sub: '가상 머신은 운영체제 전체를 따로 띄우지만 컨테이너는 프로세스 하나를 띄우는 것이라, 1초 남짓이면 뜨고 메모리도 앱이 쓰는 만큼만 써요.'
    says:
      - '코드 ps. 컨테이너 안에서 `ps`(실행 중인 프로세스 목록)를 돌리면 프로세스가 하나뿐이고 PID가 1이다. 호스트에는 수백 개가 돌고 있다. 리눅스의 네임스페이스가 컨테이너에게 자기 프로세스만 보이게 한다. 파일 시스템과 네트워크도 같은 방식으로 따로 보인다. 실제 출력을 보인다'
      - '컨테이너 안의 `uname -r`(커널 버전)은 도커가 도는 호스트의 커널 버전과 같다. 커널을 같이 쓰기 때문이다. 이미지가 우분투든 알파인이든 커널은 호스트의 것이다. 실제 출력을 보인다'
      - '가상 머신은 하이퍼바이저 위에 커널까지 포함한 운영체제를 따로 띄운다. 부팅에 수십 초, 메모리 수백 MB가 운영체제 몫으로 든다. 컨테이너를 띄우는 데 걸린 시간을 실제 출력으로 보인다'
      - '격리는 가상 머신이 더 강하다. 컨테이너는 커널을 같이 쓰니 커널의 취약점이 모든 컨테이너에 닿는다. 그래서 클라우드는 가상 머신 위에 컨테이너를 띄우곤 한다'
      - '컨테이너의 PID 1이 끝나면 컨테이너도 끝난다. 그래서 컨테이너에는 보통 앱 프로세스 하나만 띄운다'
      - '더 알아보기: 맥과 윈도에는 리눅스 커널이 없다. 도커 데스크톱은 리눅스 가상 머신을 하나 띄우고 그 안에서 컨테이너를 돌린다. 이 PC에서 `uname -r`이 그 가상 머신의 커널을 보이는 이유다'
    widget:
      kind: compare
      note: '왼쪽은 가상 머신(하드웨어, 하이퍼바이저, 게스트 운영체제와 커널, 라이브러리, 앱), 오른쪽은 컨테이너(하드웨어, 호스트 운영체제와 커널, 컨테이너 런타임, 라이브러리, 앱). "앱 하나 더 띄우기", "커널 버전 확인", "커널 취약점"을 고르면 양쪽에서 새로 생기거나 걸리는 층을 강조한다'
    asks:
      - '본문의 예시: 우분투 22.04 호스트에서 `alpine` 이미지로 띄운 컨테이너의 `uname -r`은 무엇을 보이나 (호스트 우분투의 커널 버전. 커널을 같이 쓴다)'
      - '옮긴 상황: 컨테이너 안의 앱 프로세스가 예외로 끝났다. 컨테이너는 어떻게 되나 (같이 끝난다. 그 프로세스가 PID 1이다)'
    body:
      - p: '**도커**는 프로그램과 그 프로그램이 쓰는 파일을 묶어, 어느 서버에서나 같은 모습으로 띄우게 해 주는 도구예요. 도커로 띄운 실행 단위를 **컨테이너**라고 해요. 흔히 "가벼운 가상 머신"이라고 부르지만, 실제로 무엇인지 안에 들어가 봤어요. 먼저 `ps`(지금 도는 프로세스 목록을 보여 주는 리눅스 명령)예요.'
      - ci:
          key: ps
          label: 실제 출력 보기
          source: DockerContainerTest.onlyOneProcessInside
          code: ps
      - p: '프로세스가 **하나뿐**이고 번호(PID)가 1이에요. 도커가 도는 호스트에는 프로세스가 수백 개 돌고 있는데 컨테이너 안에서는 자기 것만 보여요. 리눅스 커널의 **네임스페이스** 기능이 프로세스 목록, 파일 시스템, 네트워크를 컨테이너마다 따로 보이게 가려 줘요.'
      - p: '다음은 `uname -r`(커널의 버전을 보여 주는 명령)이에요.'
      - ci:
          key: kernel
          label: 실제 출력 보기
          source: DockerContainerTest.sharesHostKernel
          code: uname
      - p: '컨테이너 안의 커널 버전이 **호스트의 커널 버전과 같아요**. 알파인 이미지에는 커널이 들어 있지 않아요. 컨테이너는 호스트의 커널 위에서 도는 **격리된 프로세스**일 뿐이에요. 그래서 만들고 명령을 돌리고 지우기까지 1초 남짓이에요.'
      - table:
          head: ['', 가상 머신, 컨테이너]
          rows:
            - [띄우는 것, '하이퍼바이저 위에 커널까지 든 운영체제 전체', '호스트 커널 위의 격리된 프로세스']
            - [뜨는 시간, 운영체제 부팅이라 수십 초, '프로세스 시작이라 1초 남짓']
            - [메모리, '운영체제 몫으로 수백 MB가 더 들어요', 앱이 쓰는 만큼]
            - [격리, '커널이 따로라 강해요', '커널을 같이 써서 커널의 취약점이 모두에 닿아요']
      - p: '격리는 가상 머신이 더 강해요. 그래서 클라우드에서는 가상 머신 위에 컨테이너를 띄우는 일이 많아요.'
      - p: '컨테이너는 그 안의 **PID 1 프로세스가 끝나면 함께 끝나요**. 컨테이너에는 보통 앱 프로세스 하나만 띄우고, 앱이 죽으면 컨테이너도 멈춰요.'
      - p: '세 가지 일을 골라 두 방식에서 무엇이 생기거나 걸리는지 보세요.'
      - widget:
          kind: compare
          layout: [selector, sides, verdict]
          selector:
            label: 일어난 일
            options:
              - {value: more, label: 앱 하나 더 띄우기}
              - {value: kernel, label: 커널 버전 확인}
              - {value: cve, label: 커널 취약점}
          sides:
            - label: 가상 머신
              items:
                - {name: 앱, note: 'order-api'}
                - {name: 게스트 운영체제와 커널, note: 가상 머신마다 하나}
                - {name: 하이퍼바이저, note: 하드웨어를 나눠 줌}
                - {name: 하드웨어, note: CPU와 메모리}
            - label: 컨테이너
              items:
                - {name: 앱, note: 'order-api (격리된 프로세스)'}
                - {name: 컨테이너 런타임, note: 도커}
                - {name: 호스트 운영체제와 커널, note: 모두가 같이 씀}
                - {name: 하드웨어, note: CPU와 메모리}
          scenes:
            more:
              sides:
                - add: [{name: 앱과 게스트 운영체제 하나 더, note: '부팅 수십 초, 메모리 수백 MB', tag: 새로 만듦}]
                  marks: [{name: 게스트 운영체제와 커널, tag: 하나 더, mark: bad}]
                - add: [{name: 앱 프로세스 하나 더, note: '1초 남짓', tag: 새로 만듦}]
              verdict: '가상 머신은 운영체제를 하나 더 띄우고, 컨테이너는 프로세스를 하나 더 띄워요.'
            kernel:
              sides:
                - marks: [{name: 게스트 운영체제와 커널, tag: 이 커널의 버전}]
                - marks: [{name: 호스트 운영체제와 커널, tag: 이 커널의 버전}]
              verdict: '컨테이너 안의 uname -r은 호스트의 커널 버전이에요.'
            cve:
              sides:
                - marks: [{name: 게스트 운영체제와 커널, tag: 그 가상 머신만}]
                - marks: [{name: 호스트 운영체제와 커널, tag: 모든 컨테이너, mark: bad}]
              verdict: '커널을 같이 쓰니 커널의 취약점은 모든 컨테이너에 닿아요. 격리는 가상 머신이 더 강해요.'
      - more:
          summary: '더 알아보기: 맥과 윈도에서는'
          body:
            - p: '맥과 윈도에는 리눅스 커널이 없어요. 도커 데스크톱은 작은 리눅스 가상 머신을 하나 띄우고 그 안에서 컨테이너를 돌려요. 그래서 윈도 PC에서 돌린 위 테스트의 `uname -r`은 그 가상 머신의 리눅스 커널 버전을 보여 줘요. 깃허브 액션의 리눅스 실행기에서는 실행기 자신의 커널이에요.'
      - quiz:
          q: '우분투 22.04 서버에서 `alpine` 이미지로 띄운 컨테이너의 `uname -r`은 무엇을 보여 줄까요?'
          options:
            - 알파인 리눅스의 커널 버전
            - 호스트 우분투의 커널 버전
            - 도커의 버전
          answer: 2
          explain: '컨테이너는 호스트의 커널을 같이 쓰는 프로세스예요. 이미지에는 커널이 없어요.'
      - next: '컨테이너가 프로세스라면, 컨테이너를 띄울 때 쓰는 "이미지"는 무엇일까요?'
    recall: '컨테이너는 호스트의 커널을 같이 쓰면서, 네임스페이스로 프로세스 목록과 파일 시스템과 네트워크를 따로 보게 격리한 프로세스예요. 그래서 안의 `ps`에는 자기 프로세스(PID 1)만 보이고 `uname -r`은 호스트의 커널 버전이에요. 가상 머신은 커널까지 든 운영체제를 따로 띄워 무겁고 느린 대신 격리가 더 강해요. PID 1이 끝나면 컨테이너도 끝나요.'
  - id: q2
    title: 이미지와 컨테이너는 무엇이 다른가요?
    conclusion:
      lead: '이미지는 실행에 필요한 파일을 담은 읽기 전용 틀이고, 컨테이너는 그 틀 위에 쓰기 층을 하나 얹어 실행한 것이에요.'
      sub: '그래서 이미지 하나로 컨테이너를 여럿 띄울 수 있고, 컨테이너 안에서 바꾼 파일은 그 컨테이너를 지우면 함께 사라져요.'
    says:
      - '이미지는 운영체제의 파일(라이브러리, 셸), JRE, 앱 jar, 실행할 명령을 묶은 것이다. 바뀌지 않는다. 클래스와 객체의 관계에 한 번만 빗대고, 그다음은 이미지와 컨테이너로만 부른다'
      - '같은 이미지로 컨테이너 둘을 띄우고 한쪽에서 `/tmp/order.log`를 만든다. 다른 쪽에는 없다. 각 컨테이너가 자기 쓰기 층을 갖기 때문이다. 실제 출력을 보인다'
      - '파일을 만든 컨테이너를 지우고 같은 이미지로 다시 띄우면 파일이 없다. 이미지는 그대로이고 쓰기 층만 버려졌다'
      - '그래서 DB처럼 남겨야 하는 데이터는 볼륨(컨테이너 밖에 두는 저장 공간)에 둔다. 볼륨을 붙여 같은 실험을 하면 파일이 남는다'
      - '이미지는 레지스트리에 올리고 내려받는다. `eclipse-temurin:21-jre`에서 콜론 뒤가 태그다. 배포할 때는 `order-api:1.4.0`처럼 버전 태그를 붙인다'
    widget:
      kind: steps
      note: '이미지 하나에서 컨테이너 A와 B를 띄우고, A에서 파일을 만들고, A를 지우고, 다시 A를 띄우는 단계를 차례로 보인다. 각 단계에서 이미지 층(그대로), A의 쓰기 층, B의 쓰기 층에 무엇이 있는지를 표시한다. 마지막에 볼륨을 붙인 경우를 고르면 파일이 남는다'
    asks:
      - '본문의 예시: 컨테이너 안에서 만든 파일은 그 컨테이너를 지우고 같은 이미지로 새 컨테이너를 띄우면 있나 (없다. 쓰기 층이 함께 버려진다)'
      - '옮긴 상황: PostgreSQL을 볼륨 없이 컨테이너로 띄워 회원 데이터를 넣었다. 이미지를 새 버전으로 바꾸려고 컨테이너를 지우고 다시 띄우면 데이터는 (사라진다. 볼륨에 둬야 남는다)'
    body:
      - p: '**이미지**는 컨테이너를 띄우는 데 필요한 파일을 모두 묶은 것이에요. 운영체제의 기본 파일(라이브러리, 셸), JRE, 앱의 jar, 그리고 "시작하면 무엇을 실행하라"는 명령이 들어 있어요. 이미지는 **읽기 전용**이라 바뀌지 않아요. 클래스 하나로 객체를 여럿 만들듯 이미지 하나로 컨테이너를 여럿 띄워요.'
      - p: '**컨테이너**는 그 이미지 위에 **쓰기 층**을 하나 얹어 실행한 거예요. 컨테이너 안에서 파일을 만들거나 고치면 이미지가 아니라 그 컨테이너의 쓰기 층에 적혀요. 같은 이미지로 컨테이너 A, B를 띄워 확인했어요.'
      - ci:
          key: layer
          label: 실제 출력 보기
          source: DockerContainerTest.writableLayerIsPerContainer
          code: layerRun
      - p: 'A에서 만든 파일이 B에는 **없어요**. 각자 쓰기 층이 따로라서예요. 그리고 A를 지우고 같은 이미지로 새로 띄우면 그 파일도 **없어요**. 이미지는 그대로이고 A의 쓰기 층만 함께 버려졌어요.'
      - p: '그래서 DB 데이터나 업로드한 파일처럼 남겨야 하는 것은 **볼륨**에 둬요. 볼륨은 컨테이너 밖(도커가 관리하는 저장 공간)에 있는 폴더를 컨테이너 안의 경로에 붙이는 거예요. 위 출력의 마지막 줄처럼 볼륨에 둔 파일은 컨테이너를 지워도 남고, 새 컨테이너에 붙이면 다시 보여요.'
      - p: '단계를 넘기며 이미지, A, B에 무엇이 있는지 보세요.'
      - widget:
          kind: steps
          layout: [duo, log, buttons, verdict]
          initial:
            duo:
              - {label: 이미지 alpine, text: '읽기 전용. /tmp는 비어 있음'}
              - {label: 컨테이너, state: dim, text: 아직 없음}
          scenarios:
            default:
              - log: 'docker run alpine 두 번 → A, B'
                duo:
                  - {label: 이미지 alpine, text: 그대로}
                  - label: 컨테이너의 쓰기 층
                    rows: [{k: A, v: 비어 있음}, {k: B, v: 비어 있음}]
              - log: 'A$ echo 주문 > /tmp/order.log'
                duo:
                  - {label: 이미지 alpine, text: 그대로}
                  - label: 컨테이너의 쓰기 층
                    rows: [{k: A, v: /tmp/order.log, mark: changed}, {k: B, v: 비어 있음}]
              - log: 'B$ cat /tmp/order.log → 없음'
                duo:
                  - {label: 이미지 alpine, text: 그대로}
                  - label: 컨테이너의 쓰기 층
                    rows: [{k: A, v: /tmp/order.log}, {k: B, v: 비어 있음, mark: bad}]
              - log: 'A를 지우고 같은 이미지로 새 A'
                duo:
                  - {label: 이미지 alpine, text: 그대로}
                  - label: 컨테이너의 쓰기 층
                    rows: [{k: 새 A, v: 비어 있음, mark: bad}, {k: B, v: 비어 있음}]
                verdict: '파일은 지운 A의 쓰기 층과 함께 사라졌어요. 남길 데이터는 볼륨에 둬요.'
      - h3: 이미지의 이름과 태그
      - p: '이미지는 도커 허브 같은 **레지스트리**에 올리고 내려받아요. `eclipse-temurin:21-jre`에서 콜론 앞은 이미지 이름, 뒤는 **태그**예요. 태그로 버전을 가려요. 내 서버를 배포할 때도 `order-api:1.4.0`처럼 버전 태그를 붙여 올리고, 서버는 그 태그를 내려받아 띄워요.'
      - quiz:
          q: 'PostgreSQL을 볼륨 없이 컨테이너로 띄워 회원 데이터를 넣었어요. 이미지를 새 버전으로 바꾸려고 컨테이너를 지우고 다시 띄우면 데이터는 어떻게 될까요?'
          options:
            - 이미지에 저장되어 남는다
            - 지운 컨테이너의 쓰기 층과 함께 사라진다
            - 도커가 자동으로 옮겨 준다
          answer: 2
          explain: '컨테이너 안에서 바꾼 것은 그 컨테이너의 쓰기 층에만 있어요. 남길 데이터는 볼륨에 둬요.'
      - next: '이미지 자체는 어떻게 만들까요? 만드는 데 왜 어떤 때는 몇 초, 어떤 때는 몇 분이 걸릴까요?'
    recall: '이미지는 운영체제의 기본 파일, JRE, 앱, 실행 명령을 묶은 읽기 전용 틀이고, 컨테이너는 그 위에 쓰기 층을 얹어 실행한 거예요. 이미지 하나로 컨테이너를 여럿 띄우고, 컨테이너 안에서 바꾼 파일은 그 컨테이너의 쓰기 층에만 있어서 지우면 사라져요. 남길 데이터는 볼륨에 둬요. 이미지는 레지스트리에 태그로 버전을 붙여 올려요.'
  - id: q3
    title: Dockerfile의 순서가 왜 빌드 시간을 바꾸나요?
    conclusion:
      lead: 'Dockerfile의 명령 하나가 이미지의 층 하나가 되고, 도커는 바뀌지 않은 층을 캐시에서 꺼내 써요. 한 층이 바뀌면 그 아래 층은 모두 다시 만들어요.'
      sub: '그래서 잘 바뀌지 않는 의존성을 먼저 받고 자주 바뀌는 소스를 나중에 복사해야, 소스만 고쳤을 때 의존성을 다시 받지 않아요.'
    says:
      - '`FROM`, `COPY`, `RUN` 같은 명령마다 층이 생긴다. 이미지의 층 목록(`docker history`)을 실제 출력으로 보인다'
      - '도커는 명령과 복사한 파일이 같으면 그 층을 다시 만들지 않고 캐시를 쓴다. 한 층이 달라지면 그 뒤의 층은 모두 다시 만든다'
      - '코드 badDockerfile은 `COPY . .`로 소스까지 한 번에 복사한다. 소스 한 줄만 고쳐도 이 층이 바뀌고, 그 뒤의 빌드가 의존성 내려받기부터 다시 돈다'
      - '코드 dockerfile은 빌드 파일만 먼저 복사해 의존성을 받고, 그다음 소스를 복사한다. 소스만 고치면 의존성 층은 캐시를 쓴다. 두 Dockerfile을 소스만 고쳐 다시 빌드했을 때 캐시를 쓴 층의 수를 실제 출력으로 보인다'
      - '코드 dockerfile은 멀티 스테이지 빌드다. 앞 단계(JDK와 그레이들)에서 jar를 만들고, 뒤 단계에는 JRE와 jar만 복사한다. 최종 이미지에 빌드 도구가 없어 작다. 두 방식의 이미지 크기를 비교한다'
    asks:
      - '본문의 예시: 코드 dockerfile에서 `src`의 컨트롤러 한 줄만 고치고 다시 빌드하면 `RUN ./gradlew dependencies` 층은 다시 도나 (돌지 않는다. 그 위의 층이 바뀌지 않아 캐시를 쓴다)'
      - '옮긴 상황: Node 서버의 Dockerfile이 `COPY . .` 다음 `RUN npm install`이다. 소스를 고칠 때마다 빌드가 3분 걸린다. 어떻게 고치나 (`package.json`만 먼저 복사해 `npm install`을 하고, 그다음 소스를 복사한다)'
    body:
      - p: '이미지는 **Dockerfile**이라는 글로 만들어요. 위에서부터 차례로, 어느 이미지에서 시작해(`FROM`) 무엇을 복사하고(`COPY`) 무엇을 실행할지(`RUN`) 적어요. 도커는 **명령 하나마다 층을 하나** 쌓아 이미지를 만들어요. 질문 2의 읽기 전용 이미지는 사실 이런 층들의 묶음이에요.'
      - p: '층에는 중요한 성질이 있어요. 도커는 빌드할 때 명령과 복사할 파일이 지난번과 같으면 그 층을 다시 만들지 않고 **캐시**에서 꺼내 써요. 하지만 한 층이 달라지면 **그 아래 층은 모두 다시** 만들어요. 아래 층은 위 층의 결과 위에 쌓였으니 위가 바뀌면 다시 쌓아야 해요([도커 문서](link:cache)).'
      - p: '스프링 서버의 Dockerfile 두 가지를 볼게요. 먼저 흔히 처음 쓰는 모양이에요.'
      - code: badDockerfile
        notes:
          - mark: COPY . .
            as: code
            text: '빌드 파일과 소스를 한 번에 복사해요. 소스 한 줄만 바뀌어도 이 층이 바뀌어요.'
      - p: '소스 한 줄만 고쳐도 `COPY . .` 층이 바뀌니, 그 아래의 그레이들 빌드가 **의존성 내려받기부터** 다시 돌아요. 의존성은 그대로인데 매번 몇 분씩 받아요.'
      - p: '고친 모양은 잘 바뀌지 않는 것을 위에, 자주 바뀌는 것을 아래에 둬요.'
      - code: dockerfile
        notes:
          - mark: RUN ./gradlew dependencies
            as: code
            text: '빌드 파일만 복사한 뒤 의존성을 받아요. 소스를 고쳐도 이 층은 캐시를 써요.'
      - p: '두 모양을 작은 Dockerfile로 흉내 내 실제로 빌드해 봤어요. 한 번 빌드한 뒤 소스 파일만 고쳐 다시 빌드하고, 단계마다 캐시를 썼는지 셌어요.'
      - ci:
          key: cache
          label: 실제 결과 보기
          source: DockerContainerTest.layerCacheDependsOnOrder
          code: cacheRun
      - p: '의존성을 먼저 복사한 쪽은 의존성 층을 **캐시에서 꺼냈고**, 한 번에 복사한 쪽은 **다시 실행**했어요. 같은 원리는 자바가 아니어도 같아요. Node 서버라면 `package.json`만 먼저 복사해 `npm install`을 하고, 그다음 소스를 복사해요.'
      - h3: 멀티 스테이지 빌드
      - p: '고친 Dockerfile에는 `FROM`이 두 번 나와요. **멀티 스테이지 빌드**예요. 앞 단계(`AS build`)는 JDK와 그레이들로 jar를 만들고, 뒤 단계는 JRE만 든 이미지에서 시작해 앞 단계의 jar 하나만 복사해 와요(`COPY --from=build`). 최종 이미지에는 JDK, 그레이들, 소스, 의존성 캐시가 남지 않아 작고, 서버에 필요 없는 도구도 없어요([도커 문서](link:multiStage)).'
      - quiz:
          q: '의존성을 먼저 받고 소스를 나중에 복사한 Dockerfile에서, 컨트롤러 한 줄만 고치고 다시 빌드했어요. 의존성을 받는 `RUN` 층은 어떻게 될까요?'
          options:
            - 다시 실행된다
            - 캐시를 쓴다. 그 위의 층이 바뀌지 않았다
            - 이미지에서 빠진다
          answer: 2
          explain: '바뀐 것은 아래쪽의 소스 복사 층이라, 그 위의 의존성 층은 캐시에서 꺼내요.'
      - next: '이렇게 만든 이미지로 스프링 서버를 띄웠어요. 컨테이너에 메모리 한도를 주면 JVM은 힙을 얼마로 잡을까요?'
    recall: 'Dockerfile의 명령 하나가 이미지의 층 하나가 되고, 도커는 명령과 복사한 파일이 같은 층을 캐시에서 꺼내 써요. 한 층이 바뀌면 그 아래 층은 모두 다시 만들어요. 그래서 `COPY . .`로 한 번에 복사하면 소스만 고쳐도 의존성을 다시 받고, 빌드 파일만 먼저 복사해 의존성을 받은 뒤 소스를 복사하면 캐시가 살아요. 멀티 스테이지 빌드로 최종 이미지에는 JRE와 jar만 남겨요.'
  - id: q4
    title: 컨테이너에서 자바 앱의 메모리는 어떻게 정해지나요?
    conclusion:
      lead: 'JVM은 컨테이너에 준 메모리 한도를 자기 메모리로 보고, 그 4분의 1을 힙 최대 크기의 기본값으로 잡아요.'
      sub: '프로세스 전체가 한도를 넘으면 커널이 그 자리에서 죽여요(종료 코드 137). 힙 밖의 메모리도 있으니 힙은 한도보다 넉넉히 작게 잡아요.'
    says:
      - '예측의 답을 밝힌다. 한도 512MB의 컨테이너에서 `MaxHeapSize`는 약 128MB, 한도 2GB면 약 512MB다. 한도가 없으면 호스트(또는 도커 데스크톱 가상 머신) 메모리의 4분의 1이다. 세 경우의 실제 출력을 보인다'
      - '자바 10부터 JVM이 컨테이너의 한도(cgroup)를 읽는다. 그 전의 JVM은 호스트 메모리를 보고 힙을 크게 잡아 컨테이너가 죽곤 했다'
      - '4분의 1은 컨테이너에 앱 하나만 띄우는 서버에는 작다. `-XX:MaxRAMPercentage=75`로 비율을 올린다. 같은 512MB에서 힙이 약 384MB가 되는 것을 보인다'
      - '컨테이너의 메모리 한도는 커널의 cgroup이 지킨다. 프로세스가 한도를 넘으면 커널이 SIGKILL로 죽인다. 자바의 `OutOfMemoryError`와 달리 예외도 로그도 없다. 코드 oom처럼 종료 코드 137과 `OOMKilled: true`만 남는다. 한도 32MB 컨테이너에서 메모리를 계속 쓰는 프로세스로 실제로 보인다'
      - 'JVM은 힙 말고도 메타스페이스, 스레드마다의 스택, 다이렉트 버퍼, JIT 코드 캐시를 쓴다(J14). 한도 512MB에 `-Xmx512m`을 주면 힙이 다 차기 전에 프로세스 전체가 한도를 넘어 죽는다. 힙은 한도의 75% 안팎으로 잡는다'
    widget:
      kind: toggle
      note: '컨테이너 메모리 한도(없음, 512MB, 2GB)와 `MaxRAMPercentage`(기본 25, 75)를 골라 JVM이 잡은 `MaxHeapSize`의 실제 출력을 보인다. "한도 512MB에 -Xmx512m"을 고르면 힙과 힙 밖의 메모리를 더한 막대가 한도를 넘어 137로 죽는 장면을 보인다'
    asks:
      - '본문의 예시: 한도 2GB 컨테이너에서 JVM 옵션 없이 띄운 스프링 서버의 힙 최대 크기는 (약 512MB. 한도의 4분의 1)'
      - '옮긴 상황: 한도 1GB 컨테이너가 로그 없이 재시작을 반복하고 `docker inspect`에 종료 코드 137, `OOMKilled: true`가 보인다. 자바 옵션은 `-Xmx1g`다. 원인은 (힙에 한도 전부를 줘서 힙 밖의 메모리를 더하면 한도를 넘는다. 커널이 죽였다)'
      - '실무 구역: 코드 run처럼 한도 1GB에 `MaxRAMPercentage=75`를 주면 힙 최대 크기는 (약 768MB)'
    body:
      - p: '컨테이너를 띄울 때 `-m 512m`처럼 **메모리 한도**를 줄 수 있어요. 리눅스 커널의 **cgroup** 기능이 그 컨테이너의 프로세스들이 쓰는 메모리를 세고 한도를 지켜요. 이 한도 안에서 JVM은 힙을 얼마로 잡을까요? 같은 JRE 이미지를 한도를 바꿔 가며 띄우고 JVM이 정한 힙 최대 크기(`MaxHeapSize`)를 찍었어요.'
      - ci:
          key: heap
          label: 실제 출력 보기
          source: DockerContainerTest.jvmReadsContainerLimit
          code: heapRun
      - p: '예측의 답이에요. {{predict-result}} 한도 512MB에서 힙은 **128MB**, 2GB에서 512MB예요. JVM은 컨테이너의 한도를 자기가 쓸 수 있는 메모리로 보고, `-Xmx`가 없으면 **그 4분의 1**을 힙 최대 크기로 잡아요. 한도가 없으면 도커가 쓸 수 있는 메모리 전체의 4분의 1이에요.'
      - p: 'JVM이 컨테이너의 한도를 읽게 된 것은 자바 10부터예요(자바 8은 8u191부터). 그 전의 JVM은 호스트의 메모리를 보고 힙을 크게 잡아서, 한도가 작은 컨테이너에서 힙이 다 차기도 전에 죽곤 했어요([JDK-8146115](link:jdk8146115)).'
      - p: '그런데 컨테이너에 앱 하나만 띄우는 서버에서 4분의 1은 너무 작아요. 512MB를 줬는데 힙은 128MB만 써요. `-XX:MaxRAMPercentage=75`로 비율을 올리면 위 출력의 마지막 줄처럼 약 384MB가 돼요([java 명령 문서](link:javaCmd)).'
      - h3: 한도를 넘으면 커널이 죽여요
      - p: '프로세스가 한도보다 많이 쓰면 어떻게 될까요? 한도 32MB 컨테이너에서 메모리를 끝없이 쓰는 명령을 돌렸어요.'
      - ci:
          key: oom
          label: 실제 결과 보기
          source: DockerContainerTest.oomKilled
          code: oomRun
      - p: '컨테이너는 로그 한 줄 없이 끝났고, 종료 코드 **137**과 **`OOMKilled: true`**만 남았어요. 137은 128 + 9, 곧 SIGKILL(9번 신호)로 죽었다는 뜻이에요. 커널이 한도를 넘은 프로세스를 그 자리에서 죽인 거예요. 자바의 `OutOfMemoryError`는 JVM이 "힙이 모자라다"며 던지는 예외라 로그에 남지만, 이것은 JVM이 무언가를 할 틈도 없이 바깥에서 죽인 것이라 아무것도 남지 않아요.'
      - h3: '-Xmx를 한도와 같게 주면 안 돼요'
      - p: 'JVM이 쓰는 메모리는 힙만이 아니에요. JVM 메모리 구조 레슨에서 본 메타스페이스(클래스 정보), 스레드마다의 스택, 다이렉트 버퍼, JIT가 만든 기계어 코드도 있어요. 한도 1GB에 `-Xmx1g`를 주면 힙이 다 차기 전에 **힙과 힙 밖을 더한 프로세스 전체**가 1GB를 넘어 커널이 죽여요. 힙은 한도의 75% 안팎으로 잡고 나머지를 힙 밖에 남겨 둬요.'
      - p: '한도와 비율을 골라 보세요. 숫자는 위 실제 출력의 값이에요.'
      - widget:
          kind: toggle
          layout: [selector, duo, verdict]
          selector:
            label: 컨테이너와 JVM 옵션
            options:
              - {value: m512, label: '-m 512m'}
              - {value: m2g, label: '-m 2g'}
              - {value: p75, label: '-m 512m, MaxRAMPercentage=75'}
              - {value: xmx, label: '-m 1g, -Xmx1g'}
          scenes:
            m512:
              duo:
                - label: 컨테이너
                  rows: [{k: 메모리 한도, v: 512MB}]
                - label: JVM
                  rows: [{k: MaxHeapSize, v: '약 128MB (4분의 1)', mark: changed}]
              verdict: '옵션이 없으면 한도의 4분의 1이에요. 앱 하나만 띄우는 서버에는 작아요.'
            m2g:
              duo:
                - label: 컨테이너
                  rows: [{k: 메모리 한도, v: 2GB}]
                - label: JVM
                  rows: [{k: MaxHeapSize, v: '약 512MB (4분의 1)', mark: changed}]
              verdict: '한도가 커지면 힙도 비례해서 커져요.'
            p75:
              duo:
                - label: 컨테이너
                  rows: [{k: 메모리 한도, v: 512MB}]
                - label: JVM
                  rows: [{k: MaxHeapSize, v: '약 384MB (4분의 3)', mark: changed}, {k: 힙 밖에 남는 몫, v: 약 128MB}]
              verdict: '비율을 올려 힙을 키우고, 힙 밖의 메모리 몫은 남겨 둬요.'
            xmx:
              duo:
                - label: 컨테이너
                  rows: [{k: 메모리 한도, v: 1GB}, {k: 끝, v: '종료 코드 137, OOMKilled', mark: bad}]
                - label: JVM
                  rows: [{k: 힙, v: 최대 1GB}, {k: 힙 밖, v: '메타스페이스, 스택, 버퍼...', mark: bad}]
              verdict: '힙에 한도 전부를 주면 힙 밖을 더한 프로세스 전체가 한도를 넘어 커널이 죽여요.'
      - quiz:
          q: '한도 2GB 컨테이너에서 JVM 옵션 없이 스프링 서버를 띄웠어요. 힙 최대 크기는 얼마쯤일까요?'
          options:
            - 약 2GB
            - 약 512MB
            - 도커가 도는 PC 메모리의 4분의 1
          answer: 2
          explain: 'JVM은 컨테이너의 한도를 자기 메모리로 보고 그 4분의 1을 힙 기본값으로 잡아요.'
    recall: 'JVM은 컨테이너의 메모리 한도(cgroup)를 자기 메모리로 보고, `-Xmx`가 없으면 그 4분의 1을 힙 최대 크기로 잡아요. 512MB면 128MB예요. 앱 하나만 띄우면 `-XX:MaxRAMPercentage=75`로 올려요. 프로세스 전체가 한도를 넘으면 커널이 SIGKILL로 죽여 로그 없이 종료 코드 137과 OOMKilled만 남아요. 힙 밖의 메타스페이스, 스택, 버퍼도 있으니 `-Xmx`를 한도와 같게 주면 안 돼요.'
practice:
  title: 실무에서는 이렇게 써요
  says:
    - '코드 run: 실제로 띄우는 모양. `-p 8080:8080`은 호스트의 8080 포트를 컨테이너의 8080으로 잇는다. `-e`로 환경 변수를 넘기면 스프링 부트는 `SPRING_PROFILES_ACTIVE` 같은 환경 변수를 설정 값으로 읽는다(S5). `JAVA_TOOL_OPTIONS`는 JVM이 시작할 때 읽는 환경 변수다 (도커 문서와 스프링 부트 문서 근거)'
    - '스프링 부트는 Dockerfile 없이 `./gradlew bootBuildImage`로 이미지를 만들 수 있다. jar를 의존성, 스프링 부트 로더, 앱 코드 층으로 나눠 앱 코드만 바뀐 배포에서 작은 층만 새로 올라간다 (스프링 부트 문서 근거)'
    - '개발할 때 앱과 PostgreSQL, Redis를 함께 띄우는 `compose.yaml`을 보인다. 스프링 부트 3.1부터 `spring-boot-docker-compose`를 넣으면 앱을 띄울 때 컴포즈를 함께 띄운다 (문서 근거)'
    - '흔한 실수 하나: 코드 badDockerfile. 캐시가 안 살고, JDK와 소스, 그레이들 캐시가 모두 이미지에 남아 이미지가 크다. 고친 코드: 코드 dockerfile. 질문 3의 실제 출력이 근거다'
    - '흔한 실수 둘: 질문 4의 `-Xmx`를 한도와 같게 주기. 고친 코드: `-Xmx`를 빼고 `-XX:MaxRAMPercentage=75`를 준다'
  body:
    - p: '스프링 서버를 컨테이너로 띄우는 모양이에요. 이 구역의 옵션 설명은 테스트가 아니라 도커와 스프링 부트의 문서가 근거예요.'
    - code: run
    - ul:
        - '**`-p 8080:8080`**은 호스트의 8080 포트로 온 요청을 컨테이너의 8080 포트로 보내요. 컨테이너는 네트워크도 격리돼 있어서(질문 1) 이어 주지 않으면 밖에서 닿지 않아요.'
        - '**`-e`**로 환경 변수를 넘겨요. 스프링 부트는 `SPRING_PROFILES_ACTIVE` 같은 환경 변수를 설정 값으로 읽어요(설정과 프로파일 레슨). 그래서 이미지 하나를 검증 서버와 운영 서버에 똑같이 띄우고 설정만 바꿔요.'
        - '**`JAVA_TOOL_OPTIONS`**는 JVM이 시작할 때 읽는 환경 변수예요. 질문 4의 `MaxRAMPercentage`를 여기로 넘겨요.'
    - h3: 'Dockerfile 없이 이미지 만들기'
    - code: bootBuildImage
    - p: '스프링 부트의 그레이들 플러그인은 Dockerfile 없이 이미지를 만들어요. jar를 의존성, 스프링 부트 로더, 앱 코드 층으로 나눠 담아서, 앱 코드만 바뀐 배포에서는 작은 층 하나만 새로 올라가요. 질문 3의 "자주 바뀌는 것을 아래 층에"를 플러그인이 대신 해 주는 셈이에요([스프링 부트 문서](link:bootImages)).'
    - h3: 개발할 때는 도커 컴포즈로
    - code: compose
    - p: '앱이 쓰는 PostgreSQL, Redis를 `compose.yaml`에 적어 두고 `docker compose up`으로 함께 띄워요. DB 데이터는 질문 2대로 볼륨(`dbdata`)에 둬서 컨테이너를 지워도 남게 해요. 스프링 부트 3.1부터는 `spring-boot-docker-compose` 의존성을 넣으면 앱을 띄울 때 컴포즈도 함께 띄우고 접속 정보를 넘겨 줘요([스프링 부트 문서](link:bootCompose)).'
    - h3: '흔한 실수: COPY . . 한 줄짜리 Dockerfile'
    - p: '질문 3의 처음 Dockerfile이에요. 소스를 고칠 때마다 의존성을 다시 받고, JDK와 그레이들 캐시가 최종 이미지에 남아 이미지도 커요. 고친 것은 질문 3의 멀티 스테이지 Dockerfile이에요.'
    - h3: '흔한 실수: -Xmx를 한도와 같게'
    - code: xmxBad
      notes:
        - mark: -Xmx1g
          as: code
          text: '한도 전부를 힙에 줘서 힙 밖의 메모리를 더하면 한도를 넘어요.'
    - p: '질문 4대로 힙 밖의 메모리 때문에 컨테이너가 137로 죽어요. `-Xmx`를 빼고 `-XX:MaxRAMPercentage=75`를 주면 한도가 바뀌어도 힙이 그 비율로 따라가요.'
interview:
  question: '컨테이너와 가상 머신의 차이, 컨테이너에서 자바 앱의 메모리를 정할 때 주의할 점을 설명해 주세요'
  model:
    - label: 정의
      text: 컨테이너는 호스트의 커널을 같이 쓰면서 네임스페이스로 프로세스와 파일 시스템, 네트워크를 격리한 프로세스이고, 가상 머신은 하이퍼바이저 위에 커널까지 든 운영체제를 따로 띄운 것입니다. 이미지는 읽기 전용 틀이고 컨테이너는 그 위에 쓰기 층을 얹어 실행한 것입니다.
    - label: 원리
      text: 그래서 컨테이너는 1초 남짓에 뜨고 가볍지만 격리는 가상 머신이 더 강합니다. 이미지는 Dockerfile의 명령마다 층이 쌓이고 바뀌지 않은 층은 캐시를 쓰므로, 의존성을 먼저 받고 소스를 나중에 복사합니다. JVM은 컨테이너의 메모리 한도를 읽어 그 4분의 1을 힙 기본값으로 잡습니다.
    - label: 주의할 점
      text: 한도를 넘으면 커널이 프로세스를 죽여 로그 없이 종료 코드 137만 남습니다. 힙 밖에도 메타스페이스와 스택이 있으니 -Xmx를 한도와 같게 주지 않고 MaxRAMPercentage로 75% 안팎을 줍니다. 컨테이너 안의 파일은 지우면 사라지니 데이터는 볼륨에 둡니다.
    - label: 경험
      text: '(내 프로젝트로 채우기) 예: 컨테이너가 로그 없이 재시작을 반복해서 docker inspect로 OOMKilled를 확인했고, -Xmx를 빼고 MaxRAMPercentage=75로 바꿔 해결했습니다.'
verified: 이 레슨의 출력은 짐작이 아니라 테스트가 도커로 컨테이너를 띄워 받은 값이에요. 프로세스 목록, 커널 버전, 쓰기 층과 볼륨, 빌드 캐시, JVM의 힙 크기, 메모리 초과로 죽는 것을 확인했어요. 코드가 바뀔 때마다 테스트([DockerContainerTest](link:test))가 다시 돌아요.
footer: '근거: 컨테이너와 이미지는 [도커 문서](link:container), 층은 [이미지 층 문서](link:layers), 빌드 캐시는 [빌드 캐시 문서](link:cache), 멀티 스테이지는 [멀티 스테이지 문서](link:multiStage), 메모리 한도는 [자원 제한 문서](link:resources), JVM의 컨테이너 인식은 [JDK-8146115](link:jdk8146115)와 [java 명령 문서](link:javaCmd), 스프링 부트의 이미지와 컴포즈는 [이미지 문서](link:bootImages)와 [개발 서비스 문서](link:bootCompose). 결과는 도커와 자바 21 이미지로 테스트해 확인했어요. 오류는 [GitHub 이슈](https://github.com/wanja727/dev-lessons/issues)로 알려 주세요.'
claims:
  - claim: '컨테이너 안의 `ps`에는 프로세스가 하나뿐이고 PID가 1이다'
    how: 'Testcontainers의 `GenericContainer("alpine:3.20")`로 `ps`를 돌린다'
    test: DockerContainerTest.onlyOneProcessInside
  - claim: '컨테이너 안의 `uname -r`은 도커 엔진이 보고하는 호스트 커널 버전과 같다'
    how: '`DockerClientFactory.instance().client().infoCmd()`의 `kernelVersion`과 비교한다'
    test: DockerContainerTest.sharesHostKernel
  - claim: '같은 이미지의 두 컨테이너는 파일을 따로 갖고, 지웠다 다시 띄우면 파일이 없다. 볼륨을 붙이면 남는다'
    how: '`GenericContainer` 둘과 `execInContainer`로 확인한다. 볼륨은 도커 볼륨을 만들어 두 컨테이너에 차례로 붙인다'
    test: DockerContainerTest.writableLayerIsPerContainer
  - claim: '소스만 바꿔 다시 빌드하면 의존성을 먼저 복사한 Dockerfile은 의존성 층에 캐시를 쓰고, `COPY . .` Dockerfile은 쓰지 않는다'
    how: '작은 Dockerfile 둘을 도커 클라이언트로 두 번 빌드하고, 빌드 출력의 "Using cache"를 단계마다 본다'
    test: DockerContainerTest.layerCacheDependsOnOrder
  - claim: '한도 512MB에서 `MaxHeapSize`는 약 128MB, 2GB에서 약 512MB, `MaxRAMPercentage=75`면 512MB에서 약 384MB다'
    how: '`eclipse-temurin:21-jre`에 메모리 한도를 주고 `java -XX:+PrintFlagsFinal -version`을 돌린다'
    test: DockerContainerTest.jvmReadsContainerLimit
  - claim: '한도를 넘는 프로세스는 종료 코드 137, `OOMKilled: true`로 죽는다'
    how: '한도 32MB의 `alpine`에서 `tail /dev/zero`를 돌리고 컨테이너 상태를 읽는다'
    test: DockerContainerTest.oomKilled
sources:
  - '컨테이너와 이미지, 층, 쓰기 층: 도커 문서 https://docs.docker.com/get-started/docker-concepts/the-basics/what-is-a-container/ , https://docs.docker.com/get-started/docker-concepts/building-images/understanding-image-layers/'
  - '빌드 캐시와 명령 순서: https://docs.docker.com/build/cache/'
  - '멀티 스테이지 빌드: https://docs.docker.com/build/building/multi-stage/'
  - '메모리 한도와 OOM: https://docs.docker.com/engine/containers/resource_constraints/'
  - 'JVM의 컨테이너 인식과 `MaxRAMPercentage`: JDK-8146115 https://bugs.openjdk.org/browse/JDK-8146115 , java 명령 문서 https://docs.oracle.com/en/java/javase/21/docs/specs/man/java.html'
  - '`bootBuildImage`와 층으로 나눈 jar, 도커 컴포즈 지원: https://docs.spring.io/spring-boot/reference/packaging/container-images/index.html , https://docs.spring.io/spring-boot/reference/features/dev-services.html'
