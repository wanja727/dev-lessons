# 설정과 프로파일
# 자료 파일의 칸은 docs/lesson-data-format.md에 있다. 문제는 content/questions/config-profiles.yaml에 있다.
title: 설정과 프로파일
description: 스프링 부트가 설정 값을 읽는 곳, 같은 키가 여러 곳에 있을 때 이기는 순서, 환경마다 다른 설정을 나누는 프로파일, 설정을 코드에서 안전하게 받는 법. 네 가지 질문에 스스로 답할 수 있게 같은 키를 네 곳에 두고 무엇이 이기는지 돌려 보는 대화형 레슨.
unit: 스프링
minutes: 18
roadmap: S5
type: 동작 확인
prerequisites:
  - {slug: spring-boot-auto-config, title: 스프링 부트의 자동 설정}
assume: '자바 21, 스프링 부트 3.5. 자동 설정의 빈이 `spring.*` 설정 값을 읽어 동작을 바꾼다는 것(스프링 부트의 자동 설정 레슨). record와 불변 객체(불변 객체 레슨). 환경 변수가 운영체제가 프로세스에 넘기는 이름과 값이라는 것은 이 레슨에서 한 번 설명해요.'
example: '결제 대행사(PG) 연동 설정 `payment.pg.url`, `payment.pg.timeout`, `payment.pg.secret`. 로컬에서는 테스트 서버, 운영에서는 실제 서버를 쓰고, 비밀 키는 파일이 아니라 환경 변수로 넣는다.'
intro:
  - '로컬에서는 잘 되던 결제가 운영에 올리자 테스트 PG 서버로 나가요. `application.yml`에 운영 주소를 적은 줄이 있는데도요. 알고 보니 서버를 띄우는 스크립트의 실행 인자에 예전 주소가 남아 있었어요.'
  - '스프링 부트는 설정 값을 파일, 환경 변수, 실행 인자 등 여러 곳에서 모아요. 같은 이름이 여러 곳에 있으면 정해진 순서로 하나가 이겨요. 환경마다 다른 값은 프로파일로 나누고, 비밀번호 같은 값은 저장소에 넣지 않고 밖에서 넣어요. 이 순서를 모르면 "분명히 바꿨는데 안 바뀌는" 설정을 붙잡고 하루를 보내요.'
  - '이 레슨에서는 같은 키를 파일, 프로파일 파일, 환경 변수, 실행 인자에 다르게 적고 무엇이 이기는지 확인해요. 설정을 record로 받아 잘못된 값이면 앱이 뜨지 않는 것까지 봐요.'
covers:
  - topic: '설정 값을 읽는 곳: `application.yml`(또는 `.properties`), 프로파일 파일 `application-{프로파일}.yml`, 환경 변수, 자바 시스템 속성(`-D`), 실행 인자(`--`)'
    where: '질문 1'
  - topic: '스프링은 이 값들을 `Environment` 하나로 모아 `@Value`, `@ConfigurationProperties`, 자동 설정이 읽게 한다'
    where: '질문 1'
  - topic: '느슨한 바인딩: 환경 변수 `PAYMENT_PG_URL`이 `payment.pg.url`로 읽힌다. 점은 밑줄, 대문자로'
    where: '질문 1'
  - topic: '같은 키가 여러 곳에 있으면 이기는 순서: 실행 인자 > 시스템 속성 > 환경 변수 > 프로파일 파일 > `application.yml`. jar 밖의 파일이 jar 안의 파일을 이긴다'
    where: '질문 2'
  - topic: '여러 곳의 값은 합쳐진다. 이기는 쪽에 없는 키는 아래쪽 값이 남는다'
    where: '질문 2'
  - topic: '프로파일: `spring.profiles.active`로 켠다. 켜진 프로파일의 파일이 기본 파일을 덮어쓴다'
    where: '질문 3'
  - topic: '`@Profile("local")` 빈은 그 프로파일이 켜졌을 때만 만들어진다'
    where: '질문 3'
  - topic: '프로파일을 여럿 켜면 나중에 적은 것이 이긴다'
    where: '질문 3의 더 알아보기'
  - topic: '`@ConfigurationProperties`는 접두사 아래 값을 한 객체(record)로 받는다. 타입을 바꿀 수 없으면 앱이 뜨지 않는다. `@Validated`로 값 검증'
    where: '질문 4'
  - topic: '`@Value`는 값 하나씩 받는다. 키 이름이 틀리면 앱이 뜨지 않고, 기본값(`${a:b}`)을 주면 틀려도 조용히 넘어간다'
    where: '질문 4'
  - topic: '`Duration`, `DataSize` 같은 타입으로 받으면 `2s`, `10MB`처럼 적는다'
    where: '질문 4'
  - topic: '불변 설정 객체(record)로 받는 이유: 한 번 읽은 설정이 실행 중에 바뀌지 않는다'
    where: '질문 4. 불변은 불변 객체(J9)'
  - topic: '비밀 값(DB 비밀번호, API 키)은 저장소의 파일에 두지 않고 환경 변수나 비밀 저장소로 넣는다'
    where: '실무에서는'
  - topic: '실행 중에 설정을 바꾸는 것(설정 서버, 새로 고침)'
    where: '다루지 않음: 이 과정에서 다루지 않는다. 실무에서는에 이름만 적는다'
  - topic: '컨테이너와 쿠버네티스에서 설정을 넣는 법'
    where: '다루지 않음: 테스트와 운영 과정(T5)'
links:
  test: https://github.com/wanja727/dev-lessons/blob/main/verification/src/test/java/lab/devlessons/configprofiles/ConfigProfilesTest.java
  external: https://docs.spring.io/spring-boot/reference/features/external-config.html
  profiles: https://docs.spring.io/spring-boot/reference/features/profiles.html
  metadata: https://docs.spring.io/spring-boot/specification/configuration-metadata/annotation-processor.html
codes:
  predict: |-
    # application.yml
    payment.pg.url: https://pg.example.com

    # application-local.yml
    payment.pg.url: http://localhost:9000

    # 띄우는 명령
    PAYMENT_PG_URL=https://env.example.com ⤶
    java -jar shop.jar ⤶
      --spring.profiles.active=local ⤶
      --payment.pg.url=https://arg.example.com
  sources: |-
    # 1. jar 안의 기본 파일
    application.yml
    # 2. 프로파일 파일
    application-local.yml
    # 3. 환경 변수
    PAYMENT_PG_URL=https://env.example.com
    # 4. 시스템 속성
    java -Dpayment.pg.url=... -jar shop.jar
    # 5. 실행 인자
    java -jar shop.jar --payment.pg.url=...
  props: |-
    @ConfigurationProperties("payment.pg")
    [[@Validated]]
    public record PgProperties(
        [[@NotBlank]] String url,
        Duration timeout,
        String secret) {
    }
  enable: |-
    @SpringBootApplication
    [[@ConfigurationPropertiesScan]]
    public class ShopApplication { ... }
  use: |-
    @Service
    public class PgClient {
      private final PgProperties props;

      public PgClient(PgProperties props) {
        this.props = props;
      }
    }
  value: |-
    @Value("${payment.pg.[[timout]]:3s}")
    Duration timeout;
  yml: |-
    # application.yml (공통)
    payment:
      pg:
        url: https://pg.example.com
        timeout: 2s
        secret: [[${PG_SECRET}]]

    # application-local.yml
    payment:
      pg:
        url: http://localhost:9000
  profile: |-
    @Configuration
    class PgClientConfig {
      @Bean
      [[@Profile("local")]]
      PgClient fakePgClient() {
        return new FakePgClient();
      }

      @Bean
      [[@Profile("!local")]]
      PgClient realPgClient() {
        return new RealPgClient();
      }
    }
  multiDoc: |-
    payment.pg.url: https://pg.example.com
    ---
    spring.config.activate.on-profile: local
    payment.pg.url: http://localhost:9000
predict:
  title: 결제 요청은 어느 주소로 나갈까요?
  text: '코드 predict처럼 같은 키 `payment.pg.url`을 네 곳에 다르게 두고 앱을 띄워요. 앱이 읽는 값은 무엇일까요? 답은 질문 2에 나와요.'
  code: predict
  label: 내 예측
  options:
    - {value: a, label: 'pg.example.com (application.yml)'}
    - {value: b, label: 'localhost:9000 (local 프로파일)'}
    - {value: c, label: 'env.example.com (환경 변수)'}
    - {value: d, label: 'arg.example.com (실행 인자)'}
  answer: d
  storageKey: cp-predict
  wrong: 예측은 "{label}"이었어요. 틀린 예측이 더 오래 남으니 괜찮아요.
questions:
  - id: q1
    title: 스프링 부트는 설정 값을 어디서 읽나요?
    conclusion:
      lead: '`application.yml`과 프로파일 파일, 환경 변수, 시스템 속성, 실행 인자를 모두 읽어 `Environment` 하나로 모아요.'
      sub: '코드는 어디서 왔는지 모른 채 키 이름으로 값을 꺼내요. 그래서 코드를 고치지 않고 띄우는 방법만 바꿔 값을 바꿀 수 있어요.'
    says:
      - '설정 값이 들어오는 곳 다섯을 한 줄씩: jar 안의 `application.yml`, 프로파일 파일, 환경 변수, 시스템 속성(`java -Dpayment.pg.url=...`), 실행 인자(`--payment.pg.url=...`)'
      - '환경 변수는 운영체제가 프로세스를 띄울 때 넘기는 이름과 값이다. 서버, 도커, 쿠버네티스가 모두 이 방법으로 값을 넘긴다'
      - '스프링은 이 값들을 `Environment`에 출처별로 쌓아 둔다(`PropertySource`). 앱을 띄우고 출처 목록을 순서대로 출력해 실제 출력으로 보인다'
      - '느슨한 바인딩: 환경 변수 이름에는 점을 쓸 수 없어서 `PAYMENT_PG_URL`로 적는다. 스프링이 `payment.pg.url`로 맞춰 읽는다. 규칙은 점을 밑줄로, 하이픈은 지우고, 대문자로'
      - '코드에서 꺼내는 방법은 `@Value("${payment.pg.url}")`와 `@ConfigurationProperties`다. 질문 4에서 비교한다'
    asks:
      - '본문의 예시: 환경 변수로 `payment.pg.timeout`을 주려면 이름을 무엇으로 적나 (`PAYMENT_PG_TIMEOUT`)'
      - '옮긴 상황: 같은 jar를 개발 서버와 운영 서버에 올리고 DB 주소만 다르게 하고 싶다. jar를 다시 빌드하지 않고 바꾸는 방법을 하나 고르면 (서버마다 환경 변수 `SPRING_DATASOURCE_URL`이나 실행 인자 `--spring.datasource.url`로 넣는다)'
    body:
      - p: '[스프링 부트의 자동 설정](lesson:spring-boot-auto-config) 레슨에서 `spring.jackson.*` 값으로 자동 설정을 바꿨어요. 그 값은 `application.yml`에만 적을 수 있는 게 아니에요. 스프링 부트는 다섯 곳에서 설정 값을 읽어요.'
      - code: sources
      - p: '**환경 변수**는 운영체제가 프로그램을 띄울 때 함께 넘기는 이름과 값이에요. 서버의 실행 스크립트, 도커, 쿠버네티스가 모두 이 방법으로 앱에 값을 넘겨요. **시스템 속성**은 `java -D`로 JVM에 넘기는 값, **실행 인자**는 `java -jar` 뒤에 `--`로 붙이는 값이에요.'
      - h3: 모두 Environment 하나로 모여요
      - p: '스프링은 이 값들을 **`Environment`** 하나에 출처별로 쌓아 둬요. 출처 하나를 `PropertySource`라고 해요. 작은 앱을 띄우고 쌓인 순서대로 출처의 이름을 출력했어요. 테스트는 설정 파일 이름을 `s5shop`으로 바꿔 썼어요. 보통 앱에서는 `application.yml`, `application-local.yml` 자리예요.'
      - ci:
          key: sources
          label: 실제 출처 목록 보기
          source: ConfigProfilesTest.propertySourceOrder
      - p: '`@Value`, `@ConfigurationProperties`, 자동 설정은 모두 이 `Environment`에서 **키 이름으로** 값을 꺼내요. 값이 파일에서 왔는지 환경 변수에서 왔는지 몰라요. 그래서 코드를 고치지 않고 띄우는 방법만 바꿔 값을 바꿀 수 있어요. 같은 jar를 개발 서버와 운영 서버에 그대로 올리는 것이 이 덕분이에요.'
      - h3: 환경 변수 이름은 대문자와 밑줄로
      - p: '환경 변수 이름에는 점을 쓸 수 없어요. 그래서 `payment.pg.url`은 `PAYMENT_PG_URL`로 적어요. 점은 밑줄로, 하이픈은 지우고, 모두 대문자로. 스프링이 거꾸로 맞춰 읽어 줘요. 이것을 **느슨한 바인딩**이라고 해요([근거](link:external)).'
      - quiz:
          q: '`payment.pg.timeout`을 환경 변수로 넣으려면 이름을 어떻게 적을까요?'
          options:
            - '`payment.pg.timeout`'
            - '`PAYMENT_PG_TIMEOUT`'
            - '`PaymentPgTimeout`'
          answer: 2
          explain: '점은 밑줄로 바꾸고 대문자로 적어요. 스프링이 `payment.pg.timeout`으로 맞춰 읽어요.'
      - next: '다섯 곳에 같은 키가 있으면 어느 값이 쓰일까요?'
    recall: '스프링 부트는 jar 안의 application.yml, 프로파일 파일, 환경 변수, 시스템 속성(-D), 실행 인자(--)에서 설정 값을 읽어 Environment 하나에 출처(PropertySource)별로 쌓아요. @Value, @ConfigurationProperties, 자동 설정은 출처를 모른 채 키 이름으로 꺼내요. 환경 변수는 점을 밑줄로 바꾼 대문자(PAYMENT_PG_URL)로 적으면 맞춰 읽어요.'
  - id: q2
    title: 같은 키가 여러 곳에 있으면 무엇이 이기나요?
    conclusion:
      lead: '실행 인자, 시스템 속성, 환경 변수, 프로파일 파일, 기본 파일 순서로 앞의 것이 이겨요.'
      sub: '밖에서 넣는 값일수록 이겨요. 이기는 곳에 없는 키는 아래쪽 값이 그대로 쓰여서, 파일에 기본값을 두고 필요한 것만 밖에서 덮어써요.'
    says:
      - '코드 predict를 띄운다. 값은 `arg.example.com`이다. 예측의 답을 밝힌다. 실행 인자를 빼면 환경 변수, 그것도 빼면 local 파일, 그것도 빼면 기본 파일 값이 나오는 것을 차례로 보인다'
      - '순서를 표로: 1 실행 인자, 2 시스템 속성, 3 환경 변수, 4 jar 밖의 프로파일 파일, 5 jar 안의 프로파일 파일, 6 jar 밖의 `application.yml`, 7 jar 안의 `application.yml`. 스프링 부트 문서의 전체 목록은 더 길고 이 레슨은 자주 쓰는 것만 적는다고 밝힌다'
      - '이기는 규칙은 키 하나씩 적용된다. 실행 인자로 `url`만 주면 `timeout`은 파일 값이 그대로 남는다. 통째로 바뀌지 않는다'
      - '왜 이 순서인가. jar 안의 파일은 빌드할 때 굳는 기본값이고, 밖에서 넣는 값은 띄우는 곳마다 다를 수 있는 값이다. 가까운 쪽이 이긴다'
    widget:
      kind: toggle
      note: '값을 넣는 곳 네 개의 조합을 고르는 버튼을 둔다. 고른 조합마다 `payment.pg.url`의 최종 값과 그 값이 어디서 왔는지를 보인다'
    asks:
      - '본문의 예시: 코드 predict에서 실행 인자만 빼고 띄우면 값은 무엇인가 (`env.example.com`. 환경 변수가 프로파일 파일을 이긴다)'
      - '옮긴 상황: `application.yml`에 `server.port: 8080`, `logging.level.root: INFO`가 있고 `java -jar app.jar --server.port=9090`으로 띄웠다. 포트와 로그 레벨은 각각 무엇인가 (9090, INFO. 키마다 따로 이긴다)'
    body:
      - p: '예측의 명령으로 띄우고, 한 곳씩 빼 가며 다시 띄웠어요.'
      - ci:
          key: precedence
          label: 실제 결과 보기
          source: ConfigProfilesTest.precedence
          code: predict
      - p: '네 곳에 다 있으면 **실행 인자**가 이겨요. {{predict-result}} 하나씩 빼면 환경 변수, 프로파일 파일, 기본 파일 순으로 내려가요. 직접 골라 보세요.'
      - widget:
          kind: toggle
          layout: [selector, duo, verdict]
          selector:
            label: 값을 넣은 곳
            options:
              - {value: all, label: 네 곳 모두}
              - {value: noarg, label: 실행 인자 뺌}
              - {value: profile, label: 파일과 프로파일만}
              - {value: base, label: 기본 파일만}
          scenes:
            all:
              duo:
                - {label: 최종 값, rows: [{k: payment.pg.url, v: arg.example.com, mark: changed}]}
                - {label: 출처, text: 실행 인자 --payment.pg.url}
              verdict: '실행 인자가 가장 먼저예요. 도입부의 사고가 이것이었어요.'
            noarg:
              duo:
                - {label: 최종 값, rows: [{k: payment.pg.url, v: env.example.com, mark: changed}]}
                - {label: 출처, text: 환경 변수 PAYMENT_PG_URL}
              verdict: '환경 변수가 프로파일 파일과 기본 파일을 이겨요.'
            profile:
              duo:
                - {label: 최종 값, rows: [{k: payment.pg.url, v: 'localhost:9000', mark: changed}]}
                - {label: 출처, text: application-local.yml}
              verdict: '켜진 프로파일의 파일이 기본 파일을 덮어써요.'
            base:
              duo:
                - {label: 최종 값, rows: [{k: payment.pg.url, v: pg.example.com}]}
                - {label: 출처, text: application.yml}
              verdict: '아무도 덮어쓰지 않으면 jar 안의 기본 파일 값이에요.'
      - h3: 밖에서 넣을수록 이겨요
      - table:
          head: [순서, 출처]
          rows:
            - ['1', '실행 인자 `--payment.pg.url=...`']
            - ['2', '자바 시스템 속성 `-Dpayment.pg.url=...`']
            - ['3', '환경 변수 `PAYMENT_PG_URL`']
            - ['4', 'jar 밖의 `application-local.yml`']
            - ['5', 'jar 안의 `application-local.yml`']
            - ['6', 'jar 밖의 `application.yml`']
            - ['7', 'jar 안의 `application.yml`']
      - p: '질문 1의 출처 목록이 이 순서로 쌓여 있었죠. 스프링은 위에서부터 찾아 처음 나온 값을 써요. 스프링 부트 문서의 전체 목록은 더 길고, 여기는 자주 쓰는 것만 적었어요([근거](link:external)). jar 안의 파일은 빌드할 때 굳는 기본값이고, 밖에서 넣는 값은 띄우는 곳마다 달라질 수 있는 값이에요. 그래서 가까운 쪽이 이겨요.'
      - h3: 키 하나씩 이겨요
      - p: '실행 인자로 `url`만, 환경 변수로 `timeout`만 주고 띄웠어요.'
      - ci:
          key: per-key
          label: 실제 결과 보기
          source: ConfigProfilesTest.perKeyAndRelaxedEnv
      - p: '`url`은 실행 인자, `timeout`은 환경 변수, `secret`은 파일의 값이에요. 이기는 쪽이 설정을 **통째로** 바꾸는 게 아니라 **키마다** 따로 이겨요. 그래서 파일에 모든 기본값을 두고, 환경마다 다른 것만 밖에서 덮어써요. `PAYMENT_PG_TIMEOUT`이 `timeout`으로 읽힌 것도 질문 1의 느슨한 바인딩이에요.'
      - quiz:
          q: '`application.yml`에 `server.port: 8080`, `logging.level.root: INFO`가 있고 `java -jar app.jar --server.port=9090`으로 띄웠어요. 포트와 로그 레벨은?'
          options:
            - '9090, 로그 레벨은 기본값으로 돌아감'
            - '9090, INFO'
            - '8080, INFO'
          answer: 2
          explain: '키마다 따로 이겨요. 포트는 실행 인자가 이기고, 로그 레벨은 실행 인자에 없으니 파일 값이 남아요.'
      - next: '로컬과 운영의 값을 파일로 나눠 두고 싶어요. 프로파일 파일은 언제 읽힐까요?'
    recall: '같은 키는 실행 인자, 시스템 속성, 환경 변수, 프로파일 파일, 기본 application.yml 순서로 앞의 것이 이기고, jar 밖의 파일이 jar 안의 파일을 이겨요. 밖에서 넣는 값일수록 이겨요. 규칙은 키마다 따로 적용돼서, 이기는 곳에 없는 키는 아래쪽 값이 남아요.'
  - id: q3
    title: 환경마다 다른 설정은 어떻게 나누나요?
    conclusion:
      lead: '프로파일로 나눠요. `spring.profiles.active=local`로 켜면 `application-local.yml`이 기본 파일 위에 덮어써져요.'
      sub: '`@Profile("local")`이 붙은 빈은 그 프로파일이 켜졌을 때만 만들어져서, 환경마다 다른 구현을 넣을 수도 있어요.'
    says:
      - '`application.yml`에 모든 환경의 공통 값을, `application-local.yml`과 `application-prod.yml`에 다른 값만 둔다. 프로파일을 켜지 않으면 기본 파일만 읽는다'
      - '프로파일을 켜는 방법은 설정 값 `spring.profiles.active`이고, 이것도 질문 2의 순서를 따른다. 그래서 환경 변수 `SPRING_PROFILES_ACTIVE=prod`로 켤 수 있다'
      - '코드 profile처럼 `@Profile("local")` 빈에 가짜 PG 클라이언트를 둔다. local로 띄우면 가짜가, 아니면 진짜가 들어간다. 진짜 쪽에는 `@Profile("!local")`을 붙인다. 테스트로 보인다'
      - '프로파일 파일 안의 값이 기본 파일 값을 이기는 것은 키 하나씩이다. 질문 2와 같은 규칙이다'
      - '더 알아보기: `spring.profiles.active=local,debug`처럼 여럿을 켜면 둘 다 읽고 같은 키는 나중에 적은 쪽이 이긴다. 한 파일 안에서 `---`로 문서를 나누고 `spring.config.activate.on-profile`로 프로파일마다 값을 둘 수도 있다'
    asks:
      - '본문의 예시: `application-prod.yml`에만 `payment.pg.url`이 있고 프로파일을 켜지 않고 띄웠다. 앱은 prod 값을 읽나 (읽지 않는다. 프로파일 파일은 그 프로파일이 켜졌을 때만 읽는다)'
      - '옮긴 상황: 메일 발송 빈이 둘이다. `@Profile("prod")`가 붙은 `SmtpMailSender`와 `@Profile("!prod")`가 붙은 `LogMailSender`. 프로파일 없이 띄우면 어느 것이 빈이 되나 (`LogMailSender`)'
    body:
      - p: '로컬에서는 테스트 PG 서버, 운영에서는 실제 서버를 써요. 이런 "환경마다 다른 값"을 나누는 방법이 **프로파일**이에요.'
      - code: yml
        notes:
          - mark: '${PG_SECRET}'
            as: code
            text: '비밀 키는 파일에 적지 않고 환경 변수에서 가져와요. 실무 구역에서 다시 봐요.'
      - p: '`application.yml`에는 모든 환경의 공통 값을, `application-local.yml`에는 로컬에서 다른 값만 둬요. `spring.profiles.active=local`로 켜면 local 파일을 더 읽어 기본 파일 위에 덮어써요. 켜지 않으면 기본 파일만 읽어요. 질문 2의 결과 셋째, 넷째 줄이 그것이었어요.'
      - p: '프로파일을 켜는 `spring.profiles.active`도 설정 값이라 질문 2의 순서를 따라요. 운영 서버에서는 보통 환경 변수 `SPRING_PROFILES_ACTIVE=prod`로 켜요.'
      - h3: 빈도 프로파일로 고를 수 있어요
      - code: profile
        notes:
          - mark: '@Profile("local")'
            as: anno
            text: 'local 프로파일이 켜졌을 때만 이 빈을 만들어요.'
          - mark: '@Profile("!local")'
            as: anno
            text: 'local이 아닐 때만 만들어요. 둘 가운데 하나만 빈이 되니 같은 타입이 둘이 되지 않아요.'
      - ci:
          key: profile-bean
          label: 실제 결과 보기
          source: ConfigProfilesTest.profileBeans
      - p: '로컬에서는 실제 결제가 나가지 않는 가짜 클라이언트가, 그 밖에서는 진짜가 들어가요. 값만이 아니라 구현을 환경마다 바꿀 수 있어요.'
      - more:
          summary: '더 알아보기: 프로파일을 여럿 켜거나 한 파일에 나누려면'
          body:
            - p: '`spring.profiles.active=local,debug`처럼 쉼표로 여럿을 켜면 두 파일을 모두 읽고, 같은 키는 나중에 적은 쪽이 이겨요. 파일을 나누지 않고 한 파일 안에서 `---`로 문서를 나눌 수도 있어요.'
            - code: multiDoc
            - p: '`spring.config.activate.on-profile`이 붙은 문서는 그 프로파일이 켜졌을 때만 적용돼요([근거](link:profiles)).'
      - quiz:
          q: '`application-prod.yml`에만 `payment.pg.url`이 있고, 프로파일을 켜지 않고 띄웠어요. 앱은 prod 파일의 값을 읽을까요?'
          options:
            - 읽는다
            - 읽지 않는다
            - 앱이 뜨지 않는다
          answer: 2
          explain: '프로파일 파일은 그 프로파일이 켜졌을 때만 읽어요. 켜지 않으면 기본 파일만 읽어요.'
      - next: '값을 어디서 읽는지는 알았어요. 코드에서는 이 값을 어떻게 받아야 실수가 적을까요?'
    recall: '환경마다 다른 값은 프로파일로 나눠요. application.yml에 공통 값, application-local.yml 같은 프로파일 파일에 다른 값만 두고 spring.profiles.active로 켜면 그 파일이 기본 파일 위에 키마다 덮어써져요. 켜는 값도 설정 값이라 환경 변수 SPRING_PROFILES_ACTIVE로 켤 수 있어요. @Profile("local") 빈은 그 프로파일일 때만, @Profile("!local")은 아닐 때만 만들어져요.'
  - id: q4
    title: 설정 값을 코드에서 안전하게 받으려면 어떻게 하나요?
    conclusion:
      lead: '`@ConfigurationProperties`로 접두사 아래 값을 record 하나에 받아요. 타입이 안 맞거나 검증에 걸리면 앱이 뜰 때 바로 실패해요.'
      sub: '`@Value`는 값을 하나씩 받아요. 기본값을 붙이면 키 이름이 틀려도 조용히 기본값이 들어가서, 틀린 것을 늦게 알아채요.'
    says:
      - '코드 props처럼 `payment.pg` 아래 값을 record로 받는다. 코드 enable의 `@ConfigurationPropertiesScan`이 찾아 빈으로 만든다. `timeout: 2s`는 `Duration`으로 바뀐다'
      - 'record라 한 번 만든 뒤 바뀌지 않는다(J9). 실행 중에 누가 설정 객체를 고쳐 다른 코드가 놀라는 일이 없다'
      - '`timeout: 2초`처럼 바꿀 수 없는 값을 주면 앱이 뜨지 않고 어느 키가 왜 틀렸는지 알려 준다. `@Validated`와 `@NotBlank`를 붙이면 `url`이 비었을 때도 뜨지 않는다. 두 메시지를 실제 출력으로 보인다. 검증 어노테이션은 S8에서 자세히 본다'
      - '코드 value는 `timeout`을 `timout`으로 잘못 적었다. 기본값 `3s`가 있어서 앱은 뜨고 늘 3초다. 기본값이 없으면 "Could not resolve placeholder"로 뜨지 않는다. 둘을 테스트로 보인다'
      - '값 하나를 빠르게 받을 때는 `@Value`, 묶음으로 받을 때와 검증이 필요할 때는 `@ConfigurationProperties`라고 정리한다'
    asks:
      - '본문의 예시: 코드 props에서 `payment.pg.timeout: 2초`라고 적으면 앱은 어떻게 되나 (뜨지 않는다. `Duration`으로 바꿀 수 없다)'
      - '옮긴 상황: `@Value("${mail.retry-count:3}") int retry`로 받는데 설정 파일에는 `mail.retryCount: 5`라고 적었다. 앱이 쓰는 값은 무엇인가 (5. 느슨한 바인딩으로 같은 키로 본다)'
      - '실무 구역: 코드 value처럼 `@Value("${payment.pg.timout:3s}")`로 키 이름을 틀리게 적고 파일에는 `timeout: 2s`가 있다. 앱이 쓰는 값은 (3초. 틀린 키를 찾지 못해 기본값이 들어간다)'
    body:
      - p: '설정 묶음은 record 하나로 받아요.'
      - code: props
        notes:
          - mark: '@Validated'
            as: anno
            text: '값을 넣은 뒤 검증 어노테이션을 확인하라는 표시예요.'
          - mark: '@NotBlank'
            as: anno
            text: 'url이 비어 있으면 앱이 뜨지 않게 해요. 검증 어노테이션은 예외 처리와 검증 레슨에서 자세히 봐요.'
      - code: enable
        notes:
          - mark: '@ConfigurationPropertiesScan'
            as: anno
            text: '`@ConfigurationProperties`가 붙은 클래스를 찾아 빈으로 만들어요.'
      - code: use
      - p: '`payment.pg` 아래 값이 이름대로 record의 필드에 들어가요. `timeout: 2s`는 `Duration` 2초로 바뀌어요. 다른 빈은 이 record를 생성자로 받아 써요. record라서 한 번 만든 뒤 바뀌지 않아요. 실행 중에 누군가 설정 객체를 고쳐 다른 코드가 놀라는 일이 없어요([불변 객체](lesson:immutable-object)).'
      - h3: 틀린 값이면 앱이 뜨지 않아요
      - p: '바꿀 수 없는 값과 빈 값을 넣고 띄웠어요.'
      - ci:
          key: fail-fast
          label: 실제 결과 보기
          source: ConfigProfilesTest.configurationPropertiesFailFast
      - p: '`2초`는 `Duration`으로 바꿀 수 없어 뜨지 않고, 빈 `url`은 `@NotBlank`에 걸려 뜨지 않아요. 잘못된 설정으로 요청을 받다가 실패하는 것보다, 시작할 때 어느 키가 틀렸는지 알려 주는 편이 나아요.'
      - h3: '@Value는 키 이름 실수를 숨기기도 해요'
      - code: value
        notes:
          - mark: timout
            as: code
            text: '`timeout`을 잘못 적었어요.'
      - ci:
          key: value-typo
          label: 실제 결과 보기
          source: ConfigProfilesTest.valueTypo
      - p: '기본값 `3s`가 있으면 앱은 아무 말 없이 뜨고, 파일에 적은 2초 대신 늘 3초를 써요. 기본값이 없으면 시작할 때 "Could not resolve placeholder"로 실패해서 바로 알아요. 기본값은 편하지만 실수를 숨겨요.'
      - p: '`@Value`도 느슨한 바인딩을 해요. `@Value("${mail.retry-count:3}")`는 파일의 `mail.retryCount: 5`를 읽어 5가 됐어요. 스프링 부트 문서는 `@Value`에 키를 쓸 때 소문자와 하이픈 모양으로 적으라고 권해요([근거](link:external)).'
      - table:
          head: [받는 법, 언제]
          rows:
            - ['`@Value("${...}")`', '값 하나를 빠르게 받을 때']
            - ['`@ConfigurationProperties` record', '묶음으로 받을 때, 타입과 검증이 필요할 때']
      - quiz:
          q: '`@ConfigurationProperties("payment.pg")` record의 `Duration timeout`에 설정 값 `timeout: 2초`를 적었어요. 앱은?'
          options:
            - 뜨고 timeout은 null이다
            - 뜨고 timeout은 2초다
            - 뜨지 않는다
          answer: 3
          explain: '`2초`는 `Duration`으로 바꿀 수 없어요. 바인딩이 실패해 앱이 시작할 때 멈추고 어느 키가 틀렸는지 알려 줘요. `2s`로 적어요.'
    recall: '설정 묶음은 @ConfigurationProperties로 접두사 아래 값을 record 하나에 받아요. 2s 같은 값은 Duration으로 바뀌고, 바꿀 수 없는 값이나 @Validated와 @NotBlank 위반이면 앱이 뜰 때 실패해요. record라 실행 중에 바뀌지 않아요. @Value는 값을 하나씩 받는데, 기본값을 붙이면 키 이름이 틀려도 조용히 기본값이 들어가요.'
practice:
  title: 스프링 부트에서는 이렇게 나눠요
  says:
    - '프로젝트의 모양: 공통 값은 `application.yml`, 환경마다 다른 값은 `application-local.yml`과 `application-prod.yml`, 비밀 값은 코드 yml처럼 `${PG_SECRET}` 자리 표시자로 두고 서버의 환경 변수로 넣는다. `.env`나 비밀 파일은 저장소에 올리지 않는다'
    - '흔한 실수: 운영 DB 비밀번호를 `application-prod.yml`에 적어 저장소에 올린다. 저장소를 볼 수 있는 모든 사람과 빌드 산출물에 비밀번호가 남는다. 고친 코드: 자리 표시자와 환경 변수. 이 부분은 테스트가 아니라 스프링 부트 문서의 외부 설정 장을 근거로 단다'
    - '흔한 실수 둘: 질문 4의 코드 value처럼 기본값이 키 이름 실수를 숨긴다. 고친 코드: 설정 묶음은 `@ConfigurationProperties` record로 받는다'
    - '실행 중에 설정을 바꾸고 싶어지면 설정 서버(Spring Cloud Config) 같은 도구가 있다고 이름만 적는다. 이 과정에서 다루지 않는다'
    - '`@ConfigurationProperties` 클래스가 있으면 IDE가 설정 파일에서 키를 자동 완성해 준다(`spring-boot-configuration-processor`, 스프링 부트 문서 근거)'
  body:
    - h3: 파일은 셋, 비밀은 밖에
    - ul:
        - '`application.yml`: 모든 환경의 공통 값과 기본값'
        - '`application-local.yml`, `application-prod.yml`: 환경마다 다른 값만'
        - '비밀 값(DB 비밀번호, PG 비밀 키): 파일에는 `${PG_SECRET}` 자리만 두고 서버의 환경 변수로 넣어요'
    - p: '`${PG_SECRET}`은 "환경에서 `PG_SECRET`을 찾아 이 자리에 넣어라"는 자리 표시자예요. 환경 변수도 질문 1의 출처 가운데 하나라서 이렇게 가져올 수 있어요. `${PG_SECRET:none}`처럼 기본값을 붙일 수도 있지만, 비밀 값에 기본값을 두면 넣는 것을 잊어도 앱이 떠요.'
    - h3: '흔한 실수: 운영 비밀번호를 파일에 적어 저장소에 올림'
    - p: '`application-prod.yml`에 `spring.datasource.password: 실제비밀번호`를 적고 커밋해요. 저장소를 볼 수 있는 모든 사람, 빌드된 jar, CI 로그에 비밀번호가 남아요. 커밋을 지워도 git 기록에 남아요. 고치는 법은 위의 자리 표시자와 환경 변수예요. 이 부분은 테스트가 아니라 스프링 부트 문서의 외부 설정 장이 근거예요([근거](link:external)). `.env` 같은 비밀 파일은 `.gitignore`에 넣어요.'
    - h3: '흔한 실수 2: 기본값이 숨긴 오타'
    - p: '질문 4의 `@Value("${payment.pg.timout:3s}")`예요. 설정을 몇 번 바꿔도 반영되지 않아 한참을 헤매요. 설정 묶음은 `@ConfigurationProperties` record로 받으면 이름이 필드에 묶여 있어 이런 오타가 줄어요. `spring-boot-configuration-processor`를 넣으면 IDE가 설정 파일에서 키를 자동 완성해 줘서 파일 쪽 오타도 줄어요([근거](link:metadata)).'
    - muted: '실행 중에 설정을 바꾸고 싶어지면 Spring Cloud Config 같은 설정 서버를 써요. 이 과정에서는 다루지 않아요. 컨테이너와 쿠버네티스에서 환경 변수를 넣는 법은 테스트와 운영 과정에서 다뤄요.'
interview:
  question: 스프링 부트에서 설정 값은 어떻게 읽히고, 환경마다 다른 값은 어떻게 다루나요?
  model:
    - label: 정의
      text: 스프링 부트는 application.yml, 프로파일 파일, 환경 변수, 시스템 속성, 실행 인자에서 설정 값을 읽어 Environment 하나에 모읍니다. 코드는 @Value나 @ConfigurationProperties로 키 이름만으로 꺼냅니다.
    - label: 원리
      text: 같은 키는 실행 인자, 시스템 속성, 환경 변수, 프로파일 파일, 기본 파일 순으로 이기고 키마다 따로 적용됩니다. 환경마다 다른 값은 프로파일 파일에 두고 spring.profiles.active로 켜며, @Profile로 빈도 고릅니다.
    - label: 주의할 점
      text: 비밀 값은 저장소의 파일에 두지 않고 자리 표시자와 환경 변수로 넣습니다. 설정 묶음은 @ConfigurationProperties record로 받아 타입과 검증을 시작할 때 확인하고, @Value의 기본값은 키 이름 실수를 숨길 수 있습니다.
    - label: 경험
      text: '(내 프로젝트로 채우기) 예: 배포 스크립트의 실행 인자가 파일의 값을 덮어써 다른 서버로 요청이 나간 것을 출처 순서로 찾아 고쳤습니다.'
verified: 이 레슨의 우선순위와 에러는 짐작이 아니라 스프링 부트 3.5의 작은 앱을 설정을 바꿔 가며 띄워 받은 값이에요. 환경 변수는 테스트에서 운영체제 환경 변수 자리에 값을 넣어 흉내 냈어요. 코드가 바뀔 때마다 테스트([ConfigProfilesTest](link:test))가 다시 돌아요.
footer: '근거: 외부 설정과 우선순위, 느슨한 바인딩은 스프링 부트 문서([링크](link:external)), 프로파일은 [링크](link:profiles), 설정 자동 완성은 [링크](link:metadata). 결과는 OpenJDK 21에서 테스트로 확인했어요. 오류는 [GitHub 이슈](https://github.com/wanja727/dev-lessons/issues)로 알려 주세요.'
claims:
  - claim: '같은 키를 기본 파일, 프로파일 파일, 환경 변수, 실행 인자에 두면 실행 인자, 환경 변수, 프로파일 파일, 기본 파일 순으로 이긴다'
    how: '`SpringApplicationBuilder`로 작은 앱을 띄운다. 이 테스트만의 설정 파일 이름(`spring.config.name=s5shop`)을 쓴다. 환경 변수는 `StandardEnvironment`를 상속해 `systemEnvironment` 자리에 맵을 넣는 방법으로 흉내 낸다'
    test: ConfigProfilesTest.precedence
  - claim: '환경 변수 `PAYMENT_PG_TIMEOUT`은 `payment.pg.timeout`으로 읽히고, 이기는 곳에 없는 키는 아래쪽 값이 남는다'
    how: '실행 인자로 `url`만, 환경 변수로 `timeout`만 준다'
    test: ConfigProfilesTest.perKeyAndRelaxedEnv
  - claim: '`Environment`의 출처 목록에 실행 인자, 시스템 속성, 환경 변수, 프로파일 파일, 기본 파일이 이 순서로 있다'
    how: '`ConfigurableEnvironment.getPropertySources()`의 이름을 출력한다'
    test: ConfigProfilesTest.propertySourceOrder
  - claim: '프로파일을 켜지 않으면 `@Profile("!local")` 빈이, local이면 `@Profile("local")` 빈이 들어간다'
    how: '프로파일을 바꿔 두 번 띄운다'
    test: ConfigProfilesTest.profileBeans
  - claim: '`@ConfigurationProperties` record는 `2s`를 `Duration`으로 받고, 바꿀 수 없는 값이나 `@NotBlank` 위반이면 앱이 뜨지 않는다'
    how: '값을 바꿔 띄우고 원인 예외의 메시지를 본다. 검증에는 `spring-boot-starter-validation`을 testImplementation으로 넣었다'
    test: ConfigProfilesTest.configurationPropertiesFailFast
  - claim: '`@Value`의 키 이름이 틀리면 기본값이 있으면 기본값이, 없으면 "Could not resolve placeholder"로 실패한다'
    how: '두 빈을 각각 띄운다'
    test: ConfigProfilesTest.valueTypo
  - claim: '`@Value("${mail.retry-count:3}")`는 파일의 `mail.retryCount: 5`를 읽는다'
    how: '파일에 카멜 표기로 적고 읽는다'
    test: ConfigProfilesTest.valueRelaxedBinding
sources:
  - '외부 설정과 우선순위, 느슨한 바인딩: 스프링 부트 문서 https://docs.spring.io/spring-boot/reference/features/external-config.html'
  - '프로파일: https://docs.spring.io/spring-boot/reference/features/profiles.html'
  - '설정 메타데이터와 자동 완성: https://docs.spring.io/spring-boot/specification/configuration-metadata/annotation-processor.html'
