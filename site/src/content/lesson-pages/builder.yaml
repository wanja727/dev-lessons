    test: BuilderTest.httpRequestBuilder
sources:
  - '롬복 @Builder와 @Builder.Default: https://projectlombok.org/features/Builder'
  - '`HttpRequest.Builder.build()`: API 문서 https://docs.oracle.com/en/java/javase/21/docs/api/java.net.http/java/net/http/HttpRequest.Builder.html'
  - '빌더 패턴: GoF, Design Patterns(1994)의 Builder. 용어 설명 https://refactoring.guru/design-patterns/builder'
