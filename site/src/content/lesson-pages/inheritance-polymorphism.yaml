              verdict: '실제 객체는 문자열이지만 변수의 타입이 Object라서 send(Object)를 골라요. 오버로딩은 실제 객체를 보지 않아요.'
      - ci:
          key: combinations
          label: 네 조합을 실제로 돌린 결과 보기
          source: PolymorphismTest.fourCombinations
          code: combos
      - table:
          head: ['', 오버로딩, 오버라이딩]
          rows:
            - [무엇, 이름만 같은 다른 메서드, 같은 메서드를 자식이 다시 정의]
