# 상속과 다형성
# 자료 파일의 칸은 docs/lesson-data-format.md에 있다. 문제는 content/questions/inheritance-polymorphism.yaml에 있다.
title: 상속과 다형성
description: 부모 타입 변수에 자식 객체를 담으면 무엇을 할 수 있는지, 오버라이딩한 메서드는 어느 쪽이 실행되는지, 오버로딩과 무엇이 다른지, 인터페이스와 추상 클래스는 언제 쓰는지. 네 가지 질문에 스스로 답할 수 있게, 알림을 보내는 클래스로 배우는 대화형 레슨.
unit: 자바 언어
minutes: 22
roadmap: J7
type: 자바 실행
prerequisites:
  - {slug: value-and-reference, title: 값과 참조}
assume: '자바 21. `extends`와 `implements`를 써 본 것. 참조형 변수에는 객체를 가리키는 참조가 들어 있다는 것(값과 참조 레슨).'
example: '알림을 보내는 `Notifier`와 그것을 상속한 `SmsNotifier`. `Notifier` 타입의 변수에 `SmsNotifier` 객체를 담고 `send`를 불러 어느 메서드가 실행되는지 봐요. 실무 구역에서는 `Notifier`를 인터페이스로 두고 스프링이 구현들을 주입하게 해요.'
intro:
  - '자식 클래스에 메서드를 새로 썼는데 아무리 불러도 부모의 메서드가 실행돼요. 오버라이딩했다고 생각했지만 매개변수 타입이 달라서, 자바는 그것을 이름만 같은 다른 메서드로 보고 있었어요.'
  - '스프링은 다형성 위에 서 있어요. 서비스는 `PaymentClient`라는 인터페이스만 알고, 실제로 어느 구현이 불릴지는 실행할 때 정해져요. 리포지토리는 인터페이스만 쓰면 구현이 주입되고, `@Transactional`은 내 클래스를 상속한 프록시가 메서드를 오버라이딩해서 동작해요.'
  - '이 레슨에서는 변수의 타입과 실제 객체의 타입이 다를 때 어느 메서드가 실행되는지를 코드를 돌려 확인하고, 오버라이딩과 오버로딩이 정해지는 시점이 다르다는 것을 봐요.'
covers:
  - topic: '상속하면 자식은 부모의 필드와 메서드를 물려받는다. 자바의 클래스 상속은 하나만 된다. 모든 클래스의 뿌리는 Object다'
    where: '질문 1'
  - topic: '부모 타입 변수에 자식 객체를 담을 수 있다. 변수의 타입이 부를 수 있는 메서드를 정한다'
    where: '질문 1'
  - topic: '내려받기(다운캐스팅), instanceof, ClassCastException, instanceof 패턴'
    where: '질문 1'
  - topic: '오버라이딩: 실행되는 메서드는 실제 객체의 타입이 정한다(실행 시점)'
    where: '질문 2'
  - topic: '오버라이딩의 조건(같은 시그니처)과 @Override, super로 부모 것 부르기'
    where: '질문 2'
  - topic: '오버라이딩되지 않는 것: 필드, static 메서드, private 메서드, final 메서드'
    where: '질문 2'
  - topic: '오버라이딩의 나머지 규칙(접근 범위를 좁힐 수 없다, 더 넓은 체크 예외를 던질 수 없다, 반환 타입은 더 좁혀도 된다)'
    where: '질문 2의 더 알아보기'
  - topic: '생성자에서 오버라이딩된 메서드를 부르면 자식의 필드가 아직 기본값이다'
    where: '질문 2의 더 알아보기'
  - topic: '오버로딩: 이름이 같고 매개변수가 다른 메서드. 어느 것을 부를지는 인자의 변수 타입으로 컴파일할 때 정해진다'
    where: '질문 3'
  - topic: '오버라이딩하려다 오버로딩이 되는 실수와 @Override가 그것을 잡아 주는 것'
    where: '질문 3, 실무에서는'
  - topic: '인터페이스와 추상 클래스의 차이(상태와 생성자, 여러 개 구현, default 메서드)와 고르는 기준'
    where: '질문 4'
  - topic: '두 인터페이스의 default 메서드가 겹칠 때'
    where: '질문 4의 더 알아보기'
  - topic: '접근 제어자 네 가지(public, protected, 기본, private)'
    where: '질문 1의 더 알아보기. 캡슐화의 의미는 객체지향의 네 가지 특징(O1)'
  - topic: '스프링에서: 인터페이스에 기대고 구현을 주입받기, 구현이 여럿일 때 List로 받기'
    where: '실무에서는. 주입의 규칙(@Primary, @Qualifier)은 스프링 빈과 의존성 주입(S2)'
  - topic: '스프링의 프록시는 내 클래스를 상속해 메서드를 오버라이딩한다. final과 private 메서드에는 적용되지 않는다'
    where: '실무에서는. 프록시의 동작은 AOP(S9)와 @Transactional 동작 원리(S10)'
  - topic: '부모와 자식 클래스의 초기화 순서'
    where: '다루지 않음: static과 초기화 순서(J5)'
  - topic: '메서드가 하나뿐인 인터페이스와 람다'
    where: '다루지 않음: 람다와 함수형 인터페이스(J12)'
  - topic: '캡슐화, 추상화를 포함한 객체지향의 네 가지 특징'
    where: '다루지 않음: 객체지향의 네 가지 특징(O1)'
  - topic: '자식이 부모를 대신할 수 없게 되는 상속(리스코프 치환 원칙)'
    where: '다루지 않음: 리스코프 치환과 인터페이스 분리 원칙(O4)'
  - topic: '상속으로 재사용할 때의 문제와 조합'
    where: '다루지 않음: 상속보다 조합(O6)'
  - topic: '상속할 수 있는 클래스를 정해 두는 sealed'
    where: '다루지 않음: 자바 17과 21에서 달라진 것(J18)'
codes:
  predict: |-
    class Notifier {
      void send(Object msg) {
        print("Notifier, Object");
      }
    }

    class SmsNotifier extends Notifier {
      @Override
      void send(Object msg) {
        print("Sms, Object");
      }
      void send(String msg) {
        print("Sms, String");
      }
    }

    Notifier n = new SmsNotifier();
    n.send("주문 완료");
  upcast: |-
    Notifier n = new SmsNotifier();
    n.send("주문 완료");
    [[n.remaining()]];  // 컴파일 오류

    if (n instanceof [[SmsNotifier s]]) {
      s.remaining();
    }
  downcastRun: |-
    Notifier n = new EmailNotifier();
    SmsNotifier s = [[(SmsNotifier) n]];
  fields: |-
    class Notifier {
      String name = "기본";
    }
    class SmsNotifier extends Notifier {
      String name = "문자";
    }

    Notifier n = new SmsNotifier();
    System.out.println([[n.name]]);
  combos: |-
    Notifier n = new SmsNotifier();
    SmsNotifier s = new SmsNotifier();
    String str = "주문 완료";
    Object obj = "주문 완료";

    n.send(str);  n.send(obj);
    s.send(str);  s.send(obj);
  interfaceVsAbstract: |-
    interface Notifier {
      void send(Member to, String msg);
    }

    abstract class AbstractNotifier
        implements Notifier {
      private int sent;

      public final void send(Member to,
          String msg) {
        if (to.refusedAlarm()) return;
        deliver(to, msg);
        sent++;
      }
      protected abstract void deliver(
          Member to, String msg);
    }
  springList: |-
    interface Notifier {
      String send(String msg);
    }

    @Component
    class SmsNotifier
        implements Notifier { ... }
    @Component
    class EmailNotifier
        implements Notifier { ... }

    @Service
    class OrderService {
      private final [[List<Notifier>]] notifiers;

      OrderService(List<Notifier> notifiers) {
        this.notifiers = notifiers;
      }

      void complete(Order order) {
        notifiers.forEach(n -> n.send("주문 완료"));
      }
    }
  handlerBad: |-
    class Handler {
      String handle(Event e) {
        return "기본";
      }
    }

    class OrderHandler extends Handler {
      String handle([[OrderEvent]] e) {
        return "주문";
      }
    }

    Handler h = new OrderHandler();
    h.handle(new OrderEvent());
  handlerFixed: |-
    class OrderHandler extends Handler {
      [[@Override]]
      String handle([[Event]] e) {
        if (e instanceof OrderEvent oe) {
          return "주문";
        }
        return super.handle(e);
      }
    }
  overrideCheck: |-
    class OrderHandler extends Handler {
      @Override
      String handle(OrderEvent e) { ... }
    }
  proxy: |-
    @Service
    class OrderService {
      @Transactional
      public [[final]] void pay(long id) { ... }
    }
