predict:
  title: 어느 send가 실행될까요?
  text: '인자는 `String`이고, 변수 `n`의 타입은 `Notifier`, 실제 객체는 `SmsNotifier`예요. 마지막 줄은 무엇을 출력할까요? 모르는 게 정상이니 감으로 골라 보세요. 답은 질문 3에 나와요.'
  code: predict
  label: 내 예측
  options:
    - value: parent
      label: Notifier, Object
    - value: smsObject
      label: Sms, Object
    - value: smsString
      label: Sms, String
    - value: compile
      label: 컴파일 오류
  answer: smsObject
  storageKey: poly-predict
  wrong: 예측은 "{label}"이었어요. 틀린 예측이 더 오래 남으니 괜찮아요.
questions:
  - id: q1
    title: 부모 타입의 변수에 자식 객체를 담으면 무엇을 할 수 있나요?
    conclusion:
      lead: '그 변수로는 부모 타입에 선언된 메서드만 부를 수 있어요. 객체는 자식 그대로이지만 변수의 타입이 보이는 범위를 정해요.'
      sub: '자식은 부모가 가진 것을 모두 가지므로 부모 타입 자리에 언제나 들어갈 수 있고, 반대로 내려받으려면 실제 타입을 확인해야 해요.'
    says:
      - '`class SmsNotifier extends Notifier`는 `Notifier`의 필드와 메서드를 물려받고 자기 것을 더한다. 클래스는 하나만 상속할 수 있고, 아무것도 상속하지 않은 클래스는 `Object`를 상속한다'
      - '`Notifier n = new SmsNotifier();`는 컴파일된다. `SmsNotifier`는 `Notifier`가 할 수 있는 것을 다 할 수 있다. 객체는 바뀌지 않는다. J2에서 본 대로 변수에는 참조가 들어 있을 뿐이다'
      - '`n`으로 부를 수 있는 것은 `Notifier`에 선언된 메서드뿐이다. `SmsNotifier`에만 있는 메서드를 `n`으로 부르면 컴파일 오류다. 컴파일러는 변수의 타입만 본다'
      - '내려받기: `SmsNotifier s = (SmsNotifier) n;`. 실제 객체가 `SmsNotifier`가 아니면 실행할 때 `ClassCastException`이다. `if (n instanceof SmsNotifier s)`로 확인과 변환을 한 번에 한다'
      - '`instanceof`로 타입마다 갈라서 처리하는 코드가 늘어나면 질문 2의 오버라이딩으로 바꿀 수 있는지 본다'
      - '더 알아보기: 접근 제어자. `private`은 그 클래스 안, 아무것도 안 쓰면 같은 패키지, `protected`는 같은 패키지와 자식 클래스, `public`은 어디서나'
    asks:
      - '본문의 예시: `SmsNotifier`에만 `int remaining()` 메서드가 있다. `Notifier n = new SmsNotifier(); n.remaining();`은 어떻게 되나 (컴파일 오류. 변수의 타입 `Notifier`에 그 메서드가 없다)'
      - '옮긴 상황: `Notifier n = new EmailNotifier(); SmsNotifier s = (SmsNotifier) n;`은 어떻게 되나. 조건: `EmailNotifier`와 `SmsNotifier`는 둘 다 `Notifier`를 상속하고 서로는 상관없다 (컴파일은 되고 실행할 때 `ClassCastException`)'
    body:
      - p: '`class SmsNotifier extends Notifier`는 `Notifier`의 필드와 메서드를 물려받고 자기 것을 더해요. 자바에서 클래스는 **하나만** 상속할 수 있고, 아무것도 상속하지 않은 클래스는 모든 클래스의 뿌리인 `Object`를 상속해요.'
      - p: '자식은 부모가 할 수 있는 것을 다 할 수 있어요. 그래서 **부모 타입 변수에 자식 객체를 담을 수 있어요.** 객체가 바뀌는 것은 아니에요. 값과 참조 레슨에서 본 대로 변수에는 참조가 들어 있을 뿐이에요.'
      - code: upcast
        notes:
          - mark: n.remaining()
            as: code
            text: '`remaining()`은 `SmsNotifier`에만 있어요. 컴파일러는 변수 `n`의 타입 `Notifier`만 보고 "그런 메서드는 없다"고 해요. 실제 객체가 `SmsNotifier`여도 그래요.'
          - mark: SmsNotifier s
            as: code
            text: '`n`이 실제로 `SmsNotifier`인지 확인하고, 맞으면 그 타입의 변수 `s`에 담아 줘요. 자바 16부터 이렇게 써요.'
      - p: '정리하면 이래요. **변수의 타입이 부를 수 있는 메서드를 정해요.** 객체가 실제로 무엇인지는 실행해 봐야 알지만, 컴파일러는 실행 전에 검사하니까요.'
      - h3: 내려받을 때는 확인부터
      - p: '부모 타입 변수를 자식 타입으로 바꾸는 것을 **내려받기**(다운캐스팅)라고 해요. `(SmsNotifier) n`처럼 써요. 컴파일러는 "그럴 수도 있겠다"며 통과시키지만, 실제 객체가 그 타입이 아니면 실행할 때 예외가 나요.'
      - ci:
          key: downcast
          label: 실제 예외 보기
          source: PolymorphismTest.downcast
          code: downcastRun
      - p: '그래서 내려받기 전에 `instanceof`로 확인해요. 위의 `if (n instanceof SmsNotifier s)`가 확인과 변환을 한 번에 해요. 다만 `instanceof`로 타입마다 갈라 처리하는 코드가 많아지면, 다음 질문의 오버라이딩으로 바꿀 수 있는지 먼저 봐요.'
      - more:
          summary: '더 알아보기: 접근 제어자 네 가지'
          body:
            - table:
                head: [제어자, 닿을 수 있는 곳]
                rows:
                  - ['`private`', 그 클래스 안]
                  - ['(아무것도 안 씀)', 같은 패키지]
                  - ['`protected`', 같은 패키지와 자식 클래스]
                  - ['`public`', 어디서나]
            - muted: '이것으로 무엇을 지키는지(캡슐화)는 객체지향의 네 가지 특징 레슨에서 다뤄요.'
      - quiz:
          q: '`SmsNotifier`에만 `int remaining()`이 있어요. `Notifier n = new SmsNotifier(); n.remaining();`은?'
          options:
            - 10을 돌려준다. 실제 객체가 SmsNotifier다
            - 컴파일 오류. 변수의 타입 Notifier에 그 메서드가 없다
            - 실행할 때 ClassCastException
          answer: 2
          explain: '컴파일러는 변수의 타입만 봐요. `Notifier`에 없는 메서드는 부를 수 없어요.'
      - next: '변수의 타입이 부를 수 있는 메서드를 정한다면, 부모와 자식에 같은 메서드가 있을 때 실행되는 것도 변수의 타입이 정할까요?'
    recall: '부모 타입 변수로는 부모에 선언된 메서드만 부를 수 있어요. 객체는 자식 그대로이고, 컴파일러가 변수의 타입만 보기 때문이에요. 자식은 부모 자리에 언제나 들어가요. 반대로 자식 타입으로 내려받을 때는 실제 객체가 그 타입이 아니면 `ClassCastException`이 나니 `instanceof`로 확인해요.'
  - id: q2
    title: 오버라이딩한 메서드는 어느 쪽 것이 실행되나요?
    conclusion:
      lead: '변수의 타입이 아니라 실제 객체의 타입에 있는 메서드가 실행돼요.'
      sub: 'JVM이 실행하는 순간에 객체의 실제 클래스를 보고 고르기 때문이고, 이것이 다형성이에요.'
    says:
      - '오버라이딩은 부모의 메서드와 이름과 매개변수 타입이 같은 메서드를 자식이 다시 정의하는 것이다'
      - '`Notifier n = new SmsNotifier(); n.send(msg)`에서 실행되는 것은 `SmsNotifier`의 `send(Object)`다. 변수 타입이 `Notifier`여도 그렇다. 같은 줄 `n.send(msg)`가 `n`에 무엇이 들었느냐에 따라 다른 코드를 실행한다'
      - '이 덕분에 호출하는 쪽은 `Notifier`만 알면 된다. 새 알림 방식을 더해도 호출하는 코드를 고치지 않는다. 이 이점을 설계 원칙으로 쓰는 것은 O3에서 다룬다'
      - '`@Override`는 "이 메서드는 부모 것을 다시 정의한 것"이라고 컴파일러에게 알린다. 부모에 그런 메서드가 없으면 컴파일 오류가 난다. 동작을 바꾸지는 않고 실수를 잡는다'
      - '`super.send(msg)`로 부모의 구현을 부를 수 있다'
      - '오버라이딩되지 않는 것. 코드 fields에서 `n.name`은 "기본"이다. 필드는 변수의 타입으로 정해진다. static 메서드도 변수의 타입(클래스)으로 정해진다. `private` 메서드는 자식에게 보이지 않아 오버라이딩할 수 없고, `final` 메서드는 오버라이딩을 금지한다'
      - '더 알아보기: 오버라이딩할 때 접근 범위를 좁힐 수 없고, 부모가 선언하지 않은 체크 예외를 던질 수 없고, 반환 타입은 자식 타입으로 좁혀도 된다'
      - '더 알아보기: 부모의 생성자가 오버라이딩된 메서드를 부르면 자식의 구현이 실행되는데, 이때 자식의 필드는 아직 초기화 전이라 기본값이다(초기화 순서는 J5). 생성자에서는 오버라이딩될 수 있는 메서드를 부르지 않는다'
    asks:
      - '본문의 예시: 코드 fields에서 `n.name`의 출력은 무엇인가 ("기본". 필드는 오버라이딩되지 않고 변수의 타입 `Notifier`의 것이 쓰인다)'
      - '옮긴 상황: `class Animal { String sound() { return "..."; } }`, `class Dog extends Animal { String sound() { return "멍"; } }`, `class Puppy extends Dog { }`가 있다. `Animal a = new Puppy(); a.sound()`의 결과는 무엇인가 ("멍". `Puppy`가 다시 정의하지 않았으므로 가장 가까운 부모 `Dog`의 것이 실행된다)'
    body:
      - p: '자식이 부모의 메서드를 **같은 이름, 같은 매개변수 타입**으로 다시 정의하는 것을 **오버라이딩**이라고 해요. `SmsNotifier`의 `send(Object)`가 그래요.'
      - p: '`Notifier n = new SmsNotifier();`로 `n.send(...)`를 부르면 실행되는 것은 **`SmsNotifier`의 `send`**예요. 변수의 타입이 `Notifier`여도요. JVM은 실행하는 순간 `n`이 가리키는 객체의 실제 클래스를 보고 그 클래스의 메서드를 골라요.'
      - p: '같은 줄 `n.send(msg)`가 `n`에 무엇이 들었느냐에 따라 다른 코드를 실행해요. 이것이 **다형성**이에요. 호출하는 쪽은 `Notifier`만 알면 되고, 새 알림 방식을 더해도 호출하는 코드를 고치지 않아요. 이 이점을 설계에 쓰는 법은 단일 책임과 개방 폐쇄 원칙 레슨에서 다뤄요.'
      - ul:
          - '**`@Override`는 실수를 잡아 줘요.** "이 메서드는 부모 것을 다시 정의한 것"이라고 컴파일러에게 알려요. 부모에 그런 메서드가 없으면 컴파일 오류가 나요. 동작은 바꾸지 않아요.'
          - '**`super.send(msg)`로 부모의 구현을 부를 수 있어요.** 부모가 하던 일에 무언가를 더할 때 써요.'
          - '**다시 정의하지 않은 자식은 가장 가까운 부모의 것을 써요.** `Animal`, `Dog`(sound를 "멍"으로 다시 정의), `Puppy`(정의하지 않음)이면 `Puppy` 객체의 `sound()`는 "멍"이에요.'
      - h3: 오버라이딩되지 않는 것
      - p: '부모와 자식에 같은 이름의 **필드**가 있으면 어떻게 될까요?'
      - code: fields
        notes:
          - mark: n.name
            as: code
            text: '필드는 오버라이딩되지 않아요. 변수의 타입 `Notifier`의 `name`이 쓰여요.'
      - ci:
          key: fields
          label: 실제 출력 보기
          source: PolymorphismTest.fieldsAreNotOverridden
      - p: '"기본"이에요. 실제 객체를 보고 고르는 것은 **인스턴스 메서드뿐**이에요. 나머지는 변수의 타입으로 정해지거나 오버라이딩 자체가 안 돼요.'
      - table:
          head: [이것은, 어떻게 정해지나]
          rows:
            - [필드, 변수의 타입]
            - [static 메서드, 변수의 타입(클래스). static과 초기화 순서 레슨에서 본 대로 클래스에 딸린 것이에요]
            - ['`private` 메서드', 자식에게 보이지 않아 오버라이딩할 수 없어요]
            - ['`final` 메서드', 오버라이딩을 금지해요. 실무 구역에서 다시 봐요]
      - more:
          summary: '더 알아보기: 오버라이딩의 나머지 규칙, 생성자에서 부를 때'
          body:
            - ul:
                - '오버라이딩할 때 접근 범위를 좁힐 수 없어요(`public`을 `private`으로 못 바꿔요). 부모가 선언하지 않은 체크 예외를 던질 수 없고, 반환 타입은 자식 타입으로 좁혀도 돼요.'
                - '부모의 생성자가 자식이 오버라이딩한 메서드를 부르면 자식의 구현이 실행되는데, 이때 자식의 필드는 아직 기본값이에요. static과 초기화 순서 레슨에서 본 대로 부모 쪽이 먼저 초기화되니까요. 테스트에서 자식의 필드가 null로 보였어요. 그래서 생성자에서는 오버라이딩될 수 있는 메서드를 부르지 않아요.'
      - quiz:
          q: '`Animal`의 `sound()`는 "...", `Dog extends Animal`은 "멍"으로 다시 정의했고, `Puppy extends Dog`은 정의하지 않았어요. `Animal a = new Puppy(); a.sound()`는?'
          options:
            - '"..."'
            - '"멍"'
            - 컴파일 오류
          answer: 2
          explain: '실제 객체는 `Puppy`예요. `Puppy`에 없으니 가장 가까운 부모 `Dog`의 `sound()`가 실행돼요.'
      - next: '처음 예측한 코드에는 `send(Object)`와 `send(String)`이 함께 있었어요. 이름이 같은 메서드가 둘이면 어느 것이 불릴까요?'
    recall: '변수의 타입이 아니라 실제 객체의 타입에 있는 메서드가 실행돼요. JVM이 실행하는 순간 객체의 클래스를 보고 고르고, 이것이 다형성이에요. `@Override`는 정말 오버라이딩인지 컴파일러가 검사하게 해요. 필드와 static 메서드는 변수의 타입으로 정해지고, `private`과 `final` 메서드는 오버라이딩되지 않아요.'
  - id: q3
    title: 오버로딩은 오버라이딩과 무엇이 다른가요?
    conclusion:
      lead: '오버로딩은 이름만 같은 서로 다른 메서드이고, 그 가운데 어느 것을 부를지는 컴파일할 때 인자의 변수 타입으로 정해져요.'
      sub: '오버라이딩은 실행할 때 객체의 실제 타입으로 정해지므로, 둘은 정해지는 시점과 기준이 달라요.'
    says:
      - '오버로딩은 한 클래스에 이름이 같고 매개변수의 타입이나 개수가 다른 메서드를 여럿 두는 것이다. `send(Object)`와 `send(String)`은 서로 다른 메서드다'
      - '컴파일러가 호출 한 줄을 보고 어느 메서드를 부를지 정한다. 이때 보는 것은 변수에 든 실제 객체가 아니라 변수와 식의 타입이다'
      - '코드 predict를 두 단계로 푼다. 컴파일: `n`의 타입은 `Notifier`이고 거기에는 `send(Object)`뿐이다. 인자가 `String`이어도 `send(Object)`를 부르기로 정한다. 실행: 객체는 `SmsNotifier`이고 `send(Object)`를 오버라이딩했으므로 "Sms, Object"가 나온다. 예측의 답을 밝힌다'
      - '변수를 `SmsNotifier s = new SmsNotifier();`로 바꿔 `s.send("주문 완료")`를 부르면 컴파일러가 `send(String)`을 고른다. "Sms, String"이다'
      - '`Object o = "주문 완료"; s.send(o);`는 "Sms, Object"다. 실제 객체가 `String`이어도 변수 `o`의 타입이 `Object`이기 때문이다. 오버로딩은 실제 객체를 보지 않는다'
      - '실수가 생기는 곳: 오버라이딩하려고 쓴 메서드의 매개변수 타입이 부모와 다르면 오버로딩이 된다. 오류 없이 컴파일되고 부모의 메서드가 그대로 실행된다. `@Override`를 붙였다면 컴파일러가 잡는다'
    widget:
      kind: toggle
      note: '두 가지를 고른다. 받는 변수의 타입(`Notifier n` 또는 `SmsNotifier s`)과 인자의 변수 타입(`String` 또는 `Object` 변수에 담긴 문자열). 네 조합마다 두 칸으로 "컴파일러가 고른 메서드(시그니처)"와 "실행된 구현"을 보여 주고 출력 한 줄을 정리한다. 실행 버튼을 눌러야 보인다'
    asks:
      - '본문의 예시: 코드 predict의 클래스들로 `SmsNotifier s = new SmsNotifier(); Object o = "주문 완료"; s.send(o);`를 실행하면 무엇이 출력되나 ("Sms, Object")'
      - '옮긴 상황: `class Handler { void handle(Event e) { print("기본"); } }`, `class OrderHandler extends Handler { void handle(OrderEvent e) { print("주문"); } }`가 있고 `OrderEvent`는 `Event`를 상속한다. `Handler h = new OrderHandler(); Event e = new OrderEvent(); h.handle(e);`의 출력은 무엇인가 ("기본". `handle(OrderEvent)`는 오버라이딩이 아니라 오버로딩이고, 컴파일러는 `Handler`의 `handle(Event)`를 골랐다)'
      - '실무 구역: 위 `OrderHandler`의 `handle(OrderEvent e)` 위에 `@Override`를 붙이고 컴파일하면 어떻게 되나 (컴파일 오류. 부모에 같은 시그니처의 메서드가 없다)'
    body:
      - p: '한 클래스에 **이름은 같고 매개변수의 타입이나 개수가 다른** 메서드를 여럿 두는 것을 **오버로딩**이라고 해요. `send(Object)`와 `send(String)`은 이름만 같은 서로 다른 메서드예요.'
      - p: '어느 것을 부를지는 **컴파일러가 컴파일할 때** 정해요. 그때 보는 것은 실제 객체가 아니라 **변수와 식의 타입**이에요. 실행 전이라 객체를 볼 수 없으니까요.'
      - h3: 처음 예측한 코드를 두 단계로 풀어요
      - ol:
          - '**컴파일:** `n`의 타입은 `Notifier`예요. `Notifier`에는 `send(Object)` 하나뿐이에요. 인자가 `String`이어도 `Object` 자리에 들어가니, 컴파일러는 **`send(Object)`를 부르기로** 정해요. `send(String)`은 `Notifier`에 없어서 후보도 아니에요.'
          - '**실행:** JVM은 "`send(Object)`를 불러라"를 받고, `n`의 실제 객체 `SmsNotifier`가 `send(Object)`를 오버라이딩했는지 봐요. 했으니까 **"Sms, Object"**예요.'
      - p: '답은 **"Sms, Object"**예요. {{predict-result}}'
      - ci:
          key: predict
          label: 실제 출력 보기
          source: PolymorphismTest.predict
          code: predict
      - p: '받는 변수의 타입과 인자의 변수 타입을 바꿔 가며 실행해 보세요. 어떤 조합에서 "Sms, String"이 나올지 먼저 예상해 보세요.'
