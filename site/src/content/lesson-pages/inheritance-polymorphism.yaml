            - '"Sms, Object"'
            - '"Notifier, Object"'
          answer: 2
          explain: '오버로딩은 변수 `o`의 타입 `Object`를 보고 `send(Object)`를 골라요. 실제 객체가 문자열이어도 상관없어요.'
      - next: '알림 방식을 여럿 두는 데 상속을 썼어요. 부모를 클래스가 아니라 인터페이스로 둘 수도 있어요. 둘은 무엇이 다를까요?'
    recall: '오버로딩은 이름만 같고 매개변수가 다른 별개의 메서드이고, 어느 것을 부를지는 컴파일러가 변수와 인자의 타입을 보고 컴파일할 때 정해요. 오버라이딩은 실행할 때 실제 객체의 타입으로 정해요. 그래서 `n.send("주문 완료")`는 컴파일할 때 `send(Object)`로 정해지고, 실행할 때 `SmsNotifier`의 구현이 돌아요. 매개변수 타입을 다르게 쓰면 오버라이딩이 아니라 오버로딩이 돼요.'
  - id: q4
    title: 인터페이스와 추상 클래스는 무엇이 다르고 언제 무엇을 쓰나요?
    conclusion:
      lead: '인터페이스는 "무엇을 할 수 있는가"만 정하고 여러 개를 구현할 수 있어요. 추상 클래스는 필드와 구현의 일부를 물려주고 하나만 상속할 수 있어요.'
      sub: '서로 다른 구현을 같은 타입으로 다루려면 인터페이스를, 구현들이 상태와 코드를 함께 쓸 때만 추상 클래스를 써요.'
    says:
      - '둘 다 `new`로 객체를 만들 수 없고, 구현이 없는 메서드를 가질 수 있다. 부모 타입으로 쓰여 질문 2의 다형성이 똑같이 동작한다'
      - '추상 클래스는 클래스다. 인스턴스 필드와 생성자를 가질 수 있고 일부 메서드를 구현해 둘 수 있다. 자식은 하나만 `extends`할 수 있다'
      - '인터페이스는 인스턴스 필드와 생성자가 없다. 클래스는 인터페이스를 여러 개 `implements`할 수 있다. 자바 8부터 `default` 메서드로 구현을 줄 수 있지만 상태는 여전히 가질 수 없다'
      - '고르는 기준. 호출하는 쪽에 "이 메서드가 있다"만 약속하면 되면 인터페이스다. 구현들이 같은 필드와 같은 처리 순서를 함께 써야 하면 추상 클래스다. 둘을 함께 쓰기도 한다. 인터페이스로 타입을 정하고 추상 클래스로 공통 구현을 준다'
      - '같은 예제로 보인다. `Notifier`를 인터페이스로 바꾸고 `SmsNotifier`와 `EmailNotifier`가 구현한다. 둘이 "보내기 전에 수신 거부를 확인한다"는 순서와 발송 횟수 필드를 함께 써야 하면 `AbstractNotifier`를 둔다. 이 구조를 패턴으로 다루는 것은 O8이다'
      - '더 알아보기: 두 인터페이스가 같은 시그니처의 `default` 메서드를 가지면 둘을 구현한 클래스는 그 메서드를 직접 오버라이딩해야 컴파일된다'
    asks:
      - '본문의 예시: `interface Notifier { void send(Object msg); }`와 `abstract class AbstractNotifier { int sent; abstract void send(Object msg); }` 가운데 `int sent` 같은 인스턴스 필드를 가질 수 있는 것은 어느 쪽인가 (추상 클래스)'
      - '옮긴 상황: `class Report extends Document, Printable`과 `class Report extends Document implements Printable, Exportable` 가운데 컴파일되는 것은 무엇인가. 조건: `Document`는 클래스, `Printable`과 `Exportable`은 인터페이스다 (둘째만 된다. 클래스는 하나만 상속하고 인터페이스는 여러 개 구현한다)'
    body:
      - p: '부모를 꼭 일반 클래스로 둘 필요는 없어요. 구현이 없는 메서드를 두고 자식이 채우게 하는 방법이 둘 있어요. 둘 다 `new`로 객체를 만들 수 없고, 부모 타입으로 쓰면 질문 2의 다형성이 똑같이 동작해요.'
      - table:
          head: ['', 인터페이스, 추상 클래스]
          rows:
            - [정하는 것, '"이 메서드들이 있다"는 약속', 약속과 함께 일부 구현과 상태]
            - [인스턴스 필드와 생성자, 없음, 있음]
            - [구현, '`default` 메서드로 줄 수 있음(자바 8부터). 상태는 없음', 일반 메서드로 줄 수 있음]
            - [한 클래스가, 여러 개 `implements`, 하나만 `extends`]
      - h3: 언제 무엇을 쓰나요
      - p: '호출하는 쪽에 **"이 메서드가 있다"만 약속하면 되면 인터페이스**예요. 알림이라면 `send` 하나만 있으면 문자든 메일이든 상관없어요. 자바와 스프링의 API가 대부분 이렇게 생겼어요(`List`, `Runnable`, `JpaRepository`).'
      - p: '구현들이 **같은 필드와 같은 처리 순서를 함께 써야 하면 추상 클래스**예요. 문자와 메일 둘 다 "보내기 전에 수신 거부를 확인하고, 보낸 뒤 횟수를 센다"를 지켜야 한다면, 그 순서를 추상 클래스에 한 번 쓰고 실제로 보내는 부분만 자식에게 맡겨요.'
      - code: interfaceVsAbstract
      - p: '실무에서는 둘을 함께 쓰는 일이 많아요. **타입은 인터페이스로 정하고**, 공통 구현이 필요하면 그 인터페이스를 구현한 추상 클래스를 둬요. 호출하는 쪽은 인터페이스만 알아요. 뼈대를 부모에 두고 단계를 자식에 맡기는 이 구조는 템플릿 메서드 패턴 레슨에서 다뤄요.'
      - more:
          summary: '더 알아보기: default 메서드가 겹치면'
          body:
            - p: '두 인터페이스가 같은 시그니처의 `default` 메서드를 가지고 있고, 한 클래스가 둘을 함께 구현하면 어느 쪽을 쓸지 정할 수 없어요. 그 클래스가 그 메서드를 직접 오버라이딩해야 컴파일돼요. 그 안에서 `A.super.method()`로 한쪽을 골라 부를 수 있어요.'
      - quiz:
          q: '`Document`는 클래스, `Printable`과 `Exportable`은 인터페이스예요. 컴파일되는 것은?'
          options:
            - '`class Report extends Document, Printable`'
            - '`class Report extends Document implements Printable, Exportable`'
            - 둘 다
          answer: 2
          explain: '클래스는 하나만 상속하고, 인터페이스는 `implements`로 여러 개 구현해요. 테스트에서 첫째는 컴파일 오류였어요.'
    recall: '인터페이스는 "무엇을 할 수 있는가"만 약속하고 상태가 없으며 한 클래스가 여러 개를 구현할 수 있어요. 추상 클래스는 필드와 생성자, 일부 구현을 가질 수 있고 하나만 상속해요. 서로 다른 구현을 같은 타입으로 다룰 때는 인터페이스를, 구현들이 상태와 처리 순서를 함께 쓸 때는 추상 클래스를 쓰고, 둘을 함께 쓰기도 해요.'
practice:
  title: 스프링에서는 이렇게 만나요
  says:
    - '인터페이스에 기대기. `interface Notifier { void send(Member to, String msg); }`를 두고 `@Component`가 붙은 `SmsNotifier`와 `EmailNotifier`가 구현한다. `OrderService`는 생성자로 `List<Notifier>`를 받아 모두에게 보낸다. 스프링이 `Notifier` 타입의 빈을 전부 모아 넣어 준다. 구현 하나를 더해도 `OrderService`는 고치지 않는다. 질문 2의 다형성이다 (작은 스프링 컨텍스트로 구현이 둘일 때와 셋일 때를 띄워 불린 구현을 기록하는 테스트)'
    - '구현이 여럿인데 하나만 받으려면 스프링이 고를 기준이 필요하다는 것만 말하고 S2에 넘긴다'
    - '흔한 실수: 오버라이딩하려다 오버로딩한다. 예: 공통 부모 `AbstractHandler`의 `handle(Event e)`를 자식에서 `handle(OrderEvent e)`로 쓴다. 컴파일되고, 부모 타입으로 부르는 쪽에서는 부모의 구현만 실행된다. 고친 코드: 시그니처를 부모와 맞추고 `@Override`를 붙인다. 오버라이딩하는 메서드에는 언제나 `@Override`를 붙인다 (순수 자바 테스트. `@Override`를 붙였을 때의 컴파일 오류는 테스트 안에서 컴파일러를 돌려 확인한다)'
    - '스프링의 프록시도 오버라이딩이다. `@Transactional`이 붙은 클래스에 스프링은 그 클래스를 상속한 클래스를 실행 중에 만들어, 메서드를 오버라이딩해 앞뒤에 일을 끼워 넣는다. 그래서 오버라이딩할 수 없는 `final` 메서드와 `private` 메서드에는 적용되지 않는다. 이 레슨은 "질문 2에서 본 규칙 때문"까지만 말하고 동작은 S9와 S10에 넘긴다 (스프링 공식 문서 근거)'
    - '스프링 데이터의 리포지토리는 인터페이스만 쓰고 구현은 스프링이 만들어 주입한다는 한 줄. 자세한 것은 P1'
  body:
    - p: '스프링 코드는 질문 2의 다형성 위에서 짜여요. 구현을 주입받는 코드는 작은 스프링 컨텍스트로, 오버로딩 실수는 자바 코드와 컴파일러로 확인했고, 프록시 이야기는 스프링 공식 문서가 근거예요.'
    - h3: 인터페이스에 기대고 구현은 주입받아요
    - code: springList
      notes:
        - mark: List<Notifier>
          as: code
          text: '`Notifier` 타입의 빈을 스프링이 전부 모아 리스트로 넣어 줘요. `OrderService`는 어떤 구현이 있는지 몰라요.'
    - ci:
        key: list-injection
        label: 구현을 더하기 전과 뒤의 실제 결과 보기
        source: PolymorphismTest.listInjection
    - p: '`PushNotifier` 빈 하나를 더했을 뿐 `OrderService`는 한 줄도 고치지 않았어요. `n.send(...)` 한 줄이 리스트에 든 객체마다 다른 구현을 실행하는 것, 질문 2의 다형성이에요. 구현이 여럿인데 하나만 받아야 할 때 스프링이 무엇으로 고르는지(`@Primary`, `@Qualifier`)는 스프링 빈과 의존성 주입 레슨에서 다뤄요.'
    - muted: '스프링 데이터의 리포지토리도 같아요. 개발자는 `OrderRepository` 인터페이스만 쓰고, 구현은 스프링이 만들어 주입해요. ORM과 JPA 레슨에서 다뤄요. 근거: [스프링 문서의 @Autowired](link:autowired).'
    - h3: '흔한 실수: 오버라이딩하려다 오버로딩'
    - p: '이벤트를 처리하는 공통 부모가 있고, 주문 이벤트만 따로 처리하려고 자식을 만들었어요.'
    - code: handlerBad
      notes:
        - mark: OrderEvent
          as: code
          text: '부모는 `Event`를 받는데 자식은 `OrderEvent`를 받아요. 시그니처가 달라서 오버라이딩이 아니라 오버로딩이에요.'
    - ci:
        key: handler
        label: 실제 결과 보기
        source: PolymorphismTest.overloadNotOverride
    - p: '`OrderEvent`를 넘겼는데도 "기본"이에요. 컴파일러는 변수 `h`의 타입 `Handler`에서 `handle(Event)`를 골랐고(질문 3), `OrderHandler`는 그것을 오버라이딩하지 않았으니 부모의 구현이 실행됐어요. 오류도 경고도 없어서 찾기 어려워요.'
    - p: '오버라이딩하려는 메서드에 **언제나 `@Override`를 붙이면** 이 실수가 컴파일 오류로 드러나요.'
    - code: overrideCheck
    - ci:
        key: override-error
        label: 컴파일 결과 보기
        source: PolymorphismTest.overrideAnnotationCatchesIt
    - p: '고친 코드는 부모와 시그니처를 맞추고, 안에서 타입을 확인해요.'
    - code: handlerFixed
      notes:
        - mark: '@Override'
          as: anno
          text: '이제 정말 부모의 메서드를 다시 정의한 것인지 컴파일러가 확인해 줘요.'
        - mark: Event
          as: code
          text: '부모와 같은 매개변수 타입이에요.'
    - h3: 스프링의 프록시도 오버라이딩이에요
    - p: '`@Transactional`을 붙인 서비스는 스프링이 그 클래스를 **상속한 클래스**를 실행 중에 만들어서 빈으로 등록해요. 그 클래스가 메서드를 오버라이딩해서, 원래 메서드의 앞뒤에 트랜잭션을 여닫는 일을 끼워 넣어요. 이것을 프록시라고 해요.'
    - code: proxy
      notes:
        - mark: final
          as: code
          text: '`final` 메서드는 오버라이딩할 수 없어서 프록시가 끼어들지 못해요. 트랜잭션 없이 원래 메서드만 실행돼요. `private` 메서드도 같아요.'
    - p: '그래서 `@Transactional`을 `final`이나 `private` 메서드에 붙이면 아무 일도 일어나지 않아요. 질문 2의 "오버라이딩되지 않는 것" 표가 그대로 적용돼요. 프록시가 어떻게 만들어지고 언제 빠지는지는 AOP 레슨과 @Transactional 동작 원리 레슨에서 다뤄요.'
    - muted: '근거: [스프링 문서의 프록시](link:aopProxy). 이 부분은 테스트로 확인하지 않았어요.'
interview:
  question: 오버라이딩과 오버로딩의 차이, 그리고 다형성을 설명해 주세요
  model:
    - label: 정의
      text: 오버라이딩은 자식이 부모의 메서드를 같은 시그니처로 다시 정의하는 것이고, 오버로딩은 이름이 같고 매개변수가 다른 메서드를 여럿 두는 것입니다. 다형성은 같은 호출이 실제 객체에 따라 다른 구현을 실행하는 성질입니다.
    - label: 원리
      text: 오버로딩은 컴파일러가 변수와 인자의 타입을 보고 컴파일할 때 어느 메서드를 부를지 정하고, 오버라이딩은 JVM이 실행할 때 실제 객체의 클래스를 보고 구현을 고릅니다. 그래서 부모 타입 변수로 불러도 자식의 구현이 실행됩니다. 필드와 static 메서드는 오버라이딩되지 않습니다.
    - label: 주의할 점
      text: 오버라이딩하려다 매개변수 타입을 다르게 쓰면 오버로딩이 되어 부모의 메서드가 그대로 실행되므로 @Override를 붙여 컴파일러가 잡게 합니다. 스프링의 프록시는 상속과 오버라이딩으로 동작해서 final이나 private 메서드에는 @Transactional이 적용되지 않습니다.
    - label: 경험
      text: '(내 프로젝트로 채우기) 예: 알림 방식을 인터페이스로 두고 List로 주입받아, 새 알림 방식을 더할 때 서비스 코드를 고치지 않게 만들었습니다.'
verified: 이 레슨의 출력은 짐작이 아니라 자바 21에서 코드를 돌려 받은 값이에요. 컴파일 오류는 테스트 안에서 javac를 돌려, 주입은 스프링 컨텍스트를 띄워 확인했어요. 코드가 바뀔 때마다 테스트([PolymorphismTest](link:test))가 다시 돌아요.
footer: '근거: 오버라이딩은 자바 언어 명세 8.4.8([링크](link:jlsOverride)), 부를 메서드를 컴파일할 때 고르고 실행할 때 찾는 것은 15.12([링크](link:jlsInvoke)), 같은 타입의 빈을 리스트로 받는 것과 프록시는 스프링 프레임워크 문서. 결과는 OpenJDK 21에서 테스트로 확인했어요. 오류는 [GitHub 이슈](https://github.com/wanja727/dev-lessons/issues)로 알려 주세요.'
claims:
  - claim: '코드 predict의 출력은 "Sms, Object"다'
    how: '출력 대신 문자열을 돌려주게 한 같은 구조의 클래스를 돌린다'
    test: PolymorphismTest.predict
  - claim: '받는 변수의 타입과 인자의 변수 타입 네 조합의 결과: (Notifier, String)과 (Notifier, Object)와 (SmsNotifier, Object)는 "Sms, Object", (SmsNotifier, String)은 "Sms, String"이다'
    how: '네 조합을 돌려 표로 남긴다. 위젯의 숫자와 맞춘다'
    test: PolymorphismTest.fourCombinations
  - claim: '코드 fields에서 `n.name`은 "기본"이다'
    how: '그대로 돌린다'
    test: PolymorphismTest.fieldsAreNotOverridden
  - claim: '다시 정의하지 않은 자식은 가장 가까운 부모의 구현을 쓴다'
    how: 'Animal, Dog, Puppy로 돌린다'
    test: PolymorphismTest.nearestOverride
  - claim: '상관없는 자식 타입으로 내려받으면 `ClassCastException`이 난다'
    how: '`EmailNotifier` 객체를 `SmsNotifier`로 변환한다'
    test: PolymorphismTest.downcast
  - claim: '변수 타입에 없는 메서드를 부르면 컴파일되지 않는다'
    how: '`JavaSource`로 컴파일한다'
    test: PolymorphismTest.methodNotInVariableType
  - claim: '매개변수 타입이 다른 메서드는 오버라이딩이 아니어서 부모 타입으로 부르면 부모의 구현이 실행된다. 거기에 `@Override`를 붙이면 컴파일되지 않는다'
    how: '`Handler` 예제를 돌리고, `JavaSource`로 `@Override`를 붙인 소스를 컴파일한다'
    test: PolymorphismTest.overloadNotOverride
  - claim: '부모의 생성자가 부른 오버라이딩된 메서드 안에서 자식의 필드는 기본값이다'
    how: '자식의 필드를 초기화식으로 채워 두고, 부모 생성자가 부른 메서드에서 그 필드를 기록한다'
    test: PolymorphismTest.overriddenMethodInConstructor
  - claim: '클래스 둘을 extends하면 컴파일되지 않고, 클래스 하나와 인터페이스 여럿은 된다'
    how: '`JavaSource`로 두 소스를 컴파일한다'
    test: PolymorphismTest.singleInheritance
  - claim: '생성자로 `List<Notifier>`를 받는 빈에는 `Notifier`를 구현한 빈이 모두 들어온다'
    how: '`AnnotationConfigApplicationContext`에 구현 둘과 셋을 각각 등록해 리스트의 결과를 본다'
    test: PolymorphismTest.listInjection
sources:
  - '오버라이딩: 자바 언어 명세 8.4.8 https://docs.oracle.com/javase/specs/jls/se21/html/jls-8.html#jls-8.4.8'
  - '부를 메서드를 컴파일할 때 고르는 것과 실행할 때 찾는 것: 자바 언어 명세 15.12 https://docs.oracle.com/javase/specs/jls/se21/html/jls-15.html#jls-15.12'
  - '필드는 변수의 타입으로 정해진다: 자바 언어 명세 15.11.1 https://docs.oracle.com/javase/specs/jls/se21/html/jls-15.html#jls-15.11.1'
  - '추상 클래스와 인터페이스: 자바 언어 명세 8.1.1.1, 9장 https://docs.oracle.com/javase/specs/jls/se21/html/jls-9.html'
  - '`instanceof` 패턴: 자바 언어 명세 15.20.2 https://docs.oracle.com/javase/specs/jls/se21/html/jls-15.html#jls-15.20.2'
  - '같은 타입의 빈을 컬렉션으로 주입받기: 스프링 프레임워크 문서 https://docs.spring.io/spring-framework/reference/core/beans/annotation-config/autowired.html'
  - '프록시가 `final` 메서드에 적용되지 않는 것: 스프링 프레임워크 문서 https://docs.spring.io/spring-framework/reference/core/aop/proxying.html'
