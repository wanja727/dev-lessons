      - h3: 오버라이딩하려다 오버로딩이 되면
      - p: '이 차이가 도입부의 사고를 만들어요. 자식에서 부모 메서드를 다시 정의하려고 했는데 **매개변수 타입을 다르게 쓰면** 오버라이딩이 아니라 오버로딩이 돼요. 오류 없이 컴파일되고, 부모 타입으로 부르는 곳에서는 부모의 메서드가 그대로 실행돼요. 실무 구역에서 코드로 봐요.'
      - quiz:
          q: '코드 predict의 클래스로 `SmsNotifier s = new SmsNotifier(); Object o = "주문 완료"; s.send(o);`를 실행하면?'
          options:
