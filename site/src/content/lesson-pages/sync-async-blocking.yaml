# 동기와 비동기, 블로킹과 논블로킹
# 자료 파일의 칸은 docs/lesson-data-format.md에 있다. 문제는 content/questions/sync-async-blocking.yaml에 있다.
title: 동기와 비동기, 블로킹과 논블로킹
description: 동기와 비동기는 무엇이 다른지, 블로킹과 논블로킹은 무엇이 다른지, 둘은 어떻게 조합되는지, 서버는 많은 요청을 어떤 방식으로 기다리는지. 200ms 기다리는 호출 100건을 스레드 10개와 콜백 하나로 처리해 보며 배우는 대화형 레슨.
unit: 운영체제와 동시성
minutes: 20
roadmap: C9
type: 개념 설명
prerequisites:
  - {slug: thread-pool, title: 스레드 풀}
assume: '자바 21(OpenJDK). 스레드 풀과 `BlockingQueue`(스레드 풀 레슨). 기다리는 스레드는 CPU를 쓰지 않는다는 것(컨텍스트 스위칭 레슨). `Future`와 `CompletableFuture`는 Future와 CompletableFuture 레슨에서 배우지만, 이 레슨에서 쓰는 만큼은 그 자리에서 설명해요.'
example: '외부 배송 API를 부르고 200ms 동안 답을 기다리는 일. 같은 호출을 네 가지 방식(기다리며 받기, 확인하며 받기, 맡기고 기다리기, 맡기고 알림 받기)으로 부르고, 동시에 100건을 처리할 때 스레드가 몇 개 필요한지 세어 봐요. 실무 구역에서는 스프링 MVC의 요청 스레드와 웹플럭스의 이벤트 루프로 옮겨요.'
intro:
  - '"비동기로 바꾸면 빨라진다"는 말을 듣고 외부 API 호출을 `CompletableFuture`로 감쌌어요. 그런데 바로 다음 줄에서 `join()`을 부르니 응답 시간이 하나도 안 줄었어요. 옆 팀은 "논블로킹이라 스레드 몇 개로 수만 건을 받는다"는 웹플럭스를 쓰는데, 거기서 JDBC를 부르면 안 된다고 해요.'
  - '동기와 비동기, 블로킹과 논블로킹은 면접에서 자주 묻는 짝이에요. 둘은 다른 것을 묻는 말이라 섞어 쓰면 답이 엇나가요. 스프링 개발자에게는 요청 하나에 스레드 하나를 쓰는 스프링 MVC와 적은 스레드로 많은 연결을 다루는 웹플럭스 가운데 무엇이 맞는지, 비동기로 감싼 코드가 정말 기다림을 줄이는지를 가르는 기준이에요.'
  - '이 레슨에서는 큐에서 값을 꺼내는 두 메서드로 블로킹과 논블로킹을 보고, 200ms 기다리는 일 100건을 스레드 10개로 기다릴 때와 스레드 하나로 알림을 받을 때의 시간을 재요.'
covers:
  - topic: '동기와 비동기는 "결과를 누가 언제 챙기나"의 구분이다. 동기는 부른 쪽이 결과가 나올 때를 직접 챙기고, 비동기는 일이 끝나면 알림(콜백)이 오거나 나중에 받는다'
    where: '질문 1'
  - topic: '블로킹과 논블로킹은 "부른 함수가 바로 돌아오나"의 구분이다. 블로킹은 준비될 때까지 부른 스레드를 멈추고, 논블로킹은 준비가 안 됐어도 바로 돌아온다'
    where: '질문 2'
  - topic: 'BlockingQueue의 take(블로킹)와 poll(논블로킹), 블로킹된 스레드의 상태'
    where: '질문 2'
  - topic: '네 가지 조합: 동기 블로킹(평범한 호출), 동기 논블로킹(끝났는지 계속 확인), 비동기 논블로킹(맡기고 콜백), 비동기 블로킹(맡겼는데 바로 기다림)'
    where: '질문 3'
  - topic: '비동기로 맡기고 바로 join하면 동기와 다를 것이 없다'
    where: '질문 3'
  - topic: '스레드 하나가 요청 하나를 맡는 방식(스레드 퍼 리퀘스트): 기다리는 동안 스레드가 묶인다. 동시 요청 수만큼 스레드가 필요하다'
    where: '질문 4'
  - topic: '이벤트 루프 방식: 적은 스레드가 논블로킹 입출력으로 많은 연결을 돌보고, 준비된 것만 처리한다. 이 스레드를 막으면 모두가 멈춘다'
    where: '질문 4'
  - topic: '운영체제의 논블로킹 입출력과 준비된 연결을 알려 주는 기능(epoll), 자바 NIO의 Selector'
    where: '질문 4의 더 알아보기'
  - topic: '스프링 MVC(톰캣, 서블릿)와 웹플럭스(네티)의 기본 방식. JDBC는 블로킹이다'
    where: '실무에서는. 톰캣은 서블릿과 톰캣(S1), 웹플럭스는 웹플럭스(S16)'
  - topic: 'RestClient와 WebClient'
    where: '실무에서는'
  - topic: 'CompletableFuture로 잇고 합치는 법'
    where: '다루지 않음: Future와 CompletableFuture(C8)'
  - topic: '스레드를 묶지 않고 블로킹 코드를 그대로 쓰는 방법'
    where: '다루지 않음: 가상 스레드(C12)'
  - topic: '입출력이 운영체제를 거치며 비싼 이유'
    where: '다루지 않음: 사용자 모드와 커널 모드(C11)'
codes:
  predict: |-
    var pool = Executors
        .newFixedThreadPool(10);
    // 배송 API: 200ms 기다린 뒤 답한다
    for (int i = 0; i < 100; i++)
      pool.submit(() -> deliveryApi());
    // 100건이 모두 끝나는 데 걸리는 시간은?
  syncBlocking: |-
    // 동기 블로킹
    Delivery d = deliveryApi();
    show(d);
  takePoll: |-
    BlockingQueue<String> q =
        new LinkedBlockingQueue<>();

    q.[[take()]];  // 값이 올 때까지 멈춤
    q.[[poll()]];  // 없으면 바로 null
  syncNonBlocking: |-
    // 동기 논블로킹
    Future<Delivery> f =
        pool.submit(() -> deliveryApi());
    while (![[f.isDone()]]) {
      doOtherWork();
    }
    show(f.get());
  asyncNonBlocking: |-
    // 비동기 논블로킹
    deliveryApiAsync()
        .[[thenAccept]](d -> show(d));
    // 바로 다음 줄로 간다
  asyncBlocking: |-
    // 비동기 블로킹
    deliveryApiAsync()
        .[[join()]];
  callback: |-
    var timer = Executors
        .newSingleThreadScheduledExecutor();

    // 200ms 뒤에 "답이 왔다"고 알려 준다
    CompletableFuture<String>
        deliveryApiAsync() {
      var cf = new CompletableFuture<String>();
      timer.schedule(
          () -> cf.complete("배송 중"),
          200, MILLISECONDS);
      return cf;
    }
  mvc: |-
    @GetMapping("/orders/{id}")
    OrderView order(@PathVariable long id) {
      // 톰캣 스레드가 DB 답을 기다린다
      return service.find(id);
    }
  webflux: |-
    @GetMapping("/orders/{id}")
    Mono<OrderView> order(
        @PathVariable long id) {
      return webClient.get()
          .uri("/orders/{id}", id)
          .retrieve()
          .bodyToMono(OrderView.class);
    }
