questions:
  - id: q1
    title: 동기와 비동기는 무엇이 다른가요?
    conclusion:
      lead: '동기는 부른 쪽이 일이 끝나는 때를 직접 챙겨 결과를 받고 다음으로 가는 방식이고, 비동기는 일을 맡기고 다음으로 가면 끝났을 때 알림을 받거나 나중에 결과를 받는 방식이에요.'
      sub: '핵심은 "결과와 끝나는 때를 누가 챙기나"예요. 동기는 부른 쪽이, 비동기는 맡은 쪽(또는 콜백)이 챙겨요.'
    says:
      - '코드 syncBlocking. 평범한 메서드 호출은 동기다. `deliveryApi()`가 끝나야 결과가 돌아오고, 부른 쪽이 그 결과로 다음 줄을 실행한다. 일의 순서가 코드의 순서와 같다'
      - '코드 asyncNonBlocking. 비동기는 일을 맡기고 바로 다음 줄로 간다. 결과는 끝났을 때 붙여 둔 일(`thenAccept`의 콜백)이 처리한다. 콜백이 언제, 어느 스레드에서 실행될지는 부른 쪽이 정하지 않는다. 출력 순서로 보인다: "다음 줄"이 "배송 중"보다 먼저 찍힌다'
      - '`CompletableFuture`는 "나중에 올 결과"를 담는 상자다. `thenAccept`로 결과가 오면 할 일을 붙이고, `join()`으로 올 때까지 기다려 꺼낸다. 자세한 것은 C8'
      - '비동기는 스레드를 여럿 쓴다는 뜻이 아니다. 스레드 하나에서도 "200ms 뒤에 알려 달라"고 맡겨 둘 수 있다(코드 callback). 질문 4에서 이것으로 100건을 함께 기다린다'
    asks:
      - '본문의 예시: 코드 asyncNonBlocking 다음 줄에 `System.out.println("다음 줄")`이 있다. "다음 줄"과 콜백의 "배송 중" 가운데 무엇이 먼저 찍히나. 배송 API는 200ms 걸린다 ("다음 줄". 맡기고 바로 다음으로 간다)'
      - '옮긴 상황: 회원 가입 뒤 환영 메일을 메시지 큐에 넣고 바로 "가입 완료"로 응답한다. 메일 발송은 다른 서버가 나중에 한다. 응답하는 쪽에서 보면 메일 발송은 동기인가 비동기인가 (비동기. 끝나는 때를 응답하는 쪽이 챙기지 않는다)'
    body:
      - p: '두 짝은 서로 다른 것을 물어요. 먼저 동기와 비동기는 **"결과와 끝나는 때를 누가 챙기나"**예요.'
      - code: syncBlocking
      - p: '평범한 메서드 호출은 **동기**예요. `deliveryApi()`가 끝나야 결과가 돌아오고, 부른 쪽이 그 결과로 다음 줄을 실행해요. 일의 순서가 코드의 순서와 같아요.'
      - code: asyncNonBlocking
      - p: '**비동기**는 일을 맡기고 바로 다음 줄로 가요. 결과는 끝났을 때 붙여 둔 일(`thenAccept`의 콜백)이 처리해요. 콜백이 언제, 어느 스레드에서 실행될지는 부른 쪽이 정하지 않아요. 바로 다음 줄에 "다음 줄"을 찍고 순서를 봤어요.'
      - ci:
          key: callback
          label: 실제로 찍힌 순서 보기
          source: SyncAsyncBlockingTest.callbackRunsLater
      - ul:
          - '`CompletableFuture`는 "나중에 올 결과"를 담는 상자예요. `thenAccept`로 결과가 오면 할 일을 붙이고, `join()`으로 올 때까지 기다려 꺼내요. 자세한 것은 Future와 CompletableFuture 레슨에서 다뤄요.'
          - '**비동기는 스레드를 여럿 쓴다는 뜻이 아니에요.** 이 레슨의 `deliveryApiAsync`는 스레드 하나짜리 타이머에 "200ms 뒤에 알려 달라"고 맡겨 둘 뿐이에요. 질문 4에서 이것으로 100건을 함께 기다려요.'
      - code: callback
      - quiz:
          q: '회원 가입 뒤 환영 메일을 메시지 큐에 넣고 바로 "가입 완료"로 응답해요. 메일은 다른 서버가 나중에 보내요. 응답하는 쪽에서 메일 발송은 동기일까요, 비동기일까요?'
          options:
            - 동기
            - 비동기
            - 둘 다 아니다
          answer: 2
          explain: '메일이 언제 끝나는지 응답하는 쪽이 챙기지 않아요. 맡기고 다음으로 갔어요.'
      - next: '맡기고 바로 다음 줄로 간다는 것은 함수가 바로 돌아왔다는 뜻이에요. "바로 돌아오나"는 또 다른 짝이 묻는 것이에요.'
    recall: '동기는 부른 쪽이 일이 끝나는 때를 직접 챙겨 결과를 받고 다음으로 가는 방식이고, 비동기는 일을 맡기고 다음으로 가면 끝났을 때 콜백이 오거나 나중에 결과를 받는 방식이에요. 핵심은 결과와 끝나는 때를 누가 챙기나예요. 비동기가 스레드를 여럿 쓴다는 뜻은 아니에요.'
  - id: q2
    title: 블로킹과 논블로킹은 무엇이 다른가요?
    conclusion:
      lead: '블로킹은 부른 함수가 준비될 때까지 돌아오지 않아 부른 스레드가 멈추는 것이고, 논블로킹은 준비가 안 됐어도 함수가 바로 돌아오는 것이에요.'
      sub: '핵심은 "부른 스레드가 멈추나"예요. 블로킹된 스레드는 CPU를 쓰지 않지만 다른 일도 하지 못해요.'
    says:
      - '코드 takePoll. 빈 큐에서 `take()`는 값이 들어올 때까지 돌아오지 않는다. 그 스레드의 상태는 `WAITING`이다. `poll()`은 값이 없으면 바로 null을 돌려준다. 두 메서드를 부른 스레드의 상태와 걸린 시간을 실제 출력으로 보인다'
      - '블로킹된 스레드는 운영체제가 차례를 주지 않아 CPU를 쓰지 않는다(C2). 하지만 스레드와 스택 메모리를 붙잡은 채 다른 일을 하지 못한다'
      - '파일 읽기, 소켓 읽기, JDBC 쿼리, `Thread.sleep`, `Future.get()`, `lock()`은 블로킹이다. `poll()`, `tryLock()`, `isDone()`, 논블로킹 소켓의 `read`(읽을 것이 없으면 0)는 논블로킹이다'
      - '논블로킹은 "지금은 없다"를 알려 줄 뿐이다. 그러면 언제 다시 물어볼지를 정해야 한다. 계속 물어보면(폴링) CPU를 쓴다. 준비되면 알려 주는 기능과 짝지어 쓴다(질문 4)'
      - '동기와 비동기는 결과를 누가 챙기나, 블로킹과 논블로킹은 부른 스레드가 멈추나다. 둘은 다른 질문이라 네 가지로 조합된다(질문 3)'
    asks:
      - '본문의 예시: 빈 `LinkedBlockingQueue`에 `poll()`과 `take()`를 각각 부른 스레드는 어떻게 되나 (poll은 바로 null을 받고, take는 값이 올 때까지 WAITING으로 멈춘다)'
      - '옮긴 상황: `lock.tryLock()`은 락이 잡혀 있으면 기다리지 않고 false를 돌려준다. 블로킹인가 논블로킹인가 (논블로킹)'
    body:
      - p: '블로킹과 논블로킹은 **"부른 함수가 바로 돌아오나, 부른 스레드가 멈추나"**예요.'
      - code: takePoll
        notes:
          - mark: take()
            as: code
            text: '값이 들어올 때까지 돌아오지 않아요. 부른 스레드가 멈춰요.'
          - mark: poll()
            as: code
            text: '값이 없으면 바로 null을 돌려줘요.'
      - ci:
          key: take-poll
          label: 빈 큐에 두 메서드를 부른 실제 결과 보기
          source: SyncAsyncBlockingTest.pollVersusTake
      - ul:
          - '**블로킹된 스레드는 CPU를 쓰지 않아요.** 운영체제가 차례를 주지 않아요(컨텍스트 스위칭 레슨). 하지만 스레드와 스택 메모리를 붙잡은 채 **다른 일을 하지 못해요.**'
          - '블로킹: 파일 읽기, 소켓 읽기, JDBC 쿼리, `Thread.sleep`, `Future.get()`, `lock()`'
          - '논블로킹: `poll()`, `tryLock()`, `isDone()`, 논블로킹 소켓의 `read`(읽을 것이 없으면 0)'
      - p: '논블로킹은 "지금은 없다"를 알려 줄 뿐이에요. 그러면 언제 다시 물어볼지를 정해야 해요. 계속 물어보면(폴링) CPU를 써요. 그래서 "준비되면 알려 주는" 기능과 짝지어 써요(질문 4).'
      - callout: '**두 짝은 다른 질문이에요.** 동기와 비동기는 결과를 누가 챙기나, 블로킹과 논블로킹은 부른 스레드가 멈추나예요. 그래서 네 가지로 조합돼요.'
      - quiz:
          q: '`lock.tryLock()`은 락이 잡혀 있으면 기다리지 않고 false를 돌려줘요. 블로킹일까요, 논블로킹일까요?'
          options:
            - 블로킹
            - 논블로킹
            - 비동기
          answer: 2
          explain: '부른 스레드를 멈추지 않고 바로 돌아오니 논블로킹이에요.'
      - next: '두 짝을 섞으면 네 가지가 나와요. 각각 어떤 모양일까요?'
    recall: '블로킹은 부른 함수가 준비될 때까지 돌아오지 않아 부른 스레드가 멈추는 것이고, 논블로킹은 준비가 안 됐어도 바로 돌아오는 것이에요. 빈 큐의 `take()`는 멈추고 `poll()`은 바로 null이에요. 블로킹된 스레드는 CPU를 쓰지 않지만 다른 일도 하지 못해요.'
  - id: q3
    title: 동기, 비동기와 블로킹, 논블로킹은 어떻게 조합되나요?
    conclusion:
      lead: '동기 블로킹(평범한 호출), 동기 논블로킹(끝났는지 계속 확인하며 다른 일), 비동기 논블로킹(맡기고 콜백), 비동기 블로킹(맡기고 바로 기다림)의 네 가지예요.'
      sub: '스레드를 아끼는 것은 비동기 논블로킹이에요. 비동기로 맡겨도 바로 `join()`하면 동기 블로킹과 시간이 같아요.'
    says:
      - '동기 블로킹(코드 syncBlocking): 부르고 결과가 올 때까지 멈춘다. 가장 흔하고 읽기 쉽다. JDBC와 `RestTemplate`이 이렇다'
      - '동기 논블로킹(코드 syncNonBlocking): 맡긴 뒤 `isDone()`으로 끝났는지 물으며 그사이 다른 일을 한다. 결과는 부른 쪽이 챙기지만 멈추지는 않는다. 할 다른 일이 없으면 CPU만 쓴다'
      - '비동기 논블로킹(코드 asyncNonBlocking): 맡기고 바로 다음으로 간다. 끝나면 콜백이 처리한다. 부른 스레드는 멈추지 않고 결과도 챙기지 않는다'
      - '비동기 블로킹(코드 asyncBlocking): 비동기 API로 맡겼는데 바로 `join()`으로 기다린다. 의도한 조합이라기보다 흔한 실수다. 200ms 호출 셋을 비동기로 맡기고 하나씩 바로 join하면 0.6초, 셋을 다 맡긴 뒤 모으면 0.2초 남짓이다. 실제 시간을 보인다'
    widget:
      kind: classify
      note: '코드 조각마다 네 조합 가운데 하나를 고른다. 항목: JDBC로 조회하고 결과로 응답, CompletableFuture를 받아 바로 join, thenAccept로 결과를 로그에 남기고 바로 응답, 작업을 맡기고 isDone을 확인하며 진행률 화면 갱신, 메시지 큐에 넣고 바로 응답(받는 쪽이 처리하고 결과 이벤트를 보냄)'
    asks:
      - '본문의 예시: `deliveryApiAsync().join()`은 네 조합 가운데 무엇인가 (비동기 블로킹. 맡겼지만 바로 기다린다)'
      - '옮긴 상황: 파일 변환을 맡긴 뒤 1초마다 `isDone()`을 확인하며 진행 막대를 그리고, 끝나면 결과를 보여 준다. 네 조합 가운데 무엇인가 (동기 논블로킹. 멈추지 않지만 끝나는 때를 부른 쪽이 챙긴다)'
    body:
      - table:
          head: ['', 블로킹, 논블로킹]
          rows:
            - [동기, '부르고 결과가 올 때까지 멈춰요. JDBC, `RestTemplate`', '맡긴 뒤 `isDone()`으로 계속 확인하며 다른 일을 해요']
            - [비동기, '비동기로 맡겼는데 바로 `join()`으로 기다려요. 흔한 실수', '맡기고 바로 다음으로 가고, 끝나면 콜백이 처리해요']
      - code: syncNonBlocking
      - p: '동기 논블로킹은 멈추지는 않지만, 끝났는지는 부른 쪽이 계속 챙겨요. 할 다른 일이 없으면 CPU만 써요.'
      - code: asyncBlocking
      - p: '비동기 블로킹은 의도한 조합이라기보다 흔한 실수예요. 비동기로 맡겨 놓고 바로 기다리면 동기와 다를 게 없어요. 200ms 비동기 호출 셋으로 재 봤어요.'
      - ci:
          key: async-blocking
          label: 하나씩 join과 다 맡긴 뒤 모으기의 실제 시간 보기
          source: SyncAsyncBlockingTest.asyncThenJoinImmediatelyIsSerial
      - p: '스레드를 아끼는 것은 **비동기 논블로킹**이에요. 부른 스레드는 멈추지도 않고 결과를 챙기지도 않아요.'
      - widget:
          kind: classify
          categories: [동기 블로킹, 동기 논블로킹, 비동기 블로킹, 비동기 논블로킹]
          items:
            - {text: 'JDBC로 주문을 조회하고 그 결과로 응답한다', answer: 1, explain: '쿼리가 끝날 때까지 멈추고, 결과를 받아 다음 줄로 가요.'}
            - {text: 'CompletableFuture를 받자마자 join()한다', answer: 3, explain: '비동기로 맡겼지만 바로 기다려요.'}
            - {text: '변환을 맡기고 1초마다 isDone()을 보며 진행 막대를 그린다', answer: 2, explain: '멈추지 않지만 끝나는 때를 부른 쪽이 챙겨요.'}
            - {text: 'thenAccept로 결과를 로그에 남기게 붙이고 바로 응답한다', answer: 4, explain: '멈추지 않고, 결과는 콜백이 처리해요.'}
      - quiz:
          q: '`deliveryApiAsync().join()`은 네 조합 가운데 무엇일까요?'
          options:
            - 동기 블로킹
            - 비동기 블로킹
            - 비동기 논블로킹
          answer: 2
          explain: '비동기 API로 맡겼지만 바로 `join()`으로 멈춰 기다려요.'
      - next: '서버는 수백, 수천 개의 요청을 동시에 기다려요. 이 조합 가운데 어느 것으로 기다릴까요?'
    recall: '동기 블로킹(평범한 호출), 동기 논블로킹(끝났는지 계속 확인하며 다른 일), 비동기 논블로킹(맡기고 콜백), 비동기 블로킹(맡기고 바로 기다림)의 네 가지예요. 스레드를 아끼는 것은 비동기 논블로킹이에요. 비동기로 맡겨도 바로 `join()`하면 동기 블로킹과 시간이 같아요.'
  - id: q4
    title: 서버는 많은 요청을 어떤 방식으로 기다리나요?
    conclusion:
      lead: '요청마다 스레드 하나가 맡아 블로킹으로 기다리는 방식과, 적은 스레드가 논블로킹으로 여러 연결을 돌보다 준비된 것만 처리하는 이벤트 루프 방식이 있어요.'
      sub: '앞의 방식은 코드가 쉽지만 동시에 기다리는 요청 수만큼 스레드가 필요하고, 뒤의 방식은 스레드가 적어도 되지만 그 스레드를 막는 코드가 하나라도 있으면 모두가 멈춰요.'
    says:
      - '예측의 답을 밝힌다. 코드 predict는 2초 남짓이다. 스레드 10개가 200ms씩 블로킹으로 기다리니 한 번에 10건씩 열 번이다. 실제 시간을 보인다. 0.2초에 끝내려면 스레드가 100개 필요하다'
      - '스레드 퍼 리퀘스트: 톰캣은 요청마다 스레드 하나를 주고, 그 스레드가 DB와 외부 API의 답을 블로킹으로 기다린다. 동시에 기다리는 요청이 스레드 수(기본 200)를 넘으면 나머지는 줄을 선다'
      - '이벤트 루프: 코드 callback처럼 "답이 오면 알려 달라"고 맡겨 두고, 스레드는 그동안 다른 일을 한다. 같은 100건을 스레드 하나(타이머)로 맡기면 0.2초 남짓에 모두 끝난다. 실제 시간을 보인다. 기다림이 스레드를 붙잡지 않는다'
      - '이벤트 루프의 약점: 일을 처리하는 스레드가 몇 개뿐이라, 그 스레드에서 `Thread.sleep`이나 JDBC 같은 블로킹 호출을 하면 그동안 다른 모든 연결이 멈춘다. 콜백 안에서 100ms 블로킹하면 다음 콜백이 그만큼 밀리는 것을 보인다'
      - '고르는 법: 기다리는 연결이 아주 많고(수천 이상) 모든 입출력이 논블로킹이면 이벤트 루프, 아니면 스레드 퍼 리퀘스트가 단순하고 충분하다'
      - '더 알아보기: 운영체제는 논블로킹 소켓 여러 개 가운데 읽을 것이 생긴 소켓을 알려 주는 기능을 준다(리눅스의 epoll). 자바 NIO의 `Selector`가 이것을 쓰고, 네티의 이벤트 루프가 그 위에 있다'
    widget:
      kind: toggle
      note: '고르기: 스레드 10개로 블로킹 대기, 스레드 100개로 블로킹 대기, 스레드 1개로 콜백 대기. 장면마다 gantt로 스레드 막대(기다림, 처리)를 보이고 100건이 끝난 시간을 실제 측정값으로 적는다'
    asks:
      - '본문의 예시: 200ms 기다리는 호출 100건을 스레드 1개의 타이머에 "200ms 뒤 알려 달라"로 맡겼다. 모두 끝나는 데 대략 얼마나 걸리나 (0.2초쯤. 기다림이 스레드를 붙잡지 않는다)'
      - '옮긴 상황: 이벤트 루프 스레드 4개로 도는 서버의 핸들러에서 JDBC로 500ms 걸리는 쿼리를 바로 부른다. 동시에 요청 8개가 들어오면 어떻게 되나 (이벤트 루프 스레드 4개가 모두 막혀 나머지 요청과 연결이 기다린다)'
      - '실무 구역: 코드 mvc의 서비스가 DB를 1초 기다린다. 톰캣 스레드가 200개일 때 동시에 들어온 요청 300개 가운데 처음 1초 안에 처리가 시작되는 요청은 몇 개인가 (200개. 나머지는 스레드가 빌 때까지 기다린다)'
    body:
      - p: '처음 예측의 답은 **2초쯤**이에요. {{predict-result}}'
      - ci:
          key: predict
          label: 스레드 10개로 블로킹 대기한 실제 시간 보기
          source: SyncAsyncBlockingTest.blockingThreadsVersusCallbacks
          code: predict
      - p: '스레드 10개가 200ms씩 **블로킹으로** 기다리니 한 번에 10건씩 열 번이에요. 0.2초에 끝내려면 스레드가 100개 필요해요. 같은 100건을 스레드 하나의 타이머에 "200ms 뒤에 알려 달라"고 맡기면 어떨까요?'
      - ci:
          key: callbacks
          label: 스레드 하나로 알림을 받은 실제 시간 보기
          source: SyncAsyncBlockingTest.blockingThreadsVersusCallbacks
          code: callback
      - p: '0.2초 남짓에 모두 끝났어요. **기다림이 스레드를 붙잡지 않아서** 스레드 하나로 100건을 함께 기다렸어요. 서버가 요청을 기다리는 두 방식이 이 차이예요.'
      - widget:
          kind: toggle
          layout: [selector, legend, gantt, verdict]
          selector:
            label: 200ms 호출 100건을
            options:
              - {value: t10, label: 스레드 10개로 블로킹}
              - {value: t100, label: 스레드 100개로 블로킹}
              - {value: cb, label: 스레드 1개로 콜백}
          legend:
            - {kind: wait, label: 스레드가 응답을 기다리며 묶임}
            - {kind: hold, label: 스레드가 일을 함}
          scenes:
            t10:
              gantt:
                total: 2
                axis: ['0초', '1초', '2초']
                rows:
                  - {label: '스레드 1~10', bars: [{kind: wait, from: 0, to: 0.2}, {kind: wait, from: 0.2, to: 0.4}, {kind: wait, from: 0.4, to: 0.6}, {kind: wait, from: 0.6, to: 0.8}, {kind: wait, from: 0.8, to: 1.0}, {kind: wait, from: 1.0, to: 1.2}, {kind: wait, from: 1.2, to: 1.4}, {kind: wait, from: 1.4, to: 1.6}, {kind: wait, from: 1.6, to: 1.8}, {kind: wait, from: 1.8, to: 2.0}]}
              verdict: '10개씩 열 번 기다려 2초쯤 걸려요. 기다리는 동안 스레드는 아무것도 못 해요.'
            t100:
              gantt:
                total: 2
                axis: ['0초', '1초', '2초']
                rows:
                  - {label: '스레드 1~100', bars: [{kind: wait, from: 0, to: 0.2}]}
              verdict: '0.2초쯤에 끝나지만 스레드가 100개 필요해요. 동시에 기다리는 요청 수만큼 스레드가 있어야 해요.'
            cb:
              gantt:
                total: 2
                axis: ['0초', '1초', '2초']
                rows:
                  - {label: 스레드 1, bars: [{kind: hold, from: 0, to: 0.02}, {kind: hold, from: 0.2, to: 0.22}]}
              verdict: '스레드 하나가 100건을 맡기고, 0.2초 뒤 알림이 오면 짧게 처리해요. 기다리는 동안 붙잡히는 스레드가 없어요.'
      - table:
          head: ['', 스레드 퍼 리퀘스트, 이벤트 루프]
          rows:
            - [방식, '요청마다 스레드 하나가 맡아 DB와 외부 API의 답을 **블로킹으로** 기다려요', '적은 스레드가 **논블로킹** 입출력으로 여러 연결을 돌보다 준비된 것만 처리해요']
            - [예, '톰캣(스프링 MVC)', '네티(스프링 웹플럭스)']
            - [좋은 점, '코드가 순서대로 읽혀요', '기다리는 연결이 많아도 스레드가 적어요']
            - [약점, '동시에 기다리는 요청 수만큼 스레드가 필요해요', '처리 스레드를 막는 코드가 하나라도 있으면 모두가 멈춰요']
      - p: '이벤트 루프의 약점을 봤어요. 스레드 하나짜리 실행기에서 한 작업이 100ms 블로킹하면, 바로 끝날 다음 작업이 그만큼 밀려요.'
      - ci:
          key: loop-blocked
          label: 실제 결과 보기
          source: SyncAsyncBlockingTest.blockingTheEventLoopDelaysOthers
      - p: '고르는 법: 기다리는 연결이 아주 많고(수천 이상) **모든 입출력이 논블로킹**이면 이벤트 루프, 아니면 스레드 퍼 리퀘스트가 단순하고 충분해요.'
      - more:
          summary: '더 알아보기: 준비되면 알려 주는 기능'
          body:
            - p: '운영체제는 논블로킹 소켓 여러 개 가운데 읽을 것이 생긴 소켓을 알려 주는 기능을 줘요(리눅스의 epoll). 자바 NIO의 `Selector`가 이것을 쓰고([Selector 문서](link:selector)), 네티의 이벤트 루프가 그 위에 있어요.'
      - quiz:
          q: '200ms 기다리는 호출 100건을 스레드 1개의 타이머에 "200ms 뒤 알려 달라"로 맡겼어요. 모두 끝나는 데 대략 얼마나 걸릴까요?'
          options:
            - 0.2초쯤
            - 2초쯤
            - 20초쯤
          answer: 1
          explain: '기다림이 스레드를 붙잡지 않아 100건이 함께 기다려요. 실제로 0.2초 남짓이었어요.'
    recall: '요청마다 스레드 하나가 맡아 블로킹으로 기다리는 방식과, 적은 스레드가 논블로킹으로 여러 연결을 돌보다 준비된 것만 처리하는 이벤트 루프 방식이 있어요. 앞의 것은 코드가 쉽지만 동시에 기다리는 요청 수만큼 스레드가 필요하고, 뒤의 것은 스레드가 적어도 되지만 그 스레드를 막는 코드가 하나라도 있으면 모두가 멈춰요.'
practice:
  says:
    - '스프링 MVC(코드 mvc)는 톰캣의 스레드 퍼 리퀘스트 방식이다. 컨트롤러와 서비스, JDBC와 JPA, `RestClient`가 모두 동기 블로킹이라 코드가 순서대로 읽힌다. 동시에 기다리는 요청 수가 `server.tomcat.threads.max`(기본 200)를 넘으면 줄을 선다'
    - '스프링 웹플럭스(코드 webflux)는 기본으로 네티의 이벤트 루프 위에서 돈다. `Mono`와 `Flux`는 결과가 오면 이어서 할 일을 붙이는 비동기 논블로킹 방식이다. 외부 호출은 논블로킹인 `WebClient`로 한다(스프링 문서 근거, 이 저장소의 테스트에는 웹플럭스 의존성이 없다)'
    - '흔한 실수: 웹플럭스의 핸들러에서 JPA 리포지토리나 `RestTemplate`처럼 블로킹 코드를 부른다. 이벤트 루프 스레드가 막혀 질문 4의 약점이 그대로 생긴다. 고친 코드: R2DBC 같은 논블로킹 드라이버를 쓰거나, 블로킹 코드를 `Schedulers.boundedElastic()` 위로 옮긴다. 근본적으로는 DB 중심의 서비스라면 MVC가 맞다(S16)'
    - '또 하나의 실수: MVC에서 "비동기로 바꾸면 빨라진다"며 호출 하나를 `CompletableFuture`로 감싸고 바로 `join()`한다. 질문 3의 비동기 블로킹이라 빨라지지 않는다. 서로 상관없는 호출 여럿을 함께 맡기고 모을 때만 빨라진다(C8)'
    - '스레드를 붙잡지 않으면서 블로킹 코드를 그대로 쓰는 방법이 자바 21의 가상 스레드다(C12)'
  body:
    - p: '스프링에서는 두 방식이 두 프레임워크로 나뉘어 있어요. MVC의 동작은 앞의 레슨들에서 테스트로 봤고, 웹플럭스는 이 저장소에 의존성이 없어 스프링 문서가 근거예요.'
    - h3: 스프링 MVC는 스레드 퍼 리퀘스트
    - code: mvc
    - p: '컨트롤러와 서비스, JDBC와 JPA, `RestClient`가 모두 동기 블로킹이라 코드가 순서대로 읽혀요. 동시에 기다리는 요청 수가 `server.tomcat.threads.max`(기본 200, [스프링 부트 속성 목록](link:bootProps))를 넘으면 줄을 서요. DB 중심의 서비스라면 이 방식이 단순하고 충분해요.'
    - h3: 스프링 웹플럭스는 이벤트 루프
    - code: webflux
    - p: '웹플럭스는 기본으로 네티의 이벤트 루프 위에서 돌아요. `Mono`와 `Flux`는 결과가 오면 이어서 할 일을 붙이는 비동기 논블로킹 방식이에요. 외부 호출은 논블로킹인 `WebClient`로 해요([스프링 문서](link:webflux)).'
    - h3: '흔한 실수: 웹플럭스에서 블로킹 코드 부르기'
    - p: '웹플럭스의 핸들러에서 JPA 리포지토리나 `RestTemplate`처럼 블로킹 코드를 부르면, 이벤트 루프 스레드가 막혀 질문 4의 약점이 그대로 생겨요. 몇 안 되는 스레드가 모두 막히면 서버 전체가 멈춘 것처럼 보여요. 고치는 방법은 R2DBC 같은 논블로킹 드라이버를 쓰거나, 블로킹 코드를 `Schedulers.boundedElastic()` 위로 옮기는 거예요. 근본적으로는 DB 중심이라면 MVC가 맞아요(웹플럭스 레슨).'
    - h3: '또 하나의 실수: 감싸고 바로 join'
    - p: 'MVC에서 "비동기로 바꾸면 빨라진다"며 호출 하나를 `CompletableFuture`로 감싸고 바로 `join()`해요. 질문 3의 비동기 블로킹이라 빨라지지 않아요. 서로 상관없는 호출 여럿을 함께 맡기고 모을 때만 빨라져요(Future와 CompletableFuture 레슨).'
    - muted: '스레드를 붙잡지 않으면서 블로킹 코드를 그대로 쓰는 방법이 자바 21의 가상 스레드예요. 가상 스레드 레슨에서 다뤄요.'
interview:
  question: 동기와 비동기, 블로킹과 논블로킹의 차이를 설명해 주세요
  model:
    - label: 정의
      text: 동기와 비동기는 결과와 끝나는 때를 누가 챙기는지의 구분이고, 블로킹과 논블로킹은 부른 함수가 바로 돌아오는지, 부른 스레드가 멈추는지의 구분입니다.
    - label: 원리
      text: 둘은 다른 질문이라 동기 블로킹(평범한 호출), 동기 논블로킹(끝났는지 확인하며 다른 일), 비동기 논블로킹(맡기고 콜백), 비동기 블로킹(맡기고 바로 기다림)으로 조합됩니다. 블로킹된 스레드는 CPU는 쓰지 않지만 다른 일을 못 해서, 동시에 기다리는 수만큼 스레드가 필요합니다.
    - label: 주의할 점
      text: 스프링 MVC는 요청마다 스레드가 블로킹으로 기다리는 방식이라 단순하고, 웹플럭스는 적은 이벤트 루프 스레드가 논블로킹으로 많은 연결을 다루지만 그 스레드에서 JDBC 같은 블로킹 코드를 부르면 모두가 멈춥니다. 비동기로 감싸고 바로 join하면 빨라지지 않습니다.
    - label: 경험
      text: '(내 프로젝트로 채우기) 예: 외부 호출을 CompletableFuture로 감쌌는데 바로 join해서 빨라지지 않아, 상관없는 호출을 모두 맡긴 뒤 allOf로 모았습니다.'
verified: 이 레슨의 시간은 짐작이 아니라 자바 21에서 코드를 돌려 잰 값이에요. 비동기 API는 스레드 하나짜리 타이머로 흉내 냈고, 시간은 아래쪽 한계 위주로 확인해요. 코드가 바뀔 때마다 테스트([SyncAsyncBlockingTest](link:test))가 다시 돌아요.
footer: '근거: take와 poll은 BlockingQueue API 문서([링크](link:blockingQueue)), 스레드의 상태는 Thread.State API 문서, CompletableFuture는 API 문서, Selector는 NIO API 문서, 웹플럭스와 이벤트 루프는 스프링 문서([링크](link:webflux)), 톰캣 스레드 수는 스프링 부트 문서. 결과는 OpenJDK 21에서 테스트로 확인했어요. 오류는 [GitHub 이슈](https://github.com/wanja727/dev-lessons/issues)로 알려 주세요.'
claims:
  - claim: '"다음 줄"이 콜백의 출력보다 먼저 찍힌다'
    test: SyncAsyncBlockingTest.callbackRunsLater
    how: '200ms 뒤 완료되는 CompletableFuture에 thenAccept를 붙이고 바로 다음 줄을 기록한 뒤, 완료를 기다려 기록 순서를 본다'
  - claim: '빈 큐의 poll은 바로 null이고, take를 부른 스레드는 WAITING으로 멈춘다'
    how: '다른 스레드에서 take를 부르고 200ms 뒤 상태를 본다. 값을 넣어 풀어 준다'
    test: SyncAsyncBlockingTest.pollVersusTake
  - claim: '200ms 비동기 호출 셋을 하나씩 join하면 0.6초 넘게 걸리고, 다 맡긴 뒤 모으면 그보다 0.2초 넘게 빨리 끝난다'
    how: '타이머 기반 deliveryApiAsync로 시간을 잰다'
    test: SyncAsyncBlockingTest.asyncThenJoinImmediatelyIsSerial
  - claim: '200ms 블로킹 호출 100건을 스레드 10개 풀로 처리하면 2초 남짓(1.9초 이상) 걸린다'
    how: 'Thread.sleep(200) 작업 100개의 시간을 잰다'
    test: SyncAsyncBlockingTest.blockingThreadsVersusCallbacks
  - claim: '같은 100건을 스레드 1개의 타이머로 맡기면 1초 안에 끝난다'
    how: 'ScheduledExecutorService 하나로 200ms 뒤 완료를 100건 맡기고 allOf를 기다린다'
    test: SyncAsyncBlockingTest.blockingThreadsVersusCallbacks
  - claim: '이벤트 처리 스레드가 하나일 때 한 콜백이 100ms 블로킹하면 다음 콜백이 그만큼 밀린다'
    how: '스레드 하나짜리 실행기에 블로킹 작업과 바로 끝나는 작업을 차례로 넣고 둘째의 시작 시각을 본다'
    test: SyncAsyncBlockingTest.blockingTheEventLoopDelaysOthers
sources:
  - '`BlockingQueue`의 take와 poll: API 문서 https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/concurrent/BlockingQueue.html'
  - '`Thread.State`: API 문서 https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/lang/Thread.State.html'
  - '`CompletableFuture`: API 문서 https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/concurrent/CompletableFuture.html'
  - '`Selector`: API 문서 https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/nio/channels/Selector.html'
  - '웹플럭스와 이벤트 루프, 블로킹 코드를 피할 것: 스프링 문서 https://docs.spring.io/spring-framework/reference/web/webflux/new-framework.html'
  - '`server.tomcat.threads.max`: 스프링 부트 속성 목록 https://docs.spring.io/spring-boot/appendix/application-properties/index.html'
