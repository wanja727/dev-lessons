# 리플렉션과 어노테이션 (설계서)
# 자료 파일의 칸은 docs/lesson-data-format.md에 있다.
stage: design
title: 리플렉션과 어노테이션
unit: 자바 언어
roadmap: J17
type: 자바 실행
prerequisites:
  - {slug: inheritance-polymorphism, title: 상속과 다형성}
assume: '자바 21. JVM이 클래스를 읽어 온다는 것(자바 프로그램이 실행되는 과정 레슨). `private` 필드는 클래스 밖에서 쓸 수 없다는 것. 스프링에서 `@Service`나 `@Autowired`를 붙여 본 적이 있으면 좋지만 없어도 돼요.'
example: '주문 서비스 `OrderService`와 그것이 쓰는 `OrderRepository`. 두 클래스에 직접 만든 어노테이션 `@Bean`과 `@Inject`를 붙이고, 그것을 읽어 객체를 만들고 이어 주는 작은 컨테이너를 30줄쯤으로 만들어요. 실무 구역에서는 스프링의 인터셉터가 읽는 `@LoginRequired`로 옮겨요.'
intro:
  - '로그인한 사용자만 부를 수 있게 하려고 `@LoginRequired`라는 어노테이션을 만들어 컨트롤러 메서드에 붙였어요. 인터셉터도 만들었어요. 그런데 로그인하지 않은 요청이 그대로 통과해요. 인터셉터가 메서드를 보면 어노테이션이 붙어 있지 않다고 나와요.'
  - '스프링 개발자가 쓰는 코드의 절반은 어노테이션이에요. `@Service`, `@Autowired`, `@Transactional`, `@Entity`가 그래요. 이 표시들은 스스로 아무 일도 하지 않아요. 스프링이 실행 중에 내 클래스를 들여다보고 표시를 읽어서 일해요. 그 들여다보는 방법이 리플렉션이에요. 이것을 알면 스프링이 마법이 아니라 읽을 수 있는 코드가 돼요.'
  - '이 레슨에서는 리플렉션으로 `private` 필드에 값을 넣어 보고, 어노테이션을 직접 만들어 읽어 보고, 둘을 이어 붙여 스프링의 의존성 주입을 흉내 낸 작은 컨테이너를 만들어요.'
covers:
  - topic: 'Class 객체: JVM이 읽은 클래스마다 하나씩 있는, 그 클래스의 정보를 담은 객체. 얻는 세 가지 방법'
    where: '질문 1'
  - topic: '리플렉션으로 볼 수 있는 것: 필드, 메서드, 생성자, 부모와 인터페이스, 붙은 어노테이션'
    where: '질문 1'
  - topic: '리플렉션으로 할 수 있는 것: 이름으로 객체 만들기, 메서드 부르기, private 필드 읽고 쓰기(setAccessible)'
    where: '질문 2'
  - topic: '컴파일할 때 모르던 클래스를 다룰 수 있다는 것이 프레임워크가 내 코드를 다루는 방법이다'
    where: '질문 2'
  - topic: '치르는 값: 컴파일러가 검사하지 못해 실행 중에 터진다, 느리다, 캡슐화를 넘는다'
    where: '질문 2'
  - topic: '모듈이 막아 둔 JDK 내부에는 setAccessible이 실패한다'
    where: '질문 2의 더 알아보기'
  - topic: '어노테이션은 코드에 붙이는 표시(메타데이터)이고 그 자체로는 아무 일도 하지 않는다. 읽는 코드가 있어야 한다'
    where: '질문 3'
  - topic: '어노테이션 직접 만들기: @interface, 요소와 기본값, @Target'
    where: '질문 3'
  - topic: '@Retention 세 가지(SOURCE, CLASS, RUNTIME). RUNTIME만 실행 중에 리플렉션으로 읽힌다. 기본값은 CLASS다'
    where: '질문 3'
  - topic: '컴파일할 때 어노테이션을 읽어 코드를 만드는 방식(어노테이션 프로세서, 롬복)'
    where: '질문 3의 더 알아보기'
  - topic: '스프링이 어노테이션으로 일하는 방법: 클래스를 찾고, 표시를 읽고, 리플렉션으로 객체를 만들고 주입한다'
    where: '질문 4'
  - topic: '어노테이션에 붙은 어노테이션(메타 어노테이션): @Service 안의 @Component. 자바의 isAnnotationPresent는 한 단계만 본다'
    where: '질문 4, 실무에서는'
  - topic: 'JPA와 Jackson이 인자 없는 생성자를 요구하는 이유'
    where: '질문 4'
  - topic: '스프링에서 직접 만든 어노테이션을 인터셉터로 읽기'
    where: '실무에서는. 인터셉터의 동작은 필터와 인터셉터(S7)'
  - topic: 'TypeReference가 지워진 제네릭 타입을 알아내는 방법(getGenericSuperclass)'
    where: '실무에서는'
  - topic: '매개변수 이름은 -parameters 옵션으로 컴파일해야 클래스 파일에 남는다'
    where: '실무에서는의 더 알아보기'
  - topic: '실행 중에 인터페이스의 구현을 만들어 내는 동적 프록시'
    where: '다루지 않음: 프록시와 데코레이터 패턴(O12), AOP(S9)'
  - topic: '스프링 컨테이너와 컴포넌트 스캔, 주입의 규칙'
    where: '다루지 않음: 스프링 빈과 의존성 주입(S2)'
  - topic: '클래스가 읽히는 과정과 클래스 로더'
    where: '다루지 않음: 자바 프로그램이 실행되는 과정(J1)'
  - topic: '타입 소거'
    where: '다루지 않음: 제네릭(J11)'
codes:
  predict: |-
    @interface LoginRequired {}

    class OrderController {
      @LoginRequired
      public String myOrders() { return "..."; }
    }

    Method m = OrderController.class
        .getMethod("myOrders");
    System.out.println(
        m.isAnnotationPresent(LoginRequired.class));
  inspect: |-
    Class<?> c = OrderService.class;

    for (Field f : c.getDeclaredFields()) {
      print(f.getType().getSimpleName()
          + " " + f.getName());
    }
  setField: |-
    class OrderService {
      private OrderRepository repo;
    }

    OrderService service = new OrderService();
    Field f = OrderService.class
        .getDeclaredField("repo");
    [[f.setAccessible(true)]];
    f.set(service, new OrderRepository());
  retention: |-
    @Retention(RetentionPolicy.RUNTIME)
    @Target(ElementType.METHOD)
    @interface LoginRequired {}
  container: |-
    Object create(Class<?> type) throws Exception {
      Object bean = type
          .getDeclaredConstructor().newInstance();

      for (Field f : type.getDeclaredFields()) {
        if (f.isAnnotationPresent(Inject.class)) {
          f.setAccessible(true);
          f.set(bean, create(f.getType()));
        }
      }
      return bean;
    }
predict:
  text: '코드 predict는 어노테이션 `@LoginRequired`를 만들어 메서드에 붙이고, 그 메서드에 어노테이션이 붙어 있는지 실행 중에 물어봐요. 무엇이 출력될까요? 보기: true, false, 컴파일 오류.'
  answer: 'false. 어노테이션을 선언할 때 얼마나 오래 남길지를 적지 않으면 클래스 파일까지만 남고, 실행 중에는 읽을 수 없다. 질문 3에서 밝힌다.'
questions:
  - id: q1
    title: 리플렉션은 무엇인가요?
    conclusion:
      lead: '실행 중인 프로그램이 클래스의 정보(필드, 메서드, 생성자, 어노테이션)를 들여다보는 기능이에요.'
      sub: 'JVM은 읽어 온 클래스마다 그 정보를 담은 `Class` 객체를 하나씩 두고, 리플렉션은 그 객체에서 출발해요.'
    says:
      - '보통의 코드는 `service.order()`처럼 컴파일할 때 이미 아는 클래스와 메서드를 쓴다. 리플렉션은 "이 클래스에 어떤 필드가 있지?"를 실행 중에 묻는다'
      - '`Class` 객체를 얻는 세 가지. 클래스 이름으로 `OrderService.class`, 객체에서 `service.getClass()`, 문자열로 `Class.forName("lab.OrderService")`. 셋째는 컴파일할 때 그 클래스를 몰라도 된다'
      - '같은 클래스의 `Class` 객체는 하나다. 세 방법으로 얻은 것이 `==`로 같다'
      - '코드 inspect. `getDeclaredFields()`는 그 클래스에 선언된 필드를 `private`까지 모두 준다. 타입과 이름이 출력된다. `getDeclaredMethods()`, `getDeclaredConstructors()`, `getSuperclass()`, `getAnnotations()`도 같은 식이다'
      - '`getFields()`처럼 Declared가 없는 메서드는 `public`인 것만, 대신 부모에게 물려받은 것까지 준다'
      - '`getClass()`는 변수의 타입이 아니라 실제 객체의 클래스를 준다(J7). `Notifier n = new SmsNotifier();`에서 `n.getClass()`는 `SmsNotifier`다'
    asks:
      - '본문의 예시: `OrderService`에 `private OrderRepository repo;` 필드 하나가 있다. `OrderService.class.getDeclaredFields().length`와 `OrderService.class.getFields().length`는 각각 얼마인가 (1과 0. `getFields`는 public만 준다)'
      - '옮긴 상황: `Object o = "주문";`일 때 `o.getClass() == String.class`의 결과는 무엇인가 (true. 실제 객체의 클래스를 준다)'
  - id: q2
    title: 리플렉션으로 무엇을 할 수 있고, 무엇을 치르나요?
    conclusion:
      lead: '이름만으로 객체를 만들고, 메서드를 부르고, `private` 필드까지 읽고 쓸 수 있어요. 대신 컴파일러의 검사를 받지 못해서 틀린 것이 실행 중에야 드러나요.'
      sub: '컴파일할 때 몰랐던 클래스를 다룰 수 있다는 점 때문에 프레임워크가 쓰고, 같은 이유로 애플리케이션 코드에서는 꼭 필요할 때만 써요.'
    says:
      - '객체 만들기: `type.getDeclaredConstructor().newInstance()`. 메서드 부르기: `method.invoke(target, 인자)`. `new`와 점(`.`)으로 하던 일을 이름으로 한다'
      - '코드 setField. `repo`는 `private`이라 밖에서 `service.repo = ...`는 컴파일 오류다. 리플렉션으로는 `setAccessible(true)`를 부른 뒤 값을 넣을 수 있다. `setAccessible`을 빼면 `IllegalAccessException`이다'
      - '이것이 스프링이 setter도 없는 `@Autowired private` 필드에 객체를 넣는 방법이다'
      - '쓰임. 프레임워크는 내 클래스를 미리 알 수 없다. 스프링, JPA, Jackson, JUnit은 모두 내가 만든 클래스를 실행 중에 받아 리플렉션으로 다룬다'
      - '치르는 값 1: 오류가 뒤로 밀린다. 필드 이름에 오타가 있으면 컴파일은 되고 실행 중에 `NoSuchFieldException`이 난다. 이름을 바꾸는 리팩터링도 문자열은 따라오지 않는다'
      - '치르는 값 2: 느리다. 직접 부르는 것보다 여러 단계를 거친다. 그래서 프레임워크는 읽은 정보를 시작할 때 한 번 모아 두고 다시 쓴다'
      - '치르는 값 3: `private`으로 지키려던 것을 넘는다. 클래스를 만든 사람이 바뀌지 않는다고 믿은 상태가 바뀔 수 있다'
      - '더 알아보기: 자바 9의 모듈부터 JDK 내부 클래스의 `private`에는 `setAccessible`이 `InaccessibleObjectException`으로 실패한다. 내 애플리케이션의 클래스에는 그대로 된다'
    asks:
      - '본문의 예시: 코드 setField에서 `f.setAccessible(true)` 줄을 지우고 실행하면 어떻게 되나. 조건: 이 코드는 `OrderService`가 아닌 다른 클래스에 있다 (`f.set`에서 `IllegalAccessException`)'
      - '옮긴 상황: `OrderService.class.getDeclaredField("repoo")`처럼 없는 이름을 넘겼다. 이 실수는 컴파일할 때 드러나나, 실행할 때 드러나나 (실행할 때 `NoSuchFieldException`으로 드러난다)'
  - id: q3
    title: 어노테이션은 무엇이고, 실행 중에 읽으려면 무엇이 필요한가요?
    conclusion:
      lead: '어노테이션은 코드에 붙이는 표시일 뿐 스스로는 아무 일도 하지 않고, 실행 중에 읽으려면 `@Retention(RetentionPolicy.RUNTIME)`으로 선언해야 해요.'
      sub: '남는 기간을 적지 않으면 클래스 파일까지만 남아서, 리플렉션으로 물어보면 붙어 있지 않다고 나와요.'
    says:
      - '어노테이션은 클래스, 메서드, 필드에 붙이는 정보다. 붙였다고 동작이 바뀌지 않는다. 누군가 그 표시를 읽고 행동해야 한다. 읽는 쪽은 컴파일러(`@Override`), 빌드 도구, 또는 실행 중의 프레임워크다'
      - '만들기. `@interface LoginRequired {}`. 값을 받으려면 요소를 둔다. `String role() default "USER";`는 `@LoginRequired(role = "ADMIN")`처럼 쓴다. 요소의 이름이 `value`면 이름을 생략할 수 있다'
      - '`@Target`은 붙일 수 있는 곳(클래스, 메서드, 필드)을 정한다. 다른 곳에 붙이면 컴파일 오류다'
      - '`@Retention`은 어디까지 남길지를 정한다. `SOURCE`는 컴파일하면 사라진다. `CLASS`는 클래스 파일에는 남지만 JVM이 실행 중에 알려 주지 않는다. `RUNTIME`은 실행 중에 리플렉션으로 읽힌다'
      - '코드 predict에는 `@Retention`이 없다. 기본값은 `CLASS`다. 그래서 `isAnnotationPresent`가 false다. 오류도 경고도 없다. 예측의 답을 밝힌다. 도입부의 인터셉터가 통과시킨 이유다'
      - '코드 retention처럼 `RUNTIME`으로 바꾸면 true가 된다. `m.getAnnotation(LoginRequired.class).role()`로 요소의 값도 읽는다'
      - '더 알아보기: `SOURCE`인 어노테이션은 컴파일할 때 읽힌다. 롬복의 `@Getter`는 컴파일 중에 메서드를 만들어 넣고 사라진다. 그래서 실행 중에는 롬복이 없어도 된다'
    asks:
      - '본문의 예시: 코드 predict의 어노테이션 선언을 코드 retention으로 바꾼 뒤 다시 실행하면 무엇이 출력되나 (true)'
      - '옮긴 상황: `@Retention(RetentionPolicy.SOURCE) @interface Todo {}`를 클래스에 붙이고 실행 중에 `Foo.class.isAnnotationPresent(Todo.class)`를 부르면 결과는 무엇인가 (false. 컴파일하면 사라진다)'
      - '실무 구역: 인터셉터가 `handlerMethod.getMethodAnnotation(LoginRequired.class) != null`일 때만 로그인을 확인한다. `@LoginRequired`에 `@Retention`을 적지 않았다. 이 어노테이션이 붙은 메서드로 온 로그인하지 않은 요청은 어떻게 되나 (통과한다. 실행 중에는 어노테이션이 보이지 않아 null이 나온다)'
  - id: q4
    title: 스프링은 어노테이션을 어떻게 읽어서 일하나요?
    conclusion:
      lead: '시작할 때 클래스들을 훑어 어노테이션이 붙은 것을 찾고, 리플렉션으로 객체를 만들고, 어노테이션이 붙은 필드와 생성자에 다른 객체를 넣어 줘요.'
      sub: '질문 2의 리플렉션과 질문 3의 어노테이션을 이어 붙인 것이고, 같은 일을 하는 코드를 직접 쓸 수 있어요.'
    says:
      - '코드 container. 받은 클래스의 인자 없는 생성자로 객체를 만든다. 필드를 훑어 `@Inject`가 붙은 것을 찾는다. 그 필드의 타입으로 다시 `create`를 불러 만든 객체를 `setAccessible` 뒤에 넣는다. 이것이 의존성 주입의 뼈대다'
      - '`create(OrderService.class)`를 부르면 `OrderService`가 만들어지고 그 `private` 필드에 `OrderRepository`가 들어 있다. 어디에서도 `new OrderRepository()`를 쓰지 않았다'
      - '스프링이 더 하는 것: 패키지를 훑어 `@Component`가 붙은 클래스를 찾는다(컴포넌트 스캔). 만든 객체를 하나만 두고 다시 쓴다. 생성자의 인자로도 넣는다. 자세한 것은 S2다'
      - '같은 방식으로 일하는 것들. 스프링 MVC는 `@GetMapping`이 붙은 메서드를 찾아 두고 요청이 오면 `invoke`로 부른다. JPA는 `@Entity` 클래스의 인자 없는 생성자로 객체를 만들고 필드에 열의 값을 넣는다. 엔티티에 인자 없는 생성자가 필요한 이유다. JUnit은 `@Test`가 붙은 메서드를 찾아 부른다'
      - '메타 어노테이션. `@Service`를 열어 보면 그 선언에 `@Component`가 붙어 있다. 어노테이션에 붙은 어노테이션이다. 스프링은 이것까지 따라가서 `@Service`를 `@Component`로 알아본다'
      - '자바의 `isAnnotationPresent(Component.class)`는 직접 붙은 것만 본다. `@Service`만 붙은 클래스에는 false다. 스프링은 자기 도구(`AnnotatedElementUtils`)로 어노테이션의 어노테이션까지 찾는다. 그래서 `@RestController`, `@GetMapping`처럼 여러 어노테이션을 묶은 어노테이션을 만들 수 있다'
    widget:
      kind: steps
      note: '코드 container가 `create(OrderService.class)`를 처리하는 과정을 한 단계씩 넘긴다. 왼쪽 칸은 "읽은 클래스 정보"(필드와 붙은 어노테이션), 오른쪽 칸은 "만들어진 객체"다. 단계: OrderService의 생성자로 객체 생성(repo는 null), 필드를 훑어 @Inject가 붙은 repo 발견, repo의 타입 OrderRepository로 create를 다시 부름, OrderRepository 객체 생성, setAccessible 뒤 OrderService의 repo에 넣음, 완성된 객체 반환. 로그에는 단계마다 부른 리플렉션 메서드를 적는다'
    asks:
      - '본문의 예시: `OrderService`의 `repo` 필드에서 `@Inject`를 지우고 `create(OrderService.class)`를 부르면 반환된 객체의 `repo`는 무엇인가 (null. 표시가 없는 필드는 건너뛴다)'
      - '옮긴 상황: `@Service`만 붙은 클래스 `PayService`에 대해 `PayService.class.isAnnotationPresent(Component.class)`의 결과는 무엇인가. 조건: 스프링의 `@Service` 선언에는 `@Component`가 붙어 있다 (false. 자바의 이 메서드는 직접 붙은 어노테이션만 본다)'
practice:
  says:
    - '직접 만든 어노테이션을 스프링에서 읽기. 코드 retention의 `@LoginRequired`를 컨트롤러 메서드에 붙인다. `HandlerInterceptor`의 `preHandle`에서 `handler`가 `HandlerMethod`면 `getMethodAnnotation(LoginRequired.class)`로 읽어, 있으면 세션을 확인하고 없으면 401로 답한다. 인터셉터를 등록하는 법과 실행 위치는 S7에 넘긴다 (컨트롤러와 인터셉터 하나를 띄워 요청하는 테스트. 본보기는 `SpringSessionPracticeTest`)'
    - '흔한 실수: 어노테이션을 만들며 `@Retention(RetentionPolicy.RUNTIME)`을 빠뜨린다. 컴파일도 되고 붙이는 것도 되지만 인터셉터에는 보이지 않아 검사가 통째로 꺼진다. 예외가 나지 않아서 로그인 없이 통과하는 요청을 보고서야 안다. 고친 코드: 코드 retention. 고치기 전과 뒤의 상태 코드를 붙인다 (위 테스트를 어노테이션 둘로 돌린다)'
    - '어노테이션 묶기. `@Target(METHOD) @Retention(RUNTIME) @GetMapping @LoginRequired @interface MyGet`처럼 자주 함께 쓰는 것을 하나로 묶을 수 있다. 스프링이 메타 어노테이션을 따라가기 때문이다. `AnnotatedElementUtils.hasAnnotation(PayService.class, Component.class)`가 true인 것으로 확인한다 (스프링 코어만 쓰는 순수 자바 테스트)'
    - 'J11에서 미뤄 둔 것. `new TypeReference<List<OrderDto>>() {}`는 익명 클래스를 만든다. 클래스의 선언에 적힌 부모의 타입 인자는 지워지지 않고 클래스 파일에 남는다. `getClass().getGenericSuperclass()`로 `TypeReference<List<OrderDto>>`를 읽을 수 있고, Jackson이 여기서 `List<OrderDto>`를 꺼낸다. 지워지는 것은 객체가 가진 타입 인자이고, 선언에 적힌 것은 남는다 (순수 자바 테스트로 읽은 타입을 출력한다)'
    - '애플리케이션 코드에서 리플렉션을 직접 쓸 일은 드물다. 쓰게 되면 필드 이름 문자열에 기대지 말고 어노테이션이나 인터페이스로 찾는다. 테스트에서 `private` 필드를 바꾸려고 쓰고 싶어지면 생성자 주입으로 바꾼다'
    - '더 알아보기: 메서드의 매개변수 이름은 `-parameters` 옵션으로 컴파일해야 클래스 파일에 남는다. `@RequestParam String name`에서 이름을 생략할 수 있는 것이 이 덕분이고, 스프링 부트의 Gradle 플러그인이 이 옵션을 켜 준다 (스프링 부트 공식 문서 근거)'
claims:
  - claim: '세 방법으로 얻은 `Class` 객체는 `==`로 같다. `getDeclaredFields`는 private 필드를 포함하고 `getFields`는 포함하지 않는다'
    how: '`OrderService`로 세 방법을 비교하고 두 메서드의 길이를 본다'
  - claim: '`setAccessible(true)` 뒤에는 다른 클래스의 private 필드에 값을 넣을 수 있고, 부르지 않으면 `IllegalAccessException`이 난다'
    how: '코드 setField를 두 가지로 돌린다'
  - claim: '없는 필드 이름은 `NoSuchFieldException`을 던진다'
    how: '그대로 돌린다'
  - claim: '`@Retention`을 적지 않은 어노테이션과 `SOURCE`인 어노테이션은 `isAnnotationPresent`가 false이고, `RUNTIME`이면 true이며 요소의 값을 읽을 수 있다'
    how: '어노테이션 셋을 만들어 메서드에 붙이고 읽는다'
  - claim: '코드 container로 `create(OrderService.class)`를 부르면 `repo`가 채워진 객체가 나오고, `@Inject`를 지우면 null이다'
    how: '두 클래스 모양으로 돌린다'
  - claim: '`@Service`만 붙은 클래스에 `isAnnotationPresent(Component.class)`는 false이고 `AnnotatedElementUtils.hasAnnotation(..., Component.class)`는 true다 (스프링 프레임워크 6.2)'
    how: '그대로 돌린다'
  - claim: '`RUNTIME`인 `@LoginRequired`가 붙은 메서드로 온 로그인하지 않은 요청은 401을 받고, `@Retention`을 적지 않은 어노테이션이면 200을 받는다'
    how: '컨트롤러 하나와 인터셉터 하나만 띄운 작은 스프링 부트 앱에 요청한다'
  - claim: '`TypeReference`의 익명 자식 클래스에서 `getGenericSuperclass()`로 `List<OrderDto>`를 읽을 수 있다'
    how: '`ParameterizedType`의 실제 타입 인자를 출력한다'
sources:
  - '`Class`와 리플렉션: API 문서 https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/lang/Class.html'
  - '`setAccessible`과 모듈의 제한: `AccessibleObject` API 문서 https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/lang/reflect/AccessibleObject.html'
  - '어노테이션 선언과 요소: 자바 언어 명세 9.6 https://docs.oracle.com/javase/specs/jls/se21/html/jls-9.html#jls-9.6'
  - '`@Retention`과 기본값 CLASS: API 문서 https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/lang/annotation/Retention.html'
  - '`isAnnotationPresent`가 보는 범위: `AnnotatedElement` API 문서 https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/lang/reflect/AnnotatedElement.html'
  - '스프링의 메타 어노테이션과 묶은 어노테이션: 스프링 프레임워크 문서 https://docs.spring.io/spring-framework/reference/core/beans/classpath-scanning.html'
  - '`HandlerMethod.getMethodAnnotation`: 스프링 프레임워크 API 문서 https://docs.spring.io/spring-framework/docs/current/javadoc-api/org/springframework/web/method/HandlerMethod.html'
  - '엔티티의 인자 없는 생성자: 자카르타 퍼시스턴스 명세 2.1 https://jakarta.ee/specifications/persistence/3.1/jakarta-persistence-spec-3.1.html#a18'
