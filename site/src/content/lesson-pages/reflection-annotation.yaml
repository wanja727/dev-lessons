# 리플렉션과 어노테이션
# 자료 파일의 칸은 docs/lesson-data-format.md에 있다. 문제는 content/questions/reflection-annotation.yaml에 있다.
title: 리플렉션과 어노테이션
description: 리플렉션이 무엇인지, 리플렉션으로 무엇을 할 수 있고 무엇을 치르는지, 어노테이션을 실행 중에 읽으려면 무엇이 필요한지, 스프링은 어노테이션을 어떻게 읽어서 일하는지. 네 가지 질문에 스스로 답할 수 있게, 의존성 주입을 흉내 낸 작은 컨테이너를 직접 만들며 배우는 대화형 레슨.
unit: 자바 언어
minutes: 22
roadmap: J17
type: 자바 실행
prerequisites:
  - {slug: inheritance-polymorphism, title: 상속과 다형성}
assume: '자바 21. JVM이 클래스를 읽어 온다는 것(자바 프로그램이 실행되는 과정 레슨). `private` 필드는 클래스 밖에서 쓸 수 없다는 것. 스프링에서 `@Service`나 `@Autowired`를 붙여 본 적이 있으면 좋지만 없어도 돼요.'
example: '주문 서비스 `OrderService`와 그것이 쓰는 `OrderRepository`. 두 클래스에 직접 만든 어노테이션 `@Inject`를 붙이고, 그것을 읽어 객체를 만들고 이어 주는 작은 컨테이너를 10줄쯤으로 만들어요. 실무 구역에서는 스프링의 인터셉터가 읽는 `@LoginRequired`로 옮겨요.'
intro:
  - '로그인한 사용자만 부를 수 있게 하려고 `@LoginRequired`라는 어노테이션을 만들어 컨트롤러 메서드에 붙였어요. 인터셉터도 만들었어요. 그런데 로그인하지 않은 요청이 그대로 통과해요. 인터셉터가 메서드를 보면 어노테이션이 붙어 있지 않다고 나와요.'
  - '스프링 개발자가 쓰는 코드의 절반은 어노테이션이에요. `@Service`, `@Autowired`, `@Transactional`, `@Entity`가 그래요. 이 표시들은 스스로 아무 일도 하지 않아요. 스프링이 실행 중에 내 클래스를 들여다보고 표시를 읽어서 일해요. 그 들여다보는 방법이 리플렉션이에요. 이것을 알면 스프링이 마법이 아니라 읽을 수 있는 코드가 돼요.'
  - '이 레슨에서는 리플렉션으로 `private` 필드에 값을 넣어 보고, 어노테이션을 직접 만들어 읽어 보고, 둘을 이어 붙여 스프링의 의존성 주입을 흉내 낸 작은 컨테이너를 만들어요.'
covers:
  - topic: 'Class 객체: JVM이 읽은 클래스마다 하나씩 있는, 그 클래스의 정보를 담은 객체. 얻는 세 가지 방법'
    where: '질문 1'
  - topic: '리플렉션으로 볼 수 있는 것: 필드, 메서드, 생성자, 부모와 인터페이스, 붙은 어노테이션'
    where: '질문 1'
  - topic: '리플렉션으로 할 수 있는 것: 이름으로 객체 만들기, 메서드 부르기, private 필드 읽고 쓰기(setAccessible)'
    where: '질문 2'
  - topic: '컴파일할 때 모르던 클래스를 다룰 수 있다는 것이 프레임워크가 내 코드를 다루는 방법이다'
    where: '질문 2'
  - topic: '치르는 값: 컴파일러가 검사하지 못해 실행 중에 터진다, 느리다, 캡슐화를 넘는다'
    where: '질문 2'
  - topic: '모듈이 막아 둔 JDK 내부에는 setAccessible이 실패한다'
    where: '질문 2의 더 알아보기'
  - topic: '어노테이션은 코드에 붙이는 표시(메타데이터)이고 그 자체로는 아무 일도 하지 않는다. 읽는 코드가 있어야 한다'
    where: '질문 3'
  - topic: '어노테이션 직접 만들기: @interface, 요소와 기본값, @Target'
    where: '질문 3'
  - topic: '@Retention 세 가지(SOURCE, CLASS, RUNTIME). RUNTIME만 실행 중에 리플렉션으로 읽힌다. 기본값은 CLASS다'
    where: '질문 3'
  - topic: '컴파일할 때 어노테이션을 읽어 코드를 만드는 방식(어노테이션 프로세서, 롬복)'
    where: '질문 3의 더 알아보기'
  - topic: '스프링이 어노테이션으로 일하는 방법: 클래스를 찾고, 표시를 읽고, 리플렉션으로 객체를 만들고 주입한다'
    where: '질문 4'
  - topic: '어노테이션에 붙은 어노테이션(메타 어노테이션): @Service 안의 @Component. 자바의 isAnnotationPresent는 한 단계만 본다'
    where: '질문 4, 실무에서는'
  - topic: 'JPA와 Jackson이 인자 없는 생성자를 요구하는 이유'
    where: '질문 4'
  - topic: '스프링에서 직접 만든 어노테이션을 인터셉터로 읽기'
    where: '실무에서는. 인터셉터의 동작은 필터와 인터셉터(S7)'
  - topic: 'TypeReference가 지워진 제네릭 타입을 알아내는 방법(getGenericSuperclass)'
    where: '실무에서는'
  - topic: '매개변수 이름은 -parameters 옵션으로 컴파일해야 클래스 파일에 남는다'
    where: '실무에서는의 더 알아보기'
  - topic: '실행 중에 인터페이스의 구현을 만들어 내는 동적 프록시'
    where: '다루지 않음: 프록시와 데코레이터 패턴(O12), AOP(S9)'
  - topic: '스프링 컨테이너와 컴포넌트 스캔, 주입의 규칙'
    where: '다루지 않음: 스프링 빈과 의존성 주입(S2)'
  - topic: '클래스가 읽히는 과정과 클래스 로더'
    where: '다루지 않음: 자바 프로그램이 실행되는 과정(J1)'
  - topic: '타입 소거'
    where: '다루지 않음: 제네릭(J11)'
codes:
  predict: |-
    @interface LoginRequired {}

    class OrderController {
      @LoginRequired
      public String myOrders() {
        return "...";
      }
    }

    Method m = OrderController.class
        .getMethod("myOrders");
    System.out.println(
        m.isAnnotationPresent(
            LoginRequired.class));
  getClass: |-
    OrderService.class
    service.getClass()
    Class.forName(
        "lab.devlessons.OrderService")
  inspect: |-
    Class<?> c = OrderService.class;

    for (Field f : c.getDeclaredFields()) {
      print(f.getType().getSimpleName()
          + " " + f.getName());
    }
  classRun: |-
    // 세 방법으로 얻은 Class를 비교하고
    // 필드의 수를 센다
    c.getDeclaredFields().length;
    c.getFields().length;
  setField: |-
    class OrderService {
      private OrderRepository repo;
    }

    OrderService service = new OrderService();
    Field f = OrderService.class
        .getDeclaredField("repo");
    [[f.setAccessible(true)]];
    f.set(service, new OrderRepository());
  setFieldRun: |-
    // 1. setAccessible 없이 f.set(...)
    // 2. setAccessible(true) 뒤 f.set(...)
  typo: |-
    OrderService.class
        .getDeclaredField([["repoo"]]);
  retention: |-
    [[@Retention(RetentionPolicy.RUNTIME)]]
    @Target(ElementType.METHOD)
    @interface LoginRequired {
      String role() default "USER";
    }
  retentionRun: |-
    // 남는 기간만 다른 어노테이션 셋을
    // 메서드에 붙이고 실행 중에 묻는다
    m.isAnnotationPresent(...);
    m.getAnnotation(LoginRequired.class)
        .role();
  container: |-
    Object create(Class<?> type)
        throws Exception {
      Object bean = type
          .getDeclaredConstructor()
          .newInstance();

      for (Field f : type.getDeclaredFields()) {
        if (f.[[isAnnotationPresent]](
            Inject.class)) {
          f.setAccessible(true);
          f.set(bean, [[create(f.getType())]]);
        }
      }
      return bean;
    }
  containerTarget: |-
    class OrderService {
      @Inject
      private OrderRepository repo;

      String order() {
        return repo.save();
      }
    }
  containerRun: |-
    OrderService s = (OrderService)
        create(OrderService.class);
    s.order();
  service: |-
    @Target(ElementType.TYPE)
    @Retention(RetentionPolicy.RUNTIME)
    @Documented
    [[@Component]]
    public @interface Service { ... }
  metaRun: |-
    @Service
    class PayService { }

    PayService.class.isAnnotationPresent(
        Component.class);
    AnnotatedElementUtils.hasAnnotation(
        PayService.class, Component.class);
  interceptor: |-
    class LoginInterceptor
        implements HandlerInterceptor {
      public boolean preHandle(
          HttpServletRequest req,
          HttpServletResponse res,
          Object handler) {
        if (handler instanceof
            HandlerMethod m
            && m.[[getMethodAnnotation(]]
                LoginRequired.class) != null
            && !loggedIn(req)) {
          res.setStatus(401);
          return false;
        }
        return true;
      }
    }
  controller: |-
    @GetMapping("/orders/mine")
    @LoginRequired
    String myOrders() {
      return "내 주문 목록";
    }
  interceptorRun: |-
    // 로그인하지 않고
    GET /orders/mine
    // @LoginRequired를 두 가지로 선언해
    // 각각 띄운다
  composed: |-
    @Target(ElementType.METHOD)
    @Retention(RetentionPolicy.RUNTIME)
    @GetMapping
    @LoginRequired
    @interface MemberGet {
      @AliasFor(annotation = GetMapping.class)
      String[] value() default {};
    }
  typeRef: |-
    TypeReference<List<OrderDto>> ref =
        new TypeReference<>() [[{}]];

    ref.getClass().getGenericSuperclass();
