predict:
  title: 한 바이트씩과 버퍼로
  text: '1MB 파일을 `FileInputStream.read()`로 한 바이트씩 읽는 코드와, 같은 코드를 `BufferedInputStream`으로 감싼 코드가 있어요. 두 코드는 똑같이 `read()`로 한 바이트씩 받아요. 시간은 어떻게 다를까요? 답은 질문 3에 나와요.'
  code: predict
  label: 내 예측
  options:
    - value: same
      label: 거의 같다
    - value: faster
      label: 버퍼 쪽이 몇 배에서 수십 배 빠르다
    - value: slower
      label: 버퍼 쪽이 느리다
