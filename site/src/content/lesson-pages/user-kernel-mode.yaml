# 사용자 모드와 커널 모드
# 자료 파일의 칸은 docs/lesson-data-format.md에 있다. 문제는 content/questions/user-kernel-mode.yaml에 있다.
title: 사용자 모드와 커널 모드
description: CPU는 왜 사용자 모드와 커널 모드를 나누는지, 시스템 콜은 무엇이고 자바 코드에서는 어디서 일어나는지, 입출력은 왜 비싸고 버퍼는 어떻게 빠르게 하는지. 같은 파일을 한 바이트씩과 8KB씩 읽어 시간을 재 보며 배우는 대화형 레슨.
unit: 운영체제와 동시성
minutes: 16
roadmap: C11
type: 개념 설명
prerequisites:
  - {slug: context-switching, title: 컨텍스트 스위칭}
assume: '자바 21(OpenJDK). 커널이 스레드를 바꾸고 레지스터를 저장한다는 것(컨텍스트 스위칭 레슨). 파일을 `FileInputStream`으로 읽는 문법.'
example: '1MB 파일을 읽어 바이트 수를 세는 코드. 한 바이트씩 읽을 때와 버퍼로 8KB씩 읽을 때, 운영체제에게 부탁하는 횟수(시스템 콜)가 얼마나 다르고 시간이 얼마나 다른지 재요. 실무 구역에서는 로그 출력과 DB 배치로 옮겨요.'
intro:
  - '대용량 CSV를 읽는 배치가 너무 느려서 들여다보니 `FileInputStream.read()`로 한 바이트씩 읽고 있었어요. `BufferedInputStream`으로 감싸기만 했는데 수십 배 빨라졌어요. 디스크는 그대로인데 무엇이 달라진 걸까요?'
  - '자바 개발자가 파일, 소켓, 로그를 다루는 코드는 결국 운영체제에게 "읽어 줘, 써 줘"라고 부탁해요. 그 부탁에는 매번 정해진 비용이 들어서, 같은 양을 몇 번에 나눠 부탁하느냐가 성능을 크게 바꿔요. 버퍼, 배치, 커넥션 재사용이 모두 이 비용을 줄이는 방법이에요.'
  - '이 레슨에서는 같은 파일을 한 바이트씩 읽을 때와 8KB씩 읽을 때의 시간을 재고, 출력도 버퍼 없이 쓸 때와 모아서 쓸 때를 비교해요.'
covers:
  - topic: 'CPU의 두 모드: 사용자 모드는 할 수 있는 명령과 닿을 수 있는 메모리가 제한되고, 커널 모드는 모든 것을 할 수 있다'
    where: '질문 1'
  - topic: '나누는 이유: 프로그램이 장치를 직접 다루거나 남의 메모리를 건드리지 못하게 막는다. 잘못된 프로그램 하나가 시스템 전체를 망가뜨리지 않는다'
    where: '질문 1'
  - topic: '자바 코드와 JVM은 사용자 모드에서 돈다'
    where: '질문 1'
  - topic: '시스템 콜: 사용자 프로그램이 커널에게 일을 부탁하는 정해진 입구(read, write, open, socket). 부를 때 커널 모드로 바뀌고 끝나면 돌아온다'
    where: '질문 2'
  - topic: '자바의 입출력 메서드는 결국 시스템 콜을 부른다. FileInputStream.read()는 부를 때마다 read 시스템 콜이다'
    where: '질문 2'
  - topic: '모드 전환과 컨텍스트 스위칭은 다르다. 시스템 콜은 같은 스레드가 커널에 들어갔다 나오는 것이다. 다만 입출력을 기다리면 그 사이에 스레드가 바뀐다'
    where: '질문 2'
  - topic: '입출력이 비싼 이유: 시스템 콜의 고정 비용, 사용자 영역과 커널 영역 사이의 복사, 장치를 기다리는 시간'
    where: '질문 3'
  - topic: '버퍼로 모아서 부르면 시스템 콜 수가 줄어 빨라진다. BufferedInputStream, BufferedWriter의 기본 버퍼 8KB'
    where: '질문 3'
  - topic: '다 쓴 뒤 flush하지 않으면 버퍼의 내용이 나가지 않는다'
    where: '질문 3'
  - topic: '인터럽트와 예외도 커널 모드로 들어가는 길이다(페이지 폴트)'
    where: '질문 1의 더 알아보기. 페이지 폴트는 가상 메모리(C10)'
  - topic: '커널을 덜 거치는 기법: 제로 카피(transferTo), 메모리 맵 파일'
    where: '질문 3의 더 알아보기'
  - topic: '로그 출력, JDBC 배치, 커넥션 재사용이 같은 원리다'
    where: '실무에서는'
  - topic: 'strace로 시스템 콜 세기'
    where: '실무에서는. 리눅스 도구는 리눅스 기초(T8)'
codes:
  predict: |-
    // 1MB 파일
    try (var in = new FileInputStream(f)) {
      while (in.read() != -1) count++;
    }
    // 같은 파일을
    try (var in = new BufferedInputStream(
        new FileInputStream(f))) {
      while (in.read() != -1) count++;
    }
  unbuffered: |-
    try (var in = new FileInputStream(f)) {
      while (in.[[read()]] != -1) count++;
    }
  buffered: |-
    try (var in = new BufferedInputStream(
        new FileInputStream(f))) {
      while (in.read() != -1) count++;
    }
  write: |-
    try (var out = new FileOutputStream(f)) {
      for (int i = 0; i < 100_000; i++)
        out.write(line(i));
    }
  writeBuffered: |-
    try (var out = new BufferedWriter(
        new FileWriter(f))) {
      for (int i = 0; i < 100_000; i++)
        out.write(lineText(i));
    }
