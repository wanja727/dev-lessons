# 프로세스와 스레드 (설계서)
# 자료 파일의 칸은 docs/lesson-data-format.md에 있다.
stage: design
title: 프로세스와 스레드
unit: 운영체제와 동시성
roadmap: C1
type: 자바 실행
prerequisites:
  - {slug: jvm-memory, title: JVM 메모리 구조}
assume: '자바 21(OpenJDK). 객체는 힙에, 지역 변수는 스레드마다 있는 스택에 놓인다는 것(JVM 메모리 구조 레슨). 람다로 `Runnable`을 넘기는 문법.'
example: '방문 수를 세는 `static int count`와 그것을 올리는 스레드 둘. 자바 프로그램 두 개(프로세스 둘)와 한 프로그램 안의 스레드 둘이 같은 변수를 어떻게 보는지 비교해요. 실무 구역에서는 톰캣의 요청 처리 스레드와 싱글톤 빈의 필드로 옮겨요.'
intro:
  - '방문 수를 세는 서비스의 필드에 `count++`를 넣었어요. 혼자 눌러 볼 때는 정확한데, 부하 테스트로 요청 1만 개를 보내자 9천 몇백이 찍혀요. 코드는 한 줄인데 요청이 동시에 들어오면 값이 사라져요.'
  - '스프링 서버는 요청 하나를 스레드 하나가 처리하고, 그 스레드들은 한 프로세스의 메모리를 함께 써요. 싱글톤 빈의 필드, static 변수, 캐시로 쓰는 맵이 모두 함께 쓰는 쪽에 있어요. 무엇을 함께 쓰고 무엇을 따로 가지는지 알아야 어디서 문제가 나는지 짚을 수 있어요.'
  - '이 레슨에서는 자바 프로그램을 하나 더 띄워 프로세스끼리는 변수를 나누지 않는 것을 보고, 한 프로그램 안의 스레드 둘이 같은 변수를 고칠 때 값이 사라지는 것을 직접 돌려 확인해요.'
covers:
  - topic: '프로그램과 프로세스: 실행 중인 프로그램이 프로세스다. 운영체제가 프로세스마다 메모리와 PID를 따로 준다. JVM 하나가 프로세스 하나다'
    where: '질문 1'
  - topic: '프로세스끼리는 메모리를 공유하지 않는다. 한 프로세스가 변수를 바꿔도 다른 프로세스는 모른다. 주고받으려면 파일, 소켓 같은 통로(IPC)를 쓴다'
    where: '질문 1'
  - topic: '스레드: 한 프로세스 안에서 코드를 실행하는 흐름. 프로세스는 스레드를 하나 이상 가진다(main 스레드)'
    where: '질문 1'
  - topic: '프로세스를 여럿 쓸 때와 스레드를 여럿 쓸 때의 차이: 만드는 비용, 한쪽이 죽을 때의 영향, 데이터를 나누는 방법'
    where: '질문 1'
  - topic: '스레드가 공유하는 것(힙, static 필드, 메서드 영역)과 따로 가지는 것(스택, 지역 변수, PC)'
    where: '질문 2. J14에서 받은 항목'
  - topic: '람다 안에서 지역 변수를 바꿀 수 없는 이유와 스레드'
    where: '질문 2의 더 알아보기. 람다의 문법은 람다와 함수형 인터페이스(J12)'
  - topic: '스레드를 만들고 시작하기: Thread와 Runnable, start()와 run()의 차이, join()으로 끝나길 기다리기'
    where: '질문 3'
  - topic: '스레드가 실행되는 순서는 정해져 있지 않다'
    where: '질문 3'
  - topic: '데몬 스레드와 JVM이 끝나는 조건'
    where: '질문 3의 더 알아보기'
  - topic: '공유 메모리의 문제: count++는 읽기, 더하기, 쓰기 세 단계라서 두 스레드가 겹치면 갱신이 사라진다'
    where: '질문 4. 막는 방법은 경쟁 상태와 동기화(C3)'
  - topic: '스프링 MVC는 요청마다 톰캣의 스레드 하나가 처리한다. 스레드 이름 http-nio-8080-exec-N, 기본 최대 200개'
    where: '실무에서는. 톰캣이 요청을 스레드에 맡기는 방법은 서블릿과 톰캣(S1)'
  - topic: '싱글톤 빈에 요청마다 바뀌는 값을 필드로 두면 요청끼리 섞인다'
    where: '실무에서는. 빈의 스코프는 빈의 생명주기와 스코프(S3)'
  - topic: 'CPU 하나가 여러 스레드를 번갈아 돌리는 방법'
    where: '다루지 않음: 컨텍스트 스위칭(C2)'
  - topic: '프로세스마다 주소 공간이 따로인 원리'
    where: '다루지 않음: 가상 메모리(C10)'
  - topic: '스레드를 미리 만들어 두고 다시 쓰기'
    where: '다루지 않음: 스레드 풀(C7)'
codes:
  predict: |-
    static int count = 0;

    Runnable inc = () -> {
      for (int i = 0; i < 1_000_000; i++)
        count++;
    };
    Thread a = new Thread(inc);
    Thread b = new Thread(inc);
    a.start(); b.start();
    a.join();  b.join();
    System.out.println(count);
  childProcess: |-
    // 부모 JVM
    static int count = 0;

    // 자식 JVM을 띄워 count = 100으로 바꾼다
    Process child = new ProcessBuilder(
        "java", "Child").start();
    child.waitFor();
    System.out.println(count);
  shared: |-
    static int count = 0;

    Thread a = new Thread(() -> count = 100);
    a.start();
    a.join();
    System.out.println(count);
  startRun: |-
    Runnable job = () -> System.out.println(
        Thread.currentThread().getName());

    new Thread(job, "worker").run();
    new Thread(job, "worker").start();
  serviceField: |-
    @Service
    class VisitService {
      private int count = 0;

      int visit() {
        return ++count;
      }
    }
predict:
  text: '코드 predict는 스레드 둘이 같은 `count`를 100만 번씩 올리고 둘이 끝나길 기다려 출력해요. 출력은 무엇일까요? 보기: 정확히 2000000 / 2000000보다 작은 값 / 1000000'
  answer: '2000000보다 작은 값. 실행할 때마다 달라진다. 질문 4에서 밝힌다.'
questions:
  - id: q1
    title: 프로세스와 스레드는 무엇이 다른가요?
    conclusion:
      lead: '프로세스는 운영체제가 메모리를 따로 떼어 주는 실행 중인 프로그램이고, 스레드는 한 프로세스 안에서 그 메모리를 함께 쓰며 코드를 실행하는 흐름이에요.'
      sub: '그래서 프로세스끼리는 변수를 나누지 않고, 같은 프로세스의 스레드끼리는 같은 객체를 함께 봐요.'
    says:
      - '실행 중인 프로그램이 프로세스다. `java -jar app.jar`로 띄운 JVM 하나가 프로세스 하나다. 운영체제는 프로세스마다 번호(PID)와 메모리 공간을 따로 준다'
      - '코드 childProcess. 자바 프로그램 안에서 자식 JVM을 하나 더 띄워 같은 이름의 static 변수를 100으로 바꾸게 한다. 부모의 `count`는 그대로 0이다. 두 PID도 다르다. 실제 출력으로 보인다'
      - '프로세스끼리 데이터를 주고받으려면 파일, 소켓, 파이프 같은 통로를 따로 쓴다(프로세스 간 통신, IPC)'
      - '스레드는 프로세스 안에서 코드를 실행하는 흐름이다. 프로그램이 시작되면 `main` 스레드 하나가 있고, 스레드를 더 만들 수 있다. 같은 프로세스의 스레드는 그 프로세스의 메모리를 함께 쓴다'
      - '나란히 놓는다: 만드는 비용(프로세스는 메모리 공간을 새로 만들어 무겁고 스레드는 가볍다), 한쪽이 죽을 때(프로세스는 서로 영향이 없고, 스레드에서 프로세스가 죽으면 모든 스레드가 함께 끝난다), 데이터 나누기(프로세스는 IPC, 스레드는 같은 객체를 바로 본다)'
      - '예: 브라우저는 탭마다 프로세스를 따로 두어 한 탭이 죽어도 다른 탭이 산다. 스프링 서버는 프로세스 하나에 스레드 여럿을 두어 요청을 처리한다'
    widget:
      kind: compare
      note: '왼쪽은 프로세스 둘(JVM 둘), 오른쪽은 한 프로세스의 스레드 둘. 항목은 메모리, PID, count 변수. 버튼 "한쪽에서 count = 100"을 누르면 왼쪽은 자기 count만 100이 되고, 오른쪽은 두 스레드가 보는 count가 함께 100이 된다'
    asks:
      - '본문의 예시: 자식 JVM이 자기의 static `count`를 100으로 바꾸고 끝났다. 부모 JVM의 `count`(처음 0)는 무엇인가 (0. 프로세스끼리는 메모리를 공유하지 않는다)'
      - '옮긴 상황: 한 스레드에서 처리하던 요청 때문에 프로세스가 죽었다. 같은 서버 프로세스의 다른 요청 스레드들은 어떻게 되나 (함께 끝난다. 스레드는 프로세스에 딸려 있다)'
  - id: q2
    title: 같은 프로세스의 스레드는 무엇을 함께 쓰고 무엇을 따로 가지나요?
    conclusion:
      lead: '힙의 객체와 static 필드는 함께 쓰고, 스택에 놓이는 지역 변수는 스레드마다 따로 가져요.'
      sub: 'JVM 메모리 구조 레슨의 힙과 스택이 그대로 스레드의 공유와 분리가 돼요.'
    says:
      - '코드 shared. 다른 스레드가 static `count`를 100으로 바꾸면 main 스레드가 읽는 값도 100이다. 같은 변수를 보기 때문이다'
      - '함께 쓰는 것: 힙의 객체(같은 객체를 가리키면 같은 객체), static 필드, 메서드 영역의 클래스 정보. 프로세스가 연 파일과 소켓'
      - '따로 가지는 것: 스택(지역 변수, 매개변수, 호출 기록), 지금 실행하는 위치(PC), 스레드의 이름과 상태'
      - '지역 변수는 다른 스레드가 볼 수 없다. 같은 메서드를 두 스레드가 동시에 실행해도 지역 변수는 각자의 프레임에 있어 섞이지 않는다. 테스트로 두 스레드가 같은 메서드에서 지역 변수를 1만 번 올리면 둘 다 정확히 1만이다'
      - '다만 지역 변수가 가리키는 객체는 힙에 있다. 두 스레드의 지역 변수가 같은 객체를 가리키면 그 객체는 함께 쓰는 것이다'
      - '더 알아보기: 람다 안에서는 바깥 지역 변수를 바꿀 수 없다(effectively final). 람다가 다른 스레드에서 실행될 수 있는데 지역 변수는 만든 스레드의 스택에 있기 때문이다. 그래서 람다에서 세려고 필드나 배열을 쓰게 되고, 그것은 힙이라 함께 쓰는 것이 된다'
    asks:
      - '본문의 예시: 두 스레드가 같은 메서드 `int countLocal() { int n = 0; for (...) n++; return n; }`을 동시에 1만 번씩 돌린다. 각 스레드가 돌려받는 값은 (둘 다 10000. 지역 변수는 스레드마다 따로다)'
      - '옮긴 상황: 두 스레드가 각자 지역 변수 `list`를 갖지만 둘 다 같은 싱글톤 빈의 `getItems()`가 돌려준 리스트를 받았다. 이 리스트는 함께 쓰는 것인가 (함께 쓴다. 변수는 따로지만 가리키는 객체는 힙의 같은 것이다)'
  - id: q3
    title: 스레드는 어떻게 만들고 실행하나요?
    conclusion:
      lead: '할 일을 `Runnable`로 넘겨 `Thread`를 만들고 `start()`를 불러야 새 스레드에서 실행돼요.'
      sub: '`run()`을 직접 부르면 부른 스레드에서 그냥 메서드로 실행돼요. 끝나길 기다리려면 `join()`을 부르고, 스레드끼리의 실행 순서는 정해져 있지 않아요.'
    says:
      - '`new Thread(runnable)`로 만들고 `start()`로 시작한다. `start()`는 JVM에게 새 스레드를 만들어 달라고 하고 바로 돌아온다. 새 스레드가 `run()`을 실행한다'
      - '코드 startRun. `run()`을 직접 부르면 새 스레드가 생기지 않는다. 출력되는 스레드 이름이 `main`이다. `start()`는 `worker`다. 실제 출력으로 보인다'
      - '`join()`은 그 스레드가 끝날 때까지 부른 스레드를 기다리게 한다. 코드 predict에서 `join()`을 빼면 두 스레드가 일하는 중에 출력해서 0이나 중간 값이 나온다'
      - '실행 순서는 정해져 있지 않다. A를 먼저 `start()`해도 B가 먼저 끝날 수 있다. 운영체제의 스케줄러가 정한다(C2)'
      - '한 스레드에서 `start()`를 두 번 부르면 `IllegalThreadStateException`이다'
      - '더 알아보기: JVM은 데몬이 아닌 스레드가 모두 끝나야 끝난다. `setDaemon(true)`로 만든 스레드는 기다리지 않는다. main이 끝나도 다른 스레드가 일하는 동안 프로그램이 끝나지 않는 이유다'
    asks:
      - '본문의 예시: 코드 startRun의 두 줄은 각각 어떤 이름을 출력하나 (`run()`은 main, `start()`는 worker)'
      - '옮긴 상황: 스레드 A와 B를 차례로 `start()`하고 `join()` 없이 바로 결과 리스트를 출력했다. A와 B는 각각 리스트에 값 하나를 넣는다. 출력의 크기로 맞는 것은 (0, 1, 2 가운데 무엇이든 나올 수 있다. 기다리지 않았다)'
  - id: q4
    title: 스레드가 메모리를 함께 쓰면 무엇이 문제인가요?
    conclusion:
      lead: '두 스레드가 같은 값을 동시에 고치면 한쪽의 갱신이 사라질 수 있어요.'
      sub: '`count++`는 한 줄이지만 읽기, 더하기, 쓰기 세 단계라서, 두 스레드가 같은 값을 읽고 각자 더해 쓰면 하나만 남아요.'
    says:
      - '예측의 답을 밝힌다. 코드 predict는 2000000보다 작은 값을 출력하고, 실행할 때마다 값이 다르다. 실제 출력에 세 번 돌린 값을 보인다'
      - '`count++`는 세 단계다: 메모리에서 count를 읽는다, 1을 더한다, 메모리에 쓴다. 스레드 A가 5를 읽고 아직 쓰기 전에 B도 5를 읽으면 둘 다 6을 쓴다. 두 번 더했는데 하나만 남는다(갱신 손실)'
      - '이런 결과가 실행 순서에 따라 달라지는 상황을 경쟁 상태라고 한다. 막는 방법(synchronized, AtomicInteger)은 C3에서 다룬다. 여기서는 맛보기로 `AtomicInteger`로 바꾸면 정확히 2000000이 나오는 것만 보인다'
      - '드물게 나는 것이 더 위험하다. 혼자 눌러 보는 개발 환경에서는 거의 겹치지 않다가 요청이 몰리는 운영에서 드러난다'
    widget:
      kind: steps
      note: 'count = 5에서 스레드 A와 B가 `count++`를 한 번씩 한다. 시나리오 "따로": A가 읽기, 더하기, 쓰기를 마친 뒤 B가 한다. 결과 7. 시나리오 "겹침": A 읽기(5), B 읽기(5), A 쓰기(6), B 쓰기(6). 결과 6. duo의 두 칸은 스레드 A와 B의 지역 값, 아래 줄에 메모리의 count'
    asks:
      - '본문의 예시: count가 5일 때 두 스레드가 거의 동시에 `count++`를 한 번씩 했다. 끝난 뒤 count로 나올 수 있는 값을 모두 고르면 (6 또는 7)'
      - '옮긴 상황: 좋아요 수를 `likes = likes + 1`로 올리는 코드를 스레드 10개가 100번씩 실행했다. 결과로 맞는 것은 (1000 이하. 1000이 나올 수도 있지만 보장되지 않는다)'
      - '실무 구역: 코드 serviceField의 `visit()`을 요청 스레드 여럿이 동시에 부른다. 요청 1만 번 뒤 count는 (1만 이하. 싱글톤 빈의 필드는 모든 요청 스레드가 함께 쓴다)'
practice:
  title: 스프링 서버에서는 이렇게 만나요
  says:
    - '스프링 MVC는 요청마다 톰캣의 스레드 하나가 처리한다. 스레드 이름은 `http-nio-8080-exec-1`처럼 나온다. 최대 개수는 `server.tomcat.threads.max`(기본 200). 작은 웹 앱(MiniWeb)을 띄워 동시 요청 둘의 스레드 이름이 다른 것을 테스트로 남긴다'
    - '싱글톤 빈은 힙에 하나 있고 모든 요청 스레드가 함께 쓴다(질문 2). 그래서 빈의 필드는 모든 요청이 함께 쓰는 변수다'
    - '흔한 실수: 코드 serviceField처럼 요청마다 바뀌는 값(방문 수, 현재 사용자, 계산 중인 합계)을 빈의 필드에 둔다. 요청이 겹치면 값이 사라지거나 다른 사람 값이 섞인다. 고친 코드: 요청마다 다른 값은 메서드의 지역 변수나 매개변수로 넘긴다. 정말 함께 세야 하는 값이면 `AtomicLong`(C3)이나 DB에 둔다. 스레드 둘로 `visit()`을 부르는 테스트로 고치기 전과 뒤를 비교한다'
    - '로그의 스레드 이름으로 어느 요청이 어느 스레드에서 돌았는지 본다. 로그백의 기본 패턴에 스레드 이름이 들어 있다'
claims:
  - claim: '자식 JVM이 static 변수를 바꿔도 부모 JVM의 같은 변수는 그대로이고, 두 프로세스의 PID가 다르다'
    how: '`ChildJvm`으로 자식을 띄워 출력과 PID를 비교한다'
    test: ProcessAndThreadTest.processesDoNotShareMemory
  - claim: '다른 스레드가 static 변수에 쓴 값을 join 뒤 main 스레드가 그대로 읽는다'
    how: '코드 shared를 돌린다'
    test: ProcessAndThreadTest.threadsShareHeap
  - claim: '같은 메서드를 두 스레드가 동시에 실행해도 지역 변수는 따로다'
    how: '두 스레드가 같은 메서드에서 지역 변수를 1만 번 올리고 결과를 비교한다'
  - claim: '`run()`은 부른 스레드에서, `start()`는 새 스레드에서 실행된다'
    how: '코드 startRun의 스레드 이름을 모은다'
  - claim: '`start()`를 두 번 부르면 `IllegalThreadStateException`이다'
    how: '같은 스레드 객체에 두 번 부른다'
  - claim: '동기화 없이 두 스레드가 count++를 100만 번씩 하면 2000000보다 작은 값이 나올 수 있다'
    how: '최대 10번 돌려 한 번이라도 작은 값이 나오는지 본다. 값을 `CiOutput`에 남긴다'
    test: ProcessAndThreadTest.lostUpdate
  - claim: '`AtomicInteger`로 바꾸면 정확히 2000000이다'
    how: '같은 반복을 `incrementAndGet`으로 한다'
    test: ProcessAndThreadTest.atomicIsExact
  - claim: '스프링 MVC에서 동시에 들어온 두 요청은 서로 다른 톰캣 스레드가 처리한다'
    how: '`MiniWeb`으로 스레드 이름을 돌려주는 컨트롤러를 띄우고 래치로 두 요청을 겹치게 해 이름을 비교한다'
  - claim: '싱글톤 빈의 필드를 여러 스레드가 올리면 요청 수보다 작아질 수 있고, `AtomicLong`이면 정확하다'
    how: '같은 서비스 객체의 `visit()`을 스레드 여럿이 부른다'
sources:
  - '프로세스와 스레드의 정의: 자바 튜토리얼 https://docs.oracle.com/javase/tutorial/essential/concurrency/procthread.html'
  - '스레드와 공유 변수: 자바 언어 명세 17장 https://docs.oracle.com/javase/specs/jls/se21/html/jls-17.html'
  - '`Thread`의 start, run, join, 데몬: API 문서 https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/lang/Thread.html'
  - '`server.tomcat.threads.max`: 스프링 부트 속성 목록 https://docs.spring.io/spring-boot/appendix/application-properties/index.html'
