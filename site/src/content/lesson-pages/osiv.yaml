# OSIV
# 자료 파일의 칸은 docs/lesson-data-format.md에 있다. 문제는 content/questions/osiv.yaml에 있다.
title: OSIV
description: OSIV가 무엇을 요청 끝까지 열어 두는지, 켜면 컨트롤러에서 무엇이 되는지, 켜 두면 무엇을 잃는지, 컨트롤러에서 바꾼 엔티티는 어떻게 되는지, 끄면 지연 로딩을 어디서 끝내는지. 다섯 가지 질문에 스스로 답할 수 있게, 같은 컨트롤러를 OSIV를 켠 앱과 끈 앱에서 불러 보는 대화형 레슨.
unit: JPA
minutes: 20
roadmap: P6
type: 동작 확인
prerequisites:
  - {slug: proxy-lazy-loading, title: 프록시와 지연 로딩}
  - {slug: transactional-proxy, title: '@Transactional 동작 원리'}
  - {slug: connection-pool, title: DB 커넥션과 커넥션 풀}
assume: '스프링 부트 3.5, Hibernate 6.6, PostgreSQL 16, HikariCP. 영속성 컨텍스트가 닫히면 LAZY 프록시를 초기화할 수 없다는 것(프록시와 지연 로딩 레슨), `@Transactional`은 서비스 메서드를 감싼다는 것(@Transactional 동작 원리 레슨), 커넥션은 풀에서 빌려 쓰고 돌려준다는 것(커넥션 풀 레슨).'
example: '선수 `OsivPlayer`가 팀을 LAZY로 가리킨다. 컨트롤러는 서비스에서 선수를 받아 팀 이름을 돌려준다. `spring.jpa.open-in-view`를 켜고 끄며 같은 요청을 보낸다.'
intro:
  - '스프링 부트로 만든 API를 처음 띄우면 로그에 `spring.jpa.open-in-view is enabled by default`라는 경고가 나와요. 그대로 두면 컨트롤러에서 지연 로딩이 잘 되는데, 트래픽이 몰리는 날 커넥션 풀이 바닥나 요청이 줄줄이 실패해요. 둘은 같은 설정 하나 때문이에요.'
  - 'OSIV는 스프링 부트에서 기본으로 켜져 있어요. 개발자는 켜 둘지 끌지 정하고, 끄면 지연 로딩을 어디서 끝낼지 코드 구조로 정해야 해요. 면접에서는 "OSIV가 무엇이고 왜 끄라고 하나요"를 물어요.'
  - '이 레슨에서는 같은 컨트롤러를 OSIV를 켠 앱과 끈 앱에서 불러, 지연 로딩이 되는지, 서비스가 끝난 뒤에도 커넥션을 쥐고 있는지, 컨트롤러에서 바꾼 값이 저장되는지 확인해요.'
covers:
  - topic: 'OSIV(Open Session In View)는 영속성 컨텍스트를 요청이 시작될 때 열어 응답이 끝날 때 닫는다. 스프링 부트에서는 `OpenEntityManagerInViewInterceptor`가 한다'
    where: '질문 1'
  - topic: 'OSIV를 켜도 트랜잭션의 범위는 그대로 서비스 메서드다. 열려 있는 것은 영속성 컨텍스트다'
    where: '질문 1'
  - topic: '스프링 부트는 `spring.jpa.open-in-view`의 기본값이 true이고, 직접 적지 않으면 시작할 때 경고 로그를 남긴다'
    where: '질문 1, 실무에서는'
  - topic: 'OSIV를 켜면 트랜잭션이 끝난 뒤에도 컨트롤러와 뷰에서 지연 로딩이 된다. 끄면 `LazyInitializationException`이 난다'
    where: '질문 2'
  - topic: 'OSIV를 켜면 영속성 컨텍스트가 DB 커넥션을 요청이 끝날 때까지 쥔다. 서비스가 끝난 뒤 외부 API를 부르거나 응답이 느리면 그동안 커넥션이 풀로 돌아가지 않는다'
    where: '질문 3'
  - topic: '요청이 몰리면 커넥션 풀이 바닥나고 다른 요청이 커넥션을 기다리다 실패한다'
    where: '질문 3. 풀의 동작은 DB 커넥션과 커넥션 풀(D6)'
  - topic: 'OSIV를 켜면 컨트롤러에서 바꾼 엔티티가 영속 상태로 남아, 같은 요청의 다른 쓰기 트랜잭션이 커밋될 때 함께 저장된다'
    where: '질문 4'
  - topic: 'OSIV를 끄면 지연 로딩은 서비스의 트랜잭션 안에서 끝낸다. 서비스가 DTO를 돌려주거나 fetch join으로 가져온다'
    where: '질문 5'
  - topic: '조회를 맡는 서비스(쿼리 서비스)를 따로 두어 화면에 맞는 조회를 모은다'
    where: '질문 5의 더 알아보기'
  - topic: '켜 둘 때와 끌 때를 고르는 기준: 관리자 화면처럼 트래픽이 적고 뷰 템플릿이 엔티티를 그리면 켜 두기도 한다. API 서버는 끈다'
    where: '실무에서는'
  - topic: '트랜잭션 전파와 다른 트랜잭션의 커밋'
    where: '다루지 않음: 트랜잭션 전파와 롤백 규칙(S11)'
  - topic: '외부 API 호출의 타임아웃'
    where: '다루지 않음: 타임아웃과 재시도 (시스템 설계와 아키텍처 과정)'
links:
  onTest: https://github.com/wanja727/dev-lessons/blob/main/verification/src/test/java/lab/devlessons/osiv/OsivOnTest.java
  offTest: https://github.com/wanja727/dev-lessons/blob/main/verification/src/test/java/lab/devlessons/osiv/OsivOffTest.java
  props: https://docs.spring.io/spring-boot/reference/data/sql.html#data.sql.jpa-and-spring-data.open-entity-manager-in-view
  interceptor: https://docs.spring.io/spring-framework/docs/current/javadoc-api/org/springframework/orm/jpa/support/OpenEntityManagerInViewInterceptor.html
codes:
  connRun: |-
    @GetMapping("/connections")
    int connections(
        @PathVariable Long id) {
      service.findPlayer(id);
      // 서비스가 끝난 직후, 사용 중인 커넥션
      return pool.getActiveConnections();
    }
  renameOnly: |-
    @PostMapping("/players/{id}/rename")
    String rename(@PathVariable Long id,
        @RequestParam String name) {
      service.findPlayer(id).rename(name);
      return "ok";
    }
  ctrlDto: |-
    @GetMapping("/players/{id}/team-name")
    String teamName(@PathVariable Long id) {
      return service.findView(id)
          .teamName();
    }
  predict: |-
    @GetMapping("/players/{id}/team-name")
    String teamName(@PathVariable Long id) {
      Player player =
          service.findPlayer(id);
      return player.getTeam().getName();
    }
  service: |-
    @Transactional
    public Player findPlayer(Long id) {
      return players
          .findById(id).orElseThrow();
    }
  slow: |-
    @GetMapping("/players/{id}")
    PlayerView show(@PathVariable Long id) {
      Player p = service.findPlayer(id);
      String photo =
          photoApi.fetch(p.getName());
      return new PlayerView(p, photo);
    }
  rename: |-
    @PostMapping("/players/{id}/preview")
    String preview(@PathVariable Long id,
        @RequestParam String name) {
      Player p = service.findPlayer(id);
      p.rename(name); // 화면에만 보이려고
      service.recordVisit();
      return "ok";
    }
  yml: |-
    spring:
      jpa:
        open-in-view: false
  dto: |-
    @Transactional(readOnly = true)
    public PlayerView findView(Long id) {
      Player p = players
          .findById(id).orElseThrow();
      return new PlayerView(p.getName(),
          p.getTeam().getName());
    }
predict:
  title: 이 컨트롤러는 팀 이름을 돌려줄까요?
  text: '컨트롤러가 서비스에서 선수 엔티티를 받아 팀 이름을 돌려줘요. 서비스의 메서드에만 `@Transactional`이 있고, 선수의 팀은 지연 로딩(LAZY)이에요. 설정을 하나도 바꾸지 않은 스프링 부트 앱에서 이 요청은 어떻게 될까요? 모르는 게 정상이니 감으로 골라 보세요. 답은 질문 2에 나와요.'
  code: predict
  label: 내 예측
  options:
    - {value: ok, label: 팀 이름을 돌려준다}
    - {value: lazy, label: LazyInitializationException이 난다}
    - {value: 'null', label: 팀 이름 대신 null을 돌려준다}
  answer: ok
  storageKey: osiv-predict
  wrong: 예측은 "{label}"이었어요. 틀린 예측이 더 오래 남으니 괜찮아요.
questions:
  - id: q1
    title: OSIV는 무엇을 요청 끝까지 열어 두나요?
    conclusion:
      lead: '영속성 컨텍스트를 요청이 들어올 때 열고 응답이 끝날 때 닫아요.'
      sub: '트랜잭션은 그대로 서비스 메서드 안에서만 열리고 닫혀요. 트랜잭션이 끝난 뒤에도 남아 있는 것은 영속성 컨텍스트와 그것이 쥔 커넥션이에요.'
    says:
      - 'OSIV를 끄면 영속성 컨텍스트는 트랜잭션과 함께 열리고 닫힌다(P2). 켜면 스프링 MVC의 인터셉터(`OpenEntityManagerInViewInterceptor`)가 요청 시작에 미리 열고, 서비스의 트랜잭션은 그것을 받아 쓴다. 트랜잭션이 커밋돼도 컨텍스트는 닫히지 않는다'
      - '시간 축 그림으로 비교한다: 요청 시작, 서비스 트랜잭션 시작과 끝, 컨트롤러로 돌아옴, 응답 끝. 켰을 때와 껐을 때 컨텍스트가 열린 구간이 다르다'
      - '스프링 부트는 `spring.jpa.open-in-view`를 적지 않으면 true로 두고 시작 로그에 경고를 남긴다. 이 저장소의 테스트 앱은 false로 적어 두었다'
      - '이름의 "View"는 서버가 HTML을 그리던 시절, 뷰 템플릿에서 엔티티의 연관을 읽게 하려고 만들어졌다는 뜻이다'
    widget:
      kind: toggle
      note: 'OSIV 켜짐과 꺼짐을 고른다. 요청의 시간 축(필터, 컨트롤러 진입, 서비스 트랜잭션, 컨트롤러로 복귀, 응답) 위에 영속성 컨텍스트와 커넥션이 열린 구간을 막대로 보인다. `gantt` 조각을 쓴다. 질문 2와 3에서 이 위젯을 가리킨다'
    asks:
      - '본문의 예시: OSIV를 켠 앱에서 서비스의 `@Transactional` 메서드가 끝났다. 이 순간 트랜잭션과 영속성 컨텍스트는 각각 어떤 상태인가 (트랜잭션은 커밋되어 끝났고 영속성 컨텍스트는 열려 있다)'
      - '옮긴 상황: `application.yml`에 `open-in-view`를 적지 않은 스프링 부트 3 앱을 띄웠다. OSIV는 켜져 있나, 꺼져 있나 (켜져 있다. 기본값이 true이고 시작할 때 경고를 남긴다)'
    body:
      - p: '[프록시와 지연 로딩](lesson:proxy-lazy-loading)에서 영속성 컨텍스트는 트랜잭션과 함께 열리고 닫혔어요. 서비스 메서드가 끝나면 닫혀서, 컨트롤러에서는 프록시를 초기화할 수 없었어요.'
      - p: '**OSIV**(Open Session In View)는 영속성 컨텍스트를 **요청이 들어올 때 열고 응답이 끝날 때 닫는** 설정이에요. 스프링 MVC의 인터셉터 `OpenEntityManagerInViewInterceptor`가 컨트롤러보다 먼저 영속성 컨텍스트를 열어 두고, 서비스의 트랜잭션은 열려 있는 그것을 받아 써요.'
      - p: '**트랜잭션의 범위는 그대로예요.** 서비스 메서드가 끝나면 트랜잭션은 커밋돼요. 남아 있는 것은 영속성 컨텍스트와, 그것이 쥔 DB 커넥션이에요. 켜고 끄며 무엇이 언제 열려 있는지 보세요.'
      - widget:
          kind: toggle
          layout: [selector, legend, gantt, verdict]
          selector:
            label: spring.jpa.open-in-view
            options:
              - {value: 'off', label: 꺼짐 (false)}
              - {value: 'on', label: 켜짐 (true. 기본값)}
          legend:
            - {kind: hold, label: 열려 있음}
            - {kind: api, label: 컨트롤러가 외부 API를 기다림}
          scenes:
            'off':
              gantt:
                total: 2.1
                axis: [0초, 1.05초, 2.1초]
                rows:
                  - {label: 트랜잭션, bars: [{kind: hold, from: 0, to: 0.05}]}
                  - {label: 영속성 컨텍스트, bars: [{kind: hold, from: 0, to: 0.05}]}
                  - {label: 커넥션, bars: [{kind: hold, from: 0, to: 0.05}]}
                  - {label: 컨트롤러, bars: [{kind: api, from: 0.05, to: 2.05}]}
              verdict: '세 가지가 모두 서비스의 트랜잭션과 함께 닫혀요. 컨트롤러는 커넥션 없이 외부 API를 기다려요.'
            'on':
              gantt:
                total: 2.1
                axis: [0초, 1.05초, 2.1초]
                rows:
                  - {label: 트랜잭션, bars: [{kind: hold, from: 0, to: 0.05}]}
                  - {label: 영속성 컨텍스트, bars: [{kind: hold, from: 0, to: 2.1}]}
                  - {label: 커넥션, bars: [{kind: hold, from: 0, to: 2.1}]}
                  - {label: 컨트롤러, bars: [{kind: api, from: 0.05, to: 2.05}]}
              verdict: '트랜잭션은 똑같이 짧아요. 그런데 영속성 컨텍스트와 커넥션은 응답이 끝날 때까지 열려 있어요.'
      - p: '스프링 부트에서 `spring.jpa.open-in-view`의 기본값은 **true**예요. 설정에 이 값을 적지 않으면 앱이 뜰 때 "spring.jpa.open-in-view is enabled by default"로 시작하는 경고를 남겨요. 이 저장소의 테스트 앱은 false로 적어 두었어요.'
      - muted: '이름의 View는 서버가 HTML을 그리던 시절의 흔적이에요. 뷰 템플릿이 엔티티의 연관을 읽을 수 있게 하려고 만든 설정이에요.'
      - quiz:
          q: 'OSIV를 켠 앱에서 서비스의 `@Transactional` 메서드가 막 끝났어요. 이 순간 트랜잭션과 영속성 컨텍스트는 각각 어떤 상태일까요?'
          options:
            - 둘 다 열려 있다
            - 트랜잭션은 끝났고 영속성 컨텍스트는 열려 있다
            - 둘 다 닫혔다
          answer: 2
          explain: 'OSIV는 트랜잭션의 범위를 바꾸지 않아요. 영속성 컨텍스트만 요청 끝까지 열어 둬요.'
      - next: '영속성 컨텍스트가 컨트롤러에서도 열려 있다면, 처음 예측한 컨트롤러는 어떻게 될까요?'
    recall: '영속성 컨텍스트를 요청이 들어올 때 열고 응답이 끝날 때 닫아요. 스프링 MVC의 인터셉터가 미리 열어 두고 서비스의 트랜잭션이 그것을 받아 써요. 트랜잭션은 그대로 서비스 메서드 안에서만 열리고 닫혀요. 스프링 부트는 이 설정이 기본으로 켜져 있고, 적지 않으면 시작할 때 경고를 남겨요.'
  - id: q2
    title: OSIV를 켜면 컨트롤러에서 무엇이 되나요?
    conclusion:
      lead: '트랜잭션이 끝난 뒤에도 컨트롤러에서 지연 로딩이 돼요.'
      sub: '프록시를 초기화할 영속성 컨텍스트가 아직 열려 있기 때문이에요. 끄면 같은 코드에서 `LazyInitializationException`이 나요.'
    says:
      - '코드 predict를 OSIV를 켠 앱에서 부르면 "레드"가 돌아온다. 끈 앱에서 부르면 `LazyInitializationException`이 난다. 테스트 둘의 결과를 실제 출력으로 나란히 보인다. 예측의 답을 밝힌다'
      - '켠 앱에서 팀 SELECT는 컨트롤러에서 나간다. 트랜잭션 밖이므로 자동 커밋 모드로 실행된다'
      - '그래서 OSIV를 켜면 엔티티를 컨트롤러와 응답 JSON까지 넘겨도 동작한다. 편하지만, 어디서 SQL이 나갈지 서비스 코드만 봐서는 모르게 된다'
    asks:
      - '본문의 예시: OSIV를 끈 앱에서 코드 predict를 부르면 어떻게 되나 (`LazyInitializationException`. 서비스가 끝날 때 영속성 컨텍스트도 닫혔다)'
      - '옮긴 상황: OSIV를 켠 앱의 주문 상세 컨트롤러가 서비스에서 받은 주문 엔티티를 그대로 JSON으로 돌려준다. 주문의 회원은 LAZY다. 응답에 회원 정보가 들어가나 (들어간다. 잭슨이 회원을 읽을 때 열린 영속성 컨텍스트로 초기화한다)'
    body:
      - p: '처음 예측한 컨트롤러와, 그것이 부르는 서비스예요.'
      - code: predict
      - code: service
      - p: '같은 요청을 OSIV를 켠 앱과 끈 앱에 보냈어요.'
      - ci:
          key: on-team-name
          label: OSIV 켜짐의 실제 결과
          source: OsivOnTest.lazyLoadingInControllerWorks
      - ci:
          key: off-team-name
          label: OSIV 꺼짐의 실제 결과
          source: OsivOffTest.lazyLoadingInControllerFails
      - p: '설정을 바꾸지 않은 스프링 부트 앱, 곧 OSIV가 켜진 앱은 **팀 이름을 돌려줘요**. {{predict-result}} 서비스의 트랜잭션은 끝났지만 영속성 컨텍스트가 열려 있어서, 컨트롤러에서 팀 프록시를 초기화할 수 있었어요. 팀 SELECT는 트랜잭션 밖인 컨트롤러에서 나가요.'
      - p: '끈 앱에서는 서비스가 끝날 때 영속성 컨텍스트도 닫혀서 `LazyInitializationException`이 났어요.'
      - p: '그래서 OSIV를 켜면 엔티티를 컨트롤러와 응답 JSON까지 넘겨도 동작해요. 편하지만, 서비스 코드만 봐서는 SQL이 어디서 몇 번 나갈지 알 수 없게 돼요. 응답을 만드는 잭슨이 연관을 읽으며 SQL을 보내기도 하니까요.'
      - quiz:
          q: 'OSIV를 켠 앱의 주문 상세 컨트롤러가 서비스에서 받은 주문 엔티티를 그대로 JSON으로 돌려줘요. 주문의 회원은 LAZY예요. 응답에 회원 정보가 들어갈까요?'
          options:
            - 들어간다
            - LazyInitializationException이 난다
            - 회원 자리가 null로 나간다
          answer: 1
          explain: '잭슨이 회원을 읽을 때 열려 있는 영속성 컨텍스트로 프록시를 초기화해요. 그 SELECT는 컨트롤러 쪽에서 나가요.'
      - next: '켜면 편해요. 그런데 왜 많은 팀이 이 설정을 끌까요? 질문 1의 위젯에서 커넥션 막대를 다시 보세요.'
    recall: '트랜잭션이 끝난 뒤에도 컨트롤러와 뷰에서 지연 로딩이 돼요. 프록시를 초기화할 영속성 컨텍스트가 응답이 끝날 때까지 열려 있기 때문이에요. 끄면 같은 코드에서 `LazyInitializationException`이 나요. 대신 켜면 SQL이 서비스 밖에서도 나가 어디서 몇 번 나가는지 보기 어려워져요.'
  - id: q3
    title: OSIV를 켜 두면 무엇을 잃나요?
    conclusion:
      lead: '영속성 컨텍스트가 요청이 끝날 때까지 DB 커넥션을 쥐고 있어서, 동시에 처리할 수 있는 요청 수가 줄어요.'
      sub: '서비스가 끝난 뒤 외부 API를 부르거나 응답이 느리면 그동안 커넥션이 놀아요. 요청이 몰리면 풀이 바닥나 다른 요청이 커넥션을 기다리다 실패해요.'
    says:
      - '영속성 컨텍스트는 처음 DB를 쓸 때 커넥션을 빌리고 닫힐 때 돌려준다. OSIV를 켜면 닫히는 때가 응답 끝이다. 서비스가 끝난 직후 풀의 사용 중 커넥션 수를 읽은 테스트: 켜면 1, 끄면 0. 실제 출력으로 보인다'
      - '코드 slow. 서비스가 끝난 뒤 사진 API를 2초 부르면, 켠 앱에서는 그 2초 동안 커넥션이 DB 일을 하지 않으면서 풀에서 빠져 있다'
      - '계산으로 보인다: 풀 크기 10, 요청 하나가 서비스 50ms와 외부 호출 2초를 쓴다. 끄면 커넥션을 50ms씩만 쓰니 초당 200개까지 처리하고, 켜면 2초 넘게 쥐니 초당 5개 남짓이다. 나머지는 커넥션을 기다리다 시간 초과로 실패한다(D6)'
    asks:
      - '본문의 예시: OSIV를 끈 앱에서 서비스의 `@Transactional` 메서드가 끝난 직후, 그 요청이 쥔 커넥션 수는 (0. 트랜잭션과 함께 영속성 컨텍스트가 닫히며 돌려준다)'
      - '옮긴 상황: 커넥션 풀 크기가 10이고 OSIV가 켜진 API가 있다. 요청마다 서비스가 끝난 뒤 결제사 API를 3초 동안 부른다. 같은 순간 요청 30개가 들어오면 무슨 일이 생기나 (10개만 커넥션을 쥐고 나머지 20개는 커넥션을 기다린다. 서비스는 금방 끝나도 응답이 끝날 때까지 커넥션이 돌아오지 않는다)'
    body:
      - p: '영속성 컨텍스트는 처음 DB를 쓸 때 풀에서 커넥션을 빌리고, **닫힐 때** 돌려줘요. OSIV를 켜면 닫히는 때가 응답이 끝날 때예요. 서비스가 끝난 직후에 이 요청이 커넥션을 몇 개 쥐고 있는지 풀에 물어봤어요.'
      - code: connRun
      - ci:
          key: on-connections
          label: OSIV 켜짐
          source: OsivOnTest.connectionHeldUntilRequestEnds
      - ci:
          key: off-connections
          label: OSIV 꺼짐
          source: OsivOffTest.connectionReleasedAfterService
      - p: '켜면 트랜잭션이 끝났는데도 커넥션을 쥐고 있어요. 서비스 뒤에 하는 일이 짧으면 문제가 작지만, 느린 일이 있으면 그동안 커넥션이 DB 일을 하지 않으면서 풀에서 빠져 있어요.'
      - code: slow
      - p: '사진 API가 2초 걸리면 계산은 이래요. 풀의 커넥션은 10개, 서비스는 0.05초예요.'
      - table:
          head: [OSIV, 요청 하나가 커넥션을 쥐는 시간, 커넥션 10개로 1초에 처리하는 요청]
          rows:
            - [꺼짐, 0.05초, 200건]
            - [켜짐, 약 2.1초, 5건이 안 됨]
      - p: '켜진 앱에 요청이 1초에 20건만 들어와도 커넥션이 모자라요. 나머지 요청은 커넥션을 기다리다 시간 초과로 실패해요. DB는 한가한데도요. 커넥션을 기다리는 일은 [DB 커넥션과 커넥션 풀](lesson:connection-pool)에서 봤어요.'
      - quiz:
          q: 'OSIV를 끈 앱에서 서비스의 `@Transactional` 메서드가 끝난 직후, 그 요청이 쥔 커넥션은 몇 개일까요?'
          options:
            - 0개
            - 1개
            - 풀 크기만큼
          answer: 1
          explain: '끄면 영속성 컨텍스트가 트랜잭션과 함께 닫히며 커넥션을 돌려줘요.'
      - next: '커넥션만이 아니에요. 영속성 컨텍스트가 열려 있으면 그 안의 엔티티도 영속 상태로 남아요. 무슨 일이 생길까요?'
    recall: '영속성 컨텍스트가 요청이 끝날 때까지 DB 커넥션을 쥐고 있어서, 동시에 처리할 수 있는 요청 수가 줄어요. 서비스가 끝난 뒤 외부 API를 부르거나 응답이 느리면 그동안 커넥션이 DB 일을 하지 않으면서 풀에서 빠져 있어요. 요청이 몰리면 풀이 바닥나 다른 요청이 커넥션을 기다리다 실패해요.'
  - id: q4
    title: OSIV를 켜면 컨트롤러에서 바꾼 엔티티는 어떻게 되나요?
    conclusion:
      lead: '영속 상태로 남아 있어서, 같은 요청에서 다른 쓰기 트랜잭션이 커밋될 때 함께 저장돼요.'
      sub: '트랜잭션은 커밋할 때 영속성 컨텍스트 전체를 flush하기 때문이에요. 저장할 생각이 없던 변경이 DB에 들어가요.'
    says:
      - '코드 rename. 컨트롤러가 화면에만 보이려고 선수 이름을 바꾸고, 그다음 상관없는 쓰기 트랜잭션(`recordVisit`)을 부른다. OSIV를 켜면 그 커밋이 컨텍스트 전체를 flush해 바뀐 이름이 저장된다. 끄면 선수는 준영속이라 저장되지 않는다. 테스트 둘의 결과를 보인다'
      - '변경 감지는 영속 상태 엔티티를 모두 본다(P2). OSIV는 영속 상태를 요청 끝까지 늘리므로, 변경 감지가 미치는 범위도 늘어난다'
      - '트랜잭션 밖에서만 바꾸고 쓰기 트랜잭션을 부르지 않으면 저장되지 않는다. 그래서 같은 코드가 어떤 요청에서는 저장되고 어떤 요청에서는 안 되어 찾기 어렵다'
    asks:
      - '본문의 예시: OSIV를 켠 앱에서 코드 rename의 `service.recordVisit()` 줄을 지우면 바꾼 이름이 저장되나 (저장되지 않는다. 컨트롤러에는 트랜잭션이 없어 flush하는 곳이 없다)'
      - '옮긴 상황: OSIV를 켠 앱에서 컨트롤러가 주문 엔티티의 금액을 할인 표시용으로 바꾼 뒤, 로그를 남기는 서비스(`@Transactional`, 로그 엔티티 저장)를 불렀다. 주문 금액은 어떻게 되나 (바꾼 금액이 저장된다. 로그 저장 트랜잭션의 커밋이 영속성 컨텍스트 전체를 flush한다)'
    body:
      - code: rename
        notes:
          - mark: p.rename(name)
            as: code
            text: '저장하려는 것이 아니라 화면에 잠깐 다른 이름을 보이려고 바꿨어요.'
      - p: '컨트롤러가 선수의 이름을 바꾼 뒤, 선수와 상관없는 쓰기 트랜잭션(`recordVisit`)을 불렀어요. 요청이 끝난 뒤 DB의 이름을 읽었어요.'
      - ci:
          key: on-rename
          label: OSIV 켜짐
          source: OsivOnTest.controllerChangeFlushedByLaterTransaction
      - ci:
          key: off-rename
          label: OSIV 꺼짐
          source: OsivOffTest.controllerChangeNotFlushed
      - p: '켠 앱에서는 **바꾼 이름이 저장됐어요**. 선수는 열려 있는 영속성 컨텍스트에 영속 상태로 남아 있었고, `recordVisit`의 트랜잭션이 커밋할 때 영속성 컨텍스트 전체를 flush했어요. 변경 감지는 영속 상태 엔티티를 모두 봐요([영속성 컨텍스트](lesson:jpa-persistence-context)). OSIV가 영속 상태를 요청 끝까지 늘리니, 변경 감지가 미치는 범위도 늘어난 거예요.'
      - p: '끈 앱에서는 선수가 이미 준영속이라 저장되지 않았어요.'
      - p: '켠 앱이라도 쓰기 트랜잭션을 부르지 않으면 저장되지 않아요. 아래 컨트롤러는 이름만 바꾸고 끝나는데, 이름은 그대로였어요. flush할 트랜잭션이 없으니까요.'
      - code: renameOnly
      - p: '그래서 같은 코드가 어떤 요청에서는 저장되고 어떤 요청에서는 안 돼요. 뒤에 어떤 서비스를 부르느냐에 따라 달라지니 찾기 어려워요.'
      - quiz:
          q: 'OSIV를 켠 앱에서 컨트롤러가 주문 엔티티의 금액을 할인 표시용으로 바꾼 뒤, 로그를 남기는 서비스(`@Transactional`, 로그 엔티티 저장)를 불렀어요. 주문 금액은 어떻게 될까요?'
          options:
            - 그대로다
            - 바꾼 금액이 저장된다
            - 로그 저장이 실패한다
          answer: 2
          explain: '주문은 영속 상태로 남아 있고, 로그 저장 트랜잭션의 커밋이 영속성 컨텍스트 전체를 flush해요.'
      - next: '켜 두면 커넥션을 오래 쥐고, 뜻밖의 저장이 생겨요. 그래서 끄면, 컨트롤러가 쓰던 지연 로딩은 어디로 옮길까요?'
    recall: '영속 상태로 남아 있어서, 같은 요청에서 다른 쓰기 트랜잭션이 커밋될 때 함께 저장돼요. 트랜잭션은 커밋할 때 영속성 컨텍스트 전체를 flush하고, OSIV가 그 영속성 컨텍스트를 요청 끝까지 열어 두기 때문이에요. 쓰기 트랜잭션을 부르지 않으면 저장되지 않아서, 뒤에 무엇을 부르느냐에 따라 달라져요.'
  - id: q5
    title: OSIV를 끄면 지연 로딩은 어디서 끝내나요?
    conclusion:
      lead: '서비스의 트랜잭션 안에서 끝내고, 밖으로는 필요한 값만 담은 DTO를 돌려줘요.'
      sub: '목록처럼 연관을 여럿 읽는 조회는 fetch join으로 한 번에 가져와요. 컨트롤러는 엔티티를 만지지 않아요.'
    says:
      - '코드 dto. 서비스가 트랜잭션 안에서 팀 이름까지 읽어 record에 담는다. OSIV를 끈 앱에서 이 서비스를 부르는 컨트롤러는 예외 없이 동작한다. 테스트로 보인다'
      - '연관을 여럿 읽으면 서비스 안에서도 쿼리가 늘어날 수 있다. 그때는 fetch join으로 함께 가져온다(P4, P5)'
      - '엔티티를 컨트롤러 밖으로 내보내지 않으면 질문 4의 의도치 않은 저장도 생기지 않는다'
      - '더 알아보기: 화면에 맞춘 조회가 많아지면, 조회만 맡는 서비스(`PlayerQueryService`)를 따로 두고 `readOnly` 트랜잭션에서 DTO를 만든다. 바꾸는 서비스와 나누면 각 서비스가 단순해진다'
    asks:
      - '본문의 예시: OSIV를 끈 앱에서 컨트롤러가 코드 dto의 `findView`를 불러 `PlayerView`를 돌려준다. 예외가 나나 (나지 않는다. 팀 이름은 트랜잭션 안에서 이미 읽었다)'
      - '옮긴 상황: OSIV를 끄자 게시글 목록 API에서 `LazyInitializationException`이 난다. 목록의 게시글마다 작성자 이름이 필요하다. 서비스에서 어떻게 고치나 (게시글과 작성자를 fetch join으로 함께 조회하고, 트랜잭션 안에서 DTO 목록으로 바꿔 돌려준다)'
    body:
      - p: '서비스의 트랜잭션 안에서 필요한 값을 다 읽고, 밖으로는 그 값만 담은 DTO를 돌려줘요.'
      - code: dto
      - code: ctrlDto
      - ci:
          key: off-dto
          label: OSIV 꺼짐의 실제 결과
          source: OsivOffTest.dtoFromServiceWorks
      - p: '팀 이름은 트랜잭션 안에서 이미 읽었으니, OSIV를 끈 앱에서도 예외 없이 "레드"를 돌려줬어요. 컨트롤러는 엔티티를 만지지 않아요. 그래서 질문 4의 뜻밖의 저장도 생기지 않아요.'
      - p: '목록처럼 연관을 여럿 읽는 조회는 서비스 안에서도 쿼리가 늘어날 수 있어요. 그때는 fetch join으로 함께 가져온 뒤 DTO로 바꿔요([JPA N+1 문제](lesson:jpa-n-plus-1)).'
      - more:
          summary: '더 알아보기: 조회만 맡는 서비스'
          body:
            - p: '화면마다 필요한 조회가 늘어나면, 조회만 맡는 서비스(`PlayerQueryService`)를 따로 두고 `readOnly` 트랜잭션에서 DTO를 만들어요. 데이터를 바꾸는 서비스와 나누면 각 서비스가 단순해지고, 화면이 바뀌어도 바꾸는 쪽 코드는 그대로예요.'
      - quiz:
          q: 'OSIV를 끄자 게시글 목록 API에서 `LazyInitializationException`이 나요. 목록의 게시글마다 작성자 이름이 필요해요. 서비스에서 어떻게 고칠까요?'
          options:
            - 작성자 연관을 EAGER로 바꾼다
            - 게시글과 작성자를 fetch join으로 조회하고 트랜잭션 안에서 DTO 목록으로 바꾼다
            - OSIV를 다시 켠다
          answer: 2
          explain: '트랜잭션 안에서 필요한 연관을 한 번에 가져와 DTO로 옮기면, 밖에서는 프록시를 만지지 않아요.'
    recall: '서비스의 트랜잭션 안에서 지연 로딩까지 끝내고, 밖으로는 필요한 값만 담은 DTO를 돌려줘요. 목록처럼 연관을 여럿 읽는 조회는 fetch join으로 한 번에 가져온 뒤 DTO로 바꿔요. 컨트롤러는 엔티티를 만지지 않으니 지연 로딩 예외도, 뜻밖의 저장도 생기지 않아요.'
practice:
  title: 설정과 운영에서는 이렇게 해요
  body:
    - h3: API 서버는 꺼요
    - code: yml
    - p: '`application.yml`에 `open-in-view: false`를 적어요. 적으면 시작할 때의 경고도 사라져요. 기본값이 true라는 것과 경고는 [스프링 부트 설정 문서](link:props)가 근거예요.'
    - h3: '흔한 실수: 끄고 나서 EAGER로 막기'
    - p: 'OSIV를 끈 뒤 여기저기서 `LazyInitializationException`이 나면, 엔티티의 연관을 EAGER로 바꿔 막고 싶어져요. 그러면 그 엔티티를 조회하는 모든 곳에서 연관을 함께 가져오고, 목록 조회에서는 쿼리가 늘어나요([JPA N+1 문제](lesson:jpa-n-plus-1)). 고친 코드는 질문 5의 DTO와 fetch join이에요. 예외가 난 화면의 조회만 고쳐요.'
    - h3: 켜 둘 수 있을 때
    - p: '관리자 화면처럼 사용자가 적고, 서버가 뷰 템플릿으로 엔티티를 그리는 앱은 켜 두기도 해요. 그때도 컨트롤러에서 엔티티를 바꾸지 않아요.'
    - h3: 켜져 있는지 확인하는 법
    - ul:
        - 앱이 뜰 때 "spring.jpa.open-in-view is enabled by default" 경고가 있는지 봐요
        - '요청이 몰릴 때 HikariCP의 사용 중 커넥션 수가 DB 쿼리 수에 비해 높게 붙어 있는지 봐요'
    - muted: '근거: 설정의 기본값은 [스프링 부트 설정 문서](link:props), 인터셉터는 [스프링 프레임워크 API 문서](link:interceptor). 지연 로딩, 커넥션 수, 저장 여부는 테스트로 확인했어요. 시작 경고는 테스트로 확인하지 않았어요.'
  says:
    - 'API 서버는 코드 yml처럼 `open-in-view: false`를 적는다. 적으면 시작 경고도 사라진다. 기본값과 경고는 스프링 부트 문서와 `JpaBaseConfiguration`의 소스가 근거'
    - '흔한 실수: OSIV를 끈 뒤 생긴 `LazyInitializationException`을 엔티티 연관을 EAGER로 바꿔 막는다. 모든 조회가 팀을 끌고 와 쿼리가 늘어난다(P5). 고친 코드는 질문 5의 DTO와 fetch join이다'
    - '켜 둘 수 있는 경우: 관리자 화면처럼 사용자가 적고, 서버가 뷰 템플릿으로 엔티티를 그리는 앱. 그래도 컨트롤러에서 엔티티를 바꾸지 않는다'
    - '켰는지 확인하는 법: 시작 로그의 경고, 또는 요청 중 풀의 사용 중 커넥션 수(HikariCP 지표)를 본다'
claims:
  - claim: 'OSIV를 켜면 컨트롤러에서 LAZY 연관을 읽을 수 있다'
    how: '`@SpringBootTest(properties = "spring.jpa.open-in-view=true")`와 MockMvc'
    test: 'OsivOnTest.lazyLoadingInControllerWorks'
  - claim: 'OSIV를 끄면 같은 컨트롤러에서 `LazyInitializationException`'
    how: '같은 방법, 기본 설정 false'
    test: 'OsivOffTest.lazyLoadingInControllerFails'
  - claim: '서비스가 끝난 직후 사용 중 커넥션은 켜면 1, 끄면 0'
    how: 'HikariCP의 `getActiveConnections`'
    test: 'OsivOnTest.connectionHeldUntilRequestEnds, OsivOffTest.connectionReleasedAfterService'
  - claim: '켜면 컨트롤러에서 바꾼 이름이 상관없는 쓰기 트랜잭션의 커밋에 저장되고, 끄면 저장되지 않는다'
    how: '같은 방법'
    test: 'OsivOnTest.controllerChangeFlushedByLaterTransaction, OsivOffTest.controllerChangeNotFlushed'
  - claim: '켜도 컨트롤러에서 바꾸기만 하고 쓰기 트랜잭션을 부르지 않으면 저장되지 않는다'
    how: '쓰기 트랜잭션을 부르지 않는 컨트롤러 메서드를 더한다'
  - claim: 'OSIV를 끈 앱에서 서비스가 DTO를 돌려주면 예외 없이 팀 이름을 돌려준다'
    how: '`OsivService`에 DTO 메서드를 더하고 컨트롤러로 부른다'
sources:
  - '`spring.jpa.open-in-view`의 기본값과 경고: 스프링 부트 문서 https://docs.spring.io/spring-boot/appendix/application-properties/index.html'
  - '`OpenEntityManagerInViewInterceptor`: 스프링 프레임워크 API https://docs.spring.io/spring-framework/docs/current/javadoc-api/org/springframework/orm/jpa/support/OpenEntityManagerInViewInterceptor.html'
interview:
  question: OSIV가 무엇이고, 왜 끄라고 하나요?
  model:
    - label: 정의
      text: OSIV는 영속성 컨텍스트를 요청이 들어올 때 열고 응답이 끝날 때 닫는 설정입니다. 스프링 부트에서는 spring.jpa.open-in-view의 기본값이 true이고, 트랜잭션의 범위는 그대로 서비스 메서드입니다.
    - label: 원리
      text: 영속성 컨텍스트가 열려 있으니 트랜잭션이 끝난 뒤에도 컨트롤러에서 지연 로딩이 됩니다. 대신 영속성 컨텍스트가 DB 커넥션을 응답이 끝날 때까지 쥐고, 엔티티가 영속 상태로 남아 같은 요청의 다른 쓰기 트랜잭션이 커밋될 때 컨트롤러에서 바꾼 값까지 flush됩니다.
    - label: 주의할 점
      text: 서비스 뒤에 외부 API 호출처럼 느린 일이 있으면 커넥션이 오래 묶여 풀이 바닥납니다. API 서버는 끄고, 지연 로딩은 서비스의 트랜잭션 안에서 fetch join과 DTO로 끝냅니다. 끈 뒤에 EAGER로 막지 않습니다.
    - label: 경험
      text: '(내 프로젝트로 채우기) 예: 트래픽이 몰릴 때 커넥션 풀 대기 시간이 늘어난 원인이 OSIV였고, 끈 뒤 컨트롤러의 지연 로딩을 서비스의 DTO 조회로 옮겼습니다.'
verified: 이 레슨의 결과는 짐작이 아니라 스프링 부트 3.5 앱을 OSIV를 켜고 끄며 MockMvc로 요청을 보내 PostgreSQL 16 컨테이너에서 확인한 값이에요. 코드가 바뀔 때마다 테스트([OsivOnTest](link:onTest), [OsivOffTest](link:offTest))가 다시 돌아요.
footer: '근거: `spring.jpa.open-in-view`의 기본값은 [스프링 부트 설정 문서](link:props), `OpenEntityManagerInViewInterceptor`는 [스프링 프레임워크 API 문서](link:interceptor). 결과는 스프링 부트 3.5와 PostgreSQL 16에서 테스트로 확인했어요. 오류는 [GitHub 이슈](https://github.com/wanja727/dev-lessons/issues)로 알려 주세요.'
