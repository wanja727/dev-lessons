# 상속 매핑과 값 타입 (설계서)
# 자료 파일의 칸은 docs/lesson-data-format.md에 있다.
stage: design
title: 상속 매핑과 값 타입
unit: JPA
roadmap: P10
type: 동작 확인
prerequisites:
  - {slug: association-owner, title: 연관관계 매핑}
assume: '스프링 부트 3.5, Hibernate 6.6, PostgreSQL 16. 상속과 다형성(상속과 다형성 레슨), 불변 객체(불변 객체 레슨), 조인(조인 레슨), 변경 감지(영속성 컨텍스트 레슨).'
example: '결제 수단 `Payment`를 카드 `CardPayment`와 계좌 이체 `BankPayment`가 상속한다. 회원의 주소는 `Address` 값 타입이다. 같은 클래스를 세 가지 상속 전략으로 매핑해 만들어진 테이블과 조회 SQL을 견준다.'
intro:
  - '결제 수단이 카드와 계좌 이체 둘이라 자바에서는 `Payment`를 상속해 만들었어요. 그런데 테이블은 상속이 없어요. 하나로 둘지 셋으로 나눌지에 따라 조회 SQL과 NULL 컬럼이 달라져요.'
  - '회원의 주소처럼 여러 필드가 한 덩어리인 값은 엔티티가 아니라 값 타입으로 묶어요. 묶는 방법을 모르면 필드가 흩어지거나, 같은 주소 객체를 두 회원이 함께 써서 한쪽을 바꿨는데 둘 다 바뀌어요.'
  - '이 레슨에서는 세 가지 상속 전략으로 테이블을 만들어 보고, 부모 타입으로 조회할 때의 SQL을 견주고, 값 타입을 함께 쓸 때 생기는 일을 확인해요.'
covers:
  - topic: '테이블에는 상속이 없다. JPA는 상속을 세 방법으로 옮긴다: SINGLE_TABLE(한 테이블), JOINED(부모와 자식 테이블을 조인), TABLE_PER_CLASS(자식마다 테이블)'
    where: '질문 1'
  - topic: 'SINGLE_TABLE은 구분 컬럼(`dtype`)으로 종류를 나누고, 자식만의 컬럼은 NULL을 허용해야 한다'
    where: '질문 1'
  - topic: '부모 타입으로 조회할 때: SINGLE_TABLE은 테이블 하나, JOINED는 조인, TABLE_PER_CLASS는 UNION'
    where: '질문 2'
  - topic: '고르는 기준: 기본은 SINGLE_TABLE, 자식 컬럼이 많고 NOT NULL 제약이 중요하면 JOINED, TABLE_PER_CLASS는 쓰지 않는다'
    where: '질문 2'
  - topic: '`@MappedSuperclass`는 테이블 없이 필드(생성 시각 등)만 물려준다. 부모 타입으로 조회할 수 없다'
    where: '질문 2의 더 알아보기'
  - topic: '`@Embeddable`과 `@Embedded`: 여러 필드를 값 타입 하나로 묶고, 컬럼은 엔티티의 테이블에 그대로 들어간다'
    where: '질문 3'
  - topic: '같은 값 타입을 두 번 쓰면 `@AttributeOverride`로 컬럼 이름을 바꾼다'
    where: '질문 3'
  - topic: '값 타입을 두 엔티티가 함께 가리키면 한쪽에서 바꿀 때 둘 다 바뀐다. 그래서 값 타입은 불변으로 만든다'
    where: '질문 4 (자바 과정 J9에서 넘겨받음)'
  - topic: 'Hibernate 6.2부터 record를 `@Embeddable`로 쓸 수 있다'
    where: '질문 4'
  - topic: '값 타입 컬렉션(`@ElementCollection`)은 바뀔 때 전부 지우고 다시 넣는다. 그래서 엔티티로 바꾸는 편이 낫다'
    where: '질문 4의 더 알아보기'
codes:
  predict: |-
    @Entity
    @Inheritance(strategy =
        InheritanceType.SINGLE_TABLE)
    abstract class Payment {
      @Id @GeneratedValue Long id;
      long amount;
    }

    @Entity
    class CardPayment extends Payment {
      String cardNumber;
    }

    @Entity
    class BankPayment extends Payment {
      String bankCode;
    }
  address: |-
    @Embeddable
    public record Address(
        String city,
        String street,
        String zipcode) {}

    @Entity
    public class Member {
      @Id @GeneratedValue Long id;
      @Embedded Address home;
    }
predict:
  text: '코드 predict는 결제 수단을 SINGLE_TABLE로 매핑해요. 만들어지는 테이블은 몇 개일까요? 보기: 1개, 2개, 3개.'
  answer: '1개. 부모와 자식의 필드가 모두 payment 테이블 하나에 들어가고 dtype 컬럼이 종류를 나눈다. 질문 1에서 밝힌다.'
questions:
  - id: q1
    title: 상속을 테이블로 옮기는 방법은 무엇이 있나요?
    conclusion:
      lead: '한 테이블에 모두 담기(SINGLE_TABLE), 부모와 자식을 나눠 조인하기(JOINED), 자식마다 따로 두기(TABLE_PER_CLASS)가 있어요.'
      sub: '`@Inheritance(strategy = ...)`로 고르고, 기본값은 SINGLE_TABLE이에요.'
    says:
      - '같은 세 클래스를 전략만 바꿔 매핑하고 `information_schema`에서 만들어진 테이블과 컬럼을 읽어 실제 출력으로 보인다'
      - 'SINGLE_TABLE: `payment` 하나에 `dtype`, `amount`, `card_number`, `bank_code`. 카드 행의 `bank_code`는 NULL이라 자식 컬럼에 NOT NULL을 걸 수 없다'
      - 'JOINED: `payment`(공통)와 `card_payment`, `bank_payment`(자식만의 컬럼과 같은 id)'
      - 'TABLE_PER_CLASS: `card_payment`, `bank_payment`가 공통 컬럼을 각자 가진다'
    widget:
      kind: toggle
      note: '전략을 고르면 만들어지는 테이블과 컬럼, 카드 결제 하나를 저장할 때의 INSERT를 보여 준다'
    asks:
      - '본문의 예시: JOINED로 매핑한 결제 수단에서 카드 결제 하나를 저장하면 INSERT는 몇 번인가 (2번. payment와 card_payment)'
      - '옮긴 상황: 상품(`Item`)을 책, 음반, 영화가 상속하고 SINGLE_TABLE이다. 책 행의 `artist` 컬럼에는 무엇이 들어가나 (NULL)'
  - id: q2
    title: 부모 타입으로 조회하면 SQL은 어떻게 다른가요?
    conclusion:
      lead: 'SINGLE_TABLE은 테이블 하나를 읽고, JOINED는 자식 테이블을 조인하고, TABLE_PER_CLASS는 자식 테이블을 UNION으로 모두 읽어요.'
      sub: '그래서 기본은 SINGLE_TABLE을 쓰고, 자식 컬럼이 많고 제약이 중요하면 JOINED를 써요. TABLE_PER_CLASS는 쓰지 않아요.'
    says:
      - '`select p from Payment p`의 SQL을 세 전략에서 실제 출력으로 견준다'
      - 'JOINED는 자식이 늘수록 조인이 는다. TABLE_PER_CLASS의 UNION은 자식 테이블을 모두 읽는다'
      - '더 알아보기: `@MappedSuperclass`는 `createdAt` 같은 공통 필드만 물려주고 테이블은 자식마다 있다. 부모 타입으로 JPQL을 쓸 수 없다'
    asks:
      - '본문의 예시: TABLE_PER_CLASS에서 `select p from Payment p`를 실행하면 SQL에 무엇이 나오나 (UNION)'
      - '옮긴 상황: 자식 종류가 3개이고 자식만의 컬럼은 하나씩이다. 결제 목록 화면은 종류를 섞어 보인다. 어느 전략을 고르나 (SINGLE_TABLE. 테이블 하나로 읽는다)'
  - id: q3
    title: 값 타입(@Embeddable)은 무엇이고 테이블은 어떻게 되나요?
    conclusion:
      lead: '여러 필드를 한 덩어리 값으로 묶은 클래스이고, 컬럼은 그것을 쓰는 엔티티의 테이블에 그대로 들어가요.'
      sub: '자기 id와 테이블이 없어요. 같은 값 타입을 두 번 쓰면 `@AttributeOverride`로 컬럼 이름을 바꿔요.'
    says:
      - '코드 address. `member` 테이블에 `city`, `street`, `zipcode`가 생긴다. 실제 출력으로 보인다'
      - '값 타입은 엔티티의 일부다. 회원을 지우면 함께 사라지고, 다른 엔티티가 가리킬 수 없다'
      - '집 주소와 회사 주소를 둘 다 두면 컬럼 이름이 겹친다. `@AttributeOverride(name = "city", column = @Column(name = "work_city"))`로 바꾼다'
    asks:
      - '본문의 예시: `Member`에 `@Embedded Address home`이 있다. 만들어지는 테이블은 몇 개인가 (1개. member)'
      - '옮긴 상황: 주문에 `@Embedded Money price`(amount, currency)를 두었다. 주문 테이블의 컬럼에 무엇이 더해지나 (amount, currency)'
  - id: q4
    title: 값 타입은 왜 불변으로 만드나요?
    conclusion:
      lead: '같은 값 객체를 두 엔티티가 함께 가리키면, 한쪽에서 바꿀 때 둘 다 바뀌기 때문이에요.'
      sub: '불변이면 바꿀 때 새 객체를 넣어야 해서 이런 일이 생기지 않아요. Hibernate 6.2부터는 record를 값 타입으로 쓸 수 있어요.'
    says:
      - '바꿀 수 있는 `Address`를 kim과 lee에게 같은 객체로 넣고 kim의 도시만 바꾼다. 커밋하면 UPDATE가 두 번 나가고 lee의 도시도 바뀐다. 테스트로 보인다'
      - '변수에는 객체의 참조가 들어 있어서 두 엔티티가 같은 객체를 가리킨다(값과 참조 레슨). 변경 감지는 두 엔티티 모두에서 바뀐 값을 본다(P2)'
      - '불변으로 만들면 바꾸는 방법이 새 객체를 넣는 것뿐이다. record는 필드가 final이다(불변 객체 레슨). record 값 타입이 저장과 조회되는 것을 테스트로 보인다'
      - '더 알아보기: `@ElementCollection`으로 값 타입 목록을 두면 하나만 바꿔도 그 엔티티의 행을 모두 지우고 다시 넣는다. 그래서 목록은 엔티티로 만들고 일대다로 잇는 편이 낫다'
    asks:
      - '본문의 예시: 같은 `Address` 객체를 kim과 lee에게 넣고 `kim.getHome().setCity("부산")`을 했다. 커밋 뒤 lee의 도시는 (부산)'
      - '옮긴 상황: 주문 둘에 같은 `Money` 객체(바꿀 수 있는 클래스)를 넣고 한 주문의 금액을 바꿨다. 무엇이 문제이고 어떻게 막나 (두 주문이 함께 바뀐다. Money를 불변 record로 만든다)'
practice:
  says:
    - '실무 모양: 공통 필드는 `@MappedSuperclass`로 둔 `BaseTimeEntity`(createdAt, updatedAt). 값 타입은 record로 만든 `Address`, `Money`'
    - '흔한 실수: 회원 가입 때 받은 주소 객체를 그대로 다른 회원 엔티티에 넣는다(질문 4). 고친 코드는 record 값 타입. 테스트로 보인다'
    - 'SINGLE_TABLE에서 자식만의 컬럼에는 NOT NULL을 DB에 걸 수 없으니, 검증은 엔티티나 입력 검증에서 한다'
claims:
  - claim: '세 전략이 만드는 테이블과 컬럼'
    how: '전략마다 다른 엔티티 묶음을 두고 `information_schema`를 읽는다'
  - claim: '부모 타입 JPQL이 SINGLE_TABLE은 테이블 하나, JOINED는 조인, TABLE_PER_CLASS는 UNION이다'
    how: '`SqlCapture`로 SQL을 본다'
  - claim: '`@Embedded` 값 타입의 컬럼이 엔티티의 테이블에 들어간다'
    how: '`information_schema`'
  - claim: '같은 바꿀 수 있는 값 객체를 두 엔티티에 넣고 하나를 바꾸면 UPDATE가 2번이고 둘 다 바뀐다'
    how: '`SqlCapture`와 다시 조회'
  - claim: 'record를 `@Embeddable`로 쓸 수 있다'
    how: '저장하고 다시 읽는다'
sources:
  - '상속 매핑과 값 타입: Jakarta Persistence 3.1 명세 2.12, 2.5 https://jakarta.ee/specifications/persistence/3.1/jakarta-persistence-spec-3.1.html'
  - 'record 값 타입: Hibernate 6.6 문서 https://docs.hibernate.org/orm/6.6/userguide/html_single/#embeddable-instantiator-property'
