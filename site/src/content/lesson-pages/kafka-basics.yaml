# 메시지 큐 (설계서)
# 자료 파일의 칸은 docs/lesson-data-format.md에 있다.
stage: design
title: 메시지 큐
unit: 시스템 설계와 아키텍처
roadmap: A8
type: 동작 확인
prerequisites:
  - {slug: scale-out, title: 서버를 늘리는 방법}
assume: '자바 21, 아파치 카프카 3.x(Testcontainers), 카프카 자바 클라이언트. 서버를 여러 대 띄우면 같은 일을 나눠 받는다는 것(서버를 늘리는 방법 레슨). 멱등성은 멱등성과 중복 요청 방지 레슨에서 다뤘지만 몰라도 읽을 수 있어요.'
example: '주문이 완료되면 포인트를 적립하고 알림 메일을 보낸다. 주문 서버가 이 일을 직접 하지 않고 `order-completed` 토픽에 메시지를 남기면, 포인트 서버와 알림 서버가 각자 받아 처리한다.'
intro:
  - '주문 완료 API가 포인트 적립, 알림 메일, 통계 저장을 차례로 부르다 보니 응답이 2초가 넘어요. 메일 서버가 느린 날에는 주문까지 실패해요. 주문은 이미 됐는데 메일 때문에요.'
  - '스프링 서비스가 커지면 "지금 꼭 끝나야 하는 일"과 "조금 뒤에 해도 되는 일"을 나누게 돼요. 뒤의 일을 메시지 큐에 넘기면 주문은 빨리 끝나고, 받는 쪽은 자기 속도로 처리해요. 대신 메시지가 두 번 오거나 사라지는 경우를 개발자가 다뤄야 해요. 면접에서는 "카프카를 왜 쓰나요", "컨슈머 그룹과 파티션", "메시지 중복과 유실"을 물어요.'
  - '이 레슨에서는 카프카 컨테이너를 띄워 주문 메시지를 보내고, 키와 파티션이 순서를 어떻게 지키는지, 컨슈머 그룹이 일을 어떻게 나누는지, 커밋하기 전에 죽으면 같은 메시지를 다시 받는 것을 확인해요.'
covers:
  - topic: '메시지 큐는 보내는 쪽(프로듀서)과 받는 쪽(컨슈머) 사이에서 메시지를 맡아 둔다. 보내는 쪽은 받는 쪽이 처리할 때까지 기다리지 않는다'
    where: '질문 1'
  - topic: '큐로 떼어 놓으면 얻는 것: 응답이 빨라지고, 받는 쪽이 죽어도 보내는 쪽은 성공하며, 몰리는 요청을 큐에 쌓아 두고 천천히 처리한다'
    where: '질문 1'
  - topic: '잃는 것: 결과를 바로 알 수 없고(결과적 일관성), 운영할 시스템이 하나 늘며, 중복과 순서를 다뤄야 한다'
    where: '질문 1'
  - topic: '카프카는 메시지를 지우지 않고 끝에 덧붙이는 로그다. 토픽은 메시지의 이름 붙은 모음, 파티션은 토픽을 나눈 칸, offset은 칸 안의 번호다'
    where: '질문 2'
  - topic: '같은 키의 메시지는 같은 파티션에 가고, 한 파티션 안에서만 순서가 지켜진다'
    where: '질문 2'
  - topic: '컨슈머 그룹: 같은 그룹의 컨슈머들은 파티션을 나눠 가진다. 파티션보다 컨슈머가 많으면 남는 컨슈머는 논다'
    where: '질문 3'
  - topic: '다른 그룹은 같은 메시지를 따로 모두 받는다. 포인트 서버와 알림 서버가 같은 주문 메시지를 각자 받는다'
    where: '질문 3'
  - topic: '파티션 수가 한 그룹에서 동시에 처리할 수 있는 컨슈머 수의 한계다'
    where: '질문 3'
  - topic: '컨슈머는 어디까지 읽었는지(offset)를 커밋한다. 처리 뒤 커밋하면 최소 한 번(중복 가능), 처리 전 커밋하면 최대 한 번(유실 가능)'
    where: '질문 4'
  - topic: '최소 한 번을 고르고 컨슈머를 멱등하게 만든다: 이벤트 id로 처리한 것을 기록해 거른다'
    where: '질문 4. 멱등성은 멱등성과 중복 요청 방지(A6)'
  - topic: '프로듀서의 acks=all: 브로커가 복제본에 저장한 뒤 응답한다'
    where: '질문 4의 더 알아보기'
  - topic: '메시지 큐와 이벤트 스트림의 차이(RabbitMQ는 받으면 지우고, 카프카는 남겨서 다시 읽을 수 있다)'
    where: '질문 2의 더 알아보기'
  - topic: '스프링 카프카(@KafkaListener, KafkaTemplate)와 설정'
    where: '실무에서는'
  - topic: 'DB 저장과 메시지 발행이 어긋나는 문제'
    where: '다루지 않음: 트랜잭셔널 아웃박스(A18)'
  - topic: '스프링 안에서 이벤트로 떼어 놓기'
    where: '다루지 않음: 스프링 이벤트(S13)'
codes:
  predict: |-
    producer.send(new ProducerRecord<>(
        "order-completed", "order-1",
        "created"));
    producer.send(new ProducerRecord<>(
        "order-completed", "order-1",
        "paid"));
    producer.send(new ProducerRecord<>(
        "order-completed", "order-1",
        "shipped"));
  consume: |-
    while (true) {
      var records = consumer.poll(
          Duration.ofMillis(500));
      for (var r : records) {
        earnPoint(r.value());
      }
      consumer.commitSync();
    }
  dedup: |-
    if (!processed.add(eventId)) {
      return; // 이미 처리함
    }
    earnPoint(orderId, amount);
  listener: |-
    @KafkaListener(
        topics = "order-completed",
        groupId = "point")
    void on(OrderCompleted e) {
      pointService.earn(e.orderId(),
          e.amount());
    }
predict:
  text: '파티션이 3개인 토픽에 같은 키 `order-1`로 created, paid, shipped를 차례로 보냈어요. 컨슈머가 읽는 순서는 어떻게 될까요? 보기: 늘 created, paid, shipped / 파티션 3개에 흩어져서 순서가 섞일 수 있다 / 거꾸로 읽는다.'
  answer: '늘 created, paid, shipped. 같은 키는 같은 파티션에 가고 파티션 안에서는 보낸 순서를 지킨다. 질문 2에서 밝힌다.'
questions:
  - id: q1
    title: 왜 일을 메시지 큐로 떼어 놓나요?
    conclusion:
      lead: '보내는 쪽이 받는 쪽의 처리를 기다리지 않게 해서, 응답은 빨라지고 받는 쪽이 느리거나 죽어도 보내는 쪽은 성공하게 하려고요.'
      sub: '대신 결과를 바로 알 수 없고, 메시지가 두 번 오거나 순서가 바뀌는 경우를 다뤄야 하며, 큐라는 시스템을 하나 더 운영해야 해요.'
    says:
      - '직접 부르는 구조: 주문 서버가 포인트, 알림, 통계를 차례로 부른다. 셋의 시간이 응답 시간에 더해지고, 하나가 실패하면 주문 요청도 실패한다'
      - '큐 구조: 주문 서버는 "주문 완료" 메시지 하나를 큐에 남기고 바로 응답한다. 포인트, 알림, 통계는 각자 메시지를 받아 처리한다. 알림 서버가 죽어 있어도 메시지는 큐에 남아 있다가 살아난 뒤 처리된다'
      - '몰리는 요청: 순간적으로 초당 1만 건이 와도 받는 쪽은 큐에 쌓인 것을 자기 속도로 처리한다(완충)'
      - '잃는 것: 포인트가 적립되는 것은 조금 뒤다(결과적 일관성, A16). 처리 실패를 사용자에게 바로 알릴 수 없다. 카프카 같은 시스템을 운영해야 한다'
      - '그래서 떼어 놓을 일은 "결과를 바로 몰라도 되는 일"이다. 결제 승인처럼 응답에 결과가 필요한 일은 직접 부른다'
    widget:
      kind: compare
      note: '왼쪽 직접 부르기, 오른쪽 메시지 큐. 버튼(알림 서버 장애, 주문이 10배로 몰림)을 고르면 양쪽에서 영향받는 곳이 강조되고 결과 줄에 주문 응답 시간과 주문 성공 여부가 나온다'
    asks:
      - '본문의 예시: 큐 구조에서 알림 서버가 10분 동안 죽어 있었다. 그동안 들어온 주문과 알림은 어떻게 되나 (주문은 성공한다. 알림 메시지는 큐에 남아 있다가 알림 서버가 살아나면 처리된다)'
      - '옮긴 상황: 회원 가입 API가 가입 축하 쿠폰 발급과 추천인 보상까지 직접 부른다. 사용자가 가입 직후 화면에서 쿠폰을 바로 써야 한다면 쿠폰 발급을 큐로 떼어도 되나 (조심해야 한다. 큐로 떼면 쿠폰이 조금 뒤에 생겨 바로 보이지 않을 수 있다)'
  - id: q2
    title: 카프카는 메시지를 어떻게 담고, 순서는 어디까지 지키나요?
    conclusion:
      lead: '토픽을 여러 파티션으로 나눠 메시지를 각 파티션의 끝에 덧붙이고, 순서는 한 파티션 안에서만 지켜요.'
      sub: '같은 키의 메시지는 늘 같은 파티션에 가요. 그래서 순서가 중요한 메시지들(같은 주문의 상태 변경)은 같은 키로 보내요.'
    says:
      - '카프카의 토픽은 끝에만 덧붙이는 기록장이다. 메시지마다 번호(offset)가 붙고, 읽어도 지워지지 않는다. 보관 기간이 지나면 지운다'
      - '토픽은 파티션으로 나뉜다. 파티션이 나뉘어 있어서 여러 컨슈머가 나눠 읽을 수 있다'
      - '키가 있는 메시지는 키의 해시로 파티션을 정한다. 코드 predict의 세 메시지는 같은 파티션에 가고 그 안에서 보낸 순서로 읽힌다. 예측의 답을 밝힌다. 주문 여러 개의 메시지가 파티션에 어떻게 흩어지고 주문마다의 순서가 지켜지는지 실제 출력으로 보인다'
      - '다른 키끼리는 다른 파티션에 갈 수 있어서 서로의 순서는 보장되지 않는다. 토픽 전체의 순서가 필요하면 파티션을 1개로 둬야 하고, 그러면 나눠 읽을 수 없다'
      - '더 알아보기: RabbitMQ 같은 전통적인 메시지 큐는 컨슈머가 받으면 메시지를 지운다. 카프카는 남겨 두어 다른 그룹이 따로 읽고, 지난 메시지를 다시 읽을 수 있다'
    asks:
      - '본문의 예시: 파티션 3개인 토픽에 키 `order-1`의 메시지 A, B와 키 `order-2`의 메시지 C를 차례로 보냈다. 순서가 보장되는 것은 (A 다음 B. C와의 순서는 보장되지 않는다)'
      - '옮긴 상황: 회원 정보 변경 이벤트를 키 없이 보냈더니 같은 회원의 "이메일 변경"이 "가입"보다 먼저 처리됐다. 고치는 방법은 (회원 id를 키로 보낸다)'
  - id: q3
    title: 컨슈머 여러 대는 메시지를 어떻게 나눠 받나요?
    conclusion:
      lead: '같은 컨슈머 그룹의 컨슈머들은 파티션을 나눠 가지고, 다른 그룹은 같은 메시지를 처음부터 따로 모두 받아요.'
      sub: '한 파티션은 그룹 안에서 컨슈머 하나만 읽어요. 그래서 파티션이 3개면 컨슈머를 4대로 늘려도 하나는 놀아요.'
    says:
      - '포인트 서버를 세 대 띄우고 같은 그룹 `point`로 묶는다. 파티션 3개를 하나씩 맡는다. 메시지는 셋에 나뉘고 한 메시지를 두 서버가 받지 않는다'
      - '네 대로 늘리면 하나는 파티션을 받지 못해 아무것도 받지 않는다. 실제 출력으로 컨슈머별로 받은 수를 보인다. 파티션 수가 한 그룹의 처리 대수의 한계다'
      - '알림 서버는 다른 그룹 `notification`이다. 포인트 그룹과 상관없이 모든 메시지를 받는다. 같은 메시지를 여러 시스템이 쓰는 방법이다'
      - '컨슈머가 죽거나 새로 들어오면 그룹 안에서 파티션을 다시 나눈다(리밸런스). 그동안 잠깐 처리가 멈춘다'
    widget:
      kind: toggle
      note: '같은 그룹의 컨슈머 수(1, 2, 3, 4)를 고르면 파티션 3개가 컨슈머에게 어떻게 나뉘는지와 노는 컨슈머가 보인다. 다른 그룹 하나가 늘 모든 파티션을 받는 줄을 함께 둔다'
    asks:
      - '본문의 예시: 파티션 3개인 토픽을 같은 그룹의 컨슈머 4대가 읽는다. 메시지를 받는 컨슈머는 몇 대인가 (3대)'
      - '옮긴 상황: 정산 서버 2대를 같은 그룹으로, 통계 서버 1대를 다른 그룹으로 붙였다. 메시지 100개가 오면 통계 서버가 받는 수는 (100개. 다른 그룹은 모두 받는다)'
  - id: q4
    title: 메시지가 두 번 오거나 사라지는 것은 언제인가요?
    conclusion:
      lead: '처리한 뒤 커밋하기 전에 죽으면 같은 메시지를 다시 받고(최소 한 번), 커밋한 뒤 처리하기 전에 죽으면 그 메시지는 다시 오지 않아요(최대 한 번).'
      sub: '보통 최소 한 번을 고르고 컨슈머를 멱등하게 만들어요. 이벤트 id로 처리한 것을 기록해 두고 다시 온 것은 건너뛰어요.'
    says:
      - '컨슈머는 "여기까지 읽었다"는 offset을 카프카에 커밋한다. 재시작하면 커밋한 다음부터 읽는다'
      - '코드 consume은 처리한 뒤 커밋한다. 처리하고 커밋하기 전에 죽으면 재시작한 컨슈머가 같은 메시지를 다시 받는다. 포인트가 두 번 적립된다. 실제 출력을 보인다'
      - '처리하기 전에 커밋하고 죽으면 그 메시지는 다시 오지 않는다. 포인트가 한 번도 적립되지 않는다(유실). 실제 출력을 보인다'
      - '돈과 관련된 일은 유실보다 중복이 다루기 쉽다. 그래서 최소 한 번을 고르고, 코드 dedup처럼 이벤트 id를 기록해 걸러 한 번만 처리한다. 실제로는 처리한 이벤트 id를 DB에 유니크 제약으로 남기고 포인트 적립과 같은 트랜잭션에 둔다(A6과 같은 원리)'
      - '더 알아보기: 프로듀서 쪽에서는 `acks=all`이면 브로커가 복제본까지 저장한 뒤 응답한다. 응답에 파티션과 offset이 온다. 이것을 받기 전에 프로듀서가 죽으면 다시 보내야 하고, 그래서 보내는 쪽에서도 중복이 생길 수 있다'
    asks:
      - '본문의 예시: 컨슈머가 메시지를 처리해 포인트를 적립한 직후, `commitSync` 전에 죽었다. 재시작하면 (같은 메시지를 다시 받는다. 거르지 않으면 포인트가 두 번 적립된다)'
      - '옮긴 상황: 알림 컨슈머가 메시지를 받자마자 커밋하고 메일을 보낸다. 메일 서버 오류로 컨슈머가 죽으면 그 알림은 (다시 오지 않아 메일이 나가지 않는다)'
      - '실무 구역: `@KafkaListener` 메서드가 예외를 던지면 스프링 카프카의 기본 동작은 (몇 번 다시 시도한 뒤 로그를 남기고 다음 메시지로 넘어간다)'
practice:
  says:
    - '스프링 카프카: `spring-kafka` 의존성, `KafkaTemplate.send(토픽, 키, 값)`으로 보내고 코드 listener의 `@KafkaListener(topics, groupId)`로 받는다. 설정은 `spring.kafka.bootstrap-servers`, `consumer.group-id`, 직렬화. 검증 프로젝트는 카프카 클라이언트만 쓰므로 스프링 카프카 동작은 공식 문서가 근거라고 밝힌다'
    - '스프링 카프카는 기본으로 리스너가 정상으로 끝난 뒤 offset을 커밋한다(최소 한 번). 리스너가 예외를 던지면 `DefaultErrorHandler`가 정해진 횟수만큼 다시 시도하고 넘어간다. 실패한 메시지를 따로 모으는 DLT(dead letter topic)를 설정할 수 있다'
    - '흔한 실수: 리스너에서 `@Transactional`로 포인트를 적립하고, 같은 메시지가 다시 올 수 있다는 것을 잊는다. 고친 코드: 처리한 이벤트 id 테이블에 유니크 제약을 걸고 적립과 같은 트랜잭션에 INSERT한다. 다시 온 메시지는 유니크 위반으로 건너뛴다'
    - '흔한 실수 둘: 주문 상태 메시지를 키 없이 보내 순서가 섞인다. 고친 코드: 주문 id를 키로 보낸다'
claims:
  - claim: '같은 키의 메시지는 같은 파티션으로 가고 보낸 순서대로 읽힌다'
    how: '카프카 컨테이너와 카프카 클라이언트'
    test: 'KafkaBasicsTest의 key-order 테스트'
  - claim: '같은 그룹은 파티션을 나눠 가지고 파티션 3개에 컨슈머 4개면 하나는 놀며, 다른 그룹은 모두 받는다'
    how: '같은 구성'
    test: 'KafkaBasicsTest의 group 테스트'
  - claim: '처리 뒤 커밋 전에 죽으면 같은 메시지를 다시 받고, event_id로 거르면 한 번만 처리된다'
    how: '같은 구성'
    test: 'KafkaBasicsTest의 at-least-once 테스트'
  - claim: '처리 전에 커밋하고 죽으면 그 메시지는 다시 오지 않는다'
    how: '같은 구성'
    test: 'KafkaBasicsTest의 at-most-once 테스트'
  - claim: 'acks=all로 보내면 파티션과 offset을 돌려받는다'
    how: '같은 구성'
    test: 'KafkaBasicsTest의 acks 테스트'
sources:
  - '카프카의 토픽, 파티션, 컨슈머 그룹, 전달 보장: https://kafka.apache.org/documentation/#design'
  - '스프링 카프카의 리스너, 커밋, 오류 처리: https://docs.spring.io/spring-kafka/reference/kafka/receiving-messages.html'
