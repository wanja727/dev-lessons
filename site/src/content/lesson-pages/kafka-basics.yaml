predict:
  title: 같은 키로 보내면 순서는?
  text: '파티션이 3개인 토픽에 같은 키 `order-1`로 created, paid, shipped를 차례로 보냈어요. 컨슈머가 읽는 순서는 어떻게 될까요? 답은 질문 2에 나와요.'
  code: predict
  label: 내 예측
  options:
    - value: ordered
      label: 늘 created, paid, shipped
    - value: mixed
      label: 파티션 3개에 흩어져 순서가 섞일 수 있다
    - value: reversed
      label: 거꾸로 읽는다
  answer: ordered
  storageKey: kafka-predict
  wrong: 예측은 "{label}"이었어요. 틀린 예측이 더 오래 남으니 괜찮아요.
questions:
  - id: q1
    title: 왜 일을 메시지 큐로 떼어 놓나요?
    conclusion:
      lead: '보내는 쪽이 받는 쪽의 처리를 기다리지 않게 해서, 응답은 빨라지고 받는 쪽이 느리거나 죽어도 보내는 쪽은 성공하게 하려고요.'
      sub: '대신 결과를 바로 알 수 없고, 메시지가 두 번 오거나 순서가 바뀌는 경우를 다뤄야 하며, 큐라는 시스템을 하나 더 운영해야 해요.'
    says:
      - '직접 부르는 구조: 주문 서버가 포인트, 알림, 통계를 차례로 부른다. 셋의 시간이 응답 시간에 더해지고, 하나가 실패하면 주문 요청도 실패한다'
      - '큐 구조: 주문 서버는 "주문 완료" 메시지 하나를 큐에 남기고 바로 응답한다. 포인트, 알림, 통계는 각자 메시지를 받아 처리한다. 알림 서버가 죽어 있어도 메시지는 큐에 남아 있다가 살아난 뒤 처리된다'
      - '몰리는 요청: 순간적으로 초당 1만 건이 와도 받는 쪽은 큐에 쌓인 것을 자기 속도로 처리한다(완충)'
      - '잃는 것: 포인트가 적립되는 것은 조금 뒤다(결과적 일관성, A16). 처리 실패를 사용자에게 바로 알릴 수 없다. 카프카 같은 시스템을 운영해야 한다'
      - '그래서 떼어 놓을 일은 "결과를 바로 몰라도 되는 일"이다. 결제 승인처럼 응답에 결과가 필요한 일은 직접 부른다'
    widget:
      kind: compare
      note: '왼쪽 직접 부르기, 오른쪽 메시지 큐. 버튼(알림 서버 장애, 주문이 10배로 몰림)을 고르면 양쪽에서 영향받는 곳이 강조되고 결과 줄에 주문 응답 시간과 주문 성공 여부가 나온다'
    asks:
      - '본문의 예시: 큐 구조에서 알림 서버가 10분 동안 죽어 있었다. 그동안 들어온 주문과 알림은 어떻게 되나 (주문은 성공한다. 알림 메시지는 큐에 남아 있다가 알림 서버가 살아나면 처리된다)'
      - '옮긴 상황: 회원 가입 API가 가입 축하 쿠폰 발급과 추천인 보상까지 직접 부른다. 사용자가 가입 직후 화면에서 쿠폰을 바로 써야 한다면 쿠폰 발급을 큐로 떼어도 되나 (조심해야 한다. 큐로 떼면 쿠폰이 조금 뒤에 생겨 바로 보이지 않을 수 있다)'
    body:
      - p: '주문 완료 API가 뒤따르는 일을 모두 직접 불러요.'
      - code: direct
        notes:
          - mark: point.earn(o)
            as: code
            text: '셋 다 주문 요청 안에서 차례로 불러요. 시간이 모두 더해져 응답이 2초가 넘어요.'
          - mark: mail.sendReceipt(o)
            as: code
            text: '메일 서버가 실패하면 예외가 나서 주문 요청까지 실패해요. 주문 완료와는 상관없는 일인데요.'
      - p: '**메시지 큐**는 보내는 쪽(**프로듀서**)과 받는 쪽(**컨슈머**) 사이에서 메시지를 맡아 두는 시스템이에요. 주문 서버는 "주문이 완료됐다"는 메시지 하나를 남기고 바로 응답해요. 포인트, 알림, 통계 서버는 각자 그 메시지를 받아 처리해요.'
      - code: queued
        notes:
          - mark: 'kafka.send("order-completed",'
            as: code
            text: '메시지를 큐에 넘기고 끝이에요. 받는 쪽이 처리할 때까지 기다리지 않아요.'
      - p: '두 구조에 문제를 하나씩 일으켜 보세요.'
      - widget:
          kind: compare
          layout: [selector, sides, verdict]
          selector:
            label: 일어난 일
            options:
              - {value: down, label: 알림 서버 장애}
              - {value: burst, label: 주문이 10배로 몰림}
          sides:
            - label: 직접 부르기
              items:
                - {name: 주문 서버, note: 포인트, 알림, 통계를 차례로 부름}
                - {name: 알림 서버, note: 메일 발송}
            - label: 메시지 큐
              items:
                - {name: 주문 서버, note: 메시지 하나를 남김}
                - {name: 큐, note: 메시지를 맡아 둠}
                - {name: 알림 서버, note: 큐에서 받아 메일 발송}
          scenes:
            down:
              sides:
                - marks: [{name: 알림 서버, tag: 장애, mark: bad}, {name: 주문 서버, tag: 실패, mark: bad}]
                  result: [{k: 주문, v: 실패, mark: bad}]
                - marks: [{name: 알림 서버, tag: 장애, mark: bad}, {name: 큐, tag: 쌓임}]
                  result: [{k: 주문, v: 성공}, {k: 메일, v: 살아나면 보냄}]
              verdict: '큐가 메시지를 맡아 두니 주문은 성공하고, 메일은 알림 서버가 살아난 뒤 나가요.'
            burst:
              sides:
                - marks: [{name: 주문 서버, tag: 느려짐, mark: bad}, {name: 알림 서버, tag: 넘침, mark: bad}]
                  result: [{k: 주문 응답, v: 알림 서버만큼 느려짐, mark: bad}]
                - marks: [{name: 큐, tag: 쌓임}]
                  result: [{k: 주문 응답, v: 그대로}, {k: 메일, v: 쌓인 것을 차례로}]
              verdict: '받는 쪽은 큐에 쌓인 것을 자기 속도로 처리해요. 큐가 완충 역할을 해요.'
      - p: '얻는 것을 정리하면 셋이에요. **응답이 빨라지고**, **받는 쪽이 죽어도 보내는 쪽은 성공하고**, **몰린 요청을 쌓아 두고 천천히** 처리해요.'
      - p: '잃는 것도 있어요. 포인트는 주문 응답이 나간 **조금 뒤에** 적립돼요. 이렇게 잠시 어긋났다가 결국 맞춰지는 것을 결과적 일관성이라고 해요. 적립이 실패해도 사용자에게 그 자리에서 알릴 수 없어요. 메시지가 두 번 오거나 순서가 바뀌는 경우를 다뤄야 하고(질문 2, 4), 카프카라는 시스템을 하나 더 운영해야 해요.'
      - p: '그래서 큐로 떼는 일은 **결과를 바로 몰라도 되는 일**이에요. 결제 승인처럼 응답에 결과가 꼭 필요한 일은 직접 불러요.'
      - quiz:
          q: '가입 직후 화면에서 축하 쿠폰을 바로 보여 주고 써야 해요. 쿠폰 발급을 메시지 큐로 떼면 무엇을 조심해야 하나요?'
          options:
            - '가입 요청이 실패한다'
            - '아무것도 없다. 큐는 늘 즉시 처리한다'
            - '쿠폰이 조금 뒤에 생겨 가입 직후 화면에서 보이지 않을 수 있다'
          answer: 3
          explain: '큐로 떼면 받는 쪽이 조금 뒤에 처리해요. 결과가 바로 필요한 일은 직접 부르는 편이 맞아요.'
      - next: '큐에 남긴 메시지는 어떻게 담기고, 보낸 순서대로 읽힐까요? 카프카로 봐요.'
    recall: '보내는 쪽이 받는 쪽의 처리를 기다리지 않게 하려고요. 주문 서버는 메시지 하나를 큐에 남기고 바로 응답하니 빨라지고, 알림 서버가 죽어도 메시지가 큐에 남아 주문은 성공하며, 몰린 요청은 큐에 쌓여 받는 쪽이 자기 속도로 처리해요. 대신 결과가 조금 뒤에 맞춰지고(결과적 일관성), 실패를 바로 알릴 수 없고, 중복과 순서를 다뤄야 하며, 큐를 운영해야 해요. 그래서 결과를 바로 몰라도 되는 일만 떼요.'
  - id: q2
    title: 카프카는 메시지를 어떻게 담고, 순서는 어디까지 지키나요?
    conclusion:
      lead: '토픽을 여러 파티션으로 나눠 메시지를 각 파티션의 끝에 덧붙이고, 순서는 한 파티션 안에서만 지켜요.'
      sub: '같은 키의 메시지는 늘 같은 파티션에 가요. 그래서 순서가 중요한 메시지들(같은 주문의 상태 변경)은 같은 키로 보내요.'
    says:
      - '카프카의 토픽은 끝에만 덧붙이는 기록장이다. 메시지마다 번호(offset)가 붙고, 읽어도 지워지지 않는다. 보관 기간이 지나면 지운다'
      - '토픽은 파티션으로 나뉜다. 파티션이 나뉘어 있어서 여러 컨슈머가 나눠 읽을 수 있다'
      - '키가 있는 메시지는 키의 해시로 파티션을 정한다. 코드 predict의 세 메시지는 같은 파티션에 가고 그 안에서 보낸 순서로 읽힌다. 예측의 답을 밝힌다. 주문 여러 개의 메시지가 파티션에 어떻게 흩어지고 주문마다의 순서가 지켜지는지 실제 출력으로 보인다'
      - '다른 키끼리는 다른 파티션에 갈 수 있어서 서로의 순서는 보장되지 않는다. 토픽 전체의 순서가 필요하면 파티션을 1개로 둬야 하고, 그러면 나눠 읽을 수 없다'
      - '더 알아보기: RabbitMQ 같은 전통적인 메시지 큐는 컨슈머가 받으면 메시지를 지운다. 카프카는 남겨 두어 다른 그룹이 따로 읽고, 지난 메시지를 다시 읽을 수 있다'
    asks:
      - '본문의 예시: 파티션 3개인 토픽에 키 `order-1`의 메시지 A, B와 키 `order-2`의 메시지 C를 차례로 보냈다. 순서가 보장되는 것은 (A 다음 B. C와의 순서는 보장되지 않는다)'
      - '옮긴 상황: 회원 정보 변경 이벤트를 키 없이 보냈더니 같은 회원의 "이메일 변경"이 "가입"보다 먼저 처리됐다. 고치는 방법은 (회원 id를 키로 보낸다)'
    body:
      - p: '카프카에서 메시지를 담는 이름 붙은 곳을 **토픽**이라고 해요(`order-completed`). 토픽은 **끝에만 덧붙이는 기록장**이에요. 들어온 메시지마다 0, 1, 2 ... 번호가 붙는데 이것이 **offset**이에요. 컨슈머가 읽어도 지워지지 않고, 정해 둔 보관 기간이 지나야 지워져요([카프카 문서](link:design)).'
      - p: '토픽은 다시 여러 **파티션**으로 나뉘어요. 파티션마다 자기 offset을 0부터 세요. 나뉘어 있어서 여러 컨슈머가 파티션을 하나씩 맡아 나눠 읽을 수 있어요(질문 3).'
      - prewrap: '토픽 order-completed = 파티션 0 [0, 1, 2 ...] + 파티션 1 [0, 1 ...] + 파티션 2 [0, 1, 2, 3 ...]'
      - p: '메시지에 **키**를 붙이면, 카프카는 키의 해시로 파티션을 정해요. 같은 키는 늘 같은 파티션에 가요. 파티션 3개인 토픽에 주문 3개의 이벤트를 다섯 개씩 섞어서 보냈어요.'
      - ci:
          key: key-order
          label: 실제 결과 보기
          source: KafkaBasicsTest.sameKeySamePartitionInOrder
          code: keyRun
      - p: '주문마다 한 파티션에 모였고, 그 안에서 보낸 순서대로 읽혔어요. 처음 예측의 답은 **늘 created, paid, shipped**예요. {{predict-result}} 같은 키라 같은 파티션에 가고, 한 파티션 안에서는 덧붙인 순서가 곧 읽는 순서예요.'
      - p: '주의할 것은 **다른 파티션끼리의 순서**예요. order-1과 order-2는 다른 파티션에 갈 수 있고, 두 파티션을 읽는 속도는 달라요. 그래서 카프카가 지키는 순서는 **한 파티션 안**까지예요. 순서가 중요한 메시지들은 같은 키(주문 id, 회원 id)로 보내요. 토픽 전체의 순서가 꼭 필요하면 파티션을 1개로 둬야 하는데, 그러면 나눠 읽을 수 없어요.'
      - more:
          summary: 받으면 지우는 큐와 무엇이 다른가요?
          body:
            - p: 'RabbitMQ 같은 전통적인 메시지 큐는 컨슈머가 메시지를 받아 처리했다고 알리면 그 메시지를 지워요. 카프카는 지우지 않고 남겨 둬요. 그래서 여러 그룹이 같은 메시지를 따로 읽고(질문 3), 장애를 고친 뒤 지난 offset부터 다시 읽을 수 있어요.'
      - quiz:
          q: '회원 정보 변경 이벤트를 키 없이 보냈더니 같은 회원의 "이메일 변경"이 "가입"보다 먼저 처리됐어요. 어떻게 고치나요?'
          options:
            - '컨슈머를 늘린다'
            - '파티션을 늘린다'
            - '회원 id를 키로 보낸다'
          answer: 3
          explain: '같은 키는 같은 파티션에 가고, 한 파티션 안에서는 보낸 순서가 지켜져요.'
      - next: '파티션이 나뉘어 있어서 여러 컨슈머가 나눠 읽는다고 했어요. 컨슈머는 파티션을 어떻게 나눠 가질까요?'
    recall: '카프카는 토픽을 여러 파티션으로 나누고, 메시지를 각 파티션의 끝에 덧붙이며 offset 번호를 붙여요. 읽어도 지우지 않고 보관 기간이 지나야 지워요. 키가 있으면 키의 해시로 파티션을 정해서 같은 키는 늘 같은 파티션에 가요. 순서는 한 파티션 안에서만 지켜지니, 순서가 중요한 메시지(같은 주문의 상태 변경)는 같은 키로 보내요.'
  - id: q3
    title: 컨슈머 여러 대는 메시지를 어떻게 나눠 받나요?
    conclusion:
      lead: '같은 컨슈머 그룹의 컨슈머들은 파티션을 나눠 가지고, 다른 그룹은 같은 메시지를 처음부터 따로 모두 받아요.'
      sub: '한 파티션은 그룹 안에서 컨슈머 하나만 읽어요. 그래서 파티션이 3개면 컨슈머를 4대로 늘려도 하나는 놀아요.'
    says:
      - '포인트 서버를 세 대 띄우고 같은 그룹 `point`로 묶는다. 파티션 3개를 하나씩 맡는다. 메시지는 셋에 나뉘고 한 메시지를 두 서버가 받지 않는다'
      - '네 대로 늘리면 하나는 파티션을 받지 못해 아무것도 받지 않는다. 실제 출력으로 컨슈머별로 받은 수를 보인다. 파티션 수가 한 그룹의 처리 대수의 한계다'
      - '알림 서버는 다른 그룹 `notification`이다. 포인트 그룹과 상관없이 모든 메시지를 받는다. 같은 메시지를 여러 시스템이 쓰는 방법이다'
      - '컨슈머가 죽거나 새로 들어오면 그룹 안에서 파티션을 다시 나눈다(리밸런스). 그동안 잠깐 처리가 멈춘다'
    widget:
      kind: toggle
      note: '같은 그룹의 컨슈머 수(1, 2, 3, 4)를 고르면 파티션 3개가 컨슈머에게 어떻게 나뉘는지와 노는 컨슈머가 보인다. 다른 그룹 하나가 늘 모든 파티션을 받는 줄을 함께 둔다'
    asks:
      - '본문의 예시: 파티션 3개인 토픽을 같은 그룹의 컨슈머 4대가 읽는다. 메시지를 받는 컨슈머는 몇 대인가 (3대)'
      - '옮긴 상황: 정산 서버 2대를 같은 그룹으로, 통계 서버 1대를 다른 그룹으로 붙였다. 메시지 100개가 오면 통계 서버가 받는 수는 (100개. 다른 그룹은 모두 받는다)'
    body:
      - p: '컨슈머는 **컨슈머 그룹**의 이름(`group.id`)을 달고 붙어요. 같은 그룹의 컨슈머들은 토픽의 파티션을 **나눠 가져요.** 한 파티션은 그룹 안에서 컨슈머 하나만 읽어요. 그래서 같은 메시지를 같은 그룹의 두 서버가 받지 않아요([카프카 문서](link:consumerGroups)).'
      - p: '파티션 3개인 토픽에 같은 그룹의 컨슈머 4개를 붙이고, 다른 그룹의 컨슈머 1개도 붙여 봤어요.'
      - ci:
          key: group
          label: 실제 결과 보기
          source: KafkaBasicsTest.consumerGroupSplitsPartitions
      - p: '같은 그룹의 셋은 파티션을 하나씩 맡았고, 하나는 맡을 파티션이 없어 **놀아요.** 파티션 수가 한 그룹에서 동시에 일하는 컨슈머 수의 한계예요. 처리 대수를 늘리려면 파티션부터 늘려야 해요.'
      - p: '다른 그룹(알림)의 컨슈머는 메시지 6개를 **모두** 받았어요. 그룹이 다르면 서로 상관없이 처음부터 따로 읽어요. 그래서 포인트 서버와 알림 서버를 다른 그룹으로 두면 같은 주문 메시지를 각자 받아요.'
      - p: '컨슈머 수를 바꿔 보세요.'
      - widget:
          kind: toggle
          layout: [selector, log, verdict]
          selector:
            label: point 그룹의 컨슈머 수
            options:
              - {value: '1', label: 1대}
              - {value: '2', label: 2대}
              - {value: '3', label: 3대}
              - {value: '4', label: 4대}
          scenes:
            '1':
              log:
                - '컨슈머 1: 파티션 0, 1, 2'
                - {note: 'notification 그룹: 파티션 0, 1, 2 모두'}
              verdict: '혼자 세 파티션을 모두 읽어요.'
            '2':
              log:
                - '컨슈머 1: 파티션 0, 1'
                - '컨슈머 2: 파티션 2'
                - {note: 'notification 그룹: 파티션 0, 1, 2 모두'}
              verdict: '파티션이 나뉘어요. 한 대가 두 개를 맡아요.'
            '3':
              log:
                - '컨슈머 1: 파티션 0'
                - '컨슈머 2: 파티션 1'
                - '컨슈머 3: 파티션 2'
                - {note: 'notification 그룹: 파티션 0, 1, 2 모두'}
              verdict: '파티션 하나씩. 이 토픽에서 가장 많이 나눠 읽는 모양이에요.'
            '4':
              log:
                - '컨슈머 1: 파티션 0'
                - '컨슈머 2: 파티션 1'
                - '컨슈머 3: 파티션 2'
                - '컨슈머 4: 없음 (대기)'
                - {note: 'notification 그룹: 파티션 0, 1, 2 모두'}
              verdict: '파티션보다 많은 컨슈머는 놀아요. 다른 그룹은 늘 모든 메시지를 받아요.'
      - p: '컨슈머가 죽거나 새로 붙으면 그룹 안에서 파티션을 **다시 나눠요**(리밸런스). 죽은 컨슈머의 파티션은 남은 컨슈머가 이어받고, 나누는 동안 잠깐 처리가 멈춰요.'
      - quiz:
          q: '정산 서버 2대를 같은 그룹으로, 통계 서버 1대를 다른 그룹으로 붙였어요. 메시지 100개가 오면 통계 서버는 몇 개를 받나요?'
          options:
            - '33개'
            - '50개'
            - '100개'
          answer: 3
          explain: '그룹이 다르면 서로 상관없이 모든 메시지를 받아요. 정산 서버 두 대는 같은 그룹이라 100개를 나눠 받아요.'
      - next: '컨슈머가 메시지를 받아 처리하다 죽으면, 그 메시지는 어떻게 될까요?'
    recall: '같은 컨슈머 그룹의 컨슈머들은 토픽의 파티션을 나눠 가지고, 한 파티션은 그룹 안에서 컨슈머 하나만 읽어요. 그래서 같은 메시지를 같은 그룹의 두 서버가 받지 않고, 파티션이 3개면 컨슈머를 4대로 늘려도 하나는 놀아요. 다른 그룹은 상관없이 모든 메시지를 따로 받아서, 포인트와 알림처럼 같은 메시지를 여러 시스템이 써요. 컨슈머가 죽거나 붙으면 파티션을 다시 나눠요.'
  - id: q4
    title: 메시지가 두 번 오거나 사라지는 것은 언제인가요?
    conclusion:
      lead: '처리한 뒤 커밋하기 전에 죽으면 같은 메시지를 다시 받고(최소 한 번), 커밋한 뒤 처리하기 전에 죽으면 그 메시지는 다시 오지 않아요(최대 한 번).'
      sub: '보통 최소 한 번을 고르고 컨슈머를 멱등하게 만들어요. 이벤트 id로 처리한 것을 기록해 두고 다시 온 것은 건너뛰어요.'
    says:
      - '컨슈머는 "여기까지 읽었다"는 offset을 카프카에 커밋한다. 재시작하면 커밋한 다음부터 읽는다'
      - '코드 consume은 처리한 뒤 커밋한다. 처리하고 커밋하기 전에 죽으면 재시작한 컨슈머가 같은 메시지를 다시 받는다. 포인트가 두 번 적립된다. 실제 출력을 보인다'
      - '처리하기 전에 커밋하고 죽으면 그 메시지는 다시 오지 않는다. 포인트가 한 번도 적립되지 않는다(유실). 실제 출력을 보인다'
      - '돈과 관련된 일은 유실보다 중복이 다루기 쉽다. 그래서 최소 한 번을 고르고, 코드 dedup처럼 이벤트 id를 기록해 걸러 한 번만 처리한다. 실제로는 처리한 이벤트 id를 DB에 유니크 제약으로 남기고 포인트 적립과 같은 트랜잭션에 둔다(A6과 같은 원리)'
      - '더 알아보기: 프로듀서 쪽에서는 `acks=all`이면 브로커가 복제본까지 저장한 뒤 응답한다. 응답에 파티션과 offset이 온다. 이것을 받기 전에 프로듀서가 죽으면 다시 보내야 하고, 그래서 보내는 쪽에서도 중복이 생길 수 있다'
    asks:
      - '본문의 예시: 컨슈머가 메시지를 처리해 포인트를 적립한 직후, `commitSync` 전에 죽었다. 재시작하면 (같은 메시지를 다시 받는다. 거르지 않으면 포인트가 두 번 적립된다)'
      - '옮긴 상황: 알림 컨슈머가 메시지를 받자마자 커밋하고 메일을 보낸다. 메일 서버 오류로 컨슈머가 죽으면 그 알림은 (다시 오지 않아 메일이 나가지 않는다)'
      - '실무 구역: `@KafkaListener` 메서드가 예외를 던지면 스프링 카프카의 기본 동작은 (몇 번 다시 시도한 뒤 로그를 남기고 다음 메시지로 넘어간다)'
    body:
      - p: '카프카는 메시지를 지우지 않으니, 컨슈머가 "어디까지 읽었는지"를 따로 남겨요. 이것을 offset **커밋**이라고 해요. 컨슈머가 재시작하면 커밋한 offset의 다음부터 읽어요.'
      - p: '그래서 **처리와 커밋의 순서**가 결과를 정해요. 처리한 뒤 커밋하는 코드예요.'
      - code: consume
        notes:
          - mark: earnPoint(r.value())
            as: code
            text: '먼저 처리해요(포인트 적립).'
          - mark: consumer.commitSync()
            as: code
            text: '그다음 커밋해요. 처리와 커밋 사이에 죽으면 커밋이 안 된 채로 남아요.'
      - p: '처리하고 커밋하기 전에 컨슈머를 끝내고 다시 띄워 봤어요.'
      - ci:
          key: at-least-once
          label: 실제 결과 보기
          source: KafkaBasicsTest.processThenCrashBeforeCommitRedelivers
      - p: '재시작한 컨슈머가 **같은 offset 0을 다시** 받았어요. 그냥 처리하면 포인트가 두 번 적립돼요. 메시지가 **적어도 한 번은** 처리된다고 해서 **최소 한 번**(at-least-once)이라고 해요.'
      - p: '순서를 거꾸로 하면요? 받자마자 커밋하고 처리하다 죽는 경우예요.'
      - code: commitFirst
      - ci:
          key: at-most-once
          label: 실제 결과 보기
          source: KafkaBasicsTest.commitThenCrashLosesMessage
      - p: '이미 커밋했으니 그 메시지는 **다시 오지 않아요.** 포인트가 한 번도 적립되지 않았어요(유실). **많아야 한 번** 처리된다고 해서 **최대 한 번**(at-most-once)이에요([카프카 문서](link:semantics)).'
      - h3: 최소 한 번을 고르고 거른다
      - p: '돈이 걸린 일에서 사라진 메시지는 찾기 어렵지만, 두 번 온 메시지는 거를 수 있어요. 그래서 보통 **최소 한 번을 고르고, 컨슈머를 멱등하게** 만들어요. 메시지에 이벤트 id를 담아 보내고, 처리한 id를 기록해 다시 온 것은 건너뛰어요.'
      - code: dedup
      - p: '위 결과의 마지막 줄이 이것이에요. 같은 메시지를 두 번 받았지만 포인트는 한 번 적립됐어요. 실제 서비스에서는 처리한 이벤트 id를 DB 테이블에 **유니크 제약**으로 남기고, 포인트 적립과 같은 트랜잭션에 넣어요. [멱등성과 중복 요청 방지](lesson:idempotency)와 같은 원리예요.'
      - more:
          summary: 보내는 쪽에서도 중복이 생겨요
          body:
            - p: '프로듀서가 `acks=all`로 보내면 브로커는 복제본까지 저장한 뒤 응답하고, 응답에 파티션과 offset이 와요. 테스트에서도 그 값을 돌려받았어요.'
            - p: '그 응답을 받기 전에 네트워크가 끊기면 프로듀서는 저장됐는지 몰라 다시 보내요. 결제 요청의 재시도와 같은 일이 생겨 메시지가 두 번 들어갈 수 있어요. 그래서 받는 쪽에서 거르는 것이 기본이에요.'
      - quiz:
          q: '알림 컨슈머가 메시지를 받자마자 커밋하고 메일을 보내요. 메일 서버 오류로 컨슈머가 죽었다가 다시 뜨면 그 알림은?'
          options:
            - '다시 오지 않아 메일이 나가지 않는다'
            - '두 번 와서 메일이 두 번 나간다'
            - '다시 와서 메일이 나간다'
          answer: 1
          explain: '커밋을 먼저 해서 그 offset은 읽은 것으로 남았어요. 최대 한 번이라 유실돼요.'
      - next: '원리는 여기까지예요. 이제 스프링 카프카로 보내고 받는 코드와, 같은 메시지가 다시 올 때의 흔한 실수를 볼게요.'
    recall: '컨슈머는 어디까지 읽었는지 offset을 커밋하고, 재시작하면 커밋한 다음부터 읽어요. 처리한 뒤 커밋하기 전에 죽으면 같은 메시지를 다시 받고(최소 한 번, 중복), 커밋한 뒤 처리하기 전에 죽으면 그 메시지는 다시 오지 않아요(최대 한 번, 유실). 보통 최소 한 번을 고르고, 이벤트 id를 유니크 제약으로 기록해 다시 온 메시지를 건너뛰어 한 번만 처리해요.'
practice:
  title: 스프링 카프카로 보내고 받을 때
  says:
    - '스프링 카프카: `spring-kafka` 의존성, `KafkaTemplate.send(토픽, 키, 값)`으로 보내고 코드 listener의 `@KafkaListener(topics, groupId)`로 받는다. 설정은 `spring.kafka.bootstrap-servers`, `consumer.group-id`, 직렬화. 검증 프로젝트는 카프카 클라이언트만 쓰므로 스프링 카프카 동작은 공식 문서가 근거라고 밝힌다'
    - '스프링 카프카는 기본으로 리스너가 정상으로 끝난 뒤 offset을 커밋한다(최소 한 번). 리스너가 예외를 던지면 `DefaultErrorHandler`가 정해진 횟수만큼 다시 시도하고 넘어간다. 실패한 메시지를 따로 모으는 DLT(dead letter topic)를 설정할 수 있다'
    - '흔한 실수: 리스너에서 `@Transactional`로 포인트를 적립하고, 같은 메시지가 다시 올 수 있다는 것을 잊는다. 고친 코드: 처리한 이벤트 id 테이블에 유니크 제약을 걸고 적립과 같은 트랜잭션에 INSERT한다. 다시 온 메시지는 유니크 위반으로 건너뛴다'
    - '흔한 실수 둘: 주문 상태 메시지를 키 없이 보내 순서가 섞인다. 고친 코드: 주문 id를 키로 보낸다'
  body:
    - h3: 보내기와 받기
    - p: '스프링 부트에 `spring-kafka`를 넣고 주소를 적으면 `KafkaTemplate`과 리스너 컨테이너가 준비돼요. 보낼 때는 **키를 꼭** 넣어요(질문 2).'
    - code: template
    - code: listener
    - code: config
    - p: '이 레슨의 테스트는 스프링 카프카를 넣지 않고 카프카 자바 클라이언트로 직접 보내고 받았어요. 그래서 아래 동작은 테스트가 아니라 [스프링 카프카 문서](link:springKafka)가 근거예요.'
    - ul:
        - '리스너 메서드가 정상으로 끝나면 스프링 카프카가 offset을 커밋해요. 처리 뒤 커밋이라 **최소 한 번**이에요.'
        - '리스너가 예외를 던지면 기본 오류 처리기(`DefaultErrorHandler`)가 몇 번 다시 시도한 뒤 로그를 남기고 다음 메시지로 넘어가요. 실패한 메시지를 따로 모으는 토픽(DLT, dead letter topic)을 설정할 수 있어요([스프링 카프카 문서](link:springKafkaErrors)).'
    - h3: 흔한 실수 하나
    - p: '리스너에서 포인트를 적립하면서 같은 메시지가 다시 올 수 있다는 것을 잊는 거예요. 질문 4에서 본 것처럼 처리와 커밋 사이에 죽거나 리밸런스가 일어나면 같은 메시지가 다시 와요. 처리한 이벤트 id를 유니크 제약이 걸린 테이블에 적립과 **같은 트랜잭션으로** 넣어요.'
    - code: idempotentListener
      notes:
        - mark: processed.save(new Processed(
          as: code
          text: '이벤트 id 칸에 유니크 제약이 있어요. 다시 온 메시지는 여기서 유니크 위반이 나고, 트랜잭션이 롤백되어 적립도 되지 않아요. 위반은 "이미 처리함"으로 보고 건너뛰도록 오류 처리기에서 다뤄요.'
    - h3: 흔한 실수 둘
    - p: '주문 상태 메시지를 키 없이 보내는 거예요. 키가 없으면 메시지가 파티션에 흩어져 "결제됨"이 "생성됨"보다 먼저 처리될 수 있어요. 주문 id를 키로 보내요. 위의 `kafkaTemplate.send`처럼요.'
interview:
  question: 메시지 큐(카프카)를 왜 쓰고, 쓸 때 무엇을 조심하나요?
  model:
    - label: 정의
      text: 메시지 큐는 프로듀서와 컨슈머 사이에서 메시지를 맡아 두어, 보내는 쪽이 받는 쪽의 처리를 기다리지 않게 합니다. 응답이 빨라지고, 받는 쪽이 죽어도 보내는 쪽은 성공하며, 몰린 요청을 쌓아 두고 천천히 처리합니다.
    - label: 원리
      text: 카프카는 토픽을 파티션으로 나눠 끝에 덧붙이고 읽어도 지우지 않습니다. 같은 키는 같은 파티션에 가서 그 안에서 순서가 지켜집니다. 같은 컨슈머 그룹은 파티션을 나눠 가지고 다른 그룹은 모든 메시지를 따로 받습니다. 파티션 수가 한 그룹의 처리 대수의 한계입니다.
    - label: 주의할 점
      text: 처리 뒤 커밋 전에 죽으면 같은 메시지를 다시 받으니(최소 한 번) 이벤트 id를 유니크 제약으로 기록해 컨슈머를 멱등하게 만듭니다. 순서가 필요한 메시지는 같은 키로 보냅니다. 결과가 바로 필요한 일은 큐로 떼지 않습니다.
    - label: 경험
      text: '(내 프로젝트로 채우기) 예: 주문 완료 API에서 알림 메일과 포인트 적립을 카프카로 떼어 응답을 2초에서 0.2초로 줄이고, 처리한 이벤트 id 테이블로 중복 적립을 막았습니다.'
verified: 키와 파티션, 컨슈머 그룹, 최소 한 번과 최대 한 번의 결과는 카프카 컨테이너에 카프카 자바 클라이언트로 메시지를 보내 받은 값이에요. 코드가 바뀔 때마다 테스트([KafkaBasicsTest](link:test))가 다시 돌아요.
footer: '근거: 토픽, 파티션, 컨슈머 그룹은 [카프카 문서](link:design)와 [카프카 문서](link:consumerGroups), 전달 보장은 [카프카 문서](link:semantics), 스프링 카프카의 리스너와 커밋은 [스프링 카프카 문서](link:springKafka), 오류 처리는 [스프링 카프카 문서](link:springKafkaErrors). 결과는 테스트로 확인했어요. 오류는 [GitHub 이슈](https://github.com/wanja727/dev-lessons/issues)로 알려 주세요.'
claims:
  - claim: '같은 키의 메시지는 같은 파티션으로 가고 보낸 순서대로 읽힌다'
    how: '카프카 컨테이너와 카프카 클라이언트'
    test: 'KafkaBasicsTest.sameKeySamePartitionInOrder'
  - claim: '같은 그룹은 파티션을 나눠 가지고 파티션 3개에 컨슈머 4개면 하나는 놀며, 다른 그룹은 모두 받는다'
    how: '같은 구성'
    test: 'KafkaBasicsTest.consumerGroupSplitsPartitions'
  - claim: '처리 뒤 커밋 전에 죽으면 같은 메시지를 다시 받고, event_id로 거르면 한 번만 처리된다'
    how: '같은 구성'
    test: 'KafkaBasicsTest.processThenCrashBeforeCommitRedelivers'
  - claim: '처리 전에 커밋하고 죽으면 그 메시지는 다시 오지 않는다'
    how: '같은 구성'
    test: 'KafkaBasicsTest.commitThenCrashLosesMessage'
  - claim: 'acks=all로 보내면 파티션과 offset을 돌려받는다'
    how: '같은 구성'
    test: 'KafkaBasicsTest.producerGetsOffset'
sources:
  - '카프카의 토픽, 파티션, 컨슈머 그룹, 전달 보장: https://kafka.apache.org/documentation/#design'
  - '스프링 카프카의 리스너, 커밋, 오류 처리: https://docs.spring.io/spring-kafka/reference/kafka/receiving-messages.html'
