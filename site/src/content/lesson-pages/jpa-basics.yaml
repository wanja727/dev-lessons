# ORM과 JPA
# 자료 파일의 칸은 docs/lesson-data-format.md에 있다. 문제는 content/questions/jpa-basics.yaml에 있다.
title: ORM과 JPA
description: ORM이 무엇을 대신해 주는지, 엔티티가 어떻게 테이블이 되는지, 인터페이스만 쓴 리포지토리가 어떻게 동작하는지, JPQL은 SQL과 무엇이 다른지. 네 가지 질문에 스스로 답할 수 있게, 카페 메뉴를 저장하고 찾으며 실제로 나간 SQL을 나란히 보는 대화형 레슨.
unit: JPA
minutes: 20
roadmap: P1
type: 동작 확인
prerequisites:
  - {slug: spring-beans, title: 스프링 빈과 의존성 주입}
  - {slug: tx-basics, title: 트랜잭션 기초}
assume: '스프링 부트 3.5, Hibernate 6.6, PostgreSQL 16. SQL의 `CREATE TABLE`, `INSERT`, `SELECT ... WHERE`를 읽을 수 있다. 인터페이스와 구현 클래스(상속과 다형성 레슨), 제네릭 타입 매개변수(제네릭 레슨), 스프링이 빈을 만들어 생성자로 넣어 준다는 것(스프링 빈 레슨).'
example: '카페 메뉴 `CafeMenu`(이름, 가격)를 저장하고 이름과 가격으로 찾는다. 자바 코드 한 줄마다 실제로 나간 SQL을 나란히 본다.'
intro:
  - '스프링 부트 프로젝트에서 `memberRepository.save(member)` 한 줄을 쓰면 `INSERT`가 나가고, 메서드 이름을 `findByEmail`로 지으면 `WHERE email = ?`가 나가요. SQL을 한 줄도 쓰지 않았는데요. 편하지만, 무엇이 SQL을 만드는지 모르면 느린 쿼리가 나가도 어디를 고칠지 몰라요.'
  - '자바 스프링 백엔드는 대부분 JPA로 DB를 다뤄요. 개발자가 정하는 것은 엔티티 클래스의 모양, 리포지토리 메서드, JPQL이고, 그것이 어떤 SQL이 될지는 Hibernate가 정해요. 면접에서는 "JPA, Hibernate, Spring Data JPA가 각각 무엇인가요"를 거의 늘 물어요.'
  - '이 레슨에서는 엔티티 하나와 리포지토리 인터페이스 하나로 테이블이 만들어지고, 저장과 조회가 SQL로 바뀌는 것을 실제로 나간 SQL로 확인해요.'
covers:
  - topic: '객체와 테이블은 생김새가 다르다. 객체는 참조로 다른 객체를 가리키고 상속이 있으며 같은지 비교하는 방법이 둘이다. 테이블은 외래 키로 잇고 행은 기본 키로 구분한다. 이 차이를 손으로 옮기는 코드가 반복된다'
    where: '질문 1'
  - topic: 'ORM은 객체와 테이블 사이의 변환을 대신한다. 개발자는 객체를 다루고 SQL은 ORM이 만든다'
    where: '질문 1'
  - topic: 'JPA는 자바 표준 명세(인터페이스와 어노테이션)이고, Hibernate는 그 구현이다. Spring Data JPA는 JPA 위에서 리포지토리 구현을 만들어 주는 스프링 프로젝트다'
    where: '질문 1'
  - topic: '엔티티: `@Entity`, `@Id`, `@GeneratedValue`, `@Column`으로 클래스와 테이블, 필드와 컬럼의 대응을 적는다. 이름을 적지 않으면 필드 이름을 스네이크 케이스로 바꾼 컬럼이 된다'
    where: '질문 2'
  - topic: '엔티티에는 인자 없는 생성자가 있어야 한다(protected 가능). Hibernate가 조회한 행으로 객체를 만들 때 쓴다'
    where: '질문 2'
  - topic: '인자 없는 생성자를 protected로 막고, 만드는 길은 정적 팩토리 메서드(`CafeMenu.of(...)`)처럼 이름 있는 메서드로만 연다'
    where: '질문 2 (객체지향 과정 O1, O9에서 넘겨받음). 정적 팩토리 자체는 팩토리(O9)'
  - topic: '`ddl-auto`는 엔티티로 테이블을 만들거나 확인하는 설정이다. 운영 DB에는 `create`를 쓰지 않는다'
    where: '실무에서는. 마이그레이션 도구는 다루지 않음: 스키마 변경과 마이그레이션(D16)'
  - topic: '리포지토리는 `JpaRepository<T, ID>`를 상속한 인터페이스만 쓴다. T는 엔티티, ID는 그 엔티티의 `@Id` 타입이다. 스프링이 실행 중에 구현 객체(프록시)를 만들어 빈으로 넣는다'
    where: '질문 3 (자바 과정 J7, J11에서 넘겨받음)'
  - topic: '`save`는 `INSERT`, `findById`는 id 조건 `SELECT`, `findAll`은 조건 없는 `SELECT`가 된다'
    where: '질문 3'
  - topic: '메서드 이름 쿼리: `findByName`, `findByPriceLessThan`처럼 이름 규칙으로 WHERE 조건을 만든다. 이름이 필드와 맞지 않으면 앱이 뜰 때 실패한다'
    where: '질문 3, 실무에서는'
  - topic: 'JPQL은 테이블이 아니라 엔티티와 필드를 대상으로 쓰는 쿼리다. Hibernate가 테이블과 컬럼 이름의 SQL로 바꾼다. `@Query`로 리포지토리에 붙인다'
    where: '질문 4'
  - topic: '네이티브 쿼리는 SQL을 그대로 보낸다. DB마다 다른 기능이 필요할 때 쓴다'
    where: '질문 4의 더 알아보기'
  - topic: '조건이 바뀌는 조회를 만드는 방법(Querydsl, Specification)'
    where: '다루지 않음: 동적 쿼리(P11)'
  - topic: 'JPA를 써도 SQL을 알아야 한다. 나간 SQL을 로그로 보고, 느린 쿼리와 쿼리 수를 확인한다'
    where: '실무에서는'
  - topic: '`save`를 부르지 않아도 바뀐 값이 저장되는 이유, 같은 id를 두 번 조회할 때의 SQL'
    where: '다루지 않음: 영속성 컨텍스트(P2)'
  - topic: '연관된 엔티티를 매핑하는 방법(`@ManyToOne`)'
    where: '다루지 않음: 연관관계 매핑(P3)'
  - topic: 'id를 만드는 전략(IDENTITY와 SEQUENCE)의 차이'
    where: '다루지 않음: 식별자 생성 전략(P9). 이 레슨은 `@GeneratedValue`를 한 줄로 소개만 한다'
links:
  test: https://github.com/wanja727/dev-lessons/blob/main/verification/src/test/java/lab/devlessons/jpabasics/JpaBasicsTest.java
  spec: https://jakarta.ee/specifications/persistence/3.1/
  queryMethods: https://docs.spring.io/spring-data/jpa/reference/jpa/query-methods.html
  bootData: https://docs.spring.io/spring-boot/how-to/data-initialization.html
codes:
  predict: |-
    @Query("""
        select m from CafeMenu m
        where m.price >= :min
        order by m.price
        """)
    List<CafeMenu> findExpensive(int min);
  jdbc: |-
    String sql = "select id, menu_name,"
        + " price from cafe_menu"
        + " where id = ?";
    PreparedStatement ps =
        conn.prepareStatement(sql);
    ps.setLong(1, id);
    ResultSet rs = ps.executeQuery();
    rs.next();
    CafeMenu menu = new CafeMenu(
        rs.getString("menu_name"),
        rs.getInt("price"));
  layers: |-
    내 코드
      menus.findByName("latte")
    Spring Data JPA
      리포지토리 구현(프록시)
    JPA (jakarta.persistence)
      EntityManager 인터페이스
    Hibernate
      JPQL → SQL, 결과 → 객체
    JDBC → PostgreSQL
  entity: |-
    @Entity
    @Table(name = "cafe_menu")
    public class CafeMenu {
      @Id
      @GeneratedValue(strategy = IDENTITY)
      private Long id;

      @Column(name = "[[menu_name]]")
      private String name;

      private int price;

      private boolean [[soldOut]];

      protected CafeMenu() {
      }

      public CafeMenu(String name,
          int price) {
        this.name = name;
        this.price = price;
      }
    }
  tableRun: |-
    -- 테이블 cafe_menu의 컬럼을 읽는다
    select column_name, data_type
    from information_schema.columns
    where table_name = 'cafe_menu'
  proxyRun: |-
    @Autowired CafeMenuRepository menus;

    menus.getClass().getName();
  saveRun: |-
    menus.save(new CafeMenu("mocha", 5800));
    menus.findById(7L);
  derivedRun: |-
    menus.findByName("latte");
    menus.findByPriceLessThan(5000);
  typo: |-
    List<CafeMenu> [[findByNmae]](String name);
  typoFixed: |-
    Optional<CafeMenu> findByName(
        String name);
  repository: |-
    public interface CafeMenuRepository
        extends JpaRepository<CafeMenu, Long> {

      Optional<CafeMenu> findByName(
          String name);

      List<CafeMenu> findByPriceLessThan(
          int price);
    }
  yml: |-
    spring:
      jpa:
        hibernate:
          ddl-auto: validate
    logging:
      level:
        org.hibernate.SQL: debug
predict:
  title: 이 JPQL은 어떤 SQL이 될까요?
  text: '리포지토리에 5000원 이상인 메뉴를 가격순으로 찾는 메서드를 JPQL로 적었어요. DB에는 `cafe_menu` 테이블이 있고, 메뉴 이름은 `menu_name` 컬럼에 있어요. 이 JPQL이 SQL로 바뀌면 FROM 뒤에는 무엇이 올까요? 모르는 게 정상이니 감으로 골라 보세요. 답은 질문 4에 나와요.'
  code: predict
  label: 내 예측
  options:
    - value: entity
      label: 'CafeMenu (적은 그대로)'
    - value: table
      label: 'cafe_menu (테이블 이름)'
    - value: error
      label: 테이블 이름을 쓰지 않아서 실패한다
  answer: table
  storageKey: jpa-basics-predict
  wrong: 예측은 "{label}"이었어요. 틀린 예측이 더 오래 남으니 괜찮아요.
questions:
  - id: q1
    title: ORM은 무엇을 대신해 주고, JPA와 Hibernate는 무엇이 다른가요?
    conclusion:
      lead: 'ORM은 객체와 테이블 사이를 옮기는 코드를 대신 만들어 줘요. JPA는 그 방법을 정한 자바 표준이고, Hibernate는 그 표준을 실제로 구현한 라이브러리예요.'
      sub: 'Spring Data JPA는 그 위에서 리포지토리 구현까지 만들어 주는 스프링 프로젝트예요. 스프링 부트에서 JPA를 쓰면 세 층이 함께 일해요.'
    says:
      - 'JDBC로 메뉴 하나를 저장하고 조회하는 코드를 보인다. SQL 문자열, 파라미터 넣기, `ResultSet`에서 필드 하나씩 꺼내 객체 만들기. 필드가 하나 늘면 SQL 세 곳과 꺼내는 코드를 함께 고친다. 이 반복이 ORM이 없애는 일이다'
      - '객체와 테이블의 차이를 표로 둔다: 다른 데이터를 가리키는 방법(참조와 외래 키), 같은지 비교(==, equals와 기본 키), 상속(있음과 없음). 이 차이를 패러다임 불일치라고 부른다는 것을 한 줄로 적는다'
      - 'JPA는 `jakarta.persistence` 패키지의 인터페이스와 어노테이션이다. 혼자서는 아무것도 하지 않는다. 구현이 필요하고 스프링 부트의 기본 구현이 Hibernate다. 테스트로 `EntityManagerFactory`의 실제 클래스가 `org.hibernate`로 시작하는 것을 실제 출력으로 보인다'
      - 'Spring Data JPA는 JPA를 직접 쓰는 코드(EntityManager)까지 감춘다. 세 층의 그림: 내 코드 → Spring Data JPA(리포지토리) → JPA(EntityManager) → Hibernate → JDBC → DB'
    widget:
      kind: classify
      note: '설명을 하나씩 보여 주고 JPA, Hibernate, Spring Data JPA 가운데 무엇인지 고른다. 예: "`@Entity` 어노테이션을 정의한다"(JPA), "JPQL을 SQL로 바꾼다"(Hibernate), "`findByName`의 구현을 만든다"(Spring Data JPA), "`EntityManager` 인터페이스를 정의한다"(JPA), "`JpaRepository` 인터페이스를 준다"(Spring Data JPA)'
    asks:
      - '본문의 예시: 스프링 부트에서 `EntityManagerFactory`를 주입받아 실제 클래스 이름을 찍으면 어느 라이브러리의 클래스가 나오나 (Hibernate. JPA는 인터페이스이고 구현은 Hibernate다)'
      - '옮긴 상황: 팀이 Hibernate 대신 다른 JPA 구현(EclipseLink)으로 바꾸려 한다. `@Entity`, `EntityManager`만 쓴 코드와 Hibernate 전용 클래스를 직접 쓴 코드 가운데 고칠 곳이 생기는 것은 (Hibernate 전용 클래스를 쓴 코드. JPA 표준만 쓴 코드는 구현을 바꿔도 그대로다)'
    body:
      - p: 'JPA가 없으면 메뉴 하나를 id로 읽는 데 이만큼 써요. 자바의 DB 표준 API인 JDBC로 쓴 코드예요.'
      - code: jdbc
      - p: 'SQL을 문자열로 쓰고, 값을 넣고, 결과에서 컬럼을 하나씩 꺼내 객체를 만들어요. 메뉴에 필드가 하나 늘면 저장, 조회, 수정의 SQL과 꺼내는 코드를 모두 고쳐요. 테이블마다 이 일을 되풀이해요.'
      - p: '되풀이하는 이유는 객체와 테이블의 생김새가 달라서예요.'
      - table:
          head: [무엇, 자바 객체, DB 테이블]
          rows:
            - [다른 데이터를 가리키기, 필드에 객체의 참조, 외래 키 컬럼에 다른 행의 id]
            - [같은지 비교, '`==`(같은 객체)와 `equals`', 기본 키가 같으면 같은 행]
            - [상속, 있음, 없음]
      - p: '이 차이를 **패러다임 불일치**라고 불러요. **ORM**(Object-Relational Mapping)은 이 차이를 메워 주는 기술이에요. 개발자는 객체를 저장하고 꺼내고, 그 사이의 SQL은 ORM이 만들어요.'
      - h3: 이름이 셋인 이유
      - p: '스프링 부트에서 JPA를 쓰면 세 가지가 함께 일해요.'
      - ul:
          - '**JPA**(Jakarta Persistence)는 자바 ORM의 **표준 명세**예요. `@Entity` 같은 어노테이션과 `EntityManager` 같은 인터페이스를 정해요. 정하기만 하고 실제로 일하지는 않아요.'
          - '**Hibernate**는 JPA를 **구현한 라이브러리**예요. JPQL을 SQL로 바꾸고, SQL을 보내고, 결과로 객체를 만들어요. 스프링 부트의 기본 구현이에요.'
          - '**Spring Data JPA**는 JPA 위에서 **리포지토리의 구현까지 만들어 주는** 스프링 프로젝트예요. 질문 3에서 봐요.'
      - code: layers
      - p: 'JPA가 인터페이스라면, 스프링이 넣어 준 객체의 진짜 클래스는 무엇일까요? JPA의 `EntityManagerFactory`를 주입받아 실제 구현을 꺼내 봤어요.'
      - ci:
          key: impl
          label: 실제 출력 보기
          source: JpaBasicsTest.hibernateIsTheImplementation
      - p: '`org.hibernate`로 시작하는 클래스예요. 내 코드는 JPA의 인터페이스만 보고, 일은 Hibernate가 해요. 그래서 JPA 표준만 쓴 코드는 구현을 다른 것으로 바꿔도 그대로 둘 수 있어요.'
      - widget:
          kind: classify
          categories:
            - JPA
            - Hibernate
            - Spring Data JPA
          items:
            - text: '`@Entity`, `@Id` 어노테이션을 정의한다'
              answer: 1
              explain: 'JPA 명세의 어노테이션이에요. 패키지가 `jakarta.persistence`예요.'
            - text: JPQL을 PostgreSQL에 보낼 SQL로 바꾼다
              answer: 2
              explain: 실제로 SQL을 만들고 보내는 것은 구현인 Hibernate예요.
            - text: '`findByName`이라는 이름만 보고 조회 구현을 만든다'
              answer: 3
              explain: 리포지토리 메서드를 구현해 주는 것은 Spring Data JPA예요.
            - text: '`EntityManager` 인터페이스를 정한다'
              answer: 1
              explain: 'JPA 명세가 정한 인터페이스예요. 구현은 Hibernate가 줘요.'
            - text: '`JpaRepository` 인터페이스를 준다'
              answer: 3
              explain: 'Spring Data JPA의 인터페이스예요. 패키지가 `org.springframework.data.jpa`예요.'
      - quiz:
          q: 'JPA 표준 어노테이션과 `EntityManager`만 쓴 코드가 있어요. JPA 구현을 Hibernate에서 다른 구현으로 바꾸면 이 코드는 어떻게 될까요?'
          options:
            - 모두 다시 써야 한다
            - 대부분 그대로 둘 수 있다
            - JPA는 Hibernate에서만 동작해서 바꿀 수 없다
          answer: 2
          explain: 'JPA는 표준이고 구현이 여럿이에요. 표준만 쓴 코드는 구현이 바뀌어도 그대로예요.'
      - next: 'ORM이 객체와 테이블을 이어 준다면, 어느 클래스가 어느 테이블인지는 어디에 적을까요?'
    recall: 'ORM은 객체와 테이블의 생김새 차이 때문에 생기는 SQL과 변환 코드를 대신 만들어 줘요. JPA는 그 방법을 정한 자바 표준 명세(어노테이션과 인터페이스)이고, Hibernate는 JPA를 구현해 실제로 SQL을 만들고 보내는 라이브러리예요. Spring Data JPA는 그 위에서 리포지토리 구현까지 만들어 주는 스프링 프로젝트예요.'
  - id: q2
    title: 엔티티 클래스는 어떻게 테이블이 되나요?
    conclusion:
      lead: '클래스에 `@Entity`를 붙이고 필드에 대응할 컬럼을 어노테이션으로 적으면, Hibernate가 그 정보로 테이블과 SQL을 만들어요.'
      sub: '`@Id`는 기본 키, `@Column`은 컬럼 이름과 제약이에요. 적지 않은 필드는 필드 이름을 스네이크 케이스로 바꾼 컬럼이 돼요.'
    says:
      - '코드 entity를 줄마다 설명한다. `@Entity`는 이 클래스가 테이블 하나와 대응한다는 표시, `@Table`은 테이블 이름, `@Id`는 기본 키, `@GeneratedValue`는 id를 DB가 만들게 한다는 표시(전략은 P9), `@Column(name = "menu_name")`은 컬럼 이름'
      - '테스트가 `ddl-auto: create-drop`으로 만든 테이블의 컬럼을 `information_schema`에서 읽어 실제 출력으로 보인다. `name` 필드는 `menu_name` 컬럼이 되고 `price`는 그대로 `price`가 된다. 카멜 케이스 필드(`createdAt`)는 `created_at`이 된다'
      - '인자 없는 생성자가 필요한 이유: Hibernate는 조회한 행으로 객체를 만들 때 먼저 빈 객체를 만들고 필드를 채운다. 그래서 `protected`로라도 둔다. 밖에서는 이름과 가격을 받는 생성자를 쓴다'
      - '엔티티는 테이블의 행 하나에 대응하는 객체다. 같은 id면 같은 행이다'
    asks:
      - '본문의 예시: 코드 entity에서 `price` 필드의 컬럼 이름은 무엇인가 (`price`. `@Column`을 적지 않으면 필드 이름을 쓴다)'
      - '옮긴 상황: `@Entity class Order { @Id Long id; LocalDateTime orderedAt; }`가 있다. `orderedAt`은 어떤 컬럼 이름이 되나 (`ordered_at`. 스프링 부트의 기본 이름 전략이 카멜 케이스를 스네이크 케이스로 바꾼다)'
    body:
      - p: '어느 클래스가 어느 테이블인지는 클래스에 어노테이션으로 적어요. 이렇게 테이블과 대응하는 클래스를 **엔티티**라고 해요. 엔티티 객체 하나가 테이블의 행 하나예요.'
      - code: entity
        notes:
          - mark: menu_name
            as: str
            text: '`@Column`에 적은 이름이 컬럼 이름이 돼요. 필드 이름 `name`과 일부러 다르게 했어요.'
          - mark: soldOut
            as: code
            text: '`@Column`을 적지 않은 필드예요. 이름을 어떻게 지을지는 아래 출력에서 봐요.'
      - ul:
          - '`@Entity`: 이 클래스가 테이블 하나와 대응한다는 표시예요. `@Table`로 테이블 이름을 정해요.'
          - '`@Id`: 기본 키 필드예요.'
          - '`@GeneratedValue`: id를 DB가 만들게 해요. `IDENTITY`는 INSERT할 때 DB의 자동 증가 값을 쓰는 방식이에요. 다른 방식과의 차이는 식별자 생성 전략 레슨(P9)에서 다뤄요.'
          - '`@Column`: 컬럼 이름과 제약(`nullable`, `unique`)이에요. 적지 않아도 필드는 컬럼이 돼요.'
      - p: '이 저장소의 테스트 앱은 `ddl-auto: create-drop`으로 엔티티를 보고 테이블을 만들어요. 만들어진 테이블의 컬럼을 DB에서 읽었어요.'
      - ci:
          key: table
          label: 실제 컬럼 보기
          source: JpaBasicsTest.entityBecomesTable
          code: tableRun
      - p: '`name` 필드는 `menu_name` 컬럼이 됐고, `name`이라는 컬럼은 없어요. `@Column`을 적지 않은 `price`는 그대로 `price`, 카멜 케이스인 `soldOut`은 `sold_out`이 됐어요. 스프링 부트의 기본 이름 규칙이 대문자 앞에 밑줄을 넣고 소문자로 바꿔요.'
      - h3: 인자 없는 생성자가 필요한 이유
      - p: 'Hibernate는 조회한 행으로 객체를 만들 때, 먼저 인자 없는 생성자로 빈 객체를 만들고 필드에 값을 채워요. 그래서 엔티티에는 인자 없는 생성자가 있어야 해요. 밖에서 빈 객체를 만들지 못하게 `protected`로 두고, 코드에서는 이름과 가격을 받는 생성자를 써요.'
      - p: '만드는 규칙이 있으면(가격은 0보다 커야 한다) 생성자 대신 `CafeMenu.of(name, price)` 같은 정적 팩토리 메서드만 열어 두기도 해요. 인자 없는 생성자는 Hibernate만 쓰고, 개발자가 쓰는 길은 이름 있는 메서드 하나로 모여요. 정적 팩토리는 [팩토리](lesson:factory) 레슨에서 다뤄요.'
      - quiz:
          q: '`@Entity class Order`에 `@Column` 없이 `LocalDateTime orderedAt` 필드를 뒀어요. 스프링 부트의 기본 설정에서 컬럼 이름은 무엇일까요?'
          options:
            - '`orderedAt`'
            - '`ordered_at`'
            - '`ORDEREDAT`'
          answer: 2
          explain: '스프링 부트의 기본 이름 규칙이 카멜 케이스를 스네이크 케이스로 바꿔요. `soldOut`이 `sold_out`이 된 것과 같아요.'
      - next: '엔티티로 테이블은 만들었어요. 그런데 저장하고 찾는 코드는 어디에 쓸까요?'
    recall: '클래스에 `@Entity`를 붙이고 `@Id`로 기본 키, `@Column`으로 컬럼 이름과 제약을 적으면, Hibernate가 그 정보로 테이블과 SQL을 만들어요. 적지 않은 필드는 필드 이름을 스네이크 케이스로 바꾼 컬럼이 돼요. Hibernate가 조회 결과로 객체를 만들 때 쓰도록 인자 없는 생성자를 `protected`로 둬요.'
  - id: q3
    title: 리포지토리는 인터페이스만 썼는데 어떻게 동작하나요?
    conclusion:
      lead: '스프링이 앱을 띄울 때 그 인터페이스의 구현 객체(프록시)를 만들어 빈으로 넣어 줘요.'
      sub: '`JpaRepository<CafeMenu, Long>`을 상속하면 `save`, `findById`, `findAll`을 받고, 메서드 이름 규칙으로 적은 메서드는 이름을 읽어 WHERE 조건을 만들어요.'
    says:
      - '코드 repository. `JpaRepository<T, ID>`의 T는 엔티티 타입, ID는 `@Id` 필드의 타입이다. 제네릭 레슨에서 본 타입 매개변수라서 `findById`가 `Optional<CafeMenu>`를 돌려주고 `Long`을 받는다'
      - '인터페이스는 구현이 없으면 객체를 만들 수 없다(상속과 다형성 레슨). 스프링 데이터가 실행 중에 이 인터페이스를 구현한 프록시를 만든다. 테스트로 주입받은 객체가 프록시인 것과 클래스 이름을 실제 출력으로 보인다'
      - '`save`는 `INSERT`, `findById`는 `where id=?`인 `SELECT`가 된다. 실제로 나간 SQL을 나란히 보인다'
      - '메서드 이름 쿼리: `findBy` 뒤의 `Name`은 필드 이름, `PriceLessThan`은 `price < ?`가 된다. 나간 SQL을 실제 출력으로 보인다. 필드 이름이 아니라 컬럼 이름(`menu_name`)을 쓰면 안 된다'
    widget:
      kind: toggle
      note: '메서드를 고르면(`save`, `findById`, `findByName`, `findByPriceLessThan`) 그 메서드가 만든 실제 SQL과, 메서드 이름의 어느 부분이 SQL의 어디가 됐는지를 보여 준다'
    asks:
      - '본문의 예시: `CafeMenuRepository`에 `findByPriceLessThan(5000)`을 부르면 WHERE 절은 무엇인가 (`price < ?`에 5000)'
      - '옮긴 상황: `interface OrderRepository extends JpaRepository<Order, Long>`에 `List<Order> findByStatus(String status)`를 더했다. 구현 클래스를 쓰지 않았을 때 서비스에서 주입받아 부르면 어떻게 되나 (동작한다. 스프링 데이터가 구현을 만들고 `where status = ?`인 SELECT가 나간다)'
    body:
      - p: '저장하고 찾는 코드는 **리포지토리**에 모아요. Spring Data JPA에서는 인터페이스 하나만 써요.'
      - code: repository
      - p: '`JpaRepository<CafeMenu, Long>`의 두 타입은 [제네릭](lesson:generics)의 타입 매개변수예요. 앞은 다룰 엔티티, 뒤는 그 엔티티의 `@Id` 타입이에요. 그래서 상속받은 `findById`는 `Long`을 받고 `Optional<CafeMenu>`를 돌려줘요. `save`, `findById`, `findAll`, `deleteById` 같은 메서드를 쓰지 않아도 이미 가지고 있어요.'
      - h3: 구현은 누가 만들까요
      - p: '인터페이스는 구현이 없으면 객체를 만들 수 없어요([상속과 다형성](lesson:inheritance-polymorphism)). 그런데 서비스는 이 인터페이스를 주입받아 바로 써요. 주입받은 객체의 클래스를 찍어 봤어요.'
      - ci:
          key: proxy
          label: 실제 출력 보기
          source: JpaBasicsTest.repositoryIsGenerated
          code: proxyRun
      - p: '`$Proxy`로 시작하는 클래스예요. 스프링 데이터가 앱을 띄울 때 `CafeMenuRepository`를 구현한 **프록시** 객체를 실행 중에 만들어 빈으로 등록해요. 이 객체의 `findById`는 안에서 JPA의 `EntityManager`를 불러요.'
      - h3: 메서드가 SQL이 되기까지
      - p: '상속받은 메서드도, 직접 이름을 지은 메서드도 SQL 한 줄이 돼요. 메서드를 골라 실제로 나간 SQL을 보세요.'
      - widget:
          kind: toggle
          layout: [selector, log, verdict]
          selector:
            label: 부른 메서드
            options:
              - {value: save, label: save}
              - {value: findById, label: findById}
              - {value: byName, label: findByName}
              - {value: lessThan, label: findByPriceLessThan}
          scenes:
            save:
              log: ['insert into cafe_menu (menu_name,price,sold_out) values (?,?,?)']
              verdict: '새 엔티티를 저장하면 INSERT예요. id는 IDENTITY라 DB가 만들어요.'
            findById:
              log: ['select ... from cafe_menu cm1_0 where cm1_0.id=?']
              verdict: 'id 조건의 SELECT예요. 결과 한 행으로 `CafeMenu` 객체를 만들어요.'
            byName:
              log: ['select ... from cafe_menu cm1_0 where cm1_0.menu_name=?']
              verdict: '`findBy` 뒤의 `Name`은 필드 `name`이고, 그 필드의 컬럼 `menu_name`이 조건이 됐어요.'
            lessThan:
              log: ['select ... from cafe_menu cm1_0 where cm1_0.price<?']
              verdict: '`Price`는 필드 `price`, `LessThan`은 `<`예요. 이름의 낱말이 조건이 돼요.'
      - p: '`select ...`로 줄인 컬럼 목록까지 담긴 실제 SQL이에요.'
      - ci:
          key: derived
          label: 실제 출력 보기
          source: JpaBasicsTest.derivedQueries
          code: derivedRun
      - p: '이렇게 메서드 이름의 규칙으로 쿼리를 만드는 것을 **메서드 이름 쿼리**라고 해요. 이름에 쓰는 것은 컬럼 이름이 아니라 **필드 이름**이에요. `findByMenuName`이라고 쓰면 그런 필드가 없어서 실패해요. 실무 구역에서 그 메시지를 봐요.'
      - quiz:
          q: '`interface OrderRepository extends JpaRepository<Order, Long>`에 `List<Order> findByStatus(String status)`만 더하고 구현 클래스는 쓰지 않았어요. 서비스에서 주입받아 부르면 어떻게 될까요?'
          options:
            - 구현 클래스가 없어서 앱이 뜨지 않는다
            - '`where status = ?` 조건의 SELECT가 나간다'
            - '`findAll`과 같이 조건 없이 모두 가져온다'
          answer: 2
          explain: '스프링 데이터가 인터페이스의 구현(프록시)을 만들고, 메서드 이름의 `Status`를 필드 `status`의 조건으로 바꿔요.'
      - next: '메서드 이름으로 쓰기 어려운 조회도 있어요. 그때 쓰는 JPQL은 SQL과 무엇이 다를까요?'
    recall: '스프링 데이터가 앱을 띄울 때 그 인터페이스를 구현한 프록시 객체를 만들어 빈으로 넣어 줘요. `JpaRepository<엔티티, id 타입>`을 상속하면 `save`, `findById`, `findAll`을 받고, `findByName`처럼 메서드 이름 규칙으로 적은 메서드는 이름의 필드와 조건을 읽어 WHERE 절을 만들어요. 이름에는 컬럼이 아니라 필드 이름을 써요.'
  - id: q4
    title: JPQL은 SQL과 무엇이 다른가요?
    conclusion:
      lead: 'JPQL은 테이블과 컬럼이 아니라 엔티티와 필드를 대상으로 써요.'
      sub: 'Hibernate가 매핑을 보고 테이블 이름과 컬럼 이름으로 바꾼 SQL을 DB에 보내요. 그래서 DB가 바뀌어도 JPQL은 그대로예요.'
    says:
      - '코드 predict의 JPQL과 Hibernate가 바꾼 SQL을 실제 출력으로 나란히 보인다. `CafeMenu`는 `cafe_menu`가 되고 `m.price`는 `price` 컬럼이 된다. 예측의 답을 밝힌다'
      - '메서드 이름으로 쓰기 어려운 조건(정렬과 여러 조건, 조인)은 `@Query`에 JPQL로 쓴다. `:min`은 이름 붙은 파라미터다'
      - 'JPQL에 테이블 이름을 쓰면 엔티티를 찾지 못해 앱이 뜰 때 실패한다'
      - '더 알아보기: 네이티브 쿼리(`nativeQuery = true`)는 SQL을 그대로 보낸다. DB 고유 기능이 필요할 때 쓰고, 그 대신 DB를 바꾸면 고쳐야 한다'
    asks:
      - '본문의 예시: `select m from CafeMenu m where m.name = :name`에서 `m.name`은 SQL의 어느 컬럼이 되나 (`menu_name`. `@Column`에 적은 이름)'
      - '옮긴 상황: 엔티티 `Order`가 `@Table(name = "orders")`에 매핑돼 있다. `@Query("select o from orders o")`라고 쓰면 어떻게 되나 (앱이 뜰 때 실패한다. JPQL은 테이블 이름이 아니라 엔티티 이름 `Order`를 쓴다)'
    body:
      - p: '처음 예측한 메서드예요. 메서드 이름으로 "5000원 이상을 가격순으로"를 쓰면 이름이 길어져서, `@Query`에 쿼리를 직접 적었어요.'
      - code: predict
      - p: '이 쿼리는 SQL처럼 보이지만 **JPQL**이에요. 테이블 `cafe_menu`가 아니라 엔티티 이름 `CafeMenu`를, 컬럼이 아니라 필드 `m.price`를 써요. `:min`은 메서드의 인자를 넣는 자리예요. Hibernate가 이 JPQL을 SQL로 바꿔 보냈어요.'
      - ci:
          key: jpql
          label: 실제 SQL 보기
          source: JpaBasicsTest.jpqlIsTranslated
      - p: '답은 **`cafe_menu`**예요. {{predict-result}} Hibernate가 엔티티의 매핑을 보고 `CafeMenu`를 테이블 이름 `cafe_menu`로, 필드를 컬럼으로 바꿨어요. `m`은 `cm1_0` 같은 별칭으로, `select m`은 모든 컬럼으로 바뀌었어요.'
      - table:
          head: [무엇, JPQL, SQL]
          rows:
            - [대상, 엔티티와 필드, 테이블과 컬럼]
            - [결과, 엔티티 객체, 행]
            - [DB가 바뀌면, 그대로, 고칠 수 있다]
      - p: '그래서 JPQL에 테이블 이름을 쓰면 안 돼요. `select o from orders o`처럼 쓰면 Hibernate가 `orders`라는 엔티티를 찾지 못해서 앱이 뜰 때 실패해요. `@Query`의 쿼리는 앱이 뜰 때 미리 검사하거든요.'
      - more:
          summary: '더 알아보기: SQL을 그대로 보내야 할 때'
          body:
            - p: '`@Query(value = "...", nativeQuery = true)`로 적으면 Hibernate가 바꾸지 않고 SQL을 그대로 보내요. 이것을 **네이티브 쿼리**라고 해요. PostgreSQL에만 있는 함수처럼 DB의 기능이 필요할 때 써요. 그 대신 테이블과 컬럼 이름으로 쓰니 DB나 매핑이 바뀌면 함께 고쳐야 해요.'
      - quiz:
          q: '`select m from CafeMenu m where m.name = :name`에서 `m.name`은 SQL의 어느 컬럼이 될까요?'
          options:
            - '`name`'
            - '`menu_name`'
            - '`cafe_menu.name`'
          answer: 2
          explain: 'JPQL은 필드를 쓰고, Hibernate가 `@Column(name = "menu_name")`을 보고 컬럼 이름으로 바꿔요.'
    recall: 'JPQL은 테이블과 컬럼이 아니라 엔티티와 필드를 대상으로 쓰는 쿼리예요. Hibernate가 매핑을 보고 테이블 이름과 컬럼 이름의 SQL로 바꿔 보내고, 결과를 엔티티 객체로 돌려줘요. 그래서 JPQL에 테이블 이름을 쓰면 엔티티를 찾지 못해 실패해요. SQL을 그대로 보내야 하면 네이티브 쿼리를 써요.'
practice:
  title: 스프링 부트에서는 이렇게 써요
  body:
    - p: 'JPA는 SQL을 대신 써 줄 뿐, SQL을 몰라도 되게 해 주지는 않아요. 운영에서 만나는 설정 둘과 흔한 실수 하나를 봐요.'
    - h3: 테이블은 누가 만드나
    - code: yml
    - ul:
        - '`ddl-auto`는 앱이 뜰 때 엔티티로 테이블을 어떻게 할지 정해요. `create`는 지우고 다시 만들고, `create-drop`은 끝날 때 지우고, `validate`는 엔티티와 테이블이 맞는지 확인만 해요. 운영 DB에서 `create`를 쓰면 데이터가 사라져요.'
        - '운영에서는 `validate`나 `none`으로 두고, 테이블은 마이그레이션 도구로 만들고 고쳐요. 스키마 변경과 마이그레이션 레슨(D16)에서 다뤄요.'
    - h3: 나간 SQL 보기
    - p: '`logging.level.org.hibernate.SQL: debug`로 두면 나가는 SQL을 로그로 남겨요. 비슷한 설정 `spring.jpa.show-sql: true`는 표준 출력으로 바로 찍어서 로그 설정을 따르지 않으니 로그 쪽을 써요. 개발하는 동안은 켜 두고, 메서드 하나가 SQL을 몇 번 보내는지 봐요. 같은 결과도 SQL 수가 크게 다를 수 있어요([JPA N+1 문제](lesson:jpa-n-plus-1)).'
    - h3: '흔한 실수: 메서드 이름의 오타'
    - code: typo
      notes:
        - mark: findByNmae
          as: code
          text: '`name`을 `nmae`로 잘못 썼어요. `CafeMenu`에는 그런 필드가 없어요.'
    - p: '메서드 이름 쿼리는 앱이 뜰 때 이름을 읽어 쿼리를 만들어요. 그래서 오타는 요청이 들어왔을 때가 아니라 **앱이 뜰 때** 실패해요. 이 리포지토리를 만들게 해 봤어요.'
    - ci:
        key: typo
        label: 실제 오류 보기
        source: JpaBasicsTest.typoInMethodNameFailsAtCreation
    - p: '메시지가 찾지 못한 이름(`nmae`)과 비슷한 필드(`name`)를 알려 줘요. 고친 코드는 필드 이름 그대로예요. 컬럼 이름 `menu_name`으로 `findByMenuName`이라고 써도 같은 오류가 나요.'
    - code: typoFixed
    - muted: '근거: `ddl-auto` 값의 뜻과 SQL 로그 설정은 [스프링 부트 문서](link:bootData), 메서드 이름 규칙은 [Spring Data JPA 문서](link:queryMethods). 오타의 오류는 테스트로 확인했어요.'
  says:
    - '스프링 부트의 설정 코드 yml. 운영에서는 `ddl-auto`를 `validate`나 `none`으로 두고 테이블은 마이그레이션 도구로 만든다(D16). `create`는 앱이 뜰 때 테이블을 지우고 다시 만든다. 설정 값의 뜻은 스프링 부트 문서가 근거'
    - '나간 SQL은 `logging.level.org.hibernate.SQL: debug`로 본다. `spring.jpa.show-sql`은 표준 출력으로 찍어 로그 설정을 따르지 않는다. 스프링 부트 문서가 근거'
    - '흔한 실수: 메서드 이름에 오타가 있거나(`findByNmae`) 컬럼 이름(`findByMenuName`)을 쓴다. 앱이 뜰 때 실패하고 메시지에 찾지 못한 속성 이름이 나온다. 고친 코드는 필드 이름 `findByName`. 테스트로 리포지토리를 만들 때 나는 예외 메시지를 실제 출력으로 보인다'
    - 'JPA를 써도 SQL을 알아야 한다. 같은 결과를 내는 코드도 나가는 SQL의 수가 다를 수 있다(P5 N+1). 개발 중에는 SQL 로그를 켜 둔다'
claims:
  - claim: '엔티티 `CafeMenu`로 만든 테이블에 `name` 필드는 `menu_name` 컬럼이 되고 `name` 컬럼은 없다'
    how: '`information_schema.columns`를 읽는다'
    test: 'JpaBasicsTest.entityBecomesTable'
  - claim: '`save()`는 `insert into cafe_menu`, `findById()`는 `where`가 있는 SELECT 1번이 된다'
    how: '`SqlCapture`로 나간 SQL을 본다'
    test: 'JpaBasicsTest.saveAndFind'
  - claim: '`findByName`, `findByPriceLessThan`이 `menu_name=`, `price<` 조건이 된다'
    how: '같은 방법'
    test: 'JpaBasicsTest.derivedQueries'
  - claim: 'JPQL의 `CafeMenu`가 SQL에서 `cafe_menu`가 된다'
    how: '같은 방법'
    test: 'JpaBasicsTest.jpqlIsTranslated'
  - claim: '주입받은 리포지토리는 인터페이스의 프록시다'
    how: '`AopUtils.isAopProxy`와 클래스 이름'
    test: 'JpaBasicsTest.repositoryIsGenerated'
  - claim: '`EntityManagerFactory`의 실제 구현은 Hibernate다'
    how: '`EntityManagerFactoryInfo`로 원본을 꺼낸다'
    test: 'JpaBasicsTest.hibernateIsTheImplementation'
  - claim: '카멜 케이스 필드는 스네이크 케이스 컬럼이 된다'
    how: '`createdAt` 필드를 가진 엔티티를 더해 컬럼 이름을 읽는다'
  - claim: '필드에 없는 이름의 메서드 이름 쿼리(`findByNmae`)는 리포지토리를 만들 때 실패하고 메시지에 그 이름이 나온다'
    how: '`JpaRepositoryFactory`로 잘못된 리포지토리를 만들어 예외 메시지를 남긴다'
sources:
  - 'JPA가 명세라는 것과 어노테이션: Jakarta Persistence 3.1 https://jakarta.ee/specifications/persistence/3.1/'
  - '메서드 이름 쿼리 규칙: Spring Data JPA 문서 https://docs.spring.io/spring-data/jpa/reference/jpa/query-methods.html'
  - 'ddl-auto와 SQL 로그 설정: 스프링 부트 문서 https://docs.spring.io/spring-boot/how-to/data-initialization.html'
interview:
  question: JPA, Hibernate, Spring Data JPA는 각각 무엇이고 어떻게 다른가요?
  model:
    - label: 정의
      text: JPA는 객체와 테이블을 이어 주는 ORM의 자바 표준 명세로, @Entity 같은 어노테이션과 EntityManager 같은 인터페이스를 정합니다. Hibernate는 그 명세를 구현한 라이브러리이고, Spring Data JPA는 JPA 위에서 리포지토리 구현을 만들어 주는 스프링 프로젝트입니다.
    - label: 원리
      text: 엔티티 클래스에 어노테이션으로 테이블과 컬럼의 대응을 적으면 Hibernate가 그 정보로 SQL을 만들고 결과를 객체로 바꿉니다. 리포지토리는 JpaRepository를 상속한 인터페이스만 쓰면 스프링이 실행 중에 프록시 구현을 만들어 빈으로 넣고, 메서드 이름 규칙이나 JPQL로 조회를 만듭니다. JPQL은 엔티티와 필드로 쓰고 Hibernate가 테이블과 컬럼의 SQL로 바꿉니다.
    - label: 주의할 점
      text: SQL을 대신 써 줄 뿐 SQL을 몰라도 되는 것은 아니어서, 개발 중에는 나간 SQL을 로그로 보고 쿼리 수를 확인합니다. 운영 DB에는 ddl-auto를 create로 두지 않고 validate나 none으로 두며, 메서드 이름 쿼리에는 컬럼이 아니라 필드 이름을 씁니다.
    - label: 경험
      text: '(내 프로젝트로 채우기) 예: SQL 로그를 켜 두고 화면 하나가 쿼리를 몇 번 보내는지 확인하다가, 반복문에서 쿼리가 늘어나는 것을 찾아 고쳤습니다.'
verified: 이 레슨의 SQL과 출력은 짐작이 아니라 스프링 부트 3.5와 Hibernate 6.6으로 PostgreSQL 16 컨테이너에 실제로 보내고 받은 값이에요. 코드가 바뀔 때마다 테스트([JpaBasicsTest](link:test))가 다시 돌아요.
footer: '근거: JPA의 어노테이션과 인터페이스는 [Jakarta Persistence 3.1 명세](link:spec), 메서드 이름 쿼리는 [Spring Data JPA 문서](link:queryMethods), `ddl-auto`와 SQL 로그는 [스프링 부트 문서](link:bootData). SQL은 Hibernate 6.6과 PostgreSQL 16에서 테스트로 확인했어요. 오류는 [GitHub 이슈](https://github.com/wanja727/dev-lessons/issues)로 알려 주세요.'
