# 단위 테스트와 테스트 더블 (설계서)
# 자료 파일의 칸은 docs/lesson-data-format.md에 있다.
stage: design
title: 단위 테스트와 테스트 더블
unit: 테스트와 운영
roadmap: T2
type: 자바 실행
prerequisites:
  - {slug: dependency-inversion, title: 의존 역전 원칙과 의존성 주입}
assume: '자바 21, JUnit 5.12, Mockito 5, AssertJ(스프링 부트 3.5의 `spring-boot-starter-test`에 든 버전). 클래스가 협력 객체를 인터페이스로 받고 생성자로 주입받는다는 것(의존 역전 원칙 레슨). `@Test`가 붙은 메서드를 JUnit이 실행한다는 것까지는 알아요.'
example: '회원 가입 서비스 `SignupService`. 같은 이메일이 있으면 예외를 던지고, 없으면 `MemberRepository`에 저장한 뒤 `MailSender`로 환영 메일을 보내요. DB와 메일 서버 없이 이 서비스를 테스트해요.'
intro:
  - '회원 가입 로직을 고쳤는데 확인하려면 서버를 띄우고, DB를 비우고, 포스트맨으로 요청을 보내고, 메일함을 열어 봐야 해요. 한 번에 3분이 걸리니 고칠 때마다 확인하지 않게 되고, 결국 운영에서 버그를 만나요.'
  - '단위 테스트는 클래스 하나를 떼어 몇 밀리초 만에 확인하는 코드예요. 자바 개발자는 JUnit으로 테스트를 쓰고, DB나 메일처럼 떼어 낼 수 없는 협력 객체는 Mockito로 만든 가짜(테스트 더블)로 바꿔요. 무엇을 가짜로 바꾸고 무엇을 검증하는지에 따라 테스트가 버그를 잡기도 하고, 코드만 고쳐도 깨지는 짐이 되기도 해요.'
  - '이 레슨에서는 같은 `SignupService`를 스텁, 목, 페이크로 각각 테스트해 보고, 구현을 조금 바꿨을 때 어느 테스트가 깨지는지 실제로 돌려서 확인해요.'
covers:
  - topic: '단위 테스트는 한 단위(보통 클래스 하나의 공개 메서드)를 다른 것과 떼어 빠르게 확인한다. 외부 시스템(DB, 네트워크) 없이 밀리초 안에 돈다'
    where: '질문 1'
  - topic: '테스트는 준비(given), 실행(when), 검증(then) 세 부분으로 쓴다'
    where: '질문 1'
  - topic: '무엇을 테스트하나: 공개된 동작(입력에 대한 결과와 바깥에 보이는 효과)을 본다. private 메서드나 내부 구현을 직접 검사하지 않는다'
    where: '질문 1'
  - topic: '경계값과 예외 경로도 테스트한다. 정상 경로 하나만 보면 버그는 대개 경계에 있다'
    where: '질문 1'
  - topic: '협력 객체를 생성자로 받으면 테스트에서 다른 구현을 넣을 수 있다. new로 직접 만들면 바꿀 수 없다'
    where: '질문 2. 원리는 의존 역전 원칙과 의존성 주입(O5)'
  - topic: '테스트 더블의 다섯 가지: 더미, 스텁, 스파이, 목, 페이크'
    where: '질문 2'
  - topic: '스텁은 정해진 답을 돌려줘 테스트하는 쪽이 원하는 상황을 만든다. 결과(상태)를 검증한다'
    where: '질문 3'
  - topic: '목은 어떤 메서드가 어떤 인자로 몇 번 불렸는지 기록하고, 테스트는 그 호출을 검증한다(행위 검증)'
    where: '질문 3'
  - topic: 'Mockito의 `mock`, `when(...).thenReturn`, `verify`, `ArgumentCaptor`. 스텁하지 않은 메서드는 null, 0, false, 빈 컬렉션, 빈 Optional을 돌려준다'
    where: '질문 3'
  - topic: '목을 지나치게 쓰면 구현의 호출 순서와 방식에 테스트가 묶여 리팩터링할 때마다 깨진다'
    where: '질문 4'
  - topic: '목은 진짜와 다르게 동작해도 통과한다. 그래서 바깥 경계(메일, 외부 API)에만 목을 쓰고, 값 객체와 내 도메인 객체는 진짜를 쓴다'
    where: '질문 4'
  - topic: '페이크(메모리 안의 저장소)는 진짜처럼 동작하는 가벼운 구현이다. 상태로 검증할 수 있어 구현에 덜 묶인다'
    where: '질문 4'
  - topic: 'JUnit 5의 `@Nested`와 `@DisplayName`으로 상황별로 테스트를 묶기'
    where: '실무에서는 (자바 언어 과정의 중첩 클래스(J16)가 넘긴 항목)'
  - topic: '`@ParameterizedTest`로 같은 검사를 여러 입력에 돌리기'
    where: '실무에서는'
  - topic: '`@ExtendWith(MockitoExtension.class)`, `@Mock`, `@InjectMocks`와 엄격한 스텁(쓰지 않은 스텁을 실패로 알림)'
    where: '실무에서는'
  - topic: 'static 메서드와 `LocalDateTime.now()`처럼 바꿀 수 없는 의존은 `Clock`을 주입받아 테스트한다'
    where: '질문 2의 더 알아보기'
  - topic: '테스트 커버리지 숫자는 테스트가 지나간 줄을 셀 뿐, 맞게 검증했는지는 모른다'
    where: '질문 1의 더 알아보기'
  - topic: '스프링 컨텍스트를 띄우는 테스트, `@MockitoBean`'
    where: '다루지 않음: 스프링 테스트(T3)'
  - topic: '진짜 DB로 확인하는 테스트'
    where: '다루지 않음: 통합 테스트와 Testcontainers(T4)'
  - topic: 'TDD(테스트를 먼저 쓰는 개발 방식)'
    where: '질문 1의 더 알아보기'
codes:
  service: |-
    class SignupService {
      private final MemberRepository repo;
      private final MailSender mail;

      SignupService(MemberRepository repo,
          MailSender mail) {
        this.repo = repo;
        this.mail = mail;
      }

      Member signup(String email) {
        if (repo.existsByEmail(email)) {
          throw new DuplicateEmail(email);
        }
        Member m = repo.save(new Member(email));
        mail.send(email, "가입을 환영해요");
        return m;
      }
    }
  predict: |-
    MemberRepository repo =
        mock(MemberRepository.class);
    MailSender mail = mock(MailSender.class);
    var service = new SignupService(repo, mail);

    Member m = service.signup("a@b.com");
    // m은?
  stub: |-
    when(repo.existsByEmail("a@b.com"))
        .thenReturn(true);

    assertThatThrownBy(
        () -> service.signup("a@b.com"))
        .isInstanceOf(DuplicateEmail.class);
  mockVerify: |-
    service.signup("a@b.com");

    verify(mail).send("a@b.com",
        "가입을 환영해요");
  fake: |-
    class MemoryMemberRepository
        implements MemberRepository {
      Map<String, Member> store =
          new HashMap<>();
      // existsByEmail, save를 맵으로 구현
    }
  nested: |-
    @ExtendWith(MockitoExtension.class)
    class SignupServiceTest {
      @Mock MemberRepository repo;
      @Mock MailSender mail;
      @InjectMocks SignupService service;

      @Nested
      @DisplayName("이미 있는 이메일이면")
      class Duplicate {
        @Test
        void 예외를_던지고_메일은_없다() {
          given(repo.existsByEmail(any()))
              .willReturn(true);
          ...
        }
      }
    }
predict:
  text: '코드 predict는 `MemberRepository`와 `MailSender`를 Mockito로 만들고 아무 답도 정하지 않은 채 `signup`을 불러요. 코드 service에서 `repo.save`는 저장한 회원을 돌려줘요. `m`에는 무엇이 들어 있을까요? 보기: 이메일이 a@b.com인 회원, null, 예외가 나서 값이 없다.'
  answer: 'null. 답을 정하지 않은 목의 메서드는 객체 타입이면 null을 돌려준다. `existsByEmail`도 false라 예외 없이 지나간다. 질문 3에서 밝힌다.'
questions:
  - id: q1
    title: 단위 테스트는 무엇을 확인하나요?
    conclusion:
      lead: '클래스 하나를 떼어, 공개된 메서드에 입력을 주었을 때 나오는 결과와 바깥에 보이는 효과를 확인해요.'
      sub: '내부에서 어떻게 계산했는지가 아니라 무엇이 나왔는지를 봐야, 구현을 고쳐도 동작이 같으면 테스트가 그대로 통과해요.'
    says:
      - '단위 테스트는 DB, 네트워크, 파일 없이 메모리 안에서 몇 밀리초 만에 끝난다. 그래서 고칠 때마다 수백 개를 돌릴 수 있다. 테스트 실행 시간을 실제 출력으로 보인다'
      - '테스트 하나는 준비(given), 실행(when), 검증(then)으로 쓴다. 할인 금액을 계산하는 `DiscountPolicy` 같은 협력 객체 없는 클래스로 먼저 보인다'
      - '검증하는 것은 공개된 동작이다: 돌려준 값, 던진 예외, 바깥에 보이는 효과(저장됨, 메일이 나감). private 메서드를 리플렉션으로 불러 검사하지 않는다. private 메서드는 공개 메서드를 통해 함께 확인된다'
      - '정상 경로 하나로는 모자라다. 경계값(0, 빈 문자열, 최대값)과 예외 경로를 함께 본다. 할인 정책에서 경계값 하나가 버그를 잡는 예를 테스트로 보인다'
      - '코드 service의 `signup`은 `MemberRepository`와 `MailSender`가 있어야 돈다. 이 둘이 진짜면 DB와 메일 서버가 필요하다. 다음 질문으로 잇는다'
      - '더 알아보기: 커버리지는 테스트가 지나간 줄의 비율이다. 검증 없이 부르기만 해도 올라간다. TDD는 실패하는 테스트를 먼저 쓰고 그것을 통과시키는 코드를 쓰는 방식이다'
    asks:
      - '본문의 예시: `DiscountPolicy`의 private 메서드 `round`를 테스트하고 싶다. 어떻게 하나 (공개 메서드 `discount`의 결과로 확인한다. private 메서드를 따로 부르지 않는다)'
      - '옮긴 상황: 배송비 계산기가 "3만 원 이상이면 무료"다. 2만 원짜리 입력 하나로만 테스트했다. 빠진 입력은 무엇인가 (경계값 30000과 29999)'
  - id: q2
    title: 협력 객체가 DB나 메일이면 어떻게 테스트하나요?
    conclusion:
      lead: '협력 객체를 테스트용 가짜(테스트 더블)로 바꿔 끼워요. 생성자로 받게 만들어 둔 클래스라서 바꿀 수 있어요.'
      sub: '테스트 더블은 하는 일에 따라 더미, 스텁, 스파이, 목, 페이크로 나뉘어요.'
    says:
      - '코드 service는 `MemberRepository`와 `MailSender`를 생성자로 받는다. 테스트는 진짜 대신 같은 인터페이스의 다른 구현을 넣는다. 클래스 안에서 `new JpaMemberRepository()`로 만들었다면 바꿀 수 없다(O5)'
      - '테스트 더블은 영화의 대역 배우에서 온 말이다. 다섯 가지를 표로 정리한다: 더미(자리만 채운다), 스텁(정해진 답을 준다), 스파이(진짜처럼 동작하며 호출을 기록한다), 목(호출을 기록하고 그 호출을 검증한다), 페이크(진짜처럼 동작하는 가벼운 구현, 예: 메모리 저장소)'
      - '더미의 예: 가입 거절 경로만 테스트할 때 `MailSender`는 불리지 않으니 아무것이나 넣는다'
      - 'Mockito의 `mock(MailSender.class)`은 인터페이스의 구현 클래스를 실행 중에 만들어 낸다. 직접 클래스를 쓰지 않아도 된다'
      - '더 알아보기: `LocalDateTime.now()`처럼 static으로 부르는 의존은 바꿀 수 없다. `Clock`을 생성자로 받고 테스트에서 `Clock.fixed`를 넣으면 시간을 고정할 수 있다. 테스트로 보인다'
    widget:
      kind: classify
      note: '테스트 코드의 조각(아무 동작도 안 하는 `MailSender`, 늘 true를 돌려주는 `existsByEmail`, 불린 인자를 기록하고 `verify`로 확인하는 메일, `HashMap`에 저장하는 저장소, 진짜 객체를 감싸 호출을 세는 것)을 보고 더미, 스텁, 스파이, 목, 페이크 가운데 하나를 고른다'
    asks:
      - '본문의 예시: `SignupService`가 생성자에서 `this.mail = new SmtpMailSender()`로 메일을 만든다면 테스트에서 메일을 가짜로 바꿀 수 있나 (없다. 바깥에서 넣을 길이 없다)'
      - '옮긴 상황: 주문 서비스 테스트에서 `HashMap`으로 저장과 조회를 진짜처럼 구현한 `OrderRepository`를 썼다. 이 테스트 더블은 무엇인가 (페이크)'
  - id: q3
    title: 목과 스텁은 무엇이 다른가요?
    conclusion:
      lead: '스텁은 정해진 답을 돌려줘 상황을 만들고 테스트는 결과를 검증해요. 목은 불린 것을 기록하고 테스트는 그 호출을 검증해요.'
      sub: 'Mockito의 `mock()`으로 만든 객체 하나가 `when`으로 쓰면 스텁, `verify`로 쓰면 목이 돼요. 이름이 아니라 쓰는 방식이 둘을 갈라요.'
    says:
      - '예측의 답을 밝힌다. 답을 정하지 않은 목은 객체 타입이면 null, int는 0, boolean은 false, 컬렉션은 빈 컬렉션, `Optional`은 빈 `Optional`을 돌려준다. 그래서 `existsByEmail`은 false, `save`는 null이고 `m`은 null이다. 실제 출력을 보인다'
      - '코드 stub. `when(repo.existsByEmail("a@b.com")).thenReturn(true)`로 "이미 있는 이메일"이라는 상황을 만든다. 테스트는 예외가 나는지(결과)를 본다. 이것이 스텁이다'
      - '코드 mockVerify. 메일은 돌려주는 값이 없다. 가입이 됐을 때 메일이 나갔는지는 결과로 볼 수 없다. `verify(mail).send(...)`로 그 인자로 한 번 불렸는지를 본다. 이것이 목이다'
      - '`verify(mail, never()).send(any(), any())`로 불리지 않은 것도 확인한다. 이메일이 겹칠 때 메일이 나가지 않는 것을 이렇게 본다'
      - '`ArgumentCaptor`로 넘어간 인자를 붙잡아 꺼내 볼 수 있다. `save`에 넘어간 `Member`의 이메일을 확인하는 예를 보인다'
    asks:
      - '본문의 예시: 이메일이 겹치는 경우를 테스트하려면 `repo`를 스텁과 목 가운데 무엇으로 쓰나 (스텁. `existsByEmail`이 true를 돌려주게 해 상황을 만든다)'
      - '옮긴 상황: 주문이 취소되면 `PushSender.push`를 부르는 서비스가 있다. `push`는 void다. 취소했을 때 알림이 갔는지 확인하는 방법은 (목. `verify(push).push(...)`로 호출을 검증한다)'
      - '실무 구역: `@Mock OrderRepository repo`에 `findById`를 스텁하지 않고 `repo.findById(1L).orElseThrow()`를 부르는 코드를 테스트하면 무슨 일이 생기나 (예외가 난다. 스텁하지 않은 `Optional` 메서드는 빈 `Optional`을 돌려준다)'
  - id: q4
    title: 목을 많이 쓰면 무엇이 나빠지나요?
    conclusion:
      lead: '테스트가 구현의 호출 방식에 묶여, 동작은 그대로인데 코드를 고칠 때마다 깨져요. 그리고 목이 진짜와 다르게 동작해도 테스트는 통과해요.'
      sub: '그래서 결과로 검증할 수 있으면 결과로 보고, 목은 메일이나 외부 API처럼 결과를 볼 수 없는 바깥 경계에만 써요.'
    says:
      - '`SignupService`가 `existsByEmail` 다음 `save`를 부르던 것을, `findByEmail(...).isPresent()`로 바꿨다. 동작은 같다. `verify(repo).existsByEmail(...)`까지 검증하던 목 테스트는 깨지고, 페이크 저장소(코드 fake)로 "가입 뒤 저장소에 회원이 있다"를 본 테스트는 통과한다. 두 테스트를 실제로 돌려 결과를 보인다'
      - '목은 내가 정한 대로만 동작한다. 진짜 저장소는 이메일이 겹치면 유니크 제약으로 예외를 던지는데, 목은 그런 일을 모른다. 목으로만 테스트하면 이 차이를 못 잡는다. 진짜 DB의 동작은 T4에서 확인한다'
      - '기준: 결과(돌려준 값, 저장된 상태)로 확인할 수 있으면 그것을 본다. 메일, 결제 API, 메시지 발행처럼 바깥에 나가는 호출이라 결과를 볼 수 없을 때 목으로 호출을 검증한다'
      - '`Member`, `Money` 같은 값 객체와 내 도메인 객체는 목으로 만들지 않는다. 진짜를 만들어 쓰는 것이 더 쉽고 정확하다'
    widget:
      kind: toggle
      note: '구현을 "고치기 전"과 "`findByEmail`로 고친 뒤"로 바꿔 가며, 목으로 호출을 검증한 테스트와 페이크로 상태를 검증한 테스트의 결과(통과, 실패)를 나란히 보인다. 고친 뒤 목 테스트만 빨간색이 된다'
    asks:
      - '본문의 예시: `existsByEmail`을 `findByEmail(...).isPresent()`로 바꿨다. `verify(repo).existsByEmail("a@b.com")`이 든 테스트는 어떻게 되나 (실패한다. 동작은 같지만 그 메서드가 불리지 않는다)'
      - '옮긴 상황: 장바구니 합계를 테스트하면서 `Item` 객체를 목으로 만들어 `getPrice()`를 스텁했다. 더 나은 방법은 (진짜 `Item`을 만들어 쓴다. 값 객체는 목으로 만들지 않는다)'
practice:
  says:
    - '실제로 쓰는 모양: 코드 nested. `@ExtendWith(MockitoExtension.class)`를 붙이면 `@Mock` 필드가 만들어지고 `@InjectMocks`가 생성자로 넣어 준다. 스프링을 띄우지 않으니 빠르다. 스프링 부트 테스트 스타터에 Mockito가 들어 있다'
    - '`@Nested`와 `@DisplayName`으로 "이미 있는 이메일이면", "새 이메일이면"처럼 상황별로 묶는다. 테스트 보고서가 문장처럼 읽힌다. 중첩 클래스가 static이 아닌 내부 클래스라 바깥의 `@Mock` 필드를 쓸 수 있다(J16)'
    - '`@ParameterizedTest`와 `@CsvSource`로 경계값 여러 개를 한 테스트에 넣는다. 질문 1의 배송비 경계값을 이렇게 쓴다'
    - '흔한 실수: 스텁의 인자를 잘못 적는다. `when(repo.existsByEmail("a@b.co"))`처럼 오타가 나면 스텁이 쓰이지 않고 false가 돌아와 테스트가 엉뚱하게 통과하거나 실패한다. `MockitoExtension`은 엄격한 스텁이 기본이라, 쓰이지 않은 스텁이나 다른 인자로 불린 스텁을 `UnnecessaryStubbingException`이나 `PotentialStubbingProblem`으로 알려 준다. 고친 코드: 인자를 바로 적거나 `any()`를 쓴다. 테스트로 그 예외를 보인다'
    - 'BDD 스타일 `given(...).willReturn(...)`은 `when(...).thenReturn(...)`과 같은 일을 한다. given-when-then의 이름과 맞춰 읽으려고 쓴다'
claims:
  - claim: '답을 정하지 않은 목은 객체에 null, boolean에 false, `Optional`에 빈 `Optional`, `List`에 빈 리스트를 돌려준다. 그래서 코드 predict의 `m`은 null이다'
    how: 'Mockito 5로 목을 만들고 각 메서드의 반환값을 남긴다'
  - claim: '`existsByEmail`을 true로 스텁하면 `DuplicateEmail`이 나고 `verify(mail, never())`가 통과한다'
    how: 'Mockito로 확인한다'
  - claim: '구현을 `findByEmail`로 바꾸면 호출을 검증한 목 테스트는 실패하고 페이크로 상태를 본 테스트는 통과한다'
    how: '고치기 전과 고친 뒤의 `SignupService` 두 클래스를 두고, 같은 테스트 두 개를 각각에 돌린다. 목 테스트의 실패는 `assertThatThrownBy(() -> verify(...))`로 `WantedButNotInvoked`를 확인한다'
  - claim: '`ArgumentCaptor`로 `save`에 넘어간 `Member`의 이메일을 꺼낼 수 있다'
    how: 'Mockito로 확인한다'
  - claim: '엄격한 스텁에서 쓰이지 않은 스텁은 `UnnecessaryStubbingException`, 다른 인자로 불린 스텁은 `PotentialStubbingProblem`이 된다'
    how: '`Mockito.mockitoSession().strictness(Strictness.STRICT_STUBS)`로 세션을 열고 `finishMocking()`과 호출에서 나는 예외를 확인한다'
  - claim: '`Clock.fixed`를 주입하면 `LocalDateTime.now(clock)`이 늘 같은 시각이다'
    how: '자바 코드로 확인한다'
  - claim: '경계값 29999와 30000에서 배송비가 갈리는 테스트가 경계 버그(`>`와 `>=`)를 잡는다'
    how: '버그가 있는 구현에 `@ParameterizedTest`와 같은 입력을 돌려 실패를 확인한다'
sources:
  - '테스트 더블의 다섯 가지 이름: Gerard Meszaros, xUnit Patterns https://xunitpatterns.com/Test%20Double.html'
  - '목과 스텁, 상태 검증과 행위 검증: Martin Fowler, Mocks Aren''t Stubs https://martinfowler.com/articles/mocksArentStubs.html'
  - 'Mockito의 기본 반환값(RETURNS_DEFAULTS)과 엄격한 스텁: https://javadoc.io/doc/org.mockito/mockito-core/latest/org/mockito/Mockito.html'
  - 'JUnit 5의 `@Nested`, `@DisplayName`, `@ParameterizedTest`: https://junit.org/junit5/docs/current/user-guide/'
