codes:
  service: |-
    class SignupService {
      private final MemberRepository repo;
      private final MailSender mail;

      SignupService(MemberRepository repo,
          MailSender mail) {
        this.repo = repo;
        this.mail = mail;
      }

      Member signup(String email) {
        if (repo.existsByEmail(email)) {
          throw new DuplicateEmail(email);
        }
        Member m = repo.save(new Member(email));
        mail.send(email, "가입을 환영해요");
        return m;
      }
    }
  predict: |-
    MemberRepository repo =
        mock(MemberRepository.class);
    MailSender mail = mock(MailSender.class);
    var service = new SignupService(repo, mail);

    Member m = service.signup("a@b.com");
    // m은?
  shipping: |-
    @Test
    void 삼만원_이상이면_무료() {
      // given
      int price = 30000;
      // when
      int fee = ShippingFee.fee(price);
      // then
      assertThat(fee).isZero();
    }
  boundaryRun: |-
    // 버그: price >= 30000 대신
    //       price > 30000
    for (int p : {20000, 29999, 30000})
      fee(p)와 buggyFee(p)를 비교
  newInside: |-
    SignupService() {
      this.repo = new JpaMemberRepository();
      this.mail = new SmtpMailSender();
    }
  clock: |-
    class CouponService {
      private final Clock clock;

      boolean expired(Coupon c) {
        return LocalDateTime.now([[clock]])
            .isAfter(c.expiresAt());
      }
    }
  clockRun: |-
    Clock clock = Clock.fixed(
        Instant.parse("2026-11-25T01:00:00Z"),
        ZoneId.of("Asia/Seoul"));
    LocalDateTime.now(clock);
    Thread.sleep(5);
    LocalDateTime.now(clock);
  stub: |-
    when(repo.existsByEmail("a@b.com"))
        .[[thenReturn(true)]];

    assertThatThrownBy(
        () -> service.signup("a@b.com"))
        .isInstanceOf(DuplicateEmail.class);
    verify(mail, never()).send(any(), any());
  mockVerify: |-
    service.signup("a@b.com");

    [[verify(mail)]].send("a@b.com",
        "가입을 환영해요");
  captor: |-
    var saved = ArgumentCaptor
        .forClass(Member.class);
    verify(repo).save(saved.capture());
    saved.getValue().email(); // a@b.com
  fake: |-
    class MemoryMemberRepository
        implements MemberRepository {
      Map<String, Member> store =
          new HashMap<>();

      public boolean existsByEmail(String e) {
        return store.containsKey(e);
      }
      public Optional<Member> findByEmail(
          String e) {
        return Optional.ofNullable(
            store.get(e));
      }
      public Member save(Member m) {
        store.put(m.email(), m);
        return m;
      }
    }
  refactored: |-
    Member signup(String email) {
      if (repo.[[findByEmail(email)]]
          .isPresent()) {
        throw new DuplicateEmail(email);
      }
      ...
    }
  twoTests: |-
    // 목: 호출을 검증
    signup("a@b.com");
    verify(repo).existsByEmail("a@b.com");

    // 페이크: 상태를 검증
    var fake = new MemoryMemberRepository();
    signup("a@b.com");
    assertThat(fake.findByEmail("a@b.com"))
        .isPresent();
  nested: |-
    @ExtendWith(MockitoExtension.class)
    class SignupServiceTest {
      @Mock MemberRepository repo;
      @Mock MailSender mail;
      @InjectMocks SignupService service;

      @Nested
      @DisplayName("이미 있는 이메일이면")
      class Duplicate {
        @Test
        void 예외를_던지고_메일은_없다() {
          given(repo.existsByEmail(any()))
              .willReturn(true);

          assertThatThrownBy(() ->
              service.signup("a@b.com"))
            .isInstanceOf(
                DuplicateEmail.class);
          then(mail).should(never())
              .send(any(), any());
        }
      }
    }
  param: |-
    @ParameterizedTest(
        name = "{0}원이면 배송비 {1}원")
    @CsvSource({"29999, 3000",
        "30000, 0", "50000, 0"})
    void 배송비_경계값(int price, int fee) {
      assertThat(ShippingFee.fee(price))
          .isEqualTo(fee);
    }
  typo: |-
    when(repo.existsByEmail([["a@b.co"]]))
        .thenReturn(true);

    service.signup("a@b.com");
  strictRun: |-
    // 엄격한 스텁 (MockitoExtension의 기본)
    // 1. 스텁만 하고 부르지 않음
    when(repo.findByEmail("a@b.com"))
        .thenReturn(Optional.of(member));
    // 2. 다른 인자로 부름
    when(repo.existsByEmail("a@b.co"))
        .thenReturn(true);
    service.signup("a@b.com");
predict:
  title: 답을 정하지 않은 목은 무엇을 돌려줄까요?
  text: '`MemberRepository`와 `MailSender`를 Mockito로 만들고, 아무 답도 정하지 않은 채 `signup`을 불러요. 진짜 저장소의 `save`는 저장한 회원을 돌려줘요. `m`에는 무엇이 들어 있을까요? 모르는 게 정상이니 감으로 골라 보세요. 답은 질문 3에 나와요.'
  code: predict
  label: 내 예측
  options:
    - {value: member, label: '이메일이 a@b.com인 회원'}
    - {value: 'null', label: 'null'}
    - {value: error, label: 예외가 나서 값이 없다}
  answer: 'null'
  storageKey: utd-predict
  wrong: 예측은 "{label}"이었어요. 틀린 예측이 더 오래 남으니 괜찮아요.
questions:
  - id: q1
    title: 단위 테스트는 무엇을 확인하나요?
    conclusion:
      lead: '클래스 하나를 떼어, 공개된 메서드에 입력을 주었을 때 나오는 결과와 바깥에 보이는 효과를 확인해요.'
      sub: '내부에서 어떻게 계산했는지가 아니라 무엇이 나왔는지를 봐야, 구현을 고쳐도 동작이 같으면 테스트가 그대로 통과해요.'
    says:
      - '단위 테스트는 DB, 네트워크, 파일 없이 메모리 안에서 몇 밀리초 만에 끝난다. 그래서 고칠 때마다 수백 개를 돌릴 수 있다. 테스트 실행 시간을 실제 출력으로 보인다'
      - '테스트 하나는 준비(given), 실행(when), 검증(then)으로 쓴다. 할인 금액을 계산하는 `DiscountPolicy` 같은 협력 객체 없는 클래스로 먼저 보인다'
      - '검증하는 것은 공개된 동작이다: 돌려준 값, 던진 예외, 바깥에 보이는 효과(저장됨, 메일이 나감). private 메서드를 리플렉션으로 불러 검사하지 않는다. private 메서드는 공개 메서드를 통해 함께 확인된다'
      - '정상 경로 하나로는 모자라다. 경계값(0, 빈 문자열, 최대값)과 예외 경로를 함께 본다. 할인 정책에서 경계값 하나가 버그를 잡는 예를 테스트로 보인다'
      - '코드 service의 `signup`은 `MemberRepository`와 `MailSender`가 있어야 돈다. 이 둘이 진짜면 DB와 메일 서버가 필요하다. 다음 질문으로 잇는다'
      - '더 알아보기: 커버리지는 테스트가 지나간 줄의 비율이다. 검증 없이 부르기만 해도 올라간다. TDD는 실패하는 테스트를 먼저 쓰고 그것을 통과시키는 코드를 쓰는 방식이다'
    asks:
      - '본문의 예시: `DiscountPolicy`의 private 메서드 `round`를 테스트하고 싶다. 어떻게 하나 (공개 메서드 `discount`의 결과로 확인한다. private 메서드를 따로 부르지 않는다)'
      - '옮긴 상황: 배송비 계산기가 "3만 원 이상이면 무료"다. 2만 원짜리 입력 하나로만 테스트했다. 빠진 입력은 무엇인가 (경계값 30000과 29999)'
    body:
      - p: '**단위 테스트**는 클래스 하나(단위)를 다른 것과 떼어 놓고, 그 공개 메서드가 맞게 동작하는지 확인하는 코드예요. DB도 네트워크도 쓰지 않으니 메모리 안에서 몇 밀리초 만에 끝나요. 협력 객체가 없는 배송비 계산부터 볼게요. 3만 원 이상이면 배송비가 무료예요.'
      - code: shipping
        notes:
          - mark: given
            as: code
            text: '준비: 입력과 필요한 객체를 만들어요.'
          - mark: when
            as: code
            text: '실행: 확인하려는 메서드를 한 번 불러요.'
          - mark: then
            as: code
            text: '검증: 나온 결과를 기대한 값과 비교해요.'
      - p: '테스트 하나는 이렇게 **준비(given), 실행(when), 검증(then)** 세 부분으로 써요. 테스트가 무엇을 확인하는지 한눈에 읽혀요.'
      - h3: 무엇을 검증하나요
      - p: '검증하는 것은 **바깥에서 보이는 동작**이에요. 돌려준 값, 던진 예외, 바깥에 남긴 효과(저장됨, 메일이 나감)예요. 안에서 어떤 private 메서드를 어떤 순서로 불렀는지는 보지 않아요. private 메서드는 공개 메서드를 부르면 함께 돌아서, 공개 메서드의 결과로 함께 확인돼요. 결과만 보면 나중에 안을 고쳐도 동작이 같은 한 테스트가 그대로 통과해요.'
      - h3: 경계값을 꼭 넣어요
      - p: '배송비를 `price >= 30000` 대신 `price > 30000`으로 잘못 짰다고 해 봐요. 2만 원 하나로 테스트하면 통과해요. 경계 바로 아래와 경계 위의 값을 함께 넣어 봤어요.'
      - ci:
          key: boundary
          label: 실제 결과 보기
          source: UnitTestDoubleTest.boundaryValuesCatchBugs
          code: boundaryRun
      - p: '버그는 **경계값 30000**에서만 드러났어요. 정상 경로 하나로는 부족하고, 경계(0, 빈 문자열, 최대값, 조건이 바뀌는 지점)와 예외가 나는 경로를 함께 확인해요.'
      - p: '이렇게 메모리 안에서만 도는 테스트는 아주 빨라요. 가입 테스트를 1000번 돌려 봤어요.'
      - ci:
          key: speed
          label: 실제 결과 보기
          source: UnitTestDoubleTest.unitTestsAreFast
      - p: '1000번에 1초가 안 걸려요. 서버를 띄우고 손으로 확인하면 한 번에 몇 분이에요. 그래서 고칠 때마다 전부 돌릴 수 있어요.'
      - p: '그런데 회원 가입(코드 service)은 배송비처럼 혼자 돌지 않아요. `MemberRepository`는 DB를, `MailSender`는 메일 서버를 써요.'
      - code: service
      - more:
          summary: '더 알아보기: 커버리지와 TDD'
          body:
            - p: '**커버리지**는 테스트가 코드의 몇 퍼센트를 지나갔는지 세는 숫자예요. 검증 없이 메서드를 부르기만 해도 올라가서, 높다고 맞게 검증했다는 뜻은 아니에요.'
            - p: '**TDD**(테스트 주도 개발)는 실패하는 테스트를 먼저 쓰고, 그것을 통과시키는 코드를 쓰고, 정리하는 순서를 되풀이하는 방식이에요.'
      - quiz:
          q: '"3만 원 이상이면 배송비 무료"인 계산기를 2만 원 입력 하나로만 테스트했어요. 꼭 더할 입력은 무엇일까요?'
          options:
            - 1만 원과 2만 원
            - 29999원과 30000원
            - 음수와 100만 원만
          answer: 2
          explain: '조건이 바뀌는 경계의 바로 아래와 경계 값에서 `>`와 `>=` 같은 실수가 드러나요.'
      - next: 'DB와 메일 서버가 있어야 도는 `SignupService`는 어떻게 떼어 내 테스트할까요?'
    recall: '클래스 하나를 떼어, 공개된 메서드에 입력을 주었을 때 돌려준 값, 던진 예외, 바깥에 남긴 효과를 확인해요. 준비, 실행, 검증 순서로 쓰고, private 메서드는 공개 메서드를 통해 함께 확인해요. 정상 경로 하나가 아니라 경계값과 예외 경로를 함께 넣어요. DB와 네트워크 없이 밀리초 안에 돌아서 고칠 때마다 다 돌릴 수 있어요.'
  - id: q2
    title: 협력 객체가 DB나 메일이면 어떻게 테스트하나요?
    conclusion:
      lead: '협력 객체를 테스트용 가짜(테스트 더블)로 바꿔 끼워요. 생성자로 받게 만들어 둔 클래스라서 바꿀 수 있어요.'
      sub: '테스트 더블은 하는 일에 따라 더미, 스텁, 스파이, 목, 페이크로 나뉘어요.'
    says:
      - '코드 service는 `MemberRepository`와 `MailSender`를 생성자로 받는다. 테스트는 진짜 대신 같은 인터페이스의 다른 구현을 넣는다. 클래스 안에서 `new JpaMemberRepository()`로 만들었다면 바꿀 수 없다(O5)'
      - '테스트 더블은 영화의 대역 배우에서 온 말이다. 다섯 가지를 표로 정리한다: 더미(자리만 채운다), 스텁(정해진 답을 준다), 스파이(진짜처럼 동작하며 호출을 기록한다), 목(호출을 기록하고 그 호출을 검증한다), 페이크(진짜처럼 동작하는 가벼운 구현, 예: 메모리 저장소)'
      - '더미의 예: 가입 거절 경로만 테스트할 때 `MailSender`는 불리지 않으니 아무것이나 넣는다'
      - 'Mockito의 `mock(MailSender.class)`은 인터페이스의 구현 클래스를 실행 중에 만들어 낸다. 직접 클래스를 쓰지 않아도 된다'
      - '더 알아보기: `LocalDateTime.now()`처럼 static으로 부르는 의존은 바꿀 수 없다. `Clock`을 생성자로 받고 테스트에서 `Clock.fixed`를 넣으면 시간을 고정할 수 있다. 테스트로 보인다'
    widget:
      kind: classify
      note: '테스트 코드의 조각(아무 동작도 안 하는 `MailSender`, 늘 true를 돌려주는 `existsByEmail`, 불린 인자를 기록하고 `verify`로 확인하는 메일, `HashMap`에 저장하는 저장소, 진짜 객체를 감싸 호출을 세는 것)을 보고 더미, 스텁, 스파이, 목, 페이크 가운데 하나를 고른다'
    asks:
      - '본문의 예시: `SignupService`가 생성자에서 `this.mail = new SmtpMailSender()`로 메일을 만든다면 테스트에서 메일을 가짜로 바꿀 수 있나 (없다. 바깥에서 넣을 길이 없다)'
      - '옮긴 상황: 주문 서비스 테스트에서 `HashMap`으로 저장과 조회를 진짜처럼 구현한 `OrderRepository`를 썼다. 이 테스트 더블은 무엇인가 (페이크)'
    body:
      - p: '코드 service의 생성자를 다시 보세요. `SignupService`는 `MemberRepository`와 `MailSender`를 **인터페이스로, 생성자에서** 받아요. 그래서 테스트는 진짜(JPA 저장소, SMTP 메일) 대신 같은 인터페이스의 다른 구현을 넣을 수 있어요. 의존 역전 원칙과 의존성 주입 레슨에서 본 구조가 테스트를 가능하게 해요.'
      - p: '반대로 클래스 안에서 직접 만들었다면 바꿀 길이 없어요.'
      - code: newInside
      - p: '이 클래스를 테스트하면 늘 진짜 DB에 붙고 진짜 메일이 나가요.'
      - h3: 테스트 더블 다섯 가지
      - p: '진짜 대신 넣는 테스트용 객체를 **테스트 더블**이라고 불러요. 영화에서 위험한 장면을 대신 찍는 대역 배우(스턴트 더블)에서 온 말이에요. 하는 일에 따라 다섯 가지로 나눠요([Martin Fowler](link:fowlerDouble)).'
      - table:
          head: [이름, 하는 일, 이 레슨의 예]
          rows:
            - [더미, '자리만 채워요. 불리지 않아요', '이메일이 겹치는 경로를 테스트할 때 넣는 `MailSender`. 메일까지 가지 않아요']
            - [스텁, '정해진 답을 돌려줘서 원하는 상황을 만들어요', '늘 true를 돌려주는 `existsByEmail`']
            - [스파이, '진짜처럼 동작하면서 불린 것을 기록해요', '진짜 저장소를 감싸 `save`가 몇 번 불렸는지 세는 것']
            - [목, '불린 것을 기록하고, 테스트가 그 호출을 검증해요', '`verify(mail).send(...)`로 확인하는 메일']
            - [페이크, '진짜처럼 동작하는 가벼운 구현이에요', '`HashMap`에 저장하는 `MemoryMemberRepository`']
      - p: '스텁과 목은 직접 클래스를 쓰지 않고 Mockito로 만들어요. `mock(MailSender.class)`는 실행 중에 `MailSender`의 구현 클래스를 만들어 내고, 테스트가 그 객체에 답을 정하거나 호출을 확인해요. 페이크는 보통 직접 클래스를 써요.'
      - p: '테스트 코드의 조각을 보고 어느 테스트 더블인지 골라 보세요.'
      - widget:
          kind: classify
          categories: [더미, 스텁, 스파이, 목, 페이크]
          items:
            - text: '이메일이 겹치는 경로를 테스트하며 `mock(MailSender.class)`을 넣었고, 답도 정하지 않고 확인도 하지 않아요.'
              answer: 1
              explain: '자리만 채우고 불리지도 확인되지도 않아요.'
            - text: '`when(repo.existsByEmail(any())).thenReturn(true)`로 "이미 있는 이메일" 상황을 만들어요.'
              answer: 2
              explain: '정해진 답을 돌려줘서 테스트가 원하는 상황을 만들어요.'
            - text: '`verify(mail).send("a@b.com", "가입을 환영해요")`로 메일이 나갔는지 확인해요.'
              answer: 4
              explain: '불린 것을 기록해 두고 테스트가 그 호출을 검증해요.'
            - text: '저장과 조회를 `HashMap`으로 진짜처럼 구현한 저장소를 넣어요.'
              answer: 5
              explain: '진짜처럼 동작하는 가벼운 구현이에요.'
            - text: '진짜 객체를 감싸 그대로 동작하게 두면서, 메서드가 몇 번 불렸는지 세어요.'
              answer: 3
              explain: '진짜처럼 동작하면서 불린 것을 기록해요. Mockito의 `spy`가 이것이에요.'
      - more:
          summary: '더 알아보기: 현재 시각처럼 바꿀 수 없는 의존'
          body:
            - p: '`LocalDateTime.now()`는 static 메서드라 테스트에서 바꿀 수 없어요. 그래서 "쿠폰이 만료됐나" 같은 코드는 돌릴 때마다 결과가 달라요. 시계를 `Clock`으로 받으면 테스트에서 고정한 시계를 넣을 수 있어요([Clock API 문서](link:clock)).'
            - code: clock
              notes:
                - mark: clock
                  as: code
                  text: '운영에서는 `Clock.systemDefaultZone()`, 테스트에서는 `Clock.fixed(...)`를 넣어요.'
            - ci:
                key: clock
                label: 실제 출력 보기
                source: UnitTestDoubleTest.fixedClock
                code: clockRun
      - quiz:
          q: '주문 서비스 테스트에서 `HashMap`으로 저장과 조회를 진짜처럼 구현한 `OrderRepository`를 썼어요. 이 테스트 더블은 무엇일까요?'
          options:
            - 스텁
            - 목
            - 페이크
          answer: 3
          explain: '진짜처럼 동작하는 가벼운 구현이 페이크예요. 스텁은 정해진 답만 돌려줘요.'
      - next: '가장 많이 쓰는 둘은 스텁과 목이에요. 둘 다 `mock()`으로 만드는데 무엇이 다를까요?'
    recall: '협력 객체를 진짜 대신 테스트 더블로 바꿔 끼워요. 협력 객체를 인터페이스로, 생성자에서 받게 만들어 두었기에 가능해요. 테스트 더블은 자리만 채우는 더미, 정해진 답을 주는 스텁, 진짜처럼 돌며 호출을 기록하는 스파이, 호출을 기록하고 검증하는 목, 진짜처럼 동작하는 가벼운 구현인 페이크로 나뉘어요.'
  - id: q3
    title: 목과 스텁은 무엇이 다른가요?
    conclusion:
      lead: '스텁은 정해진 답을 돌려줘 상황을 만들고 테스트는 결과를 검증해요. 목은 불린 것을 기록하고 테스트는 그 호출을 검증해요.'
      sub: 'Mockito의 `mock()`으로 만든 객체 하나가 `when`으로 쓰면 스텁, `verify`로 쓰면 목이 돼요. 이름이 아니라 쓰는 방식이 둘을 갈라요.'
    says:
      - '예측의 답을 밝힌다. 답을 정하지 않은 목은 객체 타입이면 null, int는 0, boolean은 false, 컬렉션은 빈 컬렉션, `Optional`은 빈 `Optional`을 돌려준다. 그래서 `existsByEmail`은 false, `save`는 null이고 `m`은 null이다. 실제 출력을 보인다'
      - '코드 stub. `when(repo.existsByEmail("a@b.com")).thenReturn(true)`로 "이미 있는 이메일"이라는 상황을 만든다. 테스트는 예외가 나는지(결과)를 본다. 이것이 스텁이다'
      - '코드 mockVerify. 메일은 돌려주는 값이 없다. 가입이 됐을 때 메일이 나갔는지는 결과로 볼 수 없다. `verify(mail).send(...)`로 그 인자로 한 번 불렸는지를 본다. 이것이 목이다'
      - '`verify(mail, never()).send(any(), any())`로 불리지 않은 것도 확인한다. 이메일이 겹칠 때 메일이 나가지 않는 것을 이렇게 본다'
      - '`ArgumentCaptor`로 넘어간 인자를 붙잡아 꺼내 볼 수 있다. `save`에 넘어간 `Member`의 이메일을 확인하는 예를 보인다'
    asks:
      - '본문의 예시: 이메일이 겹치는 경우를 테스트하려면 `repo`를 스텁과 목 가운데 무엇으로 쓰나 (스텁. `existsByEmail`이 true를 돌려주게 해 상황을 만든다)'
      - '옮긴 상황: 주문이 취소되면 `PushSender.push`를 부르는 서비스가 있다. `push`는 void다. 취소했을 때 알림이 갔는지 확인하는 방법은 (목. `verify(push).push(...)`로 호출을 검증한다)'
      - '실무 구역: `@Mock OrderRepository repo`에 `findById`를 스텁하지 않고 `repo.findById(1L).orElseThrow()`를 부르는 코드를 테스트하면 무슨 일이 생기나 (예외가 난다. 스텁하지 않은 `Optional` 메서드는 빈 `Optional`을 돌려준다)'
    body:
      - p: '먼저 예측의 답이에요. 답을 정하지 않은 목으로 `signup`을 부르고, 목의 메서드들이 무엇을 돌려주는지 찍어 봤어요.'
      - ci:
          key: defaults
          label: 실제 출력 보기
          source: UnitTestDoubleTest.unstubbedMockReturnsDefaults
          code: predict
      - p: '{{predict-result}} `m`은 **null**이에요. Mockito의 목은 답을 정하지 않은 메서드에서 기본값을 돌려줘요. 객체는 null, boolean은 false, 숫자는 0, 컬렉션은 빈 컬렉션, `Optional`은 빈 `Optional`이에요. `existsByEmail`이 false라 예외 없이 지나갔고, `save`가 null을 돌려줬어요. 원하는 답이 있으면 테스트가 정해 줘야 해요.'
      - h3: '스텁: 답을 정해 상황을 만든다'
      - p: '"이미 있는 이메일이면 예외"를 테스트하려면 저장소가 "있다"고 답해야 해요.'
      - code: stub
        notes:
          - mark: thenReturn(true)
            as: code
            text: '이 인자로 불리면 true를 돌려주라고 정해요.'
      - ci:
          key: stub
          label: 실제 결과 보기
          source: UnitTestDoubleTest.stubMakesDuplicateSituation
      - p: '`when(...).thenReturn(...)`으로 답을 정한 것이 **스텁**이에요. 스텁은 상황을 만드는 데 쓰고, 테스트는 그 상황에서 나온 **결과**(예외가 났다)를 검증해요.'
      - h3: '목: 불렸는지를 검증한다'
      - p: '"새 이메일이면 환영 메일을 보낸다"는 어떻게 확인할까요? `send`는 void라서 돌려받을 결과가 없어요. 볼 수 있는 것은 **불렸는지**뿐이에요.'
      - code: mockVerify
        notes:
          - mark: verify(mail)
            as: code
            text: '`mail`의 `send`가 이 인자들로 한 번 불렸는지 확인해요.'
      - ci:
          key: verify
          label: 실제 결과 보기
          source: UnitTestDoubleTest.mockVerifiesCalls
      - p: '`verify`로 호출을 검증하면 그 객체는 **목**이에요. 인자가 하나라도 다르면 "Wanted but not invoked"로 실패해요. 불리지 않아야 하는 것은 `verify(mail, never())`로 확인해요(스텁 예의 마지막 줄).'
      - p: '넘어간 인자를 꺼내서 더 자세히 보고 싶으면 `ArgumentCaptor`를 써요. 위 출력에서 `save`에 넘어간 회원의 이메일을 이렇게 꺼냈어요.'
      - code: captor
      - table:
          head: ['', 스텁, 목]
          rows:
            - [쓰는 법, '`when(...).thenReturn(...)`', '`verify(...).메서드(...)`']
            - [하는 일, '정해진 답으로 상황을 만들어요', '불린 메서드와 인자를 기록해요']
            - [테스트가 보는 것, '결과(돌려준 값, 예외, 상태)', '호출(어떤 인자로 몇 번)']
      - p: '둘 다 `mock()`으로 만든 객체예요. 같은 객체를 `when`으로 쓰면 스텁, `verify`로 쓰면 목이에요([Mocks Aren''t Stubs](link:mocksArentStubs)).'
      - quiz:
          q: '주문이 취소되면 void 메서드 `PushSender.push`를 부르는 서비스가 있어요. 취소했을 때 알림이 갔는지는 어떻게 확인할까요?'
          options:
            - '`when(push.push(...)).thenReturn(...)`으로 스텁한다'
            - '`verify(push).push(...)`로 호출을 검증한다'
            - 'void라서 확인할 방법이 없다'
          answer: 2
          explain: '돌려받을 결과가 없으니 불렸는지를 목으로 검증해요.'
      - next: '`verify`로 무엇이든 확인할 수 있다면, 모든 협력 객체를 목으로 바꾸고 호출을 다 검증하면 더 꼼꼼한 테스트일까요?'
    recall: '스텁은 `when(...).thenReturn(...)`으로 정해진 답을 돌려줘 상황을 만들고, 테스트는 그 결과를 검증해요. 목은 불린 메서드와 인자를 기록하고, 테스트가 `verify`로 그 호출을 검증해요. 메일처럼 돌려받을 결과가 없을 때 목을 써요. Mockito의 `mock()` 객체는 답을 정하지 않으면 null, false, 0, 빈 컬렉션, 빈 Optional을 돌려줘요.'
  - id: q4
    title: 목을 많이 쓰면 무엇이 나빠지나요?
    conclusion:
      lead: '테스트가 구현의 호출 방식에 묶여, 동작은 그대로인데 코드를 고칠 때마다 깨져요. 그리고 목이 진짜와 다르게 동작해도 테스트는 통과해요.'
      sub: '그래서 결과로 검증할 수 있으면 결과로 보고, 목은 메일이나 외부 API처럼 결과를 볼 수 없는 바깥 경계에만 써요.'
    says:
      - '`SignupService`가 `existsByEmail` 다음 `save`를 부르던 것을, `findByEmail(...).isPresent()`로 바꿨다. 동작은 같다. `verify(repo).existsByEmail(...)`까지 검증하던 목 테스트는 깨지고, 페이크 저장소(코드 fake)로 "가입 뒤 저장소에 회원이 있다"를 본 테스트는 통과한다. 두 테스트를 실제로 돌려 결과를 보인다'
      - '목은 내가 정한 대로만 동작한다. 진짜 저장소는 이메일이 겹치면 유니크 제약으로 예외를 던지는데, 목은 그런 일을 모른다. 목으로만 테스트하면 이 차이를 못 잡는다. 진짜 DB의 동작은 T4에서 확인한다'
      - '기준: 결과(돌려준 값, 저장된 상태)로 확인할 수 있으면 그것을 본다. 메일, 결제 API, 메시지 발행처럼 바깥에 나가는 호출이라 결과를 볼 수 없을 때 목으로 호출을 검증한다'
      - '`Member`, `Money` 같은 값 객체와 내 도메인 객체는 목으로 만들지 않는다. 진짜를 만들어 쓰는 것이 더 쉽고 정확하다'
    widget:
      kind: toggle
      note: '구현을 "고치기 전"과 "`findByEmail`로 고친 뒤"로 바꿔 가며, 목으로 호출을 검증한 테스트와 페이크로 상태를 검증한 테스트의 결과(통과, 실패)를 나란히 보인다. 고친 뒤 목 테스트만 빨간색이 된다'
    asks:
      - '본문의 예시: `existsByEmail`을 `findByEmail(...).isPresent()`로 바꿨다. `verify(repo).existsByEmail("a@b.com")`이 든 테스트는 어떻게 되나 (실패한다. 동작은 같지만 그 메서드가 불리지 않는다)'
      - '옮긴 상황: 장바구니 합계를 테스트하면서 `Item` 객체를 목으로 만들어 `getPrice()`를 스텁했다. 더 나은 방법은 (진짜 `Item`을 만들어 쓴다. 값 객체는 목으로 만들지 않는다)'
    body:
      - p: '저장소에 대해서도 "어떤 메서드가 불렸나"를 검증하는 테스트와, 메모리에 진짜처럼 저장하는 **페이크**로 "저장됐나"를 보는 테스트를 나란히 써 봤어요.'
      - code: fake
      - code: twoTests
      - p: '처음에는 둘 다 통과해요. 이제 `SignupService`를 고쳐요. 중복 확인을 `existsByEmail` 대신 `findByEmail(...).isPresent()`로 바꿨어요. 하는 일은 똑같아요.'
      - code: refactored
        notes:
          - mark: findByEmail(email)
            as: code
            text: '동작은 같고 부르는 메서드만 바뀌었어요.'
      - p: '두 테스트가 어떻게 되는지 골라 보세요.'
      - widget:
          kind: toggle
          layout: [selector, duo, verdict]
          selector:
            label: SignupService의 구현
            options:
              - {value: before, label: '고치기 전 (existsByEmail)'}
              - {value: after, label: '고친 뒤 (findByEmail)'}
          scenes:
            before:
              duo:
                - label: '목: 호출을 검증'
                  rows: [{k: 'verify(repo).existsByEmail', v: 통과}]
                - label: '페이크: 상태를 검증'
                  rows: [{k: 저장소에 회원이 있다, v: 통과}]
              verdict: '고치기 전에는 둘 다 통과해요.'
            after:
              duo:
                - label: '목: 호출을 검증'
                  rows: [{k: 'verify(repo).existsByEmail', v: '실패 (WantedButNotInvoked)', mark: bad}]
                - label: '페이크: 상태를 검증'
                  rows: [{k: 저장소에 회원이 있다, v: 통과, mark: changed}]
              verdict: '동작은 같은데 호출을 검증한 테스트만 깨졌어요.'
      - ci:
          key: refactor
          label: 실제로 돌린 결과 보기
          source: UnitTestDoubleTest.overMockingBreaksOnRefactor
      - p: '목 테스트는 **"어떻게 했나"**를 검증해서, 동작이 같아도 방법이 바뀌면 깨져요. 이런 테스트가 많으면 리팩터링할 때마다 테스트를 함께 고쳐야 하고, 테스트가 버그가 아니라 변경을 막는 짐이 돼요. 페이크 테스트는 **"무엇이 됐나"**를 봐서 그대로 통과했어요.'
      - h3: 목은 진짜와 다르게 동작해도 통과해요
      - p: '목은 테스트가 정한 대로만 답해요. 진짜 DB는 같은 이메일이 두 번 들어오면 유니크 제약으로 예외를 던지는데, 목은 그런 일을 몰라요. 목으로만 테스트하면 진짜와 다른 점을 잡지 못해요. 진짜 DB로 확인하는 것은 통합 테스트와 Testcontainers 레슨에서 해요.'
      - h3: 기준
      - ul:
          - '**결과로 확인할 수 있으면 결과로 봐요.** 돌려준 값, 던진 예외, 저장된 상태예요. 저장소는 페이크로 바꾸면 상태로 볼 수 있어요.'
          - '**목은 바깥 경계에만 써요.** 메일, 결제 API, 메시지 발행처럼 밖으로 나가서 결과를 볼 수 없는 호출이에요. "환영 메일이 나갔다"는 그 자체가 지켜야 할 동작이라 호출을 검증해도 돼요.'
          - '**값 객체와 내 도메인 객체는 진짜를 써요.** `Member`, `Money`를 목으로 만들어 `getPrice()`를 스텁하는 것보다 `new Item(1000)`이 쉽고 정확해요.'
      - quiz:
          q: '`existsByEmail`을 `findByEmail(...).isPresent()`로 바꿨어요. 동작은 같아요. `verify(repo).existsByEmail("a@b.com")`이 든 테스트는 어떻게 될까요?'
          options:
            - 동작이 같으니 통과한다
            - '실패한다. 그 메서드가 불리지 않는다'
            - 컴파일 오류가 난다
          answer: 2
          explain: '호출을 검증한 테스트는 동작이 아니라 부르는 방법에 묶여서, 방법이 바뀌면 깨져요.'
    recall: '목으로 호출을 검증하면 테스트가 구현의 방법에 묶여서, 동작은 같은데 부르는 메서드만 바꿔도 깨져요. 또 목은 정한 대로만 답해서 진짜와 다르게 동작해도 통과해요. 그래서 결과와 상태로 확인할 수 있으면 그것을 보고(저장소는 페이크로), 목은 메일이나 외부 API처럼 결과를 볼 수 없는 바깥 경계에만 써요. 값 객체는 진짜를 써요.'
practice:
  title: 실무에서는 이렇게 써요
  says:
    - '실제로 쓰는 모양: 코드 nested. `@ExtendWith(MockitoExtension.class)`를 붙이면 `@Mock` 필드가 만들어지고 `@InjectMocks`가 생성자로 넣어 준다. 스프링을 띄우지 않으니 빠르다. 스프링 부트 테스트 스타터에 Mockito가 들어 있다'
    - '`@Nested`와 `@DisplayName`으로 "이미 있는 이메일이면", "새 이메일이면"처럼 상황별로 묶는다. 테스트 보고서가 문장처럼 읽힌다. 중첩 클래스가 static이 아닌 내부 클래스라 바깥의 `@Mock` 필드를 쓸 수 있다(J16)'
    - '`@ParameterizedTest`와 `@CsvSource`로 경계값 여러 개를 한 테스트에 넣는다. 질문 1의 배송비 경계값을 이렇게 쓴다'
    - '흔한 실수: 스텁의 인자를 잘못 적는다. `when(repo.existsByEmail("a@b.co"))`처럼 오타가 나면 스텁이 쓰이지 않고 false가 돌아와 테스트가 엉뚱하게 통과하거나 실패한다. `MockitoExtension`은 엄격한 스텁이 기본이라, 쓰이지 않은 스텁이나 다른 인자로 불린 스텁을 `UnnecessaryStubbingException`이나 `PotentialStubbingProblem`으로 알려 준다. 고친 코드: 인자를 바로 적거나 `any()`를 쓴다. 테스트로 그 예외를 보인다'
    - 'BDD 스타일 `given(...).willReturn(...)`은 `when(...).thenReturn(...)`과 같은 일을 한다. given-when-then의 이름과 맞춰 읽으려고 쓴다'
  body:
    - p: '프로젝트에서는 목을 필드로 선언하고 JUnit 확장이 만들어 넣게 해요. 아래는 이 레슨의 검증 코드에 실제로 들어 있는 테스트예요([SignupServiceTest](link:practiceTest)).'
    - code: nested
    - ul:
        - '**`@ExtendWith(MockitoExtension.class)`**가 `@Mock` 필드를 목으로 만들고, **`@InjectMocks`**가 그 목들을 `SignupService`의 생성자에 넣어 줘요. 스프링을 띄우지 않으니 빨라요. 스프링 부트의 `spring-boot-starter-test`에 Mockito가 들어 있어요.'
        - '**`given(...).willReturn(...)`**은 `when(...).thenReturn(...)`과 같은 일을 해요. 준비, 실행, 검증의 given과 이름을 맞춰 읽으려고 써요. 검증도 `then(mail).should()`로 써요.'
        - '**`@Nested`와 `@DisplayName`**으로 "이미 있는 이메일이면", "새 이메일이면"처럼 상황별로 묶으면 테스트 결과가 문장처럼 읽혀요. `@Nested` 클래스는 static이 없는 내부 클래스라서 바깥의 `@Mock` 필드를 그대로 써요(중첩 클래스와 익명 클래스 레슨).'
    - p: '질문 1의 경계값은 `@ParameterizedTest`로 한 테스트에 모아요. 입력마다 테스트가 하나씩 돌고 이름에 값이 들어가요([JUnit 문서](link:junit)).'
    - code: param
    - h3: '흔한 실수: 스텁의 인자를 잘못 적는다'
    - code: typo
      notes:
        - mark: '"a@b.co"'
          as: str
          text: '부르는 쪽은 `"a@b.com"`이에요. 오타 때문에 이 스텁은 쓰이지 않아요.'
    - p: '스텁의 인자와 실제로 부른 인자가 다르면 스텁이 쓰이지 않고 기본값 false가 돌아와요. 테스트는 "이미 있는 이메일" 상황을 만들었다고 믿지만 실제로는 새 이메일 경로로 가요. 엉뚱하게 통과하거나, 이유를 알기 어려운 실패가 나요.'
    - p: '`MockitoExtension`은 **엄격한 스텁**(strict stubs)이 기본이라 이런 실수를 잡아 줘요. 두 경우를 돌려 봤어요.'
    - ci:
        key: strict
        label: 실제 결과 보기
        source: UnitTestDoubleTest.strictStubsCatchWrongStubs
        code: strictRun
    - p: '스텁만 하고 한 번도 쓰지 않으면 테스트가 끝날 때 `UnnecessaryStubbingException`, 스텁한 메서드를 다른 인자로 부르면 그 자리에서 `PotentialStubbingProblem`으로 실패해요. 고치는 법은 인자를 바로 적거나, 인자가 중요하지 않으면 `any()`를 쓰는 거예요([Mockito 문서](link:mockito)).'
interview:
  question: '목과 스텁의 차이를 설명하고, 목을 언제 쓰는지 말해 주세요'
  model:
    - label: 정의
      text: 단위 테스트는 클래스 하나를 떼어 공개된 동작을 빠르게 확인하는 테스트이고, DB나 메일 같은 협력 객체는 테스트 더블로 바꿉니다. 스텁은 정해진 답을 돌려줘 상황을 만들고, 목은 불린 메서드와 인자를 기록해 테스트가 그 호출을 검증합니다.
    - label: 원리
      text: 스텁을 쓰면 테스트는 결과와 상태를 검증하고, 목을 쓰면 호출을 검증합니다. 협력 객체를 생성자로 주입받기 때문에 테스트에서 바꿔 끼울 수 있습니다.
    - label: 주의할 점
      text: 목으로 호출을 검증하면 테스트가 구현 방법에 묶여 리팩터링할 때마다 깨지고, 목은 진짜와 다르게 동작해도 통과합니다. 그래서 결과로 볼 수 있으면 결과로 보고, 저장소는 페이크로, 목은 메일과 외부 API 같은 바깥 경계에만 씁니다.
    - label: 경험
      text: '(내 프로젝트로 채우기) 예: 서비스 테스트를 모두 verify로 썼다가 쿼리 메서드 이름만 바꿔도 테스트가 대량으로 깨져서, 저장소는 메모리 페이크로 바꾸고 결과를 검증하게 고쳤습니다.'
verified: 이 레슨의 출력은 짐작이 아니라 자바 21과 Mockito 5에서 코드를 돌려 받은 값이에요. 같은 테스트를 고치기 전과 고친 뒤의 구현에 각각 돌려 어느 쪽이 깨지는지 확인했어요. 코드가 바뀔 때마다 테스트([UnitTestDoubleTest](link:test))가 다시 돌아요.
footer: '근거: 테스트 더블의 이름은 [Martin Fowler의 TestDouble](link:fowlerDouble), 목과 스텁, 상태 검증과 행위 검증은 [Mocks Aren''t Stubs](link:mocksArentStubs), 기본 반환값과 엄격한 스텁은 [Mockito 문서](link:mockito), `@Nested`와 `@ParameterizedTest`는 [JUnit 5 문서](link:junit). 결과는 자바 21, JUnit 5, Mockito 5에서 테스트로 확인했어요. 오류는 [GitHub 이슈](https://github.com/wanja727/dev-lessons/issues)로 알려 주세요.'
claims:
  - claim: '답을 정하지 않은 목은 객체에 null, boolean에 false, `Optional`에 빈 `Optional`, `List`에 빈 리스트를 돌려준다. 그래서 코드 predict의 `m`은 null이다'
    how: 'Mockito 5로 목을 만들고 각 메서드의 반환값을 남긴다'
    test: UnitTestDoubleTest.unstubbedMockReturnsDefaults
  - claim: '`existsByEmail`을 true로 스텁하면 `DuplicateEmail`이 나고 `verify(mail, never())`가 통과한다'
    how: 'Mockito로 확인한다'
    test: UnitTestDoubleTest.stubMakesDuplicateSituation
  - claim: '구현을 `findByEmail`로 바꾸면 호출을 검증한 목 테스트는 `WantedButNotInvoked`로 실패하고 페이크로 상태를 본 테스트는 통과한다'
    how: '고치기 전과 고친 뒤의 `SignupService` 두 클래스에 같은 테스트 두 개를 돌린다'
    test: UnitTestDoubleTest.overMockingBreaksOnRefactor
  - claim: '`ArgumentCaptor`로 `save`에 넘어간 `Member`의 이메일을 꺼낼 수 있고, 인자가 다른 `verify`는 실패한다'
    how: 'Mockito로 확인한다'
    test: UnitTestDoubleTest.mockVerifiesCalls
  - claim: '엄격한 스텁에서 쓰이지 않은 스텁은 `UnnecessaryStubbingException`, 다른 인자로 불린 스텁은 `PotentialStubbingProblem`이 된다'
    how: '`Mockito.mockitoSession().strictness(Strictness.STRICT_STUBS)`로 세션을 열고 `finishMocking()`과 호출에서 나는 예외를 확인한다'
    test: UnitTestDoubleTest.strictStubsCatchWrongStubs
  - claim: '`Clock.fixed`를 주입하면 `LocalDateTime.now(clock)`이 늘 같은 시각이다'
    how: '자바 코드로 확인한다'
    test: UnitTestDoubleTest.fixedClock
  - claim: '경계값 30000에서만 `>`와 `>=`의 버그가 드러난다'
    how: '버그가 있는 구현과 맞는 구현에 같은 입력을 넣어 비교한다'
    test: UnitTestDoubleTest.boundaryValuesCatchBugs
  - claim: '`@Nested`, `@InjectMocks`, `@ParameterizedTest`로 쓴 실무 모양의 테스트가 돈다'
    how: '실무 구역의 코드를 그대로 테스트로 둔다'
    test: SignupServiceTest
