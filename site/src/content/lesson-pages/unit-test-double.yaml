# 단위 테스트와 테스트 더블
# 자료 파일의 칸은 docs/lesson-data-format.md에 있다. 문제는 content/questions/unit-test-double.yaml에 있다.
title: 단위 테스트와 테스트 더블
description: 단위 테스트가 확인하는 것, DB와 메일 같은 협력 객체를 테스트 더블로 바꾸는 법, 목과 스텁의 차이, 목을 지나치게 쓰면 생기는 문제. 네 가지 질문에 스스로 답할 수 있게 회원 가입 서비스로 배우는 대화형 레슨.
unit: 테스트와 운영
minutes: 20
roadmap: T2
type: 자바 실행
prerequisites:
  - {slug: dip-di, title: 의존 역전 원칙과 의존성 주입}
assume: '자바 21, JUnit 5.12, Mockito 5, AssertJ(스프링 부트 3.5의 `spring-boot-starter-test`에 든 버전). 클래스가 협력 객체를 인터페이스로 받고 생성자로 주입받는다는 것(의존 역전 원칙과 의존성 주입 레슨). `@Test`가 붙은 메서드를 JUnit이 실행한다는 것까지는 알아요.'
example: '회원 가입 서비스 `SignupService`. 같은 이메일이 있으면 예외를 던지고, 없으면 `MemberRepository`에 저장한 뒤 `MailSender`로 환영 메일을 보내요. DB와 메일 서버 없이 이 서비스를 테스트해요.'
intro:
  - '회원 가입 로직을 고쳤는데 확인하려면 서버를 띄우고, DB를 비우고, 포스트맨으로 요청을 보내고, 메일함을 열어 봐야 해요. 한 번에 3분이 걸리니 고칠 때마다 확인하지 않게 되고, 결국 운영에서 버그를 만나요.'
  - '단위 테스트는 클래스 하나를 떼어 몇 밀리초 만에 확인하는 코드예요. 자바 개발자는 JUnit으로 테스트를 쓰고, DB나 메일처럼 떼어 낼 수 없는 협력 객체는 Mockito로 만든 가짜(테스트 더블)로 바꿔요. 무엇을 가짜로 바꾸고 무엇을 검증하는지에 따라 테스트가 버그를 잡기도 하고, 코드만 고쳐도 깨지는 짐이 되기도 해요.'
  - '이 레슨에서는 같은 `SignupService`를 스텁, 목, 페이크로 각각 테스트해 보고, 구현을 조금 바꿨을 때 어느 테스트가 깨지는지 실제로 돌려서 확인해요.'
covers:
  - topic: '단위 테스트는 한 단위(보통 클래스 하나의 공개 메서드)를 다른 것과 떼어 빠르게 확인한다. 외부 시스템(DB, 네트워크) 없이 밀리초 안에 돈다'
    where: '질문 1'
  - topic: '테스트는 준비(given), 실행(when), 검증(then) 세 부분으로 쓴다'
    where: '질문 1'
  - topic: '무엇을 테스트하나: 공개된 동작(입력에 대한 결과와 바깥에 보이는 효과)을 본다. private 메서드나 내부 구현을 직접 검사하지 않는다'
    where: '질문 1'
  - topic: '경계값과 예외 경로도 테스트한다. 정상 경로 하나만 보면 버그는 대개 경계에 있다'
    where: '질문 1'
  - topic: '협력 객체를 생성자로 받으면 테스트에서 다른 구현을 넣을 수 있다. new로 직접 만들면 바꿀 수 없다'
    where: '질문 2. 원리는 의존 역전 원칙과 의존성 주입(O5)'
  - topic: '테스트 더블의 다섯 가지: 더미, 스텁, 스파이, 목, 페이크'
    where: '질문 2'
  - topic: '스텁은 정해진 답을 돌려줘 테스트하는 쪽이 원하는 상황을 만든다. 결과(상태)를 검증한다'
    where: '질문 3'
  - topic: '목은 어떤 메서드가 어떤 인자로 몇 번 불렸는지 기록하고, 테스트는 그 호출을 검증한다(행위 검증)'
    where: '질문 3'
  - topic: 'Mockito의 `mock`, `when(...).thenReturn`, `verify`, `ArgumentCaptor`. 스텁하지 않은 메서드는 null, 0, false, 빈 컬렉션, 빈 Optional을 돌려준다'
    where: '질문 3'
  - topic: '목을 지나치게 쓰면 구현의 호출 순서와 방식에 테스트가 묶여 리팩터링할 때마다 깨진다'
    where: '질문 4'
  - topic: '목은 진짜와 다르게 동작해도 통과한다. 그래서 바깥 경계(메일, 외부 API)에만 목을 쓰고, 값 객체와 내 도메인 객체는 진짜를 쓴다'
    where: '질문 4'
  - topic: '페이크(메모리 안의 저장소)는 진짜처럼 동작하는 가벼운 구현이다. 상태로 검증할 수 있어 구현에 덜 묶인다'
    where: '질문 4'
  - topic: 'JUnit 5의 `@Nested`와 `@DisplayName`으로 상황별로 테스트를 묶기'
    where: '실무에서는 (자바 언어 과정의 중첩 클래스(J16)가 넘긴 항목)'
  - topic: '`@ParameterizedTest`로 같은 검사를 여러 입력에 돌리기'
    where: '실무에서는'
  - topic: '`@ExtendWith(MockitoExtension.class)`, `@Mock`, `@InjectMocks`와 엄격한 스텁(쓰지 않은 스텁을 실패로 알림)'
    where: '실무에서는'
  - topic: 'static 메서드와 `LocalDateTime.now()`처럼 바꿀 수 없는 의존은 `Clock`을 주입받아 테스트한다'
    where: '질문 2의 더 알아보기'
  - topic: '테스트 커버리지 숫자는 테스트가 지나간 줄을 셀 뿐, 맞게 검증했는지는 모른다'
    where: '질문 1의 더 알아보기'
  - topic: '스프링 컨텍스트를 띄우는 테스트, `@MockitoBean`'
    where: '다루지 않음: 스프링 테스트(T3)'
  - topic: '진짜 DB로 확인하는 테스트'
    where: '다루지 않음: 통합 테스트와 Testcontainers(T4)'
  - topic: 'TDD(테스트를 먼저 쓰는 개발 방식)'
    where: '질문 1의 더 알아보기'
