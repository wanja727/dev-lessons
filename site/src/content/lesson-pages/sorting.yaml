# 정렬
# 자료 파일의 칸은 docs/lesson-data-format.md에 있다. 문제는 content/questions/sorting.yaml에 있다.
title: 정렬
description: 버블 정렬은 왜 데이터가 많으면 쓸 수 없는지, 병합 정렬과 퀵 정렬은 어떻게 O(n log n)에 정렬하는지, 안정 정렬은 무엇이고 자바의 정렬은 안정인지, 자바에서 정렬 기준을 어떻게 정하는지. 네 가지 질문에 스스로 답할 수 있게, 주문 목록을 정렬하며 비교 횟수를 세어 보는 대화형 레슨.
unit: 자료구조와 알고리즘
minutes: 25
roadmap: K6
type: 자바 실행
prerequisites:
  - {slug: recursion, title: 재귀}
  - {slug: lambda, title: 람다와 함수형 인터페이스}
assume: '자바 21(OpenJDK). 재귀가 큰 문제를 같은 모양의 작은 문제로 나눈다는 것(재귀 레슨). 람다로 `Comparator`를 넘기는 문법(람다와 함수형 인터페이스 레슨). O(n²)과 O(n log n)이 뜻하는 것(시간 복잡도 레슨).'
example: '주문 목록을 금액 순으로, 같은 금액이면 주문 시각 순으로 정렬해요. 정렬 방법 세 가지가 비교를 몇 번 하는지 세고, 자바의 `List.sort`에 정렬 기준을 넘기는 방법을 봐요. 실무 구역에서는 뺄셈으로 만든 `Comparator`와 DB의 `ORDER BY`로 옮겨요.'
intro:
  - '주문 관리 화면에서 "금액 순"을 눌렀더니 같은 금액의 주문들이 누를 때마다 다른 순서로 섞여 보인다는 문의가 와요. 어떤 정렬은 같은 값의 원래 순서를 지키고 어떤 정렬은 지키지 않아요. 또 금액이 아주 큰 주문이 엉뚱한 자리로 가는 일도 있어요. 정렬 기준을 뺄셈으로 만들었기 때문이에요.'
  - '자바 개발자가 정렬 알고리즘을 직접 짤 일은 거의 없어요. `List.sort`와 `Arrays.sort`가 해 줘요. 대신 정렬 기준(`Comparable`, `Comparator`)은 매일 직접 써요. 면접에서는 "퀵 정렬과 병합 정렬의 차이", "안정 정렬이 무엇인가"를 묻고, 그 답이 자바의 정렬이 왜 그렇게 동작하는지로 이어져요.'
  - '이 레슨에서는 버블, 퀵, 병합 정렬이 같은 배열에 비교를 몇 번 하는지 세고, 같은 금액의 주문 순서가 정렬 뒤에 어떻게 되는지 확인해요.'
covers:
  - topic: '버블 정렬: 이웃끼리 비교해 바꾸기를 되풀이한다. 비교가 n(n-1)/2번이라 O(n²)이다'
    where: '질문 1'
  - topic: 'O(n²) 정렬로는 데이터가 늘면 감당할 수 없다. 1만 개면 비교 5천만 번'
    where: '질문 1'
  - topic: '선택 정렬과 삽입 정렬. 삽입 정렬은 거의 정렬된 데이터에서 빠르다'
    where: '질문 1의 더 알아보기'
  - topic: '병합 정렬: 절반으로 나눠 각각 정렬하고(재귀) 합친다. 나누는 깊이가 log n, 겹마다 합치는 일이 n이라 늘 O(n log n)이다. 합칠 때 n만큼의 메모리를 더 쓴다'
    where: '질문 2'
  - topic: '퀵 정렬: 기준값(피벗)을 골라 작은 것과 큰 것으로 나누고 각각 정렬한다. 평균 O(n log n)이고 더 쓰는 메모리가 적다'
    where: '질문 2'
  - topic: '퀵 정렬의 최악: 피벗이 매번 가장 작거나 큰 값이면 O(n²). 이미 정렬된 배열에서 맨 앞을 피벗으로 고르면 생긴다'
    where: '질문 2'
  - topic: '비교만으로 정렬하면 O(n log n)보다 빠를 수 없다'
    where: '질문 2의 더 알아보기'
  - topic: '안정 정렬: 같은 값의 원소들이 정렬 전의 순서를 지킨다. 병합 정렬은 안정이고 퀵 정렬은 보통 안정이 아니다'
    where: '질문 3'
  - topic: '안정 정렬이 필요한 곳: 다른 기준으로 이미 정렬된 목록을 다시 정렬할 때'
    where: '질문 3'
  - topic: '자바의 정렬: 객체 배열과 List.sort는 TimSort(병합 정렬을 바탕으로 한 안정 정렬), 기본형 배열은 Dual-Pivot Quicksort. 기본형은 같은 값을 구분할 수 없어 안정이 필요 없다'
    where: '질문 3'
  - topic: 'Comparable은 클래스가 스스로 정한 자연 순서(compareTo), Comparator는 밖에서 넘기는 정렬 기준'
    where: '질문 4'
  - topic: 'compare의 약속: 음수, 0, 양수. 같으면 0'
    where: '질문 4'
  - topic: 'Comparator.comparing, thenComparing, reversed로 기준 잇기. reversed가 앞의 기준 전체에 걸리는 것'
    where: '질문 4'
  - topic: 'null이 섞인 목록: Comparator.nullsFirst, nullsLast'
    where: '질문 4의 더 알아보기'
  - topic: '뺄셈으로 만든 Comparator는 오버플로로 순서가 뒤집힌다. Integer.compare나 comparingInt를 쓴다'
    where: '실무에서는. 오버플로의 원리는 숫자 타입의 한계(J19)'
  - topic: '많은 데이터의 정렬은 DB의 ORDER BY에 맡긴다. 페이지를 나눌 때 정렬 기준이 겹치면 순서가 흔들린다'
    where: '실무에서는. 페이지를 나누는 법은 페이지네이션(D8)'
  - topic: 'compareTo와 equals가 어긋날 때 TreeSet과 TreeMap'
    where: '다루지 않음: 이진 탐색 트리(K8)'
  - topic: '힙 정렬'
    where: '다루지 않음: 힙과 우선순위 큐(K9)의 더 알아보기'
codes:
  predict: |-
    record Order(long id, int amount) {}

    List<Order> orders = new ArrayList<>(
        List.of(new Order(1, 5000),
                new Order(2, 3000),
                new Order(3, 5000),
                new Order(4, 3000)));
    orders.sort(Comparator.comparingInt(
        Order::amount));
    // id 순서는?
  bubble: |-
    for (int i = 0; i < n - 1; i++) {
      for (int j = 0; [[j < n - 1 - i]]; j++) {
        if ([[a[j] > a[j + 1]]]) {
          int t = a[j];
          a[j] = a[j + 1];
          a[j + 1] = t;
        }
      }
    }
  compareRun: |-
    // 같은 무작위 배열 10,000개를
    // 세 방법으로 정렬하며 비교를 센다
  merge: |-
    static void sort(int[] a, int lo, int hi) {
      [[if (hi - lo < 2) return;]]
      int mid = (lo + hi) >>> 1;
      sort(a, lo, mid);
      sort(a, mid, hi);
      [[merge(a, lo, mid, hi)]];
    }
  mergeStep: |-
    // 정렬된 두 절반 [1, 4, 7], [2, 3, 9]
    // 맨 앞끼리 비교해 작은 것을 옮긴다
    1 vs 2 → 1    [1]
    4 vs 2 → 2    [1, 2]
    4 vs 3 → 3    [1, 2, 3]
    4 vs 9 → 4    [1, 2, 3, 4]
    7 vs 9 → 7    [1, 2, 3, 4, 7]
    남은 9        [1, 2, 3, 4, 7, 9]
  quickRun: |-
    // 맨 앞 원소를 피벗으로 쓰는 퀵 정렬
    quick([0, 1, 2, ..., 1999]); // 정렬됨
    quick(shuffled(2000));       // 섞임
  stableRun: |-
    // 코드 predict의 주문을 금액 순으로
    orders.sort(comparingInt(Order::amount));
    quickByAmount(orders);
    // 이미 정렬된 1,000개를 세며 정렬
    sorted.sort(countingComparator);
  comparable: |-
    record Order(long id, int amount)
        implements [[Comparable<Order>]] {
      public int compareTo(Order o) {
        return Integer.compare(
            amount, o.amount);
      }
    }
  chain: |-
    orders.sort(Comparator
        .comparingInt(Order::amount)
        [[.reversed()]]
        .thenComparing(Order::createdAt));
  chainMoved: |-
    orders.sort(Comparator
        .comparingInt(Order::amount)
        .thenComparing(Order::createdAt)
        [[.reversed()]]);
  secondOnly: |-
    orders.sort(Comparator
        .comparingInt(Order::amount)
        .thenComparing(Order::createdAt,
            [[Comparator.reverseOrder()]]));
  nulls: |-
    products.sort(Comparator.comparing(
        Product::price,
        [[Comparator.nullsLast(]]
            Comparator.naturalOrder())));
  subtract: |-
    Comparator<Order> byAmount =
        (a, b) -> [[a.amount() - b.amount()]];
  subtractFixed: |-
    Comparator<Order> byAmount =
        Comparator.[[comparingInt]](
            Order::amount);
  subtractRun: |-
    // 금액 2000000000, -500000000, 1000
    orders.sort(bySubtract);
    orders.sort(byCompare);
  repository: |-
    List<Order> findByStatus(
        OrderStatus status, Sort sort);

    repository.findByStatus(PAID,
        Sort.by(desc("amount"),
                asc("createdAt"),
                [[asc("id")]]));
