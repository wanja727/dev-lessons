# 가상 메모리
# 자료 파일의 칸은 docs/lesson-data-format.md에 있다. 문제는 content/questions/virtual-memory.yaml에 있다.
title: 가상 메모리
description: 프로세스마다 주소 공간이 따로인 이유, 페이징과 요구 페이징, 가상 크기와 실제 사용이 다른 이유, 물리 메모리가 모자랄 때 생기는 일. 힙을 512MB로 준 JVM의 메모리 숫자를 직접 읽어 보며 배우는 대화형 레슨.
unit: 운영체제와 동시성
minutes: 16
roadmap: C10
type: 개념 설명
prerequisites:
  - {slug: process-and-thread, title: 프로세스와 스레드}
  - {slug: jvm-memory, title: JVM 메모리 구조}
assume: '자바 21(OpenJDK, HotSpot), 리눅스. 프로세스끼리는 메모리를 공유하지 않는다는 것(프로세스와 스레드 레슨). 힙의 크기를 -Xms와 -Xmx로 정한다는 것(JVM 메모리 구조 레슨).'
example: '힙을 512MB로 준 JVM을 띄우고, 운영체제가 보는 이 프로세스의 메모리 두 숫자(가상 크기 VmSize와 실제로 쓰는 물리 메모리 VmRSS)를 읽어요. 힙을 처음부터 만져 두는 옵션을 켰을 때와 껐을 때를 비교해요. 실무 구역에서는 top의 VIRT와 RES, 컨테이너의 메모리 한도로 옮겨요.'
intro:
  - '서버에서 `top`을 보니 자바 프로세스의 VIRT가 6GB인데 RES는 700MB예요. 서버의 메모리는 4GB뿐인데 6GB를 쓰고 있다는 걸까요? 다른 날에는 메모리가 넉넉해 보이는데 서버가 갑자기 느려지고, 디스크만 바쁘게 돌아요.'
  - '자바 개발자는 힙의 크기, 컨테이너의 메모리 한도, 모니터링의 메모리 지표를 숫자로 다뤄요. 이 숫자들은 운영체제의 가상 메모리 위에서 나오는 값이라, 가상 메모리를 모르면 "얼마나 쓰고 있나"라는 단순한 질문에도 답이 엇갈려요.'
  - '이 레슨에서는 JVM 하나를 띄워 가상 크기와 실제로 쓰는 물리 메모리가 얼마나 다른지 보고, 힙을 처음부터 만져 두면 그 숫자가 어떻게 바뀌는지 확인해요.'
covers:
  - topic: '가상 주소와 물리 주소: 프로그램이 쓰는 주소는 가상 주소이고, CPU의 MMU가 페이지 테이블을 보고 물리 메모리의 주소로 바꾼다'
    where: '질문 1'
  - topic: '프로세스마다 주소 공간이 따로다. 같은 가상 주소라도 프로세스마다 다른 물리 메모리를 가리켜서 서로의 메모리를 볼 수 없다'
    where: '질문 1. J14에서 받은 항목'
  - topic: '스레드는 프로세스의 주소 공간을 함께 쓴다. 프로세스를 바꾸면 주소 공간을 바꿔서 더 비싸다'
    where: '질문 1의 더 알아보기. 컨텍스트 스위칭(C2)'
  - topic: '페이징: 메모리를 같은 크기(보통 4KB)의 페이지로 나누고 페이지 단위로 연결한다'
    where: '질문 2'
  - topic: '요구 페이징: 예약만 하고 처음 만질 때 물리 메모리를 준다(페이지 폴트). 그래서 가상 크기(VmSize)와 실제 사용(RSS)이 다르다'
    where: '질문 2'
  - topic: 'JVM은 -Xmx만큼 주소 공간을 예약하고, 힙을 쓰는 만큼 물리 메모리가 붙는다. -XX:+AlwaysPreTouch는 시작할 때 다 만져 둔다'
    where: '질문 2'
  - topic: '물리 메모리가 모자라면 덜 쓰는 페이지를 디스크(스왑)로 내보낸다. 너무 자주 오가면 스래싱'
    where: '질문 3'
  - topic: '자바 힙이 스왑으로 나가면 GC가 힙 전체를 훑느라 몹시 느려진다'
    where: '질문 3'
  - topic: '컨테이너는 보통 스왑 없이 메모리 한도를 넘으면 OOM 킬러가 프로세스를 끝낸다'
    where: '질문 3, 실무에서는. 컨테이너는 도커와 컨테이너(T5)'
  - topic: 'top의 VIRT와 RES, 모니터링에서 볼 숫자'
    where: '실무에서는'
  - topic: 'TLB, 페이지 테이블의 여러 단계, 큰 페이지(huge page)'
    where: '질문 2의 더 알아보기'
  - topic: '커널이 페이지 폴트를 처리하는 모드'
    where: '다루지 않음: 사용자 모드와 커널 모드(C11)'
codes:
  predict: |-
    $ java -Xms512m -Xmx512m App
    // App은 힙을 거의 쓰지 않고
    // /proc/self/status를 읽는다
    VmSize: ?
    VmRSS:  ?
  readStatus: |-
    for (String line : Files.readAllLines(
        Path.of("/proc/self/status")))
      if (line.startsWith("VmSize")
          || line.startsWith("VmRSS"))
        System.out.println(line);
  preTouch: |-
    $ java -Xms512m -Xmx512m \
        -XX:+AlwaysPreTouch App
  topLine: |-
    PID  VIRT   RES   %MEM COMMAND
    812  6.1g   0.7g  17.5 java
links:
  test: https://github.com/wanja727/dev-lessons/blob/main/verification/src/test/java/lab/devlessons/virtualmemory/VirtualMemoryTest.java
  proc: https://man7.org/linux/man-pages/man5/proc.5.html
  javaCmd: https://docs.oracle.com/en/java/javase/21/docs/specs/man/java.html
  mmConcepts: https://docs.kernel.org/admin-guide/mm/concepts.html
  top: https://man7.org/linux/man-pages/man1/top.1.html
predict:
  title: 512MB 힙의 두 숫자
  text: '힙을 512MB로 고정한 JVM이 힙을 거의 쓰지 않은 채 운영체제가 보는 자기 메모리 두 숫자를 읽어요. 가상 크기(VmSize)와 실제로 쓰는 물리 메모리(VmRSS)는 어떤 관계일까요? 답은 질문 2에 나와요.'
  code: predict
  label: 내 예측
  options:
    - value: same
      label: 둘 다 512MB쯤
    - value: apart
      label: VmSize는 수 GB, VmRSS는 그보다 훨씬 작다
    - value: small
      label: 둘 다 수십 MB
  answer: apart
  storageKey: virtual-memory-predict
  wrong: 예측은 "{label}"이었어요. 틀린 예측이 더 오래 남으니 괜찮아요.
questions:
  - id: q1
    title: 프로세스마다 주소 공간이 따로인 이유는 무엇인가요?
    conclusion:
      lead: '프로그램이 쓰는 주소는 가상 주소이고, 운영체제가 프로세스마다 다른 표(페이지 테이블)로 실제 메모리에 연결하기 때문이에요.'
      sub: '그래서 두 프로세스가 같은 주소를 써도 다른 물리 메모리를 가리키고, 남의 메모리에 닿을 길이 없어요.'
    says:
      - '자바의 참조든 C의 포인터든, 프로그램이 다루는 주소는 가상 주소다. CPU 안의 MMU가 메모리에 갈 때마다 그 프로세스의 페이지 테이블을 보고 물리 주소로 바꾼다'
      - '프로세스마다 페이지 테이블이 따로라서, 같은 가상 주소가 프로세스 A에서는 물리 메모리 1번 칸, B에서는 7번 칸이 된다. 표에 없는 곳에는 닿을 수 없다. C1에서 자식 JVM이 바꾼 count가 부모에게 보이지 않은 이유다'
      - '얻는 것: 격리(남의 메모리를 읽거나 망가뜨리지 못함), 단순함(프로그램마다 자기만의 넓은 주소 공간이 있는 것처럼 짠다), 물리 메모리보다 큰 주소 공간'
      - '같은 프로세스의 스레드는 같은 페이지 테이블을 쓴다. 그래서 힙을 함께 본다'
      - '더 알아보기: 다른 프로세스로 전환하면 CPU가 쓰는 페이지 테이블을 바꿔야 하고, 주소 변환을 기억해 두는 TLB도 비워진다. 프로세스 전환이 스레드 전환보다 비싼 이유다(C2)'
    widget:
      kind: compare
      note: '왼쪽은 프로세스 A의 페이지 테이블, 오른쪽은 프로세스 B의 것. 둘 다 가상 주소 0x1000을 가진다. 버튼을 누르면 A의 0x1000은 물리 1번 칸, B의 0x1000은 물리 7번 칸으로 연결되고, A의 표에는 B의 칸이 없다는 결과를 보인다'
    asks:
      - '본문의 예시: 프로세스 A와 B가 각자 가상 주소 0x1000에 값을 썼다. 두 값은 같은 물리 메모리에 있나 (아니다. 페이지 테이블이 달라 다른 물리 칸에 연결된다)'
      - '옮긴 상황: 같은 프로세스의 스레드 둘이 같은 객체의 주소를 쓴다. 같은 물리 메모리를 보나 (본다. 스레드는 프로세스의 페이지 테이블을 함께 쓴다)'
    body:
      - p: '자바의 참조든 C의 포인터든, 프로그램이 다루는 주소는 **가상 주소**예요. CPU 안의 MMU가 메모리에 갈 때마다 그 프로세스의 **페이지 테이블**을 보고 실제 메모리의 주소(물리 주소)로 바꿔요.'
      - widget:
          kind: compare
          layout: [sides, buttons, verdict]
          run: {label: 가상 주소 0x1000에 값 쓰기}
          sides:
            - label: 프로세스 A의 페이지 테이블
              items:
                - {name: 'A: 0x1000', note: '물리 1번 칸으로'}
                - {name: 'A: 0x2000', note: '물리 4번 칸으로'}
            - label: 프로세스 B의 페이지 테이블
              items:
                - {name: 'B: 0x1000', note: '물리 7번 칸으로'}
                - {name: 'B: 0x2000', note: '아직 연결 없음'}
          initial:
            sides:
              - result: [{k: 쓴 곳, v: 아직 없음}]
              - result: [{k: 쓴 곳, v: 아직 없음}]
          scenes:
            write:
              sides:
                - marks: [{name: 'A: 0x1000', tag: 씀}]
                  result: [{k: 쓴 곳, v: 물리 1번 칸}]
                - marks: [{name: 'B: 0x1000', tag: 씀}]
                  result: [{k: 쓴 곳, v: 물리 7번 칸, mark: changed}]
              verdict: '같은 가상 주소 0x1000이지만 표가 달라 다른 물리 칸에 써요. A의 표에는 7번 칸이 없어서 A는 B의 메모리에 닿을 길이 없어요.'
      - p: '프로세스마다 페이지 테이블이 따로라서, 같은 가상 주소가 프로세스마다 다른 물리 메모리를 가리켜요. 프로세스와 스레드 레슨에서 자식 JVM이 바꾼 `count`가 부모에게 보이지 않은 이유가 이거예요.'
      - ul:
          - '**격리:** 남의 메모리를 읽거나 망가뜨릴 수 없어요.'
          - '**단순함:** 프로그램마다 자기만의 넓은 주소 공간이 있는 것처럼 짜요.'
          - '**물리 메모리보다 큰 주소 공간:** 질문 2와 3에서 이어져요.'
      - p: '같은 프로세스의 스레드는 **같은 페이지 테이블**을 써요. 그래서 힙의 같은 객체를 함께 봐요.'
      - more:
          summary: '더 알아보기: 프로세스 전환이 더 비싼 이유'
          body:
            - p: '다른 프로세스로 전환하면 CPU가 쓰는 페이지 테이블을 바꿔야 하고, 최근 주소 변환을 기억해 두는 TLB도 비워져요. 같은 프로세스의 스레드끼리 바꿀 때보다 비싼 이유예요(컨텍스트 스위칭 레슨).'
      - quiz:
          q: '프로세스 A와 B가 각자 가상 주소 0x1000에 값을 썼어요. 두 값은 같은 물리 메모리에 있을까요?'
          options:
            - 같은 칸에 있어 나중 값이 덮는다
            - 다른 칸에 있다. 페이지 테이블이 다르다
            - 둘 중 하나는 실패한다
          answer: 2
          explain: '프로세스마다 표가 따로라 같은 가상 주소도 다른 물리 칸에 연결돼요.'
      - next: '주소 공간이 넓다고 했어요. 넓은 공간을 다 물리 메모리로 채워 두는 걸까요?'
    recall: '프로그램이 쓰는 주소는 가상 주소이고, 운영체제가 프로세스마다 다른 페이지 테이블로 물리 메모리에 연결하기 때문이에요. 두 프로세스가 같은 주소를 써도 다른 물리 메모리를 가리키고, 표에 없는 곳에는 닿을 수 없어 서로 격리돼요. 같은 프로세스의 스레드는 같은 표를 써서 힙을 함께 봐요.'
  - id: q2
    title: 페이징은 어떻게 동작하고, 가상 크기와 실제 사용은 왜 다른가요?
    conclusion:
      lead: '메모리를 4KB 같은 페이지로 나눠 페이지마다 물리 메모리에 연결하는데, 예약만 해 두고 처음 만지는 순간에야 물리 메모리를 붙여요.'
      sub: '그래서 프로세스의 가상 크기(VmSize)는 예약한 주소 공간 전체이고, 실제 사용(RSS)은 만진 페이지만큼이에요. 힙을 512MB로 줘도 쓰기 전에는 물리 메모리를 거의 쓰지 않아요.'
    says:
      - '페이징: 주소 공간을 같은 크기의 페이지(리눅스 기본 4KB)로 나누고, 페이지 테이블이 페이지마다 물리 메모리의 칸(프레임)을 가리킨다'
      - '요구 페이징: 프로그램이 큰 메모리를 달라고 하면 운영체제는 주소 공간만 예약한다. 그 페이지를 처음 읽거나 쓰는 순간 CPU가 페이지 폴트를 내고, 커널이 그때 물리 메모리를 붙인다'
      - '예측의 답을 밝힌다. -Xms512m -Xmx512m JVM이 /proc/self/status를 읽으면 VmSize는 수 GB, VmRSS는 백 MB 안팎이다. 실제 출력으로 보인다(리눅스 CI). VmSize에는 힙 말고도 스레드 스택, 코드 캐시, 메타스페이스 등의 예약이 들어 있다'
      - '-XX:+AlwaysPreTouch를 켜면 JVM이 시작할 때 힙의 모든 페이지를 만져 둔다. VmRSS가 512MB를 넘는다. 시작은 느려지지만 실행 중에 페이지 폴트가 줄어든다. 두 출력을 나란히 보인다'
      - '더 알아보기: 주소 변환이 매번 표를 찾으면 느려서 CPU는 최근 변환을 TLB에 기억한다. 표는 여러 단계로 되어 있다. 2MB 같은 큰 페이지를 쓰면 TLB가 더 넓은 범위를 기억한다(-XX:+UseLargePages)'
    asks:
      - '본문의 예시: -Xms512m -Xmx512m으로 띄운 JVM이 힙을 거의 쓰지 않았다. VmRSS로 맞는 것은 (512MB보다 훨씬 작다. 만진 페이지만 물리 메모리를 쓴다)'
      - '옮긴 상황: 같은 JVM에 -XX:+AlwaysPreTouch를 더했다. VmRSS는 어떻게 되나 (512MB를 넘는다. 시작할 때 힙의 모든 페이지를 만졌다)'
    body:
      - p: '**페이징**은 주소 공간을 같은 크기의 **페이지**(리눅스 기본 4KB)로 나누고, 페이지 테이블이 페이지마다 물리 메모리의 칸을 가리키게 하는 방식이에요.'
      - p: '여기에 **요구 페이징**이 더해져요. 프로그램이 큰 메모리를 달라고 하면 운영체제는 주소 공간만 **예약**해요. 그 페이지를 처음 읽거나 쓰는 순간 CPU가 **페이지 폴트**를 내고, 커널이 그때 물리 메모리를 붙여요.'
      - p: '처음 예측의 답은 **VmSize는 수 GB, VmRSS는 그보다 훨씬 작다**예요. {{predict-result}} 운영체제가 보는 이 프로세스의 숫자를 `/proc/self/status`에서 읽었어요([proc 문서](link:proc)).'
      - ci:
          key: predict
          label: 리눅스 CI에서 읽은 실제 값 보기
          source: VirtualMemoryTest.reservedVersusTouched
          code: readStatus
      - ul:
          - '**VmSize**는 예약한 주소 공간 전체예요. 힙 512MB 말고도 스레드 스택, 코드 캐시, 메타스페이스, 라이브러리의 예약이 들어 있어요.'
          - '**VmRSS**는 지금 물리 메모리에 올라와 있는 페이지의 합이에요. 힙을 거의 쓰지 않았으니 512MB보다 훨씬 작아요.'
      - p: '`-XX:+AlwaysPreTouch`를 켜면 JVM이 시작할 때 힙의 모든 페이지를 만져 둬요([java 명령 문서](link:javaCmd)).'
      - code: preTouch
      - ci:
          key: pretouch
          label: AlwaysPreTouch를 켠 실제 값 보기
          source: VirtualMemoryTest.reservedVersusTouched
      - p: '이번에는 VmRSS가 512MB를 넘어요. 시작은 조금 느려지지만, 실행 중에 페이지 폴트가 줄어들고 메모리가 모자란 상황을 시작할 때 알 수 있어요.'
      - more:
          summary: '더 알아보기: TLB와 큰 페이지'
          body:
            - p: '주소를 바꿀 때마다 표를 찾으면 느려서, CPU는 최근 변환을 TLB에 기억해요. 표 자체도 여러 단계로 되어 있어요. 2MB 같은 큰 페이지를 쓰면 TLB 한 칸이 더 넓은 범위를 맡아요(`-XX:+UseLargePages`).'
      - quiz:
          q: '`-Xms512m -Xmx512m`으로 띄운 JVM이 힙을 거의 쓰지 않았어요. VmRSS로 맞는 것은?'
          options:
            - 512MB보다 크다
            - 512MB보다 훨씬 작다
            - 정확히 512MB
          answer: 2
          explain: '주소 공간은 예약만 했고, 처음 만진 페이지에만 물리 메모리가 붙어요.'
      - next: '실제로 쓰는 페이지가 물리 메모리보다 많아지면 어떻게 될까요?'
    recall: '메모리를 4KB 같은 페이지로 나눠 페이지마다 물리 메모리에 연결하는데, 예약만 해 두고 처음 만지는 순간(페이지 폴트)에야 물리 메모리를 붙여요. 그래서 가상 크기(VmSize)는 예약한 주소 공간 전체이고 실제 사용(RSS)은 만진 페이지만큼이에요. `-XX:+AlwaysPreTouch`는 힙을 시작할 때 다 만져 둬요.'
  - id: q3
    title: 물리 메모리가 모자라면 무슨 일이 생기나요?
    conclusion:
      lead: '운영체제는 덜 쓰는 페이지를 디스크의 스왑 영역으로 내보내고, 다시 필요할 때 읽어 들여요. 이게 너무 잦으면 디스크만 바쁘고 일은 못 하는 스래싱이 돼요.'
      sub: '자바 힙은 GC가 통째로 훑어서 스왑과 특히 맞지 않아요. 스왑이 없는 컨테이너에서는 한도를 넘는 순간 프로세스가 끝나요.'
    says:
      - '물리 메모리가 모자라면 커널은 한동안 만지지 않은 페이지를 디스크(스왑)에 쓰고 그 프레임을 다른 데 준다. 그 페이지를 다시 만지면 페이지 폴트가 나고 디스크에서 읽어 온다'
      - '디스크는 메모리보다 수만 배 느리다. 필요한 페이지가 계속 밀려나고 다시 들어오면 CPU는 놀고 디스크만 돈다. 스래싱이다'
      - '자바 힙과 스왑: GC는 살아 있는 객체를 찾으려고 힙의 넓은 범위를 훑는다(J15). 힙의 일부가 스왑에 나가 있으면 GC 한 번에 디스크를 오래 기다린다. 그래서 자바 서버는 힙이 물리 메모리 안에 들어오게 잡고 스왑을 꺼 두기도 한다'
      - '스왑이 없으면 모자란 순간 커널의 OOM 킬러가 메모리를 많이 쓰는 프로세스를 끝낸다. 자바의 OutOfMemoryError와 다르게 JVM은 아무 로그도 남기지 못한다'
    asks:
      - '본문의 예시: 서버의 CPU 사용률은 낮은데 디스크 읽기와 쓰기가 계속 바쁘고, 자바의 GC 시간이 크게 늘었다. 의심할 것은 (스왑. 힙의 페이지가 디스크를 오가는 스래싱)'
      - '옮긴 상황: 스왑이 없는 컨테이너에서 자바 프로세스의 실제 사용이 메모리 한도를 넘었다. 로그에 OutOfMemoryError가 남나 (남지 않는다. 커널이 프로세스를 끝낸다)'
      - '실무 구역: top에서 자바 프로세스의 VIRT 6.1g, RES 0.7g이고 서버 메모리는 4GB다. 이 프로세스가 지금 쓰는 물리 메모리는 (0.7GB쯤. VIRT는 예약한 주소 공간이다)'
    body:
      - p: '물리 메모리가 모자라면 커널은 한동안 만지지 않은 페이지를 디스크의 **스왑** 영역에 쓰고, 그 칸을 다른 데 줘요. 그 페이지를 다시 만지면 페이지 폴트가 나고 디스크에서 읽어 와요([커널 문서](link:mmConcepts)).'
      - ul:
          - '**스래싱:** 디스크는 메모리보다 수만 배 느려요. 필요한 페이지가 계속 밀려나고 다시 들어오면 CPU는 놀고 디스크만 바빠요.'
          - '**자바 힙과 스왑은 특히 안 맞아요.** GC는 살아 있는 객체를 찾으려고 힙의 넓은 범위를 훑어요(가비지 컬렉션 레슨). 힙의 일부가 스왑에 나가 있으면 GC 한 번에 디스크를 오래 기다려요. 그래서 자바 서버는 힙이 물리 메모리 안에 들어오게 잡고, 스왑을 꺼 두기도 해요.'
          - '**스왑이 없으면** 모자란 순간 커널의 OOM 킬러가 메모리를 많이 쓰는 프로세스를 끝내요. 자바의 `OutOfMemoryError`와 달리 JVM은 아무 로그도 남기지 못해요.'
      - callout: '증상으로 구분해요. CPU는 낮은데 디스크가 계속 바쁘고 GC 시간이 크게 늘면 스왑을, 로그 없이 프로세스가 사라지면 OOM 킬러를 의심해요.'
      - quiz:
          q: '스왑이 없는 컨테이너에서 자바 프로세스의 실제 사용이 메모리 한도를 넘었어요. 로그에 `OutOfMemoryError`가 남을까요?'
          options:
            - 남는다. JVM이 먼저 던진다
            - 남지 않는다. 커널이 프로세스를 끝낸다
            - 힙이 자동으로 줄어든다
          answer: 2
          explain: '힙이 아직 남아 있어도 프로세스 전체가 한도를 넘으면 커널이 끝내요. JVM은 알 틈이 없어요.'
    recall: '운영체제는 덜 쓰는 페이지를 디스크의 스왑으로 내보내고 다시 필요할 때 읽어 들여요. 이게 너무 잦으면 디스크만 바쁜 스래싱이 돼요. 자바 힙은 GC가 넓게 훑어서 스왑과 특히 맞지 않고, 스왑이 없는 컨테이너에서는 한도를 넘는 순간 OOM 킬러가 로그 없이 프로세스를 끝내요.'
practice:
  says:
    - 'top의 VIRT는 가상 크기(VmSize), RES는 실제로 쓰는 물리 메모리(RSS)다. 메모리 사용을 볼 때는 RES를 본다. 자바 프로세스의 VIRT가 메모리보다 커도 이상하지 않다(코드 topLine)'
    - '컨테이너의 메모리 한도는 RSS(정확히는 cgroup이 세는 메모리)에 걸린다. 힙만이 아니라 스레드 스택, 메타스페이스, 다이렉트 버퍼가 모두 들어간다. 그래서 힙을 한도의 75% 정도로 잡는다(J14 실무 구역과 같은 결론)'
    - '흔한 실수: 시작 직후의 RES를 보고 "메모리가 남는다"며 컨테이너 한도를 힙과 같게 줄인다. 힙을 쓸수록 RES가 늘어 몇 시간 뒤에 OOM 킬러가 끝낸다. 고친 방법: 한도에 여유를 두거나, -XX:+AlwaysPreTouch로 시작할 때 미리 만져 문제를 일찍 드러낸다(java 명령 문서 근거)'
    - '컨테이너의 끝난 이유는 `docker inspect`의 OOMKilled나 쿠버네티스의 OOMKilled 상태로 본다(T5, T7)'
  title: 서버와 컨테이너에서는 이렇게 만나요
  body:
    - p: '운영체제의 주제라 코드보다 **도구의 숫자와 설정**으로 만나요. 숫자의 뜻은 리눅스 문서가 근거이고, 두 숫자가 다른 것은 질문 2의 테스트로 확인했어요.'
    - h3: top의 VIRT와 RES
    - code: topLine
    - p: 'VIRT는 가상 크기(VmSize), RES는 실제로 쓰는 물리 메모리(RSS)예요([top 문서](link:top)). 메모리 사용을 볼 때는 **RES**를 봐요. 자바 프로세스의 VIRT가 서버 메모리보다 커도 이상하지 않아요.'
    - h3: 컨테이너의 한도는 RSS에 걸려요
    - p: '컨테이너의 메모리 한도는 프로세스가 실제로 쓰는 메모리에 걸려요. 힙만이 아니라 스레드 스택, 메타스페이스, 다이렉트 버퍼가 모두 들어가요. 그래서 힙을 한도의 75% 정도로 잡아요(JVM 메모리 구조 레슨의 실무 구역과 같은 결론).'
    - h3: '흔한 실수: 시작 직후의 RES로 한도를 정하기'
    - p: '시작 직후의 RES를 보고 "메모리가 남는다"며 컨테이너 한도를 힙과 같게 줄여요. 힙을 쓸수록 만지는 페이지가 늘어 RES가 커지고, 몇 시간 뒤에 OOM 킬러가 끝내요. 한도에 여유를 두고, 필요하면 `-XX:+AlwaysPreTouch`로 시작할 때 힙을 다 만져 모자란 것을 일찍 드러내요.'
    - muted: '컨테이너가 끝난 이유는 `docker inspect`의 OOMKilled나 쿠버네티스의 OOMKilled 상태로 봐요. 도커와 컨테이너, 로그와 모니터링 레슨에서 다뤄요.'
interview:
  question: 가상 메모리가 무엇이고 왜 쓰는지 설명해 주세요
  model:
    - label: 정의
      text: 프로그램이 쓰는 주소를 가상 주소로 두고, 운영체제가 프로세스마다 다른 페이지 테이블로 물리 메모리에 연결하는 방식입니다.
    - label: 원리
      text: 메모리를 4KB 같은 페이지로 나눠 연결하고, 예약만 해 두었다가 처음 만질 때 페이지 폴트로 물리 메모리를 붙입니다. 그래서 프로세스끼리 격리되고, 가상 크기와 실제 사용(RSS)이 다릅니다.
    - label: 주의할 점
      text: 물리 메모리가 모자라면 페이지를 스왑으로 내보내는데, 자바 힙은 GC가 넓게 훑어 스왑과 맞지 않아 크게 느려집니다. 스왑이 없는 컨테이너에서는 RSS가 한도를 넘으면 OOM 킬러가 로그 없이 끝내므로, 힙 밖 메모리까지 생각해 한도에 여유를 둡니다.
    - label: 경험
      text: '(내 프로젝트로 채우기) 예: top의 VIRT가 커서 걱정했지만 RES를 보고 실제 사용을 판단했고, 컨테이너 한도를 힙보다 넉넉히 잡았습니다.'
verified: 이 레슨의 숫자는 리눅스(CI)에서 JVM을 따로 띄워 /proc/self/status를 읽은 값이에요. 다른 운영체제에서는 테스트를 건너뛰어요. 코드가 바뀔 때마다 테스트([VirtualMemoryTest](link:test))가 다시 돌아요.
footer: '근거: VmSize와 VmRSS는 proc(5) 문서([링크](link:proc)), AlwaysPreTouch는 java 명령 문서, 페이지와 스왑과 OOM 킬러는 리눅스 커널 문서([링크](link:mmConcepts)), VIRT와 RES는 top(1) 문서. 결과는 OpenJDK 21과 리눅스에서 테스트로 확인했어요. 오류는 [GitHub 이슈](https://github.com/wanja727/dev-lessons/issues)로 알려 주세요.'
claims:
  - claim: '-Xms512m -Xmx512m JVM이 힙을 거의 쓰지 않으면 VmSize는 VmRSS보다 훨씬 크다(리눅스)'
    test: VirtualMemoryTest.reservedVersusTouched
    how: '`ChildJvm`으로 띄워 /proc/self/status를 읽는다. 리눅스가 아니면 건너뛴다(assumeTrue). VmSize가 VmRSS의 세 배 넘는지 본다'
  - claim: '-XX:+AlwaysPreTouch를 켜면 같은 JVM의 VmRSS가 512MB를 넘고, 끄면 512MB보다 작다'
    how: '같은 자식 JVM을 옵션만 바꿔 두 번 띄운다'
    test: VirtualMemoryTest.reservedVersusTouched
  - claim: '같은 프로세스의 두 스레드는 같은 객체를 본다'
    how: '프로세스와 스레드 레슨의 테스트가 이미 보였다(ProcessAndThreadTest.threadsShareHeap)'
sources:
  - '`/proc/[pid]/status`의 VmSize, VmRSS: 리눅스 man 페이지 proc(5) https://man7.org/linux/man-pages/man5/proc.5.html'
  - '`-XX:+AlwaysPreTouch`: java 명령 문서 https://docs.oracle.com/en/java/javase/21/docs/specs/man/java.html'
  - '리눅스의 메모리 관리(페이지, 스왑, OOM 킬러): 커널 문서 https://docs.kernel.org/admin-guide/mm/concepts.html'
  - 'top의 VIRT와 RES: man 페이지 top(1) https://man7.org/linux/man-pages/man1/top.1.html'
