# 그래프와 탐색 (설계서)
# 자료 파일의 칸은 docs/lesson-data-format.md에 있다.
stage: design
title: 그래프와 탐색
unit: 자료구조와 알고리즘
roadmap: K11
type: 자바 실행
prerequisites:
  - {slug: stack-and-queue, title: 스택과 큐}
  - {slug: recursion, title: 재귀}
assume: '자바 21(OpenJDK). 큐는 먼저 넣은 것을, 스택은 마지막에 넣은 것을 먼저 꺼낸다는 것(스택과 큐 레슨). 재귀와 호출 스택(재귀 레슨). `Map`과 `Set`(해시 테이블 레슨).'
example: '회원 일곱 명의 친구 관계. 회원이 점이고 친구 사이가 선이에요. 1번 회원에서 시작해 너비 우선과 깊이 우선으로 둘러보는 순서를 비교하고, "1번과 6번은 몇 단계 건너 아는 사이인가"를 구해요. 실무 구역에서는 모듈 사이의 의존 관계에서 순환을 찾는 코드와, 방문 표시를 늦게 해서 같은 회원을 여러 번 넣는 실수로 옮겨요.'
intro:
  - '"알 수도 있는 사람"을 추천하려면 내 친구의 친구, 그 친구의 친구를 가까운 순서로 둘러봐야 해요. 지하철 노선에서 환승이 가장 적은 길을 찾을 때도, 서비스 사이의 호출 관계에 순환이 있는지 볼 때도 같은 일을 해요. 점과 선으로 이루어진 그래프를 차례로 둘러보는 일이에요.'
  - '자바 개발자가 그래프 알고리즘을 매일 짜지는 않아요. 그래도 스프링이 빈의 순환 참조를 찾아내는 일, 빌드 도구가 모듈을 빌드할 순서를 정하는 일이 그래프 탐색이에요. 면접에서는 "BFS와 DFS의 차이", "최단 거리는 왜 BFS로 구하나"를 묻고, 코딩 테스트의 많은 문제가 이 둘로 풀려요.'
  - '이 레슨에서는 같은 그래프를 두 방식으로 둘러보며 방문 순서를 출력하고, 큐와 스택이 그 순서를 어떻게 정하는지 확인해요.'
covers:
  - topic: '그래프는 점(정점)과 점을 잇는 선(간선)이다. 방향이 있는 그래프와 없는 그래프, 가중치가 있는 그래프'
    where: '질문 1'
  - topic: '코드로 담는 두 방법: 인접 리스트(점마다 이웃 목록)와 인접 행렬(n×n 표). 인접 리스트는 메모리가 간선 수에 비례하고 대부분의 서비스 데이터에 맞는다'
    where: '질문 1'
  - topic: '인접 행렬은 두 점이 이어졌는지를 O(1)에 보지만 메모리가 n²이다'
    where: '질문 1'
  - topic: '너비 우선 탐색(BFS): 큐로 가까운 점부터 한 겹씩 넓혀 간다'
    where: '질문 2'
  - topic: '방문 표시는 큐에 넣을 때 한다. 꺼낼 때 하면 같은 점이 큐에 여러 번 들어간다'
    where: '질문 2, 실무에서는'
  - topic: '방문 표시가 없으면 순환이 있는 그래프에서 끝나지 않는다'
    where: '질문 2'
  - topic: '깊이 우선 탐색(DFS): 한 길을 끝까지 따라간 뒤 돌아와 다른 길로 간다. 재귀나 스택으로 쓴다'
    where: '질문 3'
  - topic: 'DFS를 재귀로 쓰면 깊이가 깊은 그래프에서 StackOverflowError가 날 수 있다'
    where: '질문 3. 이유는 재귀(K5)'
  - topic: '두 탐색 모두 점과 간선을 한 번씩 보므로 O(V + E)다'
    where: '질문 3'
  - topic: '가중치가 없으면 BFS가 처음 닿은 순간의 겹 수가 최단 거리다'
    where: '질문 4'
  - topic: 'DFS가 맞는 일: 끝까지 가 봐야 아는 것. 순환 찾기, 모든 경로, 연결된 덩어리 나누기'
    where: '질문 4'
  - topic: '방향 그래프의 순환 찾기: 지금 따라가는 길에 있는 점을 다시 만나면 순환이다'
    where: '질문 4, 실무에서는'
  - topic: '의존 관계의 순서 정하기(위상 정렬)'
    where: '질문 4의 더 알아보기'
  - topic: '스프링이 생성자 주입의 순환 참조를 찾아 BeanCurrentlyInCreationException으로 알리는 것'
    where: '실무에서는. 빈과 주입은 스프링 빈과 의존성 주입(S2)'
  - topic: '가중치가 있는 최단 경로(다익스트라)'
    where: '다루지 않음: 최단 경로(K14)'
  - topic: 'DB에 그래프를 담고 재귀 쿼리로 읽는 것'
    where: '다루지 않음: 재귀(K5)의 실무에서는'
codes:
  predict: |-
    // 친구 관계 (양쪽 방향)
    // 1-2, 1-3, 2-4, 2-5, 3-6, 5-7
    Map<Integer, List<Integer>> g =
        Map.of(1, List.of(2, 3),
               2, List.of(1, 4, 5),
               3, List.of(1, 6),
               4, List.of(2),
               5, List.of(2, 7),
               6, List.of(3),
               7, List.of(5));
  bfs: |-
    List<Integer> bfs(int start) {
      List<Integer> order = new ArrayList<>();
      Set<Integer> seen = new HashSet<>();
      Queue<Integer> q = new ArrayDeque<>();
      q.offer(start);
      seen.add(start);
      while (!q.isEmpty()) {
        int v = q.poll();
        order.add(v);
        for (int w : g.get(v)) {
          if (seen.add(w)) {
            q.offer(w);
          }
        }
      }
      return order;
    }
  dfs: |-
    void dfs(int v, Set<Integer> seen,
             List<Integer> order) {
      seen.add(v);
      order.add(v);
      for (int w : g.get(v)) {
        if (!seen.contains(w)) {
          dfs(w, seen, order);
        }
      }
    }
  distance: |-
    Map<Integer, Integer> dist =
        new HashMap<>();
    dist.put(start, 0);
    // bfs에서 w를 큐에 넣을 때
    dist.put(w, dist.get(v) + 1);
  lateMark: |-
    while (!q.isEmpty()) {
      int v = q.poll();
      if (!seen.add(v)) continue;
      order.add(v);
      for (int w : g.get(v)) {
        if (!seen.contains(w)) {
          q.offer(w);
        }
      }
    }
  cycle: |-
    // 모듈 → 의존하는 모듈
    Map<String, List<String>> deps = Map.of(
        "order", List.of("member", "payment"),
        "payment", List.of("member"),
        "member", List.of("coupon"),
        "coupon", List.of("order"));
predict:
  text: '코드 predict의 친구 관계에서 1번 회원부터 둘러봐요. 이웃은 목록에 적힌 순서로 봐요. 너비 우선 탐색이 방문하는 순서는 무엇일까요? 보기: 1, 2, 3, 4, 5, 6, 7 / 1, 2, 4, 5, 7, 3, 6 / 1, 3, 6, 2, 5, 7, 4.'
  answer: '1, 2, 3, 4, 5, 6, 7. 1번의 친구(2, 3)를 먼저 모두 보고, 그다음 친구의 친구(4, 5, 6), 그다음(7) 순서다. 1, 2, 4, 5, 7, 3, 6은 깊이 우선의 순서다. 질문 2에서 밝힌다.'
questions:
  - id: q1
    title: 그래프는 코드로 어떻게 담나요?
    conclusion:
      lead: '점마다 이어진 이웃의 목록을 두는 인접 리스트로 담는 것이 보통이에요. 자바에서는 `Map<점, List<점>>`이에요.'
      sub: '점 n개를 n×n 표로 담는 인접 행렬도 있어요. 두 점이 이어졌는지는 바로 보지만 메모리가 n²이라, 선이 드문 서비스 데이터에는 맞지 않아요.'
    says:
      - '그래프는 점(정점)과 점을 잇는 선(간선)이다. 회원이 점, 친구 관계가 선이다. 친구는 양쪽이 서로 친구라 방향이 없다. 팔로우나 "A 모듈이 B 모듈을 쓴다"는 한쪽 방향이라 방향 그래프다. 선에 거리나 비용이 붙으면 가중치 그래프다'
      - '트리는 순환이 없는 그래프다. K8의 이진 탐색 트리, K5의 카테고리 트리도 그래프다'
      - '인접 리스트. 코드 predict처럼 점마다 이웃의 목록을 둔다. 방향이 없으면 선 하나를 양쪽 목록에 다 적는다. 메모리는 점 수와 선 수에 비례한다'
      - '인접 행렬. `boolean[n][n]`에서 `adj[a][b]`가 참이면 이어진 것이다. 이어졌는지를 O(1)에 보지만 회원 100만 명이면 칸이 1조 개다. 회원마다 친구는 수백 명뿐이라 칸 대부분이 비어 있다'
      - '어느 쪽이든 탐색 방법은 같다. 이 레슨은 인접 리스트로 쓴다'
    asks:
      - '본문의 예시: 코드 predict의 그래프에서 5번 회원의 이웃은 누구이고, 선은 모두 몇 개인가 (2번과 7번, 선 6개)'
      - '옮긴 상황: 점이 10만 개이고 점마다 선이 평균 10개인 그래프를 담는다. 인접 행렬과 인접 리스트가 쓰는 칸 수는 대략 각각 얼마인가 (인접 행렬은 100억 칸, 인접 리스트는 100만 칸 남짓)'
  - id: q2
    title: 너비 우선 탐색은 어떤 순서로 둘러보나요?
    conclusion:
      lead: '시작점에서 가까운 점부터 한 겹씩 넓혀 가요. 시작점의 이웃을 모두 본 다음에 이웃의 이웃을 봐요.'
      sub: '먼저 찾은 점을 먼저 꺼내는 큐가 이 순서를 만들어요. 같은 점을 두 번 넣지 않도록 큐에 넣는 순간 방문 표시를 해요.'
    says:
      - '코드 bfs를 따라간다. 1을 큐에 넣는다. 1을 꺼내고 이웃 2, 3을 넣는다. 2를 꺼내고 아직 안 본 4, 5를 넣는다. 3을 꺼내고 6을 넣는다. 4, 5를 꺼내며 7을 넣는다. 예측의 답을 밝힌다. 방문 순서는 1, 2, 3, 4, 5, 6, 7이다'
      - '큐라서 이 순서가 된다. 한 겹의 점은 다음 겹의 점보다 먼저 큐에 들어갔으니 먼저 나온다(K3)'
      - '방문 표시(`seen`)는 순환 때문에 필요하다. 2의 이웃에 1이 있다. 표시가 없으면 1을 다시 넣고, 1이 2를 다시 넣고, 끝나지 않는다'
      - '표시하는 시점은 큐에 넣을 때다. `seen.add(w)`가 처음 넣을 때만 참을 돌려줘서 한 점은 큐에 한 번만 들어간다. 꺼낼 때 표시하면 아직 꺼내지 않은 점을 다른 이웃이 또 넣는다. 실무 구역에서 다룬다'
    widget:
      kind: steps
      note: '코드 predict의 그래프를 그림으로 둔다. 두 시나리오. 너비 우선: 단계마다 큐의 내용과 방문 순서를 보이고, 지금 꺼낸 점과 새로 넣은 점을 강조하며 같은 겹의 점을 같은 색 테두리로 묶는다. 깊이 우선: 단계마다 호출 스택(지금 따라가는 길)과 방문 순서를 보인다. 같은 그래프에서 두 순서가 1, 2, 3, 4, 5, 6, 7과 1, 2, 4, 5, 7, 3, 6으로 갈리는 것을 본다'
    asks:
      - '본문의 예시: 코드 bfs로 3번 회원에서 시작하면 방문 순서는 무엇인가 (3, 1, 6, 2, 4, 5, 7)'
      - '옮긴 상황: 코드 bfs에서 `seen`을 모두 지우고 `q.offer(w)`만 남겼다. 코드 predict의 그래프에서 1부터 돌리면 어떻게 되나 (끝나지 않는다. 서로 친구인 두 점이 서로를 계속 큐에 넣는다)'
      - '실무 구역: 코드 lateMark처럼 꺼낼 때 방문 표시를 하면 방문 순서는 같지만 무엇이 달라지나 (같은 점이 큐에 여러 번 들어간다. 큐에 넣는 횟수가 늘어난다)'
  - id: q3
    title: 깊이 우선 탐색은 어떤 순서로 둘러보나요?
    conclusion:
      lead: '한 이웃을 따라 더 갈 곳이 없을 때까지 끝까지 들어간 뒤, 돌아 나와 아직 안 본 다른 이웃으로 가요.'
      sub: '마지막에 들어간 곳에서 먼저 돌아 나오는 스택이 이 순서를 만들어요. 재귀로 쓰면 호출 스택이 그 스택이에요. 두 탐색 모두 점과 선을 한 번씩 봐서 O(점 수 + 선 수)예요.'
    says:
      - '코드 dfs를 따라간다. 1을 방문하고 첫 이웃 2로 들어간다. 2에서 1은 봤으니 4로 들어간다. 4는 더 갈 곳이 없어 2로 돌아온다. 2의 다음 이웃 5, 5에서 7. 7에서 돌아 나와 1까지 돌아온 뒤 3, 3에서 6. 순서는 1, 2, 4, 5, 7, 3, 6이다'
      - '재귀 호출이 돌아올 자리를 기억한다. 4에서 돌아올 때 2의 반복문이 다음 이웃부터 이어 간다. 이것이 K5에서 본 프레임마다의 지역 변수다'
      - '재귀 대신 `ArrayDeque`를 스택으로 써도 된다(K5의 질문 3). 그래프가 한 줄로 10만 개 이어져 있으면 재귀 버전은 `StackOverflowError`가 날 수 있어서 이때는 스택 버전을 쓴다. 스택 버전은 이웃을 넣는 순서 때문에 방문 순서가 재귀와 조금 다를 수 있다'
      - '비용. 두 탐색 모두 점마다 한 번 꺼내고, 점마다 이웃 목록을 한 번 훑는다. 이웃 목록의 길이를 모두 더하면 선 수(방향이 없으면 그 두 배)다. 그래서 O(V + E)다. V는 점 수, E는 선 수다'
    asks:
      - '본문의 예시: 코드 dfs로 3번 회원에서 시작하면 방문 순서는 무엇인가 (3, 1, 2, 4, 5, 7, 6)'
      - '옮긴 상황: 점 100만 개가 1-2-3-...-1000000처럼 한 줄로 이어진 그래프를 재귀 DFS로 끝까지 둘러본다. 어떤 일이 생길 수 있고 어떻게 피하나 (`StackOverflowError`. 직접 만든 스택으로 쓴다)'
  - id: q4
    title: 너비 우선과 깊이 우선은 각각 어떤 문제에 쓰나요?
    conclusion:
      lead: '선에 가중치가 없을 때의 최단 거리는 너비 우선으로 구해요. 끝까지 가 봐야 알 수 있는 것, 순환이 있는지나 연결된 덩어리가 몇 개인지는 깊이 우선이 잘 맞아요.'
      sub: '너비 우선은 가까운 겹부터 보니, 어떤 점에 처음 닿는 순간의 겹 수가 그 점까지의 가장 짧은 거리예요.'
    says:
      - '최단 거리. 코드 distance처럼 큐에 넣을 때 "꺼낸 점의 거리 + 1"을 적는다. 1번에서 6번은 2, 7번은 3이다. 처음 닿는 순간이 가장 가까운 순간이다. 겹 순서로 보기 때문이다. 깊이 우선은 먼 길로 먼저 닿을 수 있어서 처음 닿은 길이 최단이 아니다'
      - '"1번과 7번은 몇 단계 건너 아는 사이인가", "환승이 가장 적은 길"이 이 문제다. 선마다 거리가 다르면(분 단위 이동 시간) 너비 우선으로는 안 되고 다익스트라를 쓴다(K14)'
      - '연결된 덩어리 세기. 아직 안 본 점에서 탐색을 시작할 때마다 덩어리가 하나다. 어느 탐색이든 되지만 짧게 쓰는 재귀 DFS를 흔히 쓴다'
      - '방향 그래프의 순환. 깊이 우선으로 따라가며 "지금 따라가고 있는 길"에 있는 점을 따로 표시한다. 그 점을 다시 만나면 순환이다. 이미 다 본 점을 만나는 것은 순환이 아니다. 실무 구역의 의존 관계로 보인다'
      - '더 알아보기: 의존 관계가 순환 없이 이어져 있으면, 의존받는 쪽이 먼저 오게 줄을 세울 수 있다(위상 정렬). 깊이 우선에서 다 본 점을 뒤집은 순서이거나, 들어오는 선이 없는 점부터 꺼내는 큐로 구한다. 빌드 도구가 모듈을 빌드하는 순서가 이것이다'
    asks:
      - '본문의 예시: 코드 predict의 그래프에서 4번 회원과 6번 회원 사이의 최단 거리(거치는 선의 수)는 얼마인가 (4. 4-2-1-3-6)'
      - '옮긴 상황: 미로를 칸이 점, 이웃한 칸이 선인 그래프로 보고 입구에서 출구까지 가장 적게 움직이는 횟수를 구한다. 어느 탐색을 쓰고 왜 그런가 (너비 우선. 모든 움직임의 비용이 같아서 처음 닿은 겹 수가 최단이다)'
practice:
  says:
    - '흔한 실수: 코드 lateMark처럼 꺼낼 때 방문 표시를 한다. 결과(방문 순서)는 맞아서 테스트를 통과한다. 하지만 아직 꺼내지 않은 점을 다른 이웃들이 또 넣어서, 친구가 많은 그래프에서는 같은 점이 큐에 수십 번 들어가고 메모리와 시간을 쓴다. 고친 코드: 코드 bfs처럼 넣을 때 표시한다. 회원 1천 명이 모두 서로 친구인 그래프에서 두 코드의 `offer` 횟수를 세어 테스트로 남긴다(넣을 때 표시는 999번, 꺼낼 때 표시는 수십만 번)'
    - '의존 관계의 순환. 코드 cycle은 모듈 사이의 의존을 방향 그래프로 담았다. order → member → coupon → order가 순환이다. 질문 4의 방법으로 순환을 찾아 그 길을 출력하는 코드를 테스트로 돌린다'
    - '스프링도 같은 일을 한다. 생성자 주입에서 A가 B를, B가 A를 필요로 하면, 빈을 만드는 중에 "지금 만들고 있는 빈"을 다시 만나 `BeanCurrentlyInCreationException`을 던지고 순환의 길을 알려 준다. 스프링 부트는 2.6부터 순환 참조를 기본으로 막는다. 작은 스프링 컨텍스트로 두 빈을 띄워 예외 메시지를 테스트로 남긴다. 고치는 방법(책임을 나누기)은 스프링 빈과 의존성 주입(S2)에서 다룬다'
claims:
  - claim: '코드 predict의 그래프에서 1부터 너비 우선은 1, 2, 3, 4, 5, 6, 7, 깊이 우선은 1, 2, 4, 5, 7, 3, 6이다'
    how: '코드 bfs와 dfs를 돌려 순서를 본다'
  - claim: '3에서 시작하면 너비 우선은 3, 1, 6, 2, 4, 5, 7, 깊이 우선은 3, 1, 2, 4, 5, 7, 6이다'
    how: '같은 방법으로 본다'
  - claim: '방문 표시가 없는 너비 우선은 끝나지 않는다'
    how: '꺼낸 횟수가 1만을 넘으면 멈추게 하고 넘었는지 본다'
  - claim: '1에서 6까지의 최단 거리는 2, 7까지는 3, 4에서 6까지는 4다'
    how: '코드 distance를 넣은 너비 우선으로 구한다'
  - claim: '한 줄로 이어진 점 10만 개에서 재귀 깊이 우선은 `StackOverflowError`, 스택 버전은 모든 점을 방문한다'
    how: '두 버전을 돌린다'
  - claim: '모두 서로 친구인 회원 1천 명에서 넣을 때 표시하면 `offer`가 1000번, 꺼낼 때 표시하면 훨씬 많다'
    how: '`offer`를 센다. 시작점의 `offer`까지 센다'
  - claim: '코드 cycle에서 order, member, coupon, order의 순환을 찾고, coupon의 의존을 지우면 순환이 없다'
    how: '순환 찾기 코드를 돌린다'
  - claim: '서로를 생성자로 받는 두 빈을 띄우면 `BeanCurrentlyInCreationException`이 원인으로 나온다'
    how: '`AnnotationConfigApplicationContext`로 두 빈을 띄워 예외의 원인 사슬을 본다'
sources:
  - '스프링의 순환 참조와 `BeanCurrentlyInCreationException`: 스프링 문서 https://docs.spring.io/spring-framework/reference/core/beans/dependencies/factory-collaborators.html'
  - '스프링 부트 2.6에서 순환 참조를 기본으로 막은 것: 스프링 부트 2.6 릴리스 노트 https://github.com/spring-projects/spring-boot/wiki/Spring-Boot-2.6-Release-Notes'
