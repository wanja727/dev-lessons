predict:
  title: 친구의 친구를 어떤 순서로?
  text: '코드 predict의 친구 관계에서 1번 회원부터 둘러봐요. 이웃은 목록에 적힌 순서로 봐요. 너비 우선 탐색(가까운 사람부터 넓혀 가는 방식)이 방문하는 순서는 무엇일까요? 답은 질문 2에 나와요.'
  code: predict
  label: 내 예측
  options:
    - value: layer
      label: '1, 2, 3, 4, 5, 6, 7'
    - value: deep
      label: '1, 2, 4, 5, 7, 3, 6'
    - value: right
      label: '1, 3, 6, 2, 5, 7, 4'
  answer: layer
  storageKey: graph-predict
  wrong: 예측은 "{label}"이었어요. 틀린 예측이 더 오래 남으니 괜찮아요.
questions:
  - id: q1
    title: 그래프는 코드로 어떻게 담나요?
    conclusion:
      lead: '점마다 이어진 이웃의 목록을 두는 인접 리스트로 담는 것이 보통이에요. 자바에서는 `Map<점, List<점>>`이에요.'
      sub: '점 n개를 n×n 표로 담는 인접 행렬도 있어요. 두 점이 이어졌는지는 바로 보지만 메모리가 n²이라, 선이 드문 서비스 데이터에는 맞지 않아요.'
    says:
      - '그래프는 점(정점)과 점을 잇는 선(간선)이다. 회원이 점, 친구 관계가 선이다. 친구는 양쪽이 서로 친구라 방향이 없다. 팔로우나 "A 모듈이 B 모듈을 쓴다"는 한쪽 방향이라 방향 그래프다. 선에 거리나 비용이 붙으면 가중치 그래프다'
      - '트리는 순환이 없는 그래프다. K8의 이진 탐색 트리, K5의 카테고리 트리도 그래프다'
      - '인접 리스트. 코드 predict처럼 점마다 이웃의 목록을 둔다. 방향이 없으면 선 하나를 양쪽 목록에 다 적는다. 메모리는 점 수와 선 수에 비례한다'
      - '인접 행렬. `boolean[n][n]`에서 `adj[a][b]`가 참이면 이어진 것이다. 이어졌는지를 O(1)에 보지만 회원 100만 명이면 칸이 1조 개다. 회원마다 친구는 수백 명뿐이라 칸 대부분이 비어 있다'
      - '어느 쪽이든 탐색 방법은 같다. 이 레슨은 인접 리스트로 쓴다'
    asks:
      - '본문의 예시: 코드 predict의 그래프에서 5번 회원의 이웃은 누구이고, 선은 모두 몇 개인가 (2번과 7번, 선 6개)'
      - '옮긴 상황: 점이 10만 개이고 점마다 선이 평균 10개인 그래프를 담는다. 인접 행렬과 인접 리스트가 쓰는 칸 수는 대략 각각 얼마인가 (인접 행렬은 100억 칸, 인접 리스트는 100만 칸 남짓)'
    body:
      - p: '**그래프**는 점과, 점과 점을 잇는 선으로 이루어져요. 점을 정점, 선을 간선이라고도 해요. 회원 일곱 명이 점이고, 친구 관계가 선이에요.'
      - code: picture
      - ul:
          - '**방향이 없는 그래프:** 친구는 서로 친구라 선에 방향이 없어요.'
          - '**방향 그래프:** 팔로우나 "주문 모듈이 회원 모듈을 쓴다"는 한쪽으로만 향해요.'
          - '**가중치 그래프:** 선에 거리나 시간 같은 값이 붙어요. 지하철역 사이의 이동 시간이 그래요.'
      - p: '순환이 없는 그래프가 **트리**예요. 이진 탐색 트리도, 재귀 레슨의 카테고리 트리도 그래프예요.'
      - h3: 점마다 이웃 목록을 둬요
      - p: '코드로는 점마다 이어진 이웃의 목록을 둬요. 이것을 **인접 리스트**라고 해요. 위 그림은 코드 predict의 맵이에요. 방향이 없으니 1-2 선 하나를 1의 목록과 2의 목록에 모두 적어요. 메모리는 점 수와 선 수에 비례해요.'
      - p: '다른 방법은 n×n 표, **인접 행렬**이에요.'
      - code: matrix
      - p: '두 점이 이어졌는지를 `adj[a][b]` 한 번으로 봐서 O(1)이에요. 대신 칸이 n²개예요. 회원이 100만 명이면 1조 칸인데, 회원마다 친구는 수백 명뿐이라 칸 대부분이 비어 있어요. 서비스의 데이터는 대개 이렇게 선이 드물어서 인접 리스트를 써요. 탐색하는 방법은 어느 쪽이든 같아요.'
      - quiz:
          q: '점이 10만 개이고 점마다 선이 평균 10개예요. 인접 행렬은 몇 칸쯤 쓸까요?'
          options:
            - '100만 칸'
            - '1천만 칸'
            - '100억 칸'
          answer: 3
          explain: '인접 행렬은 점 수의 제곱이라 10만 × 10만 = 100억 칸이에요. 인접 리스트는 이웃 목록을 모두 더해 100만 칸 남짓이에요.'
      - next: '그래프를 담았으니 둘러볼 차례예요. 1번 회원부터 가까운 친구 순서로 보려면 어떻게 할까요?'
    recall: '점마다 이어진 이웃의 목록을 두는 인접 리스트로 담아요. 자바에서는 `Map<점, List<점>>`이고, 방향이 없으면 선 하나를 양쪽 목록에 적어요. 메모리가 점 수와 선 수에 비례해요. n×n 표인 인접 행렬은 이어졌는지를 O(1)에 보지만 메모리가 n²이라 선이 드문 서비스 데이터에는 맞지 않아요.'
  - id: q2
    title: 너비 우선 탐색은 어떤 순서로 둘러보나요?
    conclusion:
      lead: '시작점에서 가까운 점부터 한 겹씩 넓혀 가요. 시작점의 이웃을 모두 본 다음에 이웃의 이웃을 봐요.'
      sub: '먼저 찾은 점을 먼저 꺼내는 큐가 이 순서를 만들어요. 같은 점을 두 번 넣지 않도록 큐에 넣는 순간 방문 표시를 해요.'
    says:
      - '코드 bfs를 따라간다. 1을 큐에 넣는다. 1을 꺼내고 이웃 2, 3을 넣는다. 2를 꺼내고 아직 안 본 4, 5를 넣는다. 3을 꺼내고 6을 넣는다. 4, 5를 꺼내며 7을 넣는다. 예측의 답을 밝힌다. 방문 순서는 1, 2, 3, 4, 5, 6, 7이다'
      - '큐라서 이 순서가 된다. 한 겹의 점은 다음 겹의 점보다 먼저 큐에 들어갔으니 먼저 나온다(K3)'
      - '방문 표시(`seen`)는 순환 때문에 필요하다. 2의 이웃에 1이 있다. 표시가 없으면 1을 다시 넣고, 1이 2를 다시 넣고, 끝나지 않는다'
      - '표시하는 시점은 큐에 넣을 때다. `seen.add(w)`가 처음 넣을 때만 참을 돌려줘서 한 점은 큐에 한 번만 들어간다. 꺼낼 때 표시하면 아직 꺼내지 않은 점을 다른 이웃이 또 넣는다. 실무 구역에서 다룬다'
    widget:
      kind: steps
      note: '코드 predict의 그래프를 그림으로 둔다. 두 시나리오. 너비 우선: 단계마다 큐의 내용과 방문 순서를 보이고, 지금 꺼낸 점과 새로 넣은 점을 강조하며 같은 겹의 점을 같은 색 테두리로 묶는다. 깊이 우선: 단계마다 호출 스택(지금 따라가는 길)과 방문 순서를 보인다. 같은 그래프에서 두 순서가 1, 2, 3, 4, 5, 6, 7과 1, 2, 4, 5, 7, 3, 6으로 갈리는 것을 본다'
    asks:
      - '본문의 예시: 코드 bfs로 3번 회원에서 시작하면 방문 순서는 무엇인가 (3, 1, 6, 2, 4, 5, 7)'
      - '옮긴 상황: 코드 bfs에서 `seen`을 모두 지우고 `q.offer(w)`만 남겼다. 코드 predict의 그래프에서 1부터 돌리면 어떻게 되나 (끝나지 않는다. 서로 친구인 두 점이 서로를 계속 큐에 넣는다)'
      - '실무 구역: 코드 lateMark처럼 꺼낼 때 방문 표시를 하면 방문 순서는 같지만 무엇이 달라지나 (같은 점이 큐에 여러 번 들어간다. 큐에 넣는 횟수가 늘어난다)'
    body:
      - p: '**너비 우선 탐색**(BFS)은 큐로 둘러봐요. 꺼낸 점의 이웃 가운데 아직 못 본 점을 큐 뒤에 넣는 일을 큐가 빌 때까지 되풀이해요.'
      - code: bfs
        notes:
          - mark: seen.add(w)
            as: code
            text: '처음 보는 점이면 `true`를 돌려주며 표시하고, 이미 봤으면 `false`예요. 큐에 **넣는 순간** 표시해서 한 점은 큐에 한 번만 들어가요.'
      - p: '아래에서 "너비 우선"을 골라 한 단계씩 넘겨 보세요. 둘째 시나리오 "깊이 우선"은 질문 3에서 봐요.'
      - widget:
          kind: steps
          layout: [selector, duo, log, buttons, verdict]
          selector:
            label: 둘러보는 방식
            options:
              - {value: bfs, label: 너비 우선 (큐)}
              - {value: dfs, label: 깊이 우선 (재귀)}
          initial:
            duo:
              - {label: 큐 또는 지금 따라가는 길, state: dim, text: 비어 있음}
              - {label: 방문 순서, state: dim, text: 아직 없음}
          scenarios:
            bfs:
              - log: '1을 큐에 넣고 표시'
                duo:
                  - label: 큐
                    rows: [{k: 앞 → 뒤, v: '1', mark: changed}]
                  - label: 방문 순서
                    rows: [{k: 순서, v: '(아직 없음)'}]
              - log: '1을 꺼냄. 이웃 2, 3을 넣음 (1겹)'
                duo:
                  - label: 큐
                    rows: [{k: 앞 → 뒤, v: '2, 3', mark: changed}]
                  - label: 방문 순서
                    rows: [{k: 순서, v: '1'}]
              - log: '2를 꺼냄. 1은 이미 봤고 4, 5를 넣음 (2겹)'
                duo:
                  - label: 큐
                    rows: [{k: 앞 → 뒤, v: '3, 4, 5', mark: changed}]
                  - label: 방문 순서
                    rows: [{k: 순서, v: '1, 2'}]
              - log: '3을 꺼냄. 6을 넣음 (2겹)'
                duo:
                  - label: 큐
                    rows: [{k: 앞 → 뒤, v: '4, 5, 6', mark: changed}]
                  - label: 방문 순서
                    rows: [{k: 순서, v: '1, 2, 3'}]
              - log: '4를 꺼냄. 새 이웃 없음'
                duo:
                  - label: 큐
                    rows: [{k: 앞 → 뒤, v: '5, 6'}]
                  - label: 방문 순서
                    rows: [{k: 순서, v: '1, 2, 3, 4'}]
              - log: '5를 꺼냄. 7을 넣음 (3겹)'
                duo:
                  - label: 큐
                    rows: [{k: 앞 → 뒤, v: '6, 7', mark: changed}]
                  - label: 방문 순서
                    rows: [{k: 순서, v: '1, 2, 3, 4, 5'}]
              - log: '6, 7을 차례로 꺼냄. 큐가 빔'
                duo:
                  - label: 큐
                    rows: [{k: 앞 → 뒤, v: '비었음'}]
                  - label: 방문 순서
                    rows: [{k: 순서, v: '1, 2, 3, 4, 5, 6, 7', mark: changed}]
                verdict: '1겹(2, 3), 2겹(4, 5, 6), 3겹(7) 순서예요. 한 겹이 다음 겹보다 먼저 큐에 들어가서 먼저 나왔어요.'
            dfs:
              - log: 'dfs(1): 1을 방문'
                duo:
                  - label: 지금 따라가는 길 (호출 스택)
                    rows: [{k: 아래 → 위, v: '1', mark: changed}]
                  - label: 방문 순서
                    rows: [{k: 순서, v: '1'}]
              - log: '1의 첫 이웃 2로 들어감'
                duo:
                  - label: 지금 따라가는 길 (호출 스택)
                    rows: [{k: 아래 → 위, v: '1, 2', mark: changed}]
                  - label: 방문 순서
                    rows: [{k: 순서, v: '1, 2'}]
              - log: '2에서 1은 봤으니 4로 들어감'
                duo:
                  - label: 지금 따라가는 길 (호출 스택)
                    rows: [{k: 아래 → 위, v: '1, 2, 4', mark: changed}]
                  - label: 방문 순서
                    rows: [{k: 순서, v: '1, 2, 4'}]
              - log: '4는 갈 곳이 없어 2로 돌아옴. 2의 다음 이웃 5로 들어감'
                duo:
                  - label: 지금 따라가는 길 (호출 스택)
                    rows: [{k: 아래 → 위, v: '1, 2, 5', mark: changed}]
                  - label: 방문 순서
                    rows: [{k: 순서, v: '1, 2, 4, 5'}]
              - log: '5에서 7로 들어감'
                duo:
                  - label: 지금 따라가는 길 (호출 스택)
                    rows: [{k: 아래 → 위, v: '1, 2, 5, 7', mark: changed}]
                  - label: 방문 순서
                    rows: [{k: 순서, v: '1, 2, 4, 5, 7'}]
              - log: '7, 5, 2에서 차례로 돌아 나와 1로. 1의 다음 이웃 3으로 들어감'
                duo:
                  - label: 지금 따라가는 길 (호출 스택)
                    rows: [{k: 아래 → 위, v: '1, 3', mark: changed}]
                  - label: 방문 순서
                    rows: [{k: 순서, v: '1, 2, 4, 5, 7, 3'}]
              - log: '3에서 6으로 들어감. 돌아 나오며 끝'
                duo:
                  - label: 지금 따라가는 길 (호출 스택)
                    rows: [{k: 아래 → 위, v: '1, 3, 6', mark: changed}]
                  - label: 방문 순서
                    rows: [{k: 순서, v: '1, 2, 4, 5, 7, 3, 6', mark: changed}]
                verdict: '2 쪽 가지를 끝(7)까지 다 본 다음에야 3으로 갔어요. 같은 그래프인데 너비 우선과 순서가 달라요.'
      - p: '처음 예측의 답은 **1, 2, 3, 4, 5, 6, 7**이에요. {{predict-result}}'
      - ci:
          key: predict
          label: 실제 방문 순서 보기
          source: GraphSearchTest.orders
          code: predict
      - p: '1의 친구(2, 3)를 모두 본 다음, 친구의 친구(4, 5, 6), 그다음(7) 순서예요. **큐**라서 이 순서가 돼요. 한 겹의 점은 다음 겹의 점보다 먼저 큐에 들어갔으니 먼저 나와요(스택과 큐 레슨).'
      - h3: 방문 표시가 없으면 끝나지 않아요
      - p: '2의 이웃에는 1이 있어요. 표시가 없으면 2가 1을 다시 넣고, 1이 2를 다시 넣고 ... 끝나지 않아요. `seen`을 빼고 돌려 봤어요.'
      - ci:
          key: noSeen
          label: 실제 결과 보기
          source: GraphSearchTest.noSeenNeverEnds
      - p: '표시하는 **시점**도 중요해요. 큐에 넣을 때 표시해야 한 점이 큐에 한 번만 들어가요. 꺼낼 때 표시하면 무슨 일이 생기는지는 실무 구역에서 봐요.'
      - quiz:
          q: '코드 bfs로 3번 회원에서 시작하면 방문 순서는?'
          options:
            - '3, 1, 6, 2, 4, 5, 7'
            - '3, 1, 2, 4, 5, 7, 6'
            - '3, 6, 1, 2, 4, 5, 7'
          answer: 1
          explain: '3의 이웃 1, 6을 먼저 보고(1겹), 1의 이웃 2(2겹), 2의 이웃 4, 5(3겹), 5의 이웃 7(4겹) 순서예요. 테스트로 확인했어요.'
      - next: '위젯의 둘째 시나리오는 순서가 달랐어요. 한 길을 끝까지 따라가는 깊이 우선은 어떻게 동작할까요?'
    recall: '시작점에서 가까운 점부터 한 겹씩 넓혀 가요. 큐에서 점을 꺼내 아직 못 본 이웃을 뒤에 넣는 일을 되풀이하니, 한 겹이 다음 겹보다 먼저 나와요. 순환이 있으니 방문 표시가 있어야 끝나고, 한 점이 큐에 한 번만 들어가도록 넣는 순간 표시해요. 1번부터는 1, 2, 3, 4, 5, 6, 7이었어요.'
  - id: q3
    title: 깊이 우선 탐색은 어떤 순서로 둘러보나요?
    conclusion:
      lead: '한 이웃을 따라 더 갈 곳이 없을 때까지 끝까지 들어간 뒤, 돌아 나와 아직 안 본 다른 이웃으로 가요.'
      sub: '마지막에 들어간 곳에서 먼저 돌아 나오는 스택이 이 순서를 만들어요. 재귀로 쓰면 호출 스택이 그 스택이에요. 두 탐색 모두 점과 선을 한 번씩 봐서 O(점 수 + 선 수)예요.'
    says:
      - '코드 dfs를 따라간다. 1을 방문하고 첫 이웃 2로 들어간다. 2에서 1은 봤으니 4로 들어간다. 4는 더 갈 곳이 없어 2로 돌아온다. 2의 다음 이웃 5, 5에서 7. 7에서 돌아 나와 1까지 돌아온 뒤 3, 3에서 6. 순서는 1, 2, 4, 5, 7, 3, 6이다'
      - '재귀 호출이 돌아올 자리를 기억한다. 4에서 돌아올 때 2의 반복문이 다음 이웃부터 이어 간다. 이것이 K5에서 본 프레임마다의 지역 변수다'
      - '재귀 대신 `ArrayDeque`를 스택으로 써도 된다(K5의 질문 3). 그래프가 한 줄로 10만 개 이어져 있으면 재귀 버전은 `StackOverflowError`가 날 수 있어서 이때는 스택 버전을 쓴다. 스택 버전은 이웃을 넣는 순서 때문에 방문 순서가 재귀와 조금 다를 수 있다'
      - '비용. 두 탐색 모두 점마다 한 번 꺼내고, 점마다 이웃 목록을 한 번 훑는다. 이웃 목록의 길이를 모두 더하면 선 수(방향이 없으면 그 두 배)다. 그래서 O(V + E)다. V는 점 수, E는 선 수다'
    asks:
      - '본문의 예시: 코드 dfs로 3번 회원에서 시작하면 방문 순서는 무엇인가 (3, 1, 2, 4, 5, 7, 6)'
      - '옮긴 상황: 점 100만 개가 1-2-3-...-1000000처럼 한 줄로 이어진 그래프를 재귀 DFS로 끝까지 둘러본다. 어떤 일이 생길 수 있고 어떻게 피하나 (`StackOverflowError`. 직접 만든 스택으로 쓴다)'
    body:
      - p: '**깊이 우선 탐색**(DFS)은 한 이웃을 따라 갈 수 있는 데까지 들어가요. 막히면 한 칸 돌아 나와 아직 안 본 다음 이웃으로 가요. 재귀로 쓰면 짧아요.'
      - code: dfs
        notes:
          - mark: dfs(w, seen, order)
            as: code
            text: '이웃으로 들어가요. 이 호출이 끝나야 반복문의 다음 이웃으로 넘어가요. 그래서 한 가지를 끝까지 본 다음에 옆 가지로 가요.'
      - p: '질문 2의 위젯에서 "깊이 우선"을 골라 보세요. 1, 2, 4로 들어가고, 4에서 막혀 2로 돌아와 5, 7로 가요. 2 쪽을 다 본 뒤에야 1로 돌아와 3, 6을 봐요. 순서는 **1, 2, 4, 5, 7, 3, 6**이에요.'
      - p: '돌아올 자리는 재귀가 기억해요. 4에서 돌아오면 2의 프레임에 남아 있던 반복문이 다음 이웃 5부터 이어 가요. 재귀 레슨에서 본 프레임마다의 지역 변수예요. 마지막에 들어간 곳에서 먼저 나오니, 호출 스택이 곧 **스택**이에요.'
      - h3: 깊은 그래프는 스택으로
      - p: '재귀는 깊이만큼 호출 스택을 쌓아요. 점 10만 개가 한 줄로 이어진 그래프에서 돌려 봤어요.'
      - ci:
          key: deep
          label: 실제 결과 보기
          source: GraphSearchTest.deepLine
          code: deepRun
      - p: '재귀 버전은 `StackOverflowError`로 멈췄어요. 이럴 때는 `ArrayDeque`를 스택으로 직접 써요(재귀 레슨).'
      - code: dfsStack
      - p: '스택 버전은 이웃을 스택에 넣는 순서 때문에, 같은 그래프에서도 재귀 버전과 방문 순서가 조금 다를 수 있어요. 한 가지를 끝까지 본다는 성질은 같아요.'
      - h3: 두 탐색 모두 O(V + E)
      - p: '두 탐색 모두 점마다 한 번 방문하고, 그때 그 점의 이웃 목록을 한 번 훑어요. 이웃 목록의 길이를 모두 더하면 선 수예요(방향이 없으면 두 배). 그래서 비용은 **O(V + E)**예요. V는 점 수, E는 선 수예요.'
      - quiz:
          q: '코드 dfs로 3번 회원에서 시작하면 방문 순서는?'
          options:
            - '3, 1, 6, 2, 4, 5, 7'
            - '3, 1, 2, 4, 5, 7, 6'
            - '3, 6, 1, 2, 4, 5, 7'
          answer: 2
          explain: '3의 첫 이웃 1로 들어가고, 1에서 2, 2에서 4, 돌아와 5, 7까지 다 본 뒤에야 3으로 돌아와 6을 봐요.'
      - next: '같은 그래프를 두 순서로 둘러볼 수 있어요. 그러면 언제 어느 쪽을 쓸까요?'
    recall: '한 이웃을 따라 더 갈 곳이 없을 때까지 들어간 뒤, 돌아 나와 아직 안 본 다른 이웃으로 가요. 마지막에 들어간 곳에서 먼저 나오는 스택이 순서를 만들고, 재귀로 쓰면 호출 스택이 그 스택이에요. 깊이가 깊으면 재귀는 `StackOverflowError`가 나니 `ArrayDeque`로 써요. 두 탐색 모두 O(V + E)예요.'
  - id: q4
    title: 너비 우선과 깊이 우선은 각각 어떤 문제에 쓰나요?
    conclusion:
      lead: '선에 가중치가 없을 때의 최단 거리는 너비 우선으로 구해요. 끝까지 가 봐야 알 수 있는 것, 순환이 있는지나 연결된 덩어리가 몇 개인지는 깊이 우선이 잘 맞아요.'
      sub: '너비 우선은 가까운 겹부터 보니, 어떤 점에 처음 닿는 순간의 겹 수가 그 점까지의 가장 짧은 거리예요.'
    says:
      - '최단 거리. 코드 distance처럼 큐에 넣을 때 "꺼낸 점의 거리 + 1"을 적는다. 1번에서 6번은 2, 7번은 3이다. 처음 닿는 순간이 가장 가까운 순간이다. 겹 순서로 보기 때문이다. 깊이 우선은 먼 길로 먼저 닿을 수 있어서 처음 닿은 길이 최단이 아니다'
      - '"1번과 7번은 몇 단계 건너 아는 사이인가", "환승이 가장 적은 길"이 이 문제다. 선마다 거리가 다르면(분 단위 이동 시간) 너비 우선으로는 안 되고 다익스트라를 쓴다(K14)'
      - '연결된 덩어리 세기. 아직 안 본 점에서 탐색을 시작할 때마다 덩어리가 하나다. 어느 탐색이든 되지만 짧게 쓰는 재귀 DFS를 흔히 쓴다'
      - '방향 그래프의 순환. 깊이 우선으로 따라가며 "지금 따라가고 있는 길"에 있는 점을 따로 표시한다. 그 점을 다시 만나면 순환이다. 이미 다 본 점을 만나는 것은 순환이 아니다. 실무 구역의 의존 관계로 보인다'
      - '더 알아보기: 의존 관계가 순환 없이 이어져 있으면, 의존받는 쪽이 먼저 오게 줄을 세울 수 있다(위상 정렬). 깊이 우선에서 다 본 점을 뒤집은 순서이거나, 들어오는 선이 없는 점부터 꺼내는 큐로 구한다. 빌드 도구가 모듈을 빌드하는 순서가 이것이다'
    asks:
      - '본문의 예시: 코드 predict의 그래프에서 4번 회원과 6번 회원 사이의 최단 거리(거치는 선의 수)는 얼마인가 (4. 4-2-1-3-6)'
      - '옮긴 상황: 미로를 칸이 점, 이웃한 칸이 선인 그래프로 보고 입구에서 출구까지 가장 적게 움직이는 횟수를 구한다. 어느 탐색을 쓰고 왜 그런가 (너비 우선. 모든 움직임의 비용이 같아서 처음 닿은 겹 수가 최단이다)'
    body:
      - h3: 최단 거리는 너비 우선
      - p: '"1번과 7번은 몇 단계 건너 아는 사이인가"를 구해요. 너비 우선에서 점을 큐에 넣을 때, 꺼낸 점의 거리에 1을 더해 적어 두면 돼요.'
      - code: distance
        notes:
          - mark: dist.put(w, dist.get(v) + 1)
            as: code
            text: '처음 닿는 순간에만 적어요. 너비 우선은 가까운 겹부터 보니, 처음 닿은 순간이 가장 가까운 순간이에요.'
      - ci:
          key: distance
          label: 실제로 구한 거리 보기
          source: GraphSearchTest.shortestDistance
      - p: '6번은 2단계, 7번은 3단계예요. 깊이 우선은 먼 길로 먼저 닿을 수 있어서 처음 닿은 길이 최단이라는 보장이 없어요. 미로에서 가장 적게 움직이는 길, 환승이 가장 적은 길도 같은 문제예요. 다만 선마다 비용이 다르면(역 사이의 이동 시간) 겹 수가 거리가 아니어서 너비 우선으로는 안 되고 다익스트라를 써요(최단 경로 레슨).'
      - h3: 끝까지 가 봐야 아는 것은 깊이 우선
      - ul:
          - '**연결된 덩어리 세기:** 아직 안 본 점에서 탐색을 시작할 때마다 덩어리가 하나예요. 어느 탐색이든 되지만 짧게 쓰는 재귀 DFS를 흔히 써요.'
          - '**모든 경로 찾기:** 한 길을 끝까지 가 보고 돌아와 다른 길을 가는 것이 깊이 우선의 모양 그대로예요.'
          - '**방향 그래프의 순환 찾기:** 깊이 우선으로 따라가며 **지금 따라가고 있는 길**에 있는 점을 따로 표시해요. 그 길의 점을 다시 만나면 순환이에요. 이미 다 보고 나온 점을 만나는 것은 순환이 아니에요. 실무 구역에서 코드로 봐요.'
      - more:
          summary: '더 알아보기: 의존하는 순서대로 줄 세우기'
          body:
            - p: '의존 관계에 순환이 없으면, 의존받는 쪽이 먼저 오게 줄을 세울 수 있어요. 이것을 **위상 정렬**이라고 해요. 빌드 도구가 모듈을 빌드하는 순서가 이거예요.'
            - ul:
                - '깊이 우선으로 돌며 다 보고 나온 점을 차례로 모으면, 의존받는 쪽이 먼저 모여요.'
                - '또는 들어오는 선이 없는 점(아무도 의존하지 않는 점)부터 큐에 넣고 꺼내며 그 점의 선을 지워 가요.'
      - quiz:
          q: '미로를 칸이 점, 이웃한 칸이 선인 그래프로 봐요. 입구에서 출구까지 가장 적게 움직이는 횟수는 어느 탐색으로 구할까요?'
          options:
            - '너비 우선'
            - '깊이 우선'
            - '어느 쪽이든 처음 닿은 길이 최단이다'
          answer: 1
          explain: '움직임마다 비용이 같아서, 가까운 겹부터 보는 너비 우선이 출구에 처음 닿는 순간의 겹 수가 최단이에요. 깊이 우선은 먼 길로 먼저 닿을 수 있어요.'
    recall: '선에 가중치가 없을 때의 최단 거리는 너비 우선으로 구해요. 가까운 겹부터 보니 처음 닿는 순간의 겹 수가 최단 거리예요. 선마다 비용이 다르면 다익스트라를 써요. 순환 찾기, 모든 경로, 연결된 덩어리처럼 끝까지 가 봐야 아는 일은 깊이 우선이 맞아요. 방향 그래프의 순환은 지금 따라가는 길에 있는 점을 다시 만나는 것이에요.'
practice:
  title: 실무에서는 이렇게 만나요
  says:
    - '흔한 실수: 코드 lateMark처럼 꺼낼 때 방문 표시를 한다. 결과(방문 순서)는 맞아서 테스트를 통과한다. 하지만 아직 꺼내지 않은 점을 다른 이웃들이 또 넣어서, 친구가 많은 그래프에서는 같은 점이 큐에 수십 번 들어가고 메모리와 시간을 쓴다. 고친 코드: 코드 bfs처럼 넣을 때 표시한다. 회원 1천 명이 모두 서로 친구인 그래프에서 두 코드의 `offer` 횟수를 세어 테스트로 남긴다(넣을 때 표시는 1000번, 꺼낼 때 표시는 49만 9501번)'
    - '의존 관계의 순환. 코드 cycle은 모듈 사이의 의존을 방향 그래프로 담았다. order → member → coupon → order가 순환이다. 질문 4의 방법으로 순환을 찾아 그 길을 출력하는 코드를 테스트로 돌린다'
    - '스프링도 같은 일을 한다. 생성자 주입에서 A가 B를, B가 A를 필요로 하면, 빈을 만드는 중에 "지금 만들고 있는 빈"을 다시 만나 `BeanCurrentlyInCreationException`을 던지고 순환의 길을 알려 준다. 스프링 부트는 2.6부터 순환 참조를 기본으로 막는다. 작은 스프링 컨텍스트로 두 빈을 띄워 예외 메시지를 테스트로 남긴다. 고치는 방법(책임을 나누기)은 스프링 빈과 의존성 주입(S2)에서 다룬다'
  body:
    - h3: '흔한 실수: 꺼낼 때 방문 표시'
    - p: '방문 표시를 꺼낼 때 하도록 바꾼 코드예요. 이미 본 점이면 건너뛰어요.'
    - code: lateMark
      notes:
        - mark: if (!seen.add(v)) continue;
          as: code
          text: '꺼낸 뒤에 표시해요. 아직 큐에서 기다리는 점은 표시가 없어서, 그 점과 이어진 다른 이웃들이 또 넣어요.'
    - p: '방문 순서는 코드 bfs와 똑같아서 작은 그래프의 테스트는 통과해요. 친구가 많은 그래프에서 `offer`를 세어 봤어요.'
    - ci:
        key: lateMark
        label: 두 코드의 실제 offer 횟수 보기
        source: GraphSearchTest.markTiming
        code: lateRun
    - p: '순서는 같지만 큐에 넣은 횟수가 500배 가까이 많고, 큐가 가장 길 때 50만 개 가까이 쌓였어요. 회원 1천 명에서 이 정도면 실제 소셜 그래프에서는 메모리가 먼저 바닥나요. 질문 2의 코드 bfs처럼 **넣는 순간** 표시해요.'
    - h3: 모듈 의존의 순환 찾기
    - p: '모듈 사이의 의존을 방향 그래프로 담았어요. 화살표는 "이 모듈이 저 모듈을 쓴다"예요.'
    - code: cycle
    - p: '질문 4의 방법대로 지금 따라가는 길(`path`)과 다 보고 나온 점(`done`)을 따로 둬요.'
    - code: cycleFind
      notes:
        - mark: path.contains(v)
          as: code
          text: '지금 따라가는 길에 있는 점을 다시 만나면 순환이에요. `path`에서 그 점부터 끝까지가 순환의 길이에요.'
        - mark: done.add(v)
          as: code
          text: '다 보고 나온 점은 `done`으로 옮겨요. payment → member처럼 다 본 점을 다시 만나는 것은 순환이 아니라 건너뛰어요.'
    - ci:
        key: cycle
        label: 실제로 찾은 순환 보기
        source: GraphSearchTest.dependencyCycle
    - h3: 스프링의 순환 참조도 같은 일이에요
    - p: '생성자 주입에서 두 빈이 서로를 필요로 해요.'
    - code: beans
    - p: '스프링은 `OrderService`를 만들려고 `MemberService`를 만들고, `MemberService`를 만들려고 `OrderService`를 찾아요. 그런데 `OrderService`는 **지금 만들고 있는 빈**이에요. 위의 `path`를 다시 만난 것과 같아요. 작은 스프링 컨텍스트에 두 빈을 올려 봤어요.'
    - ci:
        key: spring
        label: 실제 예외 보기
        source: GraphSearchTest.springCircular
    - p: '[스프링 문서](link:springDeps)도 생성자 주입의 순환을 이 예외로 알린다고 적어요. 필드나 세터 주입이면 스프링이 순환을 풀어 주기도 했지만, 스프링 부트는 2.6부터 그것도 기본으로 막아요([릴리스 노트](link:boot26)). 의존이 순환한다는 것은 책임이 섞였다는 신호라서, 고치는 방법은 책임을 나누는 쪽이에요. [스프링 빈과 의존성 주입](lesson:spring-beans) 레슨에서 다뤄요.'
interview:
  question: BFS와 DFS는 어떻게 다르고, 각각 언제 쓰나요?
  model:
    - label: 정의
      text: 둘 다 그래프의 점을 한 번씩 둘러보는 방법입니다. BFS는 시작점에서 가까운 점부터 한 겹씩 넓혀 가고, DFS는 한 길을 끝까지 따라간 뒤 돌아와 다른 길로 갑니다.
    - label: 원리
      text: BFS는 큐를 써서 먼저 찾은 점을 먼저 꺼내므로 겹 순서가 되고, DFS는 재귀나 스택을 써서 마지막에 들어간 곳에서 먼저 돌아 나옵니다. 둘 다 점과 선을 한 번씩 봐서 O(V + E)입니다.
    - label: 주의할 점
      text: 가중치가 없는 최단 거리는 처음 닿은 겹 수가 최단인 BFS로 구합니다. 순환 찾기나 연결된 덩어리처럼 끝까지 가 봐야 아는 일은 DFS가 맞고, 재귀 DFS는 깊은 그래프에서 StackOverflowError가 나니 스택으로 씁니다. BFS의 방문 표시는 큐에 넣을 때 해야 같은 점이 여러 번 들어가지 않습니다.
    - label: 경험
      text: '(내 프로젝트로 채우기) 예: 생성자 주입에서 BeanCurrentlyInCreationException을 만나 두 서비스의 순환 의존을 찾아 책임을 나눴습니다.'
verified: 이 레슨의 방문 순서, 거리, offer 횟수, 스프링의 예외는 짐작이 아니라 자바 21과 스프링 6.2에서 코드를 돌려 받은 값이에요. 코드가 바뀔 때마다 테스트([GraphSearchTest](link:test))가 다시 돌아요.
footer: '근거: 스프링의 순환 참조와 `BeanCurrentlyInCreationException`은 [스프링 문서](link:springDeps), 스프링 부트 2.6에서 순환 참조를 기본으로 막은 것은 [릴리스 노트](link:boot26). 방문 순서와 거리는 OpenJDK 21에서 테스트로 확인했어요. 오류는 [GitHub 이슈](https://github.com/wanja727/dev-lessons/issues)로 알려 주세요.'
claims:
  - claim: '코드 predict의 그래프에서 1부터 너비 우선은 1, 2, 3, 4, 5, 6, 7, 깊이 우선은 1, 2, 4, 5, 7, 3, 6이다'
    how: '코드 bfs와 dfs를 돌려 순서를 본다'
    test: GraphSearchTest.orders
  - claim: '3에서 시작하면 너비 우선은 3, 1, 6, 2, 4, 5, 7, 깊이 우선은 3, 1, 2, 4, 5, 7, 6이다'
    how: '같은 방법으로 본다'
    test: GraphSearchTest.orders
  - claim: '방문 표시가 없는 너비 우선은 끝나지 않는다'
    how: '꺼낸 횟수가 1만을 넘으면 멈추게 하고 넘었는지 본다'
    test: GraphSearchTest.noSeenNeverEnds
  - claim: '1에서 6까지의 최단 거리는 2, 7까지는 3, 4에서 6까지는 4다'
    how: '코드 distance를 넣은 너비 우선으로 구한다'
    test: GraphSearchTest.shortestDistance
  - claim: '한 줄로 이어진 점 10만 개에서 재귀 깊이 우선은 `StackOverflowError`, 스택 버전은 모든 점을 방문한다'
    how: '두 버전을 돌린다'
    test: GraphSearchTest.deepLine
  - claim: '모두 서로 친구인 회원 1천 명에서 넣을 때 표시하면 `offer`가 1000번, 꺼낼 때 표시하면 훨씬 많다'
    how: '`offer`를 센다. 49만 9501번이었다. 방문 순서는 같다'
    test: GraphSearchTest.markTiming
  - claim: '코드 cycle에서 order, member, coupon, order의 순환을 찾고, coupon의 의존을 지우면 순환이 없다'
    how: '순환 찾기 코드를 돌린다. 찾은 길은 coupon → order → member → coupon(이름 순서로 시작점을 골랐다)'
    test: GraphSearchTest.dependencyCycle
  - claim: '서로를 생성자로 받는 두 빈을 띄우면 `BeanCurrentlyInCreationException`이 원인으로 나온다'
    how: '`AnnotationConfigApplicationContext`로 두 빈을 띄워 예외의 원인 사슬을 본다'
    test: GraphSearchTest.springCircular
sources:
  - '스프링의 순환 참조와 `BeanCurrentlyInCreationException`: 스프링 문서 https://docs.spring.io/spring-framework/reference/core/beans/dependencies/factory-collaborators.html'
  - '스프링 부트 2.6에서 순환 참조를 기본으로 막은 것: 스프링 부트 2.6 릴리스 노트 https://github.com/spring-projects/spring-boot/wiki/Spring-Boot-2.6-Release-Notes'
