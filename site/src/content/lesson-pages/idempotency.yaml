# 멱등성과 중복 요청 방지
# 자료 파일의 칸은 docs/lesson-data-format.md에 있다. 문제는 content/questions/idempotency.yaml에 있다.
title: 멱등성과 중복 요청 방지
description: 같은 요청이 두 번 오는 이유, 먼저 조회하고 저장하는 코드가 동시 요청을 막지 못하는 이유, 멱등 키와 유니크 제약으로 재시도에 처음 결과를 돌려주는 법, 멱등 키만으로 부족한 곳. 실제 PostgreSQL에 같은 결제를 동시에 보내 확인하는 대화형 레슨.
unit: 시스템 설계와 아키텍처
minutes: 20
roadmap: A6
type: 동작 확인
prerequisites:
  - {slug: transactional-proxy, title: '@Transactional 동작 원리'}
  - {slug: rest-api, title: REST API 설계}
assume: '스프링 부트 3.5, 스프링 데이터 JPA, PostgreSQL 16. HTTP 메서드의 안전과 멱등의 정의(REST API 설계 레슨). `@Transactional` 메서드가 끝날 때 커밋된다는 것(@Transactional 동작 원리 레슨). 유니크 제약은 키와 제약 조건 레슨에서 다뤄요.'
example: '주문 결제 API `POST /payments`. 클라이언트가 결제 요청을 보냈는데 응답을 받기 전에 연결이 끊겨 같은 요청을 다시 보낸다. 결제가 두 번 저장되는지 본다.'
intro:
  - '고객이 결제 버튼을 눌렀는데 화면이 멈춰서 한 번 더 눌렀어요. 카드 내역에 같은 금액이 두 번 찍혔어요. 서버 로그를 보면 첫 요청도 성공했어요. 응답만 고객에게 닿지 못했을 뿐이에요.'
  - '네트워크는 응답을 잃을 수 있고, 클라이언트와 게이트웨이와 메시지 큐는 실패하면 다시 보내요. 그래서 스프링 개발자는 "같은 요청이 두 번 오면 어떻게 되나"를 API마다 정해야 해요. 결제, 주문, 포인트 적립처럼 두 번 되면 안 되는 일에서 면접관이 꼭 묻는 질문이에요.'
  - '이 레슨에서는 실제 PostgreSQL에서 같은 결제 요청을 두 번, 그리고 동시에 열 번 보내요. "먼저 조회하고 없으면 저장"이 왜 뚫리는지 보고, 멱등 키와 유니크 제약으로 한 건만 남는 것을 확인해요.'
covers:
  - topic: '같은 요청이 두 번 오는 이유: 응답을 잃은 클라이언트의 재시도, 사용자의 두 번 클릭, 게이트웨이와 메시지 큐의 재전송'
    where: '질문 1'
  - topic: '클라이언트는 응답을 받지 못하면 서버가 처리했는지 알 수 없다. 그래서 다시 보내는 것이 맞는 행동이다'
    where: '질문 1'
  - topic: '멱등성: 같은 요청을 여러 번 해도 한 번 한 것과 결과가 같다. GET, PUT, DELETE는 멱등이고 POST는 아니다'
    where: '질문 1. 메서드의 정의는 REST API 설계(N5)'
  - topic: '먼저 조회하고 없으면 저장하는 코드는 순차 재시도는 막지만, 동시에 온 두 요청은 둘 다 조회를 통과한다'
    where: '질문 2'
  - topic: '마지막 판단은 DB의 유니크 제약에 맡긴다. 두 번째 INSERT는 DB가 거절한다'
    where: '질문 2'
  - topic: '멱등 키: 클라이언트가 요청마다 고유한 값을 만들어 헤더(Idempotency-Key)로 보내고, 재시도에는 같은 값을 쓴다'
    where: '질문 3'
  - topic: '같은 키로 다시 오면 새로 처리하지 않고 처음 결과를 돌려준다. 클라이언트는 성공 응답을 받는다'
    where: '질문 3'
  - topic: '같은 키인데 내용이 다르면(금액이 다르면) 거절한다'
    where: '질문 3'
  - topic: '처리 중에 같은 키가 또 오면: 처리 중이라고 답하거나 끝날 때까지 기다린다'
    where: '질문 3의 더 알아보기'
  - topic: '멱등 키를 언제까지 기억하나: 보관 기간을 정한다'
    where: '질문 4'
  - topic: '업무 키로 막기: 주문 하나에 결제는 하나라면 주문 id에 유니크 제약을 건다. 멱등 키가 없어도 막힌다'
    where: '질문 4'
  - topic: '외부 결제 API를 부른 뒤 저장에 실패하면 우리 DB만 보고는 중복을 알 수 없다. 외부에도 멱등 키를 넘긴다'
    where: '질문 4'
  - topic: '스프링에서 유니크 위반은 DataIntegrityViolationException으로 온다. 같은 트랜잭션 안에서 잡으면 트랜잭션이 이미 롤백으로 표시돼 있다'
    where: '실무에서는'
  - topic: '메시지 큐에서 같은 메시지를 두 번 받는 경우'
    where: '다루지 않음: 메시지 큐(A8)'
  - topic: '재시도를 언제 얼마나 하나'
    where: '다루지 않음: 타임아웃, 재시도, 서킷 브레이커(A10)'
  - topic: '결제 승인, 취소의 흐름 전체'
    where: '다루지 않음: 결제 시스템 흐름(A20)'
codes:
  predict: |-
    @Transactional
    boolean pay(String key, long orderId,
        long amount) {
      if (repo.existsByIdempotencyKey(key)) {
        return false;
      }
      repo.save(new Payment(key, orderId,
          amount));
      return true;
    }
  predictMark: |-
    @Transactional
    boolean pay(String key, long orderId,
        long amount) {
      [[if (repo.existsByIdempotencyKey(key)) {]]
        return false;
      }
      [[repo.save(new Payment(key, orderId,]]
          [[amount));]]
      return true;
    }
  naive: |-
    @Transactional
    void pay(long orderId, long amount) {
      repo.save(new Payment(orderId,
          amount));
    }
  unique: |-
    @Entity
    @Table(name = "payment")
    class Payment {
      @Column(name = "idempotency_key",
          nullable = false, [[unique = true]])
      private String idempotencyKey;
      ...
    }
  request: |-
    POST /payments HTTP/1.1
    [[Idempotency-Key: 7c1f-...-a93e]]
    Content-Type: application/json

    {"orderId": 1, "amount": 10000}
  idempotent: |-
    // @Transactional을 붙이지 않는다
    Payment pay(String key, long orderId,
        long amount) {
      try {
        return [[repo.saveAndFlush(]]
            new Payment(key, orderId, amount));
      } catch (
          DataIntegrityViolationException e) {
        Payment first =
            repo.findByIdempotencyKey(key)
                .orElseThrow();
        [[if (first.getAmount() != amount)]] {
          throw new IllegalStateException();
        }
        return first;
      }
    }
  businessKey: |-
    create table payment (
      id bigserial primary key,
      idempotency_key varchar(64)
          not null unique,
      order_id bigint not null [[unique]],
      amount bigint not null
    );
  controller: |-
    @PostMapping("/payments")
    PaymentResponse pay(
        @RequestHeader("Idempotency-Key")
        String key,
        @RequestBody PayRequest req) {
      Payment p = service.pay(key,
          req.orderId(), req.amount());
      return PaymentResponse.from(p);
    }
  sameTx: |-
    [[@Transactional]]
    Payment pay(String key, ...) {
      try {
        return repo.saveAndFlush(...);
      } catch (
          DataIntegrityViolationException e) {
        return repo
            .findByIdempotencyKey(key)
            .orElseThrow();
      }
    }
  sameTxRun: |-
    tx.executeWithoutResult(s -> {
      try {
        repo.saveAndFlush(dup);
      } catch (
          DataIntegrityViolationException e) {
        repo.findByIdempotencyKey("key-1");
      }
    });
