# @Async (설계서)
# 자료 파일의 칸은 docs/lesson-data-format.md에 있다.
# 예전 레슨 thread-pool의 @Async 부분을 재료로 쓴다(로드맵 "초점을 바꾼다").
stage: design
title: '@Async'
unit: 스프링
roadmap: S14
type: 동작 확인
prerequisites:
  - {slug: aop-audit, title: AOP}
  - {slug: thread-pool, title: 스레드 풀}
assume: '자바 21, 스프링 부트 3.5. 프록시가 메서드 호출을 가로채고 내부 호출과 `final` 메서드에는 걸리지 않는다는 것(AOP 레슨). 스레드 풀의 코어 수, 큐, 거절(스레드 풀 레슨). `SecurityContextHolder`와 트랜잭션이 스레드에 묶여 있다는 것(서블릿과 톰캣, 인증과 인가 레슨).'
example: '주문 완료 뒤 영수증 메일을 보내는 `ReceiptMailer.send`에 `@Async`를 붙여, 주문 응답이 메일을 기다리지 않게 한다. 메일이 몰릴 때와 메일이 실패할 때를 본다.'
intro:
  - '주문 응답이 느려서 보니 영수증 메일을 보내는 2초를 기다리고 있어요. `@Async` 한 줄을 붙였더니 빨라졌는데, 어느 날 메일이 수천 통 몰리자 서버 메모리가 차올라요. 메일 실패는 로그 어디에도 없어요.'
  - '`@Async`는 메서드를 다른 스레드에서 돌리게 하는 AOP 프록시예요. 어느 스레드 풀에서 도는지, 큐가 얼마나 큰지, 예외는 어디로 가는지, 트랜잭션과 로그인 정보는 따라가는지를 모르면 빨라진 대신 다른 문제를 얻어요.'
  - '이 레슨에서는 `@Async` 메서드가 도는 스레드 이름과 기본 풀 설정을 출력하고, 반환 타입에 따라 예외가 어디로 가는지, 내부 호출에서 빠지는 것을 확인해요.'
covers:
  - topic: '`@EnableAsync`와 `@Async`. 프록시가 호출을 가로채 스레드 풀에 맡기고 바로 돌아온다'
    where: '질문 1'
  - topic: '스프링 부트는 `applicationTaskExecutor`(`ThreadPoolTaskExecutor`)를 자동 설정한다. 기본 코어 8, 큐 무제한(`Integer.MAX_VALUE`). `spring.task.execution.*`으로 바꾼다'
    where: '질문 2'
  - topic: '큐가 무제한이면 최대 스레드 수가 의미 없고, 몰리면 작업이 메모리에 쌓인다'
    where: '질문 2. 큐와 거절은 스레드 풀(C7)'
  - topic: '반환 타입: `void`면 예외가 `AsyncUncaughtExceptionHandler`(기본은 로그)로 가고 호출한 쪽은 모른다. `CompletableFuture`면 호출한 쪽이 받는다'
    where: '질문 3'
  - topic: '내부 호출, `private` 메서드에는 걸리지 않는다(S9와 같은 이유)'
    where: '질문 1'
  - topic: '다른 스레드라서 호출한 쪽의 트랜잭션과 `SecurityContextHolder`가 따라가지 않는다'
    where: '질문 4'
  - topic: '`@Async` 메서드의 `@Transactional`은 새 스레드에서 새 트랜잭션이다'
    where: '질문 4'
  - topic: '가상 스레드(`spring.threads.virtual.enabled`)로 실행기를 바꾸는 것'
    where: '다루지 않음: 가상 스레드(C12)'
codes:
  predict: |-
    @Async
    public void send(Receipt r) {
      log(Thread.currentThread().getName());
      mail.send(r);
    }
    // 주문 컨트롤러에서 send(r) 호출
predict:
  text: '코드 predict의 `send`를 컨트롤러가 불러요. 로그에 찍히는 스레드 이름은 무엇일까요? 보기: http-nio-8080-exec-1, task-1, main, ForkJoinPool.commonPool-worker-1.'
  answer: 'task-1. 스프링 부트가 자동 설정한 `applicationTaskExecutor`의 스레드다. 질문 1에서 밝힌다.'
questions:
  - id: q1
    title: '@Async를 붙이면 메서드는 어디서 도나요?'
    conclusion:
      lead: '프록시가 호출을 가로채 스레드 풀에 맡기고 바로 돌아와요. 메서드는 그 풀의 스레드에서 따로 돌아요.'
      sub: 'AOP 프록시라서 같은 클래스 안의 호출과 `private` 메서드에는 걸리지 않아요.'
    says:
      - '`@EnableAsync`와 `@Async`. 컨트롤러 스레드와 메서드 스레드의 이름을 실제 출력으로 보인다'
      - '호출한 쪽은 메서드가 끝나기 전에 돌아온다(시간을 잰다)'
      - '내부 호출이면 같은 스레드에서 돈다'
    asks:
      - '본문의 예시: 같은 클래스의 다른 메서드가 `this.send(r)`로 부르면 어느 스레드에서 도나 (호출한 스레드. 프록시를 거치지 않는다)'
      - '옮긴 상황: `@Async` 메서드가 3초 걸린다. 컨트롤러의 응답은 3초를 기다리나 (기다리지 않는다)'
  - id: q2
    title: '@Async는 어떤 스레드 풀을 쓰고, 무엇을 조심하나요?'
    conclusion:
      lead: '스프링 부트가 자동 설정한 `applicationTaskExecutor`를 써요. 기본 코어 8개에 큐가 무제한이라, 몰리면 작업이 메모리에 끝없이 쌓여요.'
      sub: '`spring.task.execution.pool.*`로 큐 크기와 최대 스레드 수를 정하거나, 용도별 실행기를 따로 만들어 `@Async("이름")`으로 고르세요.'
    says:
      - '자동 설정된 실행기의 코어 수, 최대 수, 큐 크기를 출력한다'
      - '큐가 무제한이면 최대 스레드 수까지 늘지 않는다(C7의 규칙). 작업 1,000개를 넣으면 스레드는 8개다'
      - '`spring.task.execution.pool.queue-capacity`를 정하면 넘칠 때 거절된다. 거절이 어떤 예외로 오는지 보인다'
    asks:
      - '본문의 예시: 기본 설정에서 `@Async` 작업 1,000개를 한꺼번에 넣으면 스레드는 몇 개까지 생기나 (8개. 나머지는 큐에서 기다린다)'
      - '옮긴 상황: `queue-capacity: 10`, `core-size: 2`, `max-size: 4`로 바꾸고 작업 20개를 넣으면 무슨 일이 생기나 (14개까지 받고 나머지는 거절된다. 테스트로 확인해 적는다)'
  - id: q3
    title: '@Async 메서드에서 난 예외는 어디로 가나요?'
    conclusion:
      lead: '반환 타입이 `void`면 호출한 쪽은 모르고 `AsyncUncaughtExceptionHandler`(기본은 로그 한 줄)로 가요. `CompletableFuture`를 돌려주면 호출한 쪽이 받아요.'
      sub: '실패를 알아야 하는 일은 `CompletableFuture`로 돌려주거나, 핸들러를 바꿔 기록하고 다시 시도해요.'
    says:
      - '`void` 메서드의 예외: 호출한 쪽은 정상, 핸들러가 받은 것을 보인다'
      - '`CompletableFuture` 메서드의 예외: `join`에서 받는다'
      - '`AsyncConfigurer`로 핸들러를 바꾼다'
    asks:
      - '본문의 예시: `void` `@Async` 메서드가 예외를 던지면 호출한 컨트롤러는 예외를 받나 (받지 않는다)'
      - '옮긴 상황: `CompletableFuture<Void>`를 돌려주는 `@Async` 메서드가 실패했다. 호출한 쪽이 `.join()`하면 (예외를 받는다. `CompletionException`)'
  - id: q4
    title: '@Async 메서드에는 트랜잭션과 로그인 정보가 따라가나요?'
    conclusion:
      lead: '따라가지 않아요. 둘 다 호출한 스레드에 묶여 있는데 메서드는 다른 스레드에서 돌기 때문이에요.'
      sub: '`@Async` 메서드의 `@Transactional`은 새 스레드에서 새 트랜잭션을 열어요. 호출한 쪽이 아직 커밋하지 않은 행은 보이지 않아요.'
    says:
      - '호출한 쪽의 트랜잭션 안에서 `@Async` 메서드를 부르고, 안에서 트랜잭션 여부와 `SecurityContextHolder`를 확인한다'
      - '호출한 쪽이 커밋 전에 저장한 행을 `@Async` 메서드가 조회하면 보이지 않는다(커밋 뒤 실행은 S13의 `@TransactionalEventListener`)'
    asks:
      - '본문의 예시: 컨트롤러에서 로그인한 kim이 `@Async` 메서드를 부르고, 메서드 안에서 `SecurityContextHolder`를 읽으면 (기본 설정에서 비어 있다)'
      - '옮긴 상황: `@Transactional` 주문 서비스가 주문을 저장한 뒤 `@Async` 메일 메서드에 주문 id를 넘기고, 메일 메서드가 그 주문을 조회한다. 찾을 수 있나 (주문이 아직 커밋 전이면 찾지 못할 수 있다)'
practice:
  says:
    - '실무 모양: 용도별 실행기 빈(`ThreadPoolTaskExecutor`)에 큐 크기와 거절 정책, 스레드 이름 접두사를 주고 `@Async("mailExecutor")`로 고른다. 종료할 때 남은 작업을 기다리게 설정한다'
    - '흔한 실수: 기본 실행기를 그대로 쓰다가 큐가 무제한이라 몰릴 때 메모리가 찬다'
    - '흔한 실수 둘: `void` `@Async`의 실패를 아무도 모른다. 핸들러를 바꿔 기록한다'
claims:
  - claim: '`@Async` 메서드는 `task-N` 스레드에서 돌고 호출한 쪽은 기다리지 않는다'
    how: '작은 컨텍스트에 `TaskExecutionAutoConfiguration`을 켜고 스레드 이름과 시간을 잰다'
  - claim: '기본 실행기는 코어 8, 큐 무제한이다'
    how: '`ThreadPoolTaskExecutor`의 값을 읽는다'
  - claim: '`void` 메서드의 예외는 호출한 쪽에 오지 않고 핸들러로 가며, `CompletableFuture`는 `join`에서 받는다'
    how: '핸들러를 바꿔 기록한다'
  - claim: '내부 호출은 같은 스레드다'
    how: '스레드 이름'
  - claim: '`@Async` 메서드 안에서는 호출한 쪽의 트랜잭션과 `SecurityContextHolder`가 없다'
    how: '`isActualTransactionActive`와 `SecurityContextHolder`'
sources:
  - '`@Async`와 `@EnableAsync`: 스프링 프레임워크 문서 https://docs.spring.io/spring-framework/reference/integration/scheduling.html'
  - '실행기 자동 설정과 `spring.task.execution.*`: 스프링 부트 문서 https://docs.spring.io/spring-boot/reference/features/task-execution-and-scheduling.html'
