# @Async
# 자료 파일의 칸은 docs/lesson-data-format.md에 있다. 문제는 content/questions/spring-async.yaml에 있다.
# 예전 레슨 thread-pool의 @Async 부분을 재료로 썼다(로드맵 "초점을 바꾼다").
title: '@Async'
description: '@Async 메서드가 어디서 도는지, 스프링 부트의 기본 스레드 풀과 그 함정, @Async 메서드의 예외가 어디로 가는지, 트랜잭션과 로그인 정보가 따라가는지. 네 가지 질문에 스스로 답할 수 있게 스레드 이름과 풀 설정을 출력해 보는 대화형 레슨.'
unit: 스프링
minutes: 18
roadmap: S14
type: 동작 확인
prerequisites:
  - {slug: aop-audit, title: AOP}
  - {slug: thread-pool, title: 스레드 풀}
assume: '자바 21, 스프링 부트 3.5. 프록시가 메서드 호출을 가로채고 내부 호출과 `final` 메서드에는 걸리지 않는다는 것(AOP 레슨). 스레드 풀의 코어 수, 큐, 거절(스레드 풀 레슨). `SecurityContextHolder`와 트랜잭션이 스레드에 묶여 있다는 것(서블릿과 톰캣, 인증과 인가 레슨).'
example: '주문 완료 뒤 영수증 메일을 보내는 `ReceiptMailer.send`에 `@Async`를 붙여, 주문 응답이 메일을 기다리지 않게 한다. 메일이 몰릴 때와 메일이 실패할 때를 본다.'
intro:
  - '주문 응답이 느려서 보니 영수증 메일을 보내는 2초를 기다리고 있어요. `@Async` 한 줄을 붙였더니 빨라졌는데, 어느 날 메일이 수천 통 몰리자 서버 메모리가 차올라요. 메일 실패는 로그 어디에도 눈에 띄지 않아요.'
  - '`@Async`는 메서드를 다른 스레드에서 돌리게 하는 AOP 프록시예요. 어느 스레드 풀에서 도는지, 큐가 얼마나 큰지, 예외는 어디로 가는지, 트랜잭션과 로그인 정보는 따라가는지를 모르면 빨라진 대신 다른 문제를 얻어요.'
  - '이 레슨에서는 `@Async` 메서드가 도는 스레드 이름과 기본 풀 설정을 출력하고, 반환 타입에 따라 예외가 어디로 가는지, 내부 호출에서 빠지는 것을 확인해요.'
covers:
  - topic: '`@EnableAsync`와 `@Async`. 프록시가 호출을 가로채 스레드 풀에 맡기고 바로 돌아온다'
    where: '질문 1'
  - topic: '내부 호출, `private` 메서드에는 걸리지 않는다(S9와 같은 이유)'
    where: '질문 1'
  - topic: '스프링 부트는 `applicationTaskExecutor`(`ThreadPoolTaskExecutor`)를 자동 설정한다. 기본 코어 8, 최대와 큐가 무제한(`Integer.MAX_VALUE`). `spring.task.execution.*`으로 바꾼다'
    where: '질문 2'
  - topic: '큐가 무제한이면 최대 스레드 수가 의미 없고, 몰리면 작업이 메모리에 쌓인다. 큐를 정하면 넘칠 때 부른 쪽에서 `TaskRejectedException`'
    where: '질문 2. 큐와 거절은 스레드 풀(C7)'
  - topic: '반환 타입: `void`면 예외가 `AsyncUncaughtExceptionHandler`(기본은 로그)로 가고 호출한 쪽은 모른다. `CompletableFuture`면 호출한 쪽이 받는다'
    where: '질문 3'
  - topic: '다른 스레드라서 호출한 쪽의 트랜잭션과 `SecurityContextHolder`가 따라가지 않는다. `@Async` 메서드의 `@Transactional`은 새 트랜잭션이다'
    where: '질문 4'
  - topic: '주입된 빈은 프록시라서 프록시 객체의 필드에 값을 넣어도 진짜 객체에 닿지 않는다'
    where: '질문 1의 더 알아보기'
  - topic: '용도별 실행기를 만들어 `@Async("이름")`으로 고르기, 종료할 때 남은 작업 기다리기'
    where: '실무에서는'
  - topic: '가상 스레드(`spring.threads.virtual.enabled`)로 실행기를 바꾸는 것'
    where: '다루지 않음: 가상 스레드(C12)'
links:
  test: https://github.com/wanja727/dev-lessons/blob/main/verification/src/test/java/lab/devlessons/springasync/SpringAsyncTest.java
  scheduling: https://docs.spring.io/spring-framework/reference/integration/scheduling.html
  bootTask: https://docs.spring.io/spring-boot/reference/features/task-execution-and-scheduling.html
codes:
  predict: |-
    @Async
    public void send(Receipt r) {
      log(Thread.currentThread().getName());
      mail.send(r);
    }
    // 주문 컨트롤러에서 send(r) 호출
  enable: |-
    @SpringBootApplication
    [[@EnableAsync]]
    public class ShopApplication { ... }

    @Component
    class ReceiptMailer {
      [[@Async]]
      public void send(Receipt r) { ... }
    }
  self: |-
    public void sendAll(List<Receipt> rs) {
      for (Receipt r : rs) {
        [[this.send(r);]]
      }
    }
  yml: |-
    spring:
      task:
        execution:
          pool:
            core-size: 2
            max-size: 4
            [[queue-capacity: 10]]
  handler: |-
    @Configuration
    @EnableAsync
    class AsyncConfig
        implements AsyncConfigurer {
      @Override
      public AsyncUncaughtExceptionHandler
          getAsyncUncaughtExceptionHandler() {
        return (e, method, params) ->
            failures.record(method, e);
      }
    }
  future: |-
    @Async
    public [[CompletableFuture<Void>]] send(
        Receipt r) {
      mail.send(r);
      return CompletableFuture
          .completedFuture(null);
    }
  executor: |-
    @Bean
    ThreadPoolTaskExecutor mailExecutor() {
      var e = new ThreadPoolTaskExecutor();
      e.setCorePoolSize(4);
      e.setMaxPoolSize(8);
      e.setQueueCapacity(500);
      e.setThreadNamePrefix("mail-");
      e.setWaitForTasksToCompleteOnShutdown(
          true);
      return e;
    }

    @Async("mailExecutor")
    public void send(Receipt r) { ... }
predict:
  title: 메일은 어느 스레드에서 갈까요?
  text: '코드 predict의 `send`를 주문 컨트롤러가 불러요. 로그에 찍히는 스레드 이름은 무엇일까요? 답은 질문 1에 나와요.'
  code: predict
  label: 내 예측
  options:
    - {value: a, label: 'http-nio-8080-exec-1 (요청 스레드)'}
    - {value: b, label: 'task-1'}
    - {value: c, label: 'ForkJoinPool.commonPool-worker-1'}
  answer: b
  storageKey: async-predict
  wrong: 예측은 "{label}"이었어요. 틀린 예측이 더 오래 남으니 괜찮아요.
questions:
  - id: q1
    title: '@Async를 붙이면 메서드는 어디서 도나요?'
    conclusion:
      lead: '프록시가 호출을 가로채 스레드 풀에 맡기고 바로 돌아와요. 메서드는 그 풀의 스레드에서 따로 돌아요.'
      sub: 'AOP 프록시라서 같은 클래스 안의 호출과 `private` 메서드에는 걸리지 않아요.'
    says:
      - '`@EnableAsync`와 `@Async`. 부른 쪽 스레드와 메서드 스레드의 이름을 실제 출력으로 보인다'
      - '부른 쪽은 메서드가 끝나기 전에 돌아온다(시간을 잰다)'
      - '내부 호출이면 같은 스레드에서 돈다'
      - '더 알아보기: 주입된 빈은 프록시라 그 필드에 넣은 값은 진짜 객체에 닿지 않는다(테스트를 쓰다 만난 일)'
    asks:
      - '본문의 예시: 같은 클래스의 다른 메서드가 `this.send(r)`로 부르면 어느 스레드에서 도나 (부른 스레드. 프록시를 거치지 않는다)'
      - '옮긴 상황: `@Async` 메서드가 3초 걸린다. 컨트롤러의 응답은 3초를 기다리나 (기다리지 않는다)'
    body:
      - code: enable
        notes:
          - mark: '@EnableAsync'
            as: anno
            text: '`@Async`를 처리하는 프록시를 켜요.'
          - mark: '@Async'
            as: anno
            text: '이 메서드는 다른 스레드에서 돌려 달라는 표시예요.'
      - p: '`@Async`가 붙은 빈은 [AOP](lesson:aop-audit)에서 본 프록시로 바뀌어요. 프록시는 호출을 가로채 원래 메서드를 **스레드 풀에 작업으로 맡기고** 바로 돌아와요([근거](link:scheduling)). 예측의 코드를 돌렸어요.'
      - ci:
          key: thread
          label: 실제 결과 보기
          source: SpringAsyncTest.runsOnTaskThread
          code: predict
      - p: '`send`는 **task-1**에서 돌았어요. {{predict-result}} 스프링 부트가 자동 설정한 실행기(`applicationTaskExecutor`)의 스레드예요. 웹 앱이라면 톰캣의 요청 스레드가 아니라 이 스레드에서 메일이 나가요. 부른 쪽은 300밀리초를 기다리지 않고 바로 돌아왔어요.'
      - h3: 내부 호출에는 걸리지 않아요
      - code: self
        notes:
          - mark: this.send(r);
            as: code
            text: '같은 클래스 안의 호출이라 프록시를 거치지 않아요.'
      - p: '위 결과의 아래쪽처럼, `this.send`는 부른 스레드에서 그대로 돌았어요. 다른 스레드로 넘어가지 않으니 응답이 다시 느려져요. AOP의 내부 호출과 같은 이유이고, `private` 메서드에도 걸리지 않아요.'
      - more:
          summary: '더 알아보기: 프록시의 필드에 값을 넣으면'
          body:
            - p: '이 레슨의 테스트를 쓰다가, 주입받은 `ReceiptMailer`의 필드에 테스트용 값을 넣었더니 `@Async` 메서드 안에서는 그 값이 비어 있었어요. 주입받은 것은 프록시이고, 메서드는 프록시 뒤의 진짜 객체에서 돌아요. 프록시의 필드와 진짜 객체의 필드는 따로예요. 빈의 상태는 메서드로 다루고, 필드를 밖에서 바꾸지 않아요.'
      - quiz:
          q: '`@Async` 메서드가 3초 걸려요. 컨트롤러가 이 메서드를 부르고 응답을 돌려줘요. 응답은 3초를 기다릴까요?'
          options:
            - 기다린다
            - 기다리지 않는다
            - 반만 기다린다
          answer: 2
          explain: '프록시가 메서드를 스레드 풀에 맡기고 바로 돌아와요. 메서드는 다른 스레드에서 따로 돌아요.'
      - next: '그 스레드 풀은 스레드가 몇 개이고, 작업이 몰리면 어떻게 될까요?'
    recall: '@EnableAsync를 켜면 @Async가 붙은 빈은 프록시로 바뀌고, 프록시가 호출을 가로채 메서드를 스레드 풀(스프링 부트의 applicationTaskExecutor, 스레드 이름 task-N)에 맡기고 바로 돌아와요. AOP 프록시라서 같은 클래스 안의 this 호출과 private 메서드에는 걸리지 않고 부른 스레드에서 그대로 돌아요.'
  - id: q2
    title: '@Async는 어떤 스레드 풀을 쓰고, 무엇을 조심하나요?'
    conclusion:
      lead: '스프링 부트가 자동 설정한 `applicationTaskExecutor`를 써요. 기본 코어 8개에 큐가 무제한이라, 몰리면 작업이 메모리에 끝없이 쌓여요.'
      sub: '`spring.task.execution.pool.*`로 큐 크기와 최대 스레드 수를 정하면, 넘칠 때 부른 쪽에서 `TaskRejectedException`이 나요.'
    says:
      - '자동 설정된 실행기의 코어 수, 최대 수, 큐 크기를 출력한다'
      - '큐가 무제한이면 최대 스레드 수까지 늘지 않는다(C7의 규칙). 작업 1,000개를 넣으면 스레드는 8개, 992개는 큐에서 기다린다'
      - '`queue-capacity`를 정하면 넘칠 때 거절된다. 부른 쪽에서 `TaskRejectedException`이 난다'
    widget:
      kind: toggle
      note: '설정을 고르는 버튼 둘(기본, core 2 max 4 queue 10)과 작업 20개를 넣은 결과(스레드 수, 큐, 거절)를 보인다'
    asks:
      - '본문의 예시: 기본 설정에서 오래 걸리는 `@Async` 작업 1,000개를 한꺼번에 넣으면 스레드는 몇 개까지 생기나 (8개. 나머지는 큐에서 기다린다)'
      - '옮긴 상황: `queue-capacity: 10`, `core-size: 2`, `max-size: 4`로 바꾸고 오래 걸리는 작업 20개를 넣으면 몇 개를 받나 (14개. 스레드 4개와 큐 10개, 나머지 6개는 거절된다)'
    body:
      - p: '`@Async`는 따로 정하지 않으면 스프링 부트가 자동 설정한 `applicationTaskExecutor`를 써요([근거](link:bootTask)). 그 설정을 읽고, 끝나지 않는 작업 1,000개를 넣어 봤어요.'
      - ci:
          key: defaults
          label: 실제 결과 보기
          source: SpringAsyncTest.defaultExecutor
      - p: '코어 8, 최대와 큐는 **무제한**(`2147483647`)이에요. [스레드 풀](lesson:thread-pool)의 규칙대로 코어가 다 차면 큐에 먼저 넣고, 큐가 가득 차야 최대 수까지 스레드를 늘려요. 큐가 무제한이니 늘 일이 없어요. 1,000개 가운데 8개만 돌고 992개는 큐에서 기다려요. 메일 수천 통이 몰리면 그만큼 작업 객체가 메모리에 쌓여요. 도입부의 장면이에요.'
      - h3: 큐를 정하면 넘칠 때 거절돼요
      - code: yml
        notes:
          - mark: 'queue-capacity: 10'
            as: code
            text: '큐에 10개까지만 받아요. 넘치면 스레드를 최대 수까지 늘리고, 그것도 넘치면 거절해요.'
      - ci:
          key: bounded
          label: 실제 결과 보기
          source: SpringAsyncTest.boundedExecutorRejects
      - p: '스레드 4개와 큐 10개, 모두 14개를 받고 6개는 **부른 쪽에서** `TaskRejectedException`이 났어요. 거절은 부른 쪽이 처리해야 해요. 나중에 다시 보내거나, 사용자에게 알리거나, 실패로 기록해요. 직접 골라 보세요.'
      - widget:
          kind: toggle
          layout: [selector, duo, verdict]
          selector:
            label: 실행기 설정
            options:
              - {value: default, label: 기본 (코어 8, 큐 무제한)}
              - {value: bounded, label: '코어 2, 최대 4, 큐 10'}
          scenes:
            default:
              duo:
                - {label: '오래 걸리는 작업 20개', rows: [{k: 스레드, v: '8'}, {k: 큐, v: '12'}, {k: 거절, v: '0'}]}
                - {label: '작업 10,000개라면', rows: [{k: 큐, v: '9,992', mark: bad}]}
              verdict: '거절이 없는 대신 몰리면 큐가 끝없이 커져요.'
            bounded:
              duo:
                - {label: '오래 걸리는 작업 20개', rows: [{k: 스레드, v: '4', mark: changed}, {k: 큐, v: '10'}, {k: 거절, v: '6', mark: bad}]}
                - {label: '작업 10,000개라면', rows: [{k: 큐, v: '10', mark: changed}]}
              verdict: '메모리는 지키지만 넘친 작업은 부른 쪽에서 처리해야 해요.'
      - quiz:
          q: '기본 설정의 `@Async`에 오래 걸리는 작업 1,000개를 한꺼번에 넣으면 스레드는 몇 개까지 생길까요?'
          options:
            - '8개'
            - '1,000개'
            - '200개'
          answer: 1
          explain: '기본 큐가 무제한이라 코어 8개가 다 차면 나머지는 모두 큐에 들어가요. 최대 수까지 늘어날 일이 없어요.'
      - next: '작업이 실패하면, 이미 돌아간 부른 쪽은 어떻게 알까요?'
    recall: '@Async는 스프링 부트가 자동 설정한 applicationTaskExecutor를 써요. 기본은 코어 8, 최대와 큐가 무제한이라 작업이 몰려도 스레드는 8개뿐이고 나머지는 큐에 끝없이 쌓여 메모리를 써요. spring.task.execution.pool.queue-capacity와 max-size를 정하면 큐가 차야 최대 수까지 늘고, 그것도 넘치면 부른 쪽에서 TaskRejectedException이 나요.'
  - id: q3
    title: '@Async 메서드에서 난 예외는 어디로 가나요?'
    conclusion:
      lead: '반환 타입이 `void`면 부른 쪽은 모르고 `AsyncUncaughtExceptionHandler`(기본은 로그 한 줄)로 가요. `CompletableFuture`를 돌려주면 부른 쪽이 받아요.'
      sub: '실패를 알아야 하는 일은 `CompletableFuture`로 돌려주거나, 핸들러를 바꿔 기록하고 다시 시도해요.'
    says:
      - '`void` 메서드의 예외: 부른 쪽은 정상, 핸들러가 받은 것을 보인다'
      - '`CompletableFuture` 메서드의 예외: `join`에서 `CompletionException`으로 받는다'
      - '`AsyncConfigurer`로 핸들러를 바꾼다'
    asks:
      - '본문의 예시: `void` `@Async` 메서드가 예외를 던지면 부른 컨트롤러는 예외를 받나 (받지 않는다)'
      - '옮긴 상황: `CompletableFuture<Void>`를 돌려주는 `@Async` 메서드가 실패했다. 부른 쪽이 `.join()`하면 (예외를 받는다. `CompletionException`)'
    body:
      - p: '부른 쪽은 이미 돌아갔으니, 다른 스레드에서 난 예외를 그 자리에서 받을 수 없어요. 반환 타입에 따라 예외가 가는 곳이 달라요.'
      - code: handler
      - code: future
        notes:
          - mark: CompletableFuture<Void>
            as: code
            text: '나중에 끝날 결과예요. 부른 쪽이 기다리거나 실패를 확인할 수 있어요.'
      - ci:
          key: exceptions
          label: 실제 결과 보기
          source: SpringAsyncTest.exceptions
      - ul:
          - '**`void`:** 부른 쪽은 예외를 받지 않아요. 예외는 `AsyncUncaughtExceptionHandler`로 가요. 기본 핸들러는 로그를 한 줄 남길 뿐이에요. 이 레슨은 `AsyncConfigurer`로 핸들러를 바꿔 받은 예외를 기록했어요.'
          - '**`CompletableFuture`:** 예외가 결과에 담겨요. 부른 쪽이 `join()`하면 `CompletionException`(원인은 원래 예외)을 받아요. 기다리지 않고 `exceptionally`로 실패만 처리할 수도 있어요.'
      - p: '영수증 메일처럼 실패를 꼭 챙겨야 하는 일은 `void`로 두고 잊지 말고, 핸들러에서 실패를 기록해 다시 보내거나 `CompletableFuture`로 돌려줘요.'
      - quiz:
          q: '`void` `@Async` 메서드가 예외를 던져요. 기본 설정에서 부른 컨트롤러는 어떻게 될까요?'
          options:
            - 예외를 받는다
            - 예외를 받지 않는다. 예외는 핸들러(기본은 로그)로 간다
            - 컨트롤러도 멈춘다
          answer: 2
          explain: '부른 쪽은 이미 돌아갔어요. `void` 메서드의 예외는 `AsyncUncaughtExceptionHandler`로 가고, 기본은 로그만 남겨요.'
      - next: '다른 스레드에서 돈다면, 부른 쪽이 가진 트랜잭션과 로그인 정보는 어떻게 될까요?'
    recall: '@Async 메서드가 void면 부른 쪽은 이미 돌아가 예외를 받지 못하고, 예외는 AsyncUncaughtExceptionHandler(기본은 로그 한 줄)로 가요. AsyncConfigurer로 핸들러를 바꿔 기록할 수 있어요. CompletableFuture를 돌려주면 예외가 결과에 담겨 부른 쪽이 join()에서 CompletionException으로 받아요.'
  - id: q4
    title: '@Async 메서드에는 트랜잭션과 로그인 정보가 따라가나요?'
    conclusion:
      lead: '따라가지 않아요. 둘 다 부른 스레드에 묶여 있는데 메서드는 다른 스레드에서 돌기 때문이에요.'
      sub: '`@Async` 메서드의 `@Transactional`은 새 스레드에서 새 트랜잭션을 열어요. 부른 쪽이 아직 커밋하지 않은 행은 보이지 않아요.'
    says:
      - '부른 쪽의 트랜잭션 안에서 로그인한 kim으로 `@Async` 메서드를 부르고, 안에서 트랜잭션 여부와 `SecurityContextHolder`를 확인한다'
      - '부른 쪽이 커밋 전에 저장한 행은 `@Async` 메서드의 새 트랜잭션에서 보이지 않을 수 있다. 커밋 뒤 실행은 S13의 `@TransactionalEventListener`'
    asks:
      - '본문의 예시: 컨트롤러에서 로그인한 kim이 `@Async` 메서드를 부르고, 메서드 안에서 `SecurityContextHolder`를 읽으면 (기본 설정에서 비어 있다)'
      - '옮긴 상황: `@Transactional` 주문 서비스가 주문을 저장한 뒤 `@Async` 메일 메서드에 주문 id를 넘기고, 메일 메서드가 그 주문을 조회한다. 늘 찾을 수 있나 (없다. 주문이 아직 커밋 전이면 다른 트랜잭션에서 보이지 않는다)'
    body:
      - p: '트랜잭션의 커넥션도, 로그인한 사용자(`SecurityContextHolder`)도 **스레드에 묶인** 값이에요([서블릿과 톰캣](lesson:servlet-tomcat)). 트랜잭션 안에서 로그인한 kim으로 `@Async` 메서드를 불러 봤어요. `@Async` 메서드에도 `@Transactional`을 붙였어요.'
      - ci:
          key: context
          label: 실제 결과 보기
          source: SpringAsyncTest.contextDoesNotFollow
      - p: '`@Async` 메서드 안에서는 로그인 사용자가 **null**이고, 트랜잭션은 있지만 부른 쪽과 다른 **새 트랜잭션**이에요. 부른 쪽의 트랜잭션은 task-1 스레드로 따라가지 않아요.'
      - p: '그래서 조심할 일이 생겨요. 주문 서비스가 주문을 저장하고, 커밋하기 전에 `@Async` 메일 메서드에 주문 id를 넘기면, 메일 메서드의 새 트랜잭션에서는 아직 커밋되지 않은 주문이 보이지 않을 수 있어요. 커밋된 뒤에 보내려면 [스프링 이벤트](lesson:spring-events)의 `@TransactionalEventListener`에 `@Async`를 함께 붙여요. 로그인 정보가 필요하면 사용자 id를 인자로 넘겨요.'
      - quiz:
          q: '로그인한 kim의 요청에서 `@Async` 메서드를 불렀어요. 메서드 안에서 `SecurityContextHolder.getContext().getAuthentication()`은?'
          options:
            - kim
            - 'null (기본 설정)'
            - 다른 사용자
          answer: 2
          explain: '`SecurityContextHolder`는 기본으로 스레드에 묶인 저장소라 task 스레드로 따라가지 않아요. 필요한 값은 인자로 넘겨요.'
    recall: '@Async 메서드는 다른 스레드에서 돌아서, 부른 스레드에 묶인 트랜잭션과 SecurityContextHolder의 로그인 정보가 따라가지 않아요. @Async 메서드의 @Transactional은 새 트랜잭션이라, 부른 쪽이 커밋하기 전의 행은 보이지 않을 수 있어요. 커밋 뒤에 돌리려면 @TransactionalEventListener에 @Async를 붙이고, 필요한 값은 인자로 넘겨요.'
practice:
  title: 스프링 부트에서는 이렇게 둬요
  says:
    - '실무 모양: 용도별 실행기 빈(`ThreadPoolTaskExecutor`)에 큐 크기와 스레드 이름 접두사를 주고 `@Async("mailExecutor")`로 고른다. 종료할 때 남은 작업을 기다리게 설정한다'
    - '흔한 실수: 기본 실행기를 그대로 쓰다가 큐가 무제한이라 몰릴 때 메모리가 찬다'
    - '흔한 실수 둘: `void` `@Async`의 실패를 아무도 모른다. 핸들러를 바꿔 기록한다'
  body:
    - h3: 용도별 실행기
    - code: executor
    - p: '메일, 알림, 리포트처럼 성격이 다른 일은 실행기를 나눠요. 한 일이 몰려도 다른 일의 스레드를 빼앗지 않아요. 큐 크기를 정해 메모리를 지키고, 스레드 이름 접두사(`mail-`)로 로그에서 어느 일인지 알아봐요. `setWaitForTasksToCompleteOnShutdown(true)`이면 배포로 앱이 꺼질 때 큐의 작업을 끝내고 꺼져요(질문 2에서 본 큐 크기와 거절이 그대로 적용돼요)([근거](link:scheduling)).'
    - h3: '흔한 실수 1: 기본 실행기에 무제한 큐'
    - p: '질문 2의 결과처럼 기본 큐는 무제한이에요. 평소에는 문제가 없다가 몰리는 날 메모리가 차요. `spring.task.execution.pool.queue-capacity`를 정하거나 용도별 실행기를 만들어요.'
    - h3: '흔한 실수 2: 아무도 모르는 실패'
    - p: '`void` `@Async`의 예외는 로그 한 줄로 끝나요(질문 3). 영수증 메일이 안 나가도 아무도 몰라요. 핸들러에서 실패를 기록하고 다시 보내는 작업을 두거나, `CompletableFuture`로 돌려줘요.'
interview:
  question: '@Async는 어떻게 동작하고, 무엇을 조심해야 하나요?'
  model:
    - label: 정의
      text: '@Async는 메서드를 다른 스레드에서 돌리게 하는 표시로, @EnableAsync를 켜면 AOP 프록시가 호출을 가로채 스레드 풀에 맡기고 바로 돌아옵니다.'
    - label: 원리
      text: 스프링 부트는 applicationTaskExecutor를 자동 설정하고, 기본은 코어 8에 큐가 무제한입니다. void 메서드의 예외는 AsyncUncaughtExceptionHandler로 가고, CompletableFuture를 돌려주면 부른 쪽이 받습니다.
    - label: 주의할 점
      text: 프록시라서 내부 호출과 private 메서드에는 걸리지 않습니다. 큐가 무제한이라 몰리면 메모리가 차므로 큐 크기를 정하거나 용도별 실행기를 둡니다. 다른 스레드라 트랜잭션과 SecurityContextHolder가 따라가지 않습니다.
    - label: 경험
      text: '(내 프로젝트로 채우기) 예: 메일 발송을 @Async로 돌리다 몰리는 날 메모리가 차서, 큐 크기를 정한 메일 전용 실행기로 바꿨습니다.'
verified: 이 레슨의 스레드 이름과 풀 설정은 짐작이 아니라 스프링 부트 3.5의 실행기 자동 설정을 켠 작은 앱에서 받은 값이에요. 코드가 바뀔 때마다 테스트([SpringAsyncTest](link:test))가 다시 돌아요.
footer: '근거: `@Async`와 `@EnableAsync`, 예외 핸들러는 스프링 프레임워크 문서([링크](link:scheduling)), 실행기 자동 설정과 `spring.task.execution.*`은 스프링 부트 문서([링크](link:bootTask)). 결과는 OpenJDK 21에서 테스트로 확인했어요. 오류는 [GitHub 이슈](https://github.com/wanja727/dev-lessons/issues)로 알려 주세요.'
claims:
  - claim: '`@Async` 메서드는 `task-N` 스레드에서 돌고 부른 쪽은 기다리지 않는다. 내부 호출은 같은 스레드다'
    how: '`TaskExecutionAutoConfiguration`을 켠 작은 앱에서 스레드 이름과 시간을 잰다'
    test: SpringAsyncTest.runsOnTaskThread
  - claim: '기본 실행기는 코어 8, 최대와 큐가 무제한이고, 작업 1,000개를 넣어도 스레드는 8개다'
    how: '`ThreadPoolTaskExecutor`의 값과 풀 크기를 읽는다'
    test: SpringAsyncTest.defaultExecutor
  - claim: '코어 2, 최대 4, 큐 10이면 20개 가운데 14개를 받고 6개는 부른 쪽에서 `TaskRejectedException`'
    how: '`spring.task.execution.pool.*`을 주고 센다'
    test: SpringAsyncTest.boundedExecutorRejects
  - claim: '`void` 메서드의 예외는 핸들러로 가고, `CompletableFuture`는 `join`에서 받는다'
    how: '`AsyncConfigurer`로 핸들러를 바꿔 기록한다'
    test: SpringAsyncTest.exceptions
  - claim: '`@Async` 메서드 안에서는 부른 쪽의 트랜잭션이 아니라 새 트랜잭션이고 `SecurityContextHolder`는 비어 있다'
    how: '`ResourcelessTransactionManager`로 DB 없이 트랜잭션을 열고 확인한다'
    test: SpringAsyncTest.contextDoesNotFollow
sources:
  - '`@Async`와 `@EnableAsync`: 스프링 프레임워크 문서 https://docs.spring.io/spring-framework/reference/integration/scheduling.html'
  - '실행기 자동 설정과 `spring.task.execution.*`: 스프링 부트 문서 https://docs.spring.io/spring-boot/reference/features/task-execution-and-scheduling.html'
