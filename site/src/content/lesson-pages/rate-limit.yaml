# 요청 수 제한
# 자료 파일의 칸은 docs/lesson-data-format.md에 있다. 문제는 content/questions/rate-limit.yaml에 있다.
# 심화 레슨. 설계 칸과 본문을 한 번에 썼다 (이번 작업의 설계 승인은 사용자가 미리 맡겼다)
title: 요청 수 제한
description: 요청 수를 제한하는 이유, 고정 창 방식과 창의 경계에서 두 배가 통과하는 문제, 토큰 버킷이 몰아 보내기와 평균 속도를 함께 다루는 방식, 제한을 어디에 두고 넘으면 무엇을 돌려주는지. Redis로 두 방식을 재 보는 대화형 레슨.
unit: 시스템 설계와 아키텍처
minutes: 20
roadmap: A13
type: 동작 확인
prerequisites:
  - {slug: redis-ranking, title: Redis}
assume: 'Redis 7, 스프링 부트 3.5. Redis의 INCR와 만료, Lua 스크립트가 한 번에 실행된다는 것(Redis 레슨). 서버가 여러 대면 서버 메모리의 카운터가 어긋난다는 것(서버를 늘리는 방법 레슨). 스프링 MVC의 인터셉터(필터와 인터셉터 레슨).'
example: '상품 목록 API를 사용자마다 1초에 5번으로 제한한다. 사용자 id로 Redis 키를 만들고, 고정 창과 토큰 버킷 두 방식으로 같은 요청을 흘려 허용된 수를 센다.'
intro:
  - '누군가 스크립트로 상품 목록 API를 1초에 수백 번 불러 DB가 느려졌어요. 다른 사용자들의 요청까지 함께 느려졌어요. 로그인 API에는 비밀번호를 바꿔 가며 계속 시도하는 요청이 쏟아지고요.'
  - '공개된 API를 운영하는 스프링 서버는 한 사용자나 한 IP가 너무 많이 부르지 못하게 제한을 둬요. 제한 방식에 따라 경계에서 한도의 두 배가 통과하기도 하고, 서버가 여러 대면 카운터를 어디에 둘지도 정해야 해요. 경력 면접의 시스템 설계 질문으로 자주 나와요.'
  - '이 레슨에서는 Redis로 고정 창과 토큰 버킷을 만들어, 창이 바뀌는 순간 몇 번이 통과하는지 재고, 스프링 인터셉터가 429를 돌려주는 것까지 확인해요.'
covers:
  - topic: '요청 수 제한은 한 사용자나 IP가 정해진 시간에 부를 수 있는 수를 정해 서버와 다른 사용자를 지킨다. 무차별 대입 공격도 늦춘다'
    where: '질문 1'
  - topic: '서버가 여러 대면 카운터를 Redis 같은 공유 저장소에 둔다'
    where: '질문 1'
  - topic: '고정 창: 1초마다 카운터를 새로 센다. INCR와 만료로 만든다'
    where: '질문 2'
  - topic: '고정 창의 경계 문제: 창이 바뀌는 순간 앞뒤로 보내면 짧은 시간에 한도의 두 배가 통과한다'
    where: '질문 2'
  - topic: '토큰 버킷: 일정한 속도로 토큰을 채우고 요청마다 하나씩 쓴다. 용량만큼 몰아 보내기를 허용하고 평균은 채우는 속도로 묶는다'
    where: '질문 3'
  - topic: '토큰 버킷을 Redis에서 만들 때 읽고 바꾸는 일을 Lua로 한 번에'
    where: '질문 3'
  - topic: '슬라이딩 창(로그, 카운터)'
    where: '질문 3의 더 알아보기'
  - topic: '어디에 두나: API 게이트웨이와 로드 밸런서, 애플리케이션의 필터나 인터셉터. 무엇으로 세나: 사용자, IP, API 키'
    where: '질문 4'
  - topic: '넘으면 429 Too Many Requests와 Retry-After를 돌려준다'
    where: '질문 4'
  - topic: '스프링 인터셉터로 429 돌려주기, Bucket4j 같은 라이브러리'
    where: '실무에서는'
  - topic: '바깥 서비스를 부를 때 내 쪽에서 막는 서킷 브레이커'
    where: '다루지 않음: 타임아웃, 재시도, 서킷 브레이커(A10)'
codes:
  predict: |-
    // 고정 창, 1초에 5번
    // 10.90초~10.98초에 5번
    // 11.00초~11.08초에 5번
    // 0.2초 안에 몇 번이 허용될까?
  fixed: |-
    local n = redis.call('INCR', KEYS[1])
    if n == 1 then
      redis.call('PEXPIRE', KEYS[1],
        ARGV[2])
    end
    if n <= tonumber(ARGV[1]) then
      return 1
    end
    return 0
  fixedKey: |-
    String key = "rl:fixed:" + userId
        + ":" + (now / 1000);
  bucket: |-
    local t = redis.call('HMGET', KEYS[1],
      'tokens', 'at')
    local tokens = tonumber(t[1]) or cap
    local at = tonumber(t[2]) or now
    tokens = math.min(cap,
      tokens + (now - at) * rate / 1000)
    local ok = 0
    if tokens >= 1 then
      tokens = tokens - 1
      ok = 1
    end
    redis.call('HSET', KEYS[1],
      'tokens', tokens, 'at', now)
    return ok
  interceptor: |-
    public boolean preHandle(
        HttpServletRequest req,
        HttpServletResponse res, Object h) {
      String user =
          req.getHeader("X-User-Id");
      if (limiter.tryAcquire(user)) {
        return true;
      }
      res.setStatus([[429]]);
      res.setHeader([["Retry-After"]], "1");
      return false;
    }
  memoryLimiter: |-
    private final Map<String, AtomicInteger>
        counts = [[new ConcurrentHashMap<>()]];

    boolean tryAcquire(String user) {
      return counts.computeIfAbsent(user,
          k -> new AtomicInteger())
          .incrementAndGet() <= 5;
    }
links:
  test: https://github.com/wanja727/dev-lessons/blob/main/verification/src/test/java/lab/devlessons/ratelimit/RateLimitTest.java
  rfc6585: https://www.rfc-editor.org/rfc/rfc6585#section-4
  retryAfter: https://www.rfc-editor.org/rfc/rfc9110#section-10.2.3
  redisIncr: https://redis.io/docs/latest/commands/incr/
  bucket4j: https://bucket4j.com/
predict:
  title: 창이 바뀌는 순간에는?
  text: '1초에 5번으로 제한하는 고정 창이에요. 10.90초부터 10.98초 사이에 5번, 이어서 11.00초부터 11.08초 사이에 5번을 보내요. 0.2초도 안 되는 동안 몇 번이 허용될까요? 답은 질문 2에 나와요.'
  code: predict
  label: 내 예측
  options:
    - value: '5'
      label: 5번
    - value: '10'
      label: 10번
    - value: '0'
      label: 0번
  answer: '10'
  storageKey: ratelimit-predict
  wrong: 예측은 "{label}"이었어요. 틀린 예측이 더 오래 남으니 괜찮아요.
questions:
  - id: q1
    title: 요청 수는 왜 제한하고, 카운터는 어디에 두나요?
    conclusion:
      lead: '한 사용자나 IP가 너무 많이 불러 서버와 다른 사용자가 함께 느려지는 것을 막고, 비밀번호 무차별 대입 같은 공격을 늦추려고요.'
      sub: '서버가 여러 대면 카운터를 서버 메모리가 아니라 Redis 같은 공유 저장소에 둬야 한도가 지켜져요.'
    says:
      - '제한의 목적: 공정한 몫, 과부하, 공격'
      - '고정 창 1초 5번: A의 6번째부터 거절, B는 따로'
      - '서버 메모리 카운터는 서버 대수만큼 한도가 늘어난다'
    asks:
      - '본문의 예시: 사용자 A가 1초에 5번 한도에서 7번을 보냈다. 같은 때 사용자 B의 첫 요청은 (허용된다. 사용자마다 따로 센다)'
      - '옮긴 상황: 서버 3대가 각자 메모리 맵으로 사용자마다 1초에 5번을 센다. 라운드 로빈이면 한 사용자는 1초에 최대 몇 번 통과하나 (15번)'
    body:
      - p: '요청 수 제한(rate limiting)은 한 사용자나 IP가 정한 시간 동안 부를 수 있는 수를 정해요. 목적은 셋이에요.'
      - ul:
          - '**공정한 몫:** 한 사용자가 서버를 다 쓰지 못하게 해서 다른 사용자를 지켜요.'
          - '**과부하 막기:** 스크립트나 버그로 쏟아지는 요청에서 DB와 서버를 지켜요.'
          - '**공격 늦추기:** 로그인 API에 비밀번호를 바꿔 가며 계속 시도하는 무차별 대입을 늦춰요.'
      - p: '가장 쉬운 방법은 1초마다 카운터를 새로 세는 **고정 창**이에요. Redis에서 키에 창 번호(지금 초)를 넣고 `INCR`로 세요([Redis 문서](link:redisIncr)).'
      - code: fixedKey
      - ci:
          key: fixed
          label: 실제 결과 보기
          source: RateLimitTest.fixedWindowLimits
      - p: '6번째부터 거절됐고, 사용자 B는 키가 달라 따로 셌어요.'
      - h3: 카운터는 공유 저장소에
      - p: '서버 메모리에 카운터를 두면 [서버를 늘리는 방법](lesson:scale-out)에서 본 것처럼 서버마다 따로 세요. 서버 3대에 라운드 로빈이면 한 사용자가 1초에 15번까지 통과해요. 그래서 카운터는 모든 서버가 보는 Redis에 둬요.'
      - quiz:
          q: '서버 3대가 각자 메모리 맵으로 사용자마다 1초에 5번을 세요. 로드 밸런서가 라운드 로빈으로 나누면 한 사용자는 1초에 최대 몇 번 통과하나요?'
          options:
            - '5번'
            - '15번'
            - '3번'
          answer: 2
          explain: '서버마다 5번씩 따로 세니 셋을 합쳐 15번이에요. 카운터를 Redis에 두면 5번이에요.'
      - next: '고정 창은 단순하지만 창이 바뀌는 순간에 구멍이 있어요.'
    recall: '요청 수 제한은 한 사용자나 IP가 정한 시간에 부를 수 있는 수를 정해, 한 사용자가 서버를 다 쓰지 못하게 하고, 과부하에서 DB를 지키고, 무차별 대입 같은 공격을 늦춰요. 서버가 여러 대면 서버 메모리의 카운터는 서버마다 따로 세어 한도가 대수만큼 늘어나니, 카운터를 Redis 같은 공유 저장소에 둬요.'
  - id: q2
    title: 고정 창에는 어떤 구멍이 있나요?
    conclusion:
      lead: '창이 바뀌는 순간 앞 창의 끝과 새 창의 시작에 몰아 보내면, 아주 짧은 시간에 한도의 두 배가 통과해요.'
      sub: '창마다 카운터가 새로 시작하기 때문이에요. 평균은 지켜도 순간의 몰림은 막지 못해요.'
    says:
      - '10.90~11.08초 10번: 고정 창 10번 허용. 예측의 답'
    widget:
      kind: toggle
      note: '고정 창과 토큰 버킷을 고르면 경계 앞뒤 10번 요청이 허용과 거절로 나뉘어 보인다'
    asks:
      - '본문의 예시: 1초 5번 고정 창에서 10.9초대에 5번, 11.0초대에 5번을 보냈다. 허용된 수는 (10번)'
      - '옮긴 상황: 1분에 100번 고정 창이다. 0분 59초에 100번, 1분 0초에 100번을 보내면 2초 안에 통과하는 수는 (200번)'
    body:
      - p: '처음 예측처럼 창이 바뀌는 순간 앞뒤로 5번씩 보냈어요.'
      - ci:
          key: boundary
          label: 실제 결과 보기
          source: RateLimitTest.boundaryBurst
          code: predict
      - p: '고정 창은 **10번**을 모두 허용했어요. {{predict-result}} 10초 창에 5번, 11초 창에 5번이라 각 창으로 보면 한도를 지켰어요. 하지만 0.2초도 안 되는 사이에 한도의 **두 배**가 통과했어요. 창마다 카운터가 0부터 다시 시작하기 때문이에요.'
      - p: '두 방식을 골라 보세요.'
      - widget:
          kind: toggle
          layout: [selector, log, verdict]
          selector:
            label: 제한 방식
            options:
              - {value: fixed, label: 고정 창}
              - {value: bucket, label: 토큰 버킷}
          scenes:
            fixed:
              log:
                - '10.90~10.98초: 5번 → 모두 허용 (10초 창 5/5)'
                - '11.00~11.08초: 5번 → 모두 허용 (11초 창 5/5)'
              verdict: '0.2초 안에 10번. 창이 바뀌며 카운터가 새로 시작했어요.'
            bucket:
              log:
                - '10.90~10.98초: 5번 → 모두 허용 (토큰 5개를 씀)'
                - '11.00~11.08초: 5번 → 모두 거절 (0.18초 동안 채워진 토큰 1개 미만)'
              verdict: '토큰이 채워지는 속도만큼만 허용해 경계의 몰림을 막아요.'
      - quiz:
          q: '1분에 100번 고정 창이에요. 0분 59초에 100번, 1분 0초에 100번을 보내면 2초 안에 통과하는 수는?'
          options:
            - '100번'
            - '200번'
            - '0번'
          answer: 2
          explain: '창이 바뀌며 카운터가 새로 시작해 앞뒤 창에서 100번씩 통과해요.'
      - next: '몰려오는 요청을 어느 정도 받으면서도 평균을 지키는 방법은 없을까요?'
    recall: '고정 창은 창마다 카운터가 0부터 다시 시작해서, 창이 바뀌는 순간 앞 창의 끝과 새 창의 시작에 몰아 보내면 아주 짧은 시간에 한도의 두 배가 통과해요. 1초 5번 한도에서 10.9초대 5번과 11.0초대 5번이 모두 허용됐어요. 각 창은 한도를 지켰지만 순간의 몰림은 막지 못해요.'
  - id: q3
    title: 토큰 버킷은 어떻게 다른가요?
    conclusion:
      lead: '버킷에 일정한 속도로 토큰을 채우고 요청마다 하나씩 써서, 용량만큼은 몰아 보내기를 허용하고 그 뒤로는 채우는 속도만큼만 허용해요.'
      sub: '창의 경계가 없어서 고정 창의 두 배 문제가 없어요. Redis에서는 읽고 채우고 쓰는 일을 Lua로 한 번에 해요.'
    says:
      - '용량 5, 초당 5: 한꺼번에 8번 → 5번, 0.4초 뒤 3번 → 2번'
      - '경계 10번 → 5번'
      - '더 알아보기: 슬라이딩 창'
    asks:
      - '본문의 예시: 용량 5, 초당 5개 채우는 버킷이 가득 차 있다. 한꺼번에 8번 보내면 (5번 허용)'
      - '옮긴 상황: 용량 10, 초당 2개 채우는 버킷을 다 쓴 뒤 3초를 쉬었다. 그다음 한꺼번에 10번 보내면 (6번 허용)'
    body:
      - p: '**토큰 버킷**은 이렇게 동작해요.'
      - ol:
          - '버킷에는 토큰이 최대 **용량**만큼 들어가요.'
          - '토큰은 일정한 **속도**로 채워져요(초당 5개).'
          - '요청마다 토큰 하나를 써요. 토큰이 없으면 거절해요.'
      - p: '오래 쉬면 버킷이 가득 차서 용량만큼 몰아 보낼 수 있고, 그 뒤로는 채워지는 속도만큼만 통과해요. 평균 속도와 순간의 몰림을 함께 다뤄요.'
      - code: bucket
      - p: 'Redis에서는 남은 토큰과 마지막 시각을 해시에 두고, 지난 시각부터 흐른 시간만큼 채우고, 하나 쓰는 일을 **Lua 하나로** 해요. 두 서버가 같은 순간 읽고 쓰면 토큰을 잃으니까요([Redis](lesson:redis-ranking)에서 본 GET 뒤 SET의 문제).'
      - ci:
          key: bucket
          label: 실제 결과 보기
          source: RateLimitTest.bucketRefills
      - p: '가득 찬 버킷에서 8번 중 5번이 허용됐고, 0.4초 뒤에는 그동안 채워진 2개만큼 허용됐어요. 질문 2의 경계 실험에서도 토큰 버킷은 앞의 5번만 허용했어요.'
      - more:
          summary: 슬라이딩 창
          body:
            - p: '고정 창의 경계 문제를 줄이는 다른 방법은 **슬라이딩 창**이에요. "지금부터 지난 1초"를 늘 다시 세요. 요청 시각을 모두 기록하는 로그 방식(Redis Sorted Set)은 정확하지만 메모리를 많이 쓰고, 앞 창과 지금 창의 카운터를 비율로 섞는 카운터 방식은 가볍지만 근삿값이에요.'
      - quiz:
          q: '용량 10, 초당 2개를 채우는 토큰 버킷을 다 쓴 뒤 3초를 쉬었어요. 그다음 한꺼번에 10번 보내면 몇 번 허용되나요?'
          options:
            - '10번'
            - '6번'
            - '2번'
          answer: 2
          explain: '3초 동안 초당 2개씩 6개가 채워졌어요. 용량 10을 넘지 않으니 6번이에요.'
      - next: '방식을 정했어요. 그럼 이 제한을 어디에 두고, 넘은 요청에는 무엇을 돌려줄까요?'
    recall: '토큰 버킷은 버킷에 일정한 속도로 토큰을 채우고 요청마다 하나씩 써요. 오래 쉬면 용량만큼 몰아 보낼 수 있고 그 뒤로는 채우는 속도만큼만 통과해서, 평균과 순간의 몰림을 함께 다루고 창의 경계 문제가 없어요. Redis에서는 남은 토큰과 마지막 시각을 읽고 채우고 쓰는 일을 Lua 하나로 해요.'
  - id: q4
    title: 제한은 어디에 두고, 넘으면 무엇을 돌려주나요?
    conclusion:
      lead: 'IP 단위의 큰 제한은 API 게이트웨이나 로드 밸런서에, 사용자나 API별 제한은 애플리케이션의 필터나 인터셉터에 둬요. 넘으면 429 Too Many Requests와 Retry-After를 돌려줘요.'
      sub: '무엇으로 셀지(사용자 id, IP, API 키)를 정해야 해요. IP로만 세면 같은 회사 사용자들이 함께 막히기도 해요.'
    says:
      - '게이트웨이와 애플리케이션'
      - '429와 Retry-After, 인터셉터로 실제 응답'
    asks:
      - '본문의 예시: 인터셉터가 사용자마다 1초에 3번으로 제한한다. 같은 사용자의 4번째 요청이 받는 응답은 (429와 Retry-After)'
      - '옮긴 상황: 회사 사무실 100명이 같은 공인 IP로 나가는데 IP당 1초에 10번으로 제한했다 (사무실 사용자들이 함께 한도를 나눠 써서 정상 사용자도 막힌다)'
    body:
      - table:
          head: [어디에, 맞는 제한]
          rows:
            - ['API 게이트웨이, 로드 밸런서', 'IP 단위의 큰 제한. 애플리케이션까지 오기 전에 막아 서버를 아낀다']
            - ['애플리케이션의 필터, 인터셉터', '로그인한 사용자, 요금제, API마다 다른 제한. 업무 정보를 안다']
      - p: '무엇으로 셀지도 정해요. 로그인한 서비스는 사용자 id로, 공개 API는 API 키로, 로그인 전 요청은 IP로 세요. IP로만 세면 같은 공인 IP로 나가는 회사나 학교 사용자들이 한도를 나눠 써서 정상 사용자도 막혀요.'
      - h3: 넘으면 429
      - p: '한도를 넘은 요청에는 **429 Too Many Requests**를 돌려줘요([RFC 6585](link:rfc6585)). 언제 다시 보내면 되는지 **Retry-After** 헤더로 알려 줘요([RFC 9110](link:retryAfter)). 클라이언트는 그 시간이 지난 뒤 다시 보내요.'
      - ci:
          key: interceptor
          label: 실제 결과 보기
          source: RateLimitTest.interceptorReturns429
      - p: '세 번은 200, 네 번째는 429와 `Retry-After: 1`이었어요. 인터셉터 코드는 실무 구역에서 봐요.'
      - quiz:
          q: '회사 사무실 100명이 같은 공인 IP로 나가는데, 서비스가 IP당 1초에 10번으로 제한해요. 무슨 일이 생길 수 있나요?'
          options:
            - '사용자마다 10번씩 쓸 수 있다'
            - '사무실 사용자들이 한도를 나눠 써서 정상 사용자도 막힌다'
            - 'IP 제한은 사무실에는 걸리지 않는다'
          answer: 2
          explain: '같은 IP라 하나로 세요. 로그인한 사용자는 사용자 id로 세는 편이 맞아요.'
      - next: '원리는 여기까지예요. 이제 스프링 인터셉터 코드와 흔한 실수를 볼게요.'
    recall: 'IP 단위의 큰 제한은 API 게이트웨이나 로드 밸런서에서 애플리케이션까지 오기 전에 막고, 사용자, 요금제, API마다 다른 제한은 업무 정보를 아는 애플리케이션의 필터나 인터셉터에 둬요. 무엇으로 셀지 정하고(사용자 id, API 키, IP), IP로만 세면 같은 IP의 정상 사용자가 함께 막힐 수 있어요. 넘으면 429와 Retry-After를 돌려줘요.'
practice:
  title: 스프링에서 요청 수를 제한할 때
  says:
    - 'HandlerInterceptor의 preHandle에서 429와 Retry-After. 테스트로 확인'
    - 'Bucket4j 같은 라이브러리. 문서 근거'
    - '흔한 실수: 서버 메모리 맵으로 센다'
  body:
    - p: '스프링 MVC에서는 인터셉터의 `preHandle`에서 한도를 확인하고, 넘으면 응답을 쓰고 `false`를 돌려 컨트롤러로 가지 않게 해요([필터와 인터셉터](lesson:filter-interceptor)).'
    - code: interceptor
      notes:
        - mark: '429'
          as: code
          text: '429 Too Many Requests예요.'
        - mark: '"Retry-After"'
          as: str
          text: '몇 초 뒤에 다시 보내면 되는지 알려 줘요.'
    - p: '토큰 버킷을 직접 짜지 않고 Bucket4j 같은 라이브러리를 쓰기도 해요. Redis 같은 공유 저장소에 버킷을 두는 기능을 제공해요([Bucket4j](link:bucket4j)). 이 라이브러리는 이 레슨의 테스트에 넣지 않아서 문서가 근거예요.'
    - h3: 흔한 실수 하나
    - code: memoryLimiter
      notes:
        - mark: new ConcurrentHashMap<>()
          as: code
          text: '서버 메모리의 맵이에요. 서버마다 따로 세고, 창이 지나도 0으로 돌아가지 않아요.'
    - p: '두 가지가 틀렸어요. 서버가 여러 대면 질문 1처럼 대수만큼 한도가 늘어나요. 그리고 카운터를 다시 0으로 돌리는 일이 없어서, 한 번 5번을 쓰면 영원히 막혀요. 고친 코드는 Redis에 창 번호가 든 키로 세고 만료를 주는 질문 1의 방식이나, 토큰 버킷이에요.'
interview:
  question: 요청 수 제한을 어떻게 설계하나요?
  model:
    - label: 목적
      text: 한 사용자나 IP가 정한 시간에 부를 수 있는 수를 정해 서버와 다른 사용자를 지키고 무차별 대입을 늦춥니다. 서버가 여러 대면 카운터를 Redis 같은 공유 저장소에 둡니다.
    - label: 방식
      text: 고정 창은 창마다 INCR로 세는 단순한 방식이지만, 창이 바뀌는 순간 앞뒤로 몰리면 짧은 시간에 한도의 두 배가 통과합니다. 토큰 버킷은 일정한 속도로 토큰을 채우고 요청마다 하나씩 써서 용량만큼의 몰림과 평균 속도를 함께 다룹니다. Redis에서는 Lua로 한 번에 처리합니다.
    - label: 위치와 응답
      text: IP 단위의 큰 제한은 게이트웨이에, 사용자나 API별 제한은 애플리케이션 인터셉터에 둡니다. 무엇으로 셀지 정하고, 넘으면 429와 Retry-After를 돌려줍니다.
    - label: 경험
      text: '(내 프로젝트로 채우기) 예: 스크립트로 목록 API를 과하게 부르던 사용자 때문에 DB가 느려져, 사용자 id별 토큰 버킷을 Redis에 두고 429를 돌려주게 했습니다.'
verified: 고정 창의 한도, 창 경계의 두 배, 토큰 버킷의 채움, 인터셉터의 429는 Redis 7과 스프링 부트 3.5에서 코드를 돌려 받은 값이에요. 코드가 바뀔 때마다 테스트([RateLimitTest](link:test))가 다시 돌아요.
footer: '근거: 429는 [RFC 6585](link:rfc6585), Retry-After는 [RFC 9110](link:retryAfter), INCR는 [Redis 문서](link:redisIncr), Bucket4j는 [Bucket4j 문서](link:bucket4j). 결과는 테스트로 확인했어요. 오류는 [GitHub 이슈](https://github.com/wanja727/dev-lessons/issues)로 알려 주세요.'
claims:
  - claim: '고정 창 1초 5번에서 6번째부터 거절하고, 다른 사용자는 따로 센다'
    how: 'Redis INCR와 PEXPIRE를 Lua로'
    test: RateLimitTest.fixedWindowLimits
  - claim: '창이 바뀌는 순간 앞뒤 5번씩이면 고정 창은 10번, 토큰 버킷은 5번쯤 허용한다'
    how: '시각을 밀리초 값으로 넘겨 경계를 맞춘다'
    test: RateLimitTest.boundaryBurst
  - claim: '토큰 버킷은 가득 차면 용량만큼, 그 뒤로는 채운 만큼 허용한다'
    how: '용량 5, 초당 5'
    test: RateLimitTest.bucketRefills
  - claim: '인터셉터가 한도를 넘은 요청에 429와 Retry-After를 돌려준다'
    how: 'MiniWeb과 HandlerInterceptor'
    test: RateLimitTest.interceptorReturns429
sources:
  - '429 Too Many Requests: https://www.rfc-editor.org/rfc/rfc6585#section-4'
  - 'Retry-After: https://www.rfc-editor.org/rfc/rfc9110#section-10.2.3'
  - 'Bucket4j: https://bucket4j.com/'
