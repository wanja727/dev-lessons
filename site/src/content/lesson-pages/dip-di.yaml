# 의존 역전 원칙과 의존성 주입
# 자료 파일의 칸은 docs/lesson-data-format.md에 있다. 문제는 content/questions/dip-di.yaml에 있다.
# 설계서는 2026-11-25에 썼고, 사용자가 이번 작업의 설계서 승인을 미리 맡겼다. 설계 때 채운 칸(says, widget, asks, claims, sources)은 남겨 둔다.
title: 의존 역전 원칙과 의존성 주입
description: 구현 클래스를 안에서 직접 만들면 생기는 문제, 의존 역전 원칙에서 무엇이 뒤집히는지, 의존성 주입이 무엇을 쉽게 하는지, 두 말이 어떻게 다른지. 네 가지 질문에 스스로 답할 수 있게 회원 가입 알림 코드를 세 모양으로 바꾸며 배우는 대화형 레슨.
minutes: 20
unit: 객체지향 설계와 패턴
roadmap: O5
type: 설계
prerequisites:
  - {slug: srp-ocp, title: 단일 책임과 개방 폐쇄 원칙}
assume: '자바 21. 인터페이스와 구현 클래스, 다형성(상속과 다형성 레슨), 바뀌는 부분을 인터페이스로 빼는 것(단일 책임과 개방 폐쇄 원칙 레슨). 패키지와 `import`가 무엇인지 알고 있다고 봐요.'
example: '회원 가입을 마치면 환영 메일을 보내는 `SignupService`. 처음에는 서비스 안에서 `new SmtpMailSender()`로 메일 발송 객체를 직접 만들어요. 이것을 인터페이스 `Notifier`에 기대게 바꾸고, 밖에서 넣어 주게 바꿔요. 실무 구역에서는 같은 코드를 스프링 생성자 주입으로 옮겨요.'
intro:
  - '회원 가입 서비스의 테스트를 돌릴 때마다 진짜 메일이 나가요. 메일 서버가 없는 CI에서는 테스트가 실패하고요. 알림을 메일에서 카카오 알림톡으로 바꾸자는 요구가 오자, 가입 서비스 코드를 열어 `new SmtpMailSender()`를 찾아 고쳐야 했어요.'
  - '스프링을 쓰면 `@Autowired`나 생성자로 객체를 받는 코드를 매일 써요. 그런데 왜 직접 `new`하지 않고 받는지, 왜 구현 클래스가 아니라 인터페이스로 받는지를 설명하지 못하면 면접에서 "DI가 무엇인가요"에 "스프링이 넣어 주는 것"이라고만 답하게 돼요. 이 레슨이 그 이유예요.'
  - '이 레슨에서는 같은 가입 서비스를 세 모양으로 바꿔 가며, 테스트에서 가짜 알림 객체로 바꿀 수 있는지, 알림 방식을 바꿀 때 고치는 파일이 무엇인지, 패키지의 `import` 방향이 어떻게 바뀌는지를 확인해요.'
covers:
  - topic: '의존한다는 것: A가 B를 부르거나 만들면 B가 바뀔 때 A도 영향을 받는다'
    where: '질문 1'
  - topic: '구체 클래스를 안에서 직접 만들면 바꿀 수 없다: 테스트에서 가짜로 바꿀 수 없고, 구현을 바꿀 때 쓰는 쪽을 고친다'
    where: '질문 1'
  - topic: '의존 역전 원칙(DIP): 상위 정책이 하위 구현에 기대지 않고 둘 다 추상에 기댄다'
    where: '질문 2'
  - topic: '무엇이 역전되나: 인터페이스를 쓰는 쪽(상위)이 가지면 소스 코드의 의존 방향이 구현에서 정책 쪽으로 바뀐다'
    where: '질문 2'
  - topic: '의존성 주입(DI): 필요한 객체를 스스로 만들지 않고 밖에서 받는다. 생성자 주입, setter 주입, 필드 주입'
    where: '질문 3'
  - topic: '조립하는 곳: 객체를 만들고 이어 주는 코드가 한 곳(main, 설정, 스프링 컨테이너)에 모인다'
    where: '질문 3'
  - topic: '주입받으면 테스트에서 가짜 객체를 넣을 수 있다'
    where: '질문 3. 가짜 객체의 종류는 단위 테스트와 테스트 더블(T2)'
  - topic: 'DIP와 DI는 같은 말이 아니다. 구체 클래스를 주입받으면 DI지만 DIP는 아니다'
    where: '질문 4'
  - topic: '생성자 주입을 권하는 이유: final 필드, 빠진 의존성을 만들 때 알 수 있다, 컨테이너 없이 테스트'
    where: '실무에서는'
  - topic: '필드 주입의 함정: new로 만들면 null'
    where: '실무에서는'
  - topic: '제어의 역전(IoC)과 서비스 로케이터'
    where: '질문 4의 더 알아보기'
  - topic: '스프링 컨테이너가 빈을 찾고 넣는 규칙(@Primary, @Qualifier, 컴포넌트 스캔)'
    where: '다루지 않음: 스프링 빈과 의존성 주입(S2)'
  - topic: '계층 사이의 의존 방향과 패키지 구조'
    where: '다루지 않음: 계층형 아키텍처(A1), 헥사고날 아키텍처(A21)'
links:
  test: https://github.com/wanja727/dev-lessons/blob/main/verification/src/test/java/lab/devlessons/dipdi/DipDiTest.java
  dip: https://web.archive.org/web/20110714224327/http://www.objectmentor.com/resources/articles/dip.pdf
  springDi: https://docs.spring.io/spring-framework/reference/core/beans/dependencies/factory-collaborators.html
  fowler: https://martinfowler.com/articles/injection.html
codes:
  direct: |-
    class SignupService {
      private final SmtpMailSender mail =
          new SmtpMailSender();

      void signup(String email) {
        // 회원 저장
        mail.send(email, "가입을 환영해요");
      }
    }
  inverted: |-
    // 패키지 member
    interface Notifier {
      void notify(String to, String msg);
    }

    class SignupService {
      private final Notifier notifier;

      SignupService(Notifier notifier) {
        this.notifier = notifier;
      }

      void signup(String email) {
        notifier.notify(email,
            "가입을 환영해요");
      }
    }

    // 패키지 infra
    class SmtpNotifier implements Notifier {
      public void notify(String to,
                         String msg) {...}
    }
  assemble: |-
    Notifier notifier = new SmtpNotifier();
    SignupService service =
        new SignupService(notifier);
  fake: |-
    class FakeNotifier implements Notifier {
      List<String> sent = new ArrayList<>();
      public void notify(String to,
                         String msg) {
        sent.add(to);
      }
    }

    var fake = new FakeNotifier();
    new SignupService(fake).signup("a@b.c");
    // fake.sent → [a@b.c]
  concreteDi: |-
    class SignupService {
      private final SmtpMailSender mail;

      SignupService(SmtpMailSender mail) {
        this.mail = mail;
      }
    }
  # 여기부터는 본문 단계에서 더한 코드다
  directMark: |-
    class SignupService {
      private final SmtpMailSender mail =
          [[new SmtpMailSender()]];

      void signup(String email) {
        // 회원 저장
        mail.send(email, "가입을 환영해요");
      }
    }
  invertedMark: |-
    // 패키지 member
    interface [[Notifier]] {
      void notify(String to, String msg);
    }

    class SignupService {
      private final Notifier notifier;

      SignupService(Notifier notifier) {
        this.notifier = notifier;
      }

      void signup(String email) {
        notifier.notify(email,
            "가입을 환영해요");
      }
    }

    // 패키지 infra
    import member.Notifier;

    class SmtpNotifier implements Notifier {
      public void notify(String to,
                         String msg) {...}
    }
  assembleKakao: |-
    Notifier notifier = new KakaoNotifier();
    SignupService service =
        new SignupService(notifier);
  locator: |-
    class SignupService {
      private final Notifier notifier =
          Registry.get(Notifier.class);
    }
  springGood: |-
    @Service
    class SignupService {
      private final Notifier notifier;

      SignupService(Notifier notifier) {
        this.notifier = notifier;
      }
    }

    @Component
    class SmtpNotifier implements Notifier {
      ...
    }
  springField: |-
    @Service
    class SignupService {
      @Autowired
      private Notifier notifier;
    }

    // 테스트
    new SignupService().signup("a@b.c");
predict:
  title: 테스트에서 메일이 안 나가게 할 수 있을까요?
  text: '회원 가입 서비스가 안에서 `new SmtpMailSender()`로 메일 발송 객체를 직접 만들어요. 테스트하면서 메일이 실제로 나가지 않게 하고 싶어요. 가입 서비스 코드를 고치지 않고 테스트 코드만으로 할 수 있을까요? 모르는 게 정상이니 감으로 골라 보세요. 답은 질문 1에 나와요.'
  code: direct
  label: 내 예측
  options:
    - value: can
      label: 할 수 있다
    - value: cannot
      label: 할 수 없다
  answer: cannot
  storageKey: dip-di-predict
  wrong: '"{label}"로 예측했어요. 틀린 예측이 더 오래 남으니 괜찮아요.'
questions:
  - id: q1
    title: 구현 클래스를 안에서 직접 만들면 어떤 문제가 생기나요?
    conclusion:
      lead: '쓰는 쪽이 그 구현에 묶여서, 테스트에서 가짜로 바꿀 수 없고 구현을 바꿀 때마다 쓰는 쪽을 고쳐야 해요.'
      sub: '코드 direct의 가입 서비스는 테스트할 때도 진짜 메일을 보내고, 알림톡으로 바꾸려면 가입 서비스를 열어야 해요.'
    says:
      - 'A가 B를 부르거나 만들면 A는 B에 의존한다. B가 바뀌면 A가 영향을 받는다'
      - '예측의 답을 밝힌다. 코드 direct는 필드를 만들 때 `new SmtpMailSender()`를 한다. 테스트가 이 객체를 다른 것으로 바꿀 길이 없다. 테스트로 `signup`을 부르면 `SmtpMailSender.send`가 불린다'
      - '알림을 알림톡으로 바꾸면 `SignupService`의 필드 타입과 `new`를 고친다. 알림을 보내는 곳이 주문, 배송, 가입 세 서비스면 세 파일을 고친다'
      - '가입 서비스가 하는 일(회원을 저장하고 환영 알림을 보낸다)은 그대로인데, 알림을 어떻게 보내는지가 바뀔 때 가입 서비스를 고친다. 중요한 정책이 덜 중요한 세부에 묶였다'
    asks:
      - '본문의 예시: 코드 direct에서 메일 대신 알림톡으로 바꿀 때 `SignupService` 파일을 고쳐야 하나 (그렇다. 필드 타입과 `new`를 고친다)'
      - '옮긴 상황: `OrderService`가 메서드 안에서 `new TossPaymentClient()`를 만들어 결제를 요청한다. 결제 실패를 테스트하려면 무엇이 필요한가 (실제 토스 서버에서 실패를 일으켜야 한다. 코드를 고치지 않으면 가짜로 바꿀 수 없다)'
    body:
      - p: 'A가 B를 부르거나 만들면 **A는 B에 의존한다**고 해요. B가 바뀌면 A가 영향을 받아요. 가입 서비스는 메일 발송 객체에 의존해요.'
      - code: directMark
        notes:
          - mark: new SmtpMailSender()
            as: code
            text: '가입 서비스가 메일 발송 객체를 직접 만들어요. 밖에서 다른 객체로 바꿀 길이 없어요.'
      - ci:
          key: direct
          label: 테스트에서 signup을 부른 결과 보기
          source: DipDiTest.directCallsRealSender
      - p: '처음에 예측한 답은 **할 수 없다**예요. 서비스가 객체를 만들 때 필드에서 `new SmtpMailSender()`를 하니, 테스트가 무엇을 하든 진짜 발송 코드가 돌아요. {{predict-result}}'
      - p: '알림 방식을 바꿀 때도 같아요. 메일 대신 카카오 알림톡으로 바꾸려면 가입 서비스의 필드 타입과 `new`를 고쳐야 해요. 알림을 보내는 서비스가 가입, 주문, 배송 셋이면 세 파일을 고쳐요.'
      - p: '가입 서비스가 하는 일(회원을 저장하고 환영 알림을 보낸다)은 그대로인데, **알림을 어떻게 보내는지**가 바뀔 때마다 가입 서비스를 고쳐요. 중요한 정책이 덜 중요한 세부에 묶인 거예요.'
      - quiz:
          q: '`OrderService`가 메서드 안에서 `new TossPaymentClient()`를 만들어 결제를 요청해요. 코드를 고치지 않고 "결제 실패" 경우를 테스트하려면 무엇이 필요할까요?'
          options:
            - 테스트에서 가짜 결제 클라이언트를 넘긴다
            - 실제 결제 서버에서 실패를 일으켜야 한다
            - 아무것도 필요 없다
          answer: 2
          explain: '서비스가 구현을 직접 만들어서 테스트가 넘길 자리가 없어요. 코드를 고치지 않으면 진짜 서버에 기대야 해요.'
      - next: '정책이 세부에 묶이지 않게 하려면 의존을 어떻게 바꿔야 할까요?'
    recall: '쓰는 쪽이 그 구현에 묶여요. 가입 서비스가 안에서 `new SmtpMailSender()`를 하면 테스트에서도 진짜 발송 코드가 돌고, 가짜로 바꿀 길이 없어요. 메일을 알림톡으로 바꿀 때마다 가입 서비스를 열어 고쳐야 해서, 중요한 정책이 덜 중요한 세부에 묶여요.'
  - id: q2
    title: 의존 역전 원칙은 무엇이고, 무엇이 역전되나요?
    conclusion:
      lead: '상위 정책이 하위 구현에 기대지 않고, 둘 다 추상(인터페이스)에 기대게 하라는 원칙이에요.'
      sub: '인터페이스를 쓰는 쪽 패키지에 두면 `import`의 방향이 구현에서 정책 쪽으로 뒤집혀요.'
    says:
      - '의존 역전 원칙(DIP)은 두 문장이다. 상위 모듈은 하위 모듈에 기대지 않고 둘 다 추상에 기댄다. 추상은 세부에 기대지 않고 세부가 추상에 기댄다'
      - '상위 정책은 "가입하면 환영 알림을 보낸다", 하위 구현은 "SMTP로 메일을 보낸다"이다'
      - '코드 inverted: `SignupService`는 `Notifier`만 안다. `SmtpNotifier`는 `Notifier`를 구현한다'
      - '역전되는 것: 코드 direct에서는 `member` 패키지가 메일 구현을 `import`했다. 코드 inverted에서는 `Notifier`가 `member` 패키지에 있고 `infra`의 `SmtpNotifier`가 `member.Notifier`를 `import`한다. 실행 중 호출은 여전히 가입 서비스가 메일 구현을 부르지만, 소스 코드의 의존은 반대로 바뀌었다'
      - '그래서 `member` 패키지는 `infra` 없이 컴파일된다. 테스트로 두 패키지를 따로 컴파일한다'
      - '인터페이스의 이름과 메서드는 쓰는 쪽의 말로 짓는다. `SmtpSender.sendMime()`이 아니라 `Notifier.notify()`다'
    widget:
      kind: compare
      note: '왼쪽 칸은 코드 direct, 오른쪽 칸은 코드 inverted다. 칸의 항목은 패키지 member와 infra의 클래스다. "import 방향 보기"를 고르면 다른 패키지를 import하는 클래스에 "import" 태그와 대상이 붙는다(왼쪽은 SignupService가 infra를, 오른쪽은 SmtpNotifier가 member를). "알림톡으로 바꾸기"를 고르면 고치는 파일과 새로 만드는 파일이 붙는다(왼쪽은 SignupService 고침, 오른쪽은 KakaoNotifier 새로 만듦과 조립 코드 고침)'
    asks:
      - '본문의 예시: 코드 inverted에서 `Notifier` 인터페이스는 어느 패키지에 두고, `import`는 어느 쪽에서 어느 쪽으로 하나 (`member`에 둔다. `infra`가 `member`를 import한다)'
      - '옮긴 상황: 주문 정책(`OrderService`)이 결제 대행사 SDK의 `TossClient`를 직접 import한다. 의존 역전 원칙대로 고치면 새로 생기는 것과 그것을 두는 곳은 (`PaymentGateway` 같은 인터페이스를 주문 쪽에 두고, 토스용 구현이 그것을 구현한다)'
    body:
      - p: '**의존 역전 원칙(DIP)**은 두 문장이에요([Robert C. Martin](link:dip)).'
      - ol:
          - '상위 모듈은 하위 모듈에 기대지 않는다. 둘 다 추상에 기댄다.'
          - '추상은 세부에 기대지 않는다. 세부가 추상에 기댄다.'
      - p: '상위 정책은 "가입하면 환영 알림을 보낸다", 하위 세부는 "SMTP로 메일을 보낸다"예요. 둘 사이에 인터페이스 `Notifier`를 둬요.'
      - code: invertedMark
        notes:
          - mark: Notifier
            as: code
            text: '인터페이스를 **쓰는 쪽(member 패키지)**에 둬요. 이름과 메서드도 쓰는 쪽의 말로 지어요.'
      - h3: 무엇이 뒤집히나요?
      - p: '코드 direct에서는 `member` 패키지가 `infra`의 메일 클래스를 `import`했어요. 지금은 `infra`의 `SmtpNotifier`가 `member.Notifier`를 `import`해요. **소스 코드의 의존 방향이 뒤집혔어요.** 실행할 때는 여전히 가입 서비스가 메일 구현을 부르지만, 코드가 기대는 방향은 반대예요.'
      - ci:
          key: packages
          label: 패키지를 따로 컴파일한 결과 보기
          source: DipDiTest.importDirection
      - p: '그래서 `member` 패키지는 `infra` 없이도 컴파일돼요. 메일을 어떻게 보내든 가입 정책 쪽 코드는 영향을 받지 않아요.'
      - p: '아래에서 두 코드를 비교해 보세요.'
      - widget:
          kind: compare
          layout: [selector, sides, verdict]
          selector:
            label: 볼 것
            options:
              - {value: imports, label: import 방향 보기}
              - {value: kakao, label: 알림톡으로 바꾸기}
          sides:
            - label: 코드 direct
              items:
                - {name: member.SignupService, note: 메일 객체를 직접 만든다}
                - {name: infra.SmtpMailSender, note: SMTP로 보낸다}
                - {name: 조립 코드, note: new SignupService()}
            - label: 코드 inverted
              items:
                - {name: member.Notifier, note: 인터페이스}
                - {name: member.SignupService, note: Notifier를 받는다}
                - {name: infra.SmtpNotifier, note: Notifier를 구현}
                - {name: 조립 코드, note: SmtpNotifier를 넘긴다}
          scenes:
            imports:
              sides:
                - marks: [{name: member.SignupService, tag: infra를 import, mark: bad}]
                  result: [{k: 의존 방향, v: member → infra, mark: bad}]
                - marks: [{name: infra.SmtpNotifier, tag: member를 import}]
                  result: [{k: 의존 방향, v: infra → member}]
              verdict: 인터페이스를 쓰는 쪽에 두면 세부(infra)가 정책(member)에 기대요.
            kakao:
              sides:
                - marks: [{name: member.SignupService, tag: 고침, mark: bad}]
                  result: [{k: 정책 쪽 고침, v: '있음', mark: bad}]
                - marks: [{name: 조립 코드, tag: 고침}]
                  add: [{name: infra.KakaoNotifier, note: Notifier를 구현, tag: 새로 만듦}]
                  result: [{k: 정책 쪽 고침, v: '없음'}]
              verdict: 뒤집힌 코드에서는 새 구현을 더하고 조립 코드만 고쳐요.
      - quiz:
          q: '주문 서비스가 결제 대행사 SDK의 `TossClient`를 직접 import해요. 의존 역전 원칙대로 고치면 무엇을 어디에 두나요?'
          options:
            - TossClient를 상속한 클래스를 주문 쪽에 둔다
            - 결제를 요청하는 인터페이스를 주문 쪽에 두고, 토스용 구현이 그것을 구현한다
            - 주문 서비스를 SDK 패키지로 옮긴다
          answer: 2
          explain: '인터페이스를 쓰는 쪽(주문)에 두면 토스용 구현이 주문 쪽 인터페이스를 import해요. 의존 방향이 세부에서 정책으로 바뀌어요.'
      - next: '가입 서비스가 `Notifier`만 안다면, `SmtpNotifier`는 누가 만들어서 넣어 줄까요?'
    recall: '상위 정책이 하위 구현에 기대지 않고 둘 다 인터페이스에 기대게 하라는 원칙이에요. `Notifier`를 쓰는 쪽인 member 패키지에 두면, infra의 `SmtpNotifier`가 member를 import하게 되어 소스 코드의 의존 방향이 뒤집혀요. 그래서 member 패키지는 infra 없이 컴파일되고, 알림 방식이 바뀌어도 정책 쪽 코드는 그대로예요.'
  - id: q3
    title: 의존성 주입은 무엇이고, 무엇이 좋아지나요?
    conclusion:
      lead: '객체가 필요한 것을 스스로 만들지 않고 밖에서 받는 것이에요. 보통 생성자로 받아요.'
      sub: '만들고 잇는 코드가 조립하는 곳 한 곳에 모여서, 테스트에서는 가짜를, 운영에서는 진짜를 넣을 수 있어요.'
    says:
      - '의존성 주입(DI)은 쓸 객체를 생성자, setter, 필드로 받는 것이다. 코드 inverted는 생성자로 받는다'
      - '누가 만드나: 코드 assemble처럼 조립하는 곳이 `SmtpNotifier`를 만들어 넘긴다. 작은 프로그램은 `main`, 스프링에서는 컨테이너가 이 일을 한다'
      - '테스트: 코드 fake처럼 가짜 알림을 넣으면 메일은 나가지 않고 누구에게 보냈는지만 남는다. 질문 1에서 할 수 없던 것이다'
      - '알림톡으로 바꾸기: `KakaoNotifier`를 새로 만들고 조립하는 곳의 `new` 한 줄을 고친다. `SignupService`는 그대로다. 바꾸기 전후 파일을 비교한다'
      - '생성자로 받으면 빠진 의존성은 객체를 만들 때 컴파일 오류나 예외로 드러난다. 필드를 `final`로 둘 수 있다'
    asks:
      - '본문의 예시: 코드 fake로 `signup("a@b.c")`를 부른 뒤 `fake.sent`에는 무엇이 있나 (`[a@b.c]`)'
      - '옮긴 상황: 알림을 쓰는 서비스가 가입, 주문, 배송 셋이고 모두 `Notifier`를 생성자로 받는다. SMTP를 알림톡으로 바꿀 때 세 서비스 가운데 고치는 파일 수는 (0개. 새 구현과 조립 코드만 바뀐다)'
    body:
      - p: '**의존성 주입(DI)**은 객체가 필요한 것을 스스로 만들지 않고 밖에서 받는 것이에요. 생성자로 받는 것이 가장 흔하고, setter나 필드로 받기도 해요. 코드 inverted의 가입 서비스는 생성자로 `Notifier`를 받아요.'
      - p: '그럼 누가 만들까요? **조립하는 곳**이에요. 객체를 만들고 이어 주는 코드가 한 곳에 모여요. 작은 프로그램이라면 `main`, 스프링에서는 컨테이너가 이 일을 해요.'
      - code: assemble
      - p: '이제 질문 1에서 못 했던 일을 할 수 있어요. 테스트는 가짜 알림을 넣어요.'
      - code: fake
      - ci:
          key: fake
          label: 가짜를 넣고 돌린 결과 보기
          source: DipDiTest.fakeNotifier
      - p: '메일은 한 통도 나가지 않고, 누구에게 보내려 했는지만 남아요. 가짜 객체의 종류(목, 스텁 같은 것)는 단위 테스트와 테스트 더블 레슨에서 다뤄요.'
      - p: '알림톡으로 바꿀 때 고치는 파일도 세었어요.'
      - ci:
          key: kakao
          label: 두 코드에서 고친 파일 보기
          source: DipDiTest.switchToKakao
          code: assembleKakao
      - p: '코드 direct는 가입 서비스를 고쳐요. 코드 inverted는 `KakaoNotifier`를 새로 만들고 조립 코드의 `new` 한 줄만 고쳐요. 가입, 주문, 배송 서비스가 모두 `Notifier`를 받는다면 셋 다 그대로예요.'
      - callout: '**생성자로 받으면 빠진 의존성이 일찍 드러나요.** 객체를 만들 때 넘기지 않으면 컴파일되지 않고, 필드를 `final`로 둬서 만든 뒤에 바뀌지 않게 할 수 있어요.'
      - quiz:
          q: '가입, 주문, 배송 세 서비스가 모두 `Notifier`를 생성자로 받아요. SMTP 구현을 알림톡 구현으로 바꿀 때 세 서비스 가운데 몇 파일을 고칠까요?'
          options:
            - 3개
            - 1개
            - 0개
          answer: 3
          explain: '세 서비스는 `Notifier`만 알아요. 새 구현을 만들고 조립하는 곳에서 넘기는 객체만 바꾸면 돼요.'
      - next: 'DIP와 DI는 이름이 비슷한데, 같은 것일까요?'
    recall: '객체가 필요한 것을 스스로 만들지 않고 밖에서 받는 것이에요. 보통 생성자로 받아요. 만들고 잇는 코드가 조립하는 곳 한 곳에 모여서, 테스트에서는 가짜 `Notifier`를 넣어 메일 없이 확인하고, 운영에서는 진짜를 넣어요. 알림톡으로 바꿀 때도 새 구현과 조립 코드만 바뀌고 서비스는 그대로예요.'
  - id: q4
    title: 의존 역전 원칙과 의존성 주입은 같은 것인가요?
    conclusion:
      lead: '아니요. DIP는 무엇에 기댈지(추상)에 대한 원칙이고, DI는 기댈 객체를 어떻게 얻을지(밖에서 받기)에 대한 방법이에요.'
      sub: '구체 클래스를 생성자로 받으면 DI지만 DIP는 아니에요. 둘을 함께 써야 구현을 바꿀 때 쓰는 쪽을 고치지 않아요.'
    says:
      - '코드 concreteDi는 생성자로 받으니 DI다. 하지만 받는 타입이 `SmtpMailSender`라서 알림톡으로 바꾸면 여전히 `SignupService`를 고친다'
      - '반대로 인터페이스에 기대면서 스스로 찾아오는 코드도 있다(`Notifier n = Registry.get(Notifier.class)`). DIP는 지켰지만 주입받지 않는다'
      - '둘을 함께 쓴 코드 inverted만 "구현을 바꿀 때 쓰는 쪽을 고치지 않는다"와 "테스트에서 바꿔 넣는다"를 둘 다 한다'
      - '더 알아보기: 제어의 역전(IoC)은 내 코드가 흐름을 쥐지 않고 프레임워크가 내 코드를 부르는 것이다. DI는 IoC의 한 모양이다. 서비스 로케이터는 주입 대신 찾아오는 방법이고, 쓰는 쪽이 로케이터를 알아야 한다'
    asks:
      - '본문의 예시: 코드 concreteDi에서 알림톡으로 바꿀 때 `SignupService`를 고쳐야 하나, 그리고 이 코드는 DI인가 DIP인가 (고쳐야 한다. DI이고 DIP는 아니다)'
      - '옮긴 상황: 다음 가운데 맞는 말은? 보기: 스프링을 쓰면 DIP가 저절로 지켜진다 / 생성자 주입만 쓰면 DIP를 지킨 것이다 / 인터페이스 타입으로 주입받아야 구현을 바꿀 때 쓰는 쪽을 고치지 않는다 (셋째)'
    body:
      - p: '같지 않아요. **DIP는 무엇에 기댈지**(인터페이스)에 대한 원칙이고, **DI는 기댈 객체를 어떻게 얻을지**(밖에서 받기)에 대한 방법이에요. 하나만 쓸 수도 있어요.'
      - h3: DI지만 DIP는 아닌 코드
      - code: concreteDi
      - p: '생성자로 받으니 DI예요. 하지만 받는 타입이 `SmtpMailSender`라서, 알림톡으로 바꾸려면 여전히 `SignupService`를 고쳐야 해요.'
      - h3: DIP지만 DI는 아닌 코드
      - code: locator
      - p: '인터페이스에 기대지만 스스로 찾아와요. 이런 것을 **서비스 로케이터**라고 해요. 가입 서비스가 `Registry`를 알아야 하고, 생성자만 봐서는 무엇에 기대는지 보이지 않아요.'
      - p: '둘을 함께 쓴 코드 inverted만 "구현을 바꿀 때 쓰는 쪽을 고치지 않는다"와 "테스트에서 바꿔 넣는다"를 둘 다 해요.'
      - more:
          summary: 제어의 역전(IoC)은 또 무엇인가요?
          body:
            - p: '내 코드가 흐름을 쥐고 라이브러리를 부르는 대신, 프레임워크가 흐름을 쥐고 내 코드를 부르는 것을 제어의 역전이라고 해요. 스프링이 내 객체를 만들고 메서드를 불러 주는 것이 그 예예요. DI는 IoC의 한 모양이에요. 마틴 파울러가 이 용어들을 정리했어요([Fowler](link:fowler)).'
      - quiz:
          q: '다음 가운데 맞는 말은 무엇일까요?'
          options:
            - 스프링을 쓰면 DIP가 저절로 지켜진다
            - 생성자 주입만 쓰면 DIP를 지킨 것이다
            - 인터페이스 타입으로 주입받아야 구현을 바꿀 때 쓰는 쪽을 고치지 않는다
          answer: 3
          explain: '구체 클래스를 생성자로 받으면 DI지만, 구현을 바꿀 때 쓰는 쪽의 타입을 고쳐야 해요. 인터페이스에 기대는 것(DIP)과 밖에서 받는 것(DI)을 함께 써야 해요.'
    recall: '아니요. DIP는 무엇에 기댈지(인터페이스)에 대한 원칙이고, DI는 기댈 객체를 어떻게 얻을지(밖에서 받기)에 대한 방법이에요. `SmtpMailSender`를 생성자로 받으면 DI지만 DIP는 아니라서 알림톡으로 바꿀 때 쓰는 쪽을 고쳐요. 인터페이스 타입으로 주입받아야 구현을 바꿀 때 쓰는 쪽이 그대로예요.'
practice:
  title: 스프링의 생성자 주입
  says:
    - '스프링에서는 `@Component`(또는 `@Service`)를 붙인 클래스의 생성자가 하나면 그 생성자로 주입한다. 필드는 `private final`이고 `@Autowired`는 생략한다. `Notifier` 구현이 `@Component`인 `SmtpNotifier` 하나면 그것이 들어간다. 작은 `AnnotationConfigApplicationContext`로 확인한다'
    - '흔한 실수: 필드 주입(`@Autowired private Notifier notifier;`)으로 쓴 서비스를 테스트에서 `new SignupService()`로 만들면 `notifier`가 null이라 `signup`에서 `NullPointerException`이 난다. 컨테이너를 띄워야만 테스트할 수 있다. 고친 코드: 생성자 주입으로 바꾸면 `new SignupService(fake)`로 바로 테스트한다'
    - '스프링 공식 문서도 필수 의존성에는 생성자 주입을 권한다(공식 문서 근거)'
    - '구현이 둘 이상일 때 어느 것을 넣는지의 규칙은 스프링 빈과 의존성 주입(S2)에서 다룬다'
  body:
    - p: '스프링에서는 컨테이너가 조립하는 곳이에요. `@Component`(또는 `@Service`)를 붙인 클래스의 생성자가 하나면 스프링은 그 생성자로 객체를 만들고, 매개변수 타입에 맞는 빈을 넣어 줘요. `@Autowired`는 쓰지 않아도 돼요.'
    - code: springGood
    - ci:
        key: spring
        label: 작은 스프링 컨텍스트로 확인한 결과 보기
        source: DipDiTest.springConstructorInjection
    - p: '`Notifier` 구현이 `SmtpNotifier` 하나라서 그것이 들어갔어요. 구현이 둘 이상이면 스프링이 고를 기준이 필요한데, 그 규칙은 스프링 빈과 의존성 주입 레슨에서 다뤄요.'
    - h3: '흔한 실수: 필드 주입'
    - code: springField
    - ci:
        key: field
        label: 컨테이너 없이 만든 결과 보기
        source: DipDiTest.fieldInjectionNeedsContainer
    - p: '필드 주입은 스프링 컨테이너가 객체를 만든 뒤 필드에 값을 넣는 방식이라, `new`로 만들면 필드가 `null`이에요. 이 서비스를 테스트하려면 컨테이너를 띄워야 해요. 생성자 주입으로 바꾸면 `new SignupService(fake)`로 바로 테스트하고, 필드를 `final`로 둘 수 있어요.'
    - muted: '스프링 공식 문서도 필수 의존성에는 생성자 주입을 쓰라고 권해요([스프링 문서](link:springDi)).'
interview:
  question: 의존 역전 원칙과 의존성 주입이 무엇이고, 둘은 어떻게 다른지 설명해 주세요
  model:
    - label: 정의
      text: 의존 역전 원칙은 상위 정책이 하위 구현에 기대지 않고 둘 다 인터페이스에 기대게 하라는 원칙이고, 의존성 주입은 객체가 필요한 것을 스스로 만들지 않고 생성자 같은 곳으로 밖에서 받는 방법입니다.
    - label: 원리
      text: 서비스가 안에서 구현을 new하면 테스트에서 가짜로 바꿀 수 없고 구현을 바꿀 때마다 서비스를 고칩니다. 인터페이스를 쓰는 쪽 패키지에 두면 구현 패키지가 정책 패키지를 import하게 되어 의존 방향이 뒤집힙니다. 여기에 생성자 주입을 더하면 조립하는 곳에서 테스트용 가짜나 운영용 구현을 넣을 수 있습니다.
    - label: 주의할 점
      text: 구체 클래스를 주입받으면 DI지만 DIP가 아니라서 구현을 바꿀 때 쓰는 쪽을 고칩니다. 스프링에서는 필드 주입보다 생성자 주입을 씁니다. 필드 주입은 new로 만들면 null이라 컨테이너 없이 테스트할 수 없습니다.
    - label: 경험
      text: '(내 프로젝트로 채우기) 예: 알림 발송을 인터페이스로 빼고 생성자로 받게 바꿔, 테스트에서 실제 메일이 나가지 않게 했습니다.'
verified: '이 레슨의 호출 횟수, 패키지별 컴파일 결과, 고친 파일, 스프링이 넣은 객체는 짐작이 아니라 자바 21과 스프링 부트 3.5에서 코드를 돌려 받은 값이에요. 코드가 바뀔 때마다 테스트([DipDiTest](link:test))가 다시 돌아요.'
footer: '근거: 의존 역전 원칙의 정의는 [Robert C. Martin의 글](link:dip), 용어 DI와 IoC는 [Martin Fowler의 글](link:fowler), 생성자 주입 권장은 [스프링 공식 문서](link:springDi). 결과는 OpenJDK 21에서 테스트로 확인했어요. 오류는 [GitHub 이슈](https://github.com/wanja727/dev-lessons/issues)로 알려 주세요.'
claims:
  - claim: '코드 direct의 `signup`은 진짜 `SmtpMailSender.send`를 부른다. 테스트에서 바꿀 수 없다'
    how: '`SmtpMailSender`가 보낸 횟수를 static 카운터로 세어 확인한다'
    test: DipDiTest.directCallsRealSender
  - claim: '코드 inverted에서 `member` 패키지는 `infra` 없이 컴파일되고, `infra`는 `member`가 있어야 컴파일된다'
    how: '`JavaSource`로 패키지별로 컴파일한다'
    test: DipDiTest.importDirection
  - claim: '코드 fake를 넣으면 `sent`에 받는 사람이 남고 메일은 나가지 않는다'
    how: '돌려서 확인한다'
    test: DipDiTest.fakeNotifier
  - claim: '알림톡으로 바꾸면 코드 direct는 `SignupService`를, 코드 inverted는 조립 코드를 고치고 `KakaoNotifier`가 새로 생긴다'
    how: '바꾸기 전후 패키지를 비교한다'
    test: DipDiTest.switchToKakao
  - claim: '스프링이 생성자 하나인 `@Component`에 `Notifier` 구현을 넣는다'
    how: '`AnnotationConfigApplicationContext`로 빈을 꺼내 확인한다'
    test: DipDiTest.springConstructorInjection
  - claim: '필드 주입 서비스를 `new`로 만들어 부르면 `NullPointerException`'
    how: '돌려서 확인한다'
    test: DipDiTest.fieldInjectionNeedsContainer
sources:
  - 'DIP의 정의: Robert C. Martin, The Dependency Inversion Principle (1996) https://web.archive.org/web/20110714224327/http://www.objectmentor.com/resources/articles/dip.pdf'
  - '의존성 주입과 생성자 주입 권장: 스프링 공식 문서 https://docs.spring.io/spring-framework/reference/core/beans/dependencies/factory-collaborators.html'
  - '용어 DI와 IoC: Martin Fowler, Inversion of Control Containers and the Dependency Injection pattern https://martinfowler.com/articles/injection.html'
