# 자바 17과 21에서 달라진 것
# 자료 파일의 칸은 docs/lesson-data-format.md에 있다. 문제는 content/questions/modern-java.yaml에 있다.
title: 자바 17과 21에서 달라진 것
description: sealed가 무엇을 정하는지, switch 패턴 매칭이 instanceof 사슬과 무엇이 다른지, record 패턴으로 무엇을 할 수 있는지, 셋을 함께 쓰면 무엇이 달라지는지. 네 가지 질문에 스스로 답할 수 있게, 결제 결과에 종류를 하나 추가해 보며 배우는 대화형 레슨.
unit: 자바 언어
minutes: 22
roadmap: J18
type: 자바 실행
prerequisites:
  - {slug: immutable-object, title: 불변 객체}
  - {slug: inheritance-polymorphism, title: 상속과 다형성}
assume: '자바 21. 미리 보기(preview) 기능은 켜지 않아요. record가 무엇을 만들어 주는지(불변 객체 레슨), `instanceof`와 오버라이딩(상속과 다형성 레슨), enum의 switch 식은 상수를 빠뜨리면 컴파일 오류가 난다는 것(enum 레슨).'
example: '결제 요청의 결과 `PaymentResult`. 승인(`Approved`), 거절(`Declined`), 오류(`Failed`) 셋 가운데 하나이고, 종류마다 담는 데이터가 달라요. 결과를 받아 종류별로 처리하는 코드를 `instanceof` 사슬과 switch로 써서 견주고, 나중에 네 번째 종류를 추가해 봐요. 실무 구역에서는 서비스가 이 결과를 돌려주고 컨트롤러가 응답으로 바꿔요.'
intro:
  - '결제 결과에 "보류"라는 종류를 하나 추가했어요. 결과를 종류별로 처리하는 곳이 코드에 일곱 군데 있었는데 여섯 군데만 고쳤어요. 빠뜨린 한 곳은 `else`로 떨어져서 보류된 결제를 실패로 처리했고, 컴파일러는 아무 말도 하지 않았어요.'
  - '스프링 부트 3은 자바 17 이상을 요구하고, 새 프로젝트는 대부분 21로 시작해요. 자바 8로 배운 사람에게 낯선 문법이 코드 리뷰와 면접에 나와요. record, sealed, switch 패턴 매칭이 그것이고, 셋을 함께 쓰면 "종류가 정해진 데이터"를 다루는 방식이 달라져요.'
  - '이 레슨에서는 종류를 하나 추가했을 때 빠뜨린 곳을 컴파일러가 찾아 주는지 아닌지를 코드로 확인하면서 세 문법을 차례로 봐요.'
covers:
  - topic: '자바 8 뒤에 들어온 것과 버전: var(10), switch 식(14), 텍스트 블록(15), record와 instanceof 패턴(16), sealed(17), switch 패턴 매칭과 record 패턴(21)'
    where: '머리의 전제와 실무에서는의 표'
  - topic: 'sealed 클래스와 인터페이스: 상속할 수 있는 타입을 permits로 정해 둔다'
    where: '질문 1'
  - topic: 'sealed의 자식은 final, sealed, non-sealed 가운데 하나여야 한다. record는 final이다'
    where: '질문 1'
  - topic: 'sealed와 enum의 차이: enum은 값마다 객체 하나, sealed는 종류마다 다른 데이터를 가진 객체 여럿'
    where: '질문 1'
  - topic: 'switch 식: 값을 돌려준다, 화살표는 아래로 흘러내리지 않는다, yield'
    where: '질문 2'
  - topic: 'switch의 타입 패턴: 타입으로 가르면서 그 타입의 변수에 담는다. instanceof 패턴과의 관계'
    where: '질문 2'
  - topic: 'sealed 타입의 switch는 모든 자식을 다뤄야 컴파일된다. default가 없어도 된다'
    where: '질문 2'
  - topic: '가드(when), null을 받는 case null, 넓은 타입의 case를 먼저 쓰면 컴파일 오류'
    where: '질문 2'
  - topic: 'record 패턴: 타입을 확인하면서 구성 요소를 변수로 꺼낸다. 중첩해서 꺼내기'
    where: '질문 3'
  - topic: 'record의 기본(만들어 주는 것, 간결한 생성자)'
    where: '질문 3에서 한 줄. 자세한 것은 불변 객체(J9)'
  - topic: '셋을 함께 쓰기: 종류를 추가하면 다루지 않은 switch가 컴파일 오류로 드러난다'
    where: '질문 4'
  - topic: '오버라이딩(다형성)으로 푸는 것과 switch로 푸는 것의 차이: 종류를 추가하기 쉬운가, 동작을 추가하기 쉬운가'
    where: '질문 4'
  - topic: 'default를 넣으면 완전성 검사가 꺼진다'
    where: '질문 4, 실무에서는'
  - topic: '따로 컴파일된 코드에서 모르는 자식이 오면 MatchException'
    where: '질문 4의 더 알아보기'
  - topic: '스프링에서: 서비스의 결과 타입을 sealed와 record로, 컨트롤러에서 switch로 응답 만들기'
    where: '실무에서는'
  - topic: '그 밖에 자주 쓰는 것: var, 텍스트 블록, Stream.toList, 순서 있는 컬렉션의 getFirst와 getLast'
    where: '실무에서는의 표'
  - topic: '자바 8이나 11에서 17과 21로 올릴 때 만나는 것(javax에서 jakarta로, 미리 보기 기능은 쓰지 않는다)'
    where: '실무에서는'
  - topic: '가상 스레드(자바 21)'
    where: '다루지 않음: 가상 스레드(C12)'
  - topic: 'JPA 엔티티를 record나 sealed로 만들 수 없는 것'
    where: '다루지 않음: 불변 객체(J9)'
  - topic: '종류마다 다른 동작을 객체로 빼는 설계'
    where: '다루지 않음: 전략 패턴(O7)'
  - topic: '새 종류를 더할 때 기존 코드를 고치지 않는 설계 원칙'
    where: '다루지 않음: 단일 책임과 개방 폐쇄 원칙(O3)'
codes:
  sealed: |-
    sealed interface PaymentResult
        [[permits Approved, Declined, Failed]] {}

    record Approved(String txId, long amount)
        implements PaymentResult {}
    record Declined(String reason)
        implements PaymentResult {}
    record Failed(Exception cause)
        implements PaymentResult {}
  chain: |-
    String message(PaymentResult r) {
      if (r instanceof Approved a) {
        return "승인 " + a.txId();
      } else if (r instanceof Declined d) {
        return "거절 " + d.reason();
      } [[else]] {
        return "오류";
      }
    }
  switchType: |-
    String message(PaymentResult r) {
      return switch (r) {
        case Approved a ->
            "승인 " + a.txId();
        case Declined d ->
            "거절 " + d.reason();
        case Failed f -> "오류";
      };
    }
  recordPattern: |-
    String message(PaymentResult r) {
      return switch (r) {
        case Approved(String txId, long amount)
            [[when amount >= 1_000_000]] ->
            "고액 승인 " + txId;
        case Approved(String txId, long amount)
            -> "승인 " + txId;
        case Declined(String reason) ->
            "거절 " + reason;
        case Failed(Exception cause) -> "오류";
      };
    }
  added: |-
    sealed interface PaymentResult
        permits Approved, Declined, Failed,
            [[Pending]] {}

    record Pending(String txId)
        implements PaymentResult {}
  predictRun: |-
    // 코드 added를 적용하고
    // chain과 switchType은 그대로 둔 채
    // 컴파일한다
  refunded: |-
    // permits는 그대로
    record Refunded(long amount)
        implements PaymentResult {}
  shape: |-
    sealed class Shape
        permits Circle, Square {}

    class Circle extends Shape {}
    final class Square extends Shape {}
  switchExpr: |-
    int fee = switch (grade) {
      case BASIC -> 3000;
      case VIP -> {
        log("VIP 무료");
        [[yield 0;]]
      }
    };
  agreeRun: |-
    // 세 결과를 두 메서드에 넘긴다
    new Approved("T1", 10_000)
    new Declined("잔액 부족")
    new Failed(new IllegalStateException())
  dominated: |-
    return switch (o) {
      case Object x -> "객체";
      [[case String s]] -> "문자열";
    };
  caseNull: |-
    return switch (r) {
      [[case null]] -> "결과 없음";
      case Approved a -> ...
      ...
    };
  nullRun: |-
    message(null);
  recordRun: |-
    message(new Approved("T1", 2_000_000));
    message(new Approved("T2", 10_000));
  nested: |-
    record Member(String name) {}
    record Money(long amount) {}
    record Order(Member member, Money total) {}

    if (o instanceof Point(int x, int y)) {
      print(x + y);
    }

    case Order(Member(String name),
               Money(long amount)) ->
        name + "님 " + amount + "원";
  underscore: |-
    case Approved(var txId, [[_]]) ->
        "승인 " + txId;
  withDefault: |-
    return switch (r) {
      case Approved a -> "승인 " + a.txId();
      case Declined d -> "거절 " + d.reason();
      [[default]] -> "오류";
    };
  overriding: |-
    sealed interface PaymentResult
        permits Approved, Declined, Failed {
      String message();
    }

    record Approved(String txId, long amount)
        implements PaymentResult {
      public String message() {
        return "승인 " + txId;
      }
    }
  controller: |-
    @PostMapping("/payments")
    ResponseEntity<?> pay(...) {
      PaymentResult result = service.pay(...);
      return switch (result) {
        case Approved a ->
            ResponseEntity.ok(view(a));
        case Declined d ->
            ResponseEntity.status(402)
                .body(error(d.reason()));
        case Failed f ->
            ResponseEntity.status(502)
                .body(error("결제사 오류"));
      };
    }
  controllerRun: |-
    // 서비스가 세 결과를 각각 돌려줄 때
    POST /payments
  smallRun: |-
    var orders = new ArrayList<String>();
    orders.getFirst(); orders.getLast();
    String json = """
        {"id": 1,
         "status": "PAID"}""";
    Stream.of("a", "b")
        .map(String::toUpperCase).toList();
    order.member().name().length();
