predict:
  title: 종류를 하나 추가하면 어떻게 될까요?
  text: '`PaymentResult`를 처리하는 메서드가 둘 있어요. 하나는 `instanceof`와 `else`로, 하나는 `default` 없는 switch로 썼어요. 이제 네 번째 종류 `Pending`을 추가하고 두 메서드는 고치지 않은 채 컴파일했어요. 어떻게 될까요? 모르는 게 정상이니 감으로 골라 보세요. 답은 질문 2에 나와요.'
  code: added
  label: 내 예측
  options:
    - value: both-ok
      label: 둘 다 컴파일된다
    - value: both-error
      label: 둘 다 컴파일 오류
    - value: chain-error
      label: instanceof 쪽만 컴파일 오류
    - value: switch-error
      label: switch 쪽만 컴파일 오류
  answer: switch-error
  storageKey: modern-predict
  wrong: 예측은 "{label}"이었어요. 틀린 예측이 더 오래 남으니 괜찮아요.
questions:
  - id: q1
    title: 'sealed는 무엇을 정하나요?'
    conclusion:
      lead: '그 타입을 상속하거나 구현할 수 있는 타입을 `permits`에 적은 것으로 한정해요.'
      sub: '자식이 무엇무엇인지를 컴파일러가 전부 알게 되고, 그 사실을 switch가 이용해요.'
    says:
      - '보통의 인터페이스는 누구나 구현할 수 있다. `PaymentResult`가 승인, 거절, 오류 셋뿐이라는 것은 개발자의 머릿속에만 있고 컴파일러는 모른다'
      - '코드 sealed. `sealed interface PaymentResult permits Approved, Declined, Failed`는 셋만 구현할 수 있다고 선언한다. 다른 클래스가 `implements PaymentResult`를 쓰면 컴파일 오류다'
      - '허용된 자식은 자기가 어디까지 열려 있는지를 밝혀야 한다. 더 상속하지 못하는 `final`, 다시 정해 둔 자식만 허용하는 `sealed`, 누구나 상속하게 푸는 `non-sealed` 가운데 하나다. record는 언제나 final이라 따로 쓰지 않는다'
      - '같은 파일 안에 자식을 모두 선언하면 `permits`를 생략할 수 있다'
      - 'enum과 견준다. enum도 "정해진 몇 가지"다. enum은 값마다 객체가 하나이고 모든 값이 같은 필드를 가진다(J8). sealed는 종류마다 다른 데이터를 가진 객체를 여러 개 만든다. 승인은 거래 번호와 금액을, 거절은 사유를 가진다. 종류마다 담을 것이 다르면 sealed, 이름만 구별하면 enum이다'
      - '`final`과도 견준다. `final`은 아무도 상속하지 못하게 하고, sealed는 정해 둔 타입만 상속하게 한다'
    asks:
      - '본문의 예시: 코드 sealed가 있는 프로젝트에서 `record Refunded(long amount) implements PaymentResult {}`를 새로 선언하고 `permits`는 고치지 않았다. 컴파일하면 어떻게 되나 (컴파일 오류. `Refunded`는 허용된 자식이 아니다)'
      - '옮긴 상황: `sealed class Shape permits Circle, Square {}`에서 `class Circle extends Shape {}`처럼 `final`, `sealed`, `non-sealed` 가운데 아무것도 쓰지 않으면 어떻게 되나 (컴파일 오류. 셋 가운데 하나를 밝혀야 한다)'
    body:
      - p: '보통의 인터페이스는 누구나 구현할 수 있어요. `PaymentResult`가 승인, 거절, 오류 셋뿐이라는 것은 개발자의 머릿속에만 있고 컴파일러는 몰라요. **sealed**는 그 목록을 코드에 적어요.'
      - code: sealed
        notes:
          - mark: permits Approved, Declined, Failed
            as: code
            text: '이 셋만 `PaymentResult`를 구현할 수 있어요. 자바 17부터예요.'
      - p: '목록에 없는 타입이 구현하려 하면 컴파일 오류예요. `permits`를 고치지 않고 환불 결과를 하나 더 선언해 봤어요.'
      - code: refunded
      - ci:
          key: sealed-rules
          label: 실제 컴파일 결과 보기
          source: ModernJavaTest.sealedRules
          code: refunded
      - h3: 자식은 어디까지 열려 있는지 밝혀요
      - p: '허용된 자식은 자기 아래로 상속을 어디까지 허락하는지 밝혀야 해요. 위 결과의 둘째 줄처럼, 아무것도 쓰지 않은 `class Circle`은 컴파일되지 않아요.'
      - code: shape
      - table:
          head: [자식에 쓰는 것, 뜻]
          rows:
            - ['`final`', '더는 상속하지 못해요']
            - ['`sealed ... permits ...`', '다시 정해 둔 자식만 상속해요']
            - ['`non-sealed`', '그 아래로는 누구나 상속하게 풀어요']
      - p: '**record는 언제나 `final`**이라서 따로 쓰지 않아도 돼요. 코드 sealed의 세 record가 그래요. 자식을 모두 같은 파일에 선언하면 `permits`를 생략할 수도 있어요.'
      - h3: enum과는 무엇이 다른가요
      - p: 'enum도 "정해진 몇 가지"예요. 다른 점은 **종류마다 담는 데이터**예요.'
      - ul:
          - '**enum은 값마다 객체가 하나**이고 모든 값이 같은 필드를 가져요(enum 레슨). `PAID`는 프로그램에 하나뿐이에요.'
          - '**sealed는 종류마다 다른 데이터를 가진 객체를 여러 개** 만들어요. 승인은 거래 번호와 금액을, 거절은 사유를, 오류는 원인 예외를 가져요. 승인 결과는 결제마다 새로 만들어져요.'
      - p: '종류마다 담을 것이 다르면 sealed, 이름만 구별하면 enum이에요. `final`과 견주면, `final`은 아무도 상속하지 못하게 하고 sealed는 정해 둔 타입만 상속하게 해요.'
      - quiz:
          q: '`sealed class Shape permits Circle, Square {}`에서 `class Circle extends Shape {}`처럼 아무 말도 붙이지 않으면 어떻게 될까요?'
          options:
            - 컴파일된다. 기본이 final이다
            - 컴파일 오류. final, sealed, non-sealed 가운데 하나를 밝혀야 한다
            - 컴파일되고 누구나 Circle을 상속할 수 있다
          answer: 2
          explain: '허용된 자식 클래스는 셋 가운데 하나를 꼭 적어야 해요. record는 언제나 final이라 적지 않아도 돼요.'
      - next: '이제 컴파일러는 `PaymentResult`의 자식이 셋뿐이라는 것을 알아요. 이것을 어디에 쓸까요?'
    recall: 'sealed는 그 타입을 상속하거나 구현할 수 있는 타입을 `permits`에 적은 것으로 한정해요. 목록에 없는 타입이 구현하면 컴파일 오류이고, 허용된 자식 클래스는 `final`, `sealed`, `non-sealed` 가운데 하나를 밝혀야 해요(record는 언제나 final). enum은 값마다 객체 하나이고, sealed는 종류마다 다른 데이터를 가진 객체를 여럿 만들어요.'
  - id: q2
    title: 'switch 패턴 매칭은 instanceof 사슬과 무엇이 다른가요?'
    conclusion:
      lead: '타입으로 가르면서 그 타입의 변수에 바로 담는 것은 같지만, switch는 모든 경우를 다뤘는지를 컴파일러가 검사해요.'
      sub: 'sealed 타입을 `default` 없이 switch하면, 다루지 않은 자식이 있을 때 컴파일되지 않아요.'
    says:
      - '먼저 switch 식. `return switch (x) { case A -> 1; case B -> 2; };`는 값을 돌려준다. 화살표(`->`)를 쓴 case는 다음 case로 흘러내리지 않아서 `break`가 없다. 여러 줄이 필요하면 중괄호 안에서 `yield 값;`으로 돌려준다. 값을 돌려줘야 하므로 모든 경우를 다뤄야 한다. J8에서 enum으로 본 것이다'
      - '코드 chain의 `r instanceof Approved a`는 타입을 확인하고 맞으면 `a`에 담는다. 형변환을 따로 쓰지 않는다(J7). 자바 16부터다'
      - '코드 switchType은 같은 일을 switch로 쓴다. `case Approved a ->`가 타입 패턴이다. 자바 21부터다'
      - '차이는 빠뜨렸을 때다. 코드 chain의 마지막 `else`는 "나머지 전부"다. `Failed`를 뜻하고 썼지만 컴파일러가 보기에는 무엇이든 받는다. 코드 switchType에는 그런 자리가 없다. sealed의 자식 셋을 모두 썼기 때문에 `default` 없이 컴파일된다'
      - '코드 added로 `Pending`을 추가하면 코드 switchType은 "모든 경우를 다루지 않았다"는 컴파일 오류가 난다. 코드 chain은 컴파일되고 `Pending`을 "오류"로 처리한다. 예측의 답을 밝힌다'
      - '가드. `case Approved a when a.amount() >= 1_000_000 ->`처럼 조건을 더한다. 위에서부터 맞는 첫 case가 실행되므로 조건이 있는 것을 먼저 쓴다'
      - '순서. 넓은 타입의 case를 좁은 타입보다 먼저 쓰면 뒤의 case에 닿을 수 없어 컴파일 오류다. J10에서 `catch`의 순서와 같은 이유다'
      - 'null. switch에 null이 들어오면 `NullPointerException`이다. 받으려면 `case null ->`을 쓴다'
    asks:
      - '본문의 예시: 코드 added를 적용한 뒤 코드 chain의 `message`에 `new Pending("T1")`을 넘기면 무엇이 반환되나 ("오류". `else`로 떨어진다)'
      - '옮긴 상황: `Object o`에 대해 `switch (o) { case Object x -> "객체"; case String s -> "문자열"; }`을 쓰면 어떻게 되나 (컴파일 오류. `Object`의 case가 앞에서 모두 받아서 `String`의 case에 닿을 수 없다)'
    body:
      - p: '먼저 **switch 식**이에요(자바 14). enum 레슨에서 본 모양이에요.'
      - code: switchExpr
        notes:
          - mark: yield 0;
            as: code
            text: '여러 줄이 필요하면 중괄호 안에서 `yield`로 값을 돌려줘요.'
      - ul:
          - '**값을 돌려줘요.** `int fee = switch ...`처럼 식으로 써요.'
          - '**화살표(`->`)는 흘러내리지 않아요.** 다음 case로 넘어가지 않아서 `break`가 없어요.'
          - '**모든 경우를 다뤄야 해요.** 값을 돌려줘야 하니 빠진 경우가 있으면 컴파일 오류예요.'
      - h3: 타입으로 가르기
      - p: '결과를 종류별로 처리하는 두 방법이에요. 하나는 `instanceof` 패턴(자바 16), 하나는 switch의 타입 패턴(자바 21)이에요. 둘 다 타입을 확인하면서 그 타입의 변수(`a`, `d`)에 바로 담아요. 형변환을 따로 쓰지 않아요.'
      - code: chain
        notes:
          - mark: else
            as: code
            text: '`Failed`를 뜻하고 썼지만, 컴파일러가 보기에는 "나머지 전부"예요.'
      - code: switchType
      - ci:
          key: agree
          label: 두 메서드의 실제 결과 보기
          source: ModernJavaTest.chainAndSwitchAgree
          code: agreeRun
      - p: '지금은 결과가 같아요. 다른 것은 **빠뜨렸을 때**예요. switch에는 `else` 같은 "나머지 전부"의 자리가 없어요. sealed의 자식 셋을 모두 썼기 때문에 `default` 없이 컴파일됐어요.'
      - h3: 종류를 하나 추가하면
      - p: '처음 예측의 답은 **switch 쪽만 컴파일 오류**예요. {{predict-result}}'
      - ci:
          key: predict
          label: 실제 컴파일 결과 보기
          source: ModernJavaTest.addingPending
          code: predictRun
      - p: '`Pending`을 `permits`에 추가하자 switch는 "모든 경우를 다루지 않았다"는 오류를 냈어요. `instanceof` 사슬은 아무 말 없이 컴파일됐고, `Pending`을 `else`로 받아 **"오류"**로 처리했어요. 도입부의 사고가 이거예요.'
      - h3: 가드, 순서, null
      - ul:
          - '**가드.** `case Approved a when a.amount() >= 1_000_000 ->`처럼 조건을 더해요. 위에서부터 맞는 첫 case가 실행되니, 조건이 있는 것을 먼저 써요(질문 3에서 봐요).'
          - '**순서.** 넓은 타입의 case를 좁은 타입보다 먼저 쓰면 뒤의 case에 닿을 수 없어서 컴파일 오류예요. 예외 레슨에서 `catch`의 순서가 그랬던 것과 같아요.'
          - '**null.** switch에 null이 들어오면 `NullPointerException`이에요. 받으려면 `case null ->`을 써요.'
      - code: dominated
        notes:
          - mark: case String s
            as: code
            text: '앞의 `case Object x`가 문자열까지 모두 받아서 여기에 닿을 수 없어요.'
      - ci:
          key: order
          label: 실제 컴파일 결과 보기
          source: ModernJavaTest.orderAndNull
          code: dominated
      - code: caseNull
        notes:
          - mark: case null
            as: code
            text: 'null을 받는 case예요. 없으면 switch가 `NullPointerException`을 던져요.'
      - ci:
          key: 'null'
          label: null을 넘긴 실제 결과 보기
          source: ModernJavaTest.orderAndNull
          code: nullRun
      - quiz:
          q: '`Pending`을 추가한 뒤, `instanceof`와 `else`로 쓴 `message`에 `new Pending("T1")`을 넘기면 무엇이 반환될까요?'
          options:
            - 컴파일 오류라 실행할 수 없다
            - '"오류". else로 떨어진다'
            - MatchException
          answer: 2
          explain: '`else`는 무엇이든 받아서 컴파일러가 빠뜨린 것을 알려 주지 못해요. 보류된 결제가 오류로 처리돼요.'
      - next: '`case Approved a`로 받은 뒤 `a.txId()`, `a.amount()`를 부르는 것도 줄일 수 있어요. record는 무엇으로 이루어졌는지가 선언에 드러나 있거든요.'
    recall: '둘 다 타입을 확인하면서 그 타입의 변수에 바로 담지만, switch는 모든 경우를 다뤘는지를 컴파일러가 검사해요. sealed 타입을 `default` 없이 switch하면 다루지 않은 자식이 있을 때 컴파일되지 않고, `instanceof` 사슬은 `else`가 새 종류를 조용히 받아요. 넓은 타입의 case를 먼저 쓰면 컴파일 오류이고, null은 `case null`로 받아요.'
  - id: q3
    title: record 패턴으로 무엇을 할 수 있나요?
    conclusion:
      lead: '타입을 확인하면서 record의 구성 요소를 변수로 바로 꺼낼 수 있어요.'
      sub: '`case Approved(String txId, long amount)`는 `Approved`인지 확인하고 `txId`와 `amount`를 한 번에 꺼내요.'
    says:
      - 'record는 구성 요소로 이루어진 불변 데이터다(J9). 무엇으로 이루어졌는지가 선언에 드러나 있어서 컴파일러가 거꾸로 풀어 줄 수 있다'
      - '코드 recordPattern. `case Approved a`로 받아 `a.txId()`를 부르던 것을 `case Approved(String txId, long amount)`로 쓰면 구성 요소가 변수에 담긴다. 자바 21부터다'
      - '가드와 함께 쓴다. `when amount >= 1_000_000`에서 꺼낸 변수를 바로 쓴다'
      - '`instanceof`에도 쓴다. `if (r instanceof Declined(String reason))`'
      - '중첩. 구성 요소가 record면 안쪽까지 한 번에 꺼낸다. `record Order(Member member, Money total)`에 대해 `case Order(Member(String name), Money(long amount))`'
      - '타입을 `var`로 줄일 수 있다. `case Approved(var txId, var amount)`'
      - '쓰지 않는 구성 요소를 밑줄(`_`)로 비우는 문법은 자바 21에서는 미리 보기라서 쓰지 않는다. 자바 22부터 정식이다'
    asks:
      - '본문의 예시: 코드 recordPattern의 `message`에 `new Approved("T1", 2_000_000)`을 넘기면 무엇이 반환되나 ("고액 승인 T1")'
      - '옮긴 상황: `record Point(int x, int y) {}`와 `Object o = new Point(3, 4);`에 대해 `if (o instanceof Point(int x, int y)) { print(x + y); }`를 실행하면 무엇이 출력되나 (7)'
    body:
      - p: 'record는 구성 요소로 이루어진 불변 데이터예요(불변 객체 레슨). **무엇으로 이루어졌는지가 선언에 드러나** 있어서, 컴파일러가 거꾸로 풀어 줄 수 있어요. 그것이 **record 패턴**이에요(자바 21).'
      - code: recordPattern
        notes:
          - mark: when amount >= 1_000_000
            as: code
            text: '꺼낸 `amount`를 가드에서 바로 써요. 조건이 있는 case를 먼저 둬요.'
      - p: '`case Approved a`로 받은 뒤 `a.txId()`를 부르던 것이, `case Approved(String txId, long amount)`로 타입 확인과 꺼내기를 한 번에 해요. 두 금액으로 돌려 봤어요.'
      - ci:
          key: record-pattern
          label: 실제 결과 보기
          source: ModernJavaTest.recordPatterns
          code: recordRun
      - h3: instanceof에도, 중첩으로도
      - code: nested
      - ci:
          key: nested
          label: 실제 결과 보기
          source: ModernJavaTest.recordPatterns
          code: nested
      - ul:
          - '**`instanceof`에도 써요.** `if (o instanceof Point(int x, int y))`는 `Point`인지 확인하고 `x`와 `y`를 꺼내요.'
          - '**중첩해서 꺼내요.** 구성 요소가 record면 `Order(Member(String name), Money(long amount))`처럼 안쪽까지 한 번에 꺼내요.'
          - '**타입은 `var`로 줄여요.** `case Approved(var txId, var amount)`도 돼요.'
      - h3: 밑줄은 아직 쓰지 않아요
      - p: '쓰지 않는 구성 요소를 밑줄(`_`)로 비우는 문법은 자바 21에서는 **미리 보기**라서 옵션 없이는 컴파일되지 않아요. 자바 22부터 정식이에요([JEP 443](link:jep443)).'
      - code: underscore
      - ci:
          key: underscore
          label: 실제 컴파일 결과 보기
          source: ModernJavaTest.underscoreIsPreview
          code: underscore
      - quiz:
          q: '`record Point(int x, int y) {}`와 `Object o = new Point(3, 4);`에 대해 `if (o instanceof Point(int x, int y)) { print(x + y); }`를 실행하면 무엇이 출력될까요?'
          options:
            - '7'
            - '34'
            - 컴파일 오류
          answer: 1
          explain: 'record 패턴이 `Point`인지 확인하고 `x`에 3, `y`에 4를 꺼내요.'
      - next: 'sealed, switch, record를 하나씩 봤어요. 셋을 함께 쓰면 도입부의 사고가 어떻게 달라질까요?'
    recall: 'record 패턴은 타입을 확인하면서 record의 구성 요소를 변수로 바로 꺼내요. `case Approved(String txId, long amount)`처럼 쓰고, 가드에서 꺼낸 변수를 쓰고, `instanceof`에도 쓰고, 안쪽 record까지 중첩해서 꺼내요. 쓰지 않는 구성 요소를 비우는 밑줄은 자바 21에서는 미리 보기라 쓰지 않아요.'
  - id: q4
    title: 세 가지를 함께 쓰면 무엇이 달라지나요?
    conclusion:
      lead: '종류를 하나 추가했을 때 그 종류를 다루지 않은 모든 switch가 컴파일 오류로 드러나요.'
      sub: 'sealed가 종류의 목록을 컴파일러에게 알려 주고, record가 종류마다의 데이터를 담고, switch가 빠뜨린 것이 없는지 검사하기 때문이에요.'
    says:
      - '도입부의 사고를 다시 본다. 처리하는 곳이 일곱 군데이고 모두 코드 chain의 모양이면, 종류를 추가했을 때 고칠 곳을 사람이 검색해서 찾아야 한다. 일곱 군데가 코드 switchType의 모양이면 컴파일러가 일곱 군데를 모두 짚어 준다'
      - '단, `default`를 쓰면 이 검사가 꺼진다. `default`가 새 종류를 조용히 받아 준다. sealed 타입의 switch에는 `default`를 쓰지 않는다'
      - '오버라이딩과 견준다(J7). `PaymentResult`에 `message()` 메서드를 두고 종류마다 구현해도 같은 결과가 나온다. 이때 종류를 추가하면 새 클래스가 메서드를 구현해야 해서 역시 빠뜨릴 수 없다'
      - '둘의 차이는 무엇을 추가하기 쉬운가다. 오버라이딩은 동작을 종류 안에 둔다. 종류의 추가는 새 클래스 하나로 끝나고, 동작의 추가는 모든 종류를 고쳐야 한다. switch는 동작을 종류 밖에 둔다. 동작의 추가는 새 메서드 하나로 끝나고, 종류의 추가는 모든 switch를 고쳐야 한다. 대신 컴파일러가 고칠 곳을 알려 준다'
      - '고르는 기준: 그 동작이 종류 자신의 일이면 메서드로 둔다. 응답 형식 만들기, 로그 남기기처럼 종류가 알 필요 없는 바깥의 일이면 switch로 쓴다. `PaymentResult`가 HTTP 상태 코드를 알 필요는 없다'
      - '더 알아보기: switch를 컴파일한 뒤에 sealed 쪽만 고쳐 다시 컴파일하면, 실행 중에 모르는 종류가 들어와 `MatchException`이 난다. 함께 빌드하는 한 프로젝트 안에서는 생기지 않는다'
    widget:
      kind: compare
      note: '두 칸에 "instanceof와 else로 쓴 코드"와 "default 없는 switch로 쓴 코드"를 둔다. 칸마다 `PaymentResult`를 처리하는 곳 셋(메시지 만들기, 응답 코드 정하기, 로그 남기기)을 항목으로 적는다. "Pending 종류 추가하기" 버튼을 누르면 왼쪽 칸은 세 곳 모두 "컴파일됨"인 채로 결과 줄에 "실행 중 잘못 처리되는 곳 3"을 문제로 표시하고, 오른쪽 칸은 세 곳에 "컴파일 오류" 꼬리표가 붙고 결과 줄에 "컴파일러가 알려 준 곳 3"을 보여 준다'
    asks:
      - '본문의 예시: 코드 switchType의 마지막 줄을 `default -> "오류";`로 바꾼 뒤 코드 added로 `Pending`을 추가했다. 컴파일은 되나, `new Pending("T1")`의 결과는 무엇인가 (컴파일되고 "오류"가 반환된다. `default`가 받았다)'
      - '옮긴 상황: `sealed interface Shape permits Circle, Square`와 `default` 없이 둘을 다루는 switch 식이 다섯 군데 있다. `Triangle`을 `permits`에 추가하고 switch는 고치지 않았다. 컴파일 오류가 나는 switch는 몇 군데인가 (다섯 군데 모두)'
      - '실무 구역: 컨트롤러가 `return switch (result) { case Approved a -> ResponseEntity.ok(a); case Declined d -> ResponseEntity.status(402).body(d); default -> ResponseEntity.status(500).build(); };`로 응답을 만든다. 서비스가 새 종류 `Pending`을 돌려주기 시작하면 클라이언트가 받는 상태 코드는 무엇인가 (500. `default`가 받는다. 컴파일 오류는 나지 않는다)'
    body:
      - p: '도입부의 사고를 다시 봐요. 결과를 처리하는 곳이 여러 군데 있고, `Pending`을 추가했어요. 처리하는 곳을 어떤 모양으로 썼느냐에 따라 무엇이 달라지는지 버튼을 눌러 보세요.'
      - widget:
          kind: compare
          layout: [buttons, sides, verdict]
          run: {label: Pending 종류 추가하기}
          sides:
            - label: instanceof와 else로 쓴 코드
              items:
                - {name: 메시지 만들기, note: '...else → "오류"'}
                - {name: 응답 코드 정하기, note: '...else → 502'}
                - {name: 로그 남기기, note: '...else → error 로그'}
            - label: default 없는 switch로 쓴 코드
              items:
                - {name: 메시지 만들기, note: 'case Approved, Declined, Failed'}
                - {name: 응답 코드 정하기, note: 'case Approved, Declined, Failed'}
                - {name: 로그 남기기, note: 'case Approved, Declined, Failed'}
          initial:
            sides:
              - result: [{k: 컴파일, v: 됨}]
              - result: [{k: 컴파일, v: 됨}]
          scenes:
            run:
              sides:
                - marks:
                    - {name: 메시지 만들기, tag: '컴파일됨, Pending을 오류로', mark: bad}
                    - {name: 응답 코드 정하기, tag: '컴파일됨, Pending에 502', mark: bad}
                    - {name: 로그 남기기, tag: '컴파일됨, error 로그', mark: bad}
                  result: [{k: 컴파일, v: 됨}, {k: 실행 중 잘못 처리되는 곳, v: '3', mark: bad}]
                - marks:
                    - {name: 메시지 만들기, tag: 컴파일 오류}
                    - {name: 응답 코드 정하기, tag: 컴파일 오류}
                    - {name: 로그 남기기, tag: 컴파일 오류}
                  result: [{k: 컴파일, v: 안 됨}, {k: 컴파일러가 알려 준 곳, v: '3'}]
              verdict: '왼쪽은 아무 말 없이 배포되고 보류된 결제가 오류로 처리돼요. 오른쪽은 고칠 곳 셋을 컴파일러가 모두 짚어 줘서, 고치기 전에는 배포할 수 없어요.'
      - p: '**sealed가 종류의 목록을** 컴파일러에게 알려 주고, **record가 종류마다의 데이터를** 담고, **switch가 빠뜨린 것이 없는지** 검사해요. 셋이 함께 있어야 이 검사가 돼요.'
      - h3: default를 넣으면 검사가 꺼져요
      - code: withDefault
        notes:
          - mark: default
            as: code
            text: '`Failed`를 뜻하고 썼지만, 새 종류까지 조용히 받아요.'
      - ci:
          key: default
          label: Pending을 추가한 실제 결과 보기
          source: ModernJavaTest.addingPending
          code: withDefault
      - p: '`default`는 `else`와 같은 "나머지 전부"예요. 컴파일은 되고 `Pending`은 "오류"가 됐어요. 그래서 **sealed 타입의 switch에는 `default`를 쓰지 않아요.** 종류를 모두 적어요.'
      - h3: 오버라이딩으로 풀어도 돼요
      - p: '상속과 다형성 레슨의 방법으로도 같은 결과가 나와요. `PaymentResult`에 `message()`를 두고 종류마다 구현하는 거예요. 이때 종류를 추가하면 새 record가 `message()`를 구현해야 해서 역시 빠뜨릴 수 없어요.'
      - code: overriding
      - table:
          head: ['', '오버라이딩 (동작을 종류 안에)', 'switch (동작을 종류 밖에)']
          rows:
            - [종류를 추가할 때, 새 클래스 하나로 끝나요, '모든 switch를 고쳐요. 컴파일러가 고칠 곳을 알려 줘요']
            - [동작을 추가할 때, 모든 종류를 고쳐요, 새 메서드 하나로 끝나요]
            - [맞는 동작, 종류 자신의 일, '응답 만들기, 로그처럼 종류가 알 필요 없는 바깥의 일']
      - p: '그래서 고르는 기준은 **그 동작이 누구의 일인가**예요. `PaymentResult`가 HTTP 상태 코드를 알 필요는 없으니, 응답을 만드는 일은 컨트롤러의 switch에 둬요. 실무 구역에서 봐요.'
      - more:
          summary: '더 알아보기: MatchException'
          body:
            - p: 'switch를 컴파일한 뒤 sealed 쪽만 고쳐 다시 컴파일하면, 실행 중에 switch가 모르는 종류가 들어와 `MatchException`이 나요. 한 프로젝트를 함께 빌드하면 생기지 않고, 따로 배포되는 라이브러리 사이에서 생길 수 있어요([JEP 441](link:jep441)).'
      - quiz:
          q: '`sealed interface Shape permits Circle, Square`를 `default` 없이 다루는 switch 식이 다섯 군데 있어요. `Triangle`을 `permits`에 추가하고 switch는 고치지 않았어요. 컴파일 오류가 나는 곳은 몇 군데일까요?'
          options:
            - 0군데
            - 1군데
            - 5군데 모두
          answer: 3
          explain: '다섯 switch 모두 `Triangle`을 다루지 않았어요. 컴파일러가 다섯 곳을 모두 짚어 줘요.'
    recall: '셋을 함께 쓰면 종류를 하나 추가했을 때 그 종류를 다루지 않은 모든 switch가 컴파일 오류로 드러나요. sealed가 종류의 목록을, record가 종류마다의 데이터를, switch가 빠뜨린 것이 없는지를 맡아요. `default`를 넣으면 이 검사가 꺼져요. 종류 자신의 일은 오버라이딩으로, 응답 만들기처럼 바깥의 일은 switch로 둬요.'
practice:
  title: 스프링 서버에서는 이렇게 만나요
  says:
    - '서비스의 결과 타입. `PaymentService.pay()`가 코드 sealed의 `PaymentResult`를 돌려준다. 거절은 예외로 던질 일이 아니라 평범한 결과 가운데 하나라는 것을 타입이 말해 준다. 컨트롤러는 `return switch (result) { case Approved a -> ResponseEntity.ok(...); case Declined d -> ResponseEntity.status(402)...; case Failed f -> ResponseEntity.status(502)...; };`로 응답을 만든다. 결제 결과가 HTTP를 모르게 두는 것이 질문 4의 기준이다 (컨트롤러 하나를 띄워 세 결과의 상태 코드를 확인하는 테스트)'
    - '흔한 실수: sealed 타입의 switch에 버릇처럼 `default`를 넣는다. 지금은 차이가 없지만 종류를 추가하는 날 컴파일러가 침묵하고, 새 종류가 `default`의 처리(500)로 나간다. 고친 코드: `default`를 지우고 종류를 모두 쓴다. `Pending`을 추가했을 때 고치기 전 코드는 컴파일되고 고친 코드는 컴파일되지 않는 것을 붙인다 (테스트 안에서 컴파일러를 돌려 확인한다)'
    - '어디에 쓰고 어디에 쓰지 않나. DTO, 서비스의 결과, 이벤트처럼 데이터를 나르는 타입에 쓴다. JPA 엔티티는 record로도 sealed의 자식인 record로도 만들 수 없다(J9). 스프링 빈처럼 동작이 중심인 객체는 인터페이스와 구현으로 둔다(J7)'
    - '그 밖에 자주 쓰는 것을 표로 정리한다. `var`(지역 변수의 타입 생략, 10), 텍스트 블록(여러 줄 문자열, 15, JPQL과 JSON 테스트 데이터에 쓴다), `Stream.toList()`(16), 무엇이 null이었는지 알려 주는 NPE 메시지(14), `list.getFirst()`와 `getLast()`(21). 표의 각 줄은 이미 다룬 레슨을 가리킨다 (순수 자바 테스트로 각 한 줄씩 돌린다)'
    - '자바 8이나 11에서 올릴 때. 스프링 부트 3으로 함께 올리면 `javax.persistence`, `javax.servlet` 같은 패키지 이름이 `jakarta.`로 바뀐다. 자바가 아니라 자카르타 EE의 변화이지만 같은 날 만난다. Gradle의 toolchain을 21로 올리는 것은 J1에서 봤다 (스프링 부트 공식 문서 근거)'
    - '미리 보기 기능은 쓰지 않는다. `--enable-preview`로만 켜지는 문법은 다음 버전에서 바뀌거나 빠질 수 있다. 자바 21 기준으로 문자열 템플릿과 밑줄 패턴이 그렇다 (JEP 문서 근거)'
  body:
    - p: '세 문법은 스프링 서버에서 서비스가 돌려주는 결과와 컨트롤러가 만드는 응답 사이에서 만나요. 컨트롤러의 상태 코드와 `default`의 함정은 테스트로 확인했어요.'
    - h3: 서비스는 결과를, 컨트롤러는 응답을
    - p: '`PaymentService.pay()`가 질문 1의 `PaymentResult`를 돌려줘요. 거절은 예외로 던질 일이 아니라 **평범한 결과 가운데 하나**라는 것을 타입이 말해 줘요. 컨트롤러는 switch로 응답을 만들어요.'
    - code: controller
    - ci:
        key: controller
        label: 세 결과의 실제 응답 보기
        source: ModernJavaTest.controllerMapsResults
        code: controllerRun
    - p: '결제 결과는 HTTP를 몰라요. 상태 코드를 정하는 일은 컨트롤러의 switch에 있어요. 질문 4의 기준대로 **바깥의 일을 switch에** 둔 거예요. 응답 형식을 바꿔도 `PaymentResult`는 그대로예요.'
    - h3: '흔한 실수: 버릇처럼 default를 넣는다'
    - p: '컨트롤러의 switch에 `default -> ResponseEntity.status(500).build();`를 넣어 두면, 지금은 차이가 없어요. 그런데 서비스가 `Pending`을 돌려주기 시작하는 날 컴파일러가 침묵하고, **보류된 결제가 500으로** 나가요. 질문 4에서 본 대로 `default`가 새 종류를 받기 때문이에요. 고친 코드는 위의 컨트롤러처럼 `default`를 지우고 종류를 모두 적는 거예요. 그러면 `Pending`을 추가하는 순간 컴파일 오류가 고칠 곳을 알려 줘요.'
    - h3: 어디에 쓰고 어디에 쓰지 않나요
    - ul:
        - '**쓰는 곳.** DTO, 서비스의 결과, 이벤트처럼 데이터를 나르는 타입이에요.'
        - '**쓰지 않는 곳.** JPA 엔티티는 record로도, sealed의 자식인 record로도 만들 수 없어요(불변 객체 레슨). 스프링 빈처럼 동작이 중심인 객체는 인터페이스와 구현으로 둬요(상속과 다형성 레슨).'
    - h3: 그 밖에 자주 쓰는 것
    - table:
        head: [문법, 버전, 쓰임]
        rows:
          - ['`var`', '10', '지역 변수의 타입을 생략해요. 오른쪽에서 타입이 드러날 때 써요']
          - ['switch 식', '14', '값을 돌려주는 switch. 질문 2, enum 레슨']
          - ['자세한 NPE 메시지', '14', '무엇이 null이었는지 알려 줘요. 기본으로 켜져 있어요']
          - ['텍스트 블록 `"""`', '15', '여러 줄 문자열. JPQL과 JSON 테스트 데이터에 써요']
          - ['record, `instanceof` 패턴', '16', '불변 객체 레슨, 질문 2']
          - ['`Stream.toList()`', '16', '고칠 수 없는 리스트를 돌려줘요. 스트림과 Optional 레슨']
          - ['sealed', '17', '질문 1']
          - ['switch 패턴, record 패턴', '21', '질문 2, 3']
          - ['`getFirst()`, `getLast()`', '21', '순서 있는 컬렉션의 처음과 끝([JEP 431](link:jep431))']
    - ci:
        key: small
        label: 각 한 줄씩 돌린 실제 결과 보기
        source: ModernJavaTest.smallFeatures
        code: smallRun
    - h3: 자바 8이나 11에서 올릴 때
    - ul:
        - '**`javax`가 `jakarta`로 바뀌어요.** 스프링 부트 3으로 함께 올리면 `javax.persistence`, `javax.servlet` 같은 패키지 이름이 `jakarta.`로 바뀌어요. 자바가 아니라 자카르타 EE의 변화지만 같은 날 만나요([스프링 부트 3.0 이전 안내](link:boot3)).'
        - '**toolchain을 21로 올려요.** Gradle의 toolchain은 자바 프로그램이 실행되는 과정 레슨에서 봤어요.'
        - '**미리 보기 기능은 쓰지 않아요.** `--enable-preview`로만 켜지는 문법은 다음 버전에서 바뀌거나 빠질 수 있어요. 자바 21 기준으로 문자열 템플릿과 밑줄 패턴이 그래요.'
interview:
  question: sealed, record, switch 패턴 매칭을 함께 쓰면 무엇이 좋은지 설명해 주세요
  model:
    - label: 정의
      text: sealed는 그 타입을 구현할 수 있는 타입을 permits로 한정하고, record는 구성 요소로 이루어진 불변 데이터이고, switch 패턴 매칭은 타입과 구성 요소로 가르면서 변수에 바로 담습니다.
    - label: 원리
      text: sealed 덕분에 컴파일러가 자식의 목록을 알고, default 없는 switch가 모든 자식을 다뤘는지 검사합니다. 그래서 종류를 하나 추가하면 그 종류를 다루지 않은 모든 switch가 컴파일 오류로 드러납니다. instanceof와 else로 쓰면 새 종류가 else로 조용히 떨어집니다.
    - label: 주의할 점
      text: sealed 타입의 switch에 default를 넣으면 이 검사가 꺼집니다. 종류 자신의 일은 오버라이딩으로, 응답 만들기처럼 종류가 알 필요 없는 일은 switch로 둡니다. 미리 보기 기능은 운영 코드에 쓰지 않습니다.
    - label: 경험
      text: '(내 프로젝트로 채우기) 예: 결제 결과를 sealed와 record로 바꾸고 컨트롤러의 default를 지웠더니, 보류 상태를 추가할 때 고칠 곳을 컴파일러가 모두 알려 줬습니다.'
verified: 이 레슨의 결과는 짐작이 아니라 자바 21에서 코드를 돌려 받은 값이에요. 종류를 추가했을 때의 컴파일 결과는 테스트 안에서 javac를 돌려 확인했고, 컨트롤러는 스프링 부트 3.5를 띄워 확인했어요. 코드가 바뀔 때마다 테스트([ModernJavaTest](link:test))가 다시 돌아요.
footer: '근거: sealed는 JEP 409([링크](link:jep409))와 자바 언어 명세 8.1.1.2, switch 식은 JEP 361, instanceof 패턴은 JEP 394, switch 패턴 매칭과 완전성은 JEP 441([링크](link:jep441))과 명세 14.11, record 패턴은 JEP 440([링크](link:jep440)), 밑줄 패턴은 JEP 443. 결과는 OpenJDK 21과 스프링 부트 3.5에서 테스트로 확인했어요. 오류는 [GitHub 이슈](https://github.com/wanja727/dev-lessons/issues)로 알려 주세요.'
claims:
  - claim: '`permits`에 없는 타입이 sealed 인터페이스를 구현하면 컴파일되지 않는다. 허용된 자식 클래스가 final, sealed, non-sealed 가운데 아무것도 쓰지 않아도 컴파일되지 않는다'
    how: '`JavaSource`로 소스를 컴파일한다'
    test: ModernJavaTest.sealedRules
  - claim: '코드 chain과 코드 switchType은 세 종류에 같은 문자열을 돌려준다'
    how: '세 객체로 두 메서드를 불러 비교한다'
    test: ModernJavaTest.chainAndSwitchAgree
  - claim: '`Pending`을 추가하면 코드 switchType은 컴파일되지 않고 코드 chain은 컴파일되며 `Pending`에 "오류"를 돌려준다. `default`가 있는 switch도 컴파일되고 `Pending`을 `default`로 처리한다'
    how: '`Pending`이 있는 소스 묶음을 `JavaSource`로 컴파일해 switch 쪽에만 오류가 있는지 본다. 컴파일된 쪽은 클래스를 읽어 실행한다'
    test: ModernJavaTest.addingPending
  - claim: '넓은 타입의 case를 좁은 타입보다 먼저 쓴 switch는 컴파일되지 않는다. null을 넘기면 `case null`이 없는 switch는 `NullPointerException`을 던지고, `case null`이 있으면 그 case로 간다'
    how: '컴파일 오류는 컴파일러로, 예외는 실행해서 본다'
    test: ModernJavaTest.orderAndNull
  - claim: '코드 recordPattern은 금액이 100만 이상인 승인에 "고액 승인", 그 미만에 "승인"을 돌려준다. `instanceof Point(int x, int y)`는 구성 요소를 꺼내고, 중첩된 record 패턴으로 안쪽 record의 구성 요소를 꺼낸다'
    how: '두 금액, `Point(3, 4)`, `Order(Member(String name), Money(long amount))`로 돌린다'
    test: ModernJavaTest.recordPatterns
  - claim: '밑줄 패턴은 자바 21에서 미리 보기 옵션 없이 컴파일되지 않는다'
    how: '`JavaSource`로 `case Approved(var txId, _)`를 컴파일한다'
    test: ModernJavaTest.underscoreIsPreview
  - claim: '컨트롤러의 switch가 세 결과에 200, 402, 502를 돌려준다'
    how: '가짜 결과를 돌려주는 서비스를 쓰는 컨트롤러 하나를 `MiniWeb`에 띄워 요청한다'
    test: ModernJavaTest.controllerMapsResults
  - claim: '`var`, 텍스트 블록, `Stream.toList()`(고칠 수 없음), 자세한 NPE 메시지, `getFirst()`와 `getLast()`가 자바 21에서 동작한다'
    how: '각 한 줄씩 돌린다'
    test: ModernJavaTest.smallFeatures
