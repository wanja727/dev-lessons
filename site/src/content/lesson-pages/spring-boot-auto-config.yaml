# 스프링 부트의 자동 설정
# 자료 파일의 칸은 docs/lesson-data-format.md에 있다. 문제는 content/questions/spring-boot-auto-config.yaml에 있다.
title: 스프링 부트의 자동 설정
description: 의존성만 넣었는데 빈이 생기는 이유, 자동 설정이 빈을 만드는 조건, 내가 같은 빈을 만들면 일어나는 일, 동작을 바꾸는 순서. 네 가지 질문에 스스로 답할 수 있게 자동 설정을 켠 작은 앱에서 빈을 세고 조건 평가 보고서를 읽는 대화형 레슨.
unit: 스프링
minutes: 20
roadmap: S4
type: 동작 확인
prerequisites:
  - {slug: spring-beans, title: 스프링 빈과 의존성 주입}
assume: '자바 21, 스프링 부트 3.5. 빈은 컴포넌트 스캔이나 `@Configuration`의 `@Bean`으로 만들어진다는 것과, 같은 타입의 빈이 둘이면 앱이 뜨지 않는다는 것(스프링 빈과 의존성 주입 레슨). Gradle에 의존성 한 줄을 더해 본 적이 있으면 돼요.'
example: '컨트롤러가 주문을 JSON으로 돌려주는 작은 앱. 어디에도 `ObjectMapper`를 만든 코드가 없는데 JSON이 나오는 이유를 찾고, 키 모양을 바꾸려고 내 `ObjectMapper`를 만들었을 때와 설정 한 줄로 바꿨을 때를 비교한다.'
intro:
  - '`build.gradle`에 `spring-boot-starter-web` 한 줄을 넣었을 뿐인데 톰캣이 뜨고, 컨트롤러가 돌려준 객체가 JSON이 돼요. `spring-boot-starter-data-jpa`를 넣으면 DB 연결 설정을 적으라는 에러가 나요. 내가 만들지 않은 빈들이 어디서 왔는지 모르면, 동작을 바꾸고 싶을 때 어디를 고쳐야 할지 몰라요.'
  - '스프링 부트는 라이브러리마다 "이런 조건이면 이런 빈을 만든다"는 설정 클래스를 미리 들고 있어요. 이것을 자동 설정이라고 해요. 스프링 개발자는 대부분 자동 설정이 만든 빈을 그대로 쓰고, 필요한 곳만 설정 값이나 내 빈으로 바꿔요. 그 경계를 알아야 덮어쓴다고 생각한 설정이 무시되거나, 자동 설정 전체를 꺼 버리는 일을 피해요.'
  - '이 레슨에서는 작은 앱을 띄워 자동 설정이 만든 빈을 세고, 조건이 맞지 않아 빠진 설정의 이유를 보고서로 읽고, 내 빈을 만들었을 때 자동 설정이 물러나는 것을 확인해요.'
covers:
  - topic: '`@SpringBootApplication`은 `@SpringBootConfiguration`, `@EnableAutoConfiguration`, `@ComponentScan` 셋을 합친 것이다'
    where: '질문 1'
  - topic: '스타터는 함께 쓰는 라이브러리 묶음이다. `spring-boot-starter-web`은 스프링 MVC, 톰캣, 잭슨을 가져온다. 스타터 자체에는 설정 코드가 없다'
    where: '질문 1'
  - topic: '자동 설정 클래스 목록은 `spring-boot-autoconfigure` jar의 `META-INF/spring/org.springframework.boot.autoconfigure.AutoConfiguration.imports`에 있다. `@EnableAutoConfiguration`이 이 목록을 읽는다'
    where: '질문 1'
  - topic: '자동 설정은 조건이 맞을 때만 빈을 만든다: `@ConditionalOnClass`(클래스가 클래스패스에 있을 때), `@ConditionalOnMissingBean`(같은 빈이 없을 때), `@ConditionalOnProperty`(설정 값이 있을 때)'
    where: '질문 2'
  - topic: '어느 자동 설정이 켜지고 왜 빠졌는지는 조건 평가 보고서(`--debug`, `ConditionEvaluationReport`)로 본다'
    where: '질문 2와 실무에서는'
  - topic: '내가 같은 타입의 빈을 만들면 `@ConditionalOnMissingBean` 때문에 자동 설정의 빈이 만들어지지 않는다. 내 빈이 이긴다'
    where: '질문 3'
  - topic: '내 빈으로 바꾸면 자동 설정이 그 빈에 해 주던 설정(`spring.jackson.*` 값 적용, 모듈 등록)도 함께 사라진다'
    where: '질문 3'
  - topic: '자동 설정은 내 설정(컴포넌트 스캔과 `@Configuration`)을 다 읽은 뒤에 처리된다. 그래서 내 빈이 있는지 보고 물러날 수 있다'
    where: '질문 3의 더 알아보기'
  - topic: '대부분은 빈을 만들지 않고 설정 값(`spring.jackson.*`, `server.port`)으로 바꾼다. 자동 설정의 빈이 그 값을 읽는다'
    where: '질문 4'
  - topic: '빈 하나를 조금 고칠 때는 커스터마이저(`Jackson2ObjectMapperBuilderCustomizer`)를 쓴다'
    where: '질문 4'
  - topic: '자동 설정 하나를 통째로 끄는 법: `@SpringBootApplication(exclude = ...)`, `spring.autoconfigure.exclude`'
    where: '질문 4'
  - topic: '스타터를 넣었는데 필요한 설정 값이 없으면 앱이 뜨지 않는다(예: JPA 스타터와 DB 주소)'
    where: '실무에서는'
  - topic: '설정 값을 어디서 읽고 어느 것이 이기는지, 프로파일'
    where: '다루지 않음: 설정과 프로파일(S5)'
  - topic: '자동 설정을 직접 만드는 법(라이브러리 제작자의 일)'
    where: '질문 1의 더 알아보기에 목록 파일에 한 줄 더하면 된다는 것만 적는다'
links:
  test: https://github.com/wanja727/dev-lessons/blob/main/verification/src/test/java/lab/devlessons/autoconfig/AutoConfigTest.java
  autoConfig: https://docs.spring.io/spring-boot/reference/using/auto-configuration.html
  developing: https://docs.spring.io/spring-boot/reference/features/developing-auto-configuration.html
  jackson: https://docs.spring.io/spring-boot/how-to/spring-mvc.html#howto.spring-mvc.customize-jackson-objectmapper
  conditions: https://docs.spring.io/spring-boot/api/rest/actuator/conditions.html
codes:
  predict: |-
    record OrderSummary(long orderId,
        String menuName, int quantity) {}

    @Configuration
    class JsonConfig {
      @Bean
      ObjectMapper objectMapper() {
        return new ObjectMapper();
      }
    }

    # application.yml
    spring.jackson.property-naming-strategy:
      SNAKE_CASE
  app: |-
    [[@SpringBootApplication]]
    public class ShopApplication {
      public static void main(String[] a) {
        SpringApplication.run(
            ShopApplication.class, a);
      }
    }
  expanded: |-
    @SpringBootConfiguration
    [[@EnableAutoConfiguration]]
    @ComponentScan
    public class ShopApplication { ... }
  jackson: |-
    @AutoConfiguration
    [[@ConditionalOnClass(ObjectMapper.class)]]
    public class JacksonAutoConfiguration {

      @Bean
      @Primary
      [[@ConditionalOnMissingBean]]
      ObjectMapper jacksonObjectMapper(
          Jackson2ObjectMapperBuilder b) {
        return b.createXmlMapper(false)
            .build();
      }
    }
  customizer: |-
    @Bean
    Jackson2ObjectMapperBuilderCustomizer
        snakeCase() {
      return b -> b.propertyNamingStrategy(
          PropertyNamingStrategies.SNAKE_CASE);
    }
  yml: |-
    spring:
      jackson:
        property-naming-strategy: SNAKE_CASE
  exclude: |-
    @SpringBootApplication(exclude =
        RedisAutoConfiguration.class)
    public class ShopApplication { ... }

    # 또는 application.yml
    spring.autoconfigure.exclude: >-
      org.springframework.boot.autoconfigure⤷
      .data.redis.RedisAutoConfiguration
  debug: |-
    # application.yml
    debug: true
predict:
  title: 키는 어떤 모양으로 나올까요?
  text: '컨트롤러가 `new OrderSummary(1, "latte", 2)`를 돌려줘요. `application.yml`에 `spring.jackson.property-naming-strategy: SNAKE_CASE`를 적고, 코드 predict처럼 내 `ObjectMapper` 빈도 만들었어요. 응답 JSON의 키는 어떻게 나올까요? 답은 질문 3에 나와요.'
  code: predict
  label: 내 예측
  options:
    - {value: a, label: 'order_id처럼 밑줄'}
    - {value: b, label: 'orderId처럼 그대로'}
    - {value: c, label: '앱이 뜨지 않는다(ObjectMapper가 둘)'}
  answer: b
  storageKey: ac-predict
  wrong: 예측은 "{label}"이었어요. 틀린 예측이 더 오래 남으니 괜찮아요.
questions:
  - id: q1
    title: 의존성만 넣었는데 왜 빈이 생기나요?
    conclusion:
      lead: '스프링 부트가 미리 들고 있는 자동 설정 클래스들을 `@EnableAutoConfiguration`이 읽어서, 조건이 맞는 것의 빈을 만들어 주기 때문이에요.'
      sub: '`@SpringBootApplication` 안에 `@EnableAutoConfiguration`이 들어 있어요. 스타터는 라이브러리를 가져올 뿐이고, 빈을 만드는 것은 `spring-boot-autoconfigure` 안의 설정 클래스예요.'
    says:
      - '코드 app의 `@SpringBootApplication`을 풀면 셋이다: `@SpringBootConfiguration`(이 클래스도 설정 클래스), `@ComponentScan`(이 패키지 아래 스캔, S2), `@EnableAutoConfiguration`(자동 설정 켜기)'
      - '스타터는 의존성 묶음이다. `spring-boot-starter-web`을 넣으면 스프링 MVC, 내장 톰캣, 잭슨 라이브러리가 들어온다. 스타터 jar에는 클래스가 거의 없다'
      - '`spring-boot-autoconfigure` jar 안의 `AutoConfiguration.imports` 파일에 자동 설정 클래스 이름이 줄마다 적혀 있다. 스프링 부트 3.5에서 몇 개인지 세어 실제 출력으로 보인다. `@EnableAutoConfiguration`이 이 목록을 읽는다'
      - '컨트롤러만 둔 작은 앱을 띄워, 내가 만든 빈과 자동 설정이 만든 빈의 수를 나눠 센다. 내가 만든 것은 몇 개, 자동 설정이 만든 것은 백 개가 넘는다. `ObjectMapper`, `DispatcherServlet`, 톰캣 팩토리가 그 안에 있다'
      - '더 알아보기: 회사 공통 라이브러리가 자동 설정을 갖고 싶으면 자기 jar에 같은 이름의 목록 파일을 두고 설정 클래스 이름을 적는다. 그 jar를 넣은 앱은 그 설정을 읽는다'
    asks:
      - '본문의 예시: `@SpringBootApplication`에서 `@EnableAutoConfiguration`이 빠지면 컨트롤러만 둔 웹 앱에 `ObjectMapper` 빈이 생기나 (생기지 않는다. 자동 설정을 읽지 않는다)'
      - '옮긴 상황: 팀원이 "`spring-boot-starter-data-redis` jar 안에 Redis 설정 코드가 들어 있다"고 말한다. 맞나 (아니다. 스타터는 라이브러리를 가져오고, Redis 자동 설정 클래스는 `spring-boot-autoconfigure`에 있다)'
    body:
      - p: '스프링 부트 앱의 시작점이에요. 어노테이션 하나뿐이에요.'
      - code: app
        notes:
          - mark: '@SpringBootApplication'
            as: anno
            text: '세 어노테이션을 합친 것이에요.'
      - code: expanded
        notes:
          - mark: '@EnableAutoConfiguration'
            as: anno
            text: '자동 설정을 켜는 스위치예요. 나머지 둘은 "이 클래스도 설정 클래스", "이 패키지 아래를 스캔"이에요.'
      - p: '`@ComponentScan`은 [스프링 빈과 의존성 주입](lesson:spring-beans) 레슨에서 본 스캔이에요. 이 레슨의 주인공은 `@EnableAutoConfiguration`이에요.'
      - h3: 스타터는 라이브러리 묶음이에요
      - p: '`spring-boot-starter-web`을 넣으면 스프링 MVC, 내장 톰캣, 잭슨(JSON 라이브러리)이 함께 들어와요. 스타터 jar 안에는 클래스가 거의 없어요. 함께 쓰는 라이브러리를 버전까지 맞춰 한 줄로 가져오는 것이 스타터의 일이에요.'
      - h3: 빈을 만드는 것은 자동 설정 클래스예요
      - p: '빈을 만드는 코드는 `spring-boot-autoconfigure` jar에 있어요. 이 jar의 `META-INF/spring/...AutoConfiguration.imports` 파일에 자동 설정 클래스 이름이 한 줄에 하나씩 적혀 있고, `@EnableAutoConfiguration`이 이 목록을 읽어요. 이 저장소의 클래스패스에서 세어 봤어요.'
      - ci:
          key: imports
          label: 실제 목록 보기
          source: AutoConfigTest.importsFileListsManyClasses
      - p: '목록에는 Testcontainers의 자동 설정도 섞여 있어요. 그 라이브러리도 자기 jar에 같은 이름의 파일을 두었기 때문이에요. 라이브러리가 자동 설정을 갖고 싶으면 이 파일에 한 줄 더하면 돼요([근거](link:developing)).'
      - h3: 컨트롤러 하나에 빈이 백 개 넘게
      - p: '컨트롤러 하나만 넣은 앱을 자동 설정을 켜고 띄운 뒤 빈을 셌어요. 이 저장소에는 JPA와 배치 스타터도 있어서, DB가 필요한 자동 설정은 꺼 두었어요.'
      - ci:
          key: bean-count
          label: 실제 결과 보기
          source: AutoConfigTest.autoConfiguredBeansOutnumberMine
      - p: '내가 넣은 것은 2개(설정 클래스와 컨트롤러)인데 빈은 190개가 넘어요. JSON을 만드는 `jacksonObjectMapper`, 요청을 받는 `dispatcherServlet`, 톰캣을 띄우는 팩토리가 모두 자동 설정이 만든 거예요. 그래서 컨트롤러가 돌려준 객체가 JSON이 돼요.'
      - quiz:
          q: '`spring-boot-starter-data-redis`를 넣으면 Redis 빈이 생겨요. 그 빈을 만드는 코드는 어디에 있을까요?'
          options:
            - 스타터 jar 안
            - '`spring-boot-autoconfigure` jar의 자동 설정 클래스'
            - 내 프로젝트의 `@Configuration`
          answer: 2
          explain: '스타터는 라이브러리를 가져올 뿐이에요. 빈을 만드는 것은 `spring-boot-autoconfigure` 안의 `RedisAutoConfiguration` 같은 자동 설정 클래스예요.'
      - next: '목록에는 자동 설정이 백오십 개 넘게 있어요. 그런데 Redis를 넣지 않은 앱에는 Redis 빈이 없어요. 무엇이 고를까요?'
    recall: '@SpringBootApplication은 @SpringBootConfiguration, @ComponentScan, @EnableAutoConfiguration을 합친 것이에요. @EnableAutoConfiguration이 spring-boot-autoconfigure jar의 AutoConfiguration.imports에 적힌 자동 설정 클래스들을 읽고, 조건이 맞는 것의 빈을 만들어요. 스타터는 라이브러리 묶음일 뿐이고 빈을 만드는 코드는 자동 설정 클래스에 있어요.'
  - id: q2
    title: 자동 설정은 언제 빈을 만들고 언제 만들지 않나요?
    conclusion:
      lead: '자동 설정 클래스마다 조건이 붙어 있어서, 조건이 모두 맞을 때만 빈을 만들어요.'
      sub: '필요한 라이브러리가 클래스패스에 있는지(`@ConditionalOnClass`), 같은 빈이 이미 있는지(`@ConditionalOnMissingBean`), 설정 값이 켜져 있는지(`@ConditionalOnProperty`)를 봐요.'
    says:
      - '코드 jackson은 `JacksonAutoConfiguration`을 줄인 모양이다. 클래스에 `@ConditionalOnClass(ObjectMapper.class)`가 있어 잭슨 라이브러리가 없으면 통째로 건너뛴다. 메서드에 `@ConditionalOnMissingBean`이 있어 `ObjectMapper` 빈이 이미 있으면 만들지 않는다'
      - '조건 평가 보고서를 읽는다. 앱을 `--debug`로 띄우거나 `ConditionEvaluationReport`를 꺼내면 켜진 설정(positive matches)과 빠진 설정(negative matches)이 이유와 함께 나온다. 이 앱에서 `RedisAutoConfiguration`이 "required class not found"로 빠진 줄과 `JacksonAutoConfiguration`이 켜진 줄을 실제 출력으로 보인다'
      - '`@ConditionalOnProperty`의 예: 어떤 설정 값을 `false`로 두면 그 자동 설정이 꺼진다'
      - '그래서 같은 스프링 부트라도 어떤 라이브러리를 넣었는지, 어떤 빈을 만들었는지, 어떤 값을 적었는지에 따라 만들어지는 빈이 다르다'
    asks:
      - '본문의 예시: 클래스패스에 잭슨이 있고 내가 만든 `ObjectMapper` 빈이 없다. 자동 설정이 `ObjectMapper`를 만드나 (만든다. 두 조건이 모두 맞는다)'
      - '옮긴 상황: 어떤 자동 설정 클래스에 `@ConditionalOnClass(name = "io.lettuce.core.RedisClient")`가 붙어 있다. 앱에 Lettuce 라이브러리가 없으면 그 클래스 안의 `@Bean`은 몇 개 만들어지나 (하나도. 클래스 전체를 건너뛴다)'
    body:
      - p: '`JacksonAutoConfiguration`을 줄여 옮긴 모양이에요. 조건 어노테이션 두 개를 보세요.'
      - code: jackson
        notes:
          - mark: '@ConditionalOnClass(ObjectMapper.class)'
            as: anno
            text: '클래스패스에 잭슨이 있을 때만 이 설정 클래스 전체를 읽어요. 없으면 통째로 건너뛰어요.'
          - mark: '@ConditionalOnMissingBean'
            as: anno
            text: '`ObjectMapper` 빈이 아직 없을 때만 이 빈을 만들어요.'
      - p: '자동 설정은 "무조건 만든다"가 아니라 "**조건이 맞으면** 만든다"예요. 자주 보는 조건은 셋이에요.'
      - table:
          head: [조건, 언제 맞나, 예]
          rows:
            - ['`@ConditionalOnClass`', '그 클래스가 클래스패스에 있을 때', '잭슨이 있으면 JSON 설정']
            - ['`@ConditionalOnMissingBean`', '같은 타입의 빈이 아직 없을 때', '내 `ObjectMapper`가 없으면 만든다']
            - ['`@ConditionalOnProperty`', '설정 값이 정해진 값일 때', '어떤 기능의 `enabled=false`면 끈다']
      - h3: 왜 켜졌고 왜 빠졌는지 보고서로 봐요
      - p: '스프링 부트는 자동 설정마다 조건을 따져 본 결과를 **조건 평가 보고서**로 남겨요. 앱을 띄운 뒤 보고서에서 두 자동 설정의 줄을 꺼냈어요.'
      - ci:
          key: report
          label: 실제 보고서 보기
          source: AutoConfigTest.conditionReport
      - p: 'Redis 자동 설정은 `RedisOperations` 클래스를 찾지 못해 빠졌어요. 이 앱에 spring-data-redis 라이브러리가 없기 때문이에요. Jackson 자동 설정은 `ObjectMapper` 클래스를 찾아 켜졌어요. "왜 이 빈이 없지?", "왜 이 빈이 생겼지?"가 궁금하면 이 보고서를 봐요. 보는 법은 실무 구역에 있어요.'
      - p: '그래서 같은 스프링 부트 버전이라도 **어떤 라이브러리를 넣었는지, 어떤 빈을 만들었는지, 어떤 값을 적었는지**에 따라 만들어지는 빈이 달라요.'
      - quiz:
          q: '어떤 자동 설정 클래스에 `@ConditionalOnClass(name = "io.lettuce.core.RedisClient")`가 붙어 있어요. 앱에 Lettuce 라이브러리가 없으면?'
          options:
            - 그 클래스의 빈이 모두 만들어진다
            - 그 클래스를 통째로 건너뛰어 빈이 하나도 안 만들어진다
            - 앱이 뜨지 않는다
          answer: 2
          explain: '클래스에 붙은 `@ConditionalOnClass`가 맞지 않으면 그 설정 클래스 전체를 건너뛰어요. 에러도 나지 않아요.'
      - next: '`@ConditionalOnMissingBean`은 "같은 빈이 없을 때"라고 했어요. 그럼 내가 `ObjectMapper`를 직접 만들면 어떻게 될까요?'
    recall: '자동 설정 클래스마다 조건이 붙어 있어서 조건이 맞을 때만 빈을 만들어요. @ConditionalOnClass는 필요한 클래스가 클래스패스에 있을 때, @ConditionalOnMissingBean은 같은 빈이 없을 때, @ConditionalOnProperty는 설정 값이 맞을 때예요. 어느 자동 설정이 왜 켜지고 빠졌는지는 조건 평가 보고서로 봐요.'
  - id: q3
    title: 내가 같은 빈을 만들면 무엇이 쓰이나요?
    conclusion:
      lead: '내 빈이 쓰여요. 자동 설정은 같은 타입의 빈이 이미 있으면 물러나도록 만들어져 있어서, 빈이 둘이 되지 않아요.'
      sub: '대신 자동 설정이 그 빈에 해 주던 일(설정 값 적용, 모듈 등록)도 함께 사라져요. 내 빈은 처음부터 내가 다 설정해야 해요.'
    says:
      - '코드 predict를 띄운다. 앱은 뜨고 `ObjectMapper` 빈은 하나이고 내가 만든 것이다. 앱이 뜨는 이유는 질문 2의 `@ConditionalOnMissingBean`이다'
      - '응답의 키는 `orderId` 그대로다. 예측의 답을 밝힌다. `spring.jackson.property-naming-strategy`는 자동 설정의 `Jackson2ObjectMapperBuilder`가 읽어 자동 설정의 `ObjectMapper`에 넣는 값이다. 내 `new ObjectMapper()`는 그 값을 모른다'
      - '사라지는 것은 하나 더 있다. 자동 설정의 `ObjectMapper`는 `LocalDate` 같은 자바 시간 타입 모듈을 등록한다. 내 `new ObjectMapper()`로 `LocalDate`가 든 객체를 쓰면 예외가 나고 응답은 500이다. 두 경우의 출력을 보인다'
      - '이 규칙이 자동 설정의 기본 모양이다. `DataSource`, `RestClient.Builder`, `PasswordEncoder` 등 대부분의 자동 설정 빈이 "없을 때만 만든다"이다'
      - '더 알아보기: 자동 설정은 내 `@Configuration`과 스캔한 빈을 다 등록한 뒤에 처리된다. 그래서 내 빈이 있는지 보고 물러날 수 있다. 내 설정이 자동 설정보다 나중에 처리되면 이 판단이 틀리므로 일반 `@Configuration`에는 `@ConditionalOnMissingBean`을 쓰지 말라고 스프링 부트 문서가 권한다'
    asks:
      - '본문의 예시: 내 `ObjectMapper` 빈을 만들고 `application.yml`에 `spring.jackson.serialization.indent-output: true`를 적었다. 응답 JSON이 줄을 바꿔 나오나 (나오지 않는다. 그 값은 자동 설정의 빈에만 적용된다)'
      - '옮긴 상황: `DataSourceAutoConfiguration`은 `DataSource` 빈이 없을 때만 커넥션 풀을 만든다. 내가 `@Bean DataSource`를 만들고 `spring.datasource.hikari.maximum-pool-size: 30`을 적으면 풀 크기는 30이 되나 (되지 않는다. 내 빈은 그 값을 읽지 않는다)'
    body:
      - p: '예측의 코드를 띄우고 `ObjectMapper` 빈을 세고 응답을 받았어요.'
      - ci:
          key: my-mapper
          label: 실제 결과 보기
          source: AutoConfigTest.myObjectMapperWins
          code: predict
      - p: '앱은 떴고 `ObjectMapper` 빈은 내가 만든 하나뿐이에요. 키는 **`orderId` 그대로**예요. {{predict-result}}'
      - h3: 빈이 둘이 되지 않은 이유
      - p: '질문 2의 `@ConditionalOnMissingBean` 덕분이에요. 자동 설정은 "`ObjectMapper` 빈이 없을 때만" 자기 것을 만들어요. 내 것이 있으니 물러났어요. [스프링 빈과 의존성 주입](lesson:spring-beans) 레슨에서 본 "같은 타입이 둘이면 앱이 뜨지 않는 문제"가 생기지 않아요.'
      - h3: 설정 값이 적용되지 않은 이유
      - p: '`spring.jackson.property-naming-strategy`를 읽는 것은 자동 설정이에요. 자동 설정은 이 값을 읽어 `Jackson2ObjectMapperBuilder`에 넣고, 그 빌더로 **자기** `ObjectMapper`를 만들어요. 내가 `new ObjectMapper()`로 만든 객체는 그 값을 몰라요. 자동 설정이 물러나면서 그 빈에 해 주던 일도 함께 사라진 거예요.'
      - h3: 사라진 것이 하나 더 있어요
      - p: '주문에 날짜(`LocalDate`)가 든 `Order`를 같은 앱에서 돌려줘 봤어요.'
      - ci:
          key: my-mapper-date
          label: 실제 응답 보기
          source: AutoConfigTest.myObjectMapperWins
      - p: '500이에요. 자동 설정의 `ObjectMapper`는 자바의 날짜 타입을 다루는 모듈을 등록해 두는데, 내 `new ObjectMapper()`에는 그 모듈이 없어요. 둘로 같은 객체를 써 보면 차이가 보여요.'
      - ci:
          key: java-time
          label: 두 ObjectMapper 비교 보기
          source: AutoConfigTest.plainMapperLosesJavaTime
      - p: '이것이 자동 설정의 기본 모양이에요. `DataSource`, `RestClient.Builder` 같은 대부분의 자동 설정 빈이 "없을 때만 만든다"예요. 내 빈을 만드는 순간 그 빈의 설정은 처음부터 내 몫이 돼요.'
      - more:
          summary: '더 알아보기: 자동 설정은 왜 내 빈보다 나중에 판단하나요'
          body:
            - p: '스프링 부트는 내 `@Configuration`과 스캔한 빈을 모두 등록한 **뒤에** 자동 설정을 처리해요. 그래야 "내 빈이 있는가"를 정확히 볼 수 있어요. 그래서 스프링 부트 문서는 일반 `@Configuration`에 `@ConditionalOnMissingBean`을 쓰지 말라고 해요. 내 설정끼리는 처리 순서가 정해져 있지 않아 판단이 틀릴 수 있어요([근거](link:autoConfig)).'
      - quiz:
          q: '내 `@Bean ObjectMapper`를 만들고 `spring.jackson.serialization.indent-output: true`를 적었어요. 응답 JSON이 줄을 바꿔 보기 좋게 나올까요?'
          options:
            - 나온다
            - 나오지 않는다
            - 앱이 뜨지 않는다
          answer: 2
          explain: '`spring.jackson.*` 값은 자동 설정이 자기 `ObjectMapper`를 만들 때 넣어요. 내 빈이 있으면 자동 설정이 물러나서 그 값을 아무도 적용하지 않아요.'
      - next: '그럼 키 모양만 바꾸고 날짜 모듈은 지키려면 어떻게 할까요?'
    recall: '내가 같은 타입의 빈을 만들면 자동 설정은 @ConditionalOnMissingBean 때문에 물러나서 내 빈 하나만 남고 그것이 쓰여요. 대신 자동 설정이 그 빈에 해 주던 일도 사라져요. spring.jackson.* 값이 적용되지 않고, 날짜 모듈이 없어 LocalDate를 쓰면 500이 나요. 내 빈의 설정은 처음부터 내 몫이에요.'
  - id: q4
    title: 자동 설정의 동작을 바꾸려면 어떻게 하나요?
    conclusion:
      lead: '먼저 설정 값으로 바꾸고, 값이 없으면 커스터마이저로 조금 고치고, 그래도 안 될 때만 내 빈을 만들어요.'
      sub: '자동 설정 하나가 아예 필요 없으면 `exclude`로 꺼요.'
    says:
      - '설정 값: 코드 yml처럼 `spring.jackson.*`을 적는다. 내 빈을 만들지 않았으니 자동 설정의 `ObjectMapper`가 이 값을 읽는다. 응답 키가 `order_id`로 바뀐 것을 실제 출력으로 보인다'
      - '어떤 값이 있는지는 스프링 부트 문서의 설정 목록에서 찾는다. 자동 설정 클래스는 `@ConfigurationProperties` 클래스(`JacksonProperties`)로 이 값을 받는다'
      - '커스터마이저: 설정 값에 없는 것을 바꿀 때 코드 customizer처럼 `Jackson2ObjectMapperBuilderCustomizer` 빈을 만든다. 자동 설정은 물러나지 않고, 빈을 만들 때 내 커스터마이저를 함께 적용한다. 설정 값과 모듈이 그대로 남는다'
      - '끄기: `@SpringBootApplication(exclude = RedisAutoConfiguration.class)` 또는 `spring.autoconfigure.exclude`. 끈 설정이 보고서의 exclusions에 나오는 것을 보인다'
      - '고르는 순서를 표로 정리한다: 설정 값 → 커스터마이저 → 내 빈 → exclude. 아래로 갈수록 자동 설정이 해 주던 일을 내가 떠맡는다'
    widget:
      kind: toggle
      note: '키를 밑줄 모양으로 바꾸는 방법 셋(설정 값, 커스터마이저, 내 ObjectMapper 빈)을 고르는 버튼. 고를 때마다 ObjectMapper 빈의 이름, 응답 키 모양, 날짜 필드가 든 응답의 결과(문자열 날짜 또는 500)를 보인다'
    asks:
      - '본문의 예시: 응답 JSON의 키를 밑줄 모양으로 바꾸면서 날짜 모듈은 그대로 두고 싶다. 내 `ObjectMapper` 빈을 만드는 것과 `spring.jackson.property-naming-strategy` 값을 적는 것 가운데 무엇이 맞나 (값을 적는다. 내 빈은 날짜 모듈까지 사라지게 한다)'
      - '옮긴 상황: 설정 값에 없는 잭슨 기능 하나를 켜고 싶다. 자동 설정의 다른 설정은 모두 유지하고 싶다. 무엇을 만드나 (`Jackson2ObjectMapperBuilderCustomizer` 빈)'
      - '실무 구역: `spring-boot-starter-data-jpa`를 넣고 `spring.datasource.url`을 적지 않은 채 앱을 띄우면 어떻게 되나 (내장 DB가 없으면 `DataSource`를 만들지 못해 앱이 뜨지 않는다)'
    body:
      - p: '같은 목표(키를 밑줄 모양으로)를 세 가지 방법으로 해 봤어요. 하나씩 골라 보세요.'
      - widget:
          kind: toggle
          layout: [selector, duo, verdict]
          selector:
            label: 바꾸는 방법
            options:
              - {value: prop, label: 설정 값}
              - {value: custom, label: 커스터마이저}
              - {value: bean, label: 내 ObjectMapper 빈}
          scenes:
            prop:
              duo:
                - {label: ObjectMapper 빈, rows: [{k: 이름, v: jacksonObjectMapper (자동 설정)}]}
                - {label: 응답, rows: [{k: 키, v: order_id, mark: changed}, {k: 날짜, v: '"2026-11-25"'}]}
              verdict: '자동 설정의 빈이 값을 읽어 바뀌었어요. 날짜 모듈도 그대로예요.'
            custom:
              duo:
                - {label: ObjectMapper 빈, rows: [{k: 이름, v: jacksonObjectMapper (자동 설정)}]}
                - {label: 응답, rows: [{k: 키, v: order_id, mark: changed}, {k: 날짜, v: '"2026-11-25"'}]}
              verdict: '자동 설정은 물러나지 않고 내 커스터마이저를 함께 적용했어요. 설정 값에 없는 것을 바꿀 때 써요.'
            bean:
              duo:
                - {label: ObjectMapper 빈, rows: [{k: 이름, v: objectMapper (내 것), mark: changed}]}
                - {label: 응답, rows: [{k: 키, v: orderId, mark: bad}, {k: 날짜, v: '500 에러', mark: bad}]}
              verdict: '자동 설정이 물러나 설정 값도 날짜 모듈도 사라졌어요. 모든 설정을 내가 다시 해야 해요.'
      - h3: 1. 설정 값
      - code: yml
      - ci:
          key: property
          label: 실제 응답 보기
          source: AutoConfigTest.propertyChangesAutoMapper
      - p: '내 빈을 만들지 않았으니 자동 설정의 `ObjectMapper`가 이 값을 읽어요. 키는 밑줄 모양이고 날짜도 그대로예요. 어떤 값이 있는지는 스프링 부트 문서의 설정 목록에서 찾아요. 자동 설정 클래스는 `@ConfigurationProperties` 클래스(`JacksonProperties`)로 `spring.jackson` 아래 값을 받아요.'
      - h3: 2. 커스터마이저
      - code: customizer
      - ci:
          key: customizer
          label: 실제 응답 보기
          source: AutoConfigTest.customizerKeepsAutoConfig
      - p: '설정 목록에 없는 것을 바꿀 때는 커스터마이저 빈을 만들어요. 자동 설정은 `ObjectMapper`를 만들 때 이 빈을 찾아 함께 적용해요. `ObjectMapper` 빈은 여전히 자동 설정의 `jacksonObjectMapper`예요. 물러나지 않으니 다른 설정이 모두 남아요([근거](link:jackson)).'
      - h3: 3. 내 빈, 4. 끄기
      - p: '내 빈은 질문 3에서 본 대로 자동 설정이 해 주던 일을 모두 떠맡는 방법이에요. 자동 설정 하나가 아예 필요 없으면 꺼요.'
      - code: exclude
      - p: '끈 자동 설정은 조건 평가 보고서의 exclusions 목록에 나와요. 이 레슨의 테스트 앱도 DB가 필요한 자동 설정을 이렇게 껐어요.'
      - table:
          head: [순서, 방법, 자동 설정이 해 주던 일]
          rows:
            - ['1', '설정 값(`spring.jackson.*`)', '모두 남는다']
            - ['2', '커스터마이저 빈', '모두 남는다']
            - ['3', '내 빈', '그 빈의 것은 사라진다']
            - ['4', '`exclude`', '그 자동 설정 전체가 사라진다']
      - quiz:
          q: '설정 목록에 없는 잭슨 기능 하나를 켜고, 자동 설정의 다른 설정은 그대로 두고 싶어요. 무엇을 만들까요?'
          options:
            - '내 `@Bean ObjectMapper`'
            - '`Jackson2ObjectMapperBuilderCustomizer` 빈'
            - '`JacksonAutoConfiguration`을 exclude'
          answer: 2
          explain: '커스터마이저는 자동 설정을 물러나게 하지 않고 그 위에 내 설정을 더해요. 내 `ObjectMapper` 빈은 자동 설정을 통째로 물러나게 해요.'
    recall: '먼저 설정 값(spring.jackson.* 등)으로 바꿔요. 자동 설정의 빈이 그 값을 읽어요. 설정 목록에 없으면 커스터마이저 빈으로 자동 설정 위에 조금 더해요. 그래도 안 되면 내 빈을 만드는데, 그러면 자동 설정이 물러나 그 빈의 설정을 모두 떠맡아요. 자동 설정이 아예 필요 없으면 exclude로 꺼요.'
practice:
  title: 스프링 부트에서는 이렇게 다뤄요
  says:
    - '스타터를 넣으면 그 스타터가 기대하는 설정 값도 따라온다. JPA 스타터를 넣고 DB 주소를 적지 않으면 "Failed to configure a DataSource" 메시지로 뜨지 않는다. 메시지와 고치는 법(주소를 적거나 그 자동 설정을 끈다)을 보인다. 메시지는 테스트로 남긴다'
    - '자동 설정이 왜 그렇게 동작했는지 볼 때: `application.yml`에 `debug: true`를 적거나 `--debug`로 띄우면 시작 로그에 조건 평가 보고서가 나온다. 운영에서는 액추에이터의 `/actuator/conditions`로 본다(스프링 부트 문서 근거)'
    - '흔한 실수: 날짜 형식 하나를 바꾸려고 `@Bean ObjectMapper`를 새로 만든다. 그 뒤 다른 사람이 `spring.jackson.*` 값을 고쳐도 반영되지 않고, `LocalDateTime` 응답이 깨진다. 고친 코드: 빈을 지우고 설정 값이나 커스터마이저로 바꾼다(질문 3, 4를 가리킨다)'
  body:
    - h3: 스타터를 넣으면 필요한 설정도 따라와요
    - p: 'JPA 스타터를 처음 넣고 앱을 띄우면 이런 메시지로 멈춰요. DB 자동 설정을 켜고 DB 주소를 적지 않은 앱을 띄워 시작 로그를 남겼어요.'
    - ci:
        key: datasource
        label: 실제 시작 로그 보기
        source: AutoConfigTest.dataSourceWithoutUrlFails
    - p: 'JPA 스타터가 커넥션 풀 라이브러리를 가져오니 `@ConditionalOnClass`가 맞아 `DataSource` 자동 설정이 켜져요. 그런데 어느 DB에 붙을지 몰라요. 고치는 법은 둘이에요. `spring.datasource.url`, `username`, `password`를 적거나, 정말 DB가 필요 없다면 그 자동 설정을 `exclude`로 꺼요. 설정을 어디에 어떻게 적는지는 [설정과 프로파일](lesson:config-profiles) 레슨에서 다뤄요.'
    - h3: 왜 그렇게 됐는지 볼 때
    - code: debug
    - p: '`debug: true`를 적거나 `--debug`로 띄우면 시작 로그에 조건 평가 보고서가 나와요. 질문 2에서 본 "켜진 것과 이유, 빠진 것과 이유"가 모든 자동 설정에 대해 나와요. 운영 중인 서버라면 액추에이터의 `/actuator/conditions` 주소로 같은 내용을 볼 수 있어요([근거](link:conditions)).'
    - h3: '흔한 실수: 날짜 하나 바꾸려고 ObjectMapper를 새로 만듦'
    - p: '날짜 형식을 바꾸는 글을 보고 `@Bean ObjectMapper`를 하나 만들어요. 그날은 잘 돼요. 몇 주 뒤 다른 사람이 `spring.jackson.*` 값을 고쳤는데 반영되지 않고, 어떤 응답은 `LocalDateTime` 때문에 500이 나요. 질문 3에서 본 그대로예요. 빈을 지우고 설정 값이나 커스터마이저로 바꿔요.'
interview:
  question: 스프링 부트의 자동 설정은 어떻게 동작하나요?
  model:
    - label: 정의
      text: '@SpringBootApplication 안의 @EnableAutoConfiguration이 spring-boot-autoconfigure의 AutoConfiguration.imports에 적힌 자동 설정 클래스들을 읽어 빈을 만듭니다. 스타터는 라이브러리 묶음일 뿐입니다.'
    - label: 원리
      text: 자동 설정 클래스마다 @ConditionalOnClass, @ConditionalOnMissingBean, @ConditionalOnProperty 같은 조건이 붙어 있어 조건이 맞을 때만 빈을 만듭니다. 내 설정을 다 읽은 뒤에 처리하므로 내가 같은 빈을 만들면 자동 설정이 물러납니다.
    - label: 주의할 점
      text: 내 빈을 만들면 자동 설정이 그 빈에 해 주던 설정도 사라집니다. 그래서 설정 값, 커스터마이저, 내 빈, exclude 순서로 바꿉니다. 왜 그렇게 됐는지는 조건 평가 보고서로 봅니다.
    - label: 경험
      text: '(내 프로젝트로 채우기) 예: ObjectMapper를 직접 만들었다가 spring.jackson 설정과 날짜 모듈이 빠져, 빈을 지우고 커스터마이저로 바꿨습니다.'
verified: 이 레슨의 빈 개수, 보고서, 응답은 짐작이 아니라 스프링 부트 3.5의 자동 설정을 켠 앱을 띄워 받은 값이에요. 코드가 바뀔 때마다 테스트([AutoConfigTest](link:test))가 다시 돌아요.
footer: '근거: 자동 설정의 원리와 조건은 스프링 부트 문서([링크](link:autoConfig)), 자동 설정 만들기와 목록 파일은 [링크](link:developing), `spring.jackson.*`과 커스터마이저는 [링크](link:jackson), 액추에이터의 conditions는 [링크](link:conditions). 결과는 OpenJDK 21에서 테스트로 확인했어요. 오류는 [GitHub 이슈](https://github.com/wanja727/dev-lessons/issues)로 알려 주세요.'
claims:
  - claim: '스프링 부트 3.5의 `AutoConfiguration.imports`에 적힌 자동 설정 클래스는 백 개가 넘는다'
    how: '클래스패스의 목록 파일을 읽어 센다(`ImportCandidates.load`). 이 저장소는 Testcontainers의 목록도 함께 읽혀 158개였다'
    test: AutoConfigTest.importsFileListsManyClasses
  - claim: '컨트롤러만 둔 작은 앱에서 자동 설정이 만든 빈이 내가 만든 빈보다 훨씬 많고, 그 안에 `ObjectMapper`와 `dispatcherServlet`이 있다'
    how: '`@EnableAutoConfiguration`을 켠 작은 앱을 띄우고 빈의 타입이 내 패키지인지로 나눠 센다. DB와 배치 자동 설정은 `exclude`로 껐다'
    test: AutoConfigTest.autoConfiguredBeansOutnumberMine
  - claim: '조건 평가 보고서에서 `RedisAutoConfiguration`은 필요한 클래스가 없어 빠지고, `JacksonAutoConfiguration`은 켜진다. `exclude`한 것은 exclusions에 나온다'
    how: '`ConditionEvaluationReport.get(beanFactory)`를 읽는다'
    test: AutoConfigTest.conditionReport
  - claim: '내 `ObjectMapper` 빈이 있으면 앱이 뜨고 `ObjectMapper`는 하나이며, `spring.jackson.property-naming-strategy`가 응답에 적용되지 않는다. `LocalDate`가 든 응답은 500이다'
    how: '작은 웹 앱에서 응답 JSON을 본다. 처음에는 날짜가 든 응답으로 키를 보려다 500이 나서, 날짜 없는 `OrderSummary`로 키를 보고 500은 따로 보였다'
    test: AutoConfigTest.myObjectMapperWins
  - claim: '내 `new ObjectMapper()`는 `LocalDate`를 쓰지 못하고(`InvalidDefinitionException`), 자동 설정의 것은 문자열로 쓴다'
    how: '두 `ObjectMapper`로 같은 객체를 써서 비교한다'
    test: AutoConfigTest.plainMapperLosesJavaTime
  - claim: '설정 값만 적으면 응답 키가 `order_id`가 되고, 커스터마이저를 쓰면 자동 설정의 빈이 남아 날짜 모듈도 남는다'
    how: '작은 웹 앱의 응답'
    test: AutoConfigTest.propertyChangesAutoMapper, AutoConfigTest.customizerKeepsAutoConfig
  - claim: 'DB 주소 없이 `DataSourceAutoConfiguration`을 켜면 뜨지 않고, 시작 로그에 "Failed to configure a DataSource"가 나온다'
    how: '`spring.datasource.url`이 없는 작은 앱을 띄운다. 예외 자체의 메시지는 "Failed to determine a suitable driver class"이고, 설계서에 적은 문장은 스프링 부트가 시작 로그에 찍는 실패 분석이라 로그를 잡아 확인했다'
    test: AutoConfigTest.dataSourceWithoutUrlFails
sources:
  - '자동 설정의 원리와 조건, 내 빈이 이기는 것: 스프링 부트 문서 https://docs.spring.io/spring-boot/reference/using/auto-configuration.html'
  - '자동 설정 만들기와 목록 파일: https://docs.spring.io/spring-boot/reference/features/developing-auto-configuration.html'
  - '`spring.jackson.*`과 커스터마이저: https://docs.spring.io/spring-boot/how-to/spring-mvc.html#howto.spring-mvc.customize-jackson-objectmapper'
  - '액추에이터 conditions 엔드포인트: https://docs.spring.io/spring-boot/api/rest/actuator/conditions.html'
