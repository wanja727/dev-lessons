    - ci:
        key: equalsOnly
        label: 실제로 돌린 출력 보기
        source: EqualsHashCodeTest.equalsOnlyNotFoundInSet
    - p: '`equals`만 재정의했을 때 `equals`는 **0번** 불렸어요. `hashCode`가 같은 객체가 없어서 `equals`까지 가지 못했어요. `equals`를 아무리 맞게 써도 불리지 않으면 소용이 없어요.'
    - p: 같은 이유로 생기는 일이 더 있어요.
    - ul:
      - '`set.add(b)`는 true를 돌려주고 `set.size()`는 2가 돼요. 같은 회원이 두 번 들어가요.'
      - '`map.put(a, "VIP")` 뒤에 `map.get(b)`는 null이에요. 이메일이 같은 회원의 등급을 찾지 못해요.'
      - '`list.contains(b)`는 true예요. `ArrayList`는 `hashCode`를 쓰지 않고 `equals`만 불러요. 그래서 리스트에서는 찾고 `HashSet`에서는 못 찾아요.'
    - p: 반대로 `hashCode`만 재정의하고 `equals`를 재정의하지 않아도 찾지 못해요. 이번에는 `hashCode`는 같은데 `equals`가 false예요.
    - more:
        summary: '더 알아보기: 왜 "hashCode가 다르게 나왔다"고 적어 두나요'
        body:
        - p: '`Object`의 `hashCode`는 서로 다른 객체에 되도록 다른 값을 줘요. 하지만 [자바 API 문서](link:hashCode)는 늘 다르다고 보장하지 않아요. 그래서 이 레슨의 예제는 두 값이 다르게 나온 것을 적어 두고 시작해요.'
        - p: 객체를 많이 만들면 재정의하지 않은 `hashCode`가 같은 두 객체가 실제로 나와요. 그 둘이라면 `equals`만 재정의해도 `contains`가 true예요. `equals`만 재정의한 코드는 이런 우연에 따라 결과가 달라지는 코드예요.
        - ci:
            key: identity
            label: hashCode가 같은 두 객체를 찾은 출력 보기
            source: EqualsHashCodeTest.identityHashCodesCanCollide
    - quiz:
        q: equals만 재정의한 Member예요. 이메일이 같은 a와 b의 hashCode가 다르게 나왔어요. set.add(a)와 set.add(b)를 차례로 부른 뒤 set.size()는?
        options:
        - '1'
        - '2'
        answer: 2
        explain: hashCode가 달라서 HashSet은 b를 a와 비교하지도 않고 새 객체로 넣어요. 같은 회원이 두 번 들어가요.
    - next: '`hashCode`가 달라서 `equals`까지 가지 못했어요. 그러면 `hashCode`는 어떻게 재정의해야 할까요?'
    recall: '`HashSet`은 찾는 객체의 `hashCode`로 찾을 곳을 먼저 좁히고, `hashCode`가 같은 객체에만 `equals`를 불러요. `hashCode`를 재정의하지 않으면 이메일이 같아도 객체마다 값이 달라서 `equals`까지 가지 못해요. 그래서 `contains`가 false이고, 같은 회원이 두 번 들어가고, `HashMap`의 `get`은 null을 돌려줘요.'
  - id: q3
    title: 그러면 hashCode는 어떻게 재정의해야 하나요?
    conclusion:
      lead: '`equals`가 같다고 하는 두 객체는 `hashCode`도 같은 값을 돌려주게 재정의해요.'
      sub: '`equals`에서 비교한 필드로 `hashCode`를 만들면 돼요. 이것이 `hashCode`의 규약이고, 둘을 함께 재정의해야 하는 이유예요.'
    says:
      - '`hashCode`의 규약: `equals`로 같은 두 객체는 `hashCode`가 같은 값을 돌려줘야 한다. 자바 API 문서가 정한 약속이고, `HashSet`과 `HashMap`은 이 약속을 믿고 동작한다'
      - 규약은 컴파일러가 검사하지 않는다. 어겨도 컴파일되고 예외도 나지 않는다. 결과만 틀린다
      - 코드 both는 `equals`가 비교하는 `email`로 `hashCode`를 만든다. 이메일이 같으면 `hashCode`도 같다
      - 코드 both로 코드 predict를 돌리면 `set.contains(b)`는 true이고 `equals`는 1번 불린다. `set.add(b)`는 false, `set.size()`는 1, `map.get(b)`는 VIP다
      - 필드가 여럿이면 `Objects.hash(a, b)`로 만든다. `equals`에서 비교하지 않는 필드는 `hashCode`에 넣지 않는다. 넣으면 `equals`는 같은데 `hashCode`가 달라질 수 있다
      - 더 알아보기. `record`는 구성 요소로 `equals`와 `hashCode`를 함께 만들어 준다. 자세한 것은 J9 불변 객체에서 다룬다
    widget:
      kind: toggle
      note: >-
        `Member`를 세 가지(재정의 없음, equals만, 둘 다) 가운데 고르면 같은 코드의 결과가 바뀐다. 결과는 `list.contains(b)`,
        `set.contains(b)`, `set.size()`, `map.get(b)`, `equals` 호출 횟수 다섯 줄이다. 재정의 없음과 equals만은
        두 객체의 `hashCode`가 다르게 나왔을 때의 결과라고 적는다.
    asks:
      - 코드 both로 `a`를 넣은 `HashSet`에 `contains(b)`를 부르면 결과와 `equals` 호출 횟수는 (true, 1번)
      - 코드 both로 `set.add(a)`와 `set.add(b)`를 한 뒤 `set.size()`는 (1)
      - 코드 both로 `map.put(a, "VIP")`, `map.put(b, "GOLD")`를 한 뒤 `map.size()`와 `map.get(a)`는 (1, GOLD)
      - '`equals`가 `email`만 비교하는 클래스에서 규약을 어기는 `hashCode`를 고른다. 보기: `email.hashCode()`, 항상 1, `email`과 가입 시각으로 만든 값 (가입 시각을 넣은 것)'
      - OX. `equals`와 `hashCode` 가운데 하나만 재정의하면 컴파일 오류가 난다 (X)
      - 설명형. `equals`와 `hashCode`를 함께 재정의해야 하는 이유를 `hashCode`의 규약과 `HashSet`이 찾는 순서로 설명한다
    body:
    - p: 자바 API 문서는 `hashCode`를 재정의할 때 지킬 약속을 정해 두었어요([Object.hashCode](link:hashCode)). 이런 약속을 **규약**이라고 해요. 핵심은 한 줄이에요.
    - callout: '**hashCode의 규약:** `equals`로 같은 두 객체는 `hashCode`도 같은 값을 돌려줘야 해요.'
    - p: '`HashSet`과 `HashMap`은 이 약속을 믿고 `hashCode`가 다른 객체를 건너뛰어요. 지키는 방법은 간단해요. `equals`에서 비교한 필드로 `hashCode`를 만들어요.'
    - code: bothMark
      notes:
      - mark: email.equals(m.email)
        as: code
        text: '`equals`가 비교하는 필드는 `email`이에요.'
      - mark: email.hashCode()
        as: code
        text: 같은 `email`로 `hashCode`를 만들어요. 문자열은 내용이 같으면 `hashCode`가 같아요. 그래서 이메일이 같은 두 회원은 `hashCode`도 같아요.
    - p: 아래 코드를 세 가지 `Member`로 돌린 결과예요. `Member`를 바꿔 가며 비교해 보세요.
    - code: three
    - widget:
        kind: toggle
        layout:
        - selector
        - duo
        - verdict
        selector:
          label: Member가 재정의한 것
          options:
          - value: none
            label: 없음
          - value: equalsOnly
            label: equals만
          - value: both
            label: 둘 다
        scenes:
          none:
            duo:
            - label: ArrayList
              rows:
              - k: list.contains(b)
                v: 'false'
                mark: bad
            - label: HashSet과 HashMap
              rows:
              - k: set.contains(b)
                v: 'false'
                mark: bad
              - k: 그동안 equals 호출
                v: 0번
              - k: set.add(b) 뒤 set.size()
                v: '2'
                mark: bad
              - k: map.get(b)
                v: 'null'
                mark: bad
            verdict: '재정의 없음: 어디서도 같은 회원으로 보지 않아요. 두 객체의 hashCode가 다르게 나왔을 때의 결과예요.'
          equalsOnly:
            duo:
            - label: ArrayList
              rows:
              - k: list.contains(b)
                v: 'true'
            - label: HashSet과 HashMap
              rows:
              - k: set.contains(b)
                v: 'false'
                mark: bad
              - k: 그동안 equals 호출
                v: 0번
              - k: set.add(b) 뒤 set.size()
                v: '2'
                mark: bad
              - k: map.get(b)
                v: 'null'
                mark: bad
            verdict: 'equals만: 리스트는 찾고 HashSet과 HashMap은 못 찾아요. 두 객체의 hashCode가 다르게 나왔을 때의 결과예요.'
          both:
            duo:
            - label: ArrayList
              rows:
              - k: list.contains(b)
                v: 'true'
            - label: HashSet과 HashMap
              rows:
              - k: set.contains(b)
                v: 'true'
              - k: 그동안 equals 호출
                v: 1번
              - k: set.add(b) 뒤 set.size()
                v: '1'
              - k: map.get(b)
                v: VIP
            verdict: '둘 다: 어디서나 같은 회원으로 봐요. hashCode가 같은 a를 찾아 equals 1번으로 확인했어요.'
    - ci:
        key: both
        label: 둘 다 재정의하고 실제로 돌린 출력 보기
        source: EqualsHashCodeTest.bothFoundInHashSet
    - p: 둘 다 재정의하면 `set.contains(b)`가 true이고, 그동안 `equals`는 **1번** 불려요. `hashCode`가 같은 `a`가 후보가 됐고, `equals`로 확인했어요. `set.add(b)`는 false를 돌려줘서 `set.size()`는 1이에요. `map.get(b)`는 VIP예요.
    - p: '`HashMap`에 `map.put(b, "GOLD")`를 하면 새로 들어가지 않고 `a`로 넣은 값이 바뀌어요. `map.size()`는 1이고 `map.get(a)`는 GOLD예요.'
    - callout: '**규약은 컴파일러가 검사하지 않아요.** 하나만 재정의해도 컴파일되고 예외도 나지 않아요. 결과만 틀려요. 그래서 `equals`를 재정의하면 `hashCode`도 함께 재정의해요.'
    - h3: 필드가 여럿일 때
    - p: '`equals`가 필드 여러 개를 비교하면 `Objects.hash`에 그 필드들을 넣어 만들어요.'
    - code: objectsHash
    - p: '`equals`에서 비교하지 않는 필드는 `hashCode`에 넣지 않아요. `equals`는 이메일만 비교하는데 `hashCode`에 가입 시각까지 넣었다고 해 볼게요. 이메일이 같고 가입 시각이 다른 두 회원은 `equals`로는 같은데 `hashCode`가 달라질 수 있어요. 규약을 어기는 거예요.'
    - more:
        summary: '더 알아보기: record는 둘을 함께 만들어 줘요'
        body:
        - p: '`record Member(String email) {}`처럼 선언하면 자바가 구성 요소(여기서는 `email`)로 `equals`와 `hashCode`를 함께 만들어 줘요([Record](link:record)). 이메일이 같은 두 `Member`는 `equals`가 true이고 `hashCode`가 같아서 `HashSet`이 찾아요. `record`는 불변 객체 레슨에서 다뤄요.'
    - quiz:
        q: equals는 이메일만 비교하고, hashCode는 이메일과 가입 시각으로 만들었어요. 이메일이 같고 가입 시각이 다른 a와 b의 hashCode가 다르게 나왔어요. a를 넣은 HashSet에 contains(b)를 부르면?
        options:
        - 'true'
        - 'false'
        - 예외가 난다
        answer: 2
        explain: equals로는 같지만 hashCode가 달라서 HashSet은 equals를 부르지도 않아요. 규약을 어겨도 예외는 나지 않고 결과만 틀려요.
    - next: 같은 객체면 `hashCode`가 같아야 해요. 그러면 거꾸로, `hashCode`가 같은 두 객체는 `equals`도 같아야 할까요?
    recall: '`equals`가 같다고 하는 두 객체는 `hashCode`도 같은 값을 돌려주게 재정의해요. 이것이 `hashCode`의 규약이에요. `HashSet`과 `HashMap`은 `hashCode`가 다른 객체를 건너뛰므로, 규약을 어기면 같은 객체를 찾지 못해요. `equals`에서 비교한 필드로 `hashCode`를 만들면 지킬 수 있어요. 컴파일러는 규약을 검사하지 않아요.'
  - id: q4
    title: 거꾸로 hashCode가 같은 두 객체는 equals도 같아야 하나요?
    conclusion:
      lead: '아니요. 규약은 한 방향이에요. `equals`가 다른 두 객체가 같은 `hashCode`를 돌려줘도 결과는 맞아요.'
      sub: '대신 `hashCode`가 같은 객체가 많을수록 `equals`로 비교하는 횟수가 늘어 느려져요.'
    says:
      - 규약은 "같은 객체면 같은 `hashCode`"만 요구한다. 다른 객체가 같은 `hashCode`를 가지는 것은 허용한다
      - 실제 예. 문자열 "Aa"와 "BB"는 `hashCode`가 둘 다 2112이고 `equals`는 false다. 코드 both로 이메일이 "Aa"인 회원과 "BB"인 회원을 `HashSet`에 넣으면 `size()`는 2이고 둘 다 찾는다
      - '`hashCode`가 같으면 `HashSet`은 `equals`로 마지막 확인을 한다. 그래서 결과가 틀리지 않는다'
      - 코드 constant처럼 `hashCode`가 항상 1을 돌려줘도 규약을 지킨다. `contains`, `size()`, `get`의 결과는 코드 both와 같다
      - 달라지는 것은 `equals` 호출 횟수다. 이메일이 서로 다른 회원 5명을 넣는 동안 코드 both는 0번, 코드 constant는 10번 부른다
      - 들어 있지 않은 회원을 `contains`로 찾으면 코드 both는 0번, 코드 constant는 5번 부른다. 들어 있는 것 전부와 비교한다
      - 회원 수가 늘면 코드 constant의 비교 횟수는 회원 수만큼 는다. 그래서 `hashCode`는 다른 객체에 되도록 다른 값을 주게 만든다. 왜 그런 차이가 나는지와 얼마나 빨라지는지는 K4 해시 테이블에서 다룬다
    widget:
      kind: toggle
      note: >-
        `hashCode`를 `email.hashCode()`와 "항상 1" 가운데 고르고 실행 버튼을 누른다. 회원 5명이 든 `HashSet`에서 없는 회원
        `han@a.com`을 찾을 때 `equals`가 불린 것을 번호 붙은 로그로 보여 준다. 앞쪽은 0줄, 뒤쪽은 5줄이다. 결과(false)는 양쪽이 같다는 것을 한 줄 정리에 적는다.
    asks:
      - '"Aa"와 "BB"의 `hashCode`는 둘 다 2112다. 코드 both로 이메일이 "Aa"인 회원과 "BB"인 회원을 `HashSet`에 넣으면 `size()`는 (2)'
      - 코드 constant로 이메일이 서로 다른 회원 5명을 넣은 `HashSet`에서 들어 있지 않은 회원을 `contains`로 찾는 동안 `equals`는 몇 번 불리나 (5번)
      - 같은 일을 코드 both로 하면 몇 번 불리나. 이메일 여섯 개의 `hashCode`는 모두 다르다 (0번)
      - 코드 constant로 이메일이 같은 `a`와 `b`를 `HashSet`에 넣으면 `size()`는 (1)
      - OX. `hashCode`가 항상 1을 돌려주는 것은 `hashCode`의 규약을 어긴다 (X)
      - 설명형. `hashCode`가 항상 같은 값을 돌려주면 무엇이 그대로이고 무엇이 달라지는지 설명한다
    body:
    - p: 규약은 "같은 객체면 같은 `hashCode`"만 요구해요. 다른 객체가 같은 `hashCode`를 가지는 것은 허용해요.
    - p: 실제 예가 있어요. 문자열 `"Aa"`와 `"BB"`는 `hashCode`가 둘 다 2112예요. `equals`는 false예요. 이메일이 `"Aa"`인 회원과 `"BB"`인 회원을 `HashSet`에 넣으면 `size()`는 2이고 둘 다 찾아요. `Member`는 `equals`와 `hashCode`를 둘 다 재정의한 것이에요.
    - ci:
        key: collision
        label: 실제로 돌린 출력 보기
        source: EqualsHashCodeTest.sameHashCodeDifferentEquals
    - p: '`hashCode`가 같으면 `HashSet`은 `equals`로 마지막 확인을 해요. 그래서 `hashCode`가 겹쳐도 결과는 틀리지 않아요.'
    - h3: hashCode가 항상 같은 값이면
    - p: 끝까지 가 볼게요. `hashCode`가 항상 1을 돌려줘도 규약은 지켜요. 같은 객체는 같은 값(1)을 받으니까요.
    - code: constant
    - p: '`contains`, `size()`, `get`의 결과는 `email.hashCode()`를 쓸 때와 같아요. 이메일이 같은 회원을 다시 `add`하면 false가 돌아오고 크기도 그대로예요. 달라지는 것은 **`equals`를 부르는 횟수**예요.'
    - p: 이메일이 서로 다른 회원 5명을 넣고, 들어 있지 않은 회원을 찾아볼게요. 이메일 여섯 개의 `hashCode`는 모두 달라요.
    - code: five
    - p: 아래에서 `hashCode`를 고르고 실행해 보세요. 로그 한 줄이 `equals` 호출 한 번이에요.
    - widget:
        kind: toggle
        layout:
        - selector
        - buttons
        - duo
        - log
        - verdict
        selector:
          label: hashCode가 돌려주는 값
          options:
          - value: email
            label: email.hashCode()
          - value: one
            label: 항상 1
        run:
          label: set.contains(han@a.com) 실행
        initial:
          duo:
          - label: contains의 결과
            state: dim
            text: 아직 실행 전
          - label: equals 호출
            state: dim
            text: 아직 실행 전
          log: []
        scenes:
          email:
            duo:
            - label: contains의 결과
              rows:
              - k: 결과
                v: 'false'
            - label: equals 호출
              rows:
              - k: 횟수
                v: 0번
            log:
            - note: equals가 한 번도 불리지 않았어요. hashCode가 han@a.com과 같은 회원이 없어요.
            verdict: 'email.hashCode(): 결과는 false, equals 호출은 0번이에요.'
          one:
            duo:
            - label: contains의 결과
              rows:
              - k: 결과
                v: 'false'
            - label: equals 호출
              rows:
              - k: 횟수
                v: 5번
                mark: bad
            log:
            - han@a.com.equals(kim@a.com)  → false
            - han@a.com.equals(lee@a.com)  → false
            - han@a.com.equals(park@a.com)  → false
            - han@a.com.equals(choi@a.com)  → false
            - han@a.com.equals(jung@a.com)  → false
            verdict: '항상 1: 결과는 똑같이 false예요. 그런데 들어 있는 5명 전부와 equals로 비교했어요.'
    - ci:
        key: count
        label: 실제로 돌린 출력 보기
        source: EqualsHashCodeTest.equalsCallsWhileSearchingMissing
    - p: '`hashCode`가 항상 1이면 들어 있는 회원 모두가 후보가 돼요. 그래서 5명 전부와 `equals`로 비교해요. 결과는 양쪽 다 false로 같아요.'
    - p: 회원 5명을 넣는 동안에도 차이가 나요. `email.hashCode()`는 `equals`를 0번, 항상 1은 10번 불러요. 넣을 때마다 먼저 들어 있는 회원 모두와 비교하기 때문이에요(0 + 1 + 2 + 3 + 4).
    - p: 회원이 늘수록 비교하는 횟수도 늘어요. 그래서 `hashCode`는 다른 객체에 되도록 다른 값을 주게 만들어요. 왜 그런 차이가 나는지와 얼마나 빨라지는지는 해시 테이블 레슨에서 다뤄요.
    - quiz:
        q: equals는 이메일을 비교하고 hashCode는 항상 1을 돌려주는 Member예요. 이 hashCode는 hashCode의 규약을 어길까요?
        options:
        - 어긴다. 다른 객체가 같은 값을 받는다
        - 어기지 않는다. 같은 객체는 같은 값을 받는다
        answer: 2
        explain: 규약은 같은 객체가 같은 hashCode를 받는 것만 요구해요. 다른 객체가 같은 값을 받는 것은 허용해요. 대신 equals 호출이 늘어 느려져요.
    - next: 규약을 지키고 `hashCode`도 잘 만들었어요. 그러면 `HashMap`에서 언제나 찾을 수 있을까요?
    recall: 아니요. 규약은 "같은 객체면 같은 `hashCode`" 한 방향이에요. `"Aa"`와 `"BB"`처럼 `equals`가 다른 두 객체가 같은 `hashCode`를 돌려줘도, `HashSet`이 `equals`로 마지막 확인을 하므로 결과는 맞아요. 대신 `hashCode`가 같은 객체가 많을수록 `equals`로 비교하는 횟수가 늘어 느려져요. `hashCode`가 항상 1이면 들어 있는 것 전부와 비교해요.
  - id: q5
    title: 둘 다 맞게 재정의하면 HashMap에서 언제나 찾을 수 있나요?
    conclusion:
      lead: '아니요. 키로 넣은 뒤에 `hashCode`에 쓰인 필드를 바꾸면 그 키로 찾지 못해요.'
      sub: '넣을 때의 `hashCode`로 자리가 정해졌는데 찾을 때는 바뀐 `hashCode`로 찾기 때문이에요. 그래서 `equals`와 `hashCode`에 쓰는 필드는 바꾸지 못하게 만들어요.'
    says:
      - '`HashMap`은 키를 넣을 때의 `hashCode`로 둘 곳을 정한다. 넣은 뒤에 키의 필드가 바뀌어도 다시 옮기지 않는다'
      - 코드 both와 코드 mutate. `map.put(a, "VIP")` 뒤 `a.email`을 "lee@a.com"으로 바꾸면 `map.get(a)`는 null이다. 넣을 때 쓴 바로 그 객체로도 찾지 못한다
      - '`map.size()`는 1이다. 값은 맵 안에 남아 있고 찾을 길만 없다'
      - '새 객체로도 찾지 못한다. `map.get(new Member("kim@a.com"))`은 `hashCode`는 맞지만 맵 안의 키가 이제 lee라서 `equals`가 false다. `map.get(new Member("lee@a.com"))`은 `hashCode`가 넣을 때의 것과 다르다. 둘 다 null이다'
      - 조건을 적는 이유. 키로 든 객체를 `equals`에 영향을 주게 바꿨을 때의 동작은 `Map` 명세가 정하지 않는다. 위 결과는 자바 21(OpenJDK)의 `HashMap`에서, 두 이메일의 `hashCode`가 다를 때의 결과다
      - '`HashSet`도 같다. 넣은 뒤 필드를 바꾸면 `contains`가 false다'
      - 막는 방법. `email`을 `final`로 선언하면 넣은 뒤에 바꿀 수 없다. 불변 객체는 J9에서 다룬다
    widget:
      kind: steps
      note: >-
        코드 mutate를 한 줄씩 실행한다. 단계는 넣기, 이메일 바꾸기, `get(a)`, `get(new Member("kim@a.com"))`이다. 위의 두 칸(`duo`)에
        "맵이 기억하는 것(넣을 때의 hashCode, 키의 이메일)"과 "지금 찾는 키(hashCode, 이메일)"를 나란히 두고 단계마다 바뀐 줄을 표시한다. 로그에는 출력이 쌓인다.
    asks:
      - 코드 both와 코드 mutate를 돌리면 두 줄에 무엇이 출력되나. "kim@a.com"과 "lee@a.com"의 `hashCode`는 다르다 (null과 1)
      - 같은 코드 뒤에 `map.get(new Member("kim@a.com"))`을 부르면 (null)
      - 같은 코드에서 `a.email`을 바꾸는 줄을 지우면 첫 줄에 무엇이 출력되나 (VIP)
      - 코드 both에서 `email`을 `final`로 바꾸고 코드 mutate를 컴파일하면 (`a.email = "lee@a.com"` 줄에서 컴파일 오류)
      - 설명형. `HashMap`의 키로 넣은 객체의 필드를 바꾸면 생기는 일과 막는 방법을 설명한다
    body:
    - p: '`HashMap`은 키를 넣을 때의 `hashCode`로 둘 곳을 정해요. 넣은 뒤에 키의 필드가 바뀌어도 다시 옮기지 않아요.'
    - p: 회원의 등급을 `HashMap`에 담은 뒤 그 회원의 이메일을 바꿔 볼게요. `Member`는 `equals`와 `hashCode`를 둘 다 재정의한 것이에요.
    - code: mutateMark
      notes:
      - mark: a.email = "lee@a.com";
        as: code
        text: 맵에 키로 넣은 객체의 이메일을 바꿔요. `hashCode`를 이메일로 만드니 `a.hashCode()`도 바뀌어요.
    - p: 아래에서 한 줄씩 실행해 보세요. 왼쪽은 맵이 기억하는 것, 오른쪽은 지금 찾는 키예요.
    - widget:
        kind: steps
        layout:
        - duo
        - buttons
        - log
        - verdict
        initial:
          duo:
          - label: 맵이 기억하는 것
            state: dim
            text: 비어 있어요
          - label: 지금 찾는 키
            state: dim
            text: 아직 찾지 않았어요
        scenarios:
          default:
          - log: map.put(a, "VIP")  → kim@a.com의 hashCode로 둘 곳을 정해요
            duo:
            - label: 맵이 기억하는 것
              state: active
              rows:
              - k: 넣을 때의 hashCode
                v: '-1935638077'
                mark: changed
              - k: 키의 이메일
