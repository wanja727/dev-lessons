title: equals와 hashCode
description: 값이 같은 두 객체를 같다고 판정하게 하는 법, equals만 재정의하면 HashSet이 못 찾는 까닭, hashCode의 규약, 키로 넣은 뒤 필드를 바꾸면 생기는 일. 다섯 가지 질문에 스스로 답할 수 있게 만드는 대화형 레슨.
unit: 자바 언어
minutes: 20
roadmap: J6
type: 자바 실행
# J2 값과 참조는 아직 없는 레슨이다. 링크가 깨지지 않게 비워 두었다. J2를 만들면 아래 줄을 되살린다
#   - {slug: value-and-reference, title: 값과 참조}
prerequisites: []
assume: >-
  자바 21(OpenJDK). `==`는 두 변수가 같은 객체를 가리키는지 본다는 것, `ArrayList`와 `HashSet`과 `HashMap`에
  넣고 꺼내는 방법. `HashMap`이 안에서 어떻게 저장하는지는 몰라도 돼요. 예제는 이메일 하나를 가진 회원 클래스 `Member` 하나만 써요.
example: 회원 가입. 이메일이 같은 `Member`는 같은 회원으로 본다. 이미 가입한 이메일인지 `HashSet`으로 확인하고, 회원의 등급을 `HashMap`에 담는다
