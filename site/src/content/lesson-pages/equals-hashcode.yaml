          - log: a.email = "lee@a.com"  → 맵 안의 키도 같은 객체라 이메일이 바뀌어요. 둔 곳은 그대로예요
            duo:
            - label: 맵이 기억하는 것
              state: active
              rows:
              - k: 넣을 때의 hashCode
                v: '-1935638077'
              - k: 키의 이메일
                v: lee@a.com
                mark: changed
            - label: 지금 찾는 키
              state: dim
              text: 아직 찾지 않았어요
          - log: map.get(a)  → null
            duo:
            - label: 맵이 기억하는 것
              state: active
              rows:
              - k: 넣을 때의 hashCode
                v: '-1935638077'
              - k: 키의 이메일
                v: lee@a.com
            - label: 지금 찾는 키
