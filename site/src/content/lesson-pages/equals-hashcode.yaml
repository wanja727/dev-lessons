codes:
  plain: |-
    class Member {
        String email;
        Member(String email) {
            this.email = email;
        }
    }
  equalsOnly: |-
    class Member {
        String email;
        Member(String email) {
            this.email = email;
        }
        @Override
        public boolean equals(Object o) {
            if (!(o instanceof Member m)) {
                return false;
            }
            return email.equals(m.email);
        }
    }
  both: |-
    class Member {
        String email;
        Member(String email) {
            this.email = email;
        }
        @Override
        public boolean equals(Object o) {
            if (!(o instanceof Member m)) {
                return false;
            }
            return email.equals(m.email);
        }
        @Override
        public int hashCode() {
            return email.hashCode();
        }
    }
  constant: |-
    @Override
    public int hashCode() {
        return 1;
    }
  predict: |-
    Member a = new Member("kim@a.com");
    Member b = new Member("kim@a.com");
    // a.hashCode()와 b.hashCode()는
    // 서로 다른 값이 나왔어요

    List<Member> list = new ArrayList<>();
    list.add(a);
    Set<Member> set = new HashSet<>();
    set.add(a);

    System.out.println(list.contains(b));
    System.out.println(set.contains(b));
  mutate: |-
    Member a = new Member("kim@a.com");
    Map<Member, String> map = new HashMap<>();
    map.put(a, "VIP");

    a.email = "lee@a.com";

    System.out.println(map.get(a));
    System.out.println(map.size());
  # 여기부터는 본문 단계에서 더한 코드다. 위의 코드를 강조만 바꾸거나 이어 붙였다
  predictFull: |-
    class Member {
        String email;
        Member(String email) {
            this.email = email;
        }
        @Override
        public boolean equals(Object o) {
            if (!(o instanceof Member m)) {
                return false;
            }
            return email.equals(m.email);
        }
    }

    Member a = new Member("kim@a.com");
    Member b = new Member("kim@a.com");
    // a.hashCode()와 b.hashCode()는
    // 서로 다른 값이 나왔어요

    List<Member> list = new ArrayList<>();
    list.add(a);
    Set<Member> set = new HashSet<>();
    set.add(a);

    System.out.println(list.contains(b));
    System.out.println(set.contains(b));
  compare: |-
    Member a = new Member("kim@a.com");
    Member b = new Member("kim@a.com");

    List<Member> list = new ArrayList<>();
    list.add(a);

    a == b;            // false
    a.equals(b);       // false
    a.equals(a);       // true
    list.contains(b);  // false
  equalsMark: |-
    class Member {
        String email;
        Member(String email) {
            this.email = email;
        }
        @Override
        public boolean equals(Object o) {
            if (!([[o instanceof Member m]])) {
                return false;
            }
            return [[email.equals(m.email)]];
        }
    }
  predictSet: |-
    Member a = new Member("kim@a.com");
    Member b = new Member("kim@a.com");
    // a.hashCode()와 b.hashCode()는
    // 서로 다른 값이 나왔어요

    List<Member> list = new ArrayList<>();
    list.add(a);
    Set<Member> set = new HashSet<>();
    set.add(a);

    System.out.println(list.contains(b));
    System.out.println([[set.contains(b)]]);
  bothMark: |-
    class Member {
        String email;
        Member(String email) {
            this.email = email;
        }
        @Override
        public boolean equals(Object o) {
            if (!(o instanceof Member m)) {
                return false;
            }
            return [[email.equals(m.email)]];
        }
        @Override
        public int hashCode() {
            return [[email.hashCode()]];
        }
    }
  three: |-
    Member a = new Member("kim@a.com");
    Member b = new Member("kim@a.com");

    List<Member> list = new ArrayList<>();
    list.add(a);
    Set<Member> set = new HashSet<>();
    set.add(a);
    Map<Member, String> map = new HashMap<>();
    map.put(a, "VIP");

    list.contains(b);
    set.contains(b);
    set.add(b);
    set.size();
    map.get(b);
  objectsHash: |-
    // equals가 email과 name을 비교할 때
    @Override
    public int hashCode() {
        return Objects.hash(email, name);
    }
  five: |-
    Set<Member> set = new HashSet<>();
    set.add(new Member("kim@a.com"));
    set.add(new Member("lee@a.com"));
    set.add(new Member("park@a.com"));
    set.add(new Member("choi@a.com"));
    set.add(new Member("jung@a.com"));

    // 들어 있지 않은 회원을 찾아요
    set.contains(new Member("han@a.com"));
  mutateMark: |-
    Member a = new Member("kim@a.com");
    Map<Member, String> map = new HashMap<>();
    map.put(a, "VIP");

    [[a.email = "lee@a.com";]]

    System.out.println(map.get(a));
    System.out.println(map.size());
  finalField: |-
    class Member {
        [[final]] String email;
        Member(String email) {
