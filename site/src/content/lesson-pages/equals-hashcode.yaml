            duo:
            - label: 맵이 기억하는 것
              state: active
              rows:
              - k: 넣을 때의 hashCode
                v: '-1935638077'
              - k: 키의 이메일
                v: lee@a.com
            - label: 지금 찾는 키
              state: active
              rows:
              - k: hashCode
                v: '-634494144'
                mark: bad
              - k: 이메일
                v: lee@a.com
          - log: map.get(new Member("kim@a.com"))  → null
            duo:
            - label: 맵이 기억하는 것
              state: active
              rows:
              - k: 넣을 때의 hashCode
                v: '-1935638077'
              - k: 키의 이메일
                v: lee@a.com
            - label: 지금 찾는 키
              state: active
              rows:
              - k: hashCode
                v: '-1935638077'
              - k: 이메일
                v: kim@a.com
                mark: bad
            verdict: 넣을 때 쓴 객체로는 hashCode가 달라서, 옛 이메일의 새 객체로는 hashCode는 같지만 equals가 false라서 찾지 못해요. 값은 맵 안에 남아 있어요.
    - ci:
        key: mutate
        label: 실제로 돌린 출력 보기
        source: EqualsHashCodeTest.mutatedKeyIsLost
        code: mutate
    - p: '`map.get(a)`는 **null**이에요. 넣을 때 쓴 바로 그 객체로도 찾지 못해요. 맵은 kim@a.com의 `hashCode`로 둔 곳을 기억하는데, 찾을 때는 lee@a.com의 `hashCode`로 찾기 때문이에요. `map.size()`는 **1**이에요. 값은 맵 안에 남아 있고 찾을 길만 없어요.'
    - p: 새 객체로도 찾지 못해요.
    - ul:
      - '`map.get(new Member("kim@a.com"))`은 null이에요. `hashCode`는 넣을 때의 것과 같아요. 하지만 맵 안의 키는 이제 이메일이 lee@a.com이라서 `equals`가 false예요.'
      - '`map.get(new Member("lee@a.com"))`도 null이에요. `hashCode`가 넣을 때의 것과 달라요.'
    - p: '`HashSet`도 같아요. 넣은 뒤 필드를 바꾸면 `contains`가 false예요.'
    - h3: 막는 방법
    - p: '`equals`와 `hashCode`에 쓰는 필드를 바꾸지 못하게 만들어요. 필드를 `final`로 선언하면 생성자에서 한 번 정한 뒤로는 값을 바꿀 수 없어요.'
    - code: finalField
      notes:
      - mark: final
        as: code
        text: 이제 `a.email = "lee@a.com"`은 컴파일 오류예요. 실행하기 전에 막아 줘요.
    - ci:
        key: final
        label: 컴파일러가 낸 오류 보기
        source: EqualsHashCodeTest.finalFieldCannotBeAssigned
    - muted: 이렇게 만든 뒤에 바뀌지 않는 객체를 불변 객체라고 해요. 불변 객체 레슨에서 다뤄요.
    - more:
        summary: '더 알아보기: 이 결과는 어디까지 보장되나요'
        body:
        - p: 키로 든 객체를 `equals`에 영향을 주게 바꿨을 때의 동작은 [Map 명세](link:map)가 정하지 않아요. 위 결과는 자바 21(OpenJDK)의 `HashMap`에서, 두 이메일의 `hashCode`가 다를 때의 결과예요. 어느 구현에서든 믿을 수 있는 것은 "키로 넣은 객체는 바꾸지 않는다"는 규칙이에요.
    - quiz:
        q: equals와 hashCode를 둘 다 이메일로 재정의한 Member예요. map.put(a, "VIP") 뒤에 a.email을 hashCode가 다른 이메일로 바꿨어요. map.size()는?
        options:
        - '0'
        - '1'
        answer: 2
        explain: 값은 맵 안에 그대로 남아 있어요. 그 키로 찾을 길만 없어져요.
    recall: 아니요. 키로 넣은 뒤에 `hashCode`에 쓰인 필드를 바꾸면 그 키로 찾지 못해요. `HashMap`은 넣을 때의 `hashCode`로 둘 곳을 정하고 다시 옮기지 않는데, 찾을 때는 바뀐 `hashCode`로 찾기 때문이에요. 값은 맵 안에 남아 `size()`는 그대로예요. 막으려면 `equals`와 `hashCode`에 쓰는 필드를 `final`로 선언해 바꾸지 못하게 해요.
interview:
  question: equals와 hashCode는 왜 함께 재정의해야 하나요?
  model:
  - label: 정의
    text: equals는 두 객체를 같다고 볼지 정하는 메서드이고, hashCode는 객체가 돌려주는 int 값입니다. 재정의하지 않으면 equals는 같은 객체일 때만 true이고, hashCode는 필드 값과 상관없이 객체마다 따로 정해집니다.
  - label: 원리
    text: HashSet과 HashMap은 hashCode로 찾을 곳을 먼저 좁히고, hashCode가 같은 객체에만 equals를 부릅니다. 그래서 equals로 같은 두 객체는 hashCode도 같아야 한다는 규약이 있습니다. equals만 재정의하면 값이 같은 두 객체의 hashCode가 달라서 equals까지 가지 못하고, 같은 객체가 두 번 들어가거나 get이 null을 돌려줍니다. equals에서 비교한 필드로 hashCode를 만들면 규약을 지킵니다.
  - label: 주의할 점
    text: 규약은 한 방향이라 다른 객체가 같은 hashCode를 가져도 결과는 맞지만, 겹칠수록 equals 비교가 늘어 느려집니다. 또 키로 넣은 뒤에 hashCode에 쓰인 필드를 바꾸면 그 키로 찾지 못하므로, 그 필드는 final로 둡니다. 컴파일러는 규약을 검사하지 않습니다.
  - label: 경험
    text: '(내 프로젝트로 채우기) 예: 값 객체를 HashSet에 넣어 중복을 걸러야 해서 equals와 hashCode를 함께 재정의하고, 값이 같은 두 객체가 한 번만 들어가는지 테스트로 확인했습니다.'
verified: "이 레슨에 나온 true와 false, 호출 횟수는 짐작이 아니라 자바 21(OpenJDK)에서 코드를 돌려 확인한 값이에요. 코드가 바뀔 때마다 테스트([EqualsHashCodeTest](link:test))가 다시 돌고, 결과가 달라지면 레슨을 고쳐요."
footer: '근거: 자바 21 API 문서의 [Object.equals](link:equals), [Object.hashCode](link:hashCode), [Collection](link:collection), [Map](link:map), [Record](link:record), [String.hashCode](link:string). true와 false, `equals` 호출 횟수는 자바 21(OpenJDK)에서 테스트로 확인했어요. 오류는 [GitHub 이슈](https://github.com/wanja727/dev-lessons/issues)로 알려 주세요.'
claims:
  - claim: 코드 plain. 이메일이 같은 두 객체에서 `a.equals(b)`는 false, `a.equals(a)`는 true, `list.contains(b)`는 false다
    how: 코드를 돌려 반환값을 본다. 돌려 봤다 (false, true, false)
  - claim: 코드 equalsOnly. `a == b`는 false, `a.equals(b)`는 true, `list.contains(b)`는 true다
    how: 코드를 돌려 반환값을 본다. 돌려 봤다 (false, true, true)
  - claim: 코드 equalsOnly, 두 객체의 `hashCode`가 다를 때. `set.contains(b)`는 false이고 그동안 `equals`는 0번 불린다. `set.add(b)`는 true, `set.size()`는 2, `map.get(b)`는 null이다
    how: >-
      테스트가 `hashCode`가 `a`와 다른 `b`가 나올 때까지 `b`를 다시 만든 뒤 확인한다. `equals` 안에서 호출 횟수를 센다.
      돌려 봤다. `b`는 첫 번째에 나왔다 (false, 0번, true, 2, null)
  - claim: 코드 both. `set.contains(b)`는 true이고 `equals`는 1번 불린다. `set.add(b)`는 false, `set.size()`는 1, `map.get(b)`는 VIP다. `put(b, "GOLD")` 뒤 `map.size()`는 1, `map.get(a)`는 GOLD다
    how: 코드를 돌려 반환값과 호출 횟수를 본다. 돌려 봤다 (true, 1번, false, 1, VIP, 1, GOLD)
  - claim: '`hashCode`만 재정의한 `Member`는 두 객체의 `hashCode`가 같아도 `set.contains(b)`가 false이고 `size()`는 2가 된다'
    how: 코드를 돌려 반환값을 본다. 돌려 봤다 (false, 2)
  - claim: '"Aa"와 "BB"의 `hashCode`는 둘 다 2112이고 `equals`는 false다. 코드 both로 두 이메일의 회원을 넣으면 `size()`는 2이고 둘 다 `contains`가 true다'
    how: 코드를 돌려 본다. 돌려 봤다 (2112, 2112, false, 2, true, true)
  - claim: 이메일이 서로 다른 회원 5명을 `HashSet`에 넣는 동안 `equals`는 코드 both에서 0번, 코드 constant에서 10번 불린다
    how: >-
      `equals` 안에서 호출 횟수를 센다. 이메일 여섯 개(넣는 다섯과 찾는 `han@a.com`)의 `hashCode`가 모두 다른 것도 테스트가 확인한다.
      돌려 봤다 (0번, 10번)
  - claim: 그 `HashSet`에서 들어 있지 않은 회원을 `contains`로 찾으면 `equals`는 코드 both에서 0번, 코드 constant에서 5번 불린다. 결과는 둘 다 false다
    how: 같은 방법. 돌려 봤다 (0번, 5번)
  - claim: 코드 constant에서도 이메일이 같은 회원을 다시 `add`하면 false가 돌아오고 `size()`는 그대로 5다
    how: 코드를 돌려 본다. 돌려 봤다 (false, 5)
  - claim: 코드 both와 코드 mutate. 이메일을 바꾼 뒤 `map.get(a)`는 null, `map.size()`는 1이다. `map.get(new Member("kim@a.com"))`과 `map.get(new Member("lee@a.com"))`도 null이다
    how: 코드를 돌려 본다. 두 이메일의 `hashCode`가 다른 것도 테스트가 확인한다. 돌려 봤다 (null, 1, null, null)
  - claim: 넣은 뒤 필드를 바꾼 객체는 `HashSet`의 `contains`도 false다
    how: 코드를 돌려 본다. 돌려 봤다 (false)
  - claim: '`email`이 `final`이면 `a.email = "lee@a.com"`은 컴파일 오류다'
    how: 테스트 안에서 자바 컴파일러(`javax.tools.JavaCompiler`)로 소스를 컴파일해 오류가 난 줄을 본다. `javac`로 돌려 봤다 (cannot assign a value to final variable email)
  - claim: '`record Member(String email)`은 이메일이 같으면 `equals`가 true이고 `hashCode`가 같고 `set.contains`가 true다'
    how: 코드를 돌려 본다. 돌려 봤다 (true, 같음, true)
sources:
  - '재정의하지 않은 `equals`는 `x == y`일 때만 true라는 것, `equals`를 재정의하면 `hashCode`도 재정의해야 한다는 것: [Object.equals (자바 21 API)](link:equals)'
  - '`hashCode`의 규약 세 가지(같은 객체는 같은 값, 다른 객체가 같은 값이어도 된다, 비교에 쓰는 정보가 바뀌지 않으면 같은 값)와 `Object`의 `hashCode`가 서로 다른 객체에 "되도록" 다른 값을 준다는 것: [Object.hashCode (자바 21 API)](link:hashCode)'
  - '구현이 `hashCode`를 먼저 비교해 `equals` 호출을 건너뛰어도 된다는 것: [Collection (자바 21 API)](link:collection)'
  - '키로 든 객체를 `equals`에 영향을 주게 바꾸면 맵의 동작이 정해지지 않는다는 것: [Map (자바 21 API)](link:map)'
  - '`record`의 `equals`와 `hashCode`가 구성 요소에서 만들어진다는 것: [Record (자바 21 API)](link:record)'
  - '문자열의 `hashCode`를 계산하는 식: [String.hashCode (자바 21 API)](link:string)'
