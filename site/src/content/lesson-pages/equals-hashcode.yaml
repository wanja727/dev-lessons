predict:
  title: 두 줄에 무엇이 출력될까요?
  text: >-
    회원 클래스 `Member`는 이메일 하나를 가져요. 이메일이 같으면 같은 회원으로 보려고 `equals`라는 메서드를 고쳐 썼어요.
    이메일이 같은 회원 `a`와 `b`를 만들고, `a`만 `ArrayList`와 `HashSet`에 넣었어요. 그다음 두 곳에 `b`가 들어 있는지 물어요.
    모르는 게 정상이니 감으로 골라 보세요.
  code: predictFull
  label: 내 예측 (첫 줄, 둘째 줄)
  options:
    - value: tt
      label: true, true
    - value: tf
      label: true, false
    - value: ft
      label: false, true
    - value: ff
      label: false, false
  answer: tf
  storageKey: eqh-predict
  wrong: 예측은 "{label}"이었어요. 틀린 예측이 더 오래 남으니 괜찮아요.
questions:
  - id: q1
    title: 값이 같은 두 객체를 같다고 판정하게 하려면 어떻게 하나요?
    conclusion:
      lead: '`equals`를 재정의해서 무엇이 같으면 같은 객체로 볼지 정해요.'
      sub: '재정의하지 않은 `equals`는 `==`처럼 두 변수가 같은 객체를 가리킬 때만 true예요.'
    says:
      - '`Object`의 `equals`는 `x == y`일 때만 true를 돌려준다. 재정의하지 않은 클래스는 이것을 그대로 쓴다'
      - 코드 plain의 `Member`로 이메일이 같은 `a`와 `b`를 만들면 `a.equals(b)`는 false, `a.equals(a)`는 true다
      - '`ArrayList`의 `contains`는 들어 있는 객체마다 `equals`를 불러 찾는다. 그래서 코드 plain에서는 `list.contains(b)`가 false다'
      - 코드 equalsOnly처럼 `equals`가 이메일을 비교하게 재정의하면 `a.equals(b)`와 `list.contains(b)`가 true가 된다. `a == b`는 그대로 false다
      - '`equals`의 인자는 `Object`다. `instanceof`로 `Member`인지 먼저 확인하고, 아니면 false를 돌려준다'
      - 예측의 답을 밝힌다. 첫 줄은 true다. 둘째 줄 `set.contains(b)`는 false다. 이유는 다음 질문에서 본다
    widget:
      kind: classify
      note: >-
        식 여섯 개를 true와 false로 나눈다. 재정의하기 전의 `a == b`, `a.equals(b)`, `a.equals(a)`, `list.contains(b)`와
        재정의한 뒤의 `a == b`, `a.equals(b)`. 고르면 그 식이 무엇을 비교하는지 설명이 나온다.
    asks:
      - 코드 plain의 `Member`로 이메일이 같은 두 객체를 만들었다. `a.equals(b)`는 무엇을 돌려주나 (false)
      - 코드 plain에서 `a`만 넣은 `ArrayList`에 `contains(b)`를 부르면 (false)
      - 코드 equalsOnly로 바꾼 뒤 `a == b`와 `a.equals(b)`는 각각 (false와 true)
      - OX. 재정의하지 않은 `equals`는 필드 값이 모두 같으면 true를 돌려준다 (X)
      - 설명형. `==`와 재정의하지 않은 `equals`와 재정의한 `equals`가 각각 무엇을 비교하는지 설명한다
    body:
    - p: 객체를 비교하는 방법은 두 가지예요. `==`는 두 변수가 **같은 객체**를 가리키는지 봐요. `equals`는 두 객체를 **같다고 볼지** 묻는 메서드예요.
    - p: '`equals`는 모든 클래스의 부모인 `Object`에 들어 있어서 어떤 객체에나 부를 수 있어요. 그런데 `Object`가 준 `equals`는 `==`와 똑같이 판정해요. 두 변수가 같은 객체를 가리킬 때만 true예요([Object.equals](link:equals)).'
    - p: 아무것도 고쳐 쓰지 않은 `Member`로 확인해 볼게요.
    - code: plain
    - ci:
        key: plain
        label: 실제로 돌린 출력 보기
        source: EqualsHashCodeTest.plainUsesIdentity
        code: compare
    - p: 이메일이 같아도 `a`와 `b`는 따로 만든 두 객체라서 `a.equals(b)`는 false예요. `ArrayList`의 `contains`는 들어 있는 객체마다 `equals`를 불러서 찾아요. 그래서 `list.contains(b)`도 false예요.
    - h3: equals를 재정의하면
    - p: 부모가 준 메서드를 내 클래스에서 다시 쓰는 것을 **재정의**(오버라이드)라고 해요. `equals`를 재정의해서 이메일이 같으면 true를 돌려주게 해요.
    - code: equalsMark
      notes:
      - mark: o instanceof Member m
        as: code
        text: '`equals`의 인자는 `Object`라서 아무 객체나 들어올 수 있어요. `Member`인지 먼저 확인하고, 맞으면 `m`이라는 이름으로 써요. 아니면 false를 돌려줘요.'
      - mark: email.equals(m.email)
        as: code
        text: 두 회원의 이메일이 같은지 비교해요. 이 줄이 "무엇이 같으면 같은 회원인가"를 정해요.
    - p: 이제 `a.equals(b)`와 `list.contains(b)`가 true예요. `a == b`는 그대로 false예요. 객체가 둘인 것은 변하지 않았고, 같다고 판정하는 기준만 바뀌었어요.
    - p: 아래 식이 true인지 false인지 골라 보세요. `a`와 `b`는 이메일이 같은 두 객체이고, `list`에는 `a`만 들어 있어요.
    - widget:
        kind: classify
        categories:
        - 'true'
        - 'false'
        items:
        - text: '재정의하기 전: a == b'
          answer: 2
          explain: ==는 같은 객체인지 봐요. a와 b는 따로 만든 두 객체예요.
        - text: '재정의하기 전: a.equals(b)'
          answer: 2
          explain: 재정의하지 않은 equals는 ==와 똑같이 판정해요.
        - text: '재정의하기 전: a.equals(a)'
          answer: 1
          explain: 자기 자신과는 같은 객체라서 true예요.
        - text: '재정의하기 전: list.contains(b)'
          answer: 2
          explain: contains는 들어 있는 a에 equals를 불러요. 그 equals가 false예요.
        - text: '재정의한 뒤: a == b'
          answer: 2
          explain: equals를 재정의해도 ==는 바뀌지 않아요. 여전히 두 객체예요.
        - text: '재정의한 뒤: a.equals(b)'
          answer: 1
          explain: 재정의한 equals가 이메일을 비교해요. 둘 다 kim@a.com이에요.
    - p: 처음에 예측한 코드로 돌아가 볼게요. 첫 줄 `list.contains(b)`는 **true**예요. `equals`를 재정의했으니까요. 그런데 둘째 줄 `set.contains(b)`는 **false**예요. 답은 **true, false**예요. {{predict-result}}
    - quiz:
        q: equals를 이메일로 비교하게 재정의한 Member예요. new Member("kim@a.com") == new Member("kim@a.com")의 결과는?
        options:
        - 'true'
        - 'false'
        - 컴파일 오류
        answer: 2
        explain: equals를 재정의해도 ==는 같은 객체인지만 봐요. new를 두 번 했으니 두 객체예요.
    - next: '`equals`를 재정의해서 리스트는 같은 회원을 찾았어요. 그런데 `HashSet`은 왜 찾지 못할까요?'
    recall: '`equals`를 재정의해서 무엇이 같으면 같은 객체로 볼지 정해요. 재정의하지 않은 `equals`는 `==`처럼 두 변수가 같은 객체를 가리킬 때만 true예요. `ArrayList`의 `contains`는 `equals`를 불러 찾으므로, 이메일을 비교하게 재정의하면 이메일이 같은 회원을 찾아요. `==`의 결과는 바뀌지 않아요.'
  - id: q2
    title: equals를 재정의했는데 HashSet은 왜 같은 회원을 찾지 못하나요?
    conclusion:
      lead: '`HashSet`은 `hashCode`가 같은 객체에만 `equals`를 부르는데, `hashCode`를 재정의하지 않아 두 객체의 값이 달랐기 때문이에요.'
      sub: '재정의하지 않은 `hashCode`는 필드 값과 상관없이 객체마다 따로 정해져요. 그래서 `equals`까지 가지 못해요.'
    says:
      - '`hashCode`는 객체가 돌려주는 int 값 하나다. `HashSet`과 `HashMap`은 이 값으로 찾을 곳을 먼저 좁히고, 값이 같은 객체에만 `equals`를 부른다'
      - 이 레슨은 여기까지만 말한다. 찾을 곳이 어떻게 생겼는지(배열, 충돌했을 때, 크기를 늘릴 때)는 K4 해시 테이블에서 다룬다
      - 코드 equalsOnly로 코드 predict를 돌리면 `set.contains(b)`는 false이고, 그동안 `equals`는 0번 불린다. `equals`에 호출 횟수를 세는 줄을 넣어 확인한다
      - 같은 조건에서 `set.add(b)`는 true를 돌려주고 `set.size()`는 2가 된다. 같은 회원이 두 번 들어간다
      - 같은 조건에서 `map.put(a, "VIP")` 뒤 `map.get(b)`는 null이다
      - 조건을 적는 이유. `Object`의 `hashCode`는 서로 다른 객체에 되도록 다른 값을 주지만 명세가 다르다고 보장하지는 않는다. 그래서 예제는 두 값이 다르게 나온 것을 적어 두고 시작한다
      - 더 알아보기. 객체를 많이 만들면 재정의하지 않은 `hashCode`가 같은 두 객체가 실제로 나온다. 그 둘이라면 `contains`가 true가 된다. 우연에 기대는 코드가 된다는 뜻이다
      - '`hashCode`만 재정의하고 `equals`를 재정의하지 않아도 찾지 못한다. `hashCode`는 같지만 `equals`가 false다'
    widget:
      kind: steps
      note: >-
        `set.contains(b)`가 하는 일을 한 단계씩 넘긴다. b의 `hashCode` 구하기, 그 값과 같은 `hashCode`로 들어 있는 객체 찾기,
        있으면 `equals` 부르기, 결과. 위의 두 칸(`duo`)에 a와 b의 `hashCode`를 나란히 두고, 로그에 `equals` 호출 횟수를 적는다.
        시나리오는 "equals만 재정의"와 "둘 다 재정의" 둘을 고르게 한다. 둘째 시나리오는 질문 3으로 넘어가는 다리다.
    asks:
      - 코드 equalsOnly, 두 객체의 `hashCode`가 다르게 나왔다. `a`를 넣은 `HashSet`에 `contains(b)`를 부르는 동안 `equals`는 몇 번 불리나 (0번)
      - 같은 조건에서 `set.add(a)`와 `set.add(b)`를 한 뒤 `set.size()`는 (2)
      - 같은 조건에서 `map.put(a, "VIP")` 뒤 `map.get(b)`는 (null)
      - 같은 조건에서 `list.contains(b)`와 `set.contains(b)`의 결과가 다른 까닭은 (`ArrayList`는 `hashCode`를 쓰지 않고 `equals`만 부른다)
      - OX. `equals`가 true를 돌려주게 재정의하면 `HashSet`도 두 객체를 같은 것으로 본다 (X)
      - 설명형. `equals`만 재정의한 클래스를 `HashSet`에 넣으면 생기는 일과 그 이유를 설명한다
    body:
    - p: '`HashSet`과 `HashMap`은 객체를 찾을 때 `equals`보다 먼저 **`hashCode`**를 써요. `hashCode`는 객체가 돌려주는 int 값 하나예요. `equals`처럼 `Object`에 들어 있어서 모든 객체가 가지고 있어요.'
    - p: '`HashSet`이 객체를 찾는 순서는 이래요.'
    - ol:
      - 찾는 객체의 `hashCode`를 구해요.
      - 그 값으로 찾을 곳을 좁혀요. `hashCode`가 같은 객체만 후보가 돼요.
      - 후보에만 `equals`를 불러요. true가 나오면 찾은 거예요.
    - muted: 찾을 곳이 실제로 어떻게 생겼는지는 해시 테이블 레슨에서 다뤄요. 이 레슨에서는 "`hashCode`가 같은 객체에만 `equals`를 부른다"까지만 알면 돼요.
    - p: 재정의하지 않은 `hashCode`는 필드 값과 상관없이 객체마다 따로 정해져요. 예측한 코드의 `Member`는 `equals`만 재정의했어요. 그래서 이메일이 같은 `a`와 `b`도 `hashCode`가 서로 달라요.
    - code: predictSet
      notes:
      - mark: set.contains(b)
        as: code
        text: '`b`의 `hashCode`로 찾아요. 그런데 들어 있는 `a`의 `hashCode`는 다른 값이에요.'
    - p: 아래에서 `set.contains(b)`가 하는 일을 한 단계씩 넘겨 보세요. `hashCode`까지 재정의했을 때와 비교할 수 있어요. "equals만"의 `hashCode` 숫자는 테스트를 한 번 돌렸을 때 나온 값이고, 실행할 때마다 달라요.
