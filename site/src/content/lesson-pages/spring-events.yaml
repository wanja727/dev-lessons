# 스프링 이벤트
# 자료 파일의 칸은 docs/lesson-data-format.md에 있다. 문제는 content/questions/spring-events.yaml에 있다.
title: 스프링 이벤트
description: 스프링 이벤트의 리스너가 언제 어느 스레드에서 도는지, 리스너가 실패하면 이벤트를 낸 쪽이 어떻게 되는지, 커밋 뒤에 도는 리스너에서 조심할 것. 세 가지 질문에 스스로 답할 수 있게 회원 가입 이벤트로 DB에 남은 행을 확인하는 대화형 레슨.
unit: 스프링
minutes: 16
roadmap: S13
type: 동작 확인
prerequisites:
  - {slug: tx-propagation, title: 트랜잭션 전파와 롤백 규칙}
  - {slug: observer, title: 옵저버 패턴과 이벤트}
assume: '자바 21, 스프링 부트 3.5, PostgreSQL 16. 알리는 쪽과 듣는 쪽을 떼어 놓는 옵저버 패턴과 `@EventListener`가 같은 스레드에서 돌고 예외가 `publishEvent`를 부른 쪽으로 올라간다는 것(옵저버 패턴과 이벤트 레슨). 합류와 롤백 전용, `REQUIRES_NEW`(트랜잭션 전파와 롤백 규칙 레슨).'
example: '회원 가입 `MemberService.join`이 `MemberJoined` 이벤트를 내고, 환영 메일 발송과 가입 쿠폰 발급이 그 이벤트를 듣는다. 메일 서버가 실패할 때와 가입이 롤백될 때 무엇이 남는지 본다.'
intro:
  - '가입 서비스에 메일 발송, 쿠폰 발급, 추천인 포인트가 줄줄이 붙었어요. 메일 서버가 잠깐 멈추자 가입까지 실패해요. 반대로 가입이 롤백됐는데 환영 메일은 이미 나간 일도 생겨요.'
  - '스프링 이벤트는 가입 서비스가 "가입했다"는 사실만 알리고, 후속 일은 각자 듣게 떼어 놓는 장치예요. 그런데 기본 `@EventListener`는 같은 트랜잭션, 같은 스레드에서 돌아서 코드는 떼어 놓았어도 운명은 함께해요. 커밋된 뒤에만 도는 `@TransactionalEventListener`를 알아야 메일이 잘못 나가는 일을 막을 수 있어요.'
  - '이 레슨에서는 리스너의 실행 시점과 스레드, 리스너 예외가 가입을 롤백시키는지, 커밋 뒤에 도는 리스너의 함정을 DB의 행으로 확인해요.'
covers:
  - topic: '`ApplicationEventPublisher.publishEvent`로 이벤트를 내고 `@EventListener`로 듣는다. 이벤트는 보통 record'
    where: '질문 1'
  - topic: '`@EventListener`는 기본으로 `publishEvent`를 부른 스레드에서, 그 자리에서 바로 돈다. 그래서 같은 트랜잭션에 합류한다'
    where: '질문 1. 원리는 옵저버 패턴과 이벤트(O13)'
  - topic: '리스너가 런타임 예외를 던지면 `publishEvent`를 부른 쪽으로 올라가 가입 트랜잭션이 롤백된다'
    where: '질문 2'
  - topic: '`@TransactionalEventListener`(기본 `AFTER_COMMIT`)는 트랜잭션이 커밋된 뒤에 돈다. 롤백되면 돌지 않는다'
    where: '질문 2'
  - topic: '`phase`: `BEFORE_COMMIT`, `AFTER_COMMIT`, `AFTER_ROLLBACK`, `AFTER_COMPLETION`'
    where: '질문 2의 더 알아보기'
  - topic: '트랜잭션 밖에서 낸 이벤트는 `@TransactionalEventListener`가 기본으로 듣지 않는다(`fallbackExecution`)'
    where: '질문 2의 더 알아보기'
  - topic: '`AFTER_COMMIT` 리스너의 예외는 이미 커밋된 가입을 되돌리지 못하고, 가입을 부른 쪽에도 가지 않는다. 실패한 후속 일은 따로 기록하고 다시 시도해야 한다'
    where: '질문 3'
  - topic: '`AFTER_COMMIT` 리스너는 가입 트랜잭션이 끝난 뒤라, 그 안의 쓰기는 가입 트랜잭션에 들지 않는다. DB에 쓰려면 `REQUIRES_NEW`로 새 트랜잭션을 연다(스프링 문서의 권고)'
    where: '질문 3'
  - topic: '리스너를 다른 스레드에서 돌리려면 `@Async`를 함께 붙인다'
    where: '질문 3의 더 알아보기. @Async(S14)'
  - topic: '서버가 죽으면 커밋 뒤 메모리의 이벤트가 사라진다. 꼭 전달해야 하면 트랜잭셔널 아웃박스'
    where: '실무에서는. 아웃박스는 심화 레슨'
  - topic: '서버 밖으로 이벤트를 보내기(메시지 큐)'
    where: '다루지 않음: 메시지 큐(A8)'
links:
  test: https://github.com/wanja727/dev-lessons/blob/main/verification/src/test/java/lab/devlessons/springevents/SpringEventsTest.java
  events: https://docs.spring.io/spring-framework/reference/core/beans/context-introduction.html#context-functionality-events
  txEvents: https://docs.spring.io/spring-framework/reference/data-access/transaction/event.html
  listenerApi: https://docs.spring.io/spring-framework/docs/current/javadoc-api/org/springframework/transaction/event/TransactionalEventListener.html
codes:
  predict: |-
    @Transactional
    public void join(SignUp s) {
      members.save(new Member(s.email()));
      events.publishEvent(
          new MemberJoined(s.email()));
    }

    @EventListener
    void sendWelcome(MemberJoined e) {
      mail.send(e.email());  // 예외
    }
  publish: |-
    public record MemberJoined(String email) {}

    @Service
    class MemberService {
      private final ApplicationEventPublisher
          events;

      @Transactional
      public void join(SignUp s) {
        members.save(new Member(s.email()));
        [[events.publishEvent(]]
            [[new MemberJoined(s.email()));]]
      }
    }
  listen: |-
    @Component
    class WelcomeMail {
      [[@EventListener]]
      void send(MemberJoined e) {
        mail.send(e.email());
      }
    }
  afterCommit: |-
    [[@TransactionalEventListener]]
    void sendWelcome(MemberJoined e) {
      mail.send(e.email());
    }
  coupon: |-
    // CouponService
    @Transactional(propagation =
        [[Propagation.REQUIRES_NEW]])
    public void issue(String email) {
      coupons.save(new Coupon(email));
    }

    @TransactionalEventListener
    void giveCoupon(MemberJoined e) {
      couponService.issue(e.email());
    }
  phase: |-
    @TransactionalEventListener(
        phase = TransactionPhase.AFTER_ROLLBACK)
    void alertFailed(MemberJoined e) { ... }
predict:
  title: 메일이 실패하면 가입은 남을까요?
  text: '코드 predict에서 메일 발송이 런타임 예외를 던졌어요. 가입한 회원 행은 DB에 남을까요? 답은 질문 2에 나와요.'
  code: predict
  label: 내 예측
  options:
    - {value: a, label: 남는다. 이벤트로 떼어 놓았다}
    - {value: b, label: '남지 않는다. 가입까지 롤백된다'}
    - {value: c, label: '남고, 예외는 로그에만 남는다'}
  answer: b
  storageKey: ev-predict
  wrong: 예측은 "{label}"이었어요. 틀린 예측이 더 오래 남으니 괜찮아요.
questions:
  - id: q1
    title: 스프링 이벤트는 언제, 어느 스레드에서 리스너를 부르나요?
    conclusion:
      lead: '`publishEvent`를 부른 그 자리에서, 같은 스레드로 바로 불러요.'
      sub: '그래서 리스너는 이벤트를 낸 트랜잭션 안에서 돌아요. 코드는 떼어 놓았지만 실행은 이어져 있어요.'
    says:
      - '이벤트 record, 내는 쪽, 듣는 쪽의 코드를 보인다'
      - '`publishEvent` 앞뒤와 리스너 안에서 스레드 이름과 트랜잭션 여부, 순서를 기록해 실제 출력으로 보인다'
      - '리스너가 둘이면 둘 다 그 자리에서 차례로 돈다. 순서는 `@Order`'
    asks:
      - '본문의 예시: `publishEvent` 바로 다음 줄의 로그와 리스너 안의 로그 가운데 무엇이 먼저 남나 (리스너. 그 자리에서 바로 돈다)'
      - '옮긴 상황: `@Transactional` 주문 서비스가 이벤트를 내고 `@EventListener`가 재고를 줄인다. 재고 감소는 주문과 같은 트랜잭션인가 (그렇다. 같은 스레드에서 합류한다)'
    body:
      - p: '[옵저버 패턴과 이벤트](lesson:observer) 레슨에서 알리는 쪽과 듣는 쪽을 떼어 놓는 법을 봤어요. 스프링에서는 이렇게 써요.'
      - code: publish
        notes:
          - mark: 'events.publishEvent('
            as: code
            text: '"가입했다"는 사실만 알려요. 누가 듣는지는 몰라요.'
      - code: listen
        notes:
          - mark: '@EventListener'
            as: anno
            text: '그 타입의 이벤트가 나면 이 메서드를 불러 달라는 표시예요.'
      - p: '가입 서비스는 메일, 쿠폰을 몰라요. 새 후속 일이 생기면 리스너를 하나 더 만들면 돼요([근거](link:events)). 그럼 리스너는 **언제** 불릴까요? `publishEvent` 앞뒤와 리스너 안에서 스레드와 트랜잭션을 기록했어요.'
      - ci:
          key: inline
          label: 실제 기록 보기
          source: SpringEventsTest.plainListenerRunsInline
      - p: '리스너는 `publishEvent`를 부른 **그 자리에서, 같은 스레드로** 돌아요. "publishEvent 뒤" 기록보다 리스너가 먼저예요. 큐에 넣었다가 나중에 꺼내는 것이 아니라 그냥 메서드 호출이에요. 그래서 리스너는 가입 트랜잭션 **안**에서 돌아요. 리스너가 둘이면 둘 다 그 자리에서 차례로 돌고, 순서는 `@Order`로 정해요.'
      - quiz:
          q: '`@Transactional` 주문 서비스가 이벤트를 내고, `@EventListener`가 재고를 줄여요. 재고 감소는 어느 트랜잭션에서 일어날까요?'
          options:
            - 주문과 같은 트랜잭션
            - 따로 새 트랜잭션
            - 트랜잭션 없이
          answer: 1
          explain: '`@EventListener`는 같은 스레드에서 그 자리에서 불리는 메서드라 열린 주문 트랜잭션에 합류해요.'
      - next: '같은 트랜잭션이라면, 리스너가 실패하면 가입은 어떻게 될까요?'
    recall: 'publishEvent로 이벤트(보통 record)를 내면 @EventListener 메서드가 publishEvent를 부른 그 자리에서, 같은 스레드로 바로 불려요. 큐를 거치지 않는 메서드 호출이라 리스너는 이벤트를 낸 트랜잭션 안에서 돌아요. 리스너가 여럿이면 차례로 돌고 순서는 @Order로 정해요.'
  - id: q2
    title: 리스너가 실패하면 이벤트를 낸 쪽은 어떻게 되나요?
    conclusion:
      lead: '`@EventListener`의 예외는 이벤트를 낸 쪽으로 올라가 그 트랜잭션을 롤백시켜요.'
      sub: '`@TransactionalEventListener`는 커밋된 뒤에만 돌아서, 가입이 롤백되면 메일이 나가지 않고 메일이 실패해도 가입은 남아요.'
    says:
      - '코드 predict를 돌린다. 회원 행이 없다. 예측의 답을 밝힌다'
      - '코드 afterCommit으로 바꾸면 리스너는 커밋 뒤에 돌고, 메일이 실패해도 회원은 남고, 가입이 롤백되면 리스너가 돌지 않는다. 두 경우를 DB의 행과 기록으로 보인다'
      - '더 알아보기: `phase` 네 가지, 트랜잭션 밖에서 낸 이벤트와 `fallbackExecution`'
    widget:
      kind: compare
      note: '두 칸은 "@EventListener"와 "@TransactionalEventListener". 버튼으로 "메일 실패", "가입 롤백"을 고른다'
    asks:
      - '본문의 예시: 코드 afterCommit에서 메일이 예외를 던지면 회원 행은 남나 (남는다. 이미 커밋된 뒤다)'
      - '옮긴 상황: 주문 서비스가 이벤트를 낸 뒤 결제 검증에서 런타임 예외로 롤백됐다. `@TransactionalEventListener`의 배송 요청 리스너는 도나 (돌지 않는다)'
    body:
      - p: '예측의 코드를 돌렸어요.'
      - ci:
          key: plain-fail
          label: 실제 결과 보기
          source: SpringEventsTest.plainListenerFailureRollsBack
          code: predict
      - p: '**가입까지 롤백됐어요.** {{predict-result}} 리스너는 같은 스레드의 메서드 호출이라, 예외가 `publishEvent`를 거쳐 `join`으로, `join`의 트랜잭션 프록시까지 올라가요. 프록시는 런타임 예외를 보고 롤백해요([트랜잭션 전파와 롤백 규칙](lesson:tx-propagation)). 메일 서버 하나가 가입을 막은 거예요.'
      - h3: 커밋된 뒤에 듣기
      - code: afterCommit
        notes:
          - mark: '@TransactionalEventListener'
            as: anno
            text: '이벤트를 낸 트랜잭션이 커밋된 뒤에 불러 달라는 표시예요. 기본 단계가 `AFTER_COMMIT`이에요.'
      - p: '`@TransactionalEventListener`는 이벤트가 나면 바로 부르지 않고, 지금 트랜잭션에 "커밋되면 부르기"를 걸어 둬요([근거](link:txEvents)). 성공한 가입과 메일이 실패한 가입을 돌렸어요.'
      - ci:
          key: after-commit
          label: 실제 결과 보기
          source: SpringEventsTest.afterCommitListener
      - p: '리스너가 "publishEvent 뒤"보다 **나중**에 돌았어요. 가입이 커밋된 다음이에요. 메일이 실패해도 회원은 남았고, `join`을 부른 쪽은 예외를 받지 않았어요. 가입이 롤백될 때는 어떨까요?'
      - ci:
          key: rollback
          label: 실제 결과 보기
          source: SpringEventsTest.rolledBackSkipsListener
      - p: '리스너가 **돌지 않았어요.** 롤백된 가입에 환영 메일이 나가는 일이 없어요. 직접 비교해 보세요.'
      - widget:
          kind: compare
          layout: [selector, sides, verdict]
          selector:
            label: 일어난 일
            options:
              - {value: mail, label: 메일 서버 실패}
              - {value: rollback, label: 가입이 롤백됨}
          sides:
            - label: '@EventListener'
              items:
                - {name: 실행 시점, note: 'publishEvent 그 자리'}
                - {name: 회원 행, note: '가입 트랜잭션'}
                - {name: 메일, note: '리스너'}
            - label: '@TransactionalEventListener'
              items:
                - {name: 실행 시점, note: '커밋 뒤'}
                - {name: 회원 행, note: '가입 트랜잭션'}
                - {name: 메일, note: '리스너'}
          scenes:
            mail:
              sides:
                - marks: [{name: 회원 행, tag: 롤백, mark: bad}]
                  result: [{k: 회원, v: 없음, mark: bad}, {k: join의 예외, v: 받음}]
                - marks: [{name: 메일, tag: 실패}]
                  result: [{k: 회원, v: 남음}, {k: join의 예외, v: 없음}]
              verdict: '커밋 뒤 리스너는 메일이 실패해도 가입을 지켜요. 대신 실패를 따로 챙겨야 해요(질문 3).'
            rollback:
              sides:
                - marks: [{name: 메일, tag: 이미 나감, mark: bad}]
                  result: [{k: 회원, v: 없음}, {k: 메일, v: 나감, mark: bad}]
                - marks: [{name: 메일, tag: 안 나감}]
                  result: [{k: 회원, v: 없음}, {k: 메일, v: 안 나감}]
              verdict: '보통 리스너는 롤백될 가입에도 메일을 먼저 보내요. 커밋 뒤 리스너는 아예 돌지 않아요.'
      - more:
          summary: '더 알아보기: 다른 단계와 트랜잭션 밖의 이벤트'
          body:
            - code: phase
            - p: '`phase`로 단계를 고를 수 있어요. `BEFORE_COMMIT`(커밋 직전, 아직 트랜잭션 안), `AFTER_COMMIT`(기본), `AFTER_ROLLBACK`(롤백된 뒤), `AFTER_COMPLETION`(커밋이든 롤백이든 끝난 뒤)([근거](link:listenerApi)).'
            - ci:
                key: outside
                label: 트랜잭션 밖에서 낸 이벤트
                source: SpringEventsTest.outsideTransaction
            - p: '"커밋되면"을 걸 트랜잭션이 없으면 기본으로 아예 듣지 않아요. 트랜잭션 밖에서도 듣게 하려면 `fallbackExecution = true`를 줘요.'
      - quiz:
          q: '주문 서비스가 이벤트를 낸 뒤 결제 검증에서 런타임 예외로 롤백됐어요. `@TransactionalEventListener`의 배송 요청 리스너는 돌까요?'
          options:
            - 돈다
            - 돌지 않는다
            - 롤백 전에 돈다
          answer: 2
          explain: '기본 단계는 `AFTER_COMMIT`이라 커밋되지 않으면 돌지 않아요. 롤백된 주문에 배송 요청이 나가지 않아요.'
      - next: '커밋 뒤에 도는 리스너는 가입을 지켜 줘요. 그런데 그 리스너에서 DB에 쓰거나 실패하면 어떻게 될까요?'
    recall: '@EventListener의 예외는 같은 스레드에서 publishEvent를 거쳐 이벤트를 낸 쪽 트랜잭션까지 올라가 가입을 롤백시켜요. @TransactionalEventListener는 기본 AFTER_COMMIT이라 커밋된 뒤에만 돌아서, 롤백되면 돌지 않고 메일이 실패해도 가입은 남아요. 트랜잭션 밖에서 낸 이벤트는 fallbackExecution이 없으면 듣지 않아요.'
  - id: q3
    title: 커밋 뒤에 도는 리스너에서는 무엇을 조심하나요?
    conclusion:
      lead: '리스너가 실패해도 이미 커밋된 가입은 되돌릴 수 없고 부른 쪽도 모르니, 실패를 따로 기록하고 다시 시도할 방법을 둬요.'
      sub: '가입 트랜잭션은 끝난 뒤라 리스너의 쓰기는 그 트랜잭션에 들지 않아요. DB에 쓰는 일은 `REQUIRES_NEW`로 새 트랜잭션을 열어 분명히 해요.'
    says:
      - '질문 2의 결과를 다시 짚는다. 메일 실패는 호출한 쪽에 예외로 가지 않았고 가입은 남았다'
      - '`AFTER_COMMIT` 리스너에서 쿠폰을 저장한다. 이 테스트에서 `JdbcTemplate` insert는 `REQUIRES_NEW` 없이도 남았다. 가입 트랜잭션이 끝난 뒤라 자동 커밋으로 따로 저장된 것이다. 스프링 문서는 이 단계에서 트랜잭션에 기대는 쓰기가 반영되지 않을 수 있다고 경고하고 `REQUIRES_NEW`를 권한다'
      - '더 알아보기: `@Async`를 붙이면 다른 스레드에서 돈다(S14)'
    asks:
      - '본문의 예시: 커밋 뒤 리스너에서 포인트 적립이 실패했다. 가입은 롤백되나 (되지 않는다. 이미 커밋됐다)'
      - '옮긴 상황: 커밋 뒤 리스너가 런타임 예외를 던졌다. `join`을 부른 컨트롤러는 그 예외를 받나 (받지 않는다. 스프링 6.2에서 확인)'
    body:
      - h3: 실패는 아무도 모를 수 있어요
      - p: '질문 2의 결과를 다시 보면, 메일이 실패했는데 `join`을 부른 쪽은 **예외를 받지 않았어요.** 가입은 이미 커밋됐으니 되돌릴 수도 없어요. 실패한 메일은 누군가 챙기지 않으면 그냥 사라져요. 커밋 뒤 리스너 안에서 실패를 잡아 기록(실패 테이블, 알림)하고, 다시 보내는 작업을 둬요.'
      - h3: 쓰기는 새 트랜잭션으로
      - p: '커밋 뒤 리스너가 돌 때 가입 트랜잭션은 이미 커밋됐어요. 리스너 안의 쓰기는 그 트랜잭션에 들어갈 수 없어요. 쿠폰을 두 가지로 저장해 봤어요.'
      - ci:
          key: write-after-commit
          label: 실제 결과 보기
          source: SpringEventsTest.writeAfterCommit
      - p: '이 테스트에서는 둘 다 남았어요. `JdbcTemplate`의 insert는 끝난 트랜잭션 대신 자동 커밋으로 따로 저장됐어요. 하지만 이것에 기대면 안 돼요. JPA처럼 "트랜잭션을 커밋할 때 반영"하는 코드는 커밋할 트랜잭션이 없어 반영되지 않을 수 있다고 스프링 문서가 경고해요([근거](link:txEvents)). 그래서 커밋 뒤에 DB에 쓰는 일은 `REQUIRES_NEW`로 새 트랜잭션을 분명히 열어요.'
      - code: coupon
        notes:
          - mark: Propagation.REQUIRES_NEW
            as: code
            text: '끝난 가입 트랜잭션과 상관없이 새 트랜잭션에서 저장하고 커밋해요.'
      - more:
          summary: '더 알아보기: 리스너를 다른 스레드에서'
          body:
            - p: '커밋 뒤 리스너도 기본으로는 같은 스레드에서 돌아요. 질문 2의 기록처럼 `join`을 부른 요청이 메일을 기다려요. 리스너에 `@Async`를 함께 붙이면 다른 스레드에서 돌아요. [@Async](lesson:spring-async) 레슨에서 다뤄요.'
      - quiz:
          q: '커밋 뒤 리스너에서 포인트 적립이 런타임 예외로 실패했어요. 가입은 어떻게 될까요?'
          options:
            - 함께 롤백된다
            - 남는다. 이미 커밋됐다
            - '`UnexpectedRollbackException`이 난다'
          answer: 2
          explain: '`AFTER_COMMIT` 리스너는 가입이 커밋된 뒤에 돌아요. 리스너의 실패는 가입을 되돌리지 못해요.'
    recall: '커밋 뒤 리스너(@TransactionalEventListener)가 실패하면 이미 커밋된 가입은 되돌릴 수 없고, 부른 쪽도 예외를 받지 않아서 실패를 따로 기록하고 다시 시도할 방법을 둬야 해요. 가입 트랜잭션이 끝난 뒤라 리스너의 쓰기는 그 트랜잭션에 들지 않으니, DB에 쓰는 일은 REQUIRES_NEW로 새 트랜잭션을 열어요. 다른 스레드에서 돌리려면 @Async를 붙여요.'
practice:
  title: 실무에서는 이렇게 써요
  says:
    - '실무 모양: 가입 서비스는 이벤트만 내고, 메일과 쿠폰은 `@TransactionalEventListener`. 쿠폰처럼 DB에 쓰는 리스너는 `REQUIRES_NEW`'
    - '흔한 실수: `@EventListener`로 외부 메일을 보내 롤백된 가입에도 메일이 나간다. 고친 코드: `@TransactionalEventListener`'
    - '메모리 이벤트는 서버가 죽으면 사라진다. 꼭 전달해야 하면 아웃박스 테이블에 같은 트랜잭션으로 적는다고 한 줄 적고 심화 레슨으로 넘긴다'
  body:
    - h3: 무엇을 어떤 리스너로
    - table:
        head: [후속 일, 리스너, 이유]
        rows:
          - ['가입과 꼭 함께 성공해야 하는 쓰기', '`@EventListener` (또는 그냥 서비스에서 호출)', '같은 트랜잭션이라 함께 롤백된다']
          - ['외부 메일, 알림, 외부 API', '`@TransactionalEventListener`', '롤백된 가입에 나가지 않는다']
          - ['커밋 뒤의 DB 쓰기(쿠폰)', '`@TransactionalEventListener` + `REQUIRES_NEW`', '끝난 트랜잭션에 기대지 않는다']
    - h3: '흔한 실수: @EventListener로 외부에 알림'
    - p: '`@EventListener`로 메일을 보내면, 메일 다음 단계에서 가입이 롤백돼도 메일은 이미 나가 있어요(질문 2). 외부로 나가는 일은 `@TransactionalEventListener`로 옮겨요.'
    - h3: 꼭 전달해야 하는 이벤트는
    - p: '커밋 뒤 리스너가 돌기 직전에 서버가 죽으면, 메모리에만 있던 이벤트는 사라져요. 결제 완료 통지처럼 꼭 전달해야 하는 이벤트는 가입과 같은 트랜잭션으로 "보낼 이벤트" 테이블(아웃박스)에 적고, 따로 읽어 보내요. 트랜잭셔널 아웃박스 심화 레슨에서 다뤄요.'
interview:
  question: '스프링 이벤트와 @TransactionalEventListener를 설명해 주세요'
  model:
    - label: 정의
      text: ApplicationEventPublisher로 이벤트를 내면 @EventListener가 듣는 방식으로, 내는 쪽과 후속 일을 코드로 떼어 놓습니다.
    - label: 원리
      text: '@EventListener는 publishEvent를 부른 스레드에서 그 자리에서 불려 같은 트랜잭션에 합류하므로, 리스너의 예외가 이벤트를 낸 쪽까지 올라가 롤백시킵니다. @TransactionalEventListener는 기본으로 커밋된 뒤에만 불리고, 롤백되면 불리지 않습니다.'
    - label: 주의할 점
      text: 커밋 뒤 리스너의 실패는 이미 커밋된 일을 되돌리지 못하고 부른 쪽도 모르므로 따로 기록하고 다시 시도합니다. DB에 쓰려면 REQUIRES_NEW로 새 트랜잭션을 엽니다. 서버가 죽으면 메모리의 이벤트가 사라지므로 꼭 전달할 것은 아웃박스를 씁니다.
    - label: 경험
      text: '(내 프로젝트로 채우기) 예: 롤백된 가입에도 환영 메일이 나가던 것을 @TransactionalEventListener로 옮겨 고쳤습니다.'
verified: 이 레슨의 결과는 짐작이 아니라 스프링 부트 3.5와 PostgreSQL 16(Testcontainers)에서 돌려 받은 값이에요. 코드가 바뀔 때마다 테스트([SpringEventsTest](link:test))가 다시 돌아요.
footer: '근거: 애플리케이션 이벤트는 스프링 프레임워크 문서([링크](link:events)), 트랜잭션에 묶인 이벤트와 커밋 뒤 쓰기의 경고는 [링크](link:txEvents), 단계(phase)는 [링크](link:listenerApi). 결과는 OpenJDK 21에서 테스트로 확인했어요. 오류는 [GitHub 이슈](https://github.com/wanja727/dev-lessons/issues)로 알려 주세요.'
claims:
  - claim: '`@EventListener`는 `publishEvent`를 부른 스레드에서 그 자리에서 돌고 같은 트랜잭션에 있다'
    how: '`@SpringBootTest`와 PostgreSQL 컨테이너. 스레드 이름, `isActualTransactionActive`, 기록 순서'
    test: SpringEventsTest.plainListenerRunsInline
  - claim: '`@EventListener`의 예외는 가입 트랜잭션을 롤백시킨다'
    how: 'DB의 행'
    test: SpringEventsTest.plainListenerFailureRollsBack
  - claim: '`@TransactionalEventListener`는 커밋 뒤에만 돌고, 그 예외는 가입을 되돌리지 않으며 부른 쪽에도 가지 않는다'
    how: 'DB의 행과 기록, 호출한 쪽이 받은 예외'
    test: SpringEventsTest.afterCommitListener
  - claim: '가입이 롤백되면 `@TransactionalEventListener`는 돌지 않는다'
    how: '기록'
    test: SpringEventsTest.rolledBackSkipsListener
  - claim: '`AFTER_COMMIT` 리스너에서 `JdbcTemplate`으로 쓴 행은 `REQUIRES_NEW` 없이도 남았다(자동 커밋). `REQUIRES_NEW`면 남는다'
    how: 'DB의 행. 설계서에서는 "없이 쓰면 반영되지 않는다"로 적었는데 테스트에서 남아서, 본문은 스프링 문서의 경고와 함께 사실대로 적었다'
    test: SpringEventsTest.writeAfterCommit
  - claim: '트랜잭션 밖에서 낸 이벤트는 `@TransactionalEventListener`가 기본으로 듣지 않는다'
    how: '기록'
    test: SpringEventsTest.outsideTransaction
sources:
  - '애플리케이션 이벤트: 스프링 프레임워크 문서 https://docs.spring.io/spring-framework/reference/core/beans/context-introduction.html#context-functionality-events'
  - '트랜잭션에 묶인 이벤트: https://docs.spring.io/spring-framework/reference/data-access/transaction/event.html'
