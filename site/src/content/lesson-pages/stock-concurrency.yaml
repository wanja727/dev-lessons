  test: https://github.com/wanja727/dev-lessons/blob/main/verification/src/test/java/lab/devlessons/inventory/InventoryConcurrencyTest.java
  practiceTest: https://github.com/wanja727/dev-lessons/blob/main/verification/src/test/java/lab/devlessons/inventory/InventoryPracticeTest.java
