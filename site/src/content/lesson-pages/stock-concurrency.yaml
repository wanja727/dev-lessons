# 동시 요청에서 재고 지키기
# 자료 파일의 칸은 docs/lesson-data-format.md에 있다. 문제는 content/questions/stock-concurrency.yaml에 있다.
title: 동시 요청에서 재고 지키기
description: 재고를 확인하고 줄였는데 재고보다 많이 팔리는 이유, DB에서 조건부 UPDATE와 락으로 지키는 법, Redis로 줄일 때 조심할 것, 여러 방법 가운데 고르는 기준. 실제 PostgreSQL과 Redis에 주문 100건을 동시에 넣어 세어 보는 대화형 레슨.
unit: 시스템 설계와 아키텍처
minutes: 25
roadmap: A7
type: 동작 확인
prerequisites:
  - {slug: locking, title: 낙관적 락과 비관적 락}
  - {slug: redis-ranking, title: Redis}
assume: '스프링 부트 3.5, 스프링 데이터 JPA, PostgreSQL 16, Redis 7. 갱신 손실과 `SELECT ... FOR UPDATE`, `@Version`(낙관적 락과 비관적 락 레슨). Redis가 명령을 하나씩 실행하고 Lua 스크립트로 여러 명령을 한 번에 실행한다는 것(Redis 레슨).'
example: '한정판 운동화 재고 50켤레에 주문 100건이 동시에 들어온다. 주문마다 재고를 1 줄이고, 재고가 없으면 품절로 거절한다. 같은 주문을 다섯 가지 방법으로 처리하고 팔린 수와 남은 재고를 센다.'
intro:
  - '한정판 운동화 50켤레를 열었는데 주문이 57건 들어왔어요. 7명에게는 사과 문자와 환불을 보내야 해요. 코드에는 분명히 "재고가 0이면 품절"이라고 적혀 있었어요.'
  - '재고, 좌석, 쿠폰 수량처럼 줄어드는 숫자를 다루는 스프링 개발자는 "동시에 오면 어떻게 되나"를 꼭 따져야 해요. 방법은 여럿이고 저마다 지키는 것과 치르는 값이 달라요. 면접에서는 "재고 차감 동시성을 어떻게 처리하나요"로 묻고, 방법 하나가 아니라 고르는 기준까지 기대해요.'
  - '이 레슨에서는 실제 PostgreSQL과 Redis에서 주문 100건을 동시에 넣어요. 읽고 계산하고 쓰는 코드가 몇 켤레를 팔아 버리는지, 조건부 UPDATE와 락과 Redis가 각각 50켤레에서 멈추는지, 얼마나 걸리는지 비교해요.'
covers:
  - topic: '초과 판매: 재고를 읽고, 계산하고, 쓰는 사이에 다른 주문이 같은 재고를 읽으면 재고보다 많이 팔린다'
    where: '질문 1'
  - topic: '`@Transactional`과 기본 격리 수준만으로는 막지 못한다'
    where: '질문 1. 격리 수준은 격리 수준과 이상 현상(D9)'
  - topic: '조건부 UPDATE: `UPDATE ... SET q = q - 1 WHERE id = ? AND q >= 1`. DB가 확인과 차감을 한 문장으로 하고 바뀐 행 수로 성공을 안다'
    where: '질문 2'
  - topic: '비관적 락(SELECT FOR UPDATE)은 읽을 때 행을 잠가 다음 주문을 기다리게 한다'
    where: '질문 2. 락의 원리는 낙관적 락과 비관적 락(D10)'
  - topic: '낙관적 락(@Version)은 충돌한 주문을 실패시킨다. 재고가 남았는데도 실패하는 주문이 생겨 재시도가 필요하다. 경쟁이 심한 재고에는 맞지 않는다'
    where: '질문 2'
  - topic: 'Redis DECR은 원자적이지만 0에서 멈추지 않는다. 음수까지 내려간다'
    where: '질문 3'
  - topic: 'Redis Lua 스크립트로 확인과 차감을 한 번에 실행하면 0에서 멈춘다'
    where: '질문 3'
  - topic: 'Redis로 차감하면 DB와 재고 숫자가 둘이 된다. 주문 저장이 실패하면 Redis 재고를 되돌려야 하고, Redis가 날아가면 DB에서 다시 맞춘다'
    where: '질문 3'
  - topic: '고르는 기준: 대부분은 조건부 UPDATE로 충분하다. 재고 확인 뒤 다른 일을 함께 해야 하면 비관적 락, 수만 건이 몰리면 Redis'
    where: '질문 4'
  - topic: '락을 잡은 채 외부 API를 부르면 다른 주문이 모두 기다린다. 트랜잭션을 짧게 둔다'
    where: '질문 4'
  - topic: '재고를 줄인 뒤 결제가 실패하면 재고를 되돌린다(보상)'
    where: '질문 4의 더 알아보기. 흐름은 분산 트랜잭션과 사가(A19)'
  - topic: '스프링 데이터 JPA에서 조건부 UPDATE(@Modifying @Query)와 비관적 락(@Lock)을 쓰는 코드'
    where: '실무에서는'
  - topic: '서버 여러 대에서 쓰는 락'
    where: '다루지 않음: 분산 락(A12)'
  - topic: '선착순 이벤트처럼 요청이 한꺼번에 몰릴 때 받는 구조'
    where: '다루지 않음: 선착순 이벤트 설계(A14)'
codes:
  predict: |-
    @Transactional
    void order(long itemId) {
      Item item = items.findById(itemId)
          .orElseThrow();
      if (item.getQuantity() < 1) {
        throw new SoldOutException();
      }
      item.setQuantity(
          item.getQuantity() - 1);
    }
  predictMark: |-
    @Transactional
    void order(long itemId) {
      Item item = [[items.findById(itemId)]]
          .orElseThrow();
      if (item.getQuantity() < 1) {
        throw new SoldOutException();
      }
      [[item.setQuantity(]]
          [[item.getQuantity() - 1);]]
    }
  conditional: |-
    @Modifying
    @Query("""
        update Item i
        set i.quantity = i.quantity - 1
        where i.id = :id
          and [[i.quantity >= 1]]""")
    int decrease(long id);
  conditionalUse: |-
    @Transactional
    void order(long itemId) {
      if (items.decrease(itemId) == 0) {
        throw new SoldOutException();
      }
    }
  pessimistic: |-
    @Lock(LockModeType.PESSIMISTIC_WRITE)
    @Query("select i from Item i"
        + " where i.id = :id")
    Item findForUpdate(long id);
  lua: |-
    local s = tonumber(
      redis.call('GET', KEYS[1]))
    if s == nil or s < tonumber(ARGV[1])
    then return -1 end
    return redis.call('DECRBY',
      KEYS[1], ARGV[1])
  decrOnly: |-
    long left = redis.decr("stock:1");
    if (left < 0) {
      throw new SoldOutException();
    }
  redisFlow: |-
    long left = decreaseByLua(itemId);
    if (left < 0) throw new SoldOut();
    try {
      orderService.save(itemId, userId);
    } catch (RuntimeException e) {
      [[redis.incr("stock:" + itemId);]]
      throw e;
    }
  longLock: |-
    @Transactional
    void order(long itemId) {
      Item item =
          items.findForUpdate(itemId);
      item.decrease();
      [[payment.approve(...)]]; // 2초
    }
  modifyingRun: |-
    Item item = items.findById(1L)...;
    items.decrease(1L);
    item.getQuantity();
    items.findById(1L)...getQuantity();
  modifyingFix: |-
    @Modifying([[clearAutomatically = true]])
    @Query("update Item i ...")
    int decrease(long id);
  lockTimeout: |-
    @Lock(LockModeType.PESSIMISTIC_WRITE)
    @QueryHints(@QueryHint(
        name = "jakarta.persistence⤷
    .lock.timeout", value = "3000"))
    @Query("select i from Item i"
        + " where i.id = :id")
    Item findForUpdate(long id);
