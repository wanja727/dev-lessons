# 동시 요청에서 재고 지키기 (설계서)
# 자료 파일의 칸은 docs/lesson-data-format.md에 있다.
stage: design
title: 동시 요청에서 재고 지키기
unit: 시스템 설계와 아키텍처
roadmap: A7
type: 동작 확인
prerequisites:
  - {slug: locking, title: 낙관적 락과 비관적 락}
  - {slug: redis-ranking, title: Redis}
assume: '스프링 부트 3.5, 스프링 데이터 JPA, PostgreSQL 16, Redis 7. 갱신 손실과 `SELECT ... FOR UPDATE`, `@Version`(낙관적 락과 비관적 락 레슨). Redis가 명령을 하나씩 실행하고 Lua 스크립트로 여러 명령을 한 번에 실행한다는 것(Redis 레슨).'
example: '한정판 운동화 재고 50켤레에 주문 100건이 동시에 들어온다. 주문마다 재고를 1 줄이고, 재고가 없으면 품절로 거절한다. 같은 주문을 다섯 가지 방법으로 처리하고 팔린 수와 남은 재고를 센다.'
intro:
  - '한정판 운동화 50켤레를 열었는데 주문이 57건 들어왔어요. 7명에게는 사과 문자와 환불을 보내야 해요. 코드에는 분명히 "재고가 0이면 품절"이라고 적혀 있었어요.'
  - '재고, 좌석, 쿠폰 수량처럼 줄어드는 숫자를 다루는 스프링 개발자는 "동시에 오면 어떻게 되나"를 꼭 따져야 해요. 방법은 여럿이고 저마다 지키는 것과 치르는 값이 달라요. 면접에서는 "재고 차감 동시성을 어떻게 처리하나요"로 묻고, 방법 하나가 아니라 고르는 기준까지 기대해요.'
  - '이 레슨에서는 실제 PostgreSQL과 Redis에서 주문 100건을 동시에 넣어요. 읽고 계산하고 쓰는 코드가 몇 켤레를 팔아 버리는지, 조건부 UPDATE와 락과 Redis가 각각 50켤레에서 멈추는지, 얼마나 걸리는지 비교해요.'
covers:
  - topic: '초과 판매: 재고를 읽고, 계산하고, 쓰는 사이에 다른 주문이 같은 재고를 읽으면 재고보다 많이 팔린다'
    where: '질문 1'
  - topic: '`@Transactional`과 기본 격리 수준만으로는 막지 못한다'
    where: '질문 1. 격리 수준은 격리 수준과 이상 현상(D9)'
  - topic: '조건부 UPDATE: `UPDATE ... SET q = q - 1 WHERE id = ? AND q >= 1`. DB가 확인과 차감을 한 문장으로 하고 바뀐 행 수로 성공을 안다'
    where: '질문 2'
  - topic: '비관적 락(SELECT FOR UPDATE)은 읽을 때 행을 잠가 다음 주문을 기다리게 한다'
    where: '질문 2. 락의 원리는 낙관적 락과 비관적 락(D10)'
  - topic: '낙관적 락(@Version)은 충돌한 주문을 실패시킨다. 재고가 남았는데도 실패하는 주문이 생겨 재시도가 필요하다. 경쟁이 심한 재고에는 맞지 않는다'
    where: '질문 2'
  - topic: 'Redis DECR은 원자적이지만 0에서 멈추지 않는다. 음수까지 내려간다'
    where: '질문 3'
  - topic: 'Redis Lua 스크립트로 확인과 차감을 한 번에 실행하면 0에서 멈춘다'
    where: '질문 3'
  - topic: 'Redis로 차감하면 DB와 재고 숫자가 둘이 된다. 주문 저장이 실패하면 Redis 재고를 되돌려야 하고, Redis가 날아가면 DB에서 다시 맞춘다'
    where: '질문 3'
  - topic: '고르는 기준: 대부분은 조건부 UPDATE로 충분하다. 재고 확인 뒤 다른 일을 함께 해야 하면 비관적 락, 수만 건이 몰리면 Redis'
    where: '질문 4'
  - topic: '락을 잡은 채 외부 API를 부르면 다른 주문이 모두 기다린다. 트랜잭션을 짧게 둔다'
    where: '질문 4'
  - topic: '재고를 줄인 뒤 결제가 실패하면 재고를 되돌린다(보상)'
    where: '질문 4의 더 알아보기. 흐름은 분산 트랜잭션과 사가(A19)'
  - topic: '스프링 데이터 JPA에서 조건부 UPDATE(@Modifying @Query)와 비관적 락(@Lock)을 쓰는 코드'
    where: '실무에서는'
  - topic: '서버 여러 대에서 쓰는 락'
    where: '다루지 않음: 분산 락(A12)'
  - topic: '선착순 이벤트처럼 요청이 한꺼번에 몰릴 때 받는 구조'
    where: '다루지 않음: 선착순 이벤트 설계(A14)'
codes:
  predict: |-
    @Transactional
    void order(long itemId) {
      Item item = items.findById(itemId)
          .orElseThrow();
      if (item.getQuantity() < 1) {
        throw new SoldOutException();
      }
      item.setQuantity(
          item.getQuantity() - 1);
    }
  conditional: |-
    @Modifying
    @Query("""
        update Item i
        set i.quantity = i.quantity - 1
        where i.id = :id
          and i.quantity >= 1""")
    int decrease(long id);
  pessimistic: |-
    @Lock(LockModeType.PESSIMISTIC_WRITE)
    @Query("select i from Item i"
        + " where i.id = :id")
    Item findForUpdate(long id);
  lua: |-
    local s = tonumber(
      redis.call('GET', KEYS[1]))
    if s == nil or s < tonumber(ARGV[1])
    then return -1 end
    return redis.call('DECRBY',
      KEYS[1], ARGV[1])
predict:
  text: '코드 predict로 재고 50켤레에 주문 100건을 동시에 넣어요. 재고를 읽어 0보다 크면 1을 줄여요. 성공한 주문은 몇 건일까요? 보기: 정확히 50건, 50건보다 많다, 50건보다 적다.'
  answer: '50건보다 많다. 여러 주문이 같은 재고를 읽고 같은 값을 써서, 줄인 것보다 많이 팔린다. 질문 1에서 밝힌다.'
questions:
  - id: q1
    title: 재고를 확인하고 줄였는데 왜 재고보다 많이 팔리나요?
    conclusion:
      lead: '여러 주문이 같은 재고를 동시에 읽고, 각자 1을 뺀 같은 값을 써서 줄인 것이 사라지기 때문이에요.'
      sub: '읽기와 쓰기 사이에 틈이 있어요. `@Transactional`을 붙여도 기본 격리 수준(READ COMMITTED)은 다른 트랜잭션이 같은 행을 읽는 것을 막지 않아요.'
    says:
      - '코드 predict를 동시 주문 100건으로 돌린다. 성공이 50건보다 많은 것을 실제 출력으로 보인다. 예측의 답을 밝힌다'
      - '두 주문으로 줄여 본다. 둘 다 재고 50을 읽고, 둘 다 49를 쓴다. 두 켤레가 팔렸는데 재고는 하나만 줄었다. 이것이 갱신 손실이다(D10)'
      - '재고가 1일 때 둘 다 1을 읽으면 둘 다 "있음"으로 판단하고 둘 다 판다. 그래서 팔린 수가 재고보다 많아진다'
      - '`@Transactional`은 일을 묶어 커밋과 롤백을 할 뿐이다. 같은 행을 다른 트랜잭션이 읽는 것을 막지 않는다(D9)'
    widget:
      kind: steps
      note: '주문 A와 주문 B가 재고 1을 두고 한 동작씩 진행한다. 단계: A가 1을 읽음, B가 1을 읽음, A가 0을 씀, B가 0을 씀. duo에 DB 재고와 팔린 수가 바뀌고, 끝에 팔린 수 2와 재고 0이 빨갛게 표시된다'
    asks:
      - '본문의 예시: 재고 1에서 두 주문이 동시에 재고를 읽고 각자 0을 썼다. 팔린 수와 남은 재고는 (2켤레, 0)'
      - '옮긴 상황: 좌석 예매에서 `seat.isReserved()`가 false면 `seat.reserve()`를 한다. 두 사람이 같은 좌석을 동시에 누르면 생길 수 있는 일은 (둘 다 예매에 성공한다)'
  - id: q2
    title: DB에서는 어떻게 재고를 지키나요?
    conclusion:
      lead: '확인과 차감을 한 문장으로 하는 조건부 UPDATE, 또는 읽을 때 행을 잠그는 비관적 락으로 지켜요.'
      sub: '둘 다 정확히 50건만 성공해요. 낙관적 락도 초과 판매는 막지만, 충돌한 주문을 실패시켜서 재고가 남았는데 품절처럼 거절되는 주문이 생겨요.'
    says:
      - '코드 conditional: `quantity >= 1`인 경우에만 줄인다. DB가 그 행을 바꾸는 동안 다른 UPDATE는 기다린다. 바뀐 행 수가 0이면 품절이다. 성공 50, 품절 50, 남은 재고 0을 보인다'
      - '코드 pessimistic: `SELECT ... FOR UPDATE`로 읽으면 그 행에 락이 걸려 다른 주문의 같은 SELECT가 커밋까지 기다린다. 읽고-계산하고-쓰기 코드를 그대로 두고도 정확히 50건이다'
      - '낙관적 락(`@Version`): 커밋할 때 버전이 바뀌었으면 실패한다. 동시에 100건이 오면 많은 주문이 충돌로 실패하고 재고가 남는다. 실제 출력으로 성공, 충돌 실패, 남은 재고를 보인다. 재시도를 붙여야 하고, 경쟁이 심할수록 재시도가 늘어난다'
      - '세 방법의 결과와 걸린 시간을 표 하나로 보인다(테스트의 실측)'
    asks:
      - '본문의 예시: 재고 50에 조건부 UPDATE로 동시 주문 100건을 처리했다. 성공, 품절, 남은 재고는 (50, 50, 0)'
      - '옮긴 상황: 쿠폰 1000장을 낙관적 락으로 발급하는데 오픈 순간 1만 명이 몰린다. 재시도 없이 운영하면 생길 일은 (충돌로 실패하는 요청이 많아 쿠폰이 남았는데 발급 실패가 난다)'
      - '실무 구역: 코드 conditional의 `decrease`가 0을 돌려줬다. 서비스는 무엇을 해야 하나 (품절로 판단하고 예외를 던져 주문을 거절한다)'
  - id: q3
    title: Redis로 재고를 줄일 때는 무엇을 조심하나요?
    conclusion:
      lead: '`DECR`은 섞이지 않지만 0에서 멈추지 않아서, 확인과 차감을 Lua 스크립트로 묶어 한 번에 실행해야 해요.'
      sub: '그리고 재고 숫자가 Redis와 DB 두 곳에 생겨요. 주문 저장이 실패하면 Redis 재고를 되돌리고, 둘이 어긋나면 DB를 기준으로 맞춰요.'
    says:
      - '`DECR`만 쓰면 주문 100건이 재고를 -50까지 내린다. 명령은 원자적이지만 "0보다 클 때만"이라는 조건이 없다. 결과가 0 이상인 주문만 성공으로 치면 50건이 맞지만, 재고 값은 음수로 남는다'
      - '`GET`으로 확인하고 `DECR`하면 A5에서 본 것처럼 사이에 다른 명령이 끼어든다'
      - '코드 lua: 확인과 차감을 스크립트 하나로 실행한다. Redis는 스크립트 전체를 한 명령처럼 실행한다. 정확히 50건 성공, 재고는 0에서 멈춘다'
      - 'Redis로 차감하는 이유는 속도다. DB 행 하나에 락이 몰리지 않는다. 대신 재고가 두 곳이다. Redis에서 줄인 뒤 DB의 주문 저장이 실패하면 Redis에 다시 더해야 한다. Redis가 재시작되면 DB의 재고로 다시 채운다'
    widget:
      kind: toggle
      note: 'DECR만, GET 뒤 DECR, Lua 스크립트 세 가지를 고르고 실행을 누르면, 재고 2에 주문 3건이 왔을 때 Redis에 쌓이는 명령과 재고 값을 로그로 보인다. DECR만은 -1, Lua는 0에서 멈추고 셋째 주문이 -1을 받는다'
    asks:
      - '본문의 예시: 재고 50에 `DECR`만으로 주문 100건을 처리한 뒤 Redis의 재고 값은 (-50)'
      - '옮긴 상황: Lua 스크립트로 재고를 줄인 뒤 DB에 주문을 저장하다가 DB 오류로 실패했다. 아무것도 하지 않으면 생기는 일과 할 일은 (팔리지 않았는데 Redis 재고가 하나 줄어 있다. Redis 재고를 다시 늘린다)'
  - id: q4
    title: 여러 방법 가운데 무엇을 고르나요?
    conclusion:
      lead: '대부분은 조건부 UPDATE로 충분하고, 재고를 읽은 뒤 다른 판단을 함께 해야 하면 비관적 락, 수만 건이 한꺼번에 몰리면 Redis를 써요.'
      sub: '어느 방법이든 락을 잡거나 재고를 줄인 뒤에 외부 API처럼 오래 걸리는 일을 하지 않아요. 기다리는 주문이 그만큼 길게 줄을 서요.'
    says:
      - '조건부 UPDATE: 코드가 짧고 DB 하나로 끝나며 빠르다. 재고 차감 같은 "조건 확인 후 숫자 바꾸기"에 맞다'
      - '비관적 락: 재고 외에 회원 등급, 1인당 구매 한도를 함께 확인하는 등 읽은 값으로 판단이 길 때. 락을 잡는 동안 다른 주문이 기다린다'
      - '낙관적 락: 충돌이 드문 데이터(회원 정보 수정)에 맞고 재고처럼 몰리는 데이터에는 맞지 않는다'
      - 'Redis: DB 행 하나에 수천 건이 몰리는 선착순 판매. 운영할 것이 늘어난다(두 곳의 재고, 되돌리기). A14에서 이어진다'
      - '흔한 실수: 비관적 락을 잡은 트랜잭션 안에서 결제 API를 부른다. 결제가 2초 걸리면 다른 주문 모두가 2초씩 줄을 선다. 재고를 줄이고 커밋한 뒤 결제하고, 결제가 실패하면 재고를 되돌린다'
      - '더 알아보기: 재고를 되돌리는 일은 결제 실패, 주문 취소, 시간 초과에서 모두 필요하다. 이렇게 앞의 일을 취소하는 것을 보상이라고 하고 A19에서 다룬다'
    widget:
      kind: classify
      note: '상황마다 조건부 UPDATE, 비관적 락, Redis 가운데 고른다. 예: 평범한 쇼핑몰의 재고 차감, 1인 2개 한도와 등급 확인을 함께 하는 주문, 오픈 1초에 5만 명이 몰리는 한정판, 콘서트 좌석 하나를 고르는 예매'
    asks:
      - '본문의 예시: 하루 주문 수천 건인 쇼핑몰의 재고 차감에 가장 단순하게 맞는 방법은 (조건부 UPDATE)'
      - '옮긴 상황: `SELECT ... FOR UPDATE`로 재고를 잠근 트랜잭션 안에서 외부 결제 API(2초)를 부른다. 같은 상품에 주문 10건이 동시에 오면 마지막 주문은 대략 얼마를 기다리나 (약 18초. 앞의 9건이 2초씩 락을 잡는다)'
practice:
  says:
    - '스프링 데이터 JPA의 조건부 UPDATE: 코드 conditional처럼 `@Modifying @Query`로 쓰고 바뀐 행 수(int)를 받는다. 0이면 품절 예외를 던진다'
    - '`@Modifying` 쿼리는 영속성 컨텍스트를 거치지 않고 DB를 바로 바꾼다. 같은 트랜잭션에서 앞서 읽은 `Item` 엔티티의 수량은 옛 값이다. `clearAutomatically = true`를 주거나 다시 읽는다(P8). 테스트로 옛 값을 보인다'
    - '비관적 락: 코드 pessimistic처럼 `@Lock(PESSIMISTIC_WRITE)`. 락을 기다리는 시간의 한도는 `jakarta.persistence.lock.timeout` 힌트로 준다'
    - '흔한 실수: `@Transactional` 없이 `findForUpdate`를 부른다. 락은 트랜잭션이 끝나면 풀리므로, 트랜잭션이 없으면 조회가 끝나자마자 풀린다. 스프링 데이터 JPA는 이 경우 `TransactionRequiredException`류의 오류를 낸다. 테스트로 확인하고 본문을 맞춘다'
