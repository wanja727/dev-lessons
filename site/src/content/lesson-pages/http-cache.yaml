# HTTP 캐시
# 자료 파일의 칸은 docs/lesson-data-format.md에 있다. 문제는 content/questions/http-cache.yaml에 있다.
title: HTTP 캐시
description: HTTP 캐시가 무엇을 언제 다시 쓰는지, 시간이 지난 캐시를 ETag와 304로 확인하는 법, Cache-Control의 값을 고르는 법, CDN이 캐시를 다루는 법. 네 가지 질문에 스스로 답할 수 있게 만드는 대화형 레슨.
unit: 네트워크와 웹
minutes: 18
roadmap: N11
type: 개념 설명
prerequisites:
  - {slug: http-basics, title: HTTP 요청과 응답}
assume: 'HTTP 요청과 응답의 헤더와 상태 코드(HTTP 요청과 응답 레슨). 스프링 부트 3.5. 브라우저와 CDN이 응답을 저장하고 꺼내 쓰는 모습은 테스트로 돌릴 수 없어서, 서버가 보내는 헤더와 조건부 요청의 응답은 테스트로 확인하고 캐시의 동작은 RFC 9111을 근거로 적어요.'
example: '쇼핑몰의 상품 목록 API(`/products`), 상품 하나(`/products/7`), 내 정보(`/me`), 그리고 화면의 `app.js`. 무엇을 얼마나 저장하게 할지 정해 봐요.'
intro:
  - '상품 목록은 하루에 몇 번 바뀌지 않는데 사용자가 화면을 열 때마다 서버가 같은 JSON을 만들어 보내요. 반대로 배포를 했는데 사용자 화면에는 옛 `app.js`가 계속 돌아요. 둘 다 HTTP 캐시를 어떻게 정했느냐의 문제예요.'
  - '스프링 개발자는 응답 헤더 몇 줄로 캐시를 정해요. `Cache-Control`의 값 하나를 잘못 고르면 CDN이 kim의 내 정보 응답을 lee에게 내주는 사고가 나요. 면접에서는 "ETag와 304를 설명해 주세요", "no-cache와 no-store의 차이는요?"를 물어요.'
  - '이 레슨에서는 스프링 서버가 보내는 캐시 헤더와 조건부 요청의 304 응답을 실제로 확인하고, 응답마다 어떤 값을 골라야 하는지 정리해요.'
covers:
  - {topic: 'HTTP 캐시는 받은 응답을 저장했다가 같은 요청에 다시 쓴다. 브라우저(개인 캐시)와 프록시, CDN(공유 캐시)', where: 질문 1}
  - {topic: 'Cache-Control: max-age 동안은 신선해서 서버에 묻지 않고 쓴다', where: 질문 1}
  - {topic: 'Expires 헤더와 max-age의 관계', where: 질문 1의 더 알아보기}
  - {topic: '조건부 요청: ETag와 If-None-Match, Last-Modified와 If-Modified-Since. 바뀌지 않았으면 304와 빈 본문', where: 질문 2}
  - {topic: '304는 본문을 보내지 않아 전송량을 줄인다. 서버의 일은 ETag를 어떻게 만드느냐에 따라 다르다', where: '질문 2, 실무에서는'}
  - {topic: 'no-store(저장하지 않음), no-cache(저장하되 쓸 때마다 확인), private(브라우저만), public(공유 캐시도), s-maxage(공유 캐시의 시간)', where: 질문 3}
  - {topic: '파일 이름에 내용의 해시를 넣고 오래 캐시하기(immutable)', where: 질문 3}
  - {topic: 'CDN: 사용자 가까운 곳의 공유 캐시. 원 서버의 부하와 거리를 줄인다', where: 질문 4}
  - {topic: 'CDN의 캐시를 비우는 법: 무효화(purge)와 버전이 붙은 주소', where: 질문 4}
  - {topic: 'Vary: 요청 헤더에 따라 응답이 다르면 캐시가 나눠 저장하게 한다', where: 질문 4}
  - {topic: '스프링에서 캐시 헤더 주기: ResponseEntity.cacheControl, CacheControl, eTag, WebRequest.checkNotModified', where: 실무에서는}
  - {topic: 'ShallowEtagHeaderFilter: 응답을 다 만든 뒤 ETag를 계산해 전송량만 줄인다', where: 실무에서는}
  - {topic: '흔한 실수: 사용자마다 다른 응답에 public, max-age를 붙여 공유 캐시가 남의 응답을 내준다', where: 실무에서는}
  - {topic: '서버 안의 캐시(@Cacheable, Redis)', where: '다루지 않음: 캐시 전략(A 과정)'}
  - {topic: '정적 파일을 스프링 부트가 내보낼 때의 캐시 설정', where: 실무에서는의 더 알아보기}
codes:
  maxAge: |-
    @GetMapping("/products")
    ResponseEntity<List<String>> list() {
      return ResponseEntity.ok()
          .cacheControl(CacheControl
              .[[maxAge(Duration.ofSeconds(60))]])
          .body(List.of("커피", "라떼"));
    }
  etagRun: |-
    GET /products/7

    GET /products/7
    [[If-None-Match: "v3"]]   # 그대로

    # 상품이 바뀐 뒤
    GET /products/7
    If-None-Match: "v3"
  lastModifiedRun: |-
    GET /notices/1

    GET /notices/1
    [[If-Modified-Since]]: (받은 Last-Modified)

    GET /notices/1
    If-Modified-Since: (한 시간 전)
  checkNotModified: |-
    @GetMapping("/products/{id}")
    ResponseEntity<Product> one(
        @PathVariable long id,
        WebRequest request) {
      Product p = products.find(id);
      var etag = "\"v" + p.version() + "\"";
      if (request.[[checkNotModified]](etag)) {
        return null;  // 스프링이 304를 만든다
      }
      return ResponseEntity.ok()
          .[[eTag(etag)]].body(p);
    }
  shallow: |-
    @Bean
    FilterRegistrationBean<⤷
    ShallowEtagHeaderFilter> etagFilter() {
      return new FilterRegistrationBean<>(
          new [[ShallowEtagHeaderFilter]]());
    }
  shallowRun: |-
    GET /menu

    GET /menu
    If-None-Match: (받은 ETag)
  mistake: |-
    @GetMapping("/me")
    ResponseEntity<String> me() {
      return ResponseEntity.ok()
          .cacheControl(CacheControl
              .maxAge(Duration.ofSeconds(60))
              .[[cachePublic()]])
          .body(...);
    }
  fixed: |-
    @GetMapping("/me")
    ResponseEntity<String> me() {
      return ResponseEntity.ok()
          .cacheControl(
              CacheControl.[[noStore()]])
          .body(...);
    }
  privateRun: |-
    GET /me        (흔한 실수)
    GET /me/fixed  (고친 코드)
  assets: |-
    <!-- index.html: Cache-Control: no-cache -->
    <script src="/app.[[3f9a1c]].js"></script>

    # app.3f9a1c.js의 응답
    Cache-Control: public,
      max-age=31536000, immutable
  bootStatic: |-
    spring:
      web:
        resources:
          cache:
            cachecontrol:
              max-age: 365d
          chain:
            strategy:
              content:
                enabled: true
links:
  test: https://github.com/wanja727/dev-lessons/blob/main/verification/src/test/java/lab/devlessons/httpcache/HttpCacheTest.java
  rfc9111: https://www.rfc-editor.org/rfc/rfc9111.html
  rfc9110cond: https://www.rfc-editor.org/rfc/rfc9110.html#section-13
  springCaching: https://docs.spring.io/spring-framework/reference/web/webmvc/mvc-caching.html
  bootStatic: https://docs.spring.io/spring-boot/reference/web/servlet.html#web.servlet.spring-mvc.static-content
predict:
  title: 바뀌지 않았으면 무엇을 받을까요?
  text: '상품 `/products/7`을 한 번 받아 `ETag: "v3"`를 기억해 둔 클라이언트가, 다시 요청하며 `If-None-Match: "v3"`를 보냈어요. 상품은 그동안 바뀌지 않았어요. 스프링 서버는 어떻게 답할까요? 모르는 게 정상이니 감으로 골라 보세요. 답은 질문 2에 나와요.'
  code: etagRun
  label: 내 예측
  options:
    - value: same
      label: 200과 같은 본문
    - value: notmodified
      label: 304와 빈 본문
    - value: notfound
      label: '404'
  answer: notmodified
  storageKey: cache-predict
  wrong: 예측은 "{label}"이었어요. 틀린 예측이 더 오래 남으니 괜찮아요.
questions:
  - id: q1
    title: HTTP 캐시는 무엇을 언제 다시 쓰나요?
    conclusion:
      lead: '받은 응답을 브라우저나 CDN이 저장해 두고, `Cache-Control: max-age`가 정한 시간 동안은 서버에 묻지 않고 그대로 다시 써요.'
      sub: '그 시간 동안은 요청이 서버까지 가지 않아서 빠르고 서버의 일도 줄어요. 대신 그동안 바뀐 내용은 보이지 않아요.'
    says:
      - '캐시는 응답을 저장했다가 같은 요청(같은 주소와 메서드)에 다시 쓴다. 브라우저의 캐시는 그 사용자만 쓰는 개인 캐시, 프록시와 CDN은 여러 사용자가 함께 쓰는 공유 캐시다'
      - '서버는 `Cache-Control: max-age=60`으로 "60초 동안 신선하다"고 알린다. 신선한 동안 캐시는 서버에 묻지 않는다. 스프링이 보낸 헤더를 실제 출력으로 보인다'
      - '신선한 동안에는 서버에서 바뀌어도 사용자는 옛 응답을 본다. max-age는 "이만큼은 옛것을 봐도 된다"는 약속이다'
      - '더 알아보기: 예전에는 `Expires: 날짜`로 정했다. 둘 다 있으면 max-age를 따른다'
    asks:
      - '본문의 예시: `Cache-Control: max-age=60`인 상품 목록을 받은 브라우저가 30초 뒤 같은 주소를 다시 열면 서버로 요청이 가나 (가지 않는다. 신선하다)'
      - '옮긴 상황: 공지 API에 max-age=3600을 줬다. 10분 뒤 공지를 고쳤다. 이미 받아 간 사용자는 언제 새 공지를 보나 (받은 때부터 한 시간이 지난 뒤)'
    body:
      - p: '**HTTP 캐시**는 받은 응답을 저장해 두었다가, 같은 요청이 오면 서버에 다시 묻지 않고 저장한 것을 쓰는 장치예요. 저장하는 곳은 둘로 나뉘어요.'
      - ul:
          - '**개인 캐시:** 브라우저 안의 캐시. 그 사용자만 써요.'
          - '**공유 캐시:** 회사의 프록시, CDN처럼 여러 사용자가 함께 쓰는 캐시. 한 사람이 받아 둔 응답을 다른 사람에게도 내줘요.'
      - p: '얼마나 오래 써도 되는지는 **서버가** 응답 헤더로 정해요. 상품 목록 API가 "60초 동안은 다시 묻지 말고 써도 된다"고 알리는 코드예요.'
      - ci:
          key: max-age
          label: 응답 헤더 보기
          source: HttpCacheTest.maxAge
          code: maxAge
      - p: '`Cache-Control: max-age=60`을 받은 캐시는 그 응답을 **60초 동안 신선하다**고 봐요. 그동안 같은 주소를 다시 열면 요청을 서버로 보내지 않고 저장한 응답을 바로 써요. 화면은 빨라지고 서버는 일을 덜 해요.'
      - p: '대가가 있어요. 그 60초 동안 서버에서 상품 목록이 바뀌어도 사용자는 **옛 응답**을 봐요. max-age는 "이만큼은 옛것을 봐도 괜찮다"는 서버의 약속이에요. 그래서 자주 바뀌는 응답일수록 짧게, 거의 안 바뀌는 응답일수록 길게 잡아요.'
      - more:
          summary: '더 알아보기: Expires 헤더'
          body:
            - p: '예전에는 `Expires: Wed, 25 Nov 2026 10:00:00 GMT`처럼 만료 시각을 적었어요. 서버와 사용자 컴퓨터의 시계가 다르면 어긋나서, 지금은 받은 때부터의 초를 적는 `max-age`를 써요. 둘 다 있으면 `max-age`를 따라요.'
      - quiz:
          q: '공지 API에 `max-age=3600`을 줬어요. 사용자가 공지를 받고 10분 뒤에 운영자가 공지를 고쳤어요. 이미 받아 간 사용자의 브라우저는 언제 새 공지를 보여 줄까요?'
          options:
            - 고친 즉시
            - 받은 때부터 한 시간이 지난 뒤 다시 물을 때
            - 브라우저를 껐다 켤 때만
          answer: 2
          explain: max-age 동안은 신선하다고 보고 서버에 묻지 않아요. 한 시간이 지나야 서버에 다시 물어요.
      - next: 60초가 지나면 캐시는 응답을 버리고 처음부터 다시 받을까요? 바뀌지 않았는데도요?
    recall: 받은 응답을 브라우저(개인 캐시)나 CDN(공유 캐시)이 저장해 두고, Cache-Control max-age가 정한 시간 동안은 신선하다고 보고 서버에 묻지 않고 다시 써요. 빨라지고 서버의 일이 줄지만, 그동안 바뀐 내용은 보이지 않아요.
  - id: q2
    title: 시간이 지난 캐시는 어떻게 다시 확인하나요?
    conclusion:
      lead: '가진 응답의 표시(ETag나 Last-Modified)를 실어 "이것에서 바뀌었나요"를 묻고, 바뀌지 않았으면 서버가 본문 없이 304로 답해요.'
      sub: '조건부 요청이라고 해요. 바뀌지 않았을 때 본문을 다시 받지 않아 전송량이 줄어요.'
    says:
      - '서버는 응답에 `ETag`(내용의 판 번호)나 `Last-Modified`(마지막 수정 시각)를 붙인다. 캐시는 다시 물을 때 `If-None-Match`나 `If-Modified-Since`에 그 값을 싣는다'
      - '바뀌지 않았으면 서버는 `304 Not Modified`와 빈 본문으로 답하고, 캐시는 가진 응답을 다시 신선하게 쓴다. 바뀌었으면 200과 새 본문, 새 ETag다. 예측의 답을 밝힌다. 세 요청을 실제 출력으로 보인다'
      - 'Last-Modified도 같은 일을 한다. 초 단위라 1초 안에 두 번 바뀌면 구별하지 못한다. 그래서 ETag를 더 많이 쓴다'
    widget:
      kind: timeline
      note: '브라우저와 서버 레인에 첫 요청과 200(ETag "v3", max-age=60), 60초 뒤 If-None-Match "v3"와 304, 상품이 바뀐 뒤 If-None-Match "v3"와 200(ETag "v4")를 차례로 넘긴다. 위쪽 칸에 브라우저의 캐시에 든 것과 그 신선한 정도를 둔다'
    asks:
      - '본문의 예시: `If-None-Match: "v3"`로 다시 물었는데 상품이 바뀌어 ETag가 "v4"가 됐다. 서버의 응답은 (200과 새 본문, ETag "v4")'
      - '옮긴 상황: 1MB짜리 상품 이미지 목록 응답이 바뀌지 않았을 때 304를 받으면 무엇이 줄어드나 (본문 1MB의 전송. 요청과 응답의 왕복은 그대로)'
    body:
      - p: 'max-age가 지나면 캐시는 응답이 **신선하지 않다**고 봐요. 그렇다고 버리고 처음부터 다시 받지는 않아요. 서버에 "내가 가진 것에서 바뀌었나요?"를 물어요. 이것이 **조건부 요청**이에요.'
      - p: '그러려면 서버가 처음 응답에 **표시**를 붙여 둬야 해요.'
      - ul:
          - '**`ETag`:** 내용의 판 번호예요. 예: `"v3"`. 내용이 바뀌면 값도 바뀌어요. 캐시는 다시 물을 때 `If-None-Match: "v3"`에 실어요.'
          - '**`Last-Modified`:** 마지막으로 바뀐 시각이에요. 캐시는 `If-Modified-Since`에 실어요.'
      - p: '바뀌지 않았으면 서버는 **304 Not Modified**와 **빈 본문**으로 답해요. 캐시는 가진 응답을 다시 신선하게 써요. 바뀌었으면 200과 새 본문, 새 표시를 줘요. 한 단계씩 넘겨 보세요.'
      - widget:
          kind: timeline
          layout: [duo, timeline, buttons, verdict]
          lanes: [브라우저, 서버]
          initial:
            duo:
              - {label: 브라우저 캐시에 든 것, state: dim, text: 없음}
              - {label: 서버의 상품 7, text: '판 3'}
          scenarios:
            default:
              - event:
                  dir: right
                  title: 첫 요청
                  text: GET /products/7
              - event:
                  dir: left
                  title: 응답
                  text: |
                    HTTP/1.1 200
                    [[ETag: "v3"]]
                    Cache-Control: max-age=60
                    (본문: 상품 7, 판 3)
                  note: 본문과 함께 판 번호를 붙여 줘요.
                duo:
                  - label: 브라우저 캐시에 든 것
                    rows: [{k: 상품 7, v: '판 3, 신선함 60초', mark: changed}]
                  - {label: 서버의 상품 7, text: '판 3'}
              - event:
                  dir: right
                  title: 60초 뒤, 다시 묻기
                  text: |
                    GET /products/7
                    [[If-None-Match: "v3"]]
                  note: 신선하지 않아서 가진 판 번호를 실어 물어요.
                duo:
                  - label: 브라우저 캐시에 든 것
                    rows: [{k: 상품 7, v: '판 3, 신선하지 않음', mark: bad}]
                  - {label: 서버의 상품 7, text: '판 3'}
              - event:
                  dir: left
                  title: 바뀌지 않음
                  text: |
                    [[HTTP/1.1 304]]
                    ETag: "v3"
                    (본문 없음)
                  note: 본문을 다시 보내지 않아요.
                duo:
                  - label: 브라우저 캐시에 든 것
                    rows: [{k: 상품 7, v: '판 3, 다시 신선함 60초', mark: changed}]
                  - {label: 서버의 상품 7, text: '판 3'}
              - event:
                  dir: right
                  title: 상품이 바뀐 뒤, 다시 묻기
                  text: |
                    GET /products/7
                    If-None-Match: "v3"
                duo:
                  - {label: 브라우저 캐시에 든 것, rows: [{k: 상품 7, v: '판 3, 신선하지 않음'}]}
                  - label: 서버의 상품 7
                    rows: [{k: 판, v: '4', mark: changed}]
              - event:
                  dir: left
                  title: 바뀜
                  text: |
                    HTTP/1.1 200
                    [[ETag: "v4"]]
                    (본문: 상품 7, 판 4)
                duo:
                  - label: 브라우저 캐시에 든 것
                    rows: [{k: 상품 7, v: '판 4, 신선함 60초', mark: changed}]
                  - {label: 서버의 상품 7, text: '판 4'}
                verdict: 바뀌지 않았으면 304로 본문을 아끼고, 바뀌었으면 새 본문과 새 판 번호를 받아요.
      - p: 스프링 서버에 실제로 세 번 보내 봤어요.
      - ci:
          key: etag
          label: 세 요청의 응답 보기
          source: HttpCacheTest.etagRevalidation
          code: etagRun
      - p: '둘째 요청이 처음 예측한 상황이에요. 답은 **304와 빈 본문**이에요. {{predict-result}} 셋째 요청은 그사이 상품이 바뀌어 `"v3"`와 맞지 않으니 200과 새 본문, `ETag: "v4"`가 왔어요.'
      - p: '304가 줄이는 것은 **본문의 전송**이에요. 요청과 응답의 왕복은 그대로 들어요. 본문이 클수록 효과가 커요.'
      - h3: Last-Modified도 같아요
      - p: '수정 시각으로 확인할 수도 있어요.'
      - ci:
          key: last-modified
          label: 세 요청의 응답 보기
          source: HttpCacheTest.lastModified
          code: lastModifiedRun
      - p: '받은 `Last-Modified`를 그대로 실으면 304, 그보다 앞선 시각을 실으면 그 뒤에 바뀐 것이 있으니 200이에요. 다만 시각은 초 단위라 1초 안에 두 번 바뀌면 구별하지 못해요. 그래서 ETag를 더 많이 써요.'
      - quiz:
          q: '`If-None-Match: "v3"`로 다시 물었는데, 그사이 상품이 바뀌어 서버의 판 번호가 `"v4"`가 됐어요. 서버의 응답은 무엇일까요?'
          options:
            - 304와 빈 본문
            - 200과 새 본문, ETag "v4"
            - 412
          answer: 2
          explain: 판 번호가 맞지 않으니 바뀐 거예요. 새 본문과 새 ETag를 줘요.
      - next: max-age, ETag, 304를 봤어요. 그러면 응답마다 Cache-Control에 어떤 값을 적어야 할까요?
    recall: 가진 응답의 표시를 실어 바뀌었는지 물어요. ETag는 If-None-Match에, Last-Modified는 If-Modified-Since에 실어요. 바뀌지 않았으면 서버가 304와 빈 본문으로 답해 캐시가 가진 것을 다시 쓰고, 바뀌었으면 200과 새 본문, 새 ETag를 줘요. 304는 본문의 전송을 줄여요.
  - id: q3
    title: Cache-Control의 값은 어떻게 고르나요?
    conclusion:
      lead: '응답이 누구의 것이고 얼마나 자주 바뀌는지로 골라요. 남에게 보이면 안 되면 `no-store`나 `private`, 바뀌면 바로 보여야 하면 `no-cache`, 바뀌지 않는 파일은 긴 `max-age`예요.'
      sub: '`no-cache`는 "저장하지 마"가 아니라 "쓸 때마다 확인해"예요. 저장하지 말라는 것은 `no-store`예요.'
    says:
      - '표 하나로 값과 뜻을 정리한다: no-store(어디에도 저장하지 않음), no-cache(저장하되 쓸 때마다 조건부 요청으로 확인), private(브라우저만 저장, 공유 캐시는 저장 안 함), public(공유 캐시도 저장), max-age(신선한 시간), s-maxage(공유 캐시에만 쓰는 시간)'
      - 'no-cache와 no-store를 헷갈린다. no-cache는 저장하고 304로 확인하니 전송량이 준다. 결제 내역처럼 남으면 안 되는 응답은 no-store다'
      - '바뀌지 않는 파일은 이름에 내용의 해시를 넣고(`app.3f9a1c.js`) 1년 max-age와 immutable을 준다. 내용이 바뀌면 이름이 바뀌니 새 파일을 받는다. HTML은 no-cache로 두어 새 이름을 바로 가리키게 한다'
    widget:
      kind: classify
      note: '응답(내 주문 내역, 상품 목록, 이름에 해시가 든 app.3f9a1c.js, index.html, 결제 카드 정보, 로그인한 사용자의 장바구니)을 Cache-Control 값(no-store, private과 no-cache, public과 max-age, public과 1년 max-age와 immutable)으로 고른다'
    asks:
      - '본문의 예시: `Cache-Control: no-cache`를 받은 브라우저는 응답을 저장하나 (저장한다. 쓸 때마다 서버에 확인한다)'
      - '옮긴 상황: 배포 뒤에도 사용자 화면에 옛 app.js가 돈다. app.js는 이름이 늘 같고 max-age=86400이다. 어떻게 고치나 (이름에 내용의 해시를 넣고, HTML은 no-cache로 둔다)'
    body:
      - p: '`Cache-Control`에는 여러 값을 쉼표로 함께 적어요. 자주 쓰는 값이에요.'
      - table:
          head: [값, 뜻]
          rows:
            - ['`no-store`', '어디에도 저장하지 않아요. 남으면 안 되는 응답']
            - ['`no-cache`', '저장하되, 쓸 때마다 서버에 확인해요(질문 2의 조건부 요청)']
            - ['`private`', '브라우저만 저장하고 공유 캐시(CDN)는 저장하지 않아요']
            - ['`public`', '공유 캐시도 저장해도 돼요']
            - ['`max-age=초`', '그 시간 동안 신선해요(질문 1)']
            - ['`s-maxage=초`', '공유 캐시에만 쓰는 신선한 시간']
            - ['`immutable`', '신선한 동안 내용이 절대 바뀌지 않으니 다시 확인하지 마세요']
      - h3: no-cache는 "저장하지 마"가 아니에요
      - p: '가장 흔한 오해예요. **`no-cache`는 저장해요.** 다만 쓸 때마다 서버에 조건부 요청으로 확인해요. 바뀌지 않았으면 304라 본문 전송은 아껴요. "바뀌면 바로 보여야 하지만 본문은 아끼고 싶은" 응답에 맞아요. 결제 카드 정보처럼 **아예 남으면 안 되는** 응답은 `no-store`예요.'
      - h3: 바뀌지 않는 파일은 이름을 바꿔요
      - p: '`app.js`에 하루 max-age를 주면, 배포 뒤에도 하루 동안 옛 파일이 돌아요. 그렇다고 짧게 주면 매번 받아서 느려요. 해법은 **파일 이름에 내용의 해시**를 넣는 거예요.'
      - code: assets
        notes:
          - mark: 3f9a1c
            as: str
            text: '파일 내용으로 계산한 값이에요. 내용이 바뀌면 이름이 바뀌어요.'
      - p: '이름에 해시가 든 파일은 그 이름으로는 내용이 절대 바뀌지 않으니 **1년 max-age와 immutable**을 줘요. 배포하면 해시가 바뀌어 새 이름이 되고, 브라우저는 새 이름의 파일을 처음 받는 것처럼 받아요. 대신 그 이름을 가리키는 **HTML은 `no-cache`**로 두어 늘 새 이름을 가리키게 해요.'
      - p: 응답마다 알맞은 값을 골라 보세요.
      - widget:
          kind: classify
          categories: ['no-store', 'private, no-cache', 'public, max-age=60', 'public, max-age=1년, immutable']
          items:
            - {text: 결제에 쓴 카드 정보 응답, answer: 1, explain: '어디에도 남으면 안 돼요.'}
            - {text: 로그인한 사용자의 장바구니, answer: 2, explain: '그 사용자의 것이라 공유 캐시는 안 되고, 바뀌면 바로 보여야 해요.'}
            - {text: 누구에게나 같은 상품 목록, answer: 3, explain: '모두에게 같아서 CDN도 저장해도 되고, 1분쯤 늦어도 괜찮아요.'}
            - {text: '이름에 해시가 든 app.3f9a1c.js', answer: 4, explain: '그 이름으로는 내용이 바뀌지 않아요.'}
            - {text: 'index.html (해시 이름의 JS를 가리킴)', answer: 2, explain: '늘 새 JS 이름을 가리켜야 해서 쓸 때마다 확인해요. 사용자마다 같다면 public, no-cache도 돼요.'}
      - quiz:
          q: '`Cache-Control: no-cache`를 받은 브라우저는 그 응답을 어떻게 할까요?'
          options:
            - 저장하지 않는다
            - 저장하고, 쓸 때마다 서버에 바뀌었는지 확인한다
            - 저장하고, 확인하지 않고 계속 쓴다
          answer: 2
          explain: no-cache는 저장해요. 다만 쓰기 전에 조건부 요청으로 확인해요. 저장하지 말라는 것은 no-store예요.
      - next: public이면 공유 캐시도 저장한다고 했어요. 대표적인 공유 캐시인 CDN은 어떻게 일하고, 잘못 저장한 것은 어떻게 비울까요?
    recall: 응답이 누구의 것이고 얼마나 자주 바뀌는지로 골라요. 남으면 안 되면 no-store, 그 사용자만의 것이면 private, 바뀌면 바로 보여야 하면 no-cache(저장하되 쓸 때마다 확인), 모두에게 같으면 public과 max-age예요. 바뀌지 않는 파일은 이름에 해시를 넣고 1년 max-age와 immutable을 주고, HTML은 no-cache로 둬요.
  - id: q4
    title: CDN은 무엇을 캐시하고 어떻게 비우나요?
    conclusion:
      lead: 'CDN은 사용자 가까이에 둔 공유 캐시예요. public으로 허락한 응답을 저장해 원 서버 대신 답하고, 바꿀 때는 무효화 요청을 보내거나 주소에 버전을 붙여요.'
      sub: '여러 사용자가 함께 쓰니, 사용자마다 다른 응답은 저장하게 두면 안 돼요. 요청 헤더에 따라 다르면 Vary로 나눠 저장하게 해요.'
    says:
      - 'CDN은 세계 곳곳에 서버를 두고 사용자에게 가까운 곳에서 답한다. 원 서버까지 가는 거리와 원 서버의 부하가 준다. 이미지, JS, CSS 같은 정적 파일과 public으로 허락한 API 응답을 저장한다'
      - '공유 캐시는 주소가 같으면 같은 응답을 여러 사용자에게 준다. 로그인한 사용자의 응답은 private이나 no-store로 둔다'
      - '비우는 법 둘: CDN에 무효화(purge)를 요청하거나, 주소에 버전을 붙여(`?v=42`, 해시 이름) 새 주소로 바꾼다. 무효화는 퍼지는 데 시간이 걸리고 비용이 드는 경우가 있다'
      - '`Vary: Accept-Encoding`이면 gzip을 받는 요청과 안 받는 요청을 따로 저장한다. CORS 레슨의 `Vary: Origin`도 같은 뜻이다'
    asks:
      - '본문의 예시: CDN 뒤에 있는 `/me`(로그인한 사용자의 정보)에 `Cache-Control: public, max-age=60`을 주면 무슨 일이 생길 수 있나 (CDN이 kim의 응답을 저장해 60초 동안 다른 사용자에게도 준다)'
      - '옮긴 상황: 출처마다 Access-Control-Allow-Origin이 다른 응답을 CDN이 캐시한다. 응답에 무엇이 있어야 섞이지 않나 (Vary: Origin)'
    body:
      - p: '**CDN**(Content Delivery Network)은 세계 곳곳에 서버를 두고, 사용자에게 가까운 서버가 원 서버 대신 답하게 하는 공유 캐시예요. 서울의 사용자는 미국의 원 서버가 아니라 서울의 CDN 서버에서 이미지를 받아요. 거리가 짧아 빠르고, 원 서버는 같은 파일을 수만 번 보내지 않아도 돼요.'
      - p: 'CDN은 질문 3의 `public`과 `max-age`(또는 `s-maxage`)를 보고 무엇을 얼마나 저장할지 정해요. 이미지, JS, CSS 같은 정적 파일이 대표이고, 모두에게 같은 API 응답도 저장할 수 있어요.'
      - h3: 공유 캐시는 주소가 같으면 같은 응답을 줘요
      - p: '공유 캐시에서 가장 조심할 것이 이거예요. CDN은 **주소가 같으면 같은 응답**을 여러 사용자에게 줘요. 로그인한 사용자마다 다른 응답에 `public`을 붙이면, kim이 받아 간 `/me`를 CDN이 저장해 두었다가 lee에게도 내줘요. 사용자의 응답은 `private`이나 `no-store`로 둬요(실무 구역).'
      - p: '요청 헤더에 따라 응답이 달라지는 경우도 있어요. 압축을 받는 브라우저(`Accept-Encoding: gzip`)에는 압축한 응답, 아닌 곳에는 원본을 줘요. 이때 응답에 **`Vary: Accept-Encoding`**을 붙이면 CDN이 그 헤더 값마다 따로 저장해요. CORS 레슨에서 본 `Vary: Origin`도 출처마다 응답이 달라서 붙인 것이에요.'
      - h3: 잘못 저장했거나 바꿨을 때 비우기
      - ul:
          - '**무효화(purge):** CDN에 "이 주소의 저장분을 버려"라고 요청해요. 모든 지역에 퍼지는 데 시간이 걸리고, CDN에 따라 횟수에 비용이 들기도 해요.'
          - '**주소 바꾸기:** 질문 3의 해시 이름이나 `?v=42`처럼 새 주소를 쓰면, CDN에게는 처음 보는 주소라 원 서버에서 새로 받아요. 옛 주소의 저장분은 시간이 지나면 사라져요.'
      - p: '그래서 정적 파일은 주소를 바꾸는 방식을, 실수로 저장된 API 응답은 무효화를 써요.'
      - quiz:
          q: 'CDN 뒤에 있는 `/me`(로그인한 사용자의 정보)에 `Cache-Control: public, max-age=60`을 붙였어요. 무슨 일이 생길 수 있을까요?'
          options:
            - 아무 일도 없다. 쿠키가 다르니 CDN이 알아서 나눈다
            - CDN이 kim의 응답을 저장해 60초 동안 다른 사용자에게도 줄 수 있다
            - CDN이 /me를 저장하지 않는다
          answer: 2
          explain: 공유 캐시는 주소가 같으면 같은 응답을 줘요. 사용자의 응답은 private이나 no-store로 둬요.
    recall: CDN은 사용자 가까이에 둔 공유 캐시라 public으로 허락한 응답을 저장해 원 서버 대신 답해요. 주소가 같으면 같은 응답을 여러 사용자에게 주니 사용자의 응답은 private이나 no-store로 둬요. 요청 헤더에 따라 응답이 다르면 Vary로 나눠 저장하게 해요. 비울 때는 무효화를 요청하거나 주소에 버전이나 해시를 붙여 바꿔요.
practice:
  title: 스프링에서 캐시 헤더 주기
  says:
    - '스프링은 `ResponseEntity.ok().cacheControl(CacheControl.maxAge(...))`로 Cache-Control을, `.eTag(...)`로 ETag를 준다. 조건부 요청은 `WebRequest.checkNotModified(etag)`가 If-None-Match와 비교해 true면 304를 만든다. 테스트로 확인한다'
    - '`ShallowEtagHeaderFilter`는 응답을 다 만든 뒤 본문의 해시로 ETag를 붙이고 304를 만든다. 전송량은 줄지만 컨트롤러는 매번 실행된다. 컨트롤러가 불린 횟수로 테스트한다'
    - '흔한 실수: `/me`에 `CacheControl.maxAge(60).cachePublic()`을 붙인다. 고친 코드는 `CacheControl.noStore()`나 `cachePrivate()`다. 두 응답의 헤더를 테스트로 남긴다'
    - '더 알아보기: 스프링 부트의 정적 파일은 `spring.web.resources.cache.cachecontrol.max-age`와 `spring.web.resources.chain.strategy.content.enabled`(이름에 해시)로 정한다 (문서 근거)'
  body:
    - h3: ETag를 직접 만들어 확인하기
    - p: '질문 2의 실제 출력이 이 코드예요. 상품의 판 번호로 ETag를 만들고, `checkNotModified`가 요청의 `If-None-Match`와 비교해요.'
    - code: checkNotModified
      notes:
        - mark: checkNotModified
          as: code
          text: '같으면 true를 돌려주고 응답을 304로 만들어 둬요. 이때는 본문을 만들지 않고 끝내요.'
        - mark: eTag(etag)
          as: code
          text: 바뀐 응답에 새 판 번호를 붙여요.
    - p: '판 번호를 DB의 버전 칸이나 수정 시각에서 가져오면, 바뀌지 않았을 때 **본문을 만드는 일 자체를 건너뛰어요**. 수정 시각을 쓰려면 `checkNotModified(lastModifiedMillis)`예요.'
    - h3: ShallowEtagHeaderFilter는 전송량만 줄여요
    - p: '컨트롤러를 고치지 않고 ETag를 붙이는 필터도 있어요.'
    - code: shallow
    - p: '편하지만 하는 일이 달라요. 필터는 컨트롤러가 응답을 **다 만든 뒤** 본문의 해시로 ETag를 계산해요. 304를 주더라도 컨트롤러는 매번 실행돼요. 확인해 봤어요.'
    - ci:
        key: shallow
        label: 두 요청과 컨트롤러가 불린 횟수 보기
        source: HttpCacheTest.shallowEtagStillRunsController
        code: shallowRun
    - p: '둘째 요청은 304였지만 컨트롤러는 두 번 불렸어요. 이 필터는 **네트워크로 보내는 양**을 줄여 줄 뿐, DB 조회 같은 서버의 일은 줄이지 않아요. 서버의 일까지 줄이려면 위처럼 판 번호를 직접 만들어 확인해요.'
    - h3: '흔한 실수: 사용자의 응답을 public으로'
    - p: '"응답이 느리니 캐시를 켜자"며 내 정보 API에 이렇게 붙여요.'
    - code: mistake
      notes:
        - mark: cachePublic()
          as: code
          text: 공유 캐시(CDN)도 저장해도 된다는 뜻이에요.
    - p: '질문 4대로 CDN이 이 응답을 저장하면 다른 사용자에게 kim의 정보를 줄 수 있어요. 사용자의 정보는 저장하지 않게 해요.'
    - code: fixed
    - ci:
        key: private
        label: 두 코드의 응답 헤더 보기
        source: HttpCacheTest.privateResponses
        code: privateRun
    - p: '브라우저에는 남겨도 되고 공유 캐시만 막으면 된다면 `CacheControl.noCache().cachePrivate()`처럼 `private`을 써요.'
    - more:
        summary: '더 알아보기: 스프링 부트의 정적 파일'
        body:
          - p: '스프링 부트가 `static/` 폴더의 파일을 내보낼 때는 설정으로 캐시를 정해요. `content.enabled`를 켜면 파일 이름에 내용의 해시가 붙은 주소를 만들어 줘요(질문 3).'
          - code: bootStatic
          - muted: '근거: [스프링 부트 문서의 정적 파일](link:bootStatic).'
    - muted: '근거: [RFC 9111(HTTP 캐시)](link:rfc9111), [RFC 9110의 조건부 요청](link:rfc9110cond), [스프링 문서의 HTTP 캐시](link:springCaching). 헤더와 304는 테스트로 확인했어요.'
interview:
  question: HTTP 캐시가 어떻게 동작하는지, ETag와 no-cache, no-store를 함께 설명해 주세요
  model:
    - label: 정의
      text: HTTP 캐시는 브라우저나 CDN이 받은 응답을 저장해 같은 요청에 다시 쓰는 것입니다. 서버가 Cache-Control로 얼마나, 누가 저장해도 되는지 정합니다.
    - label: 원리
      text: max-age 동안은 신선해서 서버에 묻지 않고 씁니다. 지나면 ETag를 If-None-Match에 실어 조건부 요청을 보내고, 바뀌지 않았으면 서버가 304와 빈 본문으로 답해 본문 전송을 아낍니다. no-cache는 저장하되 쓸 때마다 확인하는 것이고, no-store는 아예 저장하지 않는 것입니다. private은 브라우저만, public은 CDN도 저장합니다.
    - label: 주의할 점
      text: 사용자마다 다른 응답에 public을 붙이면 CDN이 남의 응답을 내줄 수 있어 private이나 no-store를 씁니다. 정적 파일은 이름에 해시를 넣고 길게 캐시하며 HTML은 no-cache로 둡니다. ShallowEtagHeaderFilter는 전송량만 줄이고 서버의 일은 줄이지 않습니다.
    - label: 경험
      text: '(내 프로젝트로 채우기) 예: 배포 뒤 옛 JS가 도는 문제를 파일 이름에 해시를 넣고 HTML을 no-cache로 바꿔 해결했습니다.'
verified: 이 레슨의 헤더와 304 응답은 짐작이 아니라, 스프링 부트 3.5 서버에 자바 21 HttpClient(캐시가 없다)로 요청해 받은 값이에요. 브라우저와 CDN이 응답을 저장하고 꺼내 쓰는 동작은 RFC 9111을 근거로 적었어요. 코드가 바뀔 때마다 테스트([HttpCacheTest](link:test))가 다시 돌아요.
footer: '근거: HTTP 캐시와 Cache-Control, Vary는 RFC 9111, 조건부 요청과 ETag, 304는 RFC 9110 13장, immutable은 RFC 8246, 스프링의 캐시 헤더와 ShallowEtagHeaderFilter는 스프링 프레임워크 문서, 정적 파일 설정은 스프링 부트 문서. 응답은 톰캣 10.1(스프링 부트 3.5에 든 것)에서 테스트로 확인했어요. 오류는 [GitHub 이슈](https://github.com/wanja727/dev-lessons/issues)로 알려 주세요.'
claims:
  - claim: 'CacheControl.maxAge(60초)를 주면 응답에 Cache-Control: max-age=60이 붙는다'
    how: 'MiniWeb에 컨트롤러를 띄워 응답 헤더를 본다'
    test: HttpCacheTest.maxAge
  - claim: 'ETag가 같은 If-None-Match에는 304와 빈 본문, 상품이 바뀐 뒤에는 200과 새 ETag다'
    how: 'checkNotModified를 쓰는 컨트롤러에 세 번 요청한다'
    test: HttpCacheTest.etagRevalidation
  - claim: 'If-Modified-Since가 Last-Modified와 같으면 304, 그보다 앞이면 200이다'
    how: 'checkNotModified(long)으로 확인한다'
    test: HttpCacheTest.lastModified
  - claim: 'ShallowEtagHeaderFilter는 304를 주면서도 컨트롤러를 매번 실행한다'
    how: '컨트롤러가 불린 횟수를 센다'
    test: HttpCacheTest.shallowEtagStillRunsController
  - claim: '흔한 실수(public, max-age)와 고친 코드(no-store)의 Cache-Control 값'
    how: '두 주소의 응답 헤더를 본다'
    test: HttpCacheTest.privateResponses
sources:
  - 'HTTP 캐시, Cache-Control, 신선도, Vary: RFC 9111 https://www.rfc-editor.org/rfc/rfc9111.html'
  - '조건부 요청, ETag, 304: RFC 9110 13장 https://www.rfc-editor.org/rfc/rfc9110.html#section-13'
  - 'immutable: RFC 8246 https://www.rfc-editor.org/rfc/rfc8246.html'
  - '스프링의 HTTP 캐시: https://docs.spring.io/spring-framework/reference/web/webmvc/mvc-caching.html'
